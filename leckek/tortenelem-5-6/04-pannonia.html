<script>
/* ── MODUL: Térkép (TortMap) ──────────────────────────────────────────────────────────────
   Térképmotor a történelemleckékhez. Lecke-független: változtatás nélkül átemelhető a
   shared/tort/ alá (pl. shared/tort/map.js). Függ: TortProj (shared/tort/proj.js), a
   shared/tort/map-*.js adatfájlok, és a lecke-motor L objektuma a feliratokhoz (L.tx, L.measure,
   L.pill, L.fonts, L.U – így a QA és a review mód minden térképfeliratot lát).

   const map = TortMap.create({
     proj:    TortProj.lcc({lon0: 20, lat0: 38, lat1: 30, lat2: 46}),   // a lecke egyetlen vetülete
     layers:  [{data: TORT_MAP_VILAG},                                  // durvától a finomig; a finomabb réteg
               {data: TORT_MAP_MEDITERRAN},                             //   csak a saját kivágatában rajzol,
               {data: TORT_MAP_KARPAT, fade: [4500, 7500]}],             //   fade: [s0, s1] között úszik be (s = px/Föld-sugár)
     borders: TORT_MAP_HATAROK,   // opcionális: a „mai határok” réteg adata
     ancient: true,               // a modern: 1 elemek (víztározó, csatorna) kimaradnak
     rect:    [0, 0, 1360, 1080], // a feliratok elhelyezési területe (alap: a vizuális terület)
   });

   KAMERA
     TortMap.fit(proj, [lonMin, latMin, lonMax, latMax], [x, y, w, h], pad?) → nézet {lon, lat, s, x, y}
     TortMap.lerp(proj, a, b, u)    nézet a és b között (u 0..1): fix pont körüli zoom + pan, s logaritmikusan
                                    (nagy zoomnál is természetes: egy pont végig ugyanott marad a képernyőn)
     const cam = TortMap.camera(proj)
     cam.go(nézet, t, dur)          átmenet indítása a jelenlegi állásból (t: tetszőleges óra, pl. L.st)
     cam.at(t) → nézet              a t időpillanat nézete (inOut lassítással); visszafelé lépésnél rövid dur-t adj
     TortMap.zfade(V, s0, s1)       0..1: hol tart V.s az [s0, s1] között (log.) – rétegek ki-/beúsztatása zoomra

   KÉPKOCKÁNKÉNT (a sorrend: frame → base → region / line / saját rajz → labels)
     const V = map.frame(nézet)     beállítja a kamerát; V = TortProj.view (V.pt, V.inv, V.s)
     map.base(ctx, o)               tenger, szárazföld, hegységfoltok, folyók, tavak, partvonal.
                                    o = {rivers: {rank: 6 | [r0, r1, r2] (rétegenként), hi: {'Duna': {w: 5, wkm: .4, c}}
                                         (9 px fölött part + világos víz),
                                         only: ['Duna', …]}, mountains: 0..1 (alfa), lakes: true, style: {sea, land, …}}
     map.borders(ctx, a)            mai határok, halvány szaggatott vonal (a: alfa); mellé: TortMap.stamp(„mai határok”)
     map.region(ctx, items, o)      lágy szélű folt(ok) EGY rétegben (az átfedés nem sötétedik):
                                    items = [{blobs: [[lon, lat, km], …]} | {poly: [[lon, lat], …]}, a: 0..1]
                                    o = {color, alpha (alap .4), blur (px, alap 14), land: true (szárazföldre vágva,
                                         a tavak kivételével)}
     map.line(ctx, pts, o)          vonal / animált nyíl: pts = [[lon, lat], …];
                                    o = {p: 0..1 (haladás), color, w (px), wkm (szélesség km-ben, min. w), dash,
                                         head: true (nyílhegy), halo: true, smooth: true, cap} → {x, y, ang, len}
     map.labels(L, items, o)        ütközésmentes címkézés (prioritás szerint, mohón; a korábbi helyet megtartja):
                                    items = [{id, lon, lat | x, y, s, k, sub, sk, pri, r (jel sugara, 0: nincs),
                                              dot (alap pontot rajzol), size, w, f, i, c, subc, a, dirs, force}]
                                    dirs: ['E','W','N','S','NE','SE','NW','SW'] (alap) vagy ['C'] (területnév középen);
                                    ha a közeli helyek foglaltak, távolabb, szaggatott vezetővonallal próbálja.
                                    o = {avoid: [{x, y, w, h}], rect} → az elhelyezett dobozok [{id, x, y, w, h}]
     map.scale(L, x, y, o)          méretarány-vonalzó kerek km-értékkel; o = {k: felirat-kulcs („# km”), max: px}
   SEGÉDEK
     map.pt(lon, lat) → [x, y] (másolat) · map.ppk(lon, lat) → px / km ott · map.river(név) → [[lon, lat], …]
     TortMap.slice(line, a, b)      a vonal a- és b-hez ([lon, lat]) legközelebbi csúcsa közötti szakasza
     TortMap.nearest(line, p)       {i, p}: a p-hez legközelebbi csúcs
     TortMap.spline(pts, n, closed) Catmull–Rom simítás (n pont szakaszonként)
     TortMap.offset(lon, lat, kelet_m, észak_m) → [lon, lat] (helyi alaprajzokhoz méterben)
     TortMap.stamp(L, s, x, y, o)   bélyeg („vázlatos”, „mai határok”, „becslés”): −3°, Bricolage 22 px 600, keret;

/* ════════ 9. Összefoglalás ════════ */
function scene9(st, w) {
  if (w <= 0) return;
  GA = w;
  al(.78); c.fillStyle = '#f7f1e6'; c.fillRect(0, 0, 1380, 1080);
  al(clamp(st / .5)); T('összefoglaló cím', 60, 110, { f: F.D, s: 48, w: 560 });
  const A0 = YA('Róma alapítása'), A1 = YA('Nyugatrómai Birodalom bukása'), x0 = 110, x1 = 1270, yb = 560, X = (v) => lerp(x0, x1, (v - A0) / (A1 - A0));

  // évszázad-jelek
  for (let v = -700; v <= 400; v += 100) { const a = v <= 0 ? v + 1 : v, x = X(a); if (x > lerp(x0, x1, p0)) continue; c.beginPath(); c.moveTo(x, yb - 7); c.lineTo(x, yb + 7); c.lineWidth = 2; c.stroke(); }
  const ev = [['Róma alapítása', 'ö Róma', OCH, 'myth'], ['Pannónia meghódítása', 'ö Pannónia', RED], ['Aquincum központ', 'ö Aquincum', RED], ['legnagyobb kiterjedés', 'ö legnagyobb', RED], ['hunok megjelenése', 'ö hunok', HUN], ['birodalom kettéosztása', 'ö kettéosztás', EAST], ['catalaunumi csata', 'ö Catalaunum', HUN], ['Nyugatrómai Birodalom bukása', 'ö 476', RED]];
  const occ = [];
  ev.forEach(([yk, lk, col], i) => {
    const q = clamp((st - .8 - i * .28) / .4); if (q <= 0) return;
    const x = X(YA(yk)), s1 = lab(lk), s2 = L.val(yk === 'Róma alapítása' ? 'Róma alapítása' : yk);
    const w1 = Math.max(L.measure(s1, { s: 24, w: 700 }).w, L.measure(s2, { f: F.M, s: 22, w: 600 }).w);
    // szint keresése: felváltva fent és lent, ütközés nélkül
    let pos = null;
    for (let lv = 0; lv < 5 && !pos; lv++) for (const up of [true, false]) {

        const bx = alg === 'center' ? x - w1 / 2 : alg === 'right' ? x - w1 : x, by = up ? yb - 70 - lv * 72 - 50 : yb + 40 + lv * 72;

        pos = { b, alg, up, by }; break;
      }

    al(q); c.beginPath(); c.arc(x, yb, 9, 0, TAU); c.fillStyle = col; c.fill();
    c.strokeStyle = U.rgba(col, .6); c.lineWidth = 2; c.setLineDash([4, 4]); c.beginPath(); c.moveTo(x, yb + (pos.up ? -10 : 10)); c.lineTo(x, pos.up ? pos.by + 56 : pos.by - 4); c.stroke(); c.setLineDash([]);

}

/* ════════════════════════════════════════════════════════════════ */
const sT = new Array(9).fill(0);
const SCENES = [scene1, scene2, scene3, scene4, scene5, scene6, scene7, scene8, scene9];
let camStep = -1;
const slider = (S, k, min, max, fmtY) => L.slider({ label: lab(k), k, min, max, step: 1, value: max, format: (v) => fmtY(v), onInput: (v) => takeOver(S, v) });
L = Lesson.create({
  content: window.LESSON_CONTENT,
  home: false,
  steps: [
    { settle: 5.2 },
    { settle: 4.8,
      enter() { S2.focus = null; S2.from = [1, 1, 1]; S2.t0 = -9; },
      controls(L) {

    { settle: 8.8,

      controls(L) { S3.slider = slider(S3, 'csúszka év', Math.floor(YA('Róma alapítása')), YA('legnagyobb kiterjedés'), (v) => yearStr(v, true)); } },
    { settle: 6.2,
      enter() { S4.on = 0; S4.from = 0; S4.t0 = -9; },
      controls(L) { L.button(lab('gomb mai határok'), () => { S4.from = lerp(S4.from, S4.on, smooth((L.st - S4.t0) / .5)); S4.on = S4.on ? 0 : 1; S4.t0 = L.st; }, 'gomb mai határok'); } },
    { settle: 7.2,
      enter() { S5.user = false; S5.m = .5; S5.from = .5; S5.t0 = -9; },
      controls(L) {
        L.slider({ label: lab('csúszka akkor ma'), k: 'csúszka akkor ma', min: 0, max: 100, step: 1, value: 50,
          format: (v) => v < 15 ? lab('akkor') : v > 85 ? lab('most') : lab('akkor') + ' + ' + lab('most'),
          onInput: (v) => { S5.from = S5.cur == null ? .5 : S5.cur; S5.m = v / 100; S5.t0 = L.st; S5.user = true; } });
      } },
    { settle: 3,

      leave() { L.canvas.style.cursor = 'default'; S6.drag = null; },

        L.button(lab('gomb újra'), () => { S6.placed = {}; S6.ret = {}; S6.drag = null; S6.swap = 0; S6.swapFrom = 0; }, 'gomb újra');
        L.button(lab('gomb névcsere'), () => { S6.swapFrom = lerp(S6.swapFrom, S6.swap, smooth((L.st - S6.swapT) / .35)); S6.swap = S6.swap ? 0 : 1; S6.swapT = L.st; }, 'gomb névcsere');
      } },
    { settle: 9.6,
      enter() { S7.user = null; S7.shown = null; },
      controls(L) { S7.slider = slider(S7, 'csúszka hun év', 370, 453, (v) => String(v)); } },
    { settle: 7.4,
      enter() { S8.user = null; S8.shown = null; },
      controls(L) { S8.slider = slider(S8, 'csúszka 476', 390, YA('Nyugatrómai Birodalom bukása'), (v) => String(v)); } },
    { settle: 6 },
  ],
  init(Lx) {
    L = Lx; c = L.ctx;
    MAP = TortMap.create({ proj: PROJ, ancient: true, borders: window.TORT_MAP_HATAROK,
      layers: [{ data: window.TORT_MAP_VILAG }, { data: window.TORT_MAP_MEDITERRAN }, { data: window.TORT_MAP_KARPAT, fade: [4500, 7500] }] });
    const fit = (b, r) => TortMap.fit(PROJ, b, r);
    const hills = fit([12.462, 41.873, 12.506, 41.906], [30, 130, 850, 860]);
    const med = fit([-10, 24.5, 47, 56], [10, 10, 1340, 880]);
    VIEWS = [hills, hills, med, fit([14.0, 44.3, 25.0, 48.9], [20, 20, 1320, 1040]), fit([19.0, 47.524, 19.1, 47.590], [20, 20, 1320, 960]),
      fit([15.6, 45.75, 19.75, 48.3], [20, 110, 1040, 900]), fit([-4, 37.5, 49, 56], [10, 20, 1340, 830]), med, med];
    CAM = TortMap.camera(PROJ);
    // Pannónia: a Duna a Bécsi-erdőtől Taurunumig, aztán a határpontok (vázlatos, sima görbe)
    const dn = MAP.river('Duna');
    DANUBE = TortMap.slice(dn, LL('Pannónia határa – Bécsi-erdő'), LL('Taurunum helye'));
    const hand = TortMap.spline([DANUBE[DANUBE.length - 1], LL('Pannónia határa – Szerémség'), LL('Pannónia határa – Száva vidéke'), LL('Pannónia határa – Emona'), LL('Pannónia határa – Keleti-Alpok'), LL('Pannónia határa – Lajta-hegység'), DANUBE[0]], 10, false);
    PANNONIA = DANUBE.concat(hand.slice(1, -1));
    // limes: a Duna Vindobonától Taurunumig; tornyok kb. egyenletesen, az erődök a vonal mentén rendezve
    const lim = TortMap.slice(dn, LL('Vindobona helye'), LL('Taurunum helye')), cum = [0];

    const tot = cum[cum.length - 1];
    LIMES = { forts: FORTS.map((f) => ({ f: cum[TortMap.nearest(lim, LL(f.n + ' helye')).i] / tot })), towers: [] };
    for (let d = 9; d < tot; d += 18) {
      const i = cum.findIndex((v) => v >= d), u = (d - cum[i - 1]) / (cum[i] - cum[i - 1]);

      if (FORTS.some((f) => TortProj.dist(p[0], p[1], ...LL(f.n + ' helye')) < 10)) continue;

  draw(Lx) {

});
