<script>
/* ── MODUL: Térkép (TortMap) ──────────────────────────────────────────────────────────────
   Térképmotor a történelemleckékhez. Lecke-független: változtatás nélkül átemelhető a
   shared/tort/ alá (pl. shared/tort/map.js). Függ: TortProj (shared/tort/proj.js), a
   shared/tort/map-*.js adatfájlok, és a lecke-motor L objektuma a feliratokhoz (L.tx, L.measure,
   L.pill, L.fonts, L.U – így a QA és a review mód minden térképfeliratot lát).

   const map = TortMap.create({
     proj:    TortProj.lcc({lon0: 20, lat0: 38, lat1: 30, lat2: 46}),   // a lecke egyetlen vetülete
     layers:  [{data: TORT_MAP_VILAG},                                  // durvától a finomig; a finomabb réteg
               {data: TORT_MAP_MEDITERRAN},                             //   csak a saját kivágatában rajzol,
               {data: TORT_MAP_KARPAT, fade: [4500, 7500]}],             //   fade: [s0, s1] között úszik be (s = px/Föld-sugár)
     borders: TORT_MAP_HATAROK,   // opcionális: a „mai határok” réteg adata
     ancient: true,               // a modern: 1 elemek (víztározó, csatorna) kimaradnak
     rect:    [0, 0, 1360, 1080], // a feliratok elhelyezési területe (alap: a vizuális terület)
   });

   KAMERA
     TortMap.fit(proj, [lonMin, latMin, lonMax, latMax], [x, y, w, h], pad?) → nézet {lon, lat, s, x, y}
     TortMap.lerp(proj, a, b, u)    nézet a és b között (u 0..1): fix pont körüli zoom + pan, s logaritmikusan
                                    (nagy zoomnál is természetes: egy pont végig ugyanott marad a képernyőn)
     const cam = TortMap.camera(proj)
     cam.go(nézet, t, dur)          átmenet indítása a jelenlegi állásból (t: tetszőleges óra, pl. L.st)
     cam.at(t) → nézet              a t időpillanat nézete (inOut lassítással); visszafelé lépésnél rövid dur-t adj
     TortMap.zfade(V, s0, s1)       0..1: hol tart V.s az [s0, s1] között (log.) – rétegek ki-/beúsztatása zoomra

   KÉPKOCKÁNKÉNT (a sorrend: frame → base → region / line / saját rajz → labels)
     const V = map.frame(nézet)     beállítja a kamerát; V = TortProj.view (V.pt, V.inv, V.s)
     map.base(ctx, o)               tenger, szárazföld, hegységfoltok, folyók, tavak, partvonal.
                                    o = {rivers: {rank: 6 | [r0, r1, r2] (rétegenként), hi: {'Duna': {w: 5, wkm: .4, c}}
                                         (9 px fölött part + világos víz),
                                         only: ['Duna', …]}, mountains: 0..1 (alfa), lakes: true, style: {sea, land, …}}
     map.borders(ctx, a)            mai határok, halvány szaggatott vonal (a: alfa); mellé: TortMap.stamp(„mai határok”)
     map.region(ctx, items, o)      lágy szélű folt(ok) EGY rétegben (az átfedés nem sötétedik):
                                    items = [{blobs: [[lon, lat, km], …]} | {poly: [[lon, lat], …]}, a: 0..1]
                                    o = {color, alpha (alap .4), blur (px, alap 14), land: true (szárazföldre vágva,
                                         a tavak kivételével)}
     map.line(ctx, pts, o)          vonal / animált nyíl: pts = [[lon, lat], …];
                                    o = {p: 0..1 (haladás), color, w (px), wkm (szélesség km-ben, min. w), dash,
                                         head: true (nyílhegy), halo: true, smooth: true, cap} → {x, y, ang, len}
     map.labels(L, items, o)        ütközésmentes címkézés (prioritás szerint, mohón; a korábbi helyet megtartja):
                                    items = [{id, lon, lat | x, y, s, k, sub, sk, pri, r (jel sugara, 0: nincs),
                                              dot (alap pontot rajzol), size, w, f, i, c, subc, a, dirs, force}]
                                    dirs: ['E','W','N','S','NE','SE','NW','SW'] (alap) vagy ['C'] (területnév középen);
                                    ha a közeli helyek foglaltak, távolabb, szaggatott vezetővonallal próbálja.
                                    o = {avoid: [{x, y, w, h}], rect} → az elhelyezett dobozok [{id, x, y, w, h}]
     map.scale(L, x, y, o)          méretarány-vonalzó kerek km-értékkel; o = {k: felirat-kulcs („# km”), max: px}
   SEGÉDEK
     map.pt(lon, lat) → [x, y] (másolat) · map.ppk(lon, lat) → px / km ott · map.river(név) → [[lon, lat], …]
     TortMap.slice(line, a, b)      a vonal a- és b-hez ([lon, lat]) legközelebbi csúcsa közötti szakasza

  items.push({ id: 'gf', lon: GF[0], lat: GF[1], s: lab('Gyulafehérvár'), k: 'Gyulafehérvár', dot: true, size: 24, pri: 6, dirs: ['S', 'SE', 'SW'] });
  items.push({ id: 'mo', lon: MO[0], lat: MO[1], s: lab('Mohács'), k: 'Mohács', sub: String(YR('mohácsi csata')), sk: 'mohácsi csata', dot: true, size: 22, pri: 5, dirs: ['E', 'SE', 'NE'] });
  // cím + év
  const head = textCard(30, 30, [{ k: 'három rész cím', size: 32, w: 600, f: F.D }, { s: String(Math.floor(y)), k: null, size: 40, w: 700, mono: true, c: RED }], { a: pr(0), minW: 300 });
  // kiválasztott vár
  let info = null;
  if (S7.sel) {
    const cs = CASTLES7.find((q) => q[0] === S7.sel), s = castleState(cs, y), pa = out(clamp((st - S7.selT) / .35));
    const lines = [{ k: s.name, size: 30, w: 600, f: F.D, c: RED },
      { s: lab(s.held ? 'ostrom' : 'elesett') + ': ' + (s.dk === 'Buda eleste' ? L.val(s.dk) : YR(s.dk)) + (s.held ? ' – ' + lab('kitartott') : ''), k: [s.held ? 'ostrom' : 'elesett', s.dk].concat(s.held ? ['kitartott'] : []), size: 24, w: 700, mono: false }];
    if (cs[2]) lines.push({ k: cs[2], size: 24 });
    info = textCard(30, 900 - 34 * lines.length, lines, { a: pa * pr(.5), bd: s.col });
  } else if (active) {
    al(pr(1.2)); info = L.pill(lab('kattints'), 40, 1000, { k: 'kattints', s: 24, w: 700, bg: CARD, bd: RED, bw: 2, c: RED, pad: 12, r: 10 });
  }
  al(1);
  MAP.labels(L, items, { avoid: [head, info, { x: 1080, y: 990, w: 280, h: 80 }, { x: 640, y: 1000, w: 300, h: 70 }].filter(Boolean) });
  al(1); stampK('vázlatos', 1150, 1035);
  stampS(tpl('körül', Math.floor(y)), ['körül'], 1150, 990);
  if (hb > .01) stampK('mai határok', 960, 1035, hb);
  al(1); MAP.scale(L, 680, 1040, { k: 'lépték', max: 200 });
}
function click7(p) {
  if (!S7.hits) return;
  let best = null, bd = 30;
  for (const h of S7.hits) { const d = Math.hypot(p.x - h.x, p.y - h.y); if (d < bd) { bd = d; best = h.name; } }
  if (best) { S7.sel = best; S7.selT = L.st; }
}

/* ── 8. Honnan tudjuk? Brodarics ── */
function scene8(st, w) {
  GA = w;
  const R = blend(S8, st), p = (d) => out(clamp((st - d) / .6)), fz = (x) => lerp(.22, 1, x);
  SRC.card({ x: 40, y: 44, w: 690, a: p(.1) * fz(R.a), layer: 'forrás', icon: 'írott', type: K('B típus'), title: K('B cím'),
    rows: [{ l: K('B ki'), v: K('B ki v') }, { l: K('B ott'), v: K('B ott v') }, { l: K('B mikor'), v: { s: String(YR('Brodarics műve')), k: 'Brodarics műve' } },
      { l: K('B hol'), v: K('B hol v') }, { l: K('B nem látta'), v: K('B nem látta v'), c: RED }],
    line: { T: TT, ev: { a0: YR('mohácsi csata'), a1: YR('mohácsi csata'), name: K('esemény csata'), layer: 'rekonstrukció', dateK: 'mohácsi csata' },
      wr: { a: dat('Brodarics műve').a, name: K('B mű'), dateK: 'Brodarics műve' }, gap: K('később év') } });
  // mi honnan való? – a három réteg
  const cols = [['forrás', [{ s: tpl('f 1', YR('Brodarics műve')), k: ['f 1', 'Brodarics műve'] }, K('f 2'), { s: tpl('f 3', YR('tömegsírok feltárása')), k: ['f 3', 'tömegsírok feltárása'] }], R.a],
    ['rekonstrukció', [K('rk 1'), K('rk 2')], R.b], ['monda', [K('m 1'), K('m 2')], R.c]];
  let y = 50; const x = 770, wd = 560, TF = { f: F.B, s: 24, w: 600 };
  cols.forEach(([layer, its, f], i) => {
    const a = p(.8 + i * .4) * fz(f);
    const lines = its.map((it) => SRC.wrap(it.s, wd - 80, TF));
    const h = 34 + lines.reduce((s, l) => s + l.length * 31 + 14, 0) + 6;
    al(a); SRC.frame(x, y, wd, h, layer);
    let yy = y + 50;
    its.forEach((it, j) => {
      al(a); c.beginPath(); c.arc(x + 30, yy - 8, 6, 0, TAU); c.fillStyle = SRC.COL[layer]; c.fill();
      lines[j].forEach((ln, m) => L.tx(ln, x + 48, yy + m * 31, Object.assign({}, TF, { k: it.k, c: INK })));
      yy += lines[j].length * 31 + 14;
    });
    y += h + 30;
  });
}
function sel8(r) { retarget(S8, r === 'a' ? { a: 1, b: 0, c: 0 } : r === 'b' ? { a: 0, b: 1, c: 0 } : r === 'c' ? { a: 0, b: 0, c: 1 } : { a: 1, b: 1, c: 1 }); }

/* ── 9. Összefoglalás ── */
function cards9(list) {   // [[item, kártya bal széle, sor], …] – a TortTimeline kártyarajzolójával
  for (const [q, x, row] of list) {
    const A = q.a == null ? 1 : q.a; if (A <= .01) continue;
    const z = TL9.cardSize(q), yb = TL9.rowBottom(row, 124), y = yb - z.h, xe = TL9.x(q.u), lx = clamp(xe, x + 14, x + z.w - 14);
    al(A); c.strokeStyle = U.rgba(INK, .55); c.lineWidth = 2; c.beginPath(); c.moveTo(lx, yb); c.lineTo(xe, TL9.top - 2); c.stroke();
    TL9.card(q, x, y);
    c.beginPath(); c.arc(xe, TL9.top, 6.5, 0, TAU); c.fillStyle = INK; c.fill(); c.strokeStyle = CARD; c.lineWidth = 2.5; c.stroke();
  }
}
function scene9(st, w) {
  GA = w;
  const p = (d) => out(clamp((st - d) / .6));
  const tw = L.measure(lab('ö cím'), { f: F.D, s: 44, w: 560 }).w;
  softCard(30, 30, tw + 50, 84, p(0)); al(p(0)); T('ö cím', 55, 88, { f: F.D, s: 44, w: 560 });
  al(1);
  TL9.view(1518, 1572);
  TL9.draw({ a: p(.2), cent: 1 });
  /* a kártyák kézzel elrendezve (három esemény húsz éven belül): a vezetővonalak ne keresztezzenek kártyát */
  const it = {
    nf: { u: UA('Nándorfehérvár eleste'), title: K('ö 1521'), date: { s: L.val('Nándorfehérvár eleste'), k: 'Nándorfehérvár eleste' }, a: p(.5) },
    mo: { u: UA('mohácsi csata'), title: K('ö 1526'), date: { s: L.val('mohácsi csata'), k: 'mohácsi csata' }, note: K('ö két király'), hi: true, a: p(.9) },
    bu: { u: UA('Buda eleste'), title: K('ö 1541'), date: { s: L.val('Buda eleste'), k: 'Buda eleste' }, hi: true, a: p(1.5) },
    sp: { u: UA('speyeri egyezmény'), title: K('ö 1570'), date: { s: L.val('speyeri egyezmény'), k: 'speyeri egyezmény' }, a: p(2.0) },
  };
  const xe = (q) => TL9.x(q.u), zs = (q) => TL9.cardSize(q);
  const nfX = TL9.x0, moX = Math.max(xe(it.nf) + 24, xe(it.mo) - 90);
  const buX = Math.max(moX + zs(it.mo).w + 26, xe(it.bu) - 60), spX = Math.min(TL9.x1 - zs(it.sp).w, xe(it.sp) - zs(it.sp).w / 2);
  cards9([[it.nf, nfX, 1], [it.mo, moX, 0], [it.bu, buX, 0], [it.sp, spX, 0]]);
  const pg = p(2.6);
  if (pg > 0) {
    const xa = TL9.x(UA('mohácsi csata')), xb = TL9.x(UA('Buda eleste')), yb = 840, n = YR('Buda eleste') - YR('mohácsi csata');
    al(pg); c.strokeStyle = RED; c.lineWidth = 3; c.beginPath(); c.moveTo(xa, yb - 14); c.lineTo(xa, yb); c.lineTo(xb, yb); c.lineTo(xb, yb - 14); c.stroke();
    L.tx(tpl('napra pontosan', n), (xa + xb) / 2, yb + 38, { k: ['napra pontosan', 'mohácsi csata', 'Buda eleste'], s: 30, w: 700, a: 'center', c: RED });
  }
}

/* ════════════════════════════════════════════════════════════════ */
const STEPS = [
  { settle: 5.6,
    enter() { S1.on = 0; S1.from = 0; S1.t0 = -9; },
    controls(L) { bordersBtn(S1)(L); } },
  { settle: 5.2 },
  { settle: 7.8,
    enter() { P3.reset(); },
    controls(L) { SL3 = L.slider({ label: lab('csúszka csata'), k: 'csúszka csata', min: 0, max: 100, step: 1, value: 0,
      format: (v) => lab(PH3.filter((p) => v / 100 >= p[1] - .001).pop()[0]), onInput: (v) => P3.take(v / 100, L.st) }); } },
  { settle: 5.4 },
  { settle: 3.2,
    enter() { S5.from = { sz: 1, f: 1 }; S5.to = { sz: 1, f: 1 }; S5.t0 = -9; },
    controls(L) {
      S5.btn = {};
      S5.btn.sz = L.button(lab('gomb Szapolyai'), () => sel5('sz'), 'gomb Szapolyai');
      S5.btn.f = L.button(lab('gomb Ferdinánd'), () => sel5('f'), 'gomb Ferdinánd');
      S5.btn.m = L.button(lab('gomb mindkettő'), () => sel5('m'), 'gomb mindkettő');
    } },
  { settle: 7.6,
    enter() { P6.reset(); },
    controls(L) { SL6 = L.slider({ label: lab('csúszka év'), k: 'csúszka év', min: 1526, max: 1541, step: 1, value: 1526, format: (v) => String(v), onInput: (v) => P6.take(v + .99, L.st) }); } },
  { settle: 7.4,
    enter() { P7.reset(); S7.on = 0; S7.from = 0; S7.t0 = -9; S7.sel = null; },
    leave() { L.stage.style.cursor = ''; },
    controls(L) {
      SL7 = L.slider({ label: lab('csúszka év'), k: 'csúszka év', min: 1541, max: 1570, step: 1, value: 1541, format: (v) => String(v), onInput: (v) => P7.take(v + .99, L.st) });
      bordersBtn(S7)(L);
    } },
  { settle: 3.4,
    enter() { S8.from = { a: 1, b: 1, c: 1 }; S8.to = { a: 1, b: 1, c: 1 }; S8.t0 = -9; },
    controls(L) {
      L.button(lab('gomb forrás'), () => sel8('a'), 'gomb forrás'); L.button(lab('gomb rekonstrukció'), () => sel8('b'), 'gomb rekonstrukció');
      L.button(lab('gomb monda'), () => sel8('c'), 'gomb monda'); L.button(lab('gomb mind'), () => sel8(null), 'gomb mind');

  { settle: 3.6 },
];

L = Lesson.create({
  content: window.LESSON_CONTENT,
  home: false,
  steps: STEPS,
  init(Lx) {
    L = Lx; c = L.ctx;
    MAP = TortMap.create({ proj: PROJ, ancient: true, borders: window.TORT_MAP_HATAROK,
      layers: [{ data: window.TORT_MAP_MEDITERRAN }, { data: window.TORT_MAP_KARPAT, fade: [4500, 7500] }] });
    BT = TortBattle.create(L);
    SRC = TortSource.create(L, { 'forrás': K('forrás jel'), 'rekonstrukció': K('rekonstrukció jel'), 'monda': K('monda jel'), 'becslés': K('becslés'), 'vázlatos': K('vázlatos'), 'illusztráció': K('illusztráció'), 'mai határok': K('mai határok') });
    TT = { bc: K('Kr. e.'), ad: K('Kr. u.'), cent: K('század'), years: K('év sablon') };
    TL5 = TortTimeline.create(L, { x0: 80, x1: 1290, y: 466, h: 40, T: TT });
    TL6 = TortTimeline.create(L, { x0: 80, x1: 1290, y: 738, h: 40, T: TT });
    TL9 = TortTimeline.create(L, { x0: 70, x1: 1290, y: 700, h: 56, T: TT, src: SRC, bounds: [1400, 1700] });
    DYN = TortDynasty.create(L, { people: people(), rect: DYN_R, rowH: 56,
      kinds: { jag: { col: JAG, name: K('jel Jagelló') }, habs: { col: SA, name: K('jel Habsburg') }, szap: { col: OLV, name: K('jel Szapolyai') } } });
    PH3 = [['fázis 1', 0], ['fázis 2', .3], ['fázis 3', .55], ['fázis 4', .8]];
    G = geom();
    const fit = (b, r) => TortMap.fit(PROJ, b, r);
    VIEWS = [fit([15.0, 39.4, 30.5, 48.4], [30, 30, 1300, 1020]), fit([16.6, 44.3, 24.0, 47.9], [30, 30, 870, 1000]),
      fit([18.53, 45.86, 18.82, 46.015], [30, 140, 1300, 760]), fit([18.56, 45.905, 18.80, 46.085], [380, 30, 950, 1000])];
    VIEW7 = fit([15.6, 44.4, 26.2, 49.3], [20, 20, 1320, 1040]);
    CAM = TortMap.camera(PROJ);
    P3 = TB.player([[0.6, 0], [2.2, .3], [3.6, .55], [5.2, .8], [6.8, 1]]);
    P6 = TB.player([[0.6, 1526.55], [6.6, 1541.99]]);
    P7 = TB.player([[0.8, 1541.99], [6.4, 1570.99]]);
    L.players = { P3, P6, P7 }; L.qa7 = S7;   // QA-hoz
    L.stage.addEventListener('pointerdown', (e) => { if (L.step === 6) click7(L.toStage(e)); });
  },
  draw(Lx) {
    L = Lx; c = L.ctx; GA = 1; paper(); grid(.045);
    const sp = L.sp, wt = (i) => clamp(1 - Math.abs(sp - i) * 2);
    sT[L.step] = L.st;

    if (L.step === 6 && L.pointer.inside && S7.hits) L.stage.style.cursor = S7.hits.some((h) => Math.hypot(L.pointer.x - h.x, L.pointer.y - h.y) < 30) ? 'pointer' : '';
    c.globalAlpha = 1;
  },
});
})();
