<script>
'use strict';
/* ── MODUL: Térkép (TortMap) ──────────────────────────────────────────────────────────────
   Térképmotor a történelemleckékhez. Lecke-független: változtatás nélkül átemelhető a
   shared/tort/ alá (pl. shared/tort/map.js). Függ: TortProj (shared/tort/proj.js), a
   shared/tort/map-*.js adatfájlok, és a lecke-motor L objektuma a feliratokhoz (L.tx, L.measure,
   L.pill, L.fonts, L.U – így a QA és a review mód minden térképfeliratot lát).

   const map = TortMap.create({
     proj:    TortProj.lcc({lon0: 20, lat0: 38, lat1: 30, lat2: 46}),   // a lecke egyetlen vetülete
     layers:  [{data: TORT_MAP_VILAG},                                  // durvától a finomig; a finomabb réteg
               {data: TORT_MAP_MEDITERRAN},                             //   csak a saját kivágatában rajzol,
               {data: TORT_MAP_KARPAT, fade: [4500, 7500]}],             //   fade: [s0, s1] között úszik be (s = px/Föld-sugár)
     borders: TORT_MAP_HATAROK,   // opcionális: a „mai határok” réteg adata
     ancient: true,               // a modern: 1 elemek (víztározó, csatorna) kimaradnak
     rect:    [0, 0, 1360, 1080], // a feliratok elhelyezési területe (alap: a vizuális terület)
   });

   KAMERA
     TortMap.fit(proj, [lonMin, latMin, lonMax, latMax], [x, y, w, h], pad?) → nézet {lon, lat, s, x, y}
     TortMap.lerp(proj, a, b, u)    nézet a és b között (u 0..1): fix pont körüli zoom + pan, s logaritmikusan
                                    (nagy zoomnál is természetes: egy pont végig ugyanott marad a képernyőn)
     const cam = TortMap.camera(proj)
     cam.go(nézet, t, dur)          átmenet indítása a jelenlegi állásból (t: tetszőleges óra, pl. L.st)
     cam.at(t) → nézet              a t időpillanat nézete (inOut lassítással); visszafelé lépésnél rövid dur-t adj
     TortMap.zfade(V, s0, s1)       0..1: hol tart V.s az [s0, s1] között (log.) – rétegek ki-/beúsztatása zoomra

   KÉPKOCKÁNKÉNT (a sorrend: frame → base → region / line / saját rajz → labels)
     const V = map.frame(nézet)     beállítja a kamerát; V = TortProj.view (V.pt, V.inv, V.s)
     map.base(ctx, o)               tenger, szárazföld, hegységfoltok, folyók, tavak, partvonal.
                                    o = {rivers: {rank: 6 | [r0, r1, r2] (rétegenként), hi: {'Duna': {w: 5, wkm: .4, c}}
                                         (9 px fölött part + világos víz),
                                         only: ['Duna', …]}, mountains: 0..1 (alfa), lakes: true, style: {sea, land, …}}
     map.borders(ctx, a)            mai határok, halvány szaggatott vonal (a: alfa); mellé: TortMap.stamp(„mai határok”)
     map.region(ctx, items, o)      lágy szélű folt(ok) EGY rétegben (az átfedés nem sötétedik):
                                    items = [{blobs: [[lon, lat, km], …]} | {poly: [[lon, lat], …]}, a: 0..1]
                                    o = {color, alpha (alap .4), blur (px, alap 14), land: true (szárazföldre vágva,
                                         a tavak kivételével)}
     map.line(ctx, pts, o)          vonal / animált nyíl: pts = [[lon, lat], …];
                                    o = {p: 0..1 (haladás), color, w (px), wkm (szélesség km-ben, min. w), dash,
                                         head: true (nyílhegy), halo: true, smooth: true, cap} → {x, y, ang, len}
     map.labels(L, items, o)        ütközésmentes címkézés (prioritás szerint, mohón; a korábbi helyet megtartja):
                                    items = [{id, lon, lat | x, y, s, k, sub, sk, pri, r (jel sugara, 0: nincs),
                                              dot (alap pontot rajzol), size, w, f, i, c, subc, a, dirs, force}]
                                    dirs: ['E','W','N','S','NE','SE','NW','SW'] (alap) vagy ['C'] (területnév középen);
                                    ha a közeli helyek foglaltak, távolabb, szaggatott vezetővonallal próbálja.
                                    o = {avoid: [{x, y, w, h}], rect} → az elhelyezett dobozok [{id, x, y, w, h}]
     map.scale(L, x, y, o)          méretarány-vonalzó kerek km-értékkel; o = {k: felirat-kulcs („# km”), max: px}
   SEGÉDEK
     map.pt(lon, lat) → [x, y] (másolat) · map.ppk(lon, lat) → px / km ott · map.river(név) → [[lon, lat], …]
     TortMap.slice(line, a, b)      a vonal a- és b-hez ([lon, lat]) legközelebbi csúcsa közötti szakasza
     TortMap.nearest(line, p)       {i, p}: a p-hez legközelebbi csúcs
     TortMap.spline(pts, n, closed) Catmull–Rom simítás (n pont szakaszonként)
     TortMap.offset(lon, lat, kelet_m, észak_m) → [lon, lat] (helyi alaprajzokhoz méterben)
     TortMap.stamp(L, s, x, y, o)   bélyeg („vázlatos”, „mai határok”, „becslés”): −3°, Bricolage 22 px 600, keret;
                                    o = {k, est: true → okker, a: 'left' | 'center' | 'right'} → doboz
   Rétegek keverése: a durva réteg a finomabb kivágatán kívül teljes erővel, belül (1 − alfa)-val rajzol.
   Teljesítmény: a kivágaton kívüli gyűrűk kimaradnak; a foltok negyed felbontású pufferben mosódnak el.
   ───────────────────────────────────────────────────────────────────────────────────────── */
const TortMap = (() => {
  'use strict';
  const TP = window.TortProj;
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const smooth = (t) => { t = clamp(t); return t * t * (3 - 2 * t); };
  const inOut = (t) => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
  const DEF = { sea: 'rgba(70,150,215,.22)', land: '#f5eddd', coast: '#1b5a94', coastW: 1.5, river: '#1b5a94',
    lake: '#c6dbe8', lakeLine: '#1b5a94', mtn: '#7a623e', border: '#1c2440', ink: '#1c2440', muted: '#565d72',
    halo: 'rgba(250,246,238,.94)', card: '#fffaf1', est: '#8f5a0c' };
  const R_KM = 6371;

/* ── MODUL: Kártyák (TortCards) ────────────────────────────────────────────────────

        if (z.sub) L.tx(z.sub.s, z.x + 22, z.y + 88, { f: F.B, s: 22, w: 500, c: MUT, k: z.sub.k });

function shelf(x, y, w, n, nSolid, cols, shown, seed, a) {

  for (let i = 0; i < n; i++) {
    const h = 118 + r() * 58, bx = x + 8 + i * bw, f = clamp(shown - i);
    if (f <= 0) continue;
    al(a * f);
    rr(bx + 1, y - h, bw - 2, h, 3);
    if (i < nSolid) { c.fillStyle = cols[i % cols.length]; c.fill(); c.strokeStyle = 'rgba(28,36,64,.55)'; c.lineWidth = 1.2; c.stroke(); c.fillStyle = 'rgba(255,240,200,.5)'; c.fillRect(bx + 3, y - h + 14, bw - 6, 3); c.fillRect(bx + 3, y - 22, bw - 6, 3); }

}

  bands.push({ u0: YA('milánói rendelet'), u1: YA('Theodosius rendelete'), col: 'rgba(29,122,69,.22)' }, { u0: YA('Theodosius rendelete'), u1: 401, col: 'rgba(123,63,140,.38)' });
  TL7.draw({ bands, origin: false });
  // üldözések felirata (alsó sor): jobbról balra, hogy ne fedjék egymást és a 313-as vonalat
  let lim = TL7.x(YA('milánói rendelet')) - 10;
  for (let i = PERS.length - 1; i >= 0; i--) {
    const [k0, k1, lk2] = PERS[i], s = lab(lk2), wv = L.measure(s, { s: 22, w: 700 }).w;
    const xr = Math.min(TL7.x((YA(k0) + YA(k1) + 1) / 2) + wv / 2, lim), xl = Math.max(xr - wv, 50);
    al(1); L.tx(s, xl, TL7.top - 12, { s: 22, w: 700, c: BAD, k: [lk2, k0, k1] }); lim = xl - 18;
  }
  // 313 és 380 (felső sor): a 313 a vonaltól balra, a 380 jobbra (a kártya szélénél megállítva)
  [['milánói rendelet', 'esemény Milánó', GOOD, 'L'], ['Theodosius rendelete', 'esemény Theodosius', FAITH, 'R']].forEach(([dk, lk2, col, side]) => {
    const x = TL7.x(YA(dk)); al(1); c.strokeStyle = col; c.lineWidth = 3; c.beginPath(); c.moveTo(x, TL7.top - 40); c.lineTo(x, TL7.bot); c.stroke();
    const s = L.val(dk) + ' ' + lab(lk2), wv = L.measure(s, { s: 22, w: 700 }).w;
    L.tx(s, side === 'L' ? x - 8 - wv : Math.min(x + 8, 1310 - wv), TL7.top - 48, { s: 22, w: 700, c: col, k: [dk, lk2] });
  });
  // a csúszka helye
  const xc = TL7.x(clamp(y, 30, 400.5));
  al(1); c.fillStyle = RED; c.beginPath(); c.moveTo(xc - 10, TL7.bot + 12); c.lineTo(xc + 10, TL7.bot + 12); c.lineTo(xc, TL7.bot); c.closePath(); c.fill();
  c.strokeStyle = RED; c.lineWidth = 3; c.beginPath(); c.moveTo(xc, TL7.top); c.lineTo(xc, TL7.bot); c.stroke();
}

/* ════════ 8. Jelképek (kártyák a helyükre) ════════ */
const SYM = ['hal', 'kereszt', 'khírhó', 'alfaómega', 'kehely', 'víz'];
const CARD_ORDER = ['kehely', 'hal', 'víz', 'khírhó', 'kereszt', 'alfaómega'];   // a tálcán keverve
function symDecor(z, a) {
  const cx = z.x + z.w - 74, cy = z.y + 62;
  c.globalAlpha = a; c.strokeStyle = INK; c.lineWidth = 5; c.lineCap = 'round'; c.lineJoin = 'round';
  c.beginPath(); c.arc(cx, cy, 50, 0, TAU); c.fillStyle = 'rgba(200,150,60,.14)'; c.fill(); c.strokeStyle = U.rgba(OCH, .6); c.lineWidth = 2; c.stroke();
  c.strokeStyle = INK; c.lineWidth = 5;
  if (z.id === 'hal') {
    c.beginPath(); c.moveTo(cx + 34, cy); c.quadraticCurveTo(cx - 2, cy - 36, cx - 32, cy + 16); c.moveTo(cx + 34, cy); c.quadraticCurveTo(cx - 2, cy + 36, cx - 32, cy - 16); c.stroke();
  } else if (z.id === 'kereszt') {
    c.lineWidth = 9; c.beginPath(); c.moveTo(cx, cy - 36); c.lineTo(cx, cy + 38); c.moveTo(cx - 24, cy - 12); c.lineTo(cx + 24, cy - 12); c.stroke();
  } else if (z.id === 'khírhó') {
    c.beginPath(); c.moveTo(cx - 26, cy - 22); c.lineTo(cx + 26, cy + 26); c.moveTo(cx + 26, cy - 22); c.lineTo(cx - 26, cy + 26); c.stroke();
    c.beginPath(); c.moveTo(cx, cy + 38); c.lineTo(cx, cy - 38); c.lineTo(cx + 8, cy - 38); c.arc(cx + 8, cy - 25, 13, -Math.PI / 2, Math.PI / 2); c.lineTo(cx, cy - 12); c.strokeStyle = RED; c.stroke();
  } else if (z.id === 'alfaómega') {
    L.tx(lab('alfa'), cx - 20, cy + 2, { f: F.D, s: 52, w: 600, a: 'center', b: 'middle', c: INK, k: 'alfa', qa: false });
    L.tx(lab('ómega'), cx + 22, cy + 2, { f: F.D, s: 52, w: 600, a: 'center', b: 'middle', c: RED, k: 'ómega', qa: false });
  } else if (z.id === 'kehely') {
    c.beginPath(); c.moveTo(cx - 30, cy - 32); c.quadraticCurveTo(cx - 28, cy + 2, cx - 6, cy + 6); c.quadraticCurveTo(cx + 18, cy + 2, cx + 18, cy - 32); c.closePath();
    c.fillStyle = 'rgba(200,64,28,.25)'; c.fill(); c.stroke();
    c.beginPath(); c.moveTo(cx - 6, cy + 6); c.lineTo(cx - 6, cy + 28); c.moveTo(cx - 22, cy + 32); c.lineTo(cx + 10, cy + 32); c.stroke();
    c.beginPath(); c.arc(cx + 30, cy + 22, 13, 0, TAU); c.fillStyle = '#e8c9a0'; c.fill(); c.lineWidth = 3; c.stroke();
  } else if (z.id === 'víz') {
    c.beginPath(); c.moveTo(cx, cy - 40); c.bezierCurveTo(cx + 5, cy - 24, cx + 21, cy - 12, cx + 18, cy + 1); c.bezierCurveTo(cx + 15, cy + 17, cx - 15, cy + 17, cx - 18, cy + 1);
    c.bezierCurveTo(cx - 21, cy - 12, cx - 5, cy - 24, cx, cy - 40); c.fillStyle = 'rgba(70,150,215,.4)'; c.fill(); c.strokeStyle = WATER_D; c.stroke();
    c.lineWidth = 3.5; c.beginPath(); for (const dy of [27, 36]) { c.moveTo(cx - 34, cy + dy); for (let i = 1; i <= 8; i++) c.lineTo(cx - 34 + i * 8.5, cy + dy + (i % 2 ? -4 : 4)); } c.stroke();
  }
  c.lineCap = 'butt'; c.lineJoin = 'miter';
}
function scene7(st, w, live) {
  GA = w;
  const a = out(pr(st, 0, .6));
  if (live) CARDS.update();
  al(a); CARDS.draw({ a: 1 });
  const t = { x: 50, y: 700, w: 1260 }, sc = CARDS.score();
  al(a); L.tx(lab('tálca súgó'), t.x + 24, t.y + 44, { f: F.D, s: 28, i: true, w: 500, c: INK, k: 'tálca súgó' });
  const done = sc.ok === sc.total;
  al(a); L.tx(done ? lab('kész') : tpl('pontszám', sc.ok, sc.total), t.x + t.w - 24, t.y + 44, { s: 26, w: 700, a: 'right', c: done ? GOOD : MUT, k: done ? 'kész' : 'pontszám' });
}

/* ════════ 9. Összefoglalás ════════ */
function scene8(st, w) {
  GA = w;
  al(out(pr(st, 0, .5))); L.tx(lab('összefoglaló cím'), 60, 100, { f: F.D, s: 50, w: 560, c: INK, k: 'összefoglaló cím' });
  const C = [
    ['ö1', { s: L.val('Dávid kora'), k: 'Dávid kora' }, INK, false],
    ['ö2', { s: rangeY('kereszthalál, legkorábban', 'kereszthalál, legkésőbb'), k: ['kereszthalál, legkorábban', 'kereszthalál, legkésőbb'] }, RED, true],
    ['ö3', { s: rangeY('1. út kezdete', '3. út vége'), k: ['1. út kezdete', '3. út vége'] }, TEAL, true],
    ['ö4', { s: rangeY('Néró üldözése', 'nagy üldözés, vége'), k: ['Néró üldözése', 'nagy üldözés, vége'] }, BAD, false],
    ['ö5', { s: L.val('milánói rendelet'), k: 'milánói rendelet' }, GOOD, false],
    ['ö6', { s: L.val('Theodosius rendelete'), k: 'Theodosius rendelete' }, FAITH, false],
  ];
  const X = [60, 487, 914], Y = [150, 450], W = 386, boxes = [];
  C.forEach(([p, dt, col, est], i) => {
    const row = i < 3 ? 0 : 1, colI = row === 0 ? i : 2 - (i - 3);
    const a = out(pr(st, .3 + i * .35, .8 + i * .35));
    const b = box(X[colI], Y[row], [ln(p + ' cím', { size: 34, w: 600, f: F.D, c: col }), Object.assign({ size: 26, w: 700, f: F.M, c: INK }, dt), ln(p + ' sor', { size: 24, w: 500, c: MUT })], 'soft', { alpha: a, minW: W - 40 });
    boxes.push(b);
    al(a); c.beginPath(); c.arc(b.x + b.w - 34, b.y + 34, 17, 0, TAU); c.fillStyle = col; c.fill();
    L.tx(String(i + 1), b.x + b.w - 34, b.y + 35, { f: F.M, s: 22, w: 700, a: 'center', b: 'middle', c: '#fff', k: p + ' cím', qa: false });
    if (est) { const r = b.rows[1]; stamp('becslés', r.x + L.measure(dt.s, { s: 26, w: 700, f: F.M }).w + 16, r.y - 9, a); }
  });
  // nyilak a kártyák között (kígyózva)
  for (let i = 0; i < 5; i++) {
    const a = out(pr(st, .8 + i * .35, 1.1 + i * .35)); if (a <= .01) continue;
    const A = boxes[i], B = boxes[i + 1]; al(a); c.strokeStyle = INK; c.lineWidth = 3;
    let x0, y0, x1, y1;
    if (i === 2) { x0 = A.x + A.w / 2; y0 = A.y + A.h + 6; x1 = B.x + B.w / 2; y1 = B.y - 10; }
    else if (i < 2) { x0 = A.x + A.w + 6; y0 = A.y + A.h / 2; x1 = B.x - 12; y1 = B.y + B.h / 2; }
    else { x0 = A.x - 6; y0 = A.y + A.h / 2; x1 = B.x + B.w + 12; y1 = B.y + B.h / 2; }
    c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke(); arrowHead(x1, y1, Math.atan2(y1 - y0, x1 - x0), 12, INK);
  }
  // máig hat
  const aM = out(pr(st, 2.6, 3.2));
  if (aM > .01) {
    const yM = Math.max(...boxes.map((b) => b.y + b.h)) + 110;
    softCard(40, yM - 56, 1290, 112, aM);
    al(aM); const t0 = L.tx(lab('máig hat'), 70, yM + 10, { f: F.D, s: 34, w: 600, c: RED, k: 'máig hat' });
    let x = 70 + t0.w + 28;
    [1, 2, 3, 4].forEach((i) => { const q = out(pr(st, 2.9 + i * .2, 3.3 + i * .2)); al(aM * q); const b = L.pill(lab('máig ' + i), x, yM, { s: 26, w: 700, f: F.B, bg: CARD, bd: RED, bw: 2.5, c: INK, pad: 16, k: 'máig ' + i }); x += b.w + 18; });
  }
}

/* ════════════════════════════════════════════════════════════════ */
const sT = new Array(9).fill(0);
const SCENES = [scene0, scene1, scene2, scene3, scene4, scene5, scene6, scene7, scene8];
let camStep = -1;
const slider = (S, k, min, max, fmtf, per) => L.slider({ label: lab(k), k, min, max, step: 1, value: min, format: fmtf, onInput: (v) => takeOver(S, v, per) });
L = Lesson.create({
  content: window.LESSON_CONTENT,
  home: false,
  steps: [
    { settle: 6.8,
      enter() { S1.f = null; S1.from = { A: 1, M: 1, D: 1 }; S1.t0 = -9; for (const k in S1.btn) S1.btn[k].classList.toggle('on', k === 'all'); },
      controls(L) {
        S1.btn = { A: L.button(lab('gomb Ábrahám'), () => setFocus('A'), 'gomb Ábrahám'), M: L.button(lab('gomb Mózes'), () => setFocus('M'), 'gomb Mózes'),
          D: L.button(lab('gomb Dávid'), () => setFocus('D'), 'gomb Dávid'), all: L.button(lab('gomb mind'), () => setFocus(null), 'gomb mind') };
        S1.btn.all.classList.add('on');
      } },
    { settle: 5.8,
      enter() { S2.user = null; S2.shown = null; },
      controls(L) { S2.slider = slider(S2, 'csúszka hét', 0, N('hetek egy évben'), (v) => tpl('hét sablon', v), .025); } },
    { settle: 6.4 },
    { settle: 6.2 },
    { settle: 1.6,
      enter() { S5.sel = 'pál'; S5.prev = null; S5.t0 = -9; markBtn(); },
      leave() { L.stage.style.cursor = ''; },
      controls(L) { S5.btn = {}; for (const id of SRC_ORDER) S5.btn[id] = L.button(lab(SRCDEF[id].btn), () => selSrc(id), SRCDEF[id].btn); markBtn(); } },
    { settle: 7.6,
      enter() { S6.user = null; S6.shown = null; S6L.mode = null; S6L.t0 = -9; },
      controls(L) {
        S6.slider = slider(S6, 'csúszka év 6', 45, YA('római út vége'), (v) => yearS(v), .12);
        L.button(lab('gomb tenger'), () => letter('sea'), 'gomb tenger'); L.button(lab('gomb szárazföld'), () => letter('land'), 'gomb szárazföld');
      } },
    { settle: 7.6,
      enter() { S7.user = null; S7.shown = null; },
      controls(L) { S7.slider = slider(S7, 'csúszka év 7', 30, 400, (v) => yearS(v), .004); } },
    { settle: 1.4,
      enter() { CARDS.reset(); },
      leave() { L.stage.style.cursor = ''; },
      controls(L) { L.button(lab('gomb megoldás'), () => CARDS.solve(), 'gomb megoldás'); L.button(lab('gomb újra'), () => CARDS.reset(), 'gomb újra'); } },
    { settle: 4.4 },
  ],
  init(Lx) {
    L = Lx; c = L.ctx;
    T = { bc: K('Kr. e.'), ad: K('Kr. u.'), cent: K('század'), years: K('év sablon') };
    SRC = TortSource.create(L, { 'forrás': K('forrás jel'), 'rekonstrukció': K('rekonstrukció jel'), 'monda': K('monda jel'),
      'becslés': K('becslés'), 'vázlatos': K('vázlatos'), 'illusztráció': K('illusztráció') });
    MAP = TortMap.create({ proj: PROJ, ancient: true, layers: [{ data: window.TORT_MAP_VILAG }, { data: window.TORT_MAP_MEDITERRAN }] });
    CAM = TortMap.camera(PROJ);
    const fit = (b, r) => TortMap.fit(PROJ, b, r);
    VIEWS = { 0: fit([26.5, 25.6, 47.6, 39.0], [20, 20, 1320, 1040]), 2: fit([34.15, 31.25, 36.05, 33.2], [20, 20, 850, 860]),
      5: fit([11.8, 31.0, 37.0, 42.4], [10, 10, 1340, 1060]), 6: fit([-9.5, 28.5, 44.5, 55.0], [10, 10, 1340, 880]) };
    TL3 = TortTimeline.create(L, { x0: 80, x1: 1280, y: 990, h: 40, T, src: SRC });
    TL4 = TortTimeline.create(L, { x0: 80, x1: 1280, y: 700, h: 44, T, src: SRC });
    TL7 = TortTimeline.create(L, { x0: 80, x1: 1280, y: 1000, h: 36, T, src: SRC });
    K2 = [[0, 0], [1.4, 0], [5.4, N('hetek egy évben')]];
    K6 = [[0, 45], [.8, 45], [6.4, YA('római út vége')]];
    K7 = [[0, 30], [.6, 30], [2.2, YA('gyülekezetek 1. kép')], [3.4, 250], [4.4, YA('nagy üldözés, kezdete')], [5.2, YA('milánói rendelet')], [6.2, YA('Theodosius rendelete')], [7.0, YA('gyülekezetek 3. kép')]];
    CARDS = TortCards.create(L, {
      zones: SYM.map((id, i) => ({ id, x: 50 + (i % 2) * 640, y: 24 + Math.floor(i / 2) * 224, w: 620, h: 208, head: 116, title: K('zóna ' + id), sub: K('zóna ' + id + ' alatt') })),
      cards: CARD_ORDER.map((id) => ({ id, zone: id, label: K('kártya ' + id) })),
      tray: { x: 50, y: 700, w: 1260, h: 352, top: 80 },
      decor: symDecor,
    });
  },
  draw(Lx) {
    L = Lx; c = L.ctx; GA = 1; paper(); L.stage.style.cursor = '';
    const sp = L.sp, wt = (i) => clamp(1 - Math.abs(sp - i) * 2);
    if (L.step >= 0) sT[L.step] = L.st;
    if (L.step !== camStep) {
      const isMap = MAPSTEPS.includes(L.step), wasMap = MAPSTEPS.includes(camStep);
      if (isMap) CAM.go(VIEWS[L.step], L.st, camStep >= 0 && wasMap ? (L.dir > 0 ? 2.4 : .8) : 0);
      else if (lastV) CAM.go(lastV, L.st, 0);
      camStep = L.step;
    }
    let mw = 0; for (const i of MAPSTEPS) mw = Math.max(mw, wt(i));
    if (mw > .005) { lastV = CAM.at(L.st); MAP.frame(lastV); mapBase(mw); }
    grid(.04);
    for (let i = 0; i < SCENES.length; i++) {
      const w = wt(i); if (w <= .005) continue;
      if (MAPSTEPS.includes(i) && mw <= .005) continue;
      GA = w; c.globalAlpha = w; SCENES[i](sT[i], w, L.step === i && Math.abs(sp - i) < .05);
    }
    GA = 1; c.globalAlpha = 1;
  },
});
})();
