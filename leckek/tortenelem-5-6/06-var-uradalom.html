<script>
(function () {
'use strict';

/* ── MODUL: Jelenet-metszet (TortScene) ───────────────────────────────────────────────
   Zoomolható, rétegzett, saját rajzú jelenet (vár, falu, város, mezőváros, gyár, folyóvölgy).
   Csak a Lesson-motort használja (L.tx, L.pill, L.measure, L.lab, L.pointer, L.stage) –
   a leckétől független, változtatás nélkül átemelhető a shared/tort/ alá.

   const sc = TortScene.create({
     L,                                    // a lecke-motor
     frame: [36, 36, 1308, 1008], r: 22,   // a képkeret a színpadon (ebbe vág), sarok-sugár
     views: { név: {x, y, z} },            // nézet: a keret közepére kerülő világpont + nagyítás
     layers: [{
       id, draw(c, S),                     // rajzoló (S lent)
       z: [be0, be1, ki0, ki1],            // opcionális: nagyítás szerinti be- és kiúszás (log-skálán)
       era: 'then' | 'now',                // opcionális: csak az „akkor” / csak a „most” képen
       box: [x, y, w], res: [w, h],        // opcionális: részletréteg saját koordinátákkal (res),
     }],                                   //   a világ [x, y, w, w·h/w] téglalapjába illesztve
     hotspots: [{ id, layer, x, y, k, info, dx, dy }],  // k: címke-, info: magyarázat-kulcs (.md);
                                           //   dx/dy: a címke eltolása px-ben (alap: jobbra)
     stampK: 'illusztráció bélyeg',        // a bélyeg felirat-kulcsa (null: nincs bélyeg)
     sky: (S) => {…}                       // opcionális: saját égbolt; alap: TortScene.sky gradiens
   });
   sc.view(név | {x, y, z})       → {x, y, z}
   sc.camAt(a, b, u)              → {x, y, z} zárt képletű kameraút (u ∈ 0..1, log-zoom,
                                    a nagyítás „fix pontja” helyben marad – nincs kilengés)
   sc.render(c, o)                o = {cam, season 0..1 (jan. 1. = 0), hour 0..24, now 0..1 (akkor → most
                                    áttűnés), split (képernyő-x: balra „akkor”, jobbra „most”), t, veil (papír-fátyol 0..1),
                                    sun (nap/hold a keret felső sávjában a napszak szerint)}
   sc.markers(c, o)               kattintható pontok + címkék; o = {ids, alpha, sel, t, labels, pulse}
   sc.card(c, id, o)              magyarázó kártya a kiválasztott ponthoz; o = {x, y, w, alpha}
   sc.decor(c, alpha)             keret + „illusztráció” bélyeg
   sc.attach(onPick)              kattintás → onPick(id | null) (csak a keretben, az utolsó markers() pontjai)
   sc.toScreen(x, y, layerId?)    → [sx, sy];  sc.lastCam: az utolsó render kamerája
   S (a rétegrajzolónak): {c, season, hour, now, t, z, px (képernyő-px / egység), lw(px), a, al(x), nat, sky, sc}
   TortScene.nature(season)  → {grass, leaf, bare, snow, green}  évszakos színek
   TortScene.sky(hour)       → {top, bottom, day, dusk, sun: {u, e}}  napszak
   TortScene.kf(keys, s, cyclic) kulcskocka-interpoláció (szín vagy szám) · TortScene.mix(a, b, t) · rgba(h, a)
   TortScene.draw: path, smooth, fs, band, house, tree, conifer, figure, animal, crenel, stones, smoke, wave
   ─────────────────────────────────────────────────────────────────────────────────── */
const TortScene = (() => {
  const TAU = Math.PI * 2, INK = '#1c2440', MUT = '#565d72', CARD = '#fffaf1', ACC = '#c8401c';
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = (t) => { t = clamp(t); return t * t * (3 - 2 * t); };
  const hex = (h) => { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
  const mix = (a, b, t) => { const A = hex(a), B = hex(b); return '#' + A.map((v, i) => Math.round(lerp(v, B[i], clamp(t))).toString(16).padStart(2, '0')).join(''); };
  const rgba = (h, a) => { const c = hex(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; };
  /* kulcskockák: [[s, érték], …] növekvő s szerint; érték szám vagy '#rrggbb'; cyclic: az év körbeér */
  function kf(keys, s, cyclic) {
    const n = keys.length, isC = typeof keys[0][1] === 'string';
    const blend = (a, b, t) => isC ? mix(a, b, t) : lerp(a, b, t);
    if (cyclic) s = ((s % 1) + 1) % 1;
    if (s <= keys[0][0]) return cyclic ? blend(keys[n - 1][1], keys[0][1], (s + 1 - keys[n - 1][0]) / (1 + keys[0][0] - keys[n - 1][0])) : keys[0][1];
    for (let i = 0; i < n - 1; i++) if (s <= keys[i + 1][0]) return blend(keys[i][1], keys[i + 1][1], smooth((s - keys[i][0]) / (keys[i + 1][0] - keys[i][0])));
    return cyclic ? blend(keys[n - 1][1], keys[0][1], (s - keys[n - 1][0]) / (1 + keys[0][0] - keys[n - 1][0])) : keys[n - 1][1];
  }
  /* évszak (0 = jan. 1., 0,5 ≈ júl. 1.) → a természet színei */
  function nature(s) {
    return {
      grass: kf([[.02, '#c8c4a6'], [.2, '#bcc495'], [.32, '#a8c574'], [.45, '#a2bd68'], [.6, '#b4bb6e'], [.76, '#bfb175'], [.9, '#c4bd9c']], s, true),
      leaf: kf([[.25, '#a7c777'], [.36, '#84b05a'], [.55, '#6c9748'], [.68, '#8a9846'], [.78, '#c3843a'], [.86, '#ad7643']], s, true),
      bare: kf([[.08, 1], [.24, 1], [.33, 0], [.8, 0], [.9, 1]], s, true),
      snow: kf([[.05, 1], [.12, .85], [.17, 0], [.91, 0], [.97, .85]], s, true),
      green: kf([[.05, 0], [.3, .7], [.45, 1], [.65, .7], [.85, .2]], s, true),
      s,
    };
  }
  /* napszak (0–24 óra) → égbolt; nyári nappal kb. 4:45–20:30 */
  function sky(h) {
    const day = smooth((h - 4) / 1.6) * smooth((21.2 - h) / 1.6);
    const dusk = Math.max(Math.exp(-Math.pow((h - 5.2) / 1.1, 2)), Math.exp(-Math.pow((h - 20.2) / 1.1, 2)));
    const u = (h - 4.8) / (20.4 - 4.8);
    return {
      day, dusk, sun: { u, e: Math.sin(Math.PI * clamp(u)) },
      top: mix(mix('#8d98b6', '#c7dbe5', day), '#d9b9a4', dusk * .45),
      bottom: mix(mix('#b3bacb', '#f2efe3', day), '#efcda6', dusk * .7),
    };
  }

  /* ── rajzoló primitívek (egységekben; lw: vonalvastagság egységben) ── */
  const D = {};
  D.path = (c, p, close) => { c.beginPath(); p.forEach((q, i) => i ? c.lineTo(q[0], q[1]) : c.moveTo(q[0], q[1])); if (close) c.closePath(); };
  const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  D.smooth = (c, p, close) => {
    c.beginPath(); const n = p.length;
    if (close) {
      const m0 = mid(p[n - 1], p[0]); c.moveTo(m0[0], m0[1]);
      for (let i = 0; i < n; i++) { const m = mid(p[i], p[(i + 1) % n]); c.quadraticCurveTo(p[i][0], p[i][1], m[0], m[1]); }
      c.closePath();
    } else {
      c.moveTo(p[0][0], p[0][1]);
      for (let i = 1; i < n - 1; i++) { const m = mid(p[i], p[i + 1]); c.quadraticCurveTo(p[i][0], p[i][1], m[0], m[1]); }
      c.lineTo(p[n - 1][0], p[n - 1][1]);
    }
  };
  D.fs = (c, fill, stroke, lw) => { if (fill) { c.fillStyle = fill; c.fill(); } if (stroke && lw > 0) { c.strokeStyle = stroke; c.lineWidth = lw; c.stroke(); } };
  /* sáv egy középvonal körül (folyó, út): w(i) szélesség → zárt pontsor */
  D.band = (p, w) => {
    const L1 = [], R1 = [];
    p.forEach((q, i) => {
      const a = p[Math.max(0, i - 1)], b = p[Math.min(p.length - 1, i + 1)], dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1;
      const ww = (typeof w === 'function' ? w(i / (p.length - 1)) : w) / 2;
      L1.push([q[0] - dy / l * ww, q[1] + dx / l * ww]); R1.push([q[0] + dy / l * ww, q[1] - dx / l * ww]);
    });
    return { left: L1, right: R1, poly: L1.concat(R1.reverse()) };
  };
  /* ház: (x, y) a homlokzat alja középen; o: wall, roof, lw, tile, snow, door, win */
  D.house = (c, x, y, w, h, o = {}) => {
    const lw = o.lw || 1, ink = o.ink || INK, rh = o.roofH || h * .95, ov = w * .07;
    c.beginPath(); c.rect(x - w / 2, y - h, w, h); D.fs(c, o.wall || '#efe4cc', ink, lw);
    if (o.door !== false) { c.beginPath(); c.rect(x + w * (o.doorX == null ? .18 : o.doorX) - w * .08, y - h * .66, w * .16, h * .66); D.fs(c, o.doorC || '#8a5a33', ink, lw * .8); }
    const nw = o.win == null ? 1 : o.win;
    for (let i = 0; i < nw; i++) { const wx = x - w * .3 + i * w * .26; c.beginPath(); c.rect(wx - w * .055, y - h * .74, w * .11, h * .28); D.fs(c, o.winC || '#59607a', ink, lw * .7); }
    c.beginPath(); c.moveTo(x - w / 2 - ov, y - h); c.lineTo(x - w * .3, y - h - rh); c.lineTo(x + w * .3, y - h - rh); c.lineTo(x + w / 2 + ov, y - h); c.closePath();
    D.fs(c, o.roof || '#c4a062', ink, lw);
    c.save(); c.clip(); c.strokeStyle = rgba(ink, .28); c.lineWidth = lw * .6; c.beginPath();
    if (o.tile) { for (let k = 1; k < 4; k++) { const yy = y - h - rh * k / 4; c.moveTo(x - w, yy); c.lineTo(x + w, yy); } }
    else { for (let k = -6; k <= 6; k++) { c.moveTo(x + k * w * .09, y - h - rh); c.lineTo(x + k * w * .12, y - h); } }
    c.stroke();
    if (o.snow > .02) { c.fillStyle = `rgba(250,250,247,${.92 * o.snow})`; c.fillRect(x - w, y - h - rh - 2, w * 2, rh * .62); }
    c.restore();
  };
  /* lombos fa: (x, y) a törzs alja; s ≈ a magasság / 30 */
  D.tree = (c, x, y, s, nat, o = {}) => {
    const lw = o.lw || 1, ink = o.ink || INK, bare = nat ? nat.bare : 0, seed = o.seed || 0, a0 = c.globalAlpha;
    c.beginPath(); c.moveTo(x - s * 1.3, y); c.lineTo(x - s * .7, y - s * 12); c.lineTo(x + s * .7, y - s * 12); c.lineTo(x + s * 1.3, y); c.closePath();
    D.fs(c, '#7d5a3a', ink, lw);
    if (bare > .02) {
      c.globalAlpha = a0 * bare; c.strokeStyle = '#6b4f36'; c.lineWidth = lw * 1.4; c.beginPath();
      [[-7, -22], [6, -24], [0, -28], [-3, -18], [4, -17]].forEach((b, i) => { c.moveTo(x, y - s * (9 + i)); c.lineTo(x + b[0] * s, y + b[1] * s); });
      c.stroke(); c.globalAlpha = a0;
    }
    if (bare < .98) {
      c.globalAlpha = a0 * (1 - bare * .9);
      const cx = x, cy = y - s * 19, pts = [];
      for (let k = 0; k < 11; k++) { const an = k / 11 * TAU, r = s * 9.5 * (1 + .14 * Math.sin(k * 2.7 + seed * 1.9)); pts.push([cx + Math.cos(an) * r, cy + Math.sin(an) * r * .88]); }
      D.smooth(c, pts, true); D.fs(c, o.leaf || (nat ? nat.leaf : '#6c9748'), ink, lw);
      c.beginPath(); c.ellipse(cx - s * 3, cy - s * 3.5, s * 3.6, s * 2.6, -.4, 0, TAU); c.fillStyle = 'rgba(255,255,230,.22)'; c.fill();
      c.globalAlpha = a0;
    }
    if (nat && nat.snow > .05) { c.globalAlpha = a0 * nat.snow; c.beginPath(); c.ellipse(x, y - s * 26, s * 6, s * 2.2, 0, 0, TAU); c.fillStyle = '#fbfbf8'; c.fill(); c.globalAlpha = a0; }
  };
  D.conifer = (c, x, y, s, nat, o = {}) => {
    const lw = o.lw || 1, ink = o.ink || INK;
    c.beginPath(); c.rect(x - s, y - s * 5, s * 2, s * 5); D.fs(c, '#7d5a3a', ink, lw);
    for (let k = 0; k < 3; k++) { const yy = y - s * (5 + k * 7), ww = s * (9 - k * 2.2); D.path(c, [[x - ww, yy], [x, yy - s * 11], [x + ww, yy]], true); D.fs(c, o.leaf || '#4f7a4c', ink, lw); }
    if (nat && nat.snow > .05) { const a0 = c.globalAlpha; c.globalAlpha = a0 * nat.snow; D.path(c, [[x - s * 3, y - s * 21], [x, y - s * 27], [x + s * 3, y - s * 21]], true); c.fillStyle = '#fbfbf8'; c.fill(); c.globalAlpha = a0; }
  };
  /* stilizált emberalak: (x, y) a talp; s ≈ magasság / 34. o: coat, hat, pose ('stand'|'walk'|'work'|'sit'), t (fázis), dir, tool, lw */
  D.figure = (c, x, y, s, o = {}) => {
    const lw = o.lw || 1, ink = o.ink || INK, ph = o.t || 0, dir = o.dir || 1, pose = o.pose || 'stand';
    const sw = pose === 'walk' ? Math.sin(ph) : 0, bend = pose === 'work' ? .45 + .25 * Math.sin(ph) : 0, sit = pose === 'sit';
    const hip = [x, y - (sit ? 9 : 13) * s], sh = [x + dir * bend * 7 * s, y - (sit ? 22 : 26) * s + bend * 5 * s], head = [sh[0] + dir * bend * 3 * s, sh[1] - 5.6 * s];
    c.lineCap = 'round'; c.strokeStyle = ink; c.lineWidth = lw * 2.4;

function vHill(c, S) {
  const lw = S.lw, nat = S.nat;
  D.smooth(c, [[-600, 900], [-600, 470], [-200, 440], [150, 380], [400, 360], [620, 390], [800, 330], [930, 272], [1010, 258], [1100, 272], [1250, 330], [1420, 360], [1700, 380], [2500, 430], [2500, 900]], true);

  c.fillStyle = g; c.fill(); c.strokeStyle = rgba(INK, .55); c.lineWidth = lw(2); c.stroke();
  const r = U.rng(21);
  for (let i = 0; i < 150; i++) { const x = -100 + r() * 1700, y = 330 + r() * 360; if (y < vRidge(x) + 25 || (x > 150 && x < 720 && y > 480) || (x > 880 && x < 1130 && y < 330)) continue; D.tree(c, x, y, 1 + r() * .4, nat, { lw: lw(.9), seed: i, leaf: mix(nat.leaf, '#4f7a46', .35) }); }
}
function vRidge(x) { const p = [[-200, 440], [150, 380], [400, 360], [620, 390], [800, 330], [930, 272], [1010, 258], [1100, 272], [1250, 330], [1420, 360], [1700, 380]]; for (let i = 1; i < p.length; i++) if (x <= p[i][0]) return lerp(p[i - 1][1], p[i][1], (x - p[i - 1][0]) / (p[i][0] - p[i - 1][0])); return 400; }

  else { D.path(c, [[bx - 60, 880], [bx + 56, 880], [bx + 46, 898], [bx - 52, 898]], true); D.fs(c, '#f1ece0', INK, lw(1.6)); c.beginPath(); c.rect(bx - 30, 864, 56, 16); D.fs(c, '#3d5a80', INK, lw(1.4)); for (let k = 0; k < 4; k++) { c.beginPath(); c.rect(bx - 26 + k * 13, 868, 8, 7); D.fs(c, '#cfe3ef', null, 0); } }
}

/* palota: ruin = 0 (rekonstrukció) … 1 (mai romok, részben újjáépítve) */
function vPalace(c, S) {
  const lw = S.lw(1.6), ruin = S.now;
  const terr = [[160, 700, 560, 30], [210, 640, 470, 26], [260, 590, 380, 24]];
  terr.forEach((t2) => { c.beginPath(); c.rect(t2[0], t2[1], t2[2], t2[3]); D.fs(c, mix('#d8cfbd', '#cfc6b2', ruin), INK, lw); D.stones(c, t2[0], t2[1], t2[2], t2[3], 9, S.lw(.6)); });
  const bld = (x, y, w, h, roof) => {
    if (ruin < .5) {
      c.beginPath(); c.rect(x, y - h, w, h); D.fs(c, C.plaster, INK, lw);
      for (let k = 0; k < Math.floor(w / 22); k++) { c.beginPath(); c.moveTo(x + 10 + k * 22, y - 6); c.lineTo(x + 10 + k * 22, y - h * .6); c.arc(x + 15 + k * 22, y - h * .6, 5, Math.PI, 0); c.lineTo(x + 20 + k * 22, y - 6); D.fs(c, '#59607a', INK, S.lw(.8)); }
      if (roof) { D.path(c, [[x - 6, y - h], [x + 12, y - h - roof], [x + w - 12, y - h - roof], [x + w + 6, y - h]], true); D.fs(c, C.tile, INK, lw); }
    } else {
      const p = [[x, y]]; for (let k = 0; k <= 8; k++) p.push([x + w * k / 8, y - h * (.25 + .35 * Math.abs(Math.sin(k * 2.3 + x)))]); p.push([x + w, y]);
      D.path(c, p, true); D.fs(c, '#d6ccb8', INK, lw); D.stones(c, x, y - h, w, h, 8, S.lw(.6));
    }
  };
  bld(180, 700, 160, 52, 26); bld(360, 700, 150, 60, 30); bld(530, 700, 170, 48, 24);
  bld(230, 640, 120, 40, 22); bld(500, 640, 160, 44, 22);
  /* kápolna (gótikus) */
  if (ruin < .5) { c.beginPath(); c.rect(300, 590, 70, 50); D.fs(c, C.church, INK, lw); D.path(c, [[295, 590], [335, 548], [375, 590]], true); D.fs(c, C.tile, INK, lw); c.beginPath(); c.moveTo(335, 548); c.lineTo(335, 520); c.strokeStyle = INK; c.lineWidth = lw; c.stroke(); }
  else { c.beginPath(); c.rect(300, 616, 70, 24); D.fs(c, '#d6ccb8', INK, lw); }
  /* Herkules-kút az udvaron */
  c.beginPath(); c.rect(410, 624, 34, 16); D.fs(c, '#b65e4a', INK, lw); c.beginPath(); c.rect(422, 604, 10, 20); D.fs(c, '#b65e4a', INK, lw);
  if (ruin > .5) { /* részben újjáépített szárny, világosabb kő */ c.beginPath(); c.rect(370, 650, 120, 50); D.fs(c, '#eee6d4', INK, lw); for (let k = 0; k < 5; k++) { c.beginPath(); c.moveTo(380 + k * 22, 696); c.lineTo(380 + k * 22, 668); c.arc(385 + k * 22, 668, 5, Math.PI, 0); c.lineTo(390 + k * 22, 696); D.fs(c, '#59607a', INK, S.lw(.8)); } }
}
function vCastles(c, S) {

  c.strokeStyle = INK; c.lineWidth = S.lw(13); c.lineCap = 'round'; D.smooth(c, [[1040, 300], [1070, 400], [1095, 500], [1110, 600], [1150, 720], [1190, 800]], false); c.stroke();

  const tx = 1095, ty = 690, tw = 58, th = 150;

}

const steps = STEPS.map((s, i) => ({
  settle: s.settle,
  enter(Lx) { st.sel = null; cam.prev = Lx.prevStep; if (i === 3) Object.assign(S4, { user: false, yr: 0, yrPrev: 0, ty: -9, tn: 2.6, n: num('nyomások száma később'), nPrev: num('nyomások száma régen') });
    if (i === 4) { S5.user = false; }
    if (i === 5) { const r = num('hozam'); Object.assign(S6, { r, r0: r, t0: -9 }); }
    if (i === 6) { S7.userH = false; S7.split = .5; }
    if (i === 7) Object.assign(S8, { now: 0, now0: 0, t0: -9 }); },
}));
steps[3].controls = (L) => {
  const b2 = L.button(lab('kétnyomásos gomb'), () => setN(num('nyomások száma régen')), 'kétnyomásos gomb');
  const b3 = L.button(lab('háromnyomásos gomb'), () => setN(num('nyomások száma később')), 'háromnyomásos gomb');
  L.button(lab('következő év gomb'), () => { const s = s4State(L.st); S4.user = true; S4.n = s.n; S4.nPrev = s.n; S4.yrPrev = S4.yr; S4.yr = (S4.yr + 1) % 6; S4.ty = L.st; }, 'következő év gomb');
  function setN(n) { const s = s4State(L.st); S4.user = true; S4.nPrev = s.n; S4.n = n; S4.tn = L.st; S4.yrPrev = S4.yr; b2.classList.toggle('on', n === num('nyomások száma régen')); b3.classList.toggle('on', n === num('nyomások száma később')); }
};
steps[4].controls = (L) => {
  const ms = list('hónapok');
  S5.slider = L.slider({ label: lab('évszak csúszka'), k: 'évszak csúszka', min: 0, max: .999, step: .001, value: .02,
    format: (v) => { let d = v * 365, m = 0; while (m < 11 && d >= MONTHS_LEN[m]) { d -= MONTHS_LEN[m]; m++; } return ms[m]; },
    onInput: (v) => { S5.user = true; S5.s = v; } });
};
steps[5].controls = (L) => {
  const q = list('termés minősége');
  L.slider({ label: lab('termés csúszka'), k: 'termés csúszka', min: 2, max: 6, step: .5, value: num('hozam'),
    format: (v) => q[Math.round((v - 2) / 4 * (q.length - 1))], onInput: (v) => { S6.r0 = ratio6(L.st); S6.r = v; S6.t0 = L.st; if (L.st < 4) L.st = 4; } });
};
steps[6].controls = (L) => {
  L.slider({ label: lab('akkor most csúszka'), k: 'akkor most csúszka', min: .1, max: .9, step: .01, value: .5, format: (v) => (v < .3 ? lab('akkor') : v > .7 ? lab('most') : '↔').split(':')[0], onInput: (v) => { S7.split = v; } });
  S7.sH = L.slider({ label: lab('napszak csúszka'), k: 'napszak csúszka', min: 0, max: 23.75, step: .25, value: 5.5,
    format: (v) => Math.floor(v) + ':' + String(Math.round((v % 1) * 60)).padStart(2, '0'), onInput: (v) => { S7.userH = true; S7.hour = v; } });
};
steps[7].controls = (L) => {
  const b1 = L.button(lab('akkor gomb'), () => setNow(0), 'akkor gomb'), b2 = L.button(lab('ma gomb'), () => setNow(1), 'ma gomb');
  b1.classList.add('on');
  function setNow(v) { S8.now0 = now8(L.st); S8.now = v; S8.t0 = L.st; b1.classList.toggle('on', !v); b2.classList.toggle('on', !!v); }
};

L = Lesson.create({
  content: window.LESSON_CONTENT,
  home: false,
  steps,
  init(Lx) { L = Lx; c = L.ctx; buildScenes(); },
  draw(Lx) {
    L = Lx; c = L.ctx;
    if (L.step === 4 && S5.slider && !S5.user) S5.slider.set(season5(L.st));
    if (L.step === 6 && S7.sH && !S7.userH) S7.sH.set(hour7(L.st));
    draw();
  },
});
})();
</script>
</body>
</html>
