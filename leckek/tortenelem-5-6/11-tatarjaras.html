<script>
/* ── MODUL: Térkép (TortMap) ──────────────────────────────────────────────────────────────
   Térképmotor a történelemleckékhez. Lecke-független: változtatás nélkül átemelhető a
   shared/tort/ alá (pl. shared/tort/map.js). Függ: TortProj (shared/tort/proj.js), a
   shared/tort/map-*.js adatfájlok, és a lecke-motor L objektuma a feliratokhoz (L.tx, L.measure,
   L.pill, L.fonts, L.U – így a QA és a review mód minden térképfeliratot lát).

   const map = TortMap.create({
     proj:    TortProj.lcc({lon0: 20, lat0: 38, lat1: 30, lat2: 46}),   // a lecke egyetlen vetülete
     layers:  [{data: TORT_MAP_VILAG},                                  // durvától a finomig; a finomabb réteg
               {data: TORT_MAP_MEDITERRAN},                             //   csak a saját kivágatában rajzol,
               {data: TORT_MAP_KARPAT, fade: [4500, 7500]}],             //   fade: [s0, s1] között úszik be (s = px/Föld-sugár)
     borders: TORT_MAP_HATAROK,   // opcionális: a „mai határok” réteg adata
     ancient: true,               // a modern: 1 elemek (víztározó, csatorna) kimaradnak
     rect:    [0, 0, 1360, 1080], // a feliratok elhelyezési területe (alap: a vizuális terület)
   });

   KAMERA
     TortMap.fit(proj, [lonMin, latMin, lonMax, latMax], [x, y, w, h], pad?) → nézet {lon, lat, s, x, y}
     TortMap.lerp(proj, a, b, u)    nézet a és b között (u 0..1): fix pont körüli zoom + pan, s logaritmikusan
                                    (nagy zoomnál is természetes: egy pont végig ugyanott marad a képernyőn)
     const cam = TortMap.camera(proj)
     cam.go(nézet, t, dur)          átmenet indítása a jelenlegi állásból (t: tetszőleges óra, pl. L.st)
     cam.at(t) → nézet              a t időpillanat nézete (inOut lassítással); visszafelé lépésnél rövid dur-t adj
     TortMap.zfade(V, s0, s1)       0..1: hol tart V.s az [s0, s1] között (log.) – rétegek ki-/beúsztatása zoomra

   KÉPKOCKÁNKÉNT (a sorrend: frame → base → region / line / saját rajz → labels)
     const V = map.frame(nézet)     beállítja a kamerát; V = TortProj.view (V.pt, V.inv, V.s)
     map.base(ctx, o)               tenger, szárazföld, hegységfoltok, folyók, tavak, partvonal.
                                    o = {rivers: {rank: 6 | [r0, r1, r2] (rétegenként), hi: {'Duna': {w: 5, wkm: .4, c}}
                                         (9 px fölött part + világos víz),
                                         only: ['Duna', …]}, mountains: 0..1 (alfa), lakes: true, style: {sea, land, …}}
     map.borders(ctx, a)            mai határok, halvány szaggatott vonal (a: alfa); mellé: TortMap.stamp(„mai határok”)
     map.region(ctx, items, o)      lágy szélű folt(ok) EGY rétegben (az átfedés nem sötétedik):
                                    items = [{blobs: [[lon, lat, km], …]} | {poly: [[lon, lat], …]}, a: 0..1]
                                    o = {color, alpha (alap .4), blur (px, alap 14), land: true (szárazföldre vágva,
                                         a tavak kivételével)}
     map.line(ctx, pts, o)          vonal / animált nyíl: pts = [[lon, lat], …];
                                    o = {p: 0..1 (haladás), color, w (px), wkm (szélesség km-ben, min. w), dash,
                                         head: true (nyílhegy), halo: true, smooth: true, cap} → {x, y, ang, len}
     map.labels(L, items, o)        ütközésmentes címkézés (prioritás szerint, mohón; a korábbi helyet megtartja):
                                    items = [{id, lon, lat | x, y, s, k, sub, sk, pri, r (jel sugara, 0: nincs),
                                              dot (alap pontot rajzol), size, w, f, i, c, subc, a, dirs, force}]
                                    dirs: ['E','W','N','S','NE','SE','NW','SW'] (alap) vagy ['C'] (területnév középen);
                                    ha a közeli helyek foglaltak, távolabb, szaggatott vezetővonallal próbálja.
                                    o = {avoid: [{x, y, w, h}], rect} → az elhelyezett dobozok [{id, x, y, w, h}]
     map.scale(L, x, y, o)          méretarány-vonalzó kerek km-értékkel; o = {k: felirat-kulcs („# km”), max: px}
   SEGÉDEK
     map.pt(lon, lat) → [x, y] (másolat) · map.ppk(lon, lat) → px / km ott · map.river(név) → [[lon, lat], …]
     TortMap.slice(line, a, b)      a vonal a- és b-hez ([lon, lat]) legközelebbi csúcsa közötti szakasza
     TortMap.nearest(line, p)       {i, p}: a p-hez legközelebbi csúcs
     TortMap.spline(pts, n, closed) Catmull–Rom simítás (n pont szakaszonként)
     TortMap.offset(lon, lat, kelet_m, észak_m) → [lon, lat] (helyi alaprajzokhoz méterben)
     TortMap.stamp(L, s, x, y, o)   bélyeg („vázlatos”, „mai határok”, „becslés”): −3°, Bricolage 22 px 600, keret;
                                    o = {k, est: true → okker, a: 'left' | 'center' | 'right'} → doboz
   Rétegek keverése: a durva réteg a finomabb kivágatán kívül teljes erővel, belül (1 − alfa)-val rajzol.
   Teljesítmény: a kivágaton kívüli gyűrűk kimaradnak; a foltok negyed felbontású pufferben mosódnak el.
   ───────────────────────────────────────────────────────────────────────────────────────── */
const TortMap = (() => {
  'use strict';
  const TP = window.TortProj;
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const smooth = (t) => { t = clamp(t); return t * t * (3 - 2 * t); };
  const inOut = (t) => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
  const DEF = { sea: 'rgba(70,150,215,.22)', land: '#f5eddd', coast: '#1b5a94', coastW: 1.5, river: '#1b5a94',
    lake: '#c6dbe8', lakeLine: '#1b5a94', mtn: '#7a623e', border: '#1c2440', ink: '#1c2440', muted: '#565d72',
    halo: 'rgba(250,246,238,.94)', card: '#fffaf1', est: '#8f5a0c' };
  const R_KM = 6371;

  function ringBox(r) {
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (let i = 0; i < r.length; i += 2) { const x = r[i], y = r[i + 1]; if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    return [x0, y0, x1, y1];
  }
  function boxRing(b, n = 24) {
    const o = [];
    for (let i = 0; i < n; i++) o.push(b[0] + (b[2] - b[0]) * i / n, b[1]);
    for (let i = 0; i < n; i++) o.push(b[2], b[1] + (b[3] - b[1]) * i / n);
    for (let i = 0; i < n; i++) o.push(b[2] - (b[2] - b[0]) * i / n, b[3]);
    for (let i = 0; i < n; i++) o.push(b[0], b[3] - (b[3] - b[1]) * i / n);
    return Float64Array.from(o);
  }
  const hit = (a, b) => a[0] <= b[2] && a[2] >= b[0] && a[1] <= b[3] && a[3] >= b[1];
  const parts = (arr) => (arr || []).map((r) => ({ r, b: ringBox(r) }));

  function fit(proj, b, rect, pad) { return TP.fit(proj, b, rect, pad); }

  function lerp(proj, a, b, u) {

    it.push(placeItem(n, { pri: 6, c: TEAL, size: 22, dirs: { Esztergom: ['N', 'NW'], 'Székesfehérvár': ['S', 'SE', 'SW'], Pannonhalma: ['W', 'SW', 'NW'], Klisz: ['E', 'NE'], Trau: ['W', 'SW'], Spalato: ['S', 'SE'] }[n] }));
  }
  const nw = (list, a, pri) => list.forEach((n) => {
    if (a <= .01) return;
    const key = n === 'Buda vára' ? 'Buda' : n, q = MAP.pt(...LL(key + ' helye')), s = 1 + .6 * (1 - out(a));
    c.save(); c.translate(q[0], q[1]); c.scale(s, s); castleMark(0, 0, 'new', a); c.restore();
    it.push(Object.assign(placeItem(key, { pri, a, c: RED, size: 24, dirs: { Visegrád: ['NE', 'N', 'E'], 'Buda': ['SE', 'E', 'S'], Szigliget: ['SW', 'S', 'W'], Csesznek: ['NW', 'N', 'W'], Hollókő: ['N', 'NE', 'NW'], Boldogkő: ['E', 'NE', 'SE'] }[key] }), { s: lab(n), k: n }));
  });
  nw(NEW70, rev(1), 8); nw(NEW00, rev(2), 8);
  al(1); MAP.labels(L, it, { avoid: [{ x: 30, y: 890, w: 420, h: 150 }, { x: 830, y: 0, w: 540, h: 1080 }, { x: 24, y: 20, w: 640, h: 80 }], rect: [24, 24, 790, 1040] });
  legend5(40, 902, [['held', 'jel kitartott'], ['new', 'új kővár']], 1);
  al(1); stampK('vázlatos', 600, 1036);
  // cím
  const tw = L.measure(lab('ú cím'), { f: F.D, s: 32, w: 600 }).w;
  softCard(30, 30, tw + 44, 64, 1); al(1); T('ú cím', 52, 74, { f: F.D, s: 32, w: 600 });
  // oszlopok: kővárak száma (becslés) – TortBattle erőviszony-oszlop
  softCard(840, 30, 490, 1020, 1); al(1);
  T('kővárszám cím', 864, 80, { f: F.D, s: 34, w: 600 });
  stampK('becslés', 1186, 64);
  const v1 = dat('kővárak 1241 előtt'), v2 = dat('kővárak 1270-ben'), v3 = dat('kővárak 1300 körül');
  const r1 = { lo: v1.v, hi: v1.v }, row = (k, d, kk, a, sub) => ({ col: k === 0 ? TEAL : RED, name: { s: sub, k: kk }, val: { s: L.val(d), k: d }, parts: [{ lo: (k === 0 ? r1 : dat(d)).lo, hi: (k === 0 ? r1 : dat(d)).hi, a }] });
  const fb = BT.forces(864, 110, 442, [
    row(0, 'kővárak 1241 előtt', 's 1241', 1, lab('s 1241')),
    row(1, 'kővárak 1270-ben', ['s 1270', 'Béla halála'], rev(1), lab('s 1270').replace('#', L.val('Béla halála'))),
    row(2, 'kővárak 1300 körül', 's 1300', rev(2), lab('s 1300')),
  ], { max: v3.hi });
  // miért bizonytalan?
  const yq = 110 + fb.h + 16;
  al(1); T('miért cím', 864, yq + 30, { f: F.D, s: 28, w: 600, c: OCH });
  let yy = yq + 70;
  for (const k of ['miért 1', 'miért 2']) {
    const lines = SRC.wrap(lab(k), 420, { s: 24, w: 500 });
    al(1); c.beginPath(); c.arc(872, yy - 8, 5, 0, TAU); c.fillStyle = OCH; c.fill();
    lines.forEach((ln, i) => L.tx(ln, 888, yy + i * 30, { k, s: 24, w: 500, c: INK }));
    yy += lines.length * 30 + 14;
  }
  // népességveszteség (becslés)
  const pv = dat('népességveszteség');
  al(1); c.strokeStyle = LINE; c.lineWidth = 2; c.beginPath(); c.moveTo(864, yy + 6); c.lineTo(1306, yy + 6); c.stroke();
  BT.forces(864, yy + 26, 442, [{ col: GREY, name: K('népesség cím'), val: { s: L.val('népességveszteség'), k: 'népességveszteség' }, parts: [{ lo: pv.lo, hi: pv.hi, a: 1 }] }], { max: 100 });
}

/* ── a térképes lépések közös rajzolása (kamera, áttűnés a csatatérbe) ── */
function mapScenes(wt) {
  const wMap = Math.max(...MAPSTEPS.map(wt));
  if (wMap <= .005) return;
  if (MAPSTEPS.includes(L.step) && L.step !== camStep) {
    CAM.go(VIEWS[L.step], L.dir < 0 ? L.st - .2 : L.st, camStep < 0 ? 0 : L.dir > 0 ? CAM_DUR[L.step] : .5);
    camStep = L.step;
  }
  const V = MAP.frame(CAM.at(MAPSTEPS.includes(L.step) ? L.st : 1e9));
  BT.frame(MAP.pt, MAP.ppk(V.lon, V.lat));
  const tz = TortMap.zfade(V, TZ[0], TZ[1]);
  GA = wMap;
  if (tz < .999) { al(1 - tz); MAP.base(c, { mountains: .14, rivers: { rank: [6, 9], hi: { 'Duna': { w: 4 }, 'Tisza': { w: 3 } } } }); }
  if (tz > .001) { GA = wMap * tz; al(1); c.fillStyle = '#f1e6cf'; c.fillRect(0, 0, 1360, 1080); terrain4(wMap * tz, L.t); }
  if (wt(1) > .005) scene2(sT[1], wt(1) * wMap * (1 - tz), L.step === 1);
  if (wt(2) > .005) scene3(sT[2], wt(2) * wMap * (1 - tz), L.step === 2);
  if (wt(3) > .005) scene4(sT[3], wt(3) * wMap, L.step === 3, tz);
  if (wt(4) > .005) scene5(sT[4], wt(4) * wMap, L.step === 4, tz);
  if (wt(7) > .005) scene8(sT[7], wt(7) * wMap, L.step === 7, tz);
}

/* ── 9. Összefoglalás ── */
function scene9(st, w) {
  GA = w;
  const p = (d) => out(clamp((st - d) / .6));
  const tw = L.measure(lab('ö cím'), { f: F.D, s: 44, w: 560 }).w;
  softCard(30, 30, tw + 50, 84, p(0)); al(p(0)); T('ö cím', 55, 88, { f: F.D, s: 44, w: 560 });
  al(1);
  TL9.view(1212, 1312);
  TL9.draw({ a: p(.2), cent: 1 });
  const Y = TortTimeline.Y, u = (k) => Y.u(dat(k));
  const card = (k, d, row, a, o = {}) => Object.assign({ u: u(d), title: K(k), date: { s: L.val(d), k: d }, row, a: p(a) }, o);
  const items = [
    card('ö 1222', 'Aranybulla', 0, .5),
    card('ö 1235', 'Béla trónra lépése', 1, .8),
    card('ö 1242', 'kivonulás', 2, 1.4),
    card('ö 1241', 'muhi csata', 0, 1.1, { hi: true }),
    card('ö 1270', 'Béla halála', 1, 1.8),
    card('ö 1301', 'Árpád-ház kihalása', 0, 2.2),
  ];
  items.sort((a, b) => b.row - a.row);
  TL9.cards(items, { pitch: 124 });
  const pg = p(2.7);
  if (pg > 0) {
    const xa = TL9.x(u('kivonulás')), xb = TL9.x(u('Béla halála')), yb = 830;
    al(pg); c.strokeStyle = RED; c.lineWidth = 3; c.beginPath(); c.moveTo(xa, yb - 14); c.lineTo(xa, yb); c.lineTo(xb, yb); c.lineTo(xb, yb - 14); c.stroke();
    const n = YR('Béla halála') - dat('kivonulás').v;
    L.tx(lab('ö kővár').replace('#', n), (xa + xb) / 2, yb + 38, { k: ['ö kővár', 'kivonulás', 'Béla halála'], s: 28, w: 700, a: 'center', c: RED });
  }
}

/* ════════════════════════════════════════════════════════════════ */
const STEPS = [
  { settle: 6.4,
    enter() { if (P1.lvl) P1.lvl.reset(); },
    controls(L) { SL1 = L.slider({ label: lab('csúszka egység'), k: 'csúszka egység', min: 0, max: 3, step: 1, value: 0, format: (v) => lab('egység ' + Math.pow(10, v + 1)), onInput: (v) => P1.lvl.take(v, L.st) }); } },
  { settle: 6.8,
    enter() { if (P2) P2.reset(); },
    controls(L) { SL2 = L.slider({ label: lab('csúszka dátum'), k: 'csúszka dátum', min: D0(), max: D1(), step: 1, value: D0(), format: (v) => dateStr(v), onInput: (v) => P2.take(v, L.st) }); } },
  { settle: 6.4 },
  { settle: 7.6,
    enter() { if (P4) P4.reset(); },
    controls(L) { SL4 = L.slider({ label: lab('csúszka csata'), k: 'csúszka csata', min: 0, max: 100, step: 1, value: 0,
      format: (v) => lab(phase4(v / 100)[0]), onInput: (v) => P4.take(v / 100, L.st) }); } },
  { settle: 5.2,
    enter() { S5.v = 'both'; S5.from = 'both'; S5.t0 = -9; S5.sel = null; },
    leave() { L.stage.style.cursor = ''; },
    controls(L) {
      const go = (v) => { S5.from = SC5.camAt(S5.from, S5.v, smooth((L.st - S5.t0) / .7)); S5.v = v; S5.t0 = L.st; S5.sel = null; };
      L.button(lab('gomb földvár'), () => go('earth'), 'gomb földvár'); L.button(lab('gomb kővár'), () => go('stone'), 'gomb kővár'); L.button(lab('gomb mindkettő'), () => go('both'), 'gomb mindkettő');
    } },
  { settle: 3.4,
    enter() { S6.reset(); },
    controls(L) {
      ['gomb m1', 'gomb m2', 'gomb m3', 'gomb m4'].forEach((k, i) => L.button(lab(k), () => S6.set(i, L.st), k));
      L.button(lab('gomb mind 6'), () => S6.set(null, L.st), 'gomb mind 6');
    } },
  { settle: 3.2,
    enter() { S7.reset(); },
    controls(L) {
      L.button(lab('gomb Rogerius'), () => S7.set(0, L.st), 'gomb Rogerius'); L.button(lab('gomb Tamás'), () => S7.set(1, L.st), 'gomb Tamás');
      L.button(lab('gomb mind 7'), () => S7.set(null, L.st), 'gomb mind 7');
    } },
  { settle: 5.2,
    enter() { if (P8) P8.reset(); },
    controls(L) { ['gomb 1241', 'gomb 1270', 'gomb 1300'].forEach((k, i) => L.button(lab(k), () => P8.take(i, L.st), k)); } },
  { settle: 3.6 },
];

L = Lesson.create({
  content: window.LESSON_CONTENT,
  home: false,
  steps: STEPS,
  init(Lx) {
    L = Lx; c = L.ctx;
    MAPW = TortMap.create({ proj: PROJW, ancient: true, layers: [{ data: window.TORT_MAP_VILAG }] });
    MAP = TortMap.create({ proj: PROJ, ancient: true, layers: [{ data: window.TORT_MAP_MEDITERRAN }, { data: window.TORT_MAP_KARPAT, fade: [4500, 7500] }] });
    BT = TortBattle.create(L);
    SRC = TortSource.create(L, { 'forrás': K('forrás jel'), 'rekonstrukció': K('rekonstrukció jel'), 'monda': K('monda jel'), 'becslés': K('becslés'), 'vázlatos': K('vázlatos'), 'illusztráció': K('illusztráció'), 'vitatott': K('vitatott') });
    TT = { bc: K('Kr. e.'), ad: K('Kr. u.'), cent: K('század'), years: K('év sablon') };
    TL9 = TortTimeline.create(L, { x0: 70, x1: 1290, y: 640, h: 64, T: TT, src: SRC, bounds: [1150, 1400] });
    VIEW0 = TortMap.fit(PROJW, [12, 26, 126, 62], [24, 24, 1312, 590]);
    G = geom(); COLS = cols2(); BLOBS = blobs2();
    const fit = (b, r) => TortMap.fit(PROJ, b, r);
    const M0 = LL('Muhi helye'), dl = 6800 / (111320 * Math.cos(M0[1] * Math.PI / 180)), dn = 5200 / 110540;
    VIEWS = { 1: fit([13.4, 43.3, 27.6, 52.0], [30, 30, 1300, 830]), 2: fit([16.4, 43.4, 28.4, 49.4], [30, 30, 1300, 740]),
      3: fit([M0[0] - dl, M0[1] - dn, M0[0] + dl, M0[1] + dn], [30, 170, 1300, 690]),
      4: fit([13.8, 42.9, 22.4, 49.0], [30, 30, 790, 1020]), 7: fit([13.8, 42.9, 22.4, 49.0], [30, 30, 790, 1020]) };
    CAM = TortMap.camera(PROJ);
    P1.lvl = TB.player([[1.2, 0], [2.4, 1], [3.6, 2], [4.8, 3]]);
    const d0 = D0(), m = DAY('muhi csata');
    P2 = TB.player([[0.4, d0], [1.8, DAY('betörés') + 4], [3.0, DAY('Radna eleste') + 4], [5.6, m + 22]], { dur: .3 });
    P4 = TB.player([[0.6, 0], [1.8, .2], [3.0, .4], [4.2, .6], [5.4, .8], [7.0, 1]]);
    P8 = TB.player([[0.6, 0], [2.0, 1], [3.6, 2]], { dur: .6 });
    SC5 = TortScene.create({ L, frame: [840, 40, 490, 1000], r: 18,
      views: { both: { x: 245, y: 500, z: 1 }, earth: { x: 270, y: 300, z: 1.7 }, stone: { x: 270, y: 770, z: 1.7 } },
      layers: [{ id: 'vár', draw: drawCastles }],
      hotspots: [{ id: 'sánc', x: 455, y: 400, k: 'h sánc', info: 'h sánc info', dx: -26 }, { id: 'cölöp', x: 420, y: 320, k: 'h cölöp', info: 'h cölöp info', dx: -26 },
        { id: 'kőfal', x: 430, y: 724, k: 'h kőfal', info: 'h kőfal info', dx: -26 }, { id: 'szikla', x: 440, y: 850, k: 'h szikla', info: 'h szikla info', dx: -26 }],
      stampK: 'illusztráció' });
    SC5.attach((id) => { if (L.step !== 4) return; S5.sel = id && id !== S5.sel ? id : null; });
    L.players = { P1: P1.lvl, P2, P4, P8 };   // QA-hoz
    L.s5 = S5;
  },
  draw(Lx) {
    L = Lx; c = L.ctx; GA = 1; paper(); grid(.045);
    const sp = L.sp, wt = (i) => clamp(1 - Math.abs(sp - i) * 2);
    sT[L.step] = L.st;
    if (wt(0) > .005) scene0(sT[0], wt(0), L.step === 0);
    mapScenes(wt);
    if (wt(5) > .005) scene6(sT[5], wt(5));
    if (wt(6) > .005) scene7(sT[6], wt(6));
    if (wt(8) > .005) scene9(sT[8], wt(8));
    c.globalAlpha = 1;
  },
});
})();
