<script>
'use strict';
/* ── MODUL: Térkép (TortMap) ──────────────────────────────────────────────────────────────
   Térképmotor a történelemleckékhez. Lecke-független: változtatás nélkül átemelhető a
   shared/tort/ alá (pl. shared/tort/map.js). Függ: TortProj (shared/tort/proj.js), a
   shared/tort/map-*.js adatfájlok, és a lecke-motor L objektuma a feliratokhoz (L.tx, L.measure,
   L.pill, L.fonts, L.U – így a QA és a review mód minden térképfeliratot lát).

   const map = TortMap.create({
     proj:    TortProj.lcc({lon0: 20, lat0: 38, lat1: 30, lat2: 46}),   // a lecke egyetlen vetülete
     layers:  [{data: TORT_MAP_VILAG},                                  // durvától a finomig; a finomabb réteg
               {data: TORT_MAP_MEDITERRAN},                             //   csak a saját kivágatában rajzol,
               {data: TORT_MAP_KARPAT, fade: [4500, 7500]}],             //   fade: [s0, s1] között úszik be (s = px/Föld-sugár)
     borders: TORT_MAP_HATAROK,   // opcionális: a „mai határok” réteg adata
     ancient: true,               // a modern: 1 elemek (víztározó, csatorna) kimaradnak
     rect:    [0, 0, 1360, 1080], // a feliratok elhelyezési területe (alap: a vizuális terület)
   });

   KAMERA
     TortMap.fit(proj, [lonMin, latMin, lonMax, latMax], [x, y, w, h], pad?) → nézet {lon, lat, s, x, y}
     TortMap.lerp(proj, a, b, u)    nézet a és b között (u 0..1): fix pont körüli zoom + pan, s logaritmikusan
                                    (nagy zoomnál is természetes: egy pont végig ugyanott marad a képernyőn)
     const cam = TortMap.camera(proj)
     cam.go(nézet, t, dur)          átmenet indítása a jelenlegi állásból (t: tetszőleges óra, pl. L.st)
     cam.at(t) → nézet              a t időpillanat nézete (inOut lassítással); visszafelé lépésnél rövid dur-t adj
     TortMap.zfade(V, s0, s1)       0..1: hol tart V.s az [s0, s1] között (log.) – rétegek ki-/beúsztatása zoomra

   KÉPKOCKÁNKÉNT (a sorrend: frame → base → region / line / saját rajz → labels)
     const V = map.frame(nézet)     beállítja a kamerát; V = TortProj.view (V.pt, V.inv, V.s)
     map.base(ctx, o)               tenger, szárazföld, hegységfoltok, folyók, tavak, partvonal.
                                    o = {rivers: {rank: 6 | [r0, r1, r2] (rétegenként), hi: {'Duna': {w: 5, wkm: .4, c}}
                                         (9 px fölött part + világos víz),
                                         only: ['Duna', …]}, mountains: 0..1 (alfa), lakes: true, style: {sea, land, …}}
     map.borders(ctx, a)            mai határok, halvány szaggatott vonal (a: alfa); mellé: TortMap.stamp(„mai határok”)
     map.region(ctx, items, o)      lágy szélű folt(ok) EGY rétegben (az átfedés nem sötétedik):
                                    items = [{blobs: [[lon, lat, km], …]} | {poly: [[lon, lat], …]}, a: 0..1]
                                    o = {color, alpha (alap .4), blur (px, alap 14), land: true (szárazföldre vágva,
                                         a tavak kivételével)}
     map.line(ctx, pts, o)          vonal / animált nyíl: pts = [[lon, lat], …];
                                    o = {p: 0..1 (haladás), color, w (px), wkm (szélesség km-ben, min. w), dash,
                                         head: true (nyílhegy), halo: true, smooth: true, cap} → {x, y, ang, len}
     map.labels(L, items, o)        ütközésmentes címkézés (prioritás szerint, mohón; a korábbi helyet megtartja):
                                    items = [{id, lon, lat | x, y, s, k, sub, sk, pri, r (jel sugara, 0: nincs),
                                              dot (alap pontot rajzol), size, w, f, i, c, subc, a, dirs, force}]
                                    dirs: ['E','W','N','S','NE','SE','NW','SW'] (alap) vagy ['C'] (területnév középen);
                                    ha a közeli helyek foglaltak, távolabb, szaggatott vezetővonallal próbálja.
                                    o = {avoid: [{x, y, w, h}], rect} → az elhelyezett dobozok [{id, x, y, w, h}]
     map.scale(L, x, y, o)          méretarány-vonalzó kerek km-értékkel; o = {k: felirat-kulcs („# km”), max: px}
   SEGÉDEK
     map.pt(lon, lat) → [x, y] (másolat) · map.ppk(lon, lat) → px / km ott · map.river(név) → [[lon, lat], …]
     TortMap.slice(line, a, b)      a vonal a- és b-hez ([lon, lat]) legközelebbi csúcsa közötti szakasza
     TortMap.nearest(line, p)       {i, p}: a p-hez legközelebbi csúcs
     TortMap.spline(pts, n, closed) Catmull–Rom simítás (n pont szakaszonként)
     TortMap.offset(lon, lat, kelet_m, észak_m) → [lon, lat] (helyi alaprajzokhoz méterben)
     TortMap.stamp(L, s, x, y, o)   bélyeg („vázlatos”, „mai határok”, „becslés”): −3°, Bricolage 22 px 600, keret;
                                    o = {k, est: true → okker, a: 'left' | 'center' | 'right'} → doboz
   Rétegek keverése: a durva réteg a finomabb kivágatán kívül teljes erővel, belül (1 − alfa)-val rajzol.
   Teljesítmény: a kivágaton kívüli gyűrűk kimaradnak; a foltok negyed felbontású pufferben mosódnak el.
   ───────────────────────────────────────────────────────────────────────────────────────── */
const TortMap = (() => {
  'use strict';
  const TP = window.TortProj;
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const smooth = (t) => { t = clamp(t); return t * t * (3 - 2 * t); };
  const inOut = (t) => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
  const DEF = { sea: 'rgba(70,150,215,.22)', land: '#f5eddd', coast: '#1b5a94', coastW: 1.5, river: '#1b5a94',
    lake: '#c6dbe8', lakeLine: '#1b5a94', mtn: '#7a623e', border: '#1c2440', ink: '#1c2440', muted: '#565d72',
    halo: 'rgba(250,246,238,.94)', card: '#fffaf1', est: '#8f5a0c' };
  const R_KM = 6371;

  function ringBox(r) {
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (let i = 0; i < r.length; i += 2) { const x = r[i], y = r[i + 1]; if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    return [x0, y0, x1, y1];
  }
  function boxRing(b, n = 24) {
    const o = [];
    for (let i = 0; i < n; i++) o.push(b[0] + (b[2] - b[0]) * i / n, b[1]);
    for (let i = 0; i < n; i++) o.push(b[2], b[1] + (b[3] - b[1]) * i / n);
    for (let i = 0; i < n; i++) o.push(b[2] - (b[2] - b[0]) * i / n, b[3]);
    for (let i = 0; i < n; i++) o.push(b[0], b[3] - (b[3] - b[1]) * i / n);
    return Float64Array.from(o);
  }
  const hit = (a, b) => a[0] <= b[2] && a[2] >= b[0] && a[1] <= b[3] && a[3] >= b[1];
  const parts = (arr) => (arr || []).map((r) => ({ r, b: ringBox(r) }));

  function fit(proj, b, rect, pad) { return TP.fit(proj, b, rect, pad); }

  function lerp(proj, a, b, u) {
    if (u <= 0) return a; if (u >= 1) return b;

/* ── 8: magyarul olvasni ── */
const E8 = [
  { id: 'Buda', yk: 'Budai krónika', kind: 'könyv', e: 'e Buda' },
  { id: 'Sárospatak', yk: 'Sárospataki iskola', kind: 'iskola', e: 'e Sárospatak', e2: 'e Sárospatak 2' },
  { id: 'Krakkó', yk: 'Krakkói könyv', kind: 'könyv', e: 'e Krakkó', e2: 'e Krakkó 2', hi: true },
  { id: 'Sárvár', yk: 'Sylvester Új testamentuma', kind: 'könyv', e: 'e Sárvár', e2: 'e Sárvár 2', hi: true },
  { id: 'Torda', yk: 'tordai országgyűlés', kind: 'törvény', e: 'e Torda', e2: 'e Torda 2', ma: 'Torda ma' },
  { id: 'Vizsoly', yk: 'Vizsolyi Biblia', kind: 'könyv', e: 'e Vizsoly', e2: 'e Vizsoly 2' },
  { id: 'Pozsony', yk: 'Pázmány Kalauza', kind: 'könyv', e: 'e Pozsony', e2: 'e Pozsony 2', ma: 'Pozsony ma' },
  { id: 'Nagyszombat', yk: 'nagyszombati egyetem', kind: 'iskola', e: 'e Nagyszombat', e2: 'e Nagyszombat 2', ma: 'Nagyszombat ma' },
];
const KCOL = { 'könyv': RED, 'iskola': TEAL, 'törvény': OCHRE };
const S8 = { user: false, yr: 1470, sl: null };
function year8(t) { return S8.user ? S8.yr : lerp(A('8 kezdete'), A('8 vége'), inOut(pr(t, .9, 7.0))); }
function over8(a, t) {
  if (a < .02) return; GA = a;
  const yr = year8(t), items = [], avoid = [];
  const LX = 40, LW = 420;
  /* lista (időrendben) */
  al(1);
  const ord = E8.slice().sort((p, q) => dat(p.yk).v - dat(q.yk).v);
  const lines2 = ord.map((e) => (e.e2 ? SRC.wrap(lab(e.e2), LW - 76, { s: 22, w: 500 }) : []));
  const LH = 196 + ord.reduce((s, e, i) => s + 44 + lines2[i].length * 27, 0) - 30;
  box(LX, 40, LW, LH, { r: 16 });
  L.tx(lab('térkép 8 cím'), LX + 22, 92, { f: F.D, s: 32, w: 600, c: INK, k: 'térkép 8 cím', max: LW - 44 });
  L.tx(String(Math.floor(yr + 1e-6)), LX + LW - 22, 150, { f: F.M, s: 44, w: 700, a: 'right', c: RED, k: 'csúszka év 8' });
  let yy = 196;
  for (const [ei, e] of ord.entries()) {
    const d = dat(e.yk), on = yr >= d.v, f = on ? 1 : .22;
    al(f);
    icon(e.kind, LX + 30, yy - 8, .9, KCOL[e.kind]);
    const yb = L.tx(YS(e.yk), LX + 54, yy, { f: F.M, s: 22, w: 700, c: e.hi ? RED : INK, k: e.yk });
    L.tx(lab(e.e), LX + 54 + yb.w + 12, yy, { s: 22, w: 700, c: INK, k: e.e, max: LW - 80 - yb.w - 12 });
    yy += 28;
    if (e.e2) { lines2[ei].forEach((s) => { L.tx(s, LX + 54, yy, { s: 22, w: 500, c: MUT, k: e.e2 }); yy += 27; }); }
    yy += 16;
  }
  avoid.push({ x: LX, y: 40, w: LW, h: LH });
  /* a térkép pontjai */
  for (const e of E8) {
    const d = dat(e.yk), p = LL(e.id + ' helye'), q = MAP.pt(p[0], p[1]), on = yr >= d.v;
    const f = clamp((yr - d.v) / 4);
    if (on && f < 1) { al(1 - f); c.beginPath(); c.arc(q[0], q[1], 16 + f * 30, 0, TAU); c.strokeStyle = KCOL[e.kind]; c.lineWidth = 3.5; c.stroke(); }
    al(on ? 1 : .4);
    c.beginPath(); c.arc(q[0], q[1], 16, 0, TAU); c.fillStyle = CARD; c.fill(); c.strokeStyle = on ? KCOL[e.kind] : rgba(INK, .4); c.lineWidth = 3; c.stroke();
    icon(e.kind, q[0], q[1] + 1, .64, on ? KCOL[e.kind] : '#b9b3a6');
    items.push({ id: e.id, lon: p[0], lat: p[1], r: 19, s: lab(e.id), k: e.id, sub: e.ma ? lab(e.ma) : null, sk: e.ma, pri: on ? 8 : 4, size: 24, w: 700, a: on ? 1 : .5 });
  }
  /* jelmagyarázat */
  al(1);
  const LF = { s: 22, w: 600 }, kinds = [['könyv', 'jel könyv'], ['iskola', 'jel iskola'], ['törvény', 'jel törvény']];
  let lx = 500; const ly = 1000;
  const wtot = kinds.reduce((s, [, k]) => s + L.measure(lab(k), LF).w + 64, 0) + 20;
  box(lx - 14, ly - 30, wtot, 56);
  kinds.forEach(([kind, k]) => { icon(kind, lx + 14, ly - 2, .8, KCOL[kind]); const b = L.tx(lab(k), lx + 36, ly + 6, Object.assign({ c: INK, k }, LF)); lx += b.w + 64; });
  avoid.push({ x: 486, y: ly - 30, w: wtot, h: 56 });
  /* tévhit */
  const m = mythPill('tévhit 8', 1320, 60, pr(t, 1.2, 1.8), pr(t, 4.4, 5.0), 'right');
  if (m) avoid.push(m);
  const fa = pr(t, 5.0, 5.5);
  if (fa > .02 && m) { al(fa); const q = L.pill(tpl('cáfolat 8', val('Krakkói könyv')), 1320, m.y + m.h + 34, { s: 26, w: 700, a: 'right', bg: GOOD, c: '#ffffff', pad: 12, r: 10, k: ['cáfolat 8', 'Krakkói könyv'] }); avoid.push(q); }
  al(1); MAP.labels(L, items, { avoid });
  al(1); MAP.scale(L, 1120, 1040, { k: 'lépték', max: 160 });
}

/* ── 9: összefoglalás ── */
function over9(a, t) {
  if (a < .02) return; GA = a;
  al(pr(t, 0, .5)); L.tx(lab('ö cím'), 70, 110, { f: F.D, s: 44, w: 600, c: INK, k: 'ö cím' });
  const u0 = A('ö kezdete'), u1 = A('ö vége') + 1;
  al(1); TL9.view(u0, u1);
  TL9.draw({ cent: 1, bands: [{ u0: Math.floor(A('Gutenberg műhelye')), u1, col: 'rgba(10,111,134,.13)' }],
    caption: { s: lab('ö nyomtatás'), k: 'ö nyomtatás', right: true },
    eras: [{ u0: Math.floor(A('Luther levele')), u1, name: K('ö reformáció'), col: RED }], eraA: 1 });
  const ev = (tk, dk, row, layer, o = {}) => {
    const d = dat(dk), u = o.u != null ? o.u : Yr.u(d);
    return { u, row, layer, title: K(tk), date: { s: o.ds || (d.t === 'date' ? String(Math.floor(d.a)) : YS(dk)), k: o.dk || dk }, est: !!(o.est != null ? o.est : d.est), a: pr(t, .3 + row * .25 + (u - u0) / 300, .8 + row * .25 + (u - u0) / 300), hi: !!o.hi };
  };
  const g0 = dat('Gutenberg-Biblia, legkorábban'), g1 = dat('Gutenberg-Biblia, legkésőbb');
  al(1);
  TL9.cards([

    ev('ö Gutenberg', 'Gutenberg-Biblia, legkorábban', 0, 'forrás', { u: (g0.a + g1.a + 1) / 2, ds: Yr.range(g0.a, g1.a, T), dk: ['Gutenberg-Biblia, legkorábban', 'Gutenberg-Biblia, legkésőbb'], est: g0.est || g1.est }),
    ev('ö Buda', 'Budai krónika', 1, 'forrás'),
    ev('ö Luther', 'Luther levele', 0, 'forrás', { hi: true }),
    ev('ö Krakkó', 'Krakkói könyv', 1, 'forrás'),
    ev('ö Sylvester', 'Sylvester Új testamentuma', 2, 'forrás'),
    ev('ö Torda', 'tordai országgyűlés', 0, 'forrás'),
    ev('ö Vizsoly', 'Vizsolyi Biblia', 1, 'forrás'),
    ev('ö Nagyszombat', 'nagyszombati egyetem', 2, 'forrás'),
  ].sort((p, q) => q.row - p.row), { pitch: 118 });
  /* a három réteg ebben a leckében */
  let y = 966; const ca = pr(t, 2.2, 2.8);
  al(ca);
  const chip = (kind, k, x) => {
    const col = kind === 'forrás' ? TEAL : kind === 'monda' ? OCHRE : kind === 'becslés' ? OCHRE : INK;
    const tk = kind === 'becslés' ? 'becslés' : kind + ' jel', tag = lab(tk);
    const m = L.measure(lab(k), { s: 22, w: 600 }).w, m0 = L.measure(tag, { s: 22, w: 700 }).w, w = m + m0 + 46;
    rr(x, y - 22, w, 44, kind === 'monda' ? 16 : 10); c.fillStyle = kind === 'monda' ? 'rgba(244,232,206,.98)' : 'rgba(255,250,241,.96)'; c.fill();
    c.strokeStyle = col; c.lineWidth = 2.5; if (kind === 'rekonstrukció') c.setLineDash([8, 6]); c.stroke(); c.setLineDash([]);
    L.tx(tag, x + 14, y + 8, { s: 22, w: 700, c: col, k: tk });
    L.tx(lab(k), x + 32 + m0, y + 8, { s: 22, w: 600, c: INK, k });
    return x + w + 12;
  };
  let x = 70; x = chip('forrás', 'ö forrás', x); chip('rekonstrukció', 'ö rekonstrukció', x);
  y = 1018; x = 70; x = chip('monda', 'ö monda', x); chip('becslés', 'ö becslés', x);
}

/* ════════ rajz ════════ */
function draw() {
  background();
  if (L.step >= 0) sT[L.step] = L.st;
  const cur = L.step, t = L.t;
  /* a jelenet (1–3. lépés) */
  const ws = Math.max(stepW(0), stepW(1), stepW(2));
  if (ws > .005) {
    const camv = cur <= 2 ? sceneCam(cur, L.st) : VIEWS.mindketto;
    c.save(); c.globalAlpha = ws; SCN.render(c, { cam: camv, t }); c.restore();
    GA = ws;
    over1(stepW(0), sT[0]); over2(stepW(1), sT[1]); over3(stepW(2), sT[2]);
    if (cur <= 1) {
      const ma = stepW(cur) * clamp((L.st - 1.0) / .6);
      c.save(); c.globalAlpha = ma; SCN.markers(c, { ids: HOT[cur], alpha: 1, sel: st.sel, t }); c.restore();
      if (st.sel) { c.save(); c.globalAlpha = 1; SCN.card(c, st.sel, { x: 58, y: 126, w: 500, alpha: ma * clamp((L.st - st.selT) / .3) }); c.restore(); }
      else { GA = ma; al(clamp((L.st - 3) / .6)); L.pill(lab('kattints'), 690, 78, { s: 22, w: 600, a: 'center', bg: RED, c: CARD, pad: 12, k: 'kattints' }); }
    } else if (L.stage) L.stage.style.cursor = '';
    c.save(); c.globalAlpha = ws; SCN.decor(c, 1); c.restore();
  }
  /* a térkép (4., 5., 8. lépés) */
  const wm = Math.max(stepW(3), stepW(4), stepW(7));
  if (wm > .005) {
    const mi = [3, 4, 7].reduce((b, i) => (stepW(i) > stepW(b) ? i : b), 3);
    const V = [3, 4, 7].includes(cur) ? mapView(cur, L.st) : (mi === 3 ? V4 : mi === 4 ? V5 : V8);
    c.save(); c.globalAlpha = wm; MAP.frame(V);
    MAP.base(c, { mountains: .14, rivers: { rank: [4, 5, 8], hi: { 'Duna': { w: 3.4 }, 'Rajna': { w: 2.6 } } } });
    c.restore();
    over4(stepW(3), sT[3]); over5(stepW(4), sT[4]); over8(stepW(7), sT[7]);
  }
  over6(stepW(5), sT[5]);
  over7(stepW(6), sT[6]);
  over9(stepW(8), sT[8]);
  c.globalAlpha = 1;
}

/* ════════ a lecke ════════ */
const SETTLE = [5.5, 6.5, 7.6, 8, 7.6, 3.4, 5, 7.6, 4];
const steps = SETTLE.map((s, i) => ({
  settle: s,
  enter(Lx) {
    st.sel = null; cam.prev = Lx.prevStep;
    if (i === 2) Object.assign(S3, { rs: dat('másoló teljesítménye').v, rp: dat('prés teljesítménye').v });
    if (i === 3) S4.user = false;
    if (i === 4) S5.user = false;
    if (i === 5) Object.assign(S6, { sel: null, prev: null, t0: -9 });
    if (i === 7) S8.user = false;
  },
}));
steps[2].controls = (L) => {
  const ds = dat('másoló teljesítménye'), dp = dat('prés teljesítménye');

};
steps[3].controls = (L) => {
  S4.sl = L.slider({ label: lab('csúszka év'), k: 'csúszka év', min: dat('térkép kezdete').v, max: dat('térkép vége').v, step: 1, value: dat('térkép kezdete').v, format: (v) => String(v), onInput: (v) => { S4.user = true; S4.yr = v; } });
};
steps[4].controls = (L) => {
  const m = T5();
  S5.sl = L.slider({ label: lab('csúszka idő'), k: 'csúszka idő', min: m.a0, max: m.a1, step: .005, value: m.a0, format: (v) => dateStr(v).s, onInput: (v) => { S5.user = true; S5.a = v; } });
};
steps[5].controls = (L) => {
  const bs = [];
  const set = (sel, b) => { S6.prev = S6.sel; S6.sel = sel; S6.t0 = L.st; if (L.st < 3) { L.st = 3; S6.t0 = 3; } bs.forEach((x) => x.classList.toggle('on', x === b)); };
  [['gomb forrás', 'forrás'], ['gomb rekonstrukció', 'rekonstrukció'], ['gomb monda', 'monda'], ['gomb mind', null]].forEach(([k, sel]) => bs.push(L.button(lab(k), (b) => set(sel, b), k)));
};
steps[7].controls = (L) => {
  S8.sl = L.slider({ label: lab('csúszka év 8'), k: 'csúszka év 8', min: dat('8 kezdete').v, max: dat('8 vége').v, step: 1, value: dat('8 kezdete').v, format: (v) => String(v), onInput: (v) => { S8.user = true; S8.yr = v; } });
};

L = Lesson.create({
  content: window.LESSON_CONTENT,
  home: false,
  steps,
  init(Lx) {
    L = Lx; c = L.ctx;

    TL9 = TortTimeline.create(L, { x0: 70, x1: 1270, y: 740, h: 56, T, src: SRC });
    PROJ = TortProj.lcc({ lon0: 12, lat0: 47, lat1: 40, lat2: 54 });
    V4 = TortMap.fit(PROJ, [-6.5, 37.6, 24.5, 55.4], [40, 30, 1290, 1020]);
    V5 = TortMap.fit(PROJ, [4.8, 45.8, 21.0, 54.6], [40, 30, 1290, 1020]);
    V8 = TortMap.fit(PROJ, [16.3, 45.9, 24.4, 50.5], [470, 50, 860, 980]);
    MAP = TortMap.create({ proj: PROJ, ancient: true, layers: [{ data: window.TORT_MAP_VILAG }, { data: window.TORT_MAP_MEDITERRAN },
      { data: window.TORT_MAP_KARPAT, fade: [V5.s * 1.2, V8.s * .85] }] });
    SCN = TortScene.create({
      L, frame: [36, 36, 1308, 1008], stampK: 'illusztráció', views: VIEWS,
      layers: [{ id: 'termek', draw: drawRooms }],
      hotspots: [
        { id: 'másoló', x: 548, y: 640, k: 'pont másoló', info: 'pont másoló szöveg', dx: -60, dy: 60 },
        { id: 'lúdtoll', x: 600, y: 520, k: 'pont lúdtoll', info: 'pont lúdtoll szöveg', dx: -30, dy: -70 },
        { id: 'pergamen', x: 246, y: 660, k: 'pont pergamen', info: 'pont pergamen szöveg', dx: 0, dy: -64 },
        { id: 'minta', x: 970, y: 446, k: 'pont minta', info: 'pont minta szöveg', dx: 30, dy: -70 },
        { id: 'díszítés', x: 856, y: 432, k: 'pont díszítés', info: 'pont díszítés szöveg', dx: -30, dy: -120 },
        { id: 'szedés', x: RB + 170, y: 500, k: 'pont szedés', info: 'pont szedés szöveg', dx: 0, dy: -70 },
        { id: 'betűöntés', x: RB + 1208, y: 548, k: 'pont betűöntés', info: 'pont betűöntés szöveg', dx: -30, dy: -90 },
        { id: 'festék', x: RB + 536, y: 512, k: 'pont festék', info: 'pont festék szöveg', dx: -30, dy: -110 },

    L.s3 = S3; L.s6 = S6; L.scn = SCN;   // QA-hoz
  },
  draw(Lx) {

    if (L.step === 3 && S4.sl && !S4.user) S4.sl.set(Math.floor(year4(L.st) + 1e-6));

});
})();
