<script>
'use strict';

/* ── MODUL: Térkép (TortMap) ──────────────────────────────────────────────────────────────
   Térképmotor a történelemleckékhez. Lecke-független: változtatás nélkül átemelhető a
   shared/tort/ alá (pl. shared/tort/map.js). Függ: TortProj (shared/tort/proj.js), a
   shared/tort/map-*.js adatfájlok, és a lecke-motor L objektuma a feliratokhoz (L.tx, L.measure,
   L.pill, L.fonts, L.U – így a QA és a review mód minden térképfeliratot lát).

   const map = TortMap.create({
     proj:    TortProj.lcc({lon0: 20, lat0: 38, lat1: 30, lat2: 46}),   // a lecke egyetlen vetülete
     layers:  [{data: TORT_MAP_VILAG},                                  // durvától a finomig; a finomabb réteg
               {data: TORT_MAP_MEDITERRAN},                             //   csak a saját kivágatában rajzol,
               {data: TORT_MAP_KARPAT, fade: [4500, 7500]}],             //   fade: [s0, s1] között úszik be (s = px/Föld-sugár)
     borders: TORT_MAP_HATAROK,   // opcionális: a „mai határok” réteg adata
     ancient: true,               // a modern: 1 elemek (víztározó, csatorna) kimaradnak
     rect:    [0, 0, 1360, 1080], // a feliratok elhelyezési területe (alap: a vizuális terület)
   });

   KAMERA
     TortMap.fit(proj, [lonMin, latMin, lonMax, latMax], [x, y, w, h], pad?) → nézet {lon, lat, s, x, y}
     TortMap.lerp(proj, a, b, u)    nézet a és b között (u 0..1): fix pont körüli zoom + pan, s logaritmikusan
                                    (nagy zoomnál is természetes: egy pont végig ugyanott marad a képernyőn)
     const cam = TortMap.camera(proj)
     cam.go(nézet, t, dur)          átmenet indítása a jelenlegi állásból (t: tetszőleges óra, pl. L.st)
     cam.at(t) → nézet              a t időpillanat nézete (inOut lassítással); visszafelé lépésnél rövid dur-t adj
     TortMap.zfade(V, s0, s1)       0..1: hol tart V.s az [s0, s1] között (log.) – rétegek ki-/beúsztatása zoomra

   KÉPKOCKÁNKÉNT (a sorrend: frame → base → region / line / saját rajz → labels)
     const V = map.frame(nézet)     beállítja a kamerát; V = TortProj.view (V.pt, V.inv, V.s)
     map.base(ctx, o)               tenger, szárazföld, hegységfoltok, folyók, tavak, partvonal.
                                    o = {rivers: {rank: 6 | [r0, r1, r2] (rétegenként), hi: {'Duna': {w: 5, wkm: .4, c}}
                                         (9 px fölött part + világos víz),
                                         only: ['Duna', …]}, mountains: 0..1 (alfa), lakes: true, style: {sea, land, …}}
     map.borders(ctx, a)            mai határok, halvány szaggatott vonal (a: alfa); mellé: TortMap.stamp(„mai határok”)
     map.region(ctx, items, o)      lágy szélű folt(ok) EGY rétegben (az átfedés nem sötétedik):
                                    items = [{blobs: [[lon, lat, km], …]} | {poly: [[lon, lat], …]}, a: 0..1]
                                    o = {color, alpha (alap .4), blur (px, alap 14), land: true (szárazföldre vágva,
                                         a tavak kivételével)}
     map.line(ctx, pts, o)          vonal / animált nyíl: pts = [[lon, lat], …];
                                    o = {p: 0..1 (haladás), color, w (px), wkm (szélesség km-ben, min. w), dash,
                                         head: true (nyílhegy), halo: true, smooth: true, cap} → {x, y, ang, len}
     map.labels(L, items, o)        ütközésmentes címkézés (prioritás szerint, mohón; a korábbi helyet megtartja):
                                    items = [{id, lon, lat | x, y, s, k, sub, sk, pri, r (jel sugara, 0: nincs),
                                              dot (alap pontot rajzol), size, w, f, i, c, subc, a, dirs, force}]
                                    dirs: ['E','W','N','S','NE','SE','NW','SW'] (alap) vagy ['C'] (területnév középen);
                                    ha a közeli helyek foglaltak, távolabb, szaggatott vezetővonallal próbálja.
                                    o = {avoid: [{x, y, w, h}], rect} → az elhelyezett dobozok [{id, x, y, w, h}]
     map.scale(L, x, y, o)          méretarány-vonalzó kerek km-értékkel; o = {k: felirat-kulcs („# km”), max: px}
   SEGÉDEK
     map.pt(lon, lat) → [x, y] (másolat) · map.ppk(lon, lat) → px / km ott · map.river(név) → [[lon, lat], …]
     TortMap.slice(line, a, b)      a vonal a- és b-hez ([lon, lat]) legközelebbi csúcsa közötti szakasza
     TortMap.nearest(line, p)       {i, p}: a p-hez legközelebbi csúcs
     TortMap.spline(pts, n, closed) Catmull–Rom simítás (n pont szakaszonként)
     TortMap.offset(lon, lat, kelet_m, észak_m) → [lon, lat] (helyi alaprajzokhoz méterben)
     TortMap.stamp(L, s, x, y, o)   bélyeg („vázlatos”, „mai határok”, „becslés”): −3°, Bricolage 22 px 600, keret;
                                    o = {k, est: true → okker, a: 'left' | 'center' | 'right'} → doboz
   Rétegek keverése: a durva réteg a finomabb kivágatán kívül teljes erővel, belül (1 − alfa)-val rajzol.
   Teljesítmény: a kivágaton kívüli gyűrűk kimaradnak; a foltok negyed felbontású pufferben mosódnak el.
   ───────────────────────────────────────────────────────────────────────────────────────── */
const TortMap = (() => {
  'use strict';
  const TP = window.TortProj;
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const smooth = (t) => { t = clamp(t); return t * t * (3 - 2 * t); };
  const inOut = (t) => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
  const DEF = { sea: 'rgba(70,150,215,.22)', land: '#f5eddd', coast: '#1b5a94', coastW: 1.5, river: '#1b5a94',
    lake: '#c6dbe8', lakeLine: '#1b5a94', mtn: '#7a623e', border: '#1c2440', ink: '#1c2440', muted: '#565d72',
    halo: 'rgba(250,246,238,.94)', card: '#fffaf1', est: '#8f5a0c' };
  const R_KM = 6371;

  function ringBox(r) {
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (let i = 0; i < r.length; i += 2) { const x = r[i], y = r[i + 1]; if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    return [x0, y0, x1, y1];
  }
  function boxRing(b, n = 24) {
    const o = [];
    for (let i = 0; i < n; i++) o.push(b[0] + (b[2] - b[0]) * i / n, b[1]);
    for (let i = 0; i < n; i++) o.push(b[2], b[1] + (b[3] - b[1]) * i / n);
    for (let i = 0; i < n; i++) o.push(b[2] - (b[2] - b[0]) * i / n, b[3]);
    for (let i = 0; i < n; i++) o.push(b[0], b[3] - (b[3] - b[1]) * i / n);
    return Float64Array.from(o);

    { id: 'lon', u: Yr.u(D('londoni olimpia')), title: { s: lab('tl 1908'), k: ['tl 1908', 'londoni maratoni táv'] }, date: { s: L.val('londoni olimpia'), k: 'londoni olimpia' }, note: { s: lab('tl 1908 megjegyzés'), k: ['tl 1908 megjegyzés', 'a táv rögzítése'], c: MUT } },
  ];
}
/* kártyaelrendezés (rögzített nézet): két sor, a vezetővonalak nem futnak át másik kártyán.
   Az ókori események pár száz pixelen belül vannak, ezért a kártyák egymáshoz igazodnak. */
function tlLayout(its) {
  const by = {}; its.forEach((x) => { by[x.id] = x; x.xe = TL.x(x.u); x.z = TL.cardSize(x); });
  const b0 = TL.top - 34, b1 = b0 - 130, put = (x, row, left) => { x.row = row; x.x = left; x.y = (row ? b1 : b0) - x.z.h; };
  const { oly, mar, mon, utl, uj, lon } = by;
  put(oly, 1, Math.max(30, oly.xe - oly.z.w / 2));
  put(mar, 0, Math.max(mar.xe - mar.z.w / 2, oly.xe + 18));
  put(mon, 1, Math.max(mon.xe - mon.z.w / 2, oly.x + oly.z.w + 16));
  put(utl, 0, Math.max(utl.xe - utl.z.w / 2, mon.xe + 20));
  put(uj, 0, uj.xe - 10 - uj.z.w);
  put(lon, 1, Math.min(lon.xe - lon.z.w / 2, 1340 - lon.z.w));
  return its;
}
function tlCards(its) {
  const yb = TL.top - 22;
  for (const it of its) {
    if (it.a <= .01) continue;
    al(it.a);
    const xl = clamp(it.xe, it.x + 14, it.x + it.z.w - 14);
    c.strokeStyle = U.rgba(INK, .55); c.lineWidth = 2; c.beginPath(); c.moveTo(xl, it.y + it.z.h); c.lineTo(xl, yb); c.lineTo(it.xe, TL.top - 2); c.stroke();
    TL.card(it, it.x, it.y);
    c.beginPath(); c.arc(it.xe, TL.top, 6.5, 0, TAU); c.fillStyle = it.layer ? SRC.COL[it.layer] : INK; c.fill(); c.strokeStyle = CARD; c.lineWidth = 2.5; c.stroke();
  }
}
function scene7(st, w, live) {
  GA = w;
  // összehasonlító táblázat
  const ta = out(pr(st, .1, .7));
  softCard(40, 26, 1300, 236, ta);
  const cx = [62, 330, 830], rows = [['sor ki', 'akkor ki', 'most ki'], ['sor díj', 'akkor díj', 'most díj'], ['sor hol', 'akkor hol', 'most hol'], ['sor mikor', 'akkor mikor', 'most mikor']];
  al(ta); L.tx(lab('akkor cím'), cx[1], 70, { f: F.D, s: 30, w: 600, c: OCH, k: 'akkor cím' }); L.tx(lab('most cím'), cx[2], 70, { f: F.D, s: 30, w: 600, c: TEAL, k: 'most cím' });
  rows.forEach((r, i) => {
    const y = 116 + i * 40, a = ta * out(pr(st, .3 + i * .15, .7 + i * .15));
    al(a); L.tx(lab(r[0]), cx[0], y, { s: 23, w: 700, c: MUT, k: r[0] }); L.tx(lab(r[1]), cx[1], y, { s: 23, w: 600, c: INK, k: r[1] }); L.tx(lab(r[2]), cx[2], y, { s: 23, w: 600, c: INK, k: r[2] });
    if (i < 3) { al(a * .5); c.strokeStyle = LINE; c.lineWidth = 1.5; c.beginPath(); c.moveTo(62, y + 13); c.lineTo(1318, y + 13); c.stroke(); }
  });
  // időszalag
  TL.view(TLV[0], TLV[1]);
  if (live && TL.interact({ snap: tlItems().map((x) => x.u), zoom: false, pan: false, pinY: 760 })) S8.user = true;
  const A = out(pr(st, .4, 1.0));
  al(A); TL.draw({ a: 1, cent: 0, ad: false, sides: true, bands: [{ u0: YA('első olümpia'), u1: YA('utolsó ókori játékok') + 1, col: 'rgba(143,90,12,.18)' }, { u0: YA('első újkori olimpia'), u1: 2100, col: 'rgba(10,111,134,.16)' }] });
  tlCards(tlLayout(tlItems()).map((x, i) => Object.assign(x, { a: out(pr(st, .8 + i * .2, 1.3 + i * .2)) })));
  al(out(pr(st, 2.4, 3.0))); TL.drawPins({ a: 1, pinY: 760, bracket: true, hint: S8.user ? null : K('tű súgó') });
}

/* ════════ 9. Összefoglaló ════════ */
function iconAt(i, x, y) {
  c.save();
  if (i === 0) { for (const [dx, dy, col] of [[-26, 10, '#c8401c'], [8, -16, '#6a4c93'], [26, 18, '#2f6f5e']]) { c.beginPath(); c.arc(x + dx, y + dy, 20, 0, TAU); c.fillStyle = U.rgba(col, .35); c.fill(); c.beginPath(); c.arc(x + dx, y + dy, 6, 0, TAU); c.fillStyle = INK; c.fill(); } }
  else if (i === 1) { person(x - 22, y + 14, 1.0, 'boy', TEAL); person(x + 24, y + 14, 1.0, 'boy', GRK); }
  else if (i === 2) { c.beginPath(); c.arc(x, y, 34, 0, TAU); c.fillStyle = '#d9a75a'; c.fill(); c.lineWidth = 4; c.strokeStyle = BRZ_D; c.stroke(); c.fillStyle = '#7a2e1a'; c.beginPath(); c.arc(x, y, 8, 0, TAU); c.fill(); }
  else if (i === 3) { rr(x - 40, y - 26, 80, 16, 4); c.fillStyle = GRK; c.fill(); rr(x - 40, y + 10, 80, 18, 4); c.fillStyle = PRS; c.fill(); arrowHead(x, y - 2, Math.PI / 2, 9, GRK); }
  else if (i === 4) { SRC.icon('írott', x, y, 70, TEAL); }
  else { c.translate(0, 0); wreath(x, y - 4, 30, 1, 0); }
  c.restore();
}
function scene8(st, w) {
  GA = w;
  const cards = [['ö1 cím', ['ö1 sor']], ['ö2 cím', ['ö2 sor']], ['ö3 cím', ['ö3 sor']], ['ö4 cím', ['ö4 sor']], ['ö5 cím', ['ö5 sor 1', 'ö5 sor 2']], ['ö6 cím', ['ö6 sor']]];
  const dk = { 'ö4 cím': 'marathóni csata', 'ö6 cím': 'első olümpia', 'ö6 sor': 'első újkori olimpia' };
  cards.forEach(([tk, ls], i) => {
    const x = 50 + (i % 2) * 650, y = 48 + Math.floor(i / 2) * 334, a = out(pr(st, .2 + i * .25, .8 + i * .25));
    if (a <= .01) return;
    const layer = i === 4 ? 'forrás' : null;
    al(a); SRC.frame(x, y + (1 - a) * 18, 620, 300, layer, { shadow: true });
    const yy = y + (1 - a) * 18;
    const ty = yy + 150 - (ls.length * 44 + 46) / 2 + 24;
    al(a); iconAt(i, x + 80, yy + 150);
    L.tx(lab(tk), x + 160, ty, { f: F.D, s: 36, w: 600, c: INK, k: dk[tk] ? [tk, dk[tk]] : tk, max: 440 });
    ls.forEach((k, j) => {
      const isMyth = k === 'ö5 sor 2';
      if (isMyth) { const b = L.measure(lab(k), { s: 25, w: 600 }); al(a); c.beginPath(); c.roundRect(x + 150, ty + 58 + j * 44 - 30, b.w + 22, 42, 12); c.fillStyle = 'rgba(201,150,60,.16)'; c.fill(); c.strokeStyle = OCH; c.lineWidth = 2.5; c.stroke(); }
      al(a); L.tx(lab(k), x + 160 + (isMyth ? 1 : 0), ty + 58 + j * 44, { s: 25, w: 600, c: isMyth ? OCH : INK, k: dk[k] ? [k, dk[k]] : k, max: 440 });
    });
  });
}

/* ════════════════════════════════════════════════════════════════ */
const sT = new Array(9).fill(0);
const SCENES = [scene0, scene1, scene2, scene3, scene4, scene5, scene6, scene7, scene8];
const MAPV = { 0: () => V0, 3: (st) => view3(st), 5: () => V5 };
const slider = (S, k, min, max, step, fmtf, per) => L.slider({ label: lab(k), k, min, max, step, value: max, format: fmtf, onInput: (v) => takeOver(S, v, per) });
L = Lesson.create({
  content: window.LESSON_CONTENT,
  home: false,
  steps: [
    { settle: 4.4 },
    { settle: 5.2,
      enter() { S2.user = null; S2.shown = null; },
      controls(L) { S2.slider = slider(S2, 'csúszka életkor', 0, AGE1, 1, (v) => tpl('kurzor', v), .03); S2.slider.set(N('a csúszka kezdőértéke')); } },
    { settle: 5.0,
      enter() { S3.user = null; S3.shown = null; },
      controls(L) { S3.slider = slider(S3, 'csúszka sorköz', .8, 2.0, .05, (v) => fmt(v, 2) + ' m', .3); S3.slider.set(N('zárt sorköz')); } },
    { settle: 7.6 },
    { settle: 8.0,
      enter() { S5.user = null; S5.shown = null; },
      controls(L) { S5.slider = slider(S5, 'csúszka csata', 0, 4, 1, (v) => lab('fázis ' + v), .35); } },
    { settle: 3.2,
      enter() { S6.sel = 'H'; S6.t0 = -9; for (const k in S6.btn) S6.btn[k].classList.toggle('on', k === 'H'); },
      controls(L) { S6.btn = { H: L.button(lab('gomb Hérodotosz'), () => selSrc('H'), 'gomb Hérodotosz'), P: L.button(lab('gomb Plutarkhosz'), () => selSrc('P'), 'gomb Plutarkhosz'), Lk: L.button(lab('gomb Lukianosz'), () => selSrc('Lk'), 'gomb Lukianosz') }; S6.btn.H.classList.add('on'); } },
    { settle: 3.6,
      enter() { S7.on = 0; S7.from = 0; S7.t0 = -9; if (S7.btn.a) { S7.btn.a.classList.add('on'); S7.btn.b.classList.remove('on'); } },
      controls(L) { S7.btn = { a: L.button(lab('gomb vissza'), () => setWomen(0), 'gomb vissza'), b: L.button(lab('gomb nők'), () => setWomen(1), 'gomb nők') }; S7.btn.a.classList.add('on'); } },
    { settle: 3.4,
      enter() { S8.user = false; TL.user = null; TL.pins = [{ u: Yr.u(D('első olümpia')), col: RED }, { u: Yr.u(D('első újkori olimpia')), col: '#6a4c93' }]; },
      leave() { L.stage.style.cursor = ''; } },
    { settle: 2.4 },
  ],
  init(Lx) {
    L = Lx; c = L.ctx;
    T = { bc: K('Kr. e.'), ad: K('Kr. u.'), cent: K('század'), years: K('év sablon') };
    SRC = TortSource.create(L, { 'forrás': K('forrás jel'), 'rekonstrukció': K('rekonstrukció jel'), 'monda': K('monda jel'),
      'becslés': K('becslés'), 'vázlatos': K('vázlatos'), 'illusztráció': K('illusztráció') });
    TL = TortTimeline.create(L, { x0: 70, x1: 1290, y: 650, h: 50, T, src: SRC, bounds: [-1400, 2200], minSpan: 40, maxSpan: 3600 });
    MAP = TortMap.create({ proj: PROJ, ancient: true, layers: [{ data: window.TORT_MAP_MEDITERRAN }] });
    const fit = (b, r) => TortMap.fit(PROJ, b, r);
    V0 = fit([19.6, 34.9, 28.6, 41.3], [20, 20, 1320, 1040]);
    V3a = fit([17.5, 24.5, 50, 44.5], [20, 40, 1560, 1000]);
    V3b = fit([20.8, 35.7, 29.2, 40.3], [20, 30, 1320, 1020]);
    V5 = fit([21.3, 36.75, 24.3, 38.45], [20, 40, 690, 1000]);
    K2 = [[0, 0], [.8, 0], [4.4, N('a csúszka kezdőértéke')]];
    K3 = [[0, 1.8], [1.2, 1.8], [4.0, N('zárt sorköz')]];
  },
  draw(Lx) {
    L = Lx; c = L.ctx; GA = 1; paper(); L.stage.style.cursor = '';
    const sp = L.sp, wt = (i) => clamp(1 - Math.abs(sp - i) * 2);
    if (L.step >= 0) sT[L.step] = L.st;
    // térkép: a legerősebb térképes lépés nézetével
    let mi = -1, mw = 0; for (const k in MAPV) { const v = wt(+k); if (v > mw) { mw = v; mi = +k; } }
    if (mw > .005) { MAP.frame(MAPV[mi](sT[mi])); mapBase(mw); }
    grid(.04);
    for (let i = 0; i < SCENES.length; i++) {
      const w = wt(i); if (w <= .005) continue;
      if (MAPV[i] && i !== mi) continue;            // egyszerre csak egy térképnézet
      GA = w; c.globalAlpha = w; SCENES[i](sT[i], w, L.step === i && Math.abs(sp - i) < .05);
    }
    GA = 1; c.globalAlpha = 1;
  },
});
})();
