<script>
'use strict';

/* ── MODUL: Térkép (TortMap) ──────────────────────────────────────────────────────────────
   Térképmotor a történelemleckékhez. Lecke-független: változtatás nélkül átemelhető a
   shared/tort/ alá (pl. shared/tort/map.js). Függ: TortProj (shared/tort/proj.js), a
   shared/tort/map-*.js adatfájlok, és a lecke-motor L objektuma a feliratokhoz (L.tx, L.measure,
   L.pill, L.fonts, L.U – így a QA és a review mód minden térképfeliratot lát).

   const map = TortMap.create({
     proj:    TortProj.lcc({lon0: 20, lat0: 38, lat1: 30, lat2: 46}),   // a lecke egyetlen vetülete
     layers:  [{data: TORT_MAP_VILAG},                                  // durvától a finomig; a finomabb réteg
               {data: TORT_MAP_MEDITERRAN},                             //   csak a saját kivágatában rajzol,
               {data: TORT_MAP_KARPAT, fade: [4500, 7500]}],             //   fade: [s0, s1] között úszik be (s = px/Föld-sugár)
     borders: TORT_MAP_HATAROK,   // opcionális: a „mai határok” réteg adata
     ancient: true,               // a modern: 1 elemek (víztározó, csatorna) kimaradnak
     rect:    [0, 0, 1360, 1080], // a feliratok elhelyezési területe (alap: a vizuális terület)
   });

   KAMERA
     TortMap.fit(proj, [lonMin, latMin, lonMax, latMax], [x, y, w, h], pad?) → nézet {lon, lat, s, x, y}
     TortMap.lerp(proj, a, b, u)    nézet a és b között (u 0..1): fix pont körüli zoom + pan, s logaritmikusan
                                    (nagy zoomnál is természetes: egy pont végig ugyanott marad a képernyőn)
     const cam = TortMap.camera(proj)
     cam.go(nézet, t, dur)          átmenet indítása a jelenlegi állásból (t: tetszőleges óra, pl. L.st)
     cam.at(t) → nézet              a t időpillanat nézete (inOut lassítással); visszafelé lépésnél rövid dur-t adj
     TortMap.zfade(V, s0, s1)       0..1: hol tart V.s az [s0, s1] között (log.) – rétegek ki-/beúsztatása zoomra

   KÉPKOCKÁNKÉNT (a sorrend: frame → base → region / line / saját rajz → labels)
     const V = map.frame(nézet)     beállítja a kamerát; V = TortProj.view (V.pt, V.inv, V.s)
     map.base(ctx, o)               tenger, szárazföld, hegységfoltok, folyók, tavak, partvonal.
                                    o = {rivers: {rank: 6 | [r0, r1, r2] (rétegenként), hi: {'Duna': {w: 5, wkm: .4, c}}
                                         (9 px fölött part + világos víz),
                                         only: ['Duna', …]}, mountains: 0..1 (alfa), lakes: true, style: {sea, land, …}}
     map.borders(ctx, a)            mai határok, halvány szaggatott vonal (a: alfa); mellé: TortMap.stamp(„mai határok”)
     map.region(ctx, items, o)      lágy szélű folt(ok) EGY rétegben (az átfedés nem sötétedik):
                                    items = [{blobs: [[lon, lat, km], …]} | {poly: [[lon, lat], …]}, a: 0..1]
                                    o = {color, alpha (alap .4), blur (px, alap 14), land: true (szárazföldre vágva,
                                         a tavak kivételével)}
     map.line(ctx, pts, o)          vonal / animált nyíl: pts = [[lon, lat], …];
                                    o = {p: 0..1 (haladás), color, w (px), wkm (szélesség km-ben, min. w), dash,
                                         head: true (nyílhegy), halo: true, smooth: true, cap} → {x, y, ang, len}
     map.labels(L, items, o)        ütközésmentes címkézés (prioritás szerint, mohón; a korábbi helyet megtartja):
                                    items = [{id, lon, lat | x, y, s, k, sub, sk, pri, r (jel sugara, 0: nincs),
                                              dot (alap pontot rajzol), size, w, f, i, c, subc, a, dirs, force}]
                                    dirs: ['E','W','N','S','NE','SE','NW','SW'] (alap) vagy ['C'] (területnév középen);
                                    ha a közeli helyek foglaltak, távolabb, szaggatott vezetővonallal próbálja.
                                    o = {avoid: [{x, y, w, h}], rect} → az elhelyezett dobozok [{id, x, y, w, h}]
     map.scale(L, x, y, o)          méretarány-vonalzó kerek km-értékkel; o = {k: felirat-kulcs („# km”), max: px}
   SEGÉDEK
     map.pt(lon, lat) → [x, y] (másolat) · map.ppk(lon, lat) → px / km ott · map.river(név) → [[lon, lat], …]
     TortMap.slice(line, a, b)      a vonal a- és b-hez ([lon, lat]) legközelebbi csúcsa közötti szakasza
     TortMap.nearest(line, p)       {i, p}: a p-hez legközelebbi csúcs
     TortMap.spline(pts, n, closed) Catmull–Rom simítás (n pont szakaszonként)
     TortMap.offset(lon, lat, kelet_m, észak_m) → [lon, lat] (helyi alaprajzokhoz méterben)
     TortMap.stamp(L, s, x, y, o)   bélyeg („vázlatos”, „mai határok”, „becslés”): −3°, Bricolage 22 px 600, keret;
                                    o = {k, est: true → okker, a: 'left' | 'center' | 'right'} → doboz
   Rétegek keverése: a durva réteg a finomabb kivágatán kívül teljes erővel, belül (1 − alfa)-val rajzol.
   Teljesítmény: a kivágaton kívüli gyűrűk kimaradnak; a foltok negyed felbontású pufferben mosódnak el.
   ───────────────────────────────────────────────────────────────────────────────────────── */
const TortMap = (() => {
  'use strict';
  const TP = window.TortProj;
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const smooth = (t) => { t = clamp(t); return t * t * (3 - 2 * t); };
  const inOut = (t) => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
  const DEF = { sea: 'rgba(70,150,215,.22)', land: '#f5eddd', coast: '#1b5a94', coastW: 1.5, river: '#1b5a94',
    lake: '#c6dbe8', lakeLine: '#1b5a94', mtn: '#7a623e', border: '#1c2440', ink: '#1c2440', muted: '#565d72',
    halo: 'rgba(250,246,238,.94)', card: '#fffaf1', est: '#8f5a0c' };
  const R_KM = 6371;

  function ringBox(r) {
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (let i = 0; i < r.length; i += 2) { const x = r[i], y = r[i + 1]; if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    return [x0, y0, x1, y1];
  }
  function boxRing(b, n = 24) {
    const o = [];
    for (let i = 0; i < n; i++) o.push(b[0] + (b[2] - b[0]) * i / n, b[1]);
    for (let i = 0; i < n; i++) o.push(b[2], b[1] + (b[3] - b[1]) * i / n);
    for (let i = 0; i < n; i++) o.push(b[2] - (b[2] - b[0]) * i / n, b[3]);
    for (let i = 0; i < n; i++) o.push(b[0], b[3] - (b[3] - b[1]) * i / n);
    return Float64Array.from(o);
  }
  const hit = (a, b) => a[0] <= b[2] && a[2] >= b[0] && a[1] <= b[3] && a[3] >= b[1];
  const parts = (arr) => (arr || []).map((r) => ({ r, b: ringBox(r) }));

  function fit(proj, b, rect, pad) { return TP.fit(proj, b, rect, pad); }

  function lerp(proj, a, b, u) {
    if (u <= 0) return a; if (u >= 1) return b;
    const pa = proj.fwd(a.lon, a.lat), pb = proj.fwd(b.lon, b.lat);
    const s = Math.exp(Math.log(a.s) + (Math.log(b.s) - Math.log(a.s)) * u);
    const X = a.x + (b.x - a.x) * u, Y = a.y + (b.y - a.y) * u;
    let cx, cy;
    if (Math.abs(Math.log(a.s / b.s)) < 1e-3) { cx = pa[0] + (pb[0] - pa[0]) * u; cy = pa[1] + (pb[1] - pa[1]) * u; }
    else {   // fix pont: az a világpont, amely mindkét nézetben ugyanott van a képernyőn
      const oax = pa[0] - a.x / a.s, obx = pb[0] - b.x / b.s, oay = pa[1] + a.y / a.s, oby = pb[1] + b.y / b.s;
      const Fx = (oax * a.s - obx * b.s) / (a.s - b.s), Fy = (oay * a.s - oby * b.s) / (a.s - b.s);
      const ox = Fx - (Fx - oax) * a.s / s, oy = Fy - (Fy - oay) * a.s / s;
      cx = ox + X / s; cy = oy - Y / s;
    }
    const ll = proj.inv(cx, cy);
    return { lon: ll[0], lat: ll[1], s, x: X, y: Y };
  }

  function camera(proj) {
    let from = null, to = null, t0 = 0, dur = 1, last = null;
    return {
      go(v, t, d) { from = last || v; to = v; t0 = t; dur = Math.max(1e-3, d || 0); },
      at(t) { if (!to) return null; last = lerp(proj, from, to, inOut((t - t0) / dur)); return last; },
      get target() { return to; },
    };
  }

  const zfade = (V, s0, s1) => smooth((Math.log(V.s) - Math.log(s0)) / (Math.log(s1) - Math.log(s0)));

  function spline(pts, n, closed) {
    const N = pts.length, out = [];
    if (N < 3) return pts.slice();
    const P = (i) => closed ? pts[(i + N) % N] : pts[Math.max(0, Math.min(N - 1, i))];
    const segs = closed ? N : N - 1;
    for (let i = 0; i < segs; i++) {

/* ── MODUL: Időszalag (TortTimeline) ──────────────────────────────────────────────

   T (a lecke .md-jéből, mind {s, k}; k = md-kulcs a review módhoz):

   const tl = TortTimeline.create(L, {x0, x1, y, h: 64, T, src, bounds: [uMin, uMax], minSpan, maxSpan,

     tl.draw(d)   szalag + osztás + feliratok + sávok. d = {a, bands: [{u0, u1, col, a}], sides,

                  label(pin, év) → [{s, k, c}, …], hint: {s, k}})
     tl.interact({pins, pan, zoom, snap: [u…], onView(v)}) → true, ha egy tű elmozdult. Minden képkockán
                  hívd (a nézet beállítása után); a görgő nagyít, a szalag húzása pásztáz.
     tl.user      a felhasználó által beállított nézet ([u0, u1]) vagy null · tl.setUser(u0, u1) · tl.zoomTo(span)
   TortTimeline.mini(L, {x, y, w, h, u0, u1, eras, win: [u0, u1], cap: {s, k}, ends: [{s, k}, {s, k}], a})

const TortTimeline = (() => {
  const F = Lesson.FONTS, U = Lesson.U, NB = ' ', MINUS = '−', TAU = Math.PI * 2;

  const Y = {

    hist: (a) => (a <= 0 ? a - 1 : a),
    u: (d) => (typeof d === 'number' ? d + .5 : d.t === 'date' ? d.a : d.a + .5),
    year: (u) => Math.floor(u),
    num: (a) => (a <= 0 ? 1 - a : a),
    label: (a, T, ad) => (a <= 0 ? T.bc.s + NB + (1 - a) : (ad ? T.ad.s + NB : '') + a),
    key: (a, T, ad) => (a <= 0 ? T.bc.k : ad ? T.ad.k : null),
    range: (a0, a1, T) => {

      if (a1 <= 0) return T.bc.s + NB + (1 - a0) + '–' + (1 - a1);
      if (a0 >= 1) return a0 + '–' + a1;
      return Y.label(a0, T) + ' – ' + Y.label(a1, T, true);
    },
    elapsed: (a1, a2) => a2 - a1,
    formula: (a1, a2) => {
      const lo = Math.min(a1, a2), hi = Math.max(a1, a2), e = hi - lo;
      if (hi <= 0) return `${1 - lo} ${MINUS} ${1 - hi} = ${e}`;
      if (lo >= 1) return `${hi} ${MINUS} ${lo} = ${e}`;
      return `${1 - lo} + ${hi} ${MINUS} 1 = ${e}`;
    },
    century: (a) => (a >= 1 ? { n: Math.ceil(a / 100), bc: false } : { n: Math.ceil((1 - a) / 100), bc: true }),
    centurySpan: (n, bc) => (bc ? [1 - 100 * n, 101 - 100 * n] : [100 * n - 99, 100 * n + 1]),
    centuryLabel: (a, T, short) => { const c = Y.century(a); return (c.bc ? T.bc.s + NB : '') + c.n + '.' + (short ? '' : NB + T.cent.s); },
    centuryKeys: (a, T) => (Y.century(a).bc ? [T.cent.k, T.bc.k] : [T.cent.k]),
    centuryRule: (a) => {
      const y = Y.num(a), n = Y.century(a).n, h = Math.floor(y / 100), t = y % 100;
      return t === 0 ? `${h}|00 → ${n}` : `${h}|${String(t).padStart(2, '0')} → ${h} + 1 = ${n}`;
    },
    lerpView: (v0, v1, t) => {
      const s0 = v0[1] - v0[0], s1 = v1[1] - v1[0], c0 = (v0[0] + v0[1]) / 2, c1 = (v1[0] + v1[1]) / 2;
      const s = Math.exp(U.lerp(Math.log(s0), Math.log(s1), t));

  function create(L, o) {
    const T = o.T;
    const tl = { o, T, src: o.src || null, x0: o.x0, x1: o.x1, y: o.y, h: o.h || 64, pins: [], user: null, drag: null,
      bounds: o.bounds || [-1e6, 1e6], minSpan: o.minSpan || 4, maxSpan: o.maxSpan || 1e5, epoch: o.epoch == null ? null : o.epoch };
    tl.top = tl.y - tl.h / 2; tl.bot = tl.y + tl.h / 2;
    tl.R = { tick: tl.bot + 31, cent: tl.bot + 44, centH: 40, era: tl.bot + 96, eraH: 48 };
    tl.pinY = o.pinY || tl.R.era + tl.R.eraH + 40;
    tl.view = (u0, u1) => { tl.u0 = u0; tl.u1 = u1; tl.ppy = (tl.x1 - tl.x0) / (u1 - u0); return tl; };
    tl.view(0, 100);
    tl.x = (u) => tl.x0 + (u - tl.u0) * tl.ppy;
    tl.u = (x) => tl.u0 + (x - tl.x0) / tl.ppy;
    tl.span = () => tl.u1 - tl.u0;
    const inView = (x, m = 0) => x >= tl.x0 - m && x <= tl.x1 + m;

    /* azok a csillagászati évek, amelyek kiírt száma a lépésköz többszöröse (a szalag közepén: a + 0,5) */
    function yearsAt(step) {
      const out = [];
      if (tl.epoch != null) {
        const e = tl.epoch;
        for (let n = Math.max(step, Math.ceil((tl.u0 - e + .5) / step) * step); e + n - .5 <= tl.u1; n += step) out.push(e + n - 1);
        return out;
      }
      for (let n = Math.max(step, Math.ceil((tl.u0 - .5) / step) * step); n + .5 <= tl.u1; n += step) out.push(n);
      for (let y = Math.max(step, Math.ceil((1.5 - tl.u1) / step) * step); 1.5 - y >= tl.u0; y += step) out.push(1 - y);
      return out;
    }
    /* ad: true → „Kr. u. 5”; 'auto' (alap) → csak ha a kezdőpont látszik, és évenként/évtizedenként írunk */
    const adOn = (a, ad, step) => a >= 1 && (ad === true || (ad !== false && step <= 10 && tl.u0 < 1 && a < 1000));
    const tickText = (a, ad, step) => (tl.epoch != null ? { s: String(a - tl.epoch + 1), k: null } : { s: Y.label(a, T, adOn(a, ad, step)), k: Y.key(a, T, adOn(a, ad, step)) });
    function pickStep(ad) {
      for (const s of STEPS) {
        if (s * tl.ppy < 34) continue;
        const ys = yearsAt(s); let w = 0;
        for (const a of ys) w = Math.max(w, L.measure(tickText(a, ad, s).s, TF).w);

    tl.draw = (d = {}) => {
      const c = L.ctx, A = d.a == null ? 1 : d.a; if (A <= .005) return;

      c.save(); c.shadowColor = 'rgba(70,50,20,.16)'; c.shadowBlur = 16; c.shadowOffsetY = 4;
      c.fillStyle = CARD; c.fillRect(x0, top, W, h); c.restore();

      if (xb > x0) { c.fillStyle = tl.epoch != null ? 'rgba(28,36,64,.11)' : 'rgba(28,36,64,.07)'; c.fillRect(x0, top, Math.min(xb, x1) - x0, h); }
      for (const b of d.bands || []) {
        const xa = Math.max(x0, tl.x(b.u0)), xc = Math.min(x1, tl.x(b.u1)); if (xc <= xa) continue;

      const step = pickStep(d.ad);
      c.save(); c.beginPath(); c.rect(x0, top, W, h); c.clip();
      c.strokeStyle = 'rgba(28,36,64,.30)'; c.lineWidth = 1.5; c.beginPath();
      if (ppy >= 14) {
        for (let a = Math.ceil(tl.u0); a <= tl.u1; a++) { const x = tl.x(a); c.moveTo(x, top); c.lineTo(x, bot); }
      } else {
        const minor = [step / 10, step / 5, step / 2].find((m) => m >= 1 && Number.isInteger(m) && m * ppy >= 7);
        if (minor) for (const a of yearsAt(minor)) { const x = tl.x(a + .5); c.moveTo(x, bot - 9); c.lineTo(x, bot); }
      }
      c.stroke();
      c.strokeStyle = INK; c.lineWidth = 2; c.beginPath();
      const ys = yearsAt(step);
      for (const a of ys) { const x = tl.x(a + .5); c.moveTo(x, bot - 15); c.lineTo(x, bot); }
      c.stroke();
      c.restore();
      for (const a of ys) {
        const x = tl.x(a + .5); if (!inView(x)) continue;
        const t = tickText(a, d.ad, step);
        L.tx(t.s, x, tl.R.tick, Object.assign({}, TF, { a: 'center', c: INK, k: t.k }));
      }
      c.strokeStyle = INK; c.lineWidth = 2.5; c.strokeRect(x0, top, W, h);
      c.fillStyle = INK; c.beginPath(); c.moveTo(x1 + 6, top + 10); c.lineTo(x1 + 28, tl.y); c.lineTo(x1 + 6, bot - 10); c.closePath(); c.fill();
      /* kezdőpont */
      if (d.origin !== false && inView(xb) && (tl.epoch != null || xb > x0)) {
        c.strokeStyle = tl.epoch != null ? OCHRE : RED; c.lineWidth = 3.5;
        c.beginPath(); c.moveTo(xb, top - 10); c.lineTo(xb, bot + 10); c.stroke();
      }

        const wl = L.measure(lt, sf).w, wr = L.measure(rt, sf).w;
        if (xb - x0 > wl + 30 && xb < x1) L.tx(lt, xb - 14, tl.y + 8, Object.assign({}, sf, { a: 'right', c: MUT, k: T.bc.k }));
        if (x1 - xb > wr + 30 && xb > x0) L.tx(rt, xb + 14, tl.y + 8, Object.assign({}, sf, { a: 'left', c: INK, k: T.ad.k }));
      }
      if (d.caption && (d.caption.a == null || d.caption.a > .01)) {
        c.save(); c.globalAlpha *= d.caption.a == null ? 1 : d.caption.a;
        L.tx(d.caption.s, d.caption.right ? x1 - 16 : x0 + 16, tl.y + 8, { f: F.B, s: 22, w: 700, a: d.caption.right ? 'right' : 'left', c: MUT, k: d.caption.k });
        c.restore();
      }
      /* évszázadok sora */
      const cf = U.clamp((ppy * 100 - 36) / 30);
      if (d.cent > .005 && cf > 0) {
        c.save(); c.globalAlpha *= d.cent * cf;
        const y0 = tl.R.cent, hh = tl.R.centH, hiC = d.centHi != null ? Y.century(d.centHi) : null;
        let a = Math.floor(tl.u0);
        for (let g = 0; g < 400; g++) {
          const cc = Y.century(a), sp = Y.centurySpan(cc.n, cc.bc), xa = Math.max(x0, tl.x(sp[0])), xc = Math.min(x1, tl.x(sp[1]));
          if (xc > xa) {
            const hi = hiC && hiC.n === cc.n && hiC.bc === cc.bc;
            c.fillStyle = hi ? 'rgba(200,64,28,.20)' : (cc.n + (cc.bc ? 1 : 0)) % 2 ? 'rgba(28,36,64,.05)' : 'rgba(28,36,64,.12)';
            c.fillRect(xa, y0, xc - xa, hh);
            c.strokeStyle = 'rgba(28,36,64,.45)'; c.lineWidth = 1.5; c.beginPath();
            if (tl.x(sp[0]) >= x0) { c.moveTo(xa, y0); c.lineTo(xa, y0 + hh); }
            c.stroke();
            if (hi) { c.strokeStyle = RED; c.lineWidth = 2.5; c.strokeRect(xa, y0, xc - xa, hh); }
            const full = Y.centuryLabel(sp[0], T), short = Y.centuryLabel(sp[0], T, true), cf2 = { f: F.B, s: 22, w: hi ? 700 : 600 };

      }

          if (xc <= xa + .5) continue;

          const sa = Math.max(x0, tl.x(e.fade0 ? e.fade0[1] : e.u0)), sb = Math.min(x1, tl.x(e.fade1 ? e.fade1[0] : e.u1));

          else if (d.eraOut && sb > x0 && sa < x1) {
            const cx = U.clamp((sa + sb) / 2, x0 + lw / 2, x1 - lw / 2);
            L.tx(e.name.s, cx, y0 - 16, Object.assign({}, EF, { a: 'center', c: INK, k: e.name.k }));
            c.strokeStyle = U.rgba(INK, .5); c.lineWidth = 1.5; c.beginPath(); c.moveTo(cx, y0 - 12); c.lineTo((Math.max(sa, x0) + Math.min(sb, x1)) / 2, y0 + 4); c.stroke();
          }
        }
        c.strokeStyle = 'rgba(28,36,64,.5)'; c.lineWidth = 1.5; c.strokeRect(x0, y0, W, hh);
        c.restore();
      }
      c.restore();
    };

    /* ── eseménykártyák ── */
    const CT = { f: F.B, s: 24, w: 650 }, CD = { f: F.M, s: 22, w: 600 }, CN = { f: F.B, s: 22, w: 700 };

      const src = tl.src, wt = L.measure(it.title.s, CT).w, wd = it.date ? L.measure(it.date.s, CD).w : 0;
      const ws = it.est && src ? src.stampSize('becslés').w + 14 : 0, wn = it.note ? L.measure(it.note.s, CN).w : 0;

    };

      const c = L.ctx, src = tl.src, z = tl.cardSize(it);
      if (src) src.frame(x, y, z.w, z.h, it.layer || null, { hi: it.hi });
      else { c.beginPath(); c.roundRect(x, y, z.w, z.h, 10); c.fillStyle = CARD; c.fill(); c.strokeStyle = U.rgba(INK, .35); c.lineWidth = 2; c.stroke(); }
      L.tx(it.title.s, x + 17, y + 38, Object.assign({}, CT, { c: INK, k: it.title.k }));

    TL8.view(A('Óbirodalom kezdete') - 60, A('Újbirodalom vége') + 60);
    CARDS = TortCards.create(L, {
      zones: CHAIN.map((id, i) => ({ id: 'z' + (i + 1), x: ZX(i), y: ZY(i), w: ZW, h: ZH, head: 70, title: K('hely ' + (i + 1)) })),
      cards: CHAIN.map((id, i) => ({ id, zone: 'z' + (i + 1), label: K('kártya ' + id) })),
      tray: { x: 60, y: 560, w: 1260, h: 220, top: 40 },
    });
    /* a kártyák kezdősorrendje a tálcán: keverve (a kódban rögzítve) */
    const mixOrder = ['fáraó', 'áradás', 'piramis', 'írnok', 'többlet', 'adó'];
    CARDS.cards.sort((p, q) => mixOrder.indexOf(p.id) - mixOrder.indexOf(q.id)); CARDS.cards.forEach((q, i) => { q.i = i; });
  },
  draw(Lx) {
    L = Lx; c = L.ctx;
    if (L.step === 1 && S2.sl && !S2.user) S2.sl.set(Math.round(day2(L.st)));
    if (L.step === 2 && S3.sl && !S3.user) S3.sl.set(round(level3(L.st), .5));
    if (L.step === 3 && S4.sl && !S4.user) S4.sl.set(nSacks(L.st));
    if (L.step === 7 && S8.sl && !S8.user) S8.sl.set(year8(L.st));
    if (L.step === 7 && stepW(7) > .97 && TL8.pins.length) {
      if (TL8.interact({ pins: true, pan: false, zoom: false, pinY: 1010 })) { S8.user = true; S8.a = Math.floor(S8.pin.u); if (S8.sl) S8.sl.set(S8.a); }
    }
    draw();
  },
});
})();
</script>
