<script>
(function () {
  'use strict';
  const U = Lesson.U, F = Lesson.FONTS, D2R = Math.PI / 180;
  const MAP = window.VANDORLAS_MAP;

  /* ── Színek (világos téma, lásd SZERZODES.md §6) ─────────────── */
  const INK = '#1c2440', MUT = '#565d72', RED = '#c8401c', RED_D = '#9c2f12', TEAL = '#0a6f86', CARD = '#fffaf1';
  const C = {
    sea: '#bcd3e2', seaDeep: '#a9c6da', land: '#f5eee0', coast: '#2f5f8a', river: '#1b5a94', lake: '#bcd3e2',
    red: RED, gold: '#b8860b', ochre: '#8a6400', ochreBg: '#f6e7bf', slate: '#3d5a80', brown: '#6a4a1f',
    bes: '#4b3f72', neigh: '#5a4a36', seaInk: '#174a7a', amber: '#9a6a00',
  };
  const HALO = 'rgba(245,238,224,.9)', HALO_SEA = 'rgba(188,211,226,.85)';

  /* ── Vetület: Lambert-féle szögtartó kúpvetület ─────────── */
  const P1 = 44 * D2R, P2 = 58 * D2R, LAM0 = 42 * D2R, PHI0 = 50 * D2R;
  const tn = (p) => Math.tan(Math.PI / 4 + p / 2);
  const PN = Math.log(Math.cos(P1) / Math.cos(P2)) / Math.log(tn(P2) / tn(P1));
  const PF = Math.cos(P1) * Math.pow(tn(P1), PN) / PN;
  const RHO0 = PF / Math.pow(tn(PHI0), PN);
  function proj(lon, lat) {
    const rho = PF / Math.pow(tn(lat * D2R), PN), th = PN * (lon * D2R - LAM0);
    return [1000 * rho * Math.sin(th), -1000 * (RHO0 - rho * Math.cos(th))];
  }
  const KM_PER_UNIT = 6.371;
  function northRot(lon, lat) { const a = proj(lon, lat), b = proj(lon, lat + .5); return -Math.atan2(b[0] - a[0], -(b[1] - a[1])); }

  /* ── Görbék ─────────────────────────────────────────────── */
  function spline(pts, per, closed) {            // Catmull–Rom mintavételezés
    const out = [], n = pts.length, g = (i) => closed ? pts[(i + n) % n] : pts[U.clamp(i, 0, n - 1)];
    const segs = closed ? n : n - 1;
    for (let i = 0; i < segs; i++) {
      const p0 = g(i - 1), p1 = g(i), p2 = g(i + 1), p3 = g(i + 2);
      for (let s = 0; s < per; s++) {
        const t = s / per, t2 = t * t, t3 = t2 * t;
        out.push([
          .5 * (2 * p1[0] + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3),
          .5 * (2 * p1[1] + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3)]);
      }
    }
    if (!closed) out.push(pts[n - 1].slice(0, 2));
    return out;
  }
  function haversine(a, b) {
    const dl = (b[0] - a[0]) * D2R, dp = (b[1] - a[1]) * D2R, s = Math.sin(dp / 2) ** 2 + Math.cos(a[1] * D2R) * Math.cos(b[1] * D2R) * Math.sin(dl / 2) ** 2;
    return 2 * 6371 * Math.asin(Math.sqrt(s));
  }
  /* lon/lat töréspontokból: vetített mintasor + kumulált arány */
  function makeTrack(ll, per) {
    const s = spline(ll, per || 14), pts = s.map((p) => proj(p[0], p[1])), cum = [0]; let km = 0;
    for (let i = 1; i < pts.length; i++) { cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1])); km += haversine(s[i - 1], s[i]); }
    const tot = cum[cum.length - 1]; for (let i = 0; i < cum.length; i++) cum[i] /= tot;
    return { pts, cum, km, per: per || 14 };
  }
  function trackAt(tr, f) {
    f = U.clamp(f); let lo = 0, hi = tr.cum.length - 1;
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (tr.cum[m] <= f) lo = m; else hi = m; }
    const t = (f - tr.cum[lo]) / Math.max(1e-9, tr.cum[hi] - tr.cum[lo]), a = tr.pts[lo], b = tr.pts[hi];
    return { x: U.lerp(a[0], b[0], t), y: U.lerp(a[1], b[1], t), i: lo, dx: b[0] - a[0], dy: b[1] - a[1] };
  }

  /* ── Térképadat → Path2D (térkép-koordinátákban) ────────── */
  const landPath = new Path2D(), lakePath = new Path2D(), gratPath = new Path2D();
  const riverPaths = { 1: new Path2D(), 2: new Path2D(), 3: new Path2D() };
  const riverPts = {};
  function addLine(path, flat, close) {
    for (let i = 0; i < flat.length; i += 2) { const p = proj(flat[i] / 100, flat[i + 1] / 100); if (i === 0) path.moveTo(p[0], p[1]); else path.lineTo(p[0], p[1]); }
    if (close) path.closePath();
  }
  MAP.land.forEach((poly) => poly.forEach((r) => addLine(landPath, r, true)));
  MAP.lakes.forEach((r) => addLine(lakePath, r, true));
  MAP.rivers.forEach((r) => {
    addLine(riverPaths[r.w], r.p, false);
    const a = riverPts[r.n] || (riverPts[r.n] = []);
    for (let i = 0; i < r.p.length; i += 2) a.push([r.p[i] / 100, r.p[i + 1] / 100]);
  });
  for (let lon = 0; lon <= 90; lon += 10) for (let lat = 30; lat <= 74; lat += 1) { const p = proj(lon, lat); if (lat === 30) gratPath.moveTo(p[0], p[1]); else gratPath.lineTo(p[0], p[1]); }
  for (let lat = 30; lat <= 70; lat += 10) for (let lon = -5; lon <= 95; lon += 1) { const p = proj(lon, lat); if (lon === -5) gratPath.moveTo(p[0], p[1]); else gratPath.lineTo(p[0], p[1]); }

  /* folyónevek: a megadott ponthoz legközelebbi folyópontra kerülnek; [adatnév, hossz, szél, min. zoom] */
  const RIVER_LABELS = [
    ['Volga', 46.6, 51.4, 0], ['Don', 40.6, 49.9, 0], ['Dnyeper', 32.2, 50.2, 0], ['Duna', 24.4, 43.7, 0],
    ['Káma', 53.6, 56.2, 3], ['Urál', 53.8, 51.3, 3], ['Ob', 66.5, 61.6, 2.5], ['Irtis', 71.3, 56.4, 2.5], ['Tobol', 64.6, 53.8, 3],
    ['Dnyeszter', 28.4, 48.2, 4], ['Prut', 27.7, 47.4, 6], ['Szeret', 27.0, 46.85, 6.5], ['Tisza', 20.3, 46.3, 6], ['Duna', 18.95, 46.4, 6],
    ['Maros', 22.6, 46.05, 8], ['Dráva', 17.6, 45.95, 8], ['Belaja', 55.9, 53.3, 4],
  ].map((r) => {
    let best = null, bd = 1e9;
    (riverPts[r[0]] || []).forEach((p) => { const d = Math.hypot((p[0] - r[1]) * .62, p[1] - r[2]); if (d < bd) { bd = d; best = p; } });
    best = best || [r[1], r[2]]; return { k: r[0] + ' folyó', m: proj(best[0], best[1]), z: r[3] };
  });
  const SEA_LABELS = [
    ['fekete-tenger', 34.3, 43.3, 0], ['kaszpi-tenger', 50.7, 42.6, 0], ['balti-tenger', 19.6, 56.6, 0], ['aral-tó', 59.9, 45.0, 0], ['azovi-tenger', 36.6, 46.05, 4.4],
  ].map((s) => ({ k: s[0], m: proj(s[1], s[2]), z: s[3] }));

  /* ── Hegységek (kézzel húzott gerincvonalak) ─────────────── */
  const RANGES = [
    [[59.6, 51.6], [58.4, 53], [58.7, 55], [59.5, 57], [59.3, 59], [59.6, 61], [60.2, 63], [62.5, 65.2], [65.5, 67.6]],
    [[17.2, 48.25], [18.4, 49.15], [20, 49.3], [22, 49.1], [23.2, 48.6], [24.5, 48.0], [25.3, 47.3], [25.9, 46.5], [26.2, 45.75], [25.3, 45.5], [24, 45.5], [22.8, 45.3], [22.4, 44.7]],
    [[37.6, 44.6], [40, 43.6], [43, 43], [46, 42], [48.6, 41]],
    [[9, 46.6], [11.5, 47], [13.5, 47.2], [15.4, 47.4]],
    [[22.6, 43.2], [25, 42.75], [27.4, 42.8]],
  ];
  const PEAKS = [];
  (function () {
    const r = U.rng(7);
    RANGES.forEach((ll, ri) => {
      const tr = makeTrack(ll, 10), len = tr.cum.length, total = (function () { let s = 0; for (let i = 1; i < len; i++) s += Math.hypot(tr.pts[i][0] - tr.pts[i - 1][0], tr.pts[i][1] - tr.pts[i - 1][1]); return s; })();
      const n = Math.max(3, Math.round(total / 5.2));
      for (let i = 0; i <= n; i++) {
        const q = trackAt(tr, i / n), l = Math.hypot(q.dx, q.dy) || 1, off = ((i % 2) ? 1 : -1) * (1.2 + r() * 1.3) * (ri === 0 ? 1.5 : 1);
        PEAKS.push({ x: q.x + (-q.dy / l) * off + (r() - .5), y: q.y + (q.dx / l) * off + (r() - .5), s: .8 + r() * .45 });
      }
    });
    PEAKS.sort((a, b) => a.y - b.y);
  })();

  /* ── A vándorlás útvonala (vázlatos, rekonstrukció) ───────── */
  const ROUTE_LL = [
    [66.5, 57.4, 'u0'], [66, 55.2, 'ug'], [62, 54.6], [59.2, 54.3], [54.8, 54.7, 'm'], [51, 53.2], [47.5, 51.2], [44, 49.8], [41, 49.2],
    [37.8, 48.8, 'l'], [35, 48.4], [32.5, 48.0], [30, 47.6, 'e'], [27.6, 48.2], [25.2, 48.72, 'a'], [23.15, 48.78, 'v'], [22.3, 48.35], [21.3, 47.8], [20.2, 47.2, 'k'],
  ];
  const ROUTE = makeTrack(ROUTE_LL, 16);
  const SF = {}; ROUTE_LL.forEach((p, i) => { if (p[2]) SF[p[2]] = ROUTE.cum[i * 16]; });
  const ROUTE_KM = Math.round(ROUTE.km / 100) * 100;
  /* j („utazási idő”, 0..7) → útvonal-arány */
  const JF = [0, SF.ug, SF.m, SF.l, SF.e, SF.a, SF.k, SF.k];
  function fracOfJ(j) { if (j <= 0) return 0; if (j >= 7) return JF[7]; const i = Math.floor(j); return U.lerp(JF[i], JF[i + 1], j - i); }

  const JULIANUS = makeTrack([[18.74, 47.79], [20.5, 44.8], [23.3, 42.7], [28.98, 41.01], [33, 42.6], [36.7, 45.2], [41, 46.6], [45.6, 48.4], [46.3, 51.6], [49.1, 54.9], [53.2, 55.0]], 14);

  /* ── Szállásterületek (lon/lat sokszögek, simított foltként – becsült területek) ─ */
  function region(ll, color) {
    const s = spline(ll, 10, true).map((p) => proj(p[0], p[1])), path = new Path2D(); let cx = 0, cy = 0, rad = 0;
    s.forEach((p, i) => { if (i) path.lineTo(p[0], p[1]); else path.moveTo(p[0], p[1]); cx += p[0]; cy += p[1]; }); path.closePath();
    cx /= s.length; cy /= s.length; s.forEach((p) => { rad = Math.max(rad, Math.hypot(p[0] - cx, p[1] - cy)); });
    return { path, cx, cy, rad, color };
  }
  const REG = {
    ural: region([[52, 56], [54, 60], [58, 62.5], [64, 63], [70, 61], [72, 57.5], [69, 54.5], [62, 53.5], [55, 54]], C.ochre),
    ugor: region([[60.3, 53.3], [60.6, 56.2], [64, 57.4], [69, 57.2], [72, 55.5], [70.5, 53.3], [65, 52.5]], C.gold),
    magna: region([[50.5, 53], [50.5, 55.5], [53, 57], [57, 56.8], [58.3, 54.8], [57.5, 52.6], [54, 52.2]], C.red),
    levedia: region([[33.6, 47.2], [33.6, 49.8], [36.5, 51], [40.5, 50.5], [42, 48.6], [40, 47.0], [36.5, 46.6]], C.red),
    etelkoz: region([[26.6, 45.9], [26.6, 48.3], [29, 49.5], [32.5, 49.5], [34.1, 48], [33.5, 46.7], [30.8, 46.1], [29.4, 45.5], [28, 45.4]], C.red),
    karpat: region([[16.5, 47.9], [18, 48.6], [20.5, 48.95], [22.7, 48.55], [24.2, 47.6], [25.4, 46.6], [25.3, 45.75], [23, 45.4], [21.5, 44.9], [19.5, 45.2], [17.3, 45.9], [16.2, 46.8]], C.red),
    kazar: region([[39.5, 45], [42.3, 48.3], [45, 50.3], [49, 49.5], [50, 46.5], [48.2, 43.2], [44.5, 42.9], [40.5, 43.6]], C.slate),
  };
  const ramp = (v, a, b) => U.smooth((v - a) / (b - a));
  /* megjelenés (bloom) és halványulás j függvényében: [megj. kezd, megj. vég, halv. kezd, halv. vég, maradék] */
  const REG_T = { ural: [-.85, -.25, 1.2, 2, .22], ugor: [.3, .9, 1.4, 2.1, .3], magna: [1.5, 2, 2.4, 3.1, .36], levedia: [2.5, 3, 3.4, 4.1, .32], etelkoz: [3.5, 4, 5.5, 6.2, .24], karpat: [5.7, 6.05, 99, 100, 1], kazar: [2.6, 3.1, 99, 100, 1] };

  /* ── Állomás- és népnevek ─────────────────────────────────── */
  const pj = (lon, lat) => proj(lon, lat);
  /* rec: true → rekonstrukció (csak nyelvészeti/régészeti következtetés) → szaggatott keret */
  const STATIONS = [
    { k: 'állomás őshaza', m: pj(69.6, 60.2), js: -.5, dy: 0, dot: false, rec: true },
    { k: 'állomás ugor', m: pj(66, 55.2), js: 1, dy: 74, rec: true },
    { k: 'állomás magna', m: pj(54.8, 54.7), js: 2, dy: -70 },
    { k: 'állomás levédia', m: pj(37.8, 48.8), js: 3, dy: -70 },
    { k: 'állomás etelköz', m: pj(30, 47.6), js: 4, dy: -74 },
    { k: 'állomás kárpát', m: pj(20.2, 47.2), js: 6, dy: 76 },
  ];
  const NEIGH = [
    { k: 'kazárok', m: pj(46.3, 46.1), a: (j) => ramp(j, 2.6, 3.1), col: C.slate },
    { k: 'volgai bolgárok', m: pj(48.4, 56.4), a: (j) => ramp(j, 1.7, 2.1) },
    { k: 'besenyők', m: pj(53.5, 49.4), a: (j) => ramp(j, 2.6, 3.1) * (1 - ramp(j, 4.3, 4.7)), col: C.bes },
    { k: 'besenyők', m: pj(37.6, 47.25), a: (j) => ramp(j, 4.75, 5.1), col: C.bes },
    { k: 'bolgárok', m: pj(25.3, 43.25), a: (j) => ramp(j, 3.6, 4) },
    { k: 'bizánc', m: pj(28.2, 41.55), a: (j) => ramp(j, 3.6, 4) },
    { k: 'morvák', m: pj(17.75, 49.3), ov: 0, a: (j) => ramp(j, 5.3, 5.7) * (1 - ramp(j, 6.6, 6.78) * .7), strike: (j) => ramp(j, 6.62, 6.8) },
    { k: 'frankok', m: pj(14.9, 47.3), ov: 0, a: (j) => ramp(j, 5.3, 5.7) },
  ];
  const CITIES = [{ k: 'kijev', m: pj(30.52, 50.45), a: (j) => ramp(j, 2.6, 3) }, { k: 'konstantinápoly', m: pj(28.98, 41.01), a: (j) => ramp(j, 3.6, 4) }];
  const V_PASS = pj(23.15, 48.8);
  const SETTLE = [[21.6, 48.1], [20.6, 47.6], [21.4, 47.1], [20.3, 46.4], [21.9, 46.5], [19.6, 47.2], [23.4, 47.0], [24.2, 46.4], [23.3, 46.0], [19.3, 46.2], [18.3, 47.3], [17.6, 46.7], [18.2, 46.2], [17.4, 47.6], [18.6, 48.1], [20.4, 45.6], [22.4, 47.6], [24.8, 45.9]].map((p) => { const m = pj(p[0], p[1]); return { m, d: Math.hypot(m[0] - V_PASS[0], m[1] - V_PASS[1]) }; });

  /* ── Kamera lépésenként ───────────────────────────────────── */
  const CAM_LL = [
    [41, 52.2, 1.72], [58.2, 59.4, 3.15], [62.3, 57.8, 3.8], [58.3, 55.2, 4.4], [41.5, 49.3, 4.2],

      arrow('bes3', [[41.4, 46.9], [38, 46.55], [33.4, 46.7]], tr(6, 4.0, 5.8), C.bes, 8, w6);
      const fl = tr(6, 5.2, 6.4) * w6;
      [[31.6, 48.6], [32.3, 47.3], [30.6, 46.7], [28.6, 48.5], [29.2, 46.4], [31, 47.7]].forEach((p, i) => { const s = S(proj(p[0], p[1])); flame(s[0], s[1], 1.25, U.clamp(fl * 6 - i * .6), i * 2.1); });
      if (t1) { const hl = S(proj(24.7, 46.55)); cartouche(lab('hadjárat'), hl[0], hl[1], { size: 23, alpha: w6 * tr(6, 2.4, 3.2), border: RED_D, color: RED_D, clamp: true, k: 'hadjárat' }); }
      const bl = S(proj(38.6, 50.7)); cartouche(lab('besenyő támadás'), bl[0], bl[1], { size: 25, alpha: w6 * tr(6, 4.6, 5.4), border: C.bes, color: C.bes, strong: true, clamp: true, k: 'besenyő támadás' });
      if (t3) { const sl = S(proj(24.3, 44.7)); cartouche(lab('simeon'), sl[0], sl[1] + 6, { size: 23, alpha: w6 * tr(6, 5.9, 6.7), border: C.slate, color: '#27394b', clamp: true, k: 'simeon' }); }
    }
    /* 8: hágók */
    const w7 = stepW(7);
    if (w7 > 0) {
      arrow('erd1', [[27.6, 47.55], [26.3, 47.25], [25.05, 47.2], [24.0, 46.9]], tr(7, 3.2, 5.6), RED_D, 6, w7, [11, 8]);
      arrow('erd2', [[27.9, 46.35], [26.9, 46.2], [26.2, 46.1], [25.1, 46.05]], tr(7, 3.8, 6.2), RED_D, 6, w7, [11, 8]);
      const v = S(V_PASS), pul = .5 + .5 * Math.sin(L.t * 3);
      ctx.save(); ctx.globalAlpha = w7 * tr(7, .6, 1.4); ctx.beginPath(); ctx.arc(v[0], v[1] + 2, 20 + pul * 7, 0, U.TAU); ctx.strokeStyle = U.rgba(RED, .8 - pul * .5); ctx.lineWidth = 3; ctx.stroke(); ctx.restore();
      const va = w7 * tr(7, .8, 1.6);
      cartouche(lab('vereckei-hágó'), v[0] + 12, v[1] - 74, { size: 27, alpha: va, kind: 'trad', strong: true, pop: U.outBack(tr(7, .8, 1.5)), k: 'vereckei-hágó' });
      if (va > .01) { ctx.save(); ctx.globalAlpha *= va * tr(7, 1.4, 2); const pr = L.pill(lab('verecke hagyomány'), v[0] + 12, v[1] - 128, { s: 22, w: 600, a: 'center', bg: C.ochre, c: '#fff8ee', pad: 10, k: 'verecke hagyomány' }); ctx.restore(); occTick(); occNext.push([pr.x - 6, pr.y - 6, pr.x + pr.w + 6, pr.y + pr.h + 6]); }
      const e = S(proj(27.4, 46.95)); cartouche(lab('erdélyi hágók'), e[0] + 6, e[1], { size: 23, alpha: w7 * tr(7, 4.4, 5.2), border: RED_D, color: RED_D, clamp: true, k: 'erdélyi hágók' });
    }
    /* 9: a medence birtokbavétele */
    const w8 = Math.max(stepW(8), 0);
    if (w8 > 0 || (L.step === 9 && j > 6)) {
      const ww = L.step === 9 ? 0 : w8;
      SETTLE.forEach((s) => { const a = U.clamp((kr - s.d) / 6) * (L.step === 9 ? w9 : w8); if (a <= 0) return; const p = S(s.m); yurt(p[0], p[1], U.lerp(.5, 1, U.outBack(a)) * U.clamp(cam.z / 9, .32, 1.05), a); });
      const l1 = S(proj(22.3, 46.55)), l2 = S(proj(17.75, 46.75)), pz = S(proj(17.1, 48.15));
      cartouche(lab('alföld és erdély'), l1[0], l1[1] + 30, { size: 24, alpha: ww * ramp(j, 6.16, 6.26), clamp: true, k: 'alföld és erdély' });
      cartouche(lab('dunántúl'), l2[0], l2[1] + 40, { size: 24, alpha: ww * ramp(j, 6.52, 6.62), clamp: true, k: 'dunántúl' });
      const pa = ww * ramp(j, 6.84, 6.92);
      if (pa > 0) {
        const burst = U.outElastic(ramp(j, 6.84, 6.99)); ctx.save(); ctx.globalAlpha = pa; ctx.translate(pz[0], pz[1]); ctx.scale(burst * 1.45, burst * 1.45);
        const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 46); g.addColorStop(0, 'rgba(184,134,11,.45)'); g.addColorStop(1, 'rgba(184,134,11,0)'); ctx.fillStyle = g; ctx.fillRect(-46, -46, 92, 92);
        ctx.lineCap = 'round';
        [-1, 1].forEach((sg) => { ctx.save(); ctx.rotate(sg * Math.PI / 4);
          ctx.strokeStyle = '#2a2418'; ctx.lineWidth = 4.5; ctx.beginPath(); ctx.moveTo(0, 20); ctx.lineTo(0, -24); ctx.stroke();
          ctx.strokeStyle = '#e9dcc0'; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(0, 6); ctx.lineTo(0, -21); ctx.stroke();
          ctx.strokeStyle = '#2a2418'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(-8, 11); ctx.lineTo(8, 11); ctx.stroke(); ctx.restore(); });
        ctx.restore(); cartouche(lab('pozsony'), pz[0] + 150, pz[1] - 58, { size: 26, alpha: pa, strong: true, clamp: true, k: 'pozsony' });
      }
    }

    /* állomások */
    STATIONS.forEach((s) => {
      const a = ramp(j, s.js - .3, s.js - .02); if (a <= .01) return; const p = S(s.m), cur = U.clamp(1 - Math.abs(j - s.js) * 1.5) * (L.step === 9 ? .6 : 1), far = j - s.js;
      if (p[0] < -150 || p[0] > 1500) return;
      if (s.dot !== false) { ctx.save(); ctx.globalAlpha = a; ctx.translate(p[0], p[1]); ctx.rotate(Math.PI / 4); ctx.fillStyle = RED; ctx.fillRect(-6, -6, 12, 12); ctx.strokeStyle = CARD; ctx.lineWidth = 2; ctx.strokeRect(-6, -6, 12, 12); ctx.restore(); }
      const y = Math.min(p[1] + s.dy * U.clamp(.6 + cam.z * .075, .8, 1.25), 905);
      if (inCard([p[0], y], 0)) return;
      cartouche(lab(s.k), p[0], y, { size: U.lerp(23, 29, cur), alpha: a * U.lerp(far > .6 ? .85 : 1, 1, cur), strong: cur > .5, kind: s.rec ? 'rec' : null, pop: U.lerp(.8, 1, U.outBack(a)), clamp: true, k: s.k });
    });

    /* 1: cím, kezdő- és végpont */
    if (w0 > 0) {
      const t = L.step === 0 ? L.st : 99, a1 = U.clamp((t - .3) / .9) * w0, a2 = U.clamp((t - 1) / .9) * w0;
      const kO = { s: 22, w: 600, f: F.M, ls: '3px' }, tO = { s: 66, w: 600, f: F.D }, sO = { s: 33, w: 400, f: F.D, i: true };
      const tw = Math.ceil(Math.max(L.measure(lab('cím vásznon'), tO).w, L.measure(lab('alcím'), sO).w, L.measure(lab('cím felső'), kO).w)) + 84;
      ctx.save(); ctx.globalAlpha = a1; ctx.translate(0, (1 - U.out(a1 / Math.max(w0, .001))) * 20);
      ctx.shadowColor = 'rgba(70,50,20,.18)'; ctx.shadowBlur = 22; ctx.shadowOffsetY = 5; rrect(52, 52, tw, 214, 12); ctx.fillStyle = 'rgba(255,250,241,.96)'; ctx.fill(); ctx.shadowColor = 'transparent';
      ctx.strokeStyle = 'rgba(28,36,64,.35)'; ctx.lineWidth = 1.6; ctx.stroke(); rrect(58, 58, tw - 12, 202, 8); ctx.lineWidth = .8; ctx.stroke();
      ctx.globalAlpha = 1;
      TX(lab('cím felső'), 90, 98, Object.assign({}, kO, { a: 'left', c: RED_D, halo: false, alpha: a1, k: 'cím felső' }));
      TX(lab('cím vásznon'), 88, 158, Object.assign({}, tO, { a: 'left', c: INK, halo: false, alpha: a1, k: 'cím vásznon' }));
      TX(lab('alcím'), 90, 222, Object.assign({}, sO, { a: 'left', c: MUT, halo: false, alpha: a2, k: 'alcím' }));
      ctx.restore();
      const e0 = S(ROUTE.pts[0]), e1 = S(ROUTE.pts[ROUTE.pts.length - 1]), pul = .5 + .5 * Math.sin(L.t * 2.6);
      [[e0, 'kezdőpont', 1.2, -62], [e1, 'végpont', 5.4, 66]].forEach((e) => {
        const a = U.clamp((t - e[2]) / .6) * w0; if (a <= 0) return; ctx.save(); ctx.globalAlpha = a;
        ctx.beginPath(); ctx.arc(e[0][0], e[0][1], 12 + pul * 10, 0, U.TAU); ctx.strokeStyle = U.rgba(RED, .7 - pul * .5); ctx.lineWidth = 3; ctx.stroke();
        ctx.beginPath(); ctx.arc(e[0][0], e[0][1], 8, 0, U.TAU); ctx.fillStyle = RED; ctx.fill(); ctx.strokeStyle = CARD; ctx.lineWidth = 2.5; ctx.stroke(); ctx.restore();
        cartouche(lab(e[1]), e[0][0], e[0][1] + e[3], { size: 27, alpha: a, strong: true, pop: U.outBack(a), clamp: true, k: e[1] });
      });
      const mid = trackAt(ROUTE, .5), ms = S([mid.x, mid.y]);
      cartouche(lab('út hossza').replace('#', U.fmt(ROUTE_KM)), ms[0] + 20, ms[1] + 64, { size: 30, alpha: U.clamp((t - 5.8) / .7) * w0, border: C.amber, color: '#5c3f05', pop: U.outBack(U.clamp((t - 5.8) / .6)), k: 'út hossza' });
    }

    /* 6: a hét törzs */
    const w5 = stepW(5);
    if (w5 > 0) {
      const c = S(proj(30, 47.6)), tribes = list('törzsek');
      tribes.forEach((n, i) => {
        const a = U.clamp((tr(5, 6.4, 10.2) * tribes.length - i) * 1.4) * w5; if (a <= 0) return;
        const ang = -Math.PI / 2 + (i - (tribes.length - 1) / 2) * (U.TAU / 7.6), x = c[0] + Math.cos(ang) * 318, y = c[1] + 18 + Math.sin(ang) * 208 + (Math.sin(ang) > .5 ? 26 : 0);
        banner(x, y + 4, 1.25 * U.outBack(a), i === 1 ? RED : '#8a3a1c', a, i * 1.7);
        cartouche(n, x, y + 30, { size: 25, alpha: a, strong: i === 1, pop: U.outBack(a), clamp: true, k: 'törzsek' });
      });
      const ka = tr(5, 10.6, 11.4) * w5; cartouche(lab('kabarok'), c[0] + 6, c[1] + 322, { size: 24, alpha: ka, border: C.amber, color: '#5c3f05', pop: U.outBack(ka), clamp: true, k: 'kabarok' });
    }

    /* a vándorló csapat */
    const ba = U.clamp((j - .04) * 5) * (1 - w0);
    const sp1 = Math.abs(frac - lastFrac) / Math.max(L.dt, .001); lastFrac = frac;
    moving += ((sp1 > .0015 ? 1 : 0) - moving) * (1 - Math.exp(-L.dt * 5)); phase += L.dt * (4 + moving * 9);
    if (ba > .01) {
      const q = trackAt(ROUTE, frac), h = S([q.x, q.y]), q2 = S([q.x + q.dx, q.y + q.dy]); let dx = q2[0] - h[0], dy = q2[1] - h[1]; const dl = Math.hypot(dx, dy) || 1; dx /= dl; dy /= dl;
      if (Math.abs(dx) > .15) bandDir = dx < 0 ? -1 : 1;
      const s = U.clamp(.78 + cam.z * .1, .95, 1.62), idle = 1 - moving, nx = -dy, ny = dx;
      ctx.save(); ctx.globalAlpha = ba;
      /* porfelhő menet közben, füst a táborban */
      for (let i = 0; i < 9; i++) { const ph = (L.t * .9 + i / 9) % 1, bx = h[0] - dx * (30 + ph * 80 + i * 9) * s + nx * Math.sin(i * 2.4) * 16 * s, by = h[1] - dy * (30 + ph * 80 + i * 9) * s + ny * Math.sin(i * 2.4) * 16 * s - ph * 14; ctx.beginPath(); ctx.arc(bx, by, (5 + ph * 12) * s, 0, U.TAU); ctx.fillStyle = `rgba(150,120,80,${.3 * (1 - ph) * moving})`; ctx.fill(); }
      const items = [];
      const lay = [[0, 0], [-24, -11], [-28, 13], [-50, 2], [-54, -17], [-60, 19], [-80, -6], [-86, 11], [-106, 1]];
      lay.forEach((o, i) => {
        const ia = i / lay.length * U.TAU + .4, ix = Math.cos(ia) * (40 + (i % 3) * 9), iy = Math.sin(ia) * (22 + (i % 2) * 8) + 8;
        const mx = dx * o[0] + nx * o[1], my = dy * o[0] + ny * o[1] * .8;
        const x = h[0] + U.lerp(mx, ix, idle) * s, y = h[1] + U.lerp(my, iy, idle) * s;
        const d = idle > .6 ? (ix > 0 ? -1 : 1) : bandDir; items.push({ y, f: () => rider(x, y + 8 * s, s, d, phase + i * 1.3, moving, i === 0) });
      });
      [[-17, -4], [17, -8], [0, 14]].forEach((o, i) => { const x = h[0] + o[0] * s, y = h[1] + o[1] * s; items.push({ y: y - 2, f: () => yurt(x, y + 6 * s, s * 1.02, U.clamp(idle * 2 - .6 - i * .15)) }); });
      items.sort((a, b) => a.y - b.y).forEach((it) => it.f());
      for (let i = 0; i < 5; i++) { const ph = (L.t * .22 + i / 5) % 1; ctx.beginPath(); ctx.arc(h[0] + Math.sin(ph * 5 + i) * 6 * s + ph * 10, h[1] - (18 + ph * 54) * s, (3 + ph * 8) * s, 0, U.TAU); ctx.fillStyle = `rgba(90,80,65,${.2 * (1 - ph) * U.clamp(idle * 2 - 1)})`; ctx.fill(); }
      ctx.restore();
    }

    /* nyelvcsalád-fa (2–3. lépés) */
    drawTree(U.clamp(Math.min(sp - .45, 2.55 - sp) * 2.2) * (L.step === 1 ? U.clamp((L.st - .5) * 1.6) : 1));
    /* forráskártya (10. lépés) */
    drawSources(srcA);

    drawCompass();
    drawTimeline(j);
    drawFrame();
  }

  /* ── Lépések (cím + panelszöveg a .md-ből) ─────────────────── */
  const sliderFmt = (v) => nth('csúszka nevek', Math.round(v));
  const steps = [
    { settle: 6.6 }, { settle: 5.6 }, { settle: 8.4 }, { settle: 7 }, { settle: 7.6 },
    { settle: 11.8 }, { settle: 11 }, { settle: 8 }, { settle: 11 },
    { settle: 17.5,
      enter() { Object.assign(st9, { auto: true, t0: 0, j: 0, jul: 0, julP0: 0, julT0: 0, src: 1, srcP0: 1, srcT0: -9 }); },
      controls(L) {
        st9.slider = L.slider({ label: L.lab('csúszka'), k: 'csúszka', min: 0, max: 7, step: 0.01, value: 0, format: sliderFmt, onInput: (v) => { st9.auto = false; st9.j = v; } });
        L.button(L.lab('lejátszás gomb'), () => { st9.auto = true; st9.t0 = L.st; st9.j = 0; }, 'lejátszás gomb');
        L.button(L.lab('julianus gomb'), (b) => { st9.julP0 = julP(); st9.julT0 = L.st; st9.jul = st9.jul ? 0 : 1; b.classList.toggle('on', !!st9.jul); }, 'julianus gomb');
        const sb = L.button(L.lab('források gomb'), (b) => { st9.srcP0 = srcP(); st9.srcT0 = L.st; st9.src = st9.src ? 0 : 1; b.classList.toggle('on', !!st9.src); }, 'források gomb');
        sb.classList.add('on');
      } },
  ];

  L = Lesson.create({
    content: window.LESSON_CONTENT,
    home: false,
    steps,
    init(Lx) { L = Lx; },
    draw(Lx) { L = Lx; draw(); },
  });
})();
