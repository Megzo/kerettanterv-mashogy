<script>
/* ── MODUL: Térkép (TortMap) ──────────────────────────────────────────────────────────────
   Térképmotor a történelemleckékhez. Lecke-független: változtatás nélkül átemelhető a
   shared/tort/ alá (pl. shared/tort/map.js). Függ: TortProj (shared/tort/proj.js), a
   shared/tort/map-*.js adatfájlok, és a lecke-motor L objektuma a feliratokhoz (L.tx, L.measure,
   L.pill, L.fonts, L.U – így a QA és a review mód minden térképfeliratot lát).

   const map = TortMap.create({
     proj:    TortProj.lcc({lon0: 20, lat0: 38, lat1: 30, lat2: 46}),   // a lecke egyetlen vetülete
     layers:  [{data: TORT_MAP_VILAG},                                  // durvától a finomig; a finomabb réteg
               {data: TORT_MAP_MEDITERRAN},                             //   csak a saját kivágatában rajzol,
               {data: TORT_MAP_KARPAT, fade: [4500, 7500]}],             //   fade: [s0, s1] között úszik be (s = px/Föld-sugár)
     borders: TORT_MAP_HATAROK,   // opcionális: a „mai határok” réteg adata
     ancient: true,               // a modern: 1 elemek (víztározó, csatorna) kimaradnak
     rect:    [0, 0, 1360, 1080], // a feliratok elhelyezési területe (alap: a vizuális terület)
   });

   KAMERA
     TortMap.fit(proj, [lonMin, latMin, lonMax, latMax], [x, y, w, h], pad?) → nézet {lon, lat, s, x, y}
     TortMap.lerp(proj, a, b, u)    nézet a és b között (u 0..1): fix pont körüli zoom + pan, s logaritmikusan
                                    (nagy zoomnál is természetes: egy pont végig ugyanott marad a képernyőn)
     const cam = TortMap.camera(proj)
     cam.go(nézet, t, dur)          átmenet indítása a jelenlegi állásból (t: tetszőleges óra, pl. L.st)
     cam.at(t) → nézet              a t időpillanat nézete (inOut lassítással); visszafelé lépésnél rövid dur-t adj
     TortMap.zfade(V, s0, s1)       0..1: hol tart V.s az [s0, s1] között (log.) – rétegek ki-/beúsztatása zoomra

   KÉPKOCKÁNKÉNT (a sorrend: frame → base → region / line / saját rajz → labels)
     const V = map.frame(nézet)     beállítja a kamerát; V = TortProj.view (V.pt, V.inv, V.s)
     map.base(ctx, o)               tenger, szárazföld, hegységfoltok, folyók, tavak, partvonal.
                                    o = {rivers: {rank: 6 | [r0, r1, r2] (rétegenként), hi: {'Duna': {w: 5, wkm: .4, c}}
                                         (9 px fölött part + világos víz),
                                         only: ['Duna', …]}, mountains: 0..1 (alfa), lakes: true, style: {sea, land, …}}
     map.borders(ctx, a)            mai határok, halvány szaggatott vonal (a: alfa); mellé: TortMap.stamp(„mai határok”)
     map.region(ctx, items, o)      lágy szélű folt(ok) EGY rétegben (az átfedés nem sötétedik):
                                    items = [{blobs: [[lon, lat, km], …]} | {poly: [[lon, lat], …]}, a: 0..1]
                                    o = {color, alpha (alap .4), blur (px, alap 14), land: true (szárazföldre vágva,
                                         a tavak kivételével)}
     map.line(ctx, pts, o)          vonal / animált nyíl: pts = [[lon, lat], …];
                                    o = {p: 0..1 (haladás), color, w (px), wkm (szélesség km-ben, min. w), dash,
                                         head: true (nyílhegy), halo: true, smooth: true, cap} → {x, y, ang, len}
     map.labels(L, items, o)        ütközésmentes címkézés (prioritás szerint, mohón; a korábbi helyet megtartja):
                                    items = [{id, lon, lat | x, y, s, k, sub, sk, pri, r (jel sugara, 0: nincs),
                                              dot (alap pontot rajzol), size, w, f, i, c, subc, a, dirs, force}]
                                    dirs: ['E','W','N','S','NE','SE','NW','SW'] (alap) vagy ['C'] (területnév középen);
                                    ha a közeli helyek foglaltak, távolabb, szaggatott vezetővonallal próbálja.
                                    o = {avoid: [{x, y, w, h}], rect} → az elhelyezett dobozok [{id, x, y, w, h}]
     map.scale(L, x, y, o)          méretarány-vonalzó kerek km-értékkel; o = {k: felirat-kulcs („# km”), max: px}
   SEGÉDEK
     map.pt(lon, lat) → [x, y] (másolat) · map.ppk(lon, lat) → px / km ott · map.river(név) → [[lon, lat], …]
     TortMap.slice(line, a, b)      a vonal a- és b-hez ([lon, lat]) legközelebbi csúcsa közötti szakasza
     TortMap.nearest(line, p)       {i, p}: a p-hez legközelebbi csúcs
     TortMap.spline(pts, n, closed) Catmull–Rom simítás (n pont szakaszonként)
     TortMap.offset(lon, lat, kelet_m, észak_m) → [lon, lat] (helyi alaprajzokhoz méterben)
     TortMap.stamp(L, s, x, y, o)   bélyeg („vázlatos”, „mai határok”, „becslés”): −3°, Bricolage 22 px 600, keret;
                                    o = {k, est: true → okker, a: 'left' | 'center' | 'right'} → doboz
   Rétegek keverése: a durva réteg a finomabb kivágatán kívül teljes erővel, belül (1 − alfa)-val rajzol.
   Teljesítmény: a kivágaton kívüli gyűrűk kimaradnak; a foltok negyed felbontású pufferben mosódnak el.
   ───────────────────────────────────────────────────────────────────────────────────────── */
const TortMap = (() => {
  'use strict';
  const TP = window.TortProj;
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const smooth = (t) => { t = clamp(t); return t * t * (3 - 2 * t); };
  const inOut = (t) => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
  const DEF = { sea: 'rgba(70,150,215,.22)', land: '#f5eddd', coast: '#1b5a94', coastW: 1.5, river: '#1b5a94',
    lake: '#c6dbe8', lakeLine: '#1b5a94', mtn: '#7a623e', border: '#1c2440', ink: '#1c2440', muted: '#565d72',
    halo: 'rgba(250,246,238,.94)', card: '#fffaf1', est: '#8f5a0c' };
  const R_KM = 6371;

  function ringBox(r) {
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (let i = 0; i < r.length; i += 2) { const x = r[i], y = r[i + 1]; if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    return [x0, y0, x1, y1];
  }

      L.tx(q.type.s, x + pad + 84, y + pad + 22, Object.assign({}, LF, { c: col, k: q.type.k }));
      L.tx(q.title.s, x + pad + 84, y + pad + 64, { f: F.D, s: 36, w: 560, c: INK, k: q.title.k, max: w - pad * 2 - 84 });
      let yy = y + head + 26;

      const us = [ev.a0, ev.a1 + 1, wr.a + .5].concat(Ln.mark ? [Ln.mark.a] : []);
      let lo = Math.min(...us), hi = Math.max(...us); const pd = (hi - lo) * .1; lo -= pd; hi += pd;

      L.tx(gs, (xm + xw) / 2, by - 14, { f: F.M, s: 26, w: 700, a: 'center', c: RED, k: [Ln.gap.k, ev.dateK, wr.dateK].flat().filter(Boolean) });
      /* tengely */
      c.strokeStyle = INK; c.lineWidth = 2.5; c.beginPath(); c.moveTo(lx, yl); c.lineTo(lx + lw, yl); c.stroke();
      c.fillStyle = INK; c.beginPath(); c.moveTo(lx + lw + 4, yl - 8); c.lineTo(lx + lw + 18, yl); c.lineTo(lx + lw + 4, yl + 8); c.closePath(); c.fill();

      const ds = ev.a1 != null && ev.a1 !== ev.a0 ? Yt.range(ev.a0, ev.a1, T2) : Yt.label(ev.a0, T2);

})();

/* ── MODUL: Kártyák (TortCards) ────────────────────────────────────────────────────
   G modul (pilot/tortenelem-5-6/terv.md, 5. fejezet): „húzd a helyére” – kártyák rendezése zónákba
   (pl. két oszlop: falu / város), azonnali visszajelzéssel. Referencia: 07-kozepkori-varos.
   Később változtatás nélkül átemelhető: shared/tort/cards.js. Csak a Lesson motorra épül
   (L.ctx, L.tx, L.measure, L.pointer, L.stage, L.st, L.VW).

   const g = TortCards.create(L, {
     zones: [{id, x, y, w, h, title: {s, k}, sub?: {s, k}, head?: 110}], // célterületek; head: a fejléc magassága
     cards: [{id, label: {s, k}, zone}],      // zone: a helyes zóna id-ja (a kódban rögzített megoldás)
     tray: {x, y, w, h, pad?: 24, top?: 56},  // a kártyák kiinduló helye: sorfolytonosan, soronként középre
     font?: {f, s, w},                        // kártyafelirat (alap: Bricolage 24 / 600)
     gap?: 14, ease?: .45,                    // térköz px; a mozgás hossza mp
     decor?: (zone, alpha) => {}              // opcionális: saját rajz a zóna fejlécébe
   });
   g.reset()                  minden kártya a tálcára, animáció nélkül (a lépés enter()-jében hívd)
   g.place(id, zoneId, t0?)   kártya egy zónába (zoneId null → vissza a tálcára); a mozgás t0-tól (L.st) indul
   g.solve(t0?)               minden kártya a helyes zónába, kissé lépcsőzetesen
   g.update()                 minden képkockán, a rajzolás előtt, csak az aktív lépésben: húzás, kurzor
   g.draw({a})                zónák, kártyák (a húzott legfelül), visszajelzés: zöld keret + pipa / piros + kereszt
   g.score() → {ok, placed, total}   ·   g.touched: a felhasználó már húzott   ·   g.cards, g.zones
   Az állapot zárt képletű: a kártya helye = lerp(from, cél, inOut((L.st − t0) / ease)).
   ──────────────────────────────────────────────────────────────────────────────── */
const TortCards = (() => {
  const F = Lesson.FONTS, U = Lesson.U;
  const INK = '#1c2440', MUT = '#565d72', CARD = '#fffaf1', GOOD = '#1d7a45', BAD = '#b3261e', RED = '#c8401c';

  function create(L, cfg) {
    const FT = Object.assign({ f: F.B, s: 24, w: 600 }, cfg.font || {});
    const gap = cfg.gap || 14, ease = cfg.ease || .45, PX = 18, H = FT.s + 30, ICON = 30;
    const zones = cfg.zones.map((z) => Object.assign({ head: 110 }, z));
    const cards = cfg.cards.map((q, i) => ({ id: q.id, label: q.label, zone: q.zone, i, at: null, ord: 0, from: null, tgt: null, t0: -99 }));
    const g = { zones, cards, touched: false, drag: null, _pd: false, _ord: 0, _hov: null };
    const byId = (id) => cards.find((q) => q.id === id);
    const zoneAt = (x, y) => zones.find((z) => x >= z.x && x <= z.x + z.w && y >= z.y && y <= z.y + z.h) || null;
    const cw = (q) => L.measure(q.label.s, FT).w + PX * 2 + ICON;
    const ez = (t) => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

    /* sorfolytonos elhelyezés egy téglalapban; center: a sorok középre igazítva */
    function flow(list, x, y, w, center) {
      const rows = [[]]; let cx = 0;
      for (const q of list) { const ww = cw(q); if (cx > 0 && cx + ww > w) { rows.push([]); cx = 0; } rows[rows.length - 1].push({ q, ww, x: cx }); cx += ww + gap; }
      const out = {};
      rows.forEach((r, ri) => {
        const rw = r.length ? r[r.length - 1].x + r[r.length - 1].ww : 0, off = center ? (w - rw) / 2 : 0;
        r.forEach((e) => { out[e.q.id] = { x: x + off + e.x, y: y + ri * (H + gap), w: e.ww }; });
      });
      return out;
    }
    let traySlots = null;
    const tray = () => { const t = cfg.tray, p = t.pad == null ? 24 : t.pad; return { x: t.x + p, y: t.y + (t.top == null ? 56 : t.top), w: t.w - p * 2 }; };
    function target(q) {
      if (!q.at) { if (!traySlots) { const t = tray(); traySlots = flow(cards, t.x, t.y, t.w, true); } return traySlots[q.id]; }
      const z = zones.find((zz) => zz.id === q.at), list = cards.filter((c2) => c2.at === q.at).sort((a, b) => a.ord - b.ord);
      return flow(list, z.x + 20, z.y + z.head, z.w - 40, false)[q.id];
    }
    function disp(q) {
      const T = target(q);
      if (!q.tgt || Math.abs(T.x - q.tgt.x) > .5 || Math.abs(T.y - q.tgt.y) > .5) {   // új cél (pl. átrendeződés): onnan, ahol most van
        q.from = q.tgt ? cur(q) : null; q.t0 = q.tgt ? L.st : -99; q.tgt = { x: T.x, y: T.y };
      }
      return Object.assign(cur(q), { w: T.w });
    }
    function cur(q) {
      if (!q.from) return { x: q.tgt.x, y: q.tgt.y };
      const k = ez(U.clamp((L.st - q.t0) / ease));
      return { x: U.lerp(q.from.x, q.tgt.x, k), y: U.lerp(q.from.y, q.tgt.y, k) };
    }

    g.reset = () => { cards.forEach((q) => { q.at = null; q.ord = 0; q.from = null; q.tgt = null; q.t0 = -99; }); traySlots = null; g.drag = null; g.touched = false; g._ord = 0; };
    g.place = (id, zid, t0, from) => {
      const q = typeof id === 'string' ? byId(id) : id; if (!q) return;
      const p = from || (q.tgt ? cur(q) : target(q));
      q.at = zid || null; q.ord = ++g._ord;
      const T = target(q); q.from = { x: p.x, y: p.y }; q.tgt = { x: T.x, y: T.y }; q.t0 = t0 == null ? L.st : t0;
    };
    g.solve = (t0) => { const t = t0 == null ? L.st : t0; cards.filter((q) => q.at !== q.zone).forEach((q, i) => g.place(q, q.zone, t + i * .08)); };
    g.score = () => ({ ok: cards.filter((q) => q.at && q.at === q.zone).length, placed: cards.filter((q) => q.at).length, total: cards.length });

    g.update = () => {
      const p = L.pointer, edge = p.down && !g._pd; g._pd = p.down;
      const hit = () => { for (let i = cards.length - 1; i >= 0; i--) { const q = order()[i], d = disp(q); if (p.x >= d.x && p.x <= d.x + d.w && p.y >= d.y && p.y <= d.y + H) return { q, d }; } return null; };
      if (edge && p.x < L.VW && !g.drag) { const h = hit(); if (h) { g.drag = { q: h.q, dx: p.x - h.d.x, dy: p.y - h.d.y }; g.touched = true; } }
      if (g.drag && !p.down) {
        const d = g.drag, x = p.x - d.dx, y = p.y - d.dy, z = zoneAt(p.x, p.y), t = cfg.tray;
        const inTray = p.x >= t.x && p.x <= t.x + t.w && p.y >= t.y && p.y <= t.y + t.h;
        if (z) g.place(d.q, z.id, L.st, { x, y });
        else if (inTray) g.place(d.q, null, L.st, { x, y });
        else { d.q.from = { x, y }; d.q.t0 = L.st; }                  // máshová ejtve: vissza a helyére
        g.drag = null;
      }
      const h = g.drag ? null : (p.inside && p.x < L.VW ? hit() : null);
      g._hov = h ? h.q : null;
      if (L.stage) L.stage.style.cursor = g.drag ? 'grabbing' : h ? 'grab' : '';
    };
    const order = () => cards.slice().sort((a, b) => (a === (g.drag && g.drag.q) ? 1 : 0) - (b === (g.drag && g.drag.q) ? 1 : 0) || (a.at ? 1 : 0) - (b.at ? 1 : 0) || a.ord - b.ord || a.i - b.i);

    function mark(c, ok, x, y) {        // pipa / kereszt (rajz, nem szöveg)
      c.save(); c.lineCap = 'round'; c.lineJoin = 'round'; c.lineWidth = 4; c.strokeStyle = ok ? GOOD : BAD; c.beginPath();
      if (ok) { c.moveTo(x - 9, y); c.lineTo(x - 3, y + 7); c.lineTo(x + 10, y - 8); } else { c.moveTo(x - 7, y - 7); c.lineTo(x + 7, y + 7); c.moveTo(x + 7, y - 7); c.lineTo(x - 7, y + 7); }
      c.stroke(); c.restore();
    }
    function card(c, q, d, lift) {
      const placed = !!q.at, ok = placed && q.at === q.zone, hov = g._hov === q;
      c.save();
      if (lift) { c.shadowColor = 'rgba(70,50,20,.28)'; c.shadowBlur = 22; c.shadowOffsetY = 8; }
      c.beginPath(); c.roundRect(d.x, d.y, d.w, H, 10); c.fillStyle = CARD; c.fill(); c.shadowColor = 'transparent';
      if (placed && !lift) { c.fillStyle = U.rgba(ok ? GOOD : BAD, .08); c.fill(); }
      c.lineWidth = placed && !lift ? 3 : 2; c.strokeStyle = placed && !lift ? (ok ? GOOD : BAD) : hov || lift ? RED : U.rgba(INK, .45); c.stroke();
      L.tx(q.label.s, d.x + PX, d.y + H / 2 + 1, Object.assign({}, FT, { b: 'middle', c: INK, k: q.label.k }));
      const ix = d.x + d.w - PX - 8, iy = d.y + H / 2;
      if (placed && !lift) mark(c, ok, ix, iy);
      else { c.fillStyle = U.rgba(INK, .4); for (let r = -1; r <= 1; r++) for (let s = 0; s < 2; s++) { c.beginPath(); c.arc(ix - 3 + s * 7, iy + r * 7, 2.2, 0, Math.PI * 2); c.fill(); } }
      c.restore();
    }
    g.draw = (o = {}) => {
      const c = L.ctx, A = o.a == null ? 1 : o.a; if (A <= .01) return;
      c.save(); c.globalAlpha *= A;
      for (const z of zones) {
        c.beginPath(); c.roundRect(z.x, z.y, z.w, z.h, 16); c.fillStyle = 'rgba(255,250,241,.82)'; c.fill();
        c.setLineDash([10, 7]); c.lineWidth = 2.5; c.strokeStyle = U.rgba(INK, .5); c.stroke(); c.setLineDash([]);
        L.tx(z.title.s, z.x + 22, z.y + 54, { f: F.D, s: 40, w: 600, c: INK, k: z.title.k });
        if (z.sub) L.tx(z.sub.s, z.x + 22, z.y + 88, { f: F.B, s: 22, w: 500, c: MUT, k: z.sub.k });
        if (cfg.decor) { c.save(); cfg.decor(z, c.globalAlpha); c.restore(); }
      }
      const t = cfg.tray; c.beginPath(); c.roundRect(t.x, t.y, t.w, t.h, 16); c.fillStyle = 'rgba(28,36,64,.05)'; c.fill();
      c.lineWidth = 2; c.strokeStyle = U.rgba(INK, .25); c.stroke();
      const p = L.pointer;
      for (const q of order()) {
        if (g.drag && g.drag.q === q) continue;
        card(c, q, disp(q), q.from && L.st - q.t0 < ease);
      }
      if (g.drag) { const q = g.drag.q, d = disp(q); card(c, q, { x: p.x - g.drag.dx, y: p.y - g.drag.dy, w: d.w }, true); }
      c.restore();
    };
    return g;
  }
  return { create };
})();
/* ── MODUL VÉGE: Kártyák ── */

/* ── MODUL: Csatatér (TortBattle) ─────────────────────────────────────────────────
   E modul (pilot/tortenelem-5-6/terv.md, 5. fejezet): taktikai és operatív léptékű csatavázlat –
   terep (folyó, sziget, mocsár, domb, várfal), egységblokkok, hadmozdulat-nyilak, ágyútűz,
   erőviszony-oszlop, dátumsáv, jelmagyarázat. Referencia: 12-nandorfehervar. Később változtatás
   nélkül átemelhető: shared/tort/battle.js. Csak a Lesson motorra épül (L.ctx, L.tx, L.measure,
   L.fonts); térkép nélkül is megy (TortBattle.local), és TortMap-nézettel is (ugyanaz a pt-függvény).

   KOORDINÁTÁK: minden hely [lon, lat] fokban; szélesség, távolság méterben (m), rajzméret px-ben.
   const B = TortBattle.create(L, {sides?: {a: '#…', b: '#…'}, style?: {…}})   alap: TortBattle.SIDES
   B.frame(pt, ppk)          képkockánként, rajzolás előtt: pt(lon, lat) → [x, y] (pl. TortMap map.pt),
                             ppk: px/km a nézetben (pl. map.ppk(V.lon, V.lat))
   TortBattle.local({lon, lat, x, y, ppk}) → {pt, ppk}   térkép nélküli helyi nézet (észak felül)
   TortBattle.lerpLocal(a, b, u)                           két helyi nézet között (ppk logaritmikusan)

   TEREP (ajánlott sorrend: mocsár, domb → víz → sziget → fal)
     B.water(ctx, rivers, o)   rivers = [{line: [[lon, lat], …], w: m | [m, …] (pontonként)}] – a vonal
                               simított; part (sötét) és víz (világos) két menetben, így a torkolatok
                               összeolvadnak. o = {a, minPx: 2, flow: t (mp) → sodrásjelek a folyásirányban}
     B.island(ctx, poly, o)    sziget a vízen, parttal · B.marsh(ctx, poly, o) mocsár (kitöltés + nádcsomók,
                               méteres rácson, determinisztikus; o.step m) · B.hill(ctx, {c, rx, ry, n}, o) domb
                               (rx, ry méterben, n szintgyűrű)
     B.walls(ctx, poly, o)     várfal tornyokkal: o = {w: px, fill, dmg: 0..1, hit: (i) => true a sérülő
                               szakaszokra (i: a poly[i] → poly[i+1] szakasz)}
   EGYSÉGEK, MOZGÁS
     B.unit(ctx, u)            u = {side, at: [lon, lat], ang: fok (menetirány; 0 = kelet, 90 = észak),
                               kind: 'inf' | 'cav' | 'art' | 'ship' | 'camp', w, h (px: front × mélység),
                               n: 0..1 (a blokk mélysége a létszámmal), a, hi, label: {s, k}, ld: [dx, dy]}
     B.arrow(ctx, pts, o)      széles hadmozdulat-nyíl: pts = [[lon, lat], …] (simítva); o = {side | col,
                               p: 0..1 (haladás), w: px (16), dash: true (terv, visszavonulás), a} → {x, y, ang}
     B.fire(ctx, from, to, t, o)   ágyútűz (lövedék + porfelhő, vér és láng nélkül), periodikus zárt
                               képlet a t időből; o = {rate: lövés/mp, seed, a}
     B.label(s, at, o)         felirat fehér kontúrral (L.tx): o = {k, s, w, f, i, c, a, ls, px: true → at képernyő-px}
     TortBattle.key(keys, t)   keys = [[t, v], …] (v szám vagy tömb) → lassított (inOut) érték
     TortBattle.river(r)       {line, w} → simított pontsor [[lon, lat, w], …] (gyorsítótárazva; a water is ezt rajzolja)
     TortBattle.along(path, u) → {p, ang, w}: a tört vonal u-adik (0..1, méterben mért) pontja
     TortBattle.near(path, p) → u · TortBattle.at(path, u, m) → [lon, lat] (m méterrel balra a vonaltól)
     TortBattle.across(path, u, m) → [bal, jobb]: m méteres keresztmetszet · TortBattle.slice(path, u0, u1)
     TortBattle.off(p, kelet_m, észak_m) → [lon, lat] · TortBattle.dist(a, b) → m · TortBattle.length(path) → m
     TortBattle.player(keys, {dur}) → P: P.at(st) a kulcsok szerint (önlejátszás), P.take(v, st) a csúszka
                               átveszi (dur alatt simítva), P.reset(), P.user, P.cur
   KIJELZŐK
     B.forces(x, y, w, rows, o)   erőviszony-oszlop: rows = [{side, name: {s, k}, val?: {s, k},
                               parts: [{lo, hi, a, name?: {s, k}, val?: {s, k}}]}]; tömör sáv lo-ig, csíkozott
                               lo–hi (a becslés bizonytalansága). o = {max, a} → {x, y, w, h}
     B.rail(x, y, w, o)        dátum-/évsáv: o = {t0, t1, cur, ticks: [{t, s, k, minor}], spans: [{t0, t1, s, k, col}],
                               events: [{t, s, k, d?: {s, k}, col, a}], a} → {X: t → x}
     B.legend(x, y, items, o)  items = [{side, kind, s, k}] → {x, y, w, h}
   SZÍNEK: TortBattle.SIDES = {a: indigó, b: szilva} – semleges pár, nincs „jó zöld / rossz piros”.
   ──────────────────────────────────────────────────────────────────────────────── */
const TortBattle = (() => {
  'use strict';
  const U = Lesson.U, F = Lesson.FONTS, TAU = Math.PI * 2, RAD = Math.PI / 180;
  const clamp = U.clamp, lerp = U.lerp, inOut = U.inOut;
  const SIDES = { a: '#3b4590', b: '#7d3a66' };
  const ST = { ink: '#1c2440', muted: '#565d72', card: '#fffaf1', land: '#f1e6cf', water: '#b4cbd6', bank: '#1b5a94',
    marsh: '#56703f', hill: '#7a623e', wall: '#4d4134', wallFill: '#e5d7b8', smoke: '#565d72', halo: 'rgba(250,246,238,.94)', hi: '#c8401c' };
  const MLAT = 110540, mlon = (lat) => 111320 * Math.cos(lat * RAD);
  const off = (p, e, n) => [p[0] + e / mlon(p[1]), p[1] + n / MLAT];
  const dist = (a, b) => Math.hypot((b[0] - a[0]) * mlon((a[1] + b[1]) / 2), (b[1] - a[1]) * MLAT);

  function key(keys, t) {
    if (t <= keys[0][0]) return keys[0][1];
    for (let i = 1; i < keys.length; i++) if (t <= keys[i][0]) {
      const [t0, a] = keys[i - 1], [t1, b] = keys[i], u = inOut((t - t0) / Math.max(1e-6, t1 - t0));
      return Array.isArray(a) ? a.map((v, j) => lerp(v, b[j], u)) : lerp(a, b, u);
    }
    return keys[keys.length - 1][1];
  }
  function spline(pts, n) {          // Catmull–Rom, tetszőleges dimenzióban (lon, lat, szélesség …)
    const N = pts.length; if (N < 3) return pts.map((p) => p.slice());
    const out = [], D = pts[0].length;
    for (let i = 0; i < N - 1; i++) {
      const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(N - 1, i + 2)];
      for (let j = 0; j < n; j++) {
        const t = j / n, t2 = t * t, t3 = t2 * t, q = [];
        for (let d = 0; d < D; d++) q.push(.5 * (2 * p1[d] + (-p0[d] + p2[d]) * t + (2 * p0[d] - 5 * p1[d] + 4 * p2[d] - p3[d]) * t2 + (-p0[d] + 3 * p1[d] - 3 * p2[d] + p3[d]) * t3));
        out.push(q);
      }
    }
    out.push(pts[N - 1].slice());
    return out;
  }
  const rc = new WeakMap();
  function river(r) {
    let s = rc.get(r);
    if (!s) { const ws = Array.isArray(r.w) ? r.w : r.line.map(() => r.w || 300); s = spline(r.line.map((p, i) => [p[0], p[1], ws[i]]), 8); rc.set(r, s); }
    return s;
  }
  const cc = new WeakMap();
  function cum(path) {
    let s = cc.get(path);
    if (!s) { s = [0]; for (let i = 1; i < path.length; i++) s.push(s[i - 1] + dist(path[i - 1], path[i])); cc.set(path, s); }
    return s;
  }
  function along(path, u) {
    const C = cum(path), g = clamp(u) * C[C.length - 1];
    let i = 1; while (i < path.length - 1 && C[i] < g) i++;
    const a = path[i - 1], b = path[i], f = clamp((g - C[i - 1]) / Math.max(1e-9, C[i] - C[i - 1]));
    const ang = Math.atan2((b[1] - a[1]) * MLAT, (b[0] - a[0]) * mlon(a[1])) / RAD;
    return { p: [lerp(a[0], b[0], f), lerp(a[1], b[1], f)], ang, w: a.length > 2 ? lerp(a[2], b[2], f) : 0 };
  }
  function near(path, p) {
    const C = cum(path); let bi = 0, bd = Infinity;
    path.forEach((q, i) => { const d = dist(q, p); if (d < bd) { bd = d; bi = i; } });
    return C[bi] / C[C.length - 1];
  }
  function at(path, u, m) { const q = along(path, u), a = (q.ang + 90) * RAD; return off(q.p, Math.cos(a) * m, Math.sin(a) * m); }
  function across(path, u, m) { return [at(path, u, m / 2), at(path, u, -m / 2)]; }
  function slice(path, u0, u1) {
    const C = cum(path), T = C[C.length - 1], lo = Math.min(u0, u1), hi = Math.max(u0, u1);
    const out = [along(path, lo).p];
    for (let i = 0; i < path.length; i++) { const u = C[i] / T; if (u > lo && u < hi) out.push([path[i][0], path[i][1]]); }
    out.push(along(path, hi).p);
    return u0 <= u1 ? out : out.reverse();
  }
  function player(keys, o = {}) {
    const dur = o.dur || .35;
    const P = {
      user: null, cur: null,
      at(st) { const v = P.user ? lerp(P.user.from, P.user.to, U.smooth((st - P.user.t0) / dur)) : key(keys, st); P.cur = v; return v; },
      take(v, st) { P.user = { from: P.cur == null ? v : P.cur, to: v, t0: st }; },
      reset() { P.user = null; P.cur = null; },
    };
    return P;
  }
  function local(v) {
    const k = mlon(v.lat) / 1000, kl = MLAT / 1000;
    return { pt: (lon, lat) => [v.x + (lon - v.lon) * k * v.ppk, v.y - (lat - v.lat) * kl * v.ppk], ppk: v.ppk };
  }
  const lerpLocal = (a, b, u) => ({ lon: lerp(a.lon, b.lon, u), lat: lerp(a.lat, b.lat, u), x: lerp(a.x, b.x, u), y: lerp(a.y, b.y, u),
    ppk: Math.exp(lerp(Math.log(a.ppk), Math.log(b.ppk), u)) });
  function inside(poly, p) {
    let r = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const a = poly[i], b = poly[j];
      if ((a[1] > p[1]) !== (b[1] > p[1]) && p[0] < (b[0] - a[0]) * (p[1] - a[1]) / (b[1] - a[1]) + a[0]) r = !r;
    }
    return r;
  }

  function create(L, cfg = {}) {
    const S = Object.assign({}, ST, cfg.style || {}), SD = Object.assign({}, SIDES, cfg.sides || {});
    const B = { pt: null, ppk: 1, S, SIDES: SD };
    B.frame = (pt, ppk) => { B.pt = pt; B.ppk = ppk; return B; };
    const P = (p) => { const q = B.pt(p[0], p[1]); return [q[0], q[1]]; };
    const colOf = (o) => o.col || SD[o.side] || S.ink;
    const dark = (col) => U.mix(col, '#10131f', .35);
    const sAng = (p, ang) => { const a = P(p), b = P(off(p, Math.cos(ang * RAD) * 40, Math.sin(ang * RAD) * 40)); return Math.atan2(b[1] - a[1], b[0] - a[0]); };
    const polyPath = (ctx, pts) => { ctx.beginPath(); pts.forEach((q, i) => (i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]))); ctx.closePath(); };
    const fontOf = (f) => `${f.i ? 'italic ' : ''}${f.w || 700} ${f.s || 24}px ${f.f || F.B}`;

    function ribbon(r, minPx) {
      const pts = river(r), Sx = pts.map(P), Lf = [], Rt = [];
      for (let i = 0; i < Sx.length; i++) {
        const a = Sx[Math.max(0, i - 1)], b = Sx[Math.min(Sx.length - 1, i + 1)];
        let tx = b[0] - a[0], ty = b[1] - a[1]; const d = Math.hypot(tx, ty) || 1; tx /= d; ty /= d;
        const hw = Math.max(minPx == null ? 2 : minPx, pts[i][2] / 1000 * B.ppk) / 2;
        Lf.push([Sx[i][0] + ty * hw, Sx[i][1] - tx * hw]); Rt.push([Sx[i][0] - ty * hw, Sx[i][1] + tx * hw]);
      }
      return Lf.concat(Rt.reverse());
    }
    B.water = (ctx, rivers, o = {}) => {
      const rb = rivers.map((r) => ribbon(r, o.minPx));
      ctx.save(); ctx.globalAlpha *= o.a == null ? 1 : o.a; ctx.lineJoin = 'round';
      for (const r of rb) { polyPath(ctx, r); ctx.strokeStyle = S.bank; ctx.lineWidth = 5; ctx.stroke(); }
      for (const r of rb) { polyPath(ctx, r); ctx.fillStyle = S.water; ctx.fill(); }
      if (o.flow != null && B.ppk > 20) {          // sodrásjelek: kis ékek a folyásirányban, lassan úsznak
        ctx.strokeStyle = U.rgba(S.bank, .45); ctx.lineWidth = 2; ctx.lineCap = 'round';
        for (const r of rivers) {
          const path = river(r), C = cum(path), T = C[C.length - 1], gap = 1100, sh = (o.flow * 120) % gap;
          for (let d = sh; d < T; d += gap) {
            const q = along(path, d / T); if (q.w < 250) continue;
            const s = P(q.p), th = sAng(q.p, q.ang), k = 7;
            ctx.beginPath(); ctx.moveTo(s[0] + Math.cos(th + 2.5) * k, s[1] + Math.sin(th + 2.5) * k); ctx.lineTo(s[0], s[1]);
            ctx.lineTo(s[0] + Math.cos(th - 2.5) * k, s[1] + Math.sin(th - 2.5) * k); ctx.stroke();
          }
        }
      }
      ctx.restore();
      return rb;
    };
    B.island = (ctx, poly, o = {}) => {
      const pts = spline(poly.concat([poly[0]]), 6).map(P);
      ctx.save(); ctx.globalAlpha *= o.a == null ? 1 : o.a;
      polyPath(ctx, pts); ctx.fillStyle = o.fill || S.land; ctx.fill(); ctx.strokeStyle = S.bank; ctx.lineWidth = 2.5; ctx.stroke();
      ctx.restore();
    };
    const tc = new WeakMap();
    B.marsh = (ctx, poly, o = {}) => {
      const pts = poly.map(P);
      ctx.save(); ctx.globalAlpha *= o.a == null ? 1 : o.a;
      polyPath(ctx, pts); ctx.fillStyle = U.rgba(S.marsh, .1); ctx.fill();
      if (B.ppk >= 25) {
        let T = tc.get(poly);
        if (!T) {
          T = []; const st = o.step || 330, r = U.rng(7);
          const lo0 = Math.min(...poly.map((p) => p[0])), lo1 = Math.max(...poly.map((p) => p[0])), la0 = Math.min(...poly.map((p) => p[1])), la1 = Math.max(...poly.map((p) => p[1]));
          for (let la = la0; la < la1; la += st / MLAT) for (let lo = lo0; lo < lo1; lo += st / mlon(la)) {
            const p = off([lo, la], (r() - .5) * st * .7, (r() - .5) * st * .7); if (inside(poly, p)) T.push(p);
          }
          tc.set(poly, T);
        }
        ctx.strokeStyle = U.rgba(S.marsh, .6); ctx.lineWidth = 1.8; ctx.lineCap = 'round'; ctx.beginPath();
        for (const p of T) { const q = P(p); ctx.moveTo(q[0] - 7, q[1]); ctx.lineTo(q[0] + 7, q[1]); ctx.moveTo(q[0], q[1]); ctx.lineTo(q[0], q[1] - 11); ctx.moveTo(q[0] - 4, q[1]); ctx.lineTo(q[0] - 7, q[1] - 8); ctx.moveTo(q[0] + 4, q[1]); ctx.lineTo(q[0] + 7, q[1] - 8); }
        ctx.stroke();
      }
      ctx.restore();
    };
    B.hill = (ctx, h, o = {}) => {
      const q = P(h.c), n = h.n || 3, rx = h.rx / 1000 * B.ppk, ry = h.ry / 1000 * B.ppk;
      ctx.save(); ctx.globalAlpha *= o.a == null ? 1 : o.a;
      for (let i = 0; i < n; i++) {
        const f = 1 - i / n; ctx.beginPath(); ctx.ellipse(q[0], q[1], rx * f, ry * f, -(h.rot || 0) * RAD, 0, TAU);
        ctx.fillStyle = U.rgba(S.hill, .08); ctx.fill(); ctx.setLineDash([7, 5]); ctx.strokeStyle = U.rgba(S.hill, .55); ctx.lineWidth = 1.8; ctx.stroke();
      }
      ctx.setLineDash([]); ctx.restore();
    };
    B.walls = (ctx, poly, o = {}) => {
      const pts = poly.map(P), w = o.w || 7, dmg = clamp(o.dmg || 0), N = pts.length;
      ctx.save(); ctx.globalAlpha *= o.a == null ? 1 : o.a; ctx.lineCap = 'butt';
      polyPath(ctx, pts); ctx.fillStyle = o.fill || S.wallFill; ctx.fill();
      for (let i = 0; i < N; i++) {
        const a = pts[i], b = pts[(i + 1) % N], hit = dmg > 0 && o.hit && o.hit(i);
        ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]);
        if (hit) { const g = 22; ctx.setLineDash([g * (1 - .55 * dmg), g * .55 * dmg]); ctx.strokeStyle = U.mix(S.wall, '#a8997f', dmg * .6); }
        else ctx.strokeStyle = S.wall;
        ctx.lineWidth = w; ctx.stroke(); ctx.setLineDash([]);
      }
      for (let i = 0; i < N; i++) {
        const q = pts[i], s = w * 1.9; ctx.beginPath(); ctx.rect(q[0] - s / 2, q[1] - s / 2, s, s);
        ctx.fillStyle = S.wall; ctx.fill(); ctx.strokeStyle = S.card; ctx.lineWidth = 1.5; ctx.stroke();
      }
      ctx.restore();
      return pts;
    };

    B.label = (s, at0, o = {}) => {
      const q = o.px ? at0 : P(at0), f = { s: o.s || 24, w: o.w || 700, f: o.f || F.B, i: o.i }, c = L.ctx;
      c.save(); if (o.alpha != null) c.globalAlpha *= o.alpha;
      c.font = fontOf(f); c.letterSpacing = o.ls || '0px'; c.textAlign = o.a || 'center'; c.textBaseline = 'alphabetic';
      c.lineJoin = 'round'; c.lineWidth = Math.max(5, f.s * .26); c.strokeStyle = S.halo; c.strokeText(s, q[0], q[1]); c.letterSpacing = '0px';
      const b = L.tx(s, q[0], q[1], Object.assign({}, f, { a: o.a || 'center', c: o.c || S.ink, k: o.k, ls: o.ls }));
      c.restore();
      return b;
    };
    function glyph(ctx, kind, w, h, col) {   // jel a blokkon (helyi koordináták: +x a menetirány)
      ctx.strokeStyle = S.card; ctx.lineWidth = 2; ctx.beginPath();
      const x0 = -h / 2 + 3, x1 = h / 2 - 3, y0 = -w / 2 + 3, y1 = w / 2 - 3;
      if (kind === 'inf') { ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.moveTo(x0, y1); ctx.lineTo(x1, y0); }
      else if (kind === 'cav') { ctx.moveTo(x0, y1); ctx.lineTo(x1, y0); }
      else if (kind === 'art') { const r = Math.min(w, h) * .2; ctx.arc(-h * .12, 0, r, 0, TAU); ctx.moveTo(-h * .12 + r, 0); ctx.lineTo(x1, 0); }
      ctx.stroke();
    }
    B.unit = (ctx, u) => {
      const A = u.a == null ? 1 : u.a; if (A <= .01) return null;
      const q = P(u.at), col = colOf(u), w = u.w || 34, h = (u.h || 20) * (u.n == null ? 1 : .35 + .65 * clamp(u.n));
      ctx.save(); ctx.globalAlpha *= A; ctx.translate(q[0], q[1]); ctx.lineJoin = 'round';
      if (u.kind === 'camp') {
        for (const [dx, dy, s] of [[-w * .32, 4, 1], [w * .3, 6, .9], [0, -w * .2, 1.15]]) {
          const tw = w * .42 * s, th = w * .36 * s; ctx.beginPath(); ctx.moveTo(dx - tw / 2, dy + th / 2); ctx.lineTo(dx, dy - th / 2); ctx.lineTo(dx + tw / 2, dy + th / 2); ctx.closePath();
          ctx.fillStyle = U.rgba(col, .3); ctx.fill(); ctx.strokeStyle = col; ctx.lineWidth = 2.5; ctx.stroke();
          ctx.beginPath(); ctx.moveTo(dx, dy - th / 2); ctx.lineTo(dx, dy - th / 2 - 8); ctx.stroke();
        }
      } else {
        ctx.rotate(u.ang == null ? 0 : sAng(u.at, u.ang));
        if (u.kind === 'ship') {          // hajótest: orr a menetirányban
          const l = u.h || 30, b = u.w || 12;
          ctx.beginPath(); ctx.moveTo(l / 2, 0); ctx.quadraticCurveTo(l * .2, -b / 2, -l / 2, -b * .42); ctx.lineTo(-l / 2, b * .42); ctx.quadraticCurveTo(l * .2, b / 2, l / 2, 0); ctx.closePath();
          ctx.fillStyle = col; ctx.fill(); ctx.strokeStyle = S.card; ctx.lineWidth = 1.8; ctx.stroke();
          ctx.beginPath(); ctx.moveTo(-l * .05, -b * .25); ctx.lineTo(-l * .05, b * .25); ctx.stroke();
        } else {
          ctx.beginPath(); ctx.rect(-h / 2, -w / 2, h, w); ctx.fillStyle = col; ctx.fill(); ctx.strokeStyle = dark(col); ctx.lineWidth = 2; ctx.stroke();
          glyph(ctx, u.kind || 'inf', w, h, col);
          ctx.fillStyle = S.card; ctx.fillRect(h / 2 - 3, -w / 2 + 2, 3, w - 4);   // a front (menetirány) jelzése

    const col = i % 3, row = Math.floor(i / 3), x = X0 + col * (CW + 15), y = Y0 + row * (CH + 12), a = p(.2 + i * .07);
    al(a); rr(x, y, CW, CH, 10); c.fillStyle = '#f3ead8'; c.fill(); c.strokeStyle = 'rgba(77,65,52,.55)'; c.lineWidth = 2; c.stroke();
    L.tx(lab('v ' + m), x + 18, y + 38, { k: 'v ' + m, s: 26, w: 650, c: INK, max: CW - 36 });
    al(a * so); L.tx(lab('sz ' + m), x + 18, y + 72, { k: 'sz ' + m, s: 22, w: 600, i: true, c: SAd, max: CW - 36 });
  });
  // Batthyány: Pesten, ugyanaznap (a 13. név mellett)
  { const x = X0 + (CW + 15), y = Y0 + 4 * (CH + 12), wB = 2 * CW + 15, a = p(1.4);
    al(a); rr(x, y, wB, CH, 10); c.fillStyle = CARD; c.fill(); c.strokeStyle = RED; c.lineWidth = 2.5; c.stroke();
    L.tx(lab('batthyány cím') + ' (' + L.val('Batthyány kivégzése') + ')', x + 18, y + 36, { k: ['batthyány cím', 'Batthyány kivégzése'], s: 22, w: 700, c: RED, max: wB - 36 });
    L.tx(lab('batthyány 1') + ' ' + lab('batthyány 2'), x + 18, y + 70, { k: ['batthyány 1', 'batthyány 2'], s: 26, w: 650, c: INK, max: wB - 36 }); }
  // emlékhely, a megtorlás célja, közösségi büntetés
  const yb = Y0 + 5 * (CH + 12) + 24;
  const e1 = textCard(40, yb, [{ k: 'emlékmű cím', size: 24, w: 700, c: MUT }, { k: 'emlékmű 1', size: 26, w: 600, f: F.D }, { s: lab('emlékmű 2').replace('#', L.val('aradi emlékmű')), kk: ['emlékmű 2', 'aradi emlékmű'], size: 24, mono: false }], { a: p(2.0) });
  textCard(40, yb + e1.h + 16, [{ k: 'megtorlás cím', size: 24, w: 700, c: SBd }, { k: 'megtorlás 1', size: 24 }], { a: p(2.6), bd: SB });
  textCard(1330, yb, [{ k: 'zsidó cím', size: 24, w: 700, c: INK }, { s: lab('zsidó 1').replace('#', L.val('zsidó hadisarc')), kk: ['zsidó 1', 'zsidó hadisarc'], size: 24 }, { k: 'zsidó 2', size: 24 }, { k: 'zsidó 3', size: 24 }], { a: p(3.2), right: true });
}

/* ── 8. A kiegyezés ── */
function crown(x, y, s, a) {   // stilizált korona (rajz)
  al(a); c.lineJoin = 'round';
  c.beginPath(); c.moveTo(x - s * .5, y); c.lineTo(x - s * .55, y - s * .55); c.lineTo(x - s * .25, y - s * .3); c.lineTo(x, y - s * .7); c.lineTo(x + s * .25, y - s * .3); c.lineTo(x + s * .55, y - s * .55); c.lineTo(x + s * .5, y); c.closePath();
  c.fillStyle = '#e3c27a'; c.fill(); c.strokeStyle = '#6b4a12'; c.lineWidth = 3; c.stroke();
  c.beginPath(); c.rect(x - s * .52, y, s * 1.04, s * .16); c.fillStyle = '#d4ad5c'; c.fill(); c.stroke();
  for (const dx of [-.3, 0, .3]) { c.beginPath(); c.arc(x + dx * s, y + s * .08, s * .045, 0, TAU); c.fillStyle = RED; c.fill(); }
  c.beginPath(); c.moveTo(x, y - s * .7); c.lineTo(x, y - s * .86); c.moveTo(x - s * .07, y - s * .79); c.lineTo(x + s * .07, y - s * .79); c.stroke();
}
const S8 = { solvedAt: null };
function scene8(st, w, active) {
  GA = w;
  if (active) CARDS.update();
  const p = (t) => out(clamp((st - t) / .6));
  al(p(0)); T('ki cím', 40, 80, { f: F.D, s: 44, w: 600 });
  al(p(0)); L.tx(lab('ki koronázás').replace('#', L.val('koronázás')), 40, 118, { k: ['ki koronázás', 'koronázás'], s: 24, w: 600, c: MUT });
  al(p(0)); L.pill(L.val('kiegyezés éve'), 1330, 70, { k: 'kiegyezés éve', s: 30, w: 700, f: F.M, a: 'right', bg: CARD, bd: RED, bw: 2.5, c: RED, pad: 14, r: 10 });
  // érdekek és a közös uralkodó
  textCard(40, 160, [{ k: 'érdek Bécs cím', size: 26, w: 700, c: SBd }, { k: 'érdek Bécs 1', size: 24 }, { k: 'érdek Bécs 2', size: 24 }, { k: 'érdek Bécs 3', size: 24 }], { a: p(.5), bd: SB });
  textCard(1330, 160, [{ k: 'érdek magyar cím', size: 26, w: 700, c: SAd }, { k: 'érdek magyar 1', size: 24 }, { k: 'érdek magyar 2', size: 24 }, { k: 'érdek magyar 3', size: 24 }], { a: p(.9), bd: SA, right: true });
  crown(680, 230, 90, p(1.3));
  al(p(1.3)); T('ki uralkodó', 680, 290, { a: 'center', s: 28, w: 700, f: F.D });
  T('ki uralkodó 2', 680, 322, { a: 'center', s: 22, w: 600, c: MUT });
  al(p(1.6)); L.pill(lab('ki monarchia'), 680, 370, { k: 'ki monarchia', s: 26, w: 700, a: 'center', bg: CARD, bd: INK, bw: 2, c: INK, pad: 12, r: 10 });
  al(p(2.0)); L.pill(lab('engedmény'), 680, 432, { k: 'engedmény', s: 24, w: 700, a: 'center', bg: RED, c: CARD, pad: 12, r: 10 });
  c.globalAlpha = GA * p(.3); CARDS.draw({ a: 1 });
  const sc = CARDS.score(), done = sc.ok === sc.total;
  if (sc.placed > 0 && !done) { al(1); L.tx(lab('jó helyen').replace('#', sc.ok), 680, 1062, { k: 'jó helyen', s: 22, w: 700, a: 'center', c: MUT }); }
  if (done) {
    if (S8.solvedAt == null) S8.solvedAt = L.st;
    const q = out(clamp((L.st - S8.solvedAt - .3) / .5));
    al(q); L.pill(lab('eredmény'), 680, 1040, { k: 'eredmény', s: 24, w: 700, a: 'center', bg: SAd, c: CARD, pad: 12, r: 10 });
  } else S8.solvedAt = null;
}

/* ── 9. Összefoglalás ── */
function scene9(st, w) {
  GA = w;
  const p = (t) => out(clamp((st - t) / .6)), Y = TortTimeline.Y, u = (k) => Y.u(dat(k));
  const tw = L.measure(lab('ö cím'), { f: F.D, s: 44, w: 600 }).w;
  softCard(30, 30, tw + 50, 84, p(0)); al(p(0)); T('ö cím', 55, 88, { f: F.D, s: 44, w: 600 });
  // áttekintő szalag: 1847–1869
  TLo.view(1846.5, 1869.5);
  const ua = u('világosi fegyverletétel'), ub = u('koronázás');
  al(1); TLo.draw({ a: p(.2), bands: [{ u0: u('pesti forradalom'), u1: u('aradi kivégzések'), col: 'rgba(200,64,28,.28)' }],
    eras: [{ u0: u('aradi kivégzések'), u1: ub, name: K('ö önkényuralom'), col: '#565d72' }], eraA: p(.4) });
  // nagyított szalag: 1848–1849
  TLz.view(1848, 1850);
  const za = p(.6);
  // összekötő trapéz
  al(za * .9); c.beginPath(); c.moveTo(TLo.x(1848), TLo.top - 4); c.lineTo(TLz.x0, TLz.bot + 44); c.lineTo(TLz.x1, TLz.bot + 44); c.lineTo(TLo.x(1850), TLo.top - 4); c.closePath();
  c.fillStyle = 'rgba(200,64,28,.07)'; c.fill(); c.strokeStyle = 'rgba(200,64,28,.55)'; c.lineWidth = 2; c.setLineDash([6, 5]); c.stroke(); c.setLineDash([]);
  al(1); TLz.draw({ a: za, bands: [{ u0: u('hatvani csata'), u1: u('Buda visszafoglalása'), col: U.rgba(SA, .25) }] });
  const D = (k) => ({ s: L.val(k), k });
  const tav = { s: L.val('hatvani csata') + ' – ' + L.val('Buda visszafoglalása').replace(/^\d+\.\s*/, ''), k: ['hatvani csata', 'Buda visszafoglalása'] };
  TLz.cards([
    { u: u('Függetlenségi nyilatkozat'), title: K('ö nyilatkozat'), date: D('Függetlenségi nyilatkozat'), row: 3, a: p(1.6) },
    { u: u('világosi fegyverletétel'), title: K('ö Világos'), date: D('világosi fegyverletétel'), row: 1, a: p(2.0) },
    { u: u('pesti forradalom'), title: K('ö forradalom'), date: D('pesti forradalom'), row: 0, a: p(.8) },
    { u: u('pákozdi csata'), title: K('ö Pákozd'), date: D('pákozdi csata'), row: 0, a: p(1.1) },
    { u: (u('hatvani csata') + u('Buda visszafoglalása')) / 2, title: K('ö tavasz'), date: tav, row: 2, a: p(1.4), hi: true },
    { u: u('aradi kivégzések'), title: K('ö Arad'), date: D('aradi kivégzések'), row: 0, a: p(2.3) },
  ], { pitch: 100 });
  TLo.cards([{ u: ub, title: K('ö kiegyezés'), date: D('koronázás'), note: { s: lab('ö közben').replace('#', dat('kiegyezés éve').v - dat('világosi fegyverletétel').v), k: ['ö közben', 'kiegyezés éve', 'világosi fegyverletétel'], c: RED }, row: 0, a: p(2.8), hi: true }]);
  void ua;
}

/* ── térképes jelenetek: közös kamera ── */
function mapScenes(wt) {
  const wMap = Math.max(...MAPSTEP.map(wt));
  if (wMap <= .005) return;
  const isMap = MAPSTEP.includes(L.step);
  if (isMap && L.step !== camStep) {
    CAM.go(VIEWS[L.step], L.dir < 0 ? L.st - .2 : L.st, camStep < 0 ? 0 : L.dir > 0 ? 2.2 : .5);
    camStep = L.step;
  }
  const V = MAP.frame(CAM.at(isMap ? L.st : 1e9));
  BT.frame(MAP.pt, MAP.ppk(V.lon, V.lat));
  GA = wMap; al(1);
  MAP.base(c, { mountains: .14, rivers: { rank: [6, V.s > 2.5e4 ? 12 : 10], hi: { 'Duna': { w: 4.4 }, 'Tisza': { w: 3.2 } } } });
  const S = { 0: scene1, 1: scene2, 2: scene3, 4: scene5 };
  for (const i of MAPSTEP) { const w = wt(i) * wMap; if (w > .005) S[i](sT[i], w, L.step === i); }
}

/* ════════════════════════════════════════════════════════════════ */
const borderBtn = (S) => (L) => L.button(lab('gomb mai határok'), toggler(S), 'gomb mai határok');
const STEPS = [
  { settle: 6.0, enter() { S1.on = 0; S1.from = 0; S1.t0 = -9; }, controls: borderBtn(S1) },
  { settle: 5.6 },
  { settle: 8.4,
    enter() { P3.reset(); S3.sel = null; },
    controls(L) { SL3 = L.slider({ label: lab('csúszka dátum'), k: 'csúszka dátum', min: 0, max: d3('Buda visszafoglalása'), step: 1, value: 0, format: fmtDay,
      onInput: (v) => { P3.take(v, L.st); S3.sel = null; } }); } },
  { settle: 3.8,
    enter() { S4.f = null; S4.from = [1, 1]; S4.t0 = -9; },
    controls(L) { const set = focusSet(S4, 2); L.button(lab('gomb Debrecen'), () => set(0), 'gomb Debrecen'); L.button(lab('gomb Bécs'), () => set(1), 'gomb Bécs'); L.button(lab('gomb mind 4'), () => set(null), 'gomb mind 4'); } },
  { settle: 6.4,
    enter() { S5.on = 1; S5.from = 0; S5.t0 = 2.6; S5b.on = 0; S5b.from = 0; S5b.t0 = -9; },
    controls(L) {
      L.button(lab('gomb orosz nélkül'), () => { S5.from = tog(S5, L.st, .6); S5.on = 0; S5.t0 = L.st; }, 'gomb orosz nélkül');
      L.button(lab('gomb orosszal'), () => { S5.from = tog(S5, L.st, .6); S5.on = 1; S5.t0 = L.st; }, 'gomb orosszal');
      borderBtn(S5b)(L);
    } },
  { settle: 3.2,
    enter() { S6.f = null; S6.from = [1, 1, 1]; S6.t0 = -9; },
    controls(L) { const set = focusSet(S6, 3); L.button(lab('gomb Kossuth'), () => set(0), 'gomb Kossuth'); L.button(lab('gomb Görgei'), () => set(1), 'gomb Görgei');
      L.button(lab('gomb történészek'), () => set(2), 'gomb történészek'); L.button(lab('gomb mind 6'), () => set(null), 'gomb mind 6'); } },
  { settle: 4.2,
    enter() { S7.on = 1; S7.from = 0; S7.t0 = 2.4; },
    controls(L) {
      L.button(lab('gomb nevek'), () => { S7.from = tog(S7, L.st, .6); S7.on = 0; S7.t0 = L.st; }, 'gomb nevek');
      L.button(lab('gomb származás'), () => { S7.from = tog(S7, L.st, .6); S7.on = 1; S7.t0 = L.st; }, 'gomb származás');
    } },
  { settle: 3,
    enter() { CARDS.reset(); S8.solvedAt = null; },
    leave() { L.stage.style.cursor = ''; },
    controls(L) { L.button(lab('gomb megoldás'), () => CARDS.solve(), 'gomb megoldás'); L.button(lab('gomb újra'), () => { CARDS.reset(); S8.solvedAt = null; }, 'gomb újra'); } },
  { settle: 3.6 },
];

L = Lesson.create({
  content: window.LESSON_CONTENT,
  home: false,
  steps: STEPS,
  init(Lx) {
    L = Lx; c = L.ctx;
    MAP = TortMap.create({ proj: PROJ, ancient: true, borders: window.TORT_MAP_HATAROK,
      layers: [{ data: window.TORT_MAP_MEDITERRAN }, { data: window.TORT_MAP_KARPAT, fade: [4500, 7500] }] });
    BT = TortBattle.create(L);
    SRC = TortSource.create(L, { 'forrás': K('forrás jel'), 'rekonstrukció': K('rekonstrukció jel'), 'monda': K('monda jel'), 'becslés': K('becslés'), 'vázlatos': K('vázlatos'), 'illusztráció': K('illusztráció'), 'mai határok': K('mai határok') });
    TT = { bc: K('Kr. e.'), ad: K('Kr. u.'), cent: K('század'), years: K('év sablon') };
    TLz = TortTimeline.create(L, { x0: 70, x1: 1290, y: 520, h: 56, T: TT, src: SRC, bounds: [1800, 1900] });
    TLo = TortTimeline.create(L, { x0: 70, x1: 1290, y: 900, h: 56, T: TT, src: SRC, bounds: [1800, 1900] });
    const fit = (b, r) => TortMap.fit(PROJ, b, r);
    VIEWS[0] = fit([15.9, 45.95, 19.35, 48.4], [30, 30, 830, 1020]);
    VIEWS[1] = fit([16.2, 45.4, 25.2, 49.3], [30, 30, 1300, 830]);
    VIEWS[2] = fit([17.75, 47.2, 20.15, 48.3], [30, 30, 1300, 820]);
    VIEWS[4] = fit([16.3, 44.9, 26.6, 49.9], [30, 30, 1300, 1020]);
    CAM = TortMap.camera(PROJ);
    G3 = geom3();
    const D = G3.D;
    P3 = TB.player([[0.5, 0], [2.3, D.i + .2], [3.5, D.v + .2], [4.9, D.n + .3], [6.0, D.k + .3], [7.8, D.b]]);
    const zones = [{ id: 'közös', x: 40, y: 470, w: 620, h: 300, title: K('zóna közös'), sub: K('zóna közös 2') },
      { id: 'magyar', x: 700, y: 470, w: 630, h: 300, title: K('zóna magyar'), sub: K('zóna magyar 2') }];
    const cd = [['kártya oktatás', 'magyar'], ['kártya külügy', 'közös'], ['kártya bíróság', 'magyar'], ['kártya hadügy', 'közös'], ['kártya közlekedés', 'magyar'], ['kártya pénzügy', 'közös']];
    CARDS = TortCards.create(L, { zones, cards: cd.map(([k, z]) => ({ id: k, label: K(k), zone: z })), tray: { x: 40, y: 790, w: 1290, h: 220, top: 26 }, font: { s: 24, w: 600 } });
    L.cards = CARDS; L.players = { P3 };   // QA-hoz
    L.stage.addEventListener('pointerdown', (e) => { if (L.step === 2) click3(L.toStage(e)); });
  },
  draw(Lx) {
    L = Lx; c = L.ctx; GA = 1; paper(); grid(.045);
    const sp = L.sp, wt = (i) => clamp(1 - Math.abs(sp - i) * 2);
    sT[L.step] = L.st;
    mapScenes(wt);
    const S = { 3: scene4, 5: scene6, 6: scene7, 7: scene8, 8: scene9 };
    for (const i of [3, 5, 6, 7, 8]) { const w = wt(i); if (w > .005) S[i](sT[i], w, L.step === i); }
    c.globalAlpha = 1;
  },
});
})();
