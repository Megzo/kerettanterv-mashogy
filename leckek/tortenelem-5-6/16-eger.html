<script>
/* ── MODUL: Térkép (TortMap) ──────────────────────────────────────────────────────────────
   Térképmotor a történelemleckékhez. Lecke-független: változtatás nélkül átemelhető a
   shared/tort/ alá (pl. shared/tort/map.js). Függ: TortProj (shared/tort/proj.js), a
   shared/tort/map-*.js adatfájlok, és a lecke-motor L objektuma a feliratokhoz (L.tx, L.measure,
   L.pill, L.fonts, L.U – így a QA és a review mód minden térképfeliratot lát).

   const map = TortMap.create({
     proj:    TortProj.lcc({lon0: 20, lat0: 38, lat1: 30, lat2: 46}),   // a lecke egyetlen vetülete
     layers:  [{data: TORT_MAP_VILAG},                                  // durvától a finomig; a finomabb réteg
               {data: TORT_MAP_MEDITERRAN},                             //   csak a saját kivágatában rajzol,
               {data: TORT_MAP_KARPAT, fade: [4500, 7500]}],             //   fade: [s0, s1] között úszik be (s = px/Föld-sugár)
     borders: TORT_MAP_HATAROK,   // opcionális: a „mai határok” réteg adata
     ancient: true,               // a modern: 1 elemek (víztározó, csatorna) kimaradnak
     rect:    [0, 0, 1360, 1080], // a feliratok elhelyezési területe (alap: a vizuális terület)
   });

   KAMERA
     TortMap.fit(proj, [lonMin, latMin, lonMax, latMax], [x, y, w, h], pad?) → nézet {lon, lat, s, x, y}
     TortMap.lerp(proj, a, b, u)    nézet a és b között (u 0..1): fix pont körüli zoom + pan, s logaritmikusan
                                    (nagy zoomnál is természetes: egy pont végig ugyanott marad a képernyőn)
     const cam = TortMap.camera(proj)
     cam.go(nézet, t, dur)          átmenet indítása a jelenlegi állásból (t: tetszőleges óra, pl. L.st)
     cam.at(t) → nézet              a t időpillanat nézete (inOut lassítással); visszafelé lépésnél rövid dur-t adj
     TortMap.zfade(V, s0, s1)       0..1: hol tart V.s az [s0, s1] között (log.) – rétegek ki-/beúsztatása zoomra

   KÉPKOCKÁNKÉNT (a sorrend: frame → base → region / line / saját rajz → labels)
     const V = map.frame(nézet)     beállítja a kamerát; V = TortProj.view (V.pt, V.inv, V.s)
     map.base(ctx, o)               tenger, szárazföld, hegységfoltok, folyók, tavak, partvonal.
                                    o = {rivers: {rank: 6 | [r0, r1, r2] (rétegenként), hi: {'Duna': {w: 5, wkm: .4, c}}
                                         (9 px fölött part + világos víz),
                                         only: ['Duna', …]}, mountains: 0..1 (alfa), lakes: true, style: {sea, land, …}}
     map.borders(ctx, a)            mai határok, halvány szaggatott vonal (a: alfa); mellé: TortMap.stamp(„mai határok”)
     map.region(ctx, items, o)      lágy szélű folt(ok) EGY rétegben (az átfedés nem sötétedik):
                                    items = [{blobs: [[lon, lat, km], …]} | {poly: [[lon, lat], …]}, a: 0..1]
                                    o = {color, alpha (alap .4), blur (px, alap 14), land: true (szárazföldre vágva,
                                         a tavak kivételével)}
     map.line(ctx, pts, o)          vonal / animált nyíl: pts = [[lon, lat], …];
                                    o = {p: 0..1 (haladás), color, w (px), wkm (szélesség km-ben, min. w), dash,
                                         head: true (nyílhegy), halo: true, smooth: true, cap} → {x, y, ang, len}
     map.labels(L, items, o)        ütközésmentes címkézés (prioritás szerint, mohón; a korábbi helyet megtartja):
                                    items = [{id, lon, lat | x, y, s, k, sub, sk, pri, r (jel sugara, 0: nincs),
                                              dot (alap pontot rajzol), size, w, f, i, c, subc, a, dirs, force}]
                                    dirs: ['E','W','N','S','NE','SE','NW','SW'] (alap) vagy ['C'] (területnév középen);
                                    ha a közeli helyek foglaltak, távolabb, szaggatott vezetővonallal próbálja.
                                    o = {avoid: [{x, y, w, h}], rect} → az elhelyezett dobozok [{id, x, y, w, h}]
     map.scale(L, x, y, o)          méretarány-vonalzó kerek km-értékkel; o = {k: felirat-kulcs („# km”), max: px}
   SEGÉDEK
     map.pt(lon, lat) → [x, y] (másolat) · map.ppk(lon, lat) → px / km ott · map.river(név) → [[lon, lat], …]
     TortMap.slice(line, a, b)      a vonal a- és b-hez ([lon, lat]) legközelebbi csúcsa közötti szakasza
     TortMap.nearest(line, p)       {i, p}: a p-hez legközelebbi csúcs
     TortMap.spline(pts, n, closed) Catmull–Rom simítás (n pont szakaszonként)
     TortMap.offset(lon, lat, kelet_m, észak_m) → [lon, lat] (helyi alaprajzokhoz méterben)
     TortMap.stamp(L, s, x, y, o)   bélyeg („vázlatos”, „mai határok”, „becslés”): −3°, Bricolage 22 px 600, keret;
                                    o = {k, est: true → okker, a: 'left' | 'center' | 'right'} → doboz
   Rétegek keverése: a durva réteg a finomabb kivágatán kívül teljes erővel, belül (1 − alfa)-val rajzol.
   Teljesítmény: a kivágaton kívüli gyűrűk kimaradnak; a foltok negyed felbontású pufferben mosódnak el.
   ───────────────────────────────────────────────────────────────────────────────────────── */
const TortMap = (() => {
  'use strict';
  const TP = window.TortProj;
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const smooth = (t) => { t = clamp(t); return t * t * (3 - 2 * t); };
  const inOut = (t) => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
  const DEF = { sea: 'rgba(70,150,215,.22)', land: '#f5eddd', coast: '#1b5a94', coastW: 1.5, river: '#1b5a94',
    lake: '#c6dbe8', lakeLine: '#1b5a94', mtn: '#7a623e', border: '#1c2440', ink: '#1c2440', muted: '#565d72',
    halo: 'rgba(250,246,238,.94)', card: '#fffaf1', est: '#8f5a0c' };
  const R_KM = 6371;

  function ringBox(r) {
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (let i = 0; i < r.length; i += 2) { const x = r[i], y = r[i + 1]; if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    return [x0, y0, x1, y1];
  }
  function boxRing(b, n = 24) {
    const o = [];
    for (let i = 0; i < n; i++) o.push(b[0] + (b[2] - b[0]) * i / n, b[1]);
    for (let i = 0; i < n; i++) o.push(b[2], b[1] + (b[3] - b[1]) * i / n);
    for (let i = 0; i < n; i++) o.push(b[2] - (b[2] - b[0]) * i / n, b[3]);
    for (let i = 0; i < n; i++) o.push(b[0], b[3] - (b[3] - b[1]) * i / n);
    return Float64Array.from(o);
  }
  const hit = (a, b) => a[0] <= b[2] && a[2] >= b[0] && a[1] <= b[3] && a[3] >= b[1];
  const parts = (arr) => (arr || []).map((r) => ({ r, b: ringBox(r) }));

  function fit(proj, b, rect, pad) { return TP.fit(proj, b, rect, pad); }

  function lerp(proj, a, b, u) {
    if (u <= 0) return a; if (u >= 1) return b;
    const pa = proj.fwd(a.lon, a.lat), pb = proj.fwd(b.lon, b.lat);
    const s = Math.exp(Math.log(a.s) + (Math.log(b.s) - Math.log(a.s)) * u);
    const X = a.x + (b.x - a.x) * u, Y = a.y + (b.y - a.y) * u;
    let cx, cy;
    if (Math.abs(Math.log(a.s / b.s)) < 1e-3) { cx = pa[0] + (pb[0] - pa[0]) * u; cy = pa[1] + (pb[1] - pa[1]) * u; }
    else {   // fix pont: az a világpont, amely mindkét nézetben ugyanott van a képernyőn
      const oax = pa[0] - a.x / a.s, obx = pb[0] - b.x / b.s, oay = pa[1] + a.y / a.s, oby = pb[1] + b.y / b.s;
      const Fx = (oax * a.s - obx * b.s) / (a.s - b.s), Fy = (oay * a.s - oby * b.s) / (a.s - b.s);
      const ox = Fx - (Fx - oax) * a.s / s, oy = Fy - (Fy - oay) * a.s / s;
      cx = ox + X / s; cy = oy - Y / s;
    }
    const ll = proj.inv(cx, cy);
    return { lon: ll[0], lat: ll[1], s, x: X, y: Y };
  }

  function camera(proj) {
    let from = null, to = null, t0 = 0, dur = 1, last = null;
    return {
      go(v, t, d) { from = last || v; to = v; t0 = t; dur = Math.max(1e-3, d || 0); },
      at(t) { if (!to) return null; last = lerp(proj, from, to, inOut((t - t0) / dur)); return last; },
      get target() { return to; },
    };
  }

  const zfade = (V, s0, s1) => smooth((Math.log(V.s) - Math.log(s0)) / (Math.log(s1) - Math.log(s0)));

  function spline(pts, n, closed) {
    const N = pts.length, out = [];
    if (N < 3) return pts.slice();
    const P = (i) => closed ? pts[(i + N) % N] : pts[Math.max(0, Math.min(N - 1, i))];
    const segs = closed ? N : N - 1;
    for (let i = 0; i < segs; i++) {
      const p0 = P(i - 1), p1 = P(i), p2 = P(i + 1), p3 = P(i + 2);
      for (let j = 0; j < n; j++) {
        const t = j / n, t2 = t * t, t3 = t2 * t;
        out.push([0, 1].map((d) => .5 * (2 * p1[d] + (-p0[d] + p2[d]) * t + (2 * p0[d] - 5 * p1[d] + 4 * p2[d] - p3[d]) * t2 + (-p0[d] + 3 * p1[d] - 3 * p2[d] + p3[d]) * t3)));
      }
    }
    if (!closed) out.push(pts[N - 1].slice());
    return out;
  }
  function nearest(line, p) {

/* ── MODUL VÉGE: Térkép ─────────────────────────────────────────────────────────────────── */

/* ── MODUL: Időszalag (TortTimeline) ──────────────────────────────────────────────
   B modul (pilot/tortenelem-5-6/terv.md, 5. fejezet). Referencia: 01-idoszamitas.

   IDŐ-KOORDINÁTA (u): folytonos, csillagászati években. Az „a” csillagászati év
   (Kr. e. 1 = 0, Kr. e. 753 = −752, Kr. u. 476 = 476 – ez a build `L.dat(k).a` mezője) az

     Y.astro(v), Y.hist(a)  történeti év (−753) ↔ csillagászati (−752)

     Y.centurySpan(n, bc) [a0, a1) csillagászati évek: 19 → [1801, 1901); Kr. e. 1. → [−99, 1)
     Y.centuryLabel(a, T, short)  '19. század' · 'Kr. e. 8. század' · (short) '19.'
     Y.centuryRule(a)     '18|48 → 18 + 1 = 19' · '19|00 → 19'
     Y.lerpView(v0, v1, t)  két nézet ([u0, u1]) között: logaritmikus lépték, a nagyítás közben a

   T (a lecke .md-jéből, mind {s, k}; k = md-kulcs a review módhoz):
     {bc: 'Kr. e.', ad: 'Kr. u.', cent: 'század', years: '# év'}

   const tl = TortTimeline.create(L, {x0, x1, y, h: 64, T, src, bounds: [uMin, uMax], minSpan, maxSpan,

     src: TortSource-példány (C modul) a kártyakeretekhez és a „becslés” bélyeghez (opcionális).
     epoch: más kezdőpontú vonalzó (pl. Róma alapítása): a felirat n = a − epoch + 1, előtte üres.

     tl.draw(d)   szalag + osztás + feliratok + sávok. d = {a, bands: [{u0, u1, col, a}], sides,
                  origin, caption: {s, k, a, right}, cent, centHi: év, eras: [...], eraA, eraOut, ad}
                  eras: [{u0, u1, name: {s, k}, col, fade0: [ua, ub], fade1: [ua, ub]}] (fade = elmosódó határ)
     tl.cards(items, {pitch})   eseménykártyák a szalag fölött, vezetővonallal. item = {u, title: {s, k},

     tl.pins = [{u, col, ad?}]  húzható tűk;  tl.drawPins({a, pinY, top, bracket, caption(e), sub(e, a1, a2),
                  label(pin, év) → [{s, k, c}, …], hint: {s, k}})
     tl.interact({pins, pan, zoom, snap: [u…], onView(v)}) → true, ha egy tű elmozdult. Minden képkockán
                  hívd (a nézet beállítása után); a görgő nagyít, a szalag húzása pásztáz.
     tl.user      a felhasználó által beállított nézet ([u0, u1]) vagy null · tl.setUser(u0, u1) · tl.zoomTo(span)
   TortTimeline.mini(L, {x, y, w, h, u0, u1, eras, win: [u0, u1], cap: {s, k}, ends: [{s, k}, {s, k}], a})

const TortTimeline = (() => {
  const F = Lesson.FONTS, U = Lesson.U, NB = ' ', MINUS = '−', TAU = Math.PI * 2;
  const INK = '#1c2440', MUT = '#565d72', RED = '#c8401c', CARD = '#fffaf1', OCHRE = '#8f5a0c';

  const Y = {
    astro: (v) => (v < 0 ? v + 1 : v),
    hist: (a) => (a <= 0 ? a - 1 : a),
    u: (d) => (typeof d === 'number' ? d + .5 : d.t === 'date' ? d.a : d.a + .5),
    year: (u) => Math.floor(u),
    num: (a) => (a <= 0 ? 1 - a : a),
    label: (a, T, ad) => (a <= 0 ? T.bc.s + NB + (1 - a) : (ad ? T.ad.s + NB : '') + a),
    key: (a, T, ad) => (a <= 0 ? T.bc.k : ad ? T.ad.k : null),
    range: (a0, a1, T) => {
      if (a0 > a1) [a0, a1] = [a1, a0];
      if (a1 <= 0) return T.bc.s + NB + (1 - a0) + '–' + (1 - a1);
      if (a0 >= 1) return a0 + '–' + a1;
      return Y.label(a0, T) + ' – ' + Y.label(a1, T, true);
    },
    elapsed: (a1, a2) => a2 - a1,
    formula: (a1, a2) => {
      const lo = Math.min(a1, a2), hi = Math.max(a1, a2), e = hi - lo;
      if (hi <= 0) return `${1 - lo} ${MINUS} ${1 - hi} = ${e}`;
      if (lo >= 1) return `${hi} ${MINUS} ${lo} = ${e}`;
      return `${1 - lo} + ${hi} ${MINUS} 1 = ${e}`;
    },
    century: (a) => (a >= 1 ? { n: Math.ceil(a / 100), bc: false } : { n: Math.ceil((1 - a) / 100), bc: true }),
    centurySpan: (n, bc) => (bc ? [1 - 100 * n, 101 - 100 * n] : [100 * n - 99, 100 * n + 1]),
    centuryLabel: (a, T, short) => { const c = Y.century(a); return (c.bc ? T.bc.s + NB : '') + c.n + '.' + (short ? '' : NB + T.cent.s); },
    centuryKeys: (a, T) => (Y.century(a).bc ? [T.cent.k, T.bc.k] : [T.cent.k]),
    centuryRule: (a) => {
      const y = Y.num(a), n = Y.century(a).n, h = Math.floor(y / 100), t = y % 100;
      return t === 0 ? `${h}|00 → ${n}` : `${h}|${String(t).padStart(2, '0')} → ${h} + 1 = ${n}`;
    },
    lerpView: (v0, v1, t) => {
      const s0 = v0[1] - v0[0], s1 = v1[1] - v1[0], c0 = (v0[0] + v0[1]) / 2, c1 = (v1[0] + v1[1]) / 2;
      const s = Math.exp(U.lerp(Math.log(s0), Math.log(s1), t));
      const k = Math.abs(Math.log(s1 / s0)) > .25 ? (s - s0) / (s1 - s0) : t;
      const m = U.lerp(c0, c1, k);
      return [m - s / 2, m + s / 2];

  function create(L, o) {
    const T = o.T;
    const tl = { o, T, src: o.src || null, x0: o.x0, x1: o.x1, y: o.y, h: o.h || 64, pins: [], user: null, drag: null,
      bounds: o.bounds || [-1e6, 1e6], minSpan: o.minSpan || 4, maxSpan: o.maxSpan || 1e5, epoch: o.epoch == null ? null : o.epoch };
    tl.top = tl.y - tl.h / 2; tl.bot = tl.y + tl.h / 2;
    tl.R = { tick: tl.bot + 31, cent: tl.bot + 44, centH: 40, era: tl.bot + 96, eraH: 48 };
    tl.pinY = o.pinY || tl.R.era + tl.R.eraH + 40;
    tl.view = (u0, u1) => { tl.u0 = u0; tl.u1 = u1; tl.ppy = (tl.x1 - tl.x0) / (u1 - u0); return tl; };
    tl.view(0, 100);
    tl.x = (u) => tl.x0 + (u - tl.u0) * tl.ppy;
    tl.u = (x) => tl.u0 + (x - tl.x0) / tl.ppy;
    tl.span = () => tl.u1 - tl.u0;
    const inView = (x, m = 0) => x >= tl.x0 - m && x <= tl.x1 + m;

    /* azok a csillagászati évek, amelyek kiírt száma a lépésköz többszöröse (a szalag közepén: a + 0,5) */
    function yearsAt(step) {
      const out = [];
      if (tl.epoch != null) {
        const e = tl.epoch;
        for (let n = Math.max(step, Math.ceil((tl.u0 - e + .5) / step) * step); e + n - .5 <= tl.u1; n += step) out.push(e + n - 1);
        return out;
      }
      for (let n = Math.max(step, Math.ceil((tl.u0 - .5) / step) * step); n + .5 <= tl.u1; n += step) out.push(n);
      for (let y = Math.max(step, Math.ceil((1.5 - tl.u1) / step) * step); 1.5 - y >= tl.u0; y += step) out.push(1 - y);
      return out;
    }
    /* ad: true → „Kr. u. 5”; 'auto' (alap) → csak ha a kezdőpont látszik, és évenként/évtizedenként írunk */
    const adOn = (a, ad, step) => a >= 1 && (ad === true || (ad !== false && step <= 10 && tl.u0 < 1 && a < 1000));
    const tickText = (a, ad, step) => (tl.epoch != null ? { s: String(a - tl.epoch + 1), k: null } : { s: Y.label(a, T, adOn(a, ad, step)), k: Y.key(a, T, adOn(a, ad, step)) });
    function pickStep(ad) {
      for (const s of STEPS) {
        if (s * tl.ppy < 34) continue;
        const ys = yearsAt(s); let w = 0;

      c.fillStyle = CARD; c.fillRect(x0, top, W, h); c.restore();
      const xb = tl.epoch != null ? tl.x(tl.epoch) : tl.x(1);      // a kezdőpont előtti rész halványan
      if (xb > x0) { c.fillStyle = tl.epoch != null ? 'rgba(28,36,64,.11)' : 'rgba(28,36,64,.07)'; c.fillRect(x0, top, Math.min(xb, x1) - x0, h); }
      for (const b of d.bands || []) {
        const xa = Math.max(x0, tl.x(b.u0)), xc = Math.min(x1, tl.x(b.u1)); if (xc <= xa) continue;

      const step = pickStep(d.ad);
      c.save(); c.beginPath(); c.rect(x0, top, W, h); c.clip();
      c.strokeStyle = 'rgba(28,36,64,.30)'; c.lineWidth = 1.5; c.beginPath();
      if (ppy >= 14) {
        for (let a = Math.ceil(tl.u0); a <= tl.u1; a++) { const x = tl.x(a); c.moveTo(x, top); c.lineTo(x, bot); }
      } else {
        const minor = [step / 10, step / 5, step / 2].find((m) => m >= 1 && Number.isInteger(m) && m * ppy >= 7);
        if (minor) for (const a of yearsAt(minor)) { const x = tl.x(a + .5); c.moveTo(x, bot - 9); c.lineTo(x, bot); }
      }
      c.stroke();
      c.strokeStyle = INK; c.lineWidth = 2; c.beginPath();
      const ys = yearsAt(step);
      for (const a of ys) { const x = tl.x(a + .5); c.moveTo(x, bot - 15); c.lineTo(x, bot); }
      c.stroke();
      c.restore();
      for (const a of ys) {
        const x = tl.x(a + .5); if (!inView(x)) continue;
        const t = tickText(a, d.ad, step);
        L.tx(t.s, x, tl.R.tick, Object.assign({}, TF, { a: 'center', c: INK, k: t.k }));
      }
      c.strokeStyle = INK; c.lineWidth = 2.5; c.strokeRect(x0, top, W, h);
      c.fillStyle = INK; c.beginPath(); c.moveTo(x1 + 6, top + 10); c.lineTo(x1 + 28, tl.y); c.lineTo(x1 + 6, bot - 10); c.closePath(); c.fill();
      /* kezdőpont */
      if (d.origin !== false && inView(xb) && (tl.epoch != null || xb > x0)) {
        c.strokeStyle = tl.epoch != null ? OCHRE : RED; c.lineWidth = 3.5;
        c.beginPath(); c.moveTo(xb, top - 10); c.lineTo(xb, bot + 10); c.stroke();
      }
      if (d.sides && tl.epoch == null) {

        const wl = L.measure(lt, sf).w, wr = L.measure(rt, sf).w;
        if (xb - x0 > wl + 30 && xb < x1) L.tx(lt, xb - 14, tl.y + 8, Object.assign({}, sf, { a: 'right', c: MUT, k: T.bc.k }));
        if (x1 - xb > wr + 30 && xb > x0) L.tx(rt, xb + 14, tl.y + 8, Object.assign({}, sf, { a: 'left', c: INK, k: T.ad.k }));
      }
      if (d.caption && (d.caption.a == null || d.caption.a > .01)) {
        c.save(); c.globalAlpha *= d.caption.a == null ? 1 : d.caption.a;
        L.tx(d.caption.s, d.caption.right ? x1 - 16 : x0 + 16, tl.y + 8, { f: F.B, s: 22, w: 700, a: d.caption.right ? 'right' : 'left', c: MUT, k: d.caption.k });
        c.restore();
      }
      /* évszázadok sora */
      const cf = U.clamp((ppy * 100 - 36) / 30);
      if (d.cent > .005 && cf > 0) {
        c.save(); c.globalAlpha *= d.cent * cf;
        const y0 = tl.R.cent, hh = tl.R.centH, hiC = d.centHi != null ? Y.century(d.centHi) : null;
        let a = Math.floor(tl.u0);
        for (let g = 0; g < 400; g++) {
          const cc = Y.century(a), sp = Y.centurySpan(cc.n, cc.bc), xa = Math.max(x0, tl.x(sp[0])), xc = Math.min(x1, tl.x(sp[1]));
          if (xc > xa) {
            const hi = hiC && hiC.n === cc.n && hiC.bc === cc.bc;
            c.fillStyle = hi ? 'rgba(200,64,28,.20)' : (cc.n + (cc.bc ? 1 : 0)) % 2 ? 'rgba(28,36,64,.05)' : 'rgba(28,36,64,.12)';
            c.fillRect(xa, y0, xc - xa, hh);
            c.strokeStyle = 'rgba(28,36,64,.45)'; c.lineWidth = 1.5; c.beginPath();
            if (tl.x(sp[0]) >= x0) { c.moveTo(xa, y0); c.lineTo(xa, y0 + hh); }
            c.stroke();
            if (hi) { c.strokeStyle = RED; c.lineWidth = 2.5; c.strokeRect(xa, y0, xc - xa, hh); }
            const full = Y.centuryLabel(sp[0], T), short = Y.centuryLabel(sp[0], T, true), cf2 = { f: F.B, s: 22, w: hi ? 700 : 600 };
            const s = L.measure(full, cf2).w + 16 <= xc - xa ? full : L.measure(short, cf2).w + 12 <= xc - xa ? short : null;
            if (s) L.tx(s, (xa + xc) / 2, y0 + hh / 2 + 8, Object.assign({}, cf2, { a: 'center', c: hi ? RED : INK, k: Y.centuryKeys(sp[0], T) }));
          }
          if (sp[1] > tl.u1) break;
          a = sp[1];
        }

        c.restore();
      }

      if (d.eras && d.eraA > .005) {

        for (const e of d.eras) {

          const gx0 = tl.x(ua), gx1 = tl.x(ub), xa = Math.max(x0, gx0), xc = Math.min(x1, gx1);
          if (xc <= xa + .5) continue;
          const g = c.createLinearGradient(gx0, 0, gx1, 0), fa = U.rgba(e.col, .26), f0 = U.rgba(e.col, 0);
          const fr = (u) => U.clamp((tl.x(u) - gx0) / (gx1 - gx0));
          if (e.fade0) { g.addColorStop(0, f0); g.addColorStop(fr(e.fade0[1]), fa); } else g.addColorStop(0, fa);
          if (e.fade1) { g.addColorStop(fr(e.fade1[0]), fa); g.addColorStop(1, f0); } else g.addColorStop(1, fa);
          c.fillStyle = g; c.fillRect(xa, y0, xc - xa, hh);
          if (!e.fade0 && gx0 >= x0) { c.strokeStyle = e.col; c.lineWidth = 3; c.beginPath(); c.moveTo(gx0, y0); c.lineTo(gx0, y0 + hh); c.stroke(); }
          const sa = Math.max(x0, tl.x(e.fade0 ? e.fade0[1] : e.u0)), sb = Math.min(x1, tl.x(e.fade1 ? e.fade1[0] : e.u1));
          const lw = L.measure(e.name.s, EF).w;
          if (sb - sa >= lw + 16) L.tx(e.name.s, (sa + sb) / 2, y0 + hh / 2 + 9, Object.assign({}, EF, { a: 'center', c: INK, k: e.name.k }));
          else if (d.eraOut && sb > x0 && sa < x1) {
            const cx = U.clamp((sa + sb) / 2, x0 + lw / 2, x1 - lw / 2);
            L.tx(e.name.s, cx, y0 - 16, Object.assign({}, EF, { a: 'center', c: INK, k: e.name.k }));
            c.strokeStyle = U.rgba(INK, .5); c.lineWidth = 1.5; c.beginPath(); c.moveTo(cx, y0 - 12); c.lineTo((Math.max(sa, x0) + Math.min(sb, x1)) / 2, y0 + 4); c.stroke();
          }
        }
        c.strokeStyle = 'rgba(28,36,64,.5)'; c.lineWidth = 1.5; c.strokeRect(x0, y0, W, hh);
        c.restore();
      }
      c.restore();
    };

    /* ── eseménykártyák ── */
    const CT = { f: F.B, s: 24, w: 650 }, CD = { f: F.M, s: 22, w: 600 }, CN = { f: F.B, s: 22, w: 700 };
    tl.cardSize = (it) => {
      const src = tl.src, wt = L.measure(it.title.s, CT).w, wd = it.date ? L.measure(it.date.s, CD).w : 0;
      const ws = it.est && src ? src.stampSize('becslés').w + 14 : 0, wn = it.note ? L.measure(it.note.s, CN).w : 0;
      return { w: Math.max(wt, wd + ws, wn) + 34, h: 52 + (it.date ? 32 : 0) + (it.note ? 32 : 0) };
    };
    tl.card = (it, x, y) => {
      const c = L.ctx, src = tl.src, z = tl.cardSize(it);
      if (src) src.frame(x, y, z.w, z.h, it.layer || null, { hi: it.hi });
      else { c.beginPath(); c.roundRect(x, y, z.w, z.h, 10); c.fillStyle = CARD; c.fill(); c.strokeStyle = U.rgba(INK, .35); c.lineWidth = 2; c.stroke(); }
      L.tx(it.title.s, x + 17, y + 38, Object.assign({}, CT, { c: INK, k: it.title.k }));
      let yy = y + 38;
      if (it.date) {
        yy += 32; const b = L.tx(it.date.s, x + 17, yy, Object.assign({}, CD, { c: it.hi ? RED : INK, k: it.date.k }));
        if (it.est && src) src.stamp('becslés', x + 17 + b.w + 14, yy - 7);
      }
      if (it.note) { yy += 32; L.tx(it.note.s, x + 17, yy, Object.assign({}, CN, { c: it.note.c || INK, k: it.note.k })); }
      return z;
    };

      }

      return out;
    };
    S.gap = (ev, wr) => {
      const lo = wr.a - Math.max(ev.a0, ev.a1 == null ? ev.a0 : ev.a1), hi = wr.a - Math.min(ev.a0, ev.a1 == null ? ev.a0 : ev.a1);
      return { lo, hi, s: lo === hi ? U.fmt(lo) : U.fmt(lo) + '–' + U.fmt(hi) };
    };
    S.card = (q) => {
      const c = L.ctx, A = q.a == null ? 1 : q.a; if (A <= .01) return null;
      const Yt = TortTimeline.Y, pad = 30, x = q.x, y = q.y, w = q.w, col = COL[q.layer] || INK;
      const LF = { f: F.B, s: 22, w: 700 }, VF = { f: F.B, s: 26, w: 500 };
      const lw = Math.max(...q.rows.map((r) => L.measure(r.l.s, LF).w)) + 26, vw = w - pad * 2 - lw;
      const rows = q.rows.map((r) => ({ r, lines: S.wrap(r.v.s, vw, VF) }));
      const head = 116, lineH = 34, gapR = 18, hLine = q.line ? 226 : 0;
      const h = head + 26 + rows.reduce((s, r) => s + r.lines.length * lineH + gapR, 0) + hLine;
      c.save(); c.globalAlpha *= A;
      S.frame(x, y, w, h, q.layer);
      S.icon(q.icon, x + pad + 30, y + pad + 34, 62, col);
      L.tx(q.type.s, x + pad + 84, y + pad + 22, Object.assign({}, LF, { c: col, k: q.type.k }));
      L.tx(q.title.s, x + pad + 84, y + pad + 64, { f: F.D, s: 36, w: 560, c: INK, k: q.title.k, max: w - pad * 2 - 84 });
      let yy = y + head + 26;
      for (const { r, lines } of rows) {
        L.tx(r.l.s, x + pad, yy, Object.assign({}, LF, { c: MUT, k: r.l.k }));
        lines.forEach((ln, i) => L.tx(ln, x + pad + lw, yy + i * lineH, Object.assign({}, VF, { c: r.c || INK, k: r.v.k })));
        yy += lines.length * lineH + gapR;
      }
      if (q.line) {
        c.strokeStyle = U.rgba(INK, .16); c.lineWidth = 2; c.beginPath(); c.moveTo(x + pad, yy - 10); c.lineTo(x + w - pad, yy - 10); c.stroke();
        drawLine(q.line, x + pad + 10, yy, w - pad * 2 - 20);
      }
      c.restore();
      return { x, y, w, h };
    };
    function drawLine(Ln, lx, ly, lw) {
      const c = L.ctx, Yt = TortTimeline.Y, T2 = Ln.T, ev = Ln.ev, wr = Ln.wr;
      const us = [ev.a0, ev.a1 + 1, wr.a + .5].concat(Ln.mark ? [Ln.mark.a] : []);
      let lo = Math.min(...us), hi = Math.max(...us); const pd = (hi - lo) * .1; lo -= pd; hi += pd;
      const X = (u) => lx + (u - lo) / (hi - lo) * lw, yl = ly + 112;
      const xa = X(ev.a0), xb = Math.max(X(ev.a1 + 1), xa + 16), xm = (xa + xb) / 2, xw = X(wr.a + .5);
      /* eltelt idő: zárójel az esemény és a keletkezés között */
      const g = S.gap(ev, wr), gs = Ln.gap.s.replace('#', g.s), by = ly + 48;
      c.strokeStyle = RED; c.lineWidth = 2.5; c.beginPath(); c.moveTo(xm, by + 12); c.lineTo(xm, by); c.lineTo(xw, by); c.lineTo(xw, by + 12); c.stroke();
      L.tx(gs, (xm + xw) / 2, by - 14, { f: F.M, s: 26, w: 700, a: 'center', c: RED, k: [Ln.gap.k, ev.dateK, wr.dateK].flat().filter(Boolean) });
      /* tengely */
      c.strokeStyle = INK; c.lineWidth = 2.5; c.beginPath(); c.moveTo(lx, yl); c.lineTo(lx + lw, yl); c.stroke();
      c.fillStyle = INK; c.beginPath(); c.moveTo(lx + lw + 4, yl - 8); c.lineTo(lx + lw + 18, yl); c.lineTo(lx + lw + 4, yl + 8); c.closePath(); c.fill();
      /* az esemény (tartomány, a rétege szerint) */
      c.beginPath(); c.roundRect(xa, yl - 15, xb - xa, 30, 6); c.fillStyle = 'rgba(28,36,64,.10)'; c.fill();
      c.strokeStyle = COL[ev.layer] || INK; c.lineWidth = 2.5; if (ev.layer === 'rekonstrukció') c.setLineDash([8, 6]); c.stroke(); c.setLineDash([]);
      const nm = L.tx(ev.name.s, lx, yl + 44, { f: F.B, s: 22, w: 700, c: INK, k: ev.name.k });
      const ds = ev.a1 != null && ev.a1 !== ev.a0 ? Yt.range(ev.a0, ev.a1, T2) : Yt.label(ev.a0, T2);
      const db = L.tx(ds, lx, yl + 74, { f: F.M, s: 22, w: 600, c: INK, k: ev.dateK });
      if (ev.est) S.stamp('becslés', lx + db.w + 14, yl + 67);
      if (ev.sub) L.tx(ev.sub.s, lx, yl + 104, { f: F.D, s: 22, w: 500, i: true, c: MUT, k: ev.sub.k });
      /* számított kezdőpont */
      if (Ln.mark) {
        const xk = X(Ln.mark.a);
        c.strokeStyle = RED; c.lineWidth = 3.5; c.beginPath(); c.moveTo(xk, yl - 20); c.lineTo(xk, yl + 20); c.stroke();
        L.tx(Ln.mark.name.s + ': ' + Yt.label(Ln.mark.a, T2, true), xk + 12, yl - 26, { f: F.B, s: 22, w: 600, c: RED, k: [Ln.mark.name.k, T2.ad.k] });
      }
      /* a forrás keletkezése */
      c.beginPath(); c.arc(xw, yl, 10, 0, TAU); c.fillStyle = TEAL; c.fill(); c.strokeStyle = CARD; c.lineWidth = 3; c.stroke();
      const ws = Yt.label(wr.a, T2), wf = { f: F.M, s: 22, w: 700 }, ww = L.measure(ws, wf).w;
      L.tx(ws, Math.min(xw, lx + lw - ww / 2), yl + 44, Object.assign({}, wf, { a: 'center', c: TEAL, k: wr.dateK }));
      if (wr.name) { const nf = { f: F.B, s: 22, w: 600 }, nw = L.measure(wr.name.s, nf).w; L.tx(wr.name.s, Math.min(xw, lx + lw - nw / 2), yl + 74, Object.assign({}, nf, { a: 'center', c: TEAL, k: wr.name.k })); }
    }
    return S;
  }
  return { create, COL };
})();
/* ── MODUL VÉGE: Forráskártya ── */

/* ── MODUL: Kártyák (TortCards) ────────────────────────────────────────────────────
   G modul (pilot/tortenelem-5-6/terv.md, 5. fejezet): „húzd a helyére” – kártyák rendezése zónákba
   (pl. két oszlop: falu / város), azonnali visszajelzéssel. Referencia: 07-kozepkori-varos.
   Később változtatás nélkül átemelhető: shared/tort/cards.js. Csak a Lesson motorra épül
   (L.ctx, L.tx, L.measure, L.pointer, L.stage, L.st, L.VW).

   const g = TortCards.create(L, {
     zones: [{id, x, y, w, h, title: {s, k}, sub?: {s, k}, head?: 110}], // célterületek; head: a fejléc magassága
     cards: [{id, label: {s, k}, zone}],      // zone: a helyes zóna id-ja (a kódban rögzített megoldás)
     tray: {x, y, w, h, pad?: 24, top?: 56},  // a kártyák kiinduló helye: sorfolytonosan, soronként középre
     font?: {f, s, w},                        // kártyafelirat (alap: Bricolage 24 / 600)
     gap?: 14, ease?: .45,                    // térköz px; a mozgás hossza mp
     decor?: (zone, alpha) => {}              // opcionális: saját rajz a zóna fejlécébe
   });
   g.reset()                  minden kártya a tálcára, animáció nélkül (a lépés enter()-jében hívd)
   g.place(id, zoneId, t0?)   kártya egy zónába (zoneId null → vissza a tálcára); a mozgás t0-tól (L.st) indul
   g.solve(t0?)               minden kártya a helyes zónába, kissé lépcsőzetesen
   g.update()                 minden képkockán, a rajzolás előtt, csak az aktív lépésben: húzás, kurzor
   g.draw({a})                zónák, kártyák (a húzott legfelül), visszajelzés: zöld keret + pipa / piros + kereszt
   g.score() → {ok, placed, total}   ·   g.touched: a felhasználó már húzott   ·   g.cards, g.zones
   Az állapot zárt képletű: a kártya helye = lerp(from, cél, inOut((L.st − t0) / ease)).
   ──────────────────────────────────────────────────────────────────────────────── */
const TortCards = (() => {
  const F = Lesson.FONTS, U = Lesson.U;
  const INK = '#1c2440', MUT = '#565d72', CARD = '#fffaf1', GOOD = '#1d7a45', BAD = '#b3261e', RED = '#c8401c';

  function create(L, cfg) {
    const FT = Object.assign({ f: F.B, s: 24, w: 600 }, cfg.font || {});
    const gap = cfg.gap || 14, ease = cfg.ease || .45, PX = 18, H = FT.s + 30, ICON = 30;
    const zones = cfg.zones.map((z) => Object.assign({ head: 110 }, z));
    const cards = cfg.cards.map((q, i) => ({ id: q.id, label: q.label, zone: q.zone, i, at: null, ord: 0, from: null, tgt: null, t0: -99 }));
    const g = { zones, cards, touched: false, drag: null, _pd: false, _ord: 0, _hov: null };
    const byId = (id) => cards.find((q) => q.id === id);
    const zoneAt = (x, y) => zones.find((z) => x >= z.x && x <= z.x + z.w && y >= z.y && y <= z.y + z.h) || null;
    const cw = (q) => L.measure(q.label.s, FT).w + PX * 2 + ICON;
    const ez = (t) => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

    /* sorfolytonos elhelyezés egy téglalapban; center: a sorok középre igazítva */
    function flow(list, x, y, w, center) {
      const rows = [[]]; let cx = 0;
      for (const q of list) { const ww = cw(q); if (cx > 0 && cx + ww > w) { rows.push([]); cx = 0; } rows[rows.length - 1].push({ q, ww, x: cx }); cx += ww + gap; }
      const out = {};
      rows.forEach((r, ri) => {
        const rw = r.length ? r[r.length - 1].x + r[r.length - 1].ww : 0, off = center ? (w - rw) / 2 : 0;
        r.forEach((e) => { out[e.q.id] = { x: x + off + e.x, y: y + ri * (H + gap), w: e.ww }; });
      });
      return out;
    }
    let traySlots = null;
    const tray = () => { const t = cfg.tray, p = t.pad == null ? 24 : t.pad; return { x: t.x + p, y: t.y + (t.top == null ? 56 : t.top), w: t.w - p * 2 }; };
    function target(q) {
      if (!q.at) { if (!traySlots) { const t = tray(); traySlots = flow(cards, t.x, t.y, t.w, true); } return traySlots[q.id]; }
      const z = zones.find((zz) => zz.id === q.at), list = cards.filter((c2) => c2.at === q.at).sort((a, b) => a.ord - b.ord);
      return flow(list, z.x + 20, z.y + z.head, z.w - 40, false)[q.id];
    }
    function disp(q) {
      const T = target(q);
      if (!q.tgt || Math.abs(T.x - q.tgt.x) > .5 || Math.abs(T.y - q.tgt.y) > .5) {   // új cél (pl. átrendeződés): onnan, ahol most van
        q.from = q.tgt ? cur(q) : null; q.t0 = q.tgt ? L.st : -99; q.tgt = { x: T.x, y: T.y };
      }
      return Object.assign(cur(q), { w: T.w });
    }
    function cur(q) {
      if (!q.from) return { x: q.tgt.x, y: q.tgt.y };
      const k = ez(U.clamp((L.st - q.t0) / ease));
      return { x: U.lerp(q.from.x, q.tgt.x, k), y: U.lerp(q.from.y, q.tgt.y, k) };
    }

    g.reset = () => { cards.forEach((q) => { q.at = null; q.ord = 0; q.from = null; q.tgt = null; q.t0 = -99; }); traySlots = null; g.drag = null; g.touched = false; g._ord = 0; };
    g.place = (id, zid, t0, from) => {
      const q = typeof id === 'string' ? byId(id) : id; if (!q) return;
      const p = from || (q.tgt ? cur(q) : target(q));
      q.at = zid || null; q.ord = ++g._ord;
      const T = target(q); q.from = { x: p.x, y: p.y }; q.tgt = { x: T.x, y: T.y }; q.t0 = t0 == null ? L.st : t0;
    };
    g.solve = (t0) => { const t = t0 == null ? L.st : t0; cards.filter((q) => q.at !== q.zone).forEach((q, i) => g.place(q, q.zone, t + i * .08)); };
    g.score = () => ({ ok: cards.filter((q) => q.at && q.at === q.zone).length, placed: cards.filter((q) => q.at).length, total: cards.length });

    g.update = () => {
      const p = L.pointer, edge = p.down && !g._pd; g._pd = p.down;
      const hit = () => { for (let i = cards.length - 1; i >= 0; i--) { const q = order()[i], d = disp(q); if (p.x >= d.x && p.x <= d.x + d.w && p.y >= d.y && p.y <= d.y + H) return { q, d }; } return null; };
      if (edge && p.x < L.VW && !g.drag) { const h = hit(); if (h) { g.drag = { q: h.q, dx: p.x - h.d.x, dy: p.y - h.d.y }; g.touched = true; } }
      if (g.drag && !p.down) {
        const d = g.drag, x = p.x - d.dx, y = p.y - d.dy, z = zoneAt(p.x, p.y), t = cfg.tray;
        const inTray = p.x >= t.x && p.x <= t.x + t.w && p.y >= t.y && p.y <= t.y + t.h;
        if (z) g.place(d.q, z.id, L.st, { x, y });
        else if (inTray) g.place(d.q, null, L.st, { x, y });
        else { d.q.from = { x, y }; d.q.t0 = L.st; }                  // máshová ejtve: vissza a helyére
        g.drag = null;
      }
      const h = g.drag ? null : (p.inside && p.x < L.VW ? hit() : null);
      g._hov = h ? h.q : null;
      if (L.stage) L.stage.style.cursor = g.drag ? 'grabbing' : h ? 'grab' : '';
    };
    const order = () => cards.slice().sort((a, b) => (a === (g.drag && g.drag.q) ? 1 : 0) - (b === (g.drag && g.drag.q) ? 1 : 0) || (a.at ? 1 : 0) - (b.at ? 1 : 0) || a.ord - b.ord || a.i - b.i);

    function mark(c, ok, x, y) {        // pipa / kereszt (rajz, nem szöveg)
      c.save(); c.lineCap = 'round'; c.lineJoin = 'round'; c.lineWidth = 4; c.strokeStyle = ok ? GOOD : BAD; c.beginPath();
      if (ok) { c.moveTo(x - 9, y); c.lineTo(x - 3, y + 7); c.lineTo(x + 10, y - 8); } else { c.moveTo(x - 7, y - 7); c.lineTo(x + 7, y + 7); c.moveTo(x + 7, y - 7); c.lineTo(x - 7, y + 7); }
      c.stroke(); c.restore();
    }
    function card(c, q, d, lift) {
      const placed = !!q.at, ok = placed && q.at === q.zone, hov = g._hov === q;
      c.save();
      if (lift) { c.shadowColor = 'rgba(70,50,20,.28)'; c.shadowBlur = 22; c.shadowOffsetY = 8; }
      c.beginPath(); c.roundRect(d.x, d.y, d.w, H, 10); c.fillStyle = CARD; c.fill(); c.shadowColor = 'transparent';
      if (placed && !lift) { c.fillStyle = U.rgba(ok ? GOOD : BAD, .08); c.fill(); }
      c.lineWidth = placed && !lift ? 3 : 2; c.strokeStyle = placed && !lift ? (ok ? GOOD : BAD) : hov || lift ? RED : U.rgba(INK, .45); c.stroke();
      L.tx(q.label.s, d.x + PX, d.y + H / 2 + 1, Object.assign({}, FT, { b: 'middle', c: INK, k: q.label.k }));
      const ix = d.x + d.w - PX - 8, iy = d.y + H / 2;
      if (placed && !lift) mark(c, ok, ix, iy);
      else { c.fillStyle = U.rgba(INK, .4); for (let r = -1; r <= 1; r++) for (let s = 0; s < 2; s++) { c.beginPath(); c.arc(ix - 3 + s * 7, iy + r * 7, 2.2, 0, Math.PI * 2); c.fill(); } }
      c.restore();
    }
    g.draw = (o = {}) => {
      const c = L.ctx, A = o.a == null ? 1 : o.a; if (A <= .01) return;
      c.save(); c.globalAlpha *= A;
      for (const z of zones) {
        c.beginPath(); c.roundRect(z.x, z.y, z.w, z.h, 16); c.fillStyle = 'rgba(255,250,241,.82)'; c.fill();
        c.setLineDash([10, 7]); c.lineWidth = 2.5; c.strokeStyle = U.rgba(INK, .5); c.stroke(); c.setLineDash([]);
        L.tx(z.title.s, z.x + 22, z.y + 54, { f: F.D, s: 40, w: 600, c: INK, k: z.title.k });
        if (z.sub) L.tx(z.sub.s, z.x + 22, z.y + 88, { f: F.B, s: 22, w: 500, c: MUT, k: z.sub.k });
        if (cfg.decor) { c.save(); cfg.decor(z, c.globalAlpha); c.restore(); }
      }
      const t = cfg.tray; c.beginPath(); c.roundRect(t.x, t.y, t.w, t.h, 16); c.fillStyle = 'rgba(28,36,64,.05)'; c.fill();
      c.lineWidth = 2; c.strokeStyle = U.rgba(INK, .25); c.stroke();
      const p = L.pointer;
      for (const q of order()) {
        if (g.drag && g.drag.q === q) continue;
        card(c, q, disp(q), q.from && L.st - q.t0 < ease);
      }
      if (g.drag) { const q = g.drag.q, d = disp(q); card(c, q, { x: p.x - g.drag.dx, y: p.y - g.drag.dy, w: d.w }, true); }
      c.restore();
    };
    return g;
  }
  return { create };
})();
/* ── MODUL VÉGE: Kártyák ── */

/* ── MODUL: Csatatér (TortBattle) ─────────────────────────────────────────────────
   E modul (pilot/tortenelem-5-6/terv.md, 5. fejezet): taktikai és operatív léptékű csatavázlat –
   terep (folyó, sziget, mocsár, domb, várfal), egységblokkok, hadmozdulat-nyilak, ágyútűz,
   erőviszony-oszlop, dátumsáv, jelmagyarázat. Referencia: 12-nandorfehervar. Később változtatás
   nélkül átemelhető: shared/tort/battle.js. Csak a Lesson motorra épül (L.ctx, L.tx, L.measure,
   L.fonts); térkép nélkül is megy (TortBattle.local), és TortMap-nézettel is (ugyanaz a pt-függvény).

   KOORDINÁTÁK: minden hely [lon, lat] fokban; szélesség, távolság méterben (m), rajzméret px-ben.
   const B = TortBattle.create(L, {sides?: {a: '#…', b: '#…'}, style?: {…}})   alap: TortBattle.SIDES
   B.frame(pt, ppk)          képkockánként, rajzolás előtt: pt(lon, lat) → [x, y] (pl. TortMap map.pt),
                             ppk: px/km a nézetben (pl. map.ppk(V.lon, V.lat))
   TortBattle.local({lon, lat, x, y, ppk}) → {pt, ppk}   térkép nélküli helyi nézet (észak felül)
   TortBattle.lerpLocal(a, b, u)                           két helyi nézet között (ppk logaritmikusan)

   TEREP (ajánlott sorrend: mocsár, domb → víz → sziget → fal)
     B.water(ctx, rivers, o)   rivers = [{line: [[lon, lat], …], w: m | [m, …] (pontonként)}] – a vonal
                               simított; part (sötét) és víz (világos) két menetben, így a torkolatok
                               összeolvadnak. o = {a, minPx: 2, flow: t (mp) → sodrásjelek a folyásirányban}
     B.island(ctx, poly, o)    sziget a vízen, parttal · B.marsh(ctx, poly, o) mocsár (kitöltés + nádcsomók,
                               méteres rácson, determinisztikus; o.step m) · B.hill(ctx, {c, rx, ry, n}, o) domb
                               (rx, ry méterben, n szintgyűrű)
     B.walls(ctx, poly, o)     várfal tornyokkal: o = {w: px, fill, dmg: 0..1, hit: (i) => true a sérülő
                               szakaszokra (i: a poly[i] → poly[i+1] szakasz)}
   EGYSÉGEK, MOZGÁS
     B.unit(ctx, u)            u = {side, at: [lon, lat], ang: fok (menetirány; 0 = kelet, 90 = észak),
                               kind: 'inf' | 'cav' | 'art' | 'ship' | 'camp', w, h (px: front × mélység),
                               n: 0..1 (a blokk mélysége a létszámmal), a, hi, label: {s, k}, ld: [dx, dy]}
     B.arrow(ctx, pts, o)      széles hadmozdulat-nyíl: pts = [[lon, lat], …] (simítva); o = {side | col,
                               p: 0..1 (haladás), w: px (16), dash: true (terv, visszavonulás), a} → {x, y, ang}
     B.fire(ctx, from, to, t, o)   ágyútűz (lövedék + porfelhő, vér és láng nélkül), periodikus zárt
                               képlet a t időből; o = {rate: lövés/mp, seed, a}
     B.label(s, at, o)         felirat fehér kontúrral (L.tx): o = {k, s, w, f, i, c, a, ls, px: true → at képernyő-px}
     TortBattle.key(keys, t)   keys = [[t, v], …] (v szám vagy tömb) → lassított (inOut) érték
     TortBattle.river(r)       {line, w} → simított pontsor [[lon, lat, w], …] (gyorsítótárazva; a water is ezt rajzolja)
     TortBattle.along(path, u) → {p, ang, w}: a tört vonal u-adik (0..1, méterben mért) pontja

  const oks = ['ok 1', 'ok 2', 'ok 3', 'ok 4'], bs = [];

  const fx = Math.max(...bs.map((b) => b.x + b.w)) + 110, fy = 770;
  const fb = textCard(fx, fy, [{ k: 'ok vég', size: 30, w: 600, f: F.D, c: RED }, { s: L.val('ostrom vége'), k: 'ostrom vége', size: 26, w: 700, mono: true, c: INK }], { a: p(3.6), bd: RED });
  bs.forEach((b, i) => {
    const pa = p(3.4 + i * .1); if (pa <= 0) return;
    al(pa); c.strokeStyle = U.rgba(RED, .75); c.lineWidth = 3; c.beginPath();
    const y0 = b.y + b.h / 2, x0 = b.x + b.w + 10, x1 = fb.x - 14, y1 = fb.y + fb.h / 2;

  });
  al(p(3.6)); c.fillStyle = RED; c.beginPath(); c.moveTo(fb.x - 4, fb.y + fb.h / 2); c.lineTo(fb.x - 20, fb.y + fb.h / 2 - 9); c.lineTo(fb.x - 20, fb.y + fb.h / 2 + 9); c.closePath(); c.fill();
}

/* ════════ 7. Forrás vagy regény? (kártyák) ════════ */
const S7 = { solvedAt: null };
function scene7(st, w, active) {
  GA = w;
  if (active) CARDS.update();
  al(clamp(st / .5));
  T('kérdés', 680, 80, { f: F.D, s: 40, w: 560, a: 'center' });
  c.globalAlpha = GA; CARDS.draw({ a: 1 });
  // mikor keletkezett? – időszalag a kulcsgondolathoz (a regény és a festmény évszázadokkal később)
  const pt = out(clamp((st - .6) / .6));
  softCard(40, 806, 1280, 170, pt); al(pt);
  T('mikor cím', 64, 912, { f: F.D, s: 28, w: 600 });
  const ticks = []; for (let y = 1550; y <= 1900; y += 50) ticks.push({ t: y, s: String(y) }); for (let y = 1575; y <= 1900; y += 50) ticks.push({ t: y, minor: true });
  const evs = [['r ostrom', 'hadjárat éve', SB], ['r tinódi', 'Tinódi éneke', TEAL], ['r festmény', 'festmény éve', OCH], ['r regény', 'Egri csillagok', RED]];
  BT.rail(350, 922, 940, { t0: 1535, t1: 1915, ticks, a: pt, events: evs.map(([lk, dk, col]) => ({ t: dat(dk).v + .5, s: lab(lk), k: [lk, dk], col })) });
  const sc = CARDS.score(), done = sc.ok === sc.total;
  if (sc.placed > 0 && !done) { al(1); L.tx(lab('jó helyen').replace('#', sc.ok).replace('#', sc.total), 680, 1030, { k: 'jó helyen', s: 26, w: 700, a: 'center', c: MUT }); }
  if (done) {
    if (S7.solvedAt == null) S7.solvedAt = L.st;
    const p = out(clamp((L.st - S7.solvedAt - .3) / .5));
    al(p); L.pill(lab('eredmény'), 680, 1026, { k: 'eredmény', s: 28, w: 700, a: 'center', bg: RED, c: CARD, pad: 16, r: 12 });
  } else S7.solvedAt = null;
}

/* ════════ 8. Honnan tudjuk? Tinódi és Gárdonyi ════════ */
const S8 = { f: null, from: [1, 1, 1], t0: -9 };
const focus8 = (i, st) => lerp(S8.from[i], S8.f == null ? 1 : (S8.f === i ? 1 : .2), smooth((st - S8.t0) / .4));

  const cA = SRC.card({ x: 40, y: 40, w: 630, a: p(.1) * Math.max(fa[0], .25), layer: 'forrás', icon: 'krónika', type: K('tinódi típus'), title: K('tinódi cím'),
    rows: [{ l: K('ki írta'), v: K('tinódi ki') }, { l: K('mikor'), v: { s: L.val('Tinódi éneke') + ', ' + lab('nyomtatva').replace('#', L.val('Cronica nyomtatása')), k: ['Tinódi éneke', 'nyomtatva', 'Cronica nyomtatása'] } },

  const cB = SRC.card({ x: 700, y: 40, w: 630, a: p(.7) * Math.max(fa[2], .25), layer: null, icon: 'írott', type: K('gárdonyi típus'), title: K('gárdonyi cím'),
    rows: [{ l: K('ki írta'), v: K('gárdonyi ki') }, { l: K('mikor'), v: { s: L.val('Egri csillagok') + ', ' + lab('könyvként').replace('#', L.val('Egri csillagok könyvként')), k: ['Egri csillagok', 'könyvként', 'Egri csillagok könyvként'] } },
      { l: K('ott volt'), v: K('gárdonyi ott'), c: RED }],
    line: { T: TT, ev, wr: { a: dat('Egri csillagok').a, name: K('gárdonyi lejegyzés'), dateK: 'Egri csillagok' }, gap: K('később év') } });
  if (cB) { al(p(.7) * Math.max(fa[2], .25)); L.pill(lab('regény jel'), cB.x + 18, cB.y, { k: 'regény jel', s: 22, w: 700, a: 'left', bg: CARD, bd: U.rgba(INK, .35), bw: 2, c: MUT, pad: 8, r: 6 }); }
  // mi honnan való ebben a leckében?
  const y0 = Math.max(cA ? cA.y + cA.h : 560, cB ? cB.y + cB.h : 560) + 30, pb = p(1.4);

  const cols = [['forrás', ['forrás 1', 'forrás 2']], ['rekonstrukció', ['rekonstrukció 1', 'rekonstrukció 2', 'rekonstrukció 3']], ['monda', ['monda 1']]];
  const IF = { f: F.B, s: 24, w: 600 };
  const fh = Math.max(...cols.map(([, ks]) => ks.reduce((h, k) => h + SRC.wrap(lab(k), 340, IF).length * 28 + 16, 0))) + 56;
  cols.forEach(([layer, ks], i) => {
    const x = 40 + i * 436, a = pb * fa[i];
    al(a); SRC.frame(x, y0 + 60, 410, fh, layer);
    let yy = y0 + 112;
    ks.forEach((k) => {
      al(a); c.beginPath(); c.arc(x + 30, yy - 8, 6, 0, TAU); c.fillStyle = SRC.COL[layer]; c.fill();
      const lines = SRC.wrap(lab(k), 340, { f: F.B, s: 24, w: 600 });
      lines.forEach((ln, m) => L.tx(ln, x + 46, yy + m * 28, { k, s: 24, w: 600, c: INK }));
      yy += lines.length * 28 + 16;
    });
  });
}

/* ════════ 9. Összefoglalás (időszalag) ════════ */
function scene9(st, w) {

  const tw = L.measure(lab('ö cím'), { f: F.D, s: 44, w: 560 }).w;

  const Y = TortTimeline.Y, u = (k) => Y.u(dat(k));

    { u: u('Buda eleste'), title: K('ö 1541'), date: yr('Buda eleste'), row: 0, a: p(.6) },

  }
}

/* ════════════════════════════════════════════════════════════════ */
const STEPS = [
  { settle: 7.2,
    enter() { S1.on = 0; S1.from = 0; S1.t0 = -9; P1.reset(); },
    controls(L) {
      const Tm = T1();
      SL1 = L.slider({ label: lab('csúszka dátum'), k: 'csúszka dátum', min: 0, max: Tm.t1 - Tm.t0, step: 1, value: 0, format: (v) => dayStr(Tm.t0 + v), onInput: (v) => P1.take(v, L.st) });
      L.button(lab('gomb mai határok'), (b) => { S1.from = lerp(S1.from, S1.on, smooth((L.st - S1.t0) / .5)); S1.on = S1.on ? 0 : 1; S1.t0 = L.st; b.classList.toggle('on', !!S1.on); }, 'gomb mai határok');
    } },
  { settle: 3.6,
    enter() { S2.sel = null; },
    leave() { if (L.stage) L.stage.style.cursor = ''; } },
  { settle: 6.4,
    enter() { S3.on = 0; S3.from = 0; S3.t0 = -9; },
    controls(L) { L.button(lab('gomb régi becslés'), (b) => { S3.from = lerp(S3.from, S3.on, smooth((L.st - S3.t0) / .6)); S3.on = S3.on ? 0 : 1; S3.t0 = L.st; b.classList.toggle('on', !!S3.on); }, 'gomb régi becslés'); } },
  { settle: 8.2,
    enter() { P4.reset(); },
    controls(L) { SL4 = L.slider({ label: lab('csúszka nap'), k: 'csúszka nap', min: 0, max: dd('ostrom vége'), step: 1, value: 0,
      format: (v) => dayStr(DAY('ostrom kezdete') + v), onInput: (v) => P4.take(v + .5, L.st) }); } },
  { settle: 6.4,
    enter() { S5.digs = []; S5.rev = 0; S5.revFrom = 0; S5.revT = -9; S5.mi = 0; },
    leave() { if (L.stage) L.stage.style.cursor = ''; },
    controls(L) {
      L.button(lab('gomb mutasd'), () => { S5.revFrom = lerp(S5.revFrom, S5.rev, smooth((L.st - S5.revT) / .5)); S5.rev = S5.rev ? 0 : 1; S5.revT = L.st; }, 'gomb mutasd');
      L.button(lab('gomb új akna'), () => { S5.mi = (S5.mi + 1) % MINES5.length; S5.digs = []; S5.rev = 0; S5.revFrom = 0; S5.revT = -9; }, 'gomb új akna');
    } },
  { settle: 5.6,

    controls(L) { SL6 = L.slider({ label: lab('csúszka nap 6'), k: 'csúszka nap 6', min: 0, max: dd('ostrom vége'), step: 1, value: 0,
      format: (v) => dayStr(DAY('ostrom kezdete') + v), onInput: (v) => P6.take(v, L.st) }); } },
  { settle: 3,
    enter() { CARDS.reset(); S7.solvedAt = null; },
    leave() { if (L.stage) L.stage.style.cursor = ''; },
    controls(L) { L.button(lab('gomb megoldás'), () => CARDS.solve(), 'gomb megoldás'); L.button(lab('gomb újra'), () => { CARDS.reset(); S7.solvedAt = null; }, 'gomb újra'); } },
  { settle: 3.2,
    enter() { S8.f = null; S8.from = [1, 1, 1]; S8.t0 = -9; },
    controls(L) {
      const set = (f) => { S8.from = [0, 1, 2].map((i) => focus8(i, L.st)); S8.f = f; S8.t0 = L.st; };
      L.button(lab('gomb forrás'), () => set(0), 'gomb forrás'); L.button(lab('gomb rekonstrukció'), () => set(1), 'gomb rekonstrukció');
      L.button(lab('gomb monda'), () => set(2), 'gomb monda'); L.button(lab('gomb mind'), () => set(null), 'gomb mind');
    } },
  { settle: 4.2 },
];

L = Lesson.create({
  content: window.LESSON_CONTENT,
  home: false,
  steps: STEPS,
  init(Lx) {
    L = Lx; c = L.ctx;
    MAP = TortMap.create({ proj: PROJ, ancient: true, borders: window.TORT_MAP_HATAROK, layers: [{ data: window.TORT_MAP_KARPAT }] });
    BT = TortBattle.create(L);
    SRC = TortSource.create(L, { 'forrás': K('forrás jel'), 'rekonstrukció': K('rekonstrukció jel'), 'monda': K('monda jel'), 'becslés': K('becslés'), 'vázlatos': K('vázlatos'), 'illusztráció': K('illusztráció'), 'mai határok': K('mai határok') });
    TT = { bc: K('Kr. e.'), ad: K('Kr. u.'), cent: K('század'), years: K('év sablon') };
    TL9 = TortTimeline.create(L, { x0: 70, x1: 1290, y: 640, h: 64, T: TT, src: SRC, bounds: [1400, 1800] });
    G = geom();
    V1 = TortMap.fit(PROJ, [16.2, 44.55, 23.6, 49.25], [30, 30, 1300, 1020]);
    V4 = { lon: G.E0[0], lat: G.E0[1], x: 600, y: 450, ppk: 900 };
    { const m = G.R(G.W(.5, 28)); V5 = { lon: m[0], lat: m[1], x: 560, y: 545, ppk: 3900 }; }
    const Tm = T1();
    P1 = TB.player([[0.4, 0], [2.0, Tm.dr - Tm.t0 + 1], [3.6, Tm.te - Tm.t0 + 1], [5.0, Tm.sz - Tm.t0 + 1], [6.6, Tm.t1 - Tm.t0]]);
    const E = E4();
    P4 = TB.player([[0.4, 0], [1.8, E.kz + .5], [3.4, E.r1 + .3], [4.4, E.r1 + 1], [5.6, E.r2 + .3], [6.4, E.r2 + 1], [7.6, E.end + .5]]);
    P6 = TB.player([[0.6, 0], [4.8, E.end]]);
    SCN = TortScene.create({ L, frame: FR, stampK: 'illusztráció', views: { vár: { x: 690, y: 540, z: 1 } },
      layers: [{ id: 'táj', draw: drawLand }, { id: 'vár', draw: drawCastle }],
      hotspots: [
        { id: 'bástya', x: 500, y: 520, k: 'pont bástya', info: 'pont bástya szöveg', dx: -20, dy: -64 },
        { id: 'puskások', x: 1226, y: 432, k: 'pont puskások', info: 'pont puskások szöveg', dx: -26, dy: -48 },
        { id: 'rés', x: 1224, y: 524, k: 'pont rés', info: 'pont rés szöveg', dx: -10, dy: 262 },
        { id: 'asszonyok', x: 625, y: 575, k: 'pont asszonyok', info: 'pont asszonyok szöveg', dx: 0, dy: -110 },
        { id: 'huszár', x: 905, y: 556, k: 'pont huszár', info: 'pont huszár szöveg', dx: 0, dy: -100 },
        { id: 'raktár', x: 1045, y: 556, k: 'pont raktár', info: 'pont raktár szöveg', dx: 0, dy: -110 },
        { id: 'kút', x: 910, y: 690, k: 'pont kút', info: 'pont kút szöveg', dx: -80, dy: 90 },
        { id: 'lőpor', x: 1100, y: 700, k: 'pont lőpor', info: 'pont lőpor szöveg', dx: -70, dy: 124 },
      ] });
    SCN.attach((id) => { if (L.step !== 1) return; if (id) { S2.sel = S2.sel === id ? null : id; S2.selT = L.st; } });
    const zones = [{ id: 'forrás', x: 40, y: 124, w: 620, h: 410, title: K('zóna forrás'), sub: { s: lab('zóna forrás 2').replace('#', L.val('Tinódi éneke')), k: ['zóna forrás 2', 'Tinódi éneke'] } },
      { id: 'később', x: 700, y: 124, w: 620, h: 410, title: K('zóna később'), sub: K('zóna később 2') }];
    const cd = [['kártya Dobó', 'forrás'], ['kártya bikavér', 'később'], ['kártya asszonyok', 'forrás'], ['kártya Jumurdzsák', 'később'], ['kártya aknák', 'forrás'], ['kártya festmény', 'később']];
    CARDS = TortCards.create(L, { zones, cards: cd.map(([k, z]) => ({ id: k, label: k === 'kártya festmény' ? { s: lab(k).replace('#', YR('festmény éve')), k: [k, 'festmény éve'] } : K(k), zone: z })), tray: { x: 40, y: 550, w: 1280, h: 240, top: 22 }, font: { s: 24, w: 600 } });
    L.cards = CARDS; L.players = { P1, P4, P6 }; L.mines = S5; L.dig = dig5;   // QA-hoz
    // tál-kattintás közvetlenül az eseményből (egy gyors koppintás két képkocka között is számít)
    L.stage.addEventListener('pointerdown', (e) => {
      if (L.step !== 4 || !S5.bq || L.st <= 1.4) return;
      const q = L.toStage(e), i = S5.bq.findIndex((b) => Math.hypot(q.x - b[0], q.y - b[1]) < 34);
      if (i >= 0) dig5(i);
    });
  },
  draw(Lx) {
    L = Lx; c = L.ctx; GA = 1; paper(); grid(.045);
    const sp = L.sp, wt = (i) => clamp(1 - Math.abs(sp - i) * 2);
    sT[L.step] = L.st;
    // 1. térkép
    if (wt(0) > .005) {
      GA = wt(0); al(1); MAP.frame(V1); BT.frame(MAP.pt, MAP.ppk(V1.lon, V1.lat));
      MAP.base(c, { mountains: .16, rivers: { rank: 7, hi: { 'Duna': { w: 4.2 }, 'Tisza': { w: 3.4 } } } });
      scene1(sT[0], wt(0), L.step === 0);
    }
    // 2. a vár metszete
    if (wt(1) > .005) {
      const w = wt(1); c.save(); c.globalAlpha = w;
      SCN.render(c, { cam: SCN.view('vár'), season: .72, hour: 11, t: L.t });
      c.restore(); GA = w; scene2over(sT[1], w, L.step === 1);
      c.save(); c.globalAlpha = w; SCN.decor(c, 1); c.restore();
    }
    if (wt(2) > .005) scene3(sT[2], wt(2));
    if (wt(3) > .005) scene4(sT[3], wt(3), L.step === 3);

    if (wt(5) > .005) scene6(sT[5], wt(5), L.step === 5);
    if (wt(6) > .005) scene7(sT[6], wt(6), L.step === 6);
    if (wt(7) > .005) scene8(sT[7], wt(7), L.step === 7);

    c.globalAlpha = 1;
  },
});
function scene2over(st, w, active) {
  GA = w;
  const p = (t) => out(clamp((st - t) / .6));
  // mi kellett a kitartáshoz?
  const kb = textCard(520, 800, [{ k: 'kell cím', size: 28, w: 600, f: F.D, c: RED }, { k: 'kell 1', size: 24 }, { k: 'kell 2', size: 24 }, { k: 'kell 3', size: 24 }, { k: 'kell 4', size: 24 }], { a: p(.4) });
  const ma = p(1.2);
  c.globalAlpha = GA;
  SCN.markers(c, { ids: HOT2, alpha: ma * (active ? 1 : 1), sel: S2.sel, t: L.t, pulse: active });
  c.globalAlpha = GA;
  if (S2.sel) SCN.card(c, S2.sel, { x: 64, y: 70, w: 500, alpha: ma * clamp((L.st - S2.selT) / .3) });
  else { al(p(.8)); textCard(64, 70, [{ s: lab('vár cím').replace('#', YR('hadjárat éve')), k: ['vár cím', 'hadjárat éve'], size: 34, w: 600, f: F.D }, { k: 'vár alcím', size: 22, c: MUT }], { a: p(.8) }); }
  if (active) { al(ma * clamp((st - 2.4) / .6)); L.pill(lab('kattints'), FR[0] + FR[2] - 24, FR[1] + FR[3] - 40, { s: 22, w: 600, a: 'right', bg: RED, c: CARD, pad: 12, k: 'kattints' }); }
  return kb;
}
})();
