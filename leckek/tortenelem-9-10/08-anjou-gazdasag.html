<script>
/* ── MODUL: „Tippelj!” és bélyegek (TtTipp) · forrás: termeszettudomany-5-6/01-tocsa + 03-meres, egységesítve 2026-11-24 ── */
/* A természettudomány 5–6. sorozat közös mintái (szerződés 17.): kísérlet-/modellbélyeg és a „Tippelj! → kísérlet →
   magyarázat” jóslat. Csak a Lesson motorra épül (L.ctx, L.tx, L.pill, L.lab, L.button, L.controlsEl, L.panel, L.st,
   Lesson.U, Lesson.FONTS); a lecke kódjára nem hivatkozik. A panel elmosásához szükséges CSS-t (.tt-rejtett) és a
   letiltott csúszka halványítását a modul maga teszi a <head>-be – a leckében nem kell <style>-sor.

   BEKÖTÉS (a lecke kódjában, egyszer, legfelső szinten – a getterek miatt a sorrend mindegy):
     TtTipp.bind({ L: () => L, ga: () => GA });    // ga: a lecke alap-alfája (jelenet-áttűnés); alap: () => 1
     const { stamp, Tip, tipReset, panelVeil, veilIf, tipGuess, tipHide, tipControls, tipU, rhythm, tipHead, tipRow,
       tipFeedback } = TtTipp;
   ALFA: minden rajzoló a globalAlpha-t ga() · a (· belső áttűnés) értékre ÁLLÍTJA (nem szoroz a pillanatnyival, így
   egy korábbi halvány felirat nem tünteti el), a vonalstílust (lineCap/lineJoin/setLineDash) visszaállítja.

   stamp(kind, x, y, a, o) → doboz | null       kísérlet-/modellbélyeg a KemGHS.stamp stílusával (Bricolage 22 px,
        600, betűköz 0,08 em, −3°, papír alap, 2 px keret; 'tilos': 700, 3 px). (x, y): a bal szél közepe.
        Szöveg: az o.k || '<kind> bélyeg' .md-kulcs. Szín (STAMP): otthon kékeszöld, felnőtt okker, tilos #b3261e;
        tanári, modell, kitalált, nem méretarányos, sematikus, vázlatos, képzeletbeli (és minden más) halvány tinta.
        o = {k, col (szín felülírása), rot: −3 (fok), al: 'left' (igazítás)}. a ≤ 0,005 → nem rajzol.
   Tip(keys, ok) → P      jóslat-állapot. keys: a válaszok .md-kulcsai (egyben gombfeliratok), ok: a helyes kulcs (az
        init-ben is beállítható: P.ok = …). P = {keys, ok, guess: null | kulcs, gt: a választás L.st-je, btns, on}.
        P.on(k): választáskor hívódik (a lecke állítja, pl. a kísérlet vezérlőinek feloldására).
   tipReset(P)            alaphelyzet (az enter()-ben; utána veilIf(P)).
   panelVeil(on)          a panelszöveg 2. bekezdésétől (.lp-text > *, i > 0) elmos (on) / felold.
   veilIf(P)              panelVeil(!P.guess) – az enter()-ben a tipReset után.
   tipControls(P)         a tippgombok (L.button, P.keys sorrendben). A választás után csak ezek tűnnek el: a
        sorukba utána tett más gombok maradnak (ha a sorban nem marad látható gomb, a sor is eltűnik).

/* ── MODUL: Időszalag (TortTimeline) ──────────────────────────────────────────────

const TortTimeline = (() => {

  const Y = {
    astro: (v) => (v < 0 ? v + 1 : v),
    hist: (a) => (a <= 0 ? a - 1 : a),
    u: (d) => (typeof d === 'number' ? d + .5 : d.t === 'date' ? d.a : d.a + .5),
    year: (u) => Math.floor(u),
    num: (a) => (a <= 0 ? 1 - a : a),
    label: (a, T, ad) => (a <= 0 ? T.bc.s + NB + (1 - a) : (ad ? T.ad.s + NB : '') + a),
    key: (a, T, ad) => (a <= 0 ? T.bc.k : ad ? T.ad.k : null),
    range: (a0, a1, T) => {

      if (a0 >= 1) return a0 + '–' + a1;

    formula: (a1, a2) => {

    },
    century: (a) => (a >= 1 ? { n: Math.ceil(a / 100), bc: false } : { n: Math.ceil((1 - a) / 100), bc: true }),

    centuryKeys: (a, T) => (Y.century(a).bc ? [T.cent.k, T.bc.k] : [T.cent.k]),

      const s = Math.exp(U.lerp(Math.log(s0), Math.log(s1), t));

    const tl = { o, T, src: o.src || null, x0: o.x0, x1: o.x1, y: o.y, h: o.h || 64, pins: [], user: null, drag: null,
      bounds: o.bounds || [-1e6, 1e6], minSpan: o.minSpan || 4, maxSpan: o.maxSpan || 1e5, epoch: o.epoch == null ? null : o.epoch };
    tl.top = tl.y - tl.h / 2; tl.bot = tl.y + tl.h / 2;

      c.save(); c.globalAlpha *= A;

/* ── MODUL: Forráskártya (TortSource) ─────────────────────────────────────────────
   C modul (terv.md, 5. fejezet): a „Honnan tudjuk?” kártya és a három réteg egységes jelölése
   (leckek/SZERZODES.md, 11. pont). Referencia: 01-idoszamitas. Később: shared/tort/source.js.
   Függés: Lesson motor; az évszám-aritmetikához TortTimeline.Y (a B modul) – előbb azt töltsd be.

   const S = TortSource.create(L, T)   T (a .md-ből, mind {s, k}):
       {'forrás', 'rekonstrukció', 'monda', 'becslés', 'vázlatos'?, 'illusztráció'?}
   S.COL                      réteg → keretszín (forrás #0a6f86, rekonstrukció #1c2440, monda #8f5a0c)
   S.frame(x, y, w, h, layer, o)   keret a réteg szerint + a réteg neve a bal felső sarokban:
       'forrás' kékeszöld folytonos 2,5 px · 'rekonstrukció' tinta szaggatott 8/6 · 'monda' okker kartus

   S.stampSize(kind)          {w, h}
   S.icon(type, cx, cy, size, col)   forrástípus-ikon: 'írott' | 'krónika' | 'lelet' | 'monda' | 'kép'

       q = {x, y, w, a, layer, icon, type: {s, k}, title: {s, k},
            rows: [{l: {s, k}, v: {s, k}, c?}],                         // „Ki írta?”, „Mikor?” …
            line: {T,                                                   // mini időszalag (TortTimeline T)
                   ev: {a0, a1, name: {s, k}, sub?: {s, k}, layer, est, dateK},  // az esemény (csillagászati évek)
                   wr: {a, name?: {s, k}, dateK},                       // a forrás keletkezése

const TortSource = (() => {
  const F = Lesson.FONTS, U = Lesson.U, TAU = Math.PI * 2;
  const INK = '#1c2440', MUT = '#565d72', RED = '#c8401c', TEAL = '#0a6f86', OCHRE = '#8f5a0c', CARD = '#fffaf1', OCHRE_BG = 'rgba(201,150,60,.16)';
  const COL = { 'forrás': TEAL, 'rekonstrukció': INK, 'monda': OCHRE };

  const STF = { f: F.B, s: 22, w: 600, ls: '1.76px' };

  function create(L, T) {
    const S = { T, COL, STF };

      c.shadowColor = 'transparent';
      if (layer === 'monda') { c.fillStyle = OCHRE_BG; c.fill(); }

      c.stroke(); c.setLineDash([]);

        c.lineWidth = 2; c.strokeStyle = OCHRE;

          c.beginPath(); c.arc(cx, cy, 4.5, q * Math.PI / 2 + Math.PI, q * Math.PI / 2 + Math.PI * 2.4); c.stroke();
        });
      }
      if (layer && o.tag !== false && T[layer]) {
        const t = T[layer], tw = L.measure(t.s, TAG).w, tx0 = x + (layer === 'monda' ? 22 : 16);
        c.fillStyle = CARD; c.fillRect(tx0 - 7, y - 12, tw + 14, 24);
        if (layer === 'monda') { c.fillStyle = OCHRE_BG; c.fillRect(tx0 - 7, y - 12, tw + 14, 24); }

    S.stampSize = (kind) => { const m = L.measure(T[kind].s, STF); return { w: m.w + 18, h: 22 * 1.3 + 9 * .8 }; };
    S.stamp = (kind, x, y) => {
      const c = L.ctx, col = kind === 'becslés' ? OCHRE : MUT;
      c.save(); c.translate(x, y); c.rotate(-3 * Math.PI / 180);
      const b = L.pill(T[kind].s, 0, 0, Object.assign({}, STF, { bg: CARD, bd: col, bw: 2, c: col, pad: 9, r: 6, k: T[kind].k }));
      c.restore(); return b;
    };
    S.icon = (type, cx, cy, s, col) => {
      const c = L.ctx; c.save(); c.translate(cx, cy); c.lineWidth = 2.5; c.strokeStyle = col; c.lineJoin = 'round'; c.lineCap = 'round';
      const w = s * .62, h = s * .8;
      if (type === 'írott') {          // lap behajtott sarokkal, sorokkal
        const f = s * .17;

        c.fillStyle = '#f4e9d0'; c.fill(); c.stroke();
        c.beginPath(); c.moveTo(w / 2 - f, -h / 2); c.lineTo(w / 2 - f, -h / 2 + f); c.lineTo(w / 2, -h / 2 + f); c.stroke();
        c.lineWidth = 2; for (let i = 0; i < 4; i++) { const yy = -h / 2 + s * .3 + i * s * .12; c.beginPath(); c.moveTo(-w / 2 + s * .1, yy); c.lineTo(w / 2 - s * .1 - (i === 3 ? s * .14 : 0), yy); c.stroke(); }
      } else if (type === 'krónika') { // nyitott könyv
        c.beginPath(); c.moveTo(0, -h * .32); c.quadraticCurveTo(-w * .4, -h * .48, -w * .85, -h * .36); c.lineTo(-w * .85, h * .4); c.quadraticCurveTo(-w * .4, h * .28, 0, h * .44);
        c.quadraticCurveTo(w * .4, h * .28, w * .85, h * .4); c.lineTo(w * .85, -h * .36); c.quadraticCurveTo(w * .4, -h * .48, 0, -h * .32); c.closePath();
        c.fillStyle = '#f4e9d0'; c.fill(); c.stroke(); c.beginPath(); c.moveTo(0, -h * .32); c.lineTo(0, h * .44); c.stroke();
      } else if (type === 'lelet') {   // korsó
        c.beginPath(); c.moveTo(-w * .18, -h / 2); c.lineTo(w * .18, -h / 2); c.quadraticCurveTo(w * .12, -h * .25, w * .45, 0); c.quadraticCurveTo(w * .5, h * .35, w * .15, h / 2);
        c.lineTo(-w * .15, h / 2); c.quadraticCurveTo(-w * .5, h * .35, -w * .45, 0); c.quadraticCurveTo(-w * .12, -h * .25, -w * .18, -h / 2); c.closePath();
        c.fillStyle = '#e8c9a0'; c.fill(); c.stroke();
      } else if (type === 'monda') {   // beszédbuborék
        c.beginPath(); c.roundRect(-w * .7, -h * .42, w * 1.4, h * .66, 12); c.moveTo(-w * .2, h * .24); c.lineTo(-w * .4, h * .5); c.lineTo(w * .05, h * .24);
        c.fillStyle = OCHRE_BG; c.fill(); c.stroke();
        c.fillStyle = col; [-1, 0, 1].forEach((i) => { c.beginPath(); c.arc(i * w * .32, -h * .09, 3.5, 0, TAU); c.fill(); });
      } else {                         // 'kép': keret hegyekkel
        c.beginPath(); c.rect(-w * .7, -h * .42, w * 1.4, h * .84); c.fillStyle = '#f4e9d0'; c.fill(); c.stroke();
        c.beginPath(); c.moveTo(-w * .6, h * .32); c.lineTo(-w * .15, -h * .08); c.lineTo(w * .1, h * .14); c.lineTo(w * .3, -h * .02); c.lineTo(w * .6, h * .32); c.stroke();
      }
      c.restore();
    };
    S.wrap = (s, maxW, f) => {
      const out = []; let line = '';
      for (const word of String(s).split(' ')) {
        const t = line ? line + ' ' + word : word;
        if (line && L.measure(t, f).w > maxW) { out.push(line); line = word; } else line = t;
      }
      if (line) out.push(line);

    };
    S.gap = (ev, wr) => {
      const lo = wr.a - Math.max(ev.a0, ev.a1 == null ? ev.a0 : ev.a1), hi = wr.a - Math.min(ev.a0, ev.a1 == null ? ev.a0 : ev.a1);

      const c = L.ctx, A = q.a == null ? 1 : q.a; if (A <= .01) return null;
      const Yt = TortTimeline.Y, pad = 30, x = q.x, y = q.y, w = q.w, col = COL[q.layer] || INK;
      const LF = { f: F.B, s: 22, w: 700 }, VF = { f: F.B, s: 26, w: 500 };
      const lw = Math.max(...q.rows.map((r) => L.measure(r.l.s, LF).w)) + 26, vw = w - pad * 2 - lw;
      const rows = q.rows.map((r) => ({ r, lines: S.wrap(r.v.s, vw, VF) }));
      const head = 116, lineH = 34, gapR = 18, hLine = q.line ? 226 : 0;
      const h = head + 26 + rows.reduce((s, r) => s + r.lines.length * lineH + gapR, 0) + hLine;
      c.save(); c.globalAlpha *= A;
      S.frame(x, y, w, h, q.layer);
      S.icon(q.icon, x + pad + 30, y + pad + 34, 62, col);
      L.tx(q.type.s, x + pad + 84, y + pad + 22, Object.assign({}, LF, { c: col, k: q.type.k }));
      L.tx(q.title.s, x + pad + 84, y + pad + 64, { f: F.D, s: 36, w: 560, c: INK, k: q.title.k, max: w - pad * 2 - 84 });
      let yy = y + head + 26;
      for (const { r, lines } of rows) {
        L.tx(r.l.s, x + pad, yy, Object.assign({}, LF, { c: MUT, k: r.l.k }));
        lines.forEach((ln, i) => L.tx(ln, x + pad + lw, yy + i * lineH, Object.assign({}, VF, { c: r.c || INK, k: r.v.k })));
        yy += lines.length * lineH + gapR;
      }
      if (q.line) {
        c.strokeStyle = U.rgba(INK, .16); c.lineWidth = 2; c.beginPath(); c.moveTo(x + pad, yy - 10); c.lineTo(x + w - pad, yy - 10); c.stroke();
        drawLine(q.line, x + pad + 10, yy, w - pad * 2 - 20);
      }
      c.restore();
      return { x, y, w, h };
    };
    function drawLine(Ln, lx, ly, lw) {
      const c = L.ctx, Yt = TortTimeline.Y, T2 = Ln.T, ev = Ln.ev, wr = Ln.wr;
      const us = [ev.a0, ev.a1 + 1, wr.a + .5].concat(Ln.mark ? [Ln.mark.a] : []);
      let lo = Math.min(...us), hi = Math.max(...us); const pd = (hi - lo) * .1; lo -= pd; hi += pd;
      const X = (u) => lx + (u - lo) / (hi - lo) * lw, yl = ly + 112;
      const xa = X(ev.a0), xb = Math.max(X(ev.a1 + 1), xa + 16), xm = (xa + xb) / 2, xw = X(wr.a + .5);
      /* eltelt idő: zárójel az esemény és a keletkezés között */
      const g = S.gap(ev, wr), gs = Ln.gap.s.replace('#', g.s), by = ly + 48;
      c.strokeStyle = RED; c.lineWidth = 2.5; c.beginPath(); c.moveTo(xm, by + 12); c.lineTo(xm, by); c.lineTo(xw, by); c.lineTo(xw, by + 12); c.stroke();
      L.tx(gs, (xm + xw) / 2, by - 14, { f: F.M, s: 26, w: 700, a: 'center', c: RED, k: [Ln.gap.k, ev.dateK, wr.dateK].flat().filter(Boolean) });
      /* tengely */
      c.strokeStyle = INK; c.lineWidth = 2.5; c.beginPath(); c.moveTo(lx, yl); c.lineTo(lx + lw, yl); c.stroke();
      c.fillStyle = INK; c.beginPath(); c.moveTo(lx + lw + 4, yl - 8); c.lineTo(lx + lw + 18, yl); c.lineTo(lx + lw + 4, yl + 8); c.closePath(); c.fill();
      /* az esemény (tartomány, a rétege szerint) */
      c.beginPath(); c.roundRect(xa, yl - 15, xb - xa, 30, 6); c.fillStyle = 'rgba(28,36,64,.10)'; c.fill();
      c.strokeStyle = COL[ev.layer] || INK; c.lineWidth = 2.5; if (ev.layer === 'rekonstrukció') c.setLineDash([8, 6]); c.stroke(); c.setLineDash([]);
      const nm = L.tx(ev.name.s, lx, yl + 44, { f: F.B, s: 22, w: 700, c: INK, k: ev.name.k });
      const ds = ev.a1 != null && ev.a1 !== ev.a0 ? Yt.range(ev.a0, ev.a1, T2) : Yt.label(ev.a0, T2);
      const db = L.tx(ds, lx, yl + 74, { f: F.M, s: 22, w: 600, c: INK, k: ev.dateK });
      if (ev.est) S.stamp('becslés', lx + db.w + 14, yl + 67);
      if (ev.sub) L.tx(ev.sub.s, lx, yl + 104, { f: F.D, s: 22, w: 500, i: true, c: MUT, k: ev.sub.k });
      /* számított kezdőpont */
      if (Ln.mark) {
        const xk = X(Ln.mark.a);
        c.strokeStyle = RED; c.lineWidth = 3.5; c.beginPath(); c.moveTo(xk, yl - 20); c.lineTo(xk, yl + 20); c.stroke();
        L.tx(Ln.mark.name.s + ': ' + Yt.label(Ln.mark.a, T2, true), xk + 12, yl - 26, { f: F.B, s: 22, w: 600, c: RED, k: [Ln.mark.name.k, T2.ad.k] });
      }
      /* a forrás keletkezése */
      c.beginPath(); c.arc(xw, yl, 10, 0, TAU); c.fillStyle = TEAL; c.fill(); c.strokeStyle = CARD; c.lineWidth = 3; c.stroke();
      const ws = Yt.label(wr.a, T2), wf = { f: F.M, s: 22, w: 700 }, ww = L.measure(ws, wf).w;
      L.tx(ws, Math.min(xw, lx + lw - ww / 2), yl + 44, Object.assign({}, wf, { a: 'center', c: TEAL, k: wr.dateK }));
      if (wr.name) { const nf = { f: F.B, s: 22, w: 600 }, nw = L.measure(wr.name.s, nf).w; L.tx(wr.name.s, Math.min(xw, lx + lw - nw / 2), yl + 74, Object.assign({}, nf, { a: 'center', c: TEAL, k: wr.name.k })); }
    }
    return S;
  }
  return { create, COL };
})();

const FLOW9 = [
  { k: 'j9 bánya', col: GOLD_D, from: ['Körmöcbánya koordináta', 'Nagybánya koordináta', 'Selmecbánya koordináta'] },
  { k: 'j9 pénz', col: '#d2a020', from: ['Buda koordináta', 'Pécs koordináta'] },
  { k: 'j9 kapu', col: TEAL, from: [[20.3, 46.6], [17.6, 46.7], [21.6, 47.6], [24.0, 46.6], [16.2, 45.6]] },     // jelképes falvak (vázlatos)
  { k: 'j9 harmincad', col: PLUM, from: ['Kassa koordináta', 'Nagyszombat koordináta'] },
  { k: 'j9 só', col: MUT, from: ['Désakna koordináta'] },
];
function scene9(st, w) {
  GA = w;
  const p = (t) => P(t, st);
  head('c9 cím', p(0));
  const ma = p(.2);
  mapFrame(R9, ma, () => {
    al(ma); baseMap(VW9, { mt: .1 });
    al(ma); TR.fill(c, [{ g: 'mo1914hsz', c: INDIGO, a: .06 }], { land: true });
    outline(ma);
    const vis = lonlat('Visegrád koordináta');
    FLOW9.forEach((F9, i) => {
      const a = ma * P(.6 + i * .3, st, .5);
      F9.from.forEach((f) => {
        const ll = typeof f === 'string' ? lonlat(f) : f;
        al(a); MAP.line(c, [ll, [(ll[0] + vis[0]) / 2, (ll[1] + vis[1]) / 2 + .25], vis], { color: F9.col, w: 4, head: true, halo: true, smooth: true, p: P(.6 + i * .3, st, 1.2) });
        if (typeof f !== 'string') { const q = MAP.pt(ll[0], ll[1]); house(q[0], q[1] + 8, 22, a); }
      });
    });
    const items = [place('Visegrád koordináta', 'hely Visegrád', ma, { pre: 's9-', col: RED, r: 10, pri: 30, size: 26, w: 700 })];
    al(1); MAP.labels(L, items, { rect: R9 });
  });
  al(ma); stampB('vázlatos', R9[0] + 18, R9[1] + 30, ma, { k: 'keret bélyeg' });
  srcLine(R9[0] + 6, R9[1] + R9[3] + 26, ma);
  // jelmagyarázat
  const x = 870, la = p(.6);
  FLOW9.forEach((F9, i) => {
    const a = la * P(.6 + i * .3, st, .5), y = 130 + i * 52;
    al(a); c.save(); c.strokeStyle = F9.col; c.lineWidth = 5; c.lineCap = 'round'; c.beginPath(); c.moveTo(x, y - 8); c.lineTo(x + 40, y - 8); c.stroke(); c.restore();
    al(a); T(F9.k, x + 54, y, { s: 24, w: 600, max: 410 });
  });
  al(p(2.2)); wrapTx('j9 vonal', lab('j9 vonal'), x, 400, 460, { s: 22, w: 500, c: MUT, i: true }, 28, p(2.2));
  const ga = p(2.4);
  infoCard(x, 456, 470, null, [{ s: tpl('c9 garas', yr('garas kezdete')), k: ['c9 garas', 'garas kezdete'], s2: 22, b: true }, { s: lab('c9 mezőváros'), k: 'c9 mezőváros', s2: 22, c: INK, gap: 6 }], ga, { pad: 16, bd: U.rgba(OCHRE, .7) });
  // idővonal
  const ta = p(1.0);
  TL9.view(1297, 1386);
  al(ta); TL9.draw({ a: 1, bands: [{ u0: yA('Visegrád székhely'), u1: yA('Lajos kezdete'), col: INDIGO, a: .1 }, { u0: yA('Lajos kezdete'), u1: yA('Lajos vége'), col: PLUM, a: .1 }] });
  const U9 = (k) => TortTimeline.Y.u(dat(k));
  const ev = [
    { u: U9('III. András halála'), title: K('c9 tl Árpád'), date: { s: yr('III. András halála'), k: 'III. András halála' }, row: 0 },
    { u: U9('rozgonyi csata'), title: K('c9 tl Rozgony'), date: { s: yr('rozgonyi csata'), k: 'rozgonyi csata' }, row: 1 },
    { u: U9('aranyforint kezdete'), title: K('c9 tl forint'), date: { s: yr('aranyforint kezdete'), k: 'aranyforint kezdete' }, row: 0 },
    { u: U9('bányareform'), title: K('c9 tl reform'), date: { s: yr('bányareform'), k: 'bányareform' }, row: 2 },
    { u: U9('visegrádi találkozó'), title: K('c9 tl Visegrád'), date: { s: yr('visegrádi találkozó'), k: 'visegrádi találkozó' }, row: 1 },
    { u: U9('kapuadó kezdete'), title: K('c9 tl kapu'), date: { s: yr('kapuadó kezdete'), k: 'kapuadó kezdete' }, row: 0 },
    { u: U9('1351-es törvények'), title: K('c9 tl törvény'), date: { s: yr('1351-es törvények'), k: '1351-es törvények' }, row: 2 },
    { u: U9('lengyel koronázás'), title: K('c9 tl unió'), date: { s: yr('lengyel koronázás'), k: 'lengyel koronázás' }, row: 1 },
    { u: U9('Lajos vége') + .5, title: K('c9 tl halál'), date: { s: yr('Lajos vége'), k: 'Lajos vége' }, row: 0 },
  ];
  ev.forEach((e, i) => { e.layer = null; e.a = P(1.2 + i * .15, st, .4); });
  al(ta); TL9.cards(ev.slice().sort((a, b) => b.row - a.row), { pitch: 80 });
  al(p(3.4)); L.pill(lab('tovább'), 870, 640, { k: 'tovább', s: 24, w: 700, b: 'middle', c: TEAL, bg: CARD, bd: TEAL, bw: 2.5, pad: 10, r: 10, max: 460 });
}

/* ══════════ lépések ══════════ */
const SCENES = [scene1, scene2, scene3, scene4, scene5, scene6, scene7, scene8, scene9];
const sT = SCENES.map(() => 0);
const SETTLE = [3.4, 8.2, 5.4, 3.4, 3.2, 3.4, 2.4, 3.8, 3.6];
function reset2() { S2.user = false; S2.v = Y2A; S2.from = Y2A; S2.t0 = -9; }
function reset3() { S3.mode = S3.prev = 'előtt'; S3.t0 = -9; }
function reset4() { S4.mode = S4.prev = 'kamara'; S4.t0 = -9; S4.r = S4.rFrom = 25; S4.rT = -9; }
function reset5() { S5.mode = S5.prev = 'régi'; S5.t0 = -9; }
function reset6() { S6.mode = S6.prev = 'előtt'; S6.t0 = -9; }
function reset7() { S7.open = {}; S7.t = {}; }
const stepDefs = [
  {},
  { enter() { reset2(); },
    controls(Lx) { Lx.slider({ label: lab('csúszka 2'), k: 'csúszka 2', min: Y2A, max: Y2B, step: 1, value: Y2A, format: (v) => String(Math.round(v)), onInput: (v) => { S2.from = year2(L.st); S2.user = true; S2.v = +v + .99; S2.t0 = L.st; } }); } },
  { enter() { reset3(); }, controls(Lx) { btnRow(Lx, [['gomb 1327 előtt', 'előtt'], ['gomb 1327 után', 'után']], 'előtt', setMode3, 'g3'); } },
  { enter() { reset4(); },
    controls(Lx) {
      btnRow(Lx, [['gomb kamara', 'kamara'], ['gomb kapuadó', 'kapuadó']], 'kamara', setMode4, 'g4');
      Lx.slider({ label: lab('csúszka 4'), k: 'csúszka 4', min: 10, max: 40, step: 5, value: num('beváltási veszteség alap'), format: (v) => Math.round(v) + ' %', onInput: (v) => setR4(+v) });
    } },
  { enter() { reset5(); }, controls(Lx) { btnRow(Lx, [['gomb régi út', 'régi'], ['gomb új út', 'új']], 'régi', setMode5, 'g5'); } },
  { enter() { reset6(); }, controls(Lx) { btnRow(Lx, [['gomb 1370 előtt', 'előtt'], ['gomb unió', 'unió']], 'előtt', setMode6, 'g6'); } },
  { enter() { tipReset(P7); veilIf(P7); reset7(); }, leave(Lx) { Lx.stage.style.cursor = ''; }, controls() { tipControls(P7); } },
  {},
  {},
];
const steps = stepDefs.map((d, i) => Object.assign({ settle: SETTLE[i] }, d));

L = Lesson.create({
  content: window.LESSON_CONTENT, home: false, resetCtx: true, steps,
  init(Lx) {
    L = Lx; c = L.ctx;
    TT = { bc: K('Kr. e.'), ad: K('Kr. u.'), cent: K('század'), years: K('év sablon') };
    SRC = TortSource.create(L, { 'forrás': K('réteg forrás'), 'rekonstrukció': K('réteg rekonstrukció'), 'monda': K('réteg hagyomány'), 'becslés': K('becslés bélyeg'), 'vázlatos': K('vázlatos bélyeg') });
    MAP = TortMap.create({ proj: PROJ, layers: [{ data: window.TORT_MAP_KARPAT }], ancient: true, rect: [0, 0, 1360, 1080] });
    TR = TortTerr.create(L, window.TORT_HATAR, { map: MAP });
    VW1 = TortMap.fit(PROJ, [14.0, 42.4, 27.0, 49.7], R1, 10);
    VW3 = TortMap.fit(PROJ, [17.6, 45.95, 24.4, 49.15], R3, 12);
    VW5 = TortMap.fit(PROJ, [13.9, 46.9, 22.4, 50.45], R5, 6);
    VW9 = TortMap.fit(PROJ, [15.2, 44.0, 26.6, 49.7], R9, 8);
    TL9 = TortTimeline.create(L, { x0: 70, x1: 1310, y: 966, h: 50, T: TT, src: SRC, bounds: [1290, 1400] });
    CH4A = MatChart.create(L, { x: 900, y: 316, w: 420, h: 254, n: 3, max: 25, step: 5 });
    CH4B = MatChart.create(L, { x: 900, y: 724, w: 420, h: 210, n: 2, max: 700, step: 100 });
    reset2(); reset3(); reset4(); reset5(); reset6(); reset7();

    L.checks = () => {
      const out = [], near = (a, b, e = 1e-9) => Math.abs(a - b) <= e;
      const nT = num('telkek száma'), n2 = num('két családos telkek'), nZ = num('zsellércsaládok');
      out.push({ name: 'falu: a rajz két családos telkei = .md', ok: TWO.length === n2, got: TWO.length, want: n2 });
      out.push({ name: 'falu: a rajz zsellérházai = .md', ok: ZS.length === nZ, got: ZS.length, want: nZ });
      out.push({ name: 'falu: zsellér és második család nem ugyanazon a telken, minden index < telkek száma', ok: TWO.every((i) => !ZS.includes(i) && i < nT) && ZS.every((i) => i < nT), got: [TWO, ZS].join(' | '), want: '< ' + nT });
      const ka = model4('kapuadó', 25);
      out.push({ name: 'kapuadó: király bevétele = telkek × 18 dénár', ok: near(ka.king, nT * num('kapuadó összege')), got: ka.king, want: nT * 18 });
      out.push({ name: 'kapuadó: a családok terhe összesen = a király bevétele', ok: near((nT - n2 - 0) * ka.fam.egyedül - (0) + n2 * 2 * ka.fam.ketten + nZ * ka.fam.zsellér, ka.king), got: (nT - n2) * ka.fam.egyedül + n2 * 2 * ka.fam.ketten, want: ka.king });
      [10, 25, 40].forEach((r) => {
        const km = model4('kamara', r), fam = (nT + n2) * km.fam.egyedül + nZ * km.fam.zsellér;
        out.push({ name: 'kamara haszna ' + r + ' %: a családok vesztesége összesen = a király bevétele', ok: near(fam, km.king, 1e-6), got: fam, want: km.king });
      });
      out.push({ name: 'diagram: a kamara 40 %-nál is belefér (családonként ≤ 25, király ≤ 700)', ok: model4('kamara', 40).fam.egyedül <= 25 && model4('kamara', 40).king <= 700, got: [model4('kamara', 40).fam.egyedül, model4('kamara', 40).king], want: '≤ 25, ≤ 700' });
      const A = urburaSplit('előtt'), B = urburaSplit('után');
      out.push({ name: 'urbura: 100 egység arany tizede = 10', ok: near(A.ur, 10), got: A.ur, want: 10 });
      out.push({ name: 'urbura 1327-től: király + földesúr = urbura, a földesúr harmadot kap', ok: near(B.king + B.land, B.ur) && near(B.land, B.ur / 3), got: [B.king, B.land], want: [20 / 3, 10 / 3] });
      const seq = ['III. András halála', 'rozgonyi csata', 'Abák vége', 'Kán-fiak vége', 'Borsák vége', 'Csák Máté halála', 'Šubićok vége', 'Visegrád székhely'].map(yA);
      out.push({ name: '1–2. lépés: időrend (András † → Rozgony → … → Visegrád székhely)', ok: seq.every((v, i) => !i || v >= seq[i - 1]), got: seq.map((v) => v.toFixed(2)).join(), want: 'nem csökkenő' });
      out.push({ name: 'csúszka: minden tartományúr vége 1301 és 1323 között', ok: LORDS.every((Lr) => yA(Lr.end) > Y2A && yA(Lr.end) <= Y2B), got: LORDS.map((Lr) => yr(Lr.end)).join(), want: '1302–1323' });
      const cor = ['első koronázás', 'második koronázás', 'harmadik koronázás'].map((k) => num(k));
      out.push({ name: '7. lépés: a koronázások éve a sorcímkével egyezik', ok: COR.every(([id, dk]) => yr(dk) === id) && cor[0] < cor[1] && cor[1] < cor[2], got: cor.join(), want: '1301, 1309, 1310' });
      out.push({ name: '7. lépés: csak a harmadik koronázás teljesít mindhárom feltételt', ok: COR.filter(([, , v]) => v.every((x) => x === 1)).map(([id]) => id).join() === '1310', got: COR.map(([id, , v]) => id + ':' + v.join('')).join(' '), want: '1310' });
      out.push({ name: '8. lépés: Werbőczy – István = 514 év', ok: yA('Hármaskönyv') - yA('István koronázása') === 514, got: yA('Hármaskönyv') - yA('István koronázása'), want: 514 });
      const t9 = ['III. András halála', 'rozgonyi csata', 'aranyforint kezdete', 'bányareform', 'visegrádi találkozó', 'kapuadó kezdete', '1351-es törvények', 'lengyel koronázás', 'Lajos vége'].map(yA);
      out.push({ name: '9. lépés: idővonal időrendben', ok: t9.every((v, i) => !i || v > t9[i - 1]), got: t9.map((v) => v.toFixed(2)).join(), want: 'növekvő' });
      out.push({ name: 'Lajos lengyel király a magyar uralkodása alatt', ok: yA('lengyel koronázás') > yA('Lajos kezdete') && yA('lengyel koronázás') < yA('Lajos vége'), got: yr('lengyel koronázás'), want: '1342–1382' });
      return out;
    };
    const guessQA = (Px, k) => (L2) => { Px.guess = k; Px.gt = L2.st - 30; tipHide(Px); panelVeil(false); };
    const y2 = (v) => (L2) => { S2.user = true; S2.v = v + .99; S2.from = v + .99; S2.t0 = -9; if (L2.sliders && L2.sliders['csúszka 2']) L2.sliders['csúszka 2'].set(v); };
    window.__qaStates = {
      2: [{ name: 'ev-1301', set: y2(1301) }, { name: 'ev-1312', set: y2(1312) }, { name: 'ev-1317', set: y2(1317) }],
      3: [{ name: '1327-utan', set(L2) { S3.mode = S3.prev = 'után'; S3.t0 = -9; setOn(L2, 'g3', 'gomb 1327 után'); } }],
      4: [{ name: 'kamara-10', set(L2) { S4.r = S4.rFrom = 10; S4.rT = -9; if (L2.sliders['csúszka 4']) L2.sliders['csúszka 4'].set(10); } },
        { name: 'kamara-40', set(L2) { S4.r = S4.rFrom = 40; S4.rT = -9; if (L2.sliders['csúszka 4']) L2.sliders['csúszka 4'].set(40); } },
        { name: 'kapuado', set(L2) { S4.mode = S4.prev = 'kapuadó'; S4.t0 = -9; setOn(L2, 'g4', 'gomb kapuadó'); } }],
      5: [{ name: 'uj-ut', set(L2) { S5.mode = S5.prev = 'új'; S5.t0 = -9; setOn(L2, 'g5', 'gomb új út'); } }],
      6: [{ name: 'unio', set(L2) { S6.mode = S6.prev = 'unió'; S6.t0 = -9; setOn(L2, 'g6', 'gomb unió'); } }],
      7: [{ name: 'tipp-jo', set: guessQA(P7, 'tipp feltétel') }, { name: 'tipp-rossz', set: guessQA(P7, 'tipp korona') },
        { name: 'egy-sor', set(L2) { guessQA(P7, 'tipp pápa')(L2); S7.open = { 1301: true }; S7.t = { 1301: L2.st - 5 }; } },
        { name: 'mind-nyitva', set(L2) { guessQA(P7, 'tipp feltétel')(L2); COR.forEach(([id]) => { S7.open[id] = true; S7.t[id] = L2.st - 5; }); } }],
    };
  },
  draw(Lx) {
    L = Lx; c = L.ctx; GA = 1; paper();
    if (L.step >= 0) sT[L.step] = L.st;
    for (let i = 0; i < SCENES.length; i++) {
      const w = clamp(1 - Math.abs(L.sp - i) * 2); if (w <= .005) continue;
      GA = w; c.save(); c.globalAlpha = w; SCENES[i](sT[i], w, L.step === i); c.restore();
    }
    c.globalAlpha = 1;
  },
});
})();
</script>
