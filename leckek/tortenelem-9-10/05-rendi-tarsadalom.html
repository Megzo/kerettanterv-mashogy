<script>
/* ── MODUL: „Tippelj!” és bélyegek (TtTipp) · forrás: termeszettudomany-5-6/01-tocsa + 03-meres, egységesítve 2026-11-24 ── */
/* A természettudomány 5–6. sorozat közös mintái (szerződés 17.): kísérlet-/modellbélyeg és a „Tippelj! → kísérlet →
   magyarázat” jóslat. Csak a Lesson motorra épül (L.ctx, L.tx, L.pill, L.lab, L.button, L.controlsEl, L.panel, L.st,
   Lesson.U, Lesson.FONTS); a lecke kódjára nem hivatkozik. A panel elmosásához szükséges CSS-t (.tt-rejtett) és a
   letiltott csúszka halványítását a modul maga teszi a <head>-be – a leckében nem kell <style>-sor.

   BEKÖTÉS (a lecke kódjában, egyszer, legfelső szinten – a getterek miatt a sorrend mindegy):
     TtTipp.bind({ L: () => L, ga: () => GA });    // ga: a lecke alap-alfája (jelenet-áttűnés); alap: () => 1
     const { stamp, Tip, tipReset, panelVeil, veilIf, tipGuess, tipHide, tipControls, tipU, rhythm, tipHead, tipRow,
       tipFeedback } = TtTipp;
   ALFA: minden rajzoló a globalAlpha-t ga() · a (· belső áttűnés) értékre ÁLLÍTJA (nem szoroz a pillanatnyival, így
   egy korábbi halvány felirat nem tünteti el), a vonalstílust (lineCap/lineJoin/setLineDash) visszaállítja.

   stamp(kind, x, y, a, o) → doboz | null       kísérlet-/modellbélyeg a KemGHS.stamp stílusával (Bricolage 22 px,
        600, betűköz 0,08 em, −3°, papír alap, 2 px keret; 'tilos': 700, 3 px). (x, y): a bal szél közepe.
        Szöveg: az o.k || '<kind> bélyeg' .md-kulcs. Szín (STAMP): otthon kékeszöld, felnőtt okker, tilos #b3261e;
        tanári, modell, kitalált, nem méretarányos, sematikus, vázlatos, képzeletbeli (és minden más) halvány tinta.
        o = {k, col (szín felülírása), rot: −3 (fok), al: 'left' (igazítás)}. a ≤ 0,005 → nem rajzol.
   Tip(keys, ok) → P      jóslat-állapot. keys: a válaszok .md-kulcsai (egyben gombfeliratok), ok: a helyes kulcs (az
        init-ben is beállítható: P.ok = …). P = {keys, ok, guess: null | kulcs, gt: a választás L.st-je, btns, on}.
        P.on(k): választáskor hívódik (a lecke állítja, pl. a kísérlet vezérlőinek feloldására).
   tipReset(P)            alaphelyzet (az enter()-ben; utána veilIf(P)).
   panelVeil(on)          a panelszöveg 2. bekezdésétől (.lp-text > *, i > 0) elmos (on) / felold.
   veilIf(P)              panelVeil(!P.guess) – az enter()-ben a tipReset után.
   tipControls(P)         a tippgombok (L.button, P.keys sorrendben). A választás után csak ezek tűnnek el: a
        sorukba utána tett más gombok maradnak (ha a sorban nem marad látható gomb, a sor is eltűnik).
   tipGuess(P, k, gt)     választás (csak az első számít): P.guess = k, P.gt = gt ?? L.st, tipHide, panelVeil(false),
        P.on(k). A QA-állapotok is ezt hívhatják (pl. gt = L.st − 30: a kísérlet már lefutott).
   tipHide(P)             a tippgombok elrejtése (a tipGuess hívja; QA-állapotban kézzel is).

    hist: (a) => (a <= 0 ? a - 1 : a),
    u: (d) => (typeof d === 'number' ? d + .5 : d.t === 'date' ? d.a : d.a + .5),

    num: (a) => (a <= 0 ? 1 - a : a),
    label: (a, T, ad) => (a <= 0 ? T.bc.s + NB + (1 - a) : (ad ? T.ad.s + NB : '') + a),

/* ── MODUL: Kártyák (TortCards) ────────────────────────────────────────────────────

   (pl. két oszlop: falu / város), azonnali visszajelzéssel. Referencia: 07-kozepkori-varos.

function spread(items, gap, y0, y1) {
  const s = items.slice().sort((p, q) => p.y - q.y);
  s.forEach((it) => { it.ly = clamp(it.y, y0, y1); });
  for (let i = 1; i < s.length; i++) if (s[i].ly < s[i - 1].ly + gap) s[i].ly = s[i - 1].ly + gap;
  for (let i = s.length - 1; i >= 0; i--) {
    if (s[i].ly > y1 - (s.length - 1 - i) * gap) s[i].ly = y1 - (s.length - 1 - i) * gap;
    if (i < s.length - 1 && s[i].ly > s[i + 1].ly - gap) s[i].ly = s[i + 1].ly - gap;
  }
  return items;
}

function setSel8(s, st) { S8.sel = s; tset(S8.hz, s === 'levante' ? .2 : 1, st, .6); tset(S8.lv, s === 'hanza' ? .2 : 1, st, .6); }
function scene8(st, w) {
  GA = w;
  const p = pAt(st), hz = tv(S8.hz, st, .6), lv = tv(S8.lv, st, .6);
  al(p(0)); T('s8 cím', 40, 64, { f: F.D, s: 36, w: 600, max: 860 });
  const R8 = [20, 90, 860, 950], ma = p(.2);
  mapFrame(R8, ma, () => {
    MAP.frame(VE); MAP.base(c, { view: VE, rivers: { rank: 3 }, lakes: true, mountains: 0, style: { land: '#f2e6cc', sea: SEA } });
    const pr = clamp((st - .8) / 1.8);
    HANZA.forEach((r) => { al(ma * hz); MAP.line(c, route(r), { p: pr, color: INDIGO, w: 4.5, smooth: true, halo: true }); });
    LEVANTE.forEach((r) => { al(ma * lv); MAP.line(c, route(r), { p: pr, color: OCHRE, w: 4.5, smooth: true, halo: true }); });
  });
  if (ma > .01) {
    const C8 = [['Lübeck', INDIGO, hz, 1], ['Brugge', INDIGO, hz, 0], ['London', INDIGO, hz, 0], ['Hamburg', INDIGO, hz, 0], ['Novgorod', INDIGO, hz, 0], ['Bergen', INDIGO, hz, 0], ['Visby', INDIGO, hz, 0], ['Danzig', INDIGO, hz, 0],
      ['Velence', OCHRE, lv, 1], ['Genova', OCHRE, lv, 1], ['Firenze', INK, 1, 1], ['Konstantinápoly', OCHRE, lv, 0], ['Alexandria', OCHRE, lv, 0], ['Akkon', OCHRE, lv, 0], ['Caffa', OCHRE, lv, 0]];
    const items = C8.map(([n, col, aa, big], i) => ({ id: 'h8' + n, lon: dat(n).lon, lat: dat(n).lat, s: lab('v ' + n), k: ['v ' + n, n],
      sub: n === 'Firenze' ? lab('firenze sub') : undefined, sk: n === 'Firenze' ? 'firenze sub' : undefined,
      pri: (big ? 30 : 15) - i * .1, size: big ? 24 : 22, w: 700, r: big ? 8 : 6, c: col, a: clamp(.3 + aa) }));
    const rm = dat('Róma');
    items.push({ id: 'h8ea', lon: rm.lon + .6, lat: rm.lat + .5, s: lab('egyházi állam'), k: ['egyházi állam', 'Róma'], pri: 40, size: 22, w: 600, i: true, r: 0, dot: false, c: MUT, dirs: ['SW', 'S', 'W', 'C'] });
    const sf = dat('Jeruzsálem');
    items.push({ id: 'h8sf', lon: sf.lon, lat: sf.lat, s: lab('szentföld'), k: ['szentföld', 'Jeruzsálem'], sub: tpl('keresztes', Y.range(dat('keresztes államok kezdete').a, dat('keresztes államok vége').a, TT)), sk: ['keresztes', 'keresztes államok kezdete', 'keresztes államok vége'], pri: 25, size: 22, w: 700, i: true, r: 0, dot: false, c: MUT, dirs: ['SW', 'W', 'S'] });
    al(ma); c.save(); rr(R8[0], R8[1], R8[2], R8[3], 16); c.clip();
    MAP.frame(VE); MAP.labels(L, items, { rect: [R8[0] + 8, R8[1] + 8, R8[2] - 16, R8[3] - 16] });
    c.restore();
    al(ma); TortMap.stamp(L, lab('vázlatos'), R8[0] + 24, R8[1] + R8[3] - 30, { k: 'vázlatos' });
  }
  // jobb oszlop: a két hálózat + céh
  const X = 910, Wd = 430;
  const h1 = infoCard(X, 100, Wd, K('hanza cím'), [{ s: lab('hanza áruk'), k: 'hanza áruk', s2: 22 }], p(.8) * clamp(.35 + hz), { ts: 26, bd: INDIGO, bw: 3 });
  const h2 = infoCard(X, 100 + h1.h + 16, Wd, K('levante cím'), [{ s: lab('levante áruk'), k: 'levante áruk', s2: 22 }], p(1.0) * clamp(.35 + lv), { ts: 26, bd: OCHRE, bw: 3 });
  const fa = p(1.6), cy = 100 + h1.h + h2.h + 40;
  if (fa > .01) {
    al(1); S8.cardH = SRC.card({ x: X, y: cy, w: Wd, a: fa * GA, layer: 'forrás', icon: 'írott', type: K('forrás8 típus'),
      title: { s: tpl('forrás8 cím', val('céhkönyv')), k: ['forrás8 cím', 'céhkönyv'] },
      rows: [{ l: K('forrás8 mit'), v: K('forrás8 mit v') }, { l: K('forrás8 kérdés'), v: K('forrás8 kérdés v'), c: RED }] });
  }
  if (S8.cardH && fa > .01) { al(p(2.2)); wrapTx(lab('zsidó sor'), 'zsidó sor', X, cy + S8.cardH.h + 36, Wd, { s: 22, w: 500, i: true, c: MUT }, 28); }
}

/* ════════ 9. Összefoglalás: kié melyik jog és kötelesség? ════════ */
const CD9 = [['k1', 'jobbágy'], ['k2', 'jobbágy'], ['k3', 'jobbágy'], ['k4', 'nemes'], ['k5', 'nemes'], ['k6', 'polgár'], ['k7', 'polgár'], ['k8', 'egyházi'], ['k9', 'egyházi'], ['k10', 'egyházi']];
const S9 = { okT: null };
function buildCards() {
  const zs = [['egyházi', 'z egyházi', 'z egyházi sub', OCHRE], ['nemes', 'z nemes', 'z nemes sub', PLUM], ['jobbágy', 'z jobbágy', 'z jobbágy sub', GOOD], ['polgár', 'z polgár', 'z polgár sub', TEAL]];
  const zones = zs.map(([id, tk, sk], i) => ({ id, x: 40 + i * 330, y: 400, w: 310, h: 600, title: K(tk), sub: K(sk), head: 104 }));
  CARDS = TortCards.create(L, { zones, cards: CD9.map(([k, z]) => ({ id: k, label: K(k), zone: z })), tray: { x: 40, y: 140, w: 1300, h: 240, top: 20 }, font: { s: 22, w: 600 } });
}
function scene9(st, w, active) {
  GA = w;
  const p = pAt(st);
  al(p(0)); T('s9 cím', 40, 88, { f: F.D, s: 40, w: 600, max: 1290 });
  if (active) CARDS.update();
  al(1); CARDS.draw({ a: p(.2) * GA });
  const sc = CARDS.score();
  if (sc.ok === sc.total) { if (S9.okT == null && active) S9.okT = st; }
  if (S9.okT != null) { al(smooth((st - S9.okT) / .5)); L.pill(lab('s9 jó'), 1340, 1040, { k: 's9 jó', s: 24, w: 700, a: 'right', b: 'middle', c: '#fff', bg: GOOD, bd: GOOD, pad: 12, r: 10 }); }
}

/* ════════ lépések ════════ */
const sT = new Array(9).fill(0);
const STEPS = [
  { settle: 3.0, enter() { S1.u = mkT(0); },
    controls(L) { L.button(lab('gomb arányok'), () => tset(S1.u, 1, L.st, 1.2), 'gomb arányok'); L.button(lab('gomb eszmény'), () => tset(S1.u, 0, L.st, 1.2), 'gomb eszmény'); } },
  { settle: 3.4, enter() { reset2(); },
    controls(L) { L.button(lab('gomb kontinens'), () => setEng(false, L.st), 'gomb kontinens'); L.button(lab('gomb anglia'), () => setEng(true, L.st), 'gomb anglia'); } },
  { settle: 2.4, enter() { tipReset(P3); veilIf(P3); reset3(); },
    controls(L) {
      tipControls(P3);
      SL.s3 = L.slider({ label: lab('csúszka hozam'), k: 'csúszka hozam', min: 2, max: 6, step: .5, value: num('hozam a 3. lépésben'), format: (v) => tpl('hozam sablon', fmt(v, v % 1 ? 1 : 0)), onInput: (v) => set3(v, S3.form, L.st) });
      ['termény', 'pénz', 'munka'].forEach((f) => L.button(lab('gomb ' + f), () => set3(S3.r, f, L.st), 'gomb ' + f));
    } },
  { settle: 2.8, enter() { reset4(); },
    controls(L) {
      SL.s4 = L.slider({ label: lab('csúszka hozam'), k: 'csúszka hozam', min: 2, max: 6, step: .5, value: num('hozam a 4. lépésben'), format: (v) => tpl('hozam sablon', fmt(v, v % 1 ? 1 : 0)), onInput: (v) => set4({ r: v }, L.st) });
      L.button(lab('gomb jó év'), () => set4({ bad: false }, L.st), 'gomb jó év'); L.button(lab('gomb rossz év'), () => set4({ bad: true }, L.st), 'gomb rossz év');
      ['termény', 'pénz', 'munka'].forEach((f) => L.button(lab('gomb ' + f), () => set4({ form: f }, L.st), 'gomb ' + f));
    } },
  { settle: 3.0, enter() { reset5(); },
    controls(L) { ['m0', 'm1', 'm2'].forEach((m, i) => L.button(lab('gomb ' + m), () => setM5(i, L.st), 'gomb ' + m)); } },
  { settle: 9.0, enter() { D6.user = false; D6.d = mkT(D_B()); },
    controls(L) { SL.s6 = L.slider({ label: lab('csúszka dátum'), k: 'csúszka dátum', min: Math.floor(D_A() * 12) / 12, max: Math.ceil(D_B() * 12) / 12, step: 1 / 12, value: Math.ceil(D_B() * 12) / 12, format: (v) => dateLab(v), onInput: (v) => { const now = d6(L.st); D6.user = true; D6.d = { from: now, to: v, t0: L.st }; } }); } },
  { settle: 5.0, enter() { S7.user = false; S7.y = mkT(1500); },
    controls(L) { SL.s7 = L.slider({ label: lab('csúszka év'), k: 'csúszka év', min: 1300, max: 1500, step: 1, value: 1500, format: (v) => String(v), onInput: (v) => { const now = y7(L.st); S7.user = true; S7.y = { from: now, to: v, t0: L.st }; } }); } },
  { settle: 3.0, enter() { S8.sel = 'mind'; S8.hz = mkT(1); S8.lv = mkT(1); },
    controls(L) { [['hanza', 'gomb hanza'], ['levante', 'gomb levante'], ['mind', 'gomb mind']].forEach(([s, k]) => L.button(lab(k), () => setSel8(s, L.st), k)); } },
  { settle: 1.5, enter() { CARDS.reset(); S9.okT = null; }, leave(L) { L.stage.style.cursor = ''; },
    controls(L) { L.button(lab('gomb megoldás'), () => CARDS.solve(), 'gomb megoldás'); L.button(lab('gomb újra'), () => { CARDS.reset(); S9.okT = null; }, 'gomb újra'); } },
];
const SCENES = [scene1, scene2, scene3, scene4, scene5, scene6, scene7, scene8, scene9];

/* ── QA: szélső állapotok ── */
window.__qaStates = {
  1: [{ name: 'aranyok', set(L) { S1.u = { from: 0, to: 1, t0: L.st - 3 }; } }],
  2: [{ name: 'anglia', set(L) { setEng(true, L.st - 3); } }],
  3: [{ name: 'tipp-jo', set(L) { tipGuess(P3, 'tipp3 harmad', L.st - 3); } },
    { name: 'tipp-rossz', set(L) { tipGuess(P3, 'tipp3 tized', L.st - 3); } },
    { name: 'hozam-2', set(L) { tipGuess(P3, 'tipp3 harmad', L.st - 3); SL.s3.set(2, { fire: true }); S3.t0 = L.st - 2; } },
    { name: 'hozam-6-penz', set(L) { tipGuess(P3, 'tipp3 harmad', L.st - 3); SL.s3.set(6, { fire: true }); set3(6, 'pénz', L.st - 2); } },
    { name: 'munka', set(L) { tipGuess(P3, 'tipp3 harmad', L.st - 3); SL.s3.set(4, { fire: true }); set3(4, 'munka', L.st - 2); } }],
  4: [{ name: 'jo-ev', set(L) { set4({ bad: false }, L.st - 2); } },
    { name: 'rossz-penz', set(L) { set4({ form: 'pénz' }, L.st - 2); } },
    { name: 'hozam-2', set(L) { SL.s4.set(2, { fire: true }); S4.t0 = L.st - 2; } },
    { name: 'hozam-6', set(L) { SL.s4.set(6, { fire: true }); S4.t0 = L.st - 2; } }],
  5: [{ name: 'gergely', set(L) { setM5(1, L.st - 2); } }, { name: 'worms', set(L) { setM5(2, L.st - 2); } }],
  6: [{ name: '1348-jun', set(L) { D6.user = true; D6.d = mkT(1348 + 5 / 12 + .01); SL.s6.set(1348 + 5 / 12); } },
    { name: 'eleje', set(L) { D6.user = true; D6.d = mkT(Math.floor(D_A() * 12) / 12); SL.s6.set(Math.floor(D_A() * 12) / 12); } }],
  7: [{ name: '1349', set(L) { S7.user = true; S7.y = mkT(1349); SL.s7.set(1349); } }, { name: '1300', set(L) { S7.user = true; S7.y = mkT(1300); SL.s7.set(1300); } }],
  8: [{ name: 'hanza', set(L) { setSel8('hanza', L.st - 2); } }, { name: 'levante', set(L) { setSel8('levante', L.st - 2); } }],
  9: [{ name: 'megoldva', set(L) { CARDS.solve(L.st - 3); S9.okT = L.st - 3; } }],
};

L = Lesson.create({
  resetCtx: true,
  content: window.LESSON_CONTENT,
  home: false,
  steps: STEPS,
  init(Lx) {
    L = Lx; c = L.ctx;
    SRC = TortSource.create(L, { 'forrás': K('forrás jel'), 'rekonstrukció': K('rekonstrukció jel'), 'monda': K('monda jel'), 'becslés': K('becslés'), 'vázlatos': K('vázlatos'), 'illusztráció': K('illusztráció') });
    TT = { bc: K('Kr. e.'), ad: K('Kr. u.'), cent: K('század'), years: K('év sablon') };
    PROJ = TortProj.lcc({ lon0: 15, lat0: 48, lat1: 38, lat2: 58 });
    MAP = TortMap.create({ proj: PROJ, ancient: true, layers: [{ data: window.TORT_MAP_VILAG }, { data: window.TORT_MAP_EUROPA }], rect: [0, 0, 1360, 1080] });
    VE = TortMap.fit(PROJ, [-10.5, 30.5, 36.5, 61.5], [20, 90, 860, 950], 10);
    TL5 = TortTimeline.create(L, { x0: 60, x1: 1300, y: 1000, h: 44, T: TT, src: SRC });
    TL5.view(1040, 1130);
    CH7 = FoldChart.create(L, { x: 120, y: 150, w: 690, h: 560, xs: { min: 1290, max: 1530, ticks: [1300, 1350, 1400, 1450, 1500], fmt: String },
      ys: { min: 0, max: 6, step: 1 }, y2: { min: 0, max: 150, step: 25 } });
    buildState2(); buildState5(); buildCards();
    reset2(); reset3(); reset4(); reset5();
    D6.d = mkT(D_B());
    L.checks = () => {
      const o = [];
      const s0 = S0();
      o.push({ name: 'vetőmag = terület × kg/ha', ok: Math.abs(s0 - num('bevetett terület') * num('vetőmag hektáronként')) < 1e-9, got: s0, want: num('bevetett terület') * num('vetőmag hektáronként') });
      const a3 = yearCalc(s0, 3, false, 'termény');
      o.push({ name: '1 : 3 → a vetőmag a termés harmada', ok: Math.abs(a3.seed / a3.H - 1 / 3) < 1e-9, got: (a3.seed / a3.H).toFixed(4), want: '0.3333' });
      let sumOk = true;
      for (const r of [2, 3, 4, 5, 6]) for (const f of ['termény', 'pénz', 'munka']) for (const b of [false, true]) {
        const y = yearCalc(s0, r, b, f); if (Math.abs(y.tithe + y.rent + y.seed + y.fam - y.H) > 1e-6 || y.fam < -1e-9 || y.seed < -1e-9) sumOk = false;
      }
      o.push({ name: 'a szétosztás összege = termés (minden állás)', ok: sumOk, got: sumOk, want: true });
      const t4 = yearCalc(s0, 4, false, 'termény');
      o.push({ name: 'tized = kilenced (a tized utáni rész 1/9-e)', ok: Math.abs(t4.tithe - t4.rent) < 1e-9, got: t4.tithe.toFixed(1) + '/' + t4.rent.toFixed(1), want: 'egyenlő' });
      const b4 = yearCalc(s0, 4, true, 'termény'), b4p = yearCalc(s0, 4, true, 'pénz');
      o.push({ name: 'rossz évben a fix pénzjáradék több gabonát visz', ok: b4p.rent > b4.rent, got: kg(b4p.rent) + ' > ' + kg(b4.rent), want: 'pénz > termény' });
      const ch = { y1: b4, y2: yearCalc(b4.kept, 4, false, 'termény') };
      o.push({ name: 'rossz év után a 2. évben kevesebbet vetnek', ok: ch.y2.sown < s0 && ch.y1.eat > 0, got: kg(ch.y2.sown), want: '< ' + kg(s0) });
      if (L.step === 2) {
        const R = res3(L.st);
        const hpx = (R.tithe + R.rent + R.seed + R.fam) * KGPX;
        o.push({ name: 'rajzolt oszlop = termés × lépték', ok: Math.abs(hpx - R.H * KGPX) < .5, got: hpx.toFixed(1), want: (R.H * KGPX).toFixed(1) });
      }
      const sh = share1().reduce((a, b) => a + b, 0);
      o.push({ name: 'a becslés-sáv 100 %', ok: Math.abs(sh - 1) < 1e-9, got: sh, want: 1 });
      let srt = true; for (let i = 1; i < PEST.length; i++) if (dat('pestis ' + PEST[i]).a < dat('pestis ' + PEST[i - 1]).a - 1e-9) srt = false;
      o.push({ name: 'a pestis-pontok időrendben', ok: srt, got: srt, want: true });
      const pop = dat('Anglia népessége');
      const i48 = pop.x.indexOf(1348), i51 = pop.x.indexOf(1351);
      if (i48 >= 0 && i51 >= 0) { const dr = 1 - pop.y[i51] / pop.y[i48]; o.push({ name: 'Anglia 1348→1351 csökkenés a 30–60 %-os sávban', ok: dr > .3 && dr < .6, got: (dr * 100).toFixed(1) + ' %', want: '30–60 %' }); }
      const sc = CARDS.cards.filter((q) => CD9.find(([k, z]) => k === q.id && z === q.zone)).length;
      o.push({ name: 'kártyák: mind a 10 a megoldással', ok: sc === 10, got: sc, want: 10 });
      return o;
    };
  },
  draw(Lx) {
    L = Lx; c = L.ctx; GA = 1; paper();
    const sp = L.sp, wt = (i) => clamp(1 - Math.abs(sp - i) * 2);
    sT[L.step] = L.st;
    for (let i = 0; i < SCENES.length; i++) { const w = wt(i); if (w > .005) SCENES[i](sT[i], w, L.step === i); }
    c.globalAlpha = 1;
  },
});
})();

</script>
