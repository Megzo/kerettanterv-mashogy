/* ── MODUL: Időszalag (TortTimeline) ──────────────────────────────────────────────

  const Y = {
    astro: (v) => (v < 0 ? v + 1 : v),
    hist: (a) => (a <= 0 ? a - 1 : a),
    u: (d) => (typeof d === 'number' ? d + .5 : d.t === 'date' ? d.a : d.a + .5),
    year: (u) => Math.floor(u),
    num: (a) => (a <= 0 ? 1 - a : a),
    label: (a, T, ad) => (a <= 0 ? T.bc.s + NB + (1 - a) : (ad ? T.ad.s + NB : '') + a),
    key: (a, T, ad) => (a <= 0 ? T.bc.k : ad ? T.ad.k : null),
    range: (a0, a1, T) => {

      if (a0 >= 1) return a0 + '–' + a1;

    elapsed: (a1, a2) => a2 - a1,

    century: (a) => (a >= 1 ? { n: Math.ceil(a / 100), bc: false } : { n: Math.ceil((1 - a) / 100), bc: true }),

    centuryLabel: (a, T, short) => { const c = Y.century(a); return (c.bc ? T.bc.s + NB : '') + c.n + '.' + (short ? '' : NB + T.cent.s); },
    centuryKeys: (a, T) => (Y.century(a).bc ? [T.cent.k, T.bc.k] : [T.cent.k]),
    centuryRule: (a) => {

      return t === 0 ? `${h}|00 → ${n}` : `${h}|${String(t).padStart(2, '0')} → ${h} + 1 = ${n}`;

    const tl = { o, T, src: o.src || null, x0: o.x0, x1: o.x1, y: o.y, h: o.h || 64, pins: [], user: null, drag: null,
      bounds: o.bounds || [-1e6, 1e6], minSpan: o.minSpan || 4, maxSpan: o.maxSpan || 1e5, epoch: o.epoch == null ? null : o.epoch };

const setOn = (L2, grp, key) => L2.controlsEl.querySelectorAll('.lp-btn').forEach((e) => { if (e.dataset.grp === grp) e.classList.toggle('on', e.dataset.key === key || e.textContent === L2.lab(key)); });

      out.push({ name: 'Kocsis 2015: magyar / összesen = 34,7 %', ok: near(nl[0] / tot * 100, N('Kocsis magyar arány'), .05), got: (nl[0] / tot * 100).toFixed(2), want: N('Kocsis magyar arány') });
      out.push({ name: 'kör: a darabok összege = összesen', ok: near(V6.reduce((s, v) => s + v, 0), N('1787 összesen'), 1), got: V6.reduce((s, v) => s + v, 0), want: N('1787 összesen') });
      out.push({ name: '1720: magyar + nem magyar = 4,3 millió (Kocsis 2015)', ok: near(N('magyar 1720') + N('nem magyar 1720'), N('Wellmann 1720'), 1e3), got: N('magyar 1720') + N('nem magyar 1720'), want: N('Wellmann 1720') });
