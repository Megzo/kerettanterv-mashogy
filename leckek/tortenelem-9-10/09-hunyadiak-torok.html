  'use strict';

        L.tx(lab(KEYS.mine), b.x + b.w / 2, b.y + b.h + 30, { k: KEYS.mine, s: 22, w: 700, f: F.B, c: RED, a: 'center' });

/* ── MODUL: Időszalag (TortTimeline) ──────────────────────────────────────────────

   Később változtatás nélkül átemelhető: shared/tort/timeline.js. Csak a Lesson motorra épül

   IDŐ-KOORDINÁTA (u): folytonos, csillagászati években. Az „a” csillagászati év

const TortTimeline = (() => {
  const F = Lesson.FONTS, U = Lesson.U, NB = ' ', MINUS = '−', TAU = Math.PI * 2;
  const INK = '#1c2440', MUT = '#565d72', RED = '#c8401c', CARD = '#fffaf1', OCHRE = '#8f5a0c';
  const TF = { f: F.B, s: 22, w: 500 };
  const STEPS = [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000, 2000, 5000, 10000, 20000];

  const Y = {
    astro: (v) => (v < 0 ? v + 1 : v),
    hist: (a) => (a <= 0 ? a - 1 : a),
    u: (d) => (typeof d === 'number' ? d + .5 : d.t === 'date' ? d.a : d.a + .5),
    year: (u) => Math.floor(u),
    num: (a) => (a <= 0 ? 1 - a : a),
    label: (a, T, ad) => (a <= 0 ? T.bc.s + NB + (1 - a) : (ad ? T.ad.s + NB : '') + a),
    key: (a, T, ad) => (a <= 0 ? T.bc.k : ad ? T.ad.k : null),
    range: (a0, a1, T) => {
      if (a0 > a1) [a0, a1] = [a1, a0];
      if (a1 <= 0) return T.bc.s + NB + (1 - a0) + '–' + (1 - a1);
      if (a0 >= 1) return a0 + '–' + a1;
      return Y.label(a0, T) + ' – ' + Y.label(a1, T, true);
    },
    elapsed: (a1, a2) => a2 - a1,
    formula: (a1, a2) => {
      const lo = Math.min(a1, a2), hi = Math.max(a1, a2), e = hi - lo;
      if (hi <= 0) return `${1 - lo} ${MINUS} ${1 - hi} = ${e}`;
      if (lo >= 1) return `${hi} ${MINUS} ${lo} = ${e}`;
      return `${1 - lo} + ${hi} ${MINUS} 1 = ${e}`;
    },
    century: (a) => (a >= 1 ? { n: Math.ceil(a / 100), bc: false } : { n: Math.ceil((1 - a) / 100), bc: true }),
    centurySpan: (n, bc) => (bc ? [1 - 100 * n, 101 - 100 * n] : [100 * n - 99, 100 * n + 1]),
    centuryLabel: (a, T, short) => { const c = Y.century(a); return (c.bc ? T.bc.s + NB : '') + c.n + '.' + (short ? '' : NB + T.cent.s); },
    centuryKeys: (a, T) => (Y.century(a).bc ? [T.cent.k, T.bc.k] : [T.cent.k]),
    centuryRule: (a) => {
      const y = Y.num(a), n = Y.century(a).n, h = Math.floor(y / 100), t = y % 100;
      return t === 0 ? `${h}|00 → ${n}` : `${h}|${String(t).padStart(2, '0')} → ${h} + 1 = ${n}`;
    },
    lerpView: (v0, v1, t) => {
      const s0 = v0[1] - v0[0], s1 = v1[1] - v1[0], c0 = (v0[0] + v0[1]) / 2, c1 = (v1[0] + v1[1]) / 2;
      const s = Math.exp(U.lerp(Math.log(s0), Math.log(s1), t));
      const k = Math.abs(Math.log(s1 / s0)) > .25 ? (s - s0) / (s1 - s0) : t;
      const m = U.lerp(c0, c1, k);
      return [m - s / 2, m + s / 2];
    },
  };

  function create(L, o) {
    const T = o.T;
    const tl = { o, T, src: o.src || null, x0: o.x0, x1: o.x1, y: o.y, h: o.h || 64, pins: [], user: null, drag: null,
      bounds: o.bounds || [-1e6, 1e6], minSpan: o.minSpan || 4, maxSpan: o.maxSpan || 1e5, epoch: o.epoch == null ? null : o.epoch };
    tl.top = tl.y - tl.h / 2; tl.bot = tl.y + tl.h / 2;

    /* azok a csillagászati évek, amelyek kiírt száma a lépésköz többszöröse (a szalag közepén: a + 0,5) */
    function yearsAt(step) {
      const out = [];

      }
      for (let n = Math.max(step, Math.ceil((tl.u0 - .5) / step) * step); n + .5 <= tl.u1; n += step) out.push(n);

    leave() { SLL = SLG = null; },
    controls(L) {
      L.button(lab('gomb hadiadóval'), () => set6(true), 'gomb hadiadóval'); L.button(lab('gomb hadiadó nélkül'), () => set6(false), 'gomb hadiadó nélkül');
      SLL = L.slider({ label: lab('csúszka lovas'), k: 'csúszka lovas', min: 0, max: 20000, step: 1000, value: S6.lov, format: (v) => fmt(v), onInput: (v) => { S6.lov = v; } });
      SLG = L.slider({ label: lab('csúszka gyalogos'), k: 'csúszka gyalogos', min: 0, max: 20000, step: 1000, value: S6.gy, format: (v) => fmt(v), onInput: (v) => { S6.gy = v; } });
    } },
  { settle: 6.4 },
  { settle: 5.4 },
  { settle: 11.4, enter() { S9.user = null; }, leave() { SL9 = null; }, controls: yrSlider(S9, D9, (s) => { SL9 = s; }) },
];
const set6s = (L, tax, lov, gy) => { S6.tax = tax; S6.t = L.st - 2; S6.lov = lov; S6.gy = gy; if (SLL) SLL.set(lov); if (SLG) SLG.set(gy); };
window.__qaStates = {
  1: [{ name: '1354', set() { setD(S1, SL1, D1()[0] + .4); } }, { name: '1400', set() { setD(S1, SL1, 1400.5); } }, { name: '1441', set() { setD(S1, SL1, 1441.5); } },
    { name: '1458', set() { setD(S1, SL1, 1458.5); } }],
  3: ORDER3.map((id) => ({ name: 'csata-' + id, set(L) { S3.sel = id; S3.t = L.st - 1; } })),
  5: [{ name: 'jo-tipp', set(L) { tipGuess(P5, 'tipp harmad', L.st - 9); } }, { name: 'rossz-tipp', set(L) { tipGuess(P5, 'tipp nagyobb', L.st - 1.2); } }],
  6: [{ name: 'hadiado-nelkul', set(L) { set6s(L, false, 10000, 5000); } }, { name: 'sok-zsoldos', set(L) { set6s(L, true, 20000, 20000); } },
    { name: 'kevés-zsoldos', set(L) { set6s(L, false, 4000, 3000); } }],
  9: [{ name: '1430', set() { setD(S9, SL9, 1430.6); } }, { name: '1490', set() { setD(S9, SL9, 1490.4); } }, { name: '1515', set() { setD(S9, SL9, 1515); } }],
};

L = Lesson.create({
  content: window.LESSON_CONTENT,
  home: false,
  resetCtx: true,
  steps: STEPS,
  init(Lx) {
    L = Lx; c = L.ctx;
    SRC = TortSource.create(L, { 'forrás': K('forrás jel'), 'rekonstrukció': K('rekonstrukció jel'), 'monda': K('monda jel'), 'becslés': K('becslés'), 'vázlatos': K('vázlatos'), 'illusztráció': K('illusztráció') });
    const PK = TortProj.lcc({ lon0: 22, lat0: 43, lat1: 40, lat2: 46 });
    MAPK = TortMap.create({ proj: PK, layers: [{ data: window.TORT_MAP_VILAG }, { data: window.TORT_MAP_MEDITERRAN }, { data: window.TORT_MAP_KARPAT }], ancient: true });
    TK = TortTerr.create(L, window.TORT_HATAR, { map: MAPK });
    V1 = TortMap.fit(PK, [13.4, 38.9, 30.2, 49.0], [R1[0], R1[1], R1[2], R1[3]]);
    V2 = TortMap.fit(PK, [15.5, 41.9, 29.6, 48.4], [R2[0], R2[1], R2[2], R2[3]]);
    V3 = TortMap.fit(PK, [16.5, 40.6, 29.6, 48.0], [R3[0], R3[1], R3[2], R3[3]]);
    V7 = TortMap.fit(PK, [14.4, 42.9, 24.2, 47.6], [R7[0], R7[1], R7[2], R7[3]]);
    P5 = Tip(['tipp nagyobb', 'tipp azonos', 'tipp harmad'], 'tipp harmad');
    S6.lov = num('lovasok kezdőérték'); S6.gy = num('gyalogosok kezdőérték');
    L.checks = () => {
      const near = (a, b, e) => Math.abs(a - b) <= e;
      const sum = PARTS6.reduce((t, q) => t + num(q[1]), 0);
      const kub = model6(true, num('lovasok kezdőérték'), 0).cost, kub2 = model6(true, 0, num('gyalogosok kezdőérték')).cost;
      const ratio = num('Mátyás bevétele') / num('szultán bevétele 1475');
      const zonesOk = HUZ.concat(OTTD, OTTV).every((z) => z.f == null || z.t == null || yd(z.f) < yd(z.t));
      const order = ['Gallipoli elfoglalása', 'első rigómezei csata', 'nikápolyi csata', 'havasalföldi adó kezdete', 'Nándorfehérvár magyar kézre', 'Szaloniki eleste', 'Szendrő első eleste',
        'hosszú hadjárat kezdete', 'szegedi béke', 'várnai csata', 'kormányzóság kezdete', 'második rigómezei csata', 'kormányzóság vége', 'Konstantinápoly eleste', 'pápai bulla', 'moldvai adó kezdete',
        'nándorfehérvári diadal', 'Hunyadi halála', 'Hunyadi László kivégzése', 'Mátyás megválasztása', 'Szendrő eleste', 'Bosznia meghódítása', 'bécsújhelyi szerződés',
        'Jajca visszafoglalása', 'Mátyás koronázása', 'Szrebernik elfoglalása', 'kincstári reform', 'Szabács elfoglalása', 'olomouci béke', 'Szkutari eleste', 'kenyérmezei csata',
        'Hercegovina meghódítása', 'fegyverszünet dátum', 'Bécs elfoglalása', 'Bonfini Mátyás udvarában', 'Mátyás halála', 'Jagelló-kori számadás', 'Szrebernik eleste', 'Nándorfehérvár eleste', 'mohácsi csata'];
      const bad = order.filter((k, i) => i > 0 && yd(order[i - 1]) > yd(k));
      const mr = dat('Mátyás bevétele tartomány');
      return [
        { name: 'bevételi tételek összege ≈ az átlag (Kubinyi: 622 / 628 ezer)', ok: near(sum, num('Mátyás bevétele'), 10000), got: sum, want: num('Mátyás bevétele') },
        { name: 'az átlag a tartományon belül', ok: num('Mátyás bevétele') >= mr.lo && num('Mátyás bevétele') <= mr.hi, got: num('Mátyás bevétele'), want: mr.lo + '–' + mr.hi },
        { name: 'Kubinyi: 10 000 nehézlovas évi zsoldja 360 ezer Ft', ok: kub === 360000, got: kub, want: 360000 },
        { name: 'Kubinyi: 5000 nehézgyalogos évi zsoldja 120 ezer Ft', ok: kub2 === 120000, got: kub2, want: 120000 },
        { name: 'Mátyás ≈ a szultán harmada („kb. a harmada” a helyes tipp)', ok: ratio > .28 && ratio < .42, got: fmt(ratio, 3), want: '0,28–0,42' },
        { name: 'a szultán 1475-ös bevételének kb. 4/5-e európai', ok: near(num('szultán európai bevétele 1475') / num('szultán bevétele 1475'), .8, .05), got: fmt(num('szultán európai bevétele 1475') / num('szultán bevétele 1475'), 3), want: '≈ 0,8' },
        { name: 'hadiadó nélkül a kezdő sereg nem fizethető', ok: model6(false, num('lovasok kezdőérték'), num('gyalogosok kezdőérték')).rest < 0 && model6(true, num('lovasok kezdőérték'), num('gyalogosok kezdőérték')).rest > 0, got: true, want: true },
        { name: 'Jagelló-kori bevétel ≈ a Mátyás-kori negyede (Kenyeres)', ok: near(num('Jagelló-kori bevétel') / 600000, .25, .03), got: fmt(num('Jagelló-kori bevétel') / 600000, 3), want: '≈ 0,25' },
        { name: 'nándorfehérvári diadal → eleste: kb. 65 év', ok: near(yv('Nándorfehérvár eleste') - yv('nándorfehérvári diadal'), 65, 0), got: yv('Nándorfehérvár eleste') - yv('nándorfehérvári diadal'), want: 65 },
        { name: 'Hunyadi a diadal után kb. három héttel halt meg', ok: near((yd('Hunyadi halála') - yd('nándorfehérvári diadal')) * 365, 20, 3), got: Math.round((yd('Hunyadi halála') - yd('nándorfehérvári diadal')) * 365), want: '≈ 20 nap' },
        { name: 'a térképfoltok kezdete a vége előtt', ok: zonesOk, got: zonesOk, want: true },
        { name: 'az események időrendben', ok: bad.length === 0, got: bad.join(', ') || 'rendben', want: 'rendben' },
      ];
    };
  },
  draw(Lx) {
    L = Lx; c = L.ctx; GA = 1; paper();
    const sp = L.sp, wt = (i) => clamp(1 - Math.abs(sp - i) * 2);
    sT[L.step] = L.st;
    const S = [scene1, scene2, scene3, scene4, scene5, scene6, scene7, scene8, scene9];
    for (let i = 0; i < 9; i++) { const w = wt(i); if (w > .005) { c.save(); S[i](sT[i], w, L.step === i); c.restore(); } }
    c.globalAlpha = 1;
  },
});
})();

</script>
