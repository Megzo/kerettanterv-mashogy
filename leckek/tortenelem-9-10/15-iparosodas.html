<script>
/* ── MODUL: „Tippelj!” és bélyegek (TtTipp) · forrás: termeszettudomany-5-6/01-tocsa + 03-meres, egységesítve 2026-11-24 ── */
/* A természettudomány 5–6. sorozat közös mintái (szerződés 17.): kísérlet-/modellbélyeg és a „Tippelj! → kísérlet →
   magyarázat” jóslat. Csak a Lesson motorra épül (L.ctx, L.tx, L.pill, L.lab, L.button, L.controlsEl, L.panel, L.st,
   Lesson.U, Lesson.FONTS); a lecke kódjára nem hivatkozik. A panel elmosásához szükséges CSS-t (.tt-rejtett) és a
   letiltott csúszka halványítását a modul maga teszi a <head>-be – a leckében nem kell <style>-sor.

   BEKÖTÉS (a lecke kódjában, egyszer, legfelső szinten – a getterek miatt a sorrend mindegy):
     TtTipp.bind({ L: () => L, ga: () => GA });    // ga: a lecke alap-alfája (jelenet-áttűnés); alap: () => 1
     const { stamp, Tip, tipReset, panelVeil, veilIf, tipGuess, tipHide, tipControls, tipU, rhythm, tipHead, tipRow,
       tipFeedback } = TtTipp;
   ALFA: minden rajzoló a globalAlpha-t ga() · a (· belső áttűnés) értékre ÁLLÍTJA (nem szoroz a pillanatnyival, így
   egy korábbi halvány felirat nem tünteti el), a vonalstílust (lineCap/lineJoin/setLineDash) visszaállítja.

   stamp(kind, x, y, a, o) → doboz | null       kísérlet-/modellbélyeg a KemGHS.stamp stílusával (Bricolage 22 px,
        600, betűköz 0,08 em, −3°, papír alap, 2 px keret; 'tilos': 700, 3 px). (x, y): a bal szél közepe.
        Szöveg: az o.k || '<kind> bélyeg' .md-kulcs. Szín (STAMP): otthon kékeszöld, felnőtt okker, tilos #b3261e;
        tanári, modell, kitalált, nem méretarányos, sematikus, vázlatos, képzeletbeli (és minden más) halvány tinta.
        o = {k, col (szín felülírása), rot: −3 (fok), al: 'left' (igazítás)}. a ≤ 0,005 → nem rajzol.
   Tip(keys, ok) → P      jóslat-állapot. keys: a válaszok .md-kulcsai (egyben gombfeliratok), ok: a helyes kulcs (az
        init-ben is beállítható: P.ok = …). P = {keys, ok, guess: null | kulcs, gt: a választás L.st-je, btns, on}.
        P.on(k): választáskor hívódik (a lecke állítja, pl. a kísérlet vezérlőinek feloldására).
   tipReset(P)            alaphelyzet (az enter()-ben; utána veilIf(P)).
   panelVeil(on)          a panelszöveg 2. bekezdésétől (.lp-text > *, i > 0) elmos (on) / felold.
   veilIf(P)              panelVeil(!P.guess) – az enter()-ben a tipReset után.
   tipControls(P)         a tippgombok (L.button, P.keys sorrendben). A választás után csak ezek tűnnek el: a
        sorukba utána tett más gombok maradnak (ha a sorban nem marad látható gomb, a sor is eltűnik).
   tipGuess(P, k, gt)     választás (csak az első számít): P.guess = k, P.gt = gt ?? L.st, tipHide, panelVeil(false),
        P.on(k). A QA-állapotok is ezt hívhatják (pl. gt = L.st − 30: a kísérlet már lefutott).
   tipHide(P)             a tippgombok elrejtése (a tipGuess hívja; QA-állapotban kézzel is).
   tipU(P, st) → mp       a választás óta eltelt idő (st − P.gt), −1, ha még nincs tipp.
   rhythm(ph, a)          a „Tippelj! → kísérlet → magyarázat” sáv a vászon bal felső sarkában (x 40, y 46);
        ph: 0 / 1 / 2 az aktív szakasz.
   tipHead(P, st, a, qk, o) → y     fejléc: sáv + kérdés (qk, (40, 116), Fraunces 38, max 1280) + válaszsor (40, y).
        o = {tExp: 4,5 (a kísérlet hossza mp-ben: ennyi után vált a sáv „magyarázat”-ra, és mutatja a helyes
        választ), q2 (2. kérdéssor kulcsa, (40, 162); a válaszsor 46 px-szel lejjebb kerül), qv (a kérdés #-jeleinek
        értékei, sorban), y: 178 (a válaszsor közepe), noRhythm (a sáv nélkül – pl. olvasási kérdésnél)}.
        Visszaad: a válaszsor y-ja.
   tipRow(P, st, a, x, y, o) → [dobozok]    csak a válaszsor (a tipHead is ezt rajzolja), bárhová: a választásig
        semleges; a választott cinóber keretet és alatta „a te tipped” feliratot kap; o.tExp (0) mp múlva a helyes
        zöld keretet + pipát kap, a többi elhalványul. Dobozköz 54 px (a pipának).
   tipFeedback(P, st, a, x, y, o) → doboz | null    „Jó tipp!” (zöld) / „Sokan gondolják így – nézzük meg!”
        (kékeszöld) pill (x: bal szél, y: közép), a választás után 0,15 mp-cel beúszva. o = {s: 24, al: 'left', max}.
   .md-kulcsok (### Feliratok): tippelj felirat, kísérlet felirat, magyarázat felirat, a te tipped felirat, jó tipp
        felirat, rossz tipp felirat; a bélyegeké '<kind> bélyeg'.
   ──────────────────────────────────────────────────────────────────────────────────────────────────────── */
const TtTipp = (() => {
  'use strict';
  const U = Lesson.U, F = Lesson.FONTS, { clamp, lerp, smooth } = U;
  const INK = '#1c2440', MUT = '#565d72', RED = '#c8401c', TEAL = '#0a6f86', GOOD = '#1d7a45', BAD = '#b3261e', OKR = '#8f5a0c', CARD = '#fffaf1';
  const STAMP = { otthon: TEAL, felnőtt: OKR, tilos: BAD, tanári: MUT, modell: MUT, kitalált: MUT, 'nem méretarányos': MUT, sematikus: MUT, vázlatos: MUT, képzeletbeli: MUT };
  const KEYS = { ph: ['tippelj felirat', 'kísérlet felirat', 'magyarázat felirat'], mine: 'a te tipped felirat', ok: 'jó tipp felirat', bad: 'rossz tipp felirat' };
  let getL = () => null, ga = () => 1;
  if (typeof document !== 'undefined' && !document.getElementById('tt-tipp-css')) {
    const st = document.createElement('style'); st.id = 'tt-tipp-css';
    st.textContent = '.lp-text > .tt-rejtett { filter: blur(7px); opacity: .5; user-select: none; transition: filter .6s, opacity .6s; }\n'
      + '.lp-slider:has(input:disabled) { opacity: .45; }\n.lp-slider input:disabled { cursor: not-allowed; }';
    document.head.appendChild(st);
  }
  const Lx = () => getL(), cx = () => getL().ctx, lab = (k) => getL().lab(k);
  const al = (a) => { cx().globalAlpha = ga() * clamp(a); };
  const fillIn = (s, v) => { let i = 0; return s.replace(/#/g, () => (i < v.length ? v[i++] : '#')); };
  const rr = (c, x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, w, h, r); };
  function check(x, y, a) {                 // pipa (rajz, nem betűjel)
    const c = cx(); al(a); c.lineWidth = 4.5; c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = GOOD; c.beginPath();
    c.moveTo(x - 10, y); c.lineTo(x - 3, y + 8); c.lineTo(x + 11, y - 9); c.stroke(); c.lineCap = 'butt'; c.lineJoin = 'miter';
  }

/* ════════ 9. Összefoglalás ════════ */
const ROWS9 = [['sor idő', 'h1 idő', 'h2 idő'], ['sor energia', 'h1 energia', 'h2 energia'], ['sor ágazat', 'h1 ágazat', 'h2 ágazat'], ['sor jelkép', 'h1 jelkép', 'h2 jelkép'], ['sor város', 'h1 város', 'h2 város']];

    ev(yr('Watt kondenzátor') + .5, 'idő Watt', 'Watt kondenzátor', 1, 2.6),
    ev(dat('Edison izzó').a + .5, 'idő Edison', 'Edison izzó', 1, 3.2),

    ev(dat('Liverpool–Manchester vasút').a, 'idő LM', 'Liverpool–Manchester vasút', 0, 2.9),

}

/* ══════════ lépések ══════════ */
const SCENES = [scene1, scene2, scene3, scene4, scene5, scene6, scene7, scene8, scene9];
const sT = SCENES.map(() => 0);
const SETTLE = [6.2, 4.5, 6.2, 6.0, 1.5, 4.2, 4.6, 3.2, 4.4];
function reset2() { S2.n = 1; S2.t0 = 0; S2.auto = false; }

function reset6() { S6.walk = false; S6.t = -9; }

function slider2Enable(on) { if (S2.sl && S2.sl.input) S2.sl.input.disabled = !on; L.controlsEl.querySelectorAll('.lp-btn').forEach((b) => { if (b.dataset.grp === 'g2') b.disabled = !on; }); }
P2.on = () => { S2.auto = true; if (S2.sl) S2.sl.set(NOPS()); slider2Enable(true); setOn('g2', 'gomb szalag'); };
const stepDefs = [

      S2.sl = L2.slider({ label: lab('csúszka állomás'), k: 'csúszka állomás', min: 1, max: NOPS(), step: 1, value: 1, format: (v) => String(Math.round(v)), onInput: (v) => { setN2(+v); setOn('g2', +v === 1 ? 'gomb álló' : +v === NOPS() ? 'gomb szalag' : ''); } });

    } },

  {},
  { enter() { CARDS5.reset(); S5.okT = null; }, leave(L2) { L2.stage.style.cursor = ''; },
    controls(L2) { L2.button(lab('gomb megoldás'), () => CARDS5.solve(), 'gomb megoldás'); L2.button(lab('gomb újra'), () => CARDS5.reset(), 'gomb újra'); } },
  { enter() { reset6(); }, controls(L2) { L2.button(lab('gomb út'), () => { S6.walk = true; S6.t = L.st; }, 'gomb út'); } },
  { enter() { reset7(); }, controls() { btnRow([['gomb gyerek be', false], ['gomb gyerek ki', true]], false, (v) => { if (S7.noKids !== v) { S7.noKids = v; S7.t = L.st; } }, 'g7'); } },
  { enter() { CARDS8.reset(); S8.okT = null; }, leave(L2) { L2.stage.style.cursor = ''; },
    controls(L2) { L2.button(lab('gomb megoldás'), () => CARDS8.solve(), 'gomb megoldás'); L2.button(lab('gomb újra'), () => CARDS8.reset(), 'gomb újra'); } },
  {},
];
const steps = stepDefs.map((d, i) => Object.assign({ settle: SETTLE[i] }, d));

L = Lesson.create({
  content: window.LESSON_CONTENT, home: false, resetCtx: true, steps,
  init(Lx) {
    L = Lx; c = L.ctx;
    T = { bc: K('Kr. e.'), ad: K('Kr. u.'), cent: K('század'), years: K('év sablon') };
    SRC = TortSource.create(L, { 'forrás': K('forrás jel'), 'rekonstrukció': K('rekonstrukció jel'), 'monda': K('monda jel'), 'becslés': K('becslés'), 'vázlatos': K('vázlatos'), 'illusztráció': K('illusztráció') });
    C1 = FoldChart.create(L, { x: 120, y: 236, w: 620, h: 450, xs: { min: 1783, max: 1835, ticks: [1790, 1800, 1810, 1820, 1830], fmt: String }, ys: { min: 0, max: 40, step: 10 } });
    C3 = FoldChart.create(L, { x: 130, y: 180, w: 650, h: 500, xs: { min: 1908.2, max: 1925.8, ticks: [1909, 1913, 1917, 1921, 1925], fmt: String }, ys: { min: 0, max: 1000, step: 200 }, y2: { min: 0, max: 2.5, step: .5, d: 1 } });
    C4 = FoldChart.create(L, { x: 130, y: 180, w: 680, h: 500, xs: { min: 1826, max: 1917, ticks: [1830, 1850, 1870, 1890, 1910], fmt: String }, ys: { min: 0, max: 350, step: 50 }, y2: { min: 0, max: 50, step: 10 } });
    C6 = FoldChart.create(L, { x: 120, y: 150, w: 520, h: 330, xs: { min: 1765, max: 1858, ticks: [1773, 1801, 1821, 1841, 1851], fmt: String }, ys: { min: 0, max: 350, step: 50 } });
    CH7 = MatChart.create(L, { x: 120, y: 212, w: 600, h: 310, n: 6, min: 0, max: 60, step: 10, gap: .22 });
    TL9 = TortTimeline.create(L, { x0: 70, x1: 1300, y: 880, h: 50, T, src: SRC, bounds: [1690, 1930] });
    CARDS5 = TortCards.create(L, {
      zones: [{ id: 'h1', x: 40, y: 160, w: 640, h: 500, title: K('zóna 1'), sub: K('zóna 1 sub'), head: 120 },
        { id: 'h2', x: 700, y: 160, w: 640, h: 500, title: K('zóna 2'), sub: K('zóna 2 sub'), head: 120 }],
      cards: CD5.map(([k, z]) => ({ id: k, label: K(k), zone: z })), tray: { x: 40, y: 680, w: 1300, h: 300, top: 40 }, font: { s: 24, w: 600 },
      decor: (z) => decor5(z) });
    CARDS8 = TortCards.create(L, {
      zones: Z8.map(([id, , yk], i) => ({ id, x: 40 + (i % 2) * 660, y: 104 + Math.floor(i / 2) * 340, w: 640, h: 326, head: 236,
        title: KT('z ' + id, [yk], yr(yk)), sub: K('z ' + id + ' sub') })),
      cards: Z8.map(([id, k]) => ({ id: k, label: K(k), zone: id })), tray: { x: 40, y: 790, w: 1300, h: 150, top: 26 }, font: { s: 26, w: 700 },
      decor: (z) => decor8(z) });
    reset2(); reset3(); reset6(); reset7();

    L.checks = () => {
      const outA = [], near = (a, b, e) => Math.abs(a - b) <= e;
      const Y = yarnSh(), n = Y.x.length - 1;
      outA.push({ name: 'fonal: 1786 → 1832 kb. tizenharmadára (456 : 35)', ok: near(Y.pd[0] / Y.pd[n], 13, .5), got: (Y.pd[0] / Y.pd[n]).toFixed(2), want: 13 });
      outA.push({ name: 'fonal: 46 év', ok: Y.x[n] - Y.x[0] === 46, got: Y.x[n] - Y.x[0], want: 46 });
      outA.push({ name: 'futószalag-modell: 1 állomás = álló (748 perc)', ok: near(workTime(1), num('álló szerelés'), 1e-9), got: workTime(1), want: num('álló szerelés') });
      outA.push({ name: 'futószalag-modell: 45 állomás = szalag (93 perc)', ok: near(workTime(NOPS()), num('futószalag 1914'), 1e-9), got: workTime(NOPS()), want: num('futószalag 1914') });
      outA.push({ name: 'futószalag-modell: monoton csökken', ok: [...Array(44)].every((_, i) => workTime(i + 2) < workTime(i + 1)), got: '', want: 'csökkenő' });
      outA.push({ name: 'Tippelj!: a helyes válasz (kb. 1,5 óra) ≈ 93 perc', ok: near(num('futószalag 1914') / 60, 1.5, .1), got: num('futószalag 1914') / 60, want: 1.5 });
      const H = hoursOf();
      outA.push({ name: 'T-modell: munkaórában kb. 9× (4342 → 481 óra)', ok: near(H.a / H.b, 9, .3), got: [H.a.toFixed(0), H.b.toFixed(0), (H.a / H.b).toFixed(2)], want: 9 });
      outA.push({ name: 'T-modell: dollárban kb. harmadára', ok: near(num('ár eleje') / num('ár vége'), 3.2, .2), got: (num('ár eleje') / num('ár vége')).toFixed(2), want: '3,2' });
      const P = ser('T-modell ára');
      outA.push({ name: 'T-modell: a sor eleje és vége = az Adatok ára', ok: P.y[0] === num('ár eleje') && P.y[P.y.length - 1] === num('ár vége') && P.x[0] === yr('év eleje') && P.x[P.x.length - 1] === yr('év vége'), got: [P.x[0], P.y[0], P.x.slice(-1)[0], P.y.slice(-1)[0]], want: 'egyezik' });
      const S = ser('szénkitermelés');
      outA.push({ name: 'szén: 1854 → 1913 több mint négyszeres', ok: S.y.slice(-1)[0] / S.y[0] > 4 && S.y.slice(-1)[0] / S.y[0] < 5, got: (S.y.slice(-1)[0] / S.y[0]).toFixed(2), want: '4–5' });
      outA.push({ name: 'szén: a sor = szén eleje/vége', ok: S.x[0] === yr('szén eleje') && S.x.slice(-1)[0] === yr('szén vége'), got: [S.x[0], S.x.slice(-1)[0]], want: 'egyezik' });
      const D = ser('Manchester népessége');
      outA.push({ name: 'Manchester: 1773 → 1851 kb. tizenháromszoros, kb. 80 év', ok: near(D.y.slice(-1)[0] / D.y[0], 13.5, .6) && near(D.x.slice(-1)[0] - D.x[0], 80, 3), got: [(D.y.slice(-1)[0] / D.y[0]).toFixed(2), D.x.slice(-1)[0] - D.x[0]], want: '13,5; 78' });
      outA.push({ name: 'Chadwick: 5 év alatti halottak több mint fele (57 %)', ok: kidShare() > .5 && Math.round(kidShare() * 100) === 57, got: (kidShare() * 100).toFixed(1), want: '57' });
      const ks = Math.round(kidShare() * 100), pm = (ks * num('gyerekhalottak átlagkora') + (100 - ks) * adultMean()) / 100;
      outA.push({ name: 'pötty-modell: a pöttyök átlaga ≈ Chadwick 17 éve', ok: near(pm, num('M munkás'), .5), got: pm.toFixed(2), want: num('M munkás') });
      outA.push({ name: 'pötty-modell: az 5 év fölöttiek átlaga 30–45 év', ok: adultMean() > 30 && adultMean() < 45, got: adultMean().toFixed(2), want: '30–45' });
      const sc5 = CD5.filter((q) => q[1] === 'h1').length;
      outA.push({ name: '5. lépés: 12 kártya, 6–6', ok: CD5.length === 12 && sc5 === 6, got: [CD5.length, sc5], want: '12, 6' });
      const t9 = ['Newcomen gépe', 'Watt kondenzátor', 'Liverpool–Manchester vasút', 'Edison izzó', 'Pearl Street', 'mozgó szerelősor', 'ötdolláros nap'].map((k) => dat(k).a);
      outA.push({ name: 'időrend: Newcomen < Watt < vasút < Edison < Pearl Street < futószalag < 5 dollár', ok: t9.every((v, i) => !i || v > t9[i - 1]), got: t9.map((v) => v.toFixed(2)).join(), want: 'növekvő' });
      const eras = ['első hullám kezdete', 'első hullám vége', 'második hullám kezdete', 'második hullám vége'].map(yr);
      outA.push({ name: 'a két hullám időhatárai sorban', ok: eras.every((v, i) => !i || v > eras[i - 1]), got: eras.join(), want: 'növekvő' });
      return outA;
    };
    const guessQA = (k, back) => (L2) => { if (L2.sliders && L2.sliders['csúszka állomás']) L2.sliders['csúszka állomás'].input.disabled = false; tipGuess(P2, k, L2.st - (back == null ? 30 : back)); };
    const nQA = (n) => (L2) => { guessQA('tipp2 1,5')(L2); setN2(n); setOn('g2', n === 1 ? 'gomb álló' : n === NOPS() ? 'gomb szalag' : ''); S2.t0 = L2.st - 40; if (L2.sliders['csúszka állomás']) L2.sliders['csúszka állomás'].set(n); };
    window.__qaStates = {
      2: [{ name: 'tipp-jo', set: guessQA('tipp2 1,5') }, { name: 'tipp-rossz', set: guessQA('tipp2 10') }, { name: 'anim-kozben', set: guessQA('tipp2 6', 1.2) },
        { name: 'n2', set: nQA(2) }, { name: 'n5', set: nQA(5) }, { name: 'n15', set: nQA(15) }, { name: 'n45', set: nQA(45) }, { name: 'n1', set: nQA(1) }],
      3: [{ name: 'munkaora', set(L2) { S3.mode = 'óra'; S3.t = -9; setOn('g3', 'gomb óra'); } }, { name: 'munkaora-kozben', set(L2) { S3.mode = 'óra'; S3.t = L2.st - .5; setOn('g3', 'gomb óra'); } }],
      5: [{ name: 'megoldva', set(L2) { CARDS5.solve(L2.st - 3); } }, { name: 'reszben', set(L2) { CARDS5.place('k fonógép', 'h1', L2.st - 3); CARDS5.place('k izzó', 'h1', L2.st - 3); CARDS5.place('k autó', 'h2', L2.st - 3); } }],
      6: [{ name: 'ut-kozben', set(L2) { S6.walk = true; S6.t = L2.st - 1.4; } }, { name: 'ut-vege', set(L2) { S6.walk = true; S6.t = L2.st - 6; } }],
      7: [{ name: 'gyerekek-nelkul', set(L2) { S7.noKids = true; S7.t = -9; setOn('g7', 'gomb gyerek ki'); } }],
      8: [{ name: 'megoldva', set(L2) { CARDS8.solve(L2.st - 3); } }, { name: 'rossz', set(L2) { CARDS8.place('e lib', 'Burke', L2.st - 3); CARDS8.place('e nac', 'Mazzini', L2.st - 3); } }],
    };
  },
  draw(Lx) {
    L = Lx; c = L.ctx; GA = 1; paper();
    if (L.step >= 0) sT[L.step] = L.st;
    for (let i = 0; i < SCENES.length; i++) {
      const w = clamp(1 - Math.abs(L.sp - i) * 2); if (w <= .005) continue;
      GA = w; c.save(); c.globalAlpha = w; SCENES[i](sT[i], L.step === i); c.restore();
    }
    c.globalAlpha = 1;
  },
});
})();
