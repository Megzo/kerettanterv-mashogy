<script>
/* ── MODUL: „Tippelj!” és bélyegek (TtTipp) · forrás: termeszettudomany-5-6/01-tocsa + 03-meres, egységesítve 2026-11-24 ── */
/* A természettudomány 5–6. sorozat közös mintái (szerződés 17.): kísérlet-/modellbélyeg és a „Tippelj! → kísérlet →
   magyarázat” jóslat. Csak a Lesson motorra épül (L.ctx, L.tx, L.pill, L.lab, L.button, L.controlsEl, L.panel, L.st,
   Lesson.U, Lesson.FONTS); a lecke kódjára nem hivatkozik. A panel elmosásához szükséges CSS-t (.tt-rejtett) és a
   letiltott csúszka halványítását a modul maga teszi a <head>-be – a leckében nem kell <style>-sor.

   BEKÖTÉS (a lecke kódjában, egyszer, legfelső szinten – a getterek miatt a sorrend mindegy):
     TtTipp.bind({ L: () => L, ga: () => GA });    // ga: a lecke alap-alfája (jelenet-áttűnés); alap: () => 1
     const { stamp, Tip, tipReset, panelVeil, veilIf, tipGuess, tipHide, tipControls, tipU, rhythm, tipHead, tipRow,
       tipFeedback } = TtTipp;
   ALFA: minden rajzoló a globalAlpha-t ga() · a (· belső áttűnés) értékre ÁLLÍTJA (nem szoroz a pillanatnyival, így
   egy korábbi halvány felirat nem tünteti el), a vonalstílust (lineCap/lineJoin/setLineDash) visszaállítja.

   stamp(kind, x, y, a, o) → doboz | null       kísérlet-/modellbélyeg a KemGHS.stamp stílusával (Bricolage 22 px,
        600, betűköz 0,08 em, −3°, papír alap, 2 px keret; 'tilos': 700, 3 px). (x, y): a bal szél közepe.
        Szöveg: az o.k || '<kind> bélyeg' .md-kulcs. Szín (STAMP): otthon kékeszöld, felnőtt okker, tilos #b3261e;
        tanári, modell, kitalált, nem méretarányos, sematikus, vázlatos, képzeletbeli (és minden más) halvány tinta.
        o = {k, col (szín felülírása), rot: −3 (fok), al: 'left' (igazítás)}. a ≤ 0,005 → nem rajzol.
   Tip(keys, ok) → P      jóslat-állapot. keys: a válaszok .md-kulcsai (egyben gombfeliratok), ok: a helyes kulcs (az
        init-ben is beállítható: P.ok = …). P = {keys, ok, guess: null | kulcs, gt: a választás L.st-je, btns, on}.
        P.on(k): választáskor hívódik (a lecke állítja, pl. a kísérlet vezérlőinek feloldására).
   tipReset(P)            alaphelyzet (az enter()-ben; utána veilIf(P)).
   panelVeil(on)          a panelszöveg 2. bekezdésétől (.lp-text > *, i > 0) elmos (on) / felold.
   veilIf(P)              panelVeil(!P.guess) – az enter()-ben a tipReset után.
   tipControls(P)         a tippgombok (L.button, P.keys sorrendben). A választás után csak ezek tűnnek el: a
        sorukba utána tett más gombok maradnak (ha a sorban nem marad látható gomb, a sor is eltűnik).
   tipGuess(P, k, gt)     választás (csak az első számít): P.guess = k, P.gt = gt ?? L.st, tipHide, panelVeil(false),
        P.on(k). A QA-állapotok is ezt hívhatják (pl. gt = L.st − 30: a kísérlet már lefutott).
   tipHide(P)             a tippgombok elrejtése (a tipGuess hívja; QA-állapotban kézzel is).
   tipU(P, st) → mp       a választás óta eltelt idő (st − P.gt), −1, ha még nincs tipp.
   rhythm(ph, a)          a „Tippelj! → kísérlet → magyarázat” sáv a vászon bal felső sarkában (x 40, y 46);
        ph: 0 / 1 / 2 az aktív szakasz.
   tipHead(P, st, a, qk, o) → y     fejléc: sáv + kérdés (qk, (40, 116), Fraunces 38, max 1280) + válaszsor (40, y).
        o = {tExp: 4,5 (a kísérlet hossza mp-ben: ennyi után vált a sáv „magyarázat”-ra, és mutatja a helyes
        választ), q2 (2. kérdéssor kulcsa, (40, 162); a válaszsor 46 px-szel lejjebb kerül), qv (a kérdés #-jeleinek
        értékei, sorban), y: 178 (a válaszsor közepe), noRhythm (a sáv nélkül – pl. olvasási kérdésnél)}.
        Visszaad: a válaszsor y-ja.
   tipRow(P, st, a, x, y, o) → [dobozok]    csak a válaszsor (a tipHead is ezt rajzolja), bárhová: a választásig
        semleges; a választott cinóber keretet és alatta „a te tipped” feliratot kap; o.tExp (0) mp múlva a helyes
        zöld keretet + pipát kap, a többi elhalványul. Dobozköz 54 px (a pipának).
   tipFeedback(P, st, a, x, y, o) → doboz | null    „Jó tipp!” (zöld) / „Sokan gondolják így – nézzük meg!”
        (kékeszöld) pill (x: bal szél, y: közép), a választás után 0,15 mp-cel beúszva. o = {s: 24, al: 'left', max}.
   .md-kulcsok (### Feliratok): tippelj felirat, kísérlet felirat, magyarázat felirat, a te tipped felirat, jó tipp
        felirat, rossz tipp felirat; a bélyegeké '<kind> bélyeg'.
   ──────────────────────────────────────────────────────────────────────────────────────────────────────── */
const TtTipp = (() => {
  'use strict';
  const U = Lesson.U, F = Lesson.FONTS, { clamp, lerp, smooth } = U;
  const INK = '#1c2440', MUT = '#565d72', RED = '#c8401c', TEAL = '#0a6f86', GOOD = '#1d7a45', BAD = '#b3261e', OKR = '#8f5a0c', CARD = '#fffaf1';
  const STAMP = { otthon: TEAL, felnőtt: OKR, tilos: BAD, tanári: MUT, modell: MUT, kitalált: MUT, 'nem méretarányos': MUT, sematikus: MUT, vázlatos: MUT, képzeletbeli: MUT };
  const KEYS = { ph: ['tippelj felirat', 'kísérlet felirat', 'magyarázat felirat'], mine: 'a te tipped felirat', ok: 'jó tipp felirat', bad: 'rossz tipp felirat' };
  let getL = () => null, ga = () => 1;
  if (typeof document !== 'undefined' && !document.getElementById('tt-tipp-css')) {
    const st = document.createElement('style'); st.id = 'tt-tipp-css';
    st.textContent = '.lp-text > .tt-rejtett { filter: blur(7px); opacity: .5; user-select: none; transition: filter .6s, opacity .6s; }\n'
      + '.lp-slider:has(input:disabled) { opacity: .45; }\n.lp-slider input:disabled { cursor: not-allowed; }';
    document.head.appendChild(st);
  }
  const Lx = () => getL(), cx = () => getL().ctx, lab = (k) => getL().lab(k);
  const al = (a) => { cx().globalAlpha = ga() * clamp(a); };
  const fillIn = (s, v) => { let i = 0; return s.replace(/#/g, () => (i < v.length ? v[i++] : '#')); };
  const rr = (c, x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, w, h, r); };
  function check(x, y, a) {                 // pipa (rajz, nem betűjel)
    const c = cx(); al(a); c.lineWidth = 4.5; c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = GOOD; c.beginPath();
    c.moveTo(x - 10, y); c.lineTo(x - 3, y + 8); c.lineTo(x + 11, y - 9); c.stroke(); c.lineCap = 'butt'; c.lineJoin = 'miter';
  }
  function arrow(x1, y1, x2, y2, col, w, hs) {
    const c = cx(), an = Math.atan2(y2 - y1, x2 - x1), bx = x2 - Math.cos(an) * hs * .8, by = y2 - Math.sin(an) * hs * .8;
    c.setLineDash([]); c.lineCap = 'round'; c.beginPath(); c.moveTo(x1, y1); c.lineTo(bx, by); c.strokeStyle = col; c.lineWidth = w; c.stroke(); c.lineCap = 'butt';
    c.beginPath(); c.moveTo(x2, y2); c.lineTo(x2 - hs * Math.cos(an - .45), y2 - hs * Math.sin(an - .45)); c.lineTo(x2 - hs * Math.cos(an + .45), y2 - hs * Math.sin(an + .45)); c.closePath();
    c.fillStyle = col; c.fill();
  }

  function bind(o = {}) { if (o.L) getL = o.L; if (o.ga) ga = o.ga; }
  function stamp(kind, x, y, a, o = {}) {
    if (a <= .005) return null;
    const L = Lx(), c = L.ctx, k = o.k || (kind + ' bélyeg'), col = o.col || STAMP[kind] || MUT, tilos = kind === 'tilos';
    c.save(); al(a); c.translate(x, y); c.rotate((o.rot == null ? -3 : o.rot) * Math.PI / 180);
    const b = L.pill(lab(k), 0, 0, { s: 22, w: tilos ? 700 : 600, ls: '0.08em', f: F.B, bg: CARD, bd: col, bw: tilos ? 3 : 2, c: col, r: 6, pad: 10, k, qa: false, a: o.al || 'left' });
    c.restore(); return b;
  }
  const Tip = (keys, ok) => ({ keys, ok, guess: null, gt: -99, btns: [], on: null });
  function tipReset(P) { P.guess = null; P.gt = -99; }
  function panelVeil(on) {
    const L = Lx(); if (!L || !L.panel) return;
    L.panel.querySelectorAll('.lp-text > *').forEach((p, i) => { if (i > 0) p.classList.toggle('tt-rejtett', !!on); });
  }
  const veilIf = (P) => panelVeil(!P.guess);
  function tipHide(P) {
    const rows = new Set();
    (P.btns || []).forEach((b) => { b.style.display = 'none'; if (b.parentNode) rows.add(b.parentNode); });
    rows.forEach((r) => { if (![...r.children].some((e) => e.style.display !== 'none')) r.style.display = 'none'; });
  }
  function tipGuess(P, k, gt) {
    if (P.guess) return;
    P.guess = k; P.gt = gt == null ? Lx().st : gt;
    tipHide(P); panelVeil(false);
    if (P.on) P.on(k);
  }
  function tipControls(P) { const L = Lx(); P.btns = P.keys.map((k) => L.button(lab(k), () => tipGuess(P, k), k)); }
  const tipU = (P, st) => (P.guess ? st - P.gt : -1);
  function rhythm(ph, a) {
    const L = Lx(), cols = [RED, TEAL, OKR];
    let x = 40;
    KEYS.ph.forEach((k, j) => {
      const on = ph === j, done = ph > j;
      al(a * (on ? 1 : done ? .7 : .4));
      const b = L.pill(lab(k), x, 46, { k, s: 22, w: 700, f: F.B, c: on ? '#ffffff' : cols[j], bg: on ? cols[j] : CARD, bd: cols[j], bw: 2, pad: 10 });
      x = b.x + b.w;
      if (j < 2) { al(a * .55); arrow(x + 8, 46, x + 34, 46, MUT, 3, 11); x += 44; }
    });
  }
  function tipRow(P, st, a, x, y, o = {}) {
    const L = Lx(), c = L.ctx, u = tipU(P, st), tx = o.tExp || 0, out = [];
    const rev = P.guess ? smooth((u - tx) / .5) : 0;
    P.keys.forEach((k) => {
      const mine = P.guess === k, ok = k === P.ok, g = rev * (ok ? 1 : 0);
      al(a * (P.guess && !mine && !ok ? lerp(1, .55, rev) : 1));
      const b = L.pill(lab(k), x, y, { k, s: 26, w: 600, f: F.B, c: INK, bg: g > .5 ? '#eef6ee' : CARD, bd: g > .5 ? GOOD : 'rgba(28,36,64,.35)', bw: g > .5 ? 3 : 2, pad: 14 });
      if (mine) {
        al(a * smooth(u / .3)); rr(c, b.x - 6, b.y - 6, b.w + 12, b.h + 12, (b.h + 12) / 2); c.strokeStyle = RED; c.lineWidth = 3.5; c.stroke();
        L.tx(lab(KEYS.mine), b.x + b.w / 2, b.y + b.h + 30, { k: KEYS.mine, s: 22, w: 700, f: F.B, c: RED, a: 'center' });
      }
      if (g > 0) check(b.x + b.w + 24, y, a * g);
      out.push(b); x = b.x + b.w + 54;
    });
    return out;
  }
  function tipHead(P, st, a, qk, o = {}) {
    const L = Lx(), u = tipU(P, st), tx = o.tExp || 4.5;
    if (!o.noRhythm) rhythm(!P.guess ? 0 : u < tx ? 1 : 2, a);
    const q = { f: F.D, s: 38, w: 600, c: INK, max: 1280 };
    al(a); L.tx(o.qv ? fillIn(lab(qk), o.qv) : lab(qk), 40, 116, Object.assign({ k: qk }, q));
    let y = o.y || 178;
    if (o.q2) { al(a); L.tx(lab(o.q2), 40, 162, Object.assign({ k: o.q2 }, q)); y += 46; }
    tipRow(P, st, a, 40, y, { tExp: tx });
    return y;
  }
  function tipFeedback(P, st, a, x, y, o = {}) {
    if (!P.guess) return null;
    const u = tipU(P, st), ok = P.guess === P.ok, k = ok ? KEYS.ok : KEYS.bad;
    al(a * smooth((u - .15) / .4));
    return Lx().pill(lab(k), x, y, { k, s: o.s || 24, w: 700, f: F.B, c: ok ? GOOD : TEAL, bg: CARD, bd: ok ? GOOD : TEAL, bw: 2.5, pad: 12, a: o.al || 'left', max: o.max });
  }
  return { bind, STAMP, stamp, Tip, tipReset, panelVeil, veilIf, tipGuess, tipHide, tipControls, tipU, rhythm, tipHead, tipRow, tipFeedback };
})();
/* ── MODUL VÉGE: TtTipp ── */

/* ── MODUL: Időszalag (TortTimeline) ──────────────────────────────────────────────
   B modul (pilot/tortenelem-5-6/terv.md, 5. fejezet). Referencia: 01-idoszamitas.
   Később változtatás nélkül átemelhető: shared/tort/timeline.js. Csak a Lesson motorra épül
   (L.ctx, L.tx, L.pill, L.measure, L.pointer, L.stage, L.toStage, L.t, L.VW).

   IDŐ-KOORDINÁTA (u): folytonos, csillagászati években. Az „a” csillagászati év
   (Kr. e. 1 = 0, Kr. e. 753 = −752, Kr. u. 476 = 476 – ez a build `L.dat(k).a` mezője) az
   [a, a + 1) szakasz a szalagon; egy évszám-esemény a közepén áll: u = a + 0,5. Dátum: u = d.a.
   Eltelt évek: a2 − a1 (0. év nincs: Kr. e. 1 → Kr. u. 1 = 1 év). A kezdőpont (Kr. u. 1 eleje): u = 1.

   TortTimeline.Y – évszám-aritmetika (tiszta függvények; T = szövegek, lent):
     Y.u(d)               build-adat ({t:'year'|'date', a}) → u; szám esetén csillagászati év → a + 0,5
     Y.year(u)            u → csillagászati év (egész)        Y.num(a) → a kiírt szám (Kr. e. 753 → 753)
     Y.astro(v), Y.hist(a)  történeti év (−753) ↔ csillagászati (−752)
     Y.label(a, T, ad)    'Kr. e. 753' · '476' · 'Kr. u. 476' (ad = true)   Y.key(a, T, ad) → md-kulcs
     Y.range(a0, a1, T)   'Kr. e. 7–4' · '1914–1918' · 'Kr. e. 4 – Kr. u. 30'
     Y.elapsed(a1, a2)    a2 − a1
     Y.formula(a1, a2)    '776 − 753 = 23' · '753 + 476 − 1 = 1228' · '2026 − 2015 = 11'
     Y.century(a)         {n, bc}: 1801…1900 → {n: 19}; Kr. e. 776 → {n: 8, bc: true}
     Y.centurySpan(n, bc) [a0, a1) csillagászati évek: 19 → [1801, 1901); Kr. e. 1. → [−99, 1)
     Y.centuryLabel(a, T, short)  '19. század' · 'Kr. e. 8. század' · (short) '19.'
     Y.centuryRule(a)     '18|48 → 18 + 1 = 19' · '19|00 → 19'
     Y.lerpView(v0, v1, t)  két nézet ([u0, u1]) között: logaritmikus lépték, a nagyítás közben a
                          középpont a léptékkel arányosan mozog (zoom-ki/zoom-be szép)
   T (a lecke .md-jéből, mind {s, k}; k = md-kulcs a review módhoz):
     {bc: 'Kr. e.', ad: 'Kr. u.', cent: 'század', years: '# év'}

   const tl = TortTimeline.create(L, {x0, x1, y, h: 64, T, src, bounds: [uMin, uMax], minSpan, maxSpan,
                                      epoch: aKezdő?, pinY?})
     src: TortSource-példány (C modul) a kártyakeretekhez és a „becslés” bélyeghez (opcionális).
     epoch: más kezdőpontú vonalzó (pl. Róma alapítása): a felirat n = a − epoch + 1, előtte üres.
     tl.view(u0, u1) · tl.x(u) · tl.u(x) · tl.ppy (px/év) · tl.span() · tl.top/bot · tl.R (sorok y-ja)
     tl.draw(d)   szalag + osztás + feliratok + sávok. d = {a, bands: [{u0, u1, col, a}], sides,
                  origin, caption: {s, k, a, right}, cent, centHi: év, eras: [...], eraA, eraOut, ad}
                  eras: [{u0, u1, name: {s, k}, col, fade0: [ua, ub], fade1: [ua, ub]}] (fade = elmosódó határ)
     tl.cards(items, {pitch})   eseménykártyák a szalag fölött, vezetővonallal. item = {u, title: {s, k},
                  date?: {s, k}, note?: {s, k, c}, layer: 'forrás' | 'rekonstrukció' | 'monda' | null,
                  est: bool (→ „becslés” bélyeg), row: 0..2, a, hi}
     tl.card(item, x, y) / tl.cardSize(item) / tl.cardPos(item)   egy kártya tetszőleges helyen (pl. tálcán)
     tl.pins = [{u, col, ad?}]  húzható tűk;  tl.drawPins({a, pinY, top, bracket, caption(e), sub(e, a1, a2),
                  label(pin, év) → [{s, k, c}, …], hint: {s, k}})
     tl.interact({pins, pan, zoom, snap: [u…], onView(v)}) → true, ha egy tű elmozdult. Minden képkockán
                  hívd (a nézet beállítása után); a görgő nagyít, a szalag húzása pásztáz.
     tl.user      a felhasználó által beállított nézet ([u0, u1]) vagy null · tl.setUser(u0, u1) · tl.zoomTo(span)
   TortTimeline.mini(L, {x, y, w, h, u0, u1, eras, win: [u0, u1], cap: {s, k}, ends: [{s, k}, {s, k}], a})
                  kis „hol tartunk?” sáv: a teljes időszak korszakszínekkel, rajta a látható ablak.
   ──────────────────────────────────────────────────────────────────────────────── */
const TortTimeline = (() => {
  const F = Lesson.FONTS, U = Lesson.U, NB = ' ', MINUS = '−', TAU = Math.PI * 2;
  const INK = '#1c2440', MUT = '#565d72', RED = '#c8401c', CARD = '#fffaf1', OCHRE = '#8f5a0c';
  const TF = { f: F.B, s: 22, w: 500 };
  const STEPS = [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000, 2000, 5000, 10000, 20000];

  const Y = {
    astro: (v) => (v < 0 ? v + 1 : v),
    hist: (a) => (a <= 0 ? a - 1 : a),
    u: (d) => (typeof d === 'number' ? d + .5 : d.t === 'date' ? d.a : d.a + .5),
    year: (u) => Math.floor(u),
    num: (a) => (a <= 0 ? 1 - a : a),
    label: (a, T, ad) => (a <= 0 ? T.bc.s + NB + (1 - a) : (ad ? T.ad.s + NB : '') + a),
    key: (a, T, ad) => (a <= 0 ? T.bc.k : ad ? T.ad.k : null),
    range: (a0, a1, T) => {
      if (a0 > a1) [a0, a1] = [a1, a0];
      if (a1 <= 0) return T.bc.s + NB + (1 - a0) + '–' + (1 - a1);
      if (a0 >= 1) return a0 + '–' + a1;
      return Y.label(a0, T) + ' – ' + Y.label(a1, T, true);
    },
    elapsed: (a1, a2) => a2 - a1,
    formula: (a1, a2) => {
      const lo = Math.min(a1, a2), hi = Math.max(a1, a2), e = hi - lo;
      if (hi <= 0) return `${1 - lo} ${MINUS} ${1 - hi} = ${e}`;
      if (lo >= 1) return `${hi} ${MINUS} ${lo} = ${e}`;
      return `${1 - lo} + ${hi} ${MINUS} 1 = ${e}`;
    },
    century: (a) => (a >= 1 ? { n: Math.ceil(a / 100), bc: false } : { n: Math.ceil((1 - a) / 100), bc: true }),
    centurySpan: (n, bc) => (bc ? [1 - 100 * n, 101 - 100 * n] : [100 * n - 99, 100 * n + 1]),
    centuryLabel: (a, T, short) => { const c = Y.century(a); return (c.bc ? T.bc.s + NB : '') + c.n + '.' + (short ? '' : NB + T.cent.s); },
    centuryKeys: (a, T) => (Y.century(a).bc ? [T.cent.k, T.bc.k] : [T.cent.k]),
    centuryRule: (a) => {
      const y = Y.num(a), n = Y.century(a).n, h = Math.floor(y / 100), t = y % 100;
      return t === 0 ? `${h}|00 → ${n}` : `${h}|${String(t).padStart(2, '0')} → ${h} + 1 = ${n}`;
    },
    lerpView: (v0, v1, t) => {
      const s0 = v0[1] - v0[0], s1 = v1[1] - v1[0], c0 = (v0[0] + v0[1]) / 2, c1 = (v1[0] + v1[1]) / 2;
      const s = Math.exp(U.lerp(Math.log(s0), Math.log(s1), t));
      const k = Math.abs(Math.log(s1 / s0)) > .25 ? (s - s0) / (s1 - s0) : t;
      const m = U.lerp(c0, c1, k);
      return [m - s / 2, m + s / 2];
    },
  };

  function create(L, o) {
    const T = o.T;
    const tl = { o, T, src: o.src || null, x0: o.x0, x1: o.x1, y: o.y, h: o.h || 64, pins: [], user: null, drag: null,

   töltve – a MatQ-ra (shared/matek/mtext.js: pontos átlag) épül; lecke-specifikus kódra nem hivatkozik.
   Minden felirat {s, k} pár (szöveg + .md-kulcs); kulcs nélkül csak a tengelyszám és a számolt érték megy ki.
   Az állapot zárt képletű: a mozgó elemek t (0..1) fázist kapnak. o.a: abszolút átlátszóság (a lecke a saját
   áttűnés-szorzóját adja bele). Minden függvény save/restore-ral visszaállítja a vászonállapotot.

   Színek: MatChart.COL {ink, mut, red, teal, ochre, plum, blue, green, card, grid, good, bad}; MatChart.PAL – a
   kategóriák színei sorban (cinóber, kékeszöld, okker, szilva, kék, zöld); MatChart.fill(col) világos kitöltés,
   MatChart.edge(col) sötét körvonal (szerződés 6.: a körvonal mindig a sötét változat).

   ── Oszlop- és vonaldiagram (kategória-tengely) ──
   const ch = MatChart.create(L, {x, y, w, h,     // a rajzterület; a tengelyek a bal és az alsó szélén
                                  n,              // kategóriák (oszlopok) száma
                                  min = 0, max,   // függőleges tartomány; min > 0: levágott tengely (cikcakk jel)
                                  step,           // rácsköz (alap: 1–2–5 lépcső, kb. 6 osztás)
                                  gap = .35})     // oszlopköz a sávszélesség arányában (0: hisztogram)

   ch.set({…}) – ugyanazok a mezők (pl. animált max) · ch.ticks() → [v…] · ch.hit(px, py) → sáv indexe | −1
   ch.axes({a, t (kirajzolás 0..1), cats: [{s, k}], cs = 24 (kategóriafelirat px), cc (szín), yName: {s, k},
            xName: {s, k}, grid = true, every = 1 (minden hányadik osztás kap számot), fmt (v → szöveg), ys = 22,
            cut (alap: min > 0 → cikcakk), arrow = true (y), xArrow = false})
   ch.bars(vals, {a, t (0..1 vagy [t_i]: felnövés), cols: [..] | col, values: true | fmt(v, i) | [{s, k}], vs = 26,
                  hi: i | [i], dim = .25, ghost: [v…] (szaggatott körvonal, pl. elméleti érték), units: 0..1 (az
                  egységek választóvonala: „egy kocka = egy adat”), bw (px)}) → [{i, x, y, w, h}]
          Az értékfeliratok dobozát (ch.labs: [[x, y, w, h]…], az utolsó bars-hívásé) a ghost szaggatott kerete és a
          ch.hline vonala kikerüli (rés a vonalban) – a felirat akkor is olvasható, ha az oszlop teteje a vonal közelében van.
   ch.cell(i, k) → {x, y, w, h} – az i. oszlop k. egységkockája (alulról, 0-tól): ide repülhet egy adat
   ch.line(vals, {a, c, w = 4, t (kirajzolás 0..1), dots = 8 (sugár; 0: nincs), dotCols: [..], values, vs})
          → [[px, py]…]
   ch.hline(v, {c, w = 3, dash, a, label: {s, k}, side: 'right' | 'left', avoid = true (rés a ch.labs feliratoknál;
            false: a vonal megszakítás nélkül fut)})   – vízszintes szint (pl. átlag)

   ── Kördiagram ──
   MatChart.pie(L, {cx, cy, r, vals, cols, a, t (körbefutás 0..1), start = −π/2 (fölül, óramutató szerint),
                    names: [{s, k}] (kívül, vezetővonallal), sub: (i, fr, deg, v) → szöveg | null (a név alatti
                    sor), ns = 24, hi, dim = .25, lr = 1.16 (feliratsugár / r), na (a feliratok átlátszósága)})
          → [{a0, a1, mid, fr, deg}]
   MatChart.arcs(vals, start) → ugyanez rajzolás nélkül

   ── Oszlop → kör morf ── a lefekvő oszlopok szalaggá (szalagdiagram) állnak össze, a szalag körré görbül, majd
   körcikkekké telik, és a kezdete felülre fordul. A szalag hossza 2πr, ezért a görbülés pontosan zár.
   MatChart.morph(L, ch, vals, {cx, cy, r}, t, {a, cols, h0 = 56 (a szalag vastagsága), hi, dim})
          t: 0 oszlopdiagram … 1 kördiagram; fázisok [0; .35] lefekszik, [.35; .72] görbül, [.72; 1] telik.
          A két végállapot alakra azonos a ch.bars és a MatChart.pie (start = −π/2) rajzával.
   MatChart.morphPt(ch, vals, P, t, i, u, v, h0) → [x, y] – az i. darab pontja (u: hossz 0..1, v: 0 kívül … 1 belül)

   ── Strigula ── ötösével: négy álló vonás + egy áthúzó
   MatChart.tally(L, n, x, y, {h = 46, dx = 14, g = 26, c, w = 3.5, t (kirajzolt vonások, tört is; alap n), a})
          → {w} · MatChart.tallyAt(j, x, y, o) → [x, y] a j. vonás közepe · MatChart.tallyW(n, o)

   ── Kockatornyok (átlag = kiegyenlítés) ──
   MatChart.towers(L, {vals (egészek), x (az első torony közepe), dx (toronyköz), base (alap y), cell (kockaméret),
          t (0 eredeti … 1 kiegyenlített), cols, a, level = true (szaggatott szintvonal a végén), lw (szintvonal
          túlnyúlása)}) → {n, sum, q, r, mean (szám), meanQ (MatQ | null), levelY, top: [y…] (a tornyok teteje)}
          A szint fölötti kockák (felülről) a hiányzó helyekre repülnek; ha az összeg nem osztható, a maradék r
          kockát n egyenlő szeletre vágja, minden toronyra r szelet jut → magasság q + r/n.
          Fázisok: r = 0: [0; 1] repülés; r > 0: [0; .55] repülés, [.55; .7] vágás, [.7; 1] szeletek.

   ── Pontdiagram (húzható) ──
   const D = MatChart.dotplot(L, {x0, x1, y (tengely), min, max, step = 1, r = 17, dy = 2r + 4, hitR = 30})
          D.X(v) · D.inv(px) · D.axis({a, name: {s, k}, every = 1, fmt, s = 24})
          D.draw(vals, {a, col | cols(i), hi: [i], move: {i, from, t} (az i. pötty ívben repül from-ból vals[i]-be)})

                 D.sel – kijelölt pötty (szaggatott gyűrű) · D.reset()
          D.key(e, vals, onChange) → true, ha kezelte: Tab / Shift+Tab kijelöl, A/D (Shift: 3×) mozgat
   Jelzővonalak: MatChart.marks(L, {X (v → px), y0 (alul), y1 (a vonal teteje), items: [{v, c, label: {s, k}, dash,
          w}], a, s = 24, rowH = 48, xmin, xmax}) → [{x, row, box}] – függőleges vonalak; ütköző feliratok egymás fölé
   Kártyasor (medián): MatChart.cards(L, {vals, x (a sor közepe), y (teteje), w = 88, h = 104, gap = 16,
          from: [hely…], to: [hely…] (az i. kártya helye; alap: from = index, to = rendezett hely), t, hi: {i: szín},
          a, s = 44}) → [{i, x, y, w, h}] – a kártyák felváltva fölfelé/lefelé ívben cserélnek helyet
   Statisztika: MatChart.stats(vals) → {n, sum, mean, meanQ (MatQ | null), median, modes: [v…] (minden érték, ha
          mind egyszer fordul elő: maxf = 1), maxf, sorted, rank: [i → rendezett hely] (stabil)}
          MatChart.rank(vals) · MatChart.nice(span, n) → lépésköz
   Bélyeg: MatChart.stamp(L, {s, k}, x, y, {a, c}) – „kitalált adat” (Bricolage 22, 600, −3°, keret 2 px; (x, y) bal közép)
   Jelmagyarázat: MatChart.legend(L, [{s, k, c}], x, y, {dir: 'right' | 'down', s = 24, gap = 26, a}) → {w, h}
   v1.1 (2026-11-24): a ghost és a hline nem húzza át az oszlopok értékfeliratát (ch.labs, avoid).
   ──────────────────────────────────────────────────────────────────────────────────────────────────────────── */
const MatChart = (() => {
  'use strict';
  const U = Lesson.U, F = Lesson.FONTS, clamp = U.clamp, lerp = U.lerp, sm = U.smooth, TAU = Math.PI * 2;
  const COL = { ink: '#1c2440', mut: '#565d72', red: '#c8401c', teal: '#0a6f86', ochre: '#8f5a0c', plum: '#7b3f8c',
    blue: '#1b5a94', green: '#3d6b1f', card: '#fffaf1', grid: 'rgba(28,36,64,.08)', good: '#1d7a45', bad: '#b3261e' };
  const PAL = [COL.red, COL.teal, COL.ochre, COL.plum, COL.blue, COL.green];
  const fill = (col) => U.mix(col, '#fffaf1', .34);
  const edge = (col) => U.mix(col, '#1c2440', .28);
  const colOf = (o, i) => (Array.isArray(o.cols) ? o.cols[i % o.cols.length] : typeof o.cols === 'function' ? o.cols(i) : o.col || PAL[i % PAL.length]);
  const A = (o) => (o && o.a != null ? clamp(o.a) : 1);

  const nice = (span, n = 6) => { const raw = span / Math.max(1, n), p = Math.pow(10, Math.floor(Math.log10(raw))), m = raw / p; return (m < 1.5 ? 1 : m < 3 ? 2 : m < 7 ? 5 : 10) * p; };
  const arrowHead = (c, x, y, ang, s = 14) => {
    c.beginPath(); c.moveTo(x + Math.cos(ang) * s * .2, y + Math.sin(ang) * s * .2);
    c.lineTo(x - Math.cos(ang - .42) * s, y - Math.sin(ang - .42) * s); c.lineTo(x - Math.cos(ang + .42) * s, y - Math.sin(ang + .42) * s);
    c.closePath(); c.fill();
  };

  /* ── oszlop- és vonaldiagram ── */
  function create(L, o0) {
    const o = Object.assign({ min: 0, gap: .35 }, o0), ch = { L };
    ch.set = (q) => {
      Object.assign(o, q || {});
      ch.n = Math.max(1, o.n || 1); ch.min = o.min || 0; ch.max = o.max; ch.step = o.step || nice(ch.max - ch.min);
      ch.x = o.x; ch.y = o.y; ch.w = o.w; ch.h = o.h; ch.band = o.w / ch.n; ch.bw = ch.band * (1 - o.gap); ch.base = o.y + o.h;
      return ch;
    };
    ch.set();
    ch.X = (i) => o.x + (i + .5) * ch.band;
    ch.Y = (v) => o.y + o.h - (v - ch.min) / (ch.max - ch.min) * o.h;
    ch.ticks = () => { const out = []; for (let v = Math.ceil(ch.min / ch.step - 1e-9) * ch.step; v <= ch.max + 1e-9; v += ch.step) out.push(+v.toPrecision(12)); return out; };
    ch.hit = (px, py) => { if (py < o.y - 20 || py > ch.base + 60) return -1; const i = Math.floor((px - o.x) / ch.band); return i >= 0 && i < ch.n ? i : -1; };
    ch.axes = (ao = {}) => {
      const c = L.ctx, a = A(ao), t = ao.t == null ? 1 : clamp(ao.t); if (a <= 0 || t <= 0) return;
      const x0 = o.x, y0 = ch.base, x1 = o.x + o.w, yt = o.y, fmt = ao.fmt || ((v) => U.fmt(v, ch.step < 1 ? Math.min(3, Math.ceil(-Math.log10(ch.step) - 1e-9)) : 0));

        c.stroke();
      }
      c.strokeStyle = COL.ink; c.fillStyle = COL.ink; c.lineWidth = 2.5; c.lineCap = 'round'; c.lineJoin = 'round';
      c.beginPath(); c.moveTo(x0, y0); c.lineTo(lerp(x0, x1 + (ao.xArrow ? 34 : 12), t), y0); c.moveTo(x0, y0); c.lineTo(x0, lerp(y0, yt - 34, t)); c.stroke();
      if (t >= 1) { if (ao.arrow !== false) arrowHead(c, x0, yt - 34, -Math.PI / 2); if (ao.xArrow) arrowHead(c, x1 + 34, y0, 0); }

        c.beginPath(); c.moveTo(x0, y0); c.lineTo(x0, yc + 9); c.lineTo(x0 - 8, yc + 4); c.lineTo(x0 + 8, yc - 4); c.lineTo(x0, yc - 9); c.stroke();
      }

        c.globalAlpha = a * ta; c.strokeStyle = COL.ink; c.lineWidth = 2;
        const every = ao.every || 1;
        ch.ticks().forEach((v, j) => {
          const y = ch.Y(v); c.beginPath(); c.moveTo(x0 - 8, y); c.lineTo(x0, y); c.stroke();
          if (j % every === 0) L.tx(fmt(v), x0 - 14, y, { f: F.M, s: ao.ys || 22, w: 500, a: 'right', b: 'middle', c: COL.mut });
        });
        if (ao.cats) ao.cats.forEach((ct, i) => { if (ct) L.tx(ct.s, ch.X(i), y0 + 12, { k: ct.k, s: ao.cs || 24, w: 600, f: F.B, a: 'center', b: 'top', c: ao.cc || COL.ink }); });
        if (ao.yName) L.tx(ao.yName.s, x0 + 20, yt - 30, { k: ao.yName.k, s: 22, w: 700, f: F.B, a: 'left', b: 'middle', c: COL.mut });
        if (ao.xName) L.tx(ao.xName.s, x1 + (ao.xArrow ? 34 : 12), y0 + 14 + (ao.cats ? (ao.cs || 24) + 10 : 0), { k: ao.xName.k, s: 22, w: 700, f: F.B, a: 'right', b: 'top', c: COL.mut });
      }
      c.restore();
    };
    ch.cell = (i, k) => { const bw = ch.bw, yb = ch.Y(ch.min + k), yt = ch.Y(ch.min + k + 1); return { x: ch.X(i) - bw / 2, y: yt, w: bw, h: yb - yt }; };

    const avoidClip = (c, boxes) => {
      if (!boxes || !boxes.length) return false;
      c.beginPath(); c.rect(-4000, -4000, 8000, 8000);
      boxes.forEach(([x, y, w, h]) => c.rect(x, y, w, h));
      c.clip('evenodd'); return true;
    };
    ch.labs = [];
    ch.bars = (vals, bo = {}) => {
      const c = L.ctx, a = A(bo), H = his(bo), out = [], bw = bo.bw || ch.bw;
      ch.labs = [];
      if (a <= 0) return out;
      // az értékfeliratok szövege és doboza előre (a ghost kerete ezeket kerüli)
      const tOf = (i) => (Array.isArray(bo.t) ? clamp(bo.t[i]) : bo.t == null ? 1 : clamp(bo.t));
      const vsz = bo.vs || 26, labs = vals.map((v, i) => {
        const ti = tOf(i); if (!bo.values || ti <= .98) return null;
        const lv = Array.isArray(bo.values) ? bo.values[i] : null;
        const s = lv ? lv.s : typeof bo.values === 'function' ? bo.values(v, i) : U.fmt(v, Math.abs(v - Math.round(v)) < 1e-9 ? 0 : 1);
        if (s == null || s === '') return null;
        const vv = ch.min + Math.max(0, Math.min(ch.max, v) - ch.min) * ti, yT = ch.Y(vv), w = L.measure(s, { f: F.M, s: vsz, w: 700 }).w;
        return { s, k: lv ? lv.k : undefined, box: [ch.X(i) - w / 2 - 6, yT - 10 - vsz * .74 - 5, w + 12, vsz * .98 + 10] };
      });
      ch.labs = labs.filter(Boolean).map((l) => l.box);
      c.save();
      vals.forEach((v, i) => {
        const ti = tOf(i);
        const vv = ch.min + Math.max(0, Math.min(ch.max, v) - ch.min) * ti, yT = ch.Y(vv), x = ch.X(i) - bw / 2, h = ch.base - yT;
        const col = colOf(bo, i), on = !H || H.includes(i), ai = a * (on ? 1 : (bo.dim == null ? .25 : bo.dim));
        c.globalAlpha = ai; c.setLineDash([]);
        if (h > .5) {

            c.stroke(); c.globalAlpha = ai;
          }

        }

          const yg = ch.Y(Math.max(ch.min, bo.ghost[i])); c.save(); avoidClip(c, ch.labs);
          c.globalAlpha = a * .9; c.setLineDash([8, 6]); c.strokeStyle = COL.mut; c.lineWidth = 2.5;
          c.strokeRect(x, yg, bw, ch.base - yg); c.restore(); c.setLineDash([]); c.globalAlpha = ai;
        }
        if (labs[i]) L.tx(labs[i].s, ch.X(i), yT - 10, { k: labs[i].k, f: F.M, s: vsz, w: 700, a: 'center', c: edge(col) });
        out.push({ i, x, y: yT, w: bw, h });
      });
      c.restore(); return out;
    };
    ch.line = (vals, lo = {}) => {
      const c = L.ctx, a = A(lo), t = lo.t == null ? 1 : clamp(lo.t), pts = vals.map((v, i) => [ch.X(i), ch.Y(v)]);
      if (a <= 0 || !pts.length) return pts;

      c.save(); c.globalAlpha = a; c.strokeStyle = col; c.lineWidth = lo.w || 4; c.lineCap = 'round'; c.lineJoin = 'round';
      if (lo.dash) c.setLineDash(lo.dash);

      for (let j = 1; j < pts.length && j - 1 < reach; j++) { const f = clamp(reach - (j - 1)); c.lineTo(lerp(pts[j - 1][0], pts[j][0], f), lerp(pts[j - 1][1], pts[j][1], f)); }
      c.stroke(); c.setLineDash([]);
      const r = lo.dots == null ? 8 : lo.dots;
      pts.forEach((p, j) => {
        if (j > reach + 1e-6) return;
        const dc = lo.dotCols ? lo.dotCols[j % lo.dotCols.length] : col;
        if (r > 0) { c.beginPath(); c.arc(p[0], p[1], r, 0, TAU); c.fillStyle = fill(dc); c.fill(); c.strokeStyle = edge(dc); c.lineWidth = 2.5; c.stroke(); }
        if (lo.values) L.tx(typeof lo.values === 'function' ? lo.values(vals[j], j) : U.fmt(vals[j]), p[0], p[1] - r - 10, { f: F.M, s: lo.vs || 24, w: 700, a: 'center', c: edge(col) });
      });
      c.restore(); return pts;
    };
    ch.hline = (v, ho = {}) => {
      const c = L.ctx, a = A(ho); if (a <= 0) return null;
      const y = ch.Y(v), col = ho.c || COL.red;
      c.save(); if (ho.avoid !== false) avoidClip(c, ch.labs);
      c.globalAlpha = a; c.strokeStyle = col; c.lineWidth = ho.w || 3; c.setLineDash(ho.dash || [12, 8]);
      c.beginPath(); c.moveTo(o.x, y); c.lineTo(o.x + o.w, y); c.stroke(); c.setLineDash([]); c.restore();
      c.save(); c.globalAlpha = a;
      let b = null;
      if (ho.label) b = L.pill(ho.label.s, ho.side === 'left' ? o.x - 10 : o.x + o.w + 10, y, { k: ho.label.k, s: 24, w: 700, f: F.B, a: ho.side === 'left' ? 'right' : 'left', c: col, bg: COL.card, bd: col, pad: 10 });
      c.restore(); return b;
    };
    return ch;
  }

  /* ── kördiagram ── */
  function arcs(vals, start = -Math.PI / 2) {
    const S = vals.reduce((s, v) => s + Math.max(0, v), 0) || 1; let a0 = start;
    return vals.map((v) => { const fr = Math.max(0, v) / S, a1 = a0 + fr * TAU, r = { a0, a1, mid: (a0 + a1) / 2, fr, deg: fr * 360 }; a0 = a1; return r; });
  }
  function pie(L, o) {
    const c = L.ctx, a = A(o), t = o.t == null ? 1 : clamp(o.t), ar = arcs(o.vals, o.start == null ? -Math.PI / 2 : o.start), H = his(o);
    if (a <= 0 || !ar.length) return ar;
    const end = ar[0].a0 + t * TAU;
    c.save(); c.lineJoin = 'round';
    ar.forEach((s, i) => {
      const a1 = Math.min(s.a1, end); if (a1 <= s.a0 + 1e-6) return;
      const col = colOf(o, i), on = !H || H.includes(i);

  const y3 = yL + 66, aT = p(3.6);
  al(aT); T('ö tévhitek', 40, y3, { f: F.D, s: 26, w: 600, c: INK });
  const MY = ['tévhit nemes', 'tévhit szegény', 'tévhit jobbágy', 'tévhit pazarló', 'tévhit elszigetelt'];
  const yy = [y3 + 18, y3 + 18];
  MY.forEach((k, i) => {
    const col = i % 2, m = mythW(k, 40 + col * 660, yy[col], 640, p(3.8 + i * .15), smooth((st - 4.6 - i * .15) / .5));
    if (k === 'tévhit pazarló') vStamp(m.x + m.w - 128, m.y + m.h / 2, p(3.8 + i * .15) * smooth((st - 5.4) / .4));
    yy[col] += m.h + 14;
  });
}

/* ════════ lépések ════════ */
const SCENES = [scene1, scene2, scene3, scene4, scene5, scene6, scene7, scene8, scene9];
const SETTLE = [4.2, 4.4, 4.2, 3.6, 6.8, 4.2, 5.2, 6.8, 5.6];
const sT = new Array(9).fill(0);
const STEPS = [
  { settle: SETTLE[0] },
  { settle: SETTLE[1] },
  { settle: SETTLE[2], enter() { tipReset(P3); veilIf(P3); S3.pie = false; S3.t0 = -99; },
    controls(Lx) {
      tipReset(P3); S3.pie = false; S3.t0 = -99;
      tipControls(P3);
      S3.btn = Lx.button(lab('gomb kör'), toggle3, 'gomb kör'); S3.btn.style.display = P3.guess ? '' : 'none';
    } },
  { settle: SETTLE[3], enter() { S4.x = 0; },
    controls(Lx) { S4.x = 0; S4.sl = Lx.slider({ label: lab('csúszka túlzás'), k: 'csúszka túlzás', min: 0, max: 40, step: 1, value: 0, format: (v) => fmt(v) + NB + '%', onInput: (v) => { S4.x = +v; } }); } },
  { settle: SETTLE[4], enter() { S5.auto = true; S5.y = A5.Y0; },
    controls(Lx) { S5.auto = true; S5.y = A5.Y0; S5.sl = Lx.slider({ label: lab('csúszka év'), k: 'csúszka év', min: A5.Y0, max: A5.Y1, step: 1, value: A5.Y0, format: (v) => String(v), onInput: (v) => { S5.auto = false; S5.y = +v; } }); } },
  { settle: SETTLE[5], enter() { tipReset(P6); veilIf(P6); CARDS6.reset(); }, leave() { if (L.stage) L.stage.style.cursor = ''; },
    controls(Lx) {
      tipReset(P6); tipControls(P6);
      S6.btns = [Lx.button(lab('gomb megoldás'), () => CARDS6.solve(), 'gomb megoldás'), Lx.button(lab('gomb újra'), () => CARDS6.reset(), 'gomb újra')];
      S6.btns.forEach((b) => { b.style.display = P6.guess ? '' : 'none'; });
    } },
  { settle: SETTLE[6] },
  { settle: SETTLE[7], enter() { S8.auto = true; S8.y = Y8[0]; },
    controls(Lx) { S8.auto = true; S8.y = Y8[0]; S8.sl = Lx.slider({ label: lab('csúszka házasság'), k: 'csúszka házasság', min: Y8[0], max: Y8[1], step: 1, value: Y8[0], format: (v) => String(v), onInput: (v) => { S8.auto = false; S8.y = +v; } }); } },
  { settle: SETTLE[8] },
];

/* ── QA: szélső állapotok (1-alapú lépésszám) ── */
window.__qaStates = {
  3: [{ name: 'tipp-jo', set(L2) { tipGuess(P3, 'tipp3 pénz', L2.st - 20); } },
    { name: 'tipp-rossz', set(L2) { tipGuess(P3, 'tipp3 föld', L2.st - 20); } },
    { name: 'csoportositva', set(L2) { tipGuess(P3, 'tipp3 pénz', L2.st - 20); S3.pie = true; S3.t0 = L2.st - 5; } }],
  4: [26, 40].map((x) => ({ name: 'tulzas-' + x, set() { S4.x = x; if (S4.sl) S4.sl.set(x); } })),
  5: [1100, 1222].map((y) => ({ name: 'ev-' + y, set() { S5.auto = false; S5.y = y; if (S5.sl) S5.sl.set(y); } })),
  6: [{ name: 'tipp-jo', set(L2) { tipGuess(P6, 'tipp6 szerviens', L2.st - 20); } },
    { name: 'megoldva', set(L2) { tipGuess(P6, 'tipp6 szerviens', L2.st - 20); CARDS6.solve(L2.st - 3); } },
    { name: 'rossz-hely', set(L2) { tipGuess(P6, 'tipp6 jobbágy', L2.st - 20); CARDS6.place('k adó', 'k', L2.st - 3); CARDS6.place('k megye', 'sz', L2.st - 3); CARDS6.place('k várjobbágy', 'm', L2.st - 3); } }],
  8: [1100, 1200].map((y) => ({ name: 'ev-' + y, set() { S8.auto = false; S8.y = y; if (S8.sl) S8.sl.set(y); } })),
};

L = Lesson.create({
  resetCtx: true,
  content: window.LESSON_CONTENT,
  home: false,
  steps: STEPS,
  init(Lx) {
    L = Lx; c = L.ctx;
    SRC = TortSource.create(L, { 'forrás': K('forrás jel'), 'rekonstrukció': K('rekonstrukció jel'), 'monda': K('monda jel'), 'becslés': K('becslés'), 'vázlatos': K('vázlatos'), 'illusztráció': K('illusztráció') });
    TT = { bc: K('Kr. e.'), ad: K('Kr. u.'), cent: K('század'), years: K('év sablon') };
    MAP1 = TortMap.create({ proj: PRJ1, layers: [{ data: window.TORT_MAP_EUROPA }, { data: window.TORT_MAP_KARPAT }], ancient: true, rect: [0, 0, 1360, 1080] });
    MAP8 = TortMap.create({ proj: PRJ8, layers: [{ data: window.TORT_MAP_EUROPA }], ancient: true, rect: [0, 0, 1360, 1080] });
    VW.m1 = TortProj.fit(PRJ1, [13.6, 43.9, 26.0, 49.3], R1, 0);
    VW.m8 = TortProj.fit(PRJ8, [-2.5, 35.2, 38.5, 52.6], R8, 0);
    TL1 = TortTimeline.create(L, { x0: 70, x1: 1290, y: 520, h: 46, T: TT, src: SRC, bounds: [900, 1100] });
    TL1.view(962, 1046);
    CH3 = MatChart.create(L, { x: 130, y: 400, w: 1190, h: 340, n: 7, min: 0, max: 60000, step: 10000, gap: .38 });
    CH4 = MatChart.create(L, { x: 840, y: 250, w: 480, h: 430, n: 4, min: 0, max: 35, step: 5, gap: .42 });
    const zones = [
      { id: 'sz', x: 40, y: 586, w: 430, h: 474, title: K('z szerviens'), sub: K('z szerviens sub'), head: 100 },
      { id: 'm', x: 480, y: 586, w: 386, h: 474, title: K('z mások'), sub: K('z mások sub'), head: 100 },
      { id: 'k', x: 876, y: 586, w: 464, h: 474, title: K('z király'), sub: K('z király sub'), head: 100 },
    ];
    CARDS6 = TortCards.create(L, { zones, cards: CARDS6_DEF.map(([k, z]) => ({ id: k, label: K(k), zone: z })), tray: { x: 40, y: 242, w: 1300, h: 336, top: 58 }, font: { f: F.B, s: 22, w: 600 } });
    P3.on = () => { if (S3.btn) S3.btn.style.display = ''; };
    P6.on = () => { S6.btns.forEach((b) => { b.style.display = ''; }); };
    L.checks = () => {
      const o = [], vals = jvVals(), tot = num('jv összesen');
      o.push({ name: 'jegyzék: a tételek összege = összesen', ok: jvSum() === tot, got: jvSum(), want: tot });
      const reg = vals.slice(FÖLD3).reduce((s, v) => s + v, 0) / tot * 100;
      o.push({ name: 'jegyzék: felségjogok aránya 63,9 %', ok: Math.abs(reg - 63.86) < .1, got: reg.toFixed(2), want: '63,86' });
      o.push({ name: 'jegyzék: összesen ≈ 30 989 kg ezüst (186,68 g/márka)', ok: Math.abs(silverT(tot) * 1000 - 30988.9) < 1, got: (silverT(tot) * 1000).toFixed(1), want: '30988,9' });
      const ov = (1 - num('Barta korrekció') / (silverT(tot) * 1000)) * 100, tl = dat('lista túlzása');
      o.push({ name: 'Barta–Barta-korrekció a „lista túlzása” sávban', ok: ov >= tl.lo && ov <= tl.hi, got: ov.toFixed(1) + ' %', want: tl.lo + '–' + tl.hi + ' %' });
      const kk = [...Array(N2).keys()].filter(toKing).length;
      o.push({ name: 'vármegye: a részecskék 2/3-a a királyé', ok: kk / N2 === num('király része') && (N2 - kk) / N2 === num('ispán része'), got: kk + '/' + N2, want: '2/3' });
      const A = bszA(), okA = A.every((q, i) => q.k.lo < q.k.hi && q.e.lo < q.e.hi && q.k.hi + q.e.hi <= 100 && (!i || (q.y > A[i - 1].y && q.k.v < A[i - 1].k.v)));
      o.push({ name: 'birtokmodell: időrend, csökkenő királyi rész, ≤ 100 %', ok: okA, got: A.map((q) => q.y + ':' + q.k.v).join(' '), want: 'növekvő év, csökkenő közép' });
      const okH = HZ.every((h, i) => !i || yr(h[0]) >= yr(HZ[i - 1][0]));
      o.push({ name: 'házasságok időrendben', ok: okH, got: HZ.map((h) => yr(h[0])).join(','), want: 'növekvő' });
      const zc = {}; CARDS6_DEF.forEach(([, z]) => { zc[z] = (zc[z] || 0) + 1; });
      o.push({ name: 'Aranybulla-kártyák: 10 db, 5/2/3', ok: CARDS6_DEF.length === 10 && zc.sz === 5 && zc.m === 2 && zc.k === 3, got: JSON.stringify(zc), want: '5/2/3' });
      const ev = EV5.every((e, i) => !i || yr(e[0]) >= yr(EV5[i - 1][0]));
      o.push({ name: 'események időrendben (5. lépés)', ok: ev, got: EV5.map((e) => yr(e[0])).join(','), want: 'növekvő' });
      const hit = (s) => L.quote('aranybulla 31').split(' ').some((wd) => norm(wd).startsWith(norm(lab('q tő ' + s))));
      o.push({ name: 'záradék: mindhárom réteg szerepel a szövegben', ok: Q7.every(([s]) => hit(s)), got: Q7.map(([s]) => s + ':' + hit(s)).join(' '), want: 'mind true' });
      return o;
    };
  },
  draw(Lx) {
    L = Lx; c = L.ctx; GA = 1; paper();
    const sp = L.sp, wt = (i) => clamp(1 - Math.abs(sp - i) * 2);
    sT[L.step] = L.st;
    for (let i = 0; i < SCENES.length; i++) {
      const w = wt(i); if (w <= .005) continue;
      const active = i === L.step, st = active ? L.st : (sT[i] || SETTLE[i]);
      c.save(); SCENES[i](st, w, active); c.restore();
    }
    c.globalAlpha = 1;
  },
});
})();
</script>
