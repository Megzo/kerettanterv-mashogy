<script>
/* ── MODUL: „Tippelj!” és bélyegek (TtTipp) · forrás: termeszettudomany-5-6/01-tocsa + 03-meres, egységesítve 2026-11-24 ── */
/* A természettudomány 5–6. sorozat közös mintái (szerződés 17.): kísérlet-/modellbélyeg és a „Tippelj! → kísérlet →
   magyarázat” jóslat. Csak a Lesson motorra épül (L.ctx, L.tx, L.pill, L.lab, L.button, L.controlsEl, L.panel, L.st,
   Lesson.U, Lesson.FONTS); a lecke kódjára nem hivatkozik. A panel elmosásához szükséges CSS-t (.tt-rejtett) és a
   letiltott csúszka halványítását a modul maga teszi a <head>-be – a leckében nem kell <style>-sor.

   BEKÖTÉS (a lecke kódjában, egyszer, legfelső szinten – a getterek miatt a sorrend mindegy):
     TtTipp.bind({ L: () => L, ga: () => GA });    // ga: a lecke alap-alfája (jelenet-áttűnés); alap: () => 1
     const { stamp, Tip, tipReset, panelVeil, veilIf, tipGuess, tipHide, tipControls, tipU, rhythm, tipHead, tipRow,
       tipFeedback } = TtTipp;
   ALFA: minden rajzoló a globalAlpha-t ga() · a (· belső áttűnés) értékre ÁLLÍTJA (nem szoroz a pillanatnyival, így
   egy korábbi halvány felirat nem tünteti el), a vonalstílust (lineCap/lineJoin/setLineDash) visszaállítja.

   stamp(kind, x, y, a, o) → doboz | null       kísérlet-/modellbélyeg a KemGHS.stamp stílusával (Bricolage 22 px,
        600, betűköz 0,08 em, −3°, papír alap, 2 px keret; 'tilos': 700, 3 px). (x, y): a bal szél közepe.
        Szöveg: az o.k || '<kind> bélyeg' .md-kulcs. Szín (STAMP): otthon kékeszöld, felnőtt okker, tilos #b3261e;
        tanári, modell, kitalált, nem méretarányos, sematikus, vázlatos, képzeletbeli (és minden más) halvány tinta.
        o = {k, col (szín felülírása), rot: −3 (fok), al: 'left' (igazítás)}. a ≤ 0,005 → nem rajzol.
   Tip(keys, ok) → P      jóslat-állapot. keys: a válaszok .md-kulcsai (egyben gombfeliratok), ok: a helyes kulcs (az
        init-ben is beállítható: P.ok = …). P = {keys, ok, guess: null | kulcs, gt: a választás L.st-je, btns, on}.
        P.on(k): választáskor hívódik (a lecke állítja, pl. a kísérlet vezérlőinek feloldására).
   tipReset(P)            alaphelyzet (az enter()-ben; utána veilIf(P)).
   panelVeil(on)          a panelszöveg 2. bekezdésétől (.lp-text > *, i > 0) elmos (on) / felold.
   veilIf(P)              panelVeil(!P.guess) – az enter()-ben a tipReset után.
   tipControls(P)         a tippgombok (L.button, P.keys sorrendben). A választás után csak ezek tűnnek el: a
        sorukba utána tett más gombok maradnak (ha a sorban nem marad látható gomb, a sor is eltűnik).
   tipGuess(P, k, gt)     választás (csak az első számít): P.guess = k, P.gt = gt ?? L.st, tipHide, panelVeil(false),
        P.on(k). A QA-állapotok is ezt hívhatják (pl. gt = L.st − 30: a kísérlet már lefutott).

    hist: (a) => (a <= 0 ? a - 1 : a),
    u: (d) => (typeof d === 'number' ? d + .5 : d.t === 'date' ? d.a : d.a + .5),

    num: (a) => (a <= 0 ? 1 - a : a),
    label: (a, T, ad) => (a <= 0 ? T.bc.s + NB + (1 - a) : (ad ? T.ad.s + NB : '') + a),

/* ── MODUL: Kártyák (TortCards) ────────────────────────────────────────────────────

   (pl. két oszlop: falu / város), azonnali visszajelzéssel. Referencia: 07-kozepkori-varos.

    al(ma); rr(lx, ly, 310, 122, 10); c.fillStyle = 'rgba(255,250,241,.93)'; c.fill(); c.strokeStyle = U.rgba(INK, .25); c.lineWidth = 1.5; c.stroke();
    al(ma); c.fillStyle = INK; c.beginPath(); c.arc(lx + 24, ly + 26, 8, 0, TAU); c.fill(); T('k7 város', lx + 44, ly + 26, { s: 22, w: 600, b: 'middle' });
    al(ma); c.fillStyle = RED; c.fillRect(lx + 15, ly + 52, 18, 18); T('k7 tábor', lx + 44, ly + 61, { s: 22, w: 600, b: 'middle', max: 256 });
    al(ma); c.strokeStyle = RED; c.lineWidth = 4; c.setLineDash([14, 8]); c.beginPath(); c.moveTo(lx + 8, ly + 97); c.lineTo(lx + 40, ly + 97); c.stroke(); c.setLineDash([]);
    T('k7 limes', lx + 44, ly + 97, { s: 22, w: 600, b: 'middle', max: 256 });
  }
  // 212
  const ka = p(2.8);
  if (ka > .01) { al(ka); L.pill(tpl('k212', val('Constitutio Antoniniana')), mx + mw / 2, 952, { k: ['k212', 'Constitutio Antoniniana'], s: 22, w: 700, c: TEAL, bg: CARD, bd: TEAL, bw: 2.5, pad: 12, r: 10, a: 'center', max: mw }); }
}

/* ════════ 8. A római jog öröksége ════════ */
let CARDS8;
const J8 = [1, 2, 3, 4, 5, 6];
const OCOL = { 1: GOOD, 2: GOOD, 3: GOOD, 4: OCHRE, 5: OCHRE, 6: BAD };
function scene8(st, w, active) {
  GA = w;

  title('k8 cím', p(0), { max: 640, s: 36 });

  const sc = CARDS8.score();
  CARDS8.zones.forEach((z) => {
    const i = +z.id.slice(1), q = CARDS8.cards.find((cc) => cc.id === 'j' + i), ok = q && q.at === z.id && st - q.t0 > CARDS8_EASE;
    if (!ok) return;
    const a = p(.2) * smooth((st - q.t0 - CARDS8_EASE) / .4);
    al(a); T('l' + i + ' latin', z.x + 22, z.y + z.head + 52 + 34, { f: F.D, s: 24, w: 600, i: true, c: INK, max: z.w - 44 });
    const ok6 = 'o' + i, s = i === 6 ? tpl(ok6, val('Feuerbach tankönyve')) : lab(ok6);
    al(a); L.tx(s, z.x + 22, z.y + z.head + 52 + 66, { k: i === 6 ? [ok6, 'Feuerbach tankönyve'] : ok6, s: 22, w: 700, c: OCOL[i], max: z.w - 44 });
  });
  const six = CARDS8.cards.find((cc) => cc.id === 'j6'), sixOk = six && six.at === 'z6';
  myth('tévhit 8', 1340, 62, p(.8), sixOk ? smooth((st - six.t0 - CARDS8_EASE - .4) / .6) : 0, { s: 22, a: 'right', max: 640 });
  void sc;
}
const CARDS8_EASE = .45;

/* ════════ 9. Összefoglalás ════════ */
const T9 = [['t9 Athén', 't9 Athén sub', TEAL, 'a'], ['t9 Róma', 't9 Róma sub', INK, 'b'], ['t9 Augustus', 't9 Augustus sub', BORDO, 'c']];
function scene9(st, w) {

  const RH = 150;
  ['t9 r1', 't9 r2', 't9 r3', 't9 r4'].forEach((rk, i) => {

    soft(X0, y, LW, RH, ra, { bg: 'rgba(28,36,64,.05)' });
    textBox(X0, y + 10, LW, [{ k: rk, size: 26, w: 700, f: F.B }], { measure: true });
    const lines = SRC.wrap(lab(rk), LW - 40, { f: F.B, s: 26, w: 700 });
    lines.forEach((ln, li) => { al(ra); L.tx(ln, X0 + 20, y + RH / 2 - (lines.length - 1) * 17 + li * 34 + 9, { k: rk, s: 26, w: 700, c: INK }); });
    T9.forEach(([, , col, pre], j) => {
      const x = X0 + LW + GAP + j * (CW + GAP), a = p(1.1 + i * .3 + j * .2), ck = 't9 ' + pre + (i + 1);
      soft(x, y, CW, RH, a, { bd: U.rgba(col, .45) });
      const ls = SRC.wrap(lab(ck), CW - 36, { f: F.B, s: 24, w: 500 });
      ls.forEach((ln, li) => { al(a); L.tx(ln, x + 18, y + RH / 2 - (ls.length - 1) * 16 + li * 32 + 8, { k: ck, s: 24, w: 500, c: INK }); });
    });
  });
  // nyíl: köztársaság → egyeduralom
  const aa = p(3.0), yA = Y0 - 14, xa = X0 + LW + GAP + CW + GAP + CW * .5, xb = X0 + LW + GAP + 2 * (CW + GAP) + CW * .5;
  void yA; void xa; void xb; void aa;
  myth('tévhit 9', 40, 1040, p(3.2), smooth((st - 4.0) / .6), { s: 24 });
}

/* ════════ lépések ════════ */
const sT = new Array(9).fill(0);
function resetSched(n) {
  const S = stopsOf(n); SS[n].from = 0; SS[n].to = S.length - 1; SS[n].t0 = .9;
}
const STEPS = [

    controls(L) {
      tipControls(P2);
      if (P2.guess) voteButtons();
    } },
  { settle: 4.4, enter() { S3.sel = null; S3.selT = -9; } },
  { settle: 4.4 },
  { settle: 7.2, enter() { resetSched(5); },
    controls(L) {
      L.slider({ label: lab('csúszka dátum'), k: 'csúszka dátum', min: 0, max: STOPS5.length - 1, step: 1, value: STOPS5.length - 1, format: (v) => val(EVK[STOPS5[Math.round(v)]][0]), onInput: (v) => play(5, v) });
      L.button(lab('gomb lejátszás'), () => { SS[5].from = 0; SS[5].to = STOPS5.length - 1; SS[5].t0 = L.st; }, 'gomb lejátszás');
    } },
  { settle: 8, enter() { resetSched(6); },

      L.button(lab('gomb lejátszás'), () => { SS[6].from = 0; SS[6].to = STOPS6.length - 1; SS[6].t0 = L.st; }, 'gomb lejátszás');
    } },
  { settle: 4.4, enter() { S7.rd = 0; S7.rdT = -9; },
    controls(L) {
      L.button(lab('gomb olv 1'), () => { S7.rd = 1; S7.rdT = L.st; }, 'gomb olv 1');
      L.button(lab('gomb olv 2'), () => { S7.rd = 2; S7.rdT = L.st; }, 'gomb olv 2');
    } },
  { settle: 2.4, enter() { CARDS8.reset(); }, leave() { L.stage.style.cursor = ''; },
    controls(L) { L.button(lab('gomb megoldás'), () => CARDS8.solve(), 'gomb megoldás'); L.button(lab('gomb újra'), () => CARDS8.reset(), 'gomb újra'); } },
  { settle: 5 },
];
const SCENES = [scene1, scene2, scene3, scene4, scene5, scene6, scene7, scene8, scene9];

/* ── QA: szélső állapotok ── */
const setSlider = (i) => { if (L.sliders && L.sliders['csúszka dátum']) L.sliders['csúszka dátum'].set(i); };
window.__qaStates = {
  2: [{ name: 'tipp-jó', set(L) { tipGuess(P2, 'tipp2 első', L.st - 8); } }, { name: 'tipp-rossz', set(L) { tipGuess(P2, 'tipp2 vég', L.st - 8); } },
    { name: 'megoszlik', set(L) { tipGuess(P2, 'tipp2 közép', L.st - 12); S2.mode = 'megoszlik'; S2.t0 = L.st - 8; } },
    { name: 'egyenlő', set(L) { tipGuess(P2, 'tipp2 első', L.st - 12); S2.eqFrom = 0; S2.eq = 1; S2.eqT = L.st - 3; } }],
  3: ['v1', 'v2', 's', 'c', 't', 'd', 'z', 'h'].map((id) => ({ name: 'kártya-' + id, set(L) { S3.sel = id; S3.selT = L.st - 1; } })),
  5: [{ name: 'alap', set(L) { SS[5].from = 0; SS[5].to = 0; SS[5].t0 = L.st - 5; setSlider(0); } },
    { name: 'Sulla', set(L) { SS[5].from = 1; SS[5].to = 1; SS[5].t0 = L.st - 5; setSlider(1); } },
    { name: 'Rubicon', set(L) { SS[5].from = 3; SS[5].to = 3; SS[5].t0 = L.st - 5; setSlider(3); } }],
  6: [{ name: 'örökös', set(L) { SS[6].from = 0; SS[6].to = 0; SS[6].t0 = L.st - 5; setSlider(0); } },
    { name: 'Augustus27', set(L) { SS[6].from = 2; SS[6].to = 2; SS[6].t0 = L.st - 5; setSlider(2); } },
    { name: 'tribunusi', set(L) { SS[6].from = 3; SS[6].to = 3; SS[6].t0 = L.st - 5; setSlider(3); } }],
  7: [{ name: 'olvasat-1', set(L) { S7.rd = 1; S7.rdT = L.st - 2; } }, { name: 'olvasat-2', set(L) { S7.rd = 2; S7.rdT = L.st - 2; } }],
  8: [{ name: 'megoldva', set(L) { CARDS8.solve(L.st - 4); } },
    { name: 'részben', set(L) { CARDS8.place('j6', 'z6', L.st - 3); CARDS8.place('j1', 'z2', L.st - 3); } }],
};

L = Lesson.create({
  resetCtx: true,
  content: window.LESSON_CONTENT,
  home: false,
  steps: STEPS,
  init(Lx) {
    L = Lx; c = L.ctx;
    SRC = TortSource.create(L, { 'forrás': K('forrás jel'), 'rekonstrukció': K('rekonstrukció jel'), 'monda': K('monda jel'), 'becslés': K('becslés'), 'vázlatos': K('vázlatos'), 'illusztráció': K('illusztráció') });
    TT = { bc: K('Kr. e.'), ad: K('Kr. u.'), cent: K('század'), years: K('év sablon') };
    TL1 = TortTimeline.create(L, { x0: 60, x1: 1300, y: 868, h: 44, T: TT, src: SRC, bounds: [-800, 100] });
    TL4 = TortTimeline.create(L, { x0: 60, x1: 1300, y: 1010, h: 48, T: TT, src: SRC, bounds: [-200, 0] });
    PAL2 = TortParl.palette(8, { tones: 8, pats: ['teli'] });
    ST3 = buildSchema(); ST5 = buildSchema(); ST6 = buildSchema();
    applyTimeline(ST5, EVA('alap')); applyTimeline(ST6, EVA('orokos'));
    ST3.nodes.find((q) => q.id === 'h').sub = K('n légiók sub');
    resetSched(5); resetSched(6);
    C7 = FoldChart.create(L, { x: 120, y: 190, w: 520, h: 520, xs: { min: -.6, max: 3.6, ticks: [] }, ys: { min: 0, max: 5, step: 1, d: 0 } });
    PROJ7 = TortProj.lcc({ lon0: 18, lat0: 46.5, lat1: 45, lat2: 48 });
    MAP7 = TortMap.create({ proj: PROJ7, ancient: true, layers: [{ data: window.TORT_MAP_KARPAT }], rect: [680, 140, 660, 740] });
    V7 = TortMap.fit(PROJ7, [15.7, 45.15, 20.4, 48.5], [680, 140, 660, 740], 10);
    { const du = MAP7.river('Duna'); if (du && du.length) LIMES = TortMap.slice(du, [16.86, 48.11], [19.85, 45.25]); }
    const zt = [1, 2, 3, 4, 5, 6].map((i) => ({ id: 'z' + i, x: 40 + ((i - 1) % 2) * 655, y: 104 + Math.floor((i - 1) / 2) * 242, w: 635, h: 234, title: K('z' + i + ' cím'), sub: K('z' + i + ' sub'), head: 104 }));
    const shuffle = [4, 1, 6, 3, 5, 2];
    CARDS8 = TortCards.create(L, { zones: zt, cards: shuffle.map((i) => ({ id: 'j' + i, label: K('j' + i), zone: 'z' + i })), tray: { x: 40, y: 840, w: 1290, h: 210, top: 22 }, font: { s: 22, w: 600 }, ease: CARDS8_EASE });
    L.checks = () => {
      const out = [];
      const tot = cents().reduce((s, q) => s + q.n, 0);
      out.push({ name: 'centuriák összesen 193', ok: tot === 193, got: tot, want: 193 });
      out.push({ name: 'többség = 193 fele felfelé', ok: num('többség') === Math.ceil(tot / 2), got: num('többség'), want: Math.ceil(tot / 2) });
      out.push({ name: 'lovagok + I. osztály = 98 ≥ 97', ok: num(CLS_N.eq) + num(CLS_N.c1) === num('lovagok és I. osztály') && num('lovagok és I. osztály') >= num('többség'), got: num(CLS_N.eq) + num(CLS_N.c1), want: '98' });
      const V = voteSeq('egyetért'); out.push({ name: 'egyetértés: a 97. igen az I. osztályban', ok: V.seq[V.stop].cls === 'c1' && V.stop === num('többség') - 1, got: V.seq[V.stop].cls + '@' + V.stop, want: 'c1@96' });
      const M = voteSeq('megoszlik'), ny = M.seq.filter((q) => q.cls === 'c1' && q.v === 'n').length;
      out.push({ name: 'megoszlás: I. osztály nem-szavazat', ok: ny === num(CLS_N.c1) - num('példa I. osztály igen'), got: ny, want: num(CLS_N.c1) - num('példa I. osztály igen') });
      const es = eqSeats().reduce((s, q) => s + q.n, 0), sh = CLS.reduce((s, id) => s + num(CLS_M[id]), 0);
      out.push({ name: 'modell: 193 ülés, 100 %', ok: es === 193 && Math.abs(sh - 100) < 1e-9, got: es + ' / ' + sh, want: '193 / 100' });
      out.push({ name: 'modell: vagyontalanok ≥ I. osztály (Cicero)', ok: num(CLS_M.prol) >= num(CLS_M.c1), got: num(CLS_M.prol), want: '≥ ' + num(CLS_M.c1) });
      if (L.step === 1 && G2 && eqVal(L.st) < .01 && S2.mode) {
        const vs = voteState(L.st); let y = 0, n = 0; G2.seats.forEach((q) => { if (q.id && q.id.endsWith(':y')) y++; if (q.id && q.id.endsWith(':n')) n++; });
        out.push({ name: 'patkó = számolt szavazat', ok: y === vs.y && n === vs.n, got: y + '/' + n, want: vs.y + '/' + vs.n });
      }
      const g = dat('Augustus halála').a - dat('Caesar halála').a;
      out.push({ name: 'Caesar halála → Augustus halála ≈ 57 év', ok: g > 57 && g < 58.5, got: g.toFixed(2), want: '57,4' });
      const r = censV('census Kr. e. 28') / censV('census Kr. e. 70');
      out.push({ name: 'census-ugrás ≈ 4,5×', ok: r > 4.3 && r < 4.6, got: r.toFixed(2), want: '≈ 4,49' });
      out.push({ name: 'census nő (Res Gestae 8)', ok: censV(CENS[1]) < censV(CENS[2]) && censV(CENS[2]) < censV(CENS[3]), got: CENS.map(censV).join(' < '), want: 'növekvő' });
      const dict = dat('Sulla dictator').a - dat('utolsó dictator Sulla előtt').a;
      out.push({ name: 'dictator nélkül 120 év', ok: dict === 120, got: dict, want: 120 });
      return out;
    };
  },
  draw(Lx) {
    L = Lx; c = L.ctx; GA = 1; paper();
    const sp = L.sp, wt = (i) => clamp(1 - Math.abs(sp - i) * 2);
    sT[L.step] = L.st;
    for (let i = 0; i < SCENES.length; i++) { const w = wt(i); if (w > .005) SCENES[i](sT[i], w, L.step === i); }
    c.globalAlpha = 1;
  },
});
})();
