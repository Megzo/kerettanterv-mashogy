/* ── MODUL: „Tippelj!” és bélyegek (TtTipp) · forrás: termeszettudomany-5-6/01-tocsa + 03-meres, egységesítve 2026-11-24 ── */
/* A természettudomány 5–6. sorozat közös mintái (szerződés 17.): kísérlet-/modellbélyeg és a „Tippelj! → kísérlet →
   magyarázat” jóslat. Csak a Lesson motorra épül (L.ctx, L.tx, L.pill, L.lab, L.button, L.controlsEl, L.panel, L.st,
   Lesson.U, Lesson.FONTS); a lecke kódjára nem hivatkozik. A panel elmosásához szükséges CSS-t (.tt-rejtett) és a
   letiltott csúszka halványítását a modul maga teszi a <head>-be – a leckében nem kell <style>-sor.

   BEKÖTÉS (a lecke kódjában, egyszer, legfelső szinten – a getterek miatt a sorrend mindegy):
     TtTipp.bind({ L: () => L, ga: () => GA });    // ga: a lecke alap-alfája (jelenet-áttűnés); alap: () => 1
     const { stamp, Tip, tipReset, panelVeil, veilIf, tipGuess, tipHide, tipControls, tipU, rhythm, tipHead, tipRow,
       tipFeedback } = TtTipp;
   ALFA: minden rajzoló a globalAlpha-t ga() · a (· belső áttűnés) értékre ÁLLÍTJA (nem szoroz a pillanatnyival, így
   egy korábbi halvány felirat nem tünteti el), a vonalstílust (lineCap/lineJoin/setLineDash) visszaállítja.

   stamp(kind, x, y, a, o) → doboz | null       kísérlet-/modellbélyeg a KemGHS.stamp stílusával (Bricolage 22 px,
        600, betűköz 0,08 em, −3°, papír alap, 2 px keret; 'tilos': 700, 3 px). (x, y): a bal szél közepe.
        Szöveg: az o.k || '<kind> bélyeg' .md-kulcs. Szín (STAMP): otthon kékeszöld, felnőtt okker, tilos #b3261e;
        tanári, modell, kitalált, nem méretarányos, sematikus, vázlatos, képzeletbeli (és minden más) halvány tinta.
        o = {k, col (szín felülírása), rot: −3 (fok), al: 'left' (igazítás)}. a ≤ 0,005 → nem rajzol.
   Tip(keys, ok) → P      jóslat-állapot. keys: a válaszok .md-kulcsai (egyben gombfeliratok), ok: a helyes kulcs (az
        init-ben is beállítható: P.ok = …). P = {keys, ok, guess: null | kulcs, gt: a választás L.st-je, btns, on}.
        P.on(k): választáskor hívódik (a lecke állítja, pl. a kísérlet vezérlőinek feloldására).
   tipReset(P)            alaphelyzet (az enter()-ben; utána veilIf(P)).
   panelVeil(on)          a panelszöveg 2. bekezdésétől (.lp-text > *, i > 0) elmos (on) / felold.
   veilIf(P)              panelVeil(!P.guess) – az enter()-ben a tipReset után.
   tipControls(P)         a tippgombok (L.button, P.keys sorrendben). A választás után csak ezek tűnnek el: a
        sorukba utána tett más gombok maradnak (ha a sorban nem marad látható gomb, a sor is eltűnik).
   tipGuess(P, k, gt)     választás (csak az első számít): P.guess = k, P.gt = gt ?? L.st, tipHide, panelVeil(false),
        P.on(k). A QA-állapotok is ezt hívhatják (pl. gt = L.st − 30: a kísérlet már lefutott).
   tipHide(P)             a tippgombok elrejtése (a tipGuess hívja; QA-állapotban kézzel is).
   tipU(P, st) → mp       a választás óta eltelt idő (st − P.gt), −1, ha még nincs tipp.
   rhythm(ph, a)          a „Tippelj! → kísérlet → magyarázat” sáv a vászon bal felső sarkában (x 40, y 46);
        ph: 0 / 1 / 2 az aktív szakasz.
   tipHead(P, st, a, qk, o) → y     fejléc: sáv + kérdés (qk, (40, 116), Fraunces 38, max 1280) + válaszsor (40, y).
        o = {tExp: 4,5 (a kísérlet hossza mp-ben: ennyi után vált a sáv „magyarázat”-ra, és mutatja a helyes
        választ), q2 (2. kérdéssor kulcsa, (40, 162); a válaszsor 46 px-szel lejjebb kerül), qv (a kérdés #-jeleinek
        értékei, sorban), y: 178 (a válaszsor közepe), noRhythm (a sáv nélkül – pl. olvasási kérdésnél)}.
        Visszaad: a válaszsor y-ja.
   tipRow(P, st, a, x, y, o) → [dobozok]    csak a válaszsor (a tipHead is ezt rajzolja), bárhová: a választásig
        semleges; a választott cinóber keretet és alatta „a te tipped” feliratot kap; o.tExp (0) mp múlva a helyes
        zöld keretet + pipát kap, a többi elhalványul. Dobozköz 54 px (a pipának).
   tipFeedback(P, st, a, x, y, o) → doboz | null    „Jó tipp!” (zöld) / „Sokan gondolják így – nézzük meg!”
        (kékeszöld) pill (x: bal szél, y: közép), a választás után 0,15 mp-cel beúszva. o = {s: 24, al: 'left', max}.
   .md-kulcsok (### Feliratok): tippelj felirat, kísérlet felirat, magyarázat felirat, a te tipped felirat, jó tipp
        felirat, rossz tipp felirat; a bélyegeké '<kind> bélyeg'.
   ──────────────────────────────────────────────────────────────────────────────────────────────────────── */

  'use strict';
  const U = Lesson.U, F = Lesson.FONTS, { clamp, lerp, smooth } = U;
  const INK = '#1c2440', MUT = '#565d72', RED = '#c8401c', TEAL = '#0a6f86', GOOD = '#1d7a45', BAD = '#b3261e', OKR = '#8f5a0c', CARD = '#fffaf1';
  const STAMP = { otthon: TEAL, felnőtt: OKR, tilos: BAD, tanári: MUT, modell: MUT, kitalált: MUT, 'nem méretarányos': MUT, sematikus: MUT, vázlatos: MUT, képzeletbeli: MUT };
  const KEYS = { ph: ['tippelj felirat', 'kísérlet felirat', 'magyarázat felirat'], mine: 'a te tipped felirat', ok: 'jó tipp felirat', bad: 'rossz tipp felirat' };
  let getL = () => null, ga = () => 1;
  if (typeof document !== 'undefined' && !document.getElementById('tt-tipp-css')) {
    const st = document.createElement('style'); st.id = 'tt-tipp-css';
    st.textContent = '.lp-text > .tt-rejtett { filter: blur(7px); opacity: .5; user-select: none; transition: filter .6s, opacity .6s; }\n'

/* időbeli áttűnés: frames = [[y0, y1, darabok | null], …]; y0..y1 között teljes, a köztes években keverve */
function framesAt(frames, y) {
  const outI = [];
  const push = (sh, a) => { if (sh && a > .003) for (const it of sh) outI.push(Object.assign({}, it, { a })); };
  if (y < frames[0][0]) return outI;
  for (let i = 0; i < frames.length; i++) {
    const f = frames[i], n = frames[i + 1];
    if (y <= f[1]) { push(f[2], 1); return outI; }
    if (n && y < n[0]) { const u = smooth((y - f[1]) / (n[0] - f[1])); push(f[2], 1 - u); push(n[2], u); return outI; }
  }
  push(frames[frames.length - 1][2], 1); return outI;
}

function scene7(st, w) {

  onMap(w, () => {
    const lb = [];
    ARABA.forEach((q) => {
      const [y0, y1] = arabY(q), pr = clamp((y - y0) / Math.max(.5, y1 - y0));
      if (pr <= 0) return;
      al(1); const h = MAP.line(c, q.pts, { p: pr, color: CAL, w: 4.5, head: true, halo: true });
      if (h && q.k) lb.push({ id: 's7.' + q.id, x: h.x, y: h.y, s: lab(q.k) + ' ' + yr(q.y), k: [q.k, q.y], r: 9, size: 22, w: 700, c: INK, a: smooth(pr * 3), pri: 3 });

      lb.push({ id: 's7.' + id, lon: d.lon, lat: d.lat, s: tpl(tk, yr(yk), yr(yk2)), k: [tk, yk, yk2, ck], sub: lab(sk), sk, dot: true, r: 9, dotC: INK, size: 24, w: 800, a, pri: 9, dirs: o.dirs });
    };
    mk('Konst', 'Konstantinápoly helye', 'Konstantinápoly ostromának kezdete', 'Konstantinápoly ostromának vége', 'm Konst', 'm Konst sub', { dirs: ['N', 'NE', 'NW'] });
    mk('Poit', 'Poitiers helye', 'poitiers-i csata', 'poitiers-i csata másik datálás', 'm Poitiers', 'm Poitiers sub', { dirs: ['E', 'NE', 'SE', 'N'] });

    const placed = mlabels(lb, AV7);
    const pb = placed.find((q) => q.id === 's7.Poit'), pa = smooth((y - yr('poitiers-i csata') + 2) / 2) * p(.2);

  });

const M9 = { kalifátus: { line: 'kalifátus', a: 632, b: 720, bk: 'gomb m kalifátus', lk: 'l kalifátus' }, Róma: { line: 'Róma', a: -50, b: 117, bk: 'gomb m Róma', lk: 'l Róma' },

  const y0 = S.y[S.x.indexOf(x0)], y1 = S.y[S.x.indexOf(x1)], n = span(x0, x1), rate = n ? (y1 - y0) * 1e6 / n : 0;
  return { x0, x1, y0, y1, n, rate, hu: rate / num('mai Magyarország területe') };
}
function setMeter(id, t) { S9.cur = id; S9.a = M9[id].a; S9.b = M9[id].b; S9.t = t; if (SL9a) SL9a.set(S9.a); if (SL9b) SL9b.set(S9.b); }

function scene9(st, w) {
  GA = w;
  const p = (t) => out(clamp((st - t) / .6)), C = C9, m = meter(), q = M9[S9.cur], col = LN(q.line).c;
  al(p(0)); T('c9 cím', 40, 52, { f: F.D, s: 32, w: 600, b: 'middle' });

  const ids = ['Róma', 'Nyugat', 'Bizánc', 'hun', 'kalifátus', 'frank', 'német'];
  romeLinks(C, p(.2), 1e9);
  ids.forEach((id, i) => drawSeries(C, id, { a: p(.2 + i * .1) * (LN(id).id === q.line ? 1 : .55), r: 4, w: LN(id).id === q.line ? 4.5 : 3 }));
  endLabels(C, ids.filter((id) => id !== 'Nyugat'), p(.9), 1e9);
  // a két tű

  [[m.x0, m.y0], [m.x1, m.y1]].forEach(([x, y], i) => {
    al(ma); c.strokeStyle = col; c.lineWidth = 2.5; c.setLineDash([6, 5]); c.beginPath(); c.moveTo(C.X(x), C.Y(y)); c.lineTo(C.X(x), C.y + C.h); c.stroke(); c.setLineDash([]);
    al(ma); c.beginPath(); c.arc(C.X(x), C.Y(y), 10, 0, TAU); c.fillStyle = col; c.fill(); c.strokeStyle = CARD; c.lineWidth = 3; c.stroke();
  });
  if (m.n) { al(ma); c.strokeStyle = col; c.lineWidth = 3; c.beginPath(); c.moveTo(C.X(m.x0), C.Y(m.y0)); c.lineTo(C.X(m.x1), C.Y(m.y1)); c.stroke(); }
  // mérő-kártya
  const rows = [{ s: tpl('m sablon', lab(q.lk), yStr(m.x0), yStr(m.x1)), k: ['m sablon', q.lk, LN(q.line).k], s2: 24, b: true, c: col }];

    rows.push({ s: tpl('m nő', m.n, fA(m.y0), fA(m.y1)), k: ['m nő', LN(q.line).k], s2: 22 });
    const r = Math.abs(m.rate) / 1000;

    else rows.push({ s: tpl('m csökken', fmt(r, r < 10 ? 1 : 0)), k: ['m csökken'], s2: 22, b: true });
  }
  infoCard(40, 640, 640, K('m cím'), rows, p(1.2), { ts: 26 });
  // meddig tartott?
  const D = [['d nyugat', 'Theodosius halála', 'Romulus Augustulus letétele'], ['d kelet', 'Theodosius halála', 'Konstantinápoly eleste'], ['d hun', 'Attila halála', 'hun uralom vége'], ['d omajjád', 'Omajjádok kezdete', 'Abbászidák hatalomra jutása']];
  const da = p(1.8), dh = 70 + D.length * 40;
  soft(720, 640, 620, dh, da);
  al(da); T('d cím', 740, 684, { f: F.D, s: 26, w: 600 });
  D.forEach(([k, a, b], i) => {

    al(da); L.tx(tpl('d sablon', va, vb, span(va, vb)), 1320, yy, { k: ['d sablon', a, b], f: F.M, s: 22, w: 600, c: MUT, a: 'right' });
  });
  // tévhitek

  MYTHS.forEach((k, i) => myth(k, 40 + (i % 2) * 660, 940 + Math.floor(i / 2) * 50, p(2.8 + i * .15), smooth((st - 3.4 - i * .15) / .5), { s: 22, max: 640, b: 'middle' }));

    C12 = FoldChart.create(L, { x: 110, y: 690, w: 1050, h: 220, xs: xs(-100, 600, [-100, 1, 100, 200, 300, 400, 500, 600]), ys: { min: 0, max: 6, step: 2, fmt: (v) => fmt(v) } });
    C3 = FoldChart.create(L, { x: 110, y: 690, w: 600, h: 220, xs: xs(395, 480, [400, 420, 440, 460, 480]), ys: { min: 0, max: 6, step: 2, fmt: (v) => fmt(v) } });
    C6 = FoldChart.create(L, { x: 110, y: 330, w: 680, h: 470, xs: xs(-100, 1000, [-100, 1, 200, 400, 600, 800, 1000]), ys: { min: 0, max: 12, step: 2, fmt: (v) => fmt(v) } });
    C7 = FoldChart.create(L, { x: 110, y: 690, w: 480, h: 220, xs: xs(600, 800, [600, 650, 700, 750, 800]), ys: { min: 0, max: 12, step: 4, fmt: (v) => fmt(v) } });
    C8 = FoldChart.create(L, { x: 110, y: 690, w: 480, h: 220, xs: xs(450, 1100, [500, 700, 900]), ys: { min: 0, max: 12, step: 4, fmt: (v) => fmt(v) } });
    C9 = FoldChart.create(L, { x: 110, y: 130, w: 1050, h: 400, xs: xs(-100, 1050, [-100, 1, 200, 400, 600, 800, 1000]), ys: { min: 0, max: 12, step: 2, fmt: (v) => fmt(v) } });

      const save = Object.assign({}, S9); setMeter('kalifátus', -9); const m = meter();
      o.push({ name: 'mérő: kalifátus 632 → 720: 88 év, kb. 102 ezer km²/év, kb. 1,1 Magyarország', ok: m.n === 88 && Math.round(m.rate / 1000) === 102 && Math.abs(m.hu - 1.1) < .05, got: m.n + ' / ' + Math.round(m.rate) + ' / ' + m.hu.toFixed(2), want: '88 / 102273 / 1,10' });

})();
