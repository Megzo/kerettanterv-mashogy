  'use strict';

      + '.lp-slider:has(input:disabled) { opacity: .45; }\n.lp-slider input:disabled { cursor: not-allowed; }';

  function bind(o = {}) { if (o.L) getL = o.L; if (o.ga) ga = o.ga; }
  function stamp(kind, x, y, a, o = {}) {
    if (a <= .005) return null;

    rows.forEach((r) => { if (![...r.children].some((e) => e.style.display !== 'none')) r.style.display = 'none'; });

      al(a * (P.guess && !mine && !ok ? lerp(1, .55, rev) : 1));
      const b = L.pill(lab(k), x, y, { k, s: 26, w: 600, f: F.B, c: INK, bg: g > .5 ? '#eef6ee' : CARD, bd: g > .5 ? GOOD : 'rgba(28,36,64,.35)', bw: g > .5 ? 3 : 2, pad: 14 });
      if (mine) {
        al(a * smooth(u / .3)); rr(c, b.x - 6, b.y - 6, b.w + 12, b.h + 12, (b.h + 12) / 2); c.strokeStyle = RED; c.lineWidth = 3.5; c.stroke();
        L.tx(lab(KEYS.mine), b.x + b.w / 2, b.y + b.h + 30, { k: KEYS.mine, s: 22, w: 700, f: F.B, c: RED, a: 'center' });
      }
      if (g > 0) check(b.x + b.w + 24, y, a * g);

    if (!P.guess) return null;

})();

/* ── MODUL: Időszalag (TortTimeline) ──────────────────────────────────────────────
   B modul (pilot/tortenelem-5-6/terv.md, 5. fejezet). Referencia: 01-idoszamitas.
   Később változtatás nélkül átemelhető: shared/tort/timeline.js. Csak a Lesson motorra épül
   (L.ctx, L.tx, L.pill, L.measure, L.pointer, L.stage, L.toStage, L.t, L.VW).

   IDŐ-KOORDINÁTA (u): folytonos, csillagászati években. Az „a” csillagászati év
   (Kr. e. 1 = 0, Kr. e. 753 = −752, Kr. u. 476 = 476 – ez a build `L.dat(k).a` mezője) az

   TortTimeline.Y – évszám-aritmetika (tiszta függvények; T = szövegek, lent):

     Y.range(a0, a1, T)   'Kr. e. 7–4' · '1914–1918' · 'Kr. e. 4 – Kr. u. 30'

const TortTimeline = (() => {
  const F = Lesson.FONTS, U = Lesson.U, NB = ' ', MINUS = '−', TAU = Math.PI * 2;
  const INK = '#1c2440', MUT = '#565d72', RED = '#c8401c', CARD = '#fffaf1', OCHRE = '#8f5a0c';
  const TF = { f: F.B, s: 22, w: 500 };
  const STEPS = [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000, 2000, 5000, 10000, 20000];

  const Y = {
    astro: (v) => (v < 0 ? v + 1 : v),
    hist: (a) => (a <= 0 ? a - 1 : a),
    u: (d) => (typeof d === 'number' ? d + .5 : d.t === 'date' ? d.a : d.a + .5),
    year: (u) => Math.floor(u),
    num: (a) => (a <= 0 ? 1 - a : a),
    label: (a, T, ad) => (a <= 0 ? T.bc.s + NB + (1 - a) : (ad ? T.ad.s + NB : '') + a),
    key: (a, T, ad) => (a <= 0 ? T.bc.k : ad ? T.ad.k : null),
    range: (a0, a1, T) => {
      if (a0 > a1) [a0, a1] = [a1, a0];
      if (a1 <= 0) return T.bc.s + NB + (1 - a0) + '–' + (1 - a1);
      if (a0 >= 1) return a0 + '–' + a1;
      return Y.label(a0, T) + ' – ' + Y.label(a1, T, true);
    },
    elapsed: (a1, a2) => a2 - a1,
    formula: (a1, a2) => {
      const lo = Math.min(a1, a2), hi = Math.max(a1, a2), e = hi - lo;
      if (hi <= 0) return `${1 - lo} ${MINUS} ${1 - hi} = ${e}`;
      if (lo >= 1) return `${hi} ${MINUS} ${lo} = ${e}`;
      return `${1 - lo} + ${hi} ${MINUS} 1 = ${e}`;
    },
    century: (a) => (a >= 1 ? { n: Math.ceil(a / 100), bc: false } : { n: Math.ceil((1 - a) / 100), bc: true }),
    centurySpan: (n, bc) => (bc ? [1 - 100 * n, 101 - 100 * n] : [100 * n - 99, 100 * n + 1]),
    centuryLabel: (a, T, short) => { const c = Y.century(a); return (c.bc ? T.bc.s + NB : '') + c.n + '.' + (short ? '' : NB + T.cent.s); },
    centuryKeys: (a, T) => (Y.century(a).bc ? [T.cent.k, T.bc.k] : [T.cent.k]),
    centuryRule: (a) => {
      const y = Y.num(a), n = Y.century(a).n, h = Math.floor(y / 100), t = y % 100;
      return t === 0 ? `${h}|00 → ${n}` : `${h}|${String(t).padStart(2, '0')} → ${h} + 1 = ${n}`;
    },
    lerpView: (v0, v1, t) => {
      const s0 = v0[1] - v0[0], s1 = v1[1] - v1[0], c0 = (v0[0] + v0[1]) / 2, c1 = (v1[0] + v1[1]) / 2;
      const s = Math.exp(U.lerp(Math.log(s0), Math.log(s1), t));
      const k = Math.abs(Math.log(s1 / s0)) > .25 ? (s - s0) / (s1 - s0) : t;
      const m = U.lerp(c0, c1, k);
      return [m - s / 2, m + s / 2];
    },
  };

  function create(L, o) {
    const T = o.T;
    const tl = { o, T, src: o.src || null, x0: o.x0, x1: o.x1, y: o.y, h: o.h || 64, pins: [], user: null, drag: null,
      bounds: o.bounds || [-1e6, 1e6], minSpan: o.minSpan || 4, maxSpan: o.maxSpan || 1e5, epoch: o.epoch == null ? null : o.epoch };
    tl.top = tl.y - tl.h / 2; tl.bot = tl.y + tl.h / 2;

    /* azok a csillagászati évek, amelyek kiírt száma a lépésköz többszöröse (a szalag közepén: a + 0,5) */
    function yearsAt(step) {
      const out = [];
      if (tl.epoch != null) {
        const e = tl.epoch;
        for (let n = Math.max(step, Math.ceil((tl.u0 - e + .5) / step) * step); e + n - .5 <= tl.u1; n += step) out.push(e + n - 1);

  al(p(1.4)); T('p kattints', 40, 1030, { s: 22, w: 600, c: MUT, i: true });
  // könyvek
  const X = 890, W = 450;
  al(p(.8)); T('kv cím', X, 112, { f: F.D, s: 28, w: 600, b: 'middle' });
  let y = 150;
  BOOKS.forEach(([k, d, f], i) => {
    const a = p(1.0 + i * .25);
    const r = infoCard(X, y, W, null, [{ s: yr(d) + ' · ' + lab('kv ' + k), k: ['kv ' + k, d], s2: 23, b: true }, { s: lab('kv ' + k + ' sub'), k: 'kv ' + k + ' sub', s2: 22, c: MUT }], a, { pad: 14, bd: FC[f], bw: 2.2 });
    mark(f, X + W - 22, y + 22, 9, a);
    y += r.h + 12;
  });
  myth('t8 tévhit', 40, 944, p(2.6), smooth((st - 3.2) / .6), { s: 22 });
}

/* ════════ 9. Összefoglalás ════════ */
let TL9 = null;
const SUM = [
  ['1517', 'tételek napja', 0], ['1521', 'wormsi birodalmi gyűlés', 1], ['1530', 'augsburgi hitvallás', 2], ['1534', 'anglikán egyház', 3], ['1541', 'Kálvin Genfben', 4],
  ['1545', 'tridenti zsinat kezdete', 0], ['1555', 'augsburgi vallásbéke', 1], ['1568', 'tordai országgyűlés', 2], ['1572', 'Szent Bertalan-éj', 0],
  ['1590', 'Vizsolyi Biblia', 3], ['1598', 'nantes-i ediktum', 1], ['1618', 'harmincéves háború kezdete', 0], ['1635', 'nagyszombati egyetem', 2], ['1648', 'vesztfáliai béke', 1],
];
function scene9(st, w) {
  GA = w;
  const p = (t) => out(clamp((st - t) / .6)), tl = TL9;
  head('c9 cím', p(0));
  tl.view(1508, 1658);
  c.globalAlpha = 1; tl.draw({ a: p(.1) * GA });
  const items = SUM.map(([id, d, row], i) => ({ u: TortTimeline.Y.u(dat(d)), title: K('ö ' + id), date: { s: yr(d), k: d }, row, layer: null, hi: id === '1648' || id === '1568', a: p(.5 + i * .12) * GA }));
  items.sort((a, b) => b.row - a.row);
  c.globalAlpha = 1; tl.cards(items, { pitch: 92 });
  // Vesztfália
  const va = p(2.4), vy = 770;
  al(va); const b0 = L.pill(lab('ö vesztf') + ' · ' + val('vesztfáliai béke'), 40, vy, { k: ['ö vesztf', 'vesztfáliai béke'], s: 24, w: 700, b: 'middle', c: CARD, bg: TEAL, pad: 10, r: 8 });
  al(va); const b1 = L.tx(lab('ö vesztf 1'), b0.x + b0.w + 18, vy, { k: 'ö vesztf 1', s: 24, w: 600, b: 'middle', c: INK });
  al(va); L.tx(tpl('ö vesztf 2', yr('normálév')), 40, vy + 42, { k: ['ö vesztf 2', 'normálév'], s: 22, w: 500, b: 'middle', c: MUT });
  // tévhitek
  al(p(3)); T('ö tévhitek', 40, 870, { f: F.D, s: 26, w: 600, b: 'middle' });
  let mx = 40, my = 920;
  ['m tévhit', 't6 tévhit', 'ö tévhit egy', 't7 tévhit', 't8 tévhit'].forEach((k, i) => {
    const w = L.measure(lab(k), { s: 22, w: 600, f: F.D, i: true }).w + 24;
    if (mx > 40 && mx + w > 1340) { mx = 40; my += 50; }
    myth(k, mx, my, p(3.2 + i * .15), smooth((st - 3.8 - i * .15) / .5), { s: 22 });
    mx += w + 20;
  });

}

/* ════════ lépések ════════ */
const sT = new Array(9).fill(0);
const STEPS = [
  { settle: 4.6 },
  { settle: 4.0, enter() { S2.sel = '1521'; S2.selT = -9; } },
  { settle: 3.4, enter() { S3.cur = 'kat'; S3.prev = 'kat'; S3.t0 = -9; },
    controls(L) { CH.forEach((f) => L.button(lab('gomb ' + f), () => pick3(f, L.st), 'gomb ' + f)); } },
  { settle: 3.0, enter() { S4.view = 'E'; S4.from = 'E'; S4.t0 = -9; S4.hl = null; S4.prevHl = null; S4.hlT = -9; },
    controls(L) { L.button(lab('gomb Európa'), () => go4('E', L.st), 'gomb Európa'); L.button(lab('gomb Kárpát'), () => go4('K', L.st), 'gomb Kárpát'); } },
  { settle: 3.0, enter() { tipReset(P5); veilIf(P5); resetM('A'); },
    controls(L) { tipControls(P5); } },
  { settle: 3.4, enter() { resetM('T'); },
    controls(L) {
      L.button(lab('gomb Torda'), () => { if (M.mode !== 'T') setM({ mode: 'T', show: true }); }, 'gomb Torda');
      L.button(lab('gomb Augsburg'), () => { if (M.mode !== 'A') setM({ mode: 'A', show: true }); }, 'gomb Augsburg');
    } },
  { settle: 4.2, enter() { S7.sel = null; S7.selT = -9; } },
  { settle: 4.0, enter() { S8.sel = 'Sárospatak'; S8.selT = -9; } },
  { settle: 5.2 },
];
P5.on = () => { setM({ show: true }, P5.gt); };
const SCENES = [scene1, scene2, scene3, scene4, scene5, scene6, scene7, scene8, scene9];

/* ── QA: szélső állapotok ── */
window.__qaStates = {
  2: [{ name: 'Kálvin-Genf', set(L) { S2.sel = '1541'; S2.selT = L.st - 2; } }, { name: 'lemondás', set(L) { S2.sel = '1556'; S2.selT = L.st - 2; } },
    { name: 'tetelek', set(L) { S2.sel = '1517'; S2.selT = L.st - 2; } }],
  3: [{ name: 'evangelikus', set(L) { pick3('ev', L.st - 3); } }, { name: 'reformatus', set(L) { pick3('ref', L.st - 3); } }, { name: 'unitarius', set(L) { pick3('unit', L.st - 3); } },
    { name: 'atmenet', set(L) { pick3('ref', L.st - .4); } }],
  4: [{ name: 'karpat', set(L) { go4('K', L.st - 3); } }, { name: 'karpat-unitarius', set(L) { go4('K', L.st - 3); hl4('unit', L.st - 2); } },
    { name: 'europa-reformatus', set(L) { hl4('ref', L.st - 2); } }, { name: 'zoom-kozben', set(L) { go4('K', L.st - .8); } }],
  5: [{ name: 'tipp-jo-ev', set(L) { tipGuess(P5, 'tipp kivándorol', L.st - 4); } }, { name: 'tipp-rossz-kat', set(L) { tipGuess(P5, 'tipp szabad', L.st - 6); setM({ ruler: 'kat' }, L.st - 3); } },
    { name: 'mozgas-kozben', set(L) { tipGuess(P5, 'tipp semmit', L.st - .9); } }],
  6: [{ name: 'augsburg-ev', set(L) { setM({ mode: 'A', show: true }, L.st - 3); } }, { name: 'augsburg-kat', set(L) { M.mode = 'A'; M.show = true; setM({ ruler: 'kat' }, L.st - 3); } },
    { name: 'torda-atmenet', set(L) { M.mode = 'A'; M.show = true; setM({ mode: 'T' }, L.st - .9); } }],
  7: [{ name: 'voluta', set(L) { S7.sel = 'voluta'; S7.selT = L.st - 2; } }, { name: 'orom', set(L) { S7.sel = 'orom'; S7.selT = L.st - 2; } }, { name: 'kapu', set(L) { S7.sel = 'kapu'; S7.selT = L.st - 2; } },
    { name: 'tengely', set(L) { S7.sel = 'tengely'; S7.selT = L.st - 2; } }, { name: 'fulke', set(L) { S7.sel = 'fülke'; S7.selT = L.st - 2; } }],
  8: [{ name: 'Kolozsvar', set(L) { S8.sel = 'Kolozsvár'; S8.selT = L.st - 2; } }, { name: 'Nagyszombat', set(L) { S8.sel = 'Nagyszombat'; S8.selT = L.st - 2; } },
    { name: 'Bartfa', set(L) { S8.sel = 'Bártfa'; S8.selT = L.st - 2; } }, { name: 'Fehervar', set(L) { S8.sel = 'Fehérvár'; S8.selT = L.st - 2; } }],
};

L = Lesson.create({
  resetCtx: true,
  content: window.LESSON_CONTENT,
  home: false,
  steps: STEPS,
  idle: (Lx) => Lx.step !== 3 || Lx.st >= S4.t0 + 1.7,
  init(Lx) {
    L = Lx; c = L.ctx;
    SRC = TortSource.create(L, { 'forrás': K('forrás jel'), 'rekonstrukció': K('rekonstrukció jel'), 'monda': K('monda jel'), 'becslés': K('becslés'), 'vázlatos': K('vázlatos'), 'illusztráció': K('illusztráció') });
    TT = { bc: K('Kr. e.'), ad: K('Kr. u.'), cent: K('század'), years: K('év sablon') };
    MAP = TortMap.create({ proj: PRE, layers: [{ data: window.TORT_MAP_VILAG }, { data: window.TORT_MAP_EUROPA }, { data: window.TORT_MAP_KARPAT, fade: [3500, 6000] }], ancient: true, rect: [0, 0, 1360, 1080] });
    VW.e = TortProj.fit(PRE, [-10, 35.5, 42, 63], [330, 40, 1010, 1000], 0);
    VW.k = TortProj.fit(PRE, [15.2, 44.4, 27, 49.8], R4, 0);
    VW.k8 = TortProj.fit(PRE, [15.9, 44.7, 26.6, 49.9], R8, 0);
    buildState3();
    resetM('A');
    TL9 = TortTimeline.create(L, { x0: 60, x1: 1320, y: 640, h: 52, T: TT, src: SRC, bounds: [1450, 1700] });
    L.checks = () => {
      const res = [];
      const tot = VIL.reduce((s, h) => s + h.length, 0);
      res.push({ name: 'falvak × háztartás = .md', ok: VIL.length === num('falvak száma') && VIL.every((h) => h.length === num('háztartás falvanként')), got: VIL.length + '×' + VIL[0].length, want: num('falvak száma') + '×' + num('háztartás falvanként') });
      ['kat', 'ev'].forEach((r) => {
        const F2 = fates({ mode: 'A', ruler: r, show: true });
        const nonm = VIL.flat().filter((f) => f !== r).length;
        res.push({ name: 'Augsburg (' + r + '): marad + áttér + kivándorol = ' + tot, ok: F2.cnt.marad + F2.cnt.áttér + F2.cnt.kivándorol === tot && F2.cnt.marad === tot - nonm, got: JSON.stringify(F2.cnt), want: tot });
        [G5, G6].forEach((G, gi) => {
          const cap = G.cols * G.rows;
          res.push({ name: 'a kivándorlók elférnek (' + r + ', ' + (gi + 5) + '. lépés)', ok: F2.cnt.kivándorol <= cap, got: F2.cnt.kivándorol, want: '≤ ' + cap });
        });
      });
      const T2 = fates({ mode: 'T', ruler: 'ev', show: true });
      res.push({ name: 'Torda: senki nem költözik', ok: T2.cnt.kivándorol === 0 && T2.cnt.áttér === 0, got: JSON.stringify(T2.cnt), want: 'csak marad' });
      const maj = VIL.map(majority);
      res.push({ name: 'Torda: az ortodox többségű falu tűrt (nem bevett)', ok: maj.filter((f) => !RECOG_T.includes(f)).length === 1 && maj[5] === 'ort', got: maj.join(','), want: '…,ort' });
      res.push({ name: 'Tippelj: a helyes válasz a kivándorlás', ok: P5.ok === 'tipp kivándorol', got: P5.ok, want: 'tipp kivándorol' });
      const gap = yA('Melanchthon beszámolója') - yA('tételek napja');
      res.push({ name: 'Melanchthon beszámolója 29 évvel a tételek után', ok: gap === 29, got: gap, want: 29 });
      res.push({ name: 'Trento: 1545–1563', ok: yA('tridenti zsinat kezdete') === 1545 && yA('tridenti zsinat vége') === 1563, got: yA('tridenti zsinat kezdete') + '–' + yA('tridenti zsinat vége'), want: '1545–1563' });
      const yrs = SUM.map(([, d]) => TortTimeline.Y.u(dat(d))), inc = yrs.every((u, i) => !i || u > yrs[i - 1]);
      res.push({ name: 'összefoglaló idővonal: időrendben, 14 esemény', ok: inc && SUM.length === 14, got: SUM.length, want: 14 });
      return res;
    };
  },
  draw(Lx) {
    L = Lx; c = L.ctx; GA = 1; paper();
    const sp = L.sp, wt = (i) => clamp(1 - Math.abs(sp - i) * 2);
    sT[L.step] = L.st;
    for (let i = 0; i < SCENES.length; i++) { const w = wt(i); if (w > .005) SCENES[i](sT[i], w, L.step === i); }
    c.globalAlpha = 1;
  },
});
})();
</script>
