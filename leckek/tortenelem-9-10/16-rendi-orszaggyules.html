<script>
/* ── MODUL: „Tippelj!” és bélyegek (TtTipp) · forrás: termeszettudomany-5-6/01-tocsa + 03-meres, egységesítve 2026-11-24 ── */
/* A természettudomány 5–6. sorozat közös mintái (szerződés 17.): kísérlet-/modellbélyeg és a „Tippelj! → kísérlet →
   magyarázat” jóslat. Csak a Lesson motorra épül (L.ctx, L.tx, L.pill, L.lab, L.button, L.controlsEl, L.panel, L.st,
   Lesson.U, Lesson.FONTS); a lecke kódjára nem hivatkozik. A panel elmosásához szükséges CSS-t (.tt-rejtett) és a
   letiltott csúszka halványítását a modul maga teszi a <head>-be – a leckében nem kell <style>-sor.

   BEKÖTÉS (a lecke kódjában, egyszer, legfelső szinten – a getterek miatt a sorrend mindegy):
     TtTipp.bind({ L: () => L, ga: () => GA });    // ga: a lecke alap-alfája (jelenet-áttűnés); alap: () => 1
     const { stamp, Tip, tipReset, panelVeil, veilIf, tipGuess, tipHide, tipControls, tipU, rhythm, tipHead, tipRow,
       tipFeedback } = TtTipp;
   ALFA: minden rajzoló a globalAlpha-t ga() · a (· belső áttűnés) értékre ÁLLÍTJA (nem szoroz a pillanatnyival, így
   egy korábbi halvány felirat nem tünteti el), a vonalstílust (lineCap/lineJoin/setLineDash) visszaállítja.

   stamp(kind, x, y, a, o) → doboz | null       kísérlet-/modellbélyeg a KemGHS.stamp stílusával (Bricolage 22 px,
        600, betűköz 0,08 em, −3°, papír alap, 2 px keret; 'tilos': 700, 3 px). (x, y): a bal szél közepe.
        Szöveg: az o.k || '<kind> bélyeg' .md-kulcs. Szín (STAMP): otthon kékeszöld, felnőtt okker, tilos #b3261e;
        tanári, modell, kitalált, nem méretarányos, sematikus, vázlatos, képzeletbeli (és minden más) halvány tinta.
        o = {k, col (szín felülírása), rot: −3 (fok), al: 'left' (igazítás)}. a ≤ 0,005 → nem rajzol.
   Tip(keys, ok) → P      jóslat-állapot. keys: a válaszok .md-kulcsai (egyben gombfeliratok), ok: a helyes kulcs (az
        init-ben is beállítható: P.ok = …). P = {keys, ok, guess: null | kulcs, gt: a választás L.st-je, btns, on}.
        P.on(k): választáskor hívódik (a lecke állítja, pl. a kísérlet vezérlőinek feloldására).
   tipReset(P)            alaphelyzet (az enter()-ben; utána veilIf(P)).
   panelVeil(on)          a panelszöveg 2. bekezdésétől (.lp-text > *, i > 0) elmos (on) / felold.
   veilIf(P)              panelVeil(!P.guess) – az enter()-ben a tipReset után.
   tipControls(P)         a tippgombok (L.button, P.keys sorrendben). A választás után csak ezek tűnnek el: a
        sorukba utána tett más gombok maradnak (ha a sorban nem marad látható gomb, a sor is eltűnik).
   tipGuess(P, k, gt)     választás (csak az első számít): P.guess = k, P.gt = gt ?? L.st, tipHide, panelVeil(false),
        P.on(k). A QA-állapotok is ezt hívhatják (pl. gt = L.st − 30: a kísérlet már lefutott).
   tipHide(P)             a tippgombok elrejtése (a tipGuess hívja; QA-állapotban kézzel is).
   tipU(P, st) → mp       a választás óta eltelt idő (st − P.gt), −1, ha még nincs tipp.
   rhythm(ph, a)          a „Tippelj! → kísérlet → magyarázat” sáv a vászon bal felső sarkában (x 40, y 46);
        ph: 0 / 1 / 2 az aktív szakasz.
   tipHead(P, st, a, qk, o) → y     fejléc: sáv + kérdés (qk, (40, 116), Fraunces 38, max 1280) + válaszsor (40, y).
        o = {tExp: 4,5 (a kísérlet hossza mp-ben: ennyi után vált a sáv „magyarázat”-ra, és mutatja a helyes
        választ), q2 (2. kérdéssor kulcsa, (40, 162); a válaszsor 46 px-szel lejjebb kerül), qv (a kérdés #-jeleinek
        értékei, sorban), y: 178 (a válaszsor közepe), noRhythm (a sáv nélkül – pl. olvasási kérdésnél)}.
        Visszaad: a válaszsor y-ja.
   tipRow(P, st, a, x, y, o) → [dobozok]    csak a válaszsor (a tipHead is ezt rajzolja), bárhová: a választásig
        semleges; a választott cinóber keretet és alatta „a te tipped” feliratot kap; o.tExp (0) mp múlva a helyes
        zöld keretet + pipát kap, a többi elhalványul. Dobozköz 54 px (a pipának).
   tipFeedback(P, st, a, x, y, o) → doboz | null    „Jó tipp!” (zöld) / „Sokan gondolják így – nézzük meg!”

      L.tx(q.title.s, x + pad + 84, y + pad + 64, { f: F.D, s: 36, w: 560, c: INK, k: q.title.k, max: w - pad * 2 - 84 });

/* ── MODUL: Kártyák (TortCards) ────────────────────────────────────────────────────
   G modul (pilot/tortenelem-5-6/terv.md, 5. fejezet): „húzd a helyére” – kártyák rendezése zónákba
   (pl. két oszlop: falu / város), azonnali visszajelzéssel. Referencia: 07-kozepkori-varos.
   Később változtatás nélkül átemelhető: shared/tort/cards.js. Csak a Lesson motorra épül
   (L.ctx, L.tx, L.measure, L.pointer, L.stage, L.st, L.VW).

   const g = TortCards.create(L, {
     zones: [{id, x, y, w, h, title: {s, k}, sub?: {s, k}, head?: 110}], // célterületek; head: a fejléc magassága
     cards: [{id, label: {s, k}, zone}],      // zone: a helyes zóna id-ja (a kódban rögzített megoldás)
     tray: {x, y, w, h, pad?: 24, top?: 56},  // a kártyák kiinduló helye: sorfolytonosan, soronként középre
     font?: {f, s, w},                        // kártyafelirat (alap: Bricolage 24 / 600)
     gap?: 14, ease?: .45,                    // térköz px; a mozgás hossza mp

   g.solve(t0?)               minden kártya a helyes zónába, kissé lépcsőzetesen

   g.score() → {ok, placed, total}   ·   g.touched: a felhasználó már húzott   ·   g.cards, g.zones

const TortCards = (() => {
  const F = Lesson.FONTS, U = Lesson.U;
  const INK = '#1c2440', MUT = '#565d72', CARD = '#fffaf1', GOOD = '#1d7a45', BAD = '#b3261e', RED = '#c8401c';

  function create(L, cfg) {
    const FT = Object.assign({ f: F.B, s: 24, w: 600 }, cfg.font || {});

    const zones = cfg.zones.map((z) => Object.assign({ head: 110 }, z));

    const g = { zones, cards, touched: false, drag: null, _pd: false, _ord: 0, _hov: null };

  const D = diets(), ty = 760, x0 = 80, x1 = 1180, XX = (y) => x0 + (y - 1824) / (1849 - 1824) * (x1 - x0);
  al(p(2.2)); c.strokeStyle = INK; c.lineWidth = 2.5; c.beginPath(); c.moveTo(x0, ty); c.lineTo(x1 + 30, ty); c.stroke();
  D.forEach(([a0, a1], i) => {
    const last = i === D.length - 1, a = p(2.3 + i * .12);
    al(a); rr(XX(a0), ty - 14, Math.max(16, XX(a1 + 1) - XX(a0)), 28, 6); c.fillStyle = last ? RED : U.rgba(OCHRE, .6); c.fill();
    al(a); L.tx(a0 === a1 ? String(a0) : a0 + '–' + String(a1).slice(2), (XX(a0) + XX(a1 + 1)) / 2, ty + 42 + (i % 2) * 30, { k: ['országgyűlések kezdete', 'országgyűlések vége'], f: F.M, s: 22, w: 700, a: 'center', b: 'middle', c: last ? RED : INK });
  });
  al(p(2.3)); L.tx(lab('idő országgyűlés'), x0, ty - 40, { k: 'idő országgyűlés', s: 22, w: 600, c: OCHRE, b: 'middle' });
  al(p(3)); L.pill(lab('kitekintés 9'), 1330, 900, { k: ['kitekintés 9', 'utolsó rendi országgyűlés'], s: 26, w: 700, a: 'right', c: TEAL, bg: CARD, bd: TEAL, bw: 2.5, pad: 12, r: 10 });
  { const ax = XX(1849) + 8, bx = 1290; al(p(3)); c.strokeStyle = RED; c.lineWidth = 3; c.beginPath(); c.moveTo(ax, ty); c.lineTo(bx - 14, ty); c.quadraticCurveTo(bx, ty, bx, ty + 14); c.lineTo(bx, 868); c.stroke();
    al(p(3)); c.fillStyle = RED; c.beginPath(); c.moveTo(bx - 8, 864); c.lineTo(bx + 8, 864); c.lineTo(bx, 876); c.closePath(); c.fill(); }
  if (!S9.col) { al(p(2) * (.6 + .4 * Math.sin(st * 3))); L.pill(lab('kattints 9'), 1330, 530, { k: 'kattints 9', s: 24, w: 700, a: 'right', c: RED, bg: CARD, bd: RED, bw: 2, pad: 10, r: 10 }); }
}

/* ════════ lépések ════════ */
const sT = new Array(9).fill(0);
const SL = {};
const STEPS = [
  { settle: 3.2, enter() { S1.sel = null; S1.selT = -9; } },
  { settle: 4.2 },
  { settle: 3.4, enter() { tipReset(P3); veilIf(P3); }, controls(L) { tipControls(P3); } },
  { settle: 9, enter() { S4.cs = 'ö'; S4.t0 = 0; },
    controls(L) { [['ö', 'gomb örökváltság'], ['k', 'gomb önkéntes'], ['a', 'gomb adó'], ['n', 'gomb nyelv']].forEach(([id, k]) => L.button(lab(k), () => { S4.cs = id; S4.t0 = L.st - .4; }, k)); } },
  { settle: 3.4, enter() { reset5(); },
    controls(L) {
      L.button(lab('gomb szept'), () => setMode5('szept'), 'gomb szept');
      L.button(lab('gomb dec'), () => setMode5('dec'), 'gomb dec');
      L.button(lab('gomb újra'), () => setMode5(S5.mode), 'gomb újra');
    } },
  { settle: 3.8, enter() { S6.kr = num('napszám kezdőértéke'); S6.crop = num('termés kezdőértéke'); S6.save = num('megtakarítás kezdőértéke'); },
    controls(L) {
      SL.kr = L.slider({ label: lab('csúszka napszám'), k: 'csúszka napszám', min: 8, max: 40, step: 1, value: num('napszám kezdőértéke'), format: (v) => tpl('egység kr', fmt(v)), onInput: (v) => { S6.kr = v; } });
      SL.crop = L.slider({ label: lab('csúszka termés'), k: 'csúszka termés', min: 40, max: 300, step: 10, value: num('termés kezdőértéke'), format: (v) => tpl('egység Ft', fmt(v)), onInput: (v) => { S6.crop = v; } });
      SL.save = L.slider({ label: lab('csúszka megtakarítás'), k: 'csúszka megtakarítás', min: 2, max: 60, step: 1, value: num('megtakarítás kezdőértéke'), format: (v) => tpl('egység Ft', fmt(v)), onInput: (v) => { S6.save = v; } });
    } },
  { settle: 2.6, enter() { CARDS7.reset(); CARDS7._okT = null; }, leave() { L.stage.style.cursor = ''; },
    controls(L) { L.button(lab('gomb megoldás'), () => CARDS7.solve(), 'gomb megoldás'); L.button(lab('gomb újrakezd'), () => { CARDS7.reset(); CARDS7._okT = null; }, 'gomb újrakezd'); } },
  { settle: 4.4, enter() { S8.v = 'magyar'; S8.vT = -9; } },
  { settle: 4, enter() { S9.col = null; S9.colT = -9; } },
];
const SCENES = [scene1, scene2, scene3, scene4, scene5, scene6, scene7, scene8, scene9];

/* ── QA: szélső állapotok ── */
window.__qaStates = {
  1: [{ name: 'uralkodó', set(L) { S1.sel = 'u'; S1.selT = L.st - 1; } }, { name: 'nádor', set(L) { S1.sel = 'n'; S1.selT = L.st - 1; } },
    { name: 'vármegyék', set(L) { S1.sel = 'v'; S1.selT = L.st - 1; } }, { name: 'Metternich', set(L) { S1.sel = 'm'; S1.selT = L.st - 1; } }],
  3: [{ name: 'tipp-jó', set(L) { tipGuess(P3, 'tipp3 egy', L.st - 6); } }, { name: 'tipp-rossz', set(L) { tipGuess(P3, 'tipp3 annyi', L.st - 6); } },
    { name: 'repül', set(L) { tipGuess(P3, 'tipp3 annyi', L.st - 1.4); } }],
  4: [{ name: 'önkéntes', set(L) { S4.cs = 'k'; S4.t0 = L.st - 12; } }, { name: 'adó', set(L) { S4.cs = 'a'; S4.t0 = L.st - 12; } },
    { name: 'nyelv', set(L) { S4.cs = 'n'; S4.t0 = L.st - 12; } }, { name: 'örökváltság-közben', set(L) { S4.cs = 'ö'; S4.t0 = L.st - 3.2; } }],
  5: [{ name: 'december', set(L) { setMode5('dec'); S5.t0 = L.st - 2; } },
    { name: 'átállít', set(L) { setMode5('dec'); ['Pest', 'Heves', 'Győr'].forEach((n) => { S5.flip[n] = true; }); S5.sel = 'Pest'; S5.selT = L.st - 1; S5.t0 = L.st - 2; } }],
  6: [{ name: 'olcsó', set(L) { SL.kr.set(8, { fire: true }); SL.crop.set(40, { fire: true }); SL.save.set(60, { fire: true }); } },
    { name: 'drága', set(L) { SL.kr.set(40, { fire: true }); SL.crop.set(300, { fire: true }); SL.save.set(2, { fire: true }); } }],
  7: [{ name: 'megoldva', set(L) { CARDS7.solve(L.st - 3); } }],
  8: [['horvát'], ['szlovák'], ['zsidó'], ['Széchenyi']].map(([v]) => ({ name: v, set(L) { S8.v = v; S8.vT = L.st - 1; } })),
  9: [{ name: 'ellenzék', set(L) { S9.col = 'e'; S9.colT = L.st - 1; } }, { name: 'udvar', set(L) { S9.col = 'u'; S9.colT = L.st - 1; } }],
};

L = Lesson.create({
  resetCtx: true,
  content: window.LESSON_CONTENT,
  home: false,
  steps: STEPS,
  init(Lx) {
    L = Lx; c = L.ctx;
    PAL5 = TortParl.palette(5, { tones: 5, pats: ['teli', 'csík', 'pötty', 'sraff', 'kockás'] });
    PAL3 = TortParl.palette(3, { tones: 3, pats: ['teli', 'gyűrű', 'sraff'] });
    SRC = TortSource.create(L, { 'forrás': K('forrás jel'), 'rekonstrukció': K('rekonstrukció jel'), 'monda': K('monda jel'), 'becslés': K('becslés'), 'vázlatos': K('vázlatos'), 'illusztráció': K('illusztráció') });
    TT = { bc: K('Kr. e.'), ad: K('Kr. u.'), cent: K('század'), years: K('év sablon') };
    TL1 = TortTimeline.create(L, { x0: 60, x1: 1300, y: 990, h: 46, T: TT, src: SRC, bounds: [1815, 1855] });
    buildState1(); buildState2(); buildState4();
    COUNTIES = [].concat(listOf('megyék szept igen'), listOf('megyék szept nincs'), listOf('megyék szept nem'));
    reset5();
    S6.kr = num('napszám kezdőértéke'); S6.crop = num('termés kezdőértéke'); S6.save = num('megtakarítás kezdőértéke');
    CH6 = MatChart.create(L, { x: 110, y: 150, w: 560, h: 420, n: 3, min: 0, max: 40 });
    const zones = [['sz', 'zóna Széchenyi'], ['ko', 'zóna Kossuth'], ['mi', 'zóna mindkettő']]
      .map(([id, k], i) => ({ id, x: 40 + i * 437, y: 286, w: 427, h: 420, title: K(k), head: 60 }));
    const cd = [['kártya felülről', 'sz'], ['kártya nyilvánosság', 'ko'], ['kártya kárpótlás', 'mi'], ['kártya gazdaság', 'sz'], ['kártya érdekegyesítés', 'ko'],
      ['kártya közteher', 'mi'], ['kártya Bécs', 'sz'], ['kártya Védegylet', 'ko'], ['kártya ősiség', 'mi'], ['kártya erőszak', 'sz']];
    CARDS7 = TortCards.create(L, { zones, cards: cd.map(([k, z]) => ({ id: k, label: K(k), zone: z })), tray: { x: 40, y: 720, w: 1290, h: 270, top: 12 }, font: { s: 22, w: 600 } });
    L.checks = () => {
      const outC = [];
      const all = new Set(COUNTIES), dec = votes5('dec'), sep = votes5('szept');
      outC.push({ name: 'a két lista ugyanaz a 49 megye', ok: all.size === 49 && Object.keys(dec).length === 49 && Object.keys(dec).every((n) => all.has(n)), got: all.size + '/' + Object.keys(dec).length, want: '49/49' });
      const ts = tally5(sep), td = tally5(dec);
      outC.push({ name: 'szeptember: 33 igen, 13 nem', ok: ts.y === num('szeptemberi igen') && ts.n === num('szeptemberi nem'), got: ts.y + ':' + ts.n, want: num('szeptemberi igen') + ':' + num('szeptemberi nem') });
      outC.push({ name: 'december: 22 igen, 24 nem (megyék)', ok: td.y === num('decemberi igen') && td.n === num('decemberi nem'), got: td.y + ':' + td.n, want: num('decemberi igen') + ':' + num('decemberi nem') });
      const r = dat('bukás aránya');
      outC.push({ name: 'a hivatalos igen = a megyei igen', ok: r.a === td.y, got: r.a, want: td.y });
      const M = model6(num('napszám kezdőértéke'), num('termés kezdőértéke'), num('megtakarítás kezdőértéke'));
      outC.push({ name: 'modell: évi teher 49 Ft, ár 980 Ft, 98 év', ok: Math.abs(M.B - 49) < 1e-9 && Math.abs(M.price - 980) < 1e-9 && Math.abs(M.years - 98) < 1e-9, got: [M.B, M.price, M.years].join(' / '), want: '49 / 980 / 98' });
      if (L.step === 5 && S6.drawn) {
        const Mn = model6(S6.kr, S6.crop, S6.save);
        outC.push({ name: 'rajzolt = számolt (6. lépés)', ok: Mn.price === S6.drawn.price && Mn.years === S6.drawn.years, got: S6.drawn.price, want: Mn.price });
      }
      if (L.step === 4 && S5.G) {
        const v = cur5(), t = tally5(v), drawn = S5.G.seats.filter((s) => s.id && v[s.id] === 'igen').length;
        outC.push({ name: 'patkó igen = számláló', ok: drawn === t.y && S5.G.seats.length === 49, got: drawn + '/' + S5.G.seats.length, want: t.y + '/49' });
      }
      if (L.step === 2 && S3.G) {
        const tot = GROUPS3.reduce((s, g) => s + num(g[2]), 0);
        outC.push({ name: '3. lépés: 58 szavazó egység', ok: S3.G.N === tot && tot === 58, got: S3.G.N, want: 58 });
      }
      const lw = dat('nyelvtörvények évei').v;
      outC.push({ name: 'nyelvtörvények: 6, növekvő', ok: lw.length === 6 && lw.every((x, i) => !i || x > lw[i - 1]), got: lw.join(','), want: '6 növekvő' });
      const D = diets();
      outC.push({ name: 'országgyűlések: kezdet ≤ vég', ok: D.length === 6 && D.every(([a, b]) => a <= b), got: D.length, want: 6 });
      return outC;
    };
    L.stage.addEventListener('pointerdown', () => {});
  },
  draw(Lx) {
    L = Lx; c = L.ctx; GA = 1; paper();
    const sp = L.sp, wt = (i) => clamp(1 - Math.abs(sp - i) * 2);
    sT[L.step] = L.st;
    for (let i = 0; i < SCENES.length; i++) { const w = wt(i); if (w > .005) SCENES[i](sT[i], w, L.step === i); }
    c.globalAlpha = 1;
  },
});
})();
