/* A természettudomány 5–6. sorozat közös mintái (szerződés 17.): kísérlet-/modellbélyeg és a „Tippelj! → kísérlet →

     TtTipp.bind({ L: () => L, ga: () => GA });    // ga: a lecke alap-alfája (jelenet-áttűnés); alap: () => 1
     const { stamp, Tip, tipReset, panelVeil, veilIf, tipGuess, tipHide, tipControls, tipU, rhythm, tipHead, tipRow,

        Szöveg: az o.k || '<kind> bélyeg' .md-kulcs. Szín (STAMP): otthon kékeszöld, felnőtt okker, tilos #b3261e;
        tanári, modell, kitalált, nem méretarányos, sematikus, vázlatos, képzeletbeli (és minden más) halvány tinta.
        o = {k, col (szín felülírása), rot: −3 (fok), al: 'left' (igazítás)}. a ≤ 0,005 → nem rajzol.
   Tip(keys, ok) → P      jóslat-állapot. keys: a válaszok .md-kulcsai (egyben gombfeliratok), ok: a helyes kulcs (az
        init-ben is beállítható: P.ok = …). P = {keys, ok, guess: null | kulcs, gt: a választás L.st-je, btns, on}.

/* ── MODUL: Időszalag (TortTimeline) ──────────────────────────────────────────────

   Később változtatás nélkül átemelhető: shared/tort/timeline.js. Csak a Lesson motorra épül

   IDŐ-KOORDINÁTA (u): folytonos, csillagászati években. Az „a” csillagászati év

     Y.range(a0, a1, T)   'Kr. e. 7–4' · '1914–1918' · 'Kr. e. 4 – Kr. u. 30'
     Y.elapsed(a1, a2)    a2 − a1

const TortTimeline = (() => {
  const F = Lesson.FONTS, U = Lesson.U, NB = ' ', MINUS = '−', TAU = Math.PI * 2;
  const INK = '#1c2440', MUT = '#565d72', RED = '#c8401c', CARD = '#fffaf1', OCHRE = '#8f5a0c';

  const STEPS = [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000, 2000, 5000, 10000, 20000];

  const Y = {
    astro: (v) => (v < 0 ? v + 1 : v),
    hist: (a) => (a <= 0 ? a - 1 : a),
    u: (d) => (typeof d === 'number' ? d + .5 : d.t === 'date' ? d.a : d.a + .5),
    year: (u) => Math.floor(u),
    num: (a) => (a <= 0 ? 1 - a : a),
    label: (a, T, ad) => (a <= 0 ? T.bc.s + NB + (1 - a) : (ad ? T.ad.s + NB : '') + a),
    key: (a, T, ad) => (a <= 0 ? T.bc.k : ad ? T.ad.k : null),
    range: (a0, a1, T) => {
      if (a0 > a1) [a0, a1] = [a1, a0];
      if (a1 <= 0) return T.bc.s + NB + (1 - a0) + '–' + (1 - a1);
      if (a0 >= 1) return a0 + '–' + a1;
      return Y.label(a0, T) + ' – ' + Y.label(a1, T, true);
    },
    elapsed: (a1, a2) => a2 - a1,
    formula: (a1, a2) => {
      const lo = Math.min(a1, a2), hi = Math.max(a1, a2), e = hi - lo;

      if (lo >= 1) return `${hi} ${MINUS} ${lo} = ${e}`;
      return `${1 - lo} + ${hi} ${MINUS} 1 = ${e}`;
    },
    century: (a) => (a >= 1 ? { n: Math.ceil(a / 100), bc: false } : { n: Math.ceil((1 - a) / 100), bc: true }),
    centurySpan: (n, bc) => (bc ? [1 - 100 * n, 101 - 100 * n] : [100 * n - 99, 100 * n + 1]),
    centuryLabel: (a, T, short) => { const c = Y.century(a); return (c.bc ? T.bc.s + NB : '') + c.n + '.' + (short ? '' : NB + T.cent.s); },
    centuryKeys: (a, T) => (Y.century(a).bc ? [T.cent.k, T.bc.k] : [T.cent.k]),

      const s = Math.exp(U.lerp(Math.log(s0), Math.log(s1), t));
      const k = Math.abs(Math.log(s1 / s0)) > .25 ? (s - s0) / (s1 - s0) : t;
      const m = U.lerp(c0, c1, k);

  function create(L, o) {
    const T = o.T;
    const tl = { o, T, src: o.src || null, x0: o.x0, x1: o.x1, y: o.y, h: o.h || 64, pins: [], user: null, drag: null,
      bounds: o.bounds || [-1e6, 1e6], minSpan: o.minSpan || 4, maxSpan: o.maxSpan || 1e5, epoch: o.epoch == null ? null : o.epoch };

    const adOn = (a, ad, step) => a >= 1 && (ad === true || (ad !== false && step <= 10 && tl.u0 < 1 && a < 1000));

        if (s * tl.ppy >= w + 22) return s;

      return 50000;
    }

    tl.draw = (d = {}) => {

        c.lineTo(-w * .15, h / 2); c.quadraticCurveTo(-w * .5, h * .35, -w * .45, 0); c.quadraticCurveTo(-w * .12, -h * .25, -w * .18, -h / 2); c.closePath();

      L.tx(q.type.s, x + pad + 84, y + pad + 22, Object.assign({}, LF, { c: col, k: q.type.k }));
      L.tx(q.title.s, x + pad + 84, y + pad + 64, { f: F.D, s: 36, w: 560, c: INK, k: q.title.k, max: w - pad * 2 - 84 });

/* ── MODUL: Kártyák (TortCards) ────────────────────────────────────────────────────
   G modul (pilot/tortenelem-5-6/terv.md, 5. fejezet): „húzd a helyére” – kártyák rendezése zónákba
   (pl. két oszlop: falu / város), azonnali visszajelzéssel. Referencia: 07-kozepkori-varos.
   Később változtatás nélkül átemelhető: shared/tort/cards.js. Csak a Lesson motorra épül
   (L.ctx, L.tx, L.measure, L.pointer, L.stage, L.st, L.VW).

   const g = TortCards.create(L, {
     zones: [{id, x, y, w, h, title: {s, k}, sub?: {s, k}, head?: 110}], // célterületek; head: a fejléc magassága
     cards: [{id, label: {s, k}, zone}],      // zone: a helyes zóna id-ja (a kódban rögzített megoldás)
     tray: {x, y, w, h, pad?: 24, top?: 56},  // a kártyák kiinduló helye: sorfolytonosan, soronként középre
     font?: {f, s, w},                        // kártyafelirat (alap: Bricolage 24 / 600)
     gap?: 14, ease?: .45,                    // térköz px; a mozgás hossza mp
     decor?: (zone, alpha) => {}              // opcionális: saját rajz a zóna fejlécébe
   });

   g.solve(t0?)               minden kártya a helyes zónába, kissé lépcsőzetesen
   g.update()                 minden képkockán, a rajzolás előtt, csak az aktív lépésben: húzás, kurzor
   g.draw({a})                zónák, kártyák (a húzott legfelül), visszajelzés: zöld keret + pipa / piros + kereszt
   g.score() → {ok, placed, total}   ·   g.touched: a felhasználó már húzott   ·   g.cards, g.zones

const TortCards = (() => {

  function create(L, cfg) {

    const zones = cfg.zones.map((z) => Object.assign({ head: 110 }, z));

    const g = { zones, cards, touched: false, drag: null, _pd: false, _ord: 0, _hov: null };

    const zoneAt = (x, y) => zones.find((z) => x >= z.x && x <= z.x + z.w && y >= z.y && y <= z.y + z.h) || null;
    const cw = (q) => L.measure(q.label.s, FT).w + PX * 2 + ICON;

    }

/* Ki választ kit, ki ellenőriz kit: csomópontok (intézmények) és címkézett nyilak, ki-/bekapcsolható elemekkel,
   dátum szerinti állapottal és elrendezés-váltással (terv 4.2). Csak a Lesson motorra épül (L.ctx, L.tx, L.pill,

   ALFA: a rajzoló a hívás pillanatnyi globalAlpha-ját (a0) veszi alapnak, és a0 · o.a · (belső áttűnés) értékre
   ÁLLÍTJA; a végén visszaállítja, a vonalstílust (lineCap/lineJoin/setLineDash) is.

        rel: 'választ' (tinta) | 'kinevez' (halvány tinta) | 'vezet' (tinta) | 'javasol' (halvány, szaggatott) |

                             rejtett (és a nyilai is). S.use(name) azonnal arra áll; az eredeti helyek neve: 'alap'.

   S.set(key, on, t, d)      kapcsoló: key = csomópont-id vagy él (index vagy él-id); on = false → kialszik
                             (szürkülő, szaggatott keretű doboz, áthúzott felirat; az élei is halványak);
                             t: az L.st, amikor a váltás indul (alap: L.st), d: az áttűnés hossza mp-ben (alap .5)

  2: [{ name: 'megoldva', set(L) { G2.solve(L.st - 3); } },
    { name: 'részben', set(L) { G2.place('k Locke 1', 'Locke', L.st - 3); G2.place('k Locke 2', 'Locke', L.st - 3); G2.place('k Smith 1', 'Rousseau', L.st - 3); G2.place('k Rousseau 1', 'Rousseau', L.st - 3); } }],
  3: [{ name: 'tipp-jó', set(L) { tipGuess(P3, 'tipp3 adó', L.st - 20); } }, { name: 'tipp-rossz', set(L) { tipGuess(P3, 'tipp3 mind', L.st - 20); } }],
  4: [{ name: 'kijelölt-hiba', set(L) { match4(0, L.st - 3); S4.sel = 1; S4.selT = L.st - 1; S4.err = 1; S4.errT = L.st - .3; } },
    { name: 'kész', set(L) { ART.forEach((A, i) => match4(i, L.st - 3)); } }],
  5: [{ name: '1792-augusztus', set(L) { atDate(4, toU(1792, 8, 20)); } }, { name: 'kártya-király', set(L) { atDate(4, toU(1792, 3, 1)); SS.sel = 'k'; SS.selT = L.st - 1; } },
    { name: 'kártya-választók', set(L) { SS.sel = 'v'; SS.selT = L.st - 1; } }],
  6: [{ name: '1793-december', set(L) { atDate(5, toU(1793, 12, 20)); } }, { name: 'kártya-bizottság', set(L) { SS.sel = 'b'; SS.selT = L.st - 1; } },
    { name: 'kártya-törvényszék', set(L) { SS.sel = 'f'; SS.selT = L.st - 1; } }],
  8: [{ name: '1797-direktórium', set(L) { atDate(7, toU(1797, 6, 1)); } }, { name: '1800-március', set(L) { atDate(7, toU(1800, 3, 15)); } },
    { name: 'kártya-konzul', set(L) { atDate(7, toU(1802, 1, 1)); SS.sel = 'c'; SS.selT = L.st - 1; } }],
  9: [{ name: 'Varsói-Hercegség', set(L) { S9.sel = 'Varsó'; S9.selT = L.st - 1; } }, { name: 'Illíria', set(L) { S9.sel = 'Illíria'; S9.selT = L.st - 1; } }],
};

L = Lesson.create({
  resetCtx: true,
  content: window.LESSON_CONTENT,
  home: false,
  steps: STEPS,
  init(Lx) {
    L = Lx; c = L.ctx;
    SRC = TortSource.create(L, { 'forrás': K('forrás jel'), 'rekonstrukció': K('rekonstrukció jel'), 'monda': K('monda jel'), 'becslés': K('becslés'), 'vázlatos': K('vázlatos'), 'illusztráció': K('illusztráció') });
    TT = { bc: K('Kr. e.'), ad: K('Kr. u.'), cent: K('század'), years: K('év sablon') };
    TL1 = TortTimeline.create(L, { x0: 60, x1: 1300, y: 970, h: 36, T: TT, src: SRC, bounds: [1400, 1900] });
    TLS = TortTimeline.create(L, { x0: 40, x1: 1300, y: 100, h: 36, T: TT, src: SRC, bounds: [1780, 1820] });
    buildCards2(); buildState3(); buildState();
    const layers = [{ data: window.TORT_MAP_VILAG }, { data: window.TORT_MAP_EUROPA }];
    MAP9 = TortMap.create({ proj: PR9, layers, rect: [0, 0, 1360, 1080] });
    VW9 = TortProj.fit(PR9, [-10, 36.2, 39, 61], [R9[0], R9[1], R9[2], R9[3]], 0); VV9 = TortProj.view(PR9, VW9);
    buildRegions9();
    TAB10 = COLS10.map(([dk]) => tableAt(uOf(dk)));
    stateAt(SCH[4].a0());
    L.checks = () => {
      const out = [];
      const ord = (ks) => ks.every((k, i) => !i || uOf(k) > uOf(ks[i - 1]));
      out.push({ name: 'világkép: Kopernikusz < Galilei < Newton', ok: ord(['Kopernikusz műve', 'Galilei megfigyelései', 'Principia']), got: [1, 2, 3].length, want: 3 });
      const r = num('szökési sebesség') / num('körsebesség');
      out.push({ name: 'szökési / körsebesség ≈ √2', ok: Math.abs(r - Math.SQRT2) < .01, got: r.toFixed(3), want: Math.SQRT2.toFixed(3) });
      const pc = cannonPath(num('körsebesség')), rs = pc.pts.map((q) => Math.hypot(q[0], q[1])), dev = Math.max(...rs) - Math.min(...rs);
      out.push({ name: 'ágyú: 7,9 km/s → körpálya (sugáreltérés < 1 %)', ok: pc.end === 'closed' && dev < .0125, got: pc.end + ' ' + dev.toFixed(4), want: 'closed' });
      out.push({ name: 'ágyú: 11,6 km/s → elszökik; 5 km/s → visszaesik', ok: cannonPath(11.6).end === 'esc' && cannonPath(5).end === 'hit', got: cannonPath(11.6).end + '/' + cannonPath(5).end, want: 'esc/hit' });
      out.push({ name: '2. lépés: minden szerzőnek van kártyája', ok: AUTH.every((id) => G2.cards.some((q) => q.zone === id)), got: G2.cards.length, want: 9 });
      out.push({ name: 'művek időrendje: Locke < Montesquieu < Rousseau < Voltaire < Smith', ok: AUTH.every((id, i) => !i || dat(WORKY[id]).v > dat(WORKY[AUTH[i - 1]]).v), got: AUTH.map((id) => dat(WORKY[id]).v).join(','), want: 'növekvő' });
      const pop = num('aktív polgárok') + num('passzív férfiak');
      out.push({ name: '1791: aktív + passzív férfi < lakosság; aktív ≈ 59 %', ok: pop < num('lakosság 1789') && Math.abs(num('aktív polgárok') / pop - .589) < .01, got: (num('aktív polgárok') / pop).toFixed(3), want: '0,589' });
      out.push({ name: '1789: öt dátum időrendben', ok: ord(EV4.map((e) => e[0])), got: EV4.length, want: 5 });
      out.push({ name: 'Nyilatkozat: 5 cikk ↔ 5 különböző elv', ok: new Set(ART.map((A) => A.p)).size === 5 && ART.every((A) => PRIN.includes(A.p)), got: ART.length, want: 5 });
      const evo = EVS.every((e, i) => !i || e.a > EVS[i - 1].a);
      out.push({ name: 'séma: az események időrendben', ok: evo, got: evo, want: true });
      const allEv = [4, 5, 7].every((si) => ord(SCH[si].ev.map((e) => e[0])));
      out.push({ name: 'lépésenkénti eseménylisták időrendben', ok: allEv, got: allEv, want: true });
      const hubOk = [[1792, 1, 1, 'k'], [1794, 1, 1, 'b'], [1797, 1, 1, 'd'], [1803, 1, 1, 'c']].every(([y, m, d, id]) => hubAt(toU(y, m, d)) === id);
      out.push({ name: 'végrehajtó hatalom: király → Bizottság → Direktórium → konzul', ok: hubOk, got: hubOk, want: true });
      const t = TAB10, want = [['él', 'él', 'él', 'él', 'él', 'él'], ['ki', 'él', 'forrás', 'kéz', 'ki', 'kéz'], ['ki', 'kéz', 'forrás', 'él', 'kéz', 'kéz']];
      const got = t.map((col) => ROWS10.map((rk) => col[rk].st));
      out.push({ name: 'összefoglaló táblázat = a séma állapota (1791 / 1794 / 1804)', ok: JSON.stringify(got) === JSON.stringify(want), got: JSON.stringify(got), want: JSON.stringify(want) });
      const g1 = num('ítéletek Párizsban') < num('halálos ítéletek') && num('halálos ítéletek') < dat('összes áldozat').lo;
      out.push({ name: 'Greer: Párizs < összes ítélet < összes áldozat alsó becslése', ok: g1, got: g1, want: true });
      const sh = num('nemesek aránya') + num('papok aránya') + num('harmadik rend aránya');
      out.push({ name: 'társadalmi összetétel: 100 %', ok: Math.abs(sh - 100) < .01, got: sh, want: 100 });
      out.push({ name: 'Greer 141 évvel később', ok: dat('Greer könyve').v - dat('terror vége').v === 141, got: dat('Greer könyve').v - dat('terror vége').v, want: 141 });
      out.push({ name: '1812–1815: események időrendben', ok: ord(EV9.map((e) => e[0])), got: EV9.length, want: 6 });
      const inMap = PLACES9.every((id) => { const q = VV9.pt(dat(id + ' helye').lon, dat(id + ' helye').lat); return q[0] > R9[0] && q[0] < R9[0] + R9[2] && q[1] > R9[1] && q[1] < R9[1] + R9[3]; });
      out.push({ name: 'a helyek a térképkereten belül', ok: inMap, got: inMap, want: true });
      const pins = PLACES9.map((id) => { const q = dat(id + ' helye'); const r = REG9.find((x) => pip([q.lon, q.lat], x.poly)); return id + ':' + (r ? r.id : '–'); }).join(' ');
      out.push({ name: 'Párizs/Waterloo a császárságban, Lipcse a Rajnai Sz.-ben, Bécs Ausztriában, Moszkva egyikben sem', ok: pins === 'Párizs:Franciao Waterloo:Franciao Moszkva:– Lipcse:Rajna Bécs:Habsburg', got: pins, want: 'Párizs:Franciao Waterloo:Franciao Moszkva:– Lipcse:Rajna Bécs:Habsburg' });
      return out;
    };
  },
  draw(Lx) {
    L = Lx; c = L.ctx; GA = 1; paper();
    const sp = L.sp, wt = (i) => clamp(1 - Math.abs(sp - i) * 2);
    sT[L.step] = L.st;
    for (let i = 0; i < SCENES.length; i++) { const w = wt(i); if (w > .005 && i !== L.step) SCENES[i](sT[i], w, false); }
    SCENES[L.step](sT[L.step], wt(L.step), true);
    c.globalAlpha = 1;
  },
});
})();
</script>
