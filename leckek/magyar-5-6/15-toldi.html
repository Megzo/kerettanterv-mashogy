<script>
(function () {
'use strict';

/* ── MODUL: Szöveg (MagText) · v1.1 · forrás: magyar-5-6/04-toldalek, 2026-11-24 ── */
/* Magyar szöveg betű / szótag / szó szinten: tokenekre bontás, mért elrendezés, kiemelés, csempe, áttűnés.
   Csak a Lesson motorra épül (Lesson.U, Lesson.FONTS); minden felirat L.tx-szel kerül a vászonra (QA, review mód).
   v1.1 (2026-11-24): a T.layout sorszélessége külön kulcs: maxW. A w mindenhol (create, layout, tile) a betűvastagság.
   (v1.0-ban a layout a w-t sorszélességnek ÉS vastagságnak is vette: 1000 fölött érvénytelen font, alatta némán
   átállt a vastagság.) Átálláskor a régi T.layout(…, {w: 900}) sorszélesség-hívásokat írd át maxW-re.
   Statikus (nem rajzol):
     MagText.ABC                 a 44 betűs magyar ábécé sorrendben: a, á, b, c, cs, d, dz, dzs, e, é, … z, zs
     MagText.clean(s)            s a jelölők nélkül: „|” (szóelemhatár), „·” (kézi szótaghatár)
     MagText.split(s)            → [{s, t, i, n, kind: 'v'|'c'|'x', long, dbl}] a betűk: s a betű (pl. 'sz'), t az írott
                                 darab, i/n a helye a tiszta szövegben; többjegyű betű egy elem (dzs > dz > d); kettőzött
                                 többjegyű (ssz, ggy, ccs, lly, nny, tty, zzs) két betű: 'sz' (t: 's', dbl) + 'sz';
                                 a „|” felülírja a felismerést (kis|szék: s + sz); kind 'x': szóköz, írásjel
     MagText.letters(s)          → ['cs', 'i', 'g', 'a'] (csak a betűk)
     MagText.isVowel(ch)         a, á, e, é, i, í, o, ó, ö, ő, u, ú, ü, ű (+ régi õ, û, ô, ë, ä); az y nem
     MagText.vowels(s)           → [{i, v, long, h: 'mély'|'magas', round}] (i: hely a tiszta szövegben)
     MagText.harmony(s)          → 'mély' | 'magas' | 'vegyes' | null (nincs magánhangzó) – csak a betűk szerint
     MagText.syllabify(s)        → ['asz', 'szony']: magánhangzónként egy szótag; egy mássalhangzó a következő szótagba
                                 kerül, torlódásnál csak az utolsó; két magánhangzó között választ (fi-a-tal); a többjegyű
                                 betű nem válik szét, a kettőzött igen (asz-szony); „·” kézi szótaghatár (vas·út);
                                 szóközös szövegnél szavanként (a sorokon átívelő verstani szótagolás a MagVers dolga)
     MagText.cmp(a, b)           → {r: −1|0|1, i, pass}: magyar betűrend (AkH. 12.): 1. menet a betűk sorrendje (a rövid és a
                                 hosszú magánhangzó egyenértékű), 2. menet rövid < hosszú, 3. menet kisbetű < nagybetű;
                                 i: a döntő betű indexe (MagText.letters szerint), pass: melyik menet döntött (0: egyenlő);
                                 a szóköz, kötőjel, írásjel nem számít. Régi írásmódú betűkapcsolatot (ch, cz, th) nem kezel.
     MagText.collate(a, b)       → −1 | 0 | 1 (rendezéshez: tömb.sort(MagText.collate))
     MagText.diff(a, b)          → [[ia, ib], …] a két betűsor (MagText.letters) leghosszabb közös részsorozata
   Példány:
     const T = MagText.create(L, {f, s, w, i, c, lh})   alapfont (alap: Fraunces, 44 px, 560, tinta), lh: sormagasság × s
     T.tokens(s, 'szó'|'szótag'|'betű', {k}) → [{s, i, kind, wi, si}]   kind: 'w' szó · 'syl' szótag · 'v'/'c' betű ·
                                 's' szóköz · 'p' írásjel; wi: a szó sorszáma, si: a szótag/betű helye a szóban; k: md-kulcs.
                                 Saját token is betehető (pl. {kind: 'slot', fw: 300} helyőrző egy csempés szónak).
     T.layout(tokens, {x, y, maxW, a, gap, s, f, w, i, lh}) → lay   mért elrendezés, tördelés szóközön (nincs fix doboz);
                                 a: 'left' | 'center' | 'right' – x a sorok bal széle / közepe / jobb széle, y az első sor
                                 alapvonala; maxW: legnagyobb sorszélesség, px (nincs: nem tördel); s, f, w (vastagság), i:
                                 a font (alap: a példányé); gap: köz a szón belüli tokenek (szótag, betű) között, px.
                                 lay = {tokens (+ x, y, w), lines, x, y, w, h, s, f}
     T.draw(lay, {hi, dim, reveal, under, a, c, tile, off, k})   hi: {tokenindex: szín} vagy fn(t) → szín | null; a nem
                                 kiemelt token dim alfájú (alap .25; hi nélkül nincs halványítás); reveal 0..1: a tokenek
                                 sorban beúsznak; under: {i: szín | {c, dash}} aláhúzás (pl. szófaj); tile: true | fn(t) →
                                 {bg, bd} csempe a token mögé; off: fn(t) → {dx, dy, a}; a: alfa; c: alapszín
     T.morph(layA, layB, u, {hi, a})   két betűszintű elrendezés áttűnése (írás ↔ [ejtés]): a közös betűk (diff) a helyükre
                                 úsznak, a kiesők lefelé halványulnak, az újak felülről úsznak be (hi: az új betűk színe)
     T.pick(lay, px, py)         → a pont alatti token (szóköz nélkül) vagy null
     T.tile(s, x, y, o)          → {x, y, w, h}: szöveghez méretezett csempe; o: s, f, w, c (betű), bg, bd, lw, pad, r, dash,
                                 minW, a ('center': x a közép | 'left'), k; y az alapvonal
*/
const MagText = (() => {
  const U = Lesson.U, F = Lesson.FONTS;
  const ABC = ['a', 'á', 'b', 'c', 'cs', 'd', 'dz', 'dzs', 'e', 'é', 'f', 'g', 'gy', 'h', 'i', 'í', 'j', 'k', 'l', 'ly', 'm',
    'n', 'ny', 'o', 'ó', 'ö', 'ő', 'p', 'q', 'r', 's', 'sz', 't', 'ty', 'u', 'ú', 'ü', 'ű', 'v', 'w', 'x', 'y', 'z', 'zs'];
  const RANK = {}; ABC.forEach((b, i) => { RANK[b] = i; });
  const DI = ['dzs', 'cs', 'dz', 'gy', 'ly', 'ny', 'sz', 'ty', 'zs'];
  const VOW = 'aáeéiíoóöőuúüűõûôëä', LONGV = 'áéíóőúűõûô', DEEP = 'aáoóuú', ROUND = 'öőüűõûô';
  const SHORT = { 'á': 'a', 'é': 'e', 'í': 'i', 'ó': 'o', 'ő': 'ö', 'ú': 'u', 'ű': 'ü', 'õ': 'ö', 'û': 'ü', 'ô': 'ö' };
  const isL = (ch) => /\p{L}/u.test(ch);
  const isVowel = (ch) => !!ch && ch.length === 1 && VOW.includes(ch.toLowerCase());
  const clean = (s) => String(s).replace(/[|·]/g, '');

  function split(s) {
    s = String(s); const out = []; let i = 0, ci = 0;
    while (i < s.length) {
      const ch = s[i];
      if (ch === '|' || ch === '·') { i++; continue; }
      if (!isL(ch)) { out.push({ s: ch, t: ch, i: ci, n: 1, kind: 'x' }); i++; ci++; continue; }
      const lo = s.slice(i, i + 4).toLowerCase();
      let d = null;
      if (lo[1] === lo[0] && (d = DI.find((x) => x[0] === lo[0] && lo.startsWith(x, 1)))) {      // ssz → sz + sz
        const a = s[i], b = s.slice(i + 1, i + 1 + d.length);
        out.push({ s: a + b.slice(1), t: a, i: ci, n: 1, kind: 'c', dbl: true });
        out.push({ s: b, t: b, i: ci + 1, n: d.length, kind: 'c' });
        i += 1 + d.length; ci += 1 + d.length; continue;
      }
      d = DI.find((x) => lo.startsWith(x));
      const n = d ? d.length : 1, t = s.slice(i, i + n), v = !d && isVowel(ch);
      out.push({ s: t, t, i: ci, n, kind: v ? 'v' : 'c', long: v && LONGV.includes(ch.toLowerCase()) });
      i += n; ci += n;
    }
    return out;
  }
  const letters = (s) => split(s).filter((x) => x.kind !== 'x').map((x) => x.s);
  const vowels = (s) => split(s).filter((x) => x.kind === 'v').map((x) => {
    const lo = x.t.toLowerCase();
    return { i: x.i, v: x.t, long: !!x.long, h: DEEP.includes(lo) ? 'mély' : 'magas', round: ROUND.includes(lo) };
  });
  function harmony(s) {
    const v = vowels(s); if (!v.length) return null;
    const d = v.some((x) => x.h === 'mély'), f = v.some((x) => x.h === 'magas');
    return d && f ? 'vegyes' : d ? 'mély' : 'magas';
  }
  function syl1(seg) {
    const t = split(seg); if (!t.length) return [];
    const V = []; t.forEach((x, j) => { if (x.kind === 'v') V.push(j); });
    if (V.length < 2) return [t.map((x) => x.t).join('')];
    const cuts = [];
    for (let j = 0; j + 1 < V.length; j++) { const a = V[j], b = V[j + 1]; cuts.push(b - a - 1 >= 1 ? b - 1 : b); }
    const out = []; let p = 0;
    cuts.concat([t.length]).forEach((q) => { out.push(t.slice(p, q)); p = q; });
    return out.map((arr) => arr.map((x, m) => (x.dbl && m === arr.length - 1 ? x.s : x.t)).join(''));
  }
  function syllabify(s) {
    s = String(s);
    if (/\s/.test(s)) return s.split(/\s+/).filter(Boolean).reduce((a, w) => a.concat(syllabify(w)), []);
    return s.split('·').reduce((a, seg) => a.concat(syl1(seg)), []);
  }
  function key(s) {
    return split(s).filter((x) => x.kind !== 'x').map((x) => {
      const lo = x.s.toLowerCase(), b = SHORT[lo] || lo;
      return { r: RANK[b] != null ? RANK[b] : 100 + b.charCodeAt(0), long: !!SHORT[lo], up: x.s !== lo };
    });
  }
  function cmp(a, b) {
    const A = key(a), B = key(b), n = Math.min(A.length, B.length);
    for (let j = 0; j < n; j++) if (A[j].r !== B[j].r) return { r: A[j].r < B[j].r ? -1 : 1, i: j, pass: 1 };
    if (A.length !== B.length) return { r: A.length < B.length ? -1 : 1, i: n, pass: 1 };
    for (let j = 0; j < n; j++) if (A[j].long !== B[j].long) return { r: A[j].long ? 1 : -1, i: j, pass: 2 };
    for (let j = 0; j < n; j++) if (A[j].up !== B[j].up) return { r: A[j].up ? 1 : -1, i: j, pass: 3 };
    return { r: 0, i: -1, pass: 0 };
  }
  const collate = (a, b) => cmp(a, b).r;
  function diff(a, b) {
    const A = letters(a).map((x) => x.toLowerCase()), B = letters(b).map((x) => x.toLowerCase());
    const n = A.length, m = B.length, D = [];
    for (let i = 0; i <= n; i++) { D.push(new Array(m + 1).fill(0)); }
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) D[i][j] = A[i] === B[j] ? D[i + 1][j + 1] + 1 : Math.max(D[i + 1][j], D[i][j + 1]);
    const out = []; let i = 0, j = 0;
    while (i < n && j < m) { if (A[i] === B[j]) { out.push([i, j]); i++; j++; } else if (D[i + 1][j] >= D[i][j + 1]) i++; else j++; }
    return out;
  }

  function create(L, o0 = {}) {
    const base = Object.assign({ f: F.D, s: 44, w: 560, i: false, c: null, lh: 1.3 }, o0);
    const fo = (o) => ({ f: o.f || base.f, s: o.s || base.s, w: o.w || base.w, i: o.i != null ? o.i : base.i });
    const T = { base };
    T.tokens = (s, level = 'szó', o = {}) => {
      const out = []; let wi = -1;
      (String(s).match(/[\p{L}|·]+|\s+|[^\p{L}|·\s]+/gu) || []).forEach((p) => {
        if (/^\s+$/.test(p)) { out.push({ s: ' ', kind: 's', wi }); return; }
        if (!/\p{L}/u.test(p)) { out.push({ s: p, kind: 'p', wi }); return; }
        wi++;
        if (level === 'szó') out.push({ s: clean(p), kind: 'w', wi, si: 0 });
        else if (level === 'szótag') syl1(p.replace(/·/g, '·')).length && syllabify(p).forEach((y, si) => out.push({ s: y, kind: 'syl', wi, si }));
        else split(p).forEach((x, si) => out.push({ s: x.t, kind: x.kind, wi, si, l: x.s }));
      });
      out.forEach((t, i) => { t.i = i; if (o.k) t.k = o.k; });
      return out;
    };
    T.layout = (tokens, o = {}) => {
      const f = fo(o), s = f.s, gap = o.gap || 0, maxW = o.maxW || 1e9, lh = s * (o.lh || base.lh);
      const sp = L.measure(' ', f).w;
      tokens.forEach((t) => { t.w = t.fw != null ? t.fw : t.kind === 's' ? sp : L.measure(t.s, f).w; });
      const units = []; let u = [];
      tokens.forEach((t) => { if (t.kind === 's') { if (u.length) units.push(u); units.push([t]); u = []; } else u.push(t); });
      if (u.length) units.push(u);
      const inner = (a, b) => (a && b && a.kind !== 'p' && b.kind !== 'p' && a.kind !== 'slot' && b.kind !== 'slot' ? gap : 0);
      const uw = (v) => v.reduce((acc, t, j) => acc + t.w + (j ? inner(v[j - 1], t) : 0), 0);
      const lines = []; let line = [], lw = 0;
      units.forEach((v) => {
        if (v[0].kind === 's') { if (line.length) { line.push(v[0]); lw += v[0].w; } return; }
        const w = uw(v);
        if (line.length && lw + w > maxW) { while (line.length && line[line.length - 1].kind === 's') { lw -= line.pop().w; } lines.push({ t: line, w: lw }); line = []; lw = 0; }
        v.forEach((t, j) => { line.push(t); lw += t.w + (j ? inner(v[j - 1], t) : 0); });
      });
      while (line.length && line[line.length - 1].kind === 's') { lw -= line.pop().w; }
      if (line.length) lines.push({ t: line, w: lw });
      const a = o.a || 'left', x = o.x || 0, y = o.y || 0;
      let W = 0, minX = 1e9;
      lines.forEach((ln, li) => {
        let xx = a === 'center' ? x - ln.w / 2 : a === 'right' ? x - ln.w : x; minX = Math.min(minX, xx);
        ln.t.forEach((t, j) => { if (j) xx += inner(ln.t[j - 1], t); t.x = xx; t.y = y + li * lh; t.h = s; xx += t.w; });
        ln.y = y + li * lh; W = Math.max(W, ln.w);
      });
      tokens.forEach((t) => { if (t.x == null) { t.x = -1e4; t.y = -1e4; } });
      return { tokens, lines, x: lines.length ? minX : x, y, w: W, h: lines.length * lh, s, f, lh };
    };
    T.draw = (lay, o = {}) => {
      const c = L.ctx, A0 = c.globalAlpha, aa = o.a == null ? 1 : o.a, f = lay.f;
      const vis = lay.tokens.filter((t) => t.kind !== 's' && t.kind !== 'slot' && t.x > -1e3), nV = vis.length;
      vis.forEach((t, idx) => {
        let a = aa, dy = 0, dx = 0;
        if (o.reveal != null) { const r = U.clamp(o.reveal * nV - idx); a *= U.smooth(r); dy = (1 - U.out(r)) * lay.s * .35; }
        const hc = typeof o.hi === 'function' ? o.hi(t) : o.hi ? o.hi[t.i] : null;
        if (o.hi && !hc) a *= o.dim == null ? .25 : o.dim;
        if (o.off) { const q = o.off(t); if (q) { dx += q.dx || 0; dy += q.dy || 0; if (q.a != null) a *= q.a; } }
        if (a <= .003) return;
        c.globalAlpha = A0 * a;
        const x = t.x + dx, y = t.y + dy;
        if (o.tile) {

/* Epikus mű szerkezete és szereplői a vásznon: egységek (fejezetek, énekek, részek), szerkezeti görbe,
   szereplőháló az időben, szereplők szálai, tárgy útja, funkciósáv, történetidő ↔ elbeszélési idő.
   Csak a Lesson motorra épül (Lesson.U, Lesson.FONTS, L.tx, L.pill, L.measure, L.lab, L.slider); minden felirat
   L.tx / L.pill (QA, review mód). MINDEN RAJZ ZÁRT KÉPLET a bemenetekből (at, u, t): nincs belső állapot és véletlen,
   így a QA --det átmegy, és visszafelé léptetve is ugyanaz a kép. Az „at” lebegőpontos egységindex
   (0 = az első egység; 2.5 = félúton a 3. és a 4. között). A rel-adatok (tools/build_lesson.py: rel típus,
   spec "rel": {people, units}) fi/ti mezői ugyanezek az indexek.
   Statikus:
     MagStory.KINDS              kapcsolatfajták rajzstílusa: barát, ellenség, család, szerelem, szolgál, vezet
                                 → {c: szín, dash, w: vonalvastagság, dir: irányított (nyíl a b felé)}
     MagStory.roman(14) → 'XIV' · MagStory.unroman('XIV') → 14 (érvénytelen: 0)
     MagStory.key(keys, x)       keys = [[x, v], …] (v szám vagy tömb) → szakaszonként inOut-simított érték
     MagStory.edgeA(e, at, w)    rel-él láthatósága: 1 a [fi, ti] egységekben, a széleken w (alap .5) alatt elhalványul;
                                 fi nélküli él mindig 1
   Példány:
     const S = MagStory.create(L, {units, chars, places, sides})
       units  [{id: 'I', name?: {s, k}, t?: történetidő (szám), n?: szöveghossz}]   (id = a rel-adat egységneve)
       chars  [{id, name?: {s, k}, side?: oldal-id, real?: true}]   (id = a rel-adat szereplőneve; egy oldal ELSŐ
              szereplője a vezér: a hálóban középen áll)
       places [{id, name: {s, k}, x, y}]   (saját koordináták; a track az o.pt-vel vetíti, alap: azonos)
       sides  [{id, name: {s, k}, c: szín, x: 0..1, w: 0..1}]   (a hálódoboz szélességének arányában: közép, szélesség)
     S.n · S.uname(i) → 'VIII.' (vagy units[i].name) · S.uidx('VIII') → 7
     S.span('III–VII') → {fi, ti} | null      S.spans('kapitány (I) · elnök (II–X)') → [{s, fi, ti}] | null
     S.rank(spans, at) → az at-ra (kerekítve) érvényes szöveg | null
     S.places('grund, Füvészkert, …') → [hely-id egységenként] | null (az id vagy a név, kis- és nagybetű mindegy)
     S.slider(L, k, {value, onInput, step}) → L.slider 1..n, kiírás: S.uname
     S.sideAt(id, k, edges)      oldal a k. egységben: „A – B: vezet” → B az A oldalára kerül; „A – B: szolgál” → A a B
                                 oldalára (átállás); más él nem mozgat
     S.arc(c, box, {pts, max, phases, u, at, mark, a, dots}) → {X(at), Y(at), cw, hit(x, y) → egységindex | −1, bands}
                                 szerkezeti görbe: pts = magasság egységenként; X az egység sávjának közepe (a strip
                                 celláival egy vonalban, ha ugyanaz a box.x, box.w); phases = [{fi, ti, name: {s, k}, c}]
                                 sávok a tengely alatt (ütköző feliratnál két sorban); u: kirajzolás 0..1; at: kurzor;
                                 mark = [{at, c, s, k}] a diák jelölései (tűk a görbén, azonos helyen egymás fölött; a felirat
                                 balra fordul, ha jobbra túllógna az o.right határon – alap: box jobb széle + 40)
     S.net(c, box, {at, edges, hi, a, sub, r, kinds, halo}) → {pos: {id: [x, y]}, hit(x, y) → id | null}
                                 szereplőháló: oldalanként gyűrű, a vezér középen; a helyek fixek (a látogató a saját
                                 oldala felőli helyre ül), az egységek között zárt képlettel úszik; az élek edgeA szerint
                                 tűnnek fel; hi: id | [id] (a többi és éleik halványak); sub(id, k) → alcím (pl. rang);
                                 halo: a név alatti alap színe (false: nincs)
     S.netPos(box, edges, at) → {id: [x, y]}   a háló helyei rajzolás nélkül (ellenőrzéshez, kattintáshoz)
     S.lanes(c, box, {rows, edges, at, u, meet, pull, from, to, a, labW}) → {X(at), Y(id, at), hit(x, y) → id | null}
                                 szereplők szálai (vízszintes tengely: egységek); a meet fajtájú élek (alap: barát,
                                 szerelem, család) pull arányban egymás felé húzzák a szálakat; az at-ban élő élek
                                 színes ívek a kurzornál
     S.track(c, {path, at, pt, glyph, c, s, trail, dx, dy, a}) → {x, y, moving}
                                 tárgy útja: path = [hely-id egységenként] vagy [{at, place | char}]; két egység között
                                 a középső 60 %-ban íven halad; trail: a megtett út pöttyözve (alap: true); glyph: 'flag' |
                                 'ring' | 'dot' | fn(c, x, y, col, s); char-hivatkozás: a legutóbbi net/lanes szerinti hely
     S.pos(id, at) → [x, y] | null   a legutóbb rajzolt net/lanes szerint
     S.strip(c, box, {cells, u, hi, a, gap, s, h}) → {rects, hit(x, y) → index | −1}
                                 funkciósáv: cells = [{name: {s, k}, sub?: {s, k}, icon?: fn(c, cx, cy, size, col)}];
                                 u: cellánkénti beúszás 0..1; hi: kiemelt index (vagy [index])
     S.timing(c, box, {u, a, labels: {x: {s, k}, y: {s, k}}, names}) → {X(narr), Y(t), cum}
                                 történetidő (függőleges, units[].t) ↔ elbeszélési idő (vízszintes, units[].n összege);
                                 ahol a t visszaesik (visszatekintés), szaggatott piros ugrás
     S.legend(c, x, y, kinds, {names: {fajta: {s, k}}, a, s}) → {w, h}
   ──────────────────────────────────────────────────────────────────────────────── */
const MagStory = (() => {
  const U = Lesson.U, F = Lesson.FONTS;
  const INK = '#1c2440', MUTED = '#565d72', CARD = '#fffaf1', CIN = '#c8401c';
  const KINDS = {
    'barát': { c: '#1d7a45', dash: null, w: 4.5, dir: false },
    'ellenség': { c: '#b3261e', dash: [12, 9], w: 4, dir: false },
    'család': { c: '#8f5a0c', dash: null, w: 4.5, dir: false },
    'szerelem': { c: '#c8401c', dash: null, w: 4.5, dir: false },
    'szolgál': { c: '#7b4fa0', dash: [2, 9], w: 5, dir: true },
    'vezet': { c: '#565d72', dash: null, w: 2.5, dir: true },
  };
  const RN = [[1000, 'M'], [900, 'CM'], [500, 'D'], [400, 'CD'], [100, 'C'], [90, 'XC'], [50, 'L'], [40, 'XL'], [10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']];
  const roman = (n) => { n = Math.floor(n); if (!(n > 0)) return String(n); let s = ''; RN.forEach(([v, r]) => { while (n >= v) { s += r; n -= v; } }); return s; };
  const unroman = (s) => {
    s = String(s).trim().toUpperCase(); if (!/^[MDCLXVI]+$/.test(s)) return 0;
    const V = { M: 1000, D: 500, C: 100, L: 50, X: 10, V: 5, I: 1 }; let n = 0;
    for (let i = 0; i < s.length; i++) { const a = V[s[i]], b = V[s[i + 1]] || 0; n += a < b ? -a : a; }
    return roman(n) === s ? n : 0;
  };
  const key = (keys, x) => {
    if (x <= keys[0][0]) return keys[0][1];
    for (let i = 1; i < keys.length; i++) {
      if (x <= keys[i][0]) {
        const [x0, a] = keys[i - 1], [x1, b] = keys[i], u = U.inOut((x - x0) / Math.max(1e-9, x1 - x0));
        return Array.isArray(a) ? a.map((v, j) => U.lerp(v, b[j], u)) : U.lerp(a, b, u);
      }
    }
    return keys[keys.length - 1][1];
  };
  const edgeA = (e, at, w = .5) => (e.fi == null ? 1 : U.smooth((at - e.fi + w) / w) * U.smooth((e.ti + w - at) / w));
  const pal = (c) => { c.setLineDash([]); c.lineCap = 'butt'; c.lineJoin = 'miter'; };

  function create(L, o = {}) {
    const units = (o.units || []).map((u, i) => Object.assign({ i }, u));
    const chars = (o.chars || []).map((ch, i) => Object.assign({ i }, ch));
    const places = (o.places || []).slice(), sides = (o.sides || []).slice();
    const byId = {}; chars.forEach((ch) => { byId[ch.id] = ch; });
    const sideById = {}; sides.forEach((sd) => { sideById[sd.id] = sd; });
    const placeById = {}; places.forEach((p) => { placeById[p.id] = p; });
    const S = { L, units, chars, places, sides, n: units.length, _pos: null };
    const txt = (nm, fb) => (nm == null ? fb : typeof nm === 'string' ? nm : nm.s != null ? nm.s : nm.k ? L.lab(nm.k) : fb);
    const kOf = (nm) => (nm && typeof nm === 'object' ? nm.k : undefined);
    const nameOf = (id) => { const ch = byId[id]; return ch ? txt(ch.name, ch.id) : String(id); };
    const A0 = (c) => c.globalAlpha;

    S.uname = (i) => { const u = units[Math.round(i)]; return u ? txt(u.name, u.id + '.') : '?'; };
    S.uidx = (id) => { id = String(id).trim(); return units.findIndex((u) => String(u.id) === id); };
    S.span = (s) => {
      if (s == null) return null;
      const p = String(s).trim().split(/\s*[–—-]\s*/); if (!p[0] || p.length > 2) return null;
      const fi = S.uidx(p[0]), ti = S.uidx(p[p.length - 1]);
      return fi < 0 || ti < 0 || fi > ti ? null : { fi, ti };
    };
    S.spans = (s) => {
      if (s == null) return null; const out = [];
      for (const part of String(s).split(/\s*[·;]\s*/)) {
        const m = /^(.*?)\s*\(([^()]*)\)\s*$/.exec(part.trim()); if (!m) return null;
        const sp = S.span(m[2]); if (!sp) return null; out.push({ s: m[1], fi: sp.fi, ti: sp.ti });
      }
      return out;
    };
    S.rank = (spans, at) => { if (!spans) return null; const k = Math.round(at); const r = spans.find((x) => k >= x.fi && k <= x.ti); return r ? r.s : null; };
    S.places = (s) => {
      const out = [];
      for (const t of String(s || '').split(',')) {
        const w = t.trim().toLowerCase(); if (!w) continue;
        const p = places.find((q) => String(q.id).toLowerCase() === w || String(txt(q.name, '')).toLowerCase() === w);
        if (!p) return null; out.push(p.id);
      }
      return out;
    };
    S.slider = (Lx, k, so = {}) => Lx.slider({ label: Lx.lab(k), k, min: 1, max: S.n, step: so.step || 1, value: so.value || 1,
      format: (v) => S.uname(Math.round(v) - 1), onInput: so.onInput });

    S.sideAt = (id, k, edges) => {
      const ch = byId[id]; if (!ch) return null; const base = ch.side;
      for (const e of edges || []) {
        if (e.fi != null && (k < e.fi || k > e.ti)) continue;
        if (e.kind === 'vezet' && e.b === id && byId[e.a] && byId[e.a].side !== base) return byId[e.a].side;
        if (e.kind === 'szolgál' && e.a === id && byId[e.b] && byId[e.b].side !== base) return byId[e.b].side;
      }
      return base;
    };

    // ── szerkezeti görbe ──
    const catmull = (p, at) => {
      const n = p.length; if (!n) return 0; if (n === 1) return p[0];
      const a = U.clamp(at, 0, n - 1), i = Math.min(n - 2, Math.floor(a)), t = a - i;
      const p0 = p[Math.max(0, i - 1)], p1 = p[i], p2 = p[i + 1], p3 = p[Math.min(n - 1, i + 2)];
      const t2 = t * t, t3 = t2 * t;
      return .5 * ((2 * p1) + (-p0 + p2) * t + (2 * p0 - 5 * p1 + 4 * p2 - p3) * t2 + (-p0 + 3 * p1 - 3 * p2 + p3) * t3);
    };
    S.arc = (c, box, ao = {}) => {
      const n = S.n, pts = ao.pts || units.map(() => 0), mx = Math.max(1e-9, ao.max || Math.max(...pts)), cw = box.w / Math.max(1, n);
      const X = (at) => box.x + (at + .5) * cw;
      const Y = (at) => box.y + box.h - U.clamp(catmull(pts, at) / mx, 0, 1.04) * box.h * .92;
      const a0 = A0(c), al = ao.a == null ? 1 : ao.a, u = ao.u == null ? 1 : U.clamp(ao.u);
      c.save(); pal(c);
      const bands = [];
      if (ao.phases) {                       // fázissávok: halvány függőleges sáv + címke a tengely alatt
        const rowEnd = [-1e9, -1e9];
        ao.phases.forEach((ph) => {
          const x0 = box.x + ph.fi * cw, x1 = box.x + (ph.ti + 1) * cw, col = ph.c || MUTED, pa = (ph.a == null ? 1 : ph.a) * al;
          c.globalAlpha = a0 * pa * .09; c.fillStyle = col; c.fillRect(x0 + 2, box.y, x1 - x0 - 4, box.h);
          c.globalAlpha = a0 * pa; c.fillStyle = col; c.beginPath(); c.roundRect(x0 + 3, box.y + box.h + 14, x1 - x0 - 6, 12, 6); c.fill();
          const s = txt(ph.name, ''), w = L.measure(s, { s: 24, w: 650 }).w, cx = (x0 + x1) / 2;
          let row = cx - w / 2 > rowEnd[0] + 12 ? 0 : 1; rowEnd[row] = cx + w / 2;
          L.tx(s, cx, box.y + box.h + 56 + row * 34, { s: 24, w: 650, a: 'center', c: col, k: kOf(ph.name) });
          bands.push({ x0, x1, row, ph });
        });
      }
      c.globalAlpha = a0 * al;
      c.strokeStyle = 'rgba(28,36,64,.35)'; c.lineWidth = 2; c.beginPath(); c.moveTo(box.x, box.y + box.h + .5); c.lineTo(box.x + box.w, box.y + box.h + .5); c.stroke();
      for (let i = 0; i < n; i++) { const x = X(i); c.beginPath(); c.moveTo(x, box.y + box.h - 6); c.lineTo(x, box.y + box.h + 6); c.stroke(); }
      const end = u * (n - 1);
      if (end > 0) {
        c.beginPath(); c.moveTo(X(0), box.y + box.h);
        for (let a = 0; a <= end + 1e-6; a += .05) c.lineTo(X(Math.min(a, end)), Y(Math.min(a, end)));
        c.lineTo(X(end), box.y + box.h); c.closePath();
        c.fillStyle = 'rgba(200,64,28,.08)'; c.fill();
        c.beginPath(); c.moveTo(X(0), Y(0));
        for (let a = .05; a <= end + 1e-6; a += .05) c.lineTo(X(Math.min(a, end)), Y(Math.min(a, end)));
        c.lineTo(X(end), Y(end));
        c.strokeStyle = ao.c || INK; c.lineWidth = 5; c.lineJoin = 'round'; c.lineCap = 'round'; c.stroke();
      }
      if (ao.dots !== false) for (let i = 0; i < n; i++) {
        const da = U.smooth((end - i + .3) / .3); if (da <= 0) continue;
        c.globalAlpha = a0 * al * da; c.fillStyle = CARD; c.strokeStyle = ao.c || INK; c.lineWidth = 3;
        c.beginPath(); c.arc(X(i), Y(i), 7, 0, U.TAU); c.fill(); c.stroke();
      }
      c.globalAlpha = a0 * al;
      if (ao.at != null) {
        const x = X(ao.at); c.setLineDash([6, 7]); c.strokeStyle = 'rgba(28,36,64,.45)'; c.lineWidth = 2;
        c.beginPath(); c.moveTo(x, box.y); c.lineTo(x, box.y + box.h); c.stroke(); c.setLineDash([]);
      }
      const seen = {};
      (ao.mark || []).forEach((m) => {
        if (m.at == null) return;
        const k = Math.round(m.at), st = seen[k] = (seen[k] || 0) + 1, x = X(m.at), y = Y(m.at), top = y - 46 - (st - 1) * 46;
        c.globalAlpha = a0 * al * (m.a == null ? 1 : m.a);
        c.strokeStyle = m.c || CIN; c.lineWidth = 3; c.lineCap = 'round';
        c.beginPath(); c.moveTo(x, y - 8); c.lineTo(x, top + 12); c.stroke();
        c.fillStyle = m.c || CIN; c.beginPath(); c.arc(x, top, 12, 0, U.TAU); c.fill();
        if (m.s || m.k) { const s = m.s != null ? m.s : L.lab(m.k), right = x + 30 + L.measure(s, { s: 22, w: 650 }).w > (ao.right || box.x + box.w + 40);
          L.pill(s, right ? x - 18 : x + 18, top, { a: right ? 'right' : 'left', s: 22, w: 650, c: CARD, bg: m.c || CIN, pad: 8, k: m.k }); }
      });
      c.restore();
      const hit = (x, y) => (x >= box.x && x <= box.x + box.w && y >= box.y - 80 && y <= box.y + box.h + 30 ? U.clamp(Math.floor((x - box.x) / cw), 0, n - 1) : -1);
      return { X, Y, cw, hit, bands };
    };

    // ── szereplőháló ──
    const layCache = new Map();
    const layout = (box, edges) => {
      const key = box.x + ',' + box.y + ',' + box.w + ',' + box.h;
      let m = layCache.get(edges); if (m && m[key]) return m[key];
      if (!m) { m = {}; layCache.set(edges, m); }
      const slots = {}, center = {};
      sides.forEach((sd) => {
        const cx = box.x + sd.x * box.w, cy = box.y + box.h * (sd.y == null ? .5 : sd.y);
        const rx = (sd.w == null ? .3 : sd.w) * box.w * .5, ry = box.h * (sd.h == null ? .40 : sd.h * .5);
        center[sd.id] = [cx, cy, rx, ry];
      });
      sides.forEach((sd) => {
        const [cx, cy, rx, ry] = center[sd.id], hub = chars.find((ch) => ch.side === sd.id);
        const own = chars.filter((ch) => ch.side === sd.id && ch !== hub);
        const vis = chars.filter((ch) => ch.side !== sd.id && units.some((u, k) => S.sideAt(ch.id, k, edges) === sd.id));
        const N = own.length + vis.length, ang = [];
        for (let j = 0; j < N; j++) ang.push(-Math.PI / 2 + j * U.TAU / Math.max(1, N));
        const free = ang.map((a, j) => j), take = {};
        vis.forEach((ch) => {                // a látogató a saját oldala felőli helyre ül
          const hc = center[ch.side]; const dir = hc ? Math.atan2(hc[1] - cy, hc[0] - cx) : Math.PI;
          let best = -1, bd = 1e9;
          free.forEach((j) => { const d = Math.abs(Math.atan2(Math.sin(ang[j] - dir), Math.cos(ang[j] - dir))); if (d < bd - 1e-9) { bd = d; best = j; } });
          if (best >= 0) { take[ch.id] = best; free.splice(free.indexOf(best), 1); }
        });
        own.forEach((ch, i) => { if (free.length) take[ch.id] = free.shift(); });
        slots[sd.id] = {};
        if (hub) slots[sd.id][hub.id] = [cx, cy];
        Object.keys(take).forEach((id) => { const a = ang[take[id]]; slots[sd.id][id] = [cx + rx * Math.cos(a), cy + ry * Math.sin(a)]; });
      });
      const at = (id, k) => { const sd = S.sideAt(id, k, edges); return sd && slots[sd] ? slots[sd][id] : null; };
      return (m[key] = { at, center });
    };
    const posAt = (lay, id, at) => {
      const a = U.clamp(at, 0, S.n - 1), k0 = Math.floor(a), k1 = Math.min(S.n - 1, k0 + 1), f = U.smooth((a - k0 - .2) / .6);
      const p0 = lay.at(id, k0), p1 = lay.at(id, k1); if (!p0 || !p1) return p0 || p1 || null;
      return [U.lerp(p0[0], p1[0], f), U.lerp(p0[1], p1[1], f)];
    };
    const arrowHead = (c, x, y, ang, sz) => {
      c.beginPath(); c.moveTo(x, y); c.lineTo(x - Math.cos(ang - .42) * sz, y - Math.sin(ang - .42) * sz);
      c.lineTo(x - Math.cos(ang + .42) * sz, y - Math.sin(ang + .42) * sz); c.closePath(); c.fill();
    };
    S.netPos = (box, edges, at) => { const lay = layout(box, edges || []), pos = {}; chars.forEach((ch) => { const p = posAt(lay, ch.id, at || 0); if (p) pos[ch.id] = p; }); return pos; };
    S.net = (c, box, no = {}) => {
      const edges = no.edges || [], at = no.at || 0, lay = layout(box, edges), r = no.r || 28, a0 = A0(c), al = no.a == null ? 1 : no.a;
      const kinds = no.kinds ? new Set(no.kinds) : null;
      const hiSet = no.hi == null ? null : new Set([].concat(no.hi));
      const pos = {}; chars.forEach((ch) => { const p = posAt(lay, ch.id, at); if (p) pos[ch.id] = p; });
      const near = new Set(); if (hiSet) edges.forEach((e) => { if (edgeA(e, at) > .5 && (hiSet.has(e.a) || hiSet.has(e.b))) { near.add(e.a); near.add(e.b); } });
      c.save();
      edges.forEach((e, i) => {
        if (kinds && !kinds.has(e.kind)) return;
        const ea = edgeA(e, at); if (ea < .01) return;
        const pa = pos[e.a], pb = pos[e.b]; if (!pa || !pb) return;
        const st = KINDS[e.kind] || KINDS['barát'], dimmed = hiSet && !(hiSet.has(e.a) || hiSet.has(e.b));
        const dx = pb[0] - pa[0], dy = pb[1] - pa[1], len = Math.hypot(dx, dy); if (len < 2 * r + 4) return;

  },
  draw(Lx) {
    L = Lx; c = L.ctx; GA = 1; background();
    syncSliders5();
    if (L.step >= 0) sT[L.step] = L.st;
    for (let i = 0; i < SCENES.length; i++) {
      const w = clamp(1 - Math.abs(L.sp - i) * 2); if (w <= .005) continue;
      GA = w; c.save(); c.globalAlpha = w; SCENES[i](sT[i] == null ? 0 : sT[i], L.step === i); c.restore();
    }
    c.globalAlpha = 1;
    if (DATA_ERR.length) L.pill(lab('adathiba felirat').replace('#', DATA_ERR.slice(0, 3).join('; ')), 680, 1040, { a: 'center', s: 24, w: 600, bg: BAD, c: CARD, pad: 12, k: 'adathiba felirat', max: 1240 });
  },
});
