<script>
(function () {
'use strict';

/* ── MODUL: Szöveg (MagText) · v1.1 · forrás: magyar-5-6/04-toldalek, 2026-11-24 ── */
/* Magyar szöveg betű / szótag / szó szinten: tokenekre bontás, mért elrendezés, kiemelés, csempe, áttűnés.
   Csak a Lesson motorra épül (Lesson.U, Lesson.FONTS); minden felirat L.tx-szel kerül a vászonra (QA, review mód).
   v1.1 (2026-11-24): a T.layout sorszélessége külön kulcs: maxW. A w mindenhol (create, layout, tile) a betűvastagság.
   (v1.0-ban a layout a w-t sorszélességnek ÉS vastagságnak is vette: 1000 fölött érvénytelen font, alatta némán
   átállt a vastagság.) Átálláskor a régi T.layout(…, {w: 900}) sorszélesség-hívásokat írd át maxW-re.
   Statikus (nem rajzol):
     MagText.ABC                 a 44 betűs magyar ábécé sorrendben: a, á, b, c, cs, d, dz, dzs, e, é, … z, zs
     MagText.clean(s)            s a jelölők nélkül: „|” (szóelemhatár), „·” (kézi szótaghatár)
     MagText.split(s)            → [{s, t, i, n, kind: 'v'|'c'|'x', long, dbl}] a betűk: s a betű (pl. 'sz'), t az írott
                                 darab, i/n a helye a tiszta szövegben; többjegyű betű egy elem (dzs > dz > d); kettőzött
                                 többjegyű (ssz, ggy, ccs, lly, nny, tty, zzs) két betű: 'sz' (t: 's', dbl) + 'sz';
                                 a „|” felülírja a felismerést (kis|szék: s + sz); kind 'x': szóköz, írásjel
     MagText.letters(s)          → ['cs', 'i', 'g', 'a'] (csak a betűk)
     MagText.isVowel(ch)         a, á, e, é, i, í, o, ó, ö, ő, u, ú, ü, ű (+ régi õ, û, ô, ë, ä); az y nem
     MagText.vowels(s)           → [{i, v, long, h: 'mély'|'magas', round}] (i: hely a tiszta szövegben)
     MagText.harmony(s)          → 'mély' | 'magas' | 'vegyes' | null (nincs magánhangzó) – csak a betűk szerint
     MagText.syllabify(s)        → ['asz', 'szony']: magánhangzónként egy szótag; egy mássalhangzó a következő szótagba
                                 kerül, torlódásnál csak az utolsó; két magánhangzó között választ (fi-a-tal); a többjegyű
                                 betű nem válik szét, a kettőzött igen (asz-szony); „·” kézi szótaghatár (vas·út);
                                 szóközös szövegnél szavanként (a sorokon átívelő verstani szótagolás a MagVers dolga)
     MagText.cmp(a, b)           → {r: −1|0|1, i, pass}: magyar betűrend (AkH. 12.): 1. menet a betűk sorrendje (a rövid és a
                                 hosszú magánhangzó egyenértékű), 2. menet rövid < hosszú, 3. menet kisbetű < nagybetű;
                                 i: a döntő betű indexe (MagText.letters szerint), pass: melyik menet döntött (0: egyenlő);
                                 a szóköz, kötőjel, írásjel nem számít. Régi írásmódú betűkapcsolatot (ch, cz, th) nem kezel.
     MagText.collate(a, b)       → −1 | 0 | 1 (rendezéshez: tömb.sort(MagText.collate))
     MagText.diff(a, b)          → [[ia, ib], …] a két betűsor (MagText.letters) leghosszabb közös részsorozata
   Példány:
     const T = MagText.create(L, {f, s, w, i, c, lh})   alapfont (alap: Fraunces, 44 px, 560, tinta), lh: sormagasság × s
     T.tokens(s, 'szó'|'szótag'|'betű', {k}) → [{s, i, kind, wi, si}]   kind: 'w' szó · 'syl' szótag · 'v'/'c' betű ·
                                 's' szóköz · 'p' írásjel; wi: a szó sorszáma, si: a szótag/betű helye a szóban; k: md-kulcs.
                                 Saját token is betehető (pl. {kind: 'slot', fw: 300} helyőrző egy csempés szónak).
     T.layout(tokens, {x, y, maxW, a, gap, s, f, w, i, lh}) → lay   mért elrendezés, tördelés szóközön (nincs fix doboz);
                                 a: 'left' | 'center' | 'right' – x a sorok bal széle / közepe / jobb széle, y az első sor
                                 alapvonala; maxW: legnagyobb sorszélesség, px (nincs: nem tördel); s, f, w (vastagság), i:
                                 a font (alap: a példányé); gap: köz a szón belüli tokenek (szótag, betű) között, px.
                                 lay = {tokens (+ x, y, w), lines, x, y, w, h, s, f}
     T.draw(lay, {hi, dim, reveal, under, a, c, tile, off, k})   hi: {tokenindex: szín} vagy fn(t) → szín | null; a nem
                                 kiemelt token dim alfájú (alap .25; hi nélkül nincs halványítás); reveal 0..1: a tokenek
                                 sorban beúsznak; under: {i: szín | {c, dash}} aláhúzás (pl. szófaj); tile: true | fn(t) →
                                 {bg, bd} csempe a token mögé; off: fn(t) → {dx, dy, a}; a: alfa; c: alapszín
     T.morph(layA, layB, u, {hi, a})   két betűszintű elrendezés áttűnése (írás ↔ [ejtés]): a közös betűk (diff) a helyükre
                                 úsznak, a kiesők lefelé halványulnak, az újak felülről úsznak be (hi: az új betűk színe)
     T.pick(lay, px, py)         → a pont alatti token (szóköz nélkül) vagy null
     T.tile(s, x, y, o)          → {x, y, w, h}: szöveghez méretezett csempe; o: s, f, w, c (betű), bg, bd, lw, pad, r, dash,
                                 minW, a ('center': x a közép | 'left'), k; y az alapvonal
*/
const MagText = (() => {
  const U = Lesson.U, F = Lesson.FONTS;
  const ABC = ['a', 'á', 'b', 'c', 'cs', 'd', 'dz', 'dzs', 'e', 'é', 'f', 'g', 'gy', 'h', 'i', 'í', 'j', 'k', 'l', 'ly', 'm',
    'n', 'ny', 'o', 'ó', 'ö', 'ő', 'p', 'q', 'r', 's', 'sz', 't', 'ty', 'u', 'ú', 'ü', 'ű', 'v', 'w', 'x', 'y', 'z', 'zs'];
  const RANK = {}; ABC.forEach((b, i) => { RANK[b] = i; });
  const DI = ['dzs', 'cs', 'dz', 'gy', 'ly', 'ny', 'sz', 'ty', 'zs'];
  const VOW = 'aáeéiíoóöőuúüűõûôëä', LONGV = 'áéíóőúűõûô', DEEP = 'aáoóuú', ROUND = 'öőüűõûô';
  const SHORT = { 'á': 'a', 'é': 'e', 'í': 'i', 'ó': 'o', 'ő': 'ö', 'ú': 'u', 'ű': 'ü', 'õ': 'ö', 'û': 'ü', 'ô': 'ö' };
  const isL = (ch) => /\p{L}/u.test(ch);
  const isVowel = (ch) => !!ch && ch.length === 1 && VOW.includes(ch.toLowerCase());
  const clean = (s) => String(s).replace(/[|·]/g, '');

  function split(s) {
    s = String(s); const out = []; let i = 0, ci = 0;
    while (i < s.length) {
      const ch = s[i];
      if (ch === '|' || ch === '·') { i++; continue; }
      if (!isL(ch)) { out.push({ s: ch, t: ch, i: ci, n: 1, kind: 'x' }); i++; ci++; continue; }
      const lo = s.slice(i, i + 4).toLowerCase();
      let d = null;
      if (lo[1] === lo[0] && (d = DI.find((x) => x[0] === lo[0] && lo.startsWith(x, 1)))) {      // ssz → sz + sz
        const a = s[i], b = s.slice(i + 1, i + 1 + d.length);
        out.push({ s: a + b.slice(1), t: a, i: ci, n: 1, kind: 'c', dbl: true });
        out.push({ s: b, t: b, i: ci + 1, n: d.length, kind: 'c' });
        i += 1 + d.length; ci += 1 + d.length; continue;
      }
      d = DI.find((x) => lo.startsWith(x));
      const n = d ? d.length : 1, t = s.slice(i, i + n), v = !d && isVowel(ch);
      out.push({ s: t, t, i: ci, n, kind: v ? 'v' : 'c', long: v && LONGV.includes(ch.toLowerCase()) });
      i += n; ci += n;
    }
    return out;
  }
  const letters = (s) => split(s).filter((x) => x.kind !== 'x').map((x) => x.s);
  const vowels = (s) => split(s).filter((x) => x.kind === 'v').map((x) => {
    const lo = x.t.toLowerCase();
    return { i: x.i, v: x.t, long: !!x.long, h: DEEP.includes(lo) ? 'mély' : 'magas', round: ROUND.includes(lo) };
  });
  function harmony(s) {
    const v = vowels(s); if (!v.length) return null;
    const d = v.some((x) => x.h === 'mély'), f = v.some((x) => x.h === 'magas');
    return d && f ? 'vegyes' : d ? 'mély' : 'magas';
  }
  function syl1(seg) {
    const t = split(seg); if (!t.length) return [];
    const V = []; t.forEach((x, j) => { if (x.kind === 'v') V.push(j); });
    if (V.length < 2) return [t.map((x) => x.t).join('')];
    const cuts = [];
    for (let j = 0; j + 1 < V.length; j++) { const a = V[j], b = V[j + 1]; cuts.push(b - a - 1 >= 1 ? b - 1 : b); }
    const out = []; let p = 0;
    cuts.concat([t.length]).forEach((q) => { out.push(t.slice(p, q)); p = q; });
    return out.map((arr) => arr.map((x, m) => (x.dbl && m === arr.length - 1 ? x.s : x.t)).join(''));
  }
  function syllabify(s) {
    s = String(s);
    if (/\s/.test(s)) return s.split(/\s+/).filter(Boolean).reduce((a, w) => a.concat(syllabify(w)), []);
    return s.split('·').reduce((a, seg) => a.concat(syl1(seg)), []);
  }
  function key(s) {
    return split(s).filter((x) => x.kind !== 'x').map((x) => {
      const lo = x.s.toLowerCase(), b = SHORT[lo] || lo;
      return { r: RANK[b] != null ? RANK[b] : 100 + b.charCodeAt(0), long: !!SHORT[lo], up: x.s !== lo };
    });
  }
  function cmp(a, b) {
    const A = key(a), B = key(b), n = Math.min(A.length, B.length);
    for (let j = 0; j < n; j++) if (A[j].r !== B[j].r) return { r: A[j].r < B[j].r ? -1 : 1, i: j, pass: 1 };
    if (A.length !== B.length) return { r: A.length < B.length ? -1 : 1, i: n, pass: 1 };
    for (let j = 0; j < n; j++) if (A[j].long !== B[j].long) return { r: A[j].long ? 1 : -1, i: j, pass: 2 };
    for (let j = 0; j < n; j++) if (A[j].up !== B[j].up) return { r: A[j].up ? 1 : -1, i: j, pass: 3 };
    return { r: 0, i: -1, pass: 0 };
  }
  const collate = (a, b) => cmp(a, b).r;
  function diff(a, b) {
    const A = letters(a).map((x) => x.toLowerCase()), B = letters(b).map((x) => x.toLowerCase());
    const n = A.length, m = B.length, D = [];
    for (let i = 0; i <= n; i++) { D.push(new Array(m + 1).fill(0)); }
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) D[i][j] = A[i] === B[j] ? D[i + 1][j + 1] + 1 : Math.max(D[i + 1][j], D[i][j + 1]);
    const out = []; let i = 0, j = 0;
    while (i < n && j < m) { if (A[i] === B[j]) { out.push([i, j]); i++; j++; } else if (D[i + 1][j] >= D[i][j + 1]) i++; else j++; }
    return out;
  }

  function create(L, o0 = {}) {
    const base = Object.assign({ f: F.D, s: 44, w: 560, i: false, c: null, lh: 1.3 }, o0);
    const fo = (o) => ({ f: o.f || base.f, s: o.s || base.s, w: o.w || base.w, i: o.i != null ? o.i : base.i });
    const T = { base };
    T.tokens = (s, level = 'szó', o = {}) => {
      const out = []; let wi = -1;
      (String(s).match(/[\p{L}|·]+|\s+|[^\p{L}|·\s]+/gu) || []).forEach((p) => {
        if (/^\s+$/.test(p)) { out.push({ s: ' ', kind: 's', wi }); return; }
        if (!/\p{L}/u.test(p)) { out.push({ s: p, kind: 'p', wi }); return; }
        wi++;
        if (level === 'szó') out.push({ s: clean(p), kind: 'w', wi, si: 0 });
        else if (level === 'szótag') syl1(p.replace(/·/g, '·')).length && syllabify(p).forEach((y, si) => out.push({ s: y, kind: 'syl', wi, si }));
        else split(p).forEach((x, si) => out.push({ s: x.t, kind: x.kind, wi, si, l: x.s }));
      });
      out.forEach((t, i) => { t.i = i; if (o.k) t.k = o.k; });
      return out;
    };
    T.layout = (tokens, o = {}) => {
      const f = fo(o), s = f.s, gap = o.gap || 0, maxW = o.maxW || 1e9, lh = s * (o.lh || base.lh);
      const sp = L.measure(' ', f).w;
      tokens.forEach((t) => { t.w = t.fw != null ? t.fw : t.kind === 's' ? sp : L.measure(t.s, f).w; });
      const units = []; let u = [];
      tokens.forEach((t) => { if (t.kind === 's') { if (u.length) units.push(u); units.push([t]); u = []; } else u.push(t); });
      if (u.length) units.push(u);
      const inner = (a, b) => (a && b && a.kind !== 'p' && b.kind !== 'p' && a.kind !== 'slot' && b.kind !== 'slot' ? gap : 0);
      const uw = (v) => v.reduce((acc, t, j) => acc + t.w + (j ? inner(v[j - 1], t) : 0), 0);
      const lines = []; let line = [], lw = 0;
      units.forEach((v) => {
        if (v[0].kind === 's') { if (line.length) { line.push(v[0]); lw += v[0].w; } return; }
        const w = uw(v);
        if (line.length && lw + w > maxW) { while (line.length && line[line.length - 1].kind === 's') { lw -= line.pop().w; } lines.push({ t: line, w: lw }); line = []; lw = 0; }
        v.forEach((t, j) => { line.push(t); lw += t.w + (j ? inner(v[j - 1], t) : 0); });
      });
      while (line.length && line[line.length - 1].kind === 's') { lw -= line.pop().w; }
      if (line.length) lines.push({ t: line, w: lw });
      const a = o.a || 'left', x = o.x || 0, y = o.y || 0;
      let W = 0, minX = 1e9;
      lines.forEach((ln, li) => {
        let xx = a === 'center' ? x - ln.w / 2 : a === 'right' ? x - ln.w : x; minX = Math.min(minX, xx);
        ln.t.forEach((t, j) => { if (j) xx += inner(ln.t[j - 1], t); t.x = xx; t.y = y + li * lh; t.h = s; xx += t.w; });
        ln.y = y + li * lh; W = Math.max(W, ln.w);
      });

  const bands = EV.filter((e) => dat(e.d).t === 'range').map((e) => { const [u0, u1] = evSpan(e); return { u0, u1, col: e.olv ? 'rgba(143,90,12,.35)' : 'rgba(200,64,28,.30)', a: o.hi ? .3 + .7 * o.hi(e) : 1 }; });
  TL.draw({ bands, cent: .9, a: o.a == null ? 1 : o.a });
}
function drawEvMarks(o = {}) {
  EV.forEach((e) => {
    const h = o.hi ? o.hi(e) : 1; if (h <= .01) return;
    const [u0, u1, um] = evSpan(e), x = TL.x(um), col = e.poem ? OCH : e.olv ? OCH : INK;
    const A0 = c.globalAlpha; c.globalAlpha = A0 * h;
    if (u1 > u0) { c.strokeStyle = col; c.lineWidth = 4; c.beginPath(); c.moveTo(TL.x(u0), TL.top - 6); c.lineTo(TL.x(u1), TL.top - 6); c.stroke(); }
    c.beginPath(); c.arc(x, TL.top, 7.5, 0, U.TAU); c.fillStyle = col; c.fill(); c.strokeStyle = CARD; c.lineWidth = 2.5; c.stroke();
    const ly = labelY(e);
    c.strokeStyle = U.rgba(INK, .45); c.lineWidth = 1.5; c.beginPath(); c.moveTo(x, ly + 14); c.lineTo(x, TL.top - 8); c.stroke();
    L.pill(evYearText(e), x, ly, { a: 'center', s: 22, w: 700, f: F.M, bg: CARD, bd: U.rgba(col, .7), bw: 2, c: col, pad: 8, k: e.d });

const evAnchor = (e) => ({ x: TL.x(evSpan(e)[2]), y: labelY(e) - 18 });
function thread(x1, y1, x2, y2, o = {}) {
  c.strokeStyle = o.c || INK; c.lineWidth = o.lw || 3; c.lineCap = 'round'; c.setLineDash(o.dash || []);
  c.beginPath(); c.moveTo(x1, y1);
  if (o.straight) c.lineTo(x2, y2);

/* ═════════ 1. Kihez beszél a vers? ═════════ */
const S1 = { m: 0, from: 0, t0: -99 };
function set1(m) { if (m === S1.m) return; const cur = mix1(sT[0] || 0); S1.from = cur; S1.m = m; S1.t0 = L.st; }
const mix1 = (t) => U.lerp(S1.from, S1.m, ease(S1.t0, .8, t));
function placeLabels(items, y, f) {          // feliratok balról jobbra, átfedés nélkül; vezetővonal a szóhoz
  let end = -1e9;
  items.sort((a, b) => a.x - b.x).forEach((it) => {
    const w = L.measure(lab(it.k), f).w; let x = Math.max(it.x - w / 2, end + 24, 60);
    end = x + w; it.lx = x; it.lw = w;
    c.strokeStyle = U.rgba(it.c, .7); c.lineWidth = 2; c.beginPath(); c.moveTo(it.x, it.wy); c.lineTo(x + w / 2, y + (it.wy < y ? -26 : 8)); c.stroke();
    L.tx(lab(it.k), x, y, Object.assign({}, f, { c: it.c, k: it.k }));
  });
}
function scene1(t) {
  const m = mix1(t), a0 = 1 - m, a1 = m;
  ga(U.smooth(t / .5));

  const LF = { f: F.B, s: 24, w: 700 };

    ga(a0 * U.smooth(t / .5));
    L.tx(lab('himnusz forrás felirat'), 110, 110, { s: 26, f: F.B, w: 600, c: MUTED, k: 'himnusz forrás felirat' });
    pillNote('himnusz műfaj felirat', 1300, 110, { a: 'right', s: 26, bd: LILA, c: LILA, bw: 2.5 });
    const s1 = L.quote(HK(1, 1)), wI = findWord(s1, 'Isten'), wA = findWord(s1, 'áldd meg'), wM = findWord(s1, 'a magyart');
    const r = segLine(s1, 110, Y1, f, [{ ...wI, c: LILA, u: true }, { ...wA, c: CIN, u: true }, { ...wM, c: OCH, u: true }], HK(1, 1));
    segLine(L.quote(HK(1, 2)), 110, Y2, f, [], HK(1, 2));
    const mid = (w) => (r.px(w.i0) + r.px(w.i1)) / 2;
    ga(a0 * U.smooth((t - .8) / .6));
    placeLabels([{ k: 'megszólítás felirat', x: mid(wI), wy: Y1 - 44, c: LILA }, { k: 'felszólítás felirat', x: mid(wA), wy: Y1 - 44, c: CIN }], Y1 - 70, LF);
  }
  // Szózat
  if (a1 > .01) {
    ga(a1);
    L.tx(lab('szózat forrás felirat'), 110, 110, { s: 26, f: F.B, w: 600, c: MUTED, k: 'szózat forrás felirat' });
    pillNote('szózat műfaj felirat', 1300, 110, { a: 'right', s: 26, bd: OCH, c: OCH, bw: 2.5 });
    segLine(L.quote(SK(1, 1)), 110, Y1, f, [], SK(1, 1));
    const s2 = L.quote(SK(1, 2)), wL = findWord(s2, 'Légy híve'), wO = findWord(s2, 'oh magyar');
    const r = segLine(s2, 110, Y2, f, [{ ...wL, c: CIN, u: true }, { ...wO, c: LILA, u: true }], SK(1, 2));
    const mid = (w) => (r.px(w.i0) + r.px(w.i1)) / 2;
    placeLabels([{ k: 'felszólítás 2 felirat', x: mid(wL), wy: Y2 + 14, c: CIN }, { k: 'megszólítás felirat', x: mid(wO), wy: Y2 + 14, c: LILA }], Y2 + 56, LF);

  ga(U.smooth((t - .4) / .7));
  const E = { x: 230, y: 640 }, I = { x: 680, y: 500 }, M = { x: 1130, y: 640 };
  const NF = { s: 32, w: 700, f: F.B, pad: 18 };
  // nyilak
  ga(U.smooth((t - .9) / .6) * a0);
  arrow(E.x + 70, E.y - 30, I.x - 90, I.y + 18, { c: LILA, lw: 5 });
  L.tx(lab('beszél hozzá felirat'), 430, 540, { s: 24, f: F.B, w: 700, a: 'right', c: LILA, k: 'beszél hozzá felirat' });
  arrow(E.x + 110, E.y, M.x - 120, M.y, { c: OCH, lw: 3, dash: [12, 10] });
  L.tx(lab('róla beszél felirat'), 680, E.y + 44, { s: 24, f: F.B, w: 700, a: 'center', c: OCH, k: 'róla beszél felirat' });
  ga(U.smooth((t - .9) / .6) * a1);
  arrow(E.x + 110, E.y, M.x - 120, M.y, { c: LILA, lw: 5 });
  L.tx(lab('beszél hozzá felirat'), 680, E.y + 44, { s: 24, f: F.B, w: 700, a: 'center', c: LILA, k: 'beszél hozzá felirat' });
  // csomópontok

  const iA = .35 + .65 * a0;
  ga(U.smooth((t - .4) / .7) * iA);
  L.pill(lab('isten név'), I.x, I.y, Object.assign({ a: 'center', bg: a0 > .5 ? LILA : CARD, bd: LILA, bw: 3, c: a0 > .5 ? CARD : LILA, k: 'isten név' }, NF));

  // szerep-címkék

  // névmások
  const yb = 850;
  [[a0, 'mi felirat', 'mi szavak', TEAL], [a1, 'te felirat', 'te szavak', LILA]].forEach(([aa, k1, k2, col]) => {
    if (aa < .01) return;
    ga(U.smooth((t - 1.6) / .6) * aa);

    L.tx(lab(k1), 110, yb, { s: 28, f: F.D, w: 600, i: true, c: col, k: k1, max: 1160 });
    const ws = lab(k2).split('·').map((x) => x.trim());
    let x = 110;
    ws.forEach((w) => { const b = L.pill(w, x, yb + 60, { s: 28, w: 650, f: F.D, i: true, bg: CARD, bd: col, bw: 2.5, c: INK, pad: 14, k: k2 }); x += b.w + 22; });
  });
}

/* ═════════ 2. Hét és hat: forma és keresztrím ═════════ */
const S2 = { st: 1, from: 1, t0: -99, show: 'both', ts: -99, u: 0 };
function set2st(n) { if (S2.st === n) return; S2.from = S2.st; S2.st = n; S2.t0 = L.st; }
function scene2(t) {
  const sw = ease(S2.t0, .7, t), cur = sw < .5 ? S2.from : S2.st, fa = Math.abs(sw - .5) * 2;
  const pr = rhymeOf('him rímképlet');
  ga(U.smooth(t / .5));
  L.tx(lab('himnusz forrás felirat'), 900, 120, { s: 26, f: F.B, w: 600, c: MUTED, k: 'himnusz forrás felirat', max: 420 });
  stamp('régi írásmód bélyeg', 1210, 190);
  const showSyl = S2.show !== 'rim', showRim = S2.show !== 'syl';
  const ra = showRim ? (S2.show === 'both' ? U.smooth((t - 3.2) / .8) : 1) : 0;
  const keys = STANZA(cur), X = 110, Y0 = 165, DY = 106;
  ga(fa);
  L.tx(fill(lab('versszak felirat'), cur), X, 92, { s: 30, f: F.D, w: 700, c: INK, k: 'versszak felirat' });
  keys.forEach((k, i) => {
    const y = Y0 + i * DY, lay = V.layout(Q(k), { x: X, y, s: 42, k, max: 600 });
    const p = pr[i], rv = (t - .4 - i * .25) / .05;
    ga(fa);
    V.draw(lay, { rhyme: ra > .5 ? RC[p] : null, rhymeN: 1, c: INK, fade: S2.u > 0 ? { u: S2.u, seed: 7 + cur * 10 + i } : null });
    if (showSyl) {
      ga(fa); V.dots(lay, { dy: 32, r: 7, spread: 20, reveal: S2.show === 'both' ? rv : 1e3, fill: () => INK });
      ga(fa * U.smooth(S2.show === 'both' ? (t - .9 - i * .25) / .4 : 1));
      L.tx(fill(lab('szótagszám felirat'), lay.q.syl), 640, y + 10, { s: 24, f: F.M, w: 700, c: lay.q.syl === 7 ? TEAL : OCH, k: 'szótagszám felirat' });
    }
    if (ra > .01) {
      ga(fa * ra);
      L.tx(p, 770, y, { s: 30, f: F.D, w: 700, i: true, c: RC[p], a: 'center', k: 'him rímképlet' });
    }
  });

    ga(fa * ra);

      const j = pr.slice(0, 8).indexOf(pr[i], i + 1); if (j < 0) continue;
      const y1 = Y0 + i * DY - 12, y2 = Y0 + j * DY - 12, bx = 800 + (i % 2) * 38;
      c.strokeStyle = RC[pr[i]]; c.lineWidth = 3.5; c.lineCap = 'round';
      c.beginPath(); c.moveTo(790, y1); c.bezierCurveTo(bx + 30, y1, bx + 30, y2, 790, y2); c.stroke();
    }
    ga(ra);
    pillNote('keresztrím felirat', 1100, 300, { s: 28, bd: CIN, c: CIN, bw: 2.5 });
  }
  // 8 versszak × 8 sor rácsa
  ga(U.smooth((t - 1.5) / .6));
  const nV = num('Himnusz versszakai');
  L.tx(fill(lab('nyolc versszak felirat'), nV * 8), 1100, 420, { s: 26, f: F.B, w: 700, a: 'center', c: INK, k: 'nyolc versszak felirat' });
  for (let s = 1; s <= nV; s++) {
    const gx = 925 + (s - 1) * 46, on = s === cur;
    for (let ln = 1; ln <= 8; ln++) {
      const q = Q(HK(s, ln)), w = q.syl * 4.6, gy = 470 + (ln - 1) * 30;
      c.fillStyle = on ? CIN : U.rgba(INK, .35); c.fillRect(gx, gy, w, 14);
    }
    L.tx(String(s), gx + 15, 740, { s: 22, f: F.M, w: on ? 700 : 500, a: 'center', c: on ? CIN : MUTED, k: 'versszak felirat' });
  }
}

/* ═════════ 3–4. Áldások, csapások: versszak + időszalag ═════════ */
// csoportok: a versszak sorai (tól–ig) → esemény (vagy dátum nélküli kép)
const GROUPS = {
  2: [{ l: [1, 8], ev: 'honf', stamp: { ln: 4, k: 'hagyomány bélyeg' } }],
  3: [{ l: [1, 4], chip: 'bőség felirat' }, { l: [5, 6], ev: 'nf', note: 'gyakran felirat' }, { l: [7, 8], ev: 'becs' }],
  4: [{ l: [1, 4], chip: 'harag felirat' }, { l: [5, 6], ev: 'tatar' }, { l: [7, 8], ev: 'buda' }],
  5: [{ l: [1, 4], ev: 'mohacs' }, { l: [5, 8], chip: 'belviszály felirat' }],
  6: [{ l: [1, 8], ev: 'rak', note: '6 vsz olvasat felirat' }],
  7: [{ l: [1, 8], ev: 'vers', chipK: '7 vsz olvasat felirat' }],
};
const PAGES = { 2: [2, 3], 3: [4, 5, 6, 7] };       // lépésindex → versszakok
const SP = { 2: { pg: 0, from: 0, t0: -99 }, 3: { pg: 0, from: 0, t0: -99 } };
function setPage(si, pg) { const S = SP[si]; if (S.pg === pg) return; S.from = S.pg; S.pg = pg; S.t0 = L.st; }
const SX = 90, SY0 = 160, SDY = 50, CHX = 700;
function scenePages(si, t, act) {
  const S = SP[si], sw = ease(S.t0, .7, t), pg = sw < .5 ? S.from : S.pg, fa = Math.abs(sw - .5) * 2;
  const st = PAGES[si][pg], gs = GROUPS[st], bless = si === 2, col = bless ? TEAL : CIN;
  ga(U.smooth(t / .5));
  // időszalag: az e lépés eseményei teljes, a többi halvány; a vers születése mindig
  const mine = (e) => PAGES[si].includes(evStanza(e)) || e.poem;
  const cur = (e) => evStanza(e) === st;
  drawTL({ hi: (e) => (mine(e) ? 1 : .15) });
  ga(U.smooth(t / .5));
  drawEvMarks({ hi: (e) => (cur(e) ? 1 : mine(e) ? .45 : .12) });
  // versszak
  ga(fa);
  L.tx(fill(lab('versszak felirat'), st), SX, 100, { s: 30, f: F.D, w: 700, c: INK, k: 'versszak felirat' });
  L.pill(lab(bless ? 'áldás felirat' : 'csapás felirat'), 1300, 92, { a: 'right', s: 24, w: 700, f: F.B, ls: '3px', bg: col, bd: col, c: CARD, pad: 12, k: bless ? 'áldás felirat' : 'csapás felirat' });
  const f = { f: F.D, s: 34, w: 500 };
  const ends = [];
  for (let ln = 1; ln <= 8; ln++) {
    const k = HK(st, ln), s = L.quote(k), y = SY0 + (ln - 1) * SDY;
    let marks = [];
    if (st === 3 && ln >= 7) marks = ['bús', 'Bécsnek', 'büszke'].map((w) => findWord(s, w)).filter(Boolean).map((m) => ({ ...m, c: CIN, u: true }));
    const r = segLine(s, SX, y, f, marks, k);
    ends[ln] = r.x + r.w;
  }
  const CF = { s: 26, w: 700, f: F.B, pad: 14, max: 560 };
  const G = gs.map((g, gi) => {        // geometria előre: a szálak a csipek MÖGÖTT futnak
    const ya = SY0 + (g.l[0] - 1) * SDY - 30, yb = SY0 + (g.l[1] - 1) * SDY + 10, ym = (ya + yb) / 2;
    const e = g.ev ? evById(g.ev) : null, olv = e && e.olv, gc = e ? (olv ? OCH : col) : MUTED;
    const ck = e ? (g.chipK || e.name) : g.chip, s0 = lab(ck);
    let m = L.measure(s0, CF), sz = CF.s; if (m.w > CF.max) { sz = CF.s * CF.max / m.w; m = { w: CF.max }; }
    const w = m.w + CF.pad * 2, h = sz * 1.3 + CF.pad * .8, b = { x: CHX, y: ym - h / 2, w, h };
    return { g, gi, ya, yb, ym, e, olv, gc, ck, b, ap: U.smooth((t - .6 - gi * .5) / .6) };
  });
  G.forEach(({ g, gi, e, olv, gc, b, ap }) => {
    if (!e) return;
    const ta = U.smooth((t - .9 - gi * .5) / .7); ga(fa * ap * ta);
    const an = evAnchor(e), x1 = b.x + b.w / 2, y1 = b.y + b.h + (g.note ? 34 : 0);
    thread(x1, y1 + 4, an.x, an.y, { c: gc, lw: 3, dash: olv ? [10, 8] : [] });
  });
  G.forEach(({ g, ya, yb, ym, e, olv, gc, ck, b, ap }) => {
    ga(fa * ap);
    c.strokeStyle = gc; c.lineWidth = 4; c.lineCap = 'round'; c.setLineDash(olv || !e ? [9, 8] : []);
    c.beginPath(); c.moveTo(SX - 18, ya); c.lineTo(SX - 28, ya); c.lineTo(SX - 28, yb); c.lineTo(SX - 18, yb); c.stroke(); c.setLineDash([]);
    if (g.stamp) stamp(g.stamp.k, ends[g.stamp.ln] + 140, SY0 + (g.stamp.ln - 1) * SDY - 12, { c: OCH });
    L.pill(lab(ck), CHX, ym, Object.assign({}, CF, { bg: e ? CARD : 'rgba(255,250,241,.6)', bd: gc, bw: 2.5, c: e ? gc : MUTED, k: ck }));
    if (!e) { c.setLineDash([6, 6]); c.strokeStyle = MUTED; c.lineWidth = 2; c.beginPath(); c.roundRect(b.x - 5, b.y - 5, b.w + 10, b.h + 10, (b.h + 10) / 2); c.stroke(); c.setLineDash([]); }
    if (olv) {
      const sw = L.measure(lab('olvasat bélyeg'), { s: 22, f: F.B, w: 600, ls: '1.5px' }).w + 30;
      if (b.x + b.w + 22 + sw < 1358) stamp('olvasat bélyeg', b.x + b.w + 22, ym, { a: 'left', c: OCH });
      else stamp('olvasat bélyeg', b.x + b.w, b.y - 28, { a: 'right', c: OCH });
    }
    if (g.note) L.tx(lab(g.note), CHX + 4, ym + 46, { s: 22, f: F.B, w: 600, c: MUTED, k: g.note, max: 620 });
  });
  if (st === 3) {
    ga(fa * U.smooth((t - 2.2) / .6));
    L.pill(lab('alliteráció felirat'), SX, 600, { s: 24, w: 700, f: F.B, bg: CARD, bd: CIN, bw: 2, c: CIN, pad: 12, k: 'alliteráció felirat' });
  }
}

/* ═════════ 5. Nem időrendben! – versszakok az időszalagra ═════════ */
const ST5 = [2, 3, 4, 5, 6, 7];
const S5 = { placed: {}, drop: {}, drag: null, back: null, msg: null, seq: -99 };
const CHY = 200, slotX = (i) => 175 + i * 200;
function chipPos(st) { return { x: slotX(ST5.indexOf(st)), y: CHY }; }
/* a versszakok számai az események időrendjében (egymás utáni ismétlés nélkül): 2 → 4 → 3 → 5 → 4 → 6 → 7 */
const EV_T = () => EV.slice().sort((a, b) => evSpan(a)[0] - evSpan(b)[0]);
function timeSeq() { const out = []; EV_T().forEach((e) => { const n = evStanza(e); if (out[out.length - 1] !== n) out.push(n); }); return out; }
const isFact = (st) => evsOf(st).every((e) => !e.olv);
function chipSize(st) { const a = L.measure(lab(st + ' vsz chip').split('·')[0].trim(), { s: 28, f: F.D, w: 700 }).w, b = L.measure((lab(st + ' vsz chip').split('·')[1] || '').trim(), { s: 22, f: F.B, w: 600 }).w; return { w: Math.max(a, b) + 34, h: 82 }; }
function drawChip(st, x, y, o = {}) {
  const z = chipSize(st), parts = lab(st + ' vsz chip').split('·').map((s) => s.trim()), col = st <= 3 ? TEAL : CIN;
  c.save(); if (o.lift) { c.shadowColor = 'rgba(40,30,10,.25)'; c.shadowBlur = 18; c.shadowOffsetY = 6; }
  card(x - z.w / 2, y - z.h / 2, z.w, z.h, { r: 14, bd: col, lw: 3, bg: CARD }); c.restore();
  L.tx(parts[0], x, y - 6, { s: 28, f: F.D, w: 700, a: 'center', c: col, k: st + ' vsz chip' });
  L.tx(parts[1] || '', x, y + 26, { s: 22, f: F.B, w: 600, a: 'center', c: INK, k: st + ' vsz chip' });
  if (o.done) check(x + z.w / 2 - 4, y - z.h / 2 + 2, GOOD, .9);
}
function threadsOf(t) {     // [{st, x1, y1, x2, y2, olv, col}]

    [[XH, r[1]], [XS, r[2]]].forEach(([x, k]) => L.tx(vals[k] || lab(k), x + 6, y, { s: 26, f: F.B, w: 600, c: INK, k, max: W2 - 44 }));
    c.strokeStyle = 'rgba(28,36,64,.12)'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(XL, y + 26); c.lineTo(XS + W2 - 16, y + 26); c.stroke();
  });
  ga(U.smooth((t - 1.8) / .6));
  stamp('zene megjegyzés', 690, 700, { c: MUTED });
  ga(U.smooth((t - 2.3) / .6));
  pillNote('kérdés 1', 690, 810, { s: 28, f: F.D, w: 600, i: true, bd: CIN, c: CIN, bw: 2.5, max: 1200 });
  ga(U.smooth((t - 2.8) / .6));
  pillNote('kérdés 2', 690, 910, { s: 28, f: F.D, w: 600, i: true, bd: TEAL, c: TEAL, bw: 2.5, max: 1200 });
}

const SCENES = [scene1, scene2, (t, a) => scenePages(2, t, a), (t, a) => scenePages(3, t, a), scene5, scene6, scene7, scene8];
const sT = [];

/* ═════════ ellenőrzések (QA: L.checks; a .md adatai ↔ a lecke számolása) ═════════ */
let DATA_ERR = [];
function checks() {
  const out = [], eq = (name, got, want) => out.push({ name, ok: JSON.stringify(got) === JSON.stringify(want), got: JSON.stringify(got), want: JSON.stringify(want) });
  const C = window.LESSON_CONTENT, keys = Object.keys((C && C.quotes) || {});
  const nH = num('Himnusz versszakai');
  eq('Himnusz: versszak × 8 sor = idézett sorok', keys.filter((k) => k.startsWith('him ')).length, nH * 8);
  eq('Himnusz szótagszám 7/6 váltakozva', keys.filter((k) => k.startsWith('him ')).map((k) => Q(k).syl).every((n, i) => n === (i % 2 ? 6 : 7)), true);
  eq('Szózat szótagszám 8/6 váltakozva', keys.filter((k) => k.startsWith('szo ')).map((k) => Q(k).syl).every((n, i) => n === (i % 2 ? 6 : 8)), true);
  keys.forEach((k) => { const y = MagVers.syls(Q(k)); eq('szótagok ' + k, [y.map((x) => x.s).join(''), y.length], [Q(k).s, Q(k).syl]); });
  // rímek: a Himnusz minden versszakában a rímpárok sorvégi magánhangzója egyezik
  const p = rhymeOf('him rímképlet');
  for (let s = 1; s <= nH; s++) p.slice(0, 8).forEach((x, i) => { const j = p.indexOf(x); if (j !== i) eq('rím ' + HK(s, j + 1) + ' – ' + HK(s, i + 1), MagVers.rhymeOk(Q(HK(s, j + 1)), Q(HK(s, i + 1)), 1), true); });
  [1, 2, 10, 11, 13, 14].forEach((s) => eq('Szózat rím ' + s, MagVers.rhymeOk(Q(SK(s, 2)), Q(SK(s, 4)), 1), true));
  // időrend: az események sorrendje és a versszakok
  const order = ['honf', 'tatar', 'nf', 'becs', 'mohacs', 'buda', 'rak', 'vers'].map((id) => evSpan(evById(id))[0]);
  eq('események időrendje', order.every((u, i) => !i || u > order[i - 1]), true);
  eq('versszak-hozzárendelés (2–7)', EV.every((e) => evStanza(e) >= 2 && evStanza(e) <= 7), true);
  eq('a 4. versszak: tatárjárás és Buda', evsOf(4).map((e) => e.id).sort(), ['buda', 'tatar']);
  eq('nem időrendben: a tatárjárás a Mátyás-versszak után jön', evStanza(evById('tatar')) > evStanza(evById('becs')) && evSpan(evById('tatar'))[0] < evSpan(evById('becs'))[0], true);
  eq('a GROUPS eseményei = a versszak eseményei', [2, 3, 4, 5, 6, 7].every((st) => JSON.stringify(GROUPS[st].filter((g) => g.ev).map((g) => g.ev).sort()) === JSON.stringify(evsOf(st).map((e) => e.id).sort())), true);
  // kereszteződések: versszak-sorrendben és időrendben is van (a „nem bogozható” felirat állítása)
  if (TL) {
    const save = S5.placed; S5.placed = {}; ST5.forEach((st) => { S5.placed[st] = -99; });
    const c0 = crossings(threadsOf(0)).length; S5.placed = save;
    eq('kereszteződés versszak-sorrendben > 0', c0 > 0, true);
    const sq = timeSeq(); eq('időrendben a versszakszámok nem nőnek végig', sq.some((n, i) => i && n < sq[i - 1]), true);
  }
  // keret: az 1. és a 8. versszakban 5 sor ugyanaz (3., 5–8.), az 1., 2., 4. más
  eq('keret: azonos sorok', STANZA(1).map((k, i) => sameLine(L.quote(k), L.quote(STANZA(8)[i]))), [false, false, true, false, true, true, true, true]);
  eq('Szózat keret: 2. ↔ 14. versszak szavai azonosak', SSTANZA(2).every((k, i) => sameLine(L.quote(k), L.quote(SSTANZA(14)[i]))), true);
  // keletkezés és zene
  eq('Himnusz < megjelenés < Szózat < Egressy < Erkel', [dat('Himnusz kézirata').v, num('Himnusz első megjelenése'), num('Szózat keletkezése'), num('Egressy zenéje'), num('Erkel zenéje')].every((v, i, a) => !i || v > a[i - 1]), true);
  eq('Szózat versszakai', num('Szózat versszakai'), 14);
  return out;
}

      } },
    { settle: 3.5 },
  ],
  init(Lx) {
    L = Lx; c = L.ctx;
    V = MagVers.create(L, { f: F.D, s: 42, w: 500, c: INK });
    const T = { bc: { s: lab('Kr. e.'), k: 'Kr. e.' }, ad: { s: lab('Kr. u.'), k: 'Kr. u.' }, cent: { s: lab('század'), k: 'század' }, years: { s: lab('év'), k: 'év' } };
    TL = TortTimeline.create(L, { x0: 80, x1: 1290, y: 905, h: 56, T });
    TL.view(VIEW[0], VIEW[1]);
    L.checks = checks;
    DATA_ERR = checks().filter((x) => !x.ok).map((x) => x.name);
    if (DATA_ERR.length) console.warn('A .md adatai és a lecke számolása eltér: ' + DATA_ERR.join('; '));
  },
  draw(Lx) {
    L = Lx; c = L.ctx; GA = 1; background();
    if (L.step >= 0) sT[L.step] = L.st;
    for (let i = 0; i < SCENES.length; i++) {
      const w = clamp(1 - Math.abs(L.sp - i) * 2); if (w <= .005) continue;
      GA = w; c.save(); c.globalAlpha = w; SCENES[i](sT[i] == null ? 0 : sT[i], L.step === i); c.restore();
    }
    c.globalAlpha = 1;
    if (DATA_ERR.length) L.pill(lab('adathiba felirat').replace('#', DATA_ERR.slice(0, 3).join('; ')), 680, 1040, { a: 'center', s: 24, w: 600, bg: BAD, c: CARD, pad: 12, k: 'adathiba felirat', max: 1240 });
  },
});
