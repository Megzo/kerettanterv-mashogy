<script>
(function () {
'use strict';

/* ── MODUL: Szöveg (MagText) · forrás: magyar-5-6/04-toldalek, 2026-11-24 ── */
/* Magyar szöveg betű / szótag / szó szinten: tokenekre bontás, mért elrendezés, kiemelés, csempe, áttűnés.
   Csak a Lesson motorra épül (Lesson.U, Lesson.FONTS); minden felirat L.tx-szel kerül a vászonra (QA, review mód).
   Statikus (nem rajzol):
     MagText.ABC                 a 44 betűs magyar ábécé sorrendben: a, á, b, c, cs, d, dz, dzs, e, é, … z, zs
     MagText.clean(s)            s a jelölők nélkül: „|” (szóelemhatár), „·” (kézi szótaghatár)
     MagText.split(s)            → [{s, t, i, n, kind: 'v'|'c'|'x', long, dbl}] a betűk: s a betű (pl. 'sz'), t az írott
                                 darab, i/n a helye a tiszta szövegben; többjegyű betű egy elem (dzs > dz > d); kettőzött
                                 többjegyű (ssz, ggy, ccs, lly, nny, tty, zzs) két betű: 'sz' (t: 's', dbl) + 'sz';
                                 a „|” felülírja a felismerést (kis|szék: s + sz); kind 'x': szóköz, írásjel
     MagText.letters(s)          → ['cs', 'i', 'g', 'a'] (csak a betűk)
     MagText.isVowel(ch)         a, á, e, é, i, í, o, ó, ö, ő, u, ú, ü, ű (+ régi õ, û, ô, ë, ä); az y nem
     MagText.vowels(s)           → [{i, v, long, h: 'mély'|'magas', round}] (i: hely a tiszta szövegben)
     MagText.harmony(s)          → 'mély' | 'magas' | 'vegyes' | null (nincs magánhangzó) – csak a betűk szerint
     MagText.syllabify(s)        → ['asz', 'szony']: magánhangzónként egy szótag; egy mássalhangzó a következő szótagba
                                 kerül, torlódásnál csak az utolsó; két magánhangzó között választ (fi-a-tal); a többjegyű
                                 betű nem válik szét, a kettőzött igen (asz-szony); „·” kézi szótaghatár (vas·út);
                                 szóközös szövegnél szavanként (a sorokon átívelő verstani szótagolás a MagVers dolga)
     MagText.cmp(a, b)           → {r: −1|0|1, i, pass}: magyar betűrend (AkH. 12.): 1. menet a betűk sorrendje (a rövid és a
                                 hosszú magánhangzó egyenértékű), 2. menet rövid < hosszú, 3. menet kisbetű < nagybetű;
                                 i: a döntő betű indexe (MagText.letters szerint), pass: melyik menet döntött (0: egyenlő);
                                 a szóköz, kötőjel, írásjel nem számít. Régi írásmódú betűkapcsolatot (ch, cz, th) nem kezel.
     MagText.collate(a, b)       → −1 | 0 | 1 (rendezéshez: tömb.sort(MagText.collate))
     MagText.diff(a, b)          → [[ia, ib], …] a két betűsor (MagText.letters) leghosszabb közös részsorozata
   Példány:
     const T = MagText.create(L, {f, s, w, i, c, lh})   alapfont (alap: Fraunces, 44 px, 560, tinta), lh: sormagasság × s
     T.tokens(s, 'szó'|'szótag'|'betű', {k}) → [{s, i, kind, wi, si}]   kind: 'w' szó · 'syl' szótag · 'v'/'c' betű ·
                                 's' szóköz · 'p' írásjel; wi: a szó sorszáma, si: a szótag/betű helye a szóban; k: md-kulcs.
                                 Saját token is betehető (pl. {kind: 'slot', fw: 300} helyőrző egy csempés szónak).
     T.layout(tokens, {x, y, w, a, gap, s, f, lh}) → lay   mért elrendezés, tördelés szóközön (nincs fix doboz); a: 'left' |
                                 'center' | 'right' – x a sorok bal széle / közepe / jobb széle, y az első sor alapvonala;
                                 w: legnagyobb sorszélesség; gap: köz a szón belüli tokenek (szótag, betű) között, px.
                                 lay = {tokens (+ x, y, w), lines, x, y, w, h, s, f}
     T.draw(lay, {hi, dim, reveal, under, a, c, tile, off, k})   hi: {tokenindex: szín} vagy fn(t) → szín | null; a nem
                                 kiemelt token dim alfájú (alap .25; hi nélkül nincs halványítás); reveal 0..1: a tokenek
                                 sorban beúsznak; under: {i: szín | {c, dash}} aláhúzás (pl. szófaj); tile: true | fn(t) →
                                 {bg, bd} csempe a token mögé; off: fn(t) → {dx, dy, a}; a: alfa; c: alapszín
     T.morph(layA, layB, u, {hi, a})   két betűszintű elrendezés áttűnése (írás ↔ [ejtés]): a közös betűk (diff) a helyükre
                                 úsznak, a kiesők lefelé halványulnak, az újak felülről úsznak be (hi: az új betűk színe)
     T.pick(lay, px, py)         → a pont alatti token (szóköz nélkül) vagy null
     T.tile(s, x, y, o)          → {x, y, w, h}: szöveghez méretezett csempe; o: s, f, w, c (betű), bg, bd, lw, pad, r, dash,
                                 minW, a ('center': x a közép | 'left'), k; y az alapvonal
*/
const MagText = (() => {
  const U = Lesson.U, F = Lesson.FONTS;
  const ABC = ['a', 'á', 'b', 'c', 'cs', 'd', 'dz', 'dzs', 'e', 'é', 'f', 'g', 'gy', 'h', 'i', 'í', 'j', 'k', 'l', 'ly', 'm',
    'n', 'ny', 'o', 'ó', 'ö', 'ő', 'p', 'q', 'r', 's', 'sz', 't', 'ty', 'u', 'ú', 'ü', 'ű', 'v', 'w', 'x', 'y', 'z', 'zs'];
  const RANK = {}; ABC.forEach((b, i) => { RANK[b] = i; });
  const DI = ['dzs', 'cs', 'dz', 'gy', 'ly', 'ny', 'sz', 'ty', 'zs'];
  const VOW = 'aáeéiíoóöőuúüűõûôëä', LONGV = 'áéíóőúűõûô', DEEP = 'aáoóuú', ROUND = 'öőüűõûô';
  const SHORT = { 'á': 'a', 'é': 'e', 'í': 'i', 'ó': 'o', 'ő': 'ö', 'ú': 'u', 'ű': 'ü', 'õ': 'ö', 'û': 'ü', 'ô': 'ö' };
  const isL = (ch) => /\p{L}/u.test(ch);
  const isVowel = (ch) => !!ch && ch.length === 1 && VOW.includes(ch.toLowerCase());
  const clean = (s) => String(s).replace(/[|·]/g, '');

  function split(s) {
    s = String(s); const out = []; let i = 0, ci = 0;
    while (i < s.length) {
      const ch = s[i];
      if (ch === '|' || ch === '·') { i++; continue; }
      if (!isL(ch)) { out.push({ s: ch, t: ch, i: ci, n: 1, kind: 'x' }); i++; ci++; continue; }
      const lo = s.slice(i, i + 4).toLowerCase();
      let d = null;
      if (lo[1] === lo[0] && (d = DI.find((x) => x[0] === lo[0] && lo.startsWith(x, 1)))) {      // ssz → sz + sz
        const a = s[i], b = s.slice(i + 1, i + 1 + d.length);
        out.push({ s: a + b.slice(1), t: a, i: ci, n: 1, kind: 'c', dbl: true });
        out.push({ s: b, t: b, i: ci + 1, n: d.length, kind: 'c' });
        i += 1 + d.length; ci += 1 + d.length; continue;
      }
      d = DI.find((x) => lo.startsWith(x));
      const n = d ? d.length : 1, t = s.slice(i, i + n), v = !d && isVowel(ch);
      out.push({ s: t, t, i: ci, n, kind: v ? 'v' : 'c', long: v && LONGV.includes(ch.toLowerCase()) });
      i += n; ci += n;
    }
    return out;
  }
  const letters = (s) => split(s).filter((x) => x.kind !== 'x').map((x) => x.s);
  const vowels = (s) => split(s).filter((x) => x.kind === 'v').map((x) => {
    const lo = x.t.toLowerCase();
    return { i: x.i, v: x.t, long: !!x.long, h: DEEP.includes(lo) ? 'mély' : 'magas', round: ROUND.includes(lo) };
  });
  function harmony(s) {
    const v = vowels(s); if (!v.length) return null;
    const d = v.some((x) => x.h === 'mély'), f = v.some((x) => x.h === 'magas');
    return d && f ? 'vegyes' : d ? 'mély' : 'magas';
  }
  function syl1(seg) {
    const t = split(seg); if (!t.length) return [];
    const V = []; t.forEach((x, j) => { if (x.kind === 'v') V.push(j); });
    if (V.length < 2) return [t.map((x) => x.t).join('')];
    const cuts = [];
    for (let j = 0; j + 1 < V.length; j++) { const a = V[j], b = V[j + 1]; cuts.push(b - a - 1 >= 1 ? b - 1 : b); }
    const out = []; let p = 0;
    cuts.concat([t.length]).forEach((q) => { out.push(t.slice(p, q)); p = q; });
    return out.map((arr) => arr.map((x, m) => (x.dbl && m === arr.length - 1 ? x.s : x.t)).join(''));
  }
  function syllabify(s) {
    s = String(s);
    if (/\s/.test(s)) return s.split(/\s+/).filter(Boolean).reduce((a, w) => a.concat(syllabify(w)), []);
    return s.split('·').reduce((a, seg) => a.concat(syl1(seg)), []);
  }
  function key(s) {
    return split(s).filter((x) => x.kind !== 'x').map((x) => {
      const lo = x.s.toLowerCase(), b = SHORT[lo] || lo;
      return { r: RANK[b] != null ? RANK[b] : 100 + b.charCodeAt(0), long: !!SHORT[lo], up: x.s !== lo };
    });
  }
  function cmp(a, b) {
    const A = key(a), B = key(b), n = Math.min(A.length, B.length);
    for (let j = 0; j < n; j++) if (A[j].r !== B[j].r) return { r: A[j].r < B[j].r ? -1 : 1, i: j, pass: 1 };
    if (A.length !== B.length) return { r: A.length < B.length ? -1 : 1, i: n, pass: 1 };
    for (let j = 0; j < n; j++) if (A[j].long !== B[j].long) return { r: A[j].long ? 1 : -1, i: j, pass: 2 };
    for (let j = 0; j < n; j++) if (A[j].up !== B[j].up) return { r: A[j].up ? 1 : -1, i: j, pass: 3 };
    return { r: 0, i: -1, pass: 0 };
  }
  const collate = (a, b) => cmp(a, b).r;
  function diff(a, b) {
    const A = letters(a).map((x) => x.toLowerCase()), B = letters(b).map((x) => x.toLowerCase());
    const n = A.length, m = B.length, D = [];
    for (let i = 0; i <= n; i++) { D.push(new Array(m + 1).fill(0)); }
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) D[i][j] = A[i] === B[j] ? D[i + 1][j + 1] + 1 : Math.max(D[i + 1][j], D[i][j + 1]);
    const out = []; let i = 0, j = 0;
    while (i < n && j < m) { if (A[i] === B[j]) { out.push([i, j]); i++; j++; } else if (D[i + 1][j] >= D[i][j + 1]) i++; else j++; }
    return out;
  }

  function create(L, o0 = {}) {
    const base = Object.assign({ f: F.D, s: 44, w: 560, i: false, c: null, lh: 1.3 }, o0);
    const fo = (o) => ({ f: o.f || base.f, s: o.s || base.s, w: o.w || base.w, i: o.i != null ? o.i : base.i });
    const T = { base };
    T.tokens = (s, level = 'szó', o = {}) => {
      const out = []; let wi = -1;
      (String(s).match(/[\p{L}|·]+|\s+|[^\p{L}|·\s]+/gu) || []).forEach((p) => {
        if (/^\s+$/.test(p)) { out.push({ s: ' ', kind: 's', wi }); return; }
        if (!/\p{L}/u.test(p)) { out.push({ s: p, kind: 'p', wi }); return; }
        wi++;
        if (level === 'szó') out.push({ s: clean(p), kind: 'w', wi, si: 0 });
        else if (level === 'szótag') syl1(p.replace(/·/g, '·')).length && syllabify(p).forEach((y, si) => out.push({ s: y, kind: 'syl', wi, si }));
        else split(p).forEach((x, si) => out.push({ s: x.t, kind: x.kind, wi, si, l: x.s }));
      });
      out.forEach((t, i) => { t.i = i; if (o.k) t.k = o.k; });
      return out;
    };
    T.layout = (tokens, o = {}) => {
      const f = fo(o), s = f.s, gap = o.gap || 0, maxW = o.w || 1e9, lh = s * (o.lh || base.lh);
      const sp = L.measure(' ', f).w;
      tokens.forEach((t) => { t.w = t.fw != null ? t.fw : t.kind === 's' ? sp : L.measure(t.s, f).w; });
      const units = []; let u = [];
      tokens.forEach((t) => { if (t.kind === 's') { if (u.length) units.push(u); units.push([t]); u = []; } else u.push(t); });
      if (u.length) units.push(u);
      const inner = (a, b) => (a && b && a.kind !== 'p' && b.kind !== 'p' && a.kind !== 'slot' && b.kind !== 'slot' ? gap : 0);
      const uw = (v) => v.reduce((acc, t, j) => acc + t.w + (j ? inner(v[j - 1], t) : 0), 0);
      const lines = []; let line = [], lw = 0;
      units.forEach((v) => {
        if (v[0].kind === 's') { if (line.length) { line.push(v[0]); lw += v[0].w; } return; }
        const w = uw(v);
        if (line.length && lw + w > maxW) { while (line.length && line[line.length - 1].kind === 's') { lw -= line.pop().w; } lines.push({ t: line, w: lw }); line = []; lw = 0; }
        v.forEach((t, j) => { line.push(t); lw += t.w + (j ? inner(v[j - 1], t) : 0); });
      });
      while (line.length && line[line.length - 1].kind === 's') { lw -= line.pop().w; }
      if (line.length) lines.push({ t: line, w: lw });
      const a = o.a || 'left', x = o.x || 0, y = o.y || 0;
      let W = 0, minX = 1e9;
      lines.forEach((ln, li) => {
        let xx = a === 'center' ? x - ln.w / 2 : a === 'right' ? x - ln.w : x; minX = Math.min(minX, xx);
        ln.t.forEach((t, j) => { if (j) xx += inner(ln.t[j - 1], t); t.x = xx; t.y = y + li * lh; t.h = s; xx += t.w; });
        ln.y = y + li * lh; W = Math.max(W, ln.w);
      });
      tokens.forEach((t) => { if (t.x == null) { t.x = -1e4; t.y = -1e4; } });
      return { tokens, lines, x: lines.length ? minX : x, y, w: W, h: lines.length * lh, s, f, lh };
    };
    T.draw = (lay, o = {}) => {
      const c = L.ctx, A0 = c.globalAlpha, aa = o.a == null ? 1 : o.a, f = lay.f;
      const vis = lay.tokens.filter((t) => t.kind !== 's' && t.kind !== 'slot' && t.x > -1e3), nV = vis.length;
      vis.forEach((t, idx) => {
        let a = aa, dy = 0, dx = 0;
        if (o.reveal != null) { const r = U.clamp(o.reveal * nV - idx); a *= U.smooth(r); dy = (1 - U.out(r)) * lay.s * .35; }
        const hc = typeof o.hi === 'function' ? o.hi(t) : o.hi ? o.hi[t.i] : null;
        if (o.hi && !hc) a *= o.dim == null ? .25 : o.dim;
        if (o.off) { const q = o.off(t); if (q) { dx += q.dx || 0; dy += q.dy || 0; if (q.a != null) a *= q.a; } }
        if (a <= .003) return;
        c.globalAlpha = A0 * a;
        const x = t.x + dx, y = t.y + dy;
        if (o.tile) {
          const tl = typeof o.tile === 'function' ? o.tile(t) : { bg: '#fffaf1', bd: 'rgba(28,36,64,.35)' };
          if (tl) { const p = lay.s * .14; c.beginPath(); c.roundRect(x - p, y - lay.s * .88, t.w + 2 * p, lay.s * 1.2, lay.s * .18);
            if (tl.bg) { c.fillStyle = tl.bg; c.fill(); } if (tl.bd) { c.lineWidth = tl.lw || 2; c.strokeStyle = tl.bd; c.stroke(); } }
        }
        L.tx(t.s, x, y, Object.assign({}, f, { c: hc || o.c || base.c || undefined, k: t.k || o.k }));
        const ud = o.under && o.under[t.i];
        if (ud) {
          const uc = typeof ud === 'string' ? ud : ud.c; c.strokeStyle = uc; c.lineWidth = Math.max(3, lay.s * .07); c.lineCap = 'round';
          c.setLineDash(ud.dash ? [lay.s * .22, lay.s * .16] : []); c.beginPath(); c.moveTo(x + 2, y + lay.s * .2); c.lineTo(x + t.w - 2, y + lay.s * .2); c.stroke(); c.setLineDash([]);
        }
      });
      c.globalAlpha = A0;
    };
    T.morph = (A, B, u, o = {}) => {
      const c = L.ctx, A0 = c.globalAlpha, aa = o.a == null ? 1 : o.a, e = U.inOut(u);
      const tx = (t, x, y, a, col, lay) => { if (a <= .003) return; c.globalAlpha = A0 * aa * a; L.tx(t.s, x, y, Object.assign({}, lay.f, { c: col || base.c || undefined, k: t.k || o.k })); };
      const ta = A.tokens.filter((t) => t.kind === 'v' || t.kind === 'c'), tb = B.tokens.filter((t) => t.kind === 'v' || t.kind === 'c');

function check(cx, cy, col = GOOD) { c.save(); c.strokeStyle = col; c.lineWidth = 6; c.lineCap = 'round'; c.lineJoin = 'round'; c.beginPath(); c.moveTo(cx - 14, cy); c.lineTo(cx - 4, cy + 11); c.lineTo(cx + 16, cy - 12); c.stroke(); c.restore(); }

/* ─── lejátszás (1. és 4. lépés): valós idő a performance.now() skáláján, hogy a koppintás ideje (ev.ts) mérhető legyen ─── */
const PLAY = { T0: null, sched: [], end: 0, freeze: null, owner: -1, sound: false };
function playStart(owner, keys, o = {}) {
  const dt = o.dt || DT0(), lead = o.lead || .5;
  const qs = keys.map(Q), sched = MagVers.schedule(qs, { dt, lead });
  const clicks = (o.countIn ? Array.from({ length: o.countIn }, (_, i) => ({ t: lead - (o.countIn - i) * dt, strong: false })) : []).concat(sched);
  let T0 = performance.now() + 150;
  PLAY.sound = false;
  if (o.sound && MagHang.unlock()) {
    const r = MagHang.click(clicks.map((x) => x.t), { strong: clicks.map((x) => x.strong), lead: .15 });
    if (r && r.perf0) { T0 = r.perf0; PLAY.sound = true; }
  }
  Object.assign(PLAY, { T0, sched, end: sched.length ? sched[sched.length - 1].t + dt : 0, freeze: null, owner, dt, lead });
}
function playStop() { MagHang.stop(); PLAY.T0 = null; PLAY.freeze = null; PLAY.owner = -1; PLAY.sched = []; }
const gTime = () => (PLAY.freeze != null ? PLAY.freeze : PLAY.T0 == null ? null : (L.now - PLAY.T0) / 1000);
const playing = (owner) => PLAY.owner === owner && gTime() != null;

/* ═════════ 1. Hallgasd, mint a zenét! ═════════ */
function scene1(t, act) {
  const Y0 = 300, DY = 170, s = 50;
  ga(U.smooth(t / .5));
  L.tx(lab('jv forrás felirat'), 110, 130, { s: 26, f: F.B, w: 600, c: MUTED, k: 'jv forrás felirat' });
  stamp('régi írásmód bélyeg', 1150, 122);
  const gt = PLAY.owner === 0 ? gTime() : null, run = gt != null ? (gt - PLAY.lead) / PLAY.dt : null;
  let n0 = 0;
  JV4.forEach((k, i) => {
    const lay = V.layout(Q(k), { x: 110, y: Y0 + i * DY, s, max: 1180, k });
    const rv = (t - .4) / .07 - n0;                      // a szótagok sorban kigyulladnak
    const cur = run == null ? -1 : Math.floor(run) - n0;
    const pop = (j) => (cur === j ? 1 - U.clamp(run - Math.floor(run)) : 0);
    ga(1);
    V.draw(lay, { reveal: rv, hi: run != null ? (j) => (j === cur ? CIN : null) : null, pop: run != null ? pop : null, rhyme: null });
    V.dots(lay, { reveal: rv, dy: 40, r: 8, spread: 24, beats: MagVers.beats(lay.q), fill: (j) => (run == null ? (U.smooth(rv - j) > .5 ? INK : null) : (j + n0 <= run ? (j === cur ? CIN : INK) : null)) });
    n0 += lay.syl.length;
  });
  ga(U.smooth((t - 3.6) / .6));
  pillNote('figyelj felirat', 680, 960, { s: 28, bd: TEAL, c: TEAL, bw: 2.5 });
}

/* ═════════ 2. Számold meg! ═════════ */
const LINES2 = ['jv 1/1', 'jv 1/5', 'mek 14/39', 'jv 13/20', 'mek 17/86', 'jv 1/6', 'jv 9/2'];
const ALT2 = { 'mek 14/39': 'ath 14/39', 'mek 17/86': 'ath 17/86' };
const POS2 = { 'mek 14/39': 'első rövid sor helye', 'mek 17/86': 'második rövid sor helye' };

const S2 = { li: 0, tip: null, t0: 1.0 };
const STEP2 = .26;
function count2(t) { return S2.t0 == null ? -1 : (t - S2.t0) / STEP2; }
function scene2(t) {
  const k = LINES2[S2.li], q = Q(k), cnt = count2(t), n = q.syl, done = cnt >= n + 1;

  });

    const a = U.smooth((cnt - n - 1) / 1.5); ga(a);
    const isMek = !!ALT2[k];
    const res = isMek ? fill(lab('mek sor felirat'), n) : fill(lab('eredmény felirat'), n);
    const bx = L.pill(res, S2.tip != null ? 520 : 680, yR, { a: 'center', s: 30, w: 650, bg: CARD, bd: isMek ? CIN : TEAL, bw: 3, c: isMek ? CIN : TEAL, pad: 16, k: isMek ? 'mek sor felirat' : 'eredmény felirat' });
    if (S2.tip != null) {

      if (ok) check(tb.x + tb.w + 30, yR); else { c.strokeStyle = BAD; c.lineWidth = 5; c.lineCap = 'round'; const x = tb.x + tb.w + 30; c.beginPath(); c.moveTo(x - 11, yR - 11); c.lineTo(x + 11, yR + 11); c.moveTo(x + 11, yR - 11); c.lineTo(x - 11, yR + 11); c.stroke(); }
    }

      L.tx(fill(lab('régi kiadás felirat'), qa.syl), 680, 450, { s: 26, f: F.B, w: 600, a: 'center', c: MUTED, k: 'régi kiadás felirat' });
      const l2 = V.layout(qa, { x: 680, y: 512, s: 40, a: 'center', max: 1160, k: ALT2[k] });
      const wa = q.s.split(/\s+/), wb = qa.s.split(/\s+/);
      let p = 0; const dif = [];
      wb.forEach((w, i) => { const i0 = qa.s.indexOf(w, p); p = i0 + w.length; if (w !== wa[i]) dif.push([i0, p]); });
      V.draw(l2, { hi: (j) => (dif.some(([a0, a1]) => l2.syl[j].vi >= a0 && l2.syl[j].vi < a1) ? TEAL : null), dim: .75 });

  const XL = 640;
  L.tx(fill(lab('rács cím felirat'), U.fmt(N)), XL, 640, { s: 34, f: F.D, w: 600, c: INK, k: 'rács cím felirat' });
  c.fillStyle = 'rgba(10,111,134,.55)'; c.fillRect(XL, 694, 22, 22);
  L.tx(fill(lab('12 rács felirat'), U.fmt(num('12 szótagos sorok a MEK-ben'))), XL + 40, 714, { s: 28, f: F.B, w: 600, c: TEAL, k: '12 rács felirat' });
  c.fillStyle = CIN; c.fillRect(XL, 752, 22, 22);
  L.tx(fill(lab('11 rács felirat'), num('11 szótagos sorok a MEK-ben')), XL + 40, 772, { s: 28, f: F.B, w: 600, c: CIN, k: '11 rács felirat' });

}
function tip2(v) { S2.tip = v; S2.t0 = L.st; }
function next2() { S2.li = (S2.li + 1) % LINES2.length; S2.tip = null; S2.t0 = null; }

/* ═════════ 3. A sor közepe: sormetszet ═════════ */
const S3 = { u0: 0, u1: 1, t0: 2.2 };
function al3(t) { return U.lerp(S3.u0, S3.u1, U.inOut((t - S3.t0) / 1.1)); }
function scene3(t) {
  const s = 52, X = 110, Y0 = 330, DY = 128, GAP = 26, u = al3(t), p = rhymeOf('jv rímképlet');
  ga(U.smooth(t / .5));
  const L0 = JV4.map((k) => V.layout(Q(k), { x: X, y: 0, s, k, gap: GAP }));
  const cutX = Math.max(...L0.map((l) => l.cutX));
  const lays = JV4.map((k, i) => V.layout(Q(k), { x: X + u * (cutX - L0[i].cutX), y: Y0 + i * DY, s, k, gap: GAP }));
  lays.forEach((l, i) => {
    ga(1);
    V.draw(l, { rhyme: RC[p[i]] || INK, rhymeN: 2, hi: (j) => (j < 6 ? INK : TEAL), c: INK });
    V.dots(l, { dy: 38, r: 7, spread: 20, fill: (j) => (j < 6 ? INK : TEAL) });
    ga(1 - u); V.cutLine(l, { c: CIN, lw: 3.5 });
  });
  // a közös metszetvonal
  ga(u); c.strokeStyle = CIN; c.lineWidth = 4; c.setLineDash([12, 8]); c.lineCap = 'round';
  c.beginPath(); c.moveTo(cutX, 230); c.lineTo(cutX, Y0 + 3 * DY + 60); c.stroke(); c.setLineDash([]);
  L.tx(lab('sormetszet felirat'), cutX, Y0 + 3 * DY + 100, { s: 28, f: F.B, w: 700, a: 'center', c: CIN, k: 'sormetszet felirat' });

  const l0 = lays[0], ba = U.smooth((t - 1) / .6); ga(ba);
  const br = (x1, x2, col, k) => {
    const y = l0.y - s * 1.05;
    c.strokeStyle = col; c.lineWidth = 3; c.lineCap = 'round'; c.lineJoin = 'round';
    c.beginPath(); c.moveTo(x1, y + 12); c.lineTo(x1, y); c.lineTo(x2, y); c.lineTo(x2, y + 12); c.stroke();
    L.tx(lab(k), (x1 + x2) / 2, y - 16, { s: 24, f: F.B, w: 700, a: 'center', c: col, k });
  };

  br(l0.syl[6].x - 4, last1.x + last1.w + 4, TEAL, 'ütem 2 felirat');
  ga(U.smooth((t - 3.6) / .6));

}
function set3(v) { const cur = al3(L.st); S3.u0 = cur; S3.u1 = v; S3.t0 = L.st; }

/* ═════════ 4. Dobbants az ütemre! ═════════ */
const S4 = { taps: [], flash: -99 };
const PX4 = 440, SP4 = 92, TY = 330;
function tap4(ts) { if (!playing(3)) return; const g = (ts - PLAY.T0) / 1000; if (g < PLAY.lead - 2 * PLAY.dt || g > PLAY.end + .5) return; S4.taps.push(g); }
function scene4(t, act) {
  ga(U.smooth(t / .5));
  if (act) L.pointer.events.forEach((ev) => { if (ev.type === 'down' && ev.x < 1360) tap4(ev.ts); });
  const gt = PLAY.owner === 3 ? gTime() : null;
  const dt = PLAY.owner === 3 ? PLAY.dt : (L.sliders && L.sliders['tempó csúszka'] ? L.sliders['tempó csúszka'].get() : DT0());
  const lead = PLAY.owner === 3 ? PLAY.lead : 6 * dt;
  const qs = JV4.map(Q), sched = PLAY.owner === 3 ? PLAY.sched : MagVers.schedule(qs, { dt, lead });
  const g = gt == null ? lead - 1.5 * dt : gt;
  const state = gt == null ? 'idle' : gt < lead ? 'count' : gt <= PLAY.end + .3 ? 'run' : 'done';
  // a végén a szalag összehúzódik: az egész versszak egy sorban, rajta a koppintások
  const z = state === 'done' ? U.inOut((gt - PLAY.end - .3) / .9) : 0, SPO = 23.6, XO = 125;
  const pos = (tt) => U.lerp(PX4 + (tt - g) / dt * SP4, XO + (tt - lead) / dt * SPO, z);
  // szalag
  card(60, TY - 110, 1240, 200, { r: 24 });
  c.save(); c.beginPath(); c.rect(64, TY - 106, 1232, 192); c.clip();
  const lays = qs.map((q) => V.layout(q, { x: 0, y: 0, s: 36 }));
  let n = 0;
  lays.forEach((l, li) => l.syl.forEach((y, si) => {
    const ev = sched[n++]; if (!ev) return;
    const x = pos(ev.t); if (x < 40 || x > 1320) return;
    const str = y.s.trim(), w = L.measure(str, Object.assign({}, l.f, { w: ev.strong ? 700 : 500 })).w;
    const past = gt != null && ev.t <= gt, edge = x < 110 || x > 1250 ? .35 : 1;
    ga(ev.strong ? edge : edge * (1 - z));
    if (x - w / 2 > 70 && x + w / 2 < 1290 && (ev.strong || z < .98)) L.tx(str, x, TY - 8, Object.assign({}, l.f, { w: ev.strong ? 700 : 500, a: 'center', c: ev.strong ? CIN : past ? MUTED : INK, k: JV4[li] }));
    ga(edge); c.fillStyle = ev.strong ? CIN : INK; c.beginPath(); c.arc(x, TY + 34, ev.strong ? 9 : 5, 0, U.TAU); c.fill();
    if (ev.strong) { c.fillRect(x - 1.5, TY + 44, 3, 30); }
    if (z > 0 && si === 11 && li < 3) {     // sorhatár az összesítő nézetben
      const xb = x + SPO / 2; ga(z * .6); c.strokeStyle = MUTED; c.lineWidth = 2; c.setLineDash([6, 6]);
      c.beginPath(); c.moveTo(xb, TY - 80); c.lineTo(xb, TY + 80); c.stroke(); c.setLineDash([]);
    }
  }));
  // koppintások a szalagon
  const sc = MagVers.tapScore(S4.taps, sched, { ok: num('pontos tűrés') / 1000, near: num('majdnem tűrés') / 1000 });
  const CC = { pontos: GOOD, majdnem: OCH, 'mellé': BAD };
  sc.taps.forEach((x) => { const xx = pos(x.t); if (xx < 70 || xx > 1290) return; ga(.9); c.fillStyle = CC[x.cls]; c.beginPath(); c.moveTo(xx, TY + 58); c.lineTo(xx - 10, TY + 80); c.lineTo(xx + 10, TY + 80); c.closePath(); c.fill(); });
  c.restore();
  // lejátszófej
  ga(1 - z); c.strokeStyle = CIN; c.lineWidth = 4; c.beginPath(); c.moveTo(PX4, TY - 104); c.lineTo(PX4, TY + 86); c.stroke();
  const fl = gt != null && S4.taps.length ? Math.max(0, 1 - (gt - S4.taps[S4.taps.length - 1]) / .25) : 0;
  if (fl > 0) { ga(fl * .5); c.fillStyle = CIN; c.beginPath(); c.arc(PX4, TY - 30, 60 + 30 * (1 - fl), 0, U.TAU); c.fill(); }
  ga(1);
  // fölötte: utasítás / visszaszámlálás
  if (state === 'count') { ga(.5 + .5 * Math.sin(gt * 8) ** 2); pillNote('figyelj 4 felirat', PX4, 150, { s: 30, bd: CIN, c: CIN, bw: 3 }); }
  else if (state === 'idle') pillNote('indíts felirat', 680, 150, { s: 28, bd: CIN, c: CIN, bw: 2.5 });
  else pillNote('dobbants felirat', 680, 150, { s: 26, bd: 'rgba(28,36,64,.22)', c: INK });
  // pontossági sáv
  const AX0 = 230, AX1 = 1130, AY = 620, MS = 300, xm = (d) => (AX0 + AX1) / 2 + U.clamp(d * 1000, -MS, MS) / MS * (AX1 - AX0) / 2;
  ga(U.smooth((t - .4) / .6));
  const okM = num('pontos tűrés'), nrM = num('majdnem tűrés');
  c.fillStyle = 'rgba(143,90,12,.14)'; c.fillRect(xm(-nrM / 1000), AY - 34, xm(nrM / 1000) - xm(-nrM / 1000), 68);
  c.fillStyle = 'rgba(29,122,69,.18)'; c.fillRect(xm(-okM / 1000), AY - 34, xm(okM / 1000) - xm(-okM / 1000), 68);
  c.strokeStyle = INK; c.lineWidth = 2.5; c.beginPath(); c.moveTo(AX0, AY); c.lineTo(AX1, AY); c.stroke();
  c.strokeStyle = CIN; c.lineWidth = 3; c.beginPath(); c.moveTo((AX0 + AX1) / 2, AY - 44); c.lineTo((AX0 + AX1) / 2, AY + 44); c.stroke();
  [-MS, -200, -100, 100, 200, MS].forEach((m) => { c.strokeStyle = MUTED; c.lineWidth = 2; c.beginPath(); c.moveTo(xm(m / 1000), AY - 8); c.lineTo(xm(m / 1000), AY + 8); c.stroke(); });
  L.tx('−' + MS + ' ms', AX0, AY + 76, { s: 22, f: F.M, w: 500, a: 'center', c: MUTED });
  L.tx('+' + MS + ' ms', AX1, AY + 76, { s: 22, f: F.M, w: 500, a: 'center', c: MUTED });
  L.tx(lab('ütemre felirat'), (AX0 + AX1) / 2, AY - 56, { s: 24, f: F.B, w: 700, a: 'center', c: CIN, k: 'ütemre felirat' });
  L.tx(lab('korán felirat'), AX0, AY - 56, { s: 24, f: F.B, w: 600, a: 'left', c: MUTED, k: 'korán felirat' });
  L.tx(lab('későn felirat'), AX1, AY - 56, { s: 24, f: F.B, w: 600, a: 'right', c: MUTED, k: 'későn felirat' });
  [['pontos felirat', GOOD, 0], ['majdnem felirat', OCH, 1], ['mellé felirat', BAD, 2]].forEach(([k, col, i]) => {
    const x = 380 + i * 230; c.fillStyle = col; c.beginPath(); c.moveTo(x, AY + 108); c.lineTo(x - 10, AY + 128); c.lineTo(x + 10, AY + 128); c.closePath(); c.fill();
    L.tx(lab(k), x + 20, AY + 128, { s: 24, f: F.B, w: 600, c: col, k });
  });
  const stack = {};
  sc.taps.forEach((x) => {
    if (x.d == null) return;
    const xx = xm(x.d), key = Math.round(xx / 16); stack[key] = (stack[key] || 0) + 1;
    ga(1); c.fillStyle = CC[x.cls]; c.strokeStyle = INK; c.lineWidth = 2;
    c.beginPath(); c.arc(xx, AY - 4 - (stack[key] - 1) * 14, 9, 0, U.TAU); c.fill(); c.stroke();
  });
  // eredmény

  eq('MagVers.tapScore', [sc.hits, sc.n, sc.taps.map((x) => x.cls)], [2, 2, ['pontos', 'majdnem', 'mellé']]);

  });

        L.button(lab('mutasd rím gomb'), () => { const p = rhymeOf('jv rímképlet'); p.forEach((x, i) => { if (!S5.found[x]) S5.found[x] = L.st + i * .05; }); S5.last = p[0]; S5.sel = null; }, 'mutasd rím gomb');
        L.button(lab('újra rím gomb'), () => { S5.found = {}; S5.sel = null; S5.bad = null; S5.last = null; }, 'újra rím gomb');

      enter() { S6.sel = 1; S6.from = 1; S6.t0 = -99; },

      } },
  ],
  onKey(e) { if (L.step === 3 && (e.key === 'Enter' || e.key === 'd' || e.key === 'D')) { e.preventDefault(); tap4(e.timeStamp); } },
  init(Lx) {
    L = Lx; c = L.ctx;
    V = MagVers.create(L, { f: F.D, s: 44, w: 500, c: INK });
    L.checks = checks;
    DATA_ERR = checks().filter((x) => !x.ok).map((x) => x.name);
    if (DATA_ERR.length) console.warn('A .md adatai és a lecke számolása eltér: ' + DATA_ERR.join('; '));
  },
  draw(Lx) {
    L = Lx; c = L.ctx; GA = 1; background();
    if (L.step >= 0) sT[L.step] = L.st;
    for (let i = 0; i < SCENES.length; i++) {
      const w = clamp(1 - Math.abs(L.sp - i) * 2); if (w <= .005) continue;
      GA = w; c.save(); c.globalAlpha = w; SCENES[i](sT[i] == null ? 0 : sT[i], L.step === i); c.restore();
    }
    c.globalAlpha = 1;
    if (DATA_ERR.length) L.pill(lab('adathiba felirat').replace('#', DATA_ERR.slice(0, 3).join('; ')), 680, 1040, { a: 'center', s: 24, w: 600, bg: BAD, c: CARD, pad: 12, k: 'adathiba felirat', max: 1240 });
  },
});

      { name: 'nincs-kattintas', set() { const d = DT0(); S4.taps = []; fakePlay(3, JV4, 6 * d + 48 * d + 2, { dt: d, lead: 6 * d, countIn: 6 }); } }],
  5: [{ name: 'egy-par', set() { S5.found = { a: -30 }; S5.last = 'a'; } },
      { name: 'kijelolt', set() { S5.found = {}; S5.sel = 2; } },
      { name: 'rossz-par', set() { S5.found = {}; S5.bad = { a: 0, b: 2, t: L.st - .3 }; } },
      { name: 'mind', set() { S5.found = { a: -30, b: -30, c: -30, d: -30 }; S5.last = 'c'; } }],
  6: [{ name: 'janos-vitez', set() { S6.from = 0; S6.sel = 0; S6.t0 = -30; } }],
  7: [{ name: 'egy-kep', set() { S7.rev = [null, -30, null]; } }, { name: 'mind', set() { S7.rev = [-30, -30, -30]; } }],

};
