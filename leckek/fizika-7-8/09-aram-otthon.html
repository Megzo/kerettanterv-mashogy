<script>
(function () {
'use strict';
const U = Lesson.U, { clamp, lerp, smooth, out, inOut, TAU } = U, fmt = U.fmt;
const F = Lesson.FONTS;
/* ── paletta (világos téma, lásd SZERZODES.md) – azonos a 08-aramkor leckével ── */
const INK = '#1c2440', MUT = '#565d72', RED = '#c8401c', TEAL = '#0a6f86', GOOD = '#1d7a45', BAD = '#b3261e',
  CARD = '#fffaf1', LINE = 'rgba(28,36,64,.16)';
/* háztartási vezeték erei (szabványos színek): fázis barna, nulla kék, védővezeték zöld-sárga */
const BROWN = '#8a5a2b', BLUE = '#2f6db0', GREEN = '#3c8a3c', YEL = '#e3b505';
const DARK = { [BROWN]: '#3f2a14', [BLUE]: '#173a63', [GREEN]: '#1f4d1f' };
let L, c, GA = 1;
const al = (a = 1) => { c.globalAlpha = GA * clamp(a); };
const lab = (k) => L.lab(k), num = (k) => L.num(k);
const T = (k, x, y, o = {}) => L.tx(lab(k), x, y, Object.assign({ k }, o));
const tx = (s, x, y, o) => L.tx(s, x, y, o);
const rr = (x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, w, h, r); };
const ln = (x1, y1, x2, y2, col, w = 2, dash) => { c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.strokeStyle = col; c.lineWidth = w; c.setLineDash(dash || []); c.stroke(); c.setLineDash([]); };
const mod = (a, n) => ((a % n) + n) % n;

/* ════════ fizika: egyetlen forrás minden jelenetnek ════════
   Ohmos fogyasztók 230 V-os (effektív) hálózaton: I = P / U. Párhuzamos kapcsolás: minden készülék
   230 V-ot kap, a közös vezetékben az áramok összeadódnak. E = P · t. Az áramerősségeket 0,01 A-re
   kerekítve számoljuk, és a kismegszakító ugyanebből a kerekített összegből dönt (kijelzés = döntés). */
const Un = () => num('hálózati feszültség');
const In = () => num('kismegszakító névleges árama');
const price = () => num('áram ára');
const r2 = (x) => Math.round(x * 100) / 100;
const Idev = (kP) => r2(num(kP) / Un());
const fA = (I, d = 2) => fmt(I, d) + ' A', fA3 = (I) => fA(I, I < 1 ? 3 : 2), fV = (u, d = 0) => fmt(u, d) + ' V', fW = (p) => fmt(p) + ' W';
const fR = (r, d = 1) => fmt(r, d) + ' Ω', fFt = (x) => fmt(x, x < 10 ? 1 : 0) + ' Ft';
const fkWh = (e) => fmt(e, e < 10 ? 2 : 1) + ' kWh';
const sig2 = (x) => { if (!(x > 0)) return 0; const e = Math.floor(Math.log10(x)) - 1, p = Math.pow(10, e); return Math.round(x / p) * p; };
const sigD = (x) => Math.max(0, 1 - Math.floor(Math.log10(Math.max(x, 1e-9))));
/* váltakozó áram: a pöttyök oda-vissza lengenek; kitérés ∝ áramerősség (lassítva; valójában 50 Hz) */
const OM = TAU * 1.1, KAC = 2.6, AMAX = 42;
const acA = (I) => Math.min(AMAX, KAC * I);
const acS = () => Math.sin(L.t * OM);

/* ── állapot-eseménylista: [{t, s}] – az állapot L.st-ből zárt alakban számolható (mint a 08-ban) ── */
function evNow(E, st) { let s = E[0].s; for (const e of E) { if (e.t <= st) s = e.s; else break; } return s; }
function evSet(E, st, ch) {
  const cur = Object.assign({}, evNow(E, st), ch);
  while (E.length > 1 && E[E.length - 1].t > st) E.pop();
  E.push({ t: st, s: cur }); return cur;
}
/* ∫ v(s) dt az eseményeken át (v szakaszonként állandó) */
function integ(E, st, v) {
  let p = 0;
  for (let i = 0; i < E.length; i++) {
    const a = E[i].t; if (st <= a) break;
    const b = Math.min(st, i + 1 < E.length ? E[i + 1].t : Infinity); p += v(E[i].s) * (b - a);
  }
  return p;
}
/* elsőrendű késleltetés (pl. melegedés): az érték τ időállandóval követi f(s)-t – zárt alakban, eseményenként */
function lagEv(E, st, f, tau, v0) {
  let v = v0 == null ? f(E[0].s) : v0;
  for (let i = 0; i < E.length; i++) {
    const a = E[i].t; if (st <= a) break;
    const b = Math.min(st, i + 1 < E.length ? E[i + 1].t : Infinity), g = f(E[i].s);
    v = g + (v - g) * Math.exp(-(b - a) / tau);
  }
  return v;
}
/* mikor vált pred utoljára hamisból igazzá */
function riseT(E, st, pred) { let t = -1, pv = false; for (const e of E) { if (e.t > st) break; const v = !!pred(e.s); if (v && !pv) t = e.t; pv = v; } return t; }
/* utolsó esemény ideje, amelyre pred igaz */
function lastT(E, st, pred) { let t = -1; for (const e of E) { if (e.t > st) break; if (pred(e.s)) t = e.t; } return t; }

/* ── nyitott vezetékpálya (polyline) ── */
function mkOpen(pts) {
  const seg = []; let tot = 0;
  for (let i = 0; i + 1 < pts.length; i++) { const a = pts[i], b = pts[i + 1], l = Math.hypot(b[0] - a[0], b[1] - a[1]); seg.push({ a, b, l, s0: tot }); tot += l; }
  return { pts, seg, tot };
}
function pAt(P, s) {
  s = clamp(s, 0, P.tot);
  for (const g of P.seg) if (g.l > 0 && s <= g.s0 + g.l + 1e-9) { const t = (s - g.s0) / g.l; return { x: lerp(g.a[0], g.b[0], t), y: lerp(g.a[1], g.b[1], t) }; }
  const g = P.seg[P.seg.length - 1]; return { x: g.b[0], y: g.b[1] };
}
/* párhuzamos eltolás (derékszögű töréseknél gérvágással) */
function offPts(pts, d) {
  const n = pts.length, o = [];
  for (let i = 0; i < n; i++) {
    const p = pts[i]; let n1 = null, n2 = null;
    if (i > 0) { const a = pts[i - 1], l = Math.hypot(p[0] - a[0], p[1] - a[1]); n1 = [-(p[1] - a[1]) / l, (p[0] - a[0]) / l]; }
    if (i < n - 1) { const b = pts[i + 1], l = Math.hypot(b[0] - p[0], b[1] - p[1]); n2 = [-(b[1] - p[1]) / l, (b[0] - p[0]) / l]; }
    let m = n1 && n2 ? [n1[0] + n2[0], n1[1] + n2[1]] : (n1 || n2); const ml = Math.hypot(m[0], m[1]); m = [m[0] / ml, m[1] / ml];
    const ref = n1 || n2, k = d / (m[0] * ref[0] + m[1] * ref[1]);
    o.push([p[0] + m[0] * k, p[1] + m[1] * k]);
  }
  return o;
}
const poly = (pts) => { c.beginPath(); pts.forEach((p, i) => i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])); };
/* elektron (−) és atommag (+) – a 08-aramkor rajzai */
function electron(x, y, r = 8) {
  c.beginPath(); c.arc(x, y, r, 0, TAU); c.fillStyle = TEAL; c.fill(); c.strokeStyle = '#063f4d'; c.lineWidth = 1.5; c.stroke();
  ln(x - r * .5, y, x + r * .5, y, '#fffaf1', Math.max(1.4, r * .27));
}
function nucleus(x, y, r = 13) {
  c.beginPath(); c.arc(x, y, r, 0, TAU); c.fillStyle = RED; c.fill(); c.strokeStyle = '#7a2410'; c.lineWidth = 2; c.stroke();
  ln(x - r * .5, y, x + r * .5, y, '#fffaf1', 2.6); ln(x, y - r * .5, x, y + r * .5, '#fffaf1', 2.6);
}
/* melegedés színe: h = 0 hideg, 1 meleg (narancs), 1,5+ forró (vörös) */
const hotCol = (base, h) => h <= 1 ? U.mix(base, '#f08a24', clamp(h)) : U.mix('#f08a24', '#ff3b1c', clamp(h - 1, 0, .6) / .6);
/* egy ér: sötét körvonal + színes belső + melegedés-izzás + lengő elektronok (sgn: ±1 iránya) */
function conductor(pts, col, heat, I, sgn, a, o = {}) {
  al(a); c.lineJoin = 'round'; c.lineCap = 'round';
  if (heat > .12) { poly(pts); c.strokeStyle = `rgba(255,120,40,${.28 * clamp(heat, 0, 1.6)})`; c.lineWidth = 26; c.stroke(); }
  poly(pts); c.strokeStyle = DARK[col] || INK; c.lineWidth = o.w || 10; c.stroke();
  poly(pts); c.strokeStyle = hotCol(col, heat); c.lineWidth = (o.w || 10) - 4; c.stroke();
  if (o.stripes) { poly(pts); c.setLineDash([10, 12]); c.strokeStyle = YEL; c.lineWidth = (o.w || 10) - 5; c.stroke(); c.setLineDash([]); }
  c.lineCap = 'butt';
  if (o.nodots) return;
  const P = mkOpen(pts), sp = 30, N = Math.floor(P.tot / sp), off = sgn * acA(I) * acS() + (o.jit ? (Math.sin(L.t * 31) * 6) : 0);
  for (let i = 0; i <= N; i++) { const s = i * sp + 15 + off; if (s < 6 || s > P.tot - 6) continue; const p = pAt(P, s); electron(p.x, p.y, 5); }
}
/* kéteres kábel: fázis (barna) és nulla (kék); a két érben az elektronok ellentétes irányban mozognak */
function cable(pts, I, heat, a, d = 9) {
  al(a); c.lineJoin = 'round'; c.lineCap = 'round'; poly(pts); c.strokeStyle = 'rgba(28,36,64,.10)'; c.lineWidth = 2 * d + 18; c.stroke(); c.lineCap = 'butt';
  conductor(offPts(pts, -d), BROWN, heat, I, 1, a); conductor(offPts(pts, d), BLUE, heat, I, -1, a);
}
function card(x, y, w, h, a) { al(a); rr(x, y, w, h, 18); c.fillStyle = CARD; c.fill(); c.strokeStyle = LINE; c.lineWidth = 2; c.stroke(); }
function readout(s, x, y, k, a = 'left', sz = 26) { return L.pill(s, x, y, { k, a, s: sz, f: F.M, w: 700, bg: '#22302a', c: '#8df0a6', pad: 10, r: 8 }); }
/* képletjel (kódban rögzített) */
function sym(s, x, y, o) { return L.tx(s, x, y, Object.assign({ f: F.D, i: 1, w: 500, qa: false }, o)).w; }
function formula(parts, x, y, fs, col, a = 'left') {
  // parts: [szöveg, dőlt?] – a teljes szélességet előre méri, hogy középre is igazítható legyen
  const gap = fs * .22; let w = 0;
  for (const [s, i] of parts) w += L.measure(s, { f: F.D, i: i ? 1 : 0, w: 500, s: fs }).w + gap;
  w -= gap; let xx = a === 'center' ? x - w / 2 : a === 'right' ? x - w : x;
  for (const [s, i] of parts) xx += sym(s, xx, y, { s: fs, c: col, i: i ? 1 : 0 }) + gap;
}
function row2(k, v, x, y, col, kv, w, big) {
  T(k, x, y, { s: 24, w: 500, c: MUT, max: w });
  L.tx(v, x, y + 40, { k: kv, f: F.M, s: big ? 34 : 28, w: 700, c: col, max: w });
}

/* ── háttér ── */
function background() {
  c.globalAlpha = 1;
  const g = c.createRadialGradient(680, 480, 100, 680, 540, 1300); g.addColorStop(0, '#f7f1e6'); g.addColorStop(1, '#efe6d6');
  c.fillStyle = g; c.fillRect(0, 0, 1920, 1080);
  c.strokeStyle = 'rgba(28,36,64,.045)'; c.lineWidth = 1; c.beginPath();
  for (let x = 0; x <= 1920; x += 40) { c.moveTo(x + .5, 0); c.lineTo(x + .5, 1080); }
  for (let y = 0; y <= 1080; y += 40) { c.moveTo(0, y + .5); c.lineTo(1920, y + .5); }
  c.stroke();
}

/* ── húzás a vásznon (a 08-aramkor kódja) ── */
const DR = { on: null, h: null };
function drag(id, near, apply) { DR.h = { id, near, apply }; }
function dragInit() {
  const st = L.stage, P = (e) => L.toStage(e);
  st.addEventListener('pointerdown', (e) => { const p = P(e); if (DR.h && DR.h.near(p.x, p.y)) { DR.on = DR.h.id; DR.h.apply(p.x, p.y); } });
  st.addEventListener('pointermove', (e) => {
    const p = P(e);
    if (DR.on && DR.h && DR.h.id === DR.on) DR.h.apply(p.x, p.y);
    L.canvas.style.cursor = DR.on ? 'grabbing' : DR.h && DR.h.near(p.x, p.y) ? 'grab' : '';
  });
  window.addEventListener('pointerup', () => { DR.on = null; });
}

/* ════════ rajzok: konnektor, készülékek, kismegszakító, ember ════════ */
function socket(x, y, a, sz = 100) {
  al(a); const h = sz / 2;
  rr(x - h + 4, y - h + 6, sz, sz, 16); c.fillStyle = 'rgba(28,36,64,.15)'; c.fill();
  rr(x - h, y - h, sz, sz, 16); c.fillStyle = '#f4efe6'; c.fill(); c.strokeStyle = INK; c.lineWidth = 3; c.stroke();
  c.beginPath(); c.arc(x, y, sz * .34, 0, TAU); c.fillStyle = '#e2dccf'; c.fill(); c.strokeStyle = '#6b7380'; c.lineWidth = 2.5; c.stroke();
  for (const s of [-1, 1]) { c.beginPath(); c.arc(x + s * sz * .14, y, sz * .055, 0, TAU); c.fillStyle = INK; c.fill(); }
  for (const s of [-1, 1]) { rr(x - sz * .07, y + s * sz * .34 - sz * .03, sz * .14, sz * .06, 2); c.fillStyle = '#9aa3ae'; c.fill(); }
}
/* készülék-ikonok: (x, y) közép, s nagyítás, on: működik */
function withT(x, y, s, f) { c.save(); c.translate(x, y); c.scale(s, s); f(3 / s); c.restore(); }
function steam(x, y, a, n = 3) {
  al(a); c.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    const ph = mod(L.t * .7 + i / n, 1), yy = y - ph * 50, xx = x + (i - (n - 1) / 2) * 16;
    c.globalAlpha = GA * a * Math.sin(ph * Math.PI) * .8; c.beginPath();
    for (let k = 0; k <= 10; k++) { const q = k / 10; c.lineTo(xx + Math.sin(q * 6 + L.t * 3 + i) * 5, yy - q * 34); }
    c.strokeStyle = '#8a93a6'; c.lineWidth = 3; c.stroke();
  }
  c.lineCap = 'butt';
}
function kettleI(x, y, s, on, a) {
  al(a); withT(x, y, s, (lw) => {
    c.beginPath(); c.moveTo(40, -38); c.bezierCurveTo(80, -36, 82, 26, 46, 30); c.strokeStyle = INK; c.lineWidth = 12; c.stroke(); c.strokeStyle = '#2a3350'; c.lineWidth = 7; c.stroke();
    c.beginPath(); c.moveTo(-36, -36); c.lineTo(-66, -52); c.lineTo(-60, -34); c.lineTo(-40, -20); c.closePath(); c.fillStyle = '#c9ced6'; c.fill(); c.strokeStyle = INK; c.lineWidth = lw; c.stroke();

    al(p0); c.fillStyle = col; c.fillRect(bx, y0, bw, y1 - y0); c.strokeStyle = '#fffaf1'; c.lineWidth = 2; c.strokeRect(bx, y0, bw, y1 - y0);
    al(p0 * (act ? 1 : .45)); T(k, bx + bw + 24, (y0 + y1) / 2 + 9, { s: act ? 28 : 24, w: act ? 700 : 500, c: i === 3 ? BAD : INK, max: 1340 - bx - bw - 24, k: [k, kd] });
  });

  const ymk = Y(clamp(Ima, .1, 1000));

  // FI-relé határa
  al(p0); ln(bx - 6, Y(zf), bx + bw + 6, Y(zf), TEAL, 3.5, [7, 5]);
  L.tx(lab('FI-relé határa') + ': ' + L.val('FI-relé érzékenysége'), bx + bw + 24, Y(zf) - 8, { k: ['FI-relé határa', 'FI-relé érzékenysége'], s: 22, w: 700, c: TEAL });
  // jelölő
  const ym = Y(clamp(Ima, .1, 1000));
  al(p0); c.beginPath(); c.moveTo(bx - 4, ym); c.lineTo(bx - 26, ym - 14); c.lineTo(bx - 26, ym + 14); c.closePath(); c.fillStyle = RED; c.fill();
  ln(bx, ym, bx + bw, ym, RED, 4);
  ln(574, ym, bx - 26, ym, U.rgba(RED, .6), 2, [5, 5]);

  T('a testen át', 570, ym - 36, { s: 22, w: 600, a: 'right', c: RED });
}

/* ════════ 9. Összefoglalás ════════ */
function scene9(st) {
  const p0 = out(clamp(st / .6)), q = (i) => p0 * clamp((st - .3 - i * .35) / .5);
  const box = (i, x, y) => { card(x, y, 620, 340, q(i)); };
  box(0, 60, 110); box(1, 710, 110); box(2, 60, 480); box(3, 710, 480);
  // 1: Joule-hő – izzó fűtőszál
  al(q(0)); c.beginPath(); for (let i = 0; i <= 10; i++) c.lineTo(110 + i * 24, 240 + (i % 2 ? -30 : 0)); c.lineJoin = 'round'; c.strokeStyle = '#3a2a1a'; c.lineWidth = 11; c.stroke(); c.strokeStyle = '#ff6a1a'; c.lineWidth = 6; c.stroke();
  T('összegzés Joule', 400, 250, { f: F.D, s: 52, w: 560, c: RED, max: 260 });
  T('összegzés Joule 2', 100, 340, { s: 26, w: 600, c: INK, max: 550 });
  // 2: P = U · I
  al(q(1)); formula([['P', 1], ['=', 0], ['U', 1], ['·', 0], ['I', 1]], 1020, 250, 84, RED, 'center');
  T('összegzés P', 750, 340, { s: 26, w: 600, c: INK, max: 550 });

  T('összegzés E', 100, 700, { s: 26, w: 600, c: INK, max: 550 });
  L.tx(lab('áramár') + ': ' + L.val('áram ára'), 100, 760, { k: ['áramár', 'áram ára'], s: 26, w: 500, c: MUT, max: 550 });
  // 4: védelem
  breakerG(790, 585, 1, q(3), 96); fiG(900, 585, 1, q(3)); earthSym(1010, 600, q(3)); conductor([[1010, 540], [1010, 594]], GREEN, 0, 0, 1, q(3), { w: 11, stripes: true, nodots: true });
  al(q(3)); T('összegzés védelem 1', 750, 700, { s: 26, w: 600, c: INK, max: 550 });
  T('összegzés védelem 2', 750, 760, { s: 26, w: 600, c: INK, max: 550 });
  const pm = clamp((st - 2) / .6);
  al(p0 * pm); rr(60, 870, 1270, 130, 18); c.fillStyle = U.rgba(RED, .09); c.fill(); c.strokeStyle = U.rgba(RED, .5); c.lineWidth = 2; c.stroke();
  T('tanulság', 695, 948, { f: F.D, i: 1, s: 36, w: 500, a: 'center', c: RED, max: 1220 });
}

/* ════════════════════════════════════════════════════════════════ */
const sT = new Array(9).fill(0);
const SCENES = [scene1, scene2, scene3, scene4, scene5, scene6, scene7, scene8, scene9];
L = Lesson.create({
  content: window.LESSON_CONTENT,
  home: false,
  steps: [
    { settle: 6.5, enter() { E1.length = 0; E1.push({ t: 0, s: { on: false } }, { t: 1, s: { on: true } }); },
      controls(L) { L.button(lab('be-ki gomb'), () => evSet(E1, L.st, { on: !evNow(E1, L.st).on }), 'be-ki gomb'); } },
    { settle: 4.5, enter() { E2.length = 0; E2.push({ t: 0, s: { d: 'lamp' } }, { t: 1.4, s: { d: 'tv' } }, { t: 2.8, s: { d: 'kettle' } }); },
      controls(L) { B2 = ORDER2.map((id) => L.button(lab(DEVS[id].k), () => evSet(E2, L.st, { d: id }), DEVS[id].k)); } },
    { settle: 5, enter() { E3.length = 0; E3.push({ t: 0, s: { tv: num('tévézés ideje'), sweep: true } }); },

          onInput: (v) => evSet(E3, L.st, { tv: v, sweep: false }) });
      } },
    { settle: 3, enter() { E4.length = 0; E4.push({ t: 0, s: { h: num('napi világítás') } }); },
      controls(L) {

          onInput: (v) => evSet(E4, L.st, { h: v }) });

    { settle: 5.5, enter() {

      },

                L.button(lab('visszakapcsol gomb'), () => set5(L.st, { tripped: false }), 'visszakapcsol gomb');
      } },
    { settle: 5.5, enter() { E6.length = 0; E6.push({ t: 0, s: { fault: false, nb: false, tf: 0 } }, { t: 1, s: { fault: true, nb: false, tf: 1 } }); },
      controls(L) {

        L.button(lab('javítás gomb'), () => evSet(E6, L.st, { fault: false }), 'javítás gomb');
        B6 = L.button(lab('nélküle gomb'), () => evSet(E6, L.st, { nb: !evNow(E6, L.st).nb, fault: true, tf: L.st }), 'nélküle gomb');
      } },
    { settle: 4, enter() { E7.length = 0; E7.push({ t: 0, s: { pe: false, fi: false, t0: 0 } }); },
      controls(L) {

          L.button(lab('FI gomb'), () => evSet(E7, L.st, { fi: !evNow(E7, L.st).fi, t0: L.st }), 'FI gomb')];

    { settle: 5, enter() { E8.length = 0; E8.push({ t: 0, s: { auto: true, t0: 0, u: Un() } }); },
