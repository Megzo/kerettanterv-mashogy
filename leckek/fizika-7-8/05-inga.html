<script>
(function () {
'use strict';
const U = Lesson.U, { clamp, lerp, out, inOut, TAU } = U, fmt = U.fmt;
const F = Lesson.FONTS;
/* ── paletta (világos téma, lásd SZERZODES.md) ── */
const INK = '#1c2440', MUT = '#565d72', RED = '#c8401c', TEAL = '#0a6f86', GOOD = '#1d7a45', BAD = '#b3261e',
  CARD = '#fffaf1', LINE = 'rgba(28,36,64,.16)';
let L, c, GA = 1;
const al = (a = 1) => { c.globalAlpha = GA * clamp(a); };
const lab = (k) => L.lab(k), num = (k) => L.num(k);
const T = (k, x, y, o = {}) => L.tx(lab(k), x, y, Object.assign({ k }, o));
const tx = (s, x, y, o) => L.tx(s, x, y, o);
const rr = (x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, w, h, r); };
const ln = (x1, y1, x2, y2, col, w = 2, dash) => { c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.strokeStyle = col; c.lineWidth = w; c.setLineDash(dash || []); c.stroke(); c.setLineDash([]); };
const deg = (v) => fmt(v, 0) + '°';
const sgn = (v, d) => (v >= 0 ? '+' : '') + fmt(v, d);
const D2R = Math.PI / 180;
const gE = () => num('nehézségi gyorsulás a Földön'), gM = () => num('nehézségi gyorsulás a Holdon');

/* ════════ Fizika: a matematikai inga PONTOS mozgása (nem csak kis kitérésre) ════════
   θ(t) = 2·arcsin( k · sn(ω₀t + K, k²) ),  k = sin(θ₀/2),  ω₀ = √(g/l),  T = 4K/ω₀
   (sn: Jacobi-féle elliptikus függvény, K: teljes elliptikus integrál; AGM-módszer, Abramowitz–Stegun 16.4, 17.6).
   Kis kitérésnél T → 2π·√(l/g). t = 0-ban a test a jobb szélső helyzetből indul, nyugalomból.
   Zárt képlet → bármely időpont közvetlenül számolható (QA, visszaléptetés). */
function agm(a, b) { for (let i = 0; i < 40 && Math.abs(a - b) > 1e-15; i++) { const an = (a + b) / 2; b = Math.sqrt(a * b); a = an; } return a; }
const ellK = (m) => Math.PI / (2 * agm(1, Math.sqrt(1 - m)));
function sn(u, m, K) {
  if (m < 1e-12) return Math.sin(u);
  const K4 = 4 * K; u = ((u % K4) + K4) % K4;
  const a = [1], cc = [Math.sqrt(m)]; let b = Math.sqrt(1 - m), n = 0;
  while (Math.abs(cc[n]) > 1e-12 && n < 16) { const an = a[n]; a.push((an + b) / 2); cc.push((an - b) / 2); b = Math.sqrt(an * b); n++; }
  let phi = Math.pow(2, n) * a[n] * u;
  for (let i = n; i > 0; i--) phi = (phi + Math.asin(cc[i] / a[i] * Math.sin(phi))) / 2;
  return Math.sin(phi);
}
const PC = new Map();
function pend(l, g, th0deg) {
  const key = l + '|' + g + '|' + th0deg; let p = PC.get(key); if (p) return p;
  const th0 = th0deg * D2R, k = Math.sin(th0 / 2), m = k * k, w0 = Math.sqrt(g / l), K = ellK(m);
  p = { l, g, th0, w0, T: 4 * K / w0, T0: 2 * Math.PI / w0,
    th: (t) => (t <= 0 ? th0 : 2 * Math.asin(clamp(k * sn(w0 * t + K, m, K), -1, 1))) };
  if (PC.size > 400) PC.clear(); PC.set(key, p); return p;
}

/* ── háttér: meleg papír, halvány négyzetrács ── */
function background() {
  c.globalAlpha = 1;
  const g = c.createRadialGradient(680, 480, 100, 680, 540, 1300); g.addColorStop(0, '#f7f1e6'); g.addColorStop(1, '#efe6d6');
  c.fillStyle = g; c.fillRect(0, 0, 1920, 1080);
  c.strokeStyle = 'rgba(28,36,64,.045)'; c.lineWidth = 1; c.beginPath();
  for (let x = 0; x <= 1920; x += 40) { c.moveTo(x + .5, 0); c.lineTo(x + .5, 1080); }
  for (let y = 0; y <= 1080; y += 40) { c.moveTo(0, y + .5); c.lineTo(1920, y + .5); }
  c.stroke();
}

/* ════════ közös építőelemek: mennyezet, inga, papírcsík ════════ */
const PY = 80, VP = 50, BOT = 1000, HW = 250, XA = 330, XB = 1000, XG = 665;   // felfüggesztés y, papírsebesség (px/s), papír alja, csík félszélessége, A/B inga x, rés közepe
const COL = {
  A: { c: TEAL, d: '#08485a', f0: '#d6eff4', f1: '#3d9db3' },
  B: { c: RED, d: '#7f2810', f0: '#fbdccd', f1: '#d4643d' },
};
function beam(x0, x1, a) {
  al(a);
  c.strokeStyle = 'rgba(28,36,64,.35)'; c.lineWidth = 2; c.beginPath();
  for (let x = x0 + 8; x < x1; x += 18) { c.moveTo(x, PY - 22); c.lineTo(x + 12, PY - 38); }
  c.stroke();
  rr(x0, PY - 22, x1 - x0, 18, 5); c.fillStyle = '#ddd0b5'; c.fill(); c.strokeStyle = INK; c.lineWidth = 2.5; c.stroke();
}
function bob(x, y, r, K, a) {
  al(a);
  const g = c.createRadialGradient(x - r * .35, y - r * .4, r * .1, x, y, r);
  g.addColorStop(0, K.f0); g.addColorStop(1, K.f1);
  c.beginPath(); c.arc(x, y, r, 0, TAU); c.fillStyle = g; c.fill(); c.strokeStyle = K.d; c.lineWidth = 3; c.stroke();
}
/* inga: (x, PY) felfüggesztés, S px/m lépték, l m hossz, th rad kitérés */
function pendulum(x, S, l, th, r, K, a, py = PY) {
  const bx = x + l * S * Math.sin(th), by = py + l * S * Math.cos(th);
  al(a); ln(x, py, bx - r * Math.sin(th), by - r * Math.cos(th), INK, 2.5);
  bob(bx, by, r, K, a);
  al(a); c.beginPath(); c.arc(x, py, 6, 0, TAU); c.fillStyle = INK; c.fill();
  return { x: bx, y: by };
}
function ghost(x, S, l, th, r, K, a) {
  const bx = x + l * S * Math.sin(th), by = PY + l * S * Math.cos(th);
  al(a * .28); ln(x, PY, bx, by, INK, 2, [6, 7]);
  c.beginPath(); c.arc(bx, by, r, 0, TAU); c.strokeStyle = K.d; c.lineWidth = 2.5; c.setLineDash([5, 5]); c.stroke(); c.setLineDash([]);
}
function scaleBar(S, a) {
  al(a * .9); const x = 46;
  ln(x, PY, x, PY + S, INK, 2.5); ln(x - 8, PY, x + 8, PY, INK, 2.5); ln(x - 8, PY + S, x + 8, PY + S, INK, 2.5);
  T('méterskála', x + 12, PY + S / 2 + 8, { f: F.M, s: 22, w: 600, c: INK });
}
/* papírcsík: lefelé halad, tetején a „toll” a kitérést (szöget) rajzolja.  pens: [{P, h0, t0, K}] */
const radOf = (m) => Math.max(10, 9 * Math.cbrt(m / 0.1));     // azonos anyag: r ∝ ∛m (csak rajz)
function strip(cx, top, view, ticks, pens, ts, a, t0) {
  const x0 = cx - HW, X = (th) => cx + th / (view * D2R) * HW;
  al(a); rr(x0, top, 2 * HW, BOT - top, 10); c.fillStyle = CARD; c.fill(); c.strokeStyle = LINE; c.lineWidth = 2; c.stroke();
  c.save(); rr(x0, top, 2 * HW, BOT - top, 10); c.clip();
  for (const d of ticks) ln(X(d * D2R), top, X(d * D2R), BOT, d === 0 ? 'rgba(28,36,64,.3)' : 'rgba(28,36,64,.12)', 1.5, d === 0 ? [6, 6] : null);
  if (ts > t0) for (let k = 0; ; k++) { const y = top + (ts - t0 - k) * VP; if (y < top) break; if (y <= BOT) ln(x0, y, x0 + 2 * HW, y, 'rgba(28,36,64,.13)', 1.2); }
  for (const p of pens) {
    c.beginPath(); let n = 0;
    for (let y = top; y <= BOT + 2; y += 2) { const tau = ts - (y - top) / VP; if (tau < p.h0) break; const x = X(p.P.th(tau - p.t0)); n++ ? c.lineTo(x, y) : c.moveTo(x, y); }
    c.strokeStyle = p.K.c; c.lineWidth = 3.5; c.lineJoin = 'round'; c.stroke();
  }
  c.restore();
  for (const p of pens) {
    const x = X(p.P.th(ts - p.t0)); al(a);
    c.beginPath(); c.moveTo(x - 9, top - 14); c.lineTo(x + 9, top - 14); c.lineTo(x, top + 2); c.closePath(); c.fillStyle = p.K.c; c.fill(); c.strokeStyle = p.K.d; c.lineWidth = 2; c.stroke();
  }
  al(a); for (const d of ticks) tx(deg(d).replace('-', '−'), X(d * D2R), BOT + 30, { f: F.M, s: 22, a: 'center', c: MUT });
}
/* idővonalak felirata (mp az elengedés óta) – a papírral együtt halad */
function timeLabels(x, top, ts, t0, a, align = 'center') {
  if (ts <= t0) return;
  for (let k = 0; ; k++) {
    const y = top + (ts - t0 - k) * VP; if (y < top) break; if (y > BOT - 8) continue;
    al(a * clamp((y - top - 6) / 18) * clamp((BOT - 8 - y) / 18)); tx(k + ' s', x, y + 8, { f: F.M, s: 22, a: align, c: MUT });
  }
}
function readout(cx, top, K, s1, k1, s2, k2, a) {
  al(a);
  L.pill(s1, cx, top - 84, { k: k1, a: 'center', s: 24, w: 600, bg: CARD, bd: K.c, c: K.d });
  L.pill(s2, cx, top - 36, { k: k2, a: 'center', s: 24, f: F.M, w: 700, bg: K.c, c: '#ffffff' });
}
/* két inga egymás mellett, közös elengedéssel (R.h0: megfogás, R.t0: elengedés) */
const mkR = () => ({ h0: 0, t0: .8 });
function hold(R) { const st = L.st; if (st < R.t0) R.t0 = st + .6; else { R.h0 = st; R.t0 = st + .6; } }
function duo(st, D) {
  const p0 = out(clamp(st / .6)), R = D.R;
  beam(150, 1150, p0); scaleBar(D.S, p0);
  for (const [x, Q] of [[XA, D.A], [XB, D.B]]) pendulum(x, D.S, Q.P.l, Q.P.th(st - R.t0), Q.r, Q.K, p0);
  strip(XA, D.top, D.view, D.ticks, [{ P: D.A.P, h0: R.h0, t0: R.t0, K: D.A.K }], st, p0, R.t0);
  strip(XB, D.top, D.view, D.ticks, [{ P: D.B.P, h0: R.h0, t0: R.t0, K: D.B.K }], st, p0, R.t0);
  timeLabels(XG, D.top, st, R.t0, p0);
  al(p0); T('idő tengely', XG, D.top - 28, { f: F.M, s: 22, w: 600, a: 'center', c: INK });
  T('kitérés tengely', XG, BOT + 60, { s: 22, w: 600, a: 'center', c: INK });
  readout(XA, D.top, D.A.K, D.A.s1, D.A.k1, D.A.s2, D.A.k2, p0);
  readout(XB, D.top, D.B.K, D.B.s1, D.B.k1, D.B.s2, D.B.k2, p0);
}
const Ts = (P) => 'T = ' + fmt(P.T, 2) + ' s';

/* ════════ 1. Ismétlődő mozgások ════════ */
const S1 = { S: 300, GR: 935, t0: .6 };
function child(Ls, a) {    // helyi koordináták: a lánc lefelé (+y) mutat; a gyerek ül, jobbra néz
  al(a); c.lineJoin = 'round'; c.lineCap = 'round';
  const y = Ls;
  // lábak (comb + lábszár)
  c.strokeStyle = '#3b4556'; c.lineWidth = 16; c.beginPath(); c.moveTo(0, y + 14); c.lineTo(44, y + 16); c.lineTo(52, y + 66); c.stroke();
  c.strokeStyle = '#1c2440'; c.lineWidth = 10; c.beginPath(); c.moveTo(48, y + 70); c.lineTo(64, y + 70); c.stroke();
  // törzs
  rr(-20, y - 66, 38, 84, 14); c.fillStyle = '#7cc2d2'; c.fill(); c.strokeStyle = '#08485a'; c.lineWidth = 3; c.stroke();
  // fej + haj
  c.beginPath(); c.arc(-1, y - 92, 22, 0, TAU); c.fillStyle = '#f2cfa8'; c.fill(); c.strokeStyle = '#7a4f2a'; c.lineWidth = 2.5; c.stroke();
  c.beginPath(); c.arc(-3, y - 96, 22, Math.PI * 1.05, Math.PI * 1.9); c.strokeStyle = '#5a3414'; c.lineWidth = 9; c.stroke();
  // kar a láncon
  c.strokeStyle = '#7cc2d2'; c.lineWidth = 11; c.beginPath(); c.moveTo(4, y - 52); c.lineTo(14, y - 30); c.lineTo(2, y - 14); c.stroke();
  c.lineCap = 'butt';
}
function scene1(st) {
  const { S, GR, t0 } = S1, p0 = out(clamp(st / .7)), g = gE();
  const items = [
    { k: 'hinta', x: 400, py: 110, P: pend(num('hinta hossza'), g, 18), col: TEAL },
    { k: 'ingaóra', x: 900, py: 330, P: pend(num('ingaóra hossza'), g, 8), col: '#8a5a00' },
    { k: 'fonálinga', x: 1190, py: 600, P: pend(num('fonálinga hossza'), g, 25), col: RED },
  ];
  // talaj
  al(p0); c.fillStyle = '#e6d9bd'; c.fillRect(0, GR, 1360, 14); ln(0, GR, 1360, GR, '#8c7444', 3);
  // ── hinta ──
  const h = items[0], thh = h.P.th(st - t0), Ls = h.P.l * S;
  al(p0); c.lineCap = 'round';
  for (const dx of [-380, 380]) ln(h.x, h.py, h.x + dx, GR, '#4a5566', 12);
  ln(h.x - 236, h.py + 512, h.x + 236, h.py + 512, '#4a5566', 6);
  c.lineCap = 'butt';
  c.save(); c.translate(h.x, h.py); c.rotate(-thh);
  al(p0); c.strokeStyle = '#6b7380'; c.lineWidth = 3; c.setLineDash([9, 4]); c.beginPath(); c.moveTo(0, 0); c.lineTo(0, Ls + 24); c.stroke(); c.setLineDash([]);
  child(Ls, p0);
  al(p0); rr(-36, Ls + 22, 76, 11, 4); c.fillStyle = '#b07a43'; c.fill(); c.strokeStyle = '#5a3414'; c.lineWidth = 2.5; c.stroke();
  c.restore();
  al(p0); c.beginPath(); c.arc(h.x, h.py, 16, 0, TAU); c.fillStyle = '#4a5566'; c.fill(); c.strokeStyle = INK; c.lineWidth = 2.5; c.stroke();
  // ── ingaóra ──
  const o = items[1], tho = o.P.th(st - t0);
  al(p0); rr(780, 140, 240, 28, 8); c.fillStyle = '#9a6331'; c.fill(); c.strokeStyle = '#5a3414'; c.lineWidth = 3; c.stroke();
  const wg = c.createLinearGradient(790, 0, 1010, 0); wg.addColorStop(0, '#c58b52'); wg.addColorStop(1, '#a36a36');
  rr(790, 166, 220, GR - 166, 8); c.fillStyle = wg; c.fill(); c.strokeStyle = '#5a3414'; c.lineWidth = 3; c.stroke();
  rr(818, 318, 164, 480, 12); c.fillStyle = '#f3e7d0'; c.fill(); c.strokeStyle = '#5a3414'; c.lineWidth = 2.5; c.stroke();
  c.beginPath(); c.arc(900, 240, 62, 0, TAU); c.fillStyle = '#fbf6ec'; c.fill(); c.strokeStyle = '#5a3414'; c.lineWidth = 3; c.stroke();
  for (let i = 0; i < 12; i++) { const an = i / 12 * TAU; ln(900 + Math.sin(an) * 50, 240 - Math.cos(an) * 50, 900 + Math.sin(an) * 58, 240 - Math.cos(an) * 58, INK, i % 3 ? 2 : 4); }
  const hand = (an, len, w, col) => ln(900, 240, 900 + Math.sin(an) * len, 240 - Math.cos(an) * len, col, w);
  hand(TAU * 10 / 12, 30, 5, INK); hand(TAU * 2 / 12, 44, 3.5, INK);
  const ticks = Math.max(0, Math.floor((st - t0) / (o.P.T / 2)));     // minden kilengés = 1 „tikk”
  hand(TAU * (ticks % 60) / 60, 52, 2, RED); c.beginPath(); c.arc(900, 240, 5, 0, TAU); c.fillStyle = INK; c.fill();
  const ox = o.x + o.P.l * S * Math.sin(tho), oy = o.py + o.P.l * S * Math.cos(tho);
  al(p0); ln(o.x, o.py, ox, oy, '#8a6a1f', 5);
  const bg = c.createRadialGradient(ox - 10, oy - 10, 4, ox, oy, 30); bg.addColorStop(0, '#f7e3a0'); bg.addColorStop(1, '#b08a2a');
  c.beginPath(); c.arc(ox, oy, 30, 0, TAU); c.fillStyle = bg; c.fill(); c.strokeStyle = '#6b4f0f'; c.lineWidth = 3; c.stroke();
  c.beginPath(); c.arc(o.x, o.py, 6, 0, TAU); c.fillStyle = INK; c.fill();
  // ── fonálinga az asztalon ──
  const f = items[2], thf = f.P.th(st - t0);
  al(p0); for (const lx of [1084, 1312]) ln(lx, 786, lx, GR, '#7a4519', 10);
  rr(1056, 768, 284, 20, 5); c.fillStyle = '#c58b52'; c.fill(); c.strokeStyle = '#5a3414'; c.lineWidth = 2.5; c.stroke();
  rr(1258, 752, 74, 16, 4); c.fillStyle = '#4a5566'; c.fill(); c.strokeStyle = INK; c.lineWidth = 2; c.stroke();
  ln(1295, 752, 1295, 592, '#4a5566', 7); ln(1295, 600, 1180, 600, '#4a5566', 6);
  pendulum(f.x, S, f.P.l, thf, 13, COL.B, p0, f.py);
  // feliratok + lengésszámláló
  items.forEach((it, i) => {
    const q = clamp((st - .5 - i * .25) / .5), n = Math.max(0, Math.floor((st - t0) / it.P.T)), pulse = st > t0 ? Math.exp(-((st - t0) - n * it.P.T) * 3) * (n > 0) : 0;

        const busy = () => { const m = S3.list[S3.list.length - 1]; return m && L.st < m.b; };
        L.button(lab('mérj 1 gomb'), () => { if (!busy()) addMeas(1, L.st); }, 'mérj 1 gomb');
        L.button(lab('mérj 10 gomb'), () => { if (!busy()) addMeas(10, L.st); }, 'mérj 10 gomb');
        L.button(lab('törlés gomb'), () => { S3.clr = S3.list.length; }, 'törlés gomb');
      } },
    { settle: 7,
      enter() { S4.m = num('nehéz golyó tömege'); S4.R = mkR(); },
      controls(L) {
        L.slider({ label: lab('tömeg csúszka'), k: 'tömeg csúszka', min: .1, max: 5, step: .1, value: num('nehéz golyó tömege'), format: (v) => fmt(v, 1) + ' kg',
          onInput: (v) => { S4.m = v; hold(S4.R); } });
      } },
    { settle: 8,
      enter() { S5.th = num('nagy kitérés szöge'); S5.R = mkR(); },
      controls(L) {
        L.slider({ label: lab('kitérés csúszka'), k: 'kitérés csúszka', min: 5, max: 90, step: 1, value: num('nagy kitérés szöge'), format: deg,
          onInput: (v) => { S5.th = v; hold(S5.R); } });
      } },
    { settle: 7,
      enter() { S6.l = num('inga hossza'); S6.R = mkR(); },
      controls(L) {
        L.slider({ label: lab('hossz csúszka'), k: 'hossz csúszka', min: .25, max: 2.5, step: .05, value: num('inga hossza'), format: (v) => fmt(v, 2) + ' m',
          onInput: (v) => { S6.l = v; hold(S6.R); } });
      } },
    { settle: 8,
      enter() { S7.l = num('inga hossza'); S7.moon = true; S7.R = mkR(); },
      controls(L) {
        L.slider({ label: lab('közös hossz csúszka'), k: 'közös hossz csúszka', min: .25, max: 2.5, step: .05, value: num('inga hossza'), format: (v) => fmt(v, 2) + ' m',
          onInput: (v) => { S7.l = v; hold(S7.R); } });
        const b = L.button(lab('Földre gomb'), () => {
          S7.moon = !S7.moon; hold(S7.R);
          const k = S7.moon ? 'Földre gomb' : 'Holdra gomb'; b.innerHTML = lab(k); b.dataset.key = k; b.dataset.src = srcOf(k);
          if (L.review) L.setReview(true);
        }, 'Földre gomb');
      } },
    { settle: 5 },
  ],
  init(Lx) { L = Lx; c = L.ctx; },
  draw(Lx) {
    L = Lx; c = L.ctx; GA = 1; background();
    const sp = L.sp;
    if (L.step >= 0) sT[L.step] = L.st;
    for (let i = 0; i < SCENES.length; i++) {
      const w = clamp(1 - Math.abs(sp - i) * 2); if (w <= .005) continue;
      GA = w; SCENES[i](sT[i]);
    }
    c.globalAlpha = 1;
  },
});
})();
</script>
</body>
</html>
