<script>
(function () {
'use strict';
const U = Lesson.U, { clamp, lerp, smooth, out, inOut, TAU } = U, fmt = U.fmt;
const F = Lesson.FONTS;
/* ── paletta (világos téma, lásd SZERZODES.md) ── */
const INK = '#1c2440', MUT = '#565d72', RED = '#c8401c', TEAL = '#0a6f86', GOOD = '#1d7a45', BAD = '#b3261e',
  CARD = '#fffaf1', LINE = 'rgba(28,36,64,.16)';
/* energiaformák színei – minden jelenetben ugyanaz */
const EC = { rug: '#1d7a45', hely: '#0a6f86', mozg: '#6b3fb0', bel: '#c8401c', elek: '#1b4f9c', kem: '#7a4a1a', mag: '#8e2f6e', feny: '#9a6b00' };
const EKEY = { rug: 'rugalmas', hely: 'helyzeti', mozg: 'mozgási', bel: 'belső' };
const EORD = ['rug', 'hely', 'mozg', 'bel'];
let L, c, GA = 1;
const al = (a = 1) => { c.globalAlpha = GA * clamp(a); };
const lab = (k) => L.lab(k), num = (k) => L.num(k);
const T = (k, x, y, o = {}) => L.tx(lab(k), x, y, Object.assign({ k }, o));
const tx = (s, x, y, o) => L.tx(s, x, y, o);
const rr = (x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, w, h, r); };
const ln = (x1, y1, x2, y2, col, w = 2, dash) => { c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.strokeStyle = col; c.lineWidth = w; c.setLineDash(dash || []); c.stroke(); c.setLineDash([]); };

const KG = ['golyó tömege', 'nehézségi gyorsulás'];

/* ── háttér: meleg papír, halvány négyzetrács ── */
function background() {
  c.globalAlpha = 1;
  const g = c.createRadialGradient(680, 480, 100, 680, 540, 1300); g.addColorStop(0, '#f7f1e6'); g.addColorStop(1, '#efe6d6');
  c.fillStyle = g; c.fillRect(0, 0, 1920, 1080);
  c.strokeStyle = 'rgba(28,36,64,.045)'; c.lineWidth = 1; c.beginPath();
  for (let x = 0; x <= 1920; x += 40) { c.moveTo(x + .5, 0); c.lineTo(x + .5, 1080); }
  for (let y = 0; y <= 1080; y += 40) { c.moveTo(0, y + .5); c.lineTo(1920, y + .5); }
  c.stroke();
}
function card(x, y, w, h, a) { al(a); rr(x, y, w, h, 18); c.fillStyle = CARD; c.fill(); c.strokeStyle = LINE; c.lineWidth = 2; c.stroke(); }
function arrowTo(x1, y1, x2, y2, col, w = 4, hs = 16) {
  const an = Math.atan2(y2 - y1, x2 - x1), bx = x2 - Math.cos(an) * hs * .8, by = y2 - Math.sin(an) * hs * .8;
  ln(x1, y1, bx, by, col, w);
  c.beginPath(); c.moveTo(x2, y2); c.lineTo(x2 - hs * Math.cos(an - .45), y2 - hs * Math.sin(an - .45)); c.lineTo(x2 - hs * Math.cos(an + .45), y2 - hs * Math.sin(an + .45)); c.closePath();
  c.fillStyle = col; c.fill();
}
/* képletjel alsó indexszel (kódban rögzített jelölés) */
function sym(base, sub, x, y, o) {
  const s = o.s || 40, ss = Math.max(22, s * .58), oo = Object.assign({ f: F.D, i: 1, w: 500, qa: false }, o);
  const w1 = L.measure(base, oo).w, w2 = sub ? L.measure(sub, Object.assign({}, oo, { s: ss })).w : 0, W = w1 + w2 + (sub ? 2 : 0);
  const x0 = o.a === 'center' ? x - W / 2 : o.a === 'right' ? x - W : x;
  L.tx(base, x0, y, Object.assign({}, oo, { a: 'left' }));
  if (sub) L.tx(sub, x0 + w1 + 2, y + s * .2, Object.assign({}, oo, { a: 'left', s: ss }));
  return W;
}
/* képlet több darabból: [[alap, index], …] egymás után */
function formula(parts, x, y, o) { let xx = x; for (const [b, sb] of parts) xx += sym(b, sb, xx, y, o) + (o.gap || 10); return xx - x; }
function slowPill(a) { al(a); L.pill(lab('lassítva'), 1320, 64, { k: ['lassítva', 'lassítás'], a: 'right', s: 22, w: 700, bg: '#ffffff', bd: MUT, c: MUT, pad: 10 }); }

/* ── golyó (acél) ── */
function ball(x, y, r, a, tint) {
  if (a <= .01) return;
  al(a);
  const g = c.createRadialGradient(x - r * .35, y - r * .4, r * .1, x, y, r);
  g.addColorStop(0, '#f3f5f8'); g.addColorStop(.45, tint || '#9aa4b2'); g.addColorStop(1, '#3b4554');
  c.beginPath(); c.arc(x, y, r, 0, TAU); c.fillStyle = g; c.fill(); c.strokeStyle = '#1f2733'; c.lineWidth = 2.5; c.stroke();
}

/* ── kerekítés: a részek kerekített összege = a kerekített összeg (legnagyobb maradék) ── */
function roundParts(vals, total, d = 1) {
  const k = Math.pow(10, d), want = Math.round(total * k), fl = vals.map((v) => Math.floor(v * k + 1e-9));
  let rest = want - fl.reduce((p, q) => p + q, 0);
  const ord = vals.map((v, i) => [v * k - fl[i], i]).sort((p, q) => q[0] - p[0]);
  for (let j = 0; j < ord.length && rest > 0; j++) { if (vals[ord[j][1]] > 0) { fl[ord[j][1]]++; rest--; } }
  for (let j = ord.length - 1; j >= 0 && rest < 0; j--) { if (fl[ord[j][1]] > 0) { fl[ord[j][1]]--; rest++; } }
  return fl.map((v) => v / k);
}

/* ── energiaoszlopok (vízszintes sávok) a jelenet alján ──
   E: {rug, hely, mozg, bel} J · Emax: a teljes sávhossz (J) · E0: az összeg (ha ismert, pontosan) */
const BAR = { x: 40, y: 806, w: 1280, h: 232, bx: 250, bw: 880 };
function ebars(E, Emax, a, o = {}) {
  const { x, y, w, h, bx, bw } = BAR, vals = EORD.map((k) => Math.max(0, E[k] || 0));
  const tot = o.E0 != null ? o.E0 : vals.reduce((p, q) => p + q, 0), disp = roundParts(vals, tot), sc = bw / Emax;
  card(x, y, w, h, a);
  EORD.forEach((k, i) => {
    const yy = y + 46 + i * 40, q = o.dim && o.dim[k] != null ? o.dim[k] : 1;
    al(a * q); rr(x + 24, yy - 20, 22, 22, 5); c.fillStyle = EC[k]; c.fill();
    T(EKEY[k], x + 58, yy, { s: 24, w: 700, c: EC[k] });
    rr(bx, yy - 21, bw, 24, 6); c.fillStyle = 'rgba(28,36,64,.06)'; c.fill();
    if (vals[i] * sc > .5) { rr(bx, yy - 21, Math.min(bw, vals[i] * sc), 24, 6); c.fillStyle = EC[k]; c.fill(); }
    L.tx(J(disp[i]), x + w - 24, yy, { k: o.kv, f: F.M, s: 24, w: 700, a: 'right', c: EC[k] });
  });
  const yy = y + 46 + 4 * 40 + 10;
  al(a); ln(x + 24, yy - 36, x + w - 24, yy - 36, LINE, 2);
  T('összesen', x + 58, yy, { s: 24, w: 800, c: INK });
  let xx = bx;
  EORD.forEach((k, i) => { const ww = Math.min(bx + bw - xx, vals[i] * sc); if (ww > .5) { c.fillStyle = EC[k]; c.fillRect(xx, yy - 23, ww, 28); xx += ww; } });
  if (tot * sc > 1) { rr(bx, yy - 23, Math.min(bw, tot * sc), 28, 3); c.strokeStyle = INK; c.lineWidth = 2.5; c.stroke(); }
  L.tx(J(disp.reduce((p, q) => p + q, 0)), x + w - 24, yy, { k: o.kv, f: F.M, s: 26, w: 800, a: 'right', c: INK });
}

/* ════════ Pálya: szakaszokból (egyenes + körív) álló görbe, ívhossz szerint ════════
   A golyó KÖZÉPPONTJÁNAK pályája méterben (y felfelé). A felület ettől r-rel „lejjebb” (a bal normálissal szemben).
   Ugyanez a geometria rajzol és számol. */
function mkPath(x0, y0, a0, segs, sStart = 0) {
  const P = { segs: [], s0: sStart }; let x = x0, y = y0, a = a0, s = sStart;
  for (const sg of segs) {
    const o = { s0: s, x, y, a };
    if (sg.l != null) { o.l = sg.l; o.k = 0; x += Math.cos(a) * sg.l; y += Math.sin(a) * sg.l; }
    else {
      const sgn = Math.sign(sg.da); o.r = sg.r; o.k = sgn / sg.r; o.l = Math.abs(sg.da) * sg.r;
      o.cx = x - Math.sin(a) * sg.r * sgn; o.cy = y + Math.cos(a) * sg.r * sgn; a += sg.da;
      x = o.cx + Math.sin(a) * sg.r * sgn; y = o.cy - Math.cos(a) * sg.r * sgn;
    }
    s += o.l; o.s1 = s; P.segs.push(o);
  }
  P.s1 = s; P.end = { x, y, a }; return P;
}
function at(P, s) {
  const S = P.segs;
  if (s <= S[0].s0) { const o = S[0], u = s - o.s0; return { x: o.x + Math.cos(o.a) * u, y: o.y + Math.sin(o.a) * u, a: o.a, k: 0 }; }
  if (s >= P.s1) { const e = P.end, u = s - P.s1; return { x: e.x + Math.cos(e.a) * u, y: e.y + Math.sin(e.a) * u, a: e.a, k: 0 }; }
  let o = S[0]; for (const q of S) { o = q; if (s < q.s1) break; }
  const u = s - o.s0;
  if (!o.k) return { x: o.x + Math.cos(o.a) * u, y: o.y + Math.sin(o.a) * u, a: o.a, k: 0 };
  const sgn = Math.sign(o.k), an = o.a + u * o.k;
  return { x: o.cx + Math.sin(an) * o.r * sgn, y: o.cy - Math.cos(an) * o.r * sgn, a: an, k: o.k };
}
/* a magasság → ívhossz (a [lo, hi] szakaszon a magasság monoton) */
function sAtH(P, h, lo, hi) {
  const up = at(P, hi).y > at(P, lo).y;
  for (let i = 0; i < 50; i++) { const m = (lo + hi) / 2; if ((at(P, m).y < h) === up) lo = m; else hi = m; }
  return (lo + hi) / 2;
}
/* ── mozgás a pályán (egységnyi tömegre; a tömeg a mozgást nem befolyásolja) ──
   ds/dt = v, dv/dt = −g·sin α + rugó − súrlódás; súrlódás = μ·(g·cos α + v²·κ) (a pálya nyomóereje).
   Egyszer, előre kiszámoljuk (0,2 ms lépéssel), 5 ms-onként eltároljuk → az állapot az időből (L.st) olvasható ki,
   nincs képkockánkénti összegzés. Súrlódás nélkül a mozgás periodikus: a periódust is megkeressük. */
function simulate(P, o) {
  const g = gA(), dt = 2e-4, DS = .005, mu = o.mu || 0, ks = o.ks || 0, tmax = o.tmax || 60;
  let s = o.s0, v = 0, q = 0, t = 0, next = DS, period = 0, stuck = false;
  const S = [s], V = [0], Q = [0], turns = [];
  while (t < tmax) {
    const p = at(P, s), aN = -g * Math.sin(p.a) + (s < 0 ? ks * -s : 0), Nn = Math.max(0, v * v * p.k + g * Math.cos(p.a)), f = mu * Nn;
    let a;
    if (v === 0) { if (Math.abs(aN) <= f) { stuck = true; break; } a = aN - Math.sign(aN) * f; }
    else a = aN - Math.sign(v) * f;
    let vn = v + a * dt;
    if (v !== 0 && Math.sign(vn) !== Math.sign(v)) {
      turns.push({ t, s });
      if (mu > 0) vn = 0;
      else if (turns.length === 2) period = t;
    }
    s += vn * dt; q += f * Math.abs(vn) * dt; v = vn; t += dt;
    if (t >= next - 1e-9) { S.push(s); V.push(v); Q.push(q); next += DS; }
    if (period) break;
  }
  if (stuck) turns.push({ t, s, stop: true });
  return { S, V, Q, DS, period, stuck, turns, tEnd: t };
}
function look(R, tau) {
  if (tau <= 0) return { s: R.S[0], v: 0, q: 0 };
  if (R.period) tau %= R.period;
  const f = tau / R.DS, i = Math.floor(f), n = R.S.length;
  if (i >= n - 1) return { s: R.S[n - 1], v: R.stuck ? 0 : R.V[n - 1], q: R.Q[n - 1], end: true };
  const u = f - i; return { s: lerp(R.S[i], R.S[i + 1], u), v: lerp(R.V[i], R.V[i + 1], u), q: lerp(R.Q[i], R.Q[i + 1], u) };
}
/* képernyő-transzformáció: G = {P, PX, ox, oy, r} */
const scr = (G, x, y) => [G.ox + x * G.PX, G.oy - y * G.PX];
const ballXY = (G, s) => { const p = at(G.P, s); return scr(G, p.x, p.y); };
function surfacePts(G, s0, s1, ds = .02) {
  const pts = [];
  for (let s = s0; s <= s1 + 1e-9; s += ds) { const p = at(G.P, s); pts.push(scr(G, p.x + Math.sin(p.a) * G.r, p.y - Math.cos(p.a) * G.r)); }
  return pts;
}
/* a felület kirajzolása + test alatta (yBase-ig); heat: hőeloszlás (szakaszonként, J) */
function drawTrack(G, s0, s1, yBase, a, o = {}) {
  const pts = surfacePts(G, s0, s1), xl = pts[0][0] - (o.padL || 0), xr = pts[pts.length - 1][0] + (o.padR || 0);
  al(a);
  c.beginPath(); c.moveTo(xl, pts[0][1]); for (const p of pts) c.lineTo(p[0], p[1]); c.lineTo(xr, pts[pts.length - 1][1]); c.lineTo(xr, yBase); c.lineTo(xl, yBase); c.closePath();
  const gr = c.createLinearGradient(0, yBase - 420, 0, yBase); gr.addColorStop(0, '#ead8b4'); gr.addColorStop(1, '#d9c194');
  c.fillStyle = gr; c.fill(); c.strokeStyle = 'rgba(28,36,64,.55)'; c.lineWidth = 2; c.stroke();
  // fa-erezet
  c.save(); c.clip(); c.strokeStyle = 'rgba(122,74,26,.13)'; c.lineWidth = 2;
  for (let y = yBase - 8; y > yBase - 460; y -= 22) { c.beginPath(); c.moveTo(xl, y); for (let x = xl; x <= xr; x += 40) c.lineTo(x, y + Math.sin(x * .02 + y) * 3); c.stroke(); }
  c.restore();
  c.beginPath(); pts.forEach((p, i) => i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])); c.strokeStyle = INK; c.lineWidth = 3.5; c.lineJoin = 'round'; c.stroke();
  if (o.heat) {
    const { bins, bw, s0: hs0, H0 } = o.heat;
    for (let i = 0; i < bins.length; i++) {
      const I = 1 - Math.exp(-bins[i] / H0); if (I < .02) continue;
      const seg = surfacePts(G, hs0 + i * bw, hs0 + (i + 1) * bw + .005, .01);
      for (const [wd, col, aa] of [[22, '#ff8a3d', .35 * I], [9, U.mix('#c8401c', '#ff5a1a', I), .25 + .75 * I]]) {
        al(a * aa); c.beginPath(); seg.forEach((p, j) => j ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])); c.strokeStyle = col; c.lineWidth = wd; c.lineCap = 'round'; c.stroke(); c.lineCap = 'butt';
      }
    }
  }
}

/* ── húzható golyó (helyi bővítés: a motor csak L.pointer-t ad) ── */
const DR = { list: [], act: null, hov: null, used: false };
function grab(id, x, y, r, fn, up) { DR.list.push({ id, x, y, r, fn, up }); }
function pick(p) { if (p.x > 1370) return null; for (const h of DR.list) if (Math.hypot(p.x - h.x, p.y - h.y) < h.r + 16) return h; return null; }
function installDrag() {
  const st = L.stage;
  st.addEventListener('pointerdown', (e) => {
    if (e.target.closest && e.target.closest('#lesson-panel')) return;
    const p = L.toStage(e), h = pick(p); if (!h) return;
    DR.act = h; DR.used = true; st.style.cursor = 'grabbing'; e.preventDefault(); h.fn(p.x, p.y);
  });
  window.addEventListener('pointermove', (e) => {
    const p = L.toStage(e);
    if (DR.act) { DR.act.fn(p.x, p.y); return; }
    const h = (e.target.closest && e.target.closest('#lesson-panel')) ? null : pick(p);
