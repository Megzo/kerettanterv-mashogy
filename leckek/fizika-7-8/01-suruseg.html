<script>
(function () {
'use strict';
const U = Lesson.U, { clamp, lerp, smooth, out, inOut, outBack, TAU } = U, fmt = U.fmt;
const F = Lesson.FONTS;
/* ── paletta (világos téma, lásd SZERZODES.md) ── */
const INK = '#1c2440', MUT = '#565d72', RED = '#c8401c', TEAL = '#0a6f86', GOOD = '#1d7a45', BAD = '#b3261e',
  WATER = '#2f7fc0', WATER_D = '#1b5a94', CARD = '#fffaf1', LINE = 'rgba(28,36,64,.16)';
let L, c, GA = 1;
const al = (a = 1) => { c.globalAlpha = GA * clamp(a); };
const lab = (k) => L.lab(k), num = (k) => L.num(k);
/* felirat a .md-ből (kulccsal, hogy a review mód és a QA lássa) */
const T = (k, x, y, o = {}) => L.tx(lab(k), x, y, Object.assign({ k }, o));
const tx = (s, x, y, o) => L.tx(s, x, y, o);
const rr = (x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, w, h, r); };
const P = (pts) => { c.beginPath(); pts.forEach((p, i) => i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])); c.closePath(); };
const ln = (x1, y1, x2, y2, col, w = 2, dash) => { c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.strokeStyle = col; c.lineWidth = w; c.setLineDash(dash || []); c.stroke(); c.setLineDash([]); };
const dims = (o) => (o.unit ? ' ' + o.unit : '');

/* ── anyagok ── */
const MAT = {
  fenyo: { k: 'fenyőfa', r: 'fenyőfa sűrűsége', base: '#d9a066', dark: '#7a4519', light: '#efc999' },
  jeg:   { k: 'jég', r: 'jég sűrűsége', base: '#cde8f4', dark: '#1d6a93', light: '#f3fbff' },
  viz:   { k: 'víz', r: 'víz sűrűsége', base: '#6aaee3', dark: '#1b5a94', light: '#a9d2f2' },
  al:    { k: 'alumínium', r: 'alumínium sűrűsége', base: '#c6ccd4', dark: '#4a5566', light: '#f0f2f5' },
  acel:  { k: 'acél', r: 'acél sűrűsége', base: '#8b96a3', dark: '#2c3644', light: '#c9d0d8' },
  arany: { k: 'arany', r: 'arany sűrűsége', base: '#e7b23a', dark: '#74520a', light: '#f9df8f' },
  rejt:  { k: 'rejtélyes kocka', r: null, base: '#a68ad6', dark: '#4b2d86', light: '#d6c7f0' },
};
const ORDER = ['fenyo', 'jeg', 'viz', 'al', 'acel', 'arany'];
const rho = (m) => num(MAT[m].r);
const rhoS = (m) => fmt(rho(m), L.content.data[MAT[m].r].d);

/* ── háttér: meleg papír, halvány négyzetrács ── */
function background() {
  c.globalAlpha = 1;
  const g = c.createRadialGradient(680, 480, 100, 680, 540, 1300); g.addColorStop(0, '#fbf6ec'); g.addColorStop(1, '#efe6d6');
  c.fillStyle = g; c.fillRect(0, 0, 1920, 1080);
  c.strokeStyle = 'rgba(28,36,64,.045)'; c.lineWidth = 1; c.beginPath();
  for (let x = 0; x <= 1920; x += 40) { c.moveTo(x + .5, 0); c.lineTo(x + .5, 1080); }
  for (let y = 0; y <= 1080; y += 40) { c.moveTo(0, y + .5); c.lineTo(1920, y + .5); }
  c.stroke();
}

/* ── kocka ferde (kavalier) vetületben; (x, y) = az elülső lap bal alsó sarka ── */
function cube(x, y, s, mk, o = {}) {
  const M = MAT[mk] || mk, d = o.d == null ? s * .34 : o.d, dy = -d * .76, a = o.a == null ? 1 : o.a;
  if (a <= .01) return;
  al(a);
  const front = [[x, y], [x + s, y], [x + s, y - s], [x, y - s]];
  const top = [[x, y - s], [x + s, y - s], [x + s + d, y - s + dy], [x + d, y - s + dy]];
  const side = [[x + s, y], [x + s + d, y + dy], [x + s + d, y - s + dy], [x + s, y - s]];
  const glassy = mk === 'jeg' || mk === 'viz';
  // oldal, tető, elülső lap
  al(a * (glassy ? .86 : 1));
  P(side); c.fillStyle = U.mix(M.base, M.dark, .38); c.fill();
  P(top); c.fillStyle = M.light; c.fill();
  let g = c.createLinearGradient(x, y - s, x + s, y);
  g.addColorStop(0, U.mix(M.base, M.light, .35)); g.addColorStop(1, U.mix(M.base, M.dark, .12));
  P(front); c.fillStyle = g; c.fill();
  al(a);
  c.save(); P(front); c.clip();
  if (mk === 'fenyo') {            // évgyűrű-erezet
    c.strokeStyle = U.rgba(M.dark, .32); c.lineWidth = 2;
    for (let i = 0; i < 6; i++) { c.beginPath(); const yy = y - s * (.1 + i * .16); for (let k = 0; k <= 12; k++) { const xx = x + s * k / 12; c.lineTo(xx, yy + Math.sin(k * .9 + i * 1.7) * s * .025); } c.stroke(); }
  } else if (mk === 'jeg') {       // csillogás + buborékok
    c.strokeStyle = 'rgba(255,255,255,.95)'; c.lineWidth = s * .05; c.lineCap = 'round';
    c.beginPath(); c.moveTo(x + s * .18, y - s * .32); c.lineTo(x + s * .38, y - s * .78); c.stroke();
    c.lineWidth = s * .025; c.beginPath(); c.moveTo(x + s * .32, y - s * .24); c.lineTo(x + s * .45, y - s * .52); c.stroke();
    c.fillStyle = 'rgba(255,255,255,.9)'; for (const [u, v, r] of [[.7, .3, .035], [.62, .62, .022], [.8, .74, .028]]) { c.beginPath(); c.arc(x + s * u, y - s * v, s * r, 0, TAU); c.fill(); }
  } else if (mk === 'viz') {       // vízfelszín az üvegkockában + csillanás
    c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineWidth = s * .035; c.lineCap = 'round';
    c.beginPath(); c.moveTo(x + s * .14, y - s * .2); c.lineTo(x + s * .14, y - s * .7); c.stroke();
  } else if (mk !== 'rejt') {      // fémes csík
    g = c.createLinearGradient(x, y - s, x + s, y);
    g.addColorStop(.25, 'rgba(255,255,255,0)'); g.addColorStop(.42, 'rgba(255,255,255,.55)'); g.addColorStop(.52, 'rgba(255,255,255,0)');
    c.fillStyle = g; c.fillRect(x, y - s, s, s);
  }
  c.restore();
  c.lineJoin = 'round'; c.strokeStyle = M.dark; c.lineWidth = o.lw || 2.5;
  P(side); c.stroke(); P(top); c.stroke(); P(front); c.stroke();
  if (mk === 'rejt') tx('?', x + s / 2, y - s / 2 + 2, { f: F.D, s: s * .62, w: 650, a: 'center', b: 'middle', c: M.dark, qa: false });
}

/* ── digitális konyhai mérleg; (cx, y) = a tányér teteje középen ── */
function scale(cx, y, w, grams, a = 1, unit = 'g') {
  if (a <= .01) return;
  al(a);
  rr(cx - w / 2, y + 12, w, 58, 14); c.fillStyle = '#fbf8f1'; c.fill(); c.strokeStyle = 'rgba(28,36,64,.55)'; c.lineWidth = 2.5; c.stroke();
  rr(cx - w * .46, y, w * .92, 13, 6); c.fillStyle = '#d9dde3'; c.fill(); c.stroke();
  const dw = Math.min(w - 30, 176);
  rr(cx - dw / 2, y + 22, dw, 40, 8); c.fillStyle = '#22302a'; c.fill();
  tx(fmt(grams) + ' ' + unit, cx + dw / 2 - 12, y + 52, { f: F.M, s: 26, w: 700, a: 'right', c: '#8df0a6', max: dw - 20 });
}

/* ── tengelyek (grafikonokhoz) ── */
function axes(g, a) {
  const X = (v) => g.x0 + v / g.xmax * (g.x1 - g.x0), Y = (v) => g.y1 - v / g.ymax * (g.y1 - g.y0);
  al(a);
  rr(g.x0 - 30, g.y0 - 40, g.x1 - g.x0 + 60, g.y1 - g.y0 + 110, 18); c.fillStyle = 'rgba(255,250,241,.75)'; c.fill();
  c.strokeStyle = LINE; c.lineWidth = 1.2; c.beginPath();
  for (let v = 0; v <= g.xmax + 1e-9; v += g.xs) { c.moveTo(X(v), g.y0); c.lineTo(X(v), g.y1); }
  for (let v = 0; v <= g.ymax + 1e-9; v += g.ys) { c.moveTo(g.x0, Y(v)); c.lineTo(g.x1, Y(v)); }
  c.stroke();
  ln(g.x0, g.y1, g.x1 + 16, g.y1, INK, 2.5); ln(g.x0, g.y1, g.x0, g.y0 - 16, INK, 2.5);
  for (let v = 0; v <= g.xmax + 1e-9; v += g.xs) tx(fmt(v), X(v), g.y1 + 32, { f: F.M, s: 22, a: 'center', c: MUT });
  for (let v = g.ys; v <= g.ymax + 1e-9; v += g.ys) tx(fmt(v), g.x0 - 12, Y(v) + 8, { f: F.M, s: 22, a: 'right', c: MUT });
  T('tengely térfogat', g.x1, g.y1 + 66, { f: F.M, s: 22, w: 600, a: 'right', c: INK });
  T('tengely tömeg', g.x0 + 12, g.y0 - 14, { f: F.M, s: 22, w: 600, c: INK });
  return { X, Y };
}

/* ── vízfelszín hullámzással ── */
const wave = (x, t, amp = 3) => Math.sin(x * .021 + t * 1.6) * amp + Math.sin(x * .053 - t * 2.3) * amp * .4;
function waterBody(x0, x1, ys, yb, t, a, amp = 3) {
  al(a);
  const g = c.createLinearGradient(0, ys, 0, yb); g.addColorStop(0, 'rgba(70,150,215,.30)'); g.addColorStop(1, 'rgba(27,90,148,.50)');
  c.beginPath(); c.moveTo(x0, yb); for (let x = x0; x <= x1; x += 8) c.lineTo(x, ys + wave(x, t, amp)); c.lineTo(x1, ys + wave(x1, t, amp)); c.lineTo(x1, yb); c.closePath();
  c.fillStyle = g; c.fill();
  c.beginPath(); for (let x = x0; x <= x1; x += 8) c.lineTo(x, ys + wave(x, t, amp)); c.strokeStyle = WATER_D; c.lineWidth = 3; c.stroke();
}

/* ── poligon terület / vágás (a jéghegy úszási egyensúlyához) ── */
const area = (p) => { let s = 0; for (let i = 0; i < p.length; i++) { const a = p[i], b = p[(i + 1) % p.length]; s += a[0] * b[1] - b[0] * a[1]; } return Math.abs(s) / 2; };
function clipAbove(p, yw) {
  const o = [];
  for (let i = 0; i < p.length; i++) {
    const a = p[i], b = p[(i + 1) % p.length], ia = a[1] < yw, ib = b[1] < yw;
    if (ia) o.push(a);
    if (ia !== ib) { const t = (yw - a[1]) / (b[1] - a[1]); o.push([a[0] + t * (b[0] - a[0]), yw]); }
  }
  return o;
}
const BERG = [[-70, -150], [-20, -205], [30, -128], [80, -150], [140, -64], [205, -18], [262, 46], [284, 150], [252, 262], [182, 352], [60, 412], [-60, 402], [-172, 334], [-252, 224], [-274, 112], [-232, 20], [-152, -38], [-112, -104]];
/* eltolás, amelynél a víz fölötti rész aránya = 1 − ρ_jég / ρ_közeg (2D metszetre pontos) */
function bergOffset(fracAbove) {
  const A = area(BERG); let lo = 205, hi = -412;   // oy: a poligon y + oy, vízvonal: 0
  for (let i = 0; i < 40; i++) { const m = (lo + hi) / 2, f = area(clipAbove(BERG.map((p) => [p[0], p[1] + m]), 0)) / A; if (f > fracAbove) hi = m; else lo = m; }
  return (lo + hi) / 2;
}
function iceberg(cx, wl, k, oy, a) {
  const pts = BERG.map((p) => [cx + p[0] * k, wl + (p[1] + oy) * k]);
  al(a); P(pts);
  const g = c.createLinearGradient(cx - 200 * k, wl - 200 * k, cx + 200 * k, wl + 300 * k); g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#cfe6f2');
  c.fillStyle = g; c.fill(); c.strokeStyle = '#1d6a93'; c.lineWidth = 3; c.lineJoin = 'round'; c.stroke();
  // fazetták
  c.strokeStyle = 'rgba(29,106,147,.35)'; c.lineWidth = 2; c.beginPath();
  for (const [i, j] of [[1, 9], [3, 7], [16, 11], [13, 10]]) { const p = pts[i], q = pts[j]; c.moveTo(p[0], p[1]); c.lineTo(lerp(p[0], q[0], .55), lerp(p[1], q[1], .55)); }
  c.stroke();
  return pts;
}

/* ════════ 1. A kérdés: nehéz = elsüllyed? ════════ */
const S1 = { WL: 500, FLOOR: 1032 };
function bolt(x, y, rot, a) {
  al(a); c.save(); c.translate(x, y); c.rotate(rot); c.scale(1.5, 1.5);
  const g = c.createLinearGradient(-24, 0, 24, 0); g.addColorStop(0, '#5d6876'); g.addColorStop(.4, '#c9d0d8'); g.addColorStop(1, '#4a5566');
  rr(-10, -22, 20, 66, 3); c.fillStyle = g; c.fill(); c.strokeStyle = '#2c3644'; c.lineWidth = 2; c.stroke();
  c.beginPath(); for (let k = -14; k < 42; k += 7) { c.moveTo(-10, k); c.lineTo(10, k + 4); } c.stroke();
  rr(-24, -40, 48, 20, 4); c.fillStyle = g; c.fill(); c.stroke();
  c.restore();
}
function scene1(st) {
  const t = L.t, { WL, FLOOR } = S1, p0 = out(clamp(st / .8));
  const fAbove = 1 - num('jég sűrűsége') / num('tengervíz sűrűsége');
  if (S1.f !== fAbove) { S1.f = fAbove; S1.oy = bergOffset(fAbove); }
  // tengerfenék
  al(p0); c.fillStyle = '#e3d3ac'; c.fillRect(0, FLOOR, 1380, 60); ln(0, FLOOR, 1380, FLOOR, '#8c7444', 3);
  // jéghegy: lebegve beáll az egyensúlyba
  const tb = clamp(st - .2), bob = 70 * Math.exp(-2.2 * tb * 1.6) * Math.cos(tb * 6) * (st < .2 ? 1 : 1) + Math.sin(t * .9) * 2.5;
  const bp = iceberg(470, WL, 1.08, S1.oy + bob / 1.08, p0), tip = bp.reduce((a, b) => (b[1] < a[1] ? b : a));
  // csavar
  const tDrop = 2.4, yHold = 345, g = 1800, vW = 290, floorY = FLOOR - 38;
  let by = yHold, rot = 0, aB = clamp((st - 1.4) / .6);
  const ta = st - tDrop, tFall = Math.sqrt(2 * (WL - yHold) / g);
  if (ta > 0) {
    if (ta < tFall) by = yHold + .5 * g * ta * ta;
    else { const tw = ta - tFall; by = Math.min(floorY, WL + vW * tw); const tLand = (floorY - WL) / vW; if (tw > tLand) { const q = out(clamp((tw - tLand) / .45)); rot = q * Math.PI / 2; by = floorY + q * 10; } }
  }
  // buborékok a csavar mögött
  if (ta > tFall) for (let i = 0; i < 10; i++) {
    const born = tFall + i * .17, age = ta - born; if (age < 0 || age > 2.2) continue;
    const y0 = Math.min(floorY, WL + vW * (born - tFall)), y = y0 - age * 120, x = 1080 + Math.sin(age * 5 + i) * 8;
    if (y < WL + 6) continue; al(aB * (1 - age / 2.2) * .8); c.beginPath(); c.arc(x, y, 4 + (i % 3) * 2, 0, TAU); c.strokeStyle = '#ffffff'; c.lineWidth = 2; c.stroke();
  }
  bolt(1080, by, rot, aB);
  waterBody(0, 1380, WL, FLOOR, t, p0, 4);
  // csobbanás-gyűrűk
  const ts = ta - tFall; if (ts > 0 && ts < 1.6) for (let k = 0; k < 2; k++) { const q = clamp((ts - k * .25) / 1.2); al((1 - q) * .8); c.beginPath(); c.ellipse(1080, WL + 2, 20 + q * 110, 5 + q * 16, 0, 0, TAU); c.strokeStyle = WATER_D; c.lineWidth = 2.5; c.stroke(); }
  // feliratok
  const pl = clamp((st - .9) / .6);
  al(p0 * pl); T('jéghegy', 70, 250, { f: F.M, s: 26, w: 700, ls: '2px', c: '#1d6a93' });
  L.pill(lab('jéghegy tömege'), 70, 292, { k: 'jéghegy tömege', s: 24, w: 600, bg: '#ffffff', bd: '#1d6a93', c: INK });
  ln(160, 314, tip[0] - 8, tip[1] - 6, 'rgba(29,106,147,.6)', 2, [5, 6]);
  al(aB); T('acélcsavar', 1080, 196, { f: F.M, s: 26, w: 700, ls: '2px', a: 'center', c: '#2c3644' });
  L.pill(L.val('csavar tömege'), 1080, 238, { k: 'csavar tömege', s: 24, w: 600, a: 'center', bg: '#ffffff', bd: '#2c3644', c: INK });
  const pu = clamp((st - 4.6) / .5);

  rows.forEach(([k, v, kk], i) => { const yy = y0 + 54 + i * 92; T(k, x + 24, yy, { s: 23, w: 500, c: MUT, max: w - 48 }); tx(v, x + 24, yy + 40, { f: F.M, s: 30, w: 700, c: INK, k: kk, max: w - 48 }); });
  ln(x + 24, y0 + 318, x + w - 24, y0 + 318, LINE, 2);
  const fl = avg < num('víz sűrűsége'), col = fl ? GOOD : BAD;
  T('átlagos sűrűség', x + 24, y0 + 362, { s: 23, w: 700, c: INK, max: w - 48 });
  tx(fmt(avg, 2) + ' g/cm³', x + 24, y0 + 410, { f: F.M, s: 32, w: 700, c: col, max: w - 48 });
  L.pill(lab(fl ? 'hajó úszik' : 'hajó elsüllyed'), x + 24, y0 + 476, { k: fl ? 'hajó úszik' : 'hajó elsüllyed', s: 26, w: 700, bg: col, c: '#ffffff' });
  L.tx((fl ? '< ' : '≥ ') + L.val('víz sűrűsége') + ' (' + lab('víz') + ')', x + 24, y0 + 554, { f: F.M, s: 22, w: 600, c: col, k: ['víz sűrűsége', 'víz'], max: w - 48 });
}

/* ════════ 9. Összefoglalás: a sűrűség-létra ════════ */
function scene9(st) {
  const p0 = out(clamp(st / .6));
  const lo = -3.2, hi = 1.5, y0 = 170, y1 = 980, Y = (r) => y0 + (Math.log10(r) - lo) / (hi - lo) * (y1 - y0), x = 250, rw = num('víz sűrűsége');
  al(p0); T('sűrűség-létra', 70, 120, { f: F.D, s: 40, w: 560, c: INK, max: 560 });
  // sávok: úszik / elmerül
  rr(x - 16, y0, 32, Y(rw) - y0, 10); c.fillStyle = U.rgba(GOOD, .2); c.fill();
  rr(x - 16, Y(rw), 32, y1 - Y(rw), 10); c.fillStyle = U.rgba(BAD, .16); c.fill();
  ln(x - 190, Y(rw), x + 30, Y(rw), WATER_D, 3, [10, 6]);
  T('vízben úszik', x - 30, Y(rw) - 18, { s: 24, w: 700, a: 'right', c: GOOD, max: 190 });
  T('vízben elmerül', x - 30, Y(rw) + 36, { s: 24, w: 700, a: 'right', c: BAD, max: 190 });
  const items = [['levegő', 'levegő sűrűsége', .001, '#0a6f86'], ['fenyőfa', 'fenyőfa sűrűsége', 1, MAT.fenyo.dark], ['jég', 'jég sűrűsége', 1, MAT.jeg.dark], ['víz', 'víz sűrűsége', 1, WATER_D],
    ['tengervíz', 'tengervíz sűrűsége', 1, WATER_D], ['alumínium', 'alumínium sűrűsége', 1, MAT.al.dark], ['acél', 'acél sűrűsége', 1, MAT.acel.dark], ['arany', 'arany sűrűsége', 1, MAT.arany.dark]];
  const ls = items.map(([k, rk, conv, col], i) => ({ k, rk, col, r: num(rk) * conv, y: Y(num(rk) * conv), i }));
  const ly = ls.map((l) => l.y);   // feliratok szétválogatása (≥ 36 px)
  for (let it = 0; it < 30; it++) for (let i = 1; i < ly.length; i++) { const d = ly[i] - ly[i - 1]; if (d < 36) { ly[i] += (36 - d) / 2; ly[i - 1] -= (36 - d) / 2; } }
  ls.forEach((l, i) => {
    const q = clamp((st - .5 - i * .25) / .4); if (q <= 0) return; al(p0 * q);
    c.beginPath(); c.arc(x, l.y, 9, 0, TAU); c.fillStyle = l.col; c.fill();
    c.beginPath(); c.moveTo(x + 12, l.y); c.lineTo(x + 40, l.y); c.lineTo(x + 58, ly[i]); c.strokeStyle = U.rgba(l.col, .6); c.lineWidth = 2; c.stroke();
    const w = L.tx(lab(l.k), x + 66, ly[i] + 8, { k: l.k, s: 26, w: 700, c: l.col }).w;
    L.tx(L.val(l.rk), x + 66 + w + 12, ly[i] + 8, { k: l.rk, f: F.M, s: 22, c: MUT });
  });
  // képlet-háromszög
  const pt = clamp((st - 2.6) / .7), tx0 = 980, ty0 = 200;
  if (pt > 0) {
    al(p0 * pt); c.beginPath(); c.moveTo(tx0, ty0); c.lineTo(tx0 + 170, ty0 + 290); c.lineTo(tx0 - 170, ty0 + 290); c.closePath(); c.fillStyle = CARD; c.fill(); c.strokeStyle = INK; c.lineWidth = 3; c.lineJoin = 'round'; c.stroke();
    ln(tx0 - 98, ty0 + 168, tx0 + 98, ty0 + 168, INK, 3); ln(tx0, ty0 + 168, tx0, ty0 + 290, INK, 3);
    tx('m', tx0, ty0 + 140, { f: F.D, i: 1, s: 64, w: 560, a: 'center', c: RED, qa: false });
    tx('ρ', tx0 - 58, ty0 + 260, { f: F.D, i: 1, s: 60, w: 560, a: 'center', c: RED, qa: false });
    tx('V', tx0 + 58, ty0 + 260, { f: F.D, i: 1, s: 60, w: 560, a: 'center', c: RED, qa: false });
    [['ρ = m / V', 'képlet sűrűség'], ['m = ρ · V', 'képlet tömeg'], ['V = m / ρ', 'képlet térfogat']].forEach(([fx, k], i) => {
      const q = clamp((st - 3.2 - i * .35) / .4), y = ty0 + 380 + i * 70; al(p0 * q);
      tx(fx, tx0 - 170, y, { f: F.D, i: 1, s: 40, w: 500, c: INK, qa: false });
      T(k, tx0 + 40, y - 2, { s: 26, w: 500, c: MUT, max: 330 });
    });
  }
  const pm = clamp((st - 4.6) / .6);
  al(p0 * pm); rr(720, 870, 620, 110, 18); c.fillStyle = U.rgba(RED, .1); c.fill(); c.strokeStyle = U.rgba(RED, .5); c.lineWidth = 2; c.stroke();
  T('tanulság', 1030, 938, { f: F.D, i: 1, s: 36, w: 500, a: 'center', c: RED, max: 580 });
}

/* ════════════════════════════════════════════════════════════════ */
const sT = new Array(9).fill(0);
const SCENES = [scene1, scene2, scene3, scene4, scene5, scene6, scene7, scene8, scene9];
L = Lesson.create({
  content: window.LESSON_CONTENT,
  home: false,
  steps: [
    { settle: 7.5 },
    { settle: 5.5 },
    { settle: 8.6 },
    { settle: 5.5 },
    { settle: 7.5,
      enter() { S5.Lm = num('terem hossza'); S5.Wm = num('terem szélessége'); S5.Hm = num('terem magassága'); },
      controls(L) {
        const f = (v) => fmt(v, 1) + ' m';
        L.slider({ label: lab('terem hossza felirat'), k: 'terem hossza felirat', min: 4, max: 15, step: .5, value: num('terem hossza'), format: f, onInput: (v) => { S5.Lm = v; } });
        L.slider({ label: lab('terem szélessége felirat'), k: 'terem szélessége felirat', min: 4, max: 12, step: .5, value: num('terem szélessége'), format: f, onInput: (v) => { S5.Wm = v; } });
        L.slider({ label: lab('terem magassága felirat'), k: 'terem magassága felirat', min: 2.5, max: 5, step: .1, value: num('terem magassága'), format: f, onInput: (v) => { S5.Hm = v; } });
      } },
    { settle: 6,
      enter() { S6.r = num('rejtélyes kocka sűrűsége'); S6.t0 = 0; },
      controls(L) {
        L.slider({ label: lab('rejtélyes kocka csúszka'), k: 'rejtélyes kocka csúszka', min: .1, max: 3, step: .05, value: num('rejtélyes kocka sűrűsége'), format: (v) => fmt(v, 2) + ' g/cm³',
          onInput: (v) => { S6.r = v; if (L.st < 4.4) L.st = 4.4; S6.from = S6.y; S6.to = floatY(v); S6.t0 = L.st; } });
      } },
    { settle: 6 },
    { settle: 7,
      enter() { Object.assign(S8, { V: num('hajótest térfogata'), cargo: 0, user: false, started: false, y: 0 }); },
      controls(L) {
        const take = () => { if (!S8.user) { S8.user = true; S8.V = Math.max(S8.V, 1000); } };
        L.slider({ label: lab('hajótest csúszka'), k: 'hajótest csúszka', min: num('acélkocka térfogata'), max: 20000, step: 250, value: num('hajótest térfogata'), format: (v) => fmt(v) + ' cm³',
          onInput: (v) => { take(); S8.V = v; retarget(L.st); } });
        L.button(lab('rakomány gomb'), () => { take(); if (S8.cargo < 12) S8.cargo++; retarget(L.st); }, 'rakomány gomb');
        L.button(lab('kirakodás gomb'), () => { take(); S8.cargo = 0; retarget(L.st); }, 'kirakodás gomb');
      } },
    { settle: 6 },
  ],
  init(Lx) { L = Lx; c = L.ctx; buildS7(); },
  draw(Lx) {
    L = Lx; c = L.ctx; GA = 1; background();
    const sp = L.sp;
    if (L.step >= 0) sT[L.step] = L.st;
    for (let i = 0; i < SCENES.length; i++) {
      const w = clamp(1 - Math.abs(sp - i) * 2); if (w <= .005) continue;
      GA = w; SCENES[i](sT[i], L.step === i);
    }
    c.globalAlpha = 1;
  },
});
})();
</script>
