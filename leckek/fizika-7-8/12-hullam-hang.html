<script>
(function () {
'use strict';
const U = Lesson.U, { clamp, lerp, out, smooth, TAU } = U, fmt = U.fmt;
const F = Lesson.FONTS;
/* ── paletta (világos téma, lásd SZERZODES.md) ── */
const INK = '#1c2440', MUT = '#565d72', RED = '#c8401c', TEAL = '#0a6f86', GOOD = '#1d7a45', BAD = '#b3261e',
  CARD = '#fffaf1', LINE = 'rgba(28,36,64,.16)', AIR = '#1b5a94', REDD = '#7f2810', TEALD = '#08485a';
let L, c, GA = 1;
const al = (a = 1) => { c.globalAlpha = GA * clamp(a); };
const lab = (k) => L.lab(k), num = (k) => L.num(k);
const T = (k, x, y, o = {}) => L.tx(lab(k), x, y, Object.assign({ k }, o));
const TP = (k, x, y, o = {}) => L.pill(lab(k), x, y, Object.assign({ k }, o));
const tx = (s, x, y, o) => L.tx(s, x, y, o);
const rr = (x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, w, h, r); };
const ln = (x1, y1, x2, y2, col, w = 2, dash) => { c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.strokeStyle = col; c.lineWidth = w; c.setLineDash(dash || []); c.stroke(); c.setLineDash([]); };
const mod = (a, m) => ((a % m) + m) % m;
const fade = (u, e = .1) => clamp(u / e) * clamp((1 - u) / e);
function arrowHead(x, y, ang, col, s = 12) {
  c.beginPath(); c.moveTo(x, y); c.lineTo(x - s * Math.cos(ang - .45), y - s * Math.sin(ang - .45)); c.lineTo(x - s * Math.cos(ang + .45), y - s * Math.sin(ang + .45)); c.closePath();
  c.fillStyle = col; c.fill();
}
function arrow(x1, y1, x2, y2, col, w = 3, s = 14) { ln(x1, y1, x2, y2, col, w); arrowHead(x2, y2, Math.atan2(y2 - y1, x2 - x1), col, s); }
function card(x, y, w, h, r = 20) { rr(x, y, w, h, r); c.fillStyle = CARD; c.fill(); c.strokeStyle = LINE; c.lineWidth = 2; c.stroke(); }

/* ── háttér: meleg papír, halvány négyzetrács (a 05-inga leckéből) ── */
function background() {
  c.globalAlpha = 1;
  const g = c.createRadialGradient(680, 480, 100, 680, 540, 1300); g.addColorStop(0, '#f7f1e6'); g.addColorStop(1, '#efe6d6');
  c.fillStyle = g; c.fillRect(0, 0, 1920, 1080);
  c.strokeStyle = 'rgba(28,36,64,.045)'; c.lineWidth = 1; c.beginPath();
  for (let x = 0; x <= 1920; x += 40) { c.moveTo(x + .5, 0); c.lineTo(x + .5, 1080); }
  for (let y = 0; y <= 1080; y += 40) { c.moveTo(0, y + .5); c.lineTo(1920, y + .5); }
  c.stroke();
}

/* ════════ Hullám-modell (1D): a forrás rezgése fázis-szakaszokból ════════
   A forrás kitérése s(τ) = A·sin φ(τ); a hullám az x távolságba d/v idő alatt ér el:
   y(d, t) = s(t − d/v). A frekvencia változtatása új szakaszt kezd (folytonos fázissal),
   így az új frekvencia a forrástól v sebességgel terjed ki – a rajz mindig v = λ·f-et követi.
   Zárt képlet: bármely (d, t) közvetlenül számolható (QA, visszaléptetés). */
function mkWave(t0, f, ramp = 0) { return { t0, ramp, segs: [{ t: t0, f, ph: 0 }] }; }
function phase(Wv, tau) {
  const s = Wv.segs; if (tau < s[0].t) return null;
  let i = s.length - 1; while (i > 0 && s[i].t > tau) i--;
  return s[i].ph + TAU * s[i].f * (tau - s[i].t);
}
function setF(Wv, t, f) {
  const s = Wv.segs;
  if (t <= s[0].t) { s.length = 1; s[0].f = f; return; }
  while (s.length > 1 && s[s.length - 1].t >= t) s.pop();
  s.push({ t, f, ph: phase(Wv, t) });
  while (s.length > 2 && s[2].t < t - 10) s.splice(1, 1);   // a 10 s-nál régebbi szakaszok már kifutottak a képből
}
/* forrás-kitérés τ időpontban (A egységben) */
function src(Wv, tau) {
  const p = phase(Wv, tau); if (p == null) return 0;
  return (Wv.ramp ? smooth((tau - Wv.t0) / Wv.ramp) : 1) * Math.sin(p);
}
/* egy hullámhegy követése a legutóbbi szakasz tartományában: d ∈ [D0, D0 + n·λ), áttűnéssel */
function crest(Wv, t, v, D0, n, ph0 = TAU / 4) {
  const s = Wv.segs[Wv.segs.length - 1], P = phase(Wv, t); if (P == null) return null;
  const lam = v / s.f, span = n * lam, c0 = lam * ((P - ph0) / TAU);
  const d = D0 + mod(c0 - D0, span), R = v * (t - s.t);
  if (d > R) return null;
  return { d, lam, a: fade((d - D0) / span, .1) };
}

/* ════════ gyöngysor ════════ */
const XS = 120, XE = 1330, SR = 300, BSP = 24;   // forrás x, kötél vége, px/m lépték, gyöngytávolság
const ropeV = () => num('hullám sebessége a kötélen') * SR, ropeF = () => num('kötél rezgésének frekvenciája'),
  ropeA = () => num('kötél rezgésének amplitúdója') * SR;
function bead(x, y, r, red, a) {
  al(a);
  const g = c.createRadialGradient(x - r * .35, y - r * .4, r * .1, x, y, r);
  if (red) { g.addColorStop(0, '#fbdccd'); g.addColorStop(1, '#d4643d'); } else { g.addColorStop(0, '#d6eff4'); g.addColorStop(1, '#3d9db3'); }
  c.beginPath(); c.arc(x, y, r, 0, TAU); c.fillStyle = g; c.fill(); c.strokeStyle = red ? REDD : TEALD; c.lineWidth = 2.5; c.stroke();
}
/* kötél + gyöngyök; yAt(d) → függőleges kitérés (px, felfelé +). redX: a kiemelt gyöngy x-e */
function rope(RY, yAt, a, redX) {
  al(a); c.beginPath();
  for (let x = XS; x <= XE; x += 3) { const y = RY - yAt(x - XS); x === XS ? c.moveTo(x, y) : c.lineTo(x, y); }
  c.strokeStyle = INK; c.lineWidth = 3; c.lineJoin = 'round'; c.stroke();
  for (let x = XS + BSP; x <= XE; x += BSP) { if (x === redX) continue; bead(x, RY - yAt(x - XS), 9, false, a); }
  if (redX) bead(redX, RY - yAt(redX - XS), 12, true, a);
}
/* a „kéz”: függőleges sín + ököl a kötél elején */
function hand(RY, y, A, a) {
  al(a * .5); rr(XS - 9, RY - A - 26, 18, 2 * A + 52, 9); c.fillStyle = 'rgba(28,36,64,.08)'; c.fill(); c.strokeStyle = 'rgba(28,36,64,.3)'; c.lineWidth = 2; c.stroke();
  al(a); rr(XS - 34, RY - y - 22, 40, 44, 14); c.fillStyle = '#f2cfa8'; c.fill(); c.strokeStyle = '#7a4f2a'; c.lineWidth = 2.5; c.stroke();
  ln(XS - 26, RY - y - 6, XS - 4, RY - y - 6, '#7a4f2a', 2); ln(XS - 26, RY - y + 6, XS - 4, RY - y + 6, '#7a4f2a', 2);
  rr(XS - 70, RY - y - 12, 38, 24, 8); c.fillStyle = '#7cc2d2'; c.fill(); c.strokeStyle = TEALD; c.lineWidth = 2.5; c.stroke();
}

/* ════════ 1. A minta halad, nem a kötél ════════ */
const W1 = mkWave(1.0, 1, .4);
const RX1 = XS + 27 * BSP;   // a piros gyöngy
function person(x, base, h, H, shirt, dark, a) {
  al(a); c.lineCap = 'round';
  const up = clamp(h / H), top = base - h;
  c.strokeStyle = '#3b4556'; c.lineWidth = 9; c.beginPath(); c.moveTo(x - 6, top - 14); c.lineTo(x - 6, base + 4); c.moveTo(x + 6, top - 14); c.lineTo(x + 6, base + 4); c.stroke();
  for (const s of [-1, 1]) {
    const an = lerp(Math.PI / 2 - s * .25, -Math.PI / 2 - s * .35, up), sx = x + s * 11, sy = top - 52;
    c.strokeStyle = shirt; c.lineWidth = 8; c.beginPath(); c.moveTo(sx, sy); c.lineTo(sx + 30 * Math.cos(an), sy + 30 * Math.sin(an)); c.stroke();
  }
  rr(x - 14, top - 60, 28, 50, 10); c.fillStyle = shirt; c.fill(); c.strokeStyle = dark; c.lineWidth = 2.5; c.stroke();
  c.beginPath(); c.arc(x, top - 74, 12, 0, TAU); c.fillStyle = '#f2cfa8'; c.fill(); c.strokeStyle = '#7a4f2a'; c.lineWidth = 2.5; c.stroke();
  c.lineCap = 'butt';
}
function scene1(st) {
  const RY = 330, v = ropeV(), A = ropeA(), p0 = out(clamp(st / .6));
  W1.segs[0].f = ropeF();
  const yAt = (d) => A * src(W1, st - d / v);
  al(p0); T('gyöngysor', 60, 110, { f: F.D, s: 36, w: 560, c: INK });
  // a piros gyöngy pályája
  al(p0 * .8); ln(RX1, RY - A - 18, RX1, RY + A + 18, U.rgba(RED, .6), 2, [6, 6]);
  for (const yy of [RY - A, RY + A]) ln(RX1 - 14, yy, RX1 + 14, yy, U.rgba(RED, .8), 2.5);
  rope(RY, yAt, p0, RX1);
  hand(RY, A * src(W1, st), A, p0);
  al(p0); T('kéz', XS - 30, RY + A + 62, { s: 24, w: 600, a: 'center', c: MUT });
  al(p0 * clamp((st - 1.6) / .6)); T('piros gyöngy', RX1, RY + A + 62, { s: 28, w: 700, a: 'center', c: RED });
  // a minta (egy hullámhegy) halad
  const cr = crest(W1, st, v, 150, 3);
  if (cr) {
    const x = XS + cr.d, y = RY - yAt(cr.d);
    al(p0 * cr.a); c.beginPath(); c.moveTo(x - 11, y - 34); c.lineTo(x + 11, y - 34); c.lineTo(x, y - 16); c.closePath(); c.fillStyle = TEAL; c.fill();
    const b = TP('minta halad', x, RY - A - 66, { a: 'center', s: 24, w: 700, bg: TEAL, c: '#ffffff' });
    arrow(b.x + b.w + 8, RY - A - 66, b.x + b.w + 58, RY - A - 66, TEAL, 3.5);
  }
  // stadionhullám
  const base = 975, H = 46, xc = st < 1.5 ? -500 : -150 + mod(st - 1.5, 6) * 300;
  al(p0); T('stadionhullám', 60, 690, { f: F.D, s: 36, w: 560, c: INK });
  T('stadion magyarázat', 60, 732, { s: 24, w: 500, c: MUT, max: 900 });
  al(p0); rr(40, base - 4, 1300, 26, 6); c.fillStyle = '#d8c7a1'; c.fill(); c.strokeStyle = '#8c7444'; c.lineWidth = 2.5; c.stroke();
  const shirts = [['#7cc2d2', TEALD], ['#e3b04b', '#7a5410'], ['#9aa6c4', '#3b4556'], ['#86c28f', '#1d5a32']];
  for (let i = 0, x = 100; x <= 1300; x += 44, i++) {
    const h = H * Math.exp(-Math.pow((x - xc) / 110, 2)), red = x === 760;
    const [sh, dk] = red ? ['#e0714a', REDD] : shirts[i % 4];
    person(x, base, h, H, sh, dk, p0);
  }
}

/* ════════ 2. Amplitúdó, frekvencia, hullámhossz ════════ */
const W2 = mkWave(-30, 1);
const RX2 = XS + 37 * BSP, VP = 150, ST0 = .6;   // piros gyöngy = toll helye; papírsebesség px/s; a toll indulása
function scene2(st) {
  const RY = 250, v = ropeV(), f = ropeF(), A = ropeA(), p0 = out(clamp(st / .6));
  W2.segs[0].f = f;
  const yAt = (d) => A * src(W2, st - d / v), lam = v / f;
  // burkoló (±A)
  const pa = clamp((st - 1) / .6);
  al(p0 * (.35 + .65 * pa)); for (const yy of [RY - A, RY + A]) ln(XS, yy, XE, yy, U.rgba(TEAL, .55), 2, [8, 8]);
  ln(XS, RY, XE, RY, 'rgba(28,36,64,.2)', 1.5, [4, 6]);
  rope(RY, yAt, p0, RX2);
  hand(RY, A * src(W2, st), A, p0);
  // amplitúdó-jelölés (jobb szélen, állandó helyen)
  if (pa > 0) {
    al(p0 * pa); arrow(1346, RY, 1346, RY - A + 2, TEAL, 3, 12); arrowHead(1346, RY, Math.PI / 2, TEAL, 12); ln(1334, RY, 1356, RY, TEAL, 2);
    L.pill(lab('amplitúdó név') + ' (A)', 1318, RY - A - 36, { k: 'amplitúdó név', a: 'right', s: 24, w: 700, bg: CARD, bd: TEAL, c: TEALD });
  }
  // hullámhossz: két szomszédos hegy, a hullámmal együtt halad
  const pl = clamp((st - 2) / .6), cr = crest(W2, st, v, 60, 3);
  if (pl > 0 && cr && cr.d + lam < XE - XS - 10) {
    const x1 = XS + cr.d, x2 = x1 + lam, yb = RY + A + 30;
    al(p0 * pl * cr.a);
    ln(x1, RY - A, x1, yb + 8, U.rgba(RED, .55), 2, [5, 5]); ln(x2, RY - A, x2, yb + 8, U.rgba(RED, .55), 2, [5, 5]);
    arrow(x1 + (x2 - x1) / 2, yb, x2, yb, RED, 3, 12); arrow(x1 + (x2 - x1) / 2, yb, x1, yb, RED, 3, 12);
    L.pill(lab('hullámhossz név') + ' (λ)', (x1 + x2) / 2, yb + 38, { k: 'hullámhossz név', a: 'center', s: 24, w: 700, bg: CARD, bd: RED, c: REDD });
  }
  // papírcsík: a piros gyöngy kitérése az idő függvényében (a 05-inga papírcsíkjának vízszintes változata)
  const top = 490, bot = 850, YC = 670, x0 = 140, x1 = RX2;
  al(p0); T('papírcsík', x0, top - 18, { s: 26, w: 700, c: INK });
  al(p0); rr(x0, top, x1 - x0, bot - top, 10); c.fillStyle = CARD; c.fill(); c.strokeStyle = LINE; c.lineWidth = 2; c.stroke();
  c.save(); rr(x0, top, x1 - x0, bot - top, 10); c.clip();
  ln(x0, YC, x1, YC, 'rgba(28,36,64,.3)', 1.5, [6, 6]);
  for (const yy of [YC - A, YC + A]) ln(x0, yy, x1, yy, 'rgba(28,36,64,.12)', 1.5);
  if (st > ST0) for (let k = 0; ; k++) { const x = x1 - (st - ST0 - k) * VP; if (x > x1) break; if (x >= x0) ln(x, top, x, bot, 'rgba(28,36,64,.13)', 1.2); }
  const yB = (tau) => A * src(W2, tau - (RX2 - XS) / v);   // a piros gyöngy kitérése
  c.beginPath(); let n = 0;
  for (let x = x1; x >= x0 - 2; x -= 2) { const tau = st - (x1 - x) / VP; if (tau < ST0) break; const y = YC - yB(tau); n++ ? c.lineTo(x, y) : c.moveTo(x, y); }
  c.strokeStyle = RED; c.lineWidth = 3.5; c.lineJoin = 'round'; c.stroke();
  c.restore();
  const yb = yB(st);
  al(p0 * .7); ln(RX2, RY - yb + 14, RX2, YC - yb - 12, U.rgba(RED, .5), 2, [4, 6]);
  al(p0); c.beginPath(); c.moveTo(x1 + 2, YC - yb); c.lineTo(x1 + 18, YC - yb - 10); c.lineTo(x1 + 18, YC - yb + 10); c.closePath(); c.fillStyle = RED; c.fill(); c.strokeStyle = REDD; c.lineWidth = 2; c.stroke();
  T('korábban', x0, bot + 34, { s: 22, w: 600, c: MUT });
  T('most', x1, bot + 34, { s: 22, w: 600, a: 'right', c: MUT });
  // periódusidő: két szomszédos csúcs a papíron

  const p0 = out(clamp(st / .6)), t = st * TAU * .5;
  const cards = [
    ['össz minta cím', 'össz minta szöveg'], [null, 'össz képlet szöveg'], ['össz magasság cím', 'össz magasság szöveg'],
    ['össz hangerő cím', 'össz hangerő szöveg'], ['össz közeg cím', 'össz közeg szöveg'], ['össz fül cím', 'össz fül szöveg']];
  cards.forEach(([kt, ks], i) => {
    const x = 60 + (i % 2) * 640, y = 70 + Math.floor(i / 2) * 320, q = clamp((st - .3 - i * .35) / .5); if (q <= 0) return;
    al(p0 * q); card(x, y + (1 - out(q)) * 20, 620, 296);
    const dx = x + 40, dy = y + 30, dw = 540;   // rajzterület: dx..dx+dw, dy..dy+130

      for (let k = 18; k <= dw; k += 18) bead(dx + k, dy + 70 - 34 * Math.sin(TAU * k / 180 - t), 6, k === 270, p0 * q);
    } else if (i === 1) {

      ln(dx + 45, dy + 36, dx + 45, dy + 126, U.rgba(TEAL, .5), 2, [4, 4]); ln(dx + 225, dy + 36, dx + 225, dy + 126, U.rgba(TEAL, .5), 2, [4, 4]);
      ln(dx + 45, dy + 120, dx + 225, dy + 120, TEAL, 2.5); arrowHead(dx + 45, dy + 120, Math.PI, TEAL, 10); arrowHead(dx + 225, dy + 120, 0, TEAL, 10);
    } else if (i === 2) {

    else tx('v = λ · f', dx, y + 214, { f: F.D, i: 1, s: 34, w: 600, c: INK, qa: false });

}

/* ════════════════════════════════════════════════════════════════ */
const sT = new Array(9).fill(0);
const SCENES = [scene1, scene2, scene3, scene4, scene5, scene6, scene7, scene8, scene9];
const srcOf = (k) => (L.content && L.content.src && L.content.src[k]) || 0;

L = Lesson.create({
  content: window.LESSON_CONTENT,

  steps: [

        L.slider({ label: lab('frekvencia csúszka'), k: 'frekvencia csúszka', min: .5, max: 3, step: .1, value: ropeF(), format: (v) => fmt(v, 1) + ' Hz',

        L.slider({ label: lab('hőmérséklet csúszka'), k: 'hőmérséklet csúszka', min: -20, max: 40, step: 1, value: num('levegő hőmérséklete'), format: (v) => fmt(v, 0) + ' °C',

    { settle: 4,
      enter() { S6.f = num('zenei a frekvenciája'); S6.a = .6; },
      leave() { toneOff(); S6.on = false; },
      controls(L) {
        const lo = Math.log(num('legmélyebb hallható hang')), hi = Math.log(num('legmagasabb hallható hang'));
        const fA = num('zenei a frekvenciája'), s0 = Math.round((Math.log(fA) - lo) / (hi - lo) * 1000);
        /* logaritmikus csúszka, 2 értékes jegyre kerekítve; a kezdőhelyzet pontosan a zenei a */
        const toF = (s) => { if (s === s0) return fA; const f = Math.exp(lo + (hi - lo) * s / 1000); const m = Math.pow(10, Math.floor(Math.log10(f)) - 1); return Math.round(f / m) * m; };
        L.slider({ label: lab('frekvencia csúszka 2'), k: 'frekvencia csúszka 2', min: 0, max: 1000, step: 1, value: s0, format: (s) => fmtHz(toF(s)),

        L.slider({ label: lab('amplitúdó csúszka'), k: 'amplitúdó csúszka', min: 0, max: 100, step: 1, value: 60, format: (v) => fmt(v, 0) + ' %',
