<script>
(function () {
'use strict';
const U = Lesson.U, { clamp, lerp, smooth, out, inOut, TAU } = U, fmt = U.fmt;
const F = Lesson.FONTS;
/* ── paletta (világos téma, lásd SZERZODES.md) ── */
const INK = '#1c2440', MUT = '#565d72', RED = '#c8401c', TEAL = '#0a6f86', GOOD = '#1d7a45', BAD = '#b3261e',
  CARD = '#fffaf1', LINE = 'rgba(28,36,64,.16)', WATER_D = '#1b5a94';
const SUN = '#c98a00', SUN_D = '#7d5600', IR = '#c8401c';     // napfény (rövid hullám) · infravörös (hosszú hullám)
let L, c, GA = 1;
const al = (a = 1) => { c.globalAlpha = GA * clamp(a); };
const lab = (k) => L.lab(k), num = (k) => L.num(k);
const T = (k, x, y, o = {}) => L.tx(lab(k), x, y, Object.assign({ k }, o));
const TH = (k, v, x, y, o = {}, ks = []) => L.tx(lab(k).replace('#', v), x, y, Object.assign({}, o, { k: [k].concat(ks) }));
const tx = (s, x, y, o) => L.tx(s, x, y, o);
const rr = (x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, w, h, r); };
const ln = (x1, y1, x2, y2, col, w = 2, dash) => { c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.strokeStyle = col; c.lineWidth = w; c.setLineDash(dash || []); c.stroke(); c.setLineDash([]); };
const sg = (v, d = 1) => (v >= Math.pow(10, -d) / 2 ? '+' : '') + fmt(v, d);
const DEG = (v, d = 1) => sg(v, d) + ' °C';
const WM = (v) => fmt(v) + ' W/m²';

/* ── háttér: meleg papír, halvány négyzetrács ── */
function background() {
  c.globalAlpha = 1;
  const g = c.createRadialGradient(680, 480, 100, 680, 540, 1300); g.addColorStop(0, '#f7f1e6'); g.addColorStop(1, '#efe6d6');
  c.fillStyle = g; c.fillRect(0, 0, 1920, 1080);
  c.strokeStyle = 'rgba(28,36,64,.045)'; c.lineWidth = 1; c.beginPath();
  for (let x = 0; x <= 1920; x += 40) { c.moveTo(x + .5, 0); c.lineTo(x + .5, 1080); }
  for (let y = 0; y <= 1080; y += 40) { c.moveTo(0, y + .5); c.lineTo(1920, y + .5); }
  c.stroke();
}
function card(x, y, w, h, a, bg, bd) { al(a); rr(x, y, w, h, 18); c.fillStyle = bg || CARD; c.fill(); c.strokeStyle = bd || LINE; c.lineWidth = 2; c.stroke(); }
function arrowTo(x1, y1, x2, y2, col, w = 4, hs = 16) {
  const an = Math.atan2(y2 - y1, x2 - x1), bx = x2 - Math.cos(an) * hs * .8, by = y2 - Math.sin(an) * hs * .8;
  ln(x1, y1, bx, by, col, w);
  c.beginPath(); c.moveTo(x2, y2); c.lineTo(x2 - hs * Math.cos(an - .45), y2 - hs * Math.sin(an - .45)); c.lineTo(x2 - hs * Math.cos(an + .45), y2 - hs * Math.sin(an + .45)); c.closePath();
  c.fillStyle = col; c.fill();
}
/* áthúzott tévhit-doboz + helyes válasz (a 06-halmazallapot mintájára) */
function myth(kq, ka, x, y, st, t0, a, o = {}) {
  const s = o.s || 26;
  al(a * clamp((st - t0) / .5)); const b = L.pill(lab(kq), x, y, { k: kq, a: o.a || 'center', s, f: F.D, i: 1, w: 500, bg: '#ffffff', bd: BAD, c: BAD, pad: 14 });
  const q = clamp((st - t0 - 1.2) / .4);
  if (q > 0) { al(a); ln(b.x + 10, b.y + b.h / 2, lerp(b.x + 10, b.x + b.w - 10, q), b.y + b.h / 2, BAD, 4); }
  al(a * clamp((st - t0 - 1.6) / .5)); L.pill(lab(ka), o.a === 'left' ? b.x : x, y + (o.dy || 56), { k: ka, a: o.a || 'center', s: s - 2, w: 700, bg: GOOD, c: '#ffffff', pad: 12 });
}
/* determinisztikus hash → véletlenmag (a fotonfolyamokhoz) */
const hash = (a, b) => { let h = Math.imul(a ^ 0x9e3779b9, 0x85ebca6b) ^ Math.imul(b + 0x632be5ab, 0xc2b2ae35); h ^= h >>> 13; h = Math.imul(h, 0x27d4eb2f); return ((h ^ (h >>> 16)) >>> 0) || 1; };

/* ════════ A modell – minden szám innen jön (rajz és kiírás is) ════════ */
const M = {};
function model() {
  M.S0 = num('napállandó'); M.alb = num('albedó') / 100; M.sig = num('Stefan–Boltzmann-állandó');
  M.inAvg = M.S0 / 4; M.ref = M.inAvg * M.alb; M.abs = M.inAvg - M.ref;          // W/m², a Föld teljes felszínére átlagolva
  M.Te = Math.pow(M.abs / M.sig, .25) - 273.15;                                  // légkör nélküli egyensúly (°C)
  M.Tr = num('mai átlaghőmérséklet');
  M.eps = 2 * (1 - M.abs / emit(M.Tr));     // egyrétegű légkör: ennyi részét nyeli el a felszín infravörösének (fele fel, fele le)
  M.C0 = num('CO₂ iparosodás előtt'); M.Cn = num('CO₂ ma'); M.S2 = num('melegedés duplázásonként'); M.k5 = num('CO₂-hatás együtthatója');
  M.lam = M.k5 * Math.LN2 / M.S2;           // W/m² többlet-kisugárzás 1 °C melegedésenként (visszacsatolásokkal)
}
const emit = (Tc) => M.sig * Math.pow(Tc + 273.15, 4);       // kisugárzás (Stefan–Boltzmann)
const dF = (C) => M.k5 * Math.log(C / M.C0);                  // sugárzási többlet (W/m²)
const dTeq = (C) => M.S2 * Math.log2(C / M.C0);               // egyensúlyi melegedés (°C)
const EMAX = 560;                                              // a mérlegsávok skálája (W/m²)
const KPH = .032;                                              // fotonok másodpercenként W/m²-enként (jelképes)

/* ════════ A légkör metszete (1–5. lépés közös alapja) ════════ */
const GY = 650, Y0 = 46, ATM = 150;            // felszín teteje · fotonok indulása · légkör teteje
const SUNP = { x: 1270, y: 64, r: 62 };
const CLOUD = { x: 560, y: 300 };
const SD = (() => { const x = -.42, y = .91, n = Math.hypot(x, y); return { x: x / n, y: y / n }; })();   // a napsugarak iránya
const MOL = { air: [], gh: [], co2: [] };
function buildMolecules() {
  const r = U.rng(1405), pts = [];
  const free = (x, y, d) => !pts.some((p) => Math.hypot(p.x - x, p.y - y) < d) &&
    !(x < 500 && y < 340) && !(Math.abs(x - CLOUD.x) < 160 && Math.abs(y - CLOUD.y) < 70) && !(x > 700 && x < 1260 && y > 540);
  const put = (n, d, arr, kind) => { let g = 0; while (arr.length < n && g++ < 5000) { const x = 60 + r() * 1250, y = ATM + 40 + r() * (GY - ATM - 80); if (free(x, y, d)) { const p = { x, y, ph: r() * TAU, ang: r() * TAU, kind }; pts.push(p); arr.push(p); } } };
  put(14, 64, MOL.co2, 'co2');
  const h = []; put(5, 64, h, 'h2o'); const m = []; put(1, 64, m, 'ch4');
  MOL.gh = MOL.co2.slice(0, 6).concat(h, m);
  put(40, 56, MOL.air, 'air');
  MOL.h = h; MOL.m = m;
}
const wob = (p, st) => [p.x + Math.sin(st * .7 + p.ph) * 6, p.y + Math.cos(st * .55 + p.ph * 1.3) * 5];

function sunDisk(a) {
  al(a); const { x, y, r } = SUNP;
  for (let i = 0; i < 12; i++) { const an = i / 12 * TAU; ln(x + Math.cos(an) * (r + 10), y + Math.sin(an) * (r + 10), x + Math.cos(an) * (r + 30), y + Math.sin(an) * (r + 30), SUN, 4); }
  const g = c.createRadialGradient(x - 18, y - 18, 6, x, y, r); g.addColorStop(0, '#ffe9a0'); g.addColorStop(1, '#f0b429');
  c.beginPath(); c.arc(x, y, r, 0, TAU); c.fillStyle = g; c.fill(); c.strokeStyle = '#a86d00'; c.lineWidth = 3; c.stroke();
}
function cloud(x, y, a, dim) {    // halványítás színkeveréssel (átlátszósággal a belső körívek átlátszanának)
  al(a); c.beginPath();
  for (const [dx, dy, r] of [[-90, 12, 34], [-45, -14, 44], [8, -24, 50], [62, -6, 40], [100, 14, 30], [0, 18, 40], [-50, 20, 32], [55, 20, 32]]) { c.moveTo(x + dx + r, y + dy); c.arc(x + dx, y + dy, r, 0, TAU); }
  c.strokeStyle = U.mix('#d3dce2', '#7d889c', dim); c.lineWidth = 5; c.stroke();     // a vastag körvonal felét a kitöltés eltakarja → csak a külső kontúr marad
  c.fillStyle = U.mix('#dbe3e7', '#fbf8f2', dim); c.fill();
}
/* o: {atm: a légkör erőssége, glow: 0..1 a felszín „hőkamerás” izzása, ice: a jég rajza} */
function drawBase(a, o) {
  if (a <= .005) return;
  // légkör
  al(a * o.atm); const g = c.createLinearGradient(0, ATM - 40, 0, GY);
  g.addColorStop(0, 'rgba(70,150,215,0)'); g.addColorStop(.25, 'rgba(70,150,215,.10)'); g.addColorStop(1, 'rgba(70,150,215,.26)');
  c.fillStyle = g; c.fillRect(0, ATM - 40, 1380, GY - ATM + 40);
  al(a); T('világűr', 56, 66, { s: 24, w: 700, c: MUT, ls: '3px' });
  al(a * Math.max(.35, o.atm)); T('légkör', 56, ATM + 52, { s: 24, w: 700, c: WATER_D, ls: '3px' });
  // felszín: óceán | szárazföld | jég
  al(a); c.fillStyle = 'rgba(70,150,215,.50)'; c.fillRect(0, GY, 430, 74);
  c.fillStyle = '#9db36f'; c.fillRect(430, GY, 580, 74);
  c.fillStyle = '#e6ecf1'; c.fillRect(1010, GY, 370, 74);
  c.fillStyle = '#a58a62'; c.fillRect(0, GY + 74, 1380, 14);
  ln(0, GY, 430, GY, WATER_D, 3); ln(430, GY, 1010, GY, '#4d6b2e', 3); ln(1010, GY, 1380, GY, '#6f8499', 3);
  ln(0, GY + 74, 1380, GY + 74, 'rgba(28,36,64,.5)', 2);
  if (o.glow > .01) {
    for (const [wd, aa] of [[26, .22], [10, .55]]) { al(a * o.glow * aa); ln(0, GY + 2, 1380, GY + 2, '#ff6a2a', wd); }
  }
  al(a); L.pill(lab('felszín'), 452, GY + 37, { k: 'felszín', s: 22, w: 700, c: '#2f4a17', ls: '2px', bg: 'rgba(255,250,241,.75)', pad: 8 });
  al(a * o.ice); T('jég', 1040, GY + 46, { s: 22, w: 700, c: '#3d5468' });
  sunDisk(a);
  al(a); T('napfény', SUNP.x - SUNP.r - 40, SUNP.y + 12, { s: 24, w: 700, a: 'right', c: SUN_D });
  cloud(CLOUD.x, CLOUD.y, a, o.cloud);
  al(a * o.cloud); T('felhő', CLOUD.x, CLOUD.y + 74, { s: 22, w: 600, a: 'center', c: MUT });
}

/* ── hullámcsomag (foton): napfény = rövid hullám, infravörös = hosszú hullám ── */
const PK = { sun: { len: 52, lam: 13, amp: 6, col: SUN, lw: 3 }, ir: { len: 92, lam: 30, amp: 9, col: IR, lw: 3.5 } };
function packet(x, y, dx, dy, kind, a) {
  if (a <= .01) return;
  const P = PK[kind], nx = -dy, ny = dx; al(a);
  c.beginPath();
  for (let i = 0; i <= 30; i++) {
    const s = (i / 30 - .5) * P.len, env = Math.sin(Math.PI * i / 30), w = Math.sin(TAU * s / P.lam) * P.amp * env;
    const px = x + dx * s + nx * w, py = y + dy * s + ny * w; i ? c.lineTo(px, py) : c.moveTo(px, py);
  }
  c.strokeStyle = P.col; c.lineWidth = P.lw; c.lineCap = 'round'; c.lineJoin = 'round'; c.stroke(); c.lineCap = 'butt';
  const fx = x + dx * (P.len / 2 + 8), fy = y + dy * (P.len / 2 + 8);
  c.beginPath(); c.moveTo(fx, fy); c.lineTo(fx - dx * 13 + nx * 7, fy - dy * 13 + ny * 7); c.lineTo(fx - dx * 13 - nx * 7, fy - dy * 13 - ny * 7); c.closePath(); c.fillStyle = P.col; c.fill();
}
function flash(x, y, u, col, a) { if (u < 0 || u > 1) return; al(a * (1 - u)); c.beginPath(); c.arc(x, y, 5 + 20 * u, 0, TAU); c.strokeStyle = col; c.lineWidth = 3; c.stroke(); }
/* fotonfolyam zárt képlettel: az n. foton a tn = (n + véletlen)/rate időpontban indul */
function stream(st, rate, seed, life, fn) {
  const n0 = Math.max(0, Math.floor((st - life) * rate) - 1), n1 = Math.floor(st * rate);
  for (let n = n0; n <= n1; n++) {
    const r = U.rng(hash(seed, n)), tn = (n + r() * .9) / rate, age = st - tn;
    if (age < 0 || age > life) continue;
    fn(r, age, tn);
  }
}
/* napfény-foton: a felhőn / jégen visszaverődik (az albedó szerint), különben a felszín elnyeli */
const VS = 480;
function sunPhotons(st, a, o = {}) {
  const cl = .13, rate = KPH * M.inAvg;
  stream(st, rate, 11, 3.2, (r, age) => {
    const u = r(), u2 = r(), u3 = r(); let H, fate;
    if (u < cl) { fate = 'ref'; H = { x: CLOUD.x - 95 + u2 * 190, y: CLOUD.y - 36 }; }
    else if (u < M.alb) { fate = 'ref'; H = { x: 1030 + u2 * 270, y: GY }; }
    else { fate = 'abs'; let x = 60 + u2 * 700; if (x > 279) x += 240; H = { x, y: GY }; }
    const sx = H.x - SD.x / SD.y * (H.y - Y0), len = (H.y - Y0) / SD.y, t1 = len / VS;
    if (age < t1) { const s = age * VS; packet(sx + SD.x * s, Y0 + SD.y * s, SD.x, SD.y, 'sun', a * clamp(age / .15)); return; }
    const t = age - t1;
    if (fate === 'abs') { flash(H.x, H.y - 4, t / .4, SUN, a); return; }

    al(qv); L.pill(lab(ok ? 'igaz' : 'hamis'), 70, y, { k: ok ? 'igaz' : 'hamis', s: 24, w: 800, f: F.M, bg: ok ? GOOD : BAD, c: '#ffffff', pad: 12, ls: '1px' });
    al(q); T('állítás ' + k, 230, y + 10, { s: 32, w: 500, f: F.D, i: 1, c: INK, max: 1060 });
    const ans = k === 'káros' ? DEG(M.Te) : k === 'CO₂' ? DEG(M.S2, 0) : null, kk = 'válasz ' + k;
    al(qv); if (ans) TH(kk, ans, 230, y + 54, { s: 25, w: 600, c: ok ? GOOD : MUT, max: 1060 }, k === 'káros' ? ['napállandó', 'albedó'] : ['melegedés duplázásonként']);
    else T(kk, 230, y + 54, { s: 25, w: 600, c: MUT, max: 1060 });
  });
}

/* ════════════════════════════════════════════════════════════════ */
const sT = new Array(9).fill(0);
const SCENES = [scene1, scene2, scene3, scene4, scene5, scene6, scene7, scene8, scene9];
const BASE = [{ atm: 1, glow: 0, cloud: 1, ice: 1 }, { atm: .3, glow: 1, cloud: .25, ice: 1 }, null, { atm: 1, glow: 0, cloud: .25, ice: 1 }, { atm: 1, glow: 0, cloud: .25, ice: 1 }];
L = Lesson.create({
  content: window.LESSON_CONTENT,
  home: false,
  steps: [
    { settle: 4 },
    { settle: 5, enter() { reset2(); },
      controls(L) {
        S2.sl = L.slider({ label: lab('hőmérséklet csúszka'), k: 'hőmérséklet csúszka', min: -40, max: 40, step: .2, value: num('mai átlaghőmérséklet'), format: (v) => DEG(v, 1),
          onInput: (v) => { const st = L.st; S2.from = T2(st); S2.to = v; S2.t0 = st; S2.touched = true; } });
      } },
    { settle: 6, enter() { reset3(); },
      controls(L) {
        L.slider({ label: lab('kezdő csúszka'), k: 'kezdő csúszka', min: -80, max: 60, step: 5, value: num('mai átlaghőmérséklet'), format: (v) => DEG(v, 0),
          onInput: (v) => { const st = L.st, cur = S3.curves[S3.curves.length - 1]; if (st - cur.t0 < .25) S3.curves.pop(); S3.curves.push({ T0: v, t0: st, T: solve(v) }); if (S3.curves.length > 5) S3.curves.shift(); } });
      } },
    { settle: 6, enter() { reset4(); },
      controls(L) {
        L.button(lab('légkör nélkül gomb'), () => set4(0), 'légkör nélkül gomb');
        L.button(lab('légkörrel gomb'), () => set4(1), 'légkörrel gomb');
      } },
    { settle: 6.5, enter() { reset5(); },
      controls(L) {
        S5.sl = L.slider({ label: lab('CO₂ csúszka'), k: 'CO₂ csúszka', min: 280, max: 560, step: 1, value: num('CO₂ ma'), format: (v) => fmt(v) + ' ppm',
          onInput: (v) => set5(v) });
      } },
    { settle: 4.5, enter() { reset6(); },
      controls(L) {
        L.slider({ label: lab('albedó csúszka'), k: 'albedó csúszka', min: 5, max: 90, step: 1, value: num('óceán fényvisszaverése'), format: (v) => fmt(v) + ' %',
          onInput: (v) => { const st = L.st; S6.af = A6(st); S6.at = v / 100; S6.t0 = st; } });
      } },
    { settle: 7 },
    { settle: 6, enter() { S8.t0 = 0; },
      controls(L) { L.button(lab('újra gomb'), () => { S8.t0 = L.st; }, 'újra gomb'); } },
    { settle: 4.5 },
  ],
  init(Lx) {
    L = Lx; c = L.ctx; model(); buildMolecules(); buildData();
    reset2(); reset3(); reset4(); reset5(); reset6();
  },
  draw(Lx) {
    L = Lx; c = L.ctx; GA = 1; background();
    const sp = L.sp;
    if (L.step >= 0) sT[L.step] = L.st;
    // közös alap (légkörmetszet) a 1., 2., 4., 5. lépésnek: súlyozott keverék
    let wb = 0; const o = { atm: 0, glow: 0, cloud: 0, ice: 0 };
    BASE.forEach((b, i) => { if (!b) return; const w = clamp(1 - Math.abs(sp - i) * 2); if (w <= 0) return; wb += w; for (const k in o) o[k] += b[k] * w; });
    if (wb > .005) { for (const k in o) o[k] /= wb; if (o.glow > 0) o.glow *= clamp((emit(T2(sT[1])) - 150) / 400); GA = 1; drawBase(Math.min(1, wb), o); }
    for (let i = 0; i < SCENES.length; i++) {
      const w = clamp(1 - Math.abs(sp - i) * 2); if (w <= .005) continue;
      GA = 1; SCENES[i](sT[i], w);
    }
    c.globalAlpha = 1;
  },
});
})();
</script>
