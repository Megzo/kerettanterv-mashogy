<script>
(function () {
'use strict';
const U = Lesson.U, { clamp, lerp, smooth, out, inOut, TAU } = U, fmt = U.fmt;
const F = Lesson.FONTS;
/* ── paletta (világos téma, lásd SZERZODES.md) ── */
const INK = '#1c2440', MUT = '#565d72', RED = '#c8401c', TEAL = '#0a6f86', GOOD = '#1d7a45', BAD = '#b3261e',
  WATER_D = '#1b5a94', CARD = '#fffaf1', LINE = 'rgba(28,36,64,.16)';
/* erők színe – minden jelenetben ugyanaz */
const C_G = INK, C_F = RED, C_R = TEAL;   // súly · felhajtóerő · tartóerő (erőmérő vagy fenék)
let L, c, GA = 1;
const al = (a = 1) => { c.globalAlpha = GA * clamp(a); };
const lab = (k) => L.lab(k), num = (k) => L.num(k);
const T = (k, x, y, o = {}) => L.tx(lab(k), x, y, Object.assign({ k }, o));
const tx = (s, x, y, o) => L.tx(s, x, y, o);
const rr = (x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, w, h, r); };
const P = (pts) => { c.beginPath(); pts.forEach((p, i) => i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])); c.closePath(); };
const ln = (x1, y1, x2, y2, col, w = 2, dash) => { c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.strokeStyle = col; c.lineWidth = w; c.setLineDash(dash || []); c.stroke(); c.setLineDash([]); };

/* ── fizika: egyetlen forrás minden jelenetnek ── */
const gN = () => num('nehézségi gyorsulás'), rw = () => num('víz sűrűsége');
const wN = (grams) => grams / 1000 * gN();             // tömeg (g) → súly (N)
const fN = (v, d = 2) => fmt(v, d) + ' N';
const edge = () => num('kocka éle');
const KG = ['nehézségi gyorsulás'], KW = ['víz sűrűsége', 'kocka éle', 'nehézségi gyorsulás'];

/* ── anyagok ── */
const MAT = {
  ko:    { k: 'kő', r: 'kő sűrűsége', base: '#b9aea4', dark: '#463c36', light: '#ddd4ca' },
  acel:  { k: 'acél', r: 'acél sűrűsége', base: '#8b96a3', dark: '#2c3644', light: '#c9d0d8' },
  fenyo: { k: 'fenyőfa', r: 'fenyőfa sűrűsége', base: '#d9a066', dark: '#7a4519', light: '#efc999' },
  doboz: { k: 'doboz', r: null, base: '#d3e6e2', dark: '#0f5a52', light: '#eef6f4' },
};

/* ── háttér: meleg papír, halvány négyzetrács ── */
function background() {
  c.globalAlpha = 1;
  const g = c.createRadialGradient(680, 480, 100, 680, 540, 1300); g.addColorStop(0, '#f7f1e6'); g.addColorStop(1, '#efe6d6');
  c.fillStyle = g; c.fillRect(0, 0, 1920, 1080);
  c.strokeStyle = 'rgba(28,36,64,.045)'; c.lineWidth = 1; c.beginPath();
  for (let x = 0; x <= 1920; x += 40) { c.moveTo(x + .5, 0); c.lineTo(x + .5, 1080); }
  for (let y = 0; y <= 1080; y += 40) { c.moveTo(0, y + .5); c.lineTo(1920, y + .5); }
  c.stroke();
}

/* ── test ferde vetületben; (x, yb) = az elülső lap bal alsó sarka, w × h az elülső lap ── */
function block(x, yb, w, h, mk, o = {}) {
  const M = MAT[mk], d = o.d == null ? w * .26 : o.d, dy = -d * .7, a = o.a == null ? 1 : o.a;
  if (a <= .01) return;
  const yt = yb - h;
  const front = [[x, yb], [x + w, yb], [x + w, yt], [x, yt]];
  const top = [[x, yt], [x + w, yt], [x + w + d, yt + dy], [x + d, yt + dy]];
  const side = [[x + w, yb], [x + w + d, yb + dy], [x + w + d, yt + dy], [x + w, yt]];
  al(a);
  if (d > 0) { P(side); c.fillStyle = U.mix(M.base, M.dark, .38); c.fill(); P(top); c.fillStyle = M.light; c.fill(); }
  let g = c.createLinearGradient(x, yt, x + w, yb);
  g.addColorStop(0, U.mix(M.base, M.light, .35)); g.addColorStop(1, U.mix(M.base, M.dark, .12));
  P(front); c.fillStyle = g; c.fill();
  c.save(); P(front); c.clip();
  if (mk === 'ko') {                 // gránit pöttyök
    const r = U.rng(7);
    for (let i = 0; i < 70; i++) { const u = r(), v = r(), k = r(); c.fillStyle = k < .45 ? 'rgba(40,32,28,.55)' : k < .8 ? 'rgba(255,255,255,.7)' : 'rgba(190,120,100,.6)'; c.fillRect(x + u * w, yt + v * h, 3 + k * 3, 3 + k * 2); }
  } else if (mk === 'acel') {        // fémes csík
    g = c.createLinearGradient(x, yt, x + w, yb);
    g.addColorStop(.25, 'rgba(255,255,255,0)'); g.addColorStop(.42, 'rgba(255,255,255,.55)'); g.addColorStop(.52, 'rgba(255,255,255,0)');
    c.fillStyle = g; c.fillRect(x, yt, w, h);
  } else if (mk === 'fenyo') {       // évgyűrű-erezet
    c.strokeStyle = U.rgba(M.dark, .32); c.lineWidth = 2;
    for (let i = 0; i < 6; i++) { c.beginPath(); const yy = yt + h * (.1 + i * .16); for (let k = 0; k <= 12; k++) c.lineTo(x + w * k / 12, yy + Math.sin(k * .9 + i * 1.7) * h * .025); c.stroke(); }
  } else if (mk === 'doboz') {       // homok a dobozban
    const hf = h * clamp(o.fill == null ? .5 : o.fill), r = U.rng(3);
    c.fillStyle = '#dcbd7c'; c.fillRect(x, yb - hf, w, hf);
    c.fillStyle = 'rgba(122,82,30,.45)'; for (let i = 0; i < 60 * hf / h; i++) c.fillRect(x + r() * w, yb - r() * hf, 2.5, 2.5);
    ln(x, yb - hf, x + w, yb - hf, '#9a7433', 2);
  }
  c.restore();
  c.lineJoin = 'round'; c.strokeStyle = M.dark; c.lineWidth = 2.5;
  if (d > 0) { P(side); c.stroke(); P(top); c.stroke(); }
  P(front); c.stroke();
  if (mk === 'doboz') { al(a); ln(x - 3, yt + 7, x + w + 3, yt + 7, M.dark, 3); }   // fedél
}
/* a felső lap közepe (ide köt a fonal) */
const topMid = (x, yb, w, h) => { const d = w * .26; return [x + w / 2 + d / 2, yb - h - d * .35]; };

/* ── vízfelszín hullámzással ── */
const wave = (x, t, amp) => Math.sin(x * .021 + t * 1.6) * amp + Math.sin(x * .053 - t * 2.3) * amp * .4;
function waterBody(x0, x1, ys, yb, t, a, amp = 1.5, tint) {
  al(a);
  const g = c.createLinearGradient(0, ys, 0, yb);
  g.addColorStop(0, tint ? 'rgba(40,150,170,.32)' : 'rgba(70,150,215,.30)'); g.addColorStop(1, tint ? 'rgba(14,92,120,.50)' : 'rgba(27,90,148,.50)');
  c.beginPath(); c.moveTo(x0, yb); for (let x = x0; x <= x1; x += 8) c.lineTo(x, ys + wave(x, t, amp)); c.lineTo(x1, ys + wave(x1, t, amp)); c.lineTo(x1, yb); c.closePath();
  c.fillStyle = g; c.fill();
  c.beginPath(); for (let x = x0; x <= x1; x += 8) c.lineTo(x, ys + wave(x, t, amp)); c.lineTo(x1, ys + wave(x1, t, amp)); c.strokeStyle = WATER_D; c.lineWidth = 3; c.stroke();
}

/* ── tartály: EGY geometria a rajzhoz és a számításhoz ──
   x0: bal belső fal (px), wcm × dcm: alapterület (cm), bot: belső fenék (px), h0: vízmélység test nélkül (cm), Hcm: fal magassága */
function mkTank(x0, wcm, bot, h0, dcm, px, Hcm) { return { x0, x1: x0 + wcm * px, wcm, dcm, A: wcm * dcm, bot, h0, px, rim: bot - Hcm * px }; }
const wsY = (Tk, V) => Tk.bot - (Tk.h0 + V / Tk.A) * Tk.px;                 // vízfelszín, ha V cm³ test van a víz alatt
/* test (Ab alapterület, a magasság) alja h cm-rel a (pillanatnyi) vízfelszín alatt (h < 0: fölötte) */
function dip(Tk, Ab, a, h) { const s = clamp(h, 0, a), V = Ab * s, ws = wsY(Tk, V); return { s, V, ws, yb: ws + h * Tk.px }; }
/* ugyanez a test aljának képernyő-helyéből */
function dipY(Tk, Ab, a, yb) {
  const s = clamp((yb - wsY(Tk, 0)) / (Tk.px * (1 - Ab / Tk.A)), 0, a), V = Ab * s;
  return { s, V, ws: wsY(Tk, V), yb };
}
function tankDraw(Tk, ws, a, inside, after, tint) {
  const { x0, x1, bot, rim } = Tk;
  al(a); rr(x0 - 4, rim, x1 - x0 + 8, bot - rim + 6, 6); c.fillStyle = 'rgba(255,255,255,.45)'; c.fill();
  if (inside) inside();
  waterBody(x0, x1, ws, bot, L.t, a, 1.4, tint);
  if (after) after();
  al(a); c.strokeStyle = 'rgba(28,36,64,.72)'; c.lineWidth = 4; c.lineJoin = 'round';
  c.beginPath(); c.moveTo(x0 - 4, rim); c.lineTo(x0 - 4, bot + 6); c.lineTo(x1 + 4, bot + 6); c.lineTo(x1 + 4, rim); c.stroke();
  ln(x0 - 14, bot + 8, x1 + 14, bot + 8, 'rgba(28,36,64,.35)', 3);
}

/* ── rugós erőmérő; yTop = a cső teteje. Vissza: a kampó helye ── */
const MLEN = (o) => o.len - 16;   // rúdhossz: a mutatótól a kampóig
function meter(x, yTop, Fv, o, a = 1) {
  const len = o.len, k = (len - 60) / o.Fmax, z0 = yTop + 34, py = z0 + clamp(Fv, 0, o.Fmax) * k, hook = py + MLEN(o);
  if (a <= .01) return hook;
  al(a);
  ln(x, o.hang || 0, x, yTop - 17, INK, 2.5);
  c.beginPath(); c.arc(x, yTop - 9, 8, 0, TAU); c.strokeStyle = INK; c.lineWidth = 3; c.stroke();
  rr(x - 24, yTop, 48, len, 12); c.fillStyle = 'rgba(255,250,241,.92)'; c.fill();
  for (let f = 0; f <= o.Fmax + 1e-9; f += o.minor) {
    const y = z0 + f * k, major = Math.abs(f / o.major - Math.round(f / o.major)) < 1e-6;
    ln(x - 22, y, x - (major ? 9 : 15), y, INK, major ? 2 : 1.2);
    if (major) tx(fmt(f), x - 32, y + 8, { f: F.M, s: 22, a: 'right', c: MUT });
  }
  tx('N', x + 32, z0 + 8, { f: F.M, s: 22, w: 700, c: MUT, qa: false });
  // rugó
  c.beginPath(); const n = 16, y0 = yTop + 6, y1 = py - 3;
  c.moveTo(x, y0); for (let i = 1; i < n; i++) c.lineTo(x + (i % 2 ? 7 : -7), lerp(y0, y1, i / n)); c.lineTo(x, y1);
  c.strokeStyle = '#4a5566'; c.lineWidth = 2; c.stroke();
  ln(x, py, x, hook - 12, '#4a5566', 4);
  rr(x - 20, py - 3, 40, 6, 3); c.fillStyle = RED; c.fill();
  rr(x - 24, yTop, 48, len, 12); c.strokeStyle = INK; c.lineWidth = 2.5; c.stroke();
  c.beginPath(); c.arc(x, hook - 6, 6, -Math.PI / 2, Math.PI * 1.15); c.strokeStyle = '#2c3644'; c.lineWidth = 3; c.stroke();
  return hook;
}
/* erőmérő magassága: a kampót a megadott helyre tevő csőtető */
const meterTop = (hook, Fv, o) => hook - MLEN(o) - 34 - clamp(Fv, 0, o.Fmax) * (o.len - 60) / o.Fmax;
/* digitális kijelző */
function readout(s, x, y, k, a = 'left', sz = 26) { return L.pill(s, x, y, { k, a, s: sz, f: F.M, w: 700, bg: '#22302a', c: '#8df0a6', pad: 10, r: 8 }); }

/* ── erőnyíl: (x, y)-ból dy hosszan (a hegy a dy végén; a hossz arányos az erővel) ── */
function arrow(x, y, dy, col, w = 7) {
  const len = Math.abs(dy); if (len < 3) return; const s = Math.sign(dy), hl = Math.min(24, len * .55), hw = Math.max(7, hl * .6);
  c.lineCap = 'butt';
  for (const [cl, lw] of [['rgba(255,250,241,.85)', w + 5], [col, w]]) {
    c.strokeStyle = cl; c.lineWidth = lw; c.beginPath(); c.moveTo(x, y); c.lineTo(x, y + dy - s * hl * .9); c.stroke();
  }
  c.beginPath(); c.moveTo(x, y + dy); c.lineTo(x - hw, y + dy - s * hl); c.lineTo(x + hw, y + dy - s * hl); c.closePath(); c.fillStyle = col; c.fill();
  c.strokeStyle = 'rgba(255,250,241,.85)'; c.lineWidth = 1.5; c.stroke();
}
function arrowH(x, y, dx, col, w = 4) {
  const len = Math.abs(dx); if (len < 3) return; const s = Math.sign(dx), hl = Math.min(16, len * .55), hw = Math.max(5, hl * .55);
  ln(x, y, x + dx - s * hl * .9, y, col, w);
  c.beginPath(); c.moveTo(x + dx, y); c.lineTo(x + dx - s * hl, y - hw); c.lineTo(x + dx - s * hl, y + hw); c.closePath(); c.fillStyle = col; c.fill();
}
/* színes jelmagyarázat-sor: négyzet + név + érték */
function legendRow(k, val, x, y, col, kv, wmax = 560) {
  al(1 * curA); rr(x, y - 22, 26, 26, 5); c.fillStyle = col; c.fill();
  const w = T(k, x + 40, y, { s: 26, w: 600, c: INK, max: wmax * .55 }).w;
  L.tx(val, x + wmax, y, { k: kv, f: F.M, s: 28, w: 700, a: 'right', c: col });
  return w;
}
let curA = 1;
/* képletjel alsó indexszel (kódban rögzített jelölés) */
function sym(base, sub, x, y, o) {
  const s = o.s || 40, ss = Math.max(22, s * .58), oo = Object.assign({ f: F.D, i: 1, w: 500, qa: false }, o);
  const w1 = L.measure(base, oo).w, w2 = sub ? L.measure(sub, Object.assign({}, oo, { s: ss })).w : 0, W = w1 + w2 + (sub ? 2 : 0);
  const x0 = o.a === 'center' ? x - W / 2 : o.a === 'right' ? x - W : x;
  L.tx(base, x0, y, Object.assign({}, oo, { a: 'left' }));
  if (sub) L.tx(sub, x0 + w1 + 2, y + s * .2, Object.assign({}, oo, { a: 'left', s: ss }));
  return W;
}

/* ── konyhai mérleg (g); (cx, y) = a tányér teteje ── */
function kitchenScale(cx, y, w, grams, k, a = 1) {
  if (a <= .01) return;
  al(a);
  rr(cx - w / 2, y + 12, w, 58, 14); c.fillStyle = '#fbf8f1'; c.fill(); c.strokeStyle = 'rgba(28,36,64,.55)'; c.lineWidth = 2.5; c.stroke();
  rr(cx - w * .46, y, w * .92, 13, 6); c.fillStyle = '#d9dde3'; c.fill(); c.stroke();
  const dw = Math.min(w - 30, 176);
  rr(cx - dw / 2, y + 22, dw, 40, 8); c.fillStyle = '#22302a'; c.fill();
  tx(fmt(grams) + ' g', cx + dw / 2 - 12, y + 52, { f: F.M, s: 26, w: 700, a: 'right', c: '#8df0a6', max: dw - 20, k });
}

/* ── kártya ── */
function card(x, y, w, h, a) { al(a); rr(x, y, w, h, 18); c.fillStyle = CARD; c.fill(); c.strokeStyle = LINE; c.lineWidth = 2; c.stroke(); }

/* ════════ 1. Miért könnyebb a kő a vízben? ════════ */
const M1 = { len: 260, Fmax: 30, minor: 1, major: 5, hang: 0 };
function hangBody(Tk, cx, yb, w, h, mk, Fm, o, a, sideR) {
  // a test és a fonal a tartályon belül (a víz alá), az erőmérő utána
  const x = cx - (w + w * .26) / 2, [sx, sy] = topMid(x, yb, w, h), hook = sy - (o.str || 44);
  return { x, sx, sy, hook, yTop: meterTop(hook, Fm, o) };
}
function scene1(st) {
  const p0 = out(clamp(st / .6)), PX = 11, e = edge(), s = e * PX, Ab = e * e, G = wN(num('kő sűrűsége') * e * e * e), t = L.t;
  const TA = mkTank(70, 30, 990, 20, 30, PX, 26), TB = mkTank(930, 30, 990, 20, 30, PX, 26);
  const hB = lerp(-5, e + 3, inOut(clamp((st - 1.6) / 2.6)));
  const res = [];
  for (const [Tk, h] of [[TA, -5], [TB, hB]]) {
    const d = dip(Tk, Ab, e, h), Fm = G - wN(rw() * d.V), cx = (Tk.x0 + Tk.x1) / 2;
    const hb = hangBody(Tk, cx, d.yb, s, s, 'ko', Fm, M1);
    tankDraw(Tk, d.ws, p0, () => { block(hb.x, d.yb, s, s, 'ko', { a: p0 }); ln(hb.sx, hb.hook, hb.sx, hb.sy, INK, 2); });
    meter(hb.sx, hb.yTop, Fm, M1, p0);
    res.push({ Tk, d, Fm, cx: hb.sx, yTop: hb.yTop });
  }
  const [A, B] = res, kk = ['kő sűrűsége', 'kocka éle', 'nehézségi gyorsulás'];
  const ry = (R) => R.yTop + M1.len - 40;
  al(p0 * clamp((st - .8) / .5)); readout(fN(A.Fm), A.cx + 40, ry(A), kk);

function subscripts(root) {
  const re = /([A-Za-zρ])_([0-9A-Za-zÁÉÍÓÖŐÚÜŰáéíóöőúüű]+)/g, walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), nodes = [];
  while (walker.nextNode()) if (re.test(walker.currentNode.nodeValue)) nodes.push(walker.currentNode);
  for (const n of nodes) {
    const frag = document.createDocumentFragment(), s = n.nodeValue; let last = 0; re.lastIndex = 0; let m;
    while ((m = re.exec(s))) { frag.append(s.slice(last, m.index) + m[1]); const sb = document.createElement('sub'); sb.textContent = m[2]; frag.append(sb); last = m.index + m[0].length; }
    frag.append(s.slice(last)); n.replaceWith(frag);
  }
}

      controls(L) {
        L.slider({ label: lab('mélység csúszka'), k: 'mélység csúszka', min: 0, max: 50, step: 1, value: num('kocka mélysége'), format: (v) => fmt(v) + ' cm',
          onInput: (v) => { S4.from = S4.h; S4.to = v; S4.t0 = L.st; S4.user = true; } });
      } },
    { settle: 7, enter() { panelFix(); S5.user = false; },
      controls(L) {
        L.slider({ label: lab('kéz csúszka'), k: 'kéz csúszka', min: 0, max: 18, step: .5, value: 15, format: (v) => fmt(v, 1) + ' cm',
          onInput: (v) => { S5.from = d5(L.st); S5.to = v; S5.t0 = L.st; S5.user = true; } });
      } },
    { settle: 5, enter() {
        panelFix(); const Tk = TK6(); S6.m = num('doboz tömege'); S6.from = wsY(Tk, 0) - 150; S6.to = eq6(S6.m); S6.t0 = .7;
      },
      controls(L) {
        L.slider({ label: lab('doboz csúszka'), k: 'doboz csúszka', min: 100, max: 2000, step: 50, value: num('doboz tömege'), format: (v) => fmt(v) + ' g',
          onInput: (v) => { if (L.st < S6.t0) L.st = S6.t0; retarget6(L.st, v); } });
      } },
    { settle: 4.5, enter() { panelFix(); Object.assign(S7, { cargo: num('rakomány tömege'), sea: false, user: false }); },
      controls(L) {
        L.slider({ label: lab('rakomány csúszka'), k: 'rakomány csúszka', min: 0, max: 3000, step: 100, value: num('rakomány tömege'), format: (v) => fmt(v) + ' t',
          onInput: (v) => { const f = draft7(L.st); S7.cargo = v; retarget7(L.st); S7.from = f; } });
        L.button(lab('duna gomb'), () => { const f = draft7(L.st); S7.sea = false; retarget7(L.st); S7.from = f; }, 'duna gomb');
        L.button(lab('tenger gomb'), () => { const f = draft7(L.st); S7.sea = true; retarget7(L.st); S7.from = f; }, 'tenger gomb');
      } },
    { settle: 5.5, enter: () => panelFix() },
  ],
  init(Lx) { L = Lx; c = L.ctx; },
  draw(Lx) {
    L = Lx; c = L.ctx; GA = 1; background();
    const sp = L.sp;
    if (L.step >= 0) sT[L.step] = L.st;
    for (let i = 0; i < SCENES.length; i++) {
      const w = clamp(1 - Math.abs(sp - i) * 2); if (w <= .005) continue;
      GA = w; curA = 1; SCENES[i](sT[i], L.step === i);
    }
    c.globalAlpha = 1;
  },
});
})();
</script>
</body>
