<script>
(function () {
'use strict';
const U = Lesson.U, { clamp, lerp, smooth, out, inOut, TAU } = U, fmt = U.fmt;
const F = Lesson.FONTS;
/* ── paletta (világos téma, lásd SZERZODES.md) ── */
const INK = '#1c2440', MUT = '#565d72', RED = '#c8401c', TEAL = '#0a6f86', GOOD = '#1d7a45', BAD = '#b3261e',
  CARD = '#fffaf1', LINE = 'rgba(28,36,64,.16)', WIRE = '#2a3350';
let L, c, GA = 1;
const al = (a = 1) => { c.globalAlpha = GA * clamp(a); };
const lab = (k) => L.lab(k), num = (k) => L.num(k);
const T = (k, x, y, o = {}) => L.tx(lab(k), x, y, Object.assign({ k }, o));
const tx = (s, x, y, o) => L.tx(s, x, y, o);
const rr = (x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, w, h, r); };
const ln = (x1, y1, x2, y2, col, w = 2, dash) => { c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.strokeStyle = col; c.lineWidth = w; c.setLineDash(dash || []); c.stroke(); c.setLineDash([]); };
const mod = (a, n) => ((a % n) + n) % n;

/* ════════ fizika: egyetlen forrás minden jelenetnek ════════
   Soros kör, ideális telep és vezetékek: a körben MINDENHOL ugyanaz az I (Kirchhoff I.),
   a feszültségek összege a telep feszültsége (Kirchhoff II.), elemenként U = I · R.
   A pöttyök (elektronok) sebessége: KA px/s amperenként (8. lépés: K8 px/s mA-enként). */
const KA = 200, K8 = 4;                       // K8 / (KA/1000) = 20 → „20× gyorsabbak”
const BATT = { aa: 'ceruzaelem feszültsége', lap: 'laposelem feszültsége', v9: '9 voltos elem feszültsége' };
const Ubat = (t) => num(BATT[t]);
const Rb = () => num('izzó névleges feszültsége') / num('izzó névleges árama');     // izzó (állandó) ellenállása
const Pn = () => num('izzó névleges feszültsége') * num('izzó névleges árama');     // névleges teljesítmény
const glowOf = (I) => I * I * Rb() / Pn();                                          // P / P_névleges (fényesség)
const rG = () => num('grafitbél ellenállása centiméterenként'), LG = () => num('grafitbél hossza');
const KB = ['izzó névleges feszültsége', 'izzó névleges árama'];
const fA = (I, d = 2) => fmt(I, d) + ' A', fV = (u, d = 2) => fmt(u, d) + ' V';
const fR = (r, d = 1) => fmt(r, d) + ' Ω';
/* nagy egész szám (pl. 1,875·10¹⁸) pontosan, ezres tagolással, 4 értékes jeggyel */
function bigInt(x) {
  if (!(x > 0)) return '0';
  const e = Math.floor(Math.log10(x)), k = Math.max(0, e - 3), m = Math.round(x / Math.pow(10, k));
  return (String(m) + '0'.repeat(k)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
}

/* ── állapot-eseménylista: [{t, s}] – az állapot L.st-ből zárt alakban számolható ── */
function evNow(E, st) { let s = E[0].s; for (const e of E) { if (e.t <= st) s = e.s; else break; } return s; }
function evSet(E, st, ch) {
  const cur = Object.assign({}, evNow(E, st), { auto: 0 }, ch);
  while (E.length > 1 && E[E.length - 1].t > st) E.pop();
  E.push({ t: st, s: cur }); return cur;
}
/* a pöttyök fázisa (px): ∫ v dt az eseményeken át. Automatikus (folytonos) szakasznál numerikusan,
   s.auto = az automatikus mozgás vége (utána v állandó). */
function phase(E, st, v) {
  let p = 0;
  for (let i = 0; i < E.length; i++) {
    const a = E[i].t; if (st <= a) break;
    const b = Math.min(st, i + 1 < E.length ? E[i + 1].t : Infinity), s = E[i].s;
    if (s.auto) {
      const e = Math.min(b, s.auto); let t0 = a;
      if (e > a) { const n = Math.max(1, Math.ceil((e - a) / .02)), h = (e - a) / n; for (let j = 0; j < n; j++) p += v(s, a + (j + .5) * h) * h; t0 = e; }
      if (b > t0) p += v(s, t0) * (b - t0);
    } else p += v(s, a) * (b - a);
  }
  return p;
}

/* ── zárt vezetékpálya (polyline); s nő az ELEKTRONOK haladási irányában ── */
function mkPath(pts) {
  const seg = []; let tot = 0;
  for (let i = 0; i < pts.length; i++) { const a = pts[i], b = pts[(i + 1) % pts.length], l = Math.hypot(b[0] - a[0], b[1] - a[1]); seg.push({ a, b, l, s0: tot }); tot += l; }
  return { pts, seg, tot };
}
function pAt(P, s) {
  s = mod(s, P.tot);
  for (const g of P.seg) if (g.l > 0 && s <= g.s0 + g.l + 1e-9) { const t = (s - g.s0) / g.l; return { x: lerp(g.a[0], g.b[0], t), y: lerp(g.a[1], g.b[1], t), dx: (g.b[0] - g.a[0]) / g.l, dy: (g.b[1] - g.a[1]) / g.l }; }
  const g = P.seg[0]; return { x: g.a[0], y: g.a[1], dx: 1, dy: 0 };
}
function sNear(P, x, y) {
  let best = { s: 0, d: 1e9 };
  for (const g of P.seg) {
    if (g.l <= 0) continue;
    const ux = (g.b[0] - g.a[0]) / g.l, uy = (g.b[1] - g.a[1]) / g.l, t = clamp((x - g.a[0]) * ux + (y - g.a[1]) * uy, 0, g.l);
    const d = Math.hypot(g.a[0] + ux * t - x, g.a[1] + uy * t - y); if (d < best.d) best = { s: g.s0 + t, d };
  }
  return best;
}
const inR = (s, R) => R.some(([a, b]) => s >= a && s <= b);
/* vezeték rajza, a gaps tartományok kihagyásával */
function wire(P, gaps = [], col = WIRE, w = 5) {
  const G = gaps.slice().sort((a, b) => a[0] - b[0]), ranges = []; let s = 0;
  for (const [a, b] of G) { if (a > s) ranges.push([s, a]); s = Math.max(s, b); }
  if (s < P.tot) ranges.push([s, P.tot]);
  c.strokeStyle = col; c.lineWidth = w; c.lineJoin = 'round'; c.lineCap = 'round';
  for (const [a, b] of ranges) {
    c.beginPath(); const p0 = pAt(P, a); c.moveTo(p0.x, p0.y);
    for (const g of P.seg) if (g.s0 > a && g.s0 < b) c.lineTo(g.a[0], g.a[1]);
    const p1 = b >= P.tot ? { x: P.seg[0].a[0], y: P.seg[0].a[1] } : pAt(P, b); c.lineTo(p1.x, p1.y); c.stroke();
  }
  c.lineCap = 'butt';
}
/* elektron (−) és atommag (+) */
function electron(x, y, r = 8) {
  c.beginPath(); c.arc(x, y, r, 0, TAU); c.fillStyle = TEAL; c.fill(); c.strokeStyle = '#063f4d'; c.lineWidth = 1.5; c.stroke();
  ln(x - r * .5, y, x + r * .5, y, '#fffaf1', 2.2);
}
function nucleus(x, y, r = 13) {
  c.beginPath(); c.arc(x, y, r, 0, TAU); c.fillStyle = RED; c.fill(); c.strokeStyle = '#7a2410'; c.lineWidth = 2; c.stroke();
  ln(x - r * .5, y, x + r * .5, y, '#fffaf1', 2.6); ln(x, y - r * .5, x, y + r * .5, '#fffaf1', 2.6);
}
/* elektronpöttyök a pályán: egyenletes köz, fázis = megtett út */
function edots(P, ph, hide = [], r = 8) {
  const N = Math.max(1, Math.round(P.tot / 38)), sp = P.tot / N;
  for (let i = 0; i < N; i++) { const s = mod(i * sp + ph, P.tot); if (inR(s, hide)) continue; const p = pAt(P, s); electron(p.x, p.y, r); }
}
/* nyílhegy (ang irányba) */
function chev(x, y, ang, col, sz = 12) {
  c.save(); c.translate(x, y); c.rotate(ang);
  for (const o of [-9, 9]) { c.beginPath(); c.moveTo(o + sz, 0); c.lineTo(o - sz * .6, -sz * .8); c.lineTo(o - sz * .15, 0); c.lineTo(o - sz * .6, sz * .8); c.closePath(); c.fillStyle = col; c.fill(); }
  c.restore();
}
/* kívül piros: a megállapodás szerinti áramirány (+ → −); belül kékeszöld: az elektronok iránya */
function flowArrows(P, list, a, on = 1) {
  for (const s of list) {
    const p = pAt(P, s), ang = Math.atan2(p.dy, p.dx), nx = -p.dy, ny = p.dx;
    al(a * (.25 + .75 * on)); chev(p.x + nx * 30, p.y + ny * 30, ang + Math.PI, RED); chev(p.x - nx * 30, p.y - ny * 30, ang, TEAL);
  }
}
function legendFlow(x, y, a) {
  al(a); electron(x + 10, y - 8, 9); chev(x + 46, y - 8, 0, TEAL); T('elektronok mozgása', x + 76, y, { s: 24, w: 600, c: TEAL });
  chev(x + 470, y - 8, Math.PI, RED); T('áram iránya', x + 506, y, { s: 24, w: 600, c: RED, max: 800 - 506 + x });
  T('felgyorsítva', x, y + 44, { s: 22, w: 500, c: MUT });
}

/* ── alkatrészek ── */
const BTS = { aa: { w: 84, h: 170, body: '#27406b', band: '#c9a44a' }, lap: { w: 130, h: 200, body: '#b5381a', band: '#f0c75a' }, v9: { w: 104, h: 186, body: '#1d5f45', band: '#d8dde4' } };
/* telep: (x, y) közép, a + pólus „felül” (rot: elforgatás), a felirat mindig vízszintes */
function battery(x, y, type, a, o = {}) {
  const B = BTS[type], w = o.w || B.w, h = o.h || B.h, rot = o.rot || 0;
  al(a); c.save(); c.translate(x, y); c.rotate(rot);
  rr(-w / 2 + 4, -h / 2 + 6, w, h, 12); c.fillStyle = 'rgba(28,36,64,.18)'; c.fill();
  rr(-w / 2, -h / 2, w, h, 12); c.fillStyle = B.body; c.fill();
  c.save(); rr(-w / 2, -h / 2, w, h, 12); c.clip(); c.fillStyle = B.band; c.fillRect(-w / 2, -h / 2, w, h * .2);
  const g = c.createLinearGradient(-w / 2, 0, w / 2, 0); g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(.3, 'rgba(255,255,255,.28)'); g.addColorStop(.5, 'rgba(255,255,255,0)');
  c.fillStyle = g; c.fillRect(-w / 2, -h / 2, w, h); c.restore();
  rr(-w / 2, -h / 2, w, h, 12); c.strokeStyle = '#141a2e'; c.lineWidth = 3; c.stroke();
  rr(-14, -h / 2 - 11, 28, 12, 4); c.fillStyle = '#9aa3ae'; c.fill(); c.strokeStyle = '#141a2e'; c.lineWidth = 2.5; c.stroke();
  c.restore();
  const vx = x, vy = y + (rot ? 0 : h * .1);
  if (!o.nolabel) L.tx(fmt(Ubat(type), 1) + ' V', vx, vy + 9, { k: BATT[type], f: F.M, s: 26, w: 700, a: 'center', c: '#fffaf1', max: (rot ? h : w) - 12 });
  // pólusjelek (képletjel, kódban rögzített)
  const ux = Math.sin(rot), uy = -Math.cos(rot), px = -uy, py = ux, d = h / 2 - 22, side = w / 2 + 20;
  if (!o.nosign) {
    tx('+', x + ux * d + px * side, y + uy * d + py * side + 11, { f: F.M, s: 34, w: 700, a: 'center', c: RED, qa: false });
    tx('−', x - ux * d + px * side, y - uy * d + py * side + 11, { f: F.M, s: 34, w: 700, a: 'center', c: TEAL, qa: false });
  }
}
/* izzó: a vezeték függőlegesen fut át rajta; b = P / P_névleges */
function bulb(x, y, b, a, R = 46) {
  const v = clamp(Math.pow(Math.max(0, b), .6), 0, 1.7);
  al(a);
  if (v > .01) {
    const g = c.createRadialGradient(x, y, R * .3, x, y, R + 140 * Math.min(v, 1.4));
    g.addColorStop(0, `rgba(255,210,80,${.8 * Math.min(1, v)})`); g.addColorStop(.45, `rgba(255,200,70,${.35 * Math.min(1, v)})`); g.addColorStop(1, 'rgba(255,200,70,0)');
    c.fillStyle = g; c.beginPath(); c.arc(x, y, R + 140 * Math.min(v, 1.4), 0, TAU); c.fill();
  }
  rr(x - 15, y + R - 8, 30, 18, 4); c.fillStyle = '#9aa3ae'; c.fill(); c.strokeStyle = '#141a2e'; c.lineWidth = 2.5; c.stroke();
  rr(x - 15, y - R - 10, 30, 18, 4); c.fillStyle = '#9aa3ae'; c.fill(); c.stroke();
  c.beginPath(); c.arc(x, y, R, 0, TAU); c.fillStyle = U.mix('#f4efe4', '#ffe27a', clamp(v)); c.fill();
  c.strokeStyle = INK; c.lineWidth = 3; c.stroke();
  const fc = U.mix('#3a3f4a', '#ff8a14', clamp(v * 1.4));
  ln(x - 14, y + R - 8, x - 14, y + 4, '#6b7380', 2.5); ln(x + 14, y + R - 8, x + 14, y + 4, '#6b7380', 2.5);
  ln(x - 14, y - R + 8, x - 14, y - 6, '#6b7380', 2.5);
  c.beginPath(); for (let i = 0; i <= 8; i++) c.lineTo(x - 14 + i * 3.5, y + 4 + (i % 2 ? -8 : 0)); c.strokeStyle = fc; c.lineWidth = 3; c.stroke();
  ln(x + 14, y + 4, x + 14, y - 6, '#6b7380', 2.5);
  c.beginPath(); c.moveTo(x + 14, y - 6); c.lineTo(x + 14, y - R + 8); c.strokeStyle = '#6b7380'; c.lineWidth = 2.5; c.stroke();
  c.beginPath(); c.ellipse(x - R * .42, y - R * .42, R * .16, R * .26, -.7, 0, TAU); c.fillStyle = 'rgba(255,255,255,.55)'; c.fill();
}
/* mérőműszer körben; sym: 'A' / 'V' (képletjel) */
function meterC(x, y, sym, a, col = INK) {
  al(a); c.beginPath(); c.arc(x, y, 30, 0, TAU); c.fillStyle = CARD; c.fill(); c.strokeStyle = col; c.lineWidth = 3.5; c.stroke();
  tx(sym, x, y + 1, { f: F.B, s: 32, w: 700, a: 'center', b: 'middle', c: col, qa: false });
}
function readout(s, x, y, k, a = 'left', sz = 26) { return L.pill(s, x, y, { k, a, s: sz, f: F.M, w: 700, bg: '#22302a', c: '#8df0a6', pad: 10, r: 8 }); }
/* feszültségmérő vezetékei: pts = [[x,y] a pályán, …], via = töréspont-lista */
function vlead(path, a) {
  al(a); c.beginPath(); path.forEach((p, i) => i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1]));
  c.strokeStyle = U.rgba('#565d72', .9); c.lineWidth = 2.5; c.lineJoin = 'round'; c.stroke();
  const e = path[0]; c.beginPath(); c.arc(e[0], e[1], 6, 0, TAU); c.fillStyle = INK; c.fill();
}
function switchG(x, y, closed, a) {
  al(a);
  const ang = closed ? 0 : -.5;
  c.lineCap = 'round'; c.beginPath(); c.moveTo(x - 60, y); c.lineTo(x - 60 + Math.cos(ang) * 124, y + Math.sin(ang) * 124);
  c.strokeStyle = INK; c.lineWidth = 7; c.stroke(); c.lineCap = 'butt';
  for (const xx of [x - 60, x + 60]) { c.beginPath(); c.arc(xx, y, 9, 0, TAU); c.fillStyle = CARD; c.fill(); c.strokeStyle = INK; c.lineWidth = 3; c.stroke(); }
}
function graphite(x0, x1, y, a) {
  al(a); rr(x0 - 4, y - 9, x1 - x0 + 8, 18, 8); c.fillStyle = '#3b3f47'; c.fill(); c.strokeStyle = '#141a2e'; c.lineWidth = 2; c.stroke();
  ln(x0 + 4, y - 4, x1 - 4, y - 4, 'rgba(200,205,215,.55)', 2);
}
function clipG(x, y, a, hot) {
  al(a); rr(x - 14, y - 4, 28, 34, 6); c.fillStyle = hot ? '#d0442a' : BAD; c.fill(); c.strokeStyle = '#5a120c'; c.lineWidth = 2.5; c.stroke();
  for (let i = -1; i <= 1; i++) ln(x + i * 7, y - 4, x + i * 7, y + 4, '#5a120c', 2);
}
function resistor(x, y, a) {
  al(a); rr(x - 60, y - 20, 120, 40, 10); c.fillStyle = '#e9d7ae'; c.fill(); c.strokeStyle = '#6b4a1c'; c.lineWidth = 2.5; c.stroke();
  [['#e07b1a', -34], ['#e07b1a', -16], ['#7a4a1c', 2], ['#c9a44a', 34]].forEach(([col, dx]) => { c.fillStyle = col; c.fillRect(x + dx - 5, y - 19, 10, 38); });
}
function potG(x, y, a) {
  al(a); rr(x - 66, y - 22, 132, 44, 10); c.fillStyle = '#d9dee6'; c.fill(); c.strokeStyle = INK; c.lineWidth = 2.5; c.stroke();
