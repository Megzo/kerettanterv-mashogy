<script>
(function () {

  const w1 = L.measure(base, bo).w, w2 = sub ? L.measure(sub, so).w + 3 : 0, vs = ' = ' + val, w3 = L.measure(vs, vo).w, W = w1 + w2 + w3;

/* a részek kerekített összege = a kerekített összeg (legnagyobb maradék) */
function roundParts(vals, total, d = 1) {

  for (let v = Math.ceil(g.y0 / g.ys - 1e-9) * g.ys; v <= g.y1 + 1e-9; v += g.ys) {

/* ════════ kocsik és ütközés (2–5. lépés) ════════
   Fizika méterben és másodpercben; képernyőn XC + x·PXM. Az érintkezés kezdete: τ = TC, helye: x = 0. */
const RY = 360, XC = 560, PXM = 130, G0 = 0.3, PSC = 25, TC = 0.7, PRE = 0.03, SLOW = 8, S0 = 0.5, HOLD = 1.0;
const cwPx = (m) => 100 + 16 * m;
function mkCol(m1, v1, m2, v2, sticky) {
  const Tc = dataNum('ütközés ideje', .1), M = m1 + m2, mu = m1 * m2 / M, u0 = v1 - v2, vcm = (m1 * v1 + m2 * v2) / M, w = Math.PI / Tc;
  const R = { m1, v1, m2, v2, sticky, Tc, M, mu, u0, vcm };

  const p0 = out(clamp(st / .6)), u = S8.u, ff = S8.f / 100;
  const s = Math.max(0, st - S8.tR), bt = clamp((s - S08) / TB8), fb = ff * bt, burn = bt > 0 && bt < 1;
  const dv = (f) => u * Math.log(1 / (1 - f)), v = dv(fb);
  // a rakéta által megtett „út” (a csillagok csúszásához): ∫ v dt, zárt alakban
  const md = ff / TB8, mt = 1 - fb, X = (s <= S08) ? 0 : u * ((mt * Math.log(mt) - mt + 1) / md) + Math.max(0, s - S08 - TB8) * dv(ff);
  card(40, 60, 1280, 488, p0, '#f4eee3');
  al(p0); c.save(); rr(40, 60, 1280, 488, 18); c.clip();
  for (const sr of STARS) {
    const x = 40 + (((sr.x - X * 70 * sr.z) % 1280) + 1280) % 1280, y = sr.y;
    al(p0 * sr.a); c.fillStyle = INK; c.beginPath(); c.arc(x, y, sr.r, 0, TAU); c.fill();
  }
  // kiáramló gáz (a rakétához képest u-val arányos sebességgel hátra)
  const xn = 560, yr = 300, k = 1;
  const tb = (s - S08);
  for (const e of EXH) {
    const te = e.u * TB8 * 1.0; if (te > tb || te > TB8) continue;
    const age = tb - te; if (age > .7) continue;
    const d = age * u * 210, gx = xn - 8 - d, gy = yr + Math.sin(e.an) * d * .35 + e.j * 8;
    al(p0 * (1 - age / .7) * .8); c.beginPath(); c.arc(gx, gy, 5 + age * 6, 0, TAU); c.fillStyle = U.mix('#e8a33a', '#8a8f99', clamp(age * 2)); c.fill();
  }
  c.restore();
  al(p0); const rk = rocket(xn, yr, k, 1 - bt, burn ? 1 : 0, L.t);
  al(p0); L.pill(lab('világűr'), 70, 100, { k: 'világűr', s: 24, w: 700, bg: INK, c: '#ffffff', pad: 12 });
  if (burn) {
    const q = p0 * clamp((s - S08) / .2) * clamp((S08 + TB8 - s) / .2), l = 150;
    al(q); harrow(rk.mid, yr, l, FOR, 10, 26, '#ffffff'); harrow(xn - 10, yr, -l, FOR, 10, 26, '#ffffff');
    T('erő a rakétára', rk.mid + 40, yr - 78, { s: 24, w: 700, a: 'center', c: FOR });
    T('erő a gázra', xn - 90, yr + 92, { s: 24, w: 700, a: 'center', c: FOR });
  }
  // kijelzők
  const kv = ['kiáramlás csúszka', 'üzemanyag csúszka'];
  al(p0); T('rakéta sebessége', 70, 488, { s: 24, w: 600, c: MUT });
  tx(fmt(v, 1) + ' km/s', 70, 528, { f: F.M, s: 34, w: 800, c: RED, k: kv });
  T('üzemanyag', 1290, 488, { s: 24, w: 600, a: 'right', c: MUT });
  tx(fmt(100 * (1 - bt)) + ' %', 1290, 528, { f: F.M, s: 34, w: 800, a: 'right', c: '#9a5b00', k: kv });
  // grafikon: sebességváltozás – elégetett üzemanyag
  card(40, 572, 1280, 468, p0);
  const umax = num('legnagyobb kiáramlási sebesség'), ym = niceCeil(umax * Math.log(1 / (1 - .95)), 6);
  const g = { x: 150, y: 668, w: 1110, h: 270, x0: 0, x1: 100, y0: 0, y1: ym, xs: 10, ys: niceStep(ym, 6) };
  const { X: GX, Y: GY } = plotAxes(g, p0, 'elégetett tengely', 'sebességváltozás tengely');
  const v1 = num('első kozmikus sebesség');
  al(p0); ln(g.x, GY(v1), g.x + g.w, GY(v1), GOOD, 3, [12, 8]);
  T('körpálya', g.x + 16, GY(v1) - 12, { s: 22, w: 700, c: GOOD });
  const pts = (a, b) => { const r = []; for (let i = 0; i <= 120; i++) { const f = a + (b - a) * i / 120; r.push([GX(f * 100), GY(dv(f))]); } return r; };
  al(p0 * .5); poly(pts(ff, .95), RED, 3, [8, 8]);
  al(p0); poly(pts(0, fb), RED, 6);
  const end = [GX(ff * 100), GY(dv(ff))];
  al(p0 * .8); c.beginPath(); c.arc(end[0], end[1], 8, 0, TAU); c.strokeStyle = RED; c.lineWidth = 3; c.stroke();
  al(p0); c.beginPath(); c.arc(GX(fb * 100), GY(v), 9, 0, TAU); c.fillStyle = RED; c.fill();
  al(p0); tx('Δv = ' + fmt(dv(ff), 1) + ' km/s', 1290, 642, { f: F.M, s: 28, w: 800, a: 'right', c: RED, k: ['kiáramlás csúszka', 'üzemanyag csúszka'] });
}

/* ════════ 9. Összefoglalás ════════ */
function scene9(st) {
  const p0 = out(clamp(st / .6)), t = L.t;
  const cards = [[40, 60], [700, 60], [40, 560], [700, 560]], W = 620, H = 480;
  const ks = [['össz lendület cím', 'össz lendület'], ['össz megmaradás cím', 'össz megmaradás'], ['össz erőpár cím', 'össz erőpár'], ['össz rakéta cím', 'össz rakéta']];
  cards.forEach(([x, y], j) => {
    const q = p0 * out(clamp((st - .2 - j * .35) / .5));
    card(x, y, W, H, q);
    al(q); T(ks[j][0], x + 30, y + 62, { f: F.D, i: 1, s: 36, w: 500, c: INK, max: W - 60 });
    T(ks[j][1], x + 30, y + 104, { s: 24, w: 500, c: MUT, max: W - 60 });
    const cx = x + W / 2, cy = y + 300;
    if (j === 0) {
      formula([['p', ''], ['=', ''], ['m', ''], ['·', ''], ['v', '']], x + 30, y + 180, { s: 48, c: INK, gap: 12 });
      tennis(x + 70, cy + 10, 16, t * 6); bowling(x + 70, cy + 110, 40, t);
      harrow(x + 130, cy + 10, 2.9 * 7, C1, 10, 22); harrow(x + 130, cy + 110, 56 * 7, C2, 10, 26);
    } else if (j === 1) {
      const rows = [['előtte', cy - 40, [6, 0]], ['utána', cy + 110, [0, 6]]];
      for (const [k, yy, ps] of rows) {
        T(k, x + 30, yy - 50, { s: 22, w: 600, c: MUT });
        for (let i = 0; i < 2; i++) {
          const bx = x + 170 + i * 220, col = i ? C2 : C1, dk = U.mix(col, '#000000', .35);
          rr(bx, yy - 40, 120, 44, 8); c.fillStyle = U.mix(col, '#ffffff', .8); c.fill(); c.strokeStyle = dk; c.lineWidth = 2.5; c.stroke();
          for (const f of [.25, .75]) { c.beginPath(); c.arc(bx + 120 * f, yy + 8, 9, 0, TAU); c.fillStyle = '#2a2f38'; c.fill(); }
          if (ps[i]) harrow(bx + 60, yy - 56, ps[i] * 20, col, 7, 18);
        }
        harrow(x + 170, yy + 38, 6 * 20, INK, 10, 22);
      }
    } else if (j === 2) {
      al(q);
      rr(cx - 170, cy - 40, 160, 110, 12); c.fillStyle = U.mix(C1, '#ffffff', .8); c.fill(); c.strokeStyle = U.mix(C1, '#000000', .35); c.lineWidth = 3; c.stroke();
      rr(cx + 10, cy - 10, 90, 80, 12); c.fillStyle = U.mix(C2, '#ffffff', .8); c.fill(); c.strokeStyle = U.mix(C2, '#000000', .35); c.lineWidth = 3; c.stroke();
      ln(cx, cy - 70, cx, cy + 110, 'rgba(28,36,64,.35)', 2, [5, 5]);
      al(q);
      harrow(cx, cy - 80, 140, FOR, 12, 28, '#ffffff'); harrow(cx, cy - 80, -140, FOR, 12, 28, '#ffffff');
    } else {
      const xr = x + 220, yr = cy;
      for (let i = 0; i < 14; i++) { const ph = (t * 1.6 + i / 14) % 1, d = ph * 170; al(q * (1 - ph) * .8); c.beginPath(); c.arc(xr - 8 - d, yr + Math.sin(i * 2.3) * d * .25, 4 + ph * 5, 0, TAU); c.fillStyle = U.mix('#e8a33a', '#8a8f99', ph); c.fill(); }
      al(q); const rk = rocket(xr, yr, .8, .5, 1, t);
      harrow(rk.mid, yr, 110, FOR, 9, 22, '#ffffff'); harrow(xr - 10, yr, -110, FOR, 9, 22, '#ffffff');
    }
  });
}

/* ════════════════════════════════════════════════════════════════ */
const sT = new Array(9).fill(0);
const SCENES = [scene1, scene2, scene3, scene4, scene5, scene6, scene7, scene8, scene9];
L = Lesson.create({
  content: CONTENT,
  home: false,
  steps: [
    { settle: 3, enter() { S1.v = num('teniszlabda sebessége'); },
      controls(L) {
        L.slider({ label: lab('teniszlabda csúszka'), k: 'teniszlabda csúszka', min: -1000, max: 1000, step: 10, value: num('teniszlabda sebessége'), format: (v) => fmt(v) + ' m/s', onInput: (v) => { S1.v = v; } });
      } },
    { settle: setC(dataNum('1. kocsi tömege', 2), dataNum('2. kocsi tömege', 2), false), enter() { resetCarts(S2); } },
    { settle: setC(dataNum('1. kocsi tömege', 2), dataNum('2. kocsi tömege', 2), false), enter() { resetCarts(S3); S3.vk = ['2. kocsi tömege csúszka', '2. kocsi sebessége csúszka']; S3.k2 = '2. kocsi tömege csúszka'; },

        L.slider({ label: lab('2. kocsi sebessége csúszka'), k: '2. kocsi sebessége csúszka', min: -3, max: 2, step: .5, value: 0, format: (v) => fmt(v, 1) + ' m/s', onInput: (v) => { S3.v2 = v; S3.tR = L.st; } });
      } },
    { settle: setC(dataNum('nehéz kocsi tömege', 5), dataNum('2. kocsi tömege', 2), false), enter() { resetCarts(S4); S4.m1 = num('nehéz kocsi tömege'); S4.k1 = '1. kocsi tömege csúszka'; },
      controls(L) {
        L.slider({ label: lab('1. kocsi tömege csúszka'), k: '1. kocsi tömege csúszka', min: 1, max: 6, step: .5, value: num('nehéz kocsi tömege'), format: kgS, onInput: (v) => { S4.m1 = v; S4.tR = L.st; } });
      } },
    { settle: setC(dataNum('1. kocsi tömege', 2), dataNum('2. kocsi tömege', 2), true), enter() { resetCarts(S5); S5.sticky = true; S5.k2 = '2. kocsi tömege csúszka'; },
      controls(L) {
        const bs = [L.button(lab('rugalmas gomb'), () => { S5.sticky = false; S5.tR = L.st; bs[0].classList.add('on'); bs[1].classList.remove('on'); }, 'rugalmas gomb'),
          L.button(lab('összetapad gomb'), () => { S5.sticky = true; S5.tR = L.st; bs[1].classList.add('on'); bs[0].classList.remove('on'); }, 'összetapad gomb')];
        bs[1].classList.add('on');
        L.slider({ label: lab('2. kocsi tömege csúszka'), k: '2. kocsi tömege csúszka', min: 1, max: 5, step: .5, value: num('2. kocsi tömege'), format: kgS, onInput: (v) => { S5.m2 = v; S5.tR = L.st; } });
      } },
    { settle: 3.6, enter() { S6.m2 = num('jobb korcsolyázó tömege'); S6.tR = 0; },
      controls(L) {
        L.slider({ label: lab('jobb tömeg csúszka'), k: 'jobb tömeg csúszka', min: 20, max: 100, step: 5, value: num('jobb korcsolyázó tömege'), format: kgS, onInput: (v) => { S6.m2 = v; S6.tR = L.st; } });
      } },
    { settle: 1.8, enter() { S7.vac = false; S7.tSw = -99; S7.tR = 0; S7.had = false; },
      controls(L) {
        const b = L.button(lab('szivattyú gomb'), () => {
          S7.vac = !S7.vac; S7.had = true; S7.tSw = L.st; S7.tR = L.st + (S7.vac ? 1.6 : 1.0);
          b.textContent = lab(S7.vac ? 'levegő vissza gomb' : 'szivattyú gomb'); b.dataset.key = S7.vac ? 'levegő vissza gomb' : 'szivattyú gomb';
          b.classList.toggle('on', S7.vac);
        }, 'szivattyú gomb');
      } },
    { settle: 3.4, enter() { S8.u = num('kiáramlási sebesség'); S8.f = num('üzemanyag aránya'); S8.tR = 0; },
      controls(L) {
        L.slider({ label: lab('kiáramlás csúszka'), k: 'kiáramlás csúszka', min: num('legkisebb kiáramlási sebesség'), max: num('legnagyobb kiáramlási sebesség'), step: .1, value: num('kiáramlási sebesség'), format: (v) => fmt(v, 1) + ' km/s', onInput: (v) => { S8.u = v; S8.tR = L.st; } });
        L.slider({ label: lab('üzemanyag csúszka'), k: 'üzemanyag csúszka', min: 50, max: 95, step: 1, value: num('üzemanyag aránya'), format: (v) => fmt(v) + ' %', onInput: (v) => { S8.f = v; S8.tR = L.st; } });
      } },
    { settle: 3.5 },
  ],
  init(Lx) {
    L = Lx; c = L.ctx;
    const r = U.rng(7);
    AIR = []; for (let i = 0; i < 110; i++) AIR.push({ x: 100 + r() * 1160, y: 150 + r() * 350, f: 1.5 + r() * 2.5, ph: r() * TAU, d: r() });

    STARS = []; for (let i = 0; i < 110; i++) STARS.push({ x: r() * 1280, y: 80 + r() * 450, r: .8 + r() * 1.8, a: .25 + r() * .45, z: .3 + r() * .9 });
    EXH = []; for (let i = 0; i < 160; i++) EXH.push({ u: (i + r()) / 160, an: (r() - .5) * .5, j: r() - .5 });
