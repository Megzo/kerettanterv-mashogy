<script>
(function () {
'use strict';
const U = Lesson.U, { clamp, lerp, smooth, out, inOut, TAU } = U, fmt = U.fmt;
const F = Lesson.FONTS;
/* ── paletta (világos téma, lásd SZERZODES.md) ── */
const INK = '#1c2440', MUT = '#565d72', RED = '#c8401c', TEAL = '#0a6f86', GOOD = '#1d7a45', BAD = '#b3261e',
  CARD = '#fffaf1', LINE = 'rgba(28,36,64,.16)', WATER_D = '#1b5a94', GAS = '#6b3fb0', BOND = '#1d6a93';
/* halmazállapotok színei – minden jelenetben ugyanaz */
const PH = [{ k: 'szilárd', c: TEAL }, { k: 'olvad', c: RED }, { k: 'folyékony', c: WATER_D }, { k: 'forr', c: RED }, { k: 'légnemű', c: GAS }];
let L, c, GA = 1;
const al = (a = 1) => { c.globalAlpha = GA * clamp(a); };
const lab = (k) => L.lab(k), num = (k) => L.num(k);
const T = (k, x, y, o = {}) => L.tx(lab(k), x, y, Object.assign({ k }, o));
const tx = (s, x, y, o) => L.tx(s, x, y, o);
const rr = (x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, w, h, r); };
const ln = (x1, y1, x2, y2, col, w = 2, dash) => { c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.strokeStyle = col; c.lineWidth = w; c.setLineDash(dash || []); c.stroke(); c.setLineDash([]); };
const frac = (v) => v - Math.floor(v);
const tri = (v) => 4 * Math.abs(v - Math.floor(v + .5)) - 1;          // háromszögjel [−1, 1] – visszapattanó mozgás zárt képlettel
const DEG = (v, d = 0) => fmt(v, d) + ' °C';
const KJ = (v) => fmt(v) + ' kJ';
const MIN = (s) => fmt(s / 60, 1) + ' perc';
const CLK = (s) => s < 59.5 ? fmt(s) + ' s' : MIN(s);
const KM = ['jég fajhője', 'víz fajhője', 'olvadáshő', 'forráshő', 'kezdő hőmérséklet', 'víz tömege'];

/* ── háttér: meleg papír, halvány négyzetrács ── */
function background() {
  c.globalAlpha = 1;
  const g = c.createRadialGradient(680, 480, 100, 680, 540, 1300); g.addColorStop(0, '#f7f1e6'); g.addColorStop(1, '#efe6d6');
  c.fillStyle = g; c.fillRect(0, 0, 1920, 1080);
  c.strokeStyle = 'rgba(28,36,64,.045)'; c.lineWidth = 1; c.beginPath();
  for (let x = 0; x <= 1920; x += 40) { c.moveTo(x + .5, 0); c.lineTo(x + .5, 1080); }
  for (let y = 0; y <= 1080; y += 40) { c.moveTo(0, y + .5); c.lineTo(1920, y + .5); }
  c.stroke();
}
function card(x, y, w, h, a, bg, bd) { al(a); rr(x, y, w, h, 18); c.fillStyle = bg || CARD; c.fill(); c.strokeStyle = bd || LINE; c.lineWidth = 2; c.stroke(); }
function arrowTo(x1, y1, x2, y2, col, w = 4, hs = 16) {
  const an = Math.atan2(y2 - y1, x2 - x1), bx = x2 - Math.cos(an) * hs * .8, by = y2 - Math.sin(an) * hs * .8;
  ln(x1, y1, bx, by, col, w);
  c.beginPath(); c.moveTo(x2, y2); c.lineTo(x2 - hs * Math.cos(an - .45), y2 - hs * Math.sin(an - .45)); c.lineTo(x2 - hs * Math.cos(an + .45), y2 - hs * Math.sin(an + .45)); c.closePath();
  c.fillStyle = col; c.fill();
}
/* áthúzott tévhit-doboz + helyes válasz (a 02-energia mintájára) */
function myth(kq, ka, x, y, st, t0, a, o = {}) {
  const s = o.s || 26;
  al(a * clamp((st - t0) / .5)); const b = L.pill(lab(kq), x, y, { k: kq, a: 'center', s, f: F.D, i: 1, w: 500, bg: '#ffffff', bd: BAD, c: BAD, pad: 14 });
  const q = clamp((st - t0 - 1.2) / .4);
  if (q > 0) { al(a); ln(b.x + 10, b.y + b.h / 2, lerp(b.x + 10, b.x + b.w - 10, q), b.y + b.h / 2, BAD, 4); }
  al(a * clamp((st - t0 - 1.6) / .5)); L.pill(lab(ka), x, y + (o.dy || 58), { k: ka, a: 'center', s: s - 2, w: 700, bg: GOOD, c: '#ffffff', pad: 12 });
}

/* ════════ A melegítési görbe: a .md adataiból, minden jelenet ugyanezt használja ════════
   E: felvett energia (kJ) a töréspontokban, T: hőmérséklet (°C). Szakaszok:
   0 jég melegszik · 1 olvadás · 2 víz melegszik · 3 forrás · 4 gőz melegszik (csak zárt edényben) */
function curveOf(m, Tb, Tend) {
  const T0 = num('kezdő hőmérséklet'), Tm = num('olvadáspont');
  const E1 = m * num('jég fajhője') * (Tm - T0), E2 = E1 + m * num('olvadáshő'), E3 = E2 + m * num('víz fajhője') * (Tb - Tm), E4 = E3 + m * num('forráshő');
  const E5 = E4 + m * num('gőz fajhője') * Math.max(0, Tend - Tb);
  return { m, Tb, E: [0, E1, E2, E3, E4, E5], T: [T0, Tm, Tm, Tb, Tb, Math.max(Tb, Tend)] };
}
function stateAt(C, E) {
  const e = C.E, TT = C.T;
  if (E <= e[1]) return { seg: 0, T: lerp(TT[0], TT[1], E / e[1]), f: 0, g: 0, E };
  if (E < e[2] - 1e-6) return { seg: 1, T: TT[1], f: (E - e[1]) / (e[2] - e[1]), g: 0, E };
  if (E <= e[3]) return { seg: 2, T: lerp(TT[2], TT[3], (E - e[2]) / (e[3] - e[2])), f: 1, g: 0, E };
  if (E <= e[4]) return { seg: 3, T: TT[3], f: 1, g: (E - e[3]) / (e[4] - e[3]), E };
  return { seg: 4, T: lerp(TT[4], TT[5], clamp((E - e[4]) / Math.max(1e-9, e[5] - e[4]))), f: 1, g: 1, E };
}
/* telített vízgőz nyomása (Antoine-egyenlet, víz 1–100 °C, Hgmm) – csak arányt számolunk vele */
const psat = (t) => Math.pow(10, 8.07131 - 1730.63 / (233.426 + t));

/* ── grafikon-tengelyek ── G = {x0, x1, yT, yB, lo, hi, xMax}; o = {step, xk, d} */
const gX = (G, v) => G.x0 + v / G.xMax * (G.x1 - G.x0);
const gY = (G, t) => G.yB - (t - G.lo) / (G.hi - G.lo) * (G.yB - G.yT);
function axes(G, a, o) {
  al(a);
  for (let t = Math.ceil(G.lo / 20) * 20; t <= G.hi + 1e-9; t += 20) {
    const key = t === 0 || t === 100, y = gY(G, t);
    ln(G.x0, y, G.x1, y, key ? 'rgba(28,36,64,.30)' : 'rgba(28,36,64,.10)', key ? 2 : 1.5, key ? [8, 6] : null);
    tx(fmt(t), G.x0 - 12, y + 8, { f: F.M, s: 22, a: 'right', c: key ? INK : MUT, w: key ? 700 : 500 });
  }
  ln(G.x0, G.yB, G.x1 + 10, G.yB, INK, 2.5); ln(G.x0, G.yB, G.x0, G.yT - 14, INK, 2.5);
  for (let v = 0; v <= G.xMax + 1e-9; v += o.step) {
    const x = gX(G, v); ln(x, G.yB, x, G.yB + 8, INK, 2);
    tx(fmt(v), x, G.yB + 32, { f: F.M, s: 22, a: 'center', c: MUT });
  }
  T(o.xk, G.x1, G.yB - 14, { s: 22, w: 700, a: 'right', c: INK });
  T('hőmérséklet tengely', G.x0 - 64, G.yT - 26, { s: 22, w: 700, c: INK });
}
/* a görbe kirajzolása a [0, xEnd] tartományban; pts: [[x, T], …] töréspontok; plató = cinóber */
function drawCurve(G, pts, xEnd, a, o = {}) {
  c.save(); c.beginPath(); c.rect(G.x0, G.yT - 30, G.x1 - G.x0 + 2, G.yB - G.yT + 34); c.clip();
  for (let i = 0; i + 1 < pts.length; i++) {
    const [xa, ta] = pts[i], [xb, tb] = pts[i + 1]; if (xa >= xEnd) break;
    const u = clamp((xEnd - xa) / Math.max(1e-9, xb - xa)), xe = lerp(xa, xb, u), te = lerp(ta, tb, u);
    const flat = Math.abs(tb - ta) < 1e-6, dashed = o.steamDash && i === 4;
    al(a); c.beginPath(); c.moveTo(gX(G, xa), gY(G, ta)); c.lineTo(gX(G, xe), gY(G, te));
    c.strokeStyle = o.col || (flat ? RED : INK); c.lineWidth = o.w || (flat ? 6 : 4.5); c.lineCap = 'round'; c.setLineDash(o.dash || (dashed ? [10, 9] : [])); c.stroke(); c.setLineDash([]); c.lineCap = 'butt';
  }
  c.restore();
}

/* ════════ Vízmolekula (az 01-suruseg 7. lépésével azonos rajz) ════════ */
function h2o(x, y, ang, a, k = 1) {
  al(a);
  for (const da of [-.92, .92]) { const hx = x + Math.cos(ang + da) * 11 * k, hy = y + Math.sin(ang + da) * 11 * k; c.beginPath(); c.arc(hx, hy, 4.8 * k, 0, TAU); c.fillStyle = '#ffffff'; c.fill(); c.strokeStyle = '#4a5566'; c.lineWidth = 1.5; c.stroke(); }
  c.beginPath(); c.arc(x, y, 8.5 * k, 0, TAU); c.fillStyle = '#d2412a'; c.fill(); c.strokeStyle = '#7a1c0e'; c.lineWidth = 1.5; c.stroke();
}
function air(x, y, ang, a, k = 1) {   // levegőrészecske (N₂/O₂) – kétatomos, szürkéskék
  al(a);
  for (const s of [-1, 1]) { c.beginPath(); c.arc(x + Math.cos(ang) * 7 * k * s, y + Math.sin(ang) * 7 * k * s, 8 * k, 0, TAU); c.fillStyle = '#aab4c6'; c.fill(); c.strokeStyle = '#3b4560'; c.lineWidth = 1.5; c.stroke(); }
}
/* méhsejt-rács csúcsai (01-suruseg: függőleges kötésekkel), b: kötéshossz */
function honeycomb(x0, y0, w, h, b) {
  const v = [], dx = b * Math.sqrt(3), ys = 1.5 * b;
  for (let j = 0; ; j++) {
    const yA = y0 + j * ys * 2; if (yA > y0 + h) break;
    for (let i = 0; ; i++) {
      const x = x0 + i * dx; if (x > x0 + w) break;
      for (const [xx, yy] of [[x, yA], [x, yA + b], [x + dx / 2, yA + b * 1.5], [x + dx / 2, yA + b * 2.5]]) if (xx <= x0 + w && yy <= y0 + h) v.push({ sx: xx, sy: yy });
    }
  }
  return v;
}
function linkLattice(v, b) {
  const bonds = [];
  v.forEach((p, i) => { p.nb = []; v.forEach((q, j) => { if (j !== i && Math.abs(Math.hypot(q.sx - p.sx, q.sy - p.sy) - b) < 1) { p.nb.push(j); if (j > i) bonds.push([i, j]); } }); });
  v.forEach((p) => { const q = v[p.nb[0]]; p.a0 = q ? Math.atan2(q.sy - p.sy, q.sx - p.sx) : 0; });
  return bonds;
}
function seedMotion(p, r) {
  Object.assign(p, { w1: 8 + 5 * r(), w2: 8 + 5 * r(), w3: 5 + 4 * r(), p1: r() * TAU, p2: r() * TAU, p3: r() * TAU,
    v1: .3 + .5 * r(), v2: .5 + .6 * r(), v3: .3 + .5 * r(), v4: .5 + .6 * r(), q1: r() * TAU, q2: r() * TAU, q3: r() * TAU, q4: r() * TAU,
    spin: (r() < .5 ? -1 : 1) * (.4 + .8 * r()), lam: 0, x: p.sx, y: p.sy, ang: p.a0 || 0 });
}
/* Átfedés-feloldás: minden képkockán a zárt képletű célhelyekből indul (nincs halmozott állapot).
   A szilárd részecskék (lam = 0) a helyükön maradnak, a folyadékrészecskék kitérnek. */
function relax(P, D, it, bub, box, circ) {
  const D2 = D * D;
  for (let k = 0; k < it; k++) {
    if (bub) for (const p of P) {
      if (p.lam < .01) continue;
      const dx = p.x - bub.x, dy = p.y - bub.y, d = Math.hypot(dx, dy), m = bub.r + 15;
      if (d < m) { if (d < .5) { p.x = bub.x; p.y = bub.y + m; } else { p.x = bub.x + dx / d * m; p.y = bub.y + dy / d * m; } }
    }
    for (let i = 0; i < P.length; i++) {
      const p = P[i];
      for (let j = i + 1; j < P.length; j++) {
        const q = P[j], ws = p.lam + q.lam; if (ws < .01) continue;
        const dx = q.x - p.x, dy = q.y - p.y; if (dx >= D || dx <= -D || dy >= D || dy <= -D) continue;
        const d2 = dx * dx + dy * dy; if (d2 >= D2 || d2 < 1e-6) continue;
        const d = Math.sqrt(d2), push = (D - d) / d, wp = p.lam / ws, wq = q.lam / ws;
        p.x -= dx * push * wp; p.y -= dy * push * wp; q.x += dx * push * wq; q.y += dy * push * wq;
      }
    }
    if (box) for (const p of P) { p.x = clamp(p.x, box[0], box[2]); p.y = clamp(p.y, box[1], box[3]); }
    if (circ) for (const p of P) { if (p.lam < .01) continue; const d = Math.hypot(p.x, p.y); if (d > circ) { const k = lerp(1, circ / d, p.lam); p.x *= k; p.y *= k; } }
  }
}
/* folyadékmozgás: rezgés (Aj) + lassú vándorlás (Aw) a kiinduló hely körül */
function liquidXY(p, t, Aj, Aw, lam) {
  p.x = p.sx + Math.sin(t * p.w1 + p.p1) * Aj + lam * Aw * (Math.sin(t * p.v1 + p.q1) + .6 * Math.sin(t * p.v2 + p.q2)) / 1.6;
  p.y = p.sy + Math.sin(t * p.w2 + p.p2) * Aj + lam * Aw * (Math.sin(t * p.v3 + p.q3) + .6 * Math.sin(t * p.v4 + p.q4)) / 1.6;
}
/* a mozgás élénksége a hőmérséklettől (szemléltetés: felnagyítva) */
function agit(Tc) {
  const T0 = num('kezdő hőmérséklet'), Tm = num('olvadáspont'), Tb = num('forráspont');
  const hs = clamp((Tc - T0) / (Tm - T0)), hl = clamp((Tc - Tm) / (Tb - Tm));
  return { As: 1.5 + 4.5 * hs, Aj: 6 + 3.5 * hl, Aw: 18 + 18 * hl };
}

/* ════════ Nagyító (1–5. lépés): a fazék tartalma részecskeszinten ════════ */
const MG = { cx: 860, cy: 312, R: 232, b: 44, k: 1.3, D: 36 };
let PW = [], PWB = [], HI = 0, BONDK = 0;
function buildPW() {
  const { R, b } = MG, r = U.rng(606);
  let v = honeycomb(-R - 2 * b, -R - 2 * b, 2 * R + 4 * b, 2 * R + 4 * b, b);
  const mx = v.reduce((s, p) => s + p.sx, 0) / v.length, my = v.reduce((s, p) => s + p.sy, 0) / v.length;
  v.forEach((p) => { p.sx -= mx; p.sy -= my; });
  v = v.filter((p) => Math.hypot(p.sx, p.sy) < R + 34);
  PWB = linkLattice(v, b);
  v.forEach((p) => { seedMotion(p, r); p.u2 = r(); p.gas = 0; p.u = clamp(((R - p.sy) * .8 + (p.sx + R) * .2) / (2 * R) + (r() - .5) * .14, 0, 1); });
  PW = v;
  let bd = 1e9; v.forEach((p, i) => { const d = Math.hypot(p.sx - 40, p.sy + 20); if (d < bd) { bd = d; HI = i; } });
  bd = 1e9; PWB.forEach(([i, j], n) => { const x = (v[i].sx + v[j].sx) / 2, y = (v[i].sy + v[j].sy) / 2, d = Math.hypot(x - R * .62, y + R * .5); if (d < bd) { bd = d; BONDK = n; } });
}
/* buborék a nagyítóban (forráskor): alulról jön, felfelé távozik – zárt képlet L.t-ből */
function pwBubble(t, on) {
  if (on <= .01) return null;
  const per = 3.4, ph = frac(t / per), r = (74 + 34 * ph) * on;
  return { x: 26 * Math.sin(t * .9), y: lerp(MG.R + r, -MG.R - r, ph), r, ph };
}
function pwFrame(S, t, bub, gw) {
  const A = agit(S.T), fe = S.f * 1.25 - .12;
  for (const p of PW) {
    const lam = S.f >= 1 ? 1 : smooth((fe - p.u) / .12); p.lam = lam;
    liquidXY(p, t, lerp(A.As, A.Aj, lam), A.Aw, lam);
    p.ang = p.a0 + (1 - lam) * .12 * Math.sin(t * p.w3 + p.p3) + lam * (t * p.spin + p.q1);
  }

    up.forEach((k, j) => T(k, (xa + xb) / 2, 726 - (up.length - 1 - j) * 28, { s: 22, w: 700, a: 'center', c: RED }));
    T(dn, (xa + xb) / 2, 834, { s: 22, w: 700, a: 'center', c: WATER_D });
  }
  const tq = p0 * clamp((st - 3.4) / .6);
  al(tq); rr(40, 912, 1280, 116, 18); c.fillStyle = U.rgba(RED, .09); c.fill(); c.strokeStyle = U.rgba(RED, .5); c.lineWidth = 2; c.stroke();
  T('tanulság', 680, 982, { f: F.D, i: 1, s: 38, w: 500, a: 'center', c: RED, max: 1220 });
}

/* ════════════════════════════════════════════════════════════════ */
const sT = new Array(8).fill(0);
const reset6 = () => { const o = { m: num('víz tömege'), P: kW(), Tb: num('forráspont') }; S6.cur = o; S6.from = Object.assign({}, o); S6.tC = -9; };
const resetEV = () => { EV.seg = [{ t0: 0, T: num('szobahőmérséklet') }]; };
L = Lesson.create({
  content: window.LESSON_CONTENT,
  home: false,
  steps: [
    { settle: 4 },
    { settle: 6.2 },
    { settle: 7.2 },
    { settle: 7.2 },
    { settle: 8.6 },
    { settle: 4, enter() { reset6(); },
      controls(L) {
        const sP = L.slider({ label: lab('teljesítmény csúszka'), k: 'teljesítmény csúszka', min: 500, max: 3000, step: 100, value: num('főzőlap teljesítménye'), format: (v) => fmt(v) + ' W',
          onInput: (v) => set6(L.st, { P: v / 1000 }) });
        L.slider({ label: lab('tömeg csúszka'), k: 'tömeg csúszka', min: .2, max: 2, step: .1, value: num('víz tömege'), format: (v) => fmt(v, 1) + ' kg',
          onInput: (v) => set6(L.st, { m: v }) });
        L.button(lab('tengerszint gomb'), () => set6(L.st, { Tb: num('forráspont') }), 'tengerszint gomb');
        L.button(lab('Kékes gomb'), () => set6(L.st, { Tb: num('forráspont a Kékesen') }), 'Kékes gomb');
      } },
    { settle: 6, enter() { resetEV(); },
      controls(L) {
        L.slider({ label: lab('hőmérséklet csúszka'), k: 'hőmérséklet csúszka', min: 0, max: 100, step: 1, value: num('szobahőmérséklet'), format: (v) => fmt(v) + ' °C',
          onInput: (v) => { const last = EV.seg[EV.seg.length - 1]; if (L.st - last.t0 < .05) last.T = v; else EV.seg.push({ t0: L.st, T: v }); } });
      } },
    { settle: 5 },
  ],
  init(Lx) {
    L = Lx; c = L.ctx;
    LC = curveOf(num('víz tömege'), num('forráspont'), num('forráspont'));
    buildPW(); buildEV(); buildMini(); reset6(); resetEV();
  },
  draw(Lx) {
    L = Lx; c = L.ctx; GA = 1; background();
    const sp = L.sp;
    if (L.step >= 0) sT[L.step] = L.st;
    const wl = clamp(1 - Math.max(0, sp - 4) * 2);
    if (wl > .005) { const i = Math.min(L.step, 4); GA = 1; sceneLab(i, L.step <= 4 ? L.st : sT[4], wl); }
    const SC = [null, null, null, null, null, scene6, sceneEV, sceneSum];
    for (let i = 5; i < 8; i++) {
      const w = clamp(1 - Math.abs(sp - i) * 2); if (w <= .005) continue;
      GA = 1; SC[i](sT[i], w);
    }
    c.globalAlpha = 1;
  },
});
})();
