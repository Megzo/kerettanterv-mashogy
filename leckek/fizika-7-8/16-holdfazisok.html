(function () {

const U = Lesson.U, { clamp, lerp, smooth, out, inOut, TAU } = U, fmt = U.fmt;

/* ── paletta (világos téma, lásd SZERZODES.md) ── */

const deg = Math.PI / 180;
const labN = (k, s, s2) => { let t = lab(k).replace('#', s); if (s2 != null) t = t.replace('#', s2); return t; };

/* ═══════════════════════════════ ÉGBOLT-MODUL ═══════════════════════════════
   Nap–Föld(–Hold) geometria és rajzolók. Önálló blokk (csak a 2D kontextust kapja paraméterben,
   szöveget nem ír) – a 16-holdfazisok lecke innen másolja.
   Keretek (egységvektorok):
     ekliptikai = „világ”: x → tavaszpont, z → az ekliptika északi pólusa. A Föld +z körül pozitív
       irányban kering és forog (az északi pólus fölül nézve az óramutatóval ellentétesen).
     egyenlítői: x → tavaszpont, z → a Föld forgástengelye (északi pólus).
     helyi (ENU): [kelet, észak, fel].
   Szögek radiánban. Az idő: helyi valódi napidő órában (12 = delelés).
   Egyszerűsítések: a Nap középpontja számít (nincs fénytörés, nincs napkorong-sugár); a Nap helyzete
   a csillagászati évkönyvek rövid közelítő képletéből (±0,1°); a Föld gömb; a csillagok J2000-koordinátái.
   Szárazföld: window.FOLD_SZARAZFOLD (fold-szarazfold.js, Natural Earth). */
const SKY = (function () {
  const D = Math.PI / 180, TAU = Math.PI * 2;
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
  const mul = (a, k) => [a[0] * k, a[1] * k, a[2] * k];
  const norm = (a) => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };

  /* ── szárazföld-maszk (0,5°-os rács) ── */
  let MASK = null, MW = 0, MH = 0;
  function loadLand(o) {
    if (!o || MASK) return;
    const bin = atob(o.b64); MW = o.w; MH = o.h; MASK = new Uint8Array(MW * MH);
    for (let i = 0; i < MW * MH; i++) MASK[i] = (bin.charCodeAt(i >> 3) >> (i & 7)) & 1;
  }
  function isLand(latD, lonD) {
    if (!MASK) return 0;
    let x = Math.floor((lonD + 180) / 360 * MW) % MW; if (x < 0) x += MW;
    const y = Math.min(MH - 1, Math.max(0, Math.floor((90 - latD) / 180 * MH)));
    return MASK[y * MW + x];
  }

  /* ── a Nap helyzete egy dátumon ──
     day: az év napja törttel (1,0 = jan. 1. 0:00 világidő; a 2026-os évre számolva)
     P = {eps: tengelyferdeség (fok), rp, ra: napközel- és naptávolpont (bármely egységben)}
     → {lam: ekliptikai hosszúság, dec, ra (rektaszcenzió), r: Nap–Föld távolság (P egységében),
        w: világvektor a Földtől a Nap felé, g: középanomália, eps (rad)} */
  function sun(day, P) {
    const n = 9496.5 + (day - 1);                       // napok 2000. jan. 1. 12:00 óta
    const e = (P.ra - P.rp) / (P.ra + P.rp), a = (P.ra + P.rp) / 2;
    const g = ((357.528 + 0.9856003 * n) % 360) * D;
    const lam = ((((280.460 + 0.9856474 * n) % 360) * D + 2 * e * Math.sin(g) + 1.25 * e * e * Math.sin(2 * g)) % TAU + TAU) % TAU;
    const eps = P.eps * D;
    return { lam, g, eps, r: a * (1 - e * Math.cos(g)), dec: Math.asin(Math.sin(eps) * Math.sin(lam)),
      ra: Math.atan2(Math.cos(eps) * Math.sin(lam), Math.cos(lam)), w: [Math.cos(lam), Math.sin(lam), 0] };
  }
  /* a Föld helyzete a Naptól (világkeret, P egységében) */
  const earthPos = (S) => mul(S.w, -S.r);
  /* keret-átváltás */
  const eqToEcl = (v, eps) => { const ce = Math.cos(eps), se = Math.sin(eps); return [v[0], v[1] * ce + v[2] * se, -v[1] * se + v[2] * ce]; };
  const eclToEq = (w, eps) => { const ce = Math.cos(eps), se = Math.sin(eps); return [w[0], w[1] * ce - w[2] * se, w[1] * se + w[2] * ce]; };
  const eqVec = (ra, dec) => [Math.cos(dec) * Math.cos(ra), Math.cos(dec) * Math.sin(ra), Math.sin(dec)];
  const axisW = (eps) => [0, Math.sin(eps), Math.cos(eps)];            // az északi pólus iránya (világ)
  /* a megfigyelő délkörének rektaszcenziója (helyi csillagidő) a helyi napidőből */
  const lstOf = (S, hr) => S.ra + (hr - 12) * 15 * D;
  /* egy földrajzi pont (lat, lon) világvektora; thetaG = a greenwichi délkör rektaszcenziója */
  const geoW = (lat, lon, thetaG, eps) => eqToEcl(eqVec(thetaG + lon, lat), eps);
  /* helyi ENU-tengelyek egyenlítői koordinátákban */
  function enu(lat, lstR) {
    const sl = Math.sin(lat), cl = Math.cos(lat), so = Math.sin(lstR), co = Math.cos(lstR);
    return { e: [-so, co, 0], n: [-sl * co, -sl * so, cl], u: [cl * co, cl * so, sl] };
  }
  const hor = (v, f) => [dot(v, f.e), dot(v, f.n), dot(v, f.u)];
  /* a Nap iránya a helyi égen [K, É, fel] */
  const sunHor = (S, lat, hr) => hor(eqVec(S.ra, S.dec), enu(lat, lstOf(S, hr)));
  /* a nappal hossza órában (mértani: a Nap középpontja a látóhatár fölött; fénytörés nélkül) */
  function dayLength(lat, dec) {
    const x = -Math.tan(lat) * Math.tan(dec);
    if (!(x > -1)) return x <= -1 ? 24 : 12;
    if (x >= 1) return 0;
    return 2 * Math.acos(x) / D / 15;
  }
  /* delelési magasság (rad): a Nap legnagyobb magassága a napon */
  const noonAlt = (lat, dec) => Math.PI / 2 - Math.abs(lat - dec);

  /* ── kamera: (r, u, v) jobbsodrású; v a néző felé mutat ── */
  function camera(v, up) {
    v = norm(v); up = up || [0, 0, 1];
    const u = norm(add(up, mul(v, -dot(up, v)))); return { r: cross(u, v), u, v };
  }
  /* a Nap balra esik, a tengely felfelé dől; el: a néző magassága a Föld egyenlítője fölött */
  function camSunLeft(sunW, axis, el) {
    const np = norm(add(axis, mul(sunW, -dot(axis, sunW)))), w = norm(cross(np, sunW));
    return camera(add(mul(w, Math.cos(el)), mul(np, Math.sin(el))), np);
  }
  /* felülnézet az északi pólus fölül, a Nap balra */
  function camTop(sunW, axis) {
    const v = norm(axis), r = mul(norm(add(sunW, mul(v, -dot(sunW, v)))), -1);
    return { r, u: cross(v, r), v };
  }
  /* világvektor → képernyő (gömbközéppont cx, cy, sugár R) */
  const proj = (cam, cx, cy, R, p) => ({ x: cx + R * dot(p, cam.r), y: cy - R * dot(p, cam.u), z: dot(p, cam.v),
    vis: dot(p, cam.v) >= 0 || dot(p, cam.r) ** 2 + dot(p, cam.u) ** 2 > 1 });

  /* ── pixeles földgömb (szárazföld, nappal–éjszaka, szürkületi sáv) ──
     o = {cam, sun: világvektor a Nap felé, eps, thetaG, res (felbontás-szorzó), plain (true: nincs térkép), tint} */
  const GC = {};
  const COL = { sea: [86, 146, 196], land: [146, 176, 98], ice: [232, 236, 238], seaN: [30, 40, 72], landN: [48, 58, 86], iceN: [72, 82, 108],
    moon: [196, 192, 182], moonN: [44, 48, 62] };
  function globe(ctx, id, cx, cy, R, o) {
    const res = o.res || 1, N = Math.max(8, Math.round(2 * R * res));
    let G = GC[id];
    if (!G || G.N !== N) {
      G = GC[id] = { N, cv: document.createElement('canvas'), key: '' };
      G.cv.width = G.cv.height = N; G.g = G.cv.getContext('2d'); G.img = G.g.createImageData(N, N);
      const I = [], X = [], Y = [], Z = [], A = [], h = N / 2;
      for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
        const x = (i + .5 - h) / h, y = -(j + .5 - h) / h, d = Math.hypot(x, y), edge = (1 - d) * h + .5;
        if (edge <= 0) continue;
        I.push(j * N + i); X.push(x); Y.push(y); Z.push(Math.sqrt(Math.max(0, 1 - d * d))); A.push(Math.min(1, edge));
      }
      G.I = Int32Array.from(I); G.X = Float32Array.from(X); G.Y = Float32Array.from(Y); G.Z = Float32Array.from(Z); G.A = Float32Array.from(A);
    }
    const cam = o.cam, eps = o.eps || 0, th = o.thetaG || 0;
    const key = [].concat(cam.r, cam.u, o.sun, [th % TAU, eps, o.plain ? 1 : 0]).map((v) => v.toFixed(4)).join(',');
    if (key !== G.key) {
      G.key = key;
      const rE = eclToEq(cam.r, eps), uE = eclToEq(cam.u, eps), vE = eclToEq(cam.v, eps), sE = eclToEq(o.sun, eps);
      const d = G.img.data, n = G.I.length;
      const cD = o.plain ? COL.moon : null, cN = o.plain ? COL.moonN : null;
      for (let k = 0; k < n; k++) {
        const x = G.X[k], y = G.Y[k], z = G.Z[k];
        const e0 = x * rE[0] + y * uE[0] + z * vE[0], e1 = x * rE[1] + y * uE[1] + z * vE[1], e2 = x * rE[2] + y * uE[2] + z * vE[2];
        const lit = e0 * sE[0] + e1 * sE[1] + e2 * sE[2];
        let day, ngt;
        if (o.plain) { day = cD; ngt = cN; }
        else {
          const lat = Math.asin(Math.max(-1, Math.min(1, e2))) / D;
          let lon = (Math.atan2(e1, e0) - th) / D; lon = ((lon + 180) % 360 + 360) % 360 - 180;
          if (isLand(lat, lon)) { const ice = lat > 62 && lon < -10 && lon > -75 || lat < -60; day = ice ? COL.ice : COL.land; ngt = ice ? COL.iceN : COL.landN; }
          else { day = COL.sea; ngt = COL.seaN; }
        }
        const f = Math.max(0, Math.min(1, (lit + .07) / .12)), t = f * f * (3 - 2 * f), sh = (.8 + .2 * Math.max(0, lit)) * (.86 + .14 * z);
        const o4 = G.I[k] * 4;
        d[o4] = (ngt[0] + (day[0] * sh - ngt[0]) * t); d[o4 + 1] = (ngt[1] + (day[1] * sh - ngt[1]) * t); d[o4 + 2] = (ngt[2] + (day[2] * sh - ngt[2]) * t);
        d[o4 + 3] = G.A[k] * 255;
      }
      G.g.putImageData(G.img, 0, 0);
    }
    ctx.drawImage(G.cv, cx - R, cy - R, 2 * R, 2 * R);
  }
  /* világpontok vonala a gömb előtt (látható rész folytonos; o.back > 0 → a takart rész szaggatottan, halványan) */
  function wpath(ctx, cam, cx, cy, R, pts, o) {
    const P = pts.map((p) => proj(cam, cx, cy, R, p));
    const run = (want) => {
      ctx.beginPath(); let pen = false;
      for (let i = 0; i < P.length; i++) {
        const ok = P[i].vis === want && (i === 0 || P[i - 1].vis === want || !pen);
        if (P[i].vis === want) { if (pen) ctx.lineTo(P[i].x, P[i].y); else ctx.moveTo(P[i].x, P[i].y); pen = true; } else pen = false;
        void ok;
      }
      ctx.stroke();
    };
    ctx.strokeStyle = o.col; ctx.lineWidth = o.w || 2; ctx.lineCap = 'round'; ctx.setLineDash(o.dash || []);
    run(true);
    if (o.back) { const a = ctx.globalAlpha; ctx.globalAlpha = a * o.back; ctx.setLineDash([6, 7]); run(false); ctx.globalAlpha = a; }
    ctx.setLineDash([]); ctx.lineCap = 'butt';
    return P;
  }
  /* szélességi kör (vagy íve) világpontjai; k: sugárszorzó (k > 1: a gömb fölött lebeg) */
  function latPts(lat, thetaG, eps, a0 = 0, a1 = TAU, k = 1, n = 96) {
    const o = []; for (let i = 0; i <= n; i++) o.push(mul(eqToEcl(eqVec(thetaG + lerp(a0, a1, i / n), lat), eps), k)); return o;
  }
  /* a nappal–éjszaka határ (terminátor) világpontjai */
  function termPts(sunW, n = 120) {
    const a = norm(cross(sunW, Math.abs(sunW[2]) < .9 ? [0, 0, 1] : [1, 0, 0])), b = cross(sunW, a), o = [];
    for (let i = 0; i <= n; i++) { const t = i / n * TAU; o.push(add(mul(a, Math.cos(t)), mul(b, Math.sin(t)))); }
    return o;
  }
  const lerp = (a, b, t) => a + (b - a) * t;

  /* ── helyi égbolt „búraként” (dél felé néző, beta szögben felülről néző nézet) ── */
  function dome(cx, cy, R, beta) {
    const sb = Math.sin(beta), cb = Math.cos(beta);
    return { cx, cy, R, sb, cb, p: (h) => ({ x: cx - h[0] * R, y: cy - (-h[1] * sb + h[2] * cb) * R, z: h[1] * cb + h[2] * sb }) };
  }
  /* égbolt (day: 0 éjjel … 1 nappal) + talaj */
  function domeBase(ctx, Dm, day) {
    const { cx, cy, R, sb } = Dm;
    ctx.beginPath(); ctx.arc(cx, cy, R, Math.PI, TAU); ctx.ellipse(cx, cy, R, R * sb, 0, 0, Math.PI); ctx.closePath();
    const g = ctx.createLinearGradient(0, cy - R, 0, cy);
    g.addColorStop(0, U.mix('#232d55', '#9cc6e6', day)); g.addColorStop(1, U.mix('#3a4570', '#d7e8f0', day));
    ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = U.rgba('#1c2440', .45); ctx.lineWidth = 2; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(cx, cy, R, R * sb, 0, 0, TAU);
    ctx.fillStyle = U.mix('#7d8460', '#cdd39c', day); ctx.fill();
    ctx.strokeStyle = '#3d4a2a'; ctx.lineWidth = 2.5; ctx.stroke();

  al(p0); LT('sáv', XN - 44, YC + hs - 6, { s: 22, w: 600, a: 'right', c: GOOD });
  sideEarth('e8', EXs, YC, ERs, p0);
  const yN = YC - lu.bN * K, yF = YC - lu.bF * K;
  if (lu.sol) { al(p0); c.beginPath(); c.moveTo(XN, yN - MRs); c.lineTo(EXs, YC - ERs * .6 + (yN - YC) * .3); c.lineTo(EXs, YC + ERs * .6 + (yN - YC) * .3); c.lineTo(XN, yN + MRs); c.closePath(); c.fillStyle = 'rgba(28,36,64,.25)'; c.fill(); }
  sideMoon(XN, yN, MRs, p0, false);
  sideMoon(XF, yF, MRs, p0, lu.lun);
  al(p0); LT('újholdkor', XN, 586, { s: 24, w: 700, a: 'center' }); LT('teliholdkor', XF, 586, { s: 24, w: 700, a: 'center' });
  // skála
  for (const d of [-5, 0, 5]) { al(p0); ln(1290, YC - d * K, 1306, YC - d * K, INK, 2); tx((d > 0 ? '+' : d < 0 ? '−' : '') + Math.abs(d) + '°', 1314, YC - d * K, { f: F.M, s: 22, b: 'middle', c: MUT, k: 'oldalnézet' }); }
  al(p0); ln(1298, YC - 5 * K, 1298, YC + 5 * K, INK, 2);
  const res = (ok, b, kOk) => (ok ? [kOk, GOOD] : [b > 0 ? 'fölötte' : 'alatta', MUT]);
  const [kn, cn] = res(lu.sol, lu.bN, 'napfogy jel'), [kfl, cf] = res(lu.lun, lu.bF, 'holdfogy jel');
  al(p0); LP(kn, XN, 1030, { s: 22, w: 700, a: 'center', c: '#fff', bg: cn, pad: 9 });
  LP(kfl, XF, 1030, { s: 22, w: 700, a: 'center', c: '#fff', bg: cf, pad: 9 });
}

/* ════════ 9. Összefoglalás ════════ */
function scene9(st) {
  const p0 = out(clamp(st / .5));
  const cards = [['össz félig', sum1], ['össz fázis', sum2], ['össz hónap', sum3], ['össz arc', sum4], ['össz kel', sum5], ['össz fogy', sum6]];
  cards.forEach(([k, fn], i) => {
    const q = out(clamp((st - .3 - i * .35) / .6)); if (q <= 0) return;
    const col = i % 3, row = Math.floor(i / 3), x = 50 + col * 430, y = 90 + row * 470 + (1 - q) * 30, w = 400, h = 430;
    al(p0 * q); rr(x, y, w, h, 20); c.fillStyle = CARD; c.fill(); c.strokeStyle = LINE; c.lineWidth = 2; c.stroke();
    tx(String(i + 1), x + 26, y + 46, { f: F.D, s: 40, w: 600, c: RED, qa: false });
    c.save(); c.translate(x, y); fn(p0 * q, st); c.restore();
    al(p0 * q); LT(k, x + w / 2, y + h - 36, { s: 26, w: 700, a: 'center', max: w - 40 });
  });
}
function sum1(a) {

function sum2(a) {

}
function sum3(a) {
  al(a); tx(L.val('szinodikus hónap'), 200, 190, { k: 'szinodikus hónap', f: F.M, s: 52, w: 700, a: 'center', c: RED });
  for (let k = 0; k <= 4; k++) phaseIcon(80 + k * 60, 270, 22, k * 90 * deg, k < 2 ? 0 : Math.PI, a);
}
function sum4(a) {
  moonAt('s9d', 200, 200, 120, { cam: camEarth(0), psi: Math.PI, es: 0 }, a);
}
function sum5(a) {
  const Dm = SKY.dome(200, 250, 140, 18 * deg);

  const pM = Dm.p([.97, 0, .1]), pS = Dm.p([-.97, 0, .04]);

  LT('ny', Dm.cx + Dm.R + 28, Dm.cy + 2, { s: 24, w: 700, a: 'left', b: 'middle', f: F.D });
}
function sum6(a) {
  al(a); SKY.sunDisc(c, 60, 200, 36, 1.6);
  ln(100, 200, 360, 200, U.rgba(INK, .35), 1.5, [4, 5]);
  sideMoon(244, 200, 10, a, false);
  al(a); c.beginPath(); c.arc(310, 200, 30, 0, TAU); c.fillStyle = '#5c92c4'; c.fill(); c.strokeStyle = INK; c.lineWidth = 2; c.stroke();
  al(a); c.beginPath(); c.ellipse(310, 200, 66, 20, -10 * deg, 0, TAU); c.strokeStyle = U.rgba(INK, .5); c.lineWidth = 2; c.setLineDash([4, 5]); c.stroke(); c.setLineDash([]);
}

/* ════════════════════════════════════════════════════════════════ */
const sT = new Array(9).fill(0);
const SCENES = [scene1, scene2, scene3, scene4, scene5, scene6, scene7, scene8, scene9];
const resetDrag = () => { DR.used = {}; DR.act = null; };
let btn5 = [];
L = Lesson.create({
  content: window.LESSON_CONTENT,
  home: false,
  steps: [
    { settle: 4.6, enter() { resetDrag(); } },
    { settle: 7.4,
      enter() { resetDrag(); Object.assign(S2, { man: 0, day: 4.5 }); },
      controls(L) { S2.sl = L.slider({ label: lab('hold kora csúszka'), k: 'hold kora csúszka', min: 0, max: Math.floor(num('szinodikus hónap') * 10) / 10, step: .1, value: 0, format: (v) => dayS(v), onInput: (v) => { S2.man = 1; S2.day = v; } }); } },
    { settle: 4.6, enter() { resetDrag(); } },
    { settle: 7.6,
      enter() { resetDrag(); Object.assign(S4, { man: 0, t: 0 }); },
      controls(L) { S4.sl = L.slider({ label: lab('eltelt csúszka'), k: 'eltelt csúszka', min: 0, max: Math.round(num('szinodikus hónap') * 10) / 10, step: .1, value: 0, format: (v) => dayS(v), onInput: (v) => { S4.man = 1; S4.t = v; } }); } },
    { settle: 6,
      enter() { resetDrag(); Object.assign(S5, { mode: 1, ts: -9, psiF: 0, off0: 0 }); btn5.forEach((b, j) => b && b.classList.toggle('on', j === 0)); },
      controls(L) {
        btn5 = [L.button(lab('forog gomb'), () => setMode5(1, btn5), 'forog gomb'), L.button(lab('nem forog gomb'), () => setMode5(0, btn5), 'nem forog gomb')];
        btn5[0].classList.toggle('on', S5.mode === 1); btn5[1].classList.toggle('on', S5.mode === 0);
      } },
    { settle: 5.6,
      enter() { resetDrag(); Object.assign(S6, { manH: 0, hr: 18, manD: 0, day: SYN / 2 }); },
      controls(L) {
        S6.slH = L.slider({ label: lab('napszak csúszka'), k: 'napszak csúszka', min: 0, max: 24, step: 1 / 12, value: 12, format: (v) => hhmm(v), onInput: (v) => { S6.manH = 1; S6.hr = v; } });
        S6.slD = L.slider({ label: lab('hold kora csúszka'), k: 'hold kora csúszka', min: 0, max: Math.floor(num('szinodikus hónap') * 10) / 10, step: .1, value: Math.round(num('szinodikus hónap') * 5) / 10, format: (v) => dayS(v), onInput: (v) => { S6.manD = 1; S6.day = v; } });
      } },
    { settle: 6.4,

    { settle: 6.8,

      controls(L) {

        S8.btn = L.button(lab('hajlás gomb'), (b) => { S8.from = incF(L.st); S8.inc = S8.inc ? 0 : 1; S8.ts = L.st; b.classList.toggle('on', !S8.inc); }, 'hajlás gomb');
      } },
    { settle: 3 },
  ],
  init(Lx) { L = Lx; c = L.ctx; loadData(); SKY.loadLand(window.FOLD_SZARAZFOLD); MOON.build(); installDrag(); L.steps.forEach((s) => s.enter && s.enter(L)); },
  draw(Lx) {
    L = Lx; c = L.ctx; GA = 1; background();
    DR.list = [];
    const sp = L.sp;
    if (L.step >= 0) sT[L.step] = L.st;
    for (let i = 0; i < SCENES.length; i++) {

  },
});
})();
