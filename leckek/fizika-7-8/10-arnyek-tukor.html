<script>
(function () {
'use strict';
const U = Lesson.U, { clamp, lerp, smooth, out, inOut, TAU } = U, fmt = U.fmt;
const F = Lesson.FONTS;
/* ── paletta (világos téma, lásd SZERZODES.md) ── */
const INK = '#1c2440', MUT = '#565d72', RED = '#c8401c', TEAL = '#0a6f86', GOOD = '#1d7a45', BAD = '#b3261e',

const P = (pts) => { c.beginPath(); pts.forEach((p, i) => i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])); c.closePath(); };
const deg = Math.PI / 180;
/* felirat '#' helyére szám */
const labN = (k, s) => lab(k).replace('#', s);

function background() {
  c.globalAlpha = 1;
  const g = c.createRadialGradient(680, 480, 100, 680, 540, 1300); g.addColorStop(0, '#f7f1e6'); g.addColorStop(1, '#efe6d6');
  c.fillStyle = g; c.fillRect(0, 0, 1920, 1080);
  c.strokeStyle = 'rgba(28,36,64,.045)'; c.lineWidth = 1; c.beginPath();
  for (let x = 0; x <= 1920; x += 40) { c.moveTo(x + .5, 0); c.lineTo(x + .5, 1080); }
  for (let y = 0; y <= 1080; y += 40) { c.moveTo(0, y + .5); c.lineTo(1920, y + .5); }
  c.stroke();
}

/* ── geometria ── */
const cross = (ax, ay, bx, by) => ax * by - ay * bx;
/* P + t·d metszése az [x1,y1]–[x2,y2] szakasszal → t vagy null */
function segInt(px, py, dx, dy, s) {
  const ex = s[2] - s[0], ey = s[3] - s[1], den = cross(dx, dy, ex, ey);
  if (Math.abs(den) < 1e-12) return null;
  const t = cross(s[0] - px, s[1] - py, ex, ey) / den, u = cross(s[0] - px, s[1] - py, dx, dy) / den;
  return u < 0 || u > 1 ? null : t;
}
/* P + t·d metszése körrel → első pozitív t vagy null */
function circInt(px, py, dx, dy, C) {
  const fx = px - C.x, fy = py - C.y, dd = dx * dx + dy * dy, b = fx * dx + fy * dy, cc = fx * fx + fy * fy - C.r * C.r;
  const disc = b * b - dd * cc; if (disc < 0) return null;
  const q = Math.sqrt(disc), t1 = (-b - q) / dd, t2 = (-b + q) / dd;
  return t1 > 1e-6 ? t1 : t2 > 1e-6 ? t2 : null;
}

  let t = tmax;
  for (const s of segs) { const r = segInt(px, py, dx, dy, s); if (r !== null && r > 1e-6 && r < t) t = r; }
  for (const C of circs) { const r = circInt(px, py, dx, dy, C); if (r !== null && r < t) t = r; }

}
const rectSegs = (x, y, w, h) => [[x, y, x + w, y], [x + w, y, x + w, y + h], [x + w, y + h, x, y + h], [x, y + h, x, y]];
/* a P→Q szakasz metszi-e a kört (Q a körön kívül) */
function segHitsCircle(px, py, qx, qy, cx, cy, r) {
  const dx = qx - px, dy = qy - py, fx = px - cx, fy = py - cy;
  const a = dx * dx + dy * dy, b = fx * dx + fy * dy, cc = fx * fx + fy * fy - r * r;
  if (cc <= 0) return true;

  const t1 = (-b - Math.sqrt(disc)) / a; return t1 >= 0 && t1 <= 1;
}
/* érintők P-ből a (C, r) körhöz: [{dir, tx, ty}] */
function tangents(px, py, cx, cy, r) {
  const d = Math.hypot(cx - px, cy - py); if (d <= r) return [];
  const phi = Math.atan2(cy - py, cx - px), be = Math.asin(r / d), tl = Math.sqrt(d * d - r * r);
  return [phi - be, phi + be].map((a) => ({ a, tx: px + Math.cos(a) * tl, ty: py + Math.sin(a) * tl }));
}
function arrowHead(x1, y1, x2, y2, col, s = 16) {
  const a = Math.atan2(y2 - y1, x2 - x1);
  c.beginPath(); c.moveTo(x2, y2); c.lineTo(x2 - s * Math.cos(a - .42), y2 - s * Math.sin(a - .42)); c.lineTo(x2 - s * Math.cos(a + .42), y2 - s * Math.sin(a + .42)); c.closePath();

}
function arrowLine(x1, y1, x2, y2, col, w = 3, at = 1, s = 16) {

  const xm = lerp(x1, x2, at), ym = lerp(y1, y2, at); arrowHead(x1, y1, xm, ym, col, s);
}

/* ── húzható elemek (helyi bővítés: a motor csak L.pointer-t ad) ── */
const DR = { list: [], act: null, hov: null, used: {} };
function grab(id, x, y, r, fn) { DR.list.push({ id, x, y, r, fn }); }

  let best = null, bd = 1e9;

}
function installDrag() {

    DR.act = { id: h.id, fn: h.fn, dx: h.x - p.x, dy: h.y - p.y }; DR.used[h.id] = 1;
    st.style.cursor = 'grabbing'; e.preventDefault();

    const p = L.toStage(e);
    if (DR.act) { DR.act.fn(p.x + DR.act.dx, p.y + DR.act.dy); return; }
    const h = (e.target.closest && e.target.closest('#lesson-panel')) ? null : pick(p);
    DR.hov = h ? h.id : null; st.style.cursor = h ? 'grab' : '';

}
const isHot = (id) => DR.hov === id || (DR.act && DR.act.id === id);
function ring(id, x, y, r) {

}
function hint(id, x, y, a) {
  if (DR.used[id] || a <= .01) return;
  const k = .5 + .5 * Math.sin(L.t * 3.2);
  al(a * (.75 + .25 * k)); TP('húzd', x, y, { s: 22, w: 700, a: 'center', c: '#fff', bg: TEAL, pad: 10 }); al(a);
}

/* ── rajzelemek ── */
function bulb(x, y, a, on = 1, r = 22, socket = 'left') {
  if (a <= .01) return;
  al(a * on);
  const g = c.createRadialGradient(x, y, r * .4, x, y, r * 4.2); g.addColorStop(0, 'rgba(255,214,110,.75)'); g.addColorStop(1, 'rgba(255,214,110,0)');
  c.fillStyle = g; c.beginPath(); c.arc(x, y, r * 4.2, 0, TAU); c.fill();
  al(a);
  c.fillStyle = '#9aa1ae'; c.strokeStyle = '#3a4252'; c.lineWidth = 2;
  if (socket === 'left') { rr(x - r - 16, y - 9, 18, 18, 3); } else { rr(x - 9, y - r - 16, 18, 18, 3); }
  c.fill(); c.stroke();
  c.beginPath(); c.arc(x, y, r, 0, TAU); c.fillStyle = U.mix('#e6e0d2', '#fff1b8', on); c.fill();
  c.strokeStyle = AMB_D; c.lineWidth = 2.5; c.stroke();

}
/* szem oldalról / felülről; ang: nézési irány */
function eyeIcon(x, y, ang, s, a) {
  if (a <= .01) return;
  al(a); c.save(); c.translate(x, y); c.rotate(ang);
  c.beginPath(); c.moveTo(-s, 0); c.quadraticCurveTo(0, -s * 1.05, s, 0); c.quadraticCurveTo(0, s * 1.05, -s, 0); c.closePath();
  c.fillStyle = CARD; c.fill();
  c.save(); c.clip();
  c.beginPath(); c.arc(s * .3, 0, s * .46, 0, TAU); c.fillStyle = TEAL; c.fill();
  c.beginPath(); c.arc(s * .42, 0, s * .22, 0, TAU); c.fillStyle = INK; c.fill();
  c.beginPath(); c.arc(s * .3, -s * .17, s * .09, 0, TAU); c.fillStyle = '#fff'; c.fill();
  c.restore();
  c.beginPath(); c.moveTo(-s, 0); c.quadraticCurveTo(0, -s * 1.05, s, 0); c.quadraticCurveTo(0, s * 1.05, -s, 0); c.closePath();
  c.strokeStyle = INK; c.lineWidth = 2.5; c.lineJoin = 'round'; c.stroke();
  c.restore();
}
function ball(x, y, r, a) {
  al(a);
  const g = c.createRadialGradient(x - r * .4, y - r * .4, r * .1, x, y, r); g.addColorStop(0, '#f2f4f7'); g.addColorStop(1, '#8e98a8');
  c.beginPath(); c.arc(x, y, r, 0, TAU); c.fillStyle = g; c.fill(); c.strokeStyle = '#2c3644'; c.lineWidth = 2.5; c.stroke();
}
function apple(x, y, r, a, lit) {
  al(a);
  const base = U.mix('#3a2a2a', '#d4432a', lit), hi = U.mix('#4a3a3a', '#f08a6a', lit);
  const g = c.createRadialGradient(x - r * .35, y - r * .35, r * .1, x, y, r); g.addColorStop(0, hi); g.addColorStop(1, base);
  c.beginPath(); c.moveTo(x, y - r * .78);
  c.bezierCurveTo(x + r * .55, y - r * 1.15, x + r * 1.15, y - r * .6, x + r, y + r * .1);
  c.bezierCurveTo(x + r * .9, y + r * .9, x + r * .3, y + r * 1.05, x, y + r * .92);
  c.bezierCurveTo(x - r * .3, y + r * 1.05, x - r * .9, y + r * .9, x - r, y + r * .1);
  c.bezierCurveTo(x - r * 1.15, y - r * .6, x - r * .55, y - r * 1.15, x, y - r * .78); c.closePath();
  c.fillStyle = g; c.fill(); c.strokeStyle = '#6e1a0e'; c.lineWidth = 2.5; c.stroke();
  ln(x, y - r * .75, x + r * .1, y - r * 1.15, '#5a3a1a', 3);
  c.beginPath(); c.ellipse(x + r * .35, y - r * 1.05, r * .28, r * .12, -.5, 0, TAU); c.fillStyle = U.mix('#3a4a3a', '#4f9a4a', lit); c.fill(); c.strokeStyle = '#1f4a1f'; c.lineWidth = 1.5; c.stroke();
}
/* tükör: (x1,y1)–(x2,y2), a hátoldal a (nx, ny) normális felé satírozva */
function mirror(x1, y1, x2, y2, nx, ny, a, w = 7) {
  al(a);
  const len = Math.hypot(x2 - x1, y2 - y1), ux = (x2 - x1) / len, uy = (y2 - y1) / len;
  c.strokeStyle = INK; c.lineWidth = 1.8; c.beginPath();
  for (let s = 8; s < len; s += 16) { const px = x1 + ux * s + nx * w * .5, py = y1 + uy * s + ny * w * .5; c.moveTo(px, py); c.lineTo(px + nx * 16 - ux * 10, py + ny * 16 - uy * 10); }
  c.stroke();
  c.lineCap = 'round'; ln(x1, y1, x2, y2, GLASS, w); c.lineCap = 'butt';

}
function candleTop(x, y, a) {   // gyertya felülnézetben
  al(a);
  const g = c.createRadialGradient(x, y, 4, x, y, 70); g.addColorStop(0, 'rgba(255,200,80,.55)'); g.addColorStop(1, 'rgba(255,200,80,0)');
  c.fillStyle = g; c.beginPath(); c.arc(x, y, 70, 0, TAU); c.fill();
  c.beginPath(); c.arc(x, y, 22, 0, TAU); c.fillStyle = '#f3ead6'; c.fill(); c.strokeStyle = '#7a6a4a'; c.lineWidth = 2.5; c.stroke();
  c.beginPath(); c.arc(x, y, 8, 0, TAU); c.fillStyle = '#ffb02e'; c.fill(); c.strokeStyle = '#b5520a'; c.lineWidth = 2; c.stroke();
}

/* ════════ 1. A fény egyenesen halad ════════ */
const Y1 = 560, LX1 = 170, CX1 = [430, 660, 890], HOLE = 17, CT = 8, CH = 340, EX1 = 1200;
const S1 = { from: 0, to: 0, t0: -9, off: 0 };
const s1off = (st) => lerp(S1.from, S1.to, inOut(clamp((st - S1.t0) / .6)));
function card1(x, off, a) {
  al(a); c.fillStyle = '#dcc39b'; c.strokeStyle = '#7a5a2a'; c.lineWidth = 2.5;
  const y0 = Y1 + off - CH, y1 = Y1 + off + CH;
  rr(x - CT, y0, CT * 2, CH - HOLE, 3); c.fill(); c.stroke();
  rr(x - CT, Y1 + off + HOLE, CT * 2, CH - HOLE, 3); c.fill(); c.stroke();
  return [y0, y1];
}
function scene1(st, cur) {
  const p0 = out(clamp(st / .6)), off = s1off(st); S1.off = off;
  const ys = [0, off, 0];
  // a lyukakon átjutó sugarak meredekség-intervalluma (pontszerű lámpa, y = Y1 + s·(x − LX1))
  let lo = -1e9, hi = 1e9; const I = [];
  for (let i = 0; i < 3; i++) for (const xf of [CX1[i] - CT, CX1[i] + CT]) {
    const dx = xf - LX1; lo = Math.max(lo, (ys[i] - HOLE) / dx); hi = Math.min(hi, (ys[i] + HOLE) / dx);
    if (xf === CX1[i] + CT) I.push([lo, hi]);
  }
  const front = lerp(LX1, EX1, clamp((st - .7) / 1.1));
  // szétterülő sugarak a lámpából (az első lapig vagy a kép széléig)
  c.save(); c.beginPath(); c.rect(0, 0, front, 1080); c.clip();
  for (let i = 0; i < 40; i++) {
    const a = i / 40 * TAU + .04, dx = Math.cos(a), dy = Math.sin(a);
    let t = 1600;
    const tc = segInt(LX1, Y1, dx, dy, [CX1[0] - CT, Y1 - CH, CX1[0] - CT, Y1 + CH]); if (tc !== null && tc > 0) t = Math.min(t, tc);
    const ex = LX1 + dx * t, ey = Y1 + dy * t;
    const g = c.createLinearGradient(LX1, Y1, ex, ey); g.addColorStop(0, U.rgba(AMB, .6)); g.addColorStop(1, U.rgba(AMB, tc !== null && tc > 0 ? .35 : 0));
    al(p0 * clamp((st - .5) / .5)); c.beginPath(); c.moveTo(LX1, Y1); c.lineTo(ex, ey); c.strokeStyle = g; c.lineWidth = 2; c.stroke();
  }
  // a lyukakon átjutó nyaláb, szakaszonként
  const seg = (s0, s1, xa, xb) => { if (s0 > s1) return; P([[xa, Y1 + s0 * (xa - LX1)], [xb, Y1 + s0 * (xb - LX1)], [xb, Y1 + s1 * (xb - LX1)], [xa, Y1 + s1 * (xa - LX1)]]); c.fillStyle = 'rgba(255,190,60,.75)'; c.fill(); c.strokeStyle = AMB; c.lineWidth = 1.5; c.stroke(); };
  al(p0);
  const lo0 = (0 - HOLE) / (CX1[0] - CT - LX1), hi0 = HOLE / (CX1[0] - CT - LX1);
  seg(lo0, hi0, LX1 + 24, CX1[0] - CT);
  seg(I[0][0], I[0][1], CX1[0] - CT, CX1[1] - CT);
  seg(I[1][0], I[1][1], CX1[1] - CT, CX1[2] - CT);
  seg(I[2][0], I[2][1], CX1[2] - CT, EX1 - 26);
  c.restore();
  // lapok, lámpa, szem
  bulb(LX1, Y1, p0, 1);
  for (let i = 0; i < 3; i++) card1(CX1[i], ys[i], p0);
  const sees = I[2][0] <= I[2][1] && front >= EX1 - 30;
  eyeIcon(EX1, Y1, Math.PI, 30, p0);
  al(p0);
  T('lámpa', LX1, Y1 + 76, { s: 26, w: 600, a: 'center' });
  T('szem', EX1, Y1 + 76, { s: 26, w: 600, a: 'center' });
  T('kartonlap', CX1[2], Y1 + CH + 44, { s: 24, w: 500, a: 'center', c: MUT });
  // fénysebesség
  const pv = clamp((st - .3) / .5); al(p0 * pv);
  const w0 = T('fénysebesség felirat', 60, 96, { s: 30, w: 600 }).w;
  L.tx(L.val('fénysebesség'), 60 + w0 + 14, 96, { k: 'fénysebesség', f: F.M, s: 30, w: 700, c: RED });

function scene8(st, cur) {
