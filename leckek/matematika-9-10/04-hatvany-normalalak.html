(function () {

const U = Lesson.U, { clamp, lerp, smooth, TAU } = U;
const F = Lesson.FONTS;

/* ── MODUL: Számegyenes (MatLine) · forrás: matematika-5-6/08-tizedes-tortek, 2026-11-23 ──────────────────────
   Terv: pilot/matematika-5-6/terv.md 4. fejezet (API-vázlat) · pilot/matematika-9-10/terv.md 5.1 („MatSzam”).
   Csak a Lesson motorra (L.ctx, L.tx, L.pill, L.measure, L.pointer, L.t, L.stage) és – tört-feliratnál – a
   shared/matek/mtext.js MatText-jére épül. Változtatás nélkül átemelhető (javaslat: shared/matek/line.js).
   Szöveg: {s, k} (szöveg + md-kulcs) vagy sima szöveg (kódban rögzített szám, jel). Minden felirat L.tx / L.pill /
   MatText.draw útján kerül a vászonra (QA, review mód). Az átlátszóság (a) ABSZOLÚT: a hívó szorozza bele a
   jelenet-áttűnést. A modul állapotot nem tart, csak az éppen húzott pontét (zárt képletű rajzhoz jó).

   const nl = MatLine.create(L, o)
     o = {x0, x1, y              a [v0; v1] tartomány két végének x-e és a vonal y-ja (logikai px)
          v0 = 0, v1 = 1         kezdő nézet
          scheme: 'dec'          10-hatvány szintek (1; 0,1; 0,01 …): a sűrűsödő szint fokozatosan tűnik elő
                                 (folytonos zoomhoz); felirat a legfinomabb olyan szinten, ahol elfér
                | '125'          felirat-lépés 1–2–5 · 10^k (ahol elfér), beosztás a következő kisebb 10-hatványon
                | 'fix'          o.step a beosztás, o.major a felirat lépése (alap: step)
          step, major            'fix' lépései;  den: tört-számegyenes (scheme 'fix', step = 1/den, fmt 'frac')
          fmt: 'dec'             tizedes felirat (magyar: 0,25; −3) · 'frac' (n/den, o.reduce: egyszerűsítve; egész
                                 helyén egész) · 'mixed' (vegyes szám) · függvény (v) → szöveg
          pad: false             'dec' + 'fix': minden felirat ugyanannyi tizedesjegyű, mint a major (0,20 … 0,30)
          labelSide: 'down'      'up': a feliratok a vonal fölött (kettős számegyenes felső vonala)
          unit: {s, k}           mértékegység a nyíl után · s: 24 (felirat px) · tick: 22 (fő beosztás px)
          lw: 2.5 · c: tinta · arrow: true · ext: 26 (a vonal túlnyúlása px) · labelDy: 38 · minPx: 7}
     nl.view(v0, v1)             nézet beállítása → nl;  nl.v0, nl.v1, nl.ppu (px / egység)
     nl.lerpView(A, B, t)        nl.view(...MatLine.lerpView(A, B, t))
     nl.x(v) · nl.v(x) · nl.in(v)   érték ↔ x; látszik-e a nézetben
     nl.levelA(step)             egy beosztás-szint láthatósága 0..1 (pl. „most látszanak a századok”)
     nl.ticks()                  → [{v, h, a, la, d, c}] a mostani nézet beosztásai (h magasság, a / la a beosztás /
                                 felirat átlátszósága, d tizedesjegy)
     nl.label(v, d)              egy érték felirata a vonal formátumában
     nl.draw(d)                  d = {a: 1, line: true, ticks: true, labels: true | false | 'ends' | [v…],
                                 hi: [v…] | [{v, c}] (kiemelt beosztás, félkövér színes felirat),
                                 tickA(v), labelA(v) → 0..1 (fokozatos megjelenés), tickC(v) → szín,
                                 labelC(v) → szín, lineT: 0..1 (a vonal kirajzolódása balról)}
     nl.point(v, o) → v          pont; o = {c, r: 11, hollow, a, ring (fényudvar), dy (függőleges eltolás px),
                                 label: {s, k} | szöveg, math (MatText.draw-val, pl. tört), side: 'up' | 'down',
                                 al: 'center' | 'left' | 'right' (a felirat a ponttól balra / jobbra nyúlik),
                                 ldy (a felirat távolsága), pill: true, sz: 26, lc (felirat színe), f (betű),
                                 drag: {id, min, max, snap, track: false, hit: 28, onDrag(v)}}
                                 Húzás: fogantyú r ≥ 11, találati sugár 28 px; track: a vonalra kattintva is odaugrik;
                                 a pont a [min; max]-on marad, snap-re ugrik. Visszaadja a húzás utáni értéket –
                                 a lecke tárolja, és egy L.slider-rel (billentyűvel is) szinkronban tartja.
     nl.jump(v0, v1, t, o)       ugrás-ív v0 → v1 (lépegetés); t 0..1 kirajzolás; o = {c, a, h, down, lw: 3,
                                 arrow: true, gap: 6, label: {s, k} | szöveg, sz: 24}
     nl.span(v0, v1, o)          szakasz / intervallum a vonalon; v0 = −Infinity / v1 = Infinity → félegyenes nyíllal;
                                 o = {c, a, lw: 7, dy: 0, t (kirajzolás 0..1), closed: [true, true] (true teli, false
                                 üres karika, null semmi), alpha: .85}
     nl.mirror(v, t, o) → érték  a v pont tükrözése a 0-ra (ellentett) félköríven; t 0..1; o = {c, a, ghost: true,
                                 r, label}; visszaadja a pont mostani (vetített) értékét
     nl.brace(v0, v1, o)         kapocs a [v0; v1] fölött (o.down: a feliratok alatt); o = {c, a, dy, t,
                                 label: {s, k} | szöveg, math, sz: 26, f}  – távolság, „1 tized”, abszolút érték
     nl.frameBox(v0, v1, o)      → {x0, y0, x1, y1} a szakaszt és két végfeliratát befoglaló doboz
     nl.frame(v0, v1, o)         nagyító keret (o = {c, a, lw: 2.5, fill: .06, h})
   MatLine.lerpView(A, B, t)     két nézet között logaritmikus zoom: a szélesség mértani úton változik, a fixpont
                                 (amely mindkét nézetben ugyanott van) helyben marad → valódi nagyítás.
                                 Egyenlő szélességnél egyenletes eltolás. t-t a hívó simítja (U.inOut).
   MatLine.zoomPair(L, top, bot, v0, v1, t, o)   két szint: keret a felső vonal [v0; v1] szakasza körül, vetítő trapéz
                                 az alsó vonal két végéhez. Az alsót a hívó rajzolja: bot.view(v0, v1); bot.draw(…).
                                 o = {c, a, h, fill}; t 0..1 (0–0,4 a keret, 0,3–1 a trapéz)
   MatLine.double(L, o) → {top, bot, draw(d)}   kettős számegyenes közös x-szel (százalék, mértékegység);
                                 o = {x0, x1, y, gap: 110, top: {create-opciók}, bot: {…}} (a felső felirata fent);
                                 draw({a, links: [v…] (szaggatott összekötő a felső vonal v értékeinél), top: {draw-opciók},
                                 bot: {…}})
   MatLine.parallel(L, o) → {lines, draw(d)}   párhuzamos számegyenesek (törtfal); o = {x0, x1, y0, dy, dens: [2, 3, …],
                                 v1: 1}; draw({a, hi: [[sor, érték]…], c})
   MatLine.decimals(x)           hány tizedesjegy kell x leírásához (0,25 → 2; 3 → 0)
   MatLine.round(v, d = 10)      lebegőpontos zaj nélkül (0,1 + 0,2 → 0,3)
   Nincs benne (még): felcsavarás hasábra (MatLine.wrap – a 03-hoz Mat3D kell), logaritmikus lépték (9–10/04).
   ──────────────────────────────────────────────────────────────────────────────────────────────────────── */
const MatLine = (() => {
  const U = Lesson.U, F = Lesson.FONTS, TAU = Math.PI * 2, clamp = U.clamp, smooth = U.smooth;
  const INK = '#1c2440', MUT = '#565d72', RED = '#c8401c', CARD = '#fffaf1', PAPER = '#f7f1e6';
  const round = (v, d = 10) => (isFinite(v) ? +(+v).toFixed(d) : v);
  const decimals = (x) => {
    x = Math.abs(x);
    for (let d = 0; d < 12; d++) { const m = x * Math.pow(10, d); if (Math.abs(m - Math.round(m)) < 1e-7 * Math.max(1, m)) return d; }
    return 12;
  };
  const TX = (x) => (x == null ? null : typeof x === 'string' || typeof x === 'number' ? { s: String(x) } : x);
  const P10 = (k) => Math.pow(10, k);

  function lerpView(A, B, t) {
    t = clamp(t);
    const wA = A[1] - A[0], wB = B[1] - B[0], cA = (A[0] + A[1]) / 2, cB = (B[0] + B[1]) / 2;
    if (Math.abs(wA - wB) <= 1e-12 * Math.max(Math.abs(wA), Math.abs(wB))) { const m = cA + (cB - cA) * t; return [m - wA / 2, m + wA / 2]; }
    const w = wA * Math.pow(wB / wA, t), m = cA + (cB - cA) * (w - wA) / (wB - wA);
    return [m - w / 2, m + w / 2];
  }

  // ── húzás: képkockánként egyszer frissül (L.t szerint) ──
  const DRAG = { id: null, t: NaN, was: false, pressed: false, hov: '', cur: '' };
  function input(L) {
    if (DRAG.t === L.t) return;
    DRAG.t = L.t;
    const dn = !!L.pointer.down;
    DRAG.pressed = dn && !DRAG.was; DRAG.was = dn;
    if (!dn) DRAG.id = null;
    const want = DRAG.id ? 'grabbing' : DRAG.hov;
    if (want !== DRAG.cur && L.stage) { L.stage.style.cursor = want; DRAG.cur = want; }
    DRAG.hov = '';
  }

  function arrowHead(c, x, y, ang, sz, col) {
    c.save(); c.translate(x, y); c.rotate(ang); c.beginPath();
    c.moveTo(0, 0); c.lineTo(-sz * 1.25, -sz * .62); c.lineTo(-sz * .95, 0); c.lineTo(-sz * 1.25, sz * .62); c.closePath();
    c.fillStyle = col; c.fill(); c.restore();
  }

  function create(L, o = {}) {
    const nl = Object.assign({ x0: 100, x1: 1260, y: 540, v0: 0, v1: 1, scheme: 'dec', fmt: 'dec', s: 24, tick: 22, lw: 2.5,
      c: INK, arrow: true, ext: 26, labelDy: 38, minPx: 7, pad: false, labelSide: 'down', unit: null }, o);
    if (nl.den && !o.step) { nl.scheme = 'fix'; nl.step = 1 / nl.den; if (o.fmt == null) nl.fmt = 'frac'; }
    if (nl.scheme === 'fix' && !nl.major) nl.major = nl.step;
    nl.L = L;
    nl.view = (a, b) => { nl.v0 = a; nl.v1 = b; nl.ppu = (nl.x1 - nl.x0) / (b - a); return nl; };
    nl.lerpView = (A, B, t) => nl.view(...lerpView(A, B, t));
    nl.x = (v) => nl.x0 + (v - nl.v0) * nl.ppu;
    nl.v = (x) => nl.v0 + (x - nl.x0) / nl.ppu;
    nl.in = (v) => { const e = 1e-9 * (nl.v1 - nl.v0); return v >= nl.v0 - e && v <= nl.v1 + e; };
    nl.levelA = (step) => smooth((step * nl.ppu - nl.minPx) / 14);

    nl.label = (v, d) => {
      if (typeof nl.fmt === 'function') return String(nl.fmt(v));
      if (nl.fmt === 'frac' || nl.fmt === 'mixed') {
        const den = nl.den || Math.round(1 / nl.step), n = Math.round(v * den);
        if (n % den === 0 && nl.whole !== false) return U.fmt(n / den);
        let a = n, b = den; if (nl.reduce) { const g = MatQ.gcd(a, b); a /= g; b /= g; }
        if (nl.fmt === 'mixed' && Math.abs(a) > b) return (a < 0 ? '−' : '') + Math.floor(Math.abs(a) / b) + ' ' + (Math.abs(a) % b) + '/' + b;
        return (a < 0 ? '−' : '') + Math.abs(a) + '/' + b;
      }
      return U.fmt(round(v, 12), d == null ? decimals(round(v, 12)) : d);
    };
    const isFrac = () => nl.fmt === 'frac' || nl.fmt === 'mixed';

    // beosztások a mostani nézetben
    nl.ticks = () => {
      const out = [], span = nl.v1 - nl.v0;
      const push = (step, k0, k1, h, a, la, d) => {
        for (let i = k0; i <= k1; i++) out.push({ v: round(i * step, 12), h, a, la, d, i });
      };
      const range = (step) => [Math.ceil(nl.v0 / step - 1e-9), Math.floor(nl.v1 / step + 1e-9)];
      if (nl.scheme === 'fix') {

const MatPlot = (() => {
  const U = Lesson.U, F = Lesson.FONTS, TAU = Math.PI * 2, clamp = U.clamp, smooth = U.smooth;
  const INK = '#1c2440', RED = '#c8401c', CARD = '#fffaf1', PAPER = '#f7f1e6', LINE = 'rgba(28,36,64,.16)';
  const round = (v, d = 10) => (isFinite(v) ? +(+v).toFixed(d) : v);
  const decimals = (x) => {
    x = Math.abs(x);
    for (let d = 0; d < 12; d++) { const m = x * Math.pow(10, d); if (Math.abs(m - Math.round(m)) < 1e-7 * Math.max(1, m)) return d; }
    return 12;
  };
  const TX = (x) => (x == null ? null : typeof x === 'string' || typeof x === 'number' ? { s: String(x) } : x);
  const pair = (v, d) => (v == null ? [d, d] : Array.isArray(v) ? v : [v, v]);
  const isHex = (c) => /^#[0-9a-f]{6}$/i.test(c);
  const dark = (c) => (isHex(c) ? U.mix(c, '#000000', .35) : INK);
  const soft = (c, a) => U.rgba(isHex(c) ? c : INK, a);
  const fC = (v) => { const r = round(v, 10); return U.fmt(r, Math.min(2, decimals(r))); };

  function lerpView(A, B, t) {
    t = clamp(t);
    const wA = A[1] - A[0], wB = B[1] - B[0], cA = (A[0] + A[1]) / 2, cB = (B[0] + B[1]) / 2;
    if (Math.abs(wA - wB) <= 1e-12 * Math.max(Math.abs(wA), Math.abs(wB))) { const m = cA + (cB - cA) * t; return [m - wA / 2, m + wA / 2]; }
    const w = wA * Math.pow(wB / wA, t), m = cA + (cB - cA) * (w - wA) / (wB - wA);
    return [m - w / 2, m + w / 2];
  }
  function nice(min) {
    if (!(min > 0)) return 1;
    const k = Math.floor(Math.log10(min));
    for (let j = k; j <= k + 1; j++) for (const m of [1, 2, 5]) { const s = round(m * Math.pow(10, j), 12); if (s >= min * (1 - 1e-9)) return s; }

  }

  // ── húzás és kattintás: képkockánként egyszer frissül (L.t szerint) ──
  // A gyors kattintás (le + fel egy képkockán belül) is számít: a lenyomást egy pointerdown-figyelő jegyzi fel.
  const DRAG = { id: null, t: NaN, was: false, pressed: false, hov: '', cur: '', stage: null, latch: 0 };
  function input(L) {
    if (DRAG.t === L.t) return;

    if (L.stage && DRAG.stage !== L.stage) { DRAG.stage = L.stage; L.stage.addEventListener('pointerdown', () => { DRAG.latch = performance.now(); }, true); }

    c.moveTo(0, 0); c.lineTo(-sz * 1.25, -sz * .62); c.lineTo(-sz * .95, 0); c.lineTo(-sz * 1.25, sz * .62); c.closePath();

    P.axes = (d = {}) => {
      input(L);

        }

/* kis ikonok (vázlat, nem méretarányos) */
function icon(kind, x, y, s, a) {
  al(a); c.save(); c.translate(x, y); c.lineCap = 'round'; c.lineJoin = 'round'; c.setLineDash([]);
  const r = s / 2;
  if (kind === 'atom') {
    c.fillStyle = U.rgba(TEAL, .18); c.beginPath(); c.arc(0, 0, r * .9, 0, TAU); c.fill();
    c.strokeStyle = TEAL; c.lineWidth = 2; c.beginPath(); c.ellipse(0, 0, r * .9, r * .38, -.5, 0, TAU); c.stroke();
    c.fillStyle = RED; c.beginPath(); c.arc(0, 0, r * .18, 0, TAU); c.fill();
    c.fillStyle = TEAL; c.beginPath(); c.arc(r * .78 * Math.cos(-.5), r * .78 * Math.sin(-.5) * .5 - r * .05, r * .12, 0, TAU); c.fill();
  } else if (kind === 'dns') {
    c.lineWidth = 2.5;
    for (let sgn = -1; sgn <= 1; sgn += 2) {
      c.strokeStyle = sgn < 0 ? RED : TEAL; c.beginPath();
      for (let i = 0; i <= 24; i++) { const t = i / 24, yy = -r + 2 * r * t, xx = sgn * r * .5 * Math.sin(t * TAU * 1.2); if (i) c.lineTo(xx, yy); else c.moveTo(xx, yy); }
      c.stroke();
    }
    c.strokeStyle = MUT; c.lineWidth = 1.5; c.beginPath();
    for (let i = 1; i < 8; i++) { const t = i / 8, yy = -r + 2 * r * t, xx = r * .5 * Math.sin(t * TAU * 1.2); c.moveTo(-xx, yy); c.lineTo(xx, yy); }
    c.stroke();
  } else if (kind === 'papir') {
    c.rotate(-.25); c.fillStyle = '#fbf7ee'; c.strokeStyle = INK; c.lineWidth = 2; rr(-r * .7, -r * .9, r * 1.4, r * 1.8, 2); c.fill(); c.stroke();
    c.strokeStyle = MUT; c.lineWidth = 1.5; c.beginPath(); for (let i = 0; i < 4; i++) { c.moveTo(-r * .45, -r * .5 + i * r * .35); c.lineTo(r * .45, -r * .5 + i * r * .35); } c.stroke();
  } else if (kind === 'ember') {
    c.strokeStyle = INK; c.lineWidth = 3; c.fillStyle = '#e8c9a8';
    c.beginPath(); c.arc(0, -r * .72, r * .2, 0, TAU); c.fill(); c.stroke();
    c.beginPath(); c.moveTo(0, -r * .5); c.lineTo(0, r * .25); c.moveTo(-r * .4, -r * .25); c.lineTo(r * .4, -r * .25);
    c.moveTo(0, r * .25); c.lineTo(-r * .3, r); c.moveTo(0, r * .25); c.lineTo(r * .3, r); c.stroke();
  } else if (kind === 'hegy') {
    c.fillStyle = '#b9a88a'; c.strokeStyle = INK; c.lineWidth = 2;
    c.beginPath(); c.moveTo(-r, r * .8); c.lineTo(-r * .1, -r * .8); c.lineTo(r * .3, -r * .1); c.lineTo(r * .5, -r * .35); c.lineTo(r, r * .8); c.closePath(); c.fill(); c.stroke();
    c.fillStyle = '#fbf7ee'; c.beginPath(); c.moveTo(-r * .1, -r * .8); c.lineTo(-r * .38, -r * .3); c.lineTo(-r * .15, -r * .4); c.lineTo(r * .1, -r * .3); c.closePath(); c.fill();
  } else if (kind === 'fold') {
    c.fillStyle = '#7fb3d8'; c.strokeStyle = BLUE; c.lineWidth = 2; c.beginPath(); c.arc(0, 0, r * .85, 0, TAU); c.fill();
    c.fillStyle = '#7fa860'; c.beginPath(); c.ellipse(-r * .25, -r * .15, r * .35, r * .25, .6, 0, TAU); c.fill();
    c.beginPath(); c.ellipse(r * .35, r * .3, r * .22, r * .3, -.3, 0, TAU); c.fill();
    c.beginPath(); c.arc(0, 0, r * .85, 0, TAU); c.stroke();
  } else if (kind === 'hold') {
    c.fillStyle = '#7fb3d8'; c.strokeStyle = BLUE; c.lineWidth = 2; c.beginPath(); c.arc(-r * .6, r * .2, r * .32, 0, TAU); c.fill(); c.stroke();
    c.strokeStyle = MUT; c.setLineDash([3, 4]); c.beginPath(); c.moveTo(-r * .25, r * .05); c.lineTo(r * .5, -r * .3); c.stroke(); c.setLineDash([]);
    c.fillStyle = '#cfcab9'; c.strokeStyle = INK; c.beginPath(); c.arc(r * .7, -r * .4, r * .18, 0, TAU); c.fill(); c.stroke();
  } else if (kind === 'nap') {
    c.strokeStyle = OCHRE; c.lineWidth = 2; c.beginPath();
    for (let i = 0; i < 10; i++) { const an = i / 10 * TAU; c.moveTo(-r * .35 + Math.cos(an) * r * .5, Math.sin(an) * r * .5); c.lineTo(-r * .35 + Math.cos(an) * r * .68, Math.sin(an) * r * .68); }
    c.stroke(); c.fillStyle = '#f0c24a'; c.beginPath(); c.arc(-r * .35, 0, r * .42, 0, TAU); c.fill(); c.stroke();
    c.fillStyle = '#7fb3d8'; c.strokeStyle = BLUE; c.beginPath(); c.arc(r * .8, 0, r * .14, 0, TAU); c.fill(); c.stroke();
  } else if (kind === 'feny') {
    c.strokeStyle = OCHRE; c.lineWidth = 3; c.beginPath(); c.moveTo(-r, 0); c.lineTo(r * .55, 0); c.stroke();
    c.fillStyle = OCHRE; c.beginPath(); c.moveTo(r, 0); c.lineTo(r * .5, -r * .3); c.lineTo(r * .5, r * .3); c.closePath(); c.fill();
    c.fillStyle = '#f0c24a'; c.strokeStyle = OCHRE; c.lineWidth = 1.5; c.beginPath();
    for (let i = 0; i < 10; i++) { const an = i / 10 * TAU - Math.PI / 2, rr2 = i % 2 ? r * .18 : r * .42; c.lineTo(-r * .7 + Math.cos(an) * rr2, Math.sin(an) * rr2); }
    c.closePath(); c.fill(); c.stroke();
  } else if (kind === 'tejut') {
    c.fillStyle = U.rgba('#7b4fa0', .15); c.beginPath(); c.ellipse(0, 0, r, r * .55, -.3, 0, TAU); c.fill();
    c.strokeStyle = '#7b4fa0'; c.lineWidth = 2.2;
    for (let arm = 0; arm < 2; arm++) {
      c.beginPath();
      for (let i = 0; i <= 30; i++) { const t = i / 30, an = arm * Math.PI + t * 4.2, rad = r * .15 + r * .8 * t; const xx = Math.cos(an) * rad, yy = Math.sin(an) * rad * .55; if (i) c.lineTo(xx, yy); else c.moveTo(xx, yy); }
      c.stroke();
    }
    c.fillStyle = '#f0c24a'; c.beginPath(); c.arc(0, 0, r * .15, 0, TAU); c.fill();
  }
  c.restore();
}

/* ════════ 1. Hajtsuk félbe! ════════ */
const S1 = { n: 7, from: 0, t0: 1.0 };
const FT = .75;               // egy hajtás animációja (s)
const SC1 = 1.55;             // felülnézet: px / mm
const MAG = 40;               // oldalnézet: a vastagság nagyítása (0,1 mm → 4 px)
function g1(st) { const d = Math.abs(S1.n - S1.from); if (!d) return S1.n; return S1.from + (S1.n - S1.from) * clamp((st - S1.t0) / (FT * d)); }
function sheet(k) { let w = num('A4 rövid oldala'), h = num('A4 hosszú oldala'); for (let i = 0; i < k; i++) { if (h >= w) h /= 2; else w /= 2; } return { w, h }; }
function set1(v) { S1.from = g1(L.st); S1.n = v; S1.t0 = L.st; }
function scene1(st, live) {
  const p0 = smooth(st / .5);
  title('cím 1', p0);
  const g = g1(st), k = Math.min(7, Math.floor(g + 1e-9)), p = U.inOut(g - k), sh = sheet(k);
  const half = sh.h >= sh.w ? 'h' : 'w', BX = 90, BY = 860, tpaper = num('papír vastagsága');
  const W = sh.w * SC1, Hh = sh.h * SC1;
  // ── felülnézet ──
  al(p0 * .5); c.setLineDash([8, 6]); c.strokeStyle = MUT; c.lineWidth = 2; c.strokeRect(BX, BY - num('A4 hosszú oldala') * SC1, num('A4 rövid oldala') * SC1, num('A4 hosszú oldala') * SC1); c.setLineDash([]);
  al(p0); L.tx(lab('felülnézet'), BX, 290, { k: 'felülnézet', s: 24, w: 700, f: F.B, b: 'middle', c: MUT });
  const paper = (x, y, w, h, back) => { al(p0); c.beginPath(); c.rect(x, y, w, h); c.fillStyle = back ? '#ece0c8' : '#fdf9f1'; c.fill(); c.strokeStyle = INK; c.lineWidth = 2.5; c.stroke(); };
  if (p > 0.001 && k < 7) {
    if (half === 'h') {
      paper(BX, BY - Hh / 2, W, Hh / 2, false);
      const yf = BY - Hh / 2, e = (Hh / 2) * Math.cos(Math.PI * p);
      paper(BX, Math.min(yf, yf - e), W, Math.abs(e), e < 0);
    } else {
      paper(BX, BY - Hh, W / 2, Hh, false);
      const xf = BX + W / 2, e = (W / 2) * Math.cos(Math.PI * p);
      paper(Math.min(xf, xf + e), BY - Hh, Math.abs(e), Hh, e < 0);
    }
  } else paper(BX, BY - Hh, W, Hh, false);
  const qA = clamp(1 - g * 1.5);
  if (qA > 0) { al(p0 * qA); L.tx(lab('A4'), BX + W / 2, BY - Hh / 2, { k: 'A4', s: 26, w: 700, f: F.B, a: 'center', b: 'middle', c: MUT }); }
  // ── oldalnézet: a vastagság MAG-szorosan ──
  const SX = 520, nL = pow2(k) * (1 + (k < 7 ? p : 0)), Hs = nL * tpaper * MAG;
  const Ws = (half === 'w' && k < 7 ? U.lerp(W, W / 2, p) : W);
  al(p0); L.tx(KN('oldalnézet', MAG).s, SX, 290, { k: 'oldalnézet', s: 24, w: 700, f: F.B, b: 'middle', c: MUT });
  al(p0); c.fillStyle = '#fdf9f1'; c.fillRect(SX, BY - Hs, Ws, Hs);
  const step = tpaper * MAG;
  al(p0 * .55); c.strokeStyle = MUT; c.lineWidth = 1; c.beginPath();
  for (let i = 1; i < nL; i++) { const y = Math.round(BY - i * step) + .5; c.moveTo(SX, y); c.lineTo(SX + Ws, y); }
  c.stroke();
  al(p0); c.strokeStyle = INK; c.lineWidth = 2.5; c.strokeRect(SX, BY - Hs, Ws, Hs);
  // vonalzó (mm)
  const RX = 880, MMPX = MAG; // 1 mm a nagyított oldalnézetben
  al(p0); c.strokeStyle = INK; c.lineWidth = 2; c.beginPath(); c.moveTo(RX, BY); c.lineTo(RX, BY - 13 * MMPX); c.stroke();
  for (let mm = 0; mm <= 13; mm++) {
    const y = BY - mm * MMPX; al(p0); c.beginPath(); c.moveTo(RX, y); c.lineTo(RX + (mm % 2 ? 10 : 18), y); c.stroke();
    if (mm % 2 === 0) { al(p0); L.tx(mm === 12 ? '12 mm' : String(mm), RX + 26, y, { s: 22, w: 500, f: F.M, b: 'middle', c: INK }); }
  }
  // ── kiírás ──
  const kd = Math.round(g), lay = pow2(kd), th = lay * tpaper / 1000;
  const CX = 1170;
  al(p0); L.pill(KN('rétegek sablon', fm(lay)).s, CX, 360, { k: 'rétegek sablon', s: 30, w: 700, f: F.B, a: 'center', c: RED, bg: CARD, bd: RED, bw: 2.5, pad: 12 });
  MT('`2^' + kd + ' = ' + fm(lay) + '`', CX, 432, { s: 38, a: 'center' }, p0);
  al(p0); L.tx(KN('vastagság sablon', fmtLen(th)).s, CX, 516, { k: 'vastagság sablon', s: 28, w: 700, f: F.B, a: 'center', b: 'middle', c: INK });
  MT('0,1 mm · 2^' + kd, CX, 572, { s: 34, a: 'center', c: MUT }, p0);
  const kh = Math.round(num('kézi hajtások')), qh = smooth((g - kh + .6) / .5);
  if (qh > 0) { al(p0 * qh); L.pill(KN('kézi határ', kh).s, CX, 660, { k: 'kézi határ', s: 24, w: 600, f: F.B, a: 'center', c: OCHRE, bg: CARD, bd: OCHRE, bw: 2, pad: 10 }); }
  // ── tipp ──
  const qt = smooth((st - S1.t0 - FT * 7 - .4) / .6);
  if (qt > 0) {
    card(944, 740, 400, 270, RED, p0 * qt);
    al(p0 * qt); L.tx(lab('tipp kérdés'), 964, 782, { k: 'tipp kérdés', s: 24, w: 700, f: F.B, b: 'middle', c: RED, max: 370 });
    ['tipp 1', 'tipp 2', 'tipp 3'].forEach((kk, i) => {
      const q = smooth((st - S1.t0 - FT * 7 - .7 - i * .25) / .4);
      al(p0 * qt * q); c.beginPath(); c.arc(978, 846 + i * 56, 15, 0, TAU); c.strokeStyle = INK; c.lineWidth = 2.5; c.stroke();
      al(p0 * qt * q); L.tx(String.fromCharCode(65 + i), 978, 847 + i * 56, { s: 22, w: 700, f: F.B, a: 'center', b: 'middle', c: INK });
      al(p0 * qt * q); L.tx(lab(kk), 1004, 846 + i * 56, { k: kk, s: 24, w: 600, f: F.B, b: 'middle', c: INK, max: 330 });
    });
  }
  if (live) CK.s1 = { k: kd, lay, area: sheet(kd).w * sheet(kd).h, a4: num('A4 rövid oldala') * num('A4 hosszú oldala'), Hs: nL === pow2(kd) ? Hs : null };
}

/* ════════ 2. Duplázás: a kettő hatványai ════════ */
const S2 = { n: 10, from: 2, t0: .4 };
let P2 = null;
function g2(st) { const d = Math.abs(S2.n - S2.from); if (!d) return S2.n; return S2.from + (S2.n - S2.from) * U.inOut(clamp((st - S2.t0) / Math.max(.6, .3 * d))); }
function set2(v) { S2.from = g2(L.st); S2.n = v; S2.t0 = L.st; }
const V2 = (g) => ({ x: [0, Math.max(g, 4) + 1], y: [0, Math.max(pow2(g), g + 1) * 1.22] });

  MT(lab('görbe tévhit'), lx + 58, ly + 56, { k: 'görbe tévhit', s: 34, f: F.B, c: TEAL }, p0);

  const m = MatText.measure(L, lbl.s, { s: 34 });

  card(bx - 12, by - 30, m.w + 24, 60, RED, p0);
  MTk(lbl, bx, by, { s: 34, c: RED }, p0);
  const ty = clamp(P2.Y(kd + 1) - 34, 330, P2.ax() - 46);

/* ════════ 3. A kitevők összeadódnak ════════ */
const S3 = { mode: 'mul', m: 3, n: 4, t0: 0, btn: {} };
function sync3() { Object.keys(S3.btn).forEach((k) => S3.btn[k].classList.toggle('on', k === S3.mode)); }
function set3(mode) { S3.mode = mode; S3.t0 = L.st; sync3(); }
function tile(x, y, s, col, a, faded) {
  al(a * (faded ? .28 : 1)); rr(x, y, s, s, 10); c.fillStyle = U.rgba(col, .14); c.fill(); c.strokeStyle = col; c.lineWidth = 3; c.stroke();
  al(a * (faded ? .28 : 1)); L.tx('2', x + s / 2, y + s / 2 + 1, { s: Math.round(s * .55), w: 700, f: F.M, a: 'center', b: 'middle', c: col === RED ? '#a3330f' : col });
}
function scene3(st, live) {
  const p0 = smooth(st / .5), m = S3.m, n = S3.n, mode = S3.mode, t = st - S3.t0;
  title('cím 3', p0);
  const q = U.inOut((t - .5) / 1.1), qr = smooth((t - 1.7) / .5);
  let count = 0, expo = 0, formula, valS;
  const X0 = 110, S = 62, PT = 72;
  if (mode === 'mul') {
    expo = m + n;
    for (let i = 0; i < m; i++) { tile(X0 + i * PT, U.lerp(300, 470, q), S, RED, p0); count++; }
    for (let i = 0; i < n; i++) { tile(U.lerp(X0 + i * PT, X0 + (m + i) * PT, q), U.lerp(400, 470, q), S, TEAL, p0); count++; }
    const qa = 1 - smooth(q * 3);
    if (qa > 0) {
      MT('`2^' + m + '`', X0 + m * PT + 14, 331, { s: 40, c: RED }, p0 * qa);
      MT('`2^' + n + '`', X0 + n * PT + 14, 431, { s: 40, c: TEAL }, p0 * qa);
    }
    formula = KN('szorzás sablon', m, n, m + n);
    al(p0 * qr); L.tx(KN('hajtás magyarázat', m, n, m + n).s, X0, 600, { k: 'hajtás magyarázat', s: 26, w: 600, f: F.B, b: 'middle', c: MUT });
  } else if (mode === 'div') {

    if (CK.s1.Hs != null) add('1: oldalnézet magassága = 2^k · 0,1 mm · 40', Math.abs(CK.s1.Hs - pow2(CK.s1.k) * num('papír vastagsága') * MAG) < 1e-6, CK.s1.Hs, pow2(CK.s1.k) * 4);
  }
  if (s === 1 && CK.s2) {
    add('2: táblázat = 2^k', CK.s2.rows.every((v, k) => v === Math.round(Math.pow(2, k))), CK.s2.rows.length, 11);
    add('2: a pont a görbén', Math.abs(CK.s2.py - CK.s2.want) < .5, CK.s2.py, CK.s2.want);
  }
  if (s === 2 && CK.s3 && CK.s3.done) {
    const C = CK.s3, want = C.mode === 'div' ? C.expo : C.expo;
    add('3: csempék száma = kitevő', C.count === want, C.count, want);
  }
  if (s === 3 && CK.s4) add('4: szomszédos oszlopok aránya = a', CK.s4.heights.every((h, i) => i === 0 || Math.abs(h / CK.s4.heights[i - 1] - CK.s4.a) < 1e-9), CK.s4.a, CK.s4.a);
  if (s === 4 && CK.s5) add('5: vastagság = 0,1 mm · 2^n', Math.abs(CK.s5.tk - base('papír vastagsága') * pow2(CK.s5.kd)) < 1e-12 * pow2(CK.s5.kd), CK.s5.tk, CK.s5.kd);
  if (s === 5 && CK.s6) {
    const C = CK.s6;
    add('6: a · 10^n = v', Math.abs(C.a * Math.pow(10, C.n) / C.v - 1) < 1e-9, C.a * Math.pow(10, C.n), C.v);
    add('6: 1 ≤ a < 10', C.a >= 1 && C.a < 10, C.a, '[1; 10[');
    add('6: lépések = |n|', C.steps === Math.abs(C.n), C.steps, Math.abs(C.n));
  }
  if (s === 6 && CK.s7) {
    add('7: a jelölő a 10-es kitevő helyén', CK.s7.cards.every((cd) => Math.abs(cd.x - NL7.x(cd.e)) < .01), CK.s7.cards.length, OBJ.length);
    add('7: hányados normálalakja', Math.abs(CK.s7.nq.a * Math.pow(10, CK.s7.nq.n) / CK.s7.q - 1) < 5e-3, CK.s7.nq.a, CK.s7.q);
  }
  if (s === 7 && CK.s8) add('8: eltérés = |tipp − valódi| (kitevőben)', Math.abs(CK.s8.d - Math.abs(Math.log10(Math.pow(10, CK.s8.g) / base(Q8[S8.q].d)))) < 1e-9, CK.s8.d, '');
  if (s === 8 && CK.s9) add('9: a Világegyetem-hajtás a legkisebb elég nagy', CK.s9.over && CK.s9.under, CK.s9.nU, num('Világegyetem-hajtás'));
  return out;
}
