(function () {
'use strict';
const U = Lesson.U, { clamp, smooth } = U;
const F = Lesson.FONTS;

/* ── MODUL: Síkgeometria (MatGeo) · forrás: matematika-5-6/14-haromszogek, 2026-11-23 ── */
/* API  (v1.0) – húzható, mérő síkgeometria a lecke-motor (shared/lesson.js) fölött.
   Nem hivatkozik a lecke kódjára; a MatText-et (shared/matek/mtext.js) csak akkor használja, ha be van töltve.
   Minden vászonszöveget L.tx ír (a QA és a review mód látja), a 'k' opció a .md-kulcs.
   Minden rajzoló save/restore-ral dolgozik: a vászon állapota (alfa, vonalstílus, szaggatás) változatlan marad.

   const G = MatGeo.create(L, {origin: [x, y], unit: 40, yUp: true, hitR: 28, handleR: 12, keyStep: .25,
                               clip: [0, 0, 1360, 1080]})
     Világkoordináták egységben (unit px = 1 egység, pl. 1 cm). yUp: true → az y felfelé nő, a szög pozitív
     iránya az óramutatóval ellentétes (matematikai). G.op: a jelenet átlátszósága (minden rajzolót szoroz).
     Az opciók közös mezői: op (átlátszóság 0..1), c (szín; null → nincs körvonal), w (vonalvastagság), dash.
   Koordináták:  G.X(x) · G.Y(y) · G.s(p) → [px, py] · G.w(px, py) → {x, y} · G.P(p) → {x, y}
                 Minden rajzoló és mérő pontként elfogad: 'A' (pont-id), [x, y] vagy {x, y}.
   Pontok:       G.pt(id, x, y, {name, c, off, drag: {snap, box: [x0, y0, x1, y1], constrain(p, G, pt) → p | null,
                                                    onDrag(pt, G)}})  → pont-objektum (újrahívva felülírja)
                 G.p(id) · G.set(id, x, y | p) (szabály nélkül) · G.move(id, x, y | p) (húzás-szabályokkal → bool) ·
                 G.ids() · G.setHome() (a mostani hely lesz az alap) · G.reset() · G.save() → {id: [x, y]} · G.load(s)
   Húzás:        G.update()  minden képkockán, amíg a jelenet aktív – enélkül a húzás nem él (több G is élhet egy
                 leckében; mindig csak az aktív reagál). Egér/érintés: a fogantyú 28 px-ről megfogható.
                 G.drag (épp húzott id | null) · G.touched (húzták-e a G.reset óta) · G.ver (változásszámláló)
                 G.key(e) → true, ha kezelte: Tab (Shift+Tab) a következő pont, W/A/S/D mozgat (Shift: 4×) –
                 a lecke cfg.onKey-éből hívd. G.handles({ids, c, op, pulse}) – fogantyúk (látható r 12);
                 pulse: 0..1 fázis (pl. L.st · 0,7) → hívogató gyűrű.
   Rajz:         G.seg(A, B, {t, ticks}) · G.line(A, B) · G.ray(A, B) (a clip-téglalapig) ·
                 G.circle(O, r, {fill}) · G.arc(O, r, a0, a1, {t, px}) (fok, a0 ≤ a1, pozitív irány; px: r képpontban) ·
                 G.sector(O, rPx, a0, a1, {fill, jag: {seed, n, amp}}) körcikk (jag: tépett ív) ·
                 G.sectorPath(O, rPx, a0, a1, jag) (csak útvonal, beginPath nélkül – kivágáshoz) ·
                 G.poly(pts, {fill, open, rule}) · G.dot(P, {r, hollow}) · G.ticks(A, B, n, {len, gap}) egyenlőségjel ·
                 G.angle(A, O, B, {r, reflex, t, show, name, d, fs, lr, tc, fill, k, right, rightStyle, arc})
                   → {deg, a0, a1, mid, lx, ly, lw, lh}. A felirat helye (lr nélkül) a doboz méretéből jön: nem ér
                   az ívhez, szűk szögnél a szárakhoz sem. Az ív OA-tól OB-ig; reflex: false → a kisebbik (≤ 180°), true →
                   pozitív irányban OA-tól OB-ig (konvex sokszög belső szöge: G.angle(next, V, prev, {reflex: true}),
                   ha a csúcsok pozitív körüljárásúak). show: 'value' | 'name' | 'both' | 'none'. bg: szín → a felirat mögé
                   lekerekített folt (vonalakon átlógó feliratnál). Az érték a rajzolt
                   geometriából jön (d tizedes, alap 0). right: 'auto' (alap) → 90°-nál derékszögjel
                   (rightStyle: 'dot' ív ponttal – magyar szokás; 'square' négyzet). dry: true → semmit sem rajzol,
                   csak kiszámolja (pl. a felirat helyét, ütközésvizsgálathoz).
                 G.right(A, O, B, o) derékszögjel mindenképp · G.name(P, s, {from, dir, off, k}) pontnév (Fraunces dőlt;
                 'from' ponttól kifelé vagy 'dir' fokban, off px) · G.label(s, P, {dx, dy, …L.tx-opciók}) ·
                 G.beside(P, fok, w, h, gap) → [px, py]: egy w×h px-es felirat középpontja P mellett, fok irányban
                   (pl. oldalhossz a szakasz felezőpontjától kifelé) ·
                 G.grid({x0, y0, x1, y1, step, every, c, strong}) ·
                 G.protractor(O, dir, {r, read, nums, c, fill, op}) szögmérő: középpont O, a 0° iránya dir (fok),
                   0…180° pozitív irányban; read: kiemelt érték (fok) · G.piece(poly, {m | from, to, t, ghost, …poly})
                   sokszög merev mozgással → az elmozdított csúcsok
   Mérés:        G.dist · G.dir(A, B) (fok) · G.deg(A, O, B) (0…180) · G.ccw(A, O, B) (0…360) · G.mid · G.lerp ·
                 G.polar(O, fok, r, px?) · G.centroid(pts) · G.sarea(pts) (előjeles; + = pozitív körüljárás) ·
                 G.area · G.perim · G.inner(pts) → belső szögek (homorú csúcsnál > 180°) · G.convex · G.simple
                 (nem metszi önmagát) · G.foot(P, A, B)
   Metszés:      G.meet.ll(A, B, C, D) → p | null (egyenesek) · G.meet.ss (szakaszok) · G.meet.lc(A, B, O, r) → [p…] ·
                 G.meet.cc(O1, r1, O2, r2) → [p…]
   Mozgatás:     G.reflect(P, A, B) · G.rotate(P, O, fok) · G.shift(P, v) · G.scale(P, O, k) ·
                 G.cut(poly, A, B) → [bal, jobb] (konvex sokszög kettévágása) ·
                 MatGeo.motion(m, P) (m = {O: forgáspont, rot: fok, dx, dy}) · MatGeo.lerpMotion(m0, m1, t)
   Ugrás:        MatGeo.snapGrid(p, step) ·
                 G.snapLoci(p, [{pt}, {line: [A, B]}, {circle: [O, r]}], rPx) → {p, hit} (metszéspont előnyben) ·
                 G.snapAngles(p, [Q, Qr], [S, Sr], {step: 1, min, max, ok(k1, k2), prefer(k1, k2), preferR: px, win: 2})
                   → p | null: a p-hez legközelebbi pont, amelynél a Q-ban (QQr és Qp) és az S-ben (SSr és Sp) mért
                   szög a step egész többszöröse (prefer → ezeket preferR px-en belül előnyben részesíti). Háromszögnél
                   (Q, S a másik két csúcs) így mindhárom szög egész fok, és a kiírt összeg pontosan 180°.
   Formázás:     MatGeo.fmtDeg(v, d) '50°' · MatGeo.fmtLen(v, d, 'cm') '4,2 cm' ·
                 MatGeo.fmtSet(vals, d, dmax, eps) → szövegek: az egyenlők egyformán, a különbözők (szükség esetén
                 több tizedessel) különbözőnek látszanak
   Egyéb:        MatGeo.C {ink, mut, red, teal, okr, card, good, bad} · MatGeo.V {sub, add, mul, dot, cross, len, rot,
                 dir, polar} vektor-segédek ({x, y}) · MatGeo.rgba(hex, a)
   ──────────────────────────────────────────────────────────────────────────────── */
const MatGeo = (() => {
  const D = Math.PI / 180;
  const C = { ink: '#1c2440', mut: '#565d72', red: '#c8401c', teal: '#0a6f86', okr: '#8f5a0c', card: '#fffaf1', good: '#1d7a45', bad: '#b3261e' };
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; };
  const n360 = (a) => ((a % 360) + 360) % 360;
  const sub = (a, b) => ({ x: a.x - b.x, y: a.y - b.y }), add = (a, b) => ({ x: a.x + b.x, y: a.y + b.y });
  const mul = (a, k) => ({ x: a.x * k, y: a.y * k }), dot = (a, b) => a.x * b.x + a.y * b.y, cross = (a, b) => a.x * b.y - a.y * b.x;
  const len = (a) => Math.hypot(a.x, a.y);
  const rot = (v, deg) => { const co = Math.cos(deg * D), si = Math.sin(deg * D); return { x: v.x * co - v.y * si, y: v.x * si + v.y * co }; };
  const dirOf = (v) => n360(Math.atan2(v.y, v.x) / D);
  const polar = (O, deg, r) => ({ x: O.x + Math.cos(deg * D) * r, y: O.y + Math.sin(deg * D) * r });
  const toP = (a) => Array.isArray(a) ? { x: a[0], y: a[1] } : a;
  const llx = (A, B, P, Q) => { const r = sub(B, A), s = sub(Q, P), den = cross(r, s); if (Math.abs(den) < 1e-12) return null; const t = cross(sub(P, A), s) / den; return add(A, mul(r, t)); };
  const fmt = (v, d = 0) => window.Lesson.U.fmt(v, d);
  const fmtDeg = (v, d = 0) => fmt(v, d) + '°';
  const fmtLen = (v, d = 1, u = 'cm') => fmt(v, d) + (u ? ' ' + u : '');
  function fmtSet(vals, d = 1, dmax = 3, eps = 1e-6) {
    const rep = vals.map((v, i) => { for (let j = 0; j < i; j++) if (Math.abs(vals[j] - v) <= eps) return vals[j]; return v; });
    let k = d;
    for (; k < dmax; k++) {
      const s = rep.map((v) => fmt(v, k)); let ok = true;
      for (let i = 0; i < s.length && ok; i++) for (let j = i + 1; j < s.length; j++) if (Math.abs(rep[i] - rep[j]) > eps && s[i] === s[j]) { ok = false; break; }
      if (ok) break;
    }
    return rep.map((v) => fmt(v, k));
  }
  function motion(m, p) {
    p = toP(p); let q = { x: p.x, y: p.y };
    if (m.rot) { const O = toP(m.O || [0, 0]); q = add(O, rot(sub(q, O), m.rot)); }
    return { x: q.x + (m.dx || 0), y: q.y + (m.dy || 0) };
  }
  function lerpMotion(a, b, t) {
    a = a || {}; b = b || {}; const Oa = toP(a.O || b.O || [0, 0]), Ob = toP(b.O || a.O || [0, 0]);
    return { O: { x: lerp(Oa.x, Ob.x, t), y: lerp(Oa.y, Ob.y, t) }, rot: lerp(a.rot || 0, b.rot || 0, t), dx: lerp(a.dx || 0, b.dx || 0, t), dy: lerp(a.dy || 0, b.dy || 0, t) };
  }
  const snapGrid = (p, step) => ({ x: Math.round(p.x / step) * step, y: Math.round(p.y / step) * step });
  const hash = (seed, i) => { let h = (Math.imul(seed | 0, 374761393) + Math.imul(i | 0, 668265263)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
  const segX = (a, b, p, q) => {   // zárt szakaszok metszik-e egymást
    const o = (u, v, w) => { const k = cross(sub(v, u), sub(w, u)); return Math.abs(k) < 1e-12 ? 0 : Math.sign(k); };
    const on = (u, v, w) => Math.min(u.x, v.x) - 1e-12 <= w.x && w.x <= Math.max(u.x, v.x) + 1e-12 && Math.min(u.y, v.y) - 1e-12 <= w.y && w.y <= Math.max(u.y, v.y) + 1e-12;
    const o1 = o(a, b, p), o2 = o(a, b, q), o3 = o(p, q, a), o4 = o(p, q, b);
    if (o1 !== o2 && o3 !== o4) return true;
    return (!o1 && on(a, b, p)) || (!o2 && on(a, b, q)) || (!o3 && on(p, q, a)) || (!o4 && on(p, q, b));
  };

  function create(L, o = {}) {
    const ctx = () => L.ctx, F = window.Lesson.FONTS;
    const G = {
      L, ox: (o.origin || [0, 0])[0], oy: (o.origin || [0, 0])[1], u: o.unit || 40, yUp: o.yUp !== false,
      hitR: o.hitR || 28, handleR: o.handleR || 12, clip: o.clip || [0, 0, L.VW, L.H], keyStep: o.keyStep || .25,
      pts: {}, order: [], op: 1, drag: null, hover: null, sel: null, touched: false, ver: 0, _live: -1e9, C,
    };
    const sg = G.yUp ? -1 : 1;
    G.X = (x) => G.ox + x * G.u; G.Y = (y) => G.oy + sg * y * G.u;
    G.P = (a) => typeof a === 'string' ? G.pts[a] : toP(a);
    G.s = (a) => { const p = G.P(a); return [G.X(p.x), G.Y(p.y)]; };
    G.w = (px, py) => ({ x: (px - G.ox) / G.u, y: (py - G.oy) / (sg * G.u) });
    const SA = (deg) => sg * deg * D;                                          // világ-szög → vászon-szög (rad)
    const scr = (deg) => ({ x: Math.cos(deg * D), y: sg * Math.sin(deg * D) }); // képernyő-irányvektor
    const alpha = (q) => { ctx().globalAlpha = clamp(G.op * (q && q.op != null ? q.op : 1)); };
    const stroke = (q, dc, dw) => { const c = ctx(); c.strokeStyle = q.c || dc; c.lineWidth = q.w || dw; c.setLineDash(q.dash || []); c.lineCap = q.cap || 'round'; c.lineJoin = 'round'; c.stroke(); };

    // ── pontok ──
    G.pt = (id, x, y, po = {}) => { if (!G.pts[id]) G.order.push(id); const p = Object.assign({ id, home: [x, y] }, po); p.x = x; p.y = y; G.pts[id] = p; G.ver++; return p; };
    G.p = (id) => G.pts[id];
    G.ids = () => G.order.slice();
    G.set = (id, x, y) => { const p = G.pts[id]; if (typeof x === 'object') { const q = toP(x); x = q.x; y = q.y; } if (p.x !== x || p.y !== y) { p.x = x; p.y = y; G.ver++; } return p; };
    G.move = (id, x, y) => {
      const p = G.pts[id], d = p.drag || {}; let r = typeof x === 'object' ? Object.assign({}, toP(x)) : { x, y };
      if (d.snap) r = snapGrid(r, d.snap);
      if (d.box) r = { x: clamp(r.x, d.box[0], d.box[2]), y: clamp(r.y, d.box[1], d.box[3]) };
      if (d.constrain) { r = d.constrain(r, G, p); if (!r) return false; }
      if (d.box && (r.x < d.box[0] - 1e-9 || r.y < d.box[1] - 1e-9 || r.x > d.box[2] + 1e-9 || r.y > d.box[3] + 1e-9)) return false;
      G.set(id, r.x, r.y); G.touched = true; if (d.onDrag) d.onDrag(p, G); return true;
    };
    G.setHome = () => { for (const id of G.order) G.pts[id].home = [G.pts[id].x, G.pts[id].y]; };
    G.reset = () => { for (const id of G.order) { const p = G.pts[id]; p.x = p.home[0]; p.y = p.home[1]; } G.drag = null; G.sel = null; G.touched = false; G.ver++; };
    G.save = () => { const s = {}; for (const id of G.order) s[id] = [G.pts[id].x, G.pts[id].y]; return s; };
    G.load = (s) => { for (const id in s) if (G.pts[id]) G.set(id, s[id][0], s[id][1]); };

    // ── húzás: mutató + billentyű ──
    const now = () => (window.performance ? performance.now() : Date.now());
    const live = () => now() - G._live < 250;
    const draggable = () => G.order.filter((id) => G.pts[id].drag && !G.pts[id].off);
    const hitTest = (sx, sy) => { let best = null, bd = G.hitR; for (const id of draggable()) { const [x, y] = G.s(id), dd = Math.hypot(x - sx, y - sy); if (dd < bd) { bd = dd; best = id; } } return best; };
    const stage = L.stage;
    if (L.canvas) L.canvas.style.touchAction = 'none';
    if (L.layer) L.layer.style.touchAction = 'none';
    stage.addEventListener('pointerdown', (e) => {
      if (!live() || (e.target && e.target.closest && e.target.closest('#lesson-panel'))) return;
      const q = L.toStage(e); if (q.x > L.VW) return;
      const id = hitTest(q.x, q.y); if (!id) return;
      const [x, y] = G.s(id); G.drag = id; G.sel = null; G._off = { x: x - q.x, y: y - q.y };
      stage.style.cursor = 'grabbing'; e.preventDefault();
    });
    window.addEventListener('pointermove', (e) => {
      const q = L.toStage(e);
      if (G.drag) { G.move(G.drag, G.w(q.x + G._off.x, q.y + G._off.y)); e.preventDefault(); return; }
      if (!live()) return;
      const h = q.x <= L.VW ? hitTest(q.x, q.y) : null;
      if (h !== G.hover) { G.hover = h; stage.style.cursor = h ? 'grab' : ''; }
    });
    const up = () => { if (G.drag) { G.drag = null; stage.style.cursor = G.hover ? 'grab' : ''; } };
    window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
    G.update = () => { G._live = now(); return G; };
    G.key = (e) => {
      if (!live()) return false;
      const ids = draggable(); if (!ids.length) return false;
      if (e.key === 'Tab') {
        const i = ids.indexOf(G.sel), n = ids.length;
        G.sel = ids[i < 0 ? (e.shiftKey ? n - 1 : 0) : (i + (e.shiftKey ? n - 1 : 1)) % n]; e.preventDefault(); return true;

/* ════════ 1. Mekkora a (3 + 5)²? ════════ */

  // 7. bűvésztrükk: a darabok az (x + 1)² négyzetet adják
  { const x = S7.n, T = 99;
    ck('7: a darabok területe = x(x + 2) + 1 = (x + 1)²', near(sumA(['sq', 'b1', 'b2', 'one'], D7, T), (x + 1) * (x + 1)), sumA(['sq', 'b1', 'b2', 'one'], D7, T), (x + 1) * (x + 1));
    ck('7: a csík a négyzet tetején', MatDarab.same(D7.pts('b2', T), REC(0, x, x, 1), 1e-9), 'b2', '[0; x] × [x; x + 1]');
    ck('7: az egység a sarokban', MatDarab.same(D7.pts('one', T), REC(x, x, 1, 1), 1e-9), 'one', '[x; x + 1]²');
    ck('7: √(x(x + 2) + 1) − x = 1', Math.sqrt(x * (x + 2) + 1) - x === 1, Math.sqrt(x * (x + 2) + 1) - x, 1); }
  // 8. a keret 8 darabja: területük 8k, egymást nem fedik, sorokba rendezve k hosszúak
  { const k = S8.k, n = 2 * k + 1, T = 99, A = P8.reduce((s, p) => s + MatDarab.area(p.r), 0);
    let ov = 0; for (let i = 0; i < 8; i++) for (let j = i + 1; j < 8; j++) { const I = MatDarab.inter(P8[i].r, P8[j].r); ov += I.length ? MatDarab.area(I) : 0; }
    const inRing = P8.every((p) => MatDarab.inter(p.r, REC(1, 1, n - 2, n - 2)).length === 0 && p.r.every(([x, y]) => x >= -1e-9 && y >= -1e-9 && x <= n + 1e-9 && y <= n + 1e-9));
    ck('8: a keret = (2k + 1)² − (2k − 1)² = 8k', near(A, n * n - (n - 2) * (n - 2)) && near(A, 8 * k), A, 8 * k);
    ck('8: a darabok nem fedik egymást, és a keretben vannak', ov < 1e-9 && inRing, 'átfedés ' + ov, 0);
    ck('8: a sorok k hosszúak, a helyükön', P8.every((p) => MatDarab.same(D8.pts(p.id, T), REC(p.tg.x - k / 2, p.tg.y - .5, k, 1), 1e-9)), 'sorok', '8 × [k × 1]'); }
  return out;
}

/* ════════════════════════════════════════════════════════════════ */
const sT = new Array(9).fill(0);
const SCENES = [scene1, scene2, scene3, scene4, scene5, scene6, scene7, scene8, scene9];
const btnText = (k) => { const d = L.dat(k); return Array.isArray(d.v) ? d.v.map(nf).join(' · ') : nf(d.v) + '²'; };
function mark6() { EX6.forEach((k) => S6.btn[k] && S6.btn[k].classList.toggle('on', S6.mode === k)); }
function set6(mode, n) { S6.mode = mode; if (n != null) S6.n = n; S6.t0 = L.st; mark6(); }
function setPair(S, k, v, other) {               // csúszkapár; az 5. lépésben b ≤ a − 0,5
  S[k] = v;
  if (other) { if (S.b > S.a - .5) { if (k === 'a') { S.b = Math.max(.5, S.a - .5); S.sb && S.sb.set(S.b); } else { S.a = Math.min(8, S.b + .5); S.sa && S.sa.set(S.a); if (S.b > S.a - .5) { S.b = S.a - .5; S.sb && S.sb.set(S.b); } } } }
}
function pairSliders(S, ka, kb, ra, rb, step, five) {
  S.sa = L.slider({ label: lab(ka), k: ka, min: ra[0], max: ra[1], step, value: S.a, format: (v) => nf(v), onInput: (v) => setPair(S, 'a', v, five) });
  S.sb = L.slider({ label: lab(kb), k: kb, min: rb[0], max: rb[1], step, value: S.b, format: (v) => nf(v), onInput: (v) => setPair(S, 'b', v, five) });
}
const reset2 = () => { S2.a = num('kezdő a'); S2.b = num('kezdő b'); };
const reset3 = () => { S3.a = num('példa a'); S3.b = num('példa b'); };
const reset4 = () => { S4.a = num('levágás a'); S4.b = num('levágás b'); };
const reset5 = () => { S5.a = num('különbség a'); S5.b = Math.min(num('különbség b'), S5.a - .5); };
const sync = (S) => { S.sa && S.sa.set(S.a); S.sb && S.sb.set(S.b); };

L = Lesson.create({
  content: window.LESSON_CONTENT,
  home: false,
  resetCtx: true,
  steps: [
    { settle: 7 },
    { settle: 4.5,
      enter() { reset2(); sync(S2); },
      controls() { reset2(); pairSliders(S2, 'a csúszka', 'b csúszka', [1.5, 8], [1.5, 6], .5); } },
    { settle: 6,
      enter() { reset3(); sync(S3); },
      controls() { reset3(); pairSliders(S3, 'a csúszka 3', 'b csúszka 3', [-9, 9], [-9, 9], 1); } },
    { settle: 7.5,
      enter() { reset4(); sync(S4); },
      controls() { reset4(); pairSliders(S4, 'a csúszka 4', 'b csúszka 4', [1, 8], [.5, 6], .5); } },
    { settle: 7,
      enter() { reset5(); sync(S5); },
      controls() { reset5(); pairSliders(S5, 'a csúszka 5', 'b csúszka 5', [2, 8], [.5, 5], .5, true); } },
    { settle: 4,
      enter() { S6.mode = EX6[0]; S6.n = num('négyzet 1'); S6.t0 = 0; mark6(); if (S6.sld) S6.sld.set(S6.n); },
      controls() {
        EX6.forEach((k) => { S6.btn[k] = L.button(btnText(k), () => set6(k), k); });
        S6.sld = L.slider({ label: lab('saját szám'), k: 'saját szám', min: 11, max: 99, step: 1, value: num('négyzet 1'), format: (v) => nf(v), onInput: (v) => set6('saját', v) });
        mark6();
      } },
    { settle: 7,
      enter() { S7.n = num('gondolt szám'); S7.t0 = 0; mk7(); if (S7.sld) S7.sld.set(S7.n); },
      controls() {
        S7.sld = L.slider({ label: lab('gondolt csúszka'), k: 'gondolt csúszka', min: 1, max: 12, step: 1, value: num('gondolt szám'), format: (v) => nf(v), onInput: (v) => { S7.n = v; S7.t0 = L.st; mk7(); } });
        L.button(lab('újra 7'), () => { S7.t0 = L.st; }, 'újra 7');
      } },
    { settle: 6,
      enter() { S8.k = (num('páratlan példa') - 1) / 2; mk8(); if (S8.sld) S8.sld.set(S8.k); },
      controls() { S8.sld = L.slider({ label: lab('k csúszka'), k: 'k csúszka', min: 1, max: 6, step: 1, value: (num('páratlan példa') - 1) / 2, format: (v) => nf(v), onInput: (v) => { S8.k = v; mk8(); } }); } },
    { settle: 3.5 },
  ],
  init(Lx) {
    L = Lx; c = L.ctx;
    const g1 = geo1(); G1 = MatGeo.create(L, { origin: [90, 990], unit: Math.min(64, 512 / g1.s) }); H1 = MatDarab.create(G1);
    reset2(); G2 = MatGeo.create(L, { origin: [80, 980], unit: U2 }); D2 = MatDarab.create(G2); add2();
    D2.key('r1', [{ t: T2.ex, m: {} }, { t: T2.ex + .8, m: { dx: GP2 } }]);
    D2.key('r2', [{ t: T2.ex, m: {} }, { t: T2.ex + .8, m: { dy: GP2 } }]);
    D2.key('bb', [{ t: T2.ex, m: {} }, { t: T2.ex + .8, m: { dx: GP2, dy: GP2 } }]);
    reset3();
    reset4(); G4 = MatGeo.create(L, { origin: [150, 1000], unit: 50 }); D4 = MatDarab.create(G4); add4();
    reset5(); G5 = MatGeo.create(L, { origin: [150, 960], unit: 60 }); D5 = MatDarab.create(G5); key5();
    G6 = MatGeo.create(L, { origin: [90, 940], unit: 1 }); H6 = MatDarab.create(G6);
    S7.n = num('gondolt szám'); G7 = MatGeo.create(L, { origin: [90, 980], unit: 50 }); D7 = MatDarab.create(G7); mk7();
    S8.k = (num('páratlan példa') - 1) / 2; G8 = MatGeo.create(L, { origin: [80, 1010], unit: U8 }); D8 = MatDarab.create(G8); mk8();
    // a .md eredményei ↔ a lecke számolása
    const n1 = num('négyzet 1'), [p1, q1] = L.dat('szorzat 1').v, [p2, q2] = L.dat('szorzat 2').v, po = num('páratlan példa');
    MatText.check(L, 'négyzet 1 értéke', n1 * n1);
    MatText.check(L, 'szorzat 1 értéke', p1 * q1);
    MatText.check(L, 'szorzat 2 értéke', p2 * q2);
    MatText.check(L, 'páratlan különbség', po * po - (po - 2) * (po - 2));
    for (const k of ['szorzat 1', 'szorzat 2']) { const [p, q] = L.dat(k).v; if ((p + q) % 2) err('Ellenőrzés: a .md „' + k + '” adatában a két szám összege legyen páros (egy kerek szám körül egyformán messze).'); }
    if (po % 2 !== 1) err('Ellenőrzés: a .md „páratlan példa” adata legyen páratlan szám.');
    if (!Number.isInteger(Math.sqrt(num('szorzattá példa')))) err('Ellenőrzés: a .md „szorzattá példa” adata legyen négyzetszám (pl. 9, 16, 25).');
    L.checks = checks;
    L.poke = (o) => {
      const i = L.step;
      const pair = (S, five) => { if ('a' in o) setPair(S, 'a', o.a, five); if ('b' in o) setPair(S, 'b', o.b, five); sync(S); };
      if (i === 1) pair(S2); if (i === 2) pair(S3); if (i === 3) pair(S4); if (i === 4) pair(S5, true);
      if (i === 5) { if (o.mode) set6(o.mode, o.n); if (o.n != null) { set6('saját', o.n); S6.sld.set(o.n); } if (o.ago != null) S6.t0 = L.st - o.ago; }
      if (i === 6) { if (o.n != null) { S7.n = o.n; mk7(); S7.sld.set(o.n); } if (o.at != null) S7.t0 = L.st - o.at; }
      if (i === 7 && o.k != null) { S8.k = o.k; mk8(); S8.sld.set(o.k); }
    };
  },
  draw(Lx) {
    L = Lx; c = L.ctx; GA = 1; background();
    const sp = L.sp;
    if (L.step >= 0) sT[L.step] = L.st;
    SCENES.forEach((f, i) => {
      const w = clamp(1 - Math.abs(sp - i) * 2); if (w <= .005) return;
      GA = w; c.save(); c.globalAlpha = w; f(sT[i]); c.restore();
    });
    c.globalAlpha = 1;
  },
});

  3: [{ name: 'neg-neg', set: poke({ a: -9, b: -9 }) }, { name: 'nulla', set: poke({ a: 0, b: 5 }) }, { name: 'ellentett', set: poke({ a: 6, b: -6 }) }, { name: 'poz', set: poke({ a: 9, b: 8 }) }],

  6: [{ name: 'n103', set: poke({ mode: 'négyzet 2', ago: 9 }) }, { name: 'p49', set: poke({ mode: 'szorzat 1', ago: 9 }) }, { name: 'p99', set: poke({ mode: 'szorzat 2', ago: 9 }) },
    { name: 'sajat70', set: poke({ n: 70, ago: 9 }) }, { name: 'sajat11', set: poke({ n: 11, ago: 9 }) }, { name: 'sajat99', set: poke({ n: 99, ago: 9 }) }, { name: 'sajat45', set: poke({ n: 45, ago: 9 }) }],
  7: [{ name: 'n1', set: poke({ n: 1, at: 9 }) }, { name: 'n12', set: poke({ n: 12, at: 9 }) }, { name: 'forgas', set: poke({ at: 3.3 }) }, { name: 'n3', set: poke({ n: 3, at: 9 }) }],
  8: [{ name: 'k1', set: poke({ k: 1 }) }, { name: 'k6', set: poke({ k: 6 }) }, { name: 'k2', set: poke({ k: 2 }) }],
};
})();
