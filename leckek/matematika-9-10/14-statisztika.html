<script>
(function () {
'use strict';
const U = Lesson.U, { clamp, lerp, smooth, TAU } = U, fmt = U.fmt;
const F = Lesson.FONTS;

/* ── MODUL: Diagramok (MatChart) · forrás: matematika-5-6/17-statisztika, 2026-11-24 · v1.1 (2026-11-24) ──────
   Oszlop-, kör-, vonal- és pontdiagram; oszlop → szalag → kör morf; strigula; kockatornyok (átlag mint
   kiegyenlítés); rendezhető kártyasor (medián); átlag/medián/módusz jelzővonalak; „kitalált adat” bélyeg.
   Csak a Lesson motorra (L.ctx, L.tx, L.pill, L.measure, L.pointer, Lesson.U, Lesson.FONTS) és – ha be van
   töltve – a MatQ-ra (shared/matek/mtext.js: pontos átlag) épül; lecke-specifikus kódra nem hivatkozik.
   Minden felirat {s, k} pár (szöveg + .md-kulcs); kulcs nélkül csak a tengelyszám és a számolt érték megy ki.
   Az állapot zárt képletű: a mozgó elemek t (0..1) fázist kapnak. o.a: abszolút átlátszóság (a lecke a saját
   áttűnés-szorzóját adja bele). Minden függvény save/restore-ral visszaállítja a vászonállapotot.

   Színek: MatChart.COL {ink, mut, red, teal, ochre, plum, blue, green, card, grid, good, bad}; MatChart.PAL – a
   kategóriák színei sorban (cinóber, kékeszöld, okker, szilva, kék, zöld); MatChart.fill(col) világos kitöltés,
   MatChart.edge(col) sötét körvonal (szerződés 6.: a körvonal mindig a sötét változat).

   ── Oszlop- és vonaldiagram (kategória-tengely) ──
   const ch = MatChart.create(L, {x, y, w, h,     // a rajzterület; a tengelyek a bal és az alsó szélén
                                  n,              // kategóriák (oszlopok) száma
                                  min = 0, max,   // függőleges tartomány; min > 0: levágott tengely (cikcakk jel)
                                  step,           // rácsköz (alap: 1–2–5 lépcső, kb. 6 osztás)
                                  gap = .35})     // oszlopköz a sávszélesség arányában (0: hisztogram)
   ch.X(i) az i. sáv közepe (i tört is lehet) · ch.Y(v) · ch.base (a vízszintes tengely y-ja) · ch.band · ch.bw
   ch.set({…}) – ugyanazok a mezők (pl. animált max) · ch.ticks() → [v…] · ch.hit(px, py) → sáv indexe | −1
   ch.axes({a, t (kirajzolás 0..1), cats: [{s, k}], cs = 24 (kategóriafelirat px), cc (szín), yName: {s, k},
            xName: {s, k}, grid = true, every = 1 (minden hányadik osztás kap számot), fmt (v → szöveg), ys = 22,
            cut (alap: min > 0 → cikcakk), arrow = true (y), xArrow = false})
   ch.bars(vals, {a, t (0..1 vagy [t_i]: felnövés), cols: [..] | col, values: true | fmt(v, i) | [{s, k}], vs = 26,
                  hi: i | [i], dim = .25, ghost: [v…] (szaggatott körvonal, pl. elméleti érték), units: 0..1 (az
                  egységek választóvonala: „egy kocka = egy adat”), bw (px)}) → [{i, x, y, w, h}]
          Az értékfeliratok dobozát (ch.labs: [[x, y, w, h]…], az utolsó bars-hívásé) a ghost szaggatott kerete és a
          ch.hline vonala kikerüli (rés a vonalban) – a felirat akkor is olvasható, ha az oszlop teteje a vonal közelében van.
   ch.cell(i, k) → {x, y, w, h} – az i. oszlop k. egységkockája (alulról, 0-tól): ide repülhet egy adat
   ch.line(vals, {a, c, w = 4, t (kirajzolás 0..1), dots = 8 (sugár; 0: nincs), dotCols: [..], values, vs})
          → [[px, py]…]
   ch.hline(v, {c, w = 3, dash, a, label: {s, k}, side: 'right' | 'left', avoid = true (rés a ch.labs feliratoknál;
            false: a vonal megszakítás nélkül fut)})   – vízszintes szint (pl. átlag)

   ── Kördiagram ──
   MatChart.pie(L, {cx, cy, r, vals, cols, a, t (körbefutás 0..1), start = −π/2 (fölül, óramutató szerint),
                    names: [{s, k}] (kívül, vezetővonallal), sub: (i, fr, deg, v) → szöveg | null (a név alatti
                    sor), ns = 24, hi, dim = .25, lr = 1.16 (feliratsugár / r), na (a feliratok átlátszósága)})
          → [{a0, a1, mid, fr, deg}]
   MatChart.arcs(vals, start) → ugyanez rajzolás nélkül

   ── Oszlop → kör morf ── a lefekvő oszlopok szalaggá (szalagdiagram) állnak össze, a szalag körré görbül, majd
   körcikkekké telik, és a kezdete felülre fordul. A szalag hossza 2πr, ezért a görbülés pontosan zár.
   MatChart.morph(L, ch, vals, {cx, cy, r}, t, {a, cols, h0 = 56 (a szalag vastagsága), hi, dim})
          t: 0 oszlopdiagram … 1 kördiagram; fázisok [0; .35] lefekszik, [.35; .72] görbül, [.72; 1] telik.
          A két végállapot alakra azonos a ch.bars és a MatChart.pie (start = −π/2) rajzával.
   MatChart.morphPt(ch, vals, P, t, i, u, v, h0) → [x, y] – az i. darab pontja (u: hossz 0..1, v: 0 kívül … 1 belül)

   ── Strigula ── ötösével: négy álló vonás + egy áthúzó
   MatChart.tally(L, n, x, y, {h = 46, dx = 14, g = 26, c, w = 3.5, t (kirajzolt vonások, tört is; alap n), a})
          → {w} · MatChart.tallyAt(j, x, y, o) → [x, y] a j. vonás közepe · MatChart.tallyW(n, o)

   ── Kockatornyok (átlag = kiegyenlítés) ──
   MatChart.towers(L, {vals (egészek), x (az első torony közepe), dx (toronyköz), base (alap y), cell (kockaméret),
          t (0 eredeti … 1 kiegyenlített), cols, a, level = true (szaggatott szintvonal a végén), lw (szintvonal
          túlnyúlása)}) → {n, sum, q, r, mean (szám), meanQ (MatQ | null), levelY, top: [y…] (a tornyok teteje)}
          A szint fölötti kockák (felülről) a hiányzó helyekre repülnek; ha az összeg nem osztható, a maradék r
          kockát n egyenlő szeletre vágja, minden toronyra r szelet jut → magasság q + r/n.
          Fázisok: r = 0: [0; 1] repülés; r > 0: [0; .55] repülés, [.55; .7] vágás, [.7; 1] szeletek.

   ── Pontdiagram (húzható) ──
   const D = MatChart.dotplot(L, {x0, x1, y (tengely), min, max, step = 1, r = 17, dy = 2r + 4, hitR = 30})
          D.X(v) · D.inv(px) · D.axis({a, name: {s, k}, every = 1, fmt, s = 24})
          D.draw(vals, {a, col | cols(i), hi: [i], move: {i, from, t} (az i. pötty ívben repül from-ból vals[i]-be)})
                 → [{i, x, y}] – az azonos értékek index szerint egymásra halmozódnak
          D.update(vals, {onChange(i, v)}) → a húzott index | −1 – minden képkockán hívd (a D.draw után); L.pointer
                 (pressed/down); egészre (step) ugrik, [min; max]-ban marad · D.drag – a húzott index (−1: nincs) ·
                 D.sel – kijelölt pötty (szaggatott gyűrű) · D.reset()
          D.key(e, vals, onChange) → true, ha kezelte: Tab / Shift+Tab kijelöl, A/D (Shift: 3×) mozgat
   Jelzővonalak: MatChart.marks(L, {X (v → px), y0 (alul), y1 (a vonal teteje), items: [{v, c, label: {s, k}, dash,
          w}], a, s = 24, rowH = 48, xmin, xmax}) → [{x, row, box}] – függőleges vonalak; ütköző feliratok egymás fölé
   Kártyasor (medián): MatChart.cards(L, {vals, x (a sor közepe), y (teteje), w = 88, h = 104, gap = 16,
          from: [hely…], to: [hely…] (az i. kártya helye; alap: from = index, to = rendezett hely), t, hi: {i: szín},
          a, s = 44}) → [{i, x, y, w, h}] – a kártyák felváltva fölfelé/lefelé ívben cserélnek helyet
   Statisztika: MatChart.stats(vals) → {n, sum, mean, meanQ (MatQ | null), median, modes: [v…] (minden érték, ha
          mind egyszer fordul elő: maxf = 1), maxf, sorted, rank: [i → rendezett hely] (stabil)}
          MatChart.rank(vals) · MatChart.nice(span, n) → lépésköz
   Bélyeg: MatChart.stamp(L, {s, k}, x, y, {a, c}) – „kitalált adat” (Bricolage 22, 600, −3°, keret 2 px; (x, y) bal közép)
   Jelmagyarázat: MatChart.legend(L, [{s, k, c}], x, y, {dir: 'right' | 'down', s = 24, gap = 26, a}) → {w, h}
   v1.1 (2026-11-24): a ghost és a hline nem húzza át az oszlopok értékfeliratát (ch.labs, avoid).
   ──────────────────────────────────────────────────────────────────────────────────────────────────────────── */
const MatChart = (() => {
  'use strict';
  const U = Lesson.U, F = Lesson.FONTS, clamp = U.clamp, lerp = U.lerp, sm = U.smooth, TAU = Math.PI * 2;
  const COL = { ink: '#1c2440', mut: '#565d72', red: '#c8401c', teal: '#0a6f86', ochre: '#8f5a0c', plum: '#7b3f8c',
    blue: '#1b5a94', green: '#3d6b1f', card: '#fffaf1', grid: 'rgba(28,36,64,.08)', good: '#1d7a45', bad: '#b3261e' };
  const PAL = [COL.red, COL.teal, COL.ochre, COL.plum, COL.blue, COL.green];
  const fill = (col) => U.mix(col, '#fffaf1', .34);
  const edge = (col) => U.mix(col, '#1c2440', .28);
  const colOf = (o, i) => (Array.isArray(o.cols) ? o.cols[i % o.cols.length] : typeof o.cols === 'function' ? o.cols(i) : o.col || PAL[i % PAL.length]);
  const A = (o) => (o && o.a != null ? clamp(o.a) : 1);
  const his = (o) => (o.hi == null ? null : [].concat(o.hi));
  const nice = (span, n = 6) => { const raw = span / Math.max(1, n), p = Math.pow(10, Math.floor(Math.log10(raw))), m = raw / p; return (m < 1.5 ? 1 : m < 3 ? 2 : m < 7 ? 5 : 10) * p; };
  const arrowHead = (c, x, y, ang, s = 14) => {
    c.beginPath(); c.moveTo(x + Math.cos(ang) * s * .2, y + Math.sin(ang) * s * .2);
    c.lineTo(x - Math.cos(ang - .42) * s, y - Math.sin(ang - .42) * s); c.lineTo(x - Math.cos(ang + .42) * s, y - Math.sin(ang + .42) * s);
    c.closePath(); c.fill();
  };

  /* ── oszlop- és vonaldiagram ── */
  function create(L, o0) {
    const o = Object.assign({ min: 0, gap: .35 }, o0), ch = { L };
    ch.set = (q) => {
      Object.assign(o, q || {});
      ch.n = Math.max(1, o.n || 1); ch.min = o.min || 0; ch.max = o.max; ch.step = o.step || nice(ch.max - ch.min);
      ch.x = o.x; ch.y = o.y; ch.w = o.w; ch.h = o.h; ch.band = o.w / ch.n; ch.bw = ch.band * (1 - o.gap); ch.base = o.y + o.h;
      return ch;
    };
    ch.set();
    ch.X = (i) => o.x + (i + .5) * ch.band;
    ch.Y = (v) => o.y + o.h - (v - ch.min) / (ch.max - ch.min) * o.h;
    ch.ticks = () => { const out = []; for (let v = Math.ceil(ch.min / ch.step - 1e-9) * ch.step; v <= ch.max + 1e-9; v += ch.step) out.push(+v.toPrecision(12)); return out; };
    ch.hit = (px, py) => { if (py < o.y - 20 || py > ch.base + 60) return -1; const i = Math.floor((px - o.x) / ch.band); return i >= 0 && i < ch.n ? i : -1; };
    ch.axes = (ao = {}) => {
      const c = L.ctx, a = A(ao), t = ao.t == null ? 1 : clamp(ao.t); if (a <= 0 || t <= 0) return;
      const x0 = o.x, y0 = ch.base, x1 = o.x + o.w, yt = o.y, fmt = ao.fmt || ((v) => U.fmt(v, ch.step < 1 ? Math.min(3, Math.ceil(-Math.log10(ch.step) - 1e-9)) : 0));
      c.save(); c.globalAlpha = a;
      if (ao.grid !== false) {
        c.strokeStyle = COL.grid; c.lineWidth = 2; c.beginPath();
        for (const v of ch.ticks()) { if (Math.abs(v - ch.min) < 1e-9) continue; const y = ch.Y(v); c.moveTo(x0, y); c.lineTo(lerp(x0, x1, t), y); }
        c.stroke();
      }
      c.strokeStyle = COL.ink; c.fillStyle = COL.ink; c.lineWidth = 2.5; c.lineCap = 'round'; c.lineJoin = 'round';
      c.beginPath(); c.moveTo(x0, y0); c.lineTo(lerp(x0, x1 + (ao.xArrow ? 34 : 12), t), y0); c.moveTo(x0, y0); c.lineTo(x0, lerp(y0, yt - 34, t)); c.stroke();
      if (t >= 1) { if (ao.arrow !== false) arrowHead(c, x0, yt - 34, -Math.PI / 2); if (ao.xArrow) arrowHead(c, x1 + 34, y0, 0); }
      const cut = ao.cut == null ? ch.min > 0 : ao.cut;
      if (cut) {   // levágott tengely: cikcakk a tengely alján
        const yc = y0 - 18; c.fillStyle = COL.card; c.fillRect(x0 - 9, yc - 9, 18, 18);
        c.beginPath(); c.moveTo(x0, y0); c.lineTo(x0, yc + 9); c.lineTo(x0 - 8, yc + 4); c.lineTo(x0 + 8, yc - 4); c.lineTo(x0, yc - 9); c.stroke();
      }
      const ta = clamp((t - .4) / .6);
      if (ta > 0) {
        c.globalAlpha = a * ta; c.strokeStyle = COL.ink; c.lineWidth = 2;
        const every = ao.every || 1;
        ch.ticks().forEach((v, j) => {
          const y = ch.Y(v); c.beginPath(); c.moveTo(x0 - 8, y); c.lineTo(x0, y); c.stroke();
          if (j % every === 0) L.tx(fmt(v), x0 - 14, y, { f: F.M, s: ao.ys || 22, w: 500, a: 'right', b: 'middle', c: COL.mut });
        });
        if (ao.cats) ao.cats.forEach((ct, i) => { if (ct) L.tx(ct.s, ch.X(i), y0 + 12, { k: ct.k, s: ao.cs || 24, w: 600, f: F.B, a: 'center', b: 'top', c: ao.cc || COL.ink }); });
        if (ao.yName) L.tx(ao.yName.s, x0 + 20, yt - 30, { k: ao.yName.k, s: 22, w: 700, f: F.B, a: 'left', b: 'middle', c: COL.mut });
        if (ao.xName) L.tx(ao.xName.s, x1 + (ao.xArrow ? 34 : 12), y0 + 14 + (ao.cats ? (ao.cs || 24) + 10 : 0), { k: ao.xName.k, s: 22, w: 700, f: F.B, a: 'right', b: 'top', c: COL.mut });
      }
      c.restore();
    };
    ch.cell = (i, k) => { const bw = ch.bw, yb = ch.Y(ch.min + k), yt = ch.Y(ch.min + k + 1); return { x: ch.X(i) - bw / 2, y: yt, w: bw, h: yb - yt }; };
    // a vonal a dobozokon (értékfeliratok) kívül: kivágás páros–páratlan szabállyal (a dobozok nem fedik egymást)
    const avoidClip = (c, boxes) => {
      if (!boxes || !boxes.length) return false;
      c.beginPath(); c.rect(-4000, -4000, 8000, 8000);
      boxes.forEach(([x, y, w, h]) => c.rect(x, y, w, h));
      c.clip('evenodd'); return true;
    };
    ch.labs = [];
    ch.bars = (vals, bo = {}) => {
      const c = L.ctx, a = A(bo), H = his(bo), out = [], bw = bo.bw || ch.bw;
      ch.labs = [];
      if (a <= 0) return out;
      // az értékfeliratok szövege és doboza előre (a ghost kerete ezeket kerüli)
      const tOf = (i) => (Array.isArray(bo.t) ? clamp(bo.t[i]) : bo.t == null ? 1 : clamp(bo.t));
      const vsz = bo.vs || 26, labs = vals.map((v, i) => {
        const ti = tOf(i); if (!bo.values || ti <= .98) return null;
        const lv = Array.isArray(bo.values) ? bo.values[i] : null;
        const s = lv ? lv.s : typeof bo.values === 'function' ? bo.values(v, i) : U.fmt(v, Math.abs(v - Math.round(v)) < 1e-9 ? 0 : 1);

const INK = '#1c2440', MUT = '#565d72', RED = '#c8401c', TEAL = '#0a6f86', OCHRE = '#8f5a0c', PLUM = '#7b3f8c', GOOD = '#1d7a45', BAD = '#b3261e',

const sT = [];   // a jelenetek utolsó ideje (áttűnéshez)
const ST = MatChart.stats;

/* ── háttér: meleg papír + 40 px-es rács ── */
function background() {

  c.fillStyle = g; c.fillRect(0, 0, 1920, 1080);
  c.strokeStyle = 'rgba(28,36,64,.05)'; c.lineWidth = 1; c.beginPath();
  for (let x = 0; x <= 1920; x += 40) { c.moveTo(x + .5, 0); c.lineTo(x + .5, 1080); }
  for (let y = 0; y <= 1080; y += 40) { c.moveTo(0, y + .5); c.lineTo(1920, y + .5); }
  c.stroke();
}
function mark(ok, x, y, s, col) {
  c.save(); c.strokeStyle = col || (ok ? GOOD : BAD); c.lineWidth = Math.max(4, s * .16); c.lineCap = 'round'; c.lineJoin = 'round'; c.beginPath();
  if (ok) { c.moveTo(x - s * .45, y); c.lineTo(x - s * .1, y + s * .35); c.lineTo(x + s * .5, y - s * .4); }
  else { c.moveTo(x - s * .4, y - s * .4); c.lineTo(x + s * .4, y + s * .4); c.moveTo(x + s * .4, y - s * .4); c.lineTo(x - s * .4, y + s * .4); }
  c.stroke(); c.restore();
}
const stampK = (k, x, y, a, col) => MatChart.stamp(L, K(k), x, y, { a: GA * clamp(a), c: col });
function arrow(x0, y0, x1, y1, col, w = 3, dash) {
  const ang = Math.atan2(y1 - y0, x1 - x0), s = 14;
  c.save(); c.strokeStyle = col; c.fillStyle = col; c.lineWidth = w; c.lineCap = 'round'; if (dash) c.setLineDash(dash);
  c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1 - Math.cos(ang) * s * .6, y1 - Math.sin(ang) * s * .6); c.stroke(); c.setLineDash([]);
  c.beginPath(); c.moveTo(x1, y1); c.lineTo(x1 - Math.cos(ang - .42) * s, y1 - Math.sin(ang - .42) * s); c.lineTo(x1 - Math.cos(ang + .42) * s, y1 - Math.sin(ang + .42) * s); c.closePath(); c.fill();
  c.restore();
}
/* szám: egész → pontos, különben ≈ d tizedes */
const isInt = (v) => Math.abs(v - Math.round(v)) < 1e-9;
const eqStr = (v, d = 1) => (isInt(v) ? ': ' + fmt(Math.round(v)) : ' ≈ ' + fmt(v, d));
/* kvartilisek: a medián nélküli két fél mediánja */
function quart(vals) {
  const s = vals.slice().sort((p, q) => p - q), n = s.length, h = Math.floor(n / 2);
  return { min: s[0], q1: medOf(s.slice(0, h)), med: medOf(s), q3: medOf(s.slice(n - h)), max: s[n - 1], sorted: s };
}
const sdS = (v) => (isInt(v) ? '= ' + fmt(Math.round(v)) : '≈ ' + fmt(v, 2));
const sdOf = (a) => { const m = meanOf(a); return Math.sqrt(a.reduce((s, v) => s + (v - m) * (v - m), 0) / a.length); };
function corr(a, b) {
  const ma = meanOf(a), mb = meanOf(b); let sab = 0, saa = 0, sbb = 0;
  a.forEach((x, i) => { const dx = x - ma, dy = b[i] - mb; sab += dx * dy; saa += dx * dx; sbb += dy * dy; });
  return saa && sbb ? sab / Math.sqrt(saa * sbb) : 0;
}

/* ── adatok (init-ben) ── */
let BER = [], OWN = 6000, JEGY = [], PA = [], PB = [], SCR = [], VA = 52, VB = 48, AX0 = 45;
let TEMP = [], ICE = [], BURN = [], BANDS = [];
const CK = {};

/* ════════ mérleghinta (1–2. lépés) ════════ */
const SEE = { x0: 130, x1: 1230, py: 560, gy: 640, k: .0016, tmax: .13 };
const seeX = (v, view) => SEE.x0 + (v - view[0]) / (view[1] - view[0]) * (SEE.x1 - SEE.x0);
/* o = {vals, view, f, r, cols(i), tq (a forgatónyomaték értékei; alap: vals), a, drop(i) → 0..1 (leesés), label(i) → {s, k} | null} */
function seesaw(o) {
  const a = o.a, view = o.view, f = o.f, r = o.r, Xf = seeX(f, view);
  const tq = (o.tq || o.vals).reduce((s, v) => s + (v - f), 0), th = clamp(tq * SEE.k, -SEE.tmax, SEE.tmax);
  const cs = Math.cos(th), sn = Math.sin(th), P = (d, h) => [Xf + d * cs + h * sn, SEE.py + d * sn - h * cs];
  // talaj = tengely
  const step = view[1] - view[0] > 2000 ? 1000 : 50;
  c.save(); al(a); c.strokeStyle = INK; c.lineWidth = 2.5; c.lineCap = 'round';
  c.beginPath(); c.moveTo(SEE.x0 - 50, SEE.gy); c.lineTo(SEE.x1 + 50, SEE.gy); c.stroke();
  c.lineWidth = 2;
  for (let v = Math.ceil(view[0] / step) * step; v <= view[1] + 1e-9; v += step) {
    const x = seeX(v, view); c.beginPath(); c.moveTo(x, SEE.gy); c.lineTo(x, SEE.gy + 9); c.stroke();
    L.tx(fmt(v), x, SEE.gy + 14, { f: F.M, s: 22, w: 500, a: 'center', b: 'top', c: MUT });
  }
  c.restore();
  al(a); SEE.lb = T('bér tengely', SEE.x1 + 50, SEE.gy + 50, { s: 22, w: 700, f: F.B, a: 'right', b: 'top', c: MUT });
  // alátámasztás
  c.save(); al(a); c.lineJoin = 'round';
  c.beginPath(); c.moveTo(Xf, SEE.py + 9); c.lineTo(Xf - 36, SEE.gy); c.lineTo(Xf + 36, SEE.gy); c.closePath();
  c.fillStyle = MatChart.fill(RED); c.fill(); c.strokeStyle = MatChart.edge(RED); c.lineWidth = 3; c.stroke(); c.restore();
  // deszka
  const dl = SEE.x0 - 40 - Xf, dr = SEE.x1 + 40 - Xf;
  c.save(); al(a); c.beginPath();
  const q = [P(dl, 9), P(dr, 9), P(dr, -9), P(dl, -9)]; c.moveTo(q[0][0], q[0][1]); q.slice(1).forEach((p) => c.lineTo(p[0], p[1])); c.closePath();
  c.fillStyle = '#e8d6b4'; c.fill(); c.strokeStyle = '#6b5a3e'; c.lineWidth = 2.5; c.lineJoin = 'round'; c.stroke(); c.restore();
  // súlyok: azonos helyen egymásra
  const idx = o.vals.map((v, i) => i).sort((p, q2) => o.vals[p] - o.vals[q2] || p - q2), lev = [], placed = [];
  const pk = o.pack || 0, thr = lerp(2 * r + 3, r * .9, pk), lh = lerp(2 * r + 3, r * 1.6, pk);
  idx.forEach((i) => { const x = seeX(o.vals[i], view); let l = 0; while (placed.some((p) => p.l === l && Math.abs(p.x - x) < thr)) l++; lev[i] = l; placed.push({ x, l }); });
  const pos = [];
  o.vals.forEach((v, i) => {
    const d = seeX(v, view) - Xf, h = 9 + r + 1 + lev[i] * lh;
    let [x, y] = P(d, h);
    const dp = o.drop ? o.drop(i) : 1; if (dp <= 0) return;
    y -= (1 - dp) * (1 - dp) * 520;
    const col = o.cols ? o.cols(i) : TEAL, act = o.hi === i;
    c.save(); al(a * clamp(dp * 3));
    if (act) { c.beginPath(); c.arc(x, y, r + 8, 0, TAU); c.fillStyle = U.rgba(col, .2); c.fill(); }
    c.beginPath(); c.arc(x, y, r, 0, TAU); c.fillStyle = MatChart.fill(col); c.fill(); c.strokeStyle = MatChart.edge(col); c.lineWidth = 3; c.stroke();
    if (o.sel === i) { c.setLineDash([5, 4]); c.beginPath(); c.arc(x, y, r + 8, 0, TAU); c.lineWidth = 2; c.stroke(); c.setLineDash([]); }
    if (r >= 24) L.tx(fmt(v), x, y + 1, { f: F.M, s: 22, w: 700, a: 'center', b: 'middle', c: MatChart.edge(col) });
    c.restore();
    pos.push({ i, x, y, col, dp });
  });
  pos.forEach((q) => {   // felirat a súly (és a szomszédos halom) fölé
    const lb = o.label ? o.label(q.i) : null; if (!lb || q.dp < 1) return;
    const top = Math.min(...pos.filter((w) => Math.abs(w.x - q.x) < 2 * r + 90).map((w) => w.y));
    al(a); L.pill(lb.s, q.x, top - r - 30, { k: lb.k, s: 24, w: 700, f: F.B, a: 'center', c: MatChart.edge(q.col), bg: CARD, bd: q.col, pad: 9 });
  });
  return { pos, th, Xf, tq };
}
/* átlag- és medián-jelző a talaj alatt */
function centerPills(view, f, med, a, fStr) {
  const Xf = seeX(f, view), Xm = seeX(med, view), y1 = SEE.gy + 92, y2 = SEE.gy + 150;
  c.save(); al(a); c.strokeStyle = TEAL; c.lineWidth = 3; c.setLineDash([10, 6]);
  const lb = SEE.lb, gap = lb && Xm > lb.x - 8 && Xm < lb.x + lb.w + 8;   // ne menjen át a tengelyfeliraton
  c.beginPath(); c.moveTo(Xm, SEE.gy + 4);
  if (gap) { c.lineTo(Xm, lb.y - 6); c.moveTo(Xm, lb.y + lb.h + 6); }
  c.lineTo(Xm, y2 - 22); c.stroke(); c.setLineDash([]);
  c.fillStyle = TEAL; c.beginPath(); c.moveTo(Xm, SEE.gy + 2); c.lineTo(Xm - 9, SEE.gy + 16); c.lineTo(Xm + 9, SEE.gy + 16); c.closePath(); c.fill(); c.restore();
  const cl = (x, w) => clamp(x, 40 + w / 2, 1330 - w / 2);
  const sM = lab('medián') + eqStr(med), wM = L.measure(sM, { s: 24, w: 700, f: F.B }).w + 24;
  al(a); L.pill(sM, cl(Xm, wM), y2, { k: 'medián', s: 24, w: 700, f: F.B, a: 'center', c: TEAL, bg: CARD, bd: TEAL, pad: 11 });
  const sA = lab('átlag') + fStr, wA = L.measure(sA, { s: 24, w: 700, f: F.B }).w + 24;
  al(a); L.pill(sA, cl(Xf, wA), y1, { k: 'átlag', s: 24, w: 700, f: F.B, a: 'center', c: RED, bg: CARD, bd: RED, pad: 11 });
}
/* az alátámasztás helye: f0-ból késleltetve az adatok átlagába */
const fulcrum = (S, st, target, dur = 1.1) => lerp(S.f0, target, smooth((st - S.t0 - .35) / dur));
/* húzás a deszkán (saját: a súlyok a dőlt deszkán ülnek) */
function dragSee(S, pos, view, onChange) {
  const p = L.pointer;
  if (S.drag < 0 && p.pressed && p.px <= L.VW) {
    let best = -1, bd = 32; pos.forEach((q) => { const d = Math.hypot(q.x - p.px, q.y - p.py); if (d < bd) { bd = d; best = q.i; } });
    if (best >= 0) { S.drag = best; S.sel = best; }
  }
  if (S.drag >= 0) {
    if (!p.down) S.drag = -1;
    else { const v = clamp(Math.round((view[0] + (p.x - SEE.x0) / (SEE.x1 - SEE.x0) * (view[1] - view[0])) / 10) * 10, 350, 650); if (v !== S.vals[S.drag]) onChange(S.drag, v); }
  }
  let hov = false; if (p.inside && p.x <= L.VW) pos.forEach((q) => { if (Math.hypot(q.x - p.x, q.y - p.y) < 32) hov = true; });
  if (L.stage) L.stage.style.cursor = S.drag >= 0 ? 'grabbing' : hov ? 'grab' : '';

/* ════════ 1. Az átlag: az egyensúly pontja ════════ */
const S1 = { vals: [], f0: 0, t0: -30, drag: -1, sel: -1 };
const V1 = [350, 650];
function reset1() { S1.vals = BER.slice(); S1.f0 = meanOf(BER); S1.t0 = -30; S1.drag = -1; S1.sel = -1; }
function change1(i, v) { const st = L.st; S1.f0 = fulcrum(S1, st, meanOf(S1.vals)); S1.t0 = st; S1.vals[i] = v; }
const drop1 = (st) => (i) => clamp((st - .3 - i * .12) / .5);
function scene1(st, live) {
  const p0 = smooth(st / .5), m = meanOf(S1.vals), f = fulcrum(S1, st, m);
  al(p0); T('bérek cím', 680, 92, { f: F.D, i: true, s: 46, w: 500, a: 'center' });
  stampK('kitalált adat', 1110, 150, p0);
  const R = seesaw({ vals: S1.vals, view: V1, f, r: 26, a: p0, drop: drop1(st), cols: () => TEAL, hi: S1.drag, sel: S1.sel });
  const pa = smooth((st - 1.6) / .5);
  centerPills(V1, f, medOf(S1.vals), pa, eqStr(f));
  // eltérések összege a két oldalon
  let ls = 0, rs = 0; S1.vals.forEach((v) => { if (v < f) ls += f - v; else rs += v - f; });
  const pb = smooth((st - 2.2) / .5), yb = 850, Xf = R.Xf;
  if (pb > 0) {
    const sc = .5 * (SEE.x1 - SEE.x0) / (V1[1] - V1[0]);
    const lw = Math.min(ls * sc, Xf - 60), rw = Math.min(rs * sc, 1320 - Xf);
    c.save(); al(pb);
    c.fillStyle = MatChart.fill(TEAL); c.fillRect(Xf - lw, yb + 44, lw, 24); c.strokeStyle = MatChart.edge(TEAL); c.lineWidth = 2.5; c.strokeRect(Xf - lw, yb + 44, lw, 24);
    c.fillStyle = MatChart.fill(OCHRE); c.fillRect(Xf, yb + 44, rw, 24); c.strokeStyle = MatChart.edge(OCHRE); c.strokeRect(Xf, yb + 44, rw, 24);
    c.strokeStyle = RED; c.lineWidth = 3; c.beginPath(); c.moveTo(Xf, yb + 36); c.lineTo(Xf, yb + 76); c.stroke();
    c.restore();
    const xl = clamp(Xf - 20, 400, 1300), xr = clamp(Xf + 20, 60, 960);
    al(pb); L.tx(KN('bal oldal', fmt(ls, 1)).s, xl, yb, { k: 'bal oldal', s: 24, w: 700, f: F.B, a: 'right', b: 'middle', c: MatChart.edge(TEAL) });
    al(pb); L.tx(KN('jobb oldal', fmt(rs, 1)).s, xr, yb, { k: 'jobb oldal', s: 24, w: 700, f: F.B, a: 'left', b: 'middle', c: MatChart.edge(OCHRE) });
    const ok = Math.abs(ls - rs) < .05, col = ok ? GOOD : BAD;
    al(pb); L.pill(lab(ok ? 'egyensúly' : 'billen'), 680, 160, { k: ok ? 'egyensúly' : 'billen', s: 26, w: 700, f: F.B, a: 'center', c: col, bg: CARD, bd: col, bw: 2.5, pad: 12 });
  }
  if (live && st > 1.2) dragSee(S1, R.pos, V1, change1);

}

/* ════════ 2. Megérkezik a tulajdonos ════════ */
const S2 = { guess: null, gt: -9, own: 6000, f0: 0, t0: -30, row: null, sld: null };
const TIPS2 = ['tipp 2a', 'tipp 2b', 'tipp 2c'];
const V2 = [0, 8500], LAND2 = 1.5;
function reset2() { S2.guess = null; S2.gt = -9; S2.own = OWN; S2.f0 = meanOf(BER); S2.t0 = -30; }
const tipRight = (k) => { const m = meanOf(BER.concat([OWN])); return k === 'tipp 2c' ? m > 1000 : k === 'tipp 2b' ? m > 600 && m <= 1000 : m <= 600; };
function guess2(k) {
  if (S2.guess) return;
  S2.guess = k; S2.gt = L.st; S2.f0 = meanOf(BER); S2.t0 = L.st + LAND2;
  if (S2.row) S2.row.style.display = 'none';

}
function setOwn(v) { const st = L.st, all = BER.concat([S2.own]); S2.f0 = fulcrum(S2, st, meanOf(all), 1.4); S2.t0 = st; S2.own = v; }
function scene2(st, live) {
  const p0 = smooth(st / .5), g = !!S2.guess, z = g ? smooth((st - S2.gt - .1) / 1.1) : 0;
  const view = [lerp(V1[0], V2[0], z), lerp(V1[1], V2[1], z)], land = g ? clamp((st - S2.gt - LAND2 + .5) / .5) : 0;
  const all = BER.concat([S2.own]), onB = land >= 1, m = onB ? meanOf(all) : meanOf(BER);
  const f = g ? fulcrum(S2, st, m, 1.4) : meanOf(BER);
  al(p0); L.pill(lab('tippelj'), 680, 54, { k: 'tippelj', s: 24, w: 700, f: F.B, a: 'center', c: '#ffffff', bg: RED, pad: 12 });
  al(p0); T('kérdés 2', 680, 122, { f: F.D, i: true, s: 44, w: 500, a: 'center' });
  stampK('kitalált adat', 1110, 54, p0);
  const vals = g && land > 0 ? all : BER.slice();
  const R = seesaw({ vals, tq: onB ? all : BER, view, f, r: lerp(26, 13, z), a: p0, pack: z,
    cols: (i) => (i === 9 ? RED : TEAL), drop: (i) => (i === 9 ? land : 1), label: (i) => (i === 9 ? K('tulajdonos') : null) });
  const S0 = ST(BER), S = ST(onB ? all : BER);

    const x = 330 + j * 520;
    al(p0); const bl = L.tx(lab(k), x - 160, cy, { k, s: 30, w: 700, f: F.B, b: 'middle', c: col });
    const b0 = eqStr(v0).replace(/^:\s*/, '');
    al(p0); const bn = L.tx(b0, bl.x + bl.w + 16, cy, { f: F.M, s: 32, w: 700, b: 'middle', c: INK });
    if (done > 0) { al(done); L.tx('→ ' + eqStr(v1).replace(/^:\s*/, ''), bn.x + bn.w + 16, cy, { f: F.M, s: 32, w: 700, b: 'middle', c: col }); }
  });
  if (ga > 0) {
    TIPS2.forEach((k, j) => {
      const isG = S2.guess === k, right = tipRight(k), col = done > .5 && right ? GOOD : isG ? INK : MUT;
      al(ga * (isG || (done > .5 && right) ? 1 : .55));
      const b = L.pill(lab(k), 430 + j * 250, 300, { k, s: 24, w: 700, f: F.B, a: 'center', c: col, bg: CARD, bd: col, bw: isG ? 3 : 2, pad: 10 });
      if (done > .5 && right) { al(ga); mark(true, b.x + b.w + 20, 300, 26); }
      if (isG) { al(ga); T('a tipped', 430 + j * 250, 344, { s: 22, w: 600, f: F.B, a: 'center', c: MUT }); }
    });

    if (done > 0) { al(done); L.tx(KN('dolgozók az átlag alatt', below, BER.length).s, 680, 396, { k: 'dolgozók az átlag alatt', s: 28, w: 700, f: F.B, a: 'center', c: RED }); }
  }
  CK.s2 = { f, m, settled: g && st - S2.t0 > 1.9, onB };
}

/* ════════ 3. Valódi adat: KSH ════════ */
const P3 = { x0: 150, x1: 1250, base: 820, h: 440, vmax: 1600 };
const X3 = (v) => P3.x0 + v / P3.vmax * (P3.x1 - P3.x0);
let LN = { mu: 0, sg: 1, peak: 1 };
const pdf3 = (x) => (x <= 0 ? 0 : Math.exp(-Math.pow(Math.log(x) - LN.mu, 2) / (2 * LN.sg * LN.sg)) / (x * LN.sg * Math.sqrt(TAU)));
const Y3 = (x) => P3.base - pdf3(x) / LN.peak * P3.h;
function scene3(st) {
  const p0 = smooth(st / .5), med = num('ksh medián') / 1000, mean = num('ksh átlag') / 1000;
  al(p0); T('ksh cím', 680, 92, { f: F.D, i: true, s: 46, w: 500, a: 'center' });
  stampK('valós adat', 1110, 150, p0, TEAL);
  // tengelyek
  c.save(); al(p0); c.strokeStyle = INK; c.fillStyle = INK; c.lineWidth = 2.5; c.lineCap = 'round';
  c.beginPath(); c.moveTo(P3.x0, P3.base); c.lineTo(P3.x1 + 40, P3.base); c.moveTo(P3.x0, P3.base); c.lineTo(P3.x0, P3.base - P3.h - 110); c.stroke();

const SCENES = [scene1, scene2, scene3, scene4, scene5, scene6, scene7, scene8, scene9];

/* ════════ ellenőrzések (QA: L.checks) ════════ */
function checks() {
  const out = [], ok = (name, got, want, eps = 1e-6) => out.push({ name, ok: Math.abs(got - want) <= eps, got, want });
  const i = L.step;
  if (i === 0 && CK.s1 && CK.s1.settled) { ok('1: az alátámasztás az átlagban', CK.s1.f, CK.s1.m, 1e-3); ok('1: bal = jobb oldali eltérések', CK.s1.ls, CK.s1.rs, 1e-3); ok('1: a deszka vízszintes', CK.s1.th, 0, 1e-6); }
  if (i === 1 && CK.s2 && CK.s2.settled) ok('2: az alátámasztás az új átlagban', CK.s2.f, CK.s2.m, 1e-3);
  if (i === 2 && CK.s3 && CK.s3.mk.length === 2) { ok('3: medián-vonal helye', CK.s3.mk.find((m) => m.v === CK.s3.med).x, X3(CK.s3.med), 1e-6); ok('3: a modell mediánja = KSH medián', Math.exp(LN.mu), CK.s3.med, 1e-6); ok('3: a modell átlaga = KSH átlag', Math.exp(LN.mu + LN.sg * LN.sg / 2), CK.s3.mean, 1e-6); }
  if (i === 4 && CK.s5 && CK.s5.tav >= 1 && CK.s5.settled) ok('5: az átlagos négyzet oldala = szórás', CK.s5.side, CK.s5.sd * UX5, 1e-6);
  if (i === 5 && CK.s6 && CK.s6.pb > 0) { const Q = quart(S6.vals), s = Q.sorted; ok('6: Q1 ≤ medián ≤ Q3', +(Q.q1 <= Q.med && Q.med <= Q.q3), 1); }
  if (i === 6 && CK.s7 && CK.s7.grown) ok('7: látszólagos arány = rajzolt oszlopmagasságok aránya', CK.s7.looks, (VA - CK.s7.a0) / (VB - CK.s7.a0), 1e-9);
  if (i === 7 && CK.s8) { if (CK.s8.band === 0) ok('8: erős együttmozgás (r > 0,8)', +(CK.s8.r > .8), 1); else ok('8: a sávban nincs összefüggés (|r| < 0,1)', +(Math.abs(CK.s8.r) < .1), 1); }
  return out;
}

L = Lesson.create({

      if (d && S1.sel >= 0) { const v = clamp(S1.vals[S1.sel] + d * 10 * (e.shiftKey ? 3 : 1), 350, 650); if (v !== S1.vals[S1.sel]) change1(S1.sel, v); e.preventDefault(); }

  init(Lx) {

    P8 = MatPlot.create(L, { rect: [130, 200, 680, 640], x: [0, 240], y: [0, 16], grid: [20, 2], labels: [40, 4], origin: null,
      axis: { x: K('fagyi tengely'), y: K('leégés tengely') } });

    // a .md eredményei ↔ a lecke számolása

    MatText.check(L, 'Andi szórása', sdOf(PA), .005);

    MatText.check(L, 'látszólagos arány', (VA - AX0) / (VB - AX0), .005);
    L.checks = checks;
  },
  draw(Lx) {

      GA = w; c.save(); SCENES[i](sT[i] == null ? 0 : sT[i], L.step === i); c.restore();
    }
    c.globalAlpha = 1;

});
