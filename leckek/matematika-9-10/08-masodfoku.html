(function () {
'use strict';
const U = Lesson.U, { clamp, lerp, smooth, out, inOut, TAU } = U, fmt = U.fmt;
const F = Lesson.FONTS;

/* ── MODUL: Koordináta-rendszer (MatPlot) · forrás: matematika-5-6/09-aranyossag, 2026-11-23 ─────────────────
   Terv: pilot/matematika-5-6/terv.md 4. fejezet (API-vázlat) · pilot/matematika-9-10/terv.md 5.1 („MatKoord”);
   a 9–10 MatFv (paraméteres függvényrajzoló) erre épül. Csak a Lesson motorra (L.ctx, L.tx, L.pill, L.measure,

   md-kulcs) vagy sima szöveg (kódban rögzített szám, jel); minden felirat L.tx / L.pill / MatText.draw útján kerül
   a vászonra (QA, review mód); az átlátszóság (a) ABSZOLÚT – a hívó szorozza bele a jelenet-áttűnést; a modul
   állapotot nem tart, csak az éppen húzott pontét (zárt képletű rajzhoz jó).

   const P = MatPlot.create(L, o)
     o = {rect: [x, y, w, h]       a rajzterület (logikai px); a nézet [x0; x1] × [y0; y1] pontosan ezt tölti ki
          x: [x0, x1], y: [y0, y1]  kezdő nézet (világkoordináta)
          grid: 1 | [gx, gy] | 'auto'   rácsvonal-lépés világegységben ('auto': 1–2–5 · 10^k, ≥ minGrid px)
          ticks (alap: grid) · labels (alap: ticks)   beosztás- és feliratlépés: szám, [x, y] pár vagy 'auto'.
                                    A vonalak helye mindig i · lépés (i egész) → nincs lebegőpontos csúszás.
          minGrid: 28 · minLabel: 64   'auto' esetén a legkisebb rácsköz / feliratköz (px); x-en a felirat szélessége + 24 px is
          fmt: fn | {x: fn, y: fn}  tengelyfelirat (v, d) → szöveg (alap: U.fmt, valódi mínusz, tizedesvessző)
          axis: {x: {s, k}, y: {s, k}}   tengelynév (x: a tengely fölött, a nyílhoz jobbra igazítva; y: a nyíl
                                    mellett jobbra); egybetűs név dőlt Fraunces, a többi Bricolage. {s, k, dx, dy}
          origin: 'O'               felirat a (0; 0)-nál (null: nincs, ilyenkor mindkét 0 felirat megjelenik)
          s: 24 (felirat px) · lw: 2.5 · c: tinta · gridC: 'rgba(28,36,64,.08)' · gridW: 1.5
          arrows: true · ext: 30 (a tengely túlnyúlása a rajzterületen túl, px) · tick: 10 (beosztás px)}
     P.view([x0, x1], [y0, y1]) → P;  P.x0 P.x1 P.y0 P.y1, P.ux P.uy (px / egység)
     P.lerpView(A, B, t)        A, B = {x: [..], y: [..]}; tengelyenként logaritmikus zoom (mint a MatLine.lerpView:
                                a mindkét nézetben azonos helyen lévő pont helyben marad); t-t a hívó simítja
     P.X(x) · P.Y(y) · P.inv(px, py) → {x, y} · P.inRect(px, py, pad) · P.inView(x, y)
     P.ax() · P.ay()            a vízszintes tengely y-a, a függőleges x-e (px) – a 0-nál, vagy a nézet szélén
     P.lines('x' | 'y', step) → [{v, i, p}]   a nézetbe eső i · step értékek és képernyőhelyük
     P.step('x' | 'y', 'grid' | 'ticks' | 'labels')   a mostani lépés ('auto' feloldva)
     P.label('x' | 'y', v)      a tengelyfelirat szövege
     P.clip(fn, pad = 0)        fn() a rajzterületre vágva
     P.axes(d)                  rács, tengelyek nyíllal, beosztás, feliratok, O, tengelynevek.
                                d = {a: 1, grid: true, ticks: true, labels: true, names: true, arrows: true, gridA: 1,
                                t: 1 (a tengelyek kirajzolódása 0..1), hi: {x: [v | {v, c}], y: […]} (kiemelt felirat),
                                hide: {x: [v…], y: [v…]} (ezek közelében – hidePx: 40 – nincs felirat, mert ott pl. egy

     P.point(x, y, o) → {x, y}  pont; o = {c: cinóber, r: 10, hollow, a, ring, name: 'P' (→ 'P(3; 2)'), coords
                                (true: '(3; 2)'; névnél alapból true), label: {s, k} | szöveg (felülírja), math,
                                pos: 'ne' | 'nw' | 'se' | 'sw' | 'n' | 's' | 'e' | 'w', pill: true, sz: 26, lc, k,

                                (szaggatott vetítővonal a tengelyekig), guideT: 0..1, guideC, vals: true (a vetítővonal
                                végén a pont értéke a tengelyen, színes dobozban), drag: {id, snap: 1 | [sx, sy],
                                box: [x0, y0, x1, y1], path(x, y) → {x, y} (megkötés, pl. egyenesen marad – a snap
                                után fut), hit: 28, track: false (a rajzterületre kattintva is odaugrik), onDrag(x, y)}}
                                Fogantyú r ≥ 10, találati sugár 28 px. Visszaadja a húzás utáni értéket – a lecke
                                tárolja, és egy L.slider-rel (billentyűvel is) szinkronban tartja.
     P.fn(f, o) → darabok       függvénygörbe; o = {x0, x1 (alap: a nézet), t: 1 (kirajzolás balról), c: cinóber,
                                w: 4, a, dash, samples (alap: 3 px-enként), jump: 3}. Nem véges értéknél megszakad, és
                                az értelmezési tartomány szélét felezéssel keresi meg (√x a 0-nál indul). Ha két minta
                                közt az ugrás > jump · nézetmagasság, és a felezőpont értéke nincs a kettő között,
                                szakadás (1/x a 0-nál). A rajzterületre vágva. → [[[x, y]…]…]
     P.line(m, b, o)            y = m · x + b;  P.through(p, q, o) egyenes két ponton ([x, y]) át – a nézetre vágva;
                                o = {c, w: 3, dash, a, t (kirajzolás), arrow, x0, x1 (csak ezen az x-szakaszon)}
                                → a kirajzolt szakasz végpontjai vagy null
     P.seg(p, q, o)             szakasz; o = {c, w: 3, dash, a, t, arrow, aw (nyílméret)}
     P.hline(y, o) · P.vline(x, o)
     P.rect(x0, y0, x1, y1, o)  téglalap világkoordinátákkal;  P.poly(pts, o) sokszög;
                                o = {fill, stroke, w: 2.5, dash, a, closed: true}
     P.text(x, y, s, o)         felirat egy világponthoz; o = mint L.tx + {dx, dy, math, pill}
     P.click(o) → {x, y} | null   a lenyomás pillanatában, ha a rajzterületen van (o.pad px ráhagyással),
                                o.snap-re kerekítve, o.box-ba szorítva; amit egy húzható pont elkapott, nem kattintás
     P.hover(o) → {x, y} | null   a mutató alatti pont (o.snap, o.box, o.cursor: pl. 'crosshair')
     P.fly(from, to, t, o) → [px, py]   képernyőpontból ([px, py]) világpontba ([x, y]) ívben (o.h: 60 px)
   MatPlot.table(L, o) → {cell(i, j), w, h}   értéktáblázat; o = {x, y (bal felső sarok), head: [{s, k}…]
                                (komponensenként egy fejléc), data: [[x, y, …]…] (rekordonként), dir: 'h' (vízszintes:
                                fejlécek balra, rekord = oszlop) | 'v' (függőleges: fejlécek fent, rekord = sor),
                                hw (fejlécszélesség 'h' / -magasság 'v'), cw: 90, ch: 56, s: 28, a, c: [szín…],
                                fmt: [fn…], show(i) → 0..1 (rekord), showC(i, j) → 0..1 (cella), hi: i | [i…], hiC}.
                                Érték: szám (U.fmt), szöveg vagy {s, k, c}. cell(i, j) → {x, y, w, h, cx, cy}
                                (i rekord, −1 a fejléc; j komponens).
   MatPlot.lerpView(A, B, t) · MatPlot.nice(min) (a legkisebb 1–2–5 · 10^k ≥ min) · MatPlot.decimals · MatPlot.round
   Nincs benne (a 9–10 MatFv építi rá): transzformáció-paraméterek, „szellem” görbe, zérushely-keresés,
   tengelyszakasz-kiemelés (egyenlőtlenség), tükrözés az y = x egyenesre.
   ──────────────────────────────────────────────────────────────────────────────────────────────────────── */
const MatPlot = (() => {
  const U = Lesson.U, F = Lesson.FONTS, TAU = Math.PI * 2, clamp = U.clamp, smooth = U.smooth;
  const INK = '#1c2440', RED = '#c8401c', CARD = '#fffaf1', PAPER = '#f7f1e6', LINE = 'rgba(28,36,64,.16)';
  const round = (v, d = 10) => (isFinite(v) ? +(+v).toFixed(d) : v);
  const decimals = (x) => {
    x = Math.abs(x);
    for (let d = 0; d < 12; d++) { const m = x * Math.pow(10, d); if (Math.abs(m - Math.round(m)) < 1e-7 * Math.max(1, m)) return d; }
    return 12;
  };
  const TX = (x) => (x == null ? null : typeof x === 'string' || typeof x === 'number' ? { s: String(x) } : x);
  const pair = (v, d) => (v == null ? [d, d] : Array.isArray(v) ? v : [v, v]);
  const isHex = (c) => /^#[0-9a-f]{6}$/i.test(c);
  const dark = (c) => (isHex(c) ? U.mix(c, '#000000', .35) : INK);
  const soft = (c, a) => U.rgba(isHex(c) ? c : INK, a);
  const fC = (v) => { const r = round(v, 10); return U.fmt(r, Math.min(2, decimals(r))); };

  function lerpView(A, B, t) {
    t = clamp(t);
    const wA = A[1] - A[0], wB = B[1] - B[0], cA = (A[0] + A[1]) / 2, cB = (B[0] + B[1]) / 2;
    if (Math.abs(wA - wB) <= 1e-12 * Math.max(Math.abs(wA), Math.abs(wB))) { const m = cA + (cB - cA) * t; return [m - wA / 2, m + wA / 2]; }
    const w = wA * Math.pow(wB / wA, t), m = cA + (cB - cA) * (w - wA) / (wB - wA);
    return [m - w / 2, m + w / 2];
  }
  function nice(min) {
    if (!(min > 0)) return 1;
    const k = Math.floor(Math.log10(min));
    for (let j = k; j <= k + 1; j++) for (const m of [1, 2, 5]) { const s = round(m * Math.pow(10, j), 12); if (s >= min * (1 - 1e-9)) return s; }
    return round(Math.pow(10, k + 2), 12);
  }

  // ── húzás és kattintás: képkockánként egyszer frissül (L.t szerint) ──
  // A gyors kattintás (le + fel egy képkockán belül) is számít: a lenyomást egy pointerdown-figyelő jegyzi fel.
  const DRAG = { id: null, t: NaN, was: false, pressed: false, hov: '', cur: '', stage: null, latch: 0 };
  function input(L) {
    if (DRAG.t === L.t) return;
    DRAG.t = L.t;
    if (L.stage && DRAG.stage !== L.stage) { DRAG.stage = L.stage; L.stage.addEventListener('pointerdown', () => { DRAG.latch = performance.now(); }, true); }
    const dn = !!L.pointer.down, quick = DRAG.latch && performance.now() - DRAG.latch < 400;
    DRAG.pressed = (dn && !DRAG.was) || (!!quick && !DRAG.was); DRAG.was = dn; DRAG.latch = 0;
    if (!dn) DRAG.id = null;
    const want = DRAG.id ? 'grabbing' : DRAG.hov;
    if (want !== DRAG.cur && L.stage) { L.stage.style.cursor = want; DRAG.cur = want; }
    DRAG.hov = '';
  }

  function arrowHead(c, x, y, ang, sz, col) {
    c.save(); c.translate(x, y); c.rotate(ang); c.beginPath();
    c.moveTo(0, 0); c.lineTo(-sz * 1.25, -sz * .62); c.lineTo(-sz * .95, 0); c.lineTo(-sz * 1.25, sz * .62); c.closePath();
    c.fillStyle = col; c.fill(); c.restore();
  }

  function create(L, o = {}) {
    const P = Object.assign({ rect: [160, 120, 960, 720], x: [0, 10], y: [0, 10], grid: 1, minGrid: 28, minLabel: 64, s: 24, lw: 2.5,
      c: INK, gridC: 'rgba(28,36,64,.08)', gridW: 1.5, arrows: true, ext: 30, tick: 10, origin: 'O', axis: {}, fmt: null }, o);
    P.L = L;
    const R = P.rect;
    const SD = { grid: pair(P.grid, 1) };
    SD.ticks = pair(o.ticks, null).map((v, i) => (v == null ? SD.grid[i] : v));
    SD.labels = pair(o.labels, null).map((v, i) => (v == null ? SD.ticks[i] : v));

    P.view = (xr, yr) => { P.x0 = xr[0]; P.x1 = xr[1]; P.y0 = yr[0]; P.y1 = yr[1]; P.ux = R[2] / (P.x1 - P.x0); P.uy = R[3] / (P.y1 - P.y0); return P; };
    P.lerpView = (A, B, t) => P.view(lerpView(A.x, B.x, t), lerpView(A.y, B.y, t));
    P.X = (x) => R[0] + (x - P.x0) * P.ux;
    P.Y = (y) => R[1] + R[3] - (y - P.y0) * P.uy;
    P.inv = (px, py) => ({ x: P.x0 + (px - R[0]) / P.ux, y: P.y0 + (R[1] + R[3] - py) / P.uy });
    P.inRect = (px, py, pad = 0) => px >= R[0] - pad && px <= R[0] + R[2] + pad && py >= R[1] - pad && py <= R[1] + R[3] + pad;
    P.inView = (x, y) => { const ex = 1e-9 * (P.x1 - P.x0), ey = 1e-9 * (P.y1 - P.y0); return x >= P.x0 - ex && x <= P.x1 + ex && y >= P.y0 - ey && y <= P.y1 + ey; };
    P.ax = () => P.Y(clamp(0, P.y0, P.y1));
    P.ay = () => P.X(clamp(0, P.x0, P.x1));
    P.step = (ax, kind = 'grid') => {
      const i = ax === 'x' ? 0 : 1, v = SD[kind][i];
      if (v !== 'auto') return v;
      const u = i ? P.uy : P.ux;
      if (kind === 'grid') return nice(P.minGrid / u);
      if (kind === 'ticks') return P.step(ax, 'grid');
      const tk = P.step(ax, 'ticks'); let s = nice(Math.max(P.minLabel / u, tk));
      const fits = (s) => { // az x tengelyen a felirat szélessége is számít (pl. 0,002)
        if (Math.abs(s / tk - Math.round(s / tk)) > 1e-6) return false;
        if (i) return true;
        const d = decimals(s), w = Math.max(...[P.x0, P.x1, s].map((v) => L.measure(P.label(ax, round(Math.round(v / s) * s, 12), d), { f: F.M, s: P.s, w: 500 }).w));
        return s * u >= w + 24;
      };
      for (let n = 0; n < 12 && !fits(s); n++) s = nice(s * 1.01);
      return s;
    };
    P.lines = (ax, step) => {
      const a = ax === 'x' ? P.x0 : P.y0, b = ax === 'x' ? P.x1 : P.y1, out = [];
      if (!(step > 0)) return out;
      const i0 = Math.ceil(a / step - 1e-9), i1 = Math.floor(b / step + 1e-9);
      if (i1 - i0 > 4000) return out;
      for (let i = i0; i <= i1; i++) { const v = round(i * step, 12); out.push({ v, i, p: ax === 'x' ? P.X(v) : P.Y(v) }); }
      return out;
    };
    const fmtOf = (ax) => (typeof P.fmt === 'function' ? P.fmt : P.fmt && P.fmt[ax]) || null;
    P.label = (ax, v, d) => {
      const r = round(v, 12), dd = d == null ? Math.min(decimals(r), decimals(P.step(ax, 'labels'))) : d, f = fmtOf(ax);
      return f ? String(f(r, dd)) : U.fmt(r, dd);
    };
    P.clip = (fn, pad = 0) => { const c = L.ctx; c.save(); c.beginPath(); c.rect(R[0] - pad, R[1] - pad, R[2] + 2 * pad, R[3] + 2 * pad); c.clip(); try { fn(); } finally { c.restore(); } };

    P.axes = (d = {}) => {
      input(L);
      const c = L.ctx, A = d.a == null ? 1 : d.a; if (A <= .004) return P;
      const t = d.t == null ? 1 : clamp(d.t), yA = P.ax(), xA = P.ay();
      c.save(); c.setLineDash([]); c.lineCap = 'butt';
      if (d.grid !== false) {
        c.globalAlpha = A * (d.gridA == null ? 1 : d.gridA) * smooth(t * 1.5); c.strokeStyle = P.gridC; c.lineWidth = P.gridW;
        c.beginPath();
        for (const g of P.lines('x', P.step('x'))) { c.moveTo(g.p, R[1]); c.lineTo(g.p, R[1] + R[3]); }
        for (const g of P.lines('y', P.step('y'))) { c.moveTo(R[0], g.p); c.lineTo(R[0] + R[2], g.p); }
        c.stroke();
      }
      const xe = R[0] + R[2] + P.ext, ye = R[1] - P.ext, x0 = R[0], y0 = R[1] + R[3];
      c.globalAlpha = A; c.strokeStyle = P.c; c.lineWidth = P.lw; c.lineCap = 'round';
      c.beginPath(); c.moveTo(x0, yA); c.lineTo(x0 + (xe - x0) * t, yA); c.moveTo(xA, y0); c.lineTo(xA, y0 + (ye - y0) * t); c.stroke();
      c.lineCap = 'butt';
      const full = t > .98;
      if (P.arrows && d.arrows !== false && full) { arrowHead(c, xe + 12, yA, 0, 11, P.c); arrowHead(c, xA, ye - 12, -Math.PI / 2, 11, P.c); }
      const orgIn = P.inView(0, 0) && P.origin != null;

/* ── másodfokú segédek ── */
/* expr-adat → együtthatók (a = (f(1) + f(−1))/2 − f(0), b = (f(1) − f(−1))/2, c = f(0)); ellenőrzi, hogy tényleg másodfokú */
function coef(k) {
  const tree = L.dat(k).tree, f = (x) => MatText.evalExpr(tree, { x });
  const c0 = rd(f(0)), a = rd((f(1) + f(-1)) / 2 - f(0)), b = rd((f(1) - f(-1)) / 2);
  const okq = [2, -3, 5].every((x) => Math.abs(f(x) - (a * x * x + b * x + c0)) < 1e-9);
  return { a, b, c: c0, okq };
}
function qinfo(a, b, c0) {
  const D = rd(b * b - 4 * a * c0), h = rd(-b / (2 * a)), k = rd(c0 - b * b / (4 * a));
  let r = [];
  if (D > 1e-12) { const s = Math.sqrt(D); r = [(-b + s) / (2 * a), (-b - s) / (2 * a)].map(rd); } else if (Math.abs(D) <= 1e-12) r = [h];
  return { a, b, c: c0, D, h, k, r, f: (x) => a * x * x + b * x + c0 };
}
/* polinom szövege a MatText-nek: 2x^2 + 3x − 2 */
function polyS(a, b, c0) {
  const out = [];
  [[a, 'x^2'], [b, 'x'], [c0, '']].forEach(([v, pw]) => {
    if (Math.abs(v) < 1e-12) return;
    const m = pw && Math.abs(Math.abs(v) - 1) < 1e-12 ? '' : nf(Math.abs(v));
    out.push(out.length ? (v < 0 ? ' − ' : ' + ') + m + pw : (v < 0 ? '−' : '') + m + pw);
  });
  return out.length ? out.join('') : '0';
}
const lead = (a) => (Math.abs(a - 1) < 1e-12 ? '' : Math.abs(a + 1) < 1e-12 ? '−' : nf(a));
const xm = (r) => (Math.abs(r) < 1e-12 ? 'x' : 'x' + sg(-r));            // x − r
const fac = (r) => (Math.abs(r) < 1e-12 ? 'x' : '(' + xm(r) + ')');
/* pontos gyök (MatQ), ha a D racionális szám négyzete */
function qsqrt(q) {
  if (q.n < 0) return null;
  const sn = Math.round(Math.sqrt(q.n)), sd = Math.round(Math.sqrt(q.d));
  return sn * sn === q.n && sd * sd === q.d ? MatQ(sn, sd) : null;
}
const Q = (v) => MatQ.fromNumber(rd(v));
function qstr(q) { return q.d === 1 || exact(q.v) ? nf(q.v) : (q.n < 0 ? '−' : '') + Math.abs(q.n) + '/' + q.d; }

/* hibasáv (mint a MatText.check-é) – lista- és pontadatok ellenőrzéséhez */
function err(msg) {
  console.error(msg);
  let e = document.getElementById('lesson-error');
  if (!e) { e = document.createElement('div'); e.id = 'lesson-error'; (L.stage || document.body).append(e); }
  if (!e.textContent.includes(msg)) e.textContent += (e.textContent ? '\n' : '') + msg;
}

  if (!(got.length === w.length && got.every((v, i) => Math.abs(v - w[i]) < 1e-9))) err('Ellenőrzés: a .md „' + k + '” adata ' + L.dat(k).s + ', a lecke számolása szerint ' + w.map(nf).join('; ') + '.');
}

  ck('4: zérushelyek (numerikus = képlet)', z.length === q.r.length && z.every((x, i) => near(x, q.r.slice().sort((u, v) => u - v)[i], 1e-7)), z.map(nf).join(' '), q.r.slice().sort((u, v) => u - v).map(nf).join(' '));
  // 5. a megoldások száma = a kirajzolt metszéspontok száma
  const p = p5(L.step === 4 ? L.st : 1e9);

  }

    if (so.x1) { const fx = (x) => q6.a * (x - so.x1.v) * (x - so.x2.v); ck('6: gyöktényezős alak = f (' + k + ')', MatFv.same(fx, q6.f, [-3, -1, 0, 1, 2.5]), 'a(x − x₁)(x − x₂)', 'f'); }

  ck('8: az ellenpélda nem negatív', !(q8.f(num('ellenpélda x')) < 0), nf(q8.f(num('ellenpélda x'))), '≥ 0');

  ck('9: legnagyobb terület (numerikus)', e9.length === 1 && near(e9[0].x, H / 2, 1e-5) && near(e9[0].y, num('legnagyobb terület'), 1e-9), e9.map((e) => nf(e.x) + ' → ' + nf(e.y)).join(' '), nf(H / 2) + ' → ' + num('legnagyobb terület'));
  return out;
}
