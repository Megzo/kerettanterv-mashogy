  4: [{ name: '1950', set() { setDay(S4, SL4, 1950.5); } }, { name: '1956-11-02', set() { setDay(S4, SL4, ya('magyar kilépési nyilatkozat') + .003); } },
    { name: '1970', set() { setDay(S4, SL4, 1970.5); } }, { name: '1990-12', set() { setDay(S4, SL4, 1990.95); } }, { name: 'vege', set() { setDay(S4, SL4, ya('VSZ megszűnése')); } }],
  5: [{ name: 'jo-tipp', set(L) { tipGuess(P5, 'tipp 1986', L.st - 8); } }, { name: 'rossz-tipp', set(L) { tipGuess(P5, 'tipp 1962', L.st - 1.5); } },
    { name: '1967', set(L) { tipGuess(P5, 'tipp 2000', L.st - 8); S5.user = 1967; if (SL5) SL5.set(1967); } }, { name: '2025', set(L) { tipGuess(P5, 'tipp 1986', L.st - 8); S5.user = 2025; if (SL5) SL5.set(2025); } }],
  6: [1, 2, 3, 4, 5].map((i) => ({ name: 'front' + i, set() { setDay(S6, SL6, ya('koreai front ' + i)); } })).concat([{ name: '1950-08', set() { setDay(S6, SL6, 1950.62); } }]),
  7: [{ name: 'szovjet', set() { togReset(S7, 1); } }],
  8: [{ name: '1950', set() { S8.user = 1950; if (SL8) SL8.set(1950); } }, { name: '1970', set() { S8.user = 1970; if (SL8) SL8.set(1970); } }],
  9: [{ name: 'honnan', set() { togReset(S9, 1); } }],
};

L = Lesson.create({
  content: window.LESSON_CONTENT,
  home: false,
  resetCtx: true,
  steps: STEPS,
  init(Lx) {
    L = Lx; c = L.ctx;
    SRC = TortSource.create(L, { 'forrás': K('forrás jel'), 'rekonstrukció': K('rekonstrukció jel'), 'monda': K('monda jel'), 'becslés': K('becslés'), 'vázlatos': K('vázlatos'), 'illusztráció': K('illusztráció') });
    TT = { bc: K('Kr. e.'), ad: K('Kr. u.'), cent: K('század'), years: K('év sablon') };
    const PE = TortProj.lcc({ lon0: 15, lat0: 50, lat1: 40, lat2: 60 });
    MAPE = TortMap.create({ proj: PE, layers: [{ data: window.TORT_MAP_VILAG }, { data: window.TORT_MAP_EUROPA }] });
    TE = TortTerr.create(L, window.TORT_HATAR, { map: MAPE });
    const PK = TortProj.lcc({ lon0: 127.5, lat0: 38, lat1: 34, lat2: 42 });
    MAPK = TortMap.create({ proj: PK, layers: [{ data: window.TORT_MAP_VILAG }] });
    TK = TortTerr.create(L, window.TORT_HATAR, { map: MAPK });
    GLOBE = TortGlobe.create({ data: window.TORT_MAP_VILAG });
    // csoportok
    IDS.EASTX = idsE(EAST.concat(['AL']));
    IDS.BRIT = ['DE-SH', 'DE-HH', 'DE-NI', 'DE-NW']; IDS.USZ = ['DE-BY', 'DE-HE', 'DE-HB']; IDS.FRZ = ['DE-RP'];
    IDS.NSZK0 = TE.ids(G('NSZK'));
    ZN = [[6.0, 49.02], [8.4, 49.0], [8.75, 48.88], [9.18, 48.74], [9.6, 48.6], [10.0, 48.43], [10.7, 48.43], [10.7, 50.2], [6.0, 50.2]];   // Baden-Württemberg amerikai (északi) része – vázlatos
    S1G = {
      SOV: idsE(['SU', 'PL', 'NDK', 'Berlin-K', 'CS', 'HU', 'RO', 'BG']).concat(['AT-1', 'AT-3', 'AT-9']),
      WES: idsE(['NSZK', 'SAAR', 'Berlin-Ny', 'IT', 'FR', 'BE', 'NL', 'LU', 'DK', 'NO', 'UK', 'GR']).concat(['AT-2', 'AT-4', 'AT-5', 'AT-6', 'AT-7', 'AT-8']),
      PART: idsE(['YU', 'AL']), N: idsE(['FI', 'SE', 'CH', 'ES', 'PT', 'IE', 'TR', 'IS', 'LI', 'AD', 'MC', 'SM', 'VA', 'MT', 'CY']),
    };
    ARCD = new Array(window.TORT_HATAR.arcs.length);
    CURT = uniq([].concat(...CURTAIN.map(([A, B]) => commonArcs(A, B))));
    DDR = commonArcs(['NDK'], ['NSZK']);
    buildRules(); buildKorea();
    V1 = TortMap.fit(PE, [-11.0, 34.0, 42.0, 67.0], [R1[0], R1[1], R1[2], R1[3]]);
    V2 = TortMap.fit(PE, [-6.0, 35.0, 36.0, 64.0], [R2[0], R2[1], R2[2], R2[3]]);
    V9 = TortMap.fit(PE, [-10.0, 36.0, 40.0, 64.0], [R9[0], R9[1], R9[2], R9[3]]);
    VG = TortMap.fit(PE, [5.6, 47.2, 15.3, 55.1], [RG[0] + 10, RG[1] + 50, RG[2] - 20, RG[3] - 60]);
    VB = TortMap.fit(PE, [13.06, 52.33, 13.78, 52.69], [RB[0] + 10, RB[1] + 50, RB[2] - 20, RB[3] - 60]);
    VK = TortMap.fit(PK, [124.0, 33.8, 131.0, 43.0], [R6[0] + 10, R6[1] + 40, R6[2] - 20, R6[3] - 50]);
    P5 = Tip(['tipp 1962', 'tipp 1986', 'tipp 2000'], 'tipp 1986');
    // robbanófej-sorok és GDP (a .md series adataiból)
    const su = dat('robbanófej SU'), us = dat('robbanófej USA');
    const wo = dat('robbanófej világ'), xs = us.x.slice(), sum = xs.map((x) => wo.y[wo.x.indexOf(x)]);
    const peakOf = (arr) => { let bi = 0; arr.forEach((v, i) => { if (v > arr[bi]) bi = i; }); return bi; };
    WS = { x: xs, us: us.y.slice(), su: xs.map((x) => su.y[su.x.indexOf(x)]), sum };
    WS.usPeak = xs[peakOf(WS.us)]; WS.suPeakYear = xs[peakOf(WS.su)]; WS.suPeak = WS.su[peakOf(WS.su)]; WS.sumPeakYear = xs[peakOf(sum)];
    const ga = dat('GDP Ausztria'), gh = dat('GDP Magyarország');
    GDP = { x: ga.x.slice(), at: ga.y.slice(), hu: gh.y.slice() };
    C5 = FoldChart.create(L, { x: 150, y: 320, w: 1120, h: 520, xs: { min: 1943, max: 2025, ticks: [1945, 1955, 1965, 1975, 1985, 1995, 2005, 2015, 2025], fmt: (v) => String(v) }, ys: { min: 0, max: 80000, step: 10000, fmt: (v) => fmt(v) } });
    C8 = FoldChart.create(L, { x: 160, y: 236, w: 600, h: 404, xs: { min: 1948, max: 1990, ticks: [1950, 1960, 1970, 1980, 1990], fmt: (v) => String(v) }, ys: { min: 0, max: 30000, step: 5000, fmt: (v) => fmt(v) } });
    TL9 = TortTimeline.create(L, { x0: 60, x1: 1300, y: 1000, h: 40, T: TT, src: SRC, bounds: [1940, 1995] });
    L.checks = () => {
      const order = ['Jalta kezdete', 'Potsdam vége', 'ENSZ megalakulása', 'Fulton-beszéd', 'párizsi béke', 'Izrael megalapítása', 'blokád kezdete', 'NATO megalakulása', 'blokád vége', 'NSZK megalakulása',
        'szovjet atombomba', 'NDK megalakulása', 'koreai háború kezdete', 'fegyverszünet', 'NSZK NATO-tagsága', 'Varsói Szerződés', 'osztrák államszerződés', 'osztrák semlegesség',
        'magyar kilépési nyilatkozat', 'szovjet támadás', 'fal építése', 'Kennedy értesül', 'Hruscsov visszalép', 'Albánia kilépése', 'spanyol csatlakozás', 'INF-szerződés', 'fal megnyitása', 'német egység', 'VSZ megszűnése', 'Szovjetunió megszűnése'];
      const ord = order.every((k, i) => i === 0 || ya(order[i - 1]) < ya(k));
      const keysOk = KKEYS.every((k, i) => i === 0 || KKEYS[i - 1].a < k.a);
      const n0 = natoN(ya('NATO megalakulása')), v0 = vszN(ya('Varsói Szerződés'));
      const days3 = Math.round((Date.UTC(...dat('szovjet támadás').ymd.map((v, i) => i === 1 ? v - 1 : v)) - Date.UTC(...dat('magyar kilépési nyilatkozat').ymd.map((v, i) => i === 1 ? v - 1 : v))) / 864e5);
      const site = LL('rakétaállás helye'), wd = TortProj.dist(site[0], site[1], ...LL('Washington helye')), ny = TortProj.dist(site[0], site[1], ...LL('New York helye'));
      const mz = TortProj.dist(...LL('Izmir helye'), ...LL('Moszkva helye'));
      const r50 = GDP.at[0] / GDP.hu[0], r90 = GDP.at[40] / GDP.hu[40];
      return [
        { name: 'a kulcsesemények időrendben', ok: ord, got: ord, want: true },
        { name: 'a koreai front kulcskockái időrendben', ok: keysOk, got: keysOk, want: true },
        { name: 'NATO-alapítók száma = az adat', ok: n0 === num('NATO alapítói'), got: n0, want: num('NATO alapítói') },
        { name: 'VSZ-alapítók száma = az adat', ok: v0 === num('VSZ alapítói'), got: v0, want: num('VSZ alapítói') },
        { name: 'a kilépési nyilatkozat és a szovjet támadás között 3 nap', ok: days3 === 3, got: days3, want: 3 },
        { name: 'a tipp helyes válasza: a világ csúcséve 1986 (FAS)', ok: WS.sumPeakYear === 1986 && P5.ok === 'tipp 1986', got: WS.sumPeakYear, want: 1986 },
        { name: 'a panel: az USA 1967-ben, a Szovjetunió 1986-ban tetőzött', ok: WS.usPeak === 1967 && WS.suPeakYear === 1986, got: WS.usPeak + ' / ' + WS.suPeakYear, want: '1967 / 1986' },
        { name: 'Washington az R-12 hatótávján belül', ok: wd < num('R-12 hatótáv'), got: Math.round(wd), want: '< ' + num('R-12 hatótáv') },
        { name: 'New York az R-12-n kívül, az R-14-en belül', ok: ny > num('R-12 hatótáv') && ny < num('R-14 hatótáv'), got: Math.round(ny), want: num('R-12 hatótáv') + '–' + num('R-14 hatótáv') },
        { name: 'Moszkva a törökországi Jupiter hatótávján belül', ok: mz < num('Jupiter hatótáv'), got: Math.round(mz), want: '< ' + num('Jupiter hatótáv') },
        { name: 'a panel: a GDP-különbség 1950 és 1990 között nőtt', ok: r90 > r50, got: fmt(r50, 2) + ' → ' + fmt(r90, 2), want: 'nő' },
        { name: 'a fal belső szakasza rövidebb a teljes hossznál', ok: num('fal belső szakasza') < num('fal hossza'), got: num('fal belső szakasza'), want: '< ' + num('fal hossza') },
        { name: 'a robbanófej-sorok évei egyeznek', ok: su.x.join() === us.x.join() && wo.x.join() === us.x.join(), got: su.x.length + ' / ' + wo.x.length, want: us.x.length },
        { name: 'a világ összesen ≥ USA + SZU minden évben', ok: xs.every((x, i) => sum[i] >= WS.us[i] + WS.su[i]), got: true, want: true },
        { name: 'a vasfüggöny-vonal nem üres', ok: CURT.length > 20 && DDR.length > 3, got: CURT.length + ' / ' + DDR.length, want: '> 20 / > 3' },
      ];
    };
  },
  draw(Lx) {
    L = Lx; c = L.ctx; GA = 1; paper(); grid(.04);
    const sp = L.sp, wt = (i) => clamp(1 - Math.abs(sp - i) * 2);
    sT[L.step] = L.st;
    const S = [scene1, scene2, scene3, scene4, scene5, scene6, scene7, scene8, scene9];
    for (let i = 0; i < 9; i++) { const w = wt(i); if (w > .005) { c.save(); S[i](sT[i], w, L.step === i); c.restore(); } }
    c.globalAlpha = 1;
  },
});
})();
</script>
