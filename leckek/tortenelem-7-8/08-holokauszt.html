/* A természettudomány 5–6. sorozat közös mintái (szerződés 17.): kísérlet-/modellbélyeg és a „Tippelj! → kísérlet →

   letiltott csúszka halványítását a modul maga teszi a <head>-be – a leckében nem kell <style>-sor.

   BEKÖTÉS (a lecke kódjában, egyszer, legfelső szinten – a getterek miatt a sorrend mindegy):

     const { stamp, Tip, tipReset, panelVeil, veilIf, tipGuess, tipHide, tipControls, tipU, rhythm, tipHead, tipRow,
       tipFeedback } = TtTipp;

   egy korábbi halvány felirat nem tünteti el), a vonalstílust (lineCap/lineJoin/setLineDash) visszaállítja.

        Szöveg: az o.k || '<kind> bélyeg' .md-kulcs. Szín (STAMP): otthon kékeszöld, felnőtt okker, tilos #b3261e;
        tanári, modell, kitalált, nem méretarányos, sematikus, vázlatos, képzeletbeli (és minden más) halvány tinta.
        o = {k, col (szín felülírása), rot: −3 (fok), al: 'left' (igazítás)}. a ≤ 0,005 → nem rajzol.
   Tip(keys, ok) → P      jóslat-állapot. keys: a válaszok .md-kulcsai (egyben gombfeliratok), ok: a helyes kulcs (az
        init-ben is beállítható: P.ok = …). P = {keys, ok, guess: null | kulcs, gt: a választás L.st-je, btns, on}.

   tipReset(P)            alaphelyzet (az enter()-ben; utána veilIf(P)).

  const X = (v) => 330 + v / 6e5 * 700;
  const row = (lk, dk, sk, y) => {
    const d = dat(dk);
    al(va); L.tx(lab(lk), 44, y + 25, { k: lk, s: 22, w: 700 });
    const xh = rangeBar(X, y, 34, d.lo, d.hi, va);
    al(va); L.tx(L.val(dk), xh + 14, y + 25, { k: dk, s: 22, w: 700, f: F.M });
    al(va); L.tx(lab(sk), 330, y + 62, { k: sk, s: 22, c: MUT });

  row('c9 zsidó', 'magyarországi zsidó áldozatok', 'c9 forrás zsidó', vy + 70);
  row('c9 roma', 'magyarországi roma áldozatok', 'c9 forrás roma', vy + 158);
  al(va); c.strokeStyle = 'rgba(28,36,64,.4)'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(X(0), vy + 250); c.lineTo(X(6e5), vy + 250); c.stroke();
  for (let v = 0; v <= 6; v++) {
    al(va); c.beginPath(); c.moveTo(X(v * 1e5), vy + 244); c.lineTo(X(v * 1e5), vy + 256); c.stroke();
    al(va); L.tx(v === 6 ? rep('ezer sablon', 600) : String(v * 100), X(v * 1e5) - (v === 6 ? 18 : 0), vy + 280, { k: v === 6 ? 'ezer sablon' : null, s: 22, w: 500, c: MUT, a: v === 6 ? 'left' : 'center' });
  }
  // felelősség · emléknapok
  const fa = p(1.2);
  const fb = block(20, 426, 640, [{ k: 'c9 felelős', size: 24, w: 700 }, ...['c9 f1', 'c9 f2', 'c9 f3', 'c9 f4'].map((k) => ({ s: '– ' + lab(k), kk: k, size: 22, w: 600, gap: 4 }))], { a: fa });
  const eb = block(680, 426, 660, [{ k: 'c9 emlék', size: 24, w: 700 }, ...['c9 e1', 'c9 e2', 'c9 e3'].map((k) => ({ k, size: 22, w: 600, gap: 4 }))], { a: p(1.6), minH: fb.h });
  // forráskritikai kérdés – nincs rossz válasz
  const qa = p(2.2), qy = Math.max(fb.y + fb.h, eb.y + eb.h) + 20, qh = 1032 - qy;
  softCard(20, qy, 1320, qh, qa);
  al(qa); L.tx(lab('c9 kérdés'), 44, qy + 42, { k: 'c9 kérdés', f: F.D, s: 28, w: 600 });
  const ch = ['v1', 'v2', 'v3'], ra = S9.v ? smooth((L.st - S9.t) / .5) : 0;
  if (!S9.v) { al(qa * (.55 + .45 * Math.sin(L.t * 2.4) ** 2)); L.tx(lab('c9 válassz'), 44, qy + 84, { k: 'c9 válassz', s: 22, w: 700, c: BRK }); }
  ch.forEach((v, i) => {
    const x = 44 + i * 432, y = qy + 64, sel = S9.v === v;
    if (ra > .003) {
      al(qa * ra); rr(x - 8, y, 416, qh - 120, 10); c.strokeStyle = sel ? BRK : LINE; c.lineWidth = sel ? 3 : 2; c.stroke();
      al(qa * ra); L.tx(lab('c9 ' + v), x + 8, y + 34, { k: 'c9 ' + v, s: 22, w: 700, c: sel ? BRK : INK });
      al(qa * ra); wtx(lab('c9 m' + (i + 1)), x + 8, y + 66, 392, { k: 'c9 m' + (i + 1), size: 22, w: 500 });
    }
  });
  al(qa * ra); L.tx(lab('c9 válasz'), 44, qy + qh - 26, { k: 'c9 válasz', s: 24, w: 700 });
  srcLine('c9 adatbázis', 20, 1062, p(2.8));
}

/* ════════════════════════════════════════════════════════════════ */
const pick8 = (id) => { S8.sel = id; S8.selT = L.st; };
const STEPS = [
  { settle: 5.0, enter() { togReset(S1, 0); },
    controls(L) { L.button(lab('gomb vallás'), () => setTo(S1, 0), 'gomb vallás'); L.button(lab('gomb faj'), () => setTo(S1, 1), 'gomb faj'); } },
  { settle: 6.0, enter() { S2.sel = null; S2.selT = -9; }, leave() { L.stage.style.cursor = ''; },
    controls(L) { P2.forEach((P, i) => L.button(lab(P.btn), () => { S2.sel = i; S2.selT = L.st; }, P.btn)); } },
  { settle: 3.6 },
  { settle: 4.4, enter() { S4.f = 0; },
    controls(L) { [['gomb konc', 1], ['gomb megs', 2], ['gomb mind', 0]].forEach(([k, f]) => L.button(lab(k), () => { S4.f = f; }, k)); } },
  { settle: 5.6, enter() { S5.f = -1; S5.prev = -1; S5.fT = -9; },

  { settle: 2.0, enter() { resetZones(); S6.src = 'V'; S6.sT = -9; },

      [['gomb f V', 'V'], ['gomb f F', 'F'], ['gomb f D', 'D']].forEach(([k, v]) => L.button(lab(k), () => { S6.src = v; S6.sT = L.st; }, k));
    } },
  { settle: 5.0 },
  { settle: 3.8, enter() { S8.sel = 'getto'; S8.selT = -9; }, leave() { L.stage.style.cursor = ''; } },
  { settle: 3.6, enter() { S9.v = null; S9.t = -9; },
    controls(L) { ['v1', 'v2', 'v3'].forEach((v) => L.button(lab('gomb ' + v), () => { if (!S9.v || S9.v !== v) { S9.t = S9.v ? S9.t : L.st; S9.v = v; } }, 'gomb ' + v)); } },
];
const zonesTo = (n) => { S6.n = n; S6.t0 = L.st - 5; };
window.__qaStates = {

  2: [{ name: 'numerus-clausus', set(L) { S2.sel = 0; S2.selT = L.st - 2; } }, { name: 'munkaszolgalat', set(L) { S2.sel = 2; S2.selT = L.st - 2; } }, { name: 'masodik', set(L) { S2.sel = 3; S2.selT = L.st - 2; } }],
  4: [{ name: 'koncentracios', set() { S4.f = 1; } }, { name: 'megsemmisito', set() { S4.f = 2; } }],
  5: [{ name: 'csendorseg', set(L) { S5.prev = 2; S5.f = 2; S5.fT = L.st - 2; } }, { name: 'nemet', set(L) { S5.prev = 0; S5.f = 0; S5.fT = L.st - 2; } }],
  6: [{ name: 'zona-1', set() { zonesTo(1); } }, { name: 'zona-2', set() { zonesTo(2); } }, { name: 'zona-3', set() { zonesTo(3); } }, { name: 'zona-4', set() { zonesTo(4); } },
    { name: 'ferenczy', set(L) { zonesTo(4); S6.src = 'F'; S6.sT = L.st - 2; } }, { name: 'degob', set(L) { zonesTo(4); S6.src = 'D'; S6.sT = L.st - 2; } }],
  8: [{ name: 'nemzetkozi', set(L) { pick8('nemz'); S8.selT = L.st - 2; } }, { name: 'uveghaz', set(L) { pick8('uveg'); S8.selT = L.st - 2; } }, { name: 'bokreta', set(L) { pick8('bokreta'); S8.selT = L.st - 2; } }, { name: 'dunapart', set(L) { pick8('duna'); S8.selT = L.st - 2; } }],
  9: [{ name: 'tettesek', set(L) { S9.v = 'v1'; S9.t = L.st - 2; } }, { name: 'tulelok', set(L) { S9.v = 'v2'; S9.t = L.st - 2; } }],
};

L = Lesson.create({
  content: window.LESSON_CONTENT,
  home: false,
  resetCtx: true,
  steps: STEPS,
  init(Lx) {
    L = Lx; c = L.ctx;
    SRC = TortSource.create(L, { 'forrás': K('forrás jel'), 'rekonstrukció': K('rekonstrukció jel'), 'monda': K('monda jel'), 'becslés': K('becslés'), 'vázlatos': K('vázlatos'), 'illusztráció': K('illusztráció') });
    TT = { bc: K('Kr. e.'), ad: K('Kr. u.'), cent: K('század'), years: K('év sablon') };
    const PK = TortProj.lcc({ lon0: 20, lat0: 47, lat1: 45, lat2: 49 });
    MAPK = TortMap.create({ proj: PK, layers: [{ data: window.TORT_MAP_KARPAT }] });
    TK = TortTerr.create(L, window.TORT_HATAR, { map: MAPK });
    const PE = TortProj.lcc({ lon0: 16, lat0: 51, lat1: 45, lat2: 56 });
    MAPE = TortMap.create({ proj: PE, layers: [{ data: window.TORT_MAP_VILAG }, { data: window.TORT_MAP_EUROPA }] });
    TE = TortTerr.create(L, window.TORT_HATAR, { map: MAPE });
    MAPC = TortMap.create({ proj: TortCity.proj(), layers: [{ data: window.TORT_MAP_KARPAT }] });
    CITY = TortCity.create(L, { map: MAPC, T: { duna: K('Duna'), margit: K('Margit-sziget'), pest: K('város Pest'), buda: K('város Buda') } });
    V1 = TortMap.fit(PK, [16.0, 44.5, 26.9, 49.7], [20, 116, 620, 430]);
    V3 = TortMap.fit(PE, [14.6, 44.8, 28.6, 49.9], [20, 116, 1320, 576]);
    V4 = TortMap.fit(PE, [3.0, 46.2, 25.5, 55.2], [20, 116, 860, 620]);
    V6 = TortMap.fit(PK, [16.0, 44.6, 26.9, 49.6], [20, 116, 820, 580]);
    V7 = TortMap.fit(PE, [14.5, 45.4, 26.5, 50.8], [20, 116, 1320, 560]);
    V8 = TortMap.fit(TortCity.proj(), [19.012, 47.476, 19.088, 47.530], [20, 116, 820, 920]);

    L.checks = () => {
      const zs = Z6.reduce((s, Z) => s + L.num(Z.n), 0), tot = L.num('Veesenmayer összesítés');
      const ord = ['numerus clausus kihirdetése', 'első zsidótörvény kihirdetése', 'honvédelmi törvény kihirdetése', 'második zsidótörvény kihirdetése', 'harmadik zsidótörvény kihirdetése',
        'földtörvény kihirdetése', 'német megszállás', 'Sztójay-kormány', 'sárga csillag rendelet', 'sárga csillag viselése', 'gettósítás kezdete', 'deportálás kezdete', 'deportálás leállítása', 'deportálás vége',
        'nyilas hatalomátvétel', 'gettó lezárása', 'nemzetközi gettó felszabadulása', 'gettó felszabadulása'];
      const ordOk = ord.every((k, i) => i === 0 || ya(ord[i - 1]) < ya(k));
      const zd = Z6.every((Z, i) => ya(Z.d0) <= ya(Z.d1) && (i === 0 || ya(Z6[i - 1].d1) < ya(Z.d0)));
      const ze = ya(Z6[0].d0) === ya('deportálás kezdete') && ya(Z6[3].d1) === ya('deportálás vége');

      const cs = CT.every((C) => C.k || C.m), mix = CT.filter((C) => C.k && C.m).map((C) => C.id).sort().join(',');
      const iv = TORT_HATAR.groups.zonak1944.IV.includes('RS-03.bacs');
      return [{ name: 'a zónák összege = Veesenmayer összesítése (437 402)', ok: zs === tot, got: zs, want: tot },
        { name: 'a dátumok időrendben (1920 → 1945)', ok: ordOk, got: ordOk, want: true },
        { name: 'a zónák egymás után, a deportálás kezdetétől a végéig', ok: zd && ze, got: zd + ' / ' + ze, want: 'true / true' },

        { name: 'a IV. zónában benne van a Délvidék Tiszától nyugatra eső része (RS-03.bacs)', ok: iv, got: iv, want: true }];
    };
  },
  draw(Lx) {
    L = Lx; c = L.ctx; GA = 1; paper(); grid(.035);
    const sp = L.sp, wt = (i) => clamp(1 - Math.abs(sp - i) * 2);
    sT[L.step] = L.st;
