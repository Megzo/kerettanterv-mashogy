/* Átvett modulok (bájtra azonosan, pilot/tortenelem-7-8/terv.md 4.1): TtTipp, TortMap, TortTimeline, TortSource,

/* ── MODUL: „Tippelj!” és bélyegek (TtTipp) · forrás: termeszettudomany-5-6/01-tocsa + 03-meres, egységesítve 2026-11-24 ── */
/* A természettudomány 5–6. sorozat közös mintái (szerződés 17.): kísérlet-/modellbélyeg és a „Tippelj! → kísérlet →
   magyarázat” jóslat. Csak a Lesson motorra épül (L.ctx, L.tx, L.pill, L.lab, L.button, L.controlsEl, L.panel, L.st,
   Lesson.U, Lesson.FONTS); a lecke kódjára nem hivatkozik. A panel elmosásához szükséges CSS-t (.tt-rejtett) és a
   letiltott csúszka halványítását a modul maga teszi a <head>-be – a leckében nem kell <style>-sor.

   BEKÖTÉS (a lecke kódjában, egyszer, legfelső szinten – a getterek miatt a sorrend mindegy):
     TtTipp.bind({ L: () => L, ga: () => GA });    // ga: a lecke alap-alfája (jelenet-áttűnés); alap: () => 1
     const { stamp, Tip, tipReset, panelVeil, veilIf, tipGuess, tipHide, tipControls, tipU, rhythm, tipHead, tipRow,
       tipFeedback } = TtTipp;
   ALFA: minden rajzoló a globalAlpha-t ga() · a (· belső áttűnés) értékre ÁLLÍTJA (nem szoroz a pillanatnyival, így
   egy korábbi halvány felirat nem tünteti el), a vonalstílust (lineCap/lineJoin/setLineDash) visszaállítja.

   stamp(kind, x, y, a, o) → doboz | null       kísérlet-/modellbélyeg a KemGHS.stamp stílusával (Bricolage 22 px,
        600, betűköz 0,08 em, −3°, papír alap, 2 px keret; 'tilos': 700, 3 px). (x, y): a bal szél közepe.
        Szöveg: az o.k || '<kind> bélyeg' .md-kulcs. Szín (STAMP): otthon kékeszöld, felnőtt okker, tilos #b3261e;
        tanári, modell, kitalált, nem méretarányos, sematikus, vázlatos, képzeletbeli (és minden más) halvány tinta.
        o = {k, col (szín felülírása), rot: −3 (fok), al: 'left' (igazítás)}. a ≤ 0,005 → nem rajzol.
   Tip(keys, ok) → P      jóslat-állapot. keys: a válaszok .md-kulcsai (egyben gombfeliratok), ok: a helyes kulcs (az
        init-ben is beállítható: P.ok = …). P = {keys, ok, guess: null | kulcs, gt: a választás L.st-je, btns, on}.
        P.on(k): választáskor hívódik (a lecke állítja, pl. a kísérlet vezérlőinek feloldására).
   tipReset(P)            alaphelyzet (az enter()-ben; utána veilIf(P)).
   panelVeil(on)          a panelszöveg 2. bekezdésétől (.lp-text > *, i > 0) elmos (on) / felold.
   veilIf(P)              panelVeil(!P.guess) – az enter()-ben a tipReset után.
   tipControls(P)         a tippgombok (L.button, P.keys sorrendben). A választás után csak ezek tűnnek el: a
        sorukba utána tett más gombok maradnak (ha a sorban nem marad látható gomb, a sor is eltűnik).
   tipGuess(P, k, gt)     választás (csak az első számít): P.guess = k, P.gt = gt ?? L.st, tipHide, panelVeil(false),
        P.on(k). A QA-állapotok is ezt hívhatják (pl. gt = L.st − 30: a kísérlet már lefutott).
   tipHide(P)             a tippgombok elrejtése (a tipGuess hívja; QA-állapotban kézzel is).
   tipU(P, st) → mp       a választás óta eltelt idő (st − P.gt), −1, ha még nincs tipp.
   rhythm(ph, a)          a „Tippelj! → kísérlet → magyarázat” sáv a vászon bal felső sarkában (x 40, y 46);
        ph: 0 / 1 / 2 az aktív szakasz.
   tipHead(P, st, a, qk, o) → y     fejléc: sáv + kérdés (qk, (40, 116), Fraunces 38, max 1280) + válaszsor (40, y).

   Később változtatás nélkül átemelhető: shared/tort/timeline.js. Csak a Lesson motorra épül
   (L.ctx, L.tx, L.pill, L.measure, L.pointer, L.stage, L.toStage, L.t, L.VW).

   IDŐ-KOORDINÁTA (u): folytonos, csillagászati években. Az „a” csillagászati év
   (Kr. e. 1 = 0, Kr. e. 753 = −752, Kr. u. 476 = 476 – ez a build `L.dat(k).a` mezője) az
   [a, a + 1) szakasz a szalagon; egy évszám-esemény a közepén áll: u = a + 0,5. Dátum: u = d.a.
   Eltelt évek: a2 − a1 (0. év nincs: Kr. e. 1 → Kr. u. 1 = 1 év). A kezdőpont (Kr. u. 1 eleje): u = 1.

   TortTimeline.Y – évszám-aritmetika (tiszta függvények; T = szövegek, lent):
     Y.u(d)               build-adat ({t:'year'|'date', a}) → u; szám esetén csillagászati év → a + 0,5
     Y.year(u)            u → csillagászati év (egész)        Y.num(a) → a kiírt szám (Kr. e. 753 → 753)
     Y.astro(v), Y.hist(a)  történeti év (−753) ↔ csillagászati (−752)
     Y.label(a, T, ad)    'Kr. e. 753' · '476' · 'Kr. u. 476' (ad = true)   Y.key(a, T, ad) → md-kulcs
     Y.range(a0, a1, T)   'Kr. e. 7–4' · '1914–1918' · 'Kr. e. 4 – Kr. u. 30'
     Y.elapsed(a1, a2)    a2 − a1
     Y.formula(a1, a2)    '776 − 753 = 23' · '753 + 476 − 1 = 1228' · '2026 − 2015 = 11'
     Y.century(a)         {n, bc}: 1801…1900 → {n: 19}; Kr. e. 776 → {n: 8, bc: true}
     Y.centurySpan(n, bc) [a0, a1) csillagászati évek: 19 → [1801, 1901); Kr. e. 1. → [−99, 1)
     Y.centuryLabel(a, T, short)  '19. század' · 'Kr. e. 8. század' · (short) '19.'
     Y.centuryRule(a)     '18|48 → 18 + 1 = 19' · '19|00 → 19'
     Y.lerpView(v0, v1, t)  két nézet ([u0, u1]) között: logaritmikus lépték, a nagyítás közben a
                          középpont a léptékkel arányosan mozog (zoom-ki/zoom-be szép)
   T (a lecke .md-jéből, mind {s, k}; k = md-kulcs a review módhoz):
     {bc: 'Kr. e.', ad: 'Kr. u.', cent: 'század', years: '# év'}

   const tl = TortTimeline.create(L, {x0, x1, y, h: 64, T, src, bounds: [uMin, uMax], minSpan, maxSpan,
                                      epoch: aKezdő?, pinY?})
     src: TortSource-példány (C modul) a kártyakeretekhez és a „becslés” bélyeghez (opcionális).
     epoch: más kezdőpontú vonalzó (pl. Róma alapítása): a felirat n = a − epoch + 1, előtte üres.
     tl.view(u0, u1) · tl.x(u) · tl.u(x) · tl.ppy (px/év) · tl.span() · tl.top/bot · tl.R (sorok y-ja)
     tl.draw(d)   szalag + osztás + feliratok + sávok. d = {a, bands: [{u0, u1, col, a}], sides,
                  origin, caption: {s, k, a, right}, cent, centHi: év, eras: [...], eraA, eraOut, ad}
                  eras: [{u0, u1, name: {s, k}, col, fade0: [ua, ub], fade1: [ua, ub]}] (fade = elmosódó határ)
     tl.cards(items, {pitch})   eseménykártyák a szalag fölött, vezetővonallal. item = {u, title: {s, k},
                  date?: {s, k}, note?: {s, k, c}, layer: 'forrás' | 'rekonstrukció' | 'monda' | null,
                  est: bool (→ „becslés” bélyeg), row: 0..2, a, hi}
     tl.card(item, x, y) / tl.cardSize(item) / tl.cardPos(item)   egy kártya tetszőleges helyen (pl. tálcán)
     tl.pins = [{u, col, ad?}]  húzható tűk;  tl.drawPins({a, pinY, top, bracket, caption(e), sub(e, a1, a2),
                  label(pin, év) → [{s, k, c}, …], hint: {s, k}})
     tl.interact({pins, pan, zoom, snap: [u…], onView(v)}) → true, ha egy tű elmozdult. Minden képkockán
                  hívd (a nézet beállítása után); a görgő nagyít, a szalag húzása pásztáz.
     tl.user      a felhasználó által beállított nézet ([u0, u1]) vagy null · tl.setUser(u0, u1) · tl.zoomTo(span)
   TortTimeline.mini(L, {x, y, w, h, u0, u1, eras, win: [u0, u1], cap: {s, k}, ends: [{s, k}, {s, k}], a})
                  kis „hol tartunk?” sáv: a teljes időszak korszakszínekkel, rajta a látható ablak.
   ──────────────────────────────────────────────────────────────────────────────── */
const TortTimeline = (() => {
  const F = Lesson.FONTS, U = Lesson.U, NB = ' ', MINUS = '−', TAU = Math.PI * 2;
  const INK = '#1c2440', MUT = '#565d72', RED = '#c8401c', CARD = '#fffaf1', OCHRE = '#8f5a0c';
  const TF = { f: F.B, s: 22, w: 500 };
  const STEPS = [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000, 2000, 5000, 10000, 20000];

  const Y = {
    astro: (v) => (v < 0 ? v + 1 : v),
    hist: (a) => (a <= 0 ? a - 1 : a),
    u: (d) => (typeof d === 'number' ? d + .5 : d.t === 'date' ? d.a : d.a + .5),
    year: (u) => Math.floor(u),
    num: (a) => (a <= 0 ? 1 - a : a),
    label: (a, T, ad) => (a <= 0 ? T.bc.s + NB + (1 - a) : (ad ? T.ad.s + NB : '') + a),
    key: (a, T, ad) => (a <= 0 ? T.bc.k : ad ? T.ad.k : null),
    range: (a0, a1, T) => {
      if (a0 > a1) [a0, a1] = [a1, a0];
      if (a1 <= 0) return T.bc.s + NB + (1 - a0) + '–' + (1 - a1);
      if (a0 >= 1) return a0 + '–' + a1;
      return Y.label(a0, T) + ' – ' + Y.label(a1, T, true);
    },
    elapsed: (a1, a2) => a2 - a1,
    formula: (a1, a2) => {
      const lo = Math.min(a1, a2), hi = Math.max(a1, a2), e = hi - lo;
      if (hi <= 0) return `${1 - lo} ${MINUS} ${1 - hi} = ${e}`;
      if (lo >= 1) return `${hi} ${MINUS} ${lo} = ${e}`;
      return `${1 - lo} + ${hi} ${MINUS} 1 = ${e}`;
    },
    century: (a) => (a >= 1 ? { n: Math.ceil(a / 100), bc: false } : { n: Math.ceil((1 - a) / 100), bc: true }),
    centurySpan: (n, bc) => (bc ? [1 - 100 * n, 101 - 100 * n] : [100 * n - 99, 100 * n + 1]),
    centuryLabel: (a, T, short) => { const c = Y.century(a); return (c.bc ? T.bc.s + NB : '') + c.n + '.' + (short ? '' : NB + T.cent.s); },
    centuryKeys: (a, T) => (Y.century(a).bc ? [T.cent.k, T.bc.k] : [T.cent.k]),
    centuryRule: (a) => {
      const y = Y.num(a), n = Y.century(a).n, h = Math.floor(y / 100), t = y % 100;
      return t === 0 ? `${h}|00 → ${n}` : `${h}|${String(t).padStart(2, '0')} → ${h} + 1 = ${n}`;
    },
    lerpView: (v0, v1, t) => {
      const s0 = v0[1] - v0[0], s1 = v1[1] - v1[0], c0 = (v0[0] + v0[1]) / 2, c1 = (v1[0] + v1[1]) / 2;
      const s = Math.exp(U.lerp(Math.log(s0), Math.log(s1), t));
      const k = Math.abs(Math.log(s1 / s0)) > .25 ? (s - s0) / (s1 - s0) : t;
      const m = U.lerp(c0, c1, k);
      return [m - s / 2, m + s / 2];
    },
  };

  function create(L, o) {
    const T = o.T;
    const tl = { o, T, src: o.src || null, x0: o.x0, x1: o.x1, y: o.y, h: o.h || 64, pins: [], user: null, drag: null,
      bounds: o.bounds || [-1e6, 1e6], minSpan: o.minSpan || 4, maxSpan: o.maxSpan || 1e5, epoch: o.epoch == null ? null : o.epoch };
    tl.top = tl.y - tl.h / 2; tl.bot = tl.y + tl.h / 2;
    tl.R = { tick: tl.bot + 31, cent: tl.bot + 44, centH: 40, era: tl.bot + 96, eraH: 48 };
    tl.pinY = o.pinY || tl.R.era + tl.R.eraH + 40;
    tl.view = (u0, u1) => { tl.u0 = u0; tl.u1 = u1; tl.ppy = (tl.x1 - tl.x0) / (u1 - u0); return tl; };
    tl.view(0, 100);
    tl.x = (u) => tl.x0 + (u - tl.u0) * tl.ppy;
    tl.u = (x) => tl.u0 + (x - tl.x0) / tl.ppy;
    tl.span = () => tl.u1 - tl.u0;
    const inView = (x, m = 0) => x >= tl.x0 - m && x <= tl.x1 + m;

    /* azok a csillagászati évek, amelyek kiírt száma a lépésköz többszöröse (a szalag közepén: a + 0,5) */
    function yearsAt(step) {
      const out = [];
      if (tl.epoch != null) {
        const e = tl.epoch;
        for (let n = Math.max(step, Math.ceil((tl.u0 - e + .5) / step) * step); e + n - .5 <= tl.u1; n += step) out.push(e + n - 1);
        return out;
      }
      for (let n = Math.max(step, Math.ceil((tl.u0 - .5) / step) * step); n + .5 <= tl.u1; n += step) out.push(n);
      for (let y = Math.max(step, Math.ceil((1.5 - tl.u1) / step) * step); 1.5 - y >= tl.u0; y += step) out.push(1 - y);
      return out;
    }
    /* ad: true → „Kr. u. 5”; 'auto' (alap) → csak ha a kezdőpont látszik, és évenként/évtizedenként írunk */
    const adOn = (a, ad, step) => a >= 1 && (ad === true || (ad !== false && step <= 10 && tl.u0 < 1 && a < 1000));
    const tickText = (a, ad, step) => (tl.epoch != null ? { s: String(a - tl.epoch + 1), k: null } : { s: Y.label(a, T, adOn(a, ad, step)), k: Y.key(a, T, adOn(a, ad, step)) });
    function pickStep(ad) {
      for (const s of STEPS) {
        if (s * tl.ppy < 34) continue;
        const ys = yearsAt(s); let w = 0;
        for (const a of ys) w = Math.max(w, L.measure(tickText(a, ad, s).s, TF).w);
        if (s * tl.ppy >= w + 22) return s;
      }
      return 50000;
    }

    tl.draw = (d = {}) => {
      const c = L.ctx, A = d.a == null ? 1 : d.a; if (A <= .005) return;
      c.save(); c.globalAlpha *= A;
      const { x0, x1, top, h, bot } = tl, W = x1 - x0, ppy = tl.ppy;
      /* papírcsík */
      c.save(); c.shadowColor = 'rgba(70,50,20,.16)'; c.shadowBlur = 16; c.shadowOffsetY = 4;
      c.fillStyle = CARD; c.fillRect(x0, top, W, h); c.restore();
      const xb = tl.epoch != null ? tl.x(tl.epoch) : tl.x(1);      // a kezdőpont előtti rész halványan
      if (xb > x0) { c.fillStyle = tl.epoch != null ? 'rgba(28,36,64,.11)' : 'rgba(28,36,64,.07)'; c.fillRect(x0, top, Math.min(xb, x1) - x0, h); }
      for (const b of d.bands || []) {
        const xa = Math.max(x0, tl.x(b.u0)), xc = Math.min(x1, tl.x(b.u1)); if (xc <= xa) continue;
        c.save(); c.globalAlpha *= b.a == null ? 1 : b.a; c.fillStyle = b.col; c.fillRect(xa, top, xc - xa, h); c.restore();
      }
      /* osztás: évcellák (ha egy év ≥ 14 px), különben kis jelek */
      const step = pickStep(d.ad);
      c.save(); c.beginPath(); c.rect(x0, top, W, h); c.clip();
      c.strokeStyle = 'rgba(28,36,64,.30)'; c.lineWidth = 1.5; c.beginPath();
      if (ppy >= 14) {
        for (let a = Math.ceil(tl.u0); a <= tl.u1; a++) { const x = tl.x(a); c.moveTo(x, top); c.lineTo(x, bot); }
      } else {
        const minor = [step / 10, step / 5, step / 2].find((m) => m >= 1 && Number.isInteger(m) && m * ppy >= 7);
        if (minor) for (const a of yearsAt(minor)) { const x = tl.x(a + .5); c.moveTo(x, bot - 9); c.lineTo(x, bot); }
      }
      c.stroke();
      c.strokeStyle = INK; c.lineWidth = 2; c.beginPath();
      const ys = yearsAt(step);
      for (const a of ys) { const x = tl.x(a + .5); c.moveTo(x, bot - 15); c.lineTo(x, bot); }
      c.stroke();
      c.restore();
      for (const a of ys) {
        const x = tl.x(a + .5); if (!inView(x)) continue;
        const t = tickText(a, d.ad, step);
        L.tx(t.s, x, tl.R.tick, Object.assign({}, TF, { a: 'center', c: INK, k: t.k }));
      }
      c.strokeStyle = INK; c.lineWidth = 2.5; c.strokeRect(x0, top, W, h);
      c.fillStyle = INK; c.beginPath(); c.moveTo(x1 + 6, top + 10); c.lineTo(x1 + 28, tl.y); c.lineTo(x1 + 6, bot - 10); c.closePath(); c.fill();
      /* kezdőpont */
      if (d.origin !== false && inView(xb) && (tl.epoch != null || xb > x0)) {
        c.strokeStyle = tl.epoch != null ? OCHRE : RED; c.lineWidth = 3.5;
        c.beginPath(); c.moveTo(xb, top - 10); c.lineTo(xb, bot + 10); c.stroke();
      }
      if (d.sides && tl.epoch == null) {
        const sf = { f: F.B, s: 22, w: 700 }, lt = '← ' + T.bc.s, rt = T.ad.s + ' →';
        const wl = L.measure(lt, sf).w, wr = L.measure(rt, sf).w;
        if (xb - x0 > wl + 30 && xb < x1) L.tx(lt, xb - 14, tl.y + 8, Object.assign({}, sf, { a: 'right', c: MUT, k: T.bc.k }));
        if (x1 - xb > wr + 30 && xb > x0) L.tx(rt, xb + 14, tl.y + 8, Object.assign({}, sf, { a: 'left', c: INK, k: T.ad.k }));
      }
      if (d.caption && (d.caption.a == null || d.caption.a > .01)) {
        c.save(); c.globalAlpha *= d.caption.a == null ? 1 : d.caption.a;
        L.tx(d.caption.s, d.caption.right ? x1 - 16 : x0 + 16, tl.y + 8, { f: F.B, s: 22, w: 700, a: d.caption.right ? 'right' : 'left', c: MUT, k: d.caption.k });
        c.restore();
      }
      /* évszázadok sora */
      const cf = U.clamp((ppy * 100 - 36) / 30);
      if (d.cent > .005 && cf > 0) {
        c.save(); c.globalAlpha *= d.cent * cf;
        const y0 = tl.R.cent, hh = tl.R.centH, hiC = d.centHi != null ? Y.century(d.centHi) : null;
        let a = Math.floor(tl.u0);
        for (let g = 0; g < 400; g++) {
          const cc = Y.century(a), sp = Y.centurySpan(cc.n, cc.bc), xa = Math.max(x0, tl.x(sp[0])), xc = Math.min(x1, tl.x(sp[1]));
          if (xc > xa) {
            const hi = hiC && hiC.n === cc.n && hiC.bc === cc.bc;
            c.fillStyle = hi ? 'rgba(200,64,28,.20)' : (cc.n + (cc.bc ? 1 : 0)) % 2 ? 'rgba(28,36,64,.05)' : 'rgba(28,36,64,.12)';
            c.fillRect(xa, y0, xc - xa, hh);
            c.strokeStyle = 'rgba(28,36,64,.45)'; c.lineWidth = 1.5; c.beginPath();
            if (tl.x(sp[0]) >= x0) { c.moveTo(xa, y0); c.lineTo(xa, y0 + hh); }
            c.stroke();
            if (hi) { c.strokeStyle = RED; c.lineWidth = 2.5; c.strokeRect(xa, y0, xc - xa, hh); }
            const full = Y.centuryLabel(sp[0], T), short = Y.centuryLabel(sp[0], T, true), cf2 = { f: F.B, s: 22, w: hi ? 700 : 600 };
            const s = L.measure(full, cf2).w + 16 <= xc - xa ? full : L.measure(short, cf2).w + 12 <= xc - xa ? short : null;
            if (s) L.tx(s, (xa + xc) / 2, y0 + hh / 2 + 8, Object.assign({}, cf2, { a: 'center', c: hi ? RED : INK, k: Y.centuryKeys(sp[0], T) }));
          }
          if (sp[1] > tl.u1) break;
          a = sp[1];
        }
        c.strokeStyle = 'rgba(28,36,64,.5)'; c.lineWidth = 1.5; c.strokeRect(x0, y0, W, hh);
        c.restore();
      }
      /* korszakok sora */
      if (d.eras && d.eraA > .005) {
        c.save(); c.globalAlpha *= d.eraA;
        const y0 = tl.R.era, hh = tl.R.eraH, EF = { f: F.B, s: 24, w: 700 };
        for (const e of d.eras) {
          const ua = e.fade0 ? e.fade0[0] : e.u0, ub = e.fade1 ? e.fade1[1] : e.u1;
          const gx0 = tl.x(ua), gx1 = tl.x(ub), xa = Math.max(x0, gx0), xc = Math.min(x1, gx1);
          if (xc <= xa + .5) continue;
          const g = c.createLinearGradient(gx0, 0, gx1, 0), fa = U.rgba(e.col, .26), f0 = U.rgba(e.col, 0);
          const fr = (u) => U.clamp((tl.x(u) - gx0) / (gx1 - gx0));
          if (e.fade0) { g.addColorStop(0, f0); g.addColorStop(fr(e.fade0[1]), fa); } else g.addColorStop(0, fa);
          if (e.fade1) { g.addColorStop(fr(e.fade1[0]), fa); g.addColorStop(1, f0); } else g.addColorStop(1, fa);
          c.fillStyle = g; c.fillRect(xa, y0, xc - xa, hh);
          if (!e.fade0 && gx0 >= x0) { c.strokeStyle = e.col; c.lineWidth = 3; c.beginPath(); c.moveTo(gx0, y0); c.lineTo(gx0, y0 + hh); c.stroke(); }
          const sa = Math.max(x0, tl.x(e.fade0 ? e.fade0[1] : e.u0)), sb = Math.min(x1, tl.x(e.fade1 ? e.fade1[0] : e.u1));
          const lw = L.measure(e.name.s, EF).w;
          if (sb - sa >= lw + 16) L.tx(e.name.s, (sa + sb) / 2, y0 + hh / 2 + 9, Object.assign({}, EF, { a: 'center', c: INK, k: e.name.k }));
          else if (d.eraOut && sb > x0 && sa < x1) {
            const cx = U.clamp((sa + sb) / 2, x0 + lw / 2, x1 - lw / 2);
            L.tx(e.name.s, cx, y0 - 16, Object.assign({}, EF, { a: 'center', c: INK, k: e.name.k }));
            c.strokeStyle = U.rgba(INK, .5); c.lineWidth = 1.5; c.beginPath(); c.moveTo(cx, y0 - 12); c.lineTo((Math.max(sa, x0) + Math.min(sb, x1)) / 2, y0 + 4); c.stroke();
          }
        }
        c.strokeStyle = 'rgba(28,36,64,.5)'; c.lineWidth = 1.5; c.strokeRect(x0, y0, W, hh);
        c.restore();
      }
      c.restore();
    };

    /* ── eseménykártyák ── */
    const CT = { f: F.B, s: 24, w: 650 }, CD = { f: F.M, s: 22, w: 600 }, CN = { f: F.B, s: 22, w: 700 };
    tl.cardSize = (it) => {
      const src = tl.src, wt = L.measure(it.title.s, CT).w, wd = it.date ? L.measure(it.date.s, CD).w : 0;
      const ws = it.est && src ? src.stampSize('becslés').w + 14 : 0, wn = it.note ? L.measure(it.note.s, CN).w : 0;
      return { w: Math.max(wt, wd + ws, wn) + 34, h: 52 + (it.date ? 32 : 0) + (it.note ? 32 : 0) };
    };
    tl.card = (it, x, y) => {
      const c = L.ctx, src = tl.src, z = tl.cardSize(it);
      if (src) src.frame(x, y, z.w, z.h, it.layer || null, { hi: it.hi });
      else { c.beginPath(); c.roundRect(x, y, z.w, z.h, 10); c.fillStyle = CARD; c.fill(); c.strokeStyle = U.rgba(INK, .35); c.lineWidth = 2; c.stroke(); }
      L.tx(it.title.s, x + 17, y + 38, Object.assign({}, CT, { c: INK, k: it.title.k }));
      let yy = y + 38;
      if (it.date) {
        yy += 32; const b = L.tx(it.date.s, x + 17, yy, Object.assign({}, CD, { c: it.hi ? RED : INK, k: it.date.k }));
        if (it.est && src) src.stamp('becslés', x + 17 + b.w + 14, yy - 7);
      }
      if (it.note) { yy += 32; L.tx(it.note.s, x + 17, yy, Object.assign({}, CN, { c: it.note.c || INK, k: it.note.k })); }
      return z;
    };
    tl.rowBottom = (r, pitch) => tl.top - 24 - r * (pitch || 124);
    tl.cardPos = (it, pitch) => {
      const z = tl.cardSize(it), xe = tl.x(it.u), cx = U.clamp(xe, tl.x0 + z.w / 2, tl.x1 - z.w / 2), yb = tl.rowBottom(it.row || 0, pitch);
      return { x: cx - z.w / 2, y: yb - z.h, w: z.w, h: z.h, xe, yb };
    };
    tl.cards = (items, o = {}) => {
      const c = L.ctx;
      for (const it of items) {
        const A = it.a == null ? 1 : it.a; if (A <= .01) continue;
        const p = tl.cardPos(it, o.pitch), fade = U.clamp(1 - Math.max(tl.x0 - p.xe, p.xe - tl.x1, 0) / 24);
        if (fade <= .01) continue;
        c.save(); c.globalAlpha *= A * fade;
        const lx = U.clamp(p.xe, p.x + 14, p.x + p.w - 14), xe = U.clamp(p.xe, tl.x0, tl.x1);

/* ── MODUL: Kártyák (TortCards) ────────────────────────────────────────────────────

   (pl. két oszlop: falu / város), azonnali visszajelzéssel. Referencia: 07-kozepkori-varos.
   Később változtatás nélkül átemelhető: shared/tort/cards.js. Csak a Lesson motorra épül

   const g = TortCards.create(L, {

     cards: [{id, label: {s, k}, zone}],      // zone: a helyes zóna id-ja (a kódban rögzített megoldás)

     font?: {f, s, w},                        // kártyafelirat (alap: Bricolage 24 / 600)

   g.solve(t0?)               minden kártya a helyes zónába, kissé lépcsőzetesen

const TortCards = (() => {
  const F = Lesson.FONTS, U = Lesson.U;
  const INK = '#1c2440', MUT = '#565d72', CARD = '#fffaf1', GOOD = '#1d7a45', BAD = '#b3261e', RED = '#c8401c';

  function create(L, cfg) {
    const FT = Object.assign({ f: F.B, s: 24, w: 600 }, cfg.font || {});
    const gap = cfg.gap || 14, ease = cfg.ease || .45, PX = 18, H = FT.s + 30, ICON = 30;
    const zones = cfg.zones.map((z) => Object.assign({ head: 110 }, z));
    const cards = cfg.cards.map((q, i) => ({ id: q.id, label: q.label, zone: q.zone, i, at: null, ord: 0, from: null, tgt: null, t0: -99 }));
    const g = { zones, cards, touched: false, drag: null, _pd: false, _ord: 0, _hov: null };

    const zoneAt = (x, y) => zones.find((z) => x >= z.x && x <= z.x + z.w && y >= z.y && y <= z.y + z.h) || null;
    const cw = (q) => L.measure(q.label.s, FT).w + PX * 2 + ICON;
    const ez = (t) => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

    /* sorfolytonos elhelyezés egy téglalapban; center: a sorok középre igazítva */
    function flow(list, x, y, w, center) {
      const rows = [[]]; let cx = 0;
      for (const q of list) { const ww = cw(q); if (cx > 0 && cx + ww > w) { rows.push([]); cx = 0; } rows[rows.length - 1].push({ q, ww, x: cx }); cx += ww + gap; }
      const out = {};
      rows.forEach((r, ri) => {
        const rw = r.length ? r[r.length - 1].x + r[r.length - 1].ww : 0, off = center ? (w - rw) / 2 : 0;
        r.forEach((e) => { out[e.q.id] = { x: x + off + e.x, y: y + ri * (H + gap), w: e.ww }; });
      });
      return out;
    }
    let traySlots = null;
    const tray = () => { const t = cfg.tray, p = t.pad == null ? 24 : t.pad; return { x: t.x + p, y: t.y + (t.top == null ? 56 : t.top), w: t.w - p * 2 }; };
    function target(q) {
      if (!q.at) { if (!traySlots) { const t = tray(); traySlots = flow(cards, t.x, t.y, t.w, true); } return traySlots[q.id]; }
      const z = zones.find((zz) => zz.id === q.at), list = cards.filter((c2) => c2.at === q.at).sort((a, b) => a.ord - b.ord);

    }
    function disp(q) {
      const T = target(q);
      if (!q.tgt || Math.abs(T.x - q.tgt.x) > .5 || Math.abs(T.y - q.tgt.y) > .5) {   // új cél (pl. átrendeződés): onnan, ahol most van

    g.reset = () => { cards.forEach((q) => { q.at = null; q.ord = 0; q.from = null; q.tgt = null; q.t0 = -99; }); traySlots = null; g.drag = null; g.touched = false; g._ord = 0; };

      const T = target(q); q.from = { x: p.x, y: p.y }; q.tgt = { x: T.x, y: T.y }; q.t0 = t0 == null ? L.st : t0;

    g.update = () => {
      const p = L.pointer, edge = p.down && !g._pd; g._pd = p.down;
      const hit = () => { for (let i = cards.length - 1; i >= 0; i--) { const q = order()[i], d = disp(q); if (p.x >= d.x && p.x <= d.x + d.w && p.y >= d.y && p.y <= d.y + H) return { q, d }; } return null; };
      if (edge && p.x < L.VW && !g.drag) { const h = hit(); if (h) { g.drag = { q: h.q, dx: p.x - h.d.x, dy: p.y - h.d.y }; g.touched = true; } }
      if (g.drag && !p.down) {
        const d = g.drag, x = p.x - d.dx, y = p.y - d.dy, z = zoneAt(p.x, p.y), t = cfg.tray;
        const inTray = p.x >= t.x && p.x <= t.x + t.w && p.y >= t.y && p.y <= t.y + t.h;
        if (z) g.place(d.q, z.id, L.st, { x, y });
        else if (inTray) g.place(d.q, null, L.st, { x, y });
        else { d.q.from = { x, y }; d.q.t0 = L.st; }                  // máshová ejtve: vissza a helyére
        g.drag = null;
      }
      const h = g.drag ? null : (p.inside && p.x < L.VW ? hit() : null);
      g._hov = h ? h.q : null;
      if (L.stage) L.stage.style.cursor = g.drag ? 'grabbing' : h ? 'grab' : '';
    };
    const order = () => cards.slice().sort((a, b) => (a === (g.drag && g.drag.q) ? 1 : 0) - (b === (g.drag && g.drag.q) ? 1 : 0) || (a.at ? 1 : 0) - (b.at ? 1 : 0) || a.ord - b.ord || a.i - b.i);

    function mark(c, ok, x, y) {        // pipa / kereszt (rajz, nem szöveg)
      c.save(); c.lineCap = 'round'; c.lineJoin = 'round'; c.lineWidth = 4; c.strokeStyle = ok ? GOOD : BAD; c.beginPath();
      if (ok) { c.moveTo(x - 9, y); c.lineTo(x - 3, y + 7); c.lineTo(x + 10, y - 8); } else { c.moveTo(x - 7, y - 7); c.lineTo(x + 7, y + 7); c.moveTo(x + 7, y - 7); c.lineTo(x - 7, y + 7); }

      const ix = d.x + d.w - PX - 8, iy = d.y + H / 2;

      c.restore();
    }
    g.draw = (o = {}) => {
      const c = L.ctx, A = o.a == null ? 1 : o.a; if (A <= .01) return;
      c.save(); c.globalAlpha *= A;
      for (const z of zones) {
        c.beginPath(); c.roundRect(z.x, z.y, z.w, z.h, 16); c.fillStyle = 'rgba(255,250,241,.82)'; c.fill();
        c.setLineDash([10, 7]); c.lineWidth = 2.5; c.strokeStyle = U.rgba(INK, .5); c.stroke(); c.setLineDash([]);
        L.tx(z.title.s, z.x + 22, z.y + 54, { f: F.D, s: 40, w: 600, c: INK, k: z.title.k });
        if (z.sub) L.tx(z.sub.s, z.x + 22, z.y + 88, { f: F.B, s: 22, w: 500, c: MUT, k: z.sub.k });
        if (cfg.decor) { c.save(); cfg.decor(z, c.globalAlpha); c.restore(); }
      }
      const t = cfg.tray; c.beginPath(); c.roundRect(t.x, t.y, t.w, t.h, 16); c.fillStyle = 'rgba(28,36,64,.05)'; c.fill();
      c.lineWidth = 2; c.strokeStyle = U.rgba(INK, .25); c.stroke();
      const p = L.pointer;
      for (const q of order()) {
        if (g.drag && g.drag.q === q) continue;
        card(c, q, disp(q), q.from && L.st - q.t0 < ease);

      c.restore();
    };
    return g;
  }
  return { create };
})();

      const c = L.ctx, S = q.S, labs = q.labels || S.labels().map((s) => ({ s, k: q.k })), sw = 34, sh = 24, gap = 12;
      const LF = { f: F.B, s: 22, w: 500, c: INK }, TF = { f: F.B, s: 22, w: 700, c: MUT };

  const cs = [['n9 k1', 'n9 k1 sub'], ['n9 k2', 'n9 k2 sub'], ['n9 k3', 'n9 k3 sub', fmt(sh, 0)], ['n9 k4', 'n9 k4 sub']];
  let y = 110;
  cs.forEach(([k1, k2, v], i) => {
    const r = textCard(900, y, [{ k: k1, size: 28, w: 600, f: F.D, c: RED }, { s: v ? rep(k2, v) : lab(k2), kk: v ? [k2, 'hat hatalom területe', 'világ területe'] : k2, size: 22, w: 600 }], { a: p(.5 + i * .3), minW: 440, maxW: 440, pad: 14 });
    y += r.h + 10;
  });
  SRC.wrap(lab('n9 tovább'), 440, { f: F.B, s: 22, w: 700 }).forEach((ln, i) => { al(p(1.8)); L.tx(ln, 900, y + 34 + i * 30, { k: 'n9 tovább', s: 22, w: 700, c: INK }); });
  const ta = p(1.2), U9 = (k) => TortTimeline.Y.u(dat(k));
  TL9.view(1808, 1920);
  al(1); TL9.draw({ a: ta });
  TL9.cards([
    { u: U9('világháború'), title: K('ö 1914'), date: { s: L.val('világháború'), k: 'világháború' }, row: 2, a: ta, hi: true },
    { u: U9('antant 1907'), title: K('ö 1907'), date: { s: String(yr('antant 1907')), k: 'antant 1907' }, row: 1, a: ta },
    { u: U9('hármas szövetség'), title: K('ö 1882'), date: { s: String(yr('hármas szövetség')), k: 'hármas szövetség' }, row: 0, a: ta },
    { u: U9('császárság'), title: K('ö 1871'), date: { s: L.val('császárság'), k: 'császárság' }, row: 2, a: ta, hi: true },
    { u: U9('Olasz Királyság'), title: K('ö 1861'), date: { s: String(yr('Olasz Királyság')), k: 'Olasz Királyság' }, row: 1, a: ta },
    { u: U9('Kiáltvány'), title: K('ö 1848'), date: { s: L.val('Kiáltvány'), k: 'Kiáltvány' }, row: 0, a: ta },
    { u: U9('Német Szövetség'), title: K('ö 1815'), date: { s: String(yr('Német Szövetség')), k: 'Német Szövetség' }, row: 1, a: ta },
  ], { pitch: 84 });
}

/* ════════════════════════════════════════════════════════════════ */
const PB = {};   // hatalom-gombok (5. lépés)
const STEPS = [
  { settle: 4.2, enter() { togReset(S1, 0); }, controls(L) { L.button(lab('gomb nemzetállam'), toggler(S1, .8), 'gomb nemzetállam'); } },
  { settle: 4.4 },
  { settle: 8.4, enter() { S3.user = null; }, leave() { SL3 = null; },
    controls(L) { SL3 = L.slider({ label: lab('csúszka év'), k: 'csúszka év', min: 0, max: M_END(), step: 1, value: 0, format: (v) => monStr(v), onInput: (v) => { S3.user = monA(v); } }); } },
  { settle: 4.6 },
  { settle: 6.0, enter() { tipReset(P5); veilIf(P5); S5.sel = null; S5.selT = -9; }, leave() { L.stage.style.cursor = ''; },
    controls(L) { tipControls(P5); POW6.forEach((k) => L.button(lab('gomb ' + k), () => { if (tipU(P5, L.st) >= 0) selectP(S5.sel === k ? null : k); }, 'gomb ' + k)); } },
  { settle: 4.0, enter() { S6.sel = 0; S6.selT = -9; }, controls(L) { [1, 2, 3].forEach((n) => L.button(lab('gomb ' + n), () => { S6.sel = S6.sel === n ? 0 : n; S6.selT = L.st; }, 'gomb ' + n)); } },
  { settle: 2.0, enter() { CARDS.reset(); }, leave() { L.stage.style.cursor = ''; }, controls(L) { L.button(lab('gomb megoldás'), () => CARDS.solve(), 'gomb megoldás'); } },
  { settle: 3.2, enter() { togReset(S8, 0); }, controls(L) { L.button(lab('gomb összead'), toggler(S8, .9), 'gomb összead'); } },
  { settle: 3.2 },
];
const setMon = (k) => { S3.user = monA(monOf(ya(k)) + 1); if (SL3) SL3.set(monOf(S3.user)); };
window.__qaStates = {
  1: [{ name: 'nemzetallam', set() { togReset(S1, 1); } }],
  3: [{ name: '1866-okt', set() { setMon('porosz annexiók'); } }, { name: '1868', set() { setMon('Északnémet Szövetség'); } }, { name: '1815', set() { S3.user = monA(0); if (SL3) SL3.set(0); } }],
  5: [{ name: 'jo-tipp', set(L) { tipGuess(P5, 'tipp 100', L.st - 8); } }, { name: 'rossz-tipp', set(L) { tipGuess(P5, 'tipp 10', L.st - 1.5); } },
    { name: 'francia', set(L) { tipGuess(P5, 'tipp 50', L.st - 8); S5.sel = 'FR'; S5.selT = L.st - 2; } }, { name: 'amerikai', set(L) { tipGuess(P5, 'tipp 100', L.st - 8); S5.sel = 'US'; S5.selT = L.st - 2; } }],
  6: [{ name: 'balkan', set(L) { S6.sel = 1; S6.selT = L.st - 2; } }, { name: 'tenger', set(L) { S6.sel = 3; S6.selT = L.st - 2; } }],
  7: [{ name: 'megoldva', set(L) { CARDS.solve(L.st - 3); } }, { name: 'reszben', set(L) { CARDS.place('LIB1', 'LIB', L.st - 3); CARDS.place('SZOC1', 'KSZ', L.st - 3); } }],
  8: [{ name: 'osszead', set() { togReset(S8, 1); } }],
};

L = Lesson.create({
  content: window.LESSON_CONTENT,
  home: false,
  resetCtx: true,
  steps: STEPS,
  init(Lx) {
    L = Lx; c = L.ctx;
    SRC = TortSource.create(L, { 'forrás': K('forrás jel'), 'rekonstrukció': K('rekonstrukció jel'), 'monda': K('monda jel'), 'becslés': K('becslés'), 'vázlatos': K('vázlatos'), 'illusztráció': K('illusztráció') });
    TT = { bc: K('Kr. e.'), ad: K('Kr. u.'), cent: K('század'), years: K('év sablon') };
    buildVillages();
    // Európa (2–4. lépés): Lambert-kúpvetület, állandó nézetek (a TortTerr nézetenként gyorsítótáraz)
    const PE = TortProj.lcc({ lon0: 15, lat0: 50, lat1: 42, lat2: 58 });
    MAPE = TortMap.create({ proj: PE, layers: [{ data: window.TORT_MAP_VILAG }, { data: window.TORT_MAP_EUROPA }] });
    TE = TortTerr.create(L, window.TORT_HATAR, { map: MAPE });
    buildSets(TE); buildRules3();
    V23 = TortMap.fit(PE, [3.6, 45.3, 23.4, 55.9], MAPR);
    V4 = TortMap.fit(PE, [-10.0, 36.5, 42.0, 63.5], MAPR4);
    // világtérkép (5., 6., 9. lépés): Equal Earth, lon0 = 0
    PR = TortProj.equalEarth({ lon0: 0 });
    G = FoldChoro.load(window.FOLD_ORSZAGOK);
    G.CAT = FoldChoro.cat(CATK, CATK.map((k) => PAL[k]));
    G.ALLI = FoldChoro.cat(['H', 'h', 'A', 'a'], [HSZ, U.mix(LAND, HSZ, .45), ANT, U.mix(LAND, ANT, .45)]);
    const mk = () => FoldChoro.create(L, G, { land: LAND, edge: 'rgba(28,36,64,.45)', ew: 1, hatch: 'rgba(28,36,64,.32)' });
    CH5 = mk(); CH6 = mk(); CH9 = mk();
    const view = (bb, r) => TortProj.view(PR, TortProj.fit(PR, bb, [r[0], r[1], r[2], r[3]]));
    V5 = view([-180, -58, 180, 84], MAPR5);
    V6 = view([-14, 25, 52, 65], MAPR6);
    V9 = view([-180, -58, 180, 84], MAPR9);
    P5 = Tip(['tipp 10', 'tipp 50', 'tipp 100'], 'tipp 100');
    // 7. lépés: eszmék (TortCards)
    const ZW = 630, ZH = 250, ZY = 462;
    CARDS = TortCards.create(L, {
      zones: [
        { id: 'LIB', x: 40, y: ZY, w: ZW, h: ZH, title: K('e LIB'), sub: { s: rep('e LIB sub', yr('Mill műve')), k: ['e LIB sub', 'Mill műve'] }, head: 104 },
        { id: 'KON', x: 690, y: ZY, w: ZW, h: ZH, title: K('e KON'), sub: { s: rep('e KON sub', yr('Burke műve')), k: ['e KON sub', 'Burke műve'] }, head: 104 },
        { id: 'SZOC', x: 40, y: ZY + ZH + 16, w: ZW, h: ZH, title: K('e SZOC'), sub: { s: rep('e SZOC sub', yr('Kiáltvány')), k: ['e SZOC sub', 'Kiáltvány'] }, head: 104 },
        { id: 'KSZ', x: 690, y: ZY + ZH + 16, w: ZW, h: ZH, title: K('e KSZ'), sub: { s: rep('e KSZ sub', yr('Rerum novarum')), k: ['e KSZ sub', 'Rerum novarum'] }, head: 104 },
      ],
      cards: [['KON1', 'k KON 1', 'KON'], ['SZOC2', 'k SZOC 2', 'SZOC'], ['LIB1', 'k LIB 1', 'LIB'], ['KSZ2', 'k KSZ 2', 'KSZ'],
        ['SZOC1', 'k SZOC 1', 'SZOC'], ['LIB2', 'k LIB 2', 'LIB'], ['KSZ1', 'k KSZ 1', 'KSZ'], ['KON2', 'k KON 2', 'KON']].map(([id, k, zone]) => ({ id, label: K(k), zone })),
      tray: { x: 40, y: 120, w: 1280, h: 326, pad: 20, top: 24 },
      font: { f: F.B, s: 22, w: 600 },
    });
    TL9 = TortTimeline.create(L, { x0: 70, x1: 1300, y: 990, h: 46, T: TT, src: SRC, bounds: [1800, 1930] });
    L.checks = () => {
      const s = (f) => POW6.reduce((a, k) => a + f(pow5(k)), 0) / 1e6;
      const ord = EV3.every(([k], i) => i === 0 || ya(EV3[i - 1][0]) < ya(k));
      const ratio = num('brit birodalom területe') / num('Nagy-Britannia területe');
      const pick = P5.ok, ans = ratio > 100 ? 'tipp 100' : ratio > 30 ? 'tipp 50' : 'tipp 10';
      return [
        { name: 'gyarmatok területe összesen = 65,0 (a táblázat összesítője)', ok: Math.abs(s((d) => d.ca) - 65.0) < .05, got: fmt(s((d) => d.ca), 1), want: '65,0' },
        { name: 'anyaországok területe összesen = 16,5', ok: Math.abs(s((d) => d.ma) - 16.5) < .05, got: fmt(s((d) => d.ma), 1), want: '16,5' },
        { name: 'gyarmati népesség összesen = 523,4', ok: Math.abs(s((d) => d.cp) - 523.4) < .05, got: fmt(s((d) => d.cp), 1), want: '523,4' },
        { name: 'anyaországi népesség összesen = 437,2', ok: Math.abs(s((d) => d.mp) - 437.2) < .05, got: fmt(s((d) => d.mp), 1), want: '437,2' },
        { name: 'hat hatalom területe = gyarmatok + anyaországok (81,5)', ok: Math.abs(s((d) => d.ca + d.ma) - num('hat hatalom területe') / 1e6) < .05, got: fmt(s((d) => d.ca + d.ma), 1), want: L.val('hat hatalom területe') },
        { name: 'brit birodalom = gyarmatok + anyaország (33,8)', ok: Math.abs((num('brit gyarmatok területe') + num('brit anyaország területe')) - num('brit birodalom területe')) < 5e4, got: (num('brit gyarmatok területe') + num('brit anyaország területe')) / 1e6, want: 33.8 },
        { name: 'a tipp helyes válasza a számolt arányból (> 100×)', ok: pick === ans, got: fmt(ratio, 0) + '× → ' + ans, want: pick },
        { name: 'a brit sor összesen-hibája: 393,5 + 46,5 ≠ 444', ok: Math.abs(num('brit gyarmatok népessége') + num('brit anyaország népessége') - 440e6) < 1e4 && num('brit összesen a kiadásban') === 444e6, got: true, want: true },
        { name: 'a 3. lépés eseményei időrendben', ok: ord, got: ord, want: true },
        { name: 'a Német Császárság minden egysége szerepel a 1815–1871-es szabályokban', ok: SETS.REST.length === 0, got: SETS.REST.join(',') || 'mind', want: 'mind' },
        { name: 'a csempék száma = a tagállamok száma', ok: Math.round(num('tagállamok 1815')) === 39, got: num('tagállamok 1815'), want: 39 },
        { name: 'az 1. lépés modellje: van kisebbség és kívül rekedt falu', ok: NMIN > 0 && NOUT > 0, got: NMIN + ' / ' + NOUT, want: '> 0 / > 0' },
        { name: 'minden 1914-es hatalomnak van anyaországa a világtérképen', ok: CATK.every((k) => k === 'MAS' || METRO[k].every((iso) => G.by[iso])), got: true, want: true },
      ];
    };
  },
  draw(Lx) {
    L = Lx; c = L.ctx; GA = 1; paper(); grid(.04);
    const sp = L.sp, wt = (i) => clamp(1 - Math.abs(sp - i) * 2);
    sT[L.step] = L.st;
    const S = [scene1, scene2, scene3, scene4, scene5, scene6, scene7, scene8, scene9];
    for (let i = 0; i < 9; i++) { const w = wt(i); if (w > .005) { c.save(); S[i](sT[i], w, L.step === i); c.restore(); } }
    c.globalAlpha = 1;
  },
});
})();
</script>
