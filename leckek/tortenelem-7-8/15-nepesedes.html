<script>
/* ── MODUL: „Tippelj!” és bélyegek (TtTipp) · forrás: termeszettudomany-5-6/01-tocsa + 03-meres, egységesítve 2026-11-24 ── */
/* A természettudomány 5–6. sorozat közös mintái (szerződés 17.): kísérlet-/modellbélyeg és a „Tippelj! → kísérlet →
   magyarázat” jóslat. Csak a Lesson motorra épül (L.ctx, L.tx, L.pill, L.lab, L.button, L.controlsEl, L.panel, L.st,
   Lesson.U, Lesson.FONTS); a lecke kódjára nem hivatkozik. A panel elmosásához szükséges CSS-t (.tt-rejtett) és a
   letiltott csúszka halványítását a modul maga teszi a <head>-be – a leckében nem kell <style>-sor.

   BEKÖTÉS (a lecke kódjában, egyszer, legfelső szinten – a getterek miatt a sorrend mindegy):
     TtTipp.bind({ L: () => L, ga: () => GA });    // ga: a lecke alap-alfája (jelenet-áttűnés); alap: () => 1
     const { stamp, Tip, tipReset, panelVeil, veilIf, tipGuess, tipHide, tipControls, tipU, rhythm, tipHead, tipRow,
       tipFeedback } = TtTipp;
   ALFA: minden rajzoló a globalAlpha-t ga() · a (· belső áttűnés) értékre ÁLLÍTJA (nem szoroz a pillanatnyival, így
   egy korábbi halvány felirat nem tünteti el), a vonalstílust (lineCap/lineJoin/setLineDash) visszaállítja.

   stamp(kind, x, y, a, o) → doboz | null       kísérlet-/modellbélyeg a KemGHS.stamp stílusával (Bricolage 22 px,
        600, betűköz 0,08 em, −3°, papír alap, 2 px keret; 'tilos': 700, 3 px). (x, y): a bal szél közepe.
        Szöveg: az o.k || '<kind> bélyeg' .md-kulcs. Szín (STAMP): otthon kékeszöld, felnőtt okker, tilos #b3261e;
        tanári, modell, kitalált, nem méretarányos, sematikus, vázlatos, képzeletbeli (és minden más) halvány tinta.
        o = {k, col (szín felülírása), rot: −3 (fok), al: 'left' (igazítás)}. a ≤ 0,005 → nem rajzol.
   Tip(keys, ok) → P      jóslat-állapot. keys: a válaszok .md-kulcsai (egyben gombfeliratok), ok: a helyes kulcs (az
        init-ben is beállítható: P.ok = …). P = {keys, ok, guess: null | kulcs, gt: a választás L.st-je, btns, on}.
        P.on(k): választáskor hívódik (a lecke állítja, pl. a kísérlet vezérlőinek feloldására).
   tipReset(P)            alaphelyzet (az enter()-ben; utána veilIf(P)).
   panelVeil(on)          a panelszöveg 2. bekezdésétől (.lp-text > *, i > 0) elmos (on) / felold.
   veilIf(P)              panelVeil(!P.guess) – az enter()-ben a tipReset után.
   tipControls(P)         a tippgombok (L.button, P.keys sorrendben). A választás után csak ezek tűnnek el: a
        sorukba utána tett más gombok maradnak (ha a sorban nem marad látható gomb, a sor is eltűnik).
   tipGuess(P, k, gt)     választás (csak az első számít): P.guess = k, P.gt = gt ?? L.st, tipHide, panelVeil(false),
        P.on(k). A QA-állapotok is ezt hívhatják (pl. gt = L.st − 30: a kísérlet már lefutott).
   tipHide(P)             a tippgombok elrejtése (a tipGuess hívja; QA-állapotban kézzel is).
   tipU(P, st) → mp       a választás óta eltelt idő (st − P.gt), −1, ha még nincs tipp.
   rhythm(ph, a)          a „Tippelj! → kísérlet → magyarázat” sáv a vászon bal felső sarkában (x 40, y 46);
        ph: 0 / 1 / 2 az aktív szakasz.
   tipHead(P, st, a, qk, o) → y     fejléc: sáv + kérdés (qk, (40, 116), Fraunces 38, max 1280) + válaszsor (40, y).
        o = {tExp: 4,5 (a kísérlet hossza mp-ben: ennyi után vált a sáv „magyarázat”-ra, és mutatja a helyes
        választ), q2 (2. kérdéssor kulcsa, (40, 162); a válaszsor 46 px-szel lejjebb kerül), qv (a kérdés #-jeleinek
        értékei, sorban), y: 178 (a válaszsor közepe), noRhythm (a sáv nélkül – pl. olvasási kérdésnél)}.
        Visszaad: a válaszsor y-ja.
   tipRow(P, st, a, x, y, o) → [dobozok]    csak a válaszsor (a tipHead is ezt rajzolja), bárhová: a választásig
        semleges; a választott cinóber keretet és alatta „a te tipped” feliratot kap; o.tExp (0) mp múlva a helyes
        zöld keretet + pipát kap, a többi elhalványul. Dobozköz 54 px (a pipának).
   tipFeedback(P, st, a, x, y, o) → doboz | null    „Jó tipp!” (zöld) / „Sokan gondolják így – nézzük meg!”
        (kékeszöld) pill (x: bal szél, y: közép), a választás után 0,15 mp-cel beúszva. o = {s: 24, al: 'left', max}.
   .md-kulcsok (### Feliratok): tippelj felirat, kísérlet felirat, magyarázat felirat, a te tipped felirat, jó tipp
        felirat, rossz tipp felirat; a bélyegeké '<kind> bélyeg'.
   ──────────────────────────────────────────────────────────────────────────────────────────────────────── */
const TtTipp = (() => {
  'use strict';
  const U = Lesson.U, F = Lesson.FONTS, { clamp, lerp, smooth } = U;
  const INK = '#1c2440', MUT = '#565d72', RED = '#c8401c', TEAL = '#0a6f86', GOOD = '#1d7a45', BAD = '#b3261e', OKR = '#8f5a0c', CARD = '#fffaf1';
  const STAMP = { otthon: TEAL, felnőtt: OKR, tilos: BAD, tanári: MUT, modell: MUT, kitalált: MUT, 'nem méretarányos': MUT, sematikus: MUT, vázlatos: MUT, képzeletbeli: MUT };

    C7 = FC.create(L, { x: 150, y: 150, w: 720, h: 400, xs: { min: 1865, max: 2026, ticks: [1870, 1900, 1930, 1960, 1990, 2020] }, ys: { min: 4, max: 11, step: 1 } });
    C7b = FC.create(L, { x: 1010, y: 170, w: 320, h: 360, xs: { min: -.8, max: 2.6, ticks: [] }, ys: { min: -1600, max: 400, ticks: [-1600, -1200, -800, -400, 0, 400] } });
    /* 8. lépés */
    let m8 = 0; for (const loc of ['NGA', 'JPN']) D[loc].pyrPct.forEach((p) => { m8 = Math.max(m8, ...p.m, ...p.f); });
    MX8 = Math.ceil(m8);
    /* 9. lépés */
    TL = TortTimeline.create(L, { x0: 70, x1: 1310, y: 500, h: 56, T, src: SRC });
    reset2(); reset3(); reset5(); reset6(); reset8();

    L.checks = () => {
      const out = [], near = (a, b, e) => Math.abs(a - b) <= e;
      out.push({ name: 'világnépesség: alsó ≤ felső, azonos évek', ok: lo.x.join() === hi.x.join() && lo.y.every((v, i) => v <= hi.y[i]), got: lo.x.length, want: hi.x.length });
      const d78 = Number(MILE[7].s) - Number(MILE[6].s); out.push({ name: '7 → 8 milliárd: év különbség = .md', ok: d78 === N('hét–nyolc milliárd'), got: d78, want: N('hét–nyolc milliárd') });
      for (let n = 3; n <= 8; n++) { const y = FC.cross(W2.wx, W2.wy, n), m = MILE[n - 1].yr; out.push({ name: `${n} milliárd: a WPP 2024-görbe ±2,5 éven belül (utólagos javítás)`, ok: y != null && near(y, m, 2.5), got: y, want: m }); }
      out.push({ name: 'hány év oszlopok', ok: GAPS.map((g) => g.v).join() === '123,33,14,13,12,12,11', got: GAPS.map((g) => g.v).join(), want: '123,33,14,13,12,12,11' });
      out.push({ name: '1901: túlélők nem nőnek, 0 évesen 100', ok: LT.alive[0] === 100 && LT.alive.every((v, i) => !i || v <= LT.alive[i - 1]), got: LT.alive.join(), want: 'csökkenő' });
      out.push({ name: 'Semmelweis: I. klinika 1841–46 arány', ok: near(SEM.p[0], N('I. klinika aránya 1841–46'), .005), got: SEM.p[0], want: N('I. klinika aránya 1841–46') });
      out.push({ name: 'Semmelweis: II. klinika 1841–46 arány', ok: near(SEM.p[1], N('II. klinika aránya 1841–46'), .005), got: SEM.p[1], want: N('II. klinika aránya 1841–46') });
      const i48 = SEM.yI.x.indexOf(1848);
      out.push({ name: 'Semmelweis: 1848-as évenkénti arány = számolt', ok: near(SEM.yI.y[i48], SEM.p[2], .05) && near(SEM.yII.y[i48], SEM.p[3], .05), got: [SEM.yI.y[i48], SEM.yII.y[i48]], want: [SEM.p[2], SEM.p[3]] });
      out.push({ name: 'Semmelweis: a tipp helyes válasza a legközelebbi', ok: Math.round(SEM.p[0]) === 10, got: SEM.p[0], want: 10 });
      const fy = N('természetes fogyás kezdete'), ib = KSH.x.indexOf(fy);
      out.push({ name: 'KSH: a természetes fogyás kezdőéve', ok: KSH.d[ib] > KSH.b[ib] && KSH.d[ib - 1] < KSH.b[ib - 1], got: [KSH.b[ib - 1], KSH.d[ib - 1], KSH.b[ib], KSH.d[ib]], want: fy });
      out.push({ name: 'KSH: a születési arányszám 1876 óta nem nőtt a kezdő fölé', ok: Math.max(...KSH.b) === KSH.b[0] && KSH.x[0] === N('átmenet kezdőéve'), got: Math.max(...KSH.b), want: KSH.b[0] });
      out.push({ name: 'KSH: háborús évek (több halál)', ok: KSH.wars.map((w) => w.join('-')).join() === '1915-1918,1945-1945', got: KSH.wars.map((w) => w.join('-')).join(), want: '1915-1918,1945-1945' });
      const rb = N('születések 1954'); out.push({ name: 'Ratkó: születések 1954 (WPP vs .md, ±1,5 ezer)', ok: near(indAt('HUN', 'births', N('Ratkó csúcséve')) * 1e3, rb, 1500), got: indAt('HUN', 'births', 1954) * 1e3, want: rb });
      let mi = 0; CEN.y.forEach((v, i) => { if (v > CEN.y[mi]) mi = i; });
      out.push({ name: 'népszámlálás: csúcs éve és értéke', ok: CEN.x[mi] === N('népességcsúcs éve') && near(CEN.y[mi] * 1e6, N('népességcsúcs'), 600) && L.dat('népességcsúcs').yr === CEN.x[mi], got: [CEN.x[mi], CEN.y[mi]], want: [N('népességcsúcs éve'), N('népességcsúcs')] });
      const ic = CEN.x.indexOf(N('népszámlálás 2022 éve')); out.push({ name: 'népszámlálás 2022: sor ↔ szám', ok: ic >= 0 && near(CEN.y[ic] * 1e6, N('népszámlálás 2022'), 600), got: CEN.y[ic], want: N('népszámlálás 2022') });
      const nat = N('természetes fogyás 1981–2021'), mig = N('vándorlási többlet 1981–2021'), act = N('tényleges fogyás 1981–2021');
      out.push({ name: 'mérleg: −természetes + vándorlás = −tényleges', ok: near(-nat + mig, -act, 1), got: -nat + mig, want: -act });
      out.push({ name: 'mérleg időszaka', ok: L.dat('mérleg kezdete').ymd[0] === fy && L.dat('mérleg vége').ymd[0] === 2021, got: [L.dat('mérleg kezdete').ymd[0], L.dat('mérleg vége').ymd[0]], want: [fy, 2021] });
      out.push({ name: 'korfa 6: a skála ≥ a legnagyobb sáv', ok: MX6 >= mx && MX6 - mx < 50, got: mx, want: MX6 });
      out.push({ name: 'korfa 8: a skála ≥ a legnagyobb sáv', ok: MX8 >= m8 && MX8 - m8 < 1, got: m8, want: MX8 });
      out.push({ name: 'Ratkó-nemzedék: pillanatkép-index', ok: PY[RID] === 1955 && PY[CID] === 1980, got: [PY[RID], PY[CID]], want: [1955, 1980] });
      out.push({ name: 'előrejelzés kezdete = estLast + 1', ok: N('előrejelzés kezdete') === EST + 1, got: EST + 1, want: N('előrejelzés kezdete') });
      const ur = ['városlakók aránya 1950', 'városlakók aránya 2018', 'városlakók aránya 2050'].map((k) => L.dat(k));
      out.push({ name: 'városi arány: nő, évszám jelölve', ok: ur[0].v < ur[1].v && ur[1].v < ur[2].v && ur[2].proj && ur.every((d) => d.yr), got: ur.map((d) => d.v), want: 'növekvő' });
      const ev = EV9.map((e) => N(e[1])); out.push({ name: 'nők jogai: időrend', ok: ev.every((v, i) => !i || v >= ev[i - 1]), got: ev.join(), want: 'növekvő' });
      return out;
    };
    const guessQA = (P, k) => (L2) => { P.guess = k; P.gt = L2.st - 30; tipHide(P); panelVeil(false); };
    window.__qaStates = {
      1: [{ name: 'eleje', set(L2) { L2.st = 1.2; } }],
      2: [{ name: 'tipp-jó', set: guessQA(P2, 'tipp 11') }, { name: 'tipp-rossz', set: guessQA(P2, 'tipp 100') },
        { name: 'log', set(L2) { guessQA(P2, 'tipp 50')(L2); s2.log = true; s2.t0 = L2.st - 5; L2.controlsEl.querySelectorAll('.lp-btn').forEach((e) => { if (e.dataset.grp === 'gomb') e.classList.toggle('on', e.dataset.key === 'gomb log' || /logar/.test(e.textContent)); }); } }],
      3: [{ name: '5-eves', set(L2) { s3.prev = s3.A = 5; s3.t0 = L2.st - 5; } }, { name: '20-eves', set(L2) { s3.prev = s3.A = 20; s3.t0 = L2.st - 5; } }],
      4: [{ name: 'tipp-jó', set: guessQA(P4, 'tipp 10') }, { name: 'tipp-rossz', set: guessQA(P4, 'tipp 1') }],
      5: [1876, 1918, 2024].map((y) => ({ name: String(y), set(L2) { s5.yr = y; qaSl(L2, 'csúszka év 5', y); } })),
      6: [[1950, 0], [1980, 5], [2050, NG - 1], [1957, 14]].map(([y, g]) => ({ name: String(y), set(L2) { s6.from = s6.to = y; s6.sel = g; qaSl(L2, 'csúszka év 6', y); } })),
      8: [1950, 2100].map((y) => ({ name: String(y), set(L2) { s8.from = s8.to = y; qaSl(L2, 'csúszka év 8', y); } })),
    };
  },
  draw(Lx) {
    L = Lx; c = L.ctx; GA = 1; background();
    if (L.step >= 0) sT[L.step] = L.st;
    for (let i = 0; i < SCENES.length; i++) {
      const w = clamp(1 - Math.abs(L.sp - i) * 2); if (w <= .005) continue;
      GA = w; c.save(); c.globalAlpha = w; SCENES[i](sT[i], L.step === i); c.restore();
    }
    c.globalAlpha = 1;
  },
});
})();
