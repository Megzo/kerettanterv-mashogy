/* ── MODUL: „Tippelj!” és bélyegek (TtTipp) · forrás: termeszettudomany-5-6/01-tocsa + 03-meres, egységesítve 2026-11-24 ── */
/* A természettudomány 5–6. sorozat közös mintái (szerződés 17.): kísérlet-/modellbélyeg és a „Tippelj! → kísérlet →
   magyarázat” jóslat. Csak a Lesson motorra épül (L.ctx, L.tx, L.pill, L.lab, L.button, L.controlsEl, L.panel, L.st,
   Lesson.U, Lesson.FONTS); a lecke kódjára nem hivatkozik. A panel elmosásához szükséges CSS-t (.tt-rejtett) és a
   letiltott csúszka halványítását a modul maga teszi a <head>-be – a leckében nem kell <style>-sor.

   BEKÖTÉS (a lecke kódjában, egyszer, legfelső szinten – a getterek miatt a sorrend mindegy):
     TtTipp.bind({ L: () => L, ga: () => GA });    // ga: a lecke alap-alfája (jelenet-áttűnés); alap: () => 1
     const { stamp, Tip, tipReset, panelVeil, veilIf, tipGuess, tipHide, tipControls, tipU, rhythm, tipHead, tipRow,
       tipFeedback } = TtTipp;
   ALFA: minden rajzoló a globalAlpha-t ga() · a (· belső áttűnés) értékre ÁLLÍTJA (nem szoroz a pillanatnyival, így
   egy korábbi halvány felirat nem tünteti el), a vonalstílust (lineCap/lineJoin/setLineDash) visszaállítja.

   stamp(kind, x, y, a, o) → doboz | null       kísérlet-/modellbélyeg a KemGHS.stamp stílusával (Bricolage 22 px,
        600, betűköz 0,08 em, −3°, papír alap, 2 px keret; 'tilos': 700, 3 px). (x, y): a bal szél közepe.
        Szöveg: az o.k || '<kind> bélyeg' .md-kulcs. Szín (STAMP): otthon kékeszöld, felnőtt okker, tilos #b3261e;
        tanári, modell, kitalált, nem méretarányos, sematikus, vázlatos, képzeletbeli (és minden más) halvány tinta.
        o = {k, col (szín felülírása), rot: −3 (fok), al: 'left' (igazítás)}. a ≤ 0,005 → nem rajzol.
   Tip(keys, ok) → P      jóslat-állapot. keys: a válaszok .md-kulcsai (egyben gombfeliratok), ok: a helyes kulcs (az
        init-ben is beállítható: P.ok = …). P = {keys, ok, guess: null | kulcs, gt: a választás L.st-je, btns, on}.

    TIP = { A, ds, far, share: Math.round(100 * ds.filter((x) => x < 20).length / ds.length), max: Math.round(Math.max(...ds) / 5) * 5 };
    // lövészárok-metszet (TortScene, illusztráció)
    SC4 = TortScene.create({ L, frame: FR4, r: 18, views: { all: { x: FR4[0] + FR4[2] / 2, y: FR4[1] + FR4[3] / 2, z: 1 } },
      layers: [{ id: 'akkor', era: 'then', draw: sceneThen }, { id: 'most', era: 'now', draw: sceneNow }],
      hotspots: [{ id: 'árok', x: 270, y: 522, k: 'hs árok', info: 'hs árok i' }, { id: 'fedezék', x: 172, y: 612, k: 'hs fedezék', info: 'hs fedezék i' },
        { id: 'drót', x: 405, y: 452, k: 'hs drót', info: 'hs drót i', dx: 0, dy: -54 }, { id: 'senki', x: 668, y: 474, k: 'hs senki', info: 'hs senki i', dx: 0, dy: -62 },
        { id: 'gépfegyver', x: 1000, y: 440, k: 'hs gépfegyver', info: 'hs gépfegyver i', dx: -26, dy: -40 }, { id: 'tüzérség', x: 1262, y: 440, k: 'hs tüzérség', info: 'hs tüzérség i', dx: 0, dy: -54 }],
      stampK: 'illusztráció' });
    C6 = FoldChart.create(L, { x: 150, y: 190, w: 680, h: 640, xs: { min: 1912.4, max: 1918.6, ticks: [1913, 1914, 1915, 1916, 1917, 1918], fmt: (v) => String(v) }, ys: { min: 0, max: 700, step: 100 } });
    C8a = FoldChart.create(L, { x: 480, y: 600, w: 640, h: 56, xs: { min: 0, max: 15, step: 5, fmt: (v) => rep('h8 millió', v) }, ys: { min: 0, max: 1 } });
    C8b = FoldChart.create(L, { x: 480, y: 700, w: 640, h: 56, xs: { min: 0, max: 15, step: 5, fmt: (v) => rep('h8 millió', v) }, ys: { min: 0, max: 1 } });
    C8c = FoldChart.create(L, { x: 480, y: 890, w: 640, h: 56, xs: { min: 0, max: 800, step: 200, fmt: (v) => rep('h8 ezer', v) }, ys: { min: 0, max: 1 } });
    TL9 = TortTimeline.create(L, { x0: 70, x1: 1290, y: 960, h: 46, T: TT, src: SRC, bounds: [1900, 1930] });
    L.checks = () => {
      const order = ['merénylet', 'tiszai ülés', 'Tisza fordulata', 'ultimátum', 'Monarchia hadüzenete', 'orosz mozgósítás', 'német hadüzenet RU', 'német hadüzenet FR', 'brit hadüzenet', 'Monarchia hadüzenete RU',
        'oszmán hadba lépés', 'olasz hadba lépés', 'bolgár hadba lépés', 'Verdun kezdete', 'Somme első napja', 'román hadba lépés', 'Verdun vége', 'cár lemondása', 'USA hadba lépés', 'bolsevik hatalomátvétel', 'breszti béke',
        'piavei csata', 'bolgár fegyverszünet', 'oszmán fegyverszünet', 'padovai fegyverszünet', 'padovai hatály', 'compiègne-i fegyverszünet'];
      const ord = order.every((k, i) => i === 0 || ya(order[i - 1]) < ya(k));
      const keysOk = [WKEYS, EKEYS, RKEYS, IKEYS].every((ks) => ks.every((k, i) => i === 0 || ks[i - 1].a < k.a));
      const share = L.num('bevonultak Magyarország') / L.num('bevonultak Monarchia') * 100;
      const B = dat('születések'), r18 = B.y[5] / B.y[0], loss = B.y[1] * 4 - (B.y[2] + B.y[3] + B.y[4] + B.y[5]);
      const h = L.num('mo halott hadügyi'), e = L.num('mo eltűnt'), f = L.num('mo hadifogoly'), bel = h + e / 3 + (f + e * 2 / 3) / 6;

        { name: 'a háború hossza: 4 év 3 hónap', ok: yy === 4 && mm === 3, got: yy + ' év ' + mm + ' hónap', want: '4 év 3 hónap' },
        { name: 'Verdun: 302 nap', ok: days('Verdun kezdete', 'Verdun vége') + 1 === 302, got: days('Verdun kezdete', 'Verdun vége') + 1, want: 302 },

        { name: 'dátum → nap → dátum (merénylet)', ok: back === ymd, got: back, want: ymd },

  },
  draw(Lx) {

  },
});
