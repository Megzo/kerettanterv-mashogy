<script>
/* ── MODUL: „Tippelj!” és bélyegek (TtTipp) · forrás: termeszettudomany-5-6/01-tocsa + 03-meres, egységesítve 2026-11-24 ── */
/* A természettudomány 5–6. sorozat közös mintái (szerződés 17.): kísérlet-/modellbélyeg és a „Tippelj! → kísérlet →
   magyarázat” jóslat. Csak a Lesson motorra épül (L.ctx, L.tx, L.pill, L.lab, L.button, L.controlsEl, L.panel, L.st,
   Lesson.U, Lesson.FONTS); a lecke kódjára nem hivatkozik. A panel elmosásához szükséges CSS-t (.tt-rejtett) és a
   letiltott csúszka halványítását a modul maga teszi a <head>-be – a leckében nem kell <style>-sor.

   BEKÖTÉS (a lecke kódjában, egyszer, legfelső szinten – a getterek miatt a sorrend mindegy):
     TtTipp.bind({ L: () => L, ga: () => GA });    // ga: a lecke alap-alfája (jelenet-áttűnés); alap: () => 1
     const { stamp, Tip, tipReset, panelVeil, veilIf, tipGuess, tipHide, tipControls, tipU, rhythm, tipHead, tipRow,
       tipFeedback } = TtTipp;
   ALFA: minden rajzoló a globalAlpha-t ga() · a (· belső áttűnés) értékre ÁLLÍTJA (nem szoroz a pillanatnyival, így
   egy korábbi halvány felirat nem tünteti el), a vonalstílust (lineCap/lineJoin/setLineDash) visszaállítja.

   stamp(kind, x, y, a, o) → doboz | null       kísérlet-/modellbélyeg a KemGHS.stamp stílusával (Bricolage 22 px,
        600, betűköz 0,08 em, −3°, papír alap, 2 px keret; 'tilos': 700, 3 px). (x, y): a bal szél közepe.
        Szöveg: az o.k || '<kind> bélyeg' .md-kulcs. Szín (STAMP): otthon kékeszöld, felnőtt okker, tilos #b3261e;
        tanári, modell, kitalált, nem méretarányos, sematikus, vázlatos, képzeletbeli (és minden más) halvány tinta.
        o = {k, col (szín felülírása), rot: −3 (fok), al: 'left' (igazítás)}. a ≤ 0,005 → nem rajzol.
   Tip(keys, ok) → P      jóslat-állapot. keys: a válaszok .md-kulcsai (egyben gombfeliratok), ok: a helyes kulcs (az
        init-ben is beállítható: P.ok = …). P = {keys, ok, guess: null | kulcs, gt: a választás L.st-je, btns, on}.
        P.on(k): választáskor hívódik (a lecke állítja, pl. a kísérlet vezérlőinek feloldására).
   tipReset(P)            alaphelyzet (az enter()-ben; utána veilIf(P)).
   panelVeil(on)          a panelszöveg 2. bekezdésétől (.lp-text > *, i > 0) elmos (on) / felold.
   veilIf(P)              panelVeil(!P.guess) – az enter()-ben a tipReset után.
   tipControls(P)         a tippgombok (L.button, P.keys sorrendben). A választás után csak ezek tűnnek el: a
        sorukba utána tett más gombok maradnak (ha a sorban nem marad látható gomb, a sor is eltűnik).
   tipGuess(P, k, gt)     választás (csak az első számít): P.guess = k, P.gt = gt ?? L.st, tipHide, panelVeil(false),
        P.on(k). A QA-állapotok is ezt hívhatják (pl. gt = L.st − 30: a kísérlet már lefutott).
   tipHide(P)             a tippgombok elrejtése (a tipGuess hívja; QA-állapotban kézzel is).
   tipU(P, st) → mp       a választás óta eltelt idő (st − P.gt), −1, ha még nincs tipp.
   rhythm(ph, a)          a „Tippelj! → kísérlet → magyarázat” sáv a vászon bal felső sarkában (x 40, y 46);
        ph: 0 / 1 / 2 az aktív szakasz.
   tipHead(P, st, a, qk, o) → y     fejléc: sáv + kérdés (qk, (40, 116), Fraunces 38, max 1280) + válaszsor (40, y).
        o = {tExp: 4,5 (a kísérlet hossza mp-ben: ennyi után vált a sáv „magyarázat”-ra, és mutatja a helyes
        választ), q2 (2. kérdéssor kulcsa, (40, 162); a válaszsor 46 px-szel lejjebb kerül), qv (a kérdés #-jeleinek
        értékei, sorban), y: 178 (a válaszsor közepe), noRhythm (a sáv nélkül – pl. olvasási kérdésnél)}.
        Visszaad: a válaszsor y-ja.
   tipRow(P, st, a, x, y, o) → [dobozok]    csak a válaszsor (a tipHead is ezt rajzolja), bárhová: a választásig
        semleges; a választott cinóber keretet és alatta „a te tipped” feliratot kap; o.tExp (0) mp múlva a helyes
        zöld keretet + pipát kap, a többi elhalványul. Dobozköz 54 px (a pipának).
   tipFeedback(P, st, a, x, y, o) → doboz | null    „Jó tipp!” (zöld) / „Sokan gondolják így – nézzük meg!”
        (kékeszöld) pill (x: bal szél, y: közép), a választás után 0,15 mp-cel beúszva. o = {s: 24, al: 'left', max}.
   .md-kulcsok (### Feliratok): tippelj felirat, kísérlet felirat, magyarázat felirat, a te tipped felirat, jó tipp
        felirat, rossz tipp felirat; a bélyegeké '<kind> bélyeg'.
   ──────────────────────────────────────────────────────────────────────────────────────────────────────── */
const TtTipp = (() => {
  'use strict';
  const U = Lesson.U, F = Lesson.FONTS, { clamp, lerp, smooth } = U;
  const INK = '#1c2440', MUT = '#565d72', RED = '#c8401c', TEAL = '#0a6f86', GOOD = '#1d7a45', BAD = '#b3261e', OKR = '#8f5a0c', CARD = '#fffaf1';
  const STAMP = { otthon: TEAL, felnőtt: OKR, tilos: BAD, tanári: MUT, modell: MUT, kitalált: MUT, 'nem méretarányos': MUT, sematikus: MUT, vázlatos: MUT, képzeletbeli: MUT };
  const KEYS = { ph: ['tippelj felirat', 'kísérlet felirat', 'magyarázat felirat'], mine: 'a te tipped felirat', ok: 'jó tipp felirat', bad: 'rossz tipp felirat' };
  let getL = () => null, ga = () => 1;
  if (typeof document !== 'undefined' && !document.getElementById('tt-tipp-css')) {
    const st = document.createElement('style'); st.id = 'tt-tipp-css';
    st.textContent = '.lp-text > .tt-rejtett { filter: blur(7px); opacity: .5; user-select: none; transition: filter .6s, opacity .6s; }\n'
      + '.lp-slider:has(input:disabled) { opacity: .45; }\n.lp-slider input:disabled { cursor: not-allowed; }';
    document.head.appendChild(st);
  }
  const Lx = () => getL(), cx = () => getL().ctx, lab = (k) => getL().lab(k);
  const al = (a) => { cx().globalAlpha = ga() * clamp(a); };
  const fillIn = (s, v) => { let i = 0; return s.replace(/#/g, () => (i < v.length ? v[i++] : '#')); };
  const rr = (c, x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, w, h, r); };
  function check(x, y, a) {                 // pipa (rajz, nem betűjel)
    const c = cx(); al(a); c.lineWidth = 4.5; c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = GOOD; c.beginPath();
    c.moveTo(x - 10, y); c.lineTo(x - 3, y + 8); c.lineTo(x + 11, y - 9); c.stroke(); c.lineCap = 'butt'; c.lineJoin = 'miter';
  }
  function arrow(x1, y1, x2, y2, col, w, hs) {
    const c = cx(), an = Math.atan2(y2 - y1, x2 - x1), bx = x2 - Math.cos(an) * hs * .8, by = y2 - Math.sin(an) * hs * .8;
    c.setLineDash([]); c.lineCap = 'round'; c.beginPath(); c.moveTo(x1, y1); c.lineTo(bx, by); c.strokeStyle = col; c.lineWidth = w; c.stroke(); c.lineCap = 'butt';
    c.beginPath(); c.moveTo(x2, y2); c.lineTo(x2 - hs * Math.cos(an - .45), y2 - hs * Math.sin(an - .45)); c.lineTo(x2 - hs * Math.cos(an + .45), y2 - hs * Math.sin(an + .45)); c.closePath();
    c.fillStyle = col; c.fill();
  }

  function bind(o = {}) { if (o.L) getL = o.L; if (o.ga) ga = o.ga; }
  function stamp(kind, x, y, a, o = {}) {
    if (a <= .005) return null;
    const L = Lx(), c = L.ctx, k = o.k || (kind + ' bélyeg'), col = o.col || STAMP[kind] || MUT, tilos = kind === 'tilos';
    c.save(); al(a); c.translate(x, y); c.rotate((o.rot == null ? -3 : o.rot) * Math.PI / 180);
    const b = L.pill(lab(k), 0, 0, { s: 22, w: tilos ? 700 : 600, ls: '0.08em', f: F.B, bg: CARD, bd: col, bw: tilos ? 3 : 2, c: col, r: 6, pad: 10, k, qa: false, a: o.al || 'left' });
    c.restore(); return b;
  }
  const Tip = (keys, ok) => ({ keys, ok, guess: null, gt: -99, btns: [], on: null });
  function tipReset(P) { P.guess = null; P.gt = -99; }
  function panelVeil(on) {
    const L = Lx(); if (!L || !L.panel) return;
    L.panel.querySelectorAll('.lp-text > *').forEach((p, i) => { if (i > 0) p.classList.toggle('tt-rejtett', !!on); });
  }
  const veilIf = (P) => panelVeil(!P.guess);
  function tipHide(P) {
    const rows = new Set();
    (P.btns || []).forEach((b) => { b.style.display = 'none'; if (b.parentNode) rows.add(b.parentNode); });
    rows.forEach((r) => { if (![...r.children].some((e) => e.style.display !== 'none')) r.style.display = 'none'; });
  }
  function tipGuess(P, k, gt) {
    if (P.guess) return;
    P.guess = k; P.gt = gt == null ? Lx().st : gt;
    tipHide(P); panelVeil(false);
    if (P.on) P.on(k);
  }
  function tipControls(P) { const L = Lx(); P.btns = P.keys.map((k) => L.button(lab(k), () => tipGuess(P, k), k)); }
  const tipU = (P, st) => (P.guess ? st - P.gt : -1);
  function rhythm(ph, a) {
    const L = Lx(), cols = [RED, TEAL, OKR];
    let x = 40;
    KEYS.ph.forEach((k, j) => {
      const on = ph === j, done = ph > j;
      al(a * (on ? 1 : done ? .7 : .4));
      const b = L.pill(lab(k), x, 46, { k, s: 22, w: 700, f: F.B, c: on ? '#ffffff' : cols[j], bg: on ? cols[j] : CARD, bd: cols[j], bw: 2, pad: 10 });
      x = b.x + b.w;
      if (j < 2) { al(a * .55); arrow(x + 8, 46, x + 34, 46, MUT, 3, 11); x += 44; }
    });
  }
  function tipRow(P, st, a, x, y, o = {}) {
    const L = Lx(), c = L.ctx, u = tipU(P, st), tx = o.tExp || 0, out = [];
    const rev = P.guess ? smooth((u - tx) / .5) : 0;
    P.keys.forEach((k) => {
      const mine = P.guess === k, ok = k === P.ok, g = rev * (ok ? 1 : 0);
      al(a * (P.guess && !mine && !ok ? lerp(1, .55, rev) : 1));
      const b = L.pill(lab(k), x, y, { k, s: 26, w: 600, f: F.B, c: INK, bg: g > .5 ? '#eef6ee' : CARD, bd: g > .5 ? GOOD : 'rgba(28,36,64,.35)', bw: g > .5 ? 3 : 2, pad: 14 });
      if (mine) {
        al(a * smooth(u / .3)); rr(c, b.x - 6, b.y - 6, b.w + 12, b.h + 12, (b.h + 12) / 2); c.strokeStyle = RED; c.lineWidth = 3.5; c.stroke();
        L.tx(lab(KEYS.mine), b.x + b.w / 2, b.y + b.h + 30, { k: KEYS.mine, s: 22, w: 700, f: F.B, c: RED, a: 'center' });
      }
      if (g > 0) check(b.x + b.w + 24, y, a * g);
      out.push(b); x = b.x + b.w + 54;
    });
    return out;
  }
  function tipHead(P, st, a, qk, o = {}) {
    const L = Lx(), u = tipU(P, st), tx = o.tExp || 4.5;
    if (!o.noRhythm) rhythm(!P.guess ? 0 : u < tx ? 1 : 2, a);
    const q = { f: F.D, s: 38, w: 600, c: INK, max: 1280 };
    al(a); L.tx(o.qv ? fillIn(lab(qk), o.qv) : lab(qk), 40, 116, Object.assign({ k: qk }, q));
    let y = o.y || 178;
    if (o.q2) { al(a); L.tx(lab(o.q2), 40, 162, Object.assign({ k: o.q2 }, q)); y += 46; }
    tipRow(P, st, a, 40, y, { tExp: tx });
    return y;
  }
  function tipFeedback(P, st, a, x, y, o = {}) {
    if (!P.guess) return null;
    const u = tipU(P, st), ok = P.guess === P.ok, k = ok ? KEYS.ok : KEYS.bad;
    al(a * smooth((u - .15) / .4));
    return Lx().pill(lab(k), x, y, { k, s: o.s || 24, w: 700, f: F.B, c: ok ? GOOD : TEAL, bg: CARD, bd: ok ? GOOD : TEAL, bw: 2.5, pad: 12, a: o.al || 'left', max: o.max });
  }
  return { bind, STAMP, stamp, Tip, tipReset, panelVeil, veilIf, tipGuess, tipHide, tipControls, tipU, rhythm, tipHead, tipRow, tipFeedback };
})();
/* ── MODUL VÉGE: TtTipp ── */

/* ── MODUL: Időszalag (TortTimeline) ──────────────────────────────────────────────
   B modul (pilot/tortenelem-5-6/terv.md, 5. fejezet). Referencia: 01-idoszamitas.
   Később változtatás nélkül átemelhető: shared/tort/timeline.js. Csak a Lesson motorra épül
   (L.ctx, L.tx, L.pill, L.measure, L.pointer, L.stage, L.toStage, L.t, L.VW).

   IDŐ-KOORDINÁTA (u): folytonos, csillagászati években. Az „a” csillagászati év
   (Kr. e. 1 = 0, Kr. e. 753 = −752, Kr. u. 476 = 476 – ez a build `L.dat(k).a` mezője) az
   [a, a + 1) szakasz a szalagon; egy évszám-esemény a közepén áll: u = a + 0,5. Dátum: u = d.a.
   Eltelt évek: a2 − a1 (0. év nincs: Kr. e. 1 → Kr. u. 1 = 1 év). A kezdőpont (Kr. u. 1 eleje): u = 1.

   TortTimeline.Y – évszám-aritmetika (tiszta függvények; T = szövegek, lent):
     Y.u(d)               build-adat ({t:'year'|'date', a}) → u; szám esetén csillagászati év → a + 0,5
     Y.year(u)            u → csillagászati év (egész)        Y.num(a) → a kiírt szám (Kr. e. 753 → 753)
     Y.astro(v), Y.hist(a)  történeti év (−753) ↔ csillagászati (−752)
     Y.label(a, T, ad)    'Kr. e. 753' · '476' · 'Kr. u. 476' (ad = true)   Y.key(a, T, ad) → md-kulcs
     Y.range(a0, a1, T)   'Kr. e. 7–4' · '1914–1918' · 'Kr. e. 4 – Kr. u. 30'
     Y.elapsed(a1, a2)    a2 − a1
     Y.formula(a1, a2)    '776 − 753 = 23' · '753 + 476 − 1 = 1228' · '2026 − 2015 = 11'
     Y.century(a)         {n, bc}: 1801…1900 → {n: 19}; Kr. e. 776 → {n: 8, bc: true}
     Y.centurySpan(n, bc) [a0, a1) csillagászati évek: 19 → [1801, 1901); Kr. e. 1. → [−99, 1)
     Y.centuryLabel(a, T, short)  '19. század' · 'Kr. e. 8. század' · (short) '19.'
     Y.centuryRule(a)     '18|48 → 18 + 1 = 19' · '19|00 → 19'
     Y.lerpView(v0, v1, t)  két nézet ([u0, u1]) között: logaritmikus lépték, a nagyítás közben a
                          középpont a léptékkel arányosan mozog (zoom-ki/zoom-be szép)
   T (a lecke .md-jéből, mind {s, k}; k = md-kulcs a review módhoz):
     {bc: 'Kr. e.', ad: 'Kr. u.', cent: 'század', years: '# év'}

   const tl = TortTimeline.create(L, {x0, x1, y, h: 64, T, src, bounds: [uMin, uMax], minSpan, maxSpan,
                                      epoch: aKezdő?, pinY?})
     src: TortSource-példány (C modul) a kártyakeretekhez és a „becslés” bélyeghez (opcionális).
     epoch: más kezdőpontú vonalzó (pl. Róma alapítása): a felirat n = a − epoch + 1, előtte üres.
     tl.view(u0, u1) · tl.x(u) · tl.u(x) · tl.ppy (px/év) · tl.span() · tl.top/bot · tl.R (sorok y-ja)
     tl.draw(d)   szalag + osztás + feliratok + sávok. d = {a, bands: [{u0, u1, col, a}], sides,
                  origin, caption: {s, k, a, right}, cent, centHi: év, eras: [...], eraA, eraOut, ad}
                  eras: [{u0, u1, name: {s, k}, col, fade0: [ua, ub], fade1: [ua, ub]}] (fade = elmosódó határ)
     tl.cards(items, {pitch})   eseménykártyák a szalag fölött, vezetővonallal. item = {u, title: {s, k},
                  date?: {s, k}, note?: {s, k, c}, layer: 'forrás' | 'rekonstrukció' | 'monda' | null,
                  est: bool (→ „becslés” bélyeg), row: 0..2, a, hi}
     tl.card(item, x, y) / tl.cardSize(item) / tl.cardPos(item)   egy kártya tetszőleges helyen (pl. tálcán)
     tl.pins = [{u, col, ad?}]  húzható tűk;  tl.drawPins({a, pinY, top, bracket, caption(e), sub(e, a1, a2),
                  label(pin, év) → [{s, k, c}, …], hint: {s, k}})
     tl.interact({pins, pan, zoom, snap: [u…], onView(v)}) → true, ha egy tű elmozdult. Minden képkockán
                  hívd (a nézet beállítása után); a görgő nagyít, a szalag húzása pásztáz.
     tl.user      a felhasználó által beállított nézet ([u0, u1]) vagy null · tl.setUser(u0, u1) · tl.zoomTo(span)
   TortTimeline.mini(L, {x, y, w, h, u0, u1, eras, win: [u0, u1], cap: {s, k}, ends: [{s, k}, {s, k}], a})
                  kis „hol tartunk?” sáv: a teljes időszak korszakszínekkel, rajta a látható ablak.
   ──────────────────────────────────────────────────────────────────────────────── */
const TortTimeline = (() => {
  const F = Lesson.FONTS, U = Lesson.U, NB = ' ', MINUS = '−', TAU = Math.PI * 2;
  const INK = '#1c2440', MUT = '#565d72', RED = '#c8401c', CARD = '#fffaf1', OCHRE = '#8f5a0c';
  const TF = { f: F.B, s: 22, w: 500 };
  const STEPS = [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000, 2000, 5000, 10000, 20000];

  const Y = {
    astro: (v) => (v < 0 ? v + 1 : v),
    hist: (a) => (a <= 0 ? a - 1 : a),
    u: (d) => (typeof d === 'number' ? d + .5 : d.t === 'date' ? d.a : d.a + .5),

/* ── MODUL: Tematikus térkép (FoldChoro) · forrás: foldrajz-9-10/11-fejlettseg, 2026-11-24 · v1.1 (2026-11-24) ──
   Országok / megyék sokszögei érték szerint színezve (choropleth), bármely TortProj-nézeten (Equal Earth,

   const G = FoldChoro.load(M, o)   M: FOLD_ORSZAGOK (countries, key 'iso') | FOLD_MEGYEK (counties, key 'n') –

                                    (cols.length = breaks.length + 1). o = {fmt: (v) → szöveg, unit: ' $'}

                                      dim: 0..1 (ha van hl: a többi ennyire halványul), only: (key) → bool (csak ezek),

                                    A vetített gyűrűket a nézet (lon, lat, s, x, y) szerint gyorsítótárazza.

                                    only-ból kimaradt elemek nem találhatók el; gömbön a korongon kívül null
     M.pt(key) → [x, y] | null      a címkepont (lp) a képernyőn (utolsó nézet)

                                    hl: osztály (kiemelt mező), max (h: sorszélesség, ennél tör)}
                                    → {x, y, w, h, items: [{x, y, w}] (a mezők helye, pl. zárójelhez)}
     FoldChoro.card(L, q) → {x, y, w, h}   adatkártya (méret a tartalomhoz): q = {x, y, w (min. szélesség),
                                    title: {s, k}, sub: {s, k}?, rows: [{l: {s, k}, v: {s, k}, c?}], a,
                                    anchor: [px, py] (szaggatott vezetővonal a kártyától ide), align: 'left' | 'right'
                                    (x a bal / jobb szél)}
     FoldChoro.hatch(ctx, col)      a sraffozás mintája (CanvasPattern) – saját jelmagyarázathoz
   Átlátszóság: a draw, a legend és a card (mint az L.tx és a többi modul) a PILLANATNYI ctx.globalAlpha-t szorozza a

   Gömbön (ortho) a kitöltés és a találat pontos: a TortProj.trace v1.1 a horizonton vág (shared/tort/proj.js).
   Változások: v1.1 (2026-11-24) – a gömbi kitöltés / hit hibája a proj.js-ben javítva (a modul kódja ugyanaz);
   hit a korongon kívül null; a card a betűállapotot sem hagyja elállítva (a mérés a save előtt volt); a draw

const FoldChoro = (() => {
  const F = Lesson.FONTS, U = Lesson.U;
  const INK = '#1c2440', MUT = '#565d72', RED = '#c8401c', TEAL = '#0a6f86', CARD = '#fffaf1', PAPER = '#f7f1e6';
  const HUE = { red: RED, teal: TEAL };

  function load(M, o = {}) {
    const list = M[o.list || (M.countries ? 'countries' : 'counties')], q = M.q;
    const kf = o.key || (list[0] && list[0].iso != null ? 'iso' : 'n'), skip = new Set(o.skip || []);
    const items = [], by = {};
    for (const s of list) {
      const key = s[kf]; if (skip.has(key)) continue;
      const it = { key, n: s.n, lp: s.lp ? [s.lp[0] / q, s.lp[1] / q] : null, dis: !!s.dis, eu: !!s.eu, src: s,
                   rings: s.p.map((r) => TortProj.decode(r, q)) };
      items.push(it); by[key] = it;
    }
    return { items, by, key: kf };
  }

  const hex = (n) => '#' + n.map((v) => Math.round(U.clamp(v, 0, 255)).toString(16).padStart(2, '0')).join('');
  const rgbOf = (h) => { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
  const mixHex = (a, b, t) => { const A = rgbOf(a), B = rgbOf(b); return hex(A.map((v, i) => v + (B[i] - v) * t)); };
  function seq(n, hue) {
    const h = HUE[hue] || hue || RED, out = [];
    for (let i = 0; i < n; i++) { const t = .14 + .86 * i / Math.max(1, n - 1); out.push(t <= .9 ? mixHex(PAPER, h, t / .9) : mixHex(h, INK, (t - .9) * 2.4)); }
    return out;
  }
  function div(n) {
    const out = [], m = (n - 1) / 2;
    for (let i = 0; i < n; i++) { const d = (i - m) / Math.max(1, m); out.push(Math.abs(d) < 1e-9 ? PAPER : mixHex(PAPER, d < 0 ? TEAL : RED, .2 + .8 * Math.abs(d))); }
    return out;
  }
  function scale(breaks, cols, o = {}) {
    const fmt = o.fmt || ((v) => U.fmt(v)), u = o.unit || '';
    const S = { breaks, cols, n: cols.length };
    S.cls = (v) => { if (v == null || isNaN(v)) return -1; let i = 0; while (i < breaks.length && v >= breaks[i]) i++; return i; };
    S.col = (v) => { const i = S.cls(v); return i < 0 ? null : cols[i]; };
    S.labels = () => cols.map((_, i) => (i === 0 ? '< ' + fmt(breaks[0]) : i === cols.length - 1 ? '≥ ' + fmt(breaks[i - 1]) : fmt(breaks[i - 1]) + '–' + fmt(breaks[i])) + u);
    return S;
  }
  function cat(keys, cols) {
    const S = { keys, cols, n: cols.length, breaks: [] };
    S.cls = (v) => (v == null ? -1 : keys.indexOf(v));
    S.col = (v) => { const i = S.cls(v); return i < 0 ? null : cols[i]; };
    S.labels = () => keys.map(String);
    return S;
  }
  const PAT = new WeakMap();
  function hatch(ctx, col = 'rgba(28,36,64,.32)') {
    let m = PAT.get(ctx); if (!m) { m = {}; PAT.set(ctx, m); }
    if (m[col]) return m[col];
    const cv = document.createElement('canvas'); cv.width = cv.height = 10;
    const g = cv.getContext('2d'); g.fillStyle = '#ece5d6'; g.fillRect(0, 0, 10, 10);
    g.strokeStyle = col; g.lineWidth = 1.6; g.beginPath();
    for (const d of [-10, 0, 10]) { g.moveTo(d, 10); g.lineTo(d + 10, 0); } g.stroke();
    return (m[col] = ctx.createPattern(cv, 'repeat'));
  }

  function create(L, G, o = {}) {
    const st = Object.assign({ land: '#e8e1d2', sea: 'rgba(70,150,215,.14)', edge: 'rgba(28,36,64,.55)', ew: 1, hatch: 'rgba(28,36,64,.32)' }, o);
    let cacheKey = '', proj = [], lastV = null, last = { val: null, only: null };
    function recorder() {   /* moveTo/lineTo-t Path2D-be ÉS képernyő-gyűrűkbe gyűjt (a találathoz) */
      const P = new Path2D(), rings = []; let cur = null;
      return { P, rings,
        moveTo(x, y) { P.moveTo(x, y); cur = [x, y]; rings.push(cur); },
        lineTo(x, y) { P.lineTo(x, y); if (cur) cur.push(x, y); },
        closePath() { P.closePath(); } };
    }
    function project(V) {
      const k = [V.proj.kind, V.lon, V.lat, V.s, V.x, V.y, V.proj.o && V.proj.o.lon0].join('|');
      if (k === cacheKey) return;
      cacheKey = k; lastV = V;
      const ort = V.proj.kind === 'ortho' ? 'fill' : undefined;
      proj = G.items.map((it) => {
        const R = recorder();
        for (const r of it.rings) TortProj.trace(R, V, r, { close: true, ortho: ort });
        const rs = R.rings.map((a) => Float32Array.from(a));
        let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
        for (const a of rs) for (let i = 0; i < a.length; i += 2) { x0 = Math.min(x0, a[i]); x1 = Math.max(x1, a[i]); y0 = Math.min(y0, a[i + 1]); y1 = Math.max(y1, a[i + 1]); }
        const lp = it.lp ? V.pt(it.lp[0], it.lp[1]) : null;
        return { it, P: R.P, rs, bb: [x0, y0, x1, y1], lp: lp && lp[2] ? [lp[0], lp[1]] : null };
      });
    }
    const colOf = (S, v) => (v === undefined ? undefined : v === null ? null : S.col(v));
    const M = {};
    M.draw = (V, q = {}) => {
      const c = L.ctx; project(V);
      const val = q.val || (() => null), S = q.S, t = q.from ? U.clamp(q.t == null ? 1 : q.t) : 1;
      const hl = q.hl == null ? null : new Set([].concat(q.hl)), dim = hl ? (q.dim == null ? .35 : q.dim) : 0;
      last = { val, only: q.only || null };
      const kind = V.proj.kind, round = kind === 'equalEarth' || kind === 'ortho';
      c.save(); if (q.a != null) c.globalAlpha *= q.a;
      c.setLineDash([]);                 // a hívó szaggatása ne öröklődjön a határokra
      const ga = c.globalAlpha;
      if (round && q.sea !== false) { c.beginPath(); TortProj.outline(c, V); c.fillStyle = st.sea; c.fill(); c.clip(); }
      const pat = hatch(c, st.hatch);
      for (const p of proj) {
        const key = p.it.key; if (q.only && !q.only(key)) continue;
        const v1 = val(key), c1 = colOf(S, v1);
        let col = c1, hatchA = c1 === null ? 1 : 0;
        if (q.from && t < 1) {
          const c0 = colOf(q.from.S, q.from.val(key));
          if (c0 && c1) col = U.mix(c0, c1, t);
          else if (c0 && c1 === null) { col = c0; hatchA = t; }
          else if (c0 === null && c1) { col = c1; hatchA = 1 - t; }
          else if (c0 === null && c1 === null) hatchA = 1;
          else if (c0 === undefined || c1 === undefined) { col = c1 === undefined ? (c0 || undefined) : c1; hatchA = c1 === undefined ? (c0 === null ? 1 - t : 0) : hatchA; }
        }
        if (q.fill) col = q.fill(key, col);
        const a = hl && !hl.has(key) ? 1 - dim : 1;
        c.globalAlpha = ga * a;
        c.fillStyle = col || st.land; c.fill(p.P, 'evenodd');
        if (hatchA > 0) { c.globalAlpha = ga * a * hatchA; c.fillStyle = pat; c.fill(p.P, 'evenodd'); c.globalAlpha = ga * a; }
        if (q.border !== false) {
          c.lineJoin = 'round'; c.lineWidth = st.ew; c.strokeStyle = st.edge;
          if (p.it.dis) c.setLineDash([5, 4]);
          c.stroke(p.P); c.setLineDash([]);
        }
      }
      c.globalAlpha = ga;
      if (hl) for (const p of proj) if (hl.has(p.it.key)) { c.lineJoin = 'round'; c.lineWidth = 3; c.strokeStyle = INK; c.stroke(p.P); }
      c.restore();
      if (round && q.sea !== false) { c.save(); if (q.a != null) c.globalAlpha *= q.a; c.setLineDash([]); c.beginPath(); TortProj.outline(c, V); c.lineWidth = 2; c.strokeStyle = U.rgba('#1b5a94', .55); c.stroke(); c.restore(); }
    };
    function inRing(a, x, y) {
      let ins = false;
      for (let i = 0, j = a.length - 2; i < a.length; j = i, i += 2) {
        const xi = a[i], yi = a[i + 1], xj = a[j], yj = a[j + 1];
        if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) ins = !ins;
      }
      return ins;
    }
    M.hit = (px, py) => {
      if (lastV && lastV.proj.kind === 'ortho' && lastV.cx != null && Math.hypot(px - lastV.cx, py - lastV.cy) > lastV.s) return null;
      for (const p of proj) {
        const key = p.it.key, b = p.bb;
        if (px < b[0] || px > b[2] || py < b[1] || py > b[3]) continue;
        if (last.only && !last.only(key)) continue;
        if (last.val && last.val(key) === undefined) continue;
        let n = 0; for (const a of p.rs) if (inRing(a, px, py)) n++;
        if (n % 2) return key;
      }
      return null;
    };
    M.pt = (key) => { const p = proj.find((q) => q.it.key === key); return p && p.lp ? p.lp.slice() : null; };
    M.view = () => lastV;
    M.legend = (q) => {
      const c = L.ctx, S = q.S, labs = q.labels || S.labels().map((s) => ({ s, k: q.k })), sw = 34, sh = 24, gap = 12;
      const LF = { f: F.B, s: 22, w: 500, c: INK }, TF = { f: F.B, s: 22, w: 700, c: MUT };
      c.save(); if (q.a != null) c.globalAlpha *= q.a;
      let x = q.x, y = q.y, w = 0;
      if (q.title) { const b = L.tx(q.title.s, x, y + 16, Object.assign({}, TF, { k: q.title.k })); w = b.w; y += 40; }
      const items = labs.map((l, i) => ({ l, col: S.cols[i] })); if (q.noData) items.push({ l: q.noData, col: null });
      let cx = x, rowW = 0, y0 = y; const pos = [];
      for (const itm of items) {
        const tw = L.measure(itm.l.s, LF).w, iw = sw + 10 + tw;
        if (q.dir === 'h' && q.max && cx > x && cx - x + iw > q.max) { cx = x; y += sh + gap; }
        pos.push({ x: cx, y, w: iw });
        c.beginPath(); c.rect(cx, y, sw, sh);
        c.fillStyle = itm.col || hatch(c, st.hatch); c.fill();
        c.lineWidth = q.hl != null && items.indexOf(itm) === q.hl ? 3 : 1.5; c.strokeStyle = q.hl != null && items.indexOf(itm) === q.hl ? INK : st.edge; c.stroke();
        L.tx(itm.l.s, cx + sw + 10, y + sh / 2, Object.assign({}, LF, { b: 'middle', k: itm.l.k }));
        if (q.dir === 'h') { cx += iw + 28; rowW = Math.max(rowW, cx - x - 28); } else { y += sh + gap; rowW = Math.max(rowW, iw); }
      }
      if (q.dir === 'h') y += sh; else y -= gap;
      c.restore();
      return { x: q.x, y: q.y, w: Math.max(w, rowW), h: y - q.y, items: pos };
    };
    return M;
  }

  function card(L, q) {
    const c = L.ctx, pad = 22, TF = { f: F.D, s: 30, w: 600, c: INK }, SF = { f: F.B, s: 22, w: 500, i: false, c: MUT },
          LF = { f: F.B, s: 22, w: 600, c: MUT }, VF = { f: F.M, s: 22, w: 600, c: INK };
    c.save();                          // a mérés (L.measure) is állít betűt → már előtte mentünk
    const lw = q.rows.length ? Math.max(...q.rows.map((r) => L.measure(r.l.s, LF).w)) + 16 : 0;
    const vw = q.rows.length ? Math.max(...q.rows.map((r) => L.measure(r.v.s, VF).w)) : 0;
    const w = Math.max(q.w || 0, L.measure(q.title.s, TF).w + pad * 2, q.sub ? L.measure(q.sub.s, SF).w + pad * 2 : 0, lw + vw + pad * 2);
    const h = pad + 34 + (q.sub ? 30 : 0) + 10 + q.rows.length * 34 + pad - 6;
    const x = q.align === 'right' ? q.x - w : q.x, y = q.y;
    if (q.a != null) c.globalAlpha *= q.a;
    if (q.anchor) {
      const ax = q.anchor[0], ay = q.anchor[1], ex = U.clamp(ax, x, x + w), ey = U.clamp(ay, y, y + h);
      c.strokeStyle = U.rgba(INK, .6); c.lineWidth = 2; c.setLineDash([5, 5]); c.beginPath(); c.moveTo(ex, ey); c.lineTo(ax, ay); c.stroke(); c.setLineDash([]);
      c.beginPath(); c.arc(ax, ay, 5, 0, Math.PI * 2); c.fillStyle = INK; c.fill();
    }
    c.shadowColor = 'rgba(70,50,20,.16)'; c.shadowBlur = 14; c.shadowOffsetY = 3;
    c.beginPath(); c.roundRect(x, y, w, h, 10); c.fillStyle = CARD; c.fill(); c.shadowColor = 'transparent';
    c.strokeStyle = 'rgba(28,36,64,.3)'; c.lineWidth = 2; c.stroke();
    let yy = y + pad + 24;
    L.tx(q.title.s, x + pad, yy, Object.assign({}, TF, { k: q.title.k }));
    if (q.sub) { yy += 30; L.tx(q.sub.s, x + pad, yy, Object.assign({}, SF, { k: q.sub.k })); }
    yy += 42;
    for (const r of q.rows) {
      L.tx(r.l.s, x + pad, yy, Object.assign({}, LF, { k: r.l.k }));
      L.tx(r.v.s, x + w - pad, yy, Object.assign({}, VF, { a: 'right', c: r.c || INK, k: r.v.k }));
      yy += 34;
    }
    c.restore();
    return { x, y, w, h };
  }

  return { load, seq, div, scale, cat, create, card, hatch, mix: mixHex };
})();

/* ── MODUL: Adatgrafikon (FoldChart) · forrás: foldrajz-9-10/10-nepesseg, 2026-11-23 ─────────────────────────
   Földrajzi adatgrafikonok (terv.md 4. fejezet): tengelyek magyar számformátummal, lineáris és logaritmikus
   skála, vonal, sáv, terület, halmozott terület, oszlop (halmozott is), buborék, korfa, előrejelzés-zóna +
   bélyeg, forrássor, ütközésmentes végcímkék. Csak a Lesson motorra épül (Lesson.U, Lesson.FONTS, L.tx,

  7: [{ name: '1914', set(L) { setEra('1914'); S7.t = L.st - 2; } }, { name: '1914-mai-ki', set(L) { setEra('1914'); S7.t = L.st - 2; S7.today = false; } },
    { name: '1991', set(L) { setEra('1991'); S7.t = L.st - 2; S7.seen91 = L.st - 3; } }, { name: '1993', set(L) { setEra('1993'); S7.t = L.st - 2; S7.seen91 = L.st - 3; } }],
  8: [{ name: 'százalék', set(L) { setMode8('százalék'); S8.t = L.st - 2; } }],
};

L = Lesson.create({
  resetCtx: true,
  content: window.LESSON_CONTENT,
  home: false,
  steps: STEPS,
  init(Lx) {
    L = Lx; c = L.ctx;
    SRC = TortSource.create(L, { 'forrás': K('forrás jel'), 'rekonstrukció': K('rekonstrukció jel'), 'monda': K('monda jel'), 'becslés': K('becslés'), 'vázlatos': K('vázlatos'), 'illusztráció': K('illusztráció') });
    TT = { bc: K('Kr. e.'), ad: K('Kr. u.'), cent: K('század'), years: K('év sablon') };
    window.FOLD_WDI.countries.forEach((cc, i) => { WDI_I[cc.iso] = i; });
    buildData();
    G = FoldChoro.load(window.FOLD_ORSZAGOK);
    const mk = () => FoldChoro.create(L, G, { land: LAND, edge: 'rgba(28,36,64,.5)', ew: 1 });
    // 1.
    S1 = FoldChoro.cat([0, 1], [LAND, TEAL]);
    M1 = mk(); V1 = mkView([-4.5, 41.5, 18.5, 55.5], R1, 0);
    TL1 = TortTimeline.create(L, { x0: 40, x1: 1340, y: 915, h: 44, T: TT, src: SRC, bounds: [1800, 2100] });
    // 2.
    S2S = FoldChoro.cat(WAVES.map((wv) => wv.i), WCOL);
    M2 = mk(); V2 = mkView([-11, 34.2, 34.5, 70.5], R2, 10);
    // 4.
    for (const ly of Object.keys(L4)) S4C[ly] = FoldChoro.cat(L4[ly].keys, L4[ly].cols);
    L4.EU.n = EU28.length - 1; L4.EU.nk = 'tagállamok';
    L4['euró'].n = Object.keys(EURO).length; L4['euró'].nk = 'euróállamok';
    L4.Schengen.n = Object.keys(SCH).length; L4.Schengen.nk = 'schengeni államok';
    M4 = mk(); V4 = mkView([-25, 34.2, 35, 71], R4, 10);
    // 5.
    TL5 = TortTimeline.create(L, { x0: 40, x1: 1340, y: 400, h: 50, T: TT, src: SRC, bounds: [1980, 2030] });
    // 6.
    buildState6();
    // 7.
    MAI_ALL = Object.keys(window.TORT_HATAR.groups.mai0).map((k) => 'mai0.' + k);
    V7 = mkView([9.0, 43.3, 28.6, 55.3], R7, 0);
    // 8.
    const W = window.FOLD_WDI, i0 = num('adatsor kezdete') - W.y0, i1 = num('adatsor vége') - W.y0;
    XS8 = []; for (let i = i0; i <= i1; i++) XS8.push(W.y0 + i);
    EU8 = ser('gdpPpp', 'EUU').slice(i0, i1 + 1);
    const xs = { min: XS8[0], max: XS8[XS8.length - 1], step: 5, fmt: (v) => String(v) };
    C8D = FoldChart.create(L, { x: 150, y: 130, w: 900, h: 520, xs, ys: { min: 0, max: 60000, step: 10000 } });
    C8P = FoldChart.create(L, { x: 150, y: 130, w: 900, h: 520, xs, ys: { min: 30, max: 110, step: 10, fmt: (v) => fmt(v) + ' %' } });
    // 9.
    S9C = FoldChoro.cat(['a', 'b', 'x'], [TEAL, '#7fb6c2', EXCOL]);
    M9 = mk(); V9 = mkView([-11, 34.2, 34.5, 70.5], R9, 6);

    L.checks = () => {
      const out = [];
      const cur = EU28.filter((iso) => isMember(iso, 2027));
      out.push({ name: 'tagállamok = 27', ok: cur.length === num('tagállamok'), got: cur.length, want: num('tagállamok') });
      out.push({ name: 'alapítók = 6', ok: WAVES[0].keys.length === num('alapító államok'), got: WAVES[0].keys.length, want: num('alapító államok') });
      const wy = WAVES.map((wv) => wv.y);
      out.push({ name: 'minden csatlakozási év egy bővülés éve', ok: EU28.every((iso) => wy.includes(JOIN[iso])), got: EU28.filter((iso) => !wy.includes(JOIN[iso])).join(',') || '–', want: '–' });
      out.push({ name: 'bővülés dátuma = a hullám éve', ok: WAVES.every((wv) => !wv.k || Math.floor(wv.u) === wv.y), got: WAVES.map((wv) => Math.floor(wv.u)).join(','), want: wy.join(',') });
      const big = WAVES.slice().sort((a, b) => b.keys.length - a.keys.length)[0];
      out.push({ name: 'a legnagyobb bővülés 2004 (a tipp helyes válasza)', ok: big.y === 2004 && big.keys.length === 10, got: big.y + ':' + big.keys.length, want: '2004:10' });
      const eu = Object.keys(EURO);
      out.push({ name: 'euróállamok = 21, mind tag', ok: eu.length === num('euróállamok') && eu.every((iso) => cur.includes(iso)), got: eu.length, want: num('euróállamok') });
      const sc = Object.keys(SCH), scEU = sc.filter((iso) => cur.includes(iso));
      out.push({ name: 'Schengen = 29 (25 EU + 4)', ok: sc.length === num('schengeni államok') && scEU.length === 25 && !SCH.CYP && !SCH.IRL, got: sc.length + ' / ' + scEU.length, want: '29 / 25' });
      const V = num('választópolgárok'), Sz = num('szavazók'), E = num('érvényes szavazatok'), I = num('igen szavazatok'), N = num('nem szavazatok');
      out.push({ name: 'népszavazás: igen + nem = érvényes', ok: I + N === E, got: I + N, want: E });
      out.push({ name: 'igen arány 83,76 %', ok: Math.abs(I / E * 100 - num('igen arány')) < .005, got: (I / E * 100).toFixed(3), want: num('igen arány') });
      out.push({ name: 'részvétel 45,62 %', ok: Math.abs(Sz / V * 100 - num('részvétel')) < .005, got: (Sz / V * 100).toFixed(3), want: num('részvétel') });
      out.push({ name: 'választópolgárok %-ában igen ≈ 38,00 %', ok: Math.abs(I / V * 100 - 38.0) < .01, got: (I / V * 100).toFixed(3), want: '38,00' });
      const ep = popM('EUU', 2025);
      out.push({ name: 'EU népessége (WDI 2025) ≈ a .md kb. 450 millió (±2 %)', ok: Math.abs(ep * 1e6 / num('EU népessége') - 1) < .02, got: ep.toFixed(1), want: '450' });
      const s04 = WAVES[5].keys.reduce((s, iso) => s + popM(iso, 2004), 0);
      out.push({ name: '2004-es csatlakozók ≈ 74 millió (WDI)', ok: s04 > 70 && s04 < 78, got: s04.toFixed(1), want: '≈ 74' });
      out.push({ name: 'minősített többség: 15 állam ≈ 55 % × 27', ok: Math.ceil(num('minősített többség államok') / 100 * num('tagállamok')) === num('minősített többség legalább'), got: Math.ceil(.55 * 27), want: num('minősített többség legalább') });
      out.push({ name: 'Bizottság: tagállamonként 1', ok: num('biztosok száma') === num('tagállamok'), got: num('biztosok száma'), want: num('tagállamok') });
      return out;
    };
  },
  draw(Lx) {
    L = Lx; c = L.ctx; GA = 1; paper();
    const sp = L.sp, wt = (i) => clamp(1 - Math.abs(sp - i) * 2);
    sT[L.step] = L.st;
    for (let i = 0; i < SCENES.length; i++) { const w = wt(i); if (w > .005) SCENES[i](sT[i], w, L.step === i); }
    c.globalAlpha = 1;
  },
});
})();
</script>
