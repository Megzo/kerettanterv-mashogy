const TtTipp = (() => {
  'use strict';
  const U = Lesson.U, F = Lesson.FONTS, { clamp, lerp, smooth } = U;

  function tipReset(P) { P.guess = null; P.gt = -99; }

  function tipHide(P) {
    const rows = new Set();
    (P.btns || []).forEach((b) => { b.style.display = 'none'; if (b.parentNode) rows.add(b.parentNode); });
    rows.forEach((r) => { if (![...r.children].some((e) => e.style.display !== 'none')) r.style.display = 'none'; });

      al(a * (P.guess && !mine && !ok ? lerp(1, .55, rev) : 1));
      const b = L.pill(lab(k), x, y, { k, s: 26, w: 600, f: F.B, c: INK, bg: g > .5 ? '#eef6ee' : CARD, bd: g > .5 ? GOOD : 'rgba(28,36,64,.35)', bw: g > .5 ? 3 : 2, pad: 14 });
      if (mine) {
        al(a * smooth(u / .3)); rr(c, b.x - 6, b.y - 6, b.w + 12, b.h + 12, (b.h + 12) / 2); c.strokeStyle = RED; c.lineWidth = 3.5; c.stroke();
        L.tx(lab(KEYS.mine), b.x + b.w / 2, b.y + b.h + 30, { k: KEYS.mine, s: 22, w: 700, f: F.B, c: RED, a: 'center' });
      }
      if (g > 0) check(b.x + b.w + 24, y, a * g);

  }
  function tipHead(P, st, a, qk, o = {}) {
    const L = Lx(), u = tipU(P, st), tx = o.tExp || 4.5;

    return y;
  }
  function tipFeedback(P, st, a, x, y, o = {}) {
    if (!P.guess) return null;
    const u = tipU(P, st), ok = P.guess === P.ok, k = ok ? KEYS.ok : KEYS.bad;
    al(a * smooth((u - .15) / .4));
    return Lx().pill(lab(k), x, y, { k, s: o.s || 24, w: 700, f: F.B, c: ok ? GOOD : TEAL, bg: CARD, bd: ok ? GOOD : TEAL, bw: 2.5, pad: 12, a: o.al || 'left', max: o.max });
  }
  return { bind, STAMP, stamp, Tip, tipReset, panelVeil, veilIf, tipGuess, tipHide, tipControls, tipU, rhythm, tipHead, tipRow, tipFeedback };
})();

    const fitC = (b, r) => TortMap.fit(TortCity.proj(), b, r);
    V4 = fitC([18.93, 47.415, 19.20, 47.615], [20, 250, 790, 780]);
    V5a = fitC([18.995, 47.462, 19.115, 47.538], [20, 20, 1320, 1040]);
    V5b = fitC([18.92, 47.35, 19.34, 47.62], [20, 60, 840, 980]);
    V6 = fitC([19.035, 47.481, 19.095, 47.522], [20, 104, 750, 520]);
    C4 = FoldChart.create(L, { x: 860, y: 450, w: 460, h: 460, xs: { min: 1864, max: 1916, ticks: [1870, 1880, 1890, 1900, 1910], fmt: (v) => String(v) }, ys: { min: 0, max: 1000000, step: 200000 } });
    P4 = Tip(['tipp másfélszer', 'tipp háromszor', 'tipp tízszer'], 'tipp háromszor');
    // 2. lépés: kártyák
    const zones = [{ id: 'közös', x: 40, y: 128, w: 410, h: 520, title: K('zóna közös'), sub: K('zóna közös 2') },
      { id: 'magyar', x: 475, y: 128, w: 410, h: 520, title: K('zóna magyar'), sub: K('zóna magyar 2') },
      { id: 'osztrák', x: 910, y: 128, w: 420, h: 520, title: K('zóna osztrák'), sub: K('zóna osztrák 2') }];
    const cd = [['kártya honvédség', 'magyar'], ['kártya külügy', 'közös'], ['kártya Landwehr', 'osztrák'], ['kártya MÁV', 'magyar'], ['kártya hadsereg', 'közös'],
      ['kártya birodalmi tanács', 'osztrák'], ['kártya országgyűlés', 'magyar'], ['kártya pénzügy', 'közös'], ['kártya osztrák kormány', 'osztrák'], ['kártya iskola', 'magyar']];
    CARDS = TortCards.create(L, { zones, cards: cd.map(([k, z]) => ({ id: k, label: K(k), zone: z })), tray: { x: 40, y: 676, w: 1290, h: 330, top: 26 }, font: { s: 24, w: 600 } });
    L.cards = CARDS;
    L.checks = () => {
      const sum = NY.reduce((s, [, d]) => s + L.num(d), 0), sr = dat('Budapest népessége'), r = sr.y[sr.y.length - 1] / sr.y[0];
      return [{ name: 'az 1910-es anyanyelvi arányok összege 100 %', ok: Math.abs(sum - 100) < .05, got: sum, want: 100 },
        { name: 'a „kb. 3-szor” tipp a helyes (2,5–4)', ok: r > 2.5 && r < 4, got: r, want: '2,5–4' },
        { name: 'az utolsó népszámlálás 1910', ok: sr.x[sr.x.length - 1] === dat('vizsgált népszámlálás').v, got: sr.x[sr.x.length - 1], want: dat('vizsgált népszámlálás').v },
        { name: 'Budapest 1910 = a sorozat utolsó eleme', ok: sr.y[sr.y.length - 1] === L.num('lakosság 1910'), got: sr.y[sr.y.length - 1], want: L.num('lakosság 1910') }];
    };
  },
  draw(Lx) {
    L = Lx; c = L.ctx; GA = 1; paper(); grid(.045);
    const sp = L.sp, wt = (i) => clamp(1 - Math.abs(sp - i) * 2);
    sT[L.step] = L.st;
    const S = [scene1, scene2, scene3, scene4, scene5, scene6, scene7, scene8, scene9];
    for (let i = 0; i < 9; i++) { const w = wt(i); if (w > .005) { c.save(); S[i](sT[i], w, L.step === i); c.restore(); } }
    c.globalAlpha = 1;
  },
});
})();
