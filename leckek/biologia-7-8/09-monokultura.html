/* ══════════════════════════════════════════════════════════════════════════════════════════
   KÖZÖS BIOLÓGIA-MODULOK (pilot/biologia-7-8/terv.md, 4. fejezet), bájtra azonos másolatok:
   BioPop + BioPlot ← biologia-7-8/07-populacio, BioNet ← biologia-7-8/06-taplalekhalozat.
   ══════════════════════════════════════════════════════════════════════════════════════════ */
/* ── MODUL: Populáció-szimuláció (BioPop) · forrás: biologia-7-8/07-populacio, 2026-11-23 ──
   Előre lefuttatott, determinisztikus populációmodellek: közönséges differenciálegyenletek
   (ODE), ágensalapú (egyedi) szimuláció és rácsalapú (sejtautomata) változat, valamint
   „sok jövő” együttes futtatás. Minden véletlen egy seedelt xorshift32-ből jön (ugyanaz, mint a
   Lesson.U.rng), Math.random nincs. A modul a Lesson motortól is független (csak számol);
   a rajz a lecke vagy a BioPlot dolga. Az állapot mindig az időből (t) kérdezhető le, így a
   QA, a visszalépés és az L.st-ből számolt animáció determinisztikus.

   ── Véletlen ──
   BioPop.rng(seed) → r       r() ∈ [0, 1);  r.int(n) ∈ {0…n−1};  r.norm() standard normális;
                              r.pick(tömb);  r.state() → állapot (szám);  r.state(s) visszaállítja

   ── ODE ──
   BioPop.EQ[név] = f(t, x, p) → dx/dt   (beépített egyenletek; x tömb, p paraméter-objektum)
     'exponenciális'   x = [N]          p {r}                 dN = rN
     'logisztikus'     x = [N]          p {r, K}              dN = rN(1 − N/K)
     'lotka-volterra'  x = [N, P]       p {r, a, c, m}        dN = rN − aNP;   dP = cNP − mP
     'lv-logisztikus'  x = [N, P]       p {r, K, a, c, m}     mint fent, a zsákmány eltartóképességgel
     'rosenzweig'      x = [N, P]       p {r, K, a, h, c, m}  telítődő (II. típusú) zsákmányolás: aN/(1 + ahN)
     'tápláléklánc'    x = [V, N, P]    p {g, q, b, d, a, h, c, m}   V: növényzet (0–1, a maximum aránya)
                         dV = gV(1 − V) − qVN;  dN = N(bV − d) − aNP/(1 + ahN);  dP = cNP/(1 + ahN) − mP
     'versengés'       x = [N1, N2]     p {r1, r2, K1, K2, a12, a21}
     'sir'             x = [S, I, R]    p {beta, gamma}      dS = −βSI/N;  dI = βSI/N − γI;  dR = γI
   BioPop.equil(név, p) → egyensúlyi pont (tömb), ahol zárt alakban ismert (logisztikus, lotka-volterra,
                          lv-logisztikus, rosenzweig), különben null
   BioPop.ode({eq: név | f: saját függvény, p, x0, T, t0 = 0, dt = 0.01, min = 0,
               events: [{t, p: {…} (paramétercsere), x: [..] | fn(x, t) → x (állapotcsere; null elem = marad)}]})
     → run   (RK4, fix lépés; az egész pálya előre lefut; az esemény pontosan a t időpontban hat;
              min: alsó korlát minden komponensre – populáció nem lesz negatív)
     run.at(t) → [x…]          lineáris interpoláció a mintákon; t a [t0, t0 + T]-be vágva
     run.get(i, t) → x_i(t)    run.p(t) → az adott időben érvényes paraméterek
     run.series(i, ta, tb, n = 400) → [[t, x_i]…]        (BioPlot.line-hoz)
     run.phase(i, j, ta, tb, n = 600) → [[x_i, x_j]…]    (fázistér)
     run.mean(i, ta, tb) · run.min(i, ta, tb) · run.max(i, ta, tb)   (trapéz-, ill. mintaérték)
     run.peaks(i, ta, tb) → [t…] helyi maximumok (a minta-felbontásnál pontosabban, parabolával)
     run.period(i, ta, tb) → átlagos csúcstávolság (NaN, ha < 2 csúcs)
     run.t0, run.T, run.dt, run.n (minták száma), run.xs (Float64Array-ek komponensenként)

   ── Ágensek ──
   BioPop.agents({seed, ticks, dt = 1 (időegység / tick), snap = 25 (pillanatkép minden snap. tickben),
                  world: {w, h, wrap = true}, max = 5000, env: {…} (JSON-másolható környezet),
                  init(sim),                         // kezdőállapot: sim.add(kind, props) hívásokkal
                  rules: {
                    move(a, sim),                    // opcionális; alap: korrelált bolyongás a.v (px/tick) és
                                                     //   a.turn (rad/tick szórás) szerint, a fal mentén visszafordul
                    pairs: [{a: 'hiúz', b: 'nyúl', r: 20, fn(A, B, sim) → 'stop' | void}],
                                                     // találkozás: B ≤ r távolságra A-tól (térbeli rács); 'stop':
                                                     //   A ebben a tickben több B-t nem vizsgál
                    agent(a, sim),                   // egyedenkénti szabály (születés: sim.add, halál: sim.kill)
                    tick(sim),                       // globális szabály a tick végén (környezet, bevándorlás)
                    record(sim) → {név: szám},       // tickenkénti mérőszámok
                  }})
     sim.run() → sim           az egész futás előre (≤ 200 ms-ra méretezd); pillanatképekkel
     sim.at(t) → {t, tick, agents: [{id, kind, x, y, …props}]}   az x, y a két tick között interpolált;
                               a legközelebbi pillanatképtől determinisztikusan újrafuttat (gyorsítótárral)
     sim.count(kind, t) · sim.series(kind) → [[t, n]…] · sim.metric(név, t) · sim.mseries(név)
     sim.extinct(kind) → az első t, amikor a létszám 0 lett (különben null) · sim.T (= ticks · dt)
     A szabályokban: sim.add(kind, props) → a · sim.kill(a) · sim.rng · sim.tick · sim.t · sim.env ·
       sim.n(kind) (élő létszám) · sim.near(x, y, r, kind?) → [a…] · sim.world
     Az egyed mezői: id, kind, x, y, px, py (előző tick), h (irány), v, turn, age (tick), born (tick), dead;
       saját mezők: számok, szövegek (a pillanatkép sekély másolat – tömböt ne tegyél bele).

   ── Rács (sejtautomata) ──
   BioPop.grid({w, h, seed, T (tickek száma), nb: 4 | 8, wrap = false, stop = true,
                init(i, j, rng) → állapot (0–255),
                rule(g, i, j, s, rng) → új állapot})          // szinkron frissítés, sorfolytonos sorrendben
     → g (előre lefut; minden tick eltárolva; stop: true → leáll, ha egy tick után nem változott semmi)
     g.at(t) → Uint8Array (w·h, a floor(t). tick)  · g.cell(i, j, t) · g.count(s, t) · g.series(s) → [[t, n]…]
     g.end → az utolsó tick (ahol leállt)  · g.spans(test, t, dir = 'x') → igaz, ha a test(s)-nek
     megfelelő cellák (nb-szomszédsággal) összefüggő fürtje átér a rácson (x: bal → jobb, y: fent → lent)
     A rule-ban: g.n(i, j, s) → hány szomszéd van s állapotban (s: szám, tömb vagy függvény); g.get(i, j)
     g.draw(c, {x, y, w, h}, cols: {állapot: szín | null}, t, {gap = 1, r = 0})
     BioPop.spans(cells, w, h, test, nb = 4, dir = 'x')  – statikus változat (pl. perkoláció-próbához)

   ── Együttes futtatás („100 jövő”) ──
   BioPop.ensemble(make, n, seed) → E     make(seed_i, i) → tetszőleges eredmény; seed_i = seed + 7919 · i
     E.step(ms = 8) – képkockánként hívd (legfeljebb ms ideig futtat újabb tagokat);  E.all() – szinkron
     E.done, E.results (tömb, sorrendben), E.progress (0–1), E.n
   ──────────────────────────────────────────────────────────────────────────────────────────── */
const BioPop = (() => {
  'use strict';
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

  /* ── véletlen ── */
  function rng(seed) {
    let s = seed >>> 0 || 1;
    const r = () => { s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
    r.int = (n) => Math.floor(r() * n);
    r.norm = () => { let u = r(); while (u <= 1e-12) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * r()); };
    r.pick = (arr) => arr[Math.floor(r() * arr.length)];
    r.state = (v) => { if (v === undefined) return s; s = v >>> 0 || 1; return s; };
    return r;
  }

  /* ── ODE ── */
  const EQ = {
    'exponenciális': (t, [N], p) => [p.r * N],
    'logisztikus': (t, [N], p) => [p.r * N * (1 - N / p.K)],
    'lotka-volterra': (t, [N, P], p) => [p.r * N - p.a * N * P, p.c * N * P - p.m * P],
    'lv-logisztikus': (t, [N, P], p) => [p.r * N * (1 - N / p.K) - p.a * N * P, p.c * N * P - p.m * P],
    'rosenzweig': (t, [N, P], p) => { const f = p.a * N / (1 + p.a * p.h * N); return [p.r * N * (1 - N / p.K) - f * P, p.c / p.a * f * P - p.m * P]; },
    'tápláléklánc': (t, [V, N, P], p) => { const D = 1 + p.a * p.h * N;
      return [p.g * V * (1 - V) - p.q * V * N, N * (p.b * V - p.d) - p.a * N * P / D, p.c * N * P / D - p.m * P]; },
    'versengés': (t, [A, B], p) => [p.r1 * A * (1 - (A + p.a12 * B) / p.K1), p.r2 * B * (1 - (B + p.a21 * A) / p.K2)],
    'sir': (t, [S, I, R], p) => { const N = S + I + R || 1, f = p.beta * S * I / N; return [-f, f - p.gamma * I, p.gamma * I]; },
  };
  function equil(eq, p) {
    switch (eq) {
      case 'logisztikus': return [p.K];
      case 'lotka-volterra': return [p.m / p.c, p.r / p.a];
      case 'lv-logisztikus': { const N = p.m / p.c; return [N, p.r / p.a * (1 - N / p.K)]; }
      case 'rosenzweig': { const N = p.m / (p.a * (p.c / p.a - p.m * p.h)); return [N, p.r / p.a * (1 - N / p.K) * (1 + p.a * p.h * N)]; }
      default: return null;
    }
  }
  function ode(o) {
    const f = o.f || EQ[o.eq]; if (!f) throw new Error('BioPop.ode: ismeretlen egyenlet: ' + o.eq);
    const dt = o.dt || .01, t0 = o.t0 || 0, T = o.T, n = Math.max(1, Math.round(T / dt)), m = o.x0.length, lo = o.min == null ? 0 : o.min;
    const xs = Array.from({ length: m }, () => new Float64Array(n + 1));
    const ev = (o.events || []).map((e) => Object.assign({ k: Math.round((e.t - t0) / dt) }, e)).sort((a, b) => a.k - b.k);
    const pk = [{ k: 0, p: Object.assign({}, o.p) }];
    let p = pk[0].p, x = o.x0.slice(), ei = 0;
    const add = (a, b, h) => a.map((v, i) => v + b[i] * h);
    for (let k = 0; k <= n; k++) {
      while (ei < ev.length && ev[ei].k <= k) {
        const e = ev[ei++];
        if (e.p) { p = Object.assign({}, p, e.p); pk.push({ k, p }); }
        if (e.x) { if (typeof e.x === 'function') x = e.x(x.slice(), t0 + k * dt); else x = x.map((v, i) => e.x[i] == null ? v : e.x[i]); }
      }
      for (let i = 0; i < m; i++) xs[i][k] = x[i];
      if (k === n) break;
      const t = t0 + k * dt, k1 = f(t, x, p), k2 = f(t + dt / 2, add(x, k1, dt / 2), p), k3 = f(t + dt / 2, add(x, k2, dt / 2), p), k4 = f(t + dt, add(x, k3, dt), p);
      x = x.map((v, i) => Math.max(lo, v + dt / 6 * (k1[i] + 2 * k2[i] + 2 * k3[i] + k4[i])));
    }
    const kOf = (t) => clamp((t - t0) / dt, 0, n);
    const get = (i, t) => { const u = kOf(t), k = Math.min(n - 1, Math.floor(u)), fr = u - k; return xs[i][k] + (xs[i][k + 1] - xs[i][k]) * fr; };
    const rng2 = (ta, tb) => [ta == null ? t0 : ta, tb == null ? t0 + T : tb];
    const run = {
      t0, T, dt, n, xs,
      at: (t) => xs.map((_, i) => get(i, t)),
      get,

const hash = BioNet.hash;

function honnan(x, y) { return L.pill(lab('honnan tudjuk'), x, y, { k: 'honnan tudjuk', s: 22, w: 700, ls: '0.08em', c: '#fff', bg: TEAL, pad: 10, r: 8 }); }

function background() {

/* ════════════ a tábla: rács, terjedés (BioPop.grid) ════════════
   A tábla w × h tő. Fajta: 1 = fogékony, 0 = ellenálló. A terjedés sejtautomata (BioPop.grid):
   0 ellenálló · 1 fogékony, egészséges · 2 most fertőzött · 3 elpusztult. Egy fertőzött tő a következő
   körben a 4 szomszédos fogékony tövet fertőzi meg, maga elpusztul. Minden tő megfertőződési köre
   (tinf) a lefutott történetből jön; a rajz a folytonos τ időből (kör) számolja a tő állapotát. */
const GW = 40, GH = 24;
function randField(w, h, seed) { const r = BioPop.rng(seed), u = new Float32Array(w * h); for (let k = 0; k < w * h; k++) u[k] = r(); return u; }
function layoutTypes(w, h, u, p, mode) {
  const t = new Uint8Array(w * h);
  const per = Math.max(2, Math.round(num('sávok szélessége'))), ns = Math.round(p * per);
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
    const k = j * w + i;
    t[k] = mode === 'egy' ? 1 : mode === 'sáv' ? ((i % per) < ns ? 1 : 0) : (u[k] < p ? 1 : 0);
  }
  return t;
}
function spread(w, h, types, start) { // start: 'left' | [i, j]
  const g = BioPop.grid({ w, h, seed: 1, T: 600, nb: 4,
    init: (i, j) => { const s = types[j * w + i]; if (!s) return 0; if (start === 'left' ? i === 0 : (i === start[0] && j === start[1])) return 2; return 1; },
    rule: (g, i, j, s) => (s === 1 && g.n(i, j, 2) > 0 ? 2 : s === 2 ? 3 : s) });
  const tinf = new Int16Array(w * h).fill(-1);
  for (let t = 0; t <= g.end; t++) { const a = g.at(t); for (let k = 0; k < a.length; k++) if (a[k] === 2 && tinf[k] < 0) tinf[k] = t; }
  const sus = types.reduce((s, v) => s + v, 0);
  return { w, h, types, g, tinf, end: g.end, sus, sick: g.count([2, 3], g.end), spans: g.spans([2, 3], g.end, 'x'),
    sickAt: (tau) => g.count([2, 3], Math.floor(tau)) };
}
// egy tő rajza: typ 1 fogékony, 0 ellenálló; age: a fertőzés óta eltelt kör (< 0: egészséges)
function plant(x, y, s, typ, age, a = 1) {
  if (a <= 0) return;
  const r = s * .4;
  if (typ === 0) {
    c.beginPath(); c.roundRect(x - r * .92, y - r * .92, r * 1.84, r * 1.84, r * .55); c.fillStyle = RES_F; c.fill();
    c.lineWidth = Math.max(1, s * .08); c.strokeStyle = RES_D; c.stroke();
    return;
  }
  if (age < 0) { disc(x, y, r, SUS_F); c.lineWidth = Math.max(1, s * .08); c.strokeStyle = SUS_D; c.stroke(); return; }
  if (age < 1) {
    const u = smooth(age);
    disc(x, y, r, U.mix(SUS_F, SICK, .35 + .65 * u)); c.lineWidth = Math.max(1, s * .1); c.strokeStyle = U.mix(SUS_D, '#7a3a10', u); c.stroke();
    if (s > 12) { disc(x - r * .3, y - r * .2, r * .22 * (.4 + u), '#4a2a10'); disc(x + r * .32, y + r * .25, r * .18 * (.4 + u), '#4a2a10'); }
    return;
  }
  const u = smooth((age - 1) / 1.5), rr2 = r * (1 - .35 * u);
  disc(x, y, rr2, U.mix(SICK, DEAD, u)); c.lineWidth = Math.max(1, s * .08); c.strokeStyle = DEAD_D; c.stroke();
}
function drawField(F0, box, tau, o = {}) {
  const cs = box.cs, w = F0.w, h = F0.h;
  c.save();
  rr(box.x - 8, box.y - 8, w * cs + 16, h * cs + 16, 10); c.fillStyle = SOIL; c.fill(); c.strokeStyle = SOIL_D; c.lineWidth = 2; c.stroke();
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
    const k = j * w + i, typ = F0.types[k], ti = F0.tinf[k];
    const a = o.appear ? o.appear(i, j) : 1; if (a <= 0) continue;
    c.globalAlpha = GA * a;
    plant(box.x + (i + .5) * cs, box.y + (j + .5) * cs, cs * (o.appear ? .6 + .4 * out(a) : 1), typ, ti < 0 ? -1 : tau - ti);
  }
  c.restore();
}
const cellAt = (box, w, h, px, py) => { const i = Math.floor((px - box.x) / box.cs), j = Math.floor((py - box.y) / box.cs); return i >= 0 && j >= 0 && i < w && j < h ? [i, j] : null; };
function legend(x, y, o = {}) {
  const items = [['fogékony fajta', 1, -1], ['ellenálló fajta', 0, -1], ['beteg tő', 1, .6], ['elpusztult tő', 1, 3]].filter((it) => !(o.noRes && it[1] === 0));
  items.forEach(([k, typ, age], i) => { plant(x + 14, y + i * 40 - 8, 28, typ, age); T(k, x + 40, y + i * 40, { s: 22 }); });
  return items.length * 40;
}

/* ════════════ 1. lépés: egy tábla, egy fajta ════════════ */
const BOX = { x: 60, y: 150, cs: 22 };
let F1 = null;
function barcode(x, y, w, h, seed) {
  const n = 22; for (let q = 0; q < n; q++) { const v = hash(q, seed, 5); c.fillStyle = GENE_C[Math.floor(v * 6)]; c.fillRect(x + q * w / n, y, w / n - 1.5, h * (.55 + .45 * hash(q, seed, 6))); }
  c.strokeStyle = LINE; c.lineWidth = 1.5; c.strokeRect(x - 2, y - 2, w + 2, h + 4);
}
function scene1(st) {
  title('kérdés 1');

  // előnyök

    const a = clamp((st - 1.8 - i * .4) / .5), x = px1, y = 800;
    px1 += 40 + L.measure(lab(k), { s: 24, w: 600 }).w + 24 + 40;
    if (a <= 0) return; al(a);
    L.pill(lab(k), x + 40, y, { k, s: 24, w: 600, bg: 'rgba(29,122,69,.1)', bd: GOOD, c: GOOD, r: 10, pad: 12 });
    c.strokeStyle = GOOD; c.lineWidth = 4; c.lineCap = 'round'; c.beginPath(); c.moveTo(x + 4, y - 8); c.lineTo(x + 14, y + 2); c.lineTo(x + 30, y - 18); c.stroke(); c.lineCap = 'butt';
  });
  // nagyító: három tő, azonos génkészlet
  const a1 = clamp((st - 3) / .7); if (a1 <= 0) { al(1); return; }
  al(a1);
  const kx = 990, ky = 150, kw = 350, kh = 600;
  card(kx, ky, kw, kh);
  T('nagyító cím', kx + 24, ky + 50, { f: F.D, s: 30, w: 600, max: kw - 48 });
  const picks = [[5, 4], [21, 15], [34, 9]];
  picks.forEach(([i, j], q) => {
    const yy = ky + 120 + q * 140, pa = clamp((st - 3.3 - q * .35) / .5); if (pa <= 0) return;
    al(a1 * pa);
    // vezetővonal a tábla tövéhez
    const px = BOX.x + (i + .5) * BOX.cs, py = BOX.y + (j + .5) * BOX.cs;
    ln(px, py, kx, yy, 'rgba(28,36,64,.3)', 2, [6, 6]); ring(px, py, BOX.cs * .6, INK, 2.5);
    plant(kx + 60, yy, 70, 1, -1);
    // levelek a nagy tőre
    T('génkészlet', kx + 112, yy - 22, { s: 22, c: MUT });
    barcode(kx + 112, yy - 8, 210, 34, 7);
  });
  const a2 = clamp((st - 4.6) / .5); al(a1 * a2);
  T('klónok', kx + 24, ky + kh - 40, { s: 26, w: 700, c: RED, max: kw - 48 });
  al(1);
}

/* ════════════ 2. lépés: jön a kórokozó ════════════ */

/* ════════════ 4. lépés: a fordulópont (S-görbe) ════════════ */
const W4 = 40, H4 = 40, P4 = []; for (let p = 30; p <= 90; p += 2) P4.push(p);
const S4 = { p: 50, seed: 0, us: null, res: null, t0: 0, tP: -9, F: null, cache: {} };
const BOX4 = { x: 60, y: 210, cs: 10 };
function trials4() { const n = Math.round(num('próbálkozások száma')), out2 = []; for (let t = 0; t < n; t++) out2.push(randField(W4, H4, 4001 + 104729 * S4.seed + 7919 * t)); return out2; }
function crossList(p) {
  const key = S4.seed + ':' + p; if (S4.cache[key]) return S4.cache[key];
  const res = new Uint8Array(S4.us.length), cells = new Uint8Array(W4 * H4), q = p / 100;
  S4.us.forEach((u, t) => { for (let k = 0; k < cells.length; k++) cells[k] = u[k] < q ? 1 : 0; res[t] = BioPop.spans(cells, W4, H4, (v) => v === 1, 4, 'x') ? 1 : 0; });
  S4.cache[key] = res; return res;
}
function setup4(all) {
  if (all) { S4.us = trials4(); S4.cache = {}; S4.res = P4.map((p) => { const r = crossList(p); return { p, n: r.reduce((s, v) => s + v, 0) }; }); }
  S4.F = spread(W4, H4, layoutTypes(W4, H4, S4.us[0], S4.p / 100, 'kevert'), 'left');
}
const half4 = () => { const R = S4.res, N = S4.us.length; for (let i = 1; i < R.length; i++) if (R[i].n >= N / 2 && R[i - 1].n < N / 2) { const a = R[i - 1], b = R[i]; return a.p + (N / 2 - a.n) / (b.n - a.n) * (b.p - a.p); } return NaN; };
function scene4(st) {

  if (done) L.pill(lab(S4.F.spans ? 'átért' : 'elakadt'), BOX4.x, fy, { k: S4.F.spans ? 'átért' : 'elakadt', s: 22, w: 700, b: 'middle', bg: S4.F.spans ? 'rgba(179,38,30,.12)' : 'rgba(29,122,69,.12)', bd: S4.F.spans ? BAD : GOOD, c: S4.F.spans ? BAD : GOOD, r: 10, pad: 8 });

  for (let t = 0; t < N; t++) { const i = t % cols, j = Math.floor(t / cols); rr(mx + i * (ms + 6), my + j * (ms + 6), ms, ms, 5); c.fillStyle = cl[t] ? SICK : 'rgba(29,122,69,.55)'; c.fill(); }
  // grafikon
  const pl = S4.pl; pl.axes();
  pl.band(0, 52, { col: 'rgba(29,122,69,.07)' }); pl.band(70, 100, { col: 'rgba(179,38,30,.07)' });
  pl.text(lab('alacsony'), 26, 50, { k: 'alacsony', s: 22, c: GOOD, w: 600, a: 'center' });
  pl.text(lab('magas'), 85, 50, { k: 'magas', s: 22, c: BAD, w: 600, a: 'center', max: 205 });
  const pc = num('perkolációs küszöb');

  const tr = st - S4.t0 - .6, shown = [];

  stamp('modell bélyeg', 1340, 1030, { a: 'right' });
}

/* ════════════ 5. lépés: Írország, 1845 ════════════ */
const PER = 100000; // egy pötty ennyi ember
const D5 = { x0: 330, y0: 210, dx: 34, cols: 12 };
let P5 = null;
function setup5() {
  const n = Math.round(num('népesség 1841-ben') / PER), nd = Math.round(num('halottak') / PER), ne = Math.round(dat('kivándorlók').v / PER);
