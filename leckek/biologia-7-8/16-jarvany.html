/* ══════════════════════════════════════════════════════════════════════════════════════════
   KÖZÖS BIOLÓGIA-MODULOK (pilot/biologia-7-8/terv.md, 4. fejezet), bájtra azonos másolatok:
   E · BioPop + H · BioPlot ← 07-populacio, C · BioZoom ← 01-sejt.
   ══════════════════════════════════════════════════════════════════════════════════════════ */
/* ── MODUL: Populáció-szimuláció (BioPop) · forrás: biologia-7-8/07-populacio, 2026-11-23 ──
   Előre lefuttatott, determinisztikus populációmodellek: közönséges differenciálegyenletek
   (ODE), ágensalapú (egyedi) szimuláció és rácsalapú (sejtautomata) változat, valamint
   „sok jövő” együttes futtatás. Minden véletlen egy seedelt xorshift32-ből jön (ugyanaz, mint a
   Lesson.U.rng), Math.random nincs. A modul a Lesson motortól is független (csak számol);
   a rajz a lecke vagy a BioPlot dolga. Az állapot mindig az időből (t) kérdezhető le, így a
   QA, a visszalépés és az L.st-ből számolt animáció determinisztikus.

   ── Véletlen ──
   BioPop.rng(seed) → r       r() ∈ [0, 1);  r.int(n) ∈ {0…n−1};  r.norm() standard normális;
                              r.pick(tömb);  r.state() → állapot (szám);  r.state(s) visszaállítja

   ── ODE ──
   BioPop.EQ[név] = f(t, x, p) → dx/dt   (beépített egyenletek; x tömb, p paraméter-objektum)
     'exponenciális'   x = [N]          p {r}                 dN = rN
     'logisztikus'     x = [N]          p {r, K}              dN = rN(1 − N/K)
     'lotka-volterra'  x = [N, P]       p {r, a, c, m}        dN = rN − aNP;   dP = cNP − mP
     'lv-logisztikus'  x = [N, P]       p {r, K, a, c, m}     mint fent, a zsákmány eltartóképességgel
     'rosenzweig'      x = [N, P]       p {r, K, a, h, c, m}  telítődő (II. típusú) zsákmányolás: aN/(1 + ahN)
     'tápláléklánc'    x = [V, N, P]    p {g, q, b, d, a, h, c, m}   V: növényzet (0–1, a maximum aránya)
                         dV = gV(1 − V) − qVN;  dN = N(bV − d) − aNP/(1 + ahN);  dP = cNP/(1 + ahN) − mP
     'versengés'       x = [N1, N2]     p {r1, r2, K1, K2, a12, a21}
     'sir'             x = [S, I, R]    p {beta, gamma}      dS = −βSI/N;  dI = βSI/N − γI;  dR = γI
   BioPop.equil(név, p) → egyensúlyi pont (tömb), ahol zárt alakban ismert (logisztikus, lotka-volterra,
                          lv-logisztikus, rosenzweig), különben null
   BioPop.ode({eq: név | f: saját függvény, p, x0, T, t0 = 0, dt = 0.01, min = 0,
               events: [{t, p: {…} (paramétercsere), x: [..] | fn(x, t) → x (állapotcsere; null elem = marad)}]})
     → run   (RK4, fix lépés; az egész pálya előre lefut; az esemény pontosan a t időpontban hat;
              min: alsó korlát minden komponensre – populáció nem lesz negatív)
     run.at(t) → [x…]          lineáris interpoláció a mintákon; t a [t0, t0 + T]-be vágva
     run.get(i, t) → x_i(t)    run.p(t) → az adott időben érvényes paraméterek
     run.series(i, ta, tb, n = 400) → [[t, x_i]…]        (BioPlot.line-hoz)
     run.phase(i, j, ta, tb, n = 600) → [[x_i, x_j]…]    (fázistér)
     run.mean(i, ta, tb) · run.min(i, ta, tb) · run.max(i, ta, tb)   (trapéz-, ill. mintaérték)
     run.peaks(i, ta, tb) → [t…] helyi maximumok (a minta-felbontásnál pontosabban, parabolával)
     run.period(i, ta, tb) → átlagos csúcstávolság (NaN, ha < 2 csúcs)
     run.t0, run.T, run.dt, run.n (minták száma), run.xs (Float64Array-ek komponensenként)

   ── Ágensek ──
   BioPop.agents({seed, ticks, dt = 1 (időegység / tick), snap = 25 (pillanatkép minden snap. tickben),
                  world: {w, h, wrap = true}, max = 5000, env: {…} (JSON-másolható környezet),
                  init(sim),                         // kezdőállapot: sim.add(kind, props) hívásokkal
                  rules: {
                    move(a, sim),                    // opcionális; alap: korrelált bolyongás a.v (px/tick) és
                                                     //   a.turn (rad/tick szórás) szerint, a fal mentén visszafordul
                    pairs: [{a: 'hiúz', b: 'nyúl', r: 20, fn(A, B, sim) → 'stop' | void}],
                                                     // találkozás: B ≤ r távolságra A-tól (térbeli rács); 'stop':
                                                     //   A ebben a tickben több B-t nem vizsgál
                    agent(a, sim),                   // egyedenkénti szabály (születés: sim.add, halál: sim.kill)
                    tick(sim),                       // globális szabály a tick végén (környezet, bevándorlás)
                    record(sim) → {név: szám},       // tickenkénti mérőszámok
                  }})
     sim.run() → sim           az egész futás előre (≤ 200 ms-ra méretezd); pillanatképekkel
     sim.at(t) → {t, tick, agents: [{id, kind, x, y, …props}]}   az x, y a két tick között interpolált;
                               a legközelebbi pillanatképtől determinisztikusan újrafuttat (gyorsítótárral)
     sim.count(kind, t) · sim.series(kind) → [[t, n]…] · sim.metric(név, t) · sim.mseries(név)
     sim.extinct(kind) → az első t, amikor a létszám 0 lett (különben null) · sim.T (= ticks · dt)
     A szabályokban: sim.add(kind, props) → a · sim.kill(a) · sim.rng · sim.tick · sim.t · sim.env ·
       sim.n(kind) (élő létszám) · sim.near(x, y, r, kind?) → [a…] · sim.world
     Az egyed mezői: id, kind, x, y, px, py (előző tick), h (irány), v, turn, age (tick), born (tick), dead;
       saját mezők: számok, szövegek (a pillanatkép sekély másolat – tömböt ne tegyél bele).

   ── Rács (sejtautomata) ──
   BioPop.grid({w, h, seed, T (tickek száma), nb: 4 | 8, wrap = false, stop = true,
                init(i, j, rng) → állapot (0–255),
                rule(g, i, j, s, rng) → új állapot})          // szinkron frissítés, sorfolytonos sorrendben
     → g (előre lefut; minden tick eltárolva; stop: true → leáll, ha egy tick után nem változott semmi)
     g.at(t) → Uint8Array (w·h, a floor(t). tick)  · g.cell(i, j, t) · g.count(s, t) · g.series(s) → [[t, n]…]
     g.end → az utolsó tick (ahol leállt)  · g.spans(test, t, dir = 'x') → igaz, ha a test(s)-nek
     megfelelő cellák (nb-szomszédsággal) összefüggő fürtje átér a rácson (x: bal → jobb, y: fent → lent)
     A rule-ban: g.n(i, j, s) → hány szomszéd van s állapotban (s: szám, tömb vagy függvény); g.get(i, j)
     g.draw(c, {x, y, w, h}, cols: {állapot: szín | null}, t, {gap = 1, r = 0})
     BioPop.spans(cells, w, h, test, nb = 4, dir = 'x')  – statikus változat (pl. perkoláció-próbához)

   ── Együttes futtatás („100 jövő”) ──
   BioPop.ensemble(make, n, seed) → E     make(seed_i, i) → tetszőleges eredmény; seed_i = seed + 7919 · i
     E.step(ms = 8) – képkockánként hívd (legfeljebb ms ideig futtat újabb tagokat);  E.all() – szinkron
     E.done, E.results (tömb, sorrendben), E.progress (0–1), E.n
   ──────────────────────────────────────────────────────────────────────────────────────────── */
const BioPop = (() => {
  'use strict';
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

  /* ── véletlen ── */
  function rng(seed) {
    let s = seed >>> 0 || 1;
    const r = () => { s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
    r.int = (n) => Math.floor(r() * n);
    r.norm = () => { let u = r(); while (u <= 1e-12) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * r()); };
    r.pick = (arr) => arr[Math.floor(r() * arr.length)];
    r.state = (v) => { if (v === undefined) return s; s = v >>> 0 || 1; return s; };
    return r;
  }

  /* ── ODE ── */
  const EQ = {
    'exponenciális': (t, [N], p) => [p.r * N],
    'logisztikus': (t, [N], p) => [p.r * N * (1 - N / p.K)],
    'lotka-volterra': (t, [N, P], p) => [p.r * N - p.a * N * P, p.c * N * P - p.m * P],
    'lv-logisztikus': (t, [N, P], p) => [p.r * N * (1 - N / p.K) - p.a * N * P, p.c * N * P - p.m * P],
    'rosenzweig': (t, [N, P], p) => { const f = p.a * N / (1 + p.a * p.h * N); return [p.r * N * (1 - N / p.K) - f * P, p.c / p.a * f * P - p.m * P]; },
    'tápláléklánc': (t, [V, N, P], p) => { const D = 1 + p.a * p.h * N;
      return [p.g * V * (1 - V) - p.q * V * N, N * (p.b * V - p.d) - p.a * N * P / D, p.c * N * P / D - p.m * P]; },
    'versengés': (t, [A, B], p) => [p.r1 * A * (1 - (A + p.a12 * B) / p.K1), p.r2 * B * (1 - (B + p.a21 * A) / p.K2)],
    'sir': (t, [S, I, R], p) => { const N = S + I + R || 1, f = p.beta * S * I / N; return [-f, f - p.gamma * I, p.gamma * I]; },
  };
  function equil(eq, p) {
    switch (eq) {
      case 'logisztikus': return [p.K];
      case 'lotka-volterra': return [p.m / p.c, p.r / p.a];
      case 'lv-logisztikus': { const N = p.m / p.c; return [N, p.r / p.a * (1 - N / p.K)]; }
      case 'rosenzweig': { const N = p.m / (p.a * (p.c / p.a - p.m * p.h)); return [N, p.r / p.a * (1 - N / p.K) * (1 + p.a * p.h * N)]; }
      default: return null;
    }
  }
  function ode(o) {
    const f = o.f || EQ[o.eq]; if (!f) throw new Error('BioPop.ode: ismeretlen egyenlet: ' + o.eq);
    const dt = o.dt || .01, t0 = o.t0 || 0, T = o.T, n = Math.max(1, Math.round(T / dt)), m = o.x0.length, lo = o.min == null ? 0 : o.min;
    const xs = Array.from({ length: m }, () => new Float64Array(n + 1));
    const ev = (o.events || []).map((e) => Object.assign({ k: Math.round((e.t - t0) / dt) }, e)).sort((a, b) => a.k - b.k);
    const pk = [{ k: 0, p: Object.assign({}, o.p) }];
    let p = pk[0].p, x = o.x0.slice(), ei = 0;
    const add = (a, b, h) => a.map((v, i) => v + b[i] * h);
    for (let k = 0; k <= n; k++) {
      while (ei < ev.length && ev[ei].k <= k) {
        const e = ev[ei++];
        if (e.p) { p = Object.assign({}, p, e.p); pk.push({ k, p }); }
        if (e.x) { if (typeof e.x === 'function') x = e.x(x.slice(), t0 + k * dt); else x = x.map((v, i) => e.x[i] == null ? v : e.x[i]); }
      }
      for (let i = 0; i < m; i++) xs[i][k] = x[i];
      if (k === n) break;
      const t = t0 + k * dt, k1 = f(t, x, p), k2 = f(t + dt / 2, add(x, k1, dt / 2), p), k3 = f(t + dt / 2, add(x, k2, dt / 2), p), k4 = f(t + dt, add(x, k3, dt), p);
      x = x.map((v, i) => Math.max(lo, v + dt / 6 * (k1[i] + 2 * k2[i] + 2 * k3[i] + k4[i])));
    }
    const kOf = (t) => clamp((t - t0) / dt, 0, n);
    const get = (i, t) => { const u = kOf(t), k = Math.min(n - 1, Math.floor(u)), fr = u - k; return xs[i][k] + (xs[i][k + 1] - xs[i][k]) * fr; };
    const rng2 = (ta, tb) => [ta == null ? t0 : ta, tb == null ? t0 + T : tb];
    const run = {
      t0, T, dt, n, xs,
      at: (t) => xs.map((_, i) => get(i, t)),
      get,
      p: (t) => { const u = kOf(t); let q = pk[0].p; for (const e of pk) if (e.k <= u) q = e.p; return q; },
      series(i, ta, tb, N = 400) { [ta, tb] = rng2(ta, tb); const out = []; for (let j = 0; j <= N; j++) { const t = ta + (tb - ta) * j / N; out.push([t, get(i, t)]); } return out; },
      phase(i, j, ta, tb, N = 600) { [ta, tb] = rng2(ta, tb); const out = []; for (let q = 0; q <= N; q++) { const t = ta + (tb - ta) * q / N; out.push([get(i, t), get(j, t)]); } return out; },
      mean(i, ta, tb) { [ta, tb] = rng2(ta, tb); if (tb <= ta) return get(i, ta); const N = Math.max(8, Math.ceil((tb - ta) / dt)); let s = 0;
        for (let q = 0; q <= N; q++) s += get(i, ta + (tb - ta) * q / N) * (q === 0 || q === N ? .5 : 1); return s / N; },
      min(i, ta, tb) { [ta, tb] = rng2(ta, tb); let v = Infinity; for (let k = Math.ceil(kOf(ta)); k <= Math.floor(kOf(tb)); k++) v = Math.min(v, xs[i][k]); return Math.min(v, get(i, ta), get(i, tb)); },
      max(i, ta, tb) { [ta, tb] = rng2(ta, tb); let v = -Infinity; for (let k = Math.ceil(kOf(ta)); k <= Math.floor(kOf(tb)); k++) v = Math.max(v, xs[i][k]); return Math.max(v, get(i, ta), get(i, tb)); },
      peaks(i, ta, tb) { [ta, tb] = rng2(ta, tb); const a = xs[i], out = [];
        for (let k = Math.max(1, Math.ceil(kOf(ta))); k < Math.min(n, Math.floor(kOf(tb))); k++) if (a[k] > a[k - 1] && a[k] >= a[k + 1]) {

/* ════════════ 4. és 7. lépés: ágensalapú járványmodell ════════════
   240 pötty bolyong egy 840 × 440 px-es (körbeérő) udvaron. A fertőző pötty a hatótávján belül
   lévő fogékony pöttyöket mintavételenként p eséllyel fertőzi meg (6 mintavétel / nap), és
   5 nap múlva meggyógyul. A p-t a kívánt R₀-ból számoljuk egy előre lemért táblázattal

  const kind = o.kind; let p = pFor(R0of(kind), kind); if (o.wash) p *= 1 - num('kézmosás hatása') / 100;

}
