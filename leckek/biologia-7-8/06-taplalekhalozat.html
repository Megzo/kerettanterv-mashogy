<script>
/* ══════════════════════════════════════════════════════════════════════════════════════════
   KÖZÖS BIOLÓGIA-MODUL (pilot/biologia-7-8/terv.md, 4. fejezet). Referencialecke: 06-taplalekhalozat.
   D · BioNet (hálózat, áramlás az éleken, kaszkád, piramis). Változtatás nélkül átemelhető.
   ══════════════════════════════════════════════════════════════════════════════════════════ */
/* ── MODUL: Hálózat (BioNet) · forrás: biologia-7-8/06-taplalekhalozat, 2026-11-24 ──
   Csomópont–él rajz (táplálékhálózat, anyagkörforgás, bármilyen irányított gráf) ikonokkal,
   kiemeléssel, kivett csomópontokkal; pöttyáram az éleken és lánc mentén („energia elszáll”);
   kvalitatív kaszkád egy faj kivételére/betelepítésére; energia-/biomassza-piramis lin ↔ log
   morffal. Minden mozgás ZÁRT KÉPLETBŐL jön (t → helyzet, seedelt hash), nincs képkockánkénti
   összegzés: a QA, az ugrás és a visszalépés determinisztikus. Csak a Lesson motorra épül
   (L.ctx-et a hívó adja c-ként, feliratok L.tx-szel, {s, k} párként – QA, review mód).
   Fa-elrendezés (dendrogram) és halmazábra ↔ fa morf: a 04-torzsfa építi, ide, visszafelé
   kompatibilis bővítésként (BioNet.tree); a csomópontrajz (ikon, felirat, kiemelés) innen jön.

   const net = BioNet.create(L, {
     nodes: [{id, x, y, r = 46, name: {s, k}, icon(c, x, y, s, n) (s: az ikon mérete px, ≈ 1,5 r),
              side: 'right' | 'left' | 'below' | 'above' (felirat helye), level (szabad mező), bg, ring}],
     edges: [{from, to, kind = 'eszik', w = 1 (súly a kaszkádhoz), bend = 0 (görbület, a hossz aránya,
              + balra a from → to irányhoz képest), id = 'from>to', gap0 = 6, gap1 = 10 (rés a körtől)}],
     styles: {fajta: {col, w, dash}}      // élfajták stílusa; alap: eszik (tinta 3 px), elhalt (barna
   })                                      //   szaggatott), tápanyag (olív pontozott)
   Az él iránya az ANYAG/ENERGIA iránya: from → to = „a from-ot megeszi a to” (táplálék → fogyasztó).
   net.N[id] · net.nodes · net.E (élek: e.A, e.B csomópontok, e.P útvonal: {pts, cum, len})
   net.move(id, x, y) – csomópont áthelyezése (az élek újraszámolódnak)
   net.pt(e | id, u) → [x, y, dx, dy]       pont az él mentén (u ∈ [0, 1], a körök szélétől a széléig)
   net.food(id, kinds?) → [id…] · net.eaters(id, kinds?) → [id…]     (kinds: élfajták, alap: ['eszik'])
   net.levels(kinds?) → {id: táplálkozási szint}  (termelő 1; a többi 1 + a táplálékai szintjének átlaga)
   net.hit(px, py, pad = 10) → id | null     melyik csomópontra kattintottak
   net.draw({a = 1, s = 24 (feliratméret), kinds (mely élfajták), removed: [id…] | Set,
             nodeA(n) → α, edgeA(e) → α, ring(n) → szín | null (kiemelő gyűrű), edgeCol(e) → szín | null,
             edgeW(e) → px, halo: id (vastag tintagyűrű), labels = true, icons = true, arrows = true,
             labelCol(n) → szín, labelBg = papírszín | null (felirat-alátét kikapcsolva)})
   net.flow(c, {t, kinds, edge(e) → bool, rate = 2 | fn(e) (pötty/s), speed = 150 (px/s), r = 6,
             col = arany | fn(e), stroke, a = 1, t0 = −∞ (ettől kezdve indulnak pöttyök), removed})
             pöttyök az éleken (a kibocsátás egyenletes, a helyzet t-ből számolva)
   net.cascade(id | [id…], {dir = −1 (kivétel) | +1 (betelepítés), depth = 3, decay = .6, kinds:
             ['eszik', 'tápanyag'], donor: ['tápanyag', 'elhalt'] (csak alulról felfelé ható élfajták:
             a fogyasztójukra hatnak, a forrásukra nem), removed}) → {v: {id: −1…1}, d: {id: hányadik lépésben}}
             egy szint: a fogyasztó a táplálékai számával, a zsákmány a ragadozói számával arányos
             (súlyozott) részt kap; szintenként decay-szel csillapodik; KVALITATÍV, nem előrejelzés
   net.badges(res, {t = ∞ (a változás óta eltelt idő), dt = .7 (mp lépésenként), thr = .1, a = 1,
             up = kékeszöld, down = cinóber, size = 1}) – ▲/▼ jelek a csomópontok jobb felső sarkán
   BioNet.chain(c, {pts: [[x, y]…], rate (pötty/s), keep: p | [p…] (a j. ponton továbbmenés esélye),
             t, t0 = −∞, seed = 1, speed = 150, r = 6, col, stroke, spread = 0 (oldalirányú szórás px),
             heat: {col, dx = 1, dy = −.5, dist = 120, life = 1.8}, a = 1}) → [db…]
             „energia-lánc”: a pötty a pontokon át halad; a j. pontnál keep[j] eséllyel megy tovább,
             különben hő-pöttyként elszáll; az utolsó ponton keep eséllyel beépül (elhalványul).
             Visszaad: hány pötty érkezett eddig az egyes pontokhoz (a lecke kiírhatja).
   BioNet.puffs(c, {x, y, rate, t, t0, seed, col, dx = 0, dy = −1, dist = 90, life = 1.6, r = 6,
             spread = 30, a = 1}) – egyenletesen felszálló pöttyök (hő, CO₂) egy pontból
   BioNet.dot(c, x, y, r, col, stroke)       pötty (sötét körvonallal)
   BioNet.arrow(c, x1, y1, x2, y2, {col, w = 3, head = 16, dash, bend = 0}) – nyíl (egyenes / ív)
   BioNet.pyramid(L, {cx, y (az alsó sáv alja), W (legszélesebb), h (sávmagasság), gap = 8,
             vals: [alulról felfelé], log = 0 (0 arányos … 1 log; morf), decades = vals.length,
             min = 3 (px), u = 1 (felépülés 0 → 1, alulról), cols: [szín…], a = 1,
             names: [{s, k}], nameX (ha megvan: a nevek jobbra igazítva ide), values = true,
             fmt(v, i) → szöveg, s = 24, vk (az értékfelirat .md-kulcsa)}) → [{x, y, w, h}…]
   BioNet.hash(i, j, k) → [0, 1) – determinisztikus „véletlen”
   ──────────────────────────────────────────────────────────────────────────────────────────── */
const BioNet = (() => {
  'use strict';
  const TAU = Math.PI * 2;
  const COL = { ink: '#1c2440', mut: '#565d72', card: '#fffaf1', gold: '#f2b632', goldL: '#8f5a0c', heat: '#c8401c', teal: '#0a6f86', red: '#c8401c' };
  const STY = { eszik: { col: COL.ink, w: 3 }, elhalt: { col: '#6b5a3e', w: 2.5, dash: [8, 7] }, tápanyag: { col: '#6b6a12', w: 2.5, dash: [3, 7] } };
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const smooth = (t) => { t = clamp(t); return t * t * (3 - 2 * t); };
  const hash = (i, j = 0, k = 0) => { let h = (i * 374761393 + j * 668265263 + k * 1274126177) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; h = Math.imul(h ^ (h >>> 15), 2246822519); h ^= h >>> 13; return (h >>> 0) / 4294967296; };
  function mkPath(pts) { const cum = [0]; for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1])); return { pts, cum, len: cum[cum.length - 1] }; }
  function along(P, u) {
    const s = clamp(u) * P.len; let lo = 0, hi = P.cum.length - 1;
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (P.cum[m] <= s) lo = m; else hi = m; }
    const a = P.pts[lo], b = P.pts[hi], d = (P.cum[hi] - P.cum[lo]) || 1, t = (s - P.cum[lo]) / d;
    let dx = b[0] - a[0], dy = b[1] - a[1]; const dl = Math.hypot(dx, dy) || 1;
    return [a[0] + dx * t, a[1] + dy * t, dx / dl, dy / dl];
  }
  function bezPts(p0, p2, bend, n = 48) {
    const dx = p2[0] - p0[0], dy = p2[1] - p0[1], len = Math.hypot(dx, dy) || 1;
    const q = [(p0[0] + p2[0]) / 2 + dy / len * bend * len, (p0[1] + p2[1]) / 2 - dx / len * bend * len], out = [];
    for (let i = 0; i <= n; i++) { const t = i / n, m = 1 - t; out.push([m * m * p0[0] + 2 * m * t * q[0] + t * t * p2[0], m * m * p0[1] + 2 * m * t * q[1] + t * t * p2[1]]); }
    return out;
  }
  function head(c, x, y, dx, dy, size, col) {
    c.beginPath(); c.moveTo(x, y); c.lineTo(x - dx * size - dy * size * .5, y - dy * size + dx * size * .5);
    c.lineTo(x - dx * size + dy * size * .5, y - dy * size - dx * size * .5); c.closePath(); c.fillStyle = col; c.fill();
  }
  function dot(c, x, y, r, col, stroke) {
    c.beginPath(); c.arc(x, y, Math.max(.5, r), 0, TAU); c.fillStyle = col; c.fill();
    if (stroke) { c.lineWidth = Math.max(1, r * .28); c.strokeStyle = stroke; c.stroke(); }
  }
  function arrow(c, x1, y1, x2, y2, o = {}) {
    const P = mkPath(o.bend ? bezPts([x1, y1], [x2, y2], o.bend, 32) : [[x1, y1], [x2, y2]]), hs = o.head || 16, col = o.col || COL.ink;
    const e = along(P, Math.max(0, 1 - hs * .6 / P.len));
    c.save(); c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = col; c.lineWidth = o.w || 3; c.setLineDash(o.dash || []);
    c.beginPath(); P.pts.forEach((p, i) => { if (P.cum[i] > P.len - hs * .6) return; i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1]); }); c.lineTo(e[0], e[1]); c.stroke();
    c.setLineDash([]); const z = along(P, 1); head(c, z[0], z[1], z[2], z[3], hs, col); c.restore();
  }

  function create(L, o) {
    const net = { L, N: {}, nodes: [], E: [] };
    const sty = Object.assign({}, STY, o.styles || {});
    for (const n0 of o.nodes) { const n = Object.assign({ r: 46, side: 'right' }, n0); net.nodes.push(n); net.N[n.id] = n; }
    for (const e0 of o.edges) { const e = Object.assign({ kind: 'eszik', w: 1, bend: 0, gap0: 6, gap1: 10 }, e0); e.id = e.id || e.from + '>' + e.to; net.E.push(e); }
    function geom(e) {
      e.A = net.N[e.from]; e.B = net.N[e.to];
      const raw = bezPts([e.A.x, e.A.y], [e.B.x, e.B.y], e.bend, 64);
      const r0 = e.A.r + e.gap0, r1 = e.B.r + e.gap1;
      let i0 = 0, i1 = raw.length - 1;
      while (i0 < i1 && Math.hypot(raw[i0][0] - e.A.x, raw[i0][1] - e.A.y) < r0) i0++;
      while (i1 > i0 && Math.hypot(raw[i1][0] - e.B.x, raw[i1][1] - e.B.y) < r1) i1--;
      e.P = mkPath(raw.slice(i0, i1 + 1).length > 1 ? raw.slice(i0, i1 + 1) : [raw[0], raw[raw.length - 1]]);
    }
    net.E.forEach(geom);
    const byId = (e) => (typeof e === 'string' ? net.E.find((x) => x.id === e) : e);
    const ks = (kinds) => kinds || ['eszik'];
    const rmSet = (r) => (r instanceof Set ? r : new Set(r || []));
    net.move = (id, x, y) => { const n = net.N[id]; n.x = x; n.y = y; net.E.forEach((e) => { if (e.from === id || e.to === id) geom(e); }); };
    net.pt = (e, u) => along(byId(e).P, u);
    net.food = (id, kinds) => net.E.filter((e) => e.to === id && ks(kinds).includes(e.kind)).map((e) => e.from);
    net.eaters = (id, kinds) => net.E.filter((e) => e.from === id && ks(kinds).includes(e.kind)).map((e) => e.to);
    net.levels = (kinds) => {
      const lv = {}; net.nodes.forEach((n) => { lv[n.id] = 1; });
      for (let it = 0; it < 30; it++) net.nodes.forEach((n) => { const f = net.food(n.id, kinds); if (f.length) lv[n.id] = 1 + f.reduce((s, x) => s + lv[x], 0) / f.length; });
      return lv;
    };
    net.hit = (px, py, pad = 10) => { let best = null, bd = 1e9; for (const n of net.nodes) { const d = Math.hypot(px - n.x, py - n.y); if (d <= n.r + pad && d < bd) { bd = d; best = n.id; } } return best; };

    net.draw = (q = {}) => {
      const c = L.ctx, A = q.a == null ? 1 : q.a, rm = rmSet(q.removed), base = c.globalAlpha;
      const kinds = q.kinds || Object.keys(sty);
      c.save(); c.lineCap = 'round'; c.lineJoin = 'round';
      // élek
      for (const e of net.E) {
        if (!kinds.includes(e.kind)) continue;
        const st = sty[e.kind] || STY.eszik, gone = rm.has(e.from) || rm.has(e.to);
        let ea = (q.edgeA ? q.edgeA(e) : 1) * (gone ? .15 : 1); if (ea <= .003) continue;
        const col = (q.edgeCol && q.edgeCol(e)) || st.col, w = (q.edgeW && q.edgeW(e)) || st.w;
        c.globalAlpha = base * A * ea; c.strokeStyle = col; c.lineWidth = w; c.setLineDash(gone ? [4, 8] : (st.dash || []));
        const P = e.P, hs = 10 + w * 2.2, cut = q.arrows === false ? 0 : hs * .7;
        c.beginPath(); let started = false;
        for (let i = 0; i < P.pts.length; i++) { if (P.cum[i] > P.len - cut) break; const p = P.pts[i]; started ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1]); started = true; }
        const z0 = along(P, Math.max(0, 1 - cut / P.len)); c.lineTo(z0[0], z0[1]); c.stroke(); c.setLineDash([]);
        if (q.arrows !== false) { const z = along(P, 1); head(c, z[0], z[1], z[2], z[3], hs, col); }
      }
      // csomópontok
      for (const n of net.nodes) {
        const gone = rm.has(n.id); let na = (q.nodeA ? q.nodeA(n) : 1); if (na <= .003) continue;
        c.globalAlpha = base * A * na;
        if (q.halo === n.id) { c.beginPath(); c.arc(n.x, n.y, n.r + 9, 0, TAU); c.strokeStyle = COL.ink; c.lineWidth = 5; c.stroke(); }
        c.beginPath(); c.arc(n.x, n.y, n.r, 0, TAU); c.fillStyle = n.bg || COL.card; c.fill();
        const ring = (q.ring && q.ring(n)) || null;
        c.lineWidth = ring ? 5 : 2.5; c.strokeStyle = ring || n.ring || 'rgba(28,36,64,.45)'; c.stroke();
        if (q.icons !== false && n.icon) {
          c.save(); c.beginPath(); c.arc(n.x, n.y, n.r - 2, 0, TAU); c.clip();
          c.globalAlpha = base * A * na * (gone ? .35 : 1); n.icon(c, n.x, n.y, n.r * 1.5, n); c.restore();
        }
        if (gone) {
          c.globalAlpha = base * A * na; c.strokeStyle = COL.red; c.lineWidth = 6; c.lineCap = 'round';
          const d = n.r * .55; c.beginPath(); c.moveTo(n.x - d, n.y - d); c.lineTo(n.x + d, n.y + d); c.moveTo(n.x + d, n.y - d); c.lineTo(n.x - d, n.y + d); c.stroke();
        }
      }
      // feliratok
      if (q.labels !== false) for (const n of net.nodes) {
        if (!n.name) continue; const na = (q.nodeA ? q.nodeA(n) : 1); if (na <= .05) continue;
        c.globalAlpha = base * A * na * (rm.has(n.id) ? .5 : 1);
        const s = q.s || 24, o2 = { k: n.name.k, s, w: 650, f: L.fonts.B, c: (q.labelCol && q.labelCol(n)) || COL.ink };
        const gp = q.halo === n.id ? 22 : 14;
        let lx = n.x + n.r + gp, ly = n.y + s * .33, la = 'left';
        if (n.side === 'left') { lx = n.x - n.r - gp; la = 'right'; }
        else if (n.side === 'below') { lx = n.x; ly = n.y + n.r + s * .5 + gp; la = 'center'; }

/* ════════════ 1. lépés: tápláléklánc, a nyíl iránya ════════════ */
const S1 = { ch: 0, tc: -9 };
function scene1(st) {
  title('kérdés 1');
  const sw = clamp((st - S1.tc) / .6), cur = S1.ch, prev = 1 - cur;
  const one = (which, a, tt) => {
    if (a <= .01) return;
    const net = which ? NET1b : NET1a, ids = net.nodes.map((n) => n.id), lv = which ? ['termelő', 'növényevő', 'ragadozó', 'csúcsragadozó'] : ['termelő', 'növényevő', 'ragadozó'];
    const ap = (i) => smooth((tt - .3 - i * .45) / .5);
    // szintcímkék
    net.nodes.forEach((n, i) => { al(a * ap(i)); L.pill(lab(lv[i]), n.x, n.y - n.r - 46, { k: lv[i], s: 24, w: 700, a: 'center', c: '#fffaf1', bg: LVCOL[i], bd: LVCOL[i], pad: 10 }); });
    al(a);
    const wrongA = which ? 0 : smooth((tt - 2) / .5) * (1 - smooth((tt - 4.2) / .5));
    const rightA = which ? smooth((tt - 1.6) / .6) : smooth((tt - 4.4) / .6);
    net.draw({ a: a, arrows: true, nodeA: (n) => ap(ids.indexOf(n.id)), edgeA: () => rightA });
    if (rightA > 0) {
      c.save(); c.globalAlpha = GA * a; net.flow(c, { t: tt, rate: 1.6, speed: 120, r: 9, a: rightA }); c.restore();
      al(a * rightA); T('energia útja', 680, 820, { s: 28, w: 700, a: 'center', c: GOLD_D, f: F.B });
    }
    if (wrongA > 0) {   // a „ki kit eszik” olvasat – nem így!
      const A = NET1a.N['róka'], B = NET1a.N['nyúl'];
      al(a * wrongA); BioNet.arrow(c, A.x - A.r - 14, A.y + 40, B.x + B.r + 14, B.y + 40, { col: RED, w: 5, head: 22, dash: [12, 9] });
      T('megeszi', (A.x + B.x) / 2, A.y + 92, { s: 24, w: 600, a: 'center', c: RED });
      const xa = smooth((tt - 3.2) / .4);
      if (xa > 0) { al(a * wrongA * xa); L.pill(lab('nem így'), (A.x + B.x) / 2, A.y - 12, { k: 'nem így', s: 28, w: 700, a: 'center', c: '#fffaf1', bg: RED, bd: RED, pad: 12 }); }
    }
    al(1);
  };
  one(prev, 1 - sw, st - S1.tc + 9);
  one(cur, S1.tc < -5 ? 1 : sw, S1.tc < -5 ? st : 9 + (st - S1.tc));
}

const S2 = { sel: null, selT: -9, user: false };
const LVL = ['termelők', 'növényevők', 'ragadozók', 'csúcsragadozók'];
function levelLabels(a = 1) {
  LVL.forEach((k, i) => { al(a); T(k, 60, LEVY[i] + 8, { s: 24, w: 700, c: LVCOL[i] }); });
  al(a * .5); c.strokeStyle = 'rgba(28,36,64,.12)'; c.lineWidth = 2; c.setLineDash([4, 8]);
  for (let i = 0; i < 4; i++) { c.beginPath(); c.moveTo(60, LEVY[i] + 26); c.lineTo(250, LEVY[i] + 26); c.stroke(); }
  c.setLineDash([]); al(1);
}
function scene2(st) {
  title('kérdés 2');
  const build = clamp((st - .2) / 2.6), eb = clamp((st - 1.6) / 2);
  const sel = S2.user ? S2.sel : (st > 4.4 ? 'egér' : null), sa = S2.user ? smooth((st - S2.selT) / .4) : smooth((st - 4.4) / .5);
  levelLabels(smooth(build * 2));
  const food = sel ? WEB.food(sel, ['eszik', 'elhalt']) : [], eat = sel ? WEB.eaters(sel) : [];
  const lvOf = (n) => (n.id === 'lebontók' ? 0 : n.level);
  WEB.draw({
    kinds: ['eszik', 'elhalt'],
    nodeA: (n) => smooth((build * 4.4 - lvOf(n)) / .8) * (sel && sa > 0 ? lerp(1, n.id === sel || food.includes(n.id) || eat.includes(n.id) ? 1 : .25, sa) : 1),
    edgeA: (e) => {
      const k = WEB.E.indexOf(e), base = e.kind === 'elhalt' ? .16 : 1, ap = smooth(eb * 14 - k * .8);
      if (!sel || sa <= 0) return ap * base;
      const on = (e.to === sel && food.includes(e.from)) || (e.from === sel && eat.includes(e.to)) || (e.kind === 'elhalt' && e.from === sel);
      return ap * lerp(base, on ? (e.kind === 'elhalt' ? .8 : 1) : base * .15, sa);
    },
    edgeCol: (e) => (sel && sa > .3 && (e.kind === 'eszik' || sel === 'lebontók') ? (e.to === sel ? TEAL : e.from === sel && e.kind === 'eszik' ? RED : null) : null),
    edgeW: (e) => (sel && sa > .3 && e.kind === 'eszik' && (e.to === sel || e.from === sel) ? 5 : null),
    ring: (n) => (sel && sa > .3 ? (food.includes(n.id) ? TEAL : eat.includes(n.id) ? RED : null) : null),
    halo: sel && sa > .3 ? sel : null,
  });
  al(smooth((st - 3) / .5) * (sel === 'lebontók' ? 1 : .6));
  T('elhalt', 1290, 885, { s: 22, w: 600, c: BROWN, a: 'center' });
  // jelmagyarázat
  const lx = 1310; al(smooth((st - 4) / .5));
  const w1 = L.measure(lab('fogyasztója'), { s: 24, w: 700 }).w;
  T('fogyasztója', lx, 150, { s: 24, w: 700, c: RED, a: 'right' }); BioNet.arrow(c, lx - w1 - 64, 142, lx - w1 - 14, 142, { col: RED, w: 5, head: 14 });
  const w2 = L.measure(lab('tápláléka'), { s: 24, w: 700 }).w;
  T('tápláléka', lx, 186, { s: 24, w: 700, c: TEAL, a: 'right' }); BioNet.arrow(c, lx - w2 - 64, 178, lx - w2 - 14, 178, { col: TEAL, w: 5, head: 14 });
  if (!S2.user) { al(smooth((st - 5) / .5)); L.pill(lab('kattints'), 640, 1010, { k: 'kattints', s: 24, w: 700, a: 'center', c: INK, bg: CARD, bd: INK, pad: 12 }); }
  al(1);
  if (L.step === 1 && L.pointer.pressed) { const id = WEB.hit(L.pointer.px, L.pointer.py); if (id) { S2.sel = id; S2.selT = st; S2.user = true; } }
}

/* ════════════ 3. lépés: van Helmont fűzfája ════════════ */
const S3 = { man: null };
function scene3(st) {
  title('kérdés 3');
  const Y = num('kísérlet hossza'), m0 = num('fűz kezdeti tömege'), m1 = num('fűz végső tömege'), soil = num('föld tömege'), loss = num('föld fogyása');
  const yr = S3.man != null ? S3.man : clamp((st - 1) / 5 * Y, 0, Y), u = yr / Y;
  const m = m0 * Math.pow(m1 / m0, u);    // szemléltető: exponenciális növekedés a két mért érték között
  // HONNAN TUDJUK kártya
  L.pill(lab('honnan tudjuk'), 60, 140, { k: 'honnan tudjuk', s: 22, w: 700, ls: '0.08em', c: '#fffaf1', bg: TEAL, bd: TEAL, pad: 10 });
  T('Helmont', 60, 210, { s: 26, w: 700, f: F.D, i: true });
  L.tx(lab('Helmont szöveg') + ' ' + L.val('közlés éve'), 60, 246, { k: ['Helmont szöveg', 'közlés éve'], s: 22, w: 500, c: MUT });
  // dézsa + fűz
  const px = 320, py = 900, pw = 300;
  const hgt = lerp(90, 470, Math.pow(m / m1, 1 / 2.2));
  c.save(); c.lineCap = 'round'; c.lineJoin = 'round';
  // törzs és ágak
  const tw = lerp(5, 22, Math.pow(m / m1, .45));
  c.strokeStyle = '#7a5a33'; c.lineWidth = tw; c.beginPath(); c.moveTo(px, py - 120); c.lineTo(px, py - 120 - hgt * .45); c.stroke();
  const nb = 9;
  for (let i = 0; i < nb; i++) {
    const a = (i / (nb - 1) - .5) * 1.9, L0 = hgt * (.55 + .12 * hash(i, 2)), bx = px + Math.sin(a) * L0 * .55, by = py - 120 - hgt * .45 - Math.cos(a) * L0 * .55;
    c.lineWidth = Math.max(2, tw * .45); c.beginPath(); c.moveTo(px, py - 120 - hgt * .4); c.quadraticCurveTo(px + Math.sin(a) * L0 * .3, by - 20, bx, by); c.stroke();
    // lecsüngő vesszők levelekkel
    const nv = 3; for (let v = 0; v < nv; v++) {
      const vx = bx + (v - 1) * 14, vl = hgt * (.25 + .1 * hash(i, v));
      c.strokeStyle = '#8a7a3a'; c.lineWidth = 2; c.beginPath(); c.moveTo(bx, by); c.quadraticCurveTo(vx + 10, by + vl * .3, vx, by + vl); c.stroke();
      for (let l = 1; l <= 4; l++) { const lt = l / 4.4; c.beginPath(); c.ellipse(lerp(bx, vx, lt) + 4, by + vl * lt, 3.5, 9, .4, 0, TAU); c.fillStyle = l % 2 ? LEAF : '#86b04e'; c.fill(); }
      c.strokeStyle = '#7a5a33';
    }
  }
  c.restore();

function tri(x, y, up) { c.beginPath(); if (up) { c.moveTo(x, y - 10); c.lineTo(x + 11, y + 8); c.lineTo(x - 11, y + 8); } else { c.moveTo(x, y + 10); c.lineTo(x + 11, y - 8); c.lineTo(x - 11, y - 8); } c.closePath(); c.fillStyle = up ? TEAL : RED; c.fill(); }
function sceneYS(st) {

/* ════════════ 9. lépés: összefoglalás ════════════ */
function scene9(st) {
  T('összegzés cím', 60, 82, { f: F.D, s: 42, w: 600 });
  const cw = 610, ch = 400, xs = [60, 690], ys = [140, 580];
  const ap = (i) => smooth((st - .2 - i * .35) / .5);
  ['ö1', 'ö2', 'ö3', 'ö4'].forEach((k, i) => {
    const x = xs[i % 2], y = ys[Math.floor(i / 2)]; al(ap(i));
    card(x, y, cw, ch);
    T(k, x + 24, y + 48, { s: 28, w: 700, f: F.D, max: cw - 48 });
    c.save(); c.beginPath(); c.rect(x + 4, y + 66, cw - 8, ch - 70); c.clip();
    if (i === 0) {    // nap → növény → állat, hő
      const yy = y + 330, xs3 = [x + 110, x + 305, x + 500];
      IC.nap(c, xs3[0], y + 170, 100); IC.növények(c, xs3[1], y + 170, 120); IC.állatok(c, xs3[2], y + 170, 120);
      for (let k = 0; k < 2; k++) BioNet.arrow(c, xs3[k] + 20, yy, xs3[k + 1] - 20, yy, { col: 'rgba(143,90,12,.5)', w: 3, head: 14 });
      BioNet.chain(c, { pts: [[xs3[0] - 60, yy], [xs3[1], yy], [xs3[2], yy]], rate: 6, keep: [1, .3, .25], t: st, seed: 4, speed: 130, r: 7, heat: { dx: .25, dy: -1, dist: 60, life: 1.4 } });
    } else if (i === 1) {
      BioNet.pyramid(L, { cx: x + cw / 2, y: y + ch - 30, W: 420, h: 60, gap: 8, vals: lvVals(), log: 1, decades: 4, cols: ['#b9d58c', '#e9c27a', '#8fc3cf', '#e79a7c'], values: false });
    } else if (i === 2) {
      const cx = x + cw / 2, cy = y + 240, R = 110;
      c.strokeStyle = CARBON; c.lineWidth = 4; c.setLineDash([]); c.beginPath(); c.arc(cx, cy, R, 0, TAU); c.stroke();
      for (let k = 0; k < 4; k++) { const a = k * TAU / 4 - Math.PI / 2 + .45; BioNet.arrow(c, cx + Math.cos(a - .12) * R, cy + Math.sin(a - .12) * R, cx + Math.cos(a) * R, cy + Math.sin(a) * R, { col: CARBON, w: 4, head: 18 }); }
      for (let k = 0; k < 10; k++) { const a = k * TAU / 10 + st * .5; BioNet.dot(c, cx + Math.cos(a) * R, cy + Math.sin(a) * R, 7, CARBON, INK); }
      IC.felhő(c, cx, cy - R, 70); IC.növények(c, cx - R, cy, 70); IC.állatok(c, cx + R, cy, 70); IC.lebontók(c, cx, cy + R, 60);
    } else {
      const res = WEB.cascade('róka');
      c.translate(x + cw / 2 - 765 * .37, y + 78 - 205 * .37); c.scale(.37, .37);
      WEB.draw({ kinds: ['eszik'], removed: ['róka'], labels: false });
      WEB.badges(res, { t: 99 });
    }
    c.restore();
  });
  al(1);
}

  const v = lvVals(), e = effP();
