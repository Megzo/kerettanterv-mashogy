/* ══════════════════════════════════════════════════════════════════════════════════════════
   KÖZÖS BIOLÓGIA-MODULOK (pilot/biologia-7-8/terv.md, 4. fejezet), bájtra azonos másolatok:
   BioBody és BioFlow ← biologia-7-8/11-verkor. Globális névtér: window.BioBody, window.BioFlow.
   ══════════════════════════════════════════════════════════════════════════════════════════ */
/* ── MODUL: Testrajz (BioBody) · forrás: biologia-7-8/11-verkor, 2026-11-23 ──
   Stilizált, nemileg semleges emberi alak (nincs nemi jelleg, haj, ruha), kapcsolható
   szervrendszer-rétegekkel, öt alkattal, álló és fekvő póz.

   KOORDINÁTÁK. Normalizált (u, v): v = 0 a fejtető, v = 1 a talp; u vízszintes, szintén a
   testmagasság egységében, a középvonaltól a NÉZŐ jobbja felé pozitív.
   FIGYELEM: szemből nézzük, ezért a test JOBB oldala a nézőnek BAL (u < 0)! Az azonosítókban a
   „jobb”/„bal” mindig a test saját oldala (pl. 'jobb tüdő' az u < 0 oldalon van).

   const body = BioBody.create(L, {x, y, h, build: 'semleges', pose: 'áll', tone: '#dccab0', arm: 9})
     x, y   a fejtető képernyőhelye (fekvő pózban is a fejtető; a test jobbra nyúlik el)
     h      testmagasság px-ben 'semleges' alkatnál; más alkatnál a valódi magasság h · hs
     build  'semleges' | 'alacsony' | 'magas' | 'teltebb' | 'karcsú' (egyik sem „normális” vagy „ideális”)
     pose   'áll' (szemből) | 'fekszik' (hanyatt, felülnézet, fej balra; a test jobbja lent)
            'kar' (könyök-közeli nagyítás) NINCS benne – a 10-es lecke bővítheti külön blokkban.
     tone   egységes, semleges kitöltés (több alaknál eltérhet); arm: a kar széttartása fokban
   body.place({x, y, h})            áthelyezés; kamera = place (nagyítás: nagyobb h) – minden
                                     vonal és címke ehhez igazodik
   body.setBuild(név) · body.morph(a, b, u)   alkat; morph: két alkat között, u ∈ [0, 1]
   body.S                           px / normalizált egység (= h · hs)
   body.map([u, v]) → [x, y]        normalizált → képernyő;   body.unmap(x, y) → [u, v]
   body.n(id) → [u, v]              ízület vagy szerv középpontja (normalizált)
   body.anchor(id) → [x, y]         ugyanez képernyőn
   body.org(id) → {id, layer, c, w: [rx, ry], k?, p?}   a szerv adatai (normalizált); a 'szív'
                                     k mezője: a BioFlow.heart helyi egysége normalizáltban
   body.ids(réteg?) → [id…]
   body.draw(c, {layers: {bőr: 1, csont: .3, …}, hi: [id…], dim: .25, a: 1})
                                     rétegek: bőr, csont, izom, keringés, légzés, emésztés,
                                     kiválasztás, ideg, mirigy, immun (érték = átlátszóság);
                                     hi: kiemelt szervek – a réteg többi szerve dim-re halványul.
                                     A c.globalAlpha-t szorzóként veszi (a lecke áttűnése).
   body.label(id | [x, y], {s, k}, {x, y, a: 'left'|'right', col, s: px, w, max, dot})
                                     vezetővonalas felirat (L.tx, k = .md-kulcs) → doboz
   body.labels(items, {left, right, mid, s, top, bottom})   automatikus oszlopos címkézés:
                                     items = [{at: id | [x, y], s, k, col, side?: 'left'|'right'}];
                                     oldalanként y szerint rendez és széttolja őket
   body.hit(px, py) → id | null     melyik szervre kattintottak (a látható rétegekből)
   body.axes({x, y, T: {jobb: {s, k}, bal: {s, k}}, s})   „a test jobbja / balja” jelzés
   BioBody.LAYERS · BioBody.BUILDS · BioBody.COL (szervrendszer-színkód, SZERZODES 12.)

   Szervek (id → réteg): agy, gerincvelő, idegek (ideg) · légcső, jobb tüdő, bal tüdő (légzés) ·
   szív (keringés) · nyelőcső, máj, gyomor, bél, hasnyálmirigy (emésztés + mirigy) · jobb vese,
   bal vese, húgyvezeték, húgyhólyag (kiválasztás) · agyalapi mirigy, pajzsmirigy, mellékvese
   (mirigy) · lép, csecsemőmirigy, nyirokcsomók (immun) · koponya, gerinc, bordák, kulcscsont,
   szegycsont, medence, végtagcsontok (csont) · izmok (izom).
   Ízületek: fejtető, fej, nyak, {jobb|bal} {váll, könyök, csukló, kéz, csípő, térd, boka, lábfej}.
   ──────────────────────────────────────────────────────────────────────────────────────────── */
const BioBody = (() => {
  'use strict';
  const TAU = Math.PI * 2;
  const COL = {
    ink: '#1c2440', mut: '#565d72', paper: '#f7f1e6', card: '#fffaf1',
    rich: '#c0392b', poor: '#7b2440', o2: '#0a6f86', co2: '#565d72', food: '#8f5a0c', excr: '#6b6a12',
    nerve: '#2a4d9b', horm: '#7b4fa0', immun: '#1d7a45',
    bone: '#ece1c9', boneL: '#6b5a3e', musc: '#e3a593', muscL: '#8c3b2a', skin: '#dccab0',
  };
  const LAYERS = ['bőr', 'csont', 'izom', 'emésztés', 'kiválasztás', 'légzés', 'keringés', 'ideg', 'mirigy', 'immun'];
  const BUILDS = {
    semleges: { hs: 1,    head: 1,    nk: 1,    sh: 1,    ch: 1,    wa: 1,    hp: 1,    li: 1 },
    alacsony: { hs: .9,   head: 1.04, nk: 1.02, sh: 1.03, ch: 1.03, wa: 1.04, hp: 1.03, li: 1.04 },
    magas:    { hs: 1.08, head: .96,  nk: .97,  sh: .97,  ch: .96,  wa: .95,  hp: .96,  li: .95 },
    teltebb:  { hs: 1,    head: 1.04, nk: 1.25, sh: 1.1,  ch: 1.2,  wa: 1.45, hp: 1.26, li: 1.32 },
    karcsú:   { hs: 1,    head: .98,  nk: .92,  sh: .93,  ch: .88,  wa: .84,  hp: .88,  li: .82 },
  };
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const hx = (h) => { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
  const mix = (a, b, t) => { const A = hx(a), B = hx(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * clamp(t)).toString(16).padStart(2, '0')).join(''); };
  const rgba = (h, a) => { const A = hx(h); return `rgba(${A[0]},${A[1]},${A[2]},${a})`; };
  /* réteg → [kitöltés, vonal, tömör világos (csőszerű vonalakhoz)] */
  const LC = {
    csont: [COL.bone, COL.boneL, COL.bone], izom: [COL.musc, COL.muscL, COL.musc],
    keringés: [COL.musc, COL.muscL, COL.musc], légzés: [rgba(COL.o2, .13), COL.o2, mix(COL.o2, COL.paper, .8)],
    emésztés: [rgba(COL.food, .15), COL.food, mix(COL.food, COL.paper, .78)], kiválasztás: [rgba(COL.excr, .17), COL.excr, mix(COL.excr, COL.paper, .78)],
    ideg: [rgba(COL.nerve, .13), COL.nerve, mix(COL.nerve, COL.paper, .8)], mirigy: [rgba(COL.horm, .22), COL.horm, mix(COL.horm, COL.paper, .75)],
    immun: [rgba(COL.immun, .2), COL.immun, mix(COL.immun, COL.paper, .75)],
  };
  const ell = (cx, cy, rx, ry, rot = 0, n = 28) => {
    const o = []; for (let i = 0; i < n; i++) { const t = i / n * TAU, x = Math.cos(t) * rx, y = Math.sin(t) * ry; o.push([cx + x * Math.cos(rot) - y * Math.sin(rot), cy + x * Math.sin(rot) + y * Math.cos(rot)]); } return o;
  };
  /* sima zárt / nyitott görbe a pontokon át (másodfokú felezőpontos) */
  function closed(c, P) {
    const n = P.length, m = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2]; c.beginPath();
    const s = m(P[n - 1], P[0]); c.moveTo(s[0], s[1]);
    for (let i = 0; i < n; i++) { const q = m(P[i], P[(i + 1) % n]); c.quadraticCurveTo(P[i][0], P[i][1], q[0], q[1]); }
    c.closePath();
  }
  function open(c, P) {
    c.beginPath(); c.moveTo(P[0][0], P[0][1]);
    for (let i = 1; i < P.length - 1; i++) { const q = [(P[i][0] + P[i + 1][0]) / 2, (P[i][1] + P[i + 1][1]) / 2]; c.quadraticCurveTo(P[i][0], P[i][1], q[0], q[1]); }
    const e = P[P.length - 1]; c.lineTo(e[0], e[1]);
  }
  function poly(c, P) { c.beginPath(); P.forEach((p, i) => i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])); c.closePath(); }
  /* végtag: középvonal-lánc + félszélességek → zárt körvonal (lekerekített végekkel) */
  function limb(ch, ws) {
    const n = ch.length, A = [], B = [];
    for (let i = 0; i < n; i++) {
      const a = ch[Math.max(0, i - 1)], b = ch[Math.min(n - 1, i + 1)];
      let dx = b[0] - a[0], dy = b[1] - a[1]; const d = Math.hypot(dx, dy) || 1; dx /= d; dy /= d;
      A.push([ch[i][0] - dy * ws[i], ch[i][1] + dx * ws[i]]); B.push([ch[i][0] + dy * ws[i], ch[i][1] - dx * ws[i]]);
    }
    const dir = (p, q) => { const d = Math.hypot(p[0] - q[0], p[1] - q[1]) || 1; return [(p[0] - q[0]) / d, (p[1] - q[1]) / d]; };
    const e1 = dir(ch[n - 1], ch[n - 2]), e0 = dir(ch[0], ch[1]);
    return [[ch[0][0] + e0[0] * ws[0] * .9, ch[0][1] + e0[1] * ws[0] * .9], ...A, [ch[n - 1][0] + e1[0] * ws[n - 1] * .9, ch[n - 1][1] + e1[1] * ws[n - 1] * .9], ...B.reverse()];
  }
  const add = (p, d) => [p[0] + d[0], p[1] + d[1]];
  const lerp2 = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
  /* a szív körvonala a BioFlow.heart helyi egységeiben (ugyanaz a forma, mint ott) */
  const HEART = [[-.40, -.22], [-.30, -.30], [-.05, -.28], [.18, -.32], [.36, -.24], [.42, -.05], [.38, .16], [.26, .34], [.12, .46], [.0, .42], [-.16, .34], [-.32, .22], [-.42, .04]];

  /* ── geometria egy paraméterkészletből (alkat) ── */
  function geo(P) {
    const G = { skin: [], J: {}, O: {} }, J = G.J, O = G.O;
    const hd = P.head, sh = P.sh, ch = P.ch, wa = P.wa, hp = P.hp, li = P.li, nk = P.nk;
    const hy = .066 * hd;
    J['fejtető'] = [0, 0]; J['fej'] = [0, hy]; J['nyak'] = [0, .15];
    G.skin.push({ p: ell(0, hy + .002, .05 * hd, .064 * hd) });
    G.skin.push({ p: [[-.027 * nk, .11], [.027 * nk, .11], [.03 * nk, .18], [-.03 * nk, .18]], sharp: true });
    const R = [[.026 * nk, .158], [.07 * sh, .176], [.11 * sh, .188], [.13 * sh, .212], [.108 * ch, .262], [.104 * ch, .31],
      [.094 * (ch + wa) / 2, .36], [.086 * wa, .405], [.092 * (wa + hp) / 2, .445], [.1 * hp, .482], [.102 * hp, .515], [.092 * hp, .542], [.03 * hp, .556]];
    G.skin.push({ p: [...R, [0, .558], ...R.slice().reverse().map((p) => [-p[0], p[1]]), [0, .155]] });
    const a = (P.arm == null ? 9 : P.arm) * Math.PI / 180, a2 = a * .75;
    const bones = [], musc = [], nerves = [];
    for (const s of [-1, 1]) {
      const sd = s < 0 ? 'jobb' : 'bal';
      const S = [s * .112 * sh, .212], E = [S[0] + s * .162 * Math.sin(a), S[1] + .162 * Math.cos(a)];
      const W = [E[0] + s * .148 * Math.sin(a2), E[1] + .148 * Math.cos(a2)], Hc = [W[0] + s * .04 * Math.sin(a2 * .8), W[1] + .042 * Math.cos(a2 * .8)];
      J[sd + ' váll'] = S; J[sd + ' könyök'] = E; J[sd + ' csukló'] = W; J[sd + ' kéz'] = Hc;
      G.skin.push({ p: limb([S, lerp2(S, E, .5), E, W], [.034 * li, .029 * li, .023 * li, .016 * li]) });
      G.skin.push({ p: ell(Hc[0], Hc[1], .019 * Math.sqrt(li), .043, -s * a2 * .8) });
      const Hj = [s * .05 * hp, .515], K = [s * .05 * (.6 + .4 * hp), .745], A = [s * .055 * (.7 + .3 * hp), .955], Ft = [A[0] + s * .008, .977];
      const M1 = [(Hj[0] + K[0]) / 2, .62], C1 = [(K[0] + A[0]) / 2 + s * .002, .83];
      J[sd + ' csípő'] = Hj; J[sd + ' térd'] = K; J[sd + ' boka'] = A; J[sd + ' lábfej'] = Ft;
      G.skin.push({ p: limb([Hj, M1, K, C1, A], [.052 * li * Math.sqrt(hp), .047 * li, .034 * li, .036 * li, .02 * li]) });
      G.skin.push({ p: ell(Ft[0], Ft[1], .028 * Math.sqrt(li), .021) });
      // csontok (vonalak, csőként rajzolva)
      bones.push([S, E], [add(E, [-s * .004, 0]), add(W, [-s * .004, 0])], [add(E, [s * .005, 0]), add(W, [s * .005, 0])], [Hj, K], [add(K, [-s * .004, 0]), A], [add(K, [s * .008, .01]), add(A, [s * .008, -.01])]);
      bones.push([[0, .19], [s * .1 * sh, .193]]);
      // izmok (orsó alakú hasak)
      musc.push(ell(...lerp2(S, E, .12), .028 * li, .03, 0), ell(...lerp2(S, E, .55), .022 * li, .06, -s * a), ell(...lerp2(E, W, .35), .018 * li, .055, -s * a2),
        ell(...lerp2(Hj, K, .45), .036 * li, .1, -s * .03), ell(...lerp2(K, A, .3), .026 * li, .07, 0), ell(s * .05 * ch, .238, .042 * ch, .026, s * .2));
      nerves.push([[0, .2], [s * .05, .205], S, E, W], [[0, .47], [s * .03, .5], Hj, K, A]);
    }
    const org = (id, layer, o) => { O[id] = Object.assign({ id, layer }, o); };
    // ideg
    const bc = [0, .052 * hd], br = [.041 * hd, .034 * hd];
    org('agy', 'ideg', { p: ell(bc[0], bc[1], br[0], br[1]), c: bc, w: br, gyri: true });
    org('gerincvelő', 'ideg', { lines: [[[0, .095], [0, .2], [0, .35], [0, .47]]], lw: 4, c: [0, .3], w: [.006, .19] });

  const na = t > sq.p[2] && t < sq.cpr ? smooth((t - sq.p[2]) / .3) * (1 - smooth((t - sq.cpr + .3) / .3)) : 0;
  if (na > 0) { al(a * na); pill('ne érj', 430, 330, { s: 30, w: 700, a: 'center', bg: BAD, c: '#fff8ee', pad: 18 }); }
  // hangutasítások
  al(a); T('hangutasítás', 880, 108, { s: 24, w: 700, c: MUT });
  const keys = ['aed 1', 'aed 2', 'aed 3', S8.shock ? 'aed 4 sokk' : 'aed 4 nincs', 'aed 5'];
  let y = 140;
  keys.forEach((k, i) => {
    const pa = smooth((t - sq.p[i]) / .4); if (pa <= 0) return;
    const cur = t >= sq.p[i] && (i === 4 || t < sq.p[i + 1]), o = { s: 24, w: cur ? 700 : 500, c: INK };
    const ls = lines(lab(k), 400, o), h = 26 + ls.length * 31;
    al(a * pa * (cur ? 1 : .55)); card(880, y, 450, h, { bd: cur ? TEAL : LINE, bw: cur ? 3.5 : 2, r: 14 });
    ls.forEach((s2, j) => L.tx(s2, 905, y + 38 + j * 31, Object.assign({ k }, o)));
    y += h + 16;
  });
  al(a); wrapS(H('egyedül', fmt(num('AED elérése egyedül'))), ['egyedül', 'AED elérése egyedül'], 470, 1010, 860, { s: 24, w: 600, i: 1, c: INK }, 30);
}

/* ═══ 9. Összefoglalás ═══ */
function scene9(st) {
  const keys = ['lánc biztonság', 'lánc reagál', 'lánc 112', 'lánc lélegzik', 'lánc nyomás', 'lánc AED'];
  keys.forEach((k, i) => {
    const a = smooth((st - .2 - i * .35) / .4); if (a <= 0) return;
    const y = 130 + i * 145;
    al(a); if (i < keys.length - 1) ln(100, y + 34, 100, y + 112, MUT, 3);
    disc(100, y, 32, i === 4 ? RED : i === 2 ? BAD : INK);
    L.tx(String(i + 1), 100, y + 1, { f: F.M, s: 30, w: 700, a: 'center', b: 'middle', c: '#fff8ee', qa: false });
    T(k, 155, y + 12, { f: F.D, s: 38, w: 600, c: i === 4 ? RED : INK, max: 560 });
    if (i === 4) L.tx(L.val('kompresszió üteme') + ' · ' + L.val('kompresszió mélysége'), 157, y + 54, { k: ['kompresszió üteme', 'kompresszió mélysége'], f: F.M, s: 26, w: 600, c: INK });
  });
  const ca = smooth((st - 2.2) / .5);
  if (ca > 0) {
    al(ca); card(760, 70, 570, 330);
    T('ne hagyd abba', 785, 125, { f: F.D, i: 1, s: 34, w: 600, c: INK, max: 520 });
    let y = 175;
    for (const k of ['abbahagy 1', 'abbahagy 2', 'abbahagy 3', 'abbahagy 4']) { y += 34 * wrap(k, 790, y, 515, { s: 24, w: k === 'abbahagy 3' ? 500 : 600, c: k === 'abbahagy 3' ? MUT : INK }, 32) + 6; }
  }
  const ha = smooth((st - 2.8) / .5);
  if (ha > 0) {
    al(ha); card(760, 430, 570, 260, { bd: TEAL, bw: 2.5 });
    T('honnan tudjuk', 785, 478, { s: 24, w: 800, c: TEAL, ls: '1.5px' });
    let y = 524;
    y += 32 * wrapS(H('honnan 1', L.val('ERC irányelv éve')), ['honnan 1', 'ERC irányelv éve'], 785, y, 520, { s: 24, w: 600, c: INK }, 32) + 6;
    y += 32 * wrap('honnan 2', 785, y, 520, { s: 24, w: 600, c: INK }, 32) + 6;
    wrap('honnan 3', 785, y, 520, { s: 24, w: 500, i: 1, c: MUT }, 32);
  }
  const sa = smooth((st - 3.4) / .5);
  if (sa > 0) {
    al(sa); stamp('nem helyettesíti', 1045, 790, BAD, { s: 24, w: 700, ls: '.5px', max: 560, pad: 14 });
    al(sa); T('gyakorold', 1045, 870, { f: F.D, i: 1, s: 30, w: 500, a: 'center', c: INK, max: 540 });
  }
}

/* ════════════════════════════════════════════════════════════════ */
const sT = new Array(9).fill(0);
const SC = [scene1, scene2, scene3, scene4, scene5, scene6, scene7, scene8, scene9];
L = Lesson.create({
  content: window.LESSON_CONTENT,
  home: false,
  resetCtx: true,
  steps: [
    { settle: 9.5 },
    { settle: 7 },
    { settle: 11.5,
      enter() { S3.ch = null; S3.t0 = 0; },
      controls(L) {
        L.button(lab('lélegzik gomb'), (el) => { S3.ch = 'igen'; S3.t0 = L.st; el.blur(); }, 'lélegzik gomb');
        L.button(lab('kapkod gomb'), (el) => { S3.ch = 'kapkod'; S3.t0 = L.st; el.blur(); }, 'kapkod gomb');
        L.button(lab('nem lélegzik gomb'), (el) => { S3.ch = 'nem'; S3.t0 = L.st; el.blur(); }, 'nem lélegzik gomb');
      } },
    { settle: 6,
      enter() { S4.log = [{ t: .8, run: true }]; },
      controls(L) {
        L.button(lab('abbahagyom gomb'), (el) => {
          const last = S4.log[S4.log.length - 1], run = !run4(L.st);
          S4.log.push({ t: Math.max(L.st, last.t + .01), run }); el.textContent = lab(run ? 'abbahagyom gomb' : 'folytatom gomb'); el.blur();
        }, 'abbahagyom gomb');
      } },
    { settle: 4,
      enter() { S5.depth = 3; S5.rate = 80; S5.ph0 = 0; S5.t0 = 0; },
      controls(L) {
        L.slider({ label: lab('mélység csúszka'), k: 'mélység csúszka', min: 2, max: 8, step: .5, value: 3, format: (v) => fmt(v, v % 1 ? 1 : 0) + ' ' + lab('cm'), onInput: (v) => { S5.depth = v; } });
        L.slider({ label: lab('ütem csúszka'), k: 'ütem csúszka', min: 60, max: 160, step: 5, value: 80, format: (v) => fmt(v) + lab('per perc'), onInput: (v) => { S5.ph0 = ph5(L.st); S5.t0 = L.st; S5.rate = v; } });
      } },
    { settle: 3,
      enter() { S6.taps = []; S6.metro = false; S6.lastBeat = -1; },
      leave() { S6.metro = false; },
      controls(L) {
        L.button(lab('metronóm be'), (el) => {
          S6.metro = !S6.metro;
          if (S6.metro) {
            if (!S6.actx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) { try { S6.actx = new AC(); } catch (e) { S6.actx = null; } } }
            if (S6.actx && S6.actx.resume) S6.actx.resume();
            S6.m0 = L.st; S6.lastBeat = -1;
          }
          el.textContent = lab(S6.metro ? 'metronóm ki' : 'metronóm be'); el.blur();
        }, 'metronóm be');
        L.button(lab('újra gomb'), (el) => { S6.taps = []; el.blur(); }, 'újra gomb');
      } },
    { settle: 8,
      enter() { S7.learned = true; S7.t0 = .8; },
      controls(L) {
        L.button(lab('nem tanultam gomb'), (el) => { S7.learned = !S7.learned; S7.t0 = L.st; el.textContent = lab(S7.learned ? 'nem tanultam gomb' : 'tanultam gomb'); el.blur(); }, 'nem tanultam gomb');
      } },
    { settle: 11,
      enter() { S8.shock = true; S8.t0 = 0; },
      controls(L) {
        L.button(lab('nincs sokk gomb'), (el) => { S8.shock = !S8.shock; S8.t0 = Math.min(0, L.st - seq8().p[2]); el.textContent = lab(S8.shock ? 'nincs sokk gomb' : 'sokk gomb'); el.blur(); }, 'nincs sokk gomb');
      } },
    { settle: 5 },
  ],
  init(Lx) {
    L = Lx; c = L.ctx;
    BODY = BioBody.create(L, { build: 'semleges', pose: 'fekszik', tone: SKIN, arm: 7 });
    FLN = makeCirc(BODY, 5, STROKE, .55);
    FLC = makeCirc(BODY, 5, STROKE * qGood() * pulse0() / rateMid(), 0);   // egy nyomás: a normális perctérfogat qGood-ja, rateMid tempóra elosztva
    /* Szóköz (és Enter) a 6. lépésben: egy nyomás – nem léptet tovább */
    window.addEventListener('keydown', (e) => {
      if (!L || L.step !== 5 || (e.key !== ' ' && e.key !== 'Enter')) return;
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      e.preventDefault(); e.stopImmediatePropagation();
      if (!e.repeat) addTap(L.st);
    }, true);
    window.__bio = { BODY, FLN, FLC, S3, S4, S5, S6, S7, S8, cprState, autoTaps };
  },
  draw(Lx) {
    L = Lx; c = L.ctx; GA = 1; background();
    const sp = L.sp;
    if (L.step >= 0) sT[L.step] = L.st;
    for (let i = 0; i < SC.length; i++) {
      const w = clamp(1 - Math.abs(sp - i) * 1.6); if (w <= .005) continue;
      GA = w; SC[i](sT[i], L.step === i);
    }
    c.globalAlpha = 1;
  },
});
/* L.checks: a kiírt/rajzolt értékek a modellből és az adatokból egyeznek-e */
L.checks = () => {
  const rR = rng2('kompresszió üteme'), dR = rng2('kompresszió mélysége'), mid = rateMid(), dt = 60 / mid;
  const taps = []; for (let t = 0; t <= 20; t += dt) taps.push(t);
  const cs = cprState(taps, 20 + dt * .5), c7 = cyc7(30);
  return [
    { name: 'ERC 2025: 100–120/perc', ok: rR.lo === 100 && rR.hi === 120, got: rR.s, want: '100–120/perc' },
    { name: 'ERC 2025: 5–6 cm', ok: dR.lo === 5 && dR.hi === 6, got: dR.s, want: '5–6 cm' },
    { name: 'metronóm a tartományon belül', ok: num('metronóm üteme') >= rR.lo && num('metronóm üteme') <= rR.hi, got: num('metronóm üteme'), want: rR.s },
    { name: 'mért tempó állandó ütemnél = ütem', ok: Math.abs(cs.rate - mid) < .5, got: cs.rate, want: mid },
    { name: 'agyi véráramlás állandó jó ütemnél a sávban', ok: cs.q * 100 >= dat('agy véráramlása újraélesztéskor').lo - 3 && cs.q * 100 <= dat('agy véráramlása újraélesztéskor').hi + 3, got: cs.q * 100, want: dat('agy véráramlása újraélesztéskor').s },
    { name: 'automatikus nyomások: 60 s alatt ≈ ütem', ok: Math.abs(autoTaps([{ t: 0, run: true }], mid, 60 - 1e-6).length - mid) <= 1, got: autoTaps([{ t: 0, run: true }], mid, 60 - 1e-6).length, want: mid },
    { name: 'metszet: a szegycsont pontosan d cm-t mozdul', ok: Math.abs(topH(SEC.XS, 0) - topH(SEC.XS, 5.5) - 5.5) < 1e-9, got: topH(SEC.XS, 0) - topH(SEC.XS, 5.5), want: 5.5 },
    { name: '30 : 2 – a befúvások szünete ≤ az ajánlott', ok: BP <= num('befúvások szünete legfeljebb') && c7.N === 30, got: BP, want: '≤ ' + num('befúvások szünete legfeljebb') },
  ];
};
/* QA: szélső állapotok (tools/qa_lesson.py --states); a QA a lépés settle idejénél fotóz */
const tapsAt = (rate, t0, t1) => { const a = []; for (let t = t0; t <= t1 + 1e-9; t += 60 / rate) a.push(t); return a; };
window.__qaStates = {
  3: [{ name: 'normalis', set() { S3.ch = 'igen'; S3.t0 = 11.5 - 2; } },
      { name: 'kapkod', set() { S3.ch = 'kapkod'; S3.t0 = 11.5 - .3; } },
      { name: 'nem', set() { S3.ch = 'nem'; S3.t0 = 11; } }],
  4: [{ name: 'abbahagyta', set() { S4.log = [{ t: .8, run: true }, { t: 2.5, run: false }]; } },
      { name: 'folytatta', set() { S4.log = [{ t: .8, run: true }, { t: 2, run: false }, { t: 4.4, run: true }]; } }],
  5: [{ name: 'jo', set(L) { L.sliders[0].set(5.5, { fire: true }); L.sliders[1].set(110, { fire: true }); } },
      { name: 'tul-mely-gyors', set(L) { L.sliders[0].set(8, { fire: true }); L.sliders[1].set(160, { fire: true }); } },
      { name: 'sekely-lassu', set(L) { L.sliders[0].set(2, { fire: true }); L.sliders[1].set(60, { fire: true }); } }],
  6: [{ name: 'jo-110', set() { S6.taps = tapsAt(110, -17, 2.9); } },
      { name: 'lassu-75', set() { S6.taps = tapsAt(75, -17, 2.9); } },
      { name: 'gyors-150', set() { S6.taps = tapsAt(150, -17, 2.9); } },
      { name: 'megallt', set() { S6.taps = tapsAt(110, -17, -2); } },
      { name: 'metronom', set(L) { S6.metro = true; S6.m0 = 0; S6.taps = tapsAt(104, -5, 2.9).concat(tapsAt(125, -15, -5.1)).sort((a, b) => a - b); } }],
  7: [{ name: 'befuvas', set() { S7.t0 = 8 - (30 * 60 / rateMid() + .7); } },
      { name: 'csak-nyomas', set() { S7.learned = false; S7.t0 = 0; } }],

      { name: 'sokk', set() { S8.t0 = 11 - 8.3; } },
      { name: 'elemzes', set() { S8.t0 = 11 - 5.5; } }],
};
