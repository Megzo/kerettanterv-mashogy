<script>
/* ── MODUL: Lépték-zoom (BioZoom) · forrás: biologia-7-8/01-sejt, 2026-11-23 ──
   Tízes hatványokon átívelő, folytonos zoom egymásba ágyazott szintekkel; automatikus
   léptékvonalzó; „szem / fénymikroszkóp / elektronmikroszkóp” sáv; léptékszalag.
   Minden állapot ZÁRT KÉPLETBŐL jön (kamera = {x, y, w}); csak a Lesson motorra épül
   (L.ctx, L.tx, L.pill, L.measure, L.fonts), a lecke kódjára nem hivatkozik.

   VILÁG-KOORDINÁTA: méter, y lefelé nő. A kamera {x, y, w}: a keret közepére kerülő világpont
   és a keret SZÉLESSÉGÉBE férő világhossz (m). px / m = frame.w / cam.w.

   const z = BioZoom.create(L, {
     frame: [x, y, w, h],          // képernyő-téglalap (logikai px)
     round: false,                 // true → kör alakú látómező (átmérő = w; mikroszkóp)
     bg: '#f7f1e6',                // a keret háttere (null: átlátszó)
     levels: [{
       id, w,                      // a szint „otthoni” képszélessége (m): ennyi fér a keretbe, ha a szint középen áll
       parent,                     // a szülő szint id-je (a gyökérnél nincs)
       c: [x, y],                  // a szint közepe világ-koordinátában (m) – VAGY –
       box: [u, v, bw],            // a szülőn belül, a szülő helyi egységében (szülő w = 1, közepe = 0);
                                   //   bw (opcionális): a szint w-je a szülőéhez képest, ha w nincs megadva
       draw(c, S),                 // a szint rajza (lásd S); c.save()/c.restore() között, a keretre vágva
       fin: [5, 2],                // beúszás: a kép szélessége w·5 → w·2 között 0 → 1 (logaritmikus áttűnés)
       fout: [a, b] | null,        // kiúszás: w·a → w·b között 1 → 0. Alap: ha van gyereke, a legkisebb gyerek
                                   //   w-jének 0,9 → 0,3-szerese; gyerek nélkül null (nem tűnik el)
       name: {s, k}                // a szint neve (a lecke felirataihoz; z.focus adja vissza a szintet)
     }, …]
   })
   S (a draw második paramétere):
     a        a szint átlátszósága (0..1); a c.globalAlpha már be van állítva (külső · a)
     x, y     a szint közepe a képernyőn;  s: px / helyi egység (= a szint w-je px-ben);  pxm: px / m
     m(u, v)  helyi → képernyő (helyi egység = w, közép = 0);  g(x, y): világ (m) → képernyő
     vis      [u0, v0, u1, v1]: a keret helyi egységben (kivágáshoz, ismétlődő elemekhez)
     al(k)    c.globalAlpha = külső · a · k;   cam, lv (a szint), w
   Ha a gyerek szint rajza a szülőben egyszerűsítve is megvan (ugyanott, ugyanakkorán), az áttűnés folytonos.

   z.cam(id, k = 1, du = 0, dv = 0) → kamera a szint közepére, k · w szélességgel (du, dv: eltolás helyi egységben)
   z.path(u, A, B) → kamera   zárt képletű út: log-zoom, a mozgás egy rögzített pont körül (mint TortScene.camAt);
                               közel azonos szélességnél sima oldalirányú mozgás
   z.tour(u, [A, B, C…]) → {x, y, w, seg, su}   több megálló, u ∈ [0, 1]; a szakaszok ideje ∝ |ln(w_b / w_a)|
                               (+ kis tag az oldalirányú mozgásra), így a zoom sebessége állandó
   z.tourU(stops, i) → u       az i. megálló u-ja (csúszkához, gombokhoz)
   z.state(cam) → [{lv, a, S}] a látható szintek, nagytól kicsiig
   z.draw(cam, {a: 1, border: '#1c2440' | false, bw: 3, r: 16}) → state   kivágás + háttér + szintek + keret
   z.focus(cam) → szint        a legkisebb, legalább félig látható szint
   z.pxm(cam) · z.toScreen(gx, gy, cam) → [X, Y] · z.toWorld(X, Y, cam) → [gx, gy]
   z.ruler(pos, cam | w, o) · z.limits(box, items, o) · z.strip(box, items, o) – a lenti statikus függvények

   Statikus (zoom nélkül is használható):
   BioZoom.len(m, d?) → '100 µm', '0,45 mm', '7,5 µm', '2 cm' (magyar formátum, nm / µm / mm / cm / m váltással;
                        a szám és az egység között nem törő szóköz)
   BioZoom.nice(m) → a legnagyobb 1–2–5 lépcsős hossz, amely ≤ m
   BioZoom.ruler(L, {x, y, pxm, max: 240, align: 'left' | 'right' | 'center', col, s: 24, bg: true, a, k})
                        → {len, px, box}   léptékvonal 1–2–5 lépcsős hosszal (≤ max px), fölötte a felirata
   BioZoom.logx({x, w}, hi, lo) → fn(m) → X    log-tengely: balra a nagy (hi), jobbra a kicsi (lo)
   BioZoom.limits(L, {x, y, w}, items, o) → {x: fn, top}
        log-tengely o.hi … o.lo között (alap 1 m … 1 nm) tízes osztással (o.every: minden hányadik osztás kap
        feliratot; o.ts: betűméret), fölötte sávok: items = [{w: a felbontás határa (m), s, k, col, v?, vk?}];
        a sáv o.hi-tól a határig ér (a 0. elem van legalul; ha w < lo, a sáv a tengely végéig ér);
        o.mark: függőleges jelölő (m) + o.markS: {s, k} felirat; o.rh: sávmagasság (34); o.values: a határ
        kiírása (alap: true; v: saját szöveg, vk: kulcsa); o.a: átlátszóság
   BioZoom.strip(L, {x, y, w, h}, items, o) → [{x, y, d}]
        léptékszalag: egyenlő rekeszekben egymás mellett, alapvonalra ültetve; items = [{w (m), s, k, v?, vk?,
        draw(c, x, y, d)}] – x, y a tárgy közepe, d a mérete px-ben. o.u: 0 = valódi arány (a legnagyobb tárgy
        kitölti a rekeszt) … 1 = logaritmikus (minden tárgy látszik; o.minLog: a legkisebb relatív mérete);
        a 3 px-nél kisebb tárgyat szaggatott kör jelzi; alatta a neve (s, k) és a mérete (v vagy BioZoom.len).
   ──────────────────────────────────────────────────────────────────────────────────────────── */
const BioZoom = (() => {
  'use strict';
  const TAU = Math.PI * 2;
  const COL = { ink: '#1c2440', mut: '#565d72', paper: '#f7f1e6', card: '#fffaf1', red: '#c8401c', line: 'rgba(28,36,64,.16)',
    eye: '#1d7a45', light: '#0a6f86', em: '#7b4fa0' };
  const BAR = [COL.eye, COL.light, COL.em];
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = (t) => { t = clamp(t); return t * t * (3 - 2 * t); };
  const UN = [['m', 1], ['cm', 1e-2], ['mm', 1e-3], ['µm', 1e-6], ['nm', 1e-9]];

  function len(m, d) {
    if (!(m > 0)) return '0';
    let u = UN[UN.length - 1];
    for (const x of UN) if (m >= x[1] * .9995) { u = x; break; }
    const v = m / u[1];
    if (d == null) d = v >= 99.5 ? 0 : v >= 9.95 ? 1 : 2;
    let s = v.toFixed(d); if (d > 0) s = s.replace(/\.?0+$/, '');
    return s.replace('.', ',') + ' ' + u[0];
  }
  function nice(m) { const p = Math.pow(10, Math.floor(Math.log10(m) + 1e-9)), f = m / p; return (f >= 5 ? 5 : f >= 2 ? 2 : 1) * p; }

  function ruler(L, o) {
    const c = L.ctx, F = L.fonts, max = o.max || 240, lm = nice(max / o.pxm), px = lm * o.pxm, fs = o.s || 24;
    const col = o.col || COL.ink, al = o.align || 'left', s = len(lm);
    const x0 = al === 'right' ? o.x - px : al === 'center' ? o.x - px / 2 : o.x, y = o.y;
    const tw = L.measure(s, { f: F.M, s: fs, w: 600 }).w, cx = x0 + px / 2;
    const bx0 = Math.min(x0, cx - tw / 2) - 14, bx1 = Math.max(x0 + px, cx + tw / 2) + 14;
    const box = { x: bx0, y: y - fs - 24, w: bx1 - bx0, h: fs + 40 };
    c.save();
    if (o.a != null) c.globalAlpha *= o.a;
    if (o.bg !== false) { c.beginPath(); c.roundRect(box.x, box.y, box.w, box.h, 10); c.fillStyle = 'rgba(255,250,241,.92)'; c.fill(); c.strokeStyle = COL.line; c.lineWidth = 1.5; c.stroke(); }
    c.strokeStyle = col; c.lineCap = 'butt'; c.lineWidth = 5;
    c.beginPath(); c.moveTo(x0, y); c.lineTo(x0 + px, y); c.stroke();
    c.lineWidth = 2.5; c.beginPath(); c.moveTo(x0, y - 9); c.lineTo(x0, y + 9); c.moveTo(x0 + px, y - 9); c.lineTo(x0 + px, y + 9); c.stroke();
    L.tx(s, cx, y - 14, { f: F.M, s: fs, w: 600, a: 'center', c: col, k: o.k });
    c.restore();
    return { len: lm, px, box };
  }

  function logx(b, hi, lo) { const a = Math.log10(hi), d = a - Math.log10(lo); return (m) => b.x + b.w * (a - Math.log10(m)) / d; }

  function limits(L, b, items, o = {}) {
    const c = L.ctx, F = L.fonts, hi = o.hi || 1, lo = o.lo || 1e-9, X = logx(b, hi, lo), rh = o.rh || 34, gap = 8, y = b.y, fs = o.fs || 22;
    c.save(); if (o.a != null) c.globalAlpha *= o.a;
    c.lineCap = 'butt'; c.strokeStyle = COL.ink; c.lineWidth = 2.5;
    c.beginPath(); c.moveTo(b.x, y); c.lineTo(b.x + b.w, y); c.stroke();
    const k0 = Math.round(Math.log10(hi)), k1 = Math.round(Math.log10(lo)), ev = o.every || 1;
    for (let k = k0; k >= k1; k--) {
      const x = X(Math.pow(10, k)); c.lineWidth = 2; c.beginPath(); c.moveTo(x, y); c.lineTo(x, y + 10); c.stroke();
      if ((k0 - k) % ev === 0) L.tx(len(Math.pow(10, k), 0), x, y + 38, { f: F.M, s: o.ts || 22, w: 500, a: 'center', c: COL.mut });
    }
    const top = y - 14 - items.length * (rh + gap) + gap;
    if (o.mark != null) {
      const xm = X(clamp(o.mark, lo, hi)), yt = top - 8;
      c.strokeStyle = COL.red; c.lineWidth = 3; c.beginPath(); c.moveTo(xm, yt); c.lineTo(xm, y - 2); c.stroke();
      c.fillStyle = COL.red; c.beginPath(); c.moveTo(xm - 9, y - 14); c.lineTo(xm + 9, y - 14); c.lineTo(xm, y); c.closePath(); c.fill();
    }
    items.forEach((it, i) => {
      const yb = y - 14 - (i + 1) * (rh + gap) + gap, x1 = X(clamp(it.w, lo, hi)), col = it.col || BAR[i % 3];
      c.beginPath(); c.roundRect(b.x, yb, Math.max(4, x1 - b.x), rh, 8); c.fillStyle = col; c.fill();
      if (it.w < lo) { c.beginPath(); c.moveTo(x1 - 2, yb - 5); c.lineTo(x1 + 14, yb + rh / 2); c.lineTo(x1 - 2, yb + rh + 5); c.closePath(); c.fill(); }
      else { c.setLineDash([5, 5]); c.strokeStyle = col; c.lineWidth = 2; c.beginPath(); c.moveTo(x1, yb + rh); c.lineTo(x1, y); c.stroke(); c.setLineDash([]); }
      const tw = L.measure(it.s, { s: fs, w: 700 }).w, inside = x1 - b.x > tw + 24;
      L.tx(it.s, inside ? b.x + 12 : x1 + 12, yb + rh / 2 + 1, { s: fs, w: 700, b: 'middle', c: inside ? '#fff' : col, k: it.k });
      if (o.values !== false && it.w >= lo) {
        const v = it.v || len(it.w), vw = L.measure(v, { f: F.M, s: fs, w: 600 }).w, vx = inside ? x1 + 12 : x1 + 26 + tw;
