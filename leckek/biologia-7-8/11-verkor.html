/* ══════════════════════════════════════════════════════════════════════════════════════════
   KÖZÖS BIOLÓGIA-MODULOK (pilot/biologia-7-8/terv.md, 4. fejezet). Referencialecke: 11-verkor.
   A két blokk (BioBody, BioFlow) változtatás nélkül átmásolható más leckébe, és később a
   shared/bio/ alá emelhető. Csak a Lesson motorra épülnek (L.ctx, L.tx, L.measure); a lecke
   kódjára nem hivatkoznak. Globális névtér: window.BioBody, window.BioFlow.
   ══════════════════════════════════════════════════════════════════════════════════════════ */

/* ── MODUL: Testrajz (BioBody) · forrás: biologia-7-8/11-verkor, 2026-11-23 ──
   Stilizált, nemileg semleges emberi alak (nincs nemi jelleg, haj, ruha), kapcsolható
   szervrendszer-rétegekkel, öt alkattal, álló és fekvő póz.

   KOORDINÁTÁK. Normalizált (u, v): v = 0 a fejtető, v = 1 a talp; u vízszintes, szintén a
   testmagasság egységében, a középvonaltól a NÉZŐ jobbja felé pozitív.
   FIGYELEM: szemből nézzük, ezért a test JOBB oldala a nézőnek BAL (u < 0)! Az azonosítókban a
   „jobb”/„bal” mindig a test saját oldala (pl. 'jobb tüdő' az u < 0 oldalon van).

   const body = BioBody.create(L, {x, y, h, build: 'semleges', pose: 'áll', tone: '#dccab0', arm: 9})
     x, y   a fejtető képernyőhelye (fekvő pózban is a fejtető; a test jobbra nyúlik el)
     h      testmagasság px-ben 'semleges' alkatnál; más alkatnál a valódi magasság h · hs
     build  'semleges' | 'alacsony' | 'magas' | 'teltebb' | 'karcsú' (egyik sem „normális” vagy „ideális”)
     pose   'áll' (szemből) | 'fekszik' (hanyatt, felülnézet, fej balra; a test jobbja lent)
            'kar' (könyök-közeli nagyítás) NINCS benne – a 10-es lecke bővítheti külön blokkban.
     tone   egységes, semleges kitöltés (több alaknál eltérhet); arm: a kar széttartása fokban
   body.place({x, y, h})            áthelyezés; kamera = place (nagyítás: nagyobb h) – minden
                                     vonal és címke ehhez igazodik
   body.setBuild(név) · body.morph(a, b, u)   alkat; morph: két alkat között, u ∈ [0, 1]
   body.S                           px / normalizált egység (= h · hs)
   body.map([u, v]) → [x, y]        normalizált → képernyő;   body.unmap(x, y) → [u, v]
   body.n(id) → [u, v]              ízület vagy szerv középpontja (normalizált)
   body.anchor(id) → [x, y]         ugyanez képernyőn
   body.org(id) → {id, layer, c, w: [rx, ry], k?, p?}   a szerv adatai (normalizált); a 'szív'
                                     k mezője: a BioFlow.heart helyi egysége normalizáltban
   body.ids(réteg?) → [id…]
   body.draw(c, {layers: {bőr: 1, csont: .3, …}, hi: [id…], dim: .25, a: 1})
                                     rétegek: bőr, csont, izom, keringés, légzés, emésztés,
                                     kiválasztás, ideg, mirigy, immun (érték = átlátszóság);
                                     hi: kiemelt szervek – a réteg többi szerve dim-re halványul.
                                     A c.globalAlpha-t szorzóként veszi (a lecke áttűnése).
   body.label(id | [x, y], {s, k}, {x, y, a: 'left'|'right', col, s: px, w, max, dot})
                                     vezetővonalas felirat (L.tx, k = .md-kulcs) → doboz
   body.labels(items, {left, right, mid, s, top, bottom})   automatikus oszlopos címkézés:
                                     items = [{at: id | [x, y], s, k, col, side?: 'left'|'right'}];
                                     oldalanként y szerint rendez és széttolja őket
   body.hit(px, py) → id | null     melyik szervre kattintottak (a látható rétegekből)
   body.axes({x, y, T: {jobb: {s, k}, bal: {s, k}}, s})   „a test jobbja / balja” jelzés
   BioBody.LAYERS · BioBody.BUILDS · BioBody.COL (szervrendszer-színkód, SZERZODES 12.)

   Szervek (id → réteg): agy, gerincvelő, idegek (ideg) · légcső, jobb tüdő, bal tüdő (légzés) ·
   szív (keringés) · nyelőcső, máj, gyomor, bél, hasnyálmirigy (emésztés + mirigy) · jobb vese,
   bal vese, húgyvezeték, húgyhólyag (kiválasztás) · agyalapi mirigy, pajzsmirigy, mellékvese
   (mirigy) · lép, csecsemőmirigy, nyirokcsomók (immun) · koponya, gerinc, bordák, kulcscsont,
   szegycsont, medence, végtagcsontok (csont) · izmok (izom).
   Ízületek: fejtető, fej, nyak, {jobb|bal} {váll, könyök, csukló, kéz, csípő, térd, boka, lábfej}.
   ──────────────────────────────────────────────────────────────────────────────────────────── */
const BioBody = (() => {
  'use strict';
  const TAU = Math.PI * 2;
  const COL = {
    ink: '#1c2440', mut: '#565d72', paper: '#f7f1e6', card: '#fffaf1',
    rich: '#c0392b', poor: '#7b2440', o2: '#0a6f86', co2: '#565d72', food: '#8f5a0c', excr: '#6b6a12',
    nerve: '#2a4d9b', horm: '#7b4fa0', immun: '#1d7a45',
    bone: '#ece1c9', boneL: '#6b5a3e', musc: '#e3a593', muscL: '#8c3b2a', skin: '#dccab0',
  };
  const LAYERS = ['bőr', 'csont', 'izom', 'emésztés', 'kiválasztás', 'légzés', 'keringés', 'ideg', 'mirigy', 'immun'];
  const BUILDS = {
    semleges: { hs: 1,    head: 1,    nk: 1,    sh: 1,    ch: 1,    wa: 1,    hp: 1,    li: 1 },
    alacsony: { hs: .9,   head: 1.04, nk: 1.02, sh: 1.03, ch: 1.03, wa: 1.04, hp: 1.03, li: 1.04 },
    magas:    { hs: 1.08, head: .96,  nk: .97,  sh: .97,  ch: .96,  wa: .95,  hp: .96,  li: .95 },
    teltebb:  { hs: 1,    head: 1.04, nk: 1.25, sh: 1.1,  ch: 1.2,  wa: 1.45, hp: 1.26, li: 1.32 },
    karcsú:   { hs: 1,    head: .98,  nk: .92,  sh: .93,  ch: .88,  wa: .84,  hp: .88,  li: .82 },
  };
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const hx = (h) => { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
  const mix = (a, b, t) => { const A = hx(a), B = hx(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * clamp(t)).toString(16).padStart(2, '0')).join(''); };
  const rgba = (h, a) => { const A = hx(h); return `rgba(${A[0]},${A[1]},${A[2]},${a})`; };
  /* réteg → [kitöltés, vonal, tömör világos (csőszerű vonalakhoz)] */
  const LC = {
    csont: [COL.bone, COL.boneL, COL.bone], izom: [COL.musc, COL.muscL, COL.musc],
    keringés: [COL.musc, COL.muscL, COL.musc], légzés: [rgba(COL.o2, .13), COL.o2, mix(COL.o2, COL.paper, .8)],
    emésztés: [rgba(COL.food, .15), COL.food, mix(COL.food, COL.paper, .78)], kiválasztás: [rgba(COL.excr, .17), COL.excr, mix(COL.excr, COL.paper, .78)],
    ideg: [rgba(COL.nerve, .13), COL.nerve, mix(COL.nerve, COL.paper, .8)], mirigy: [rgba(COL.horm, .22), COL.horm, mix(COL.horm, COL.paper, .75)],
    immun: [rgba(COL.immun, .2), COL.immun, mix(COL.immun, COL.paper, .75)],
  };
  const ell = (cx, cy, rx, ry, rot = 0, n = 28) => {
    const o = []; for (let i = 0; i < n; i++) { const t = i / n * TAU, x = Math.cos(t) * rx, y = Math.sin(t) * ry; o.push([cx + x * Math.cos(rot) - y * Math.sin(rot), cy + x * Math.sin(rot) + y * Math.cos(rot)]); } return o;
  };
  /* sima zárt / nyitott görbe a pontokon át (másodfokú felezőpontos) */
  function closed(c, P) {
    const n = P.length, m = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2]; c.beginPath();
    const s = m(P[n - 1], P[0]); c.moveTo(s[0], s[1]);
    for (let i = 0; i < n; i++) { const q = m(P[i], P[(i + 1) % n]); c.quadraticCurveTo(P[i][0], P[i][1], q[0], q[1]); }
    c.closePath();
  }
  function open(c, P) {
    c.beginPath(); c.moveTo(P[0][0], P[0][1]);
    for (let i = 1; i < P.length - 1; i++) { const q = [(P[i][0] + P[i + 1][0]) / 2, (P[i][1] + P[i + 1][1]) / 2]; c.quadraticCurveTo(P[i][0], P[i][1], q[0], q[1]); }
    const e = P[P.length - 1]; c.lineTo(e[0], e[1]);
  }
  function poly(c, P) { c.beginPath(); P.forEach((p, i) => i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])); c.closePath(); }
  /* végtag: középvonal-lánc + félszélességek → zárt körvonal (lekerekített végekkel) */
  function limb(ch, ws) {
    const n = ch.length, A = [], B = [];
    for (let i = 0; i < n; i++) {
      const a = ch[Math.max(0, i - 1)], b = ch[Math.min(n - 1, i + 1)];
      let dx = b[0] - a[0], dy = b[1] - a[1]; const d = Math.hypot(dx, dy) || 1; dx /= d; dy /= d;
      A.push([ch[i][0] - dy * ws[i], ch[i][1] + dx * ws[i]]); B.push([ch[i][0] + dy * ws[i], ch[i][1] - dx * ws[i]]);
    }
    const dir = (p, q) => { const d = Math.hypot(p[0] - q[0], p[1] - q[1]) || 1; return [(p[0] - q[0]) / d, (p[1] - q[1]) / d]; };
    const e1 = dir(ch[n - 1], ch[n - 2]), e0 = dir(ch[0], ch[1]);
    return [[ch[0][0] + e0[0] * ws[0] * .9, ch[0][1] + e0[1] * ws[0] * .9], ...A, [ch[n - 1][0] + e1[0] * ws[n - 1] * .9, ch[n - 1][1] + e1[1] * ws[n - 1] * .9], ...B.reverse()];
  }
  const add = (p, d) => [p[0] + d[0], p[1] + d[1]];
  const lerp2 = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
  /* a szív körvonala a BioFlow.heart helyi egységeiben (ugyanaz a forma, mint ott) */
  const HEART = [[-.40, -.22], [-.30, -.30], [-.05, -.28], [.18, -.32], [.36, -.24], [.42, -.05], [.38, .16], [.26, .34], [.12, .46], [.0, .42], [-.16, .34], [-.32, .22], [-.42, .04]];

  /* ── geometria egy paraméterkészletből (alkat) ── */
  function geo(P) {
    const G = { skin: [], J: {}, O: {} }, J = G.J, O = G.O;
    const hd = P.head, sh = P.sh, ch = P.ch, wa = P.wa, hp = P.hp, li = P.li, nk = P.nk;
    const hy = .066 * hd;
    J['fejtető'] = [0, 0]; J['fej'] = [0, hy]; J['nyak'] = [0, .15];
    G.skin.push({ p: ell(0, hy + .002, .05 * hd, .064 * hd) });
    G.skin.push({ p: [[-.027 * nk, .11], [.027 * nk, .11], [.03 * nk, .18], [-.03 * nk, .18]], sharp: true });
    const R = [[.026 * nk, .158], [.07 * sh, .176], [.11 * sh, .188], [.13 * sh, .212], [.108 * ch, .262], [.104 * ch, .31],
      [.094 * (ch + wa) / 2, .36], [.086 * wa, .405], [.092 * (wa + hp) / 2, .445], [.1 * hp, .482], [.102 * hp, .515], [.092 * hp, .542], [.03 * hp, .556]];
    G.skin.push({ p: [...R, [0, .558], ...R.slice().reverse().map((p) => [-p[0], p[1]]), [0, .155]] });
    const a = (P.arm == null ? 9 : P.arm) * Math.PI / 180, a2 = a * .75;
    const bones = [], musc = [], nerves = [];
    for (const s of [-1, 1]) {
      const sd = s < 0 ? 'jobb' : 'bal';
      const S = [s * .112 * sh, .212], E = [S[0] + s * .162 * Math.sin(a), S[1] + .162 * Math.cos(a)];

    const after = t - tp, li = smooth((tp - 1) / .3) * (1 - .65 * smooth((tp - 2.4) / 2.2)) * (1 - smooth((tp - 4.4) / 2));
    if (q.y < -.2 && after >= 0 && after < 3 && q.esc < li * .8) {
      const ex = cut + after * 40 * (q.esc - .4), ey = yc - rad(cut) - after * 120;
      al(out(st / .5) * (1 - smooth((after - 1.6) / 1.2))); rbc(ex, ey, 13, { rot: q.rot, tilt: .8 }); continue;
    }
    al(out(st / .5)); rbc(xx, y, 13, { rot: q.rot, tilt: .55 + .45 * Math.abs(Math.cos(q.rot)) });
  }
  // vérlemezkék: a sebhez tapadnak
  for (let i = 0; i < CLOT.plt.length; i++) {
    const q = CLOT.plt[i], tc = 2.4 + i * .08;
    let x, y;
    if (t < tc - .8) { x = X0 + ((q.x0 + q.v * t) % W + W) % W; y = yc + q.y * rad(x) * .85; }
    else { const u = smooth((t - (tc - .8)) / .8); x = lerp(cut - 220 + i * 3, cut + q.slot[0], u); y = lerp(yc - 40, yc - rad(cut) - wall * .5 + q.slot[1] * .9, u); }
    al(out(st / .5)); c.beginPath(); c.ellipse(x, y, 9, 6, q.slot[0], 0, TAU); c.fillStyle = '#b6a6cf'; c.fill(); c.strokeStyle = '#4b3f72'; c.lineWidth = 1.8; c.stroke();
  }
  // fibrinháló + befogott vörösvérsejtek
  if (fibr > 0) {
    for (const f of CLOT.fib) { const g = smooth((fibr - f.d * .5) / .5); if (g <= 0) continue; al(g); const cx = cut + f.x, cy = yc - rad(cut) - wall * .4 + f.y * .9; c.beginPath(); c.moveTo(cx - Math.cos(f.a) * f.l * g / 2, cy - Math.sin(f.a) * f.l * g / 2); c.lineTo(cx + Math.cos(f.a) * f.l * g / 2, cy + Math.sin(f.a) * f.l * g / 2); c.strokeStyle = '#8f5a0c'; c.lineWidth = 2.4; c.stroke(); }
    for (const q of CLOT.trap) { const g = smooth((fibr - q.d * .4) / .4); if (g <= 0) continue; al(g); rbc(cut + q.x, yc - rad(cut) - wall * .3 + q.y, 12, { rot: q.rot, tilt: .7 }); }
  }
  al(out(st / .5));
  // sorszámozott lépések
  const steps = [['alvadás 1', 1.4], ['alvadás 2', 2.6], ['alvadás 3', 4.6]];
  steps.forEach(([k, t0], i) => {
    const q = smooth((t - t0) / .5); if (q <= 0) return; al(q); const y = 830 + i * 58;
    disc(92, y - 8, 20, [RED, '#4b3f72', '#8f5a0c'][i]); tx(String(i + 1), 92, y, { f: F.M, s: 24, w: 700, a: 'center', c: '#fff8ee', qa: false });
    T(k, 128, y, { s: 28, w: 600, c: INK, max: 720 });
  });
  // feliratok a rajzon
  const la = smooth((t - 1.2) / .5);
  if (la > 0) { al(la); pill('seb', cut + 120, 268, { s: 24, w: 700, bg: CARD, bd: BAD, c: BAD }); ln(cut + 120, 268, cut + 34, yc - R0 - wall + 8, BAD, 2, [5, 5]); }
  const lp = smooth((t - 3.2) / .5);
  if (lp > 0) { al(lp); const p = [cut - 30, yc - rad(cut) - wall * .6]; ln(p[0], p[1], 430, 300, '#4b3f72', 2, [5, 5]); T('vérlemezke', 422, 300, { s: 26, w: 700, a: 'right', b: 'middle', c: '#4b3f72' }); }
  const lf = smooth((t - 5.2) / .5);
  if (lf > 0) { al(lf); ln(cut + 40, yc - rad(cut) - wall - 40, 960, 330, '#8f5a0c', 2, [5, 5]); T('fibrin', 968, 330, { s: 26, w: 700, b: 'middle', c: '#8f5a0c', max: 330 }); }
  const le = smooth((t - 7) / .6);
  if (le > 0) { al(le); pill('elállt', 1060, 900, { s: 30, w: 700, a: 'center', bg: GOOD, c: '#fff8ee', pad: 18 }); }
  al(out(st / .5)); T('vörösvérsejt', X1 - 10, yc + R0 + wall + 44, { s: 24, w: 600, a: 'right', c: '#8e2a22' });
}

/* ═══ 9. Egy kör egy perc alatt – összefoglalás ═══ */
let TR9 = null;
function scene9(st) {
  const B = B9; B.place({ x: 320, y: 70, h: 930 });
  const b = S9.ck.at(st), rate = rate0(), bt = b - S9.b0;
  drawBodyFlow(B, F9, { a: out(st / .6), b, r: 2.8, dim: .5, hi: null });
  // követett sejt + nyoma
  const tr = TR9.at(Math.max(0, bt)), pAt = (bb) => { const l = TR9.at(Math.max(0, bb)); return B.map(F9.pt(l.e, l.u)); };
  const fa = smooth((st - S9.t0 - .3) / .5);
  if (fa > 0) {
    al(fa * .55); c.beginPath(); for (let i = 0; i <= 40; i++) { const q = pAt(bt - i * .15); i ? c.lineTo(q[0], q[1]) : c.moveTo(q[0], q[1]); } c.strokeStyle = '#e0a800'; c.lineWidth = 5; c.lineJoin = 'round'; c.stroke();
    const p = pAt(bt); al(fa); c.beginPath(); c.arc(p[0], p[1], 13 + 2 * Math.sin(st * 6), 0, TAU); c.strokeStyle = '#e0a800'; c.lineWidth = 4; c.stroke();
    BioFlow.dot(c, p[0], p[1], 7, F9.col(tr.e, tr.u));
  }
  // óra + sáv
  const ra = smooth((st - .6) / .6); if (ra <= 0) return; al(ra);
  const x0 = 690, w = 640, sec = bt * 60 / rate;
  T('eltelt', x0, 110, { s: 24, w: 600, c: MUT });
  L.tx(fmt(Math.floor(sec)) + ' s', x0, 178, { f: F.M, s: 60, w: 700, c: INK, qa: true });
  if (S9.speed !== 1) L.pill(H('gyorsítva', fmt(S9.speed)), x0 + w, 150, { k: 'gyorsítva', s: 24, w: 700, a: 'right', bg: 'rgba(28,36,64,.08)', c: INK });
  if (tr.lap > 0) { al(ra); L.pill(H('kör kész', fmt(tr.lap)), x0 + 240, 150, { k: 'kör kész', s: 24, w: 700, bg: GOOD, c: '#fff8ee' }); }
  // egy kör szakaszai (a követett sejt aktuális körében)
  al(ra); T('idő cím', x0, 268, { s: 26, w: 700, c: INK, max: w });
  const runs = F9.runs(tr.r), lam = F9.R[tr.r].lam, by = 300, bh = 64;
  const gc = { szív: '#8c3b2a', tüdő: TEAL, artéria: RICH, hajszálér: '#b0741c', véna: POOR };
  const gk = { szív: 'szív', tüdő: 'tüdő', artéria: 'artériák', hajszálér: 'hajszálerek', véna: 'vénák' };
  const gd = { szív: 'idő a szívben', tüdő: 'idő a tüdőben', artéria: 'idő az artériákban', hajszálér: 'idő a hajszálerekben', véna: 'idő a vénákban' };
  for (const r of runs) { const xa = x0 + r.q0 / lam * w, xb = x0 + r.q1 / lam * w, on = tr.q >= r.q0 && tr.q < r.q1; rr(xa + 1, by, Math.max(2, xb - xa - 2), bh, 6); c.fillStyle = on ? gc[r.group] : U.rgba(gc[r.group].length === 7 ? gc[r.group] : '#565d72', .35); c.fill(); }
  const mx = x0 + tr.q / lam * w; ln(mx, by - 12, mx, by + bh + 12, INK, 3); disc(mx, by - 14, 7, '#e0a800');
  // jelmagyarázat: csoport + idő (a .md térfogat-arányaiból)
  const lapS = 60 / rate / strokeFrac();
  ['szív', 'tüdő', 'artéria', 'hajszálér', 'véna'].forEach((g, i) => {
    const y = 420 + i * 50, on = runs.some((r) => r.group === g && tr.q >= r.q0 && tr.q < r.q1);
    al(ra * (on ? 1 : .8)); rr(x0, y - 16, 30, 30, 7); c.fillStyle = gc[g]; c.fill();
    const tw = T(gk[g], x0 + 44, y + 7, { s: 24, w: on ? 800 : 600, c: on ? INK : MUT }).w;
    L.tx(fmt(num(gd[g])) + ' % ≈ ' + fmt(Math.round(lapS * num(gd[g]) / 100)) + ' s', x0 + 300, y + 7, { k: gd[g], f: F.M, s: 22, w: 600, c: on ? INK : MUT });
  });
  al(ra); T('idő forrás', x0, 700, { s: 22, w: 500, i: 1, c: MUT, max: w });
  legend(x0, 760, ra);
  const qs = smooth((st - 2) / .6); al(ra * qs);
  card(x0 - 10, 820, w + 20, 170, { bd: RED, bw: 2.5 });
  T('összegzés 1', x0 + 14, 870, { f: F.D, i: 1, s: 30, w: 500, c: RED, max: w - 30 });
  T('összegzés 2', x0 + 14, 920, { s: 24, w: 600, c: INK, max: w - 30 });
  T('összegzés 3', x0 + 14, 962, { s: 24, w: 600, c: INK, max: w - 30 });
}

/* ════════════════════════════════════════════════════════════════ */
const sT = new Array(9).fill(0);
L = Lesson.create({
  content: window.LESSON_CONTENT,
  home: false,
  steps: [
    { settle: 7 },
    { settle: 7 },
    { settle: 6,
      enter(L) { S3.leak = 0; S3.slow = true; S3.ck.reset(rate0() / 3); },
      controls(L) {
        const bL = L.button(lab('hibás gomb'), (el) => { S3.leak = S3.leak ? 0 : 1; el.textContent = lab(S3.leak ? 'ép gomb' : 'hibás gomb'); }, 'hibás gomb');
        const bS = L.button(lab('valós gomb'), (el) => { S3.slow = !S3.slow; S3.ck.set(L.st, rate0() / (S3.slow ? 3 : 1)); el.textContent = lab(S3.slow ? 'valós gomb' : 'lassú gomb'); }, 'valós gomb');
      } },
    { settle: 6 },
    { settle: 6 },
    { settle: 7.5 },
    { settle: 6,
      enter(L) { S7.ck.reset(rate0()); S7.m0 = null; },
      controls(L) {
        L.slider({ label: lab('pulzus csúszka'), k: 'pulzus csúszka', min: 50, max: 180, step: 1, value: rate0(), format: (v) => fmt(v) + lab('per perc'), onInput: (v) => { S7.ck.set(L.st, v); } });
        L.button(lab('mérés gomb'), () => { S7.m0 = L.st; }, 'mérés gomb');
      } },
    { settle: 8.2,
      enter(L) { S8.t0 = 0; },
      controls(L) { L.button(lab('új seb gomb'), () => { S8.t0 = L.st; }, 'új seb gomb'); } },
    { settle: 8,
      enter(L) { S9.speed = 4; S9.ck.reset(rate0() * S9.speed); S9.t0 = 0; S9.b0 = 0; },
      controls(L) {
        L.button(lab('kövess gomb'), () => { S9.t0 = L.st; S9.b0 = S9.ck.at(L.st); }, 'kövess gomb');
        L.button(lab('valós idő gomb'), (el) => { S9.speed = S9.speed === 1 ? 4 : 1; S9.ck.set(L.st, rate0() * S9.speed); el.textContent = lab(S9.speed === 1 ? 'gyors gomb' : 'valós idő gomb'); }, 'valós idő gomb');
      } },
  ],
  init(Lx) {
    L = Lx; c = L.ctx;
    B1 = BioBody.create(L, { build: 'semleges', tone: '#dccab0' }); F1 = makeCirc(B1, 5);
    B4 = BioBody.create(L, { build: 'magas', tone: '#d2b896' }); F4 = makeCirc(B4, 6);
    B7 = BioBody.create(L, { build: 'alacsony', tone: '#c9a987' }); F7 = makeCirc(B7, 7);
    B9 = BioBody.create(L, { build: 'teltebb', tone: '#d8c2a4' }); F9 = makeCirc(B9, 8);
    // követett sejt: egyszer a jobb tüdőn és a fejen, aztán a bal tüdőn és a bal lábon át…
    const ix = (nm) => F9.names.indexOf(nm);
    TR9 = F9.tracer([ix('j:láb-b'), ix('b:fej'), ix('j:has'), ix('b:kar-j')], 'jp-jk');
    buildField(); buildClot();
    window.__bio = { B1, F1, B4, F4, B7, F7, B9, F9, HEARTS, S3, S7, S8, S9 };
  },
  draw(Lx) {
    L = Lx; c = L.ctx; GA = 1; background();
    const sp = L.sp;
    if (L.step >= 0) sT[L.step] = L.st;
    const SC = [scene1, scene2, scene3, null, null, scene6, scene7, scene8, scene9];
    for (let i = 0; i < SC.length; i++) {
      if (i === 3) {   // 4–5: egy jelenet, mozgó kamerával
        const w = Math.max(clamp(1 - Math.abs(sp - 3) * 1.6), clamp(1 - Math.abs(sp - 4) * 1.6), sp > 3 && sp < 4 ? 1 : 0);
        if (w > .005) { GA = w; scene45(sp, sT[3], sT[4]); }
        continue;
      }
      if (!SC[i]) continue;
      const w = clamp(1 - Math.abs(sp - i) * 1.6); if (w <= .005) continue;
      GA = w; SC[i](sT[i], L.step === i);
    }
    c.globalAlpha = 1;
  },
});
/* QA: szélső állapotok (tools/qa_lesson.py --states); a QA a lépés settle idejénél fotóz */
const at = (C, t, b, rate) => { C.t1 = t; C.b1 = b; C.rate = rate; };
window.__qaStates = {
  3: [{ name: 'hibas', set(L) { S3.leak = 1; at(S3.ck, 6, 2.22, 0); } },
      { name: 'pitvar', set(L) { S3.slow = false; at(S3.ck, 6, 2.9, 0); } }],
  7: [{ name: 'p180', set(L) { S7.ck.reset(180); S7.m0 = 1; } },
      { name: 'p50', set(L) { S7.ck.reset(50); S7.m0 = -10; } }],
  8: [{ name: 't2', set(L) { S8.t0 = 6.2; } }, { name: 't3', set(L) { S8.t0 = 4.8; } }, { name: 't5', set(L) { S8.t0 = 2.8; } }],
  9: [{ name: 'kovess', set(L) { S9.t0 = 5; S9.b0 = S9.ck.at(5); } },
      { name: 'valos', set(L) { S9.speed = 1; S9.ck.reset(rate0()); } },
      { name: 'kesoi', set(L) { S9.ck.reset(rate0() * 32); } }],
};
})();
