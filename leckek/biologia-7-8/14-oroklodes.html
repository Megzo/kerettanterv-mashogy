   ══════════════════════════════════════════════════════════════════════════════════════════ */
/* ── MODUL: Lépték-zoom (BioZoom) · forrás: biologia-7-8/01-sejt, 2026-11-23 ──
   Tízes hatványokon átívelő, folytonos zoom egymásba ágyazott szintekkel; automatikus
   léptékvonalzó; „szem / fénymikroszkóp / elektronmikroszkóp” sáv; léptékszalag.
   Minden állapot ZÁRT KÉPLETBŐL jön (kamera = {x, y, w}); csak a Lesson motorra épül
   (L.ctx, L.tx, L.pill, L.measure, L.fonts), a lecke kódjára nem hivatkozik.

   VILÁG-KOORDINÁTA: méter, y lefelé nő. A kamera {x, y, w}: a keret közepére kerülő világpont
   és a keret SZÉLESSÉGÉBE férő világhossz (m). px / m = frame.w / cam.w.

   const z = BioZoom.create(L, {
     frame: [x, y, w, h],          // képernyő-téglalap (logikai px)
     round: false,                 // true → kör alakú látómező (átmérő = w; mikroszkóp)
     bg: '#f7f1e6',                // a keret háttere (null: átlátszó)
     levels: [{
       id, w,                      // a szint „otthoni” képszélessége (m): ennyi fér a keretbe, ha a szint középen áll
       parent,                     // a szülő szint id-je (a gyökérnél nincs)
       c: [x, y],                  // a szint közepe világ-koordinátában (m) – VAGY –
       box: [u, v, bw],            // a szülőn belül, a szülő helyi egységében (szülő w = 1, közepe = 0);
                                   //   bw (opcionális): a szint w-je a szülőéhez képest, ha w nincs megadva
       draw(c, S),                 // a szint rajza (lásd S); c.save()/c.restore() között, a keretre vágva
       fin: [5, 2],                // beúszás: a kép szélessége w·5 → w·2 között 0 → 1 (logaritmikus áttűnés)
       fout: [a, b] | null,        // kiúszás: w·a → w·b között 1 → 0. Alap: ha van gyereke, a legkisebb gyerek
                                   //   w-jének 0,9 → 0,3-szerese; gyerek nélkül null (nem tűnik el)
       name: {s, k}                // a szint neve (a lecke felirataihoz; z.focus adja vissza a szintet)
     }, …]
   })
   S (a draw második paramétere):
     a        a szint átlátszósága (0..1); a c.globalAlpha már be van állítva (külső · a)
     x, y     a szint közepe a képernyőn;  s: px / helyi egység (= a szint w-je px-ben);  pxm: px / m
     m(u, v)  helyi → képernyő (helyi egység = w, közép = 0);  g(x, y): világ (m) → képernyő
     vis      [u0, v0, u1, v1]: a keret helyi egységben (kivágáshoz, ismétlődő elemekhez)
     al(k)    c.globalAlpha = külső · a · k;   cam, lv (a szint), w
   Ha a gyerek szint rajza a szülőben egyszerűsítve is megvan (ugyanott, ugyanakkorán), az áttűnés folytonos.

   z.cam(id, k = 1, du = 0, dv = 0) → kamera a szint közepére, k · w szélességgel (du, dv: eltolás helyi egységben)
   z.path(u, A, B) → kamera   zárt képletű út: log-zoom, a mozgás egy rögzített pont körül (mint TortScene.camAt);
                               közel azonos szélességnél sima oldalirányú mozgás
   z.tour(u, [A, B, C…]) → {x, y, w, seg, su}   több megálló, u ∈ [0, 1]; a szakaszok ideje ∝ |ln(w_b / w_a)|
                               (+ kis tag az oldalirányú mozgásra), így a zoom sebessége állandó
   z.tourU(stops, i) → u       az i. megálló u-ja (csúszkához, gombokhoz)
   z.state(cam) → [{lv, a, S}] a látható szintek, nagytól kicsiig
   z.draw(cam, {a: 1, border: '#1c2440' | false, bw: 3, r: 16}) → state   kivágás + háttér + szintek + keret
   z.focus(cam) → szint        a legkisebb, legalább félig látható szint
   z.pxm(cam) · z.toScreen(gx, gy, cam) → [X, Y] · z.toWorld(X, Y, cam) → [gx, gy]
   z.ruler(pos, cam | w, o) · z.limits(box, items, o) · z.strip(box, items, o) – a lenti statikus függvények

   Statikus (zoom nélkül is használható):
   BioZoom.len(m, d?) → '100 µm', '0,45 mm', '7,5 µm', '2 cm' (magyar formátum, nm / µm / mm / cm / m váltással;
                        a szám és az egység között nem törő szóköz)
   BioZoom.nice(m) → a legnagyobb 1–2–5 lépcsős hossz, amely ≤ m
   BioZoom.ruler(L, {x, y, pxm, max: 240, align: 'left' | 'right' | 'center', col, s: 24, bg: true, a, k})
                        → {len, px, box}   léptékvonal 1–2–5 lépcsős hosszal (≤ max px), fölötte a felirata
   BioZoom.logx({x, w}, hi, lo) → fn(m) → X    log-tengely: balra a nagy (hi), jobbra a kicsi (lo)
   BioZoom.limits(L, {x, y, w}, items, o) → {x: fn, top}
        log-tengely o.hi … o.lo között (alap 1 m … 1 nm) tízes osztással (o.every: minden hányadik osztás kap
        feliratot; o.ts: betűméret), fölötte sávok: items = [{w: a felbontás határa (m), s, k, col, v?, vk?}];
        a sáv o.hi-tól a határig ér (a 0. elem van legalul; ha w < lo, a sáv a tengely végéig ér);
        o.mark: függőleges jelölő (m) + o.markS: {s, k} felirat; o.rh: sávmagasság (34); o.values: a határ
        kiírása (alap: true; v: saját szöveg, vk: kulcsa); o.a: átlátszóság
   BioZoom.strip(L, {x, y, w, h}, items, o) → [{x, y, d}]
        léptékszalag: egyenlő rekeszekben egymás mellett, alapvonalra ültetve; items = [{w (m), s, k, v?, vk?,
        draw(c, x, y, d)}] – x, y a tárgy közepe, d a mérete px-ben. o.u: 0 = valódi arány (a legnagyobb tárgy
        kitölti a rekeszt) … 1 = logaritmikus (minden tárgy látszik; o.minLog: a legkisebb relatív mérete);
        a 3 px-nél kisebb tárgyat szaggatott kör jelzi; alatta a neve (s, k) és a mérete (v vagy BioZoom.len).
   ──────────────────────────────────────────────────────────────────────────────────────────── */
const BioZoom = (() => {
  'use strict';
  const TAU = Math.PI * 2;
  const COL = { ink: '#1c2440', mut: '#565d72', paper: '#f7f1e6', card: '#fffaf1', red: '#c8401c', line: 'rgba(28,36,64,.16)',
    eye: '#1d7a45', light: '#0a6f86', em: '#7b4fa0' };
  const BAR = [COL.eye, COL.light, COL.em];
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = (t) => { t = clamp(t); return t * t * (3 - 2 * t); };
  const UN = [['m', 1], ['cm', 1e-2], ['mm', 1e-3], ['µm', 1e-6], ['nm', 1e-9]];

  function len(m, d) {
    if (!(m > 0)) return '0';
    let u = UN[UN.length - 1];
    for (const x of UN) if (m >= x[1] * .9995) { u = x; break; }
    const v = m / u[1];
    if (d == null) d = v >= 99.5 ? 0 : v >= 9.95 ? 1 : 2;
    let s = v.toFixed(d); if (d > 0) s = s.replace(/\.?0+$/, '');
    return s.replace('.', ',') + ' ' + u[0];
  }
  function nice(m) { const p = Math.pow(10, Math.floor(Math.log10(m) + 1e-9)), f = m / p; return (f >= 5 ? 5 : f >= 2 ? 2 : 1) * p; }

  function ruler(L, o) {
    const c = L.ctx, F = L.fonts, max = o.max || 240, lm = nice(max / o.pxm), px = lm * o.pxm, fs = o.s || 24;
    const col = o.col || COL.ink, al = o.align || 'left', s = len(lm);
    const x0 = al === 'right' ? o.x - px : al === 'center' ? o.x - px / 2 : o.x, y = o.y;
    const tw = L.measure(s, { f: F.M, s: fs, w: 600 }).w, cx = x0 + px / 2;
    const bx0 = Math.min(x0, cx - tw / 2) - 14, bx1 = Math.max(x0 + px, cx + tw / 2) + 14;
    const box = { x: bx0, y: y - fs - 24, w: bx1 - bx0, h: fs + 40 };
    c.save();
    if (o.a != null) c.globalAlpha *= o.a;
    if (o.bg !== false) { c.beginPath(); c.roundRect(box.x, box.y, box.w, box.h, 10); c.fillStyle = 'rgba(255,250,241,.92)'; c.fill(); c.strokeStyle = COL.line; c.lineWidth = 1.5; c.stroke(); }
    c.strokeStyle = col; c.lineCap = 'butt'; c.lineWidth = 5;
    c.beginPath(); c.moveTo(x0, y); c.lineTo(x0 + px, y); c.stroke();
    c.lineWidth = 2.5; c.beginPath(); c.moveTo(x0, y - 9); c.lineTo(x0, y + 9); c.moveTo(x0 + px, y - 9); c.lineTo(x0 + px, y + 9); c.stroke();
    L.tx(s, cx, y - 14, { f: F.M, s: fs, w: 600, a: 'center', c: col, k: o.k });
    c.restore();
    return { len: lm, px, box };
  }

  function logx(b, hi, lo) { const a = Math.log10(hi), d = a - Math.log10(lo); return (m) => b.x + b.w * (a - Math.log10(m)) / d; }

  function limits(L, b, items, o = {}) {
    const c = L.ctx, F = L.fonts, hi = o.hi || 1, lo = o.lo || 1e-9, X = logx(b, hi, lo), rh = o.rh || 34, gap = 8, y = b.y, fs = o.fs || 22;
    c.save(); if (o.a != null) c.globalAlpha *= o.a;
    c.lineCap = 'butt'; c.strokeStyle = COL.ink; c.lineWidth = 2.5;
    c.beginPath(); c.moveTo(b.x, y); c.lineTo(b.x + b.w, y); c.stroke();
    const k0 = Math.round(Math.log10(hi)), k1 = Math.round(Math.log10(lo)), ev = o.every || 1;
    for (let k = k0; k >= k1; k--) {
      const x = X(Math.pow(10, k)); c.lineWidth = 2; c.beginPath(); c.moveTo(x, y); c.lineTo(x, y + 10); c.stroke();
      if ((k0 - k) % ev === 0) L.tx(len(Math.pow(10, k), 0), x, y + 38, { f: F.M, s: o.ts || 22, w: 500, a: 'center', c: COL.mut });
    }
    const top = y - 14 - items.length * (rh + gap) + gap;
    if (o.mark != null) {
      const xm = X(clamp(o.mark, lo, hi)), yt = top - 8;
      c.strokeStyle = COL.red; c.lineWidth = 3; c.beginPath(); c.moveTo(xm, yt); c.lineTo(xm, y - 2); c.stroke();
      c.fillStyle = COL.red; c.beginPath(); c.moveTo(xm - 9, y - 14); c.lineTo(xm + 9, y - 14); c.lineTo(xm, y); c.closePath(); c.fill();
    }
    items.forEach((it, i) => {
      const yb = y - 14 - (i + 1) * (rh + gap) + gap, x1 = X(clamp(it.w, lo, hi)), col = it.col || BAR[i % 3];
      c.beginPath(); c.roundRect(b.x, yb, Math.max(4, x1 - b.x), rh, 8); c.fillStyle = col; c.fill();
      if (it.w < lo) { c.beginPath(); c.moveTo(x1 - 2, yb - 5); c.lineTo(x1 + 14, yb + rh / 2); c.lineTo(x1 - 2, yb + rh + 5); c.closePath(); c.fill(); }
      else { c.setLineDash([5, 5]); c.strokeStyle = col; c.lineWidth = 2; c.beginPath(); c.moveTo(x1, yb + rh); c.lineTo(x1, y); c.stroke(); c.setLineDash([]); }
      const tw = L.measure(it.s, { s: fs, w: 700 }).w, inside = x1 - b.x > tw + 24;
      L.tx(it.s, inside ? b.x + 12 : x1 + 12, yb + rh / 2 + 1, { s: fs, w: 700, b: 'middle', c: inside ? '#fff' : col, k: it.k });
      if (o.values !== false && it.w >= lo) {
        const v = it.v || len(it.w), vw = L.measure(v, { f: F.M, s: fs, w: 600 }).w, vx = inside ? x1 + 12 : x1 + 26 + tw;
        if (vx + vw < b.x + b.w + 40) {
          if (o.mark != null) { c.fillStyle = 'rgba(247,241,230,.92)'; c.fillRect(vx - 5, yb + 3, vw + 10, rh - 6); }   // a jelölővonal ne húzza át
          L.tx(v, vx, yb + rh / 2 + 1, { f: F.M, s: fs, w: 600, b: 'middle', c: col, k: it.vk });
        }
      }
    });
    if (o.mark != null && o.markS) {
      const xm = clamp(X(clamp(o.mark, lo, hi)), b.x + 70, b.x + b.w - 70);
      L.pill(o.markS.s, xm, top - 8 - 22, { a: 'center', s: 22, w: 700, c: '#fff', bg: COL.red, k: o.markS.k, pad: 10 });

    c.fillStyle = o.hidden ? CARD : lite(col); c.strokeStyle = dark(col); c.lineWidth = Math.max(2.5, r * .09);
    c.beginPath(); c.ellipse(x, y, r * sx, r, 0, 0, TAU); c.fill(); c.stroke();
    if (r >= 20 && sx > .5) { c.globalAlpha = a * .55; c.lineWidth = Math.max(1.5, r * .04); c.beginPath(); c.ellipse(x, y, r * sx * .78, r * .78, 0, 0, TAU); c.stroke(); }
    c.restore();
    const lb = o.hidden ? { s: '?' } : o.labels ? TX(o.labels[sd ? 0 : 1]) : null;
    if (lb && sx > .55) {
      c.save(); c.globalAlpha = a * clamp((sx - .55) / .3);
      L.tx(lb.s, x, y, { k: lb.k, s: o.ls || Math.max(22, r * 1.05), w: 700, f: F.B, a: 'center', b: 'middle', c: o.hidden ? MUT : dark(col) });
      c.restore();
    }
  }

  function strip(L, o) {
    const a = A(o), sz = o.size || 36, gap = o.gap == null ? 8 : o.gap, X = (i) => o.x + (i - o.i0) * (sz + gap) + sz / 2;
    if (a <= 0) return X;
    for (let i = Math.max(0, o.i0); i < o.i1; i++) {
      const al = a * (o.alpha ? clamp(o.alpha(i)) : 1); if (al <= .005) continue;
      const v = o.val(i), ring = o.ring ? o.ring(i) : null, x = X(i);
      if (o.kind === 'kocka') die(L, v, x, o.y, sz, { a: al, ring });
      else coin(L, v, x, o.y, sz / 2, { a: al, ring, labels: o.kind === 'korong' ? null : o.labels, cols: o.cols, ls: o.ls });
    }
    return X;
  }

  /* ── ágrajz ── */
  function tree(L, o) {
    const c = L.ctx, a = A(o), D = o.levels.length, t = o.t == null ? 1 : clamp(o.t), r = o.r || 18, dim = o.dim == null ? .22 : o.dim;
    const sizes = o.levels.map((l) => l.length), leaves = product(sizes), nL = leaves.length;
    const X = (l) => o.x + o.w * l / D;
    const ly = (k) => (nL === 1 ? o.y + o.h / 2 : o.y + o.h * k / (nL - 1));
    // a csomópont y-ja: a hozzá tartozó levelek átlaga
    const span = (path) => { let w = 1; for (let l = path.length; l < D; l++) w *= sizes[l]; let k0 = 0;
      for (let l = 0; l < path.length; l++) { let m = 1; for (let q = l + 1; q < D; q++) m *= sizes[q]; k0 += path[l] * m; } return [k0, k0 + w - 1]; };
    const Y = (path) => { const [k0, k1] = span(path); return (ly(k0) + ly(k1)) / 2; };
    const nodes = [], out = { nodes, leaves: [], X };
    const emph = (p) => (o.hi ? lerp(dim, 1, clamp(o.hi(p))) : 1);
    const lvT = (l) => clamp(t * D - (l - 1));   // az l. szint (1..D) növekedése
    const rec = (path) => {
      const l = path.length, x = X(l), y = Y(path);
      nodes.push({ path: path.slice(), x, y, lvl: l });
      if (l === D) { out.leaves.push({ path: path.slice(), x, y }); return; }
      for (let k = 0; k < sizes[l]; k++) rec(path.concat([k]));
    };
    rec([]);
    if (a <= 0) return out;
    c.save(); c.setLineDash([]); c.lineCap = 'round';
    // ágak
    nodes.forEach((n) => {
      if (!n.lvl) return;
      const g = lvT(n.lvl); if (g <= 0) return;
      const par = Y(n.path.slice(0, -1)), x0 = X(n.lvl - 1), q = U.out(g);
      c.globalAlpha = a * emph(n.path); c.strokeStyle = INK; c.lineWidth = o.lw || 3;
      const xs = x0 + (o.root === false && n.lvl === 1 ? 0 : r), xe = lerp(xs, n.x - r, q);
      c.beginPath(); c.moveTo(xs, par); c.lineTo(xe, lerp(par, n.y, (xe - xs) / Math.max(1, n.x - r - xs))); c.stroke();
    });
    // csomópontok
    nodes.forEach((n) => {
      const g = n.lvl ? clamp((lvT(n.lvl) - .7) / .3) : 1; if (g <= 0) return;
      const al = a * g * emph(n.path);
      if (!n.lvl) {
        if (o.root === false) return;
        c.globalAlpha = al; c.fillStyle = INK; c.beginPath(); c.arc(n.x, n.y, 7, 0, TAU); c.fill(); return;
      }
      const opt = o.levels[n.lvl - 1][n.path[n.lvl - 1]] || {};
      if (o.node) { c.save(); o.node(L, n.path, n.x, n.y, al); c.restore(); return; }
      const col = opt.c || INK;
      c.globalAlpha = al; c.fillStyle = lite(col); c.strokeStyle = dark(col); c.lineWidth = 3;
      c.beginPath(); c.arc(n.x, n.y, r, 0, TAU); c.fill(); c.stroke();
      if (opt.s) { c.globalAlpha = al; L.tx(opt.s, n.x, n.y, { k: opt.k, s: o.ls || Math.max(22, r * 1.15), w: 700, f: F.B, a: 'center', b: 'middle', c: dark(col) }); }
    });
    c.restore();
    return out;
  }

  /* ── esettáblázat ── */
  function table(L, o) {
    const c = L.ctx, a = A(o), cs = o.cell, nr = o.rows.length, nc = o.cols.length;
    const x0 = o.x + cs, y0 = o.y + cs, res = { x0, y0, w: nc * cs, h: nr * cs };
    res.cell = (i, j) => ({ x: x0 + j * cs, y: y0 + i * cs, w: cs, h: cs, cx: x0 + (j + .5) * cs, cy: y0 + (i + .5) * cs });
    if (a <= 0) return res;
    const head = (h, cx, cy) => {
      if (typeof h === 'function') { c.save(); h(L, cx, cy, cs, a); c.restore(); return; }
      const t = TX(h); if (!t || !t.s) return; c.globalAlpha = a;
      L.tx(t.s, cx, cy, { k: t.k, s: o.hs || Math.max(22, cs * .36), w: 700, f: t.k ? F.B : F.M, a: 'center', b: 'middle', c: MUT });
    };
    c.save(); c.setLineDash([]);
    c.globalAlpha = a; c.fillStyle = CARD; c.fillRect(x0, y0, nc * cs, nr * cs);
    for (let i = 0; i < nr; i++) for (let j = 0; j < nc; j++) {
      const on = o.on ? clamp(o.on(i, j)) : 1; if (on <= 0) continue;
      const q = res.cell(i, j), f = o.fill ? o.fill(i, j) : null;
      if (f) { c.globalAlpha = a * on; c.fillStyle = f; c.fillRect(q.x + 1, q.y + 1, cs - 2, cs - 2); }
      const s = o.text ? o.text(i, j) : null;
      if (s != null && s !== '') { c.globalAlpha = a * on; L.tx(String(s), q.cx, q.cy, { s: o.ts || Math.max(22, cs * .4), w: 700, f: F.M, a: 'center', b: 'middle', c: o.tc ? o.tc(i, j) : INK }); }
    }
    c.globalAlpha = a; c.strokeStyle = 'rgba(28,36,64,.28)'; c.lineWidth = 1.5; c.beginPath();
    for (let i = 0; i <= nr; i++) { c.moveTo(x0, y0 + i * cs); c.lineTo(x0 + nc * cs, y0 + i * cs); }
    for (let j = 0; j <= nc; j++) { c.moveTo(x0 + j * cs, y0); c.lineTo(x0 + j * cs, y0 + nr * cs); }
    c.stroke();
    c.strokeStyle = INK; c.lineWidth = 2.5; c.strokeRect(x0, y0, nc * cs, nr * cs);
    if (o.hi) for (let i = 0; i < nr; i++) for (let j = 0; j < nc; j++) {
      const h = clamp(o.hi(i, j)); if (h <= .01) continue; const q = res.cell(i, j);
      c.globalAlpha = a * h; c.strokeStyle = o.hc || RED; c.lineWidth = 4; c.strokeRect(q.x + 3, q.y + 3, cs - 6, cs - 6);
    }
    o.cols.forEach((h, j) => head(h, x0 + (j + .5) * cs, o.y + cs / 2));
    o.rows.forEach((h, i) => head(h, o.x + cs / 2, y0 + (i + .5) * cs));
    c.restore();
    return res;
  }

  /* ── relatív gyakoriság a kísérletszám függvényében (logaritmikus vízszintes tengely) ── */
  function runPlot(L, o) {
    const c = L.ctx, a = A(o), nmax = o.nmax || 10000, LM = Math.log10(nmax), t = o.t == null ? 1 : clamp(o.t);
    const ymin = o.ymin == null ? 0 : o.ymin, ymax = o.ymax == null ? 1 : o.ymax, ystep = o.ystep || .25;
    const X = (k) => o.x + o.w * Math.log10(Math.max(1, k)) / LM, Y = (v) => o.y + o.h - (v - ymin) / (ymax - ymin) * o.h;
    const res = { X, Y };
    if (a <= 0) return res;
    const xb = o.x, yb = o.y + o.h;
    c.save(); c.setLineDash([]); c.lineCap = 'round'; c.lineJoin = 'round';
    // rács
    c.globalAlpha = a; c.strokeStyle = 'rgba(28,36,64,.08)'; c.lineWidth = 2; c.beginPath();
    for (let v = ymin + ystep; v <= ymax + 1e-9; v += ystep) { c.moveTo(xb, Y(v)); c.lineTo(lerp(xb, o.x + o.w, t), Y(v)); }
    for (let e = 0; e <= LM; e++) { const x = X(Math.pow(10, e)); if (e) { c.moveTo(x, yb); c.lineTo(x, lerp(yb, o.y, t)); } }
    c.stroke();
    c.strokeStyle = 'rgba(28,36,64,.05)'; c.lineWidth = 1.5; c.beginPath();
    for (let e = 0; e < LM; e++) for (let m = 2; m <= 9; m++) { const x = X(m * Math.pow(10, e)); c.moveTo(x, yb); c.lineTo(x, lerp(yb, o.y, t)); }
    c.stroke();
    // tengelyek
    c.strokeStyle = INK; c.fillStyle = INK; c.lineWidth = 2.5;
    c.beginPath(); c.moveTo(xb, yb); c.lineTo(lerp(xb, o.x + o.w + 30, t), yb); c.moveTo(xb, yb); c.lineTo(xb, lerp(yb, o.y - 30, t)); c.stroke();
    if (t >= 1) {
      const head = (x, y, ang) => { c.beginPath(); c.moveTo(x + Math.cos(ang) * 3, y + Math.sin(ang) * 3); c.lineTo(x - Math.cos(ang - .42) * 14, y - Math.sin(ang - .42) * 14); c.lineTo(x - Math.cos(ang + .42) * 14, y - Math.sin(ang + .42) * 14); c.closePath(); c.fill(); };
      head(o.x + o.w + 30, yb, 0); head(xb, o.y - 30, -Math.PI / 2);
    }
    const ta = clamp((t - .4) / .6);
    if (ta > 0) {
      c.globalAlpha = a * ta; c.lineWidth = 2;
      for (let v = ymin; v <= ymax + 1e-9; v += ystep) {
        const y = Y(v); c.beginPath(); c.moveTo(xb - 8, y); c.lineTo(xb, y); c.stroke();
        let d = 0; while (d < 4 && Math.abs(v * Math.pow(10, d) - Math.round(v * Math.pow(10, d))) > 1e-7) d++;
        L.tx(U.fmt(v, d), xb - 14, y, { f: F.M, s: 22, w: 500, a: 'right', b: 'middle', c: MUT });
      }
      for (let e = 0; e <= LM; e++) {
        const x = X(Math.pow(10, e)); c.beginPath(); c.moveTo(x, yb); c.lineTo(x, yb + 8); c.stroke();
        L.tx(U.fmt(Math.pow(10, e)), x, yb + 14, { f: F.M, s: 22, w: 500, a: 'center', b: 'top', c: MUT });
      }
      if (o.yName) { const q = TX(o.yName); L.tx(q.s, xb + 20, o.y - 30, { k: q.k, s: 22, w: 700, f: F.B, a: 'left', b: 'middle', c: MUT }); }
      if (o.xName) { const q = TX(o.xName); L.tx(q.s, o.x + o.w + 30, yb + 46, { k: q.k, s: 22, w: 700, f: F.B, a: 'right', b: 'top', c: MUT }); }
      if (o.note) { const q = TX(o.note); L.tx(q.s, xb, yb + 46, { k: q.k, s: 22, w: 600, f: F.B, i: true, a: 'left', b: 'top', c: MUT }); }
    }
    // elméleti érték(ek)
    const ps = o.p == null ? [] : [].concat(o.p);
    ps.forEach((p, j) => {
      const y = Y(p);
      if (o.band) {
        c.globalAlpha = a * .12; c.fillStyle = o.c || RED; c.beginPath();
        const ks = []; for (let e = 0; e <= LM * 20; e++) ks.push(Math.pow(10, e / 20));
        ks.forEach((k, q) => { const d = Math.min(1, 1 / Math.sqrt(k)); const yy = Y(Math.min(ymax, p + d)); if (q) c.lineTo(X(k), yy); else c.moveTo(X(k), yy); });
        ks.slice().reverse().forEach((k) => { const d = Math.min(1, 1 / Math.sqrt(k)); c.lineTo(X(k), Y(Math.max(ymin, p - d))); });
        c.closePath(); c.fill();
      }
      c.globalAlpha = a; c.strokeStyle = INK; c.lineWidth = 2.5; c.setLineDash([12, 8]);
      c.beginPath(); c.moveTo(xb, y); c.lineTo(o.x + o.w, y); c.stroke(); c.setLineDash([]);
      if (o.pLabel && j === 0) { const q = TX(o.pLabel); L.tx(q.s, o.x + o.w + 12, y, { k: q.k, s: 26, w: 700, f: F.M, a: 'left', b: 'middle', c: INK }); }
    });
    // a görbe
    const n = Math.min(nmax, Math.floor(o.n || 0));
    if (n >= 1 && o.rel) {
      c.globalAlpha = a; c.strokeStyle = o.c || RED; c.lineWidth = o.lw || 3.5; c.beginPath();
      let k = 1, first = true;
      while (k <= n) {
        const v = o.rel(k);
        if (isFinite(v)) { const px = X(k), py = Y(clamp(v, ymin, ymax)); if (first) { c.moveTo(px, py); first = false; } else c.lineTo(px, py); }
        k = k < 300 ? k + 1 : Math.min(n === k ? k + 1 : n, Math.max(k + 1, Math.floor(k * 1.004)));
      }
      c.stroke();
      const v = o.rel(n);
      if (isFinite(v)) { c.fillStyle = o.c || RED; c.beginPath(); c.arc(X(n), Y(clamp(v, ymin, ymax)), 8, 0, TAU); c.fill(); c.strokeStyle = dark(o.c || RED); c.lineWidth = 2.5; c.stroke(); }
    }
    c.restore();
    return res;
  }

  return { hash, u: u01, create, track, runner, grow, product, binom, sumDist, die, coin, strip, tree, table, runPlot,
    COL: { ink: INK, mut: MUT, card: CARD, red: RED, teal: TEAL, ochre: OCHRE, blue: BLUE }, lite, dark };
})();
/* ── MODUL VÉGE: Véletlen kísérlet (MatRand) ── */
/* ── MODUL: Öröklődés-sorsoló (BioGene) · forrás: biologia-7-8/14-oroklodes, 2026-11-24 ──
   Kromoszómák, kromoszómakészlet (kariogram), allél-jelek, ivarsejt-sorsolás, megtermékenyítés,
   Punnett-tábla, domináns / kodomináns (ABO) / X-hez kötött / nemi öröklés. Csak a Lesson motorra
   épül (L.ctx, L.tx, L.measure, L.fonts, Lesson.U); a lecke kódjára nem hivatkozik. A véletlent a
   hívó adja (u ∈ [0; 1) számok, pl. MatRand.u(seed, i, j) vagy U.rng) – így minden zárt képletű,
   seedelt és determinisztikus. Az átlátszóság (o.a) a hívó globalAlpha-jával szorzódik; minden
   rajzoló save/restore-ral visszaállítja a vászonállapotot.

   ── Adat ──
   BioGene.CHR[i] = {n: '1'…'22' | 'X' | 'Y', mb (hossz, millió bázispár), cen (centromer 0..1 a p-végtől)}
        az emberi kromoszómák (GRCh38) közelítő hossza és centromer-helye; i = 0..21 testi, 22 = X, 23 = Y
   BioGene.len(i, px) → a kromoszóma rajzhossza, ha az 1-es px hosszú

   ── Genotípus ──  allél-jel (token): 'A', 'a', 'B', '0', … · X-hez kötött: 'XA', 'Xa' (X + allél) · 'X', 'Y'
   BioGene.geno('Aa') → ['A', 'a'] · geno('XAXa') → ['XA', 'Xa'] · geno('A0') → ['A', '0'] · geno('XY') → ['X', 'Y']
   BioGene.str(g) → 'Aa'          BioGene.sort(g) → kanonikus sorrend (nagybetű előbb; X az Y előtt)
   BioGene.gametes(g) → [{t, p}]   ivarsejt-fajták valószínűséggel (azonosak összevonva)
   BioGene.child(g1, g2, u1, u2) → a gyerek genotípusa: g1[u1 < .5 ? 0 : 1] + g2[u2 < .5 ? 0 : 1]
   BioGene.pheno(g, mode) → jelleg-kulcs
        'dom'  → 'D' (van domináns, nagybetűs allél) | 'r' (csak lappangó)
        'abo'  → 'A' | 'B' | 'AB' | '0'   (A és B kodomináns, 0 lappangó)
        'x'    → nő: 'F' (ép) | 'Fc' (hordozó) | 'Fa' (érintett) · férfi: 'M' | 'Ma'   (X-hez kötött lappangó)
        'sex'  → 'F' (XX) | 'M' (XY)
        'add'  → a nagybetűs allélek száma (0, 1, 2 – additív, mennyiségi)
   BioGene.cross(g1, g2, mode) → {cols: g1 (oszlopok = 1. szülő ivarsejtjei), rows: g2, cells[i][j] (sor i, oszlop j),
        ph[i][j] (jelleg), dist: [{key, n, p}] (a 4 cellából, első előfordulás sorrendjében), ratio: [egészek]}
   BioGene.ratio(ns) → legkisebb egészek aránya ([3, 1]; [1, 2, 1])
   BioGene.binom(n, k, p) → P(k siker n-ből)
   BioGene.meiosis(n, u) → [0|1, …] – n párból melyik tag kerül az ivarsejtbe (u(i) → [0; 1))

   ── Rajz ──
   BioGene.chromo(L, x, y, len, o) → {x, y, top, bot, w, cy (centromer y), at(f) → y}   egy kromoszóma (pálca)
        (x, y) a pálca közepe (o.top: true → y a teteje); o: {w (szélesség, alap len·0,17 → 7..44 px), cen (0..1),
        col (kitöltés), edge (keret, alap a kitöltés sötétebb változata), bands: true (sematikus sávozás),
        seed (a sávok mintázata), rot (szög, radián, a közép körül), a, hi (kiemelő keretszín), lw (keretvastagság),
        loci: [{at: 0..1, col, h (sávmagasság px)}] (génhely-sáv)}
   BioGene.karyo(L, o) → [{i, j, x, y, len, top}]  kariogram: 23 pár sorokba rendezve
        o: {x, y, w (a terület), px (az 1-es kromoszóma hossza), rows: [[0..7], [8..15], [16..22]] (párindexek),
        rowGap (sorok közti hely a feliratnak, 40), sex: 'XX' | 'XY' (a 23. pár), rw (pálcaszélesség, 12),
        col(i, j) → kitöltés (j = 0 anyai, 1 apai tag), a, dim(i, j) → 0..1 (átlátszóság-szorzó),
        hi(i, j) → szín | null, labels: true (pár-sorszám, kódban rögzített), ls (betű, 22),
        move(i, j, p) → {x, y, a} | null (animáció: a kiszámolt helyett hova rajzolja)}
        A 23. pár (i = 22) XX-nél X + X, XY-nál X (j = 0, anyától) + Y (j = 1, apától).
   BioGene.allele(L, t, x, y, o) → {w, h}   allél-jel lekerekített dobozban; X-hez kötöttnél X + felső index
        o: {s (betű, 34; a felső index 0,66·s, legyen ≥ 22 px → s ≥ 34), col (doboz), tc (betűszín), a, al: 'center' |
        'left' | 'right', bare: true (doboz nélkül), k (md-kulcs, ha a jel a .md-ből jön)}
   BioGene.alleleW(L, t, o) → a jel szélessége (dobozzal)
   BioGene.pair(L, g, x, y, o) → két allél-jel egymás mellett (o.gap = 6), középre igazítva
   BioGene.punnett(L, o) → {cell(i, j) → {x, y, w, h, cx, cy}, x0, y0, w, h}
        o: {x, y (a tábla bal felső sarka a fejléccel), cell (px), g1 (oszlopfejléc: 1. szülő), g2 (sorfejléc),
        mode (pheno-mód), a, reveal: 0..1 (a cellák sorban jelennek meg), hi(i, j) → 0..1, fill(i, j, ph) → szín,
        head(L, t, cx, cy, size, al, which: 'col' | 'row') (saját fejlécrajz), body(L, g, ph, cx, cy, size, al, i, j)
        (saját cellatartalom; alap: a két allél-jel), cols: {token: szín} (allél-doboz színek), hs (fejléc betű, 34)}
   BioGene.gamete(L, kind, x, y, r, o)   ivarsejt-ikon: 'pete' (kör, sugárzó koszorú) | 'hím' (fej + farok, o.t: farokhullám
        fázisa); o: {a, col, edge, rot}
   BioGene.COL – a modul színei (tinta, halvány tinta, kártya, anyai/apai alap, allélszínek)
   ──────────────────────────────────────────────────────────────────────────────────────────── */
const BioGene = (() => {
  'use strict';
  const TAU = Math.PI * 2;
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const hx = (h) => { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };

const NG8 = 20;

function build8() {
  const N = num('emberek a modellben'), cum = [], z = [];
  for (let p = 0; p < N; p++) {
    const row = new Int8Array(NG8 + 1);
    for (let g = 0; g < NG8; g++) row[g + 1] = row[g] + (R.u(800, p, 2 * g) < .5 ? 1 : 0) + (R.u(800, p, 2 * g + 1) < .5 ? 1 : 0);
    cum.push(row);
    const u1 = Math.max(1e-9, R.u(801, p, 0)), u2 = R.u(801, p, 1); z.push(Math.sqrt(-2 * Math.log(u1)) * Math.cos(TAU * u2));

}
const shift8 = (env) => -num('hiányos táplálkozás hatása') * (2 - env) / 2;
function heights8(n, env) {

}
function hist8(n, env) {

  for (const v of hs) { s += v; const b = Math.floor(v - 140); if (b >= 0 && b < 60) h[b]++; }
  h.mean = s / hs.length; S8.H[key] = h; return h;
}
function shown8(st) {
  const tgt = hist8(S8.n, S8.env), u = smooth((st - S8.t0) / .6);
  if (!S8.prev) return tgt.map((v) => v * u);
  return tgt.map((v, i) => lerp(S8.prev[i], v, u));
}
