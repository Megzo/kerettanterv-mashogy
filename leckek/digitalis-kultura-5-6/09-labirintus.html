<script>
(function () {
'use strict';

/* ── MODUL: „Tippelj!” és bélyegek (TtTipp) · forrás: termeszettudomany-5-6/01-tocsa + 03-meres, egységesítve 2026-11-24 ── */
/* A természettudomány 5–6. sorozat közös mintái (szerződés 17.): kísérlet-/modellbélyeg és a „Tippelj! → kísérlet →
   magyarázat” jóslat. Csak a Lesson motorra épül (L.ctx, L.tx, L.pill, L.lab, L.button, L.controlsEl, L.panel, L.st,
   Lesson.U, Lesson.FONTS); a lecke kódjára nem hivatkozik. A panel elmosásához szükséges CSS-t (.tt-rejtett) és a
   letiltott csúszka halványítását a modul maga teszi a <head>-be – a leckében nem kell <style>-sor.

   BEKÖTÉS (a lecke kódjában, egyszer, legfelső szinten – a getterek miatt a sorrend mindegy):
     TtTipp.bind({ L: () => L, ga: () => GA });    // ga: a lecke alap-alfája (jelenet-áttűnés); alap: () => 1
     const { stamp, Tip, tipReset, panelVeil, veilIf, tipGuess, tipHide, tipControls, tipU, rhythm, tipHead, tipRow,
       tipFeedback } = TtTipp;
   ALFA: minden rajzoló a globalAlpha-t ga() · a (· belső áttűnés) értékre ÁLLÍTJA (nem szoroz a pillanatnyival, így
   egy korábbi halvány felirat nem tünteti el), a vonalstílust (lineCap/lineJoin/setLineDash) visszaállítja.

   stamp(kind, x, y, a, o) → doboz | null       kísérlet-/modellbélyeg a KemGHS.stamp stílusával (Bricolage 22 px,
        600, betűköz 0,08 em, −3°, papír alap, 2 px keret; 'tilos': 700, 3 px). (x, y): a bal szél közepe.
        Szöveg: az o.k || '<kind> bélyeg' .md-kulcs. Szín (STAMP): otthon kékeszöld, felnőtt okker, tilos #b3261e;
        tanári, modell, kitalált, nem méretarányos, sematikus, vázlatos, képzeletbeli (és minden más) halvány tinta.
        o = {k, col (szín felülírása), rot: −3 (fok), al: 'left' (igazítás)}. a ≤ 0,005 → nem rajzol.
   Tip(keys, ok) → P      jóslat-állapot. keys: a válaszok .md-kulcsai (egyben gombfeliratok), ok: a helyes kulcs (az
        init-ben is beállítható: P.ok = …). P = {keys, ok, guess: null | kulcs, gt: a választás L.st-je, btns, on}.
        P.on(k): választáskor hívódik (a lecke állítja, pl. a kísérlet vezérlőinek feloldására).
   tipReset(P)            alaphelyzet (az enter()-ben; utána veilIf(P)).
   panelVeil(on)          a panelszöveg 2. bekezdésétől (.lp-text > *, i > 0) elmos (on) / felold.
   veilIf(P)              panelVeil(!P.guess) – az enter()-ben a tipReset után.
   tipControls(P)         a tippgombok (L.button, P.keys sorrendben). A választás után csak ezek tűnnek el: a
        sorukba utána tett más gombok maradnak (ha a sorban nem marad látható gomb, a sor is eltűnik).
   tipGuess(P, k, gt)     választás (csak az első számít): P.guess = k, P.gt = gt ?? L.st, tipHide, panelVeil(false),
        P.on(k). A QA-állapotok is ezt hívhatják (pl. gt = L.st − 30: a kísérlet már lefutott).
   tipHide(P)             a tippgombok elrejtése (a tipGuess hívja; QA-állapotban kézzel is).
   tipU(P, st) → mp       a választás óta eltelt idő (st − P.gt), −1, ha még nincs tipp.
   rhythm(ph, a)          a „Tippelj! → kísérlet → magyarázat” sáv a vászon bal felső sarkában (x 40, y 46);
        ph: 0 / 1 / 2 az aktív szakasz.
   tipHead(P, st, a, qk, o) → y     fejléc: sáv + kérdés (qk, (40, 116), Fraunces 38, max 1280) + válaszsor (40, y).
        o = {tExp: 4,5 (a kísérlet hossza mp-ben: ennyi után vált a sáv „magyarázat”-ra, és mutatja a helyes
        választ), q2 (2. kérdéssor kulcsa, (40, 162); a válaszsor 46 px-szel lejjebb kerül), qv (a kérdés #-jeleinek
        értékei, sorban), y: 178 (a válaszsor közepe), noRhythm (a sáv nélkül – pl. olvasási kérdésnél)}.
        Visszaad: a válaszsor y-ja.
   tipRow(P, st, a, x, y, o) → [dobozok]    csak a válaszsor (a tipHead is ezt rajzolja), bárhová: a választásig
        semleges; a választott cinóber keretet és alatta „a te tipped” feliratot kap; o.tExp (0) mp múlva a helyes
        zöld keretet + pipát kap, a többi elhalványul. Dobozköz 54 px (a pipának).
   tipFeedback(P, st, a, x, y, o) → doboz | null    „Jó tipp!” (zöld) / „Sokan gondolják így – nézzük meg!”
        (kékeszöld) pill (x: bal szél, y: közép), a választás után 0,15 mp-cel beúszva. o = {s: 24, al: 'left', max}.
   .md-kulcsok (### Feliratok): tippelj felirat, kísérlet felirat, magyarázat felirat, a te tipped felirat, jó tipp
        felirat, rossz tipp felirat; a bélyegeké '<kind> bélyeg'.
   ──────────────────────────────────────────────────────────────────────────────────────────────────────── */
const TtTipp = (() => {
  'use strict';
  const U = Lesson.U, F = Lesson.FONTS, { clamp, lerp, smooth } = U;
  const INK = '#1c2440', MUT = '#565d72', RED = '#c8401c', TEAL = '#0a6f86', GOOD = '#1d7a45', BAD = '#b3261e', OKR = '#8f5a0c', CARD = '#fffaf1';
  const STAMP = { otthon: TEAL, felnőtt: OKR, tilos: BAD, tanári: MUT, modell: MUT, kitalált: MUT, 'nem méretarányos': MUT, sematikus: MUT, vázlatos: MUT, képzeletbeli: MUT };
  const KEYS = { ph: ['tippelj felirat', 'kísérlet felirat', 'magyarázat felirat'], mine: 'a te tipped felirat', ok: 'jó tipp felirat', bad: 'rossz tipp felirat' };
  let getL = () => null, ga = () => 1;
  if (typeof document !== 'undefined' && !document.getElementById('tt-tipp-css')) {
    const st = document.createElement('style'); st.id = 'tt-tipp-css';
    st.textContent = '.lp-text > .tt-rejtett { filter: blur(7px); opacity: .5; user-select: none; transition: filter .6s, opacity .6s; }\n'
      + '.lp-slider:has(input:disabled) { opacity: .45; }\n.lp-slider input:disabled { cursor: not-allowed; }';
    document.head.appendChild(st);
  }
  const Lx = () => getL(), cx = () => getL().ctx, lab = (k) => getL().lab(k);
  const al = (a) => { cx().globalAlpha = ga() * clamp(a); };
  const fillIn = (s, v) => { let i = 0; return s.replace(/#/g, () => (i < v.length ? v[i++] : '#')); };
  const rr = (c, x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, w, h, r); };
  function check(x, y, a) {                 // pipa (rajz, nem betűjel)
    const c = cx(); al(a); c.lineWidth = 4.5; c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = GOOD; c.beginPath();
    c.moveTo(x - 10, y); c.lineTo(x - 3, y + 8); c.lineTo(x + 11, y - 9); c.stroke(); c.lineCap = 'butt'; c.lineJoin = 'miter';
  }
  function arrow(x1, y1, x2, y2, col, w, hs) {
    const c = cx(), an = Math.atan2(y2 - y1, x2 - x1), bx = x2 - Math.cos(an) * hs * .8, by = y2 - Math.sin(an) * hs * .8;
    c.setLineDash([]); c.lineCap = 'round'; c.beginPath(); c.moveTo(x1, y1); c.lineTo(bx, by); c.strokeStyle = col; c.lineWidth = w; c.stroke(); c.lineCap = 'butt';
    c.beginPath(); c.moveTo(x2, y2); c.lineTo(x2 - hs * Math.cos(an - .45), y2 - hs * Math.sin(an - .45)); c.lineTo(x2 - hs * Math.cos(an + .45), y2 - hs * Math.sin(an + .45)); c.closePath();
    c.fillStyle = col; c.fill();
  }

  function bind(o = {}) { if (o.L) getL = o.L; if (o.ga) ga = o.ga; }
  function stamp(kind, x, y, a, o = {}) {
    if (a <= .005) return null;
    const L = Lx(), c = L.ctx, k = o.k || (kind + ' bélyeg'), col = o.col || STAMP[kind] || MUT, tilos = kind === 'tilos';
    c.save(); al(a); c.translate(x, y); c.rotate((o.rot == null ? -3 : o.rot) * Math.PI / 180);
    const b = L.pill(lab(k), 0, 0, { s: 22, w: tilos ? 700 : 600, ls: '0.08em', f: F.B, bg: CARD, bd: col, bw: tilos ? 3 : 2, c: col, r: 6, pad: 10, k, qa: false, a: o.al || 'left' });
    c.restore(); return b;
  }
  const Tip = (keys, ok) => ({ keys, ok, guess: null, gt: -99, btns: [], on: null });
  function tipReset(P) { P.guess = null; P.gt = -99; }
  function panelVeil(on) {
    const L = Lx(); if (!L || !L.panel) return;
    L.panel.querySelectorAll('.lp-text > *').forEach((p, i) => { if (i > 0) p.classList.toggle('tt-rejtett', !!on); });
  }
  const veilIf = (P) => panelVeil(!P.guess);
  function tipHide(P) {
    const rows = new Set();
    (P.btns || []).forEach((b) => { b.style.display = 'none'; if (b.parentNode) rows.add(b.parentNode); });
    rows.forEach((r) => { if (![...r.children].some((e) => e.style.display !== 'none')) r.style.display = 'none'; });
  }
  function tipGuess(P, k, gt) {
    if (P.guess) return;
    P.guess = k; P.gt = gt == null ? Lx().st : gt;
    tipHide(P); panelVeil(false);
    if (P.on) P.on(k);
  }
  function tipControls(P) { const L = Lx(); P.btns = P.keys.map((k) => L.button(lab(k), () => tipGuess(P, k), k)); }
  const tipU = (P, st) => (P.guess ? st - P.gt : -1);
  function rhythm(ph, a) {
    const L = Lx(), cols = [RED, TEAL, OKR];
    let x = 40;
    KEYS.ph.forEach((k, j) => {
      const on = ph === j, done = ph > j;
      al(a * (on ? 1 : done ? .7 : .4));
      const b = L.pill(lab(k), x, 46, { k, s: 22, w: 700, f: F.B, c: on ? '#ffffff' : cols[j], bg: on ? cols[j] : CARD, bd: cols[j], bw: 2, pad: 10 });
      x = b.x + b.w;
      if (j < 2) { al(a * .55); arrow(x + 8, 46, x + 34, 46, MUT, 3, 11); x += 44; }
    });
  }
  function tipRow(P, st, a, x, y, o = {}) {
    const L = Lx(), c = L.ctx, u = tipU(P, st), tx = o.tExp || 0, out = [];
    const rev = P.guess ? smooth((u - tx) / .5) : 0;
    P.keys.forEach((k) => {
      const mine = P.guess === k, ok = k === P.ok, g = rev * (ok ? 1 : 0);
      al(a * (P.guess && !mine && !ok ? lerp(1, .55, rev) : 1));
      const b = L.pill(lab(k), x, y, { k, s: 26, w: 600, f: F.B, c: INK, bg: g > .5 ? '#eef6ee' : CARD, bd: g > .5 ? GOOD : 'rgba(28,36,64,.35)', bw: g > .5 ? 3 : 2, pad: 14 });
      if (mine) {
        al(a * smooth(u / .3)); rr(c, b.x - 6, b.y - 6, b.w + 12, b.h + 12, (b.h + 12) / 2); c.strokeStyle = RED; c.lineWidth = 3.5; c.stroke();
        L.tx(lab(KEYS.mine), b.x + b.w / 2, b.y + b.h + 30, { k: KEYS.mine, s: 22, w: 700, f: F.B, c: RED, a: 'center' });
      }
      if (g > 0) check(b.x + b.w + 24, y, a * g);
      out.push(b); x = b.x + b.w + 54;
    });
    return out;
  }
  function tipHead(P, st, a, qk, o = {}) {
    const L = Lx(), u = tipU(P, st), tx = o.tExp || 4.5;
    if (!o.noRhythm) rhythm(!P.guess ? 0 : u < tx ? 1 : 2, a);
    const q = { f: F.D, s: 38, w: 600, c: INK, max: 1280 };
    al(a); L.tx(o.qv ? fillIn(lab(qk), o.qv) : lab(qk), 40, 116, Object.assign({ k: qk }, q));
    let y = o.y || 178;
    if (o.q2) { al(a); L.tx(lab(o.q2), 40, 162, Object.assign({ k: o.q2 }, q)); y += 46; }
    tipRow(P, st, a, 40, y, { tExp: tx });
    return y;
  }
  function tipFeedback(P, st, a, x, y, o = {}) {
    if (!P.guess) return null;
    const u = tipU(P, st), ok = P.guess === P.ok, k = ok ? KEYS.ok : KEYS.bad;
    al(a * smooth((u - .15) / .4));
    return Lx().pill(lab(k), x, y, { k, s: o.s || 24, w: 700, f: F.B, c: ok ? GOOD : TEAL, bg: CARD, bd: ok ? GOOD : TEAL, bw: 2.5, pad: 12, a: o.al || 'left', max: o.max });
  }
  return { bind, STAMP, stamp, Tip, tipReset, panelVeil, veilIf, tipGuess, tipHide, tipControls, tipU, rhythm, tipHead, tipRow, tipFeedback };
})();
/* ── MODUL VÉGE: TtTipp ── */
/* ── MODUL: Blokkprogram (DigBlock) · forrás: digitalis-kultura-5-6/02-ciklus, 2026-11-24 · v1.1 ── */
/* A digitális kultúra 5–6. sorozat saját blokknyelve (terv 4.2, szerződés 19.): program-adatszerkezet, determinisztikus
   értelmező (futás-nyomvonal), szerkesztő (paraméter, húzás, paletta, töréspont), futásóra, változódoboz, folyamatábra,
   pszeudokód. Csak a Lesson motorra épül (L.ctx, L.tx, L.measure, L.lab, L.content, L.pointer, L.button, L.slider, L.st,
   Lesson.U, Lesson.FONTS); a lecke kódjára nem hivatkozik. A robot (világ) külön modul: DigRobot.

   VÁLTOZÁSNAPLÓ (a v1.0 hívásai változatlanul működnek)
   v1.1 (2026-11-24, a 01, 02, 03 metrikasora alapján):
     · run: a ciklus minden új köre, az eseménykezelő és a saját blokk minden indítása törli a törzse alatti blokkok
       IGAZ/HAMIS és „#. kör” jelzését (mk) – ismétlésen belüli beágyazott „ha”-nál nem marad kint az előző kör jelölése.
     · def: {proc: spec, params: [név…]} – saját blokk, amelynek törzse blokkprogram (eljárás); body ≥ 1 – saját
       tartalmazó blokk, a törzse lefut (v1.0-ban egyik sem futott, csak a world.act).
     · világ-megállás: act → {s, dur, halt} vagy world.halt(s, info) → a futás leáll (end: 'világ', R.halt); a hibás
       megállás blokkja nem kap pipát; a szerkesztő jelzi ('<fajta> hiba' / '<fajta> felirat', ha van ilyen kulcs).
     · E.setParam/setArg/move/insert/remove alapból azonnal rendez (a QA-állapotban nem kell E.set(E.prog())); animálva:
       utolsó paraméter {anim: true}. Új: E.snap(), E.busy() (idle()-hez).
     · érzékelés: a 'sense'-es saját blokk 'érték' alakban a nyers értéket adja (v1.0: logikaivá alakította), a sense
       lehet függvény (args → név); world.sense(s, név, args, {t, id}); a frame-ek reads: {név: érték} mezője a futás
       közben olvasott szenzorértékek; run o.s0: a világ kezdőállapota (W.init() helyett).
     · szerkesztő: a futási hiba felirata alapból a blokk MELLÉ kerül (v1.0: alá, a következő blokkot takarta) –
       E.draw({errAt: 'mellett' | 'alatt' | {x, y} | false}); opClick: a reláció / logikai / aritmetikai jel kattintásra
       cserélhető (< ≤ > ≥ =; és vagy; + − · :).
     · flow({bare: true}): a „ha”/„amíg” rombuszában csak a feltétel szövege áll.

   BEKÖTÉS (egyszer, legfelső szinten):  DigBlock.bind({ L: () => L, ga: () => GA });   // ga: a lecke alap-alfája
   ALFA: minden rajzoló a globalAlpha-t ga() · a értékre ÁLLÍTJA (nem szoroz), a vonalstílust visszaállítja.
   FELIRATOK (### Feliratok) – minden diák által látott szöveg a .md-ből:
     '<op> blokk'     a blokk felirata, # = paraméterhely, sorrendben (pl. 'fordulj blokk: fordulj # # fokot').
                      A számparaméter után álló '-szor/-szer/-ször' a számhoz igazodik (4-szer, 5-ször, 3-szor, 360-szor).
                      Az első rajzoláskor a #-ek számát összeveti a látható paraméterek számával → console.error.
     '<op> vége'      a tartalmazó blokk záró sávja (ismételd vége: „ismétlés vége”); 'ha-különben közép': „különben”.
     '<érték> opció'  választható érték felirata (jobbra opció: jobbra; távolság opció: mért távolság) – ha nincs ilyen
                      kulcs, a nyers érték látszik (review-ban kulcs nélkül). '<név> változó': a változó felirata (ugyanígy).
     'kör felirat'    a ciklusszámláló („#. kör”) · 'igaz felirat' / 'hamis felirat' (IGAZ / HAMIS) · '<fajta> hiba'
                      (a futási hiba felirata, csak ha előfordulhat: típus, változó, nulla, érzékelő, ismeretlen) ·
                      'korlát felirat' (lépéskorlát: „végtelen ciklus?” – csak ha előfordulhat) · a vezérlőké lent.
   NEM rajzol: a világot (DigRobot, lecke-saját konyha, szalag), a 'mondd' kimenetét (frame.val – a lecke írja ki).

   ── Program (adat) ──
   DigBlock.prog(spec) → P            spec: utasítások tömbje; egy utasítás ['op', arg…, [törzs]…], pl.
        [['indításkor'], ['ismételd', 4, [['lépj', 100], ['fordulj', 'jobbra', 90]]]]
        ['ha-különben', ['<', ['érzékelő', 'távolság'], 20], [[…]], [[…]]]

      Paraméter: szám · szöveg (választó, irány, változónév, md-kulcs) · {k: 'md-kulcs'} (szövegliterál a .md-ből) ·
        ['op', …] (kifejezés) · {v, min, max, step, opts: [..], lock: true} (literál, példányszintű szerkesztési szabállyal).
      P = {body: [csomópont]}; csomópont {id, op, args, meta, body: [[…], …]}; az id az út a fában: '0', '0.b.1',
        '0.b.1.a.0' (b: törzs, a: különben-ág), kifejezésben '0.b.1.p0' (p: a paraméter sorszáma). Determinisztikus,
        szerkesztés után újraszámolódik.

   DigBlock.walk(P, fn(node, depth)) · DigBlock.spec(P) → spec (vissza tömbbé)
   DigBlock.BLOCKS[op] → {cat, args: [{t, min, max, step, opts, hide}], body: 0|1|2, shape: 'utasítás'|'feltétel'|'érték'|
        'esemény', world: true (a világ hajtja végre)}. Paramétertípusok: szám, irány, választó, változó, szöveg, logikai,
        érték, kulcs. Katalógus (v1.0, teljes):
        esemény    indításkor · kattintáskor (cél) · gombra (gomb)
        mozgás     lépj (n) · fordulj (jobbra|balra, fok) · lépj egyet · fordulj balra · fordulj jobbra
        toll       tollat le · tollat fel · tollszín (tinta|cinóber|kékeszöld|lila|okker|kék)
        vezérlés   ismételd (n){} · amíg (feltétel){} · mindig{} · ha (f){} · ha-különben (f){}{} · várj (mp) · állj
        érzékelés  érzékelő (név) → érték · ütközik? · fal elöl? · fal jobbra? · fal balra? → logikai
        adat       legyen (változó, érték) · növeld (változó, d) · változó (név) → érték · kérdezd (kérdés) → a
                   'válasz' változóba · válasz → érték
        művelet    + − · : (szám; számszerű szöveget átvált, más szövegre 'típus' hiba; :0 → 'nulla' hiba) ·
                   < > = ≤ ≥ (logikai; az = szöveget is összevet) · és · vagy · nem · összefűz (a, b) → szöveg ·
                   véletlen (a, b) → egész, a seedelt U.rng-ből
        kimenet    mondd (érték)
        saját      lépés (md-kulcs: a blokk felirata maga a kulcs szövege) – a világ adaptere hajtja végre
   DigBlock.def(op, {args, body: 0, shape: 'utasítás', world: true}) – lecke-saját blokk ('saját' kategória, a
        felirata '<op> blokk'). A 'kattintáskor'/'gombra' célja és a 'tollszín' értéke választó: az opts a példányban
        adható meg ({v: 'alma', opts: ['alma', 'körte']}).
      Változatok (v1.1):
        world: true (alap)   a világ hajtja végre: world.act(s, op, [paraméterértékek]).
        proc: spec           eljárás: a hívás egy frame (tick), utána a spec utasításai futnak (frame-id: '<hívás id>.d.<út>',
                             a szerkesztő ilyenkor a hívó blokkot keretezi). params: ['hossz', …] – a paraméterek a hívás
                             idejére ilyen nevű változók (['változó', 'hossz']), utána a régi érték visszaáll.
        body: 1|2            saját tartalmazó blokk: a fejléc (world: true → act, különben tick), utána a törzs(ek) sorban.
        sense: 'név' | (args) => 'név', world: false   érzékelő blokk: shape 'feltétel' → logikai, 'érték' → a nyers
                             érték (world.sense(s, név, args, {t, id})).

   ── Futás (determinisztikus nyomvonal) ──
   const R = DigBlock.run(P, world, o)
      world: {init() → s, act(s, op, args) → {s, dur, halt?} | null, sense(s, név, args, {t, id}) → érték | undefined,
              lerp(s0, s1, u) → s, halt?(s, {id, op, t}) → null | 'fajta' | {kind, ok, k}}
        (DigRobot.world ezt adja; world nélkül csak a vezérlés, az adat és a kimenet fut)
        MEGÁLLÁS (v1.1): ha az act eredményében halt áll, vagy a world.halt(s1) nem null, a frame után a futás leáll:
        end = 'világ', R.halt = {id, kind, ok (alap: false – hiba; true – pl. „célba ért”), k (felirat-kulcs), t (a
        frame vége)}. Pl. ütközésre: halt: (s) => (s.bump ? 'ütközés' : null); célra: {kind: 'cél', ok: true}.
      o = {maxSteps: 2000, seed: 1, tick: .15 (egy vezérlő/adat blokk látható ideje, mp), sayDur: 1, askDur: 1,
           vars: {kezdőértékek}, answers: ['11', {k: 'tizenegy válasz'}…] (a 'kérdezd' válaszai sorban),
           events: [{t, name: 'kattintáskor'|'gombra', target}] (az indítás után; egy szál: a kezelők sorban futnak),
           s0: a világ kezdőállapota (alap: world.init()) – pl. egy ütemnyi kiértékelés egy adott helyzetből}
      → R = {frames: [{t0, t1, id, op, s0, s1, vars, val, test: true|false|null, err, halt, reads: {név: érték} | null
             (a frame alatt olvasott szenzorok), mk: {loops: {id: kör}, tests: {id: logikai}}}], T,
             end: 'kész' | 'állj' | 'korlát' (maxSteps – „végtelen ciklus?”) | 'hiba' | 'világ' (a világ megállította),
             err: {id (a hibás blokk vagy kifejezés), sid (az utasítás), kind}, halt (fent) | null, s0 (kezdőállapot)}
      A ciklus fejléce minden körben kap egy frame-et (val: a kör sorszáma), a feltétel minden kiértékeléskor (test).
      Az mk a futó blokkok jelzése: új ciklus-körnél (és eseménykezelő / saját blokk indításakor) a törzs alatti
      blokkok jelzése törlődik, így csak az aktuális körben kiértékelt feltételek IGAZ/HAMIS-a látszik.
   R.at(t) → {i, frame, id (a futó blokk, a frame-ek közti szünetben és a végén null), u (0..1 a frame-en belül),
              s (a világ állapota: world.lerp), mk, vars: R.varsAt(t)}      tisztán az időből
   R.varsAt(t) → {név: {v, pv (előző érték), tc (a változás ideje)}} · R.doneAt(t) → Set(id) (legalább egyszer lefutott)
   R.next(t) / R.prev(t) → a következő / előző blokkhatár ideje („egy lépés”) · R.until(t, pred) → az első t-nél
      későbbi frame kezdete, ahol pred(frame) igaz (töréspont: f => bp.has(f.id)), vagy null
   R.count(t, pred) → a t-ig lefutott frame-ek száma, amelyekre pred igaz
   DigBlock.trace(frames, {T, end, err, s0, hist, world, halt}) – nyomvonal-objektum kész frame-ekből (a DigRobot.motor
      is ezt adja)

   const E = DigBlock.editor(L, {x, y, w, h, prog: P, edit: 'nincs' | 'paraméter' | 'sorrend' | 'teljes',

        a jel köré halvány keret kerül; a körben szereplő minden jel '<op> blokk' kulcsa kell a .md-be), onChange(P)})

   E.update()                a draw-ból, csak a látható, aktív jelenetben (L.pointer.events alapján)
   E.draw({a, run: R, t, hi: [id], dim: [id], place: (id, kind) => {dx, dy, a}, marks: true, mx, errAt, haltMark})
      a futó blokk cinóber keretet kap, a lefutott halvány pipát; a ciklusfejléc mellett „#. kör”, a feltétel mellett
      IGAZ / HAMIS; hiba: cinóber keret + '<fajta> hiba'; lépéskorlát: 'korlát felirat'. mx: a jelzések x-e (alap: a

   ── Segédek ──
   DigBlock.clock(L) → K       a futás órája L.st-ből (nem valós időből): visszaléptetés, QA (`__lesson.st`) azonos képet ad
      K.t(st = L.st) · K.start(T, {at: st, from}) (fut T-ig) · K.step(R) (a következő blokkhatárig) · K.pause() ·
      K.seek(t) · K.reset() · K.setSpeed(v) (Infinity = azonnal) · K.speed · K.running(st) · K.endSt() (mikor ér véget)
      · K.runTo(R, bp) (T-ig vagy az első töréspontig)
   DigBlock.controls(L, {clock: K, run: () => R, step: true, reset: true, speed: true, scale: 1, bp: () => Set,
        speeds: [{v: .5, k: 'lassú felirat'}, {v: 1, k: 'normál felirat'}, {v: 4, k: 'gyors felirat'},
                 {v: Infinity, k: 'azonnal felirat'}], value: 1})  → {run, step, reset, speed}
      gombok a panelen (L.button): 'futtatás gomb', 'egy lépés gomb', 'alaphelyzet gomb'; csúszka: 'sebesség csúszka'.

   DigBlock.watch(L, vars, {x, y, t, a, names, s}) → szélesség   változódobozok (címke + érték); vars: R.varsAt(t) vagy
      {név: érték}; változáskor a régi érték felfelé kiugrik, az új alulról beúszik (.3 mp).
   DigBlock.flow(L, P, {x, y, a, hi: id, edge: true}) → {w, h, boxes}  ugyanaz folyamatábrán: ovális start ('<esemény>
      blokk' vagy 'start felirat') és vége ('stop felirat'), téglalap, rombusz (elágazás, ciklus), visszacsatoló nyíl;
      edge: az ágak felirata ('igaz felirat' / 'hamis felirat'). bare (v1.1): a „ha”, „ha-különben”, „amíg” rombuszában
      csak a feltétel szövege (a „ha … akkor” keret nélkül). Kb. 12 csomópontig.
   DigBlock.text(P) → [{s, k, depth, id}]   pszeudokód-sorok a .md feliratokból (a hívó írja ki L.tx-szel)
   DigBlock.fmt(v) → '51,4' / '„alma”' / 'IGAZ' (a kiírt érték) · DigBlock.sfx(n, 'szor') → 'szor'|'szer'|'ször'
   DigBlock.CAT → a kategóriaszínek (szerződés 19.)
   ──────────────────────────────────────────────────────────────────────────────────────────────────────── */
const DigBlock = (() => {
  'use strict';
  const U = Lesson.U, F = Lesson.FONTS, { clamp, lerp, smooth } = U;
  const INK = '#1c2440', MUT = '#565d72', RED = '#c8401c', TEAL = '#0a6f86', CARD = '#fffaf1';
  const CAT = { esemény: '#1c2440', mozgás: '#0a6f86', toll: '#7b4fa0', vezérlés: '#8f5a0c', érzékelés: '#2a4d9b',
    adat: '#6b6a12', művelet: '#565d72', kimenet: '#8a2f5b', saját: '#8f5a0c' };
  let getL = () => null, ga = () => 1;
  const Lx = () => getL(), cx = () => getL().ctx;
  const al = (a) => { cx().globalAlpha = ga() * clamp(a); };
  const has = (k) => { const L = Lx(); return !!(L && L.content && L.content.labels && L.content.labels[k] != null); };
  const lab = (k) => { const L = Lx(); return L ? L.lab(k) : k; };
  const bind = (o = {}) => { if (o.L) getL = o.L; if (o.ga) ga = o.ga; };

  /* ── katalógus ── */
  const A = (t, o) => Object.assign({ t }, o || {});
  const NUM = (o) => A('szám', Object.assign({ min: -999, max: 999, step: 1 }, o));
  const COLS = ['tinta', 'cinóber', 'kékeszöld', 'lila', 'okker', 'kék'];
  const BLOCKS = {
    'indításkor': { cat: 'esemény', args: [], body: 1, shape: 'esemény' },
    'kattintáskor': { cat: 'esemény', args: [A('választó')], body: 1, shape: 'esemény' },
    'gombra': { cat: 'esemény', args: [A('választó')], body: 1, shape: 'esemény' },
    'lépj': { cat: 'mozgás', args: [NUM({ min: -500, max: 500, step: 10 })], world: true },
    'fordulj': { cat: 'mozgás', args: [A('irány', { opts: ['jobbra', 'balra'] }), NUM({ min: 0, max: 360, step: 10 })], world: true },
    'lépj egyet': { cat: 'mozgás', args: [], world: true },
    'fordulj balra': { cat: 'mozgás', args: [], world: true },
    'fordulj jobbra': { cat: 'mozgás', args: [], world: true },
    'tollat le': { cat: 'toll', args: [], world: true },
    'tollat fel': { cat: 'toll', args: [], world: true },
    'tollszín': { cat: 'toll', args: [A('választó', { opts: COLS })], world: true },
    'ismételd': { cat: 'vezérlés', args: [NUM({ min: 1, max: 360, step: 1 })], body: 1 },
    'amíg': { cat: 'vezérlés', args: [A('logikai')], body: 1 },
    'mindig': { cat: 'vezérlés', args: [], body: 1 },
    'ha': { cat: 'vezérlés', args: [A('logikai')], body: 1 },
    'ha-különben': { cat: 'vezérlés', args: [A('logikai')], body: 2 },
    'várj': { cat: 'vezérlés', args: [NUM({ min: 0, max: 10, step: .5 })] },
    'állj': { cat: 'vezérlés', args: [] },
    'érzékelő': { cat: 'érzékelés', args: [A('választó')], shape: 'érték' },
    'ütközik?': { cat: 'érzékelés', args: [], shape: 'feltétel', sense: 'ütközik' },
    'fal elöl?': { cat: 'érzékelés', args: [], shape: 'feltétel', sense: 'fal elöl' },
    'fal jobbra?': { cat: 'érzékelés', args: [], shape: 'feltétel', sense: 'fal jobbra' },
    'fal balra?': { cat: 'érzékelés', args: [], shape: 'feltétel', sense: 'fal balra' },
    'legyen': { cat: 'adat', args: [A('változó'), A('érték')] },
    'növeld': { cat: 'adat', args: [A('változó'), NUM()] },
    'változó': { cat: 'adat', args: [A('változó')], shape: 'érték' },
    'kérdezd': { cat: 'kimenet', args: [A('szöveg')] },
    'válasz': { cat: 'adat', args: [], shape: 'érték' },
    '+': { cat: 'művelet', args: [A('érték'), A('érték')], shape: 'érték' },
    '−': { cat: 'művelet', args: [A('érték'), A('érték')], shape: 'érték' },
    '·': { cat: 'művelet', args: [A('érték'), A('érték')], shape: 'érték' },
    ':': { cat: 'művelet', args: [A('érték'), A('érték')], shape: 'érték' },
    '<': { cat: 'művelet', args: [A('érték'), A('érték')], shape: 'feltétel' },
    '>': { cat: 'művelet', args: [A('érték'), A('érték')], shape: 'feltétel' },
    '=': { cat: 'művelet', args: [A('érték'), A('érték')], shape: 'feltétel' },
    '≤': { cat: 'művelet', args: [A('érték'), A('érték')], shape: 'feltétel' },
    '≥': { cat: 'művelet', args: [A('érték'), A('érték')], shape: 'feltétel' },
    'és': { cat: 'művelet', args: [A('logikai'), A('logikai')], shape: 'feltétel' },
    'vagy': { cat: 'művelet', args: [A('logikai'), A('logikai')], shape: 'feltétel' },
    'nem': { cat: 'művelet', args: [A('logikai')], shape: 'feltétel' },
    'összefűz': { cat: 'művelet', args: [A('érték'), A('érték')], shape: 'érték' },
    'véletlen': { cat: 'művelet', args: [NUM(), NUM()], shape: 'érték' },
    'mondd': { cat: 'kimenet', args: [A('érték')] },
    'lépés': { cat: 'saját', args: [A('kulcs', { hide: true })], world: true },
  };
  for (const k in BLOCKS) { const b = BLOCKS[k]; b.body = b.body || 0; b.shape = b.shape || 'utasítás'; }
  function def(op, d = {}) {
    BLOCKS[op] = Object.assign({ cat: 'saját', args: [], body: 0, shape: 'utasítás', world: true }, d, { cat: 'saját' });
    return BLOCKS[op];
  }
  const isEvent = (n) => n && BLOCKS[n.op] && BLOCKS[n.op].shape === 'esemény';

  /* ── program-adatszerkezet ── */
  let UID = 0;
  function lit(x, d) {
    if (x && typeof x === 'object' && !Array.isArray(x)) {
      if (x.k != null && x.v == null) return { v: null, k: x.k, m: null };
      const m = {}; ['min', 'max', 'step', 'opts', 'lock'].forEach((q) => { if (x[q] != null) m[q] = x[q]; });
      return { v: x.v, k: x.k || null, m: Object.keys(m).length ? m : null };
    }
    return { v: x, k: null, m: null };

  const f = R.frames.find((q) => q.id === ID.f1);
  BUG.I = I; BUG.R = R; BUG.cell = f ? [Math.floor(f.s0.x), Math.floor(f.s0.y)] : null; BUG.stop = [Math.floor(I.sEnd.x), Math.floor(I.sEnd.y)];
  BUG.dirOk = f ? f.s0.dir + 90 : 0;
}
function cellMark(V, cx, cy, k, col, a, above) {
  const [X, Y] = V.px(cx + .5, cy + .5);
  al(a); c.beginPath(); c.arc(X, Y, V.s * .46, 0, TAU); c.strokeStyle = col; c.lineWidth = 4; c.setLineDash([7, 5]); c.stroke(); c.setLineDash([]);
  const yy = above ? Y - V.s * .46 - 22 : Y + V.s * .46 + 22, xx = clamp(X, V.x + 130, V.x + V.w - 130);
  al(a); L.pill(lab(k), xx, yy, { k, a: 'center', s: 22, w: 700, f: F.B, c: '#ffffff', bg: col, pad: 8 });
}
function scene6(st, a, act) {
  al(a); T('program felirat', 40, 112, HEAD); T('útvesztő felirat', 660, 112, HEAD);
  const { R, t, V } = unitScene(S6, st, a, act);
  al(a); PN('pálya felirat', [fmt(S6.M.no)], 1340, 104, { a: 'right', s: 22, w: 700, f: F.B, c: INK, bg: CARD, bd: LINE, pad: 8 });
  const id = atBp(S6, R, t, st); if (id) bpNote(S6, id, a);
  if (id === ID.f1 && BUG.cell && S6.I.end !== 'kint') cellMark(V, BUG.cell[0], BUG.cell[1], 'itt kezdődött felirat', OKR, a, true);
  const fin = t >= R.T - 1e-6, fixed = S6.edits > 0 && S6.I.end === 'kint';
  if (fin && S6.I.end === 'fal') { const u = smooth((st - S6.K.endSt() - .3) / .4); cellMark(V, Math.floor(S6.I.sEnd.x), Math.floor(S6.I.sEnd.y), 'itt akadt felirat', BAD, a * u, false); }
  if (fin && fixed && BUG.cell) {
    const u = smooth((st - S6.K.endSt() - .3) / .4);
    cellMark(V, BUG.cell[0], BUG.cell[1], 'itt kezdődött felirat', OKR, a * u, true);
    al(a * u); const p = L.pill(lab('javítva felirat'), 660, 790, { k: 'javítva felirat', s: 26, w: 700, f: F.B, c: '#ffffff', bg: GOOD, pad: 14 }); tick(p.x + p.w + 28, 790, 16, GOOD, a * u);
  }
  testCard(660, 650, a, S6, t, { st, endSt: S6.K.endSt() });
  al(a); PN('változtatás felirat', [fmt(S6.edits)], 660, 880, { s: 22, w: 600, f: F.B, c: MUT, bg: CARD, bd: LINE, pad: 9 });
  stamp('modell', 1340, 1030, a, { al: 'right' });
}

/* ════════ 7. Teszttábla: négy pálya, ugyanaz a program ════════ */
const P7 = Tip(['kijut 4 tipp', 'körbe tipp', 'megáll tipp'], 'körbe tipp');
const BOX7 = [0, 1, 2, 3].map((i) => ({ x: 40 + (i % 2) * 660, y: 292 + Math.floor(i / 2) * 362, w: 640, h: 340 }));
const S7m = { k: 0 };
const T7 = { K: null, U: [] };
function build7() {
  const maps = [mapA(), mapB(), mapC(S7m.k), mapD()];
  T7.U = maps.map((M, i) => { const Z = mazeWorld(M), R = runOn(DigBlock.prog(RULE()), Z); return { M, Z, R, I: analyze(R, Z), box: BOX7[i] }; });
  T7.T = Math.max(...T7.U.map((u) => u.R.T));
}
const SC7 = 10;
const tExp7 = () => { const d = T7.U[3]; return .5 + (d.I.rep ? d.I.rep.t : 4) / SC7 + .4; };
function scene7(st, a, act) {
  tipHead(P7, st, a, 'sziget kérdés felirat', { tExp: tExp7() });
  tipFeedback(P7, st, a, 820, 46);
  al(a); T('teszttábla felirat', 40, 262, HEAD);
  stamp('modell', 40, 1030, a); stamp('kitalált', 260, 1030, a);
  const t = T7.K ? T7.K.t(st) : 0;
  T7.U.forEach((u, i) => {
    const B = u.box, inner = { x: B.x, y: B.y + 44, w: B.w, h: B.h - 44 }, V = mview(u.M, inner);
    const s = drawMaze(u.Z, V, a, u.R, t, u.I, {});
    al(a); const tp = u.M.no === 3 ? PN('véletlen felirat', [fmt(3)], B.x, B.y + 18, { s: 22, w: 700, f: F.B, c: INK, bg: CARD, bd: LINE, pad: 8 })
      : PN('pálya felirat', [fmt(u.M.no)], B.x, B.y + 18, { s: 22, w: 700, f: F.B, c: INK, bg: CARD, bd: LINE, pad: 8 });
    if (u.M.pillar) {                       // jelmagyarázat: sávozott négyzet = sziget
      const lx = tp.x + tp.w + 18, ly = B.y + 18; drawPillar({ pillar: [0, 0] }, { px: () => [lx - 3, ly - 15], s: 30 }, a);
      al(a); T('sziget felirat', lx + 34, ly + 1, { s: 22, w: 700, f: F.B, c: OKR, b: 'middle' });
    }
    // kimenet
    const fin = t >= u.R.T - 1e-6;
    if (fin) {
      const ok = u.I.end === 'kint';
      al(a); const r2 = L.pill(outcomeText(u.I), B.x + B.w - 46, B.y + 18, { k: outcomeKey(u.I), a: 'right', s: 22, w: 700, f: F.B, c: ok ? GOOD : BAD, bg: CARD, bd: ok ? GOOD : BAD, bw: 2.5, pad: 9 });
      (ok ? tick : cross)(B.x + B.w - 20, B.y + 18, 13, ok ? GOOD : BAD, a);
      void r2;
    }
    // végtelen ciklus: ugyanoda ért, ugyanarra nézve
    const rp = u.I.rep;
    if (rp && t >= rp.t) {
      const n = u.I.reps.filter((q) => q <= t + 1e-9).length + 1;
      const [X, Y] = V.px(rp.x + .5, rp.y + .5);
      al(a); c.beginPath(); c.arc(X, Y, V.s * .5, 0, TAU); c.strokeStyle = RED; c.lineWidth = 3.5; c.setLineDash([6, 5]); c.stroke(); c.setLineDash([]);
      al(a); const rp2 = PN('ismétlődik felirat', [fmt(n)], B.x, B.y + B.h + 32, { s: 22, w: 700, f: F.B, c: RED, bg: CARD, bd: RED, pad: 8 });
      if (fin && u.I.end === 'korlát') { al(a); L.pill(lab('korlát felirat'), rp2.x + rp2.w + 14, B.y + B.h + 32, { k: 'korlát felirat', s: 22, w: 700, f: F.B, c: '#ffffff', bg: RED, pad: 8 }); }
    }
  });
}
P7.on = () => { T7.K.seek(0); T7.K.start(T7.T, { at: P7.gt + .5, from: 0 }); };
function newMap7() { S7m.k++; build7(); T7.K.seek(0); T7.K.start(T7.T); }

/* ════════ 8. Összefoglalás: a kör ════════ */
function scene8(st, a) {
  const cx = 680, cy = 540, R0 = 300, ks = ['tervezés', 'kódolás', 'tesztelés', 'javítás'], cols = [INK, TEAL, OKR, RED];
  const u0 = smooth((st - .2) / .6);
  al(a * u0); c.strokeStyle = 'rgba(28,36,64,.25)'; c.lineWidth = 4; c.setLineDash([10, 9]); c.beginPath(); c.arc(cx, cy, R0, 0, TAU); c.stroke(); c.setLineDash([]);
  for (let j = 0; j < 4; j++) {          // nyílhegyek a körön (óramutató szerint)
    const an = -Math.PI / 2 + (j + .5) * Math.PI / 2, x = cx + Math.cos(an) * R0, y = cy + Math.sin(an) * R0, tg = an + Math.PI / 2;
    al(a * u0); arrowTo(x - Math.cos(tg) * 20, y - Math.sin(tg) * 20, x + Math.cos(tg) * 6, y + Math.sin(tg) * 6, 'rgba(28,36,64,.45)', 4, 18);
  }
  const pa = -Math.PI / 2 + ((st * .35) % 1) * TAU;      // körbefutó pötty
  al(a * u0); c.beginPath(); c.arc(cx + Math.cos(pa) * R0, cy + Math.sin(pa) * R0, 10, 0, TAU); c.fillStyle = RED; c.fill();
  ks.forEach((k, j) => {
    const an = -Math.PI / 2 + j * Math.PI / 2, x = cx + Math.cos(an) * R0, y = cy + Math.sin(an) * R0, u = smooth((st - .4 - j * .35) / .5);
    al(a * u); const p = L.pill(lab(k + ' kártya'), x, y, { k: k + ' kártya', a: 'center', s: 30, w: 700, f: F.B, c: '#ffffff', bg: cols[j], pad: 16 });
    const ty = j === 0 ? p.y - 26 : p.y + p.h + 26, side = j === 1 ? 'left' : j === 3 ? 'right' : 'center', tx = j === 1 ? cx + R0 + 24 : j === 3 ? cx - R0 - 24 : x;
    al(a * u); T(k + ' példa', tx, ty, { a: side, s: 24, w: 600, f: F.B, c: MUT, b: 'middle', max: 340 });
  });
  const um = smooth((st - 2) / .6);
  al(a * um); T('kör felirat közép', cx, cy, { a: 'center', b: 'middle', s: 28, w: 500, f: F.D, i: true, c: INK, max: 420 });
}

/* ════════ a lecke ════════ */
const SCENES = [scene1, scene2, scene3, scene4, scene5, scene6, scene7, scene8];
const SETTLE = [4, 6, 1.5, 9, 4, 7, 1.5, 4];
L = Lesson.create({
  content: window.LESSON_CONTENT, home: false, resetCtx: true,
  steps: [
    { settle: SETTLE[0],
      controls() {
        L.button(lab('lépj gomb'), () => press('L'), 'lépj gomb');
        L.button(lab('jobbra gomb'), () => press('J'), 'jobbra gomb');
        L.button(lab('balra gomb'), () => press('B'), 'balra gomb');
        L.button(lab('újra gomb'), () => { S1m.moves = []; S1.reset(movesSpec([])); }, 'újra gomb');
      },
      enter() { S1m.moves = []; S1m.flash = -9; S1m.full = -9; S1.reset(movesSpec([])); S1.K.setSpeed(1.5); } },
    { settle: SETTLE[1], controls() { S2.controls(); }, enter() { S2.reset(); S2.autorun(1); } },
    { settle: SETTLE[2],
      controls() { tipControls(P3); const k = S3.controls({ step: false, reset: false, speed: false }); TB3.length = 0; TB3.push(k.run); TB3.forEach((b) => { b.disabled = !P3.guess; }); },
      enter() { tipReset(P3); S3.reset(); veilIf(P3); } },
    { settle: SETTLE[3],
      controls() { S4.controls(); L.button(lab('pálya gomb'), () => { S4m.i = (S4m.i + 1) % MAPS4.length; S4.setMap(MAPS4[S4m.i]()); S4.autorun(L.st); }, 'pálya gomb'); },
      enter() { S4m.i = 0; S4.setMap(MAPS4[0]()); S4.reset(); S4.autorun(1); } },
    { settle: SETTLE[4], controls() { S5.controls(); },
      enter() { S5.reset(); S5.E.bp.add(ID.f3); const b = S5.R.until(0, (f) => S5.E.bp.has(f.id)); S5.K.seek(0); S5.K.start(b, { at: 1, from: 0 }); } },
    { settle: SETTLE[5], controls() { S6.controls(); }, enter() { S6.reset(); S6.autorun(1); } },
    { settle: SETTLE[6],
      controls() { tipControls(P7); L.button(lab('új pálya gomb'), newMap7, 'új pálya gomb'); },
      enter() { tipReset(P7); S7m.k = 0; build7(); T7.K.reset(); veilIf(P7); } },
    { settle: SETTLE[7] },
  ],
  idle() { return ![S1, S2, S3, S4, S5, S6].some((S) => S.E && S.E.busy()); },
  init(Lx) {
    L = Lx;
    for (const S of [S1, S2, S3, S4, S5, S6]) S.init();
    T7.K = DigBlock.clock(L); T7.K.setSpeed(SC7); build7(); bugInfo();
    L.checks = () => {
      const res = [], rule = DigBlock.prog(RULE()), go = (M, P) => { const Z = mazeWorld(M), R = runOn(P, Z); return analyze(R, Z); };
      const hand = DigBlock.prog(handSpec(true));
      const a1 = go(mapA(), hand), b1 = go(mapB(), hand);
      res.push({ name: 'kézi program: 1. pálya kijut, 2. pálya falnak megy', ok: a1.end === 'kint' && b1.end === 'fal', got: a1.end + ' / ' + b1.end, want: 'kint / fal' });
      const ends = [mapA(), mapB(), mapC(0)].map((M) => go(M, rule).end);
      res.push({ name: 'jobbkéz-szabály: 1–3. pálya kijut', ok: ends.every((e) => e === 'kint'), got: ends.join(' '), want: 'kint kint kint' });
      const d = go(mapD(), rule);
      res.push({ name: '4. pálya (sziget): körbe jár, a lépéskorlát állítja meg', ok: d.end === 'korlát' && !!d.rep, got: d.end + ' ' + (d.rep ? d.rep.k : '-'), want: 'korlát' });
      let bad = 0; for (let k = 0; k < 60; k++) { const w = 5 + (k % 6), h = 4 + (k % 4), M = Object.assign(genMaze(w, h, 1000 + 31 * k), { start: { x: 0, y: h - 1, dir: 90 }, exit: { x: w - 1, y: k % h, d: 1 } }); if (go(M, rule).end !== 'kint') bad++; }
      res.push({ name: '60 véletlen tökéletes útvesztő: mindből kijut', ok: bad === 0, got: bad, want: 0 });
      const bg = BUG.I, fx = go(mapB(), rule);
      res.push({ name: 'hibás szabály: falnak megy, máshol, mint ahol először rossz irányba fordul; javítva kijut', ok: bg.end === 'fal' && BUG.cell && (BUG.cell[0] !== BUG.stop[0] || BUG.cell[1] !== BUG.stop[1]) && fx.end === 'kint', got: bg.end + ' ' + BUG.cell + ' → ' + BUG.stop, want: 'fal, két külön mező' });
      // a sziget falai nem érnek más falhoz
      const D = mapD(), [px, py] = D.pillar, Wd = mazeWorld(D).W; let touch = 0;
      [[px, py], [px + 1, py], [px, py + 1], [px + 1, py + 1]].forEach(([vx, vy]) => {
        const es = [['h', vx - 1, vy], ['h', vx, vy], ['v', vx, vy - 1], ['v', vx, vy]];
        es.forEach(([tp, x, y]) => { const isP = (tp === 'h' && x === px && (y === py || y === py + 1)) || (tp === 'v' && y === py && (x === px || x === px + 1)); if (!isP && Wd.edgeSet.has(tp + ',' + x + ',' + y)) touch++; });
      });
      res.push({ name: 'a sziget különálló (nem ér más falhoz)', ok: touch === 0, got: touch, want: 0 });
      return res;
    };
  },
  draw(Lx) {
    c = L.ctx; background(); CUR = null;
    for (let i = 0; i < SCENES.length; i++) {
      const w = clamp(1 - Math.abs(L.sp - i) * 2); if (w <= .001) continue;
      const st = i === L.step ? L.st : SETTLE[i];
      GA = 1; SCENES[i](st, w, i === L.step && w > .5); c.globalAlpha = 1; GA = 1;
    }
    L.canvas.style.cursor = CUR || '';
  },
});
/* QA-állapotok (1-alapú lépésszám) */
const guessQA = (P, k) => (L2) => { P.guess = k; P.gt = L2.st - 30; tipHide(P); panelVeil(false); if (P.on) P.on(k); };
const drive = (mv) => (L2) => { S1m.moves = mv.slice(); S1.reset(movesSpec(S1m.moves)); S1.K.seek(S1.R.T); };
const PATH1 = ['L', 'L', 'L', 'L', 'B', 'L', 'J', 'L', 'L', 'L'];
window.__qaStates = {
  1: [{ name: 'félúton', set: drive(PATH1.slice(0, 5)) }, { name: 'kijutott', set: drive(PATH1) },
    { name: 'fal-előtte', set: (L2) => { drive(['L', 'L'])(L2); press('J'); S1.K.seek(S1.R.T); press('L'); } },
    { name: 'túl-hosszú', set: (L2) => { drive(['J', 'J', 'J', 'B', 'J', 'B', 'J', 'B', 'J'])(L2); press('B'); } }],
  2: [{ name: 'fut-közben', set: (L2) => { S2.autorun(L2.st - 1); } }, { name: 'egy-lépés', set: () => { S2.K.reset(); for (let i = 0; i < 3; i++) S2.K.seek(S2.R.next(S2.K.t())); } },
    { name: 'elrontva', set: (L2) => { S2.E.setParam('0.b.0', 0, 5); S2.get(false); S2.edits = 1; S2.K.start(S2.R.T, { at: L2.st - 30, from: 0 }); } }],
  3: [{ name: 'tipp-jó', set: guessQA(P3, 'elakad tipp') }, { name: 'tipp-rossz', set: guessQA(P3, 'kijut tipp') },
    { name: 'fut-közben', set: (L2) => { guessQA(P3, 'másik kijárat tipp')(L2); P3.gt = L2.st - 2.5; S3.autorun(P3.gt + .6); } }],
  4: [{ name: 'fut-közben', set: (L2) => { S4.autorun(L2.st - 2); } },
    { name: '2-pálya', set: (L2) => { S4m.i = 1; S4.setMap(MAPS4[1]()); S4.K.start(S4.R.T, { at: L2.st - 60, from: 0 }); } },
    { name: '3-pálya', set: (L2) => { S4m.i = 2; S4.setMap(MAPS4[2]()); S4.K.start(S4.R.T, { at: L2.st - 60, from: 0 }); } }],
  5: [{ name: 'egy-lépés', set: () => { S5.K.step(S5.R); S5.K.seek(S5.R.next(S5.K.t())); } },
    { name: 'új-töréspont', set: () => { S5.E.toggleBp(ID.f1); S5.get(false); S5.K.seek(S5.R.until(S5.K.t(), (f) => S5.E.bp.has(f.id))); } },
    { name: 'fut-vége', set: () => { S5.E.bp.clear(); S5.K.seek(S5.R.T); } }],
  6: [{ name: 'fut-közben', set: (L2) => { S6.autorun(L2.st - 2.5); } }, { name: 'hibás-program', set: () => { S6.K.seek(S6.R.T); } },
    { name: 'töréspont', set: () => { S6.E.toggleBp(ID.f1); S6.get(false); S6.K.seek(S6.R.until(0, (f) => S6.E.bp.has(f.id))); } },
    { name: 'javítva', set: (L2) => { S6.E.setParam(ID.f1, 0, 'jobbra'); S6.get(false); S6.edits = 1; S6.K.start(S6.R.T, { at: L2.st - 30, from: 0 }); } },
    { name: 'rossz-javítás', set: (L2) => { S6.E.setParam(ID.f3, 0, 'jobbra'); S6.get(false); S6.edits = 1; S6.K.start(S6.R.T, { at: L2.st - 300, from: 0 }); } }],
  7: [{ name: 'tipp-jó', set: guessQA(P7, 'körbe tipp') }, { name: 'tipp-rossz', set: guessQA(P7, 'kijut 4 tipp') },
    { name: 'fut-közben', set: (L2) => { guessQA(P7, 'megáll tipp')(L2); P7.gt = L2.st - 2; P7.on(); } },
    { name: 'korlát', set: (L2) => { guessQA(P7, 'körbe tipp')(L2); T7.K.seek(T7.T); } },
    { name: 'új-pálya', set: (L2) => { guessQA(P7, 'körbe tipp')(L2); S7m.k = 1; build7(); T7.K.seek(0); T7.K.start(T7.T, { at: L2.st - 60, from: 0 }); } }],
};

})();
