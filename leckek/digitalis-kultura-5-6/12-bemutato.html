<script>
(function () {
'use strict';

/* ── MODUL: „Tippelj!” és bélyegek (TtTipp) · forrás: termeszettudomany-5-6/01-tocsa + 03-meres, egységesítve 2026-11-24 ── */
/* A természettudomány 5–6. sorozat közös mintái (szerződés 17.): kísérlet-/modellbélyeg és a „Tippelj! → kísérlet →
   magyarázat” jóslat. Csak a Lesson motorra épül (L.ctx, L.tx, L.pill, L.lab, L.button, L.controlsEl, L.panel, L.st,
   Lesson.U, Lesson.FONTS); a lecke kódjára nem hivatkozik. A panel elmosásához szükséges CSS-t (.tt-rejtett) és a
   letiltott csúszka halványítását a modul maga teszi a <head>-be – a leckében nem kell <style>-sor.

   BEKÖTÉS (a lecke kódjában, egyszer, legfelső szinten – a getterek miatt a sorrend mindegy):
     TtTipp.bind({ L: () => L, ga: () => GA });    // ga: a lecke alap-alfája (jelenet-áttűnés); alap: () => 1
     const { stamp, Tip, tipReset, panelVeil, veilIf, tipGuess, tipHide, tipControls, tipU, rhythm, tipHead, tipRow,
       tipFeedback } = TtTipp;
   ALFA: minden rajzoló a globalAlpha-t ga() · a (· belső áttűnés) értékre ÁLLÍTJA (nem szoroz a pillanatnyival, így
   egy korábbi halvány felirat nem tünteti el), a vonalstílust (lineCap/lineJoin/setLineDash) visszaállítja.

   stamp(kind, x, y, a, o) → doboz | null       kísérlet-/modellbélyeg a KemGHS.stamp stílusával (Bricolage 22 px,
        600, betűköz 0,08 em, −3°, papír alap, 2 px keret; 'tilos': 700, 3 px). (x, y): a bal szél közepe.
        Szöveg: az o.k || '<kind> bélyeg' .md-kulcs. Szín (STAMP): otthon kékeszöld, felnőtt okker, tilos #b3261e;
        tanári, modell, kitalált, nem méretarányos, sematikus, vázlatos, képzeletbeli (és minden más) halvány tinta.
        o = {k, col (szín felülírása), rot: −3 (fok), al: 'left' (igazítás)}. a ≤ 0,005 → nem rajzol.
   Tip(keys, ok) → P      jóslat-állapot. keys: a válaszok .md-kulcsai (egyben gombfeliratok), ok: a helyes kulcs (az
        init-ben is beállítható: P.ok = …). P = {keys, ok, guess: null | kulcs, gt: a választás L.st-je, btns, on}.
        P.on(k): választáskor hívódik (a lecke állítja, pl. a kísérlet vezérlőinek feloldására).
   tipReset(P)            alaphelyzet (az enter()-ben; utána veilIf(P)).
   panelVeil(on)          a panelszöveg 2. bekezdésétől (.lp-text > *, i > 0) elmos (on) / felold.
   veilIf(P)              panelVeil(!P.guess) – az enter()-ben a tipReset után.
   tipControls(P)         a tippgombok (L.button, P.keys sorrendben). A választás után csak ezek tűnnek el: a
        sorukba utána tett más gombok maradnak (ha a sorban nem marad látható gomb, a sor is eltűnik).
   tipGuess(P, k, gt)     választás (csak az első számít): P.guess = k, P.gt = gt ?? L.st, tipHide, panelVeil(false),
        P.on(k). A QA-állapotok is ezt hívhatják (pl. gt = L.st − 30: a kísérlet már lefutott).
   tipHide(P)             a tippgombok elrejtése (a tipGuess hívja; QA-állapotban kézzel is).
   tipU(P, st) → mp       a választás óta eltelt idő (st − P.gt), −1, ha még nincs tipp.
   rhythm(ph, a)          a „Tippelj! → kísérlet → magyarázat” sáv a vászon bal felső sarkában (x 40, y 46);
        ph: 0 / 1 / 2 az aktív szakasz.
   tipHead(P, st, a, qk, o) → y     fejléc: sáv + kérdés (qk, (40, 116), Fraunces 38, max 1280) + válaszsor (40, y).
        o = {tExp: 4,5 (a kísérlet hossza mp-ben: ennyi után vált a sáv „magyarázat”-ra, és mutatja a helyes
        választ), q2 (2. kérdéssor kulcsa, (40, 162); a válaszsor 46 px-szel lejjebb kerül), qv (a kérdés #-jeleinek
        értékei, sorban), y: 178 (a válaszsor közepe), noRhythm (a sáv nélkül – pl. olvasási kérdésnél)}.
        Visszaad: a válaszsor y-ja.
   tipRow(P, st, a, x, y, o) → [dobozok]    csak a válaszsor (a tipHead is ezt rajzolja), bárhová: a választásig
        semleges; a választott cinóber keretet és alatta „a te tipped” feliratot kap; o.tExp (0) mp múlva a helyes
        zöld keretet + pipát kap, a többi elhalványul. Dobozköz 54 px (a pipának).
   tipFeedback(P, st, a, x, y, o) → doboz | null    „Jó tipp!” (zöld) / „Sokan gondolják így – nézzük meg!”
        (kékeszöld) pill (x: bal szél, y: közép), a választás után 0,15 mp-cel beúszva. o = {s: 24, al: 'left', max}.
   .md-kulcsok (### Feliratok): tippelj felirat, kísérlet felirat, magyarázat felirat, a te tipped felirat, jó tipp
        felirat, rossz tipp felirat; a bélyegeké '<kind> bélyeg'.
   ──────────────────────────────────────────────────────────────────────────────────────────────────────── */
const TtTipp = (() => {
  'use strict';
  const U = Lesson.U, F = Lesson.FONTS, { clamp, lerp, smooth } = U;
  const INK = '#1c2440', MUT = '#565d72', RED = '#c8401c', TEAL = '#0a6f86', GOOD = '#1d7a45', BAD = '#b3261e', OKR = '#8f5a0c', CARD = '#fffaf1';
  const STAMP = { otthon: TEAL, felnőtt: OKR, tilos: BAD, tanári: MUT, modell: MUT, kitalált: MUT, 'nem méretarányos': MUT, sematikus: MUT, vázlatos: MUT, képzeletbeli: MUT };
  const KEYS = { ph: ['tippelj felirat', 'kísérlet felirat', 'magyarázat felirat'], mine: 'a te tipped felirat', ok: 'jó tipp felirat', bad: 'rossz tipp felirat' };
  let getL = () => null, ga = () => 1;
  if (typeof document !== 'undefined' && !document.getElementById('tt-tipp-css')) {
    const st = document.createElement('style'); st.id = 'tt-tipp-css';
    st.textContent = '.lp-text > .tt-rejtett { filter: blur(7px); opacity: .5; user-select: none; transition: filter .6s, opacity .6s; }\n'
      + '.lp-slider:has(input:disabled) { opacity: .45; }\n.lp-slider input:disabled { cursor: not-allowed; }';
    document.head.appendChild(st);
  }
  const Lx = () => getL(), cx = () => getL().ctx, lab = (k) => getL().lab(k);
  const al = (a) => { cx().globalAlpha = ga() * clamp(a); };
  const fillIn = (s, v) => { let i = 0; return s.replace(/#/g, () => (i < v.length ? v[i++] : '#')); };
  const rr = (c, x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, w, h, r); };
  function check(x, y, a) {                 // pipa (rajz, nem betűjel)
    const c = cx(); al(a); c.lineWidth = 4.5; c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = GOOD; c.beginPath();
    c.moveTo(x - 10, y); c.lineTo(x - 3, y + 8); c.lineTo(x + 11, y - 9); c.stroke(); c.lineCap = 'butt'; c.lineJoin = 'miter';
  }
  function arrow(x1, y1, x2, y2, col, w, hs) {
    const c = cx(), an = Math.atan2(y2 - y1, x2 - x1), bx = x2 - Math.cos(an) * hs * .8, by = y2 - Math.sin(an) * hs * .8;
    c.setLineDash([]); c.lineCap = 'round'; c.beginPath(); c.moveTo(x1, y1); c.lineTo(bx, by); c.strokeStyle = col; c.lineWidth = w; c.stroke(); c.lineCap = 'butt';
    c.beginPath(); c.moveTo(x2, y2); c.lineTo(x2 - hs * Math.cos(an - .45), y2 - hs * Math.sin(an - .45)); c.lineTo(x2 - hs * Math.cos(an + .45), y2 - hs * Math.sin(an + .45)); c.closePath();
    c.fillStyle = col; c.fill();
  }

  function bind(o = {}) { if (o.L) getL = o.L; if (o.ga) ga = o.ga; }
  function stamp(kind, x, y, a, o = {}) {
    if (a <= .005) return null;
    const L = Lx(), c = L.ctx, k = o.k || (kind + ' bélyeg'), col = o.col || STAMP[kind] || MUT, tilos = kind === 'tilos';
    c.save(); al(a); c.translate(x, y); c.rotate((o.rot == null ? -3 : o.rot) * Math.PI / 180);
    const b = L.pill(lab(k), 0, 0, { s: 22, w: tilos ? 700 : 600, ls: '0.08em', f: F.B, bg: CARD, bd: col, bw: tilos ? 3 : 2, c: col, r: 6, pad: 10, k, qa: false, a: o.al || 'left' });
    c.restore(); return b;
  }
  const Tip = (keys, ok) => ({ keys, ok, guess: null, gt: -99, btns: [], on: null });
  function tipReset(P) { P.guess = null; P.gt = -99; }
  function panelVeil(on) {
    const L = Lx(); if (!L || !L.panel) return;
    L.panel.querySelectorAll('.lp-text > *').forEach((p, i) => { if (i > 0) p.classList.toggle('tt-rejtett', !!on); });
  }
  const veilIf = (P) => panelVeil(!P.guess);
  function tipHide(P) {
    const rows = new Set();
    (P.btns || []).forEach((b) => { b.style.display = 'none'; if (b.parentNode) rows.add(b.parentNode); });
    rows.forEach((r) => { if (![...r.children].some((e) => e.style.display !== 'none')) r.style.display = 'none'; });
  }
  function tipGuess(P, k, gt) {
    if (P.guess) return;
    P.guess = k; P.gt = gt == null ? Lx().st : gt;
    tipHide(P); panelVeil(false);
    if (P.on) P.on(k);
  }
  function tipControls(P) { const L = Lx(); P.btns = P.keys.map((k) => L.button(lab(k), () => tipGuess(P, k), k)); }
  const tipU = (P, st) => (P.guess ? st - P.gt : -1);
  function rhythm(ph, a) {
    const L = Lx(), cols = [RED, TEAL, OKR];
    let x = 40;
    KEYS.ph.forEach((k, j) => {
      const on = ph === j, done = ph > j;
      al(a * (on ? 1 : done ? .7 : .4));
      const b = L.pill(lab(k), x, 46, { k, s: 22, w: 700, f: F.B, c: on ? '#ffffff' : cols[j], bg: on ? cols[j] : CARD, bd: cols[j], bw: 2, pad: 10 });
      x = b.x + b.w;
      if (j < 2) { al(a * .55); arrow(x + 8, 46, x + 34, 46, MUT, 3, 11); x += 44; }
    });
  }
  function tipRow(P, st, a, x, y, o = {}) {
    const L = Lx(), c = L.ctx, u = tipU(P, st), tx = o.tExp || 0, out = [];
    const rev = P.guess ? smooth((u - tx) / .5) : 0;
    P.keys.forEach((k) => {
      const mine = P.guess === k, ok = k === P.ok, g = rev * (ok ? 1 : 0);
      al(a * (P.guess && !mine && !ok ? lerp(1, .55, rev) : 1));
      const b = L.pill(lab(k), x, y, { k, s: 26, w: 600, f: F.B, c: INK, bg: g > .5 ? '#eef6ee' : CARD, bd: g > .5 ? GOOD : 'rgba(28,36,64,.35)', bw: g > .5 ? 3 : 2, pad: 14 });
      if (mine) {
        al(a * smooth(u / .3)); rr(c, b.x - 6, b.y - 6, b.w + 12, b.h + 12, (b.h + 12) / 2); c.strokeStyle = RED; c.lineWidth = 3.5; c.stroke();
        L.tx(lab(KEYS.mine), b.x + b.w / 2, b.y + b.h + 30, { k: KEYS.mine, s: 22, w: 700, f: F.B, c: RED, a: 'center' });
      }
      if (g > 0) check(b.x + b.w + 24, y, a * g);
      out.push(b); x = b.x + b.w + 54;
    });
    return out;
  }
  function tipHead(P, st, a, qk, o = {}) {
    const L = Lx(), u = tipU(P, st), tx = o.tExp || 4.5;
    if (!o.noRhythm) rhythm(!P.guess ? 0 : u < tx ? 1 : 2, a);
    const q = { f: F.D, s: 38, w: 600, c: INK, max: 1280 };
    al(a); L.tx(o.qv ? fillIn(lab(qk), o.qv) : lab(qk), 40, 116, Object.assign({ k: qk }, q));
    let y = o.y || 178;
    if (o.q2) { al(a); L.tx(lab(o.q2), 40, 162, Object.assign({ k: o.q2 }, q)); y += 46; }
    tipRow(P, st, a, 40, y, { tExp: tx });
    return y;
  }
  function tipFeedback(P, st, a, x, y, o = {}) {
    if (!P.guess) return null;
    const u = tipU(P, st), ok = P.guess === P.ok, k = ok ? KEYS.ok : KEYS.bad;
    al(a * smooth((u - .15) / .4));
    return Lx().pill(lab(k), x, y, { k, s: o.s || 24, w: 700, f: F.B, c: ok ? GOOD : TEAL, bg: CARD, bd: ok ? GOOD : TEAL, bw: 2.5, pad: 12, a: o.al || 'left', max: o.max });
  }
  return { bind, STAMP, stamp, Tip, tipReset, panelVeil, veilIf, tipGuess, tipHide, tipControls, tipU, rhythm, tipHead, tipRow, tipFeedback };
})();
/* ── MODUL VÉGE: TtTipp ── */

/* ── MODUL: Dokumentum és diakocka (DigDoc) · forrás: digitalis-kultura-5-6/10-formazas, 2026-11-24 · v1.1 ── */
/* A digitális kultúra 5–6. sorozat „lapja” (terv 4.2): mért tördelés, formázás rétegenként (oldal ⊃ bekezdés ⊃ sor ⊃
   szó ⊃ karakter), rejtett jelek, stílus, kép a szövegben, elválasztás, diakocka, távolsági elmosás. Csak a Lesson
   motorra épül (L.ctx, L.tx, L.measure-rel azonos mérés, L.pointer, L.k, Lesson.U, Lesson.FONTS); a lecke kódjára nem
   hivatkozik. Minden méret mm-ben (oldal, margó, behúzás, kép) és pontban (betű, térköz) – a tördelés a képernyő-
   mérettől független (mm-ben mér: measureText, gyorsítótárral), a rajz a scale (px/mm) szerint nagyít. Windowson
   eltérő fontszélesség esetén is helyesen tördel (nincs fix doboz).

   VÁLTOZÁSNAPLÓ
   v1.1 (2026-11-24, a 11, 12 metrikasora alapján; a v1.0 hívásai változatlanul működnek):
     · D.drag: a keepRatio csak a sarokfogóra hat, az oldalfogó mindig torzít (v1.0-ban az oldalfogóra is hatott).
     · D.draw: a tördelés az alfa-kilépés előtt fut – láthatatlan (a ≤ 0,005) rajz után is érvényes a D.lines/D.pbox;
       így a DigDoc.slide parts-a sem üres áttűnés közben.
     · DigDoc.slide: x, y alapértéke 0 (v1.0-ban nélkülük NaN); új paras: [{s, k, b, col, bullet}] – bekezdések a cím
       és a felsorolás között (id: p0, p1, …).
     · DigDoc.blurAt: új o.n (ennyi feloldható részlet a szélességben); a sugár és a felbontás kapcsolata leírva.
     · layout o.hyph: mindig az egész szót kapja (v1.0-ban a sortörés utáni maradékot is, pl. „útállomáson”), az
       indexek a feltételes elválasztójel nélküli szóra vonatkoznak (v1.0-ban a jellel együtt értelmezte).

   BEKÖTÉS (egyszer, legfelső szinten):  DigDoc.bind({ L: () => L, ga: () => GA });   // ga: a lecke alap-alfája
   ALFA: minden rajzoló a globalAlpha-t ga() · a értékre ÁLLÍTJA (TtTipp-minta); a vonalstílust (lineCap/lineJoin/
   setLineDash/shadow) visszaállítja. Vászonfelirat csak L.tx-szel (QA, review mód); a minPx (alap 22) alatti betűt
   „szürke sávként” jelzi (sematikus, nem betű) – kivéve raw módban (lásd lent).

   KONSTANSOK: DigDoc.PT = 25,4/72 (mm/pont, tipográfiai = DTP pont) · DigDoc.FAM = {talpas: Fraunces, talpatlan:
     Bricolage Grotesque, 'egyenlő': JetBrains Mono} · DigDoc.COL (a sorozat színei) · DigDoc.UNIT (egységszínek:
     karakter cinóber, szó okker, sor kékeszöld, bekezdés lila, oldal tinta).

   D = DigDoc.create(L, {page: {w: 210, h: 297 (mm; h: null → a tartalomhoz igazodik), margin: [25, 25, 25, 25]
        (fent, jobb, lent, bal)}, scale: px/mm, x, y (az oldal bal felső sarka, px), tab: 12,5 (mm, tabulátorköz)})
     Mezői szabadon írhatók (D.page, D.scale, D.x, D.y, D.styles, D.paras, D.imgs) – a következő layout/draw ezt használja.
   D.styles = {Normál: {…}, Címsor: {…}}  stílus = elnevezett formázás; karaktermezők: font ('talpas'|'talpatlan'|
        'egyenlő' vagy CSS-család), size (pont), b, i, u, col; bekezdésmezők: align ('balra'|'középre'|'jobbra'|
        'sorkizárt'), indent {first, left, right} (mm; first: az első sor a left-hez képest, negatív = függő),
        before, after (pont), line (sortáv-szorzó, 1,15), bullet (felsorolásjel, rajzolt pötty).
        Érvényes érték: alap ← Normál ← a bekezdés stílusa ← a bekezdés / a run saját (kézi) értéke. Így a stílus
        átírása minden vele formázott bekezdést megváltoztat, a kézzel formázott (saját értékű) részt nem.
   D.applyStyle(név, változás) – Object.assign a stílusra (pl. {size: 24}); a következő rajz már ezzel tördel.
   D.para({runs: [{s, k, font, size, b, i, u, col}], align, indent, before, after, line, bullet, style, id}) → p
        Egy bekezdés (= a következő Enterig). run.k: a .md-kulcs (review mód). A szöveg jelei: ' ' szóköz,
        '\t' tabulátor, '-' kötőjel (utána törhet a sor), '­' feltételes elválasztójel (csak sorvégen látszik).
   D.image({src: (c, w, h) => rajz (0,0-tól, px), w, h (mm), wrap: 'sorban'|'körbefuttatás'|'mögötte', p (a bekezdés
        indexe), at (sorban: a karakterhely, alap 0), x, y (mm; körbefuttatás/mögötte: a tartalomterület bal
        szélétől és a p. bekezdés tetejétől), gap: 3 (mm, a körbefutó szöveg távolsága), keepRatio: true,
        handle: null|'oldal'|'sarok'|'mind' (fogók rajza és D.hit/D.drag)}) → img (mezői írhatók: w, h, x, y, wrap)
        A „sorban” kép egy nagy karakter: a sor alapvonalán áll, a sor magasabb lesz tőle. A körbefuttatott kép
        mellett a sor a szélesebbik oldalon folytatódik; a „mögötte” kép a tördelést nem befolyásolja.
   D.layout(o) → lines   mért tördelés (mohó, mint a szövegszerkesztők): o.width (hasábszélesség mm, alap: a margók
        között), o.hyph(szó) → [elválasztási helyek indexei a szóban] (a teljes szó, feltételes elválasztójel nélkül –
        akkor is, ha egy része már az előző sorban van; v1.1) (pl. a MagText szótagolásából; nélküle nem
        választ el, csak kötőjelnél és feltételes elválasztójelnél törhet). A sorvégi szóköz „kilóg” (nem számít a
        szélességbe), a sor eleji szóköz (szóközzel igazítás) igen. Sorkizárt: a bekezdés utolsó sora balra.
        Az opciókat megjegyzi (D.lo), a draw ugyanezzel tördel. line = {pi, top, h, base, xa, xb (a sor helye mm-ben),
        items: [{t: 'w'|'s'|'tab'|'img', x, w, from, segs: [{s, r, x, w, from}], hy}], last, over (kilóg az oldalról)}.
        Utána: D.lines, D.pbox[pi] = {x, y, w, h, before, after} (mm), D.hAuto (page.h: null esetén).
   D.draw(o) – az oldal rajza. o = {a, x, y, scale (felülírás), sheet: true (papírlap, árnyék), guides: 0..1 (margó-
        vonalak), marks: 0..1 (rejtett jelek: · szóköz, ¶ bekezdésvég, → tabulátor – rajzolt jelek, nem betűk),
        marksP: index|null (csak ennek a bekezdésnek a jelei), boxes: {karakter, szó, sor, bekezdés, oldal, kitöltés} (0..1 –
        az egységek dobozai; kitöltés: a bekezdésdobozok halvány alapja és a térköz sávja), boxP: index|null (csak ebben a bekezdésben), explode: 0..1 (rétegek ál-3D-ben szét:
        oldal → bekezdés-dobozok → karakterek; a ferde rétegen a betű nyers kép, QA-jel és szürke sáv nélkül), ex: {dx, dy, sx, sq} (a szétnyitás vektora px-ben és a dőlés),
        layers: {oldal, bekezdés, karakter} (rétegenkénti alfa 0..1), ruler: true (vonalzó a margó- és
        behúzásfogókkal; rulerP: a fogók bekezdése), hi: {p, run, col} (kiemelt bekezdés vagy run), sel: {p, from, to}
        (kijelölés háttere), squiggle: [{p, from, to, col}] (hullámos aláhúzás, alap cinóber), handles: true (a
        képfogók), clip: {x, y, w, h} (px – csak ezen belül rajzol; a nem teljesen látható szó raw), paraFx: (pi) →
        {a, dx, dy} (bekezdésenkénti alfa és eltolás px-ben – diaanimációhoz), minPx: 22, ctx: másik vászon (pl.
        elmosáshoz; ekkor raw), raw: true (betű L.tx nélkül, c.fillText-tel – csak „kép a dokumentumról”: elmosott,
        kicsinyített nézet; a QA nem látja)}.
        Rajz után: D.anchors = {oldal, bekezdés, karakter: [x, y]} (a rétegek jobb szélének közepe, px – a cédulák
        vezetővonalához), D.handles (fogók dobozai px-ben), D.S, D.X, D.Y (a rajz skálája, origója).
   D.rects(pi, from, to) → [{x, y, w, h, base, px}]  egy karaktertartomány dobozai soronként (px, lapos nézet)
   D.text(pi) → a bekezdés szövege · D.lineBreaks(pi) → a sortörések karakterhelyei (az utolsó layout szerint)
   D.mm(px, py) → [mm, mm] (lapos nézet) · D.px(xmm, ymm) → [px, py]
   D.hit(px, py) → {p, run, ch, part, which, img} | null   part: 'margó' (which: 'bal'|'jobb'), 'behúzás' (which:
        'első'|'bal'|'jobb'), 'kép-sarok', 'kép-oldal' (which: 'jobb'|'lent'), 'kép', 'szöveg', 'oldal'
   D.drag(o) – húzás a draw-ból hívva (L.pointer): o = {parts: ['margó', 'behúzás', 'kép-sarok', 'kép-oldal'],
        snap: 1 (mm), lim: {margó: [5, 60], behúzás: [-30, 80], kép: [10, 180]}, which: ['első', …] (csak ezek a fogók; alap:
        mind), on(part, h)}. Visszaad: a húzott
        rész (h) vagy null. A margót mindkét oldalon, a behúzást a rulerP (vagy hi.p) bekezdésén állítja; a képnél
        a sarokfogó az img.keepRatio szerint arányosan (alap) vagy szabadon, az oldalfogó mindig torzítva (v1.1).
   DigDoc.width(s, run) → mm   mért szélesség (run: {font, size, b, i})
   DigDoc.spacesFor(text, run, widthMM, how: 'középre'|'jobbra') → n   hány szóköz kell elé, hogy „igazítva” látsszon
   DigDoc.spaceAlign(text, n, run) → bekezdés-leíró (align: 'balra', n szóköz a szöveg előtt) – a 10 tévhit-demója:
        betűtípus-cserénél semmi nem igazít utána, ezért csúszik szét (D.para(DigDoc.spaceAlign(…)))
   DigDoc.mark(L, kind, x, y, px, o) – egy rejtett jel rajza: 'szóköz' (pötty), 'bekezdés' (¶), 'tab' (→); (x, y): a
        jel alapvonala, px: a betűméret. o = {a, col}. Jelmagyarázathoz.
   DigDoc.card(L, x, y, {title: {s, k}, rows: [{s, k}], col, a, anchor: [x, y] | null, al: 'left'|'right', s: 24,
        minW}) → doboz   tulajdonságcédula (a szöveghez méreteződik), vezetővonallal az anchor-hoz.
   DigDoc.slide(L, {x: 0, y: 0, w, h (alap w · 9/16), title: {s, k}, paras: [{s, k, b, col, bullet}] (bekezdések a cím
        alatt, v1.1; bullet: true → felsorolásjeles), bullets: [{s, k, b, col}], img: (c, w, h) => rajz,
        imgW: 0,4 (a kép a szélesség hányada, jobb oldalt), bg, fg, accent (a cím színe), font, titleFont,
        size: {title: 40, body: 24} (pont egy 338,7 × 190,5 mm-es, 16:9-es dián), anim: {cím, b0, b1, …, kép: kezdő
        mp; a bekezdéseké p0, p1, …}, u (az animáció órája, mp), fx: {id: {dx, dy, a}}, a, ctx, raw, minPx}) →
        {rect, parts: {id: doboz px}, D}   diakocka ugyanezzel a tipográfiával; anim nélkül minden látszik; az elem
        0,4 mp alatt úszik be. A parts a ≤ 0,005 mellett is kitöltött (v1.1).
   DigDoc.blurAt(L, draw, dist, o) – a draw(c, w, h) képe elmosva, (o.x, o.y, o.w, o.h)-ba: offscreen vászonra rajzol,
        lekicsinyíti, majd simítva felnagyítja (a ctx.filter nem kell). Az elmosás sugara px-ben: o.r (szám vagy
        függvény: r(dist)), alap: dist. A kép r / 1,1 px-es (logikai) cellákra kicsinyül, vagyis a szélességben
        N = 1,1 · o.w / r részlet marad feloldható; fordítva: o.n (v1.1) megadásával r = 1,1 · o.w / o.n (felülírja
        az o.r-t). A hívó számolja a távolságból (pl. a 12 látásélesség-modellje). o.a: alfa.
        A draw-ban a szöveg raw (pl. DigDoc.slide(L, {…, ctx: c})).
   ──────────────────────────────────────────────────────────────────────────────────────────────────────── */
const DigDoc = (() => {
  'use strict';
  const U = Lesson.U, F = Lesson.FONTS, { clamp, lerp } = U;
  const PT = 25.4 / 72;
  const INK = '#1c2440', MUT = '#565d72', RED = '#c8401c', TEAL = '#0a6f86', OKR = '#8f5a0c', LILA = '#7b4fa0', CARD = '#fffaf1', SHEET = '#fffcf5';
  const COL = { INK, MUT, RED, TEAL, OKR, LILA, CARD, SHEET };
  const UNIT = { karakter: RED, szó: OKR, sor: TEAL, bekezdés: LILA, oldal: INK };
  const FAM = { talpas: F.D, talpatlan: F.B, 'egyenlő': F.M };
  const DEF = { font: 'talpatlan', size: 12, b: false, i: false, u: false, col: INK, align: 'balra', before: 0, after: 6, line: 1.15, bullet: false };
  const CH = ['font', 'size', 'b', 'i', 'u', 'col'], PA = ['align', 'before', 'after', 'line', 'bullet'];
  const SHY = '­';
  let getL = () => null, ga = () => 1;
  function bind(o = {}) { if (o.L) getL = o.L; if (o.ga) ga = o.ga; }

  /* ── mérés (mm), gyorsítótárral; külön vászon, hogy a lecke vászonállapotát ne bántsa ── */
  let mc = null; const cache = new Map();
  const fam = (f) => FAM[f] || f || F.B;
  const wt = (r) => (r.w || (r.b ? 700 : 400));
  const fontOf = (r, px) => `${r.i ? 'italic ' : ''}${wt(r)} ${px}px ${fam(r.font)}`;
  function em(s, r) {
    s = String(s).replace(/­/g, '');
    const key = fam(r.font) + '|' + wt(r) + '|' + (r.i ? 1 : 0) + '|' + s;
    let v = cache.get(key);
    if (v == null) {
      if (!mc) mc = document.createElement('canvas').getContext('2d');
      mc.font = fontOf(r, 100); v = mc.measureText(s).width / 100; cache.set(key, v);
    }
    return v;
  }
  const width = (s, r) => em(s, r) * (r.size || 12) * PT;
  function spacesFor(text, r, W, how = 'középre') {
    const free = W - width(text, r), sp = width(' ', r);
    return Math.max(0, Math.round((how === 'jobbra' ? free : free / 2) / sp));
  }
  const spaceAlign = (text, n, r = {}) => ({ runs: [Object.assign({}, r, { s: ' '.repeat(n) + text })], align: 'balra' });

  /* ── rajzsegédek ── */
  const ctxOf = (o) => (o && o.ctx) || getL().ctx;
  function al(c, a) { c.globalAlpha = ga() * clamp(a); }
  function resetLine(c) { c.setLineDash([]); c.lineCap = 'butt'; c.lineJoin = 'miter'; c.shadowColor = 'rgba(0,0,0,0)'; c.shadowBlur = 0; c.shadowOffsetX = 0; c.shadowOffsetY = 0; }
  function rr(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2))); }
  function mark(L, kind, x, y, px, o = {}) {
    const c = ctxOf(o), col = o.col || TEAL; al(c, o.a == null ? 1 : o.a); resetLine(c);
    c.fillStyle = col; c.strokeStyle = col;
    if (kind === 'szóköz') { c.beginPath(); c.arc(x, y - px * .3, Math.max(2, px * .075), 0, U.TAU); c.fill(); return; }
    if (kind === 'tab') {
      const w = o.w || px * .8, yy = y - px * .3, hs = Math.max(4, px * .16); c.lineWidth = Math.max(1.5, px * .055); c.lineCap = 'round';
      c.beginPath(); c.moveTo(x + w * .12, yy); c.lineTo(x + w * .88, yy); c.stroke();
      c.beginPath(); c.moveTo(x + w * .88 - hs, yy - hs * .7); c.lineTo(x + w * .88, yy); c.lineTo(x + w * .88 - hs, yy + hs * .7); c.stroke(); resetLine(c); return;
    }
    // ¶ (bekezdésvég): tömör „tál” bal fent, két szár, felső vízszintes
    const h = px * .72, w = px * .46, t = y - h, lw = Math.max(1.5, px * .065);
    c.beginPath(); c.moveTo(x + w * .52, t); c.lineTo(x + w * .52, t + h * .56); c.arc(x + w * .52, t + h * .28, h * .28, Math.PI / 2, Math.PI * 1.5); c.closePath(); c.fill();
    c.lineWidth = lw; c.beginPath(); c.moveTo(x + w * .52, t + lw / 2); c.lineTo(x + w * .98, t + lw / 2);
    c.moveTo(x + w * .52, t); c.lineTo(x + w * .52, y); c.moveTo(x + w * .86, t); c.lineTo(x + w * .86, y); c.stroke();
  }
  function txt(c, raw, s, x, y, px, r, o) {     // o: {k, a}
    const L = getL();
    if (!raw) { L.tx(s, x, y, { s: px, w: wt(r), f: fam(r.font), i: r.i ? 1 : 0, c: r.col || INK, k: o.k || null }); return; }
    c.font = fontOf(r, px); c.textAlign = 'left'; c.textBaseline = 'alphabetic'; c.fillStyle = r.col || INK; c.fillText(s, x, y);
  }

  /* ── kártya (tulajdonságcédula) ── */
  function card(L, x, y, o = {}) {
    const c = L.ctx, s = o.s || 24, col = o.col || TEAL, pad = 16, rowH = s * 1.45, a = o.a == null ? 1 : o.a;
    if (a <= .005) return null;
    const tw = o.title ? L.measure(o.title.s, { s, w: 700, f: F.B }).w : 0;
    let w = Math.max(o.minW || 0, tw + pad * 2);
    (o.rows || []).forEach((r) => { w = Math.max(w, L.measure(r.s, { s, w: 500, f: F.B }).w + pad * 2 + 14); });
    const hh = o.title ? s * 1.9 : 0, h = hh + (o.rows || []).length * rowH + pad * .9;
    const x0 = o.al === 'right' ? x - w : x;
    resetLine(c);
    if (o.anchor) {
      const [ax, ay] = o.anchor, ex = ax < x0 ? x0 : ax > x0 + w ? x0 + w : x0 + w / 2, ey = ax >= x0 && ax <= x0 + w ? (ay < y ? y : y + h) : y + Math.min(h / 2, hh / 2 + 4);
      al(c, a * .85); c.setLineDash([7, 6]); c.strokeStyle = col; c.lineWidth = 2.5; c.beginPath(); c.moveTo(ex, ey); c.lineTo(ax, ay); c.stroke(); c.setLineDash([]);
      c.beginPath(); c.arc(ax, ay, 6, 0, U.TAU); c.fillStyle = col; c.fill();
    }
    al(c, a); rr(c, x0, y, w, h, 12); c.fillStyle = CARD; c.fill(); c.strokeStyle = col; c.lineWidth = 2.5; c.stroke();
    if (o.title) {
      c.save(); rr(c, x0, y, w, hh, 12); c.clip(); c.fillStyle = U.rgba(col.length === 7 ? col : TEAL, .12); c.fillRect(x0, y, w, hh); c.restore();
      c.beginPath(); c.moveTo(x0, y + hh); c.lineTo(x0 + w, y + hh); c.strokeStyle = U.rgba(col.length === 7 ? col : TEAL, .45); c.lineWidth = 1.5; c.stroke();
      al(c, a); L.tx(o.title.s, x0 + pad, y + hh / 2 + s * .36, { s, w: 700, f: F.B, c: col, k: o.title.k });
    }
    (o.rows || []).forEach((r, i) => {
      const yy = y + hh + pad * .45 + rowH * (i + .5);
      al(c, a); c.beginPath(); c.arc(x0 + pad + 3, yy, 3.5, 0, U.TAU); c.fillStyle = col; c.fill();
      L.tx(r.s, x0 + pad + 16, yy + s * .36, { s, w: 500, f: F.B, c: r.c || INK, k: r.k });
    });
    return { x: x0, y, w, h };
  }

  /* ── dokumentum ── */
  function create(L, o = {}) {
    if (L && !getL()) getL = () => L;
    const pg = Object.assign({ w: 210, h: 297 }, o.page || {});
    pg.margin = (o.page && o.page.margin ? o.page.margin : [25, 25, 25, 25]).slice();
    const D = { page: pg, scale: o.scale || 3, x: o.x || 0, y: o.y || 0, tab: o.tab || 12.5, styles: { Normál: {} }, paras: [], imgs: [],
      lines: [], pbox: [], lo: {}, hAuto: pg.h || 0, anchors: {}, handles: [], S: o.scale || 3, X: o.x || 0, Y: o.y || 0, dg: null };

    D.para = (p) => { p.runs = p.runs || []; D.paras.push(p); return p; };
    D.image = (im) => { const g = Object.assign({ wrap: 'sorban', p: 0, at: 0, x: 0, y: 0, gap: 3, keepRatio: true, handle: null }, im); D.imgs.push(g); return g; };
    D.applyStyle = (n, ch) => { D.styles[n] = Object.assign(D.styles[n] || {}, ch); return D.styles[n]; };
    D.text = (pi) => D.paras[pi].runs.map((r) => r.s || '').join('');

    function effPara(p) {

  init(Lx) {
    L = Lx;
    P2.on = () => showCtl(S2.ctl, true);
    build1(); build5(); build7();
    reset1(); reset2(); reset3(); reset4(); reset5(); reset6(); reset7();
    P2.ok = catOf(angOf(xhScr(num('tipp betűmérete')), dist(2))) + ' tipp';
    ATT6 = { 'egyenként': attention6('egyenként'), 'ugrál': attention6('ugrál') };
    L.checks = () => {
      const dB = dist(2), lim = num('olvashatóság határa');
      const out = [];
      // 1. a dia mérete egyezik a DigDoc.slide lapjával
      const sw = SL1B && SL1B.D ? SL1B.D.page.w : null;
      out.push({ name: 'a dia szélessége = a DigDoc.slide lapja', ok: sw != null && Math.abs(sw - SWm()) < .01, got: sw, want: SWm() });
      // 2. 5 szögperc 9 m-ről
      const h5 = sizeAt(lim, dB);
      out.push({ name: '5 szögperc 9 m-ről ≈ 13,1 mm (9000 mm · tg 5′)', ok: Math.abs(h5 - 9000 * Math.tan(5 * AM)) < 1e-9 && Math.abs(h5 - 13.09) < .02, got: fmt(h5, 2), want: '13,09' });
      // 3. a nézetben a kisbetű ennyi „részlet” magas – egyezik a látószöggel (1 részlet = 1 szögperc)
      for (let i = 0; i < 3; i++) {
        const d = dist(i), w = VW2.w, N = viewN(d), xhpx = S2.pt * PT * xr(F.B) * (w / num('nézet szélessége'));
        const el = xhpx * N / w, ang = angOf(xhScr(S2.pt), d);
        out.push({ name: `nézet ${fmt(d)} m: a kisbetű részletekben = látószög szögpercben`, ok: Math.abs(el / ang - 1) < .01, got: fmt(el, 2), want: fmt(ang, 2) });
      }
      // 4. a rajzolt ék szöge = a valódi szög (ugyanaz a lépték mindkét tengelyen)
      const H = scrH(), x = cxm(dB), hy = cy(EYE);
      const drawn = (Math.atan2(hy - cy(SCR0 + H), x - CR.x0) - Math.atan2(hy - cy(SCR0), x - CR.x0)) / AM;
      const real = (Math.atan((SCR0 + H - EYE) / dB) - Math.atan((SCR0 - EYE) / dB)) / AM;
      out.push({ name: 'a hátsó sor látószög-éke: rajz = számolás', ok: Math.abs(drawn - real) < .01, got: fmt(drawn, 1), want: fmt(real, 1) });
      // 5. a tipp helyes válasza a számolásból
      out.push({ name: 'a 2. lépés helyes tippje a számolásból jön', ok: P2.ok === catOf(angOf(xhScr(num('tipp betűmérete')), dB)) + ' tipp', got: P2.ok, want: 'számolt' });
      // 6–8. WCAG
      out.push({ name: 'WCAG: fekete–fehér = 21 : 1', ok: Math.abs(ratio(lumHex('#000000'), lumHex('#ffffff')) - 21) < 1e-9, got: fmt(ratio(0, 1), 2), want: '21' });
      const r0 = pairAt(PAIRS[0], 0).r, r1 = pairAt(PAIRS[1], 0).r, r2 = pairAt(PAIRS[2], 0).r, r3 = pairAt(PAIRS[3], 0).r, L45 = num('kontraszthatár');
      out.push({ name: 'sötét terem: tinta/papír és világos/sötét ≥ 4,5 : 1; világoskék, sárga < 4,5 : 1', ok: r0 >= L45 && r3 >= L45 && r1 < L45 && r2 < L45, got: [r0, r1, r2, r3].map((r) => fmt(r, 1)).join(' / '), want: '≥ / < / < / ≥' });
      const lx = num('világos terem'), P = num('vetítő fénye a vásznon'), pw = pairAt(PAIRS[0], lx), lf = lumHex(pw.fg), lb = lumHex(pw.bg);
      const lf0 = (lumHex(PAIRS[0].fg) * P + lx) / (P + lx), lb0 = (lumHex(PAIRS[0].bg) * P + lx) / (P + lx);
      out.push({ name: 'a kifakított (rajzolt) színek világossága = (L · vetítő + terem) / (vetítő + terem)', ok: Math.abs(lf - lf0) < .004 && Math.abs(lb - lb0) < .004, got: fmt(lf, 3) + ' / ' + fmt(lb, 3), want: fmt(lf0, 3) + ' / ' + fmt(lb0, 3) });
      // 9. lényegkiemelés: kevesebb szó → nagyobb betű; a bekezdés pont elfér
      const mk0 = (pt) => mkSlide({ x: 0, y: 0, w: SL5.w, titleK: 'dia cím', paras: V5[0].paras(), body: pt, imgW: V5[0].imgW });
      const fitOk = FIT5[0] >= num('legnagyobb szövegméret') || (fits(mk0(FIT5[0])) && !fits(mk0(FIT5[0] + .5)));
      out.push({ name: 'szavak: bekezdés > felsorolás > kulcsszavak; betű: ≤ ≤; a bekezdés éppen elfér', ok: WORDS5[0] > WORDS5[1] && WORDS5[1] > WORDS5[2] && FIT5[0] <= FIT5[1] && FIT5[1] <= FIT5[2] && FIT5[0] < FIT5[2] && fitOk, got: WORDS5.join('/') + ' szó, ' + FIT5.map((v) => fmt(v, 1)).join('/') + ' pont', want: 'csökken / nő' });
      // 10. formátum: a saját gépen elfér, betűtípus nélkül kilóg
      out.push({ name: 'a 7. lépés diája a saját betűtípussal elfér, a helyettesítővel kilóg', ok: fits(D7) && fits(D7p) && !fits(D7s), got: [fits(D7), fits(D7s), fits(D7p)].join('/'), want: 'true/false/true' });
      // 11. figyelem: egyenként 100 %, ugrálva kevesebb
      out.push({ name: 'egyenként: a szem mindig a tárgyalt elemen; ugrálva kevésbé', ok: Math.abs(ATT6['egyenként'] - 100) < 1e-9 && ATT6['ugrál'] < 60, got: fmt(ATT6['egyenként'], 0) + ' / ' + fmt(ATT6['ugrál'], 0) + ' %', want: '100 / < 60' });
      // 12. a lecke saját felirata: meddig olvasható
      const pxmm = num('vászon szélessége') * 1000 / num('színpad szélessége'), h1 = num('legkisebb felirat') * xr(F.B, 600) * pxmm;
      out.push({ name: 'a 22 képpontos felirat határtávolsága = a kisbetű / tg 5′', ok: Math.abs(angOf(h1, reach(h1, lim)) - lim) < 1e-6, got: fmt(reach(h1, lim), 2) + ' m', want: '5 szögperc ott' });
      out.push({ name: 'a kisbetű aránya a fontban értelmes (0,4–0,6)', ok: xr(F.B) > .4 && xr(F.B) < .6 && xr(F.D, 600) > .4 && xr(F.D, 600) < .6, got: fmt(xr(F.B), 3) + ' / ' + fmt(xr(F.D, 600), 3), want: '0,4–0,6' });
      return out;
    };
  },
  draw(L) {
    c = L.ctx; background();
    for (let i = 0; i < SCENES.length; i++) {
      const w = clamp(1 - Math.abs(L.sp - i) * 2); if (w <= .001) continue;
      const st = i === L.step ? L.st : SETTLE[i];
      GA = 1; SCENES[i](st, w); c.globalAlpha = 1; GA = 1;
    }
  },
});
/* QA-állapotok (1-alapú lépésszám) */
const guessQA = (P, k, back = 30) => (L2) => { P.guess = k; P.gt = L2.st - back; tipHide(P); panelVeil(false); if (P.on) P.on(k); };
const other2 = () => ['igen tipp', 'alig tipp', 'nem tipp'].find((k) => k !== P2.ok);
window.__qaStates = {
  1: [{ name: 'tipp-jó', set: guessQA(P1, 'kép tipp') }, { name: 'tipp-rossz', set: guessQA(P1, 'sok szöveg tipp') },
    { name: 'fut-közben', set: guessQA(P1, 'egyforma tipp', 3.4) }],
  2: [{ name: 'tipp-jó', set: (L2) => guessQA(P2, P2.ok)(L2) }, { name: 'tipp-rossz', set: (L2) => guessQA(P2, other2())(L2) },
    { name: 'fut-közben', set: (L2) => guessQA(P2, P2.ok, 1.6)(L2) },
    { name: 'betű-10', set: (L2) => { guessQA(P2, P2.ok)(L2); L2.sliders['betűméret csúszka'].set(10, { fire: true }); } },
    { name: 'betű-12', set: (L2) => { guessQA(P2, P2.ok)(L2); L2.sliders['betűméret csúszka'].set(12, { fire: true }); } },
    { name: 'betű-48', set: (L2) => { guessQA(P2, P2.ok)(L2); L2.sliders['betűméret csúszka'].set(48, { fire: true }); } }],
  3: [{ name: 'világoskék', set: () => { S3.p = 1; } }, { name: 'sárga', set: () => { S3.p = 2; } }, { name: 'sötét-alap', set: () => { S3.p = 3; } },
    { name: 'világos-terem', set: (L2) => { L2.sliders['teremfény csúszka'].set(num('világos terem'), { fire: true }); } },
    { name: 'teremfény-max', set: (L2) => { S3.p = 3; L2.sliders['teremfény csúszka'].set(LUXMAX, { fire: true }); } }],
  4: [{ name: 'rendezetlen', set: () => { S4.mode = 'rendezetlen'; S4.t0 = -10; } }, { name: 'új-néző', set: () => { S4.seed = 2; S4.t0 = -10; } },
    { name: 'rendezetlen-új-néző', set: () => { S4.mode = 'rendezetlen'; S4.seed = 3; S4.t0 = -10; } }, { name: 'félúton', st: 2.2 }],
  5: [{ name: 'felsorolás', set: () => { S5.log = [{ t: -99, v: 1 }]; } }, { name: 'három-szó', set: () => { S5.log = [{ t: -99, v: 2 }]; } }],
  6: [{ name: 'ugrál', set: () => { S6.mode = 'ugrál'; S6.t0 = 0; } }, { name: 'ugrál-később', st: 8.3, set: () => { S6.mode = 'ugrál'; S6.t0 = 0; } },
    { name: 'egyenként-tánc', st: 9.2 }, { name: 'bevezetés', st: .7 }],
  7: [{ name: 'közös', set: (L2) => { S7.sc = 0; S7.t = L2.st - 3; } }, { name: 'küldés', set: (L2) => { S7.sc = 1; S7.t = L2.st - 3; } },
    { name: 'javítás', set: (L2) => { S7.sc = 2; S7.t = L2.st - 3; } }],
};

})();
</script>
