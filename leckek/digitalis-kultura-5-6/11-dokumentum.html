<script>
(function () {
'use strict';

/* ── MODUL: „Tippelj!” és bélyegek (TtTipp) · forrás: termeszettudomany-5-6/01-tocsa + 03-meres, egységesítve 2026-11-24 ── */
/* A természettudomány 5–6. sorozat közös mintái (szerződés 17.): kísérlet-/modellbélyeg és a „Tippelj! → kísérlet →
   magyarázat” jóslat. Csak a Lesson motorra épül (L.ctx, L.tx, L.pill, L.lab, L.button, L.controlsEl, L.panel, L.st,
   Lesson.U, Lesson.FONTS); a lecke kódjára nem hivatkozik. A panel elmosásához szükséges CSS-t (.tt-rejtett) és a
   letiltott csúszka halványítását a modul maga teszi a <head>-be – a leckében nem kell <style>-sor.

   BEKÖTÉS (a lecke kódjában, egyszer, legfelső szinten – a getterek miatt a sorrend mindegy):
     TtTipp.bind({ L: () => L, ga: () => GA });    // ga: a lecke alap-alfája (jelenet-áttűnés); alap: () => 1
     const { stamp, Tip, tipReset, panelVeil, veilIf, tipGuess, tipHide, tipControls, tipU, rhythm, tipHead, tipRow,
       tipFeedback } = TtTipp;
   ALFA: minden rajzoló a globalAlpha-t ga() · a (· belső áttűnés) értékre ÁLLÍTJA (nem szoroz a pillanatnyival, így
   egy korábbi halvány felirat nem tünteti el), a vonalstílust (lineCap/lineJoin/setLineDash) visszaállítja.

   stamp(kind, x, y, a, o) → doboz | null       kísérlet-/modellbélyeg a KemGHS.stamp stílusával (Bricolage 22 px,
        600, betűköz 0,08 em, −3°, papír alap, 2 px keret; 'tilos': 700, 3 px). (x, y): a bal szél közepe.
        Szöveg: az o.k || '<kind> bélyeg' .md-kulcs. Szín (STAMP): otthon kékeszöld, felnőtt okker, tilos #b3261e;
        tanári, modell, kitalált, nem méretarányos, sematikus, vázlatos, képzeletbeli (és minden más) halvány tinta.
        o = {k, col (szín felülírása), rot: −3 (fok), al: 'left' (igazítás)}. a ≤ 0,005 → nem rajzol.
   Tip(keys, ok) → P      jóslat-állapot. keys: a válaszok .md-kulcsai (egyben gombfeliratok), ok: a helyes kulcs (az
        init-ben is beállítható: P.ok = …). P = {keys, ok, guess: null | kulcs, gt: a választás L.st-je, btns, on}.
        P.on(k): választáskor hívódik (a lecke állítja, pl. a kísérlet vezérlőinek feloldására).
   tipReset(P)            alaphelyzet (az enter()-ben; utána veilIf(P)).
   panelVeil(on)          a panelszöveg 2. bekezdésétől (.lp-text > *, i > 0) elmos (on) / felold.
   veilIf(P)              panelVeil(!P.guess) – az enter()-ben a tipReset után.
   tipControls(P)         a tippgombok (L.button, P.keys sorrendben). A választás után csak ezek tűnnek el: a
        sorukba utána tett más gombok maradnak (ha a sorban nem marad látható gomb, a sor is eltűnik).
   tipGuess(P, k, gt)     választás (csak az első számít): P.guess = k, P.gt = gt ?? L.st, tipHide, panelVeil(false),
        P.on(k). A QA-állapotok is ezt hívhatják (pl. gt = L.st − 30: a kísérlet már lefutott).
   tipHide(P)             a tippgombok elrejtése (a tipGuess hívja; QA-állapotban kézzel is).
   tipU(P, st) → mp       a választás óta eltelt idő (st − P.gt), −1, ha még nincs tipp.
   rhythm(ph, a)          a „Tippelj! → kísérlet → magyarázat” sáv a vászon bal felső sarkában (x 40, y 46);
        ph: 0 / 1 / 2 az aktív szakasz.
   tipHead(P, st, a, qk, o) → y     fejléc: sáv + kérdés (qk, (40, 116), Fraunces 38, max 1280) + válaszsor (40, y).
        o = {tExp: 4,5 (a kísérlet hossza mp-ben: ennyi után vált a sáv „magyarázat”-ra, és mutatja a helyes
        választ), q2 (2. kérdéssor kulcsa, (40, 162); a válaszsor 46 px-szel lejjebb kerül), qv (a kérdés #-jeleinek
        értékei, sorban), y: 178 (a válaszsor közepe), noRhythm (a sáv nélkül – pl. olvasási kérdésnél)}.
        Visszaad: a válaszsor y-ja.
   tipRow(P, st, a, x, y, o) → [dobozok]    csak a válaszsor (a tipHead is ezt rajzolja), bárhová: a választásig
        semleges; a választott cinóber keretet és alatta „a te tipped” feliratot kap; o.tExp (0) mp múlva a helyes
        zöld keretet + pipát kap, a többi elhalványul. Dobozköz 54 px (a pipának).
   tipFeedback(P, st, a, x, y, o) → doboz | null    „Jó tipp!” (zöld) / „Sokan gondolják így – nézzük meg!”
        (kékeszöld) pill (x: bal szél, y: közép), a választás után 0,15 mp-cel beúszva. o = {s: 24, al: 'left', max}.
   .md-kulcsok (### Feliratok): tippelj felirat, kísérlet felirat, magyarázat felirat, a te tipped felirat, jó tipp
        felirat, rossz tipp felirat; a bélyegeké '<kind> bélyeg'.
   ──────────────────────────────────────────────────────────────────────────────────────────────────────── */
const TtTipp = (() => {
  'use strict';
  const U = Lesson.U, F = Lesson.FONTS, { clamp, lerp, smooth } = U;
  const INK = '#1c2440', MUT = '#565d72', RED = '#c8401c', TEAL = '#0a6f86', GOOD = '#1d7a45', BAD = '#b3261e', OKR = '#8f5a0c', CARD = '#fffaf1';
  const STAMP = { otthon: TEAL, felnőtt: OKR, tilos: BAD, tanári: MUT, modell: MUT, kitalált: MUT, 'nem méretarányos': MUT, sematikus: MUT, vázlatos: MUT, képzeletbeli: MUT };
  const KEYS = { ph: ['tippelj felirat', 'kísérlet felirat', 'magyarázat felirat'], mine: 'a te tipped felirat', ok: 'jó tipp felirat', bad: 'rossz tipp felirat' };
  let getL = () => null, ga = () => 1;
  if (typeof document !== 'undefined' && !document.getElementById('tt-tipp-css')) {
    const st = document.createElement('style'); st.id = 'tt-tipp-css';
    st.textContent = '.lp-text > .tt-rejtett { filter: blur(7px); opacity: .5; user-select: none; transition: filter .6s, opacity .6s; }\n'
      + '.lp-slider:has(input:disabled) { opacity: .45; }\n.lp-slider input:disabled { cursor: not-allowed; }';
    document.head.appendChild(st);
  }
  const Lx = () => getL(), cx = () => getL().ctx, lab = (k) => getL().lab(k);
  const al = (a) => { cx().globalAlpha = ga() * clamp(a); };
  const fillIn = (s, v) => { let i = 0; return s.replace(/#/g, () => (i < v.length ? v[i++] : '#')); };
  const rr = (c, x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, w, h, r); };
  function check(x, y, a) {                 // pipa (rajz, nem betűjel)
    const c = cx(); al(a); c.lineWidth = 4.5; c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = GOOD; c.beginPath();
    c.moveTo(x - 10, y); c.lineTo(x - 3, y + 8); c.lineTo(x + 11, y - 9); c.stroke(); c.lineCap = 'butt'; c.lineJoin = 'miter';
  }
  function arrow(x1, y1, x2, y2, col, w, hs) {
    const c = cx(), an = Math.atan2(y2 - y1, x2 - x1), bx = x2 - Math.cos(an) * hs * .8, by = y2 - Math.sin(an) * hs * .8;
    c.setLineDash([]); c.lineCap = 'round'; c.beginPath(); c.moveTo(x1, y1); c.lineTo(bx, by); c.strokeStyle = col; c.lineWidth = w; c.stroke(); c.lineCap = 'butt';
    c.beginPath(); c.moveTo(x2, y2); c.lineTo(x2 - hs * Math.cos(an - .45), y2 - hs * Math.sin(an - .45)); c.lineTo(x2 - hs * Math.cos(an + .45), y2 - hs * Math.sin(an + .45)); c.closePath();
    c.fillStyle = col; c.fill();
  }

  function bind(o = {}) { if (o.L) getL = o.L; if (o.ga) ga = o.ga; }
  function stamp(kind, x, y, a, o = {}) {
    if (a <= .005) return null;
    const L = Lx(), c = L.ctx, k = o.k || (kind + ' bélyeg'), col = o.col || STAMP[kind] || MUT, tilos = kind === 'tilos';
    c.save(); al(a); c.translate(x, y); c.rotate((o.rot == null ? -3 : o.rot) * Math.PI / 180);
    const b = L.pill(lab(k), 0, 0, { s: 22, w: tilos ? 700 : 600, ls: '0.08em', f: F.B, bg: CARD, bd: col, bw: tilos ? 3 : 2, c: col, r: 6, pad: 10, k, qa: false, a: o.al || 'left' });
    c.restore(); return b;
  }
  const Tip = (keys, ok) => ({ keys, ok, guess: null, gt: -99, btns: [], on: null });
  function tipReset(P) { P.guess = null; P.gt = -99; }
  function panelVeil(on) {
    const L = Lx(); if (!L || !L.panel) return;
    L.panel.querySelectorAll('.lp-text > *').forEach((p, i) => { if (i > 0) p.classList.toggle('tt-rejtett', !!on); });
  }
  const veilIf = (P) => panelVeil(!P.guess);
  function tipHide(P) {
    const rows = new Set();
    (P.btns || []).forEach((b) => { b.style.display = 'none'; if (b.parentNode) rows.add(b.parentNode); });
    rows.forEach((r) => { if (![...r.children].some((e) => e.style.display !== 'none')) r.style.display = 'none'; });
  }
  function tipGuess(P, k, gt) {
    if (P.guess) return;
    P.guess = k; P.gt = gt == null ? Lx().st : gt;
    tipHide(P); panelVeil(false);
    if (P.on) P.on(k);
  }
  function tipControls(P) { const L = Lx(); P.btns = P.keys.map((k) => L.button(lab(k), () => tipGuess(P, k), k)); }
  const tipU = (P, st) => (P.guess ? st - P.gt : -1);
  function rhythm(ph, a) {
    const L = Lx(), cols = [RED, TEAL, OKR];
    let x = 40;
    KEYS.ph.forEach((k, j) => {
      const on = ph === j, done = ph > j;
      al(a * (on ? 1 : done ? .7 : .4));
      const b = L.pill(lab(k), x, 46, { k, s: 22, w: 700, f: F.B, c: on ? '#ffffff' : cols[j], bg: on ? cols[j] : CARD, bd: cols[j], bw: 2, pad: 10 });
      x = b.x + b.w;
      if (j < 2) { al(a * .55); arrow(x + 8, 46, x + 34, 46, MUT, 3, 11); x += 44; }
    });
  }
  function tipRow(P, st, a, x, y, o = {}) {
    const L = Lx(), c = L.ctx, u = tipU(P, st), tx = o.tExp || 0, out = [];
    const rev = P.guess ? smooth((u - tx) / .5) : 0;
    P.keys.forEach((k) => {
      const mine = P.guess === k, ok = k === P.ok, g = rev * (ok ? 1 : 0);
      al(a * (P.guess && !mine && !ok ? lerp(1, .55, rev) : 1));
      const b = L.pill(lab(k), x, y, { k, s: 26, w: 600, f: F.B, c: INK, bg: g > .5 ? '#eef6ee' : CARD, bd: g > .5 ? GOOD : 'rgba(28,36,64,.35)', bw: g > .5 ? 3 : 2, pad: 14 });
      if (mine) {
        al(a * smooth(u / .3)); rr(c, b.x - 6, b.y - 6, b.w + 12, b.h + 12, (b.h + 12) / 2); c.strokeStyle = RED; c.lineWidth = 3.5; c.stroke();
        L.tx(lab(KEYS.mine), b.x + b.w / 2, b.y + b.h + 30, { k: KEYS.mine, s: 22, w: 700, f: F.B, c: RED, a: 'center' });
      }
      if (g > 0) check(b.x + b.w + 24, y, a * g);
      out.push(b); x = b.x + b.w + 54;
    });
    return out;
  }
  function tipHead(P, st, a, qk, o = {}) {
    const L = Lx(), u = tipU(P, st), tx = o.tExp || 4.5;
    if (!o.noRhythm) rhythm(!P.guess ? 0 : u < tx ? 1 : 2, a);
    const q = { f: F.D, s: 38, w: 600, c: INK, max: 1280 };
    al(a); L.tx(o.qv ? fillIn(lab(qk), o.qv) : lab(qk), 40, 116, Object.assign({ k: qk }, q));
    let y = o.y || 178;
    if (o.q2) { al(a); L.tx(lab(o.q2), 40, 162, Object.assign({ k: o.q2 }, q)); y += 46; }
    tipRow(P, st, a, 40, y, { tExp: tx });
    return y;
  }
  function tipFeedback(P, st, a, x, y, o = {}) {
    if (!P.guess) return null;
    const u = tipU(P, st), ok = P.guess === P.ok, k = ok ? KEYS.ok : KEYS.bad;
    al(a * smooth((u - .15) / .4));
    return Lx().pill(lab(k), x, y, { k, s: o.s || 24, w: 700, f: F.B, c: ok ? GOOD : TEAL, bg: CARD, bd: ok ? GOOD : TEAL, bw: 2.5, pad: 12, a: o.al || 'left', max: o.max });
  }
  return { bind, STAMP, stamp, Tip, tipReset, panelVeil, veilIf, tipGuess, tipHide, tipControls, tipU, rhythm, tipHead, tipRow, tipFeedback };
})();
/* ── MODUL VÉGE: TtTipp ── */

/* ── MODUL: Kártyák (TortCards) ────────────────────────────────────────────────────
   G modul (pilot/tortenelem-5-6/terv.md, 5. fejezet): „húzd a helyére” – kártyák rendezése zónákba
   (pl. két oszlop: falu / város), azonnali visszajelzéssel. Referencia: 07-kozepkori-varos.
   Később változtatás nélkül átemelhető: shared/tort/cards.js. Csak a Lesson motorra épül
   (L.ctx, L.tx, L.measure, L.pointer, L.stage, L.st, L.VW).

   const g = TortCards.create(L, {
     zones: [{id, x, y, w, h, title: {s, k}, sub?: {s, k}, head?: 110}], // célterületek; head: a fejléc magassága
     cards: [{id, label: {s, k}, zone}],      // zone: a helyes zóna id-ja (a kódban rögzített megoldás)
     tray: {x, y, w, h, pad?: 24, top?: 56},  // a kártyák kiinduló helye: sorfolytonosan, soronként középre
     font?: {f, s, w},                        // kártyafelirat (alap: Bricolage 24 / 600)
     gap?: 14, ease?: .45,                    // térköz px; a mozgás hossza mp
     decor?: (zone, alpha) => {}              // opcionális: saját rajz a zóna fejlécébe
   });
   g.reset()                  minden kártya a tálcára, animáció nélkül (a lépés enter()-jében hívd)

const TortCards = (() => {
  const F = Lesson.FONTS, U = Lesson.U;

    const g = { zones, cards, touched: false, drag: null, _pd: false, _ord: 0, _hov: null };

        const rw = r.length ? r[r.length - 1].x + r[r.length - 1].ww : 0, off = center ? (w - rw) / 2 : 0;
        r.forEach((e) => { out[e.q.id] = { x: x + off + e.x, y: y + ri * (H + gap), w: e.ww }; });

    const tray = () => { const t = cfg.tray, p = t.pad == null ? 24 : t.pad; return { x: t.x + p, y: t.y + (t.top == null ? 56 : t.top), w: t.w - p * 2 }; };
    function target(q) {
      if (!q.at) { if (!traySlots) { const t = tray(); traySlots = flow(cards, t.x, t.y, t.w, true); } return traySlots[q.id]; }
      const z = zones.find((zz) => zz.id === q.at), list = cards.filter((c2) => c2.at === q.at).sort((a, b) => a.ord - b.ord);

    }
    function disp(q) {
      const T = target(q);
      if (!q.tgt || Math.abs(T.x - q.tgt.x) > .5 || Math.abs(T.y - q.tgt.y) > .5) {   // új cél (pl. átrendeződés): onnan, ahol most van

    g.update = () => {
      const p = L.pointer, edge = p.down && !g._pd; g._pd = p.down;
      const hit = () => { for (let i = cards.length - 1; i >= 0; i--) { const q = order()[i], d = disp(q); if (p.x >= d.x && p.x <= d.x + d.w && p.y >= d.y && p.y <= d.y + H) return { q, d }; } return null; };
      if (edge && p.x < L.VW && !g.drag) { const h = hit(); if (h) { g.drag = { q: h.q, dx: p.x - h.d.x, dy: p.y - h.d.y }; g.touched = true; } }
      if (g.drag && !p.down) {
        const d = g.drag, x = p.x - d.dx, y = p.y - d.dy, z = zoneAt(p.x, p.y), t = cfg.tray;
        const inTray = p.x >= t.x && p.x <= t.x + t.w && p.y >= t.y && p.y <= t.y + t.h;
        if (z) g.place(d.q, z.id, L.st, { x, y });
        else if (inTray) g.place(d.q, null, L.st, { x, y });
        else { d.q.from = { x, y }; d.q.t0 = L.st; }                  // máshová ejtve: vissza a helyére
        g.drag = null;
      }
      const h = g.drag ? null : (p.inside && p.x < L.VW ? hit() : null);
      g._hov = h ? h.q : null;
      if (L.stage) L.stage.style.cursor = g.drag ? 'grabbing' : h ? 'grab' : '';
    };
    const order = () => cards.slice().sort((a, b) => (a === (g.drag && g.drag.q) ? 1 : 0) - (b === (g.drag && g.drag.q) ? 1 : 0) || (a.at ? 1 : 0) - (b.at ? 1 : 0) || a.ord - b.ord || a.i - b.i);

    function mark(c, ok, x, y) {        // pipa / kereszt (rajz, nem szöveg)
      c.save(); c.lineCap = 'round'; c.lineJoin = 'round'; c.lineWidth = 4; c.strokeStyle = ok ? GOOD : BAD; c.beginPath();

    }
    function card(c, q, d, lift) {

      c.save();

      c.beginPath(); c.roundRect(d.x, d.y, d.w, H, 10); c.fillStyle = CARD; c.fill(); c.shadowColor = 'transparent';
      if (placed && !lift) { c.fillStyle = U.rgba(ok ? GOOD : BAD, .08); c.fill(); }
      c.lineWidth = placed && !lift ? 3 : 2; c.strokeStyle = placed && !lift ? (ok ? GOOD : BAD) : hov || lift ? RED : U.rgba(INK, .45); c.stroke();
      L.tx(q.label.s, d.x + PX, d.y + H / 2 + 1, Object.assign({}, FT, { b: 'middle', c: INK, k: q.label.k }));
      const ix = d.x + d.w - PX - 8, iy = d.y + H / 2;

      else { c.fillStyle = U.rgba(INK, .4); for (let r = -1; r <= 1; r++) for (let s = 0; s < 2; s++) { c.beginPath(); c.arc(ix - 3 + s * 7, iy + r * 7, 2.2, 0, Math.PI * 2); c.fill(); } }

      const c = L.ctx, A = o.a == null ? 1 : o.a; if (A <= .01) return;

        c.setLineDash([10, 7]); c.lineWidth = 2.5; c.strokeStyle = U.rgba(INK, .5); c.stroke(); c.setLineDash([]);
        L.tx(z.title.s, z.x + 22, z.y + 54, { f: F.D, s: 40, w: 600, c: INK, k: z.title.k });
        if (z.sub) L.tx(z.sub.s, z.x + 22, z.y + 88, { f: F.B, s: 22, w: 500, c: MUT, k: z.sub.k });
        if (cfg.decor) { c.save(); cfg.decor(z, c.globalAlpha); c.restore(); }
      }
      const t = cfg.tray; c.beginPath(); c.roundRect(t.x, t.y, t.w, t.h, 16); c.fillStyle = 'rgba(28,36,64,.05)'; c.fill();
      c.lineWidth = 2; c.strokeStyle = U.rgba(INK, .25); c.stroke();

  }
  return { create };
})();

/* ── MODUL: Szöveg (MagText) · v1.1 · forrás: magyar-5-6/04-toldalek, 2026-11-24 ── */
/* Magyar szöveg betű / szótag / szó szinten: tokenekre bontás, mért elrendezés, kiemelés, csempe, áttűnés.
   Csak a Lesson motorra épül (Lesson.U, Lesson.FONTS); minden felirat L.tx-szel kerül a vászonra (QA, review mód).
   v1.1 (2026-11-24): a T.layout sorszélessége külön kulcs: maxW. A w mindenhol (create, layout, tile) a betűvastagság.
   (v1.0-ban a layout a w-t sorszélességnek ÉS vastagságnak is vette: 1000 fölött érvénytelen font, alatta némán
   átállt a vastagság.) Átálláskor a régi T.layout(…, {w: 900}) sorszélesség-hívásokat írd át maxW-re.
   Statikus (nem rajzol):
     MagText.ABC                 a 44 betűs magyar ábécé sorrendben: a, á, b, c, cs, d, dz, dzs, e, é, … z, zs
     MagText.clean(s)            s a jelölők nélkül: „|” (szóelemhatár), „·” (kézi szótaghatár)
     MagText.split(s)            → [{s, t, i, n, kind: 'v'|'c'|'x', long, dbl}] a betűk: s a betű (pl. 'sz'), t az írott
                                 darab, i/n a helye a tiszta szövegben; többjegyű betű egy elem (dzs > dz > d); kettőzött
                                 többjegyű (ssz, ggy, ccs, lly, nny, tty, zzs) két betű: 'sz' (t: 's', dbl) + 'sz';
                                 a „|” felülírja a felismerést (kis|szék: s + sz); kind 'x': szóköz, írásjel
     MagText.letters(s)          → ['cs', 'i', 'g', 'a'] (csak a betűk)
     MagText.isVowel(ch)         a, á, e, é, i, í, o, ó, ö, ő, u, ú, ü, ű (+ régi õ, û, ô, ë, ä); az y nem
     MagText.vowels(s)           → [{i, v, long, h: 'mély'|'magas', round}] (i: hely a tiszta szövegben)
     MagText.harmony(s)          → 'mély' | 'magas' | 'vegyes' | null (nincs magánhangzó) – csak a betűk szerint
     MagText.syllabify(s)        → ['asz', 'szony']: magánhangzónként egy szótag; egy mássalhangzó a következő szótagba
                                 kerül, torlódásnál csak az utolsó; két magánhangzó között választ (fi-a-tal); a többjegyű
                                 betű nem válik szét, a kettőzött igen (asz-szony); „·” kézi szótaghatár (vas·út);
                                 szóközös szövegnél szavanként (a sorokon átívelő verstani szótagolás a MagVers dolga)
     MagText.cmp(a, b)           → {r: −1|0|1, i, pass}: magyar betűrend (AkH. 12.): 1. menet a betűk sorrendje (a rövid és a
                                 hosszú magánhangzó egyenértékű), 2. menet rövid < hosszú, 3. menet kisbetű < nagybetű;
                                 i: a döntő betű indexe (MagText.letters szerint), pass: melyik menet döntött (0: egyenlő);
                                 a szóköz, kötőjel, írásjel nem számít. Régi írásmódú betűkapcsolatot (ch, cz, th) nem kezel.
     MagText.collate(a, b)       → −1 | 0 | 1 (rendezéshez: tömb.sort(MagText.collate))
     MagText.diff(a, b)          → [[ia, ib], …] a két betűsor (MagText.letters) leghosszabb közös részsorozata
   Példány:
     const T = MagText.create(L, {f, s, w, i, c, lh})   alapfont (alap: Fraunces, 44 px, 560, tinta), lh: sormagasság × s
     T.tokens(s, 'szó'|'szótag'|'betű', {k}) → [{s, i, kind, wi, si}]   kind: 'w' szó · 'syl' szótag · 'v'/'c' betű ·
                                 's' szóköz · 'p' írásjel; wi: a szó sorszáma, si: a szótag/betű helye a szóban; k: md-kulcs.
                                 Saját token is betehető (pl. {kind: 'slot', fw: 300} helyőrző egy csempés szónak).
     T.layout(tokens, {x, y, maxW, a, gap, s, f, w, i, lh}) → lay   mért elrendezés, tördelés szóközön (nincs fix doboz);
                                 a: 'left' | 'center' | 'right' – x a sorok bal széle / közepe / jobb széle, y az első sor
                                 alapvonala; maxW: legnagyobb sorszélesség, px (nincs: nem tördel); s, f, w (vastagság), i:
                                 a font (alap: a példányé); gap: köz a szón belüli tokenek (szótag, betű) között, px.
                                 lay = {tokens (+ x, y, w), lines, x, y, w, h, s, f}
     T.draw(lay, {hi, dim, reveal, under, a, c, tile, off, k})   hi: {tokenindex: szín} vagy fn(t) → szín | null; a nem
                                 kiemelt token dim alfájú (alap .25; hi nélkül nincs halványítás); reveal 0..1: a tokenek
                                 sorban beúsznak; under: {i: szín | {c, dash}} aláhúzás (pl. szófaj); tile: true | fn(t) →
                                 {bg, bd} csempe a token mögé; off: fn(t) → {dx, dy, a}; a: alfa; c: alapszín
     T.morph(layA, layB, u, {hi, a})   két betűszintű elrendezés áttűnése (írás ↔ [ejtés]): a közös betűk (diff) a helyükre
                                 úsznak, a kiesők lefelé halványulnak, az újak felülről úsznak be (hi: az új betűk színe)
     T.pick(lay, px, py)         → a pont alatti token (szóköz nélkül) vagy null
     T.tile(s, x, y, o)          → {x, y, w, h}: szöveghez méretezett csempe; o: s, f, w, c (betű), bg, bd, lw, pad, r, dash,

*/
const MagText = (() => {
  const U = Lesson.U, F = Lesson.FONTS;
  const ABC = ['a', 'á', 'b', 'c', 'cs', 'd', 'dz', 'dzs', 'e', 'é', 'f', 'g', 'gy', 'h', 'i', 'í', 'j', 'k', 'l', 'ly', 'm',
    'n', 'ny', 'o', 'ó', 'ö', 'ő', 'p', 'q', 'r', 's', 'sz', 't', 'ty', 'u', 'ú', 'ü', 'ű', 'v', 'w', 'x', 'y', 'z', 'zs'];

        out.push({ s: b, t: b, i: ci + 1, n: d.length, kind: 'c' });

      }
      d = DI.find((x) => lo.startsWith(x));

      i += n; ci += n;

  }
  const letters = (s) => split(s).filter((x) => x.kind !== 'x').map((x) => x.s);
  const vowels = (s) => split(s).filter((x) => x.kind === 'v').map((x) => {
    const lo = x.t.toLowerCase();
    return { i: x.i, v: x.t, long: !!x.long, h: DEEP.includes(lo) ? 'mély' : 'magas', round: ROUND.includes(lo) };
  });
  function harmony(s) {

    const d = v.some((x) => x.h === 'mély'), f = v.some((x) => x.h === 'magas');

    const V = []; t.forEach((x, j) => { if (x.kind === 'v') V.push(j); });

    for (let j = 0; j + 1 < V.length; j++) { const a = V[j], b = V[j + 1]; cuts.push(b - a - 1 >= 1 ? b - 1 : b); }

    for (let j = 0; j < n; j++) if (A[j].long !== B[j].long) return { r: A[j].long ? 1 : -1, i: j, pass: 2 };
    for (let j = 0; j < n; j++) if (A[j].up !== B[j].up) return { r: A[j].up ? 1 : -1, i: j, pass: 3 };
