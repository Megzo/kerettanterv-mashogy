<script>
(function () {
'use strict';

/* ── MODUL: „Tippelj!” és bélyegek (TtTipp) · forrás: termeszettudomany-5-6/01-tocsa + 03-meres, egységesítve 2026-11-24 ── */
/* A természettudomány 5–6. sorozat közös mintái (szerződés 17.): kísérlet-/modellbélyeg és a „Tippelj! → kísérlet →
   magyarázat” jóslat. Csak a Lesson motorra épül (L.ctx, L.tx, L.pill, L.lab, L.button, L.controlsEl, L.panel, L.st,
   Lesson.U, Lesson.FONTS); a lecke kódjára nem hivatkozik. A panel elmosásához szükséges CSS-t (.tt-rejtett) és a
   letiltott csúszka halványítását a modul maga teszi a <head>-be – a leckében nem kell <style>-sor.

   BEKÖTÉS (a lecke kódjában, egyszer, legfelső szinten – a getterek miatt a sorrend mindegy):
     TtTipp.bind({ L: () => L, ga: () => GA });    // ga: a lecke alap-alfája (jelenet-áttűnés); alap: () => 1
     const { stamp, Tip, tipReset, panelVeil, veilIf, tipGuess, tipHide, tipControls, tipU, rhythm, tipHead, tipRow,
       tipFeedback } = TtTipp;
   ALFA: minden rajzoló a globalAlpha-t ga() · a (· belső áttűnés) értékre ÁLLÍTJA (nem szoroz a pillanatnyival, így
   egy korábbi halvány felirat nem tünteti el), a vonalstílust (lineCap/lineJoin/setLineDash) visszaállítja.

   stamp(kind, x, y, a, o) → doboz | null       kísérlet-/modellbélyeg a KemGHS.stamp stílusával (Bricolage 22 px,
        600, betűköz 0,08 em, −3°, papír alap, 2 px keret; 'tilos': 700, 3 px). (x, y): a bal szél közepe.
        Szöveg: az o.k || '<kind> bélyeg' .md-kulcs. Szín (STAMP): otthon kékeszöld, felnőtt okker, tilos #b3261e;
        tanári, modell, kitalált, nem méretarányos, sematikus, vázlatos, képzeletbeli (és minden más) halvány tinta.
        o = {k, col (szín felülírása), rot: −3 (fok), al: 'left' (igazítás)}. a ≤ 0,005 → nem rajzol.
   Tip(keys, ok) → P      jóslat-állapot. keys: a válaszok .md-kulcsai (egyben gombfeliratok), ok: a helyes kulcs (az
        init-ben is beállítható: P.ok = …). P = {keys, ok, guess: null | kulcs, gt: a választás L.st-je, btns, on}.
        P.on(k): választáskor hívódik (a lecke állítja, pl. a kísérlet vezérlőinek feloldására).
   tipReset(P)            alaphelyzet (az enter()-ben; utána veilIf(P)).
   panelVeil(on)          a panelszöveg 2. bekezdésétől (.lp-text > *, i > 0) elmos (on) / felold.
   veilIf(P)              panelVeil(!P.guess) – az enter()-ben a tipReset után.
   tipControls(P)         a tippgombok (L.button, P.keys sorrendben). A választás után csak ezek tűnnek el: a
        sorukba utána tett más gombok maradnak (ha a sorban nem marad látható gomb, a sor is eltűnik).
   tipGuess(P, k, gt)     választás (csak az első számít): P.guess = k, P.gt = gt ?? L.st, tipHide, panelVeil(false),
        P.on(k). A QA-állapotok is ezt hívhatják (pl. gt = L.st − 30: a kísérlet már lefutott).
   tipHide(P)             a tippgombok elrejtése (a tipGuess hívja; QA-állapotban kézzel is).
   tipU(P, st) → mp       a választás óta eltelt idő (st − P.gt), −1, ha még nincs tipp.
   rhythm(ph, a)          a „Tippelj! → kísérlet → magyarázat” sáv a vászon bal felső sarkában (x 40, y 46);
        ph: 0 / 1 / 2 az aktív szakasz.
   tipHead(P, st, a, qk, o) → y     fejléc: sáv + kérdés (qk, (40, 116), Fraunces 38, max 1280) + válaszsor (40, y).
        o = {tExp: 4,5 (a kísérlet hossza mp-ben: ennyi után vált a sáv „magyarázat”-ra, és mutatja a helyes
        választ), q2 (2. kérdéssor kulcsa, (40, 162); a válaszsor 46 px-szel lejjebb kerül), qv (a kérdés #-jeleinek
        értékei, sorban), y: 178 (a válaszsor közepe), noRhythm (a sáv nélkül – pl. olvasási kérdésnél)}.
        Visszaad: a válaszsor y-ja.
   tipRow(P, st, a, x, y, o) → [dobozok]    csak a válaszsor (a tipHead is ezt rajzolja), bárhová: a választásig
        semleges; a választott cinóber keretet és alatta „a te tipped” feliratot kap; o.tExp (0) mp múlva a helyes
        zöld keretet + pipát kap, a többi elhalványul. Dobozköz 54 px (a pipának).
   tipFeedback(P, st, a, x, y, o) → doboz | null    „Jó tipp!” (zöld) / „Sokan gondolják így – nézzük meg!”
        (kékeszöld) pill (x: bal szél, y: közép), a választás után 0,15 mp-cel beúszva. o = {s: 24, al: 'left', max}.
   .md-kulcsok (### Feliratok): tippelj felirat, kísérlet felirat, magyarázat felirat, a te tipped felirat, jó tipp
        felirat, rossz tipp felirat; a bélyegeké '<kind> bélyeg'.
   ──────────────────────────────────────────────────────────────────────────────────────────────────────── */
const TtTipp = (() => {
  'use strict';
  const U = Lesson.U, F = Lesson.FONTS, { clamp, lerp, smooth } = U;
  const INK = '#1c2440', MUT = '#565d72', RED = '#c8401c', TEAL = '#0a6f86', GOOD = '#1d7a45', BAD = '#b3261e', OKR = '#8f5a0c', CARD = '#fffaf1';
  const STAMP = { otthon: TEAL, felnőtt: OKR, tilos: BAD, tanári: MUT, modell: MUT, kitalált: MUT, 'nem méretarányos': MUT, sematikus: MUT, vázlatos: MUT, képzeletbeli: MUT };
  const KEYS = { ph: ['tippelj felirat', 'kísérlet felirat', 'magyarázat felirat'], mine: 'a te tipped felirat', ok: 'jó tipp felirat', bad: 'rossz tipp felirat' };
  let getL = () => null, ga = () => 1;
  if (typeof document !== 'undefined' && !document.getElementById('tt-tipp-css')) {
    const st = document.createElement('style'); st.id = 'tt-tipp-css';
    st.textContent = '.lp-text > .tt-rejtett { filter: blur(7px); opacity: .5; user-select: none; transition: filter .6s, opacity .6s; }\n'
      + '.lp-slider:has(input:disabled) { opacity: .45; }\n.lp-slider input:disabled { cursor: not-allowed; }';
    document.head.appendChild(st);
  }
  const Lx = () => getL(), cx = () => getL().ctx, lab = (k) => getL().lab(k);
  const al = (a) => { cx().globalAlpha = ga() * clamp(a); };
  const fillIn = (s, v) => { let i = 0; return s.replace(/#/g, () => (i < v.length ? v[i++] : '#')); };
  const rr = (c, x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, w, h, r); };
  function check(x, y, a) {                 // pipa (rajz, nem betűjel)
    const c = cx(); al(a); c.lineWidth = 4.5; c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = GOOD; c.beginPath();
    c.moveTo(x - 10, y); c.lineTo(x - 3, y + 8); c.lineTo(x + 11, y - 9); c.stroke(); c.lineCap = 'butt'; c.lineJoin = 'miter';
  }
  function arrow(x1, y1, x2, y2, col, w, hs) {
    const c = cx(), an = Math.atan2(y2 - y1, x2 - x1), bx = x2 - Math.cos(an) * hs * .8, by = y2 - Math.sin(an) * hs * .8;
    c.setLineDash([]); c.lineCap = 'round'; c.beginPath(); c.moveTo(x1, y1); c.lineTo(bx, by); c.strokeStyle = col; c.lineWidth = w; c.stroke(); c.lineCap = 'butt';
    c.beginPath(); c.moveTo(x2, y2); c.lineTo(x2 - hs * Math.cos(an - .45), y2 - hs * Math.sin(an - .45)); c.lineTo(x2 - hs * Math.cos(an + .45), y2 - hs * Math.sin(an + .45)); c.closePath();
    c.fillStyle = col; c.fill();
  }

  function bind(o = {}) { if (o.L) getL = o.L; if (o.ga) ga = o.ga; }
  function stamp(kind, x, y, a, o = {}) {
    if (a <= .005) return null;
    const L = Lx(), c = L.ctx, k = o.k || (kind + ' bélyeg'), col = o.col || STAMP[kind] || MUT, tilos = kind === 'tilos';
    c.save(); al(a); c.translate(x, y); c.rotate((o.rot == null ? -3 : o.rot) * Math.PI / 180);
    const b = L.pill(lab(k), 0, 0, { s: 22, w: tilos ? 700 : 600, ls: '0.08em', f: F.B, bg: CARD, bd: col, bw: tilos ? 3 : 2, c: col, r: 6, pad: 10, k, qa: false, a: o.al || 'left' });
    c.restore(); return b;
  }
  const Tip = (keys, ok) => ({ keys, ok, guess: null, gt: -99, btns: [], on: null });
  function tipReset(P) { P.guess = null; P.gt = -99; }
  function panelVeil(on) {
    const L = Lx(); if (!L || !L.panel) return;
    L.panel.querySelectorAll('.lp-text > *').forEach((p, i) => { if (i > 0) p.classList.toggle('tt-rejtett', !!on); });
  }
  const veilIf = (P) => panelVeil(!P.guess);
  function tipHide(P) {
    const rows = new Set();
    (P.btns || []).forEach((b) => { b.style.display = 'none'; if (b.parentNode) rows.add(b.parentNode); });
    rows.forEach((r) => { if (![...r.children].some((e) => e.style.display !== 'none')) r.style.display = 'none'; });
  }
  function tipGuess(P, k, gt) {
    if (P.guess) return;
    P.guess = k; P.gt = gt == null ? Lx().st : gt;
    tipHide(P); panelVeil(false);
    if (P.on) P.on(k);
  }
  function tipControls(P) { const L = Lx(); P.btns = P.keys.map((k) => L.button(lab(k), () => tipGuess(P, k), k)); }
  const tipU = (P, st) => (P.guess ? st - P.gt : -1);
  function rhythm(ph, a) {
    const L = Lx(), cols = [RED, TEAL, OKR];
    let x = 40;
    KEYS.ph.forEach((k, j) => {
      const on = ph === j, done = ph > j;
      al(a * (on ? 1 : done ? .7 : .4));
      const b = L.pill(lab(k), x, 46, { k, s: 22, w: 700, f: F.B, c: on ? '#ffffff' : cols[j], bg: on ? cols[j] : CARD, bd: cols[j], bw: 2, pad: 10 });
      x = b.x + b.w;
      if (j < 2) { al(a * .55); arrow(x + 8, 46, x + 34, 46, MUT, 3, 11); x += 44; }
    });
  }
  function tipRow(P, st, a, x, y, o = {}) {
    const L = Lx(), c = L.ctx, u = tipU(P, st), tx = o.tExp || 0, out = [];
    const rev = P.guess ? smooth((u - tx) / .5) : 0;
    P.keys.forEach((k) => {
      const mine = P.guess === k, ok = k === P.ok, g = rev * (ok ? 1 : 0);
      al(a * (P.guess && !mine && !ok ? lerp(1, .55, rev) : 1));
      const b = L.pill(lab(k), x, y, { k, s: 26, w: 600, f: F.B, c: INK, bg: g > .5 ? '#eef6ee' : CARD, bd: g > .5 ? GOOD : 'rgba(28,36,64,.35)', bw: g > .5 ? 3 : 2, pad: 14 });
      if (mine) {
        al(a * smooth(u / .3)); rr(c, b.x - 6, b.y - 6, b.w + 12, b.h + 12, (b.h + 12) / 2); c.strokeStyle = RED; c.lineWidth = 3.5; c.stroke();
        L.tx(lab(KEYS.mine), b.x + b.w / 2, b.y + b.h + 30, { k: KEYS.mine, s: 22, w: 700, f: F.B, c: RED, a: 'center' });
      }
      if (g > 0) check(b.x + b.w + 24, y, a * g);
      out.push(b); x = b.x + b.w + 54;
    });
    return out;
  }
  function tipHead(P, st, a, qk, o = {}) {
    const L = Lx(), u = tipU(P, st), tx = o.tExp || 4.5;
    if (!o.noRhythm) rhythm(!P.guess ? 0 : u < tx ? 1 : 2, a);
    const q = { f: F.D, s: 38, w: 600, c: INK, max: 1280 };
    al(a); L.tx(o.qv ? fillIn(lab(qk), o.qv) : lab(qk), 40, 116, Object.assign({ k: qk }, q));
    let y = o.y || 178;
    if (o.q2) { al(a); L.tx(lab(o.q2), 40, 162, Object.assign({ k: o.q2 }, q)); y += 46; }
    tipRow(P, st, a, 40, y, { tExp: tx });
    return y;
  }
  function tipFeedback(P, st, a, x, y, o = {}) {
    if (!P.guess) return null;
    const u = tipU(P, st), ok = P.guess === P.ok, k = ok ? KEYS.ok : KEYS.bad;
    al(a * smooth((u - .15) / .4));
    return Lx().pill(lab(k), x, y, { k, s: o.s || 24, w: 700, f: F.B, c: ok ? GOOD : TEAL, bg: CARD, bd: ok ? GOOD : TEAL, bw: 2.5, pad: 12, a: o.al || 'left', max: o.max });
  }
  return { bind, STAMP, stamp, Tip, tipReset, panelVeil, veilIf, tipGuess, tipHide, tipControls, tipU, rhythm, tipHead, tipRow, tipFeedback };
})();

/* ── MODUL: Gráfok és fák (MatGraf) · forrás: matematika-9-10/03-fa-diagram, 2026-11-24 ─────────────────────────
   Terv: pilot/matematika-9-10/terv.md 3. (03-fa-diagram, 15-valoszinuseg) és 5.2 („MatGraf”, leckén belül).
   Csak a Lesson motorra (L.ctx, L.tx, Lesson.U, Lesson.FONTS) épül; lecke-specifikus kódra nem hivatkozik.
   A MatRand.tree (5–6) kis, címkés ágrajzra elég; a MatGraf a nagy (kötegelt) és a nem egyenletes
   (esetszétválasztás) fát, a levelek összevonását, a teljes gráfot (kézfogás) és a Pascal-háromszöget
   (útszámlálás – a 15-ös Galton-deszkájához is) rajzolja.
   Felirat: {s, k} (szöveg + .md-kulcs), sima szöveg (kódban rögzített jel/szám) vagy null; L.tx írja ki.
   Az átlátszóság (o.a) ABSZOLÚT: a hívó szorozza bele a jelenet-áttűnést. Minden rajzoló save/restore-ral
   visszaállítja a vászonállapotot.

   ── Fa (balról jobbra nő) ──
   const T = MatGraf.layout({x, y, w, h, deg, depth, maxNodes = 40, maxLines = 1500})
     deg: [3, 2, 2] (szintenként azonos elágazás) vagy (path, l) → elágazás (l = path.length; nem egyenletes fa,
          pl. esetszétválasztás – ekkor depth is kell, és a fa legyen teljesen bejárható, ≤ maxLines levél)
     Minden csúcs függőleges sávja (y0..y1) a leveleinek számával arányos: az esetek magassága = esetszám.
     Szintenkénti rajzmód (T.mode[l]): n ≤ maxNodes → 'node' (kör, felirat) · n ≤ maxLines → 'line' (vékony
          ág, kis pötty) · fölötte → 'band' (köteg: legyező a szülőtől a gyerekei sávjáig; ha a szülőszint is
          köteg, egyetlen teljes sáv). Így 26 · 26 · 26 · 10 · 10 · 10 levél is rajzolható.
     T.D (szintek) · T.X(l) · T.n[l] (csúcsok száma; T.n[T.D] = T.total levél) · T.mode[l] · T.pitch(l)
     T.lv[l] – az l. szint bejárt csúcsai {path, lvl, x, y, y0, y1, leaves, par} (null, ha nincs bejárva)
     T.leaves – a levelek (= T.lv[T.D] vagy []) · T.at(path) → {x, y, y0, y1} bármely útra (tömb-deg esetén
          a be nem járt szinteken is, zárt képlettel) · T.index(path) / T.path(i) – a levél sorszáma ↔ út
          (lexikografikus, 0-tól; tömb-deg) · T.hit(px, py, dx = 40) → a legközelebbi levél útja | null
   MatGraf.tree(L, T, o) → T     rajz. o: {t: 0..1 (szintenként nő), a, r = 16 (kör; szám vagy (l) → sugár),
          lw = 3, col(path) → szín (ág + csúcs; alap tinta), label(path) → {s, k} | szöveg | null (a körben),
          ls (betű px, alap max(22, 1,15 r)), node(L, path, x, y, al, r) (saját csúcsrajzoló, 'node' mód),
          hi(path) → 0..1 (kiemelés; null: minden teljes), dim = .22, root: true (gyökérpont),
          path: [...] (kiemelt út, minden módban), pathCol = cinóber, pathLw = 5,
          leafTo(path) → [x, y] | null, collapse: 0..1 | (path) → 0..1 (a 'node' módú levelek ívben a célba
          repülnek; a helyükön halvány „szellem” marad), lift = 50}
          → a levelek pillanatnyi helye: T.leaves[i].cx, .cy (a csúcsrajzoló is ott rajzol)
   ── Gráf ──
   MatGraf.ring(n, cx, cy, r, rot = −π/2) → [[x, y]…]  (n csúcs körön, az első fölül, óramutató szerint)
   MatGraf.complete(n) → [[0, 1], [0, 2], …, [0, n−1], [1, 2], …]  (csúcsonként az „új” élek, sorban)
   MatGraf.graph(L, {pos, edges, prog (kirajzolt élek száma, tört: az utolsó éppen nő; alap: mind),
          dbl: 0..1 (élenként két ellentétes nyíl), dir: 0..1 (egy nyíl i → j), col(i, e) → élszín (i: az él
          kezdőcsúcsa, e: sorszáma), lw = 3, r = 24 (csúcs), label(i) → {s, k} | szöveg, ncol(i) → csúcsszín,
          hi(i) → 0..1, ehi(e) → 0..1, dim = .2, a, ls}) → {mid(e) → [x, y]}
   ── Pascal-háromszög, útszámlálás ──
   MatGraf.binom(n, k) (pontos 2⁵³-ig) · MatGraf.fall(n, k) = n · (n − 1) · … (k tényező) · MatGraf.prod([…])
   MatGraf.pascal(L, {x (a csúcs közepe), y, rows (0..rows), dx = 64, dy = 56, r = 24, t = 1 (soronként jelenik
          meg), val(n, k) = binom, hi(n, k) → szín | null, sum: [n, k] (a két „szülőből” nyíl), dim = 1 (a nem
          kiemelt cellák α-ja), a, s = 24}) → {pos(n, k) → [x, y]}
   MatGraf.fly(p0, p1, t, lift = 60) → [x, y]  (ív fölfelé; t simítva)
   ──────────────────────────────────────────────────────────────────────────────────────────────────────── */
const MatGraf = (() => {
  'use strict';
  const U = Lesson.U, F = Lesson.FONTS, clamp = U.clamp, lerp = U.lerp, TAU = Math.PI * 2;
  const INK = '#1c2440', CARD = '#fffaf1', RED = '#c8401c', LINE = 'rgba(28,36,64,.16)';
  const lite = (col) => U.mix(col, '#fffaf1', .72), dark = (col) => U.mix(col, '#1c2440', .3);
  const A = (o) => (o && o.a != null ? clamp(o.a) : 1);
  const TX = (x) => (x == null ? null : typeof x === 'string' || typeof x === 'number' ? { s: String(x) } : x);
  const hex = (col) => /^#[0-9a-f]{6}$/i.test(col);
  const rgba = (col, al) => (hex(col) ? U.rgba(col, al) : col);

  const prod = (arr) => arr.reduce((p, v) => p * v, 1);
  const fall = (n, k) => { let r = 1; for (let i = 0; i < k; i++) r *= (n - i); return r; };
  function binom(n, k) { if (k < 0 || k > n) return 0; k = Math.min(k, n - k); let r = 1; for (let i = 1; i <= k; i++) r = r * (n - k + i) / i; return Math.round(r); }
  const fly = (p0, p1, t, lift = 60) => { const q = U.inOut(t); return [lerp(p0[0], p1[0], q), lerp(p0[1], p1[1], q) - Math.sin(Math.PI * q) * lift]; };

  /* ── fa: elrendezés ── */
  function layout(o) {
    const fn = typeof o.deg === 'function', D = fn ? o.depth : o.deg.length;
    const dg = (p) => (fn ? o.deg(p, p.length) : o.deg[p.length]);
    const maxN = o.maxNodes || 40, maxL = o.maxLines || 1500;
    const X = (l) => o.x + o.w * l / D;
    const memo = new Map();
    const leaves = (p) => {
      if (p.length >= D) return 1;
      if (!fn) { let r = 1; for (let l = p.length; l < D; l++) r *= o.deg[l]; return r; }
      const key = p.join(','); if (memo.has(key)) return memo.get(key);
      let s = 0; const d = dg(p); for (let k = 0; k < d; k++) s += leaves(p.concat([k]));
      memo.set(key, s); return s;
    };
    const cnt = (p, l) => { if (p.length === l) return 1; let s = 0; const d = dg(p); for (let k = 0; k < d; k++) s += cnt(p.concat([k]), l); return s; };
    const T = { D, X, x: o.x, y: o.y, w: o.w, h: o.h, n: [1], mode: [ 'node' ], lv: [], total: leaves([]) };
    for (let l = 1; l <= D; l++) T.n[l] = fn ? cnt([], l) : T.n[l - 1] * o.deg[l - 1];
    for (let l = 1; l <= D; l++) T.mode[l] = T.n[l] <= maxN ? 'node' : T.n[l] <= maxL ? 'line' : 'band';
    T.pitch = (l) => o.h / Math.max(1, T.n[l]);
    const map = new Map();
    const root = { path: [], lvl: 0, x: X(0), y: o.y + o.h / 2, y0: o.y, y1: o.y + o.h, leaves: T.total, par: null };
    T.lv[0] = [root]; map.set('', root);
    for (let l = 1; l <= D; l++) {
      if (!T.lv[l - 1] || T.n[l] > maxL) { T.lv[l] = null; continue; }
      const out = [];
      T.lv[l - 1].forEach((pa) => {
        const d = dg(pa.path); let y = pa.y0;
        for (let k = 0; k < d; k++) {
          const p = pa.path.concat([k]), lf = leaves(p), hh = (pa.y1 - pa.y0) * lf / Math.max(1, pa.leaves);
          const nd = { path: p, lvl: l, x: X(l), y: y + hh / 2, y0: y, y1: y + hh, leaves: lf, par: pa };
          y += hh; out.push(nd); map.set(p.join(','), nd);
        }
      });
      T.lv[l] = out;
    }
    T.nodes = [].concat(...T.lv.filter(Boolean));
    T.leaves = T.lv[D] || [];
    T.at = (p) => {
      const nd = map.get(p.join(',')); if (nd) return nd;
      if (fn) return null;
      let y0 = o.y, y1 = o.y + o.h;
      for (let l = 0; l < p.length; l++) { const d = o.deg[l], hh = (y1 - y0) / d; y0 += hh * p[l]; y1 = y0 + hh; }
      return { x: X(p.length), y: (y0 + y1) / 2, y0, y1 };
    };
    T.index = (p) => { let i = 0; for (let l = 0; l < D; l++) i = i * (fn ? 1 : o.deg[l]) + (p[l] || 0); return i; };
    T.path = (i) => { const p = []; for (let l = D - 1; l >= 0; l--) { const d = o.deg[l]; p.unshift(i % d); i = Math.floor(i / d); } return p; };
    T.hit = (px, py, dx = 40) => {
      if (!T.leaves.length || Math.abs(px - X(D)) > dx) return null;
      let best = null, bd = 1e9;
      T.leaves.forEach((nd) => { const d = Math.abs(py - nd.y); if (d < bd && d <= Math.max(6, (nd.y1 - nd.y0) / 2 + 2)) { bd = d; best = nd; } });
      return best ? best.path.slice() : null;
    };
    return T;
  }

  /* ── fa: rajz ── */
  function tree(L, T, o = {}) {
    const c = L.ctx, a = A(o), D = T.D;
    T.leaves.forEach((nd) => { nd.cx = nd.x; nd.cy = nd.y; });
    if (a <= 0) return T;
    const t = o.t == null ? 1 : clamp(o.t), dim = o.dim == null ? .22 : o.dim;
    const R = (l) => (typeof o.r === 'function' ? o.r(l) : o.r || 16);
    const lvT = (l) => clamp(t * D - (l - 1));
    const emph = (p) => (o.hi ? lerp(dim, 1, clamp(o.hi(p))) : 1);
    const col = (p) => (o.col && o.col(p)) || INK;
    const rad = (l) => (l === 0 ? (o.root === false ? 0 : 7) : T.mode[l] === 'node' ? R(l) : 0);
    c.save(); c.setLineDash([]); c.lineCap = 'round'; c.lineJoin = 'round';
    for (let l = 1; l <= D; l++) {
      const g = lvT(l); if (g <= 0) break;
      const q = U.out(g), md = T.mode[l], x0 = T.X(l - 1), x1 = T.X(l);
      if (md !== 'band') {
        const lw = md === 'node' ? (o.lw || 3) : clamp(T.pitch(l) * .45, .6, 2);
        T.lv[l].forEach((nd) => {
          // középponttól középpontig mutató szakasz, a két végén a csúcsok sugarával rövidítve
          const pa = nd.par, dx = x1 - x0, dy = nd.y - pa.y, d = Math.hypot(dx, dy) || 1, ux = dx / d, uy = dy / d;
          const s0 = Math.min(rad(l - 1), d / 2), s1 = Math.max(s0, d - rad(l)), se = lerp(s0, s1, q);
          c.globalAlpha = a * emph(nd.path) * (md === 'line' ? .8 : 1); c.strokeStyle = col(nd.path); c.lineWidth = lw;
          c.beginPath(); c.moveTo(x0 + ux * s0, pa.y + uy * s0); c.lineTo(x0 + ux * se, pa.y + uy * se); c.stroke();
        });
        if (md === 'line' && g >= 1 && T.pitch(l) >= 5) {
          const pr = Math.min(4, T.pitch(l) * .3);
          T.lv[l].forEach((nd) => { c.globalAlpha = a * emph(nd.path); c.fillStyle = col(nd.path); c.beginPath(); c.arc(x1, nd.y, pr, 0, TAU); c.fill(); });
        }
      } else {
        const prev = T.lv[l - 1];
        c.save(); c.beginPath(); c.rect(x0 - 2, T.y - 6, (x1 - x0) * q + 4, T.h + 12); c.clip();
        if (prev) {
          prev.forEach((pa) => {
            const cc = col(pa.path), ins = Math.min(1, (pa.y1 - pa.y0) * .08);
            c.globalAlpha = a * emph(pa.path) * .2; c.fillStyle = rgba(cc, 1);
            c.beginPath(); c.moveTo(x0 + rad(l - 1), pa.y); c.lineTo(x1, pa.y0 + ins); c.lineTo(x1, pa.y1 - ins); c.closePath(); c.fill();
            c.globalAlpha = a * emph(pa.path) * .55; c.strokeStyle = cc; c.lineWidth = prev.length > 200 ? .6 : 1.2; c.stroke();
          });
        } else {
          c.globalAlpha = a * .13; c.fillStyle = INK; c.fillRect(x0, T.y, x1 - x0, T.h);
          c.globalAlpha = a * .35; c.strokeStyle = INK; c.lineWidth = 1; c.beginPath();
          for (let i = 0; i <= 24; i++) { const yy = T.y + T.h * i / 24; c.moveTo(x0, yy); c.lineTo(x1, yy); }
          c.stroke();
        }
        c.restore();
        if (g >= 1) { c.globalAlpha = a; c.strokeStyle = INK; c.lineWidth = 3; c.beginPath(); c.moveTo(x1, T.y); c.lineTo(x1, T.y + T.h); c.stroke(); }
      }
    }
    // kiemelt út
    if (o.path && o.path.length) {
      c.globalAlpha = a; c.strokeStyle = o.pathCol || RED; c.lineWidth = o.pathLw || 5; c.beginPath();
      let pt = T.at([]); c.moveTo(pt.x, pt.y);
      for (let l = 1; l <= Math.min(D, o.path.length); l++) {
        const g = lvT(l); if (g <= 0) break;
        const nx = T.at(o.path.slice(0, l)), q = U.out(g);
        c.lineTo(lerp(pt.x, nx.x, q), lerp(pt.y, nx.y, q)); pt = nx;
      }
      c.stroke();
    }
    // gyökér
    if (o.root !== false) { c.globalAlpha = a; c.fillStyle = INK; c.beginPath(); c.arc(T.X(0), T.lv[0][0].y, 7, 0, TAU); c.fill(); }
    // csúcsok ('node' mód)
    for (let l = 1; l <= D; l++) {
      if (T.mode[l] !== 'node' || !T.lv[l]) continue;
      const g = clamp((lvT(l) - .7) / .3); if (g <= 0) continue;
      const r = R(l);
      T.lv[l].forEach((nd) => {
        let x = nd.x, y = nd.y, al = a * g * emph(nd.path);
        if (l === D && o.leafTo && o.collapse) {
          const cl = clamp(typeof o.collapse === 'function' ? o.collapse(nd.path) : o.collapse), to = cl > 0 ? o.leafTo(nd.path) : null;
          if (to) {
            const ghost = al * .22;
            if (o.node) { c.save(); o.node(L, nd.path, x, y, ghost * (1 - cl * .4), r, true); c.restore(); }
            else { c.globalAlpha = ghost; c.strokeStyle = dark(col(nd.path)); c.lineWidth = 2; c.beginPath(); c.arc(x, y, r, 0, TAU); c.stroke(); }
            [x, y] = fly([nd.x, nd.y], to, cl, o.lift == null ? 50 : o.lift);
          }
        }
        nd.cx = x; nd.cy = y;
        if (o.node) { c.save(); o.node(L, nd.path, x, y, al, r, false); c.restore(); return; }
        const cc = col(nd.path), onPath = o.path && o.path.length >= l && o.path.slice(0, l).every((v, i) => v === nd.path[i]);
        c.globalAlpha = al; c.fillStyle = lite(cc); c.strokeStyle = dark(cc); c.lineWidth = 3;
        c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill(); c.stroke();
        if (onPath) { c.strokeStyle = o.pathCol || RED; c.lineWidth = 3.5; c.beginPath(); c.arc(x, y, r + 5, 0, TAU); c.stroke(); }
        const lb = o.label ? TX(o.label(nd.path)) : null;
        if (lb && lb.s) { c.globalAlpha = al; L.tx(lb.s, x, y + 1, { k: lb.k, s: o.ls || Math.max(22, r * 1.15), w: 700, f: F.B, a: 'center', b: 'middle', c: dark(cc) }); }
      });
    }
    c.restore();
    return T;
  }

  /* ── gráf ── */
  const ring = (n, cx, cy, r, rot = -Math.PI / 2) => { const out = []; for (let i = 0; i < n; i++) { const t = rot + TAU * i / n; out.push([cx + r * Math.cos(t), cy + r * Math.sin(t)]); } return out; };
  const complete = (n) => { const e = []; for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) e.push([i, j]); return e; };
  function arrowHead(c, x, y, ux, uy, s) {
    c.beginPath(); c.moveTo(x, y); c.lineTo(x - ux * s - uy * s * .5, y - uy * s + ux * s * .5); c.lineTo(x - ux * s + uy * s * .5, y - uy * s - ux * s * .5); c.closePath(); c.fill();
  }
  function graph(L, o) {
    const c = L.ctx, a = A(o), P = o.pos, E = o.edges || [], r = o.r || 24, dim = o.dim == null ? .2 : o.dim;
    const prog = o.prog == null ? E.length : o.prog, dbl = clamp(o.dbl || 0), dir = clamp(o.dir || 0);
    const res = { mid: (e) => { const [i, j] = E[e]; return [(P[i][0] + P[j][0]) / 2, (P[i][1] + P[j][1]) / 2]; } };
    if (a <= 0) return res;
    c.save(); c.setLineDash([]); c.lineCap = 'round'; c.lineJoin = 'round';
    E.forEach(([i, j], e) => {
      const g = clamp(prog - e); if (g <= 0) return;
      const [x0, y0] = P[i], [x1, y1] = P[j], dx = x1 - x0, dy = y1 - y0, d = Math.hypot(dx, dy) || 1, ux = dx / d, uy = dy / d, nx = -uy, ny = ux;
      const s0 = r + 4, s1 = d - r - 4, cc = o.col ? o.col(i, e) : INK, em = o.ehi ? lerp(dim, 1, clamp(o.ehi(e))) : 1, lw = o.lw || 3;
      c.strokeStyle = cc; c.fillStyle = cc; c.lineWidth = lw;
      const seg = (off, fromI, al, head) => {
        const sa = fromI ? s0 : d - s0, sb = fromI ? lerp(s0, s1, g) : lerp(d - s0, d - s1, g);
        const ax = x0 + ux * sa + nx * off, ay = y0 + uy * sa + ny * off, bx = x0 + ux * sb + nx * off, by = y0 + uy * sb + ny * off;
        c.globalAlpha = a * em * al; c.beginPath(); c.moveTo(ax, ay); c.lineTo(bx, by); c.stroke();
        if (head > .01 && g >= 1) { c.globalAlpha = a * em * al * head; arrowHead(c, bx, by, fromI ? ux : -ux, fromI ? uy : -uy, 9 + lw * 1.6); }
      };
      if (dbl <= .001) seg(0, true, 1, dir);
      else { const off = 6.5 * dbl; seg(off, true, 1, Math.max(dir, dbl)); seg(-off, false, dbl, dbl); }
    });
    P.forEach(([x, y], i) => {
      const cc = o.ncol ? o.ncol(i) : INK, al = a * (o.hi ? lerp(dim, 1, clamp(o.hi(i))) : 1);
      c.globalAlpha = al; c.fillStyle = lite(cc); c.strokeStyle = dark(cc); c.lineWidth = 3;
      c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill(); c.stroke();
      const lb = o.label ? TX(o.label(i)) : null;
      if (lb && lb.s) { c.globalAlpha = al; L.tx(lb.s, x, y + 1, { k: lb.k, s: o.ls || Math.max(22, r * .95), w: 700, f: F.B, a: 'center', b: 'middle', c: dark(cc) }); }
    });
    c.restore();
    return res;
  }

  /* ── Pascal-háromszög ── */
  function pascal(L, o) {
    const c = L.ctx, a = A(o), dx = o.dx || 64, dy = o.dy || 56, r = o.r || 24, rows = o.rows, t = o.t == null ? 1 : clamp(o.t);
    const pos = (n, k) => [o.x + (k - n / 2) * dx, o.y + n * dy];
    const res = { pos };
    if (a <= 0) return res;
    const val = o.val || binom, dimA = o.dim == null ? 1 : o.dim;
    const ap = (n) => clamp(t * (rows + 1) - n);
    c.save(); c.setLineDash([]); c.lineCap = 'round';
    if (o.sum) {
      const [n, k] = o.sum, col = (o.hi && o.hi(n, k)) || RED, q = ap(n);
      [[n - 1, k - 1], [n - 1, k]].forEach(([pn, pk]) => {
        if (pk < 0 || pk > pn || q <= 0) return;
        const [x0, y0] = pos(pn, pk), [x1, y1] = pos(n, k), d = Math.hypot(x1 - x0, y1 - y0), ux = (x1 - x0) / d, uy = (y1 - y0) / d;
        c.globalAlpha = a * q; c.strokeStyle = col; c.fillStyle = col; c.lineWidth = 3;
        const bx = x1 - ux * (r + 3), by = y1 - uy * (r + 3);
        c.beginPath(); c.moveTo(x0 + ux * (r + 3), y0 + uy * (r + 3)); c.lineTo(bx, by); c.stroke(); arrowHead(c, bx, by, ux, uy, 12);
      });
    }
    for (let n = 0; n <= rows; n++) {
