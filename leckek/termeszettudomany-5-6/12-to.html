   BioNet.arrow(c, x1, y1, x2, y2, {col, w = 3, head = 16, dash, bend = 0}) – nyíl (egyenes / ív)
   BioNet.pyramid(L, {cx, y (az alsó sáv alja), W (legszélesebb), h (sávmagasság), gap = 8,
             vals: [alulról felfelé], log = 0 (0 arányos … 1 log; morf), decades = vals.length,

   ──────────────────────────────────────────────────────────────────────────────────────────── */
const BioNet = (() => {
  'use strict';
  const TAU = Math.PI * 2;
  const COL = { ink: '#1c2440', mut: '#565d72', card: '#fffaf1', gold: '#f2b632', goldL: '#8f5a0c', heat: '#c8401c', teal: '#0a6f86', red: '#c8401c' };
  const STY = { eszik: { col: COL.ink, w: 3 }, elhalt: { col: '#6b5a3e', w: 2.5, dash: [8, 7] }, tápanyag: { col: '#6b6a12', w: 2.5, dash: [3, 7] } };
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const smooth = (t) => { t = clamp(t); return t * t * (3 - 2 * t); };
  const hash = (i, j = 0, k = 0) => { let h = (i * 374761393 + j * 668265263 + k * 1274126177) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; h = Math.imul(h ^ (h >>> 15), 2246822519); h ^= h >>> 13; return (h >>> 0) / 4294967296; };
  function mkPath(pts) { const cum = [0]; for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1])); return { pts, cum, len: cum[cum.length - 1] }; }
  function along(P, u) {

    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (P.cum[m] <= s) lo = m; else hi = m; }
    const a = P.pts[lo], b = P.pts[hi], d = (P.cum[hi] - P.cum[lo]) || 1, t = (s - P.cum[lo]) / d;
    let dx = b[0] - a[0], dy = b[1] - a[1]; const dl = Math.hypot(dx, dy) || 1;
    return [a[0] + dx * t, a[1] + dy * t, dx / dl, dy / dl];
  }
  function bezPts(p0, p2, bend, n = 48) {
    const dx = p2[0] - p0[0], dy = p2[1] - p0[1], len = Math.hypot(dx, dy) || 1;
    const q = [(p0[0] + p2[0]) / 2 + dy / len * bend * len, (p0[1] + p2[1]) / 2 - dx / len * bend * len], out = [];
    for (let i = 0; i <= n; i++) { const t = i / n, m = 1 - t; out.push([m * m * p0[0] + 2 * m * t * q[0] + t * t * p2[0], m * m * p0[1] + 2 * m * t * q[1] + t * t * p2[1]]); }
    return out;

  function head(c, x, y, dx, dy, size, col) {

    c.save(); c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = col; c.lineWidth = o.w || 3; c.setLineDash(o.dash || []);

  },
