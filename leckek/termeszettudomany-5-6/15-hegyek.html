     const P = FoldSection.profile(D)  → {x: [km], z: [km], n, km, at(x) → z, lon(x) / lat(x) (a szelvény tengelye

     S.arrow(x1, z1, x2, z2, o)        mozgás-/feszültségnyíl: o = {color, w, head, dash, a, px: true → képernyő-px}

                                       'függőleges torzítás #×', k}, arany: {s: 'méretarányos', k}}; 0,95 < vex < 1,05 →

   Állapot nincs a modulban: minden hívás a megadott értékekből rajzol (a mozgást a hívó számolja L.st-ből).

const FoldSection = (() => {
  'use strict';
  const F = Lesson.FONTS, U = Lesson.U, TAU = Math.PI * 2;
  const INK = '#1c2440', MUT = '#565d72', CARD = '#fffaf1';
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  /* mintázatok: világos alap + sötétebb jel; 48 × 48 logikai px, csempézhető */
  const PAT = {
    'gránit': { bg: '#efd9c6', fg: '#8a4f3c', mark: 'plus' },
    'bazalt': { bg: '#cdc8c1', fg: '#3f4250', mark: 'vee' },
    'mészkő': { bg: '#ebe5cf', fg: '#7a7152', mark: 'brick' },
    'homok': { bg: '#f1dfab', fg: '#94732c', mark: 'dots' },
    'kavics': { bg: '#e5d3a7', fg: '#6f5a32', mark: 'rings' },
    'agyag': { bg: '#d8ccb4', fg: '#625645', mark: 'dash' },
    'lösz': { bg: '#eedba9', fg: '#8a6d2c', mark: 'vdash' },
    'üledék': { bg: '#e9dfc4', fg: '#7c6f52', mark: 'hline' },
    'köpeny': { bg: '#efd7b5', fg: '#a86a3c', mark: 'sparse' },
    'asztenoszféra': { bg: '#f2c9a0', fg: '#a8572a', mark: 'wave' },
    'magma': { bg: '#e8763a', fg: '#8c2a10', mark: 'dots' },
    'láva': { bg: '#c4482a', fg: '#6e1d0c', mark: 'wave' },
    'hamu': { bg: '#d3cdc3', fg: '#59545a', mark: 'dots' },
    'víz': { bg: '#a9cbe6', fg: '#1b5a94', mark: 'wave' },
    'jég': { bg: '#e6f0f5', fg: '#5c88a2', mark: 'crack' },
    'levegő': { bg: '#eef3f5', fg: '#9db3c2', mark: 'sparse' },
  };
  const cache = {};
  function makePattern(ctx, name) {
    const d = PAT[name]; if (!d) return null;
    const N = 48, K = 2, cv = document.createElement('canvas'); cv.width = cv.height = N * K;
    const g = cv.getContext('2d'); g.scale(K, K);
    g.fillStyle = d.bg; g.fillRect(0, 0, N, N);
    g.strokeStyle = d.fg; g.fillStyle = d.fg; g.lineWidth = 1.6; g.lineCap = 'round';
    const rnd = U.rng(7 + name.length * 13);
    const at = (n, f) => { for (let i = 0; i < n; i++) f(rnd() * N, rnd() * N, i); };
    const wrapDraw = (x, y, f) => { for (const ox of [-N, 0, N]) for (const oy of [-N, 0, N]) f(x + ox, y + oy); };
    switch (d.mark) {
      case 'plus': at(9, (x, y) => wrapDraw(x, y, (a, b) => { g.beginPath(); g.moveTo(a - 3, b); g.lineTo(a + 3, b); g.moveTo(a, b - 3); g.lineTo(a, b + 3); g.stroke(); })); break;
      case 'vee': for (let r = 0; r < 4; r++) for (let q = 0; q < 4; q++) { const a = q * 12 + (r % 2) * 6 + 3, b = r * 12 + 4; g.beginPath(); g.moveTo(a - 3, b); g.lineTo(a, b + 5); g.lineTo(a + 3, b); g.stroke(); } break;

   Lesson.U, Lesson.FONTS); a lecke kódjára nem hivatkozik. A panel elmosásához szükséges CSS-t (.tt-rejtett) és a
   letiltott csúszka halványítását a modul maga teszi a <head>-be – a leckében nem kell <style>-sor.

   BEKÖTÉS (a lecke kódjában, egyszer, legfelső szinten – a getterek miatt a sorrend mindegy):
     TtTipp.bind({ L: () => L, ga: () => GA });    // ga: a lecke alap-alfája (jelenet-áttűnés); alap: () => 1
     const { stamp, Tip, tipReset, panelVeil, veilIf, tipGuess, tipHide, tipControls, tipU, rhythm, tipHead, tipRow,
       tipFeedback } = TtTipp;
   ALFA: minden rajzoló a globalAlpha-t ga() · a (· belső áttűnés) értékre ÁLLÍTJA (nem szoroz a pillanatnyival, így
   egy korábbi halvány felirat nem tünteti el), a vonalstílust (lineCap/lineJoin/setLineDash) visszaállítja.

   stamp(kind, x, y, a, o) → doboz | null       kísérlet-/modellbélyeg a KemGHS.stamp stílusával (Bricolage 22 px,
        600, betűköz 0,08 em, −3°, papír alap, 2 px keret; 'tilos': 700, 3 px). (x, y): a bal szél közepe.
        Szöveg: az o.k || '<kind> bélyeg' .md-kulcs. Szín (STAMP): otthon kékeszöld, felnőtt okker, tilos #b3261e;
        tanári, modell, kitalált, nem méretarányos, sematikus, vázlatos, képzeletbeli (és minden más) halvány tinta.
        o = {k, col (szín felülírása), rot: −3 (fok), al: 'left' (igazítás)}. a ≤ 0,005 → nem rajzol.
   Tip(keys, ok) → P      jóslat-állapot. keys: a válaszok .md-kulcsai (egyben gombfeliratok), ok: a helyes kulcs (az
        init-ben is beállítható: P.ok = …). P = {keys, ok, guess: null | kulcs, gt: a választás L.st-je, btns, on}.
        P.on(k): választáskor hívódik (a lecke állítja, pl. a kísérlet vezérlőinek feloldására).
   tipReset(P)            alaphelyzet (az enter()-ben; utána veilIf(P)).
   panelVeil(on)          a panelszöveg 2. bekezdésétől (.lp-text > *, i > 0) elmos (on) / felold.
   veilIf(P)              panelVeil(!P.guess) – az enter()-ben a tipReset után.
   tipControls(P)         a tippgombok (L.button, P.keys sorrendben). A választás után csak ezek tűnnek el: a
        sorukba utána tett más gombok maradnak (ha a sorban nem marad látható gomb, a sor is eltűnik).
   tipGuess(P, k, gt)     választás (csak az első számít): P.guess = k, P.gt = gt ?? L.st, tipHide, panelVeil(false),
        P.on(k). A QA-állapotok is ezt hívhatják (pl. gt = L.st − 30: a kísérlet már lefutott).
   tipHide(P)             a tippgombok elrejtése (a tipGuess hívja; QA-állapotban kézzel is).
   tipU(P, st) → mp       a választás óta eltelt idő (st − P.gt), −1, ha még nincs tipp.
   rhythm(ph, a)          a „Tippelj! → kísérlet → magyarázat” sáv a vászon bal felső sarkában (x 40, y 46);
        ph: 0 / 1 / 2 az aktív szakasz.
   tipHead(P, st, a, qk, o) → y     fejléc: sáv + kérdés (qk, (40, 116), Fraunces 38, max 1280) + válaszsor (40, y).
        o = {tExp: 4,5 (a kísérlet hossza mp-ben: ennyi után vált a sáv „magyarázat”-ra, és mutatja a helyes
        választ), q2 (2. kérdéssor kulcsa, (40, 162); a válaszsor 46 px-szel lejjebb kerül), qv (a kérdés #-jeleinek
        értékei, sorban), y: 178 (a válaszsor közepe), noRhythm (a sáv nélkül – pl. olvasási kérdésnél)}.
        Visszaad: a válaszsor y-ja.
   tipRow(P, st, a, x, y, o) → [dobozok]    csak a válaszsor (a tipHead is ezt rajzolja), bárhová: a választásig
        semleges; a választott cinóber keretet és alatta „a te tipped” feliratot kap; o.tExp (0) mp múlva a helyes
        zöld keretet + pipát kap, a többi elhalványul. Dobozköz 54 px (a pipának).
   tipFeedback(P, st, a, x, y, o) → doboz | null    „Jó tipp!” (zöld) / „Sokan gondolják így – nézzük meg!”
        (kékeszöld) pill (x: bal szél, y: közép), a választás után 0,15 mp-cel beúszva. o = {s: 24, al: 'left', max}.
   .md-kulcsok (### Feliratok): tippelj felirat, kísérlet felirat, magyarázat felirat, a te tipped felirat, jó tipp
        felirat, rossz tipp felirat; a bélyegeké '<kind> bélyeg'.
   ──────────────────────────────────────────────────────────────────────────────────────────────────────── */
const TtTipp = (() => {
  'use strict';
  const U = Lesson.U, F = Lesson.FONTS, { clamp, lerp, smooth } = U;
  const INK = '#1c2440', MUT = '#565d72', RED = '#c8401c', TEAL = '#0a6f86', GOOD = '#1d7a45', BAD = '#b3261e', OKR = '#8f5a0c', CARD = '#fffaf1';
  const STAMP = { otthon: TEAL, felnőtt: OKR, tilos: BAD, tanári: MUT, modell: MUT, kitalált: MUT, 'nem méretarányos': MUT, sematikus: MUT, vázlatos: MUT, képzeletbeli: MUT };
  const KEYS = { ph: ['tippelj felirat', 'kísérlet felirat', 'magyarázat felirat'], mine: 'a te tipped felirat', ok: 'jó tipp felirat', bad: 'rossz tipp felirat' };
  let getL = () => null, ga = () => 1;
  if (typeof document !== 'undefined' && !document.getElementById('tt-tipp-css')) {
    const st = document.createElement('style'); st.id = 'tt-tipp-css';
    st.textContent = '.lp-text > .tt-rejtett { filter: blur(7px); opacity: .5; user-select: none; transition: filter .6s, opacity .6s; }\n'
      + '.lp-slider:has(input:disabled) { opacity: .45; }\n.lp-slider input:disabled { cursor: not-allowed; }';
    document.head.appendChild(st);
  }
  const Lx = () => getL(), cx = () => getL().ctx, lab = (k) => getL().lab(k);
  const al = (a) => { cx().globalAlpha = ga() * clamp(a); };
  const fillIn = (s, v) => { let i = 0; return s.replace(/#/g, () => (i < v.length ? v[i++] : '#')); };
  const rr = (c, x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, w, h, r); };
  function check(x, y, a) {                 // pipa (rajz, nem betűjel)
    const c = cx(); al(a); c.lineWidth = 4.5; c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = GOOD; c.beginPath();
    c.moveTo(x - 10, y); c.lineTo(x - 3, y + 8); c.lineTo(x + 11, y - 9); c.stroke(); c.lineCap = 'butt'; c.lineJoin = 'miter';
  }
  function arrow(x1, y1, x2, y2, col, w, hs) {
    const c = cx(), an = Math.atan2(y2 - y1, x2 - x1), bx = x2 - Math.cos(an) * hs * .8, by = y2 - Math.sin(an) * hs * .8;
    c.setLineDash([]); c.lineCap = 'round'; c.beginPath(); c.moveTo(x1, y1); c.lineTo(bx, by); c.strokeStyle = col; c.lineWidth = w; c.stroke(); c.lineCap = 'butt';
    c.beginPath(); c.moveTo(x2, y2); c.lineTo(x2 - hs * Math.cos(an - .45), y2 - hs * Math.sin(an - .45)); c.lineTo(x2 - hs * Math.cos(an + .45), y2 - hs * Math.sin(an + .45)); c.closePath();
    c.fillStyle = col; c.fill();
  }

  function bind(o = {}) { if (o.L) getL = o.L; if (o.ga) ga = o.ga; }
  function stamp(kind, x, y, a, o = {}) {
    if (a <= .005) return null;
    const L = Lx(), c = L.ctx, k = o.k || (kind + ' bélyeg'), col = o.col || STAMP[kind] || MUT, tilos = kind === 'tilos';
    c.save(); al(a); c.translate(x, y); c.rotate((o.rot == null ? -3 : o.rot) * Math.PI / 180);
    const b = L.pill(lab(k), 0, 0, { s: 22, w: tilos ? 700 : 600, ls: '0.08em', f: F.B, bg: CARD, bd: col, bw: tilos ? 3 : 2, c: col, r: 6, pad: 10, k, qa: false, a: o.al || 'left' });
    c.restore(); return b;
  }
  const Tip = (keys, ok) => ({ keys, ok, guess: null, gt: -99, btns: [], on: null });
  function tipReset(P) { P.guess = null; P.gt = -99; }
  function panelVeil(on) {
    const L = Lx(); if (!L || !L.panel) return;
    L.panel.querySelectorAll('.lp-text > *').forEach((p, i) => { if (i > 0) p.classList.toggle('tt-rejtett', !!on); });
  }
  const veilIf = (P) => panelVeil(!P.guess);
  function tipHide(P) {
    const rows = new Set();
    (P.btns || []).forEach((b) => { b.style.display = 'none'; if (b.parentNode) rows.add(b.parentNode); });
    rows.forEach((r) => { if (![...r.children].some((e) => e.style.display !== 'none')) r.style.display = 'none'; });
  }
  function tipGuess(P, k, gt) {
    if (P.guess) return;
    P.guess = k; P.gt = gt == null ? Lx().st : gt;
    tipHide(P); panelVeil(false);
    if (P.on) P.on(k);
  }
  function tipControls(P) { const L = Lx(); P.btns = P.keys.map((k) => L.button(lab(k), () => tipGuess(P, k), k)); }
  const tipU = (P, st) => (P.guess ? st - P.gt : -1);
  function rhythm(ph, a) {
    const L = Lx(), cols = [RED, TEAL, OKR];
    let x = 40;
    KEYS.ph.forEach((k, j) => {
      const on = ph === j, done = ph > j;
      al(a * (on ? 1 : done ? .7 : .4));
      const b = L.pill(lab(k), x, 46, { k, s: 22, w: 700, f: F.B, c: on ? '#ffffff' : cols[j], bg: on ? cols[j] : CARD, bd: cols[j], bw: 2, pad: 10 });
      x = b.x + b.w;
      if (j < 2) { al(a * .55); arrow(x + 8, 46, x + 34, 46, MUT, 3, 11); x += 44; }
    });
  }
  function tipRow(P, st, a, x, y, o = {}) {
    const L = Lx(), c = L.ctx, u = tipU(P, st), tx = o.tExp || 0, out = [];
    const rev = P.guess ? smooth((u - tx) / .5) : 0;
    P.keys.forEach((k) => {
      const mine = P.guess === k, ok = k === P.ok, g = rev * (ok ? 1 : 0);
      al(a * (P.guess && !mine && !ok ? lerp(1, .55, rev) : 1));
      const b = L.pill(lab(k), x, y, { k, s: 26, w: 600, f: F.B, c: INK, bg: g > .5 ? '#eef6ee' : CARD, bd: g > .5 ? GOOD : 'rgba(28,36,64,.35)', bw: g > .5 ? 3 : 2, pad: 14 });
      if (mine) {
        al(a * smooth(u / .3)); rr(c, b.x - 6, b.y - 6, b.w + 12, b.h + 12, (b.h + 12) / 2); c.strokeStyle = RED; c.lineWidth = 3.5; c.stroke();
        L.tx(lab(KEYS.mine), b.x + b.w / 2, b.y + b.h + 30, { k: KEYS.mine, s: 22, w: 700, f: F.B, c: RED, a: 'center' });
      }
      if (g > 0) check(b.x + b.w + 24, y, a * g);
      out.push(b); x = b.x + b.w + 54;
    });
    return out;
  }
  function tipHead(P, st, a, qk, o = {}) {
    const L = Lx(), u = tipU(P, st), tx = o.tExp || 4.5;
    if (!o.noRhythm) rhythm(!P.guess ? 0 : u < tx ? 1 : 2, a);
    const q = { f: F.D, s: 38, w: 600, c: INK, max: 1280 };
    al(a); L.tx(o.qv ? fillIn(lab(qk), o.qv) : lab(qk), 40, 116, Object.assign({ k: qk }, q));
    let y = o.y || 178;
    if (o.q2) { al(a); L.tx(lab(o.q2), 40, 162, Object.assign({ k: o.q2 }, q)); y += 46; }
    tipRow(P, st, a, 40, y, { tExp: tx });
    return y;
  }
  function tipFeedback(P, st, a, x, y, o = {}) {
    if (!P.guess) return null;
    const u = tipU(P, st), ok = P.guess === P.ok, k = ok ? KEYS.ok : KEYS.bad;
    al(a * smooth((u - .15) / .4));
    return Lx().pill(lab(k), x, y, { k, s: o.s || 24, w: 700, f: F.B, c: ok ? GOOD : TEAL, bg: CARD, bd: ok ? GOOD : TEAL, bw: 2.5, pad: 12, a: o.al || 'left', max: o.max });
  }
  return { bind, STAMP, stamp, Tip, tipReset, panelVeil, veilIf, tipGuess, tipHide, tipControls, tipU, rhythm, tipHead, tipRow, tipFeedback };
})();
/* ── MODUL VÉGE: TtTipp ── */

/* ════════════════ A lecke saját kódja ════════════════ */
const U = Lesson.U, { clamp, lerp, smooth, inOut, TAU } = U, fmt = U.fmt;
const F = Lesson.FONTS;
const INK = '#1c2440', MUT = '#565d72', RED = '#c8401c', TEAL = '#0a6f86', GOOD = '#1d7a45', BAD = '#b3261e', OKR = '#8f5a0c',
  CARD = '#fffaf1', LINE = 'rgba(28,36,64,.16)', WF = 'rgba(70,150,215,.42)', WD = '#1b5a94', ICED = '#5c88a2';
let L, c, GA = 1;
const al = (a = 1) => { c.globalAlpha = GA * clamp(a); };
const lab = (k) => L.lab(k), num = (k) => L.num(k);
const T = (k, x, y, o = {}) => L.tx(lab(k), x, y, Object.assign({ k }, o));
const fillIn = (k, v) => { let i = 0; return lab(k).replace(/#/g, () => (i < v.length ? v[i++] : '#')); };
const TN = (k, v, x, y, o = {}) => L.tx(fillIn(k, v), x, y, Object.assign({ k }, o));
const PN = (k, v, x, y, o = {}) => L.pill(fillIn(k, v), x, y, Object.assign({ k }, o));
const rr = (x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, w, h, r); };
const ln = (x1, y1, x2, y2, col, w = 2, dash) => { c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.strokeStyle = col; c.lineWidth = w; c.setLineDash(dash || []); c.stroke(); c.setLineDash([]); };
const DEG = (v, d = 0) => fmt(v, d) + ' °C';
const rng = (seed) => U.rng(seed);

function background() {
  c.globalAlpha = 1;
  const g = c.createRadialGradient(680, 480, 100, 680, 540, 1300); g.addColorStop(0, '#f7f1e6'); g.addColorStop(1, '#efe6d6');
  c.fillStyle = g; c.fillRect(0, 0, 1920, 1080);
  c.strokeStyle = 'rgba(28,36,64,.045)'; c.lineWidth = 1; c.beginPath();
  for (let x = 0; x <= 1920; x += 40) { c.moveTo(x + .5, 0); c.lineTo(x + .5, 1080); }
  for (let y = 0; y <= 1080; y += 40) { c.moveTo(0, y + .5); c.lineTo(1920, y + .5); }
  c.stroke();
}
function card(x, y, w, h, a, bg, bd) { al(a); rr(x, y, w, h, 16); c.fillStyle = bg || CARD; c.fill(); c.strokeStyle = bd || LINE; c.lineWidth = 2; c.stroke(); }
function arrowTo(x1, y1, x2, y2, col, w = 4, hs = 16) {
  const an = Math.atan2(y2 - y1, x2 - x1), bx = x2 - Math.cos(an) * hs * .8, by = y2 - Math.sin(an) * hs * .8;
  c.lineCap = 'round'; ln(x1, y1, bx, by, col, w); c.lineCap = 'butt';
  c.beginPath(); c.moveTo(x2, y2); c.lineTo(x2 - hs * Math.cos(an - .45), y2 - hs * Math.sin(an - .45)); c.lineTo(x2 - hs * Math.cos(an + .45), y2 - hs * Math.sin(an + .45)); c.closePath();
  c.fillStyle = col; c.fill();
}
function check(x, y, a, col = GOOD) {   // pipa (rajz, nem betűjel)
  al(a); c.lineWidth = 4.5; c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = col; c.beginPath();
  c.moveTo(x - 10, y); c.lineTo(x - 3, y + 8); c.lineTo(x + 11, y - 9); c.stroke(); c.lineCap = 'butt'; c.lineJoin = 'miter';
}
/* tévhit-pár: áthúzott kérdés → válasz (zöld) */
function myth(kq, ka, x, y, st, t0, a, o = {}) {
  const s = o.s || 26;
  al(a * clamp((st - t0) / .5)); const b = L.pill(lab(kq), x, y, { k: kq, a: o.a || 'center', s, f: F.D, i: 1, w: 500, bg: '#ffffff', bd: BAD, c: BAD, pad: 14, max: o.max });
  const q = clamp((st - t0 - 1.2) / .4);
  if (q > 0) { al(a); ln(b.x + 10, b.y + b.h / 2, lerp(b.x + 10, b.x + b.w - 10, q), b.y + b.h / 2, BAD, 4); }
  al(a * clamp((st - t0 - 1.6) / .5)); L.pill(o.v ? fillIn(ka, o.v) : lab(ka), x, y + (o.dy || 58), { k: o.vk ? [ka].concat(o.vk) : ka, a: o.a || 'center', s: s - 2, w: 700, f: F.B, bg: GOOD, c: '#ffffff', pad: 12, max: o.max });
}
/* naplózott, simított érték: log = [{t, …, d?}], f(e) → célérték; a váltás e.d (alap: dur) mp alatt – zárt képlet */
function logV(log, t, f, dur = .6) {
  let vs = f(log[0]), vt = vs, ts = log[0].t, d0 = dur;
  const at = (tt) => lerp(vs, vt, inOut((tt - ts) / d0));
  for (let i = 1; i < log.length && log[i].t <= t; i++) { const v = at(log[i].t); vs = v; vt = f(log[i]); ts = log[i].t; d0 = log[i].d || dur; }
  return at(t);
}
const lastOf = (log, t) => { let e = log[0]; for (const x of log) if (x.t <= t) e = x; return e; };

/* „Tippelj!” és bélyegek: a TtTipp modulból (fent) – a sorozat közös mintája (szerződés 17.) */
TtTipp.bind({ L: () => L, ga: () => GA });
const { stamp, Tip, tipReset, panelVeil, veilIf, tipGuess, tipHide, tipControls, tipU, rhythm, tipHead, tipRow, tipFeedback } = TtTipp;

/* ── közös rajzelemek (a lecke saját kódja) ── */
let FSX = null;            // FoldSection – a kőzetmintázatokhoz (S.pattern) és a jelmagyarázathoz
const pat = (n) => FSX.pattern(n);
function poly(pts) { c.beginPath(); pts.forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y))); c.closePath(); }
function fillPoly(pts, fill, stroke, w = 2.5) { poly(pts); c.fillStyle = fill; c.fill(); if (stroke) { c.strokeStyle = stroke; c.lineWidth = w; c.lineJoin = 'round'; c.stroke(); c.lineJoin = 'miter'; } }
function line(pts, col, w = 2.5, dash) { c.beginPath(); pts.forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y))); c.strokeStyle = col; c.lineWidth = w; c.setLineDash(dash || []); c.lineJoin = 'round'; c.stroke(); c.setLineDash([]); c.lineJoin = 'miter'; }
const samp = (x0, x1, n, f) => { const o = []; for (let i = 0; i <= n; i++) { const x = x0 + (x1 - x0) * i / n; o.push([x, f(x)]); } return o; };
/* kagyló (oldalnézet, legyező alak, bordákkal); (x, y): a közepe, s: szélesség */
function shell(x, y, s, rot, a, o = {}) {
  if (a <= .005) return;
  c.save(); al(a); c.translate(x, y); c.rotate(rot);
  c.beginPath(); c.moveTo(-s * .13, s * .36);
  c.bezierCurveTo(-s * .5, s * .2, -s * .58, -s * .2, -s * .3, -s * .38);
  c.quadraticCurveTo(0, -s * .56, s * .3, -s * .38);
  c.bezierCurveTo(s * .58, -s * .2, s * .5, s * .2, s * .13, s * .36); c.closePath();
  c.fillStyle = o.fill || '#f3ead6'; c.fill(); c.strokeStyle = o.stroke || '#6f6650'; c.lineWidth = o.w || 2; c.lineJoin = 'round'; c.stroke();
  c.lineWidth = (o.w || 2) * .6; c.lineCap = 'round';
  for (let i = -3; i <= 3; i++) { const an = -Math.PI / 2 + i * .32; c.beginPath(); c.moveTo(0, s * .34); c.lineTo(Math.cos(an) * s * .46, s * .02 + Math.sin(an) * s * .4); c.stroke(); }
  c.beginPath(); c.moveTo(-s * .16, s * .36); c.lineTo(s * .16, s * .36); c.lineWidth = (o.w || 2) * 1.2; c.stroke();
  c.restore(); c.lineCap = 'butt'; c.lineJoin = 'miter';
}
/* kőzetminta (kézbe vehető darab) valószerű színnel – a „szín” próbához */
const ROCKC = {
  'gránit': { bg: '#dcc6b6', dots: [['#f4ece4', 14, 4.5], ['#c98f80', 12, 4], ['#2e2c30', 10, 2.6]] },
  'bazalt': { bg: '#3a3c42', dots: [['#5a5d64', 18, 1.6]] },
  'andezit': { bg: '#8e9095', dots: [['#e9e7e1', 16, 2.4], ['#4d4f55', 8, 1.8]] },
  'mészkő': { bg: '#e8e0c8', dots: [['#cfc4a6', 12, 2]] },
  'lösz': { bg: '#dcc489', dots: [['#c3a866', 22, 1.4]] },
  'agyag': { bg: '#b3a690', dots: [['#9d8f78', 8, 2.2]] },
  'kagylós': { bg: '#e8e0c8', dots: [['#cfc4a6', 10, 2]], shells: true },

/* ════════ 7. Mire jó a kő? ════════ */

/* ════════ 8. Összefoglalás: belső és külső erők ════════ */
const PL8 = [['gerecse', 'Gerecse helye', 'mészkő'], ['mecsek', 'Mecsek helye', 'mészkő'], ['badacsony', 'Badacsony helye', 'bazalt'], ['mátra', 'Mátra helye', 'andezit'], ['velencei', 'Velencei-hegység helye', 'gránit'], ['paks', 'Paks helye', 'lösz']];
function scene8(st, a) {
  mapPanel(RM8, VM8, REL8, a, { rank: 4 });

  const ap = (i) => a * smooth((st - .4 - i * .3) / .5);
  const qav = QK.map((q) => { const d = L.dat(q.p), p = MAP.pt(d.lon, d.lat), r = qr(num(q.m)) * .8 + 3; quakeMark(p[0], p[1], num(q.m), ap(7) * .9, .8); return { x: p[0] - r, y: p[1] - r, w: 2 * r, h: 2 * r }; });
  const items = PL8.map(([id, dk], i) => { const d = L.dat(dk); return { id: 'p8' + id, lon: d.lon, lat: d.lat, s: lab(id + ' térkép felirat'), k: id + ' térkép felirat', sub: lab(id + ' sub felirat'), sk: id + ' sub felirat', dot: true, r: 7, pri: 5, a: ap(i) }; });
  items.push({ id: 'alpok', lon: 15.0, lat: 47.25, s: lab('alpok felirat'), k: 'alpok felirat', sub: lab('gyűrt felirat'), sk: 'gyűrt felirat', i: 1, f: F.D, size: 28, dirs: ['C'], pri: 9, a: ap(6) });
  items.push({ id: 'karpatok', lon: 24.6, lat: 48.25, s: lab('kárpátok felirat'), k: 'kárpátok felirat', sub: lab('gyűrt felirat'), sk: 'gyűrt felirat', i: 1, f: F.D, size: 28, dirs: ['C'], pri: 9, a: ap(6) });
  c.globalAlpha = 1; MAP.labels(L, items, { rect: [RM8[0] + 8, RM8[1] + 8, RM8[2] - 16, RM8[3] - 16], avoid: [{ x: RM8[0] + 16, y: RM8[1] + RM8[3] - 92, w: 210, h: 44 }, { x: RM8[0] + RM8[2] - 560, y: RM8[1] + RM8[3] - 42, w: 550, h: 36 }].concat(qav) });
  // jelmagyarázat: földrengés
  al(a); rr(RM8[0] + 16, RM8[1] + RM8[3] - 92, 210, 44, 10); c.fillStyle = 'rgba(255,250,241,.9)'; c.fill();
  quakeMark(RM8[0] + 44, RM8[1] + RM8[3] - 70, 5.6, ap(7), .8);
  al(a * smooth((st - 2.5) / .5)); T('rengés jel felirat', RM8[0] + 72, RM8[1] + RM8[3] - 62, { s: 22, w: 600, f: F.B, c: INK });
  al(a); L.pill(lab('forrás térkép felirat'), RM8[0] + RM8[2] - 12, RM8[1] + RM8[3] - 26, { k: 'forrás térkép felirat', s: 22, w: 500, f: F.B, c: MUT, bg: 'rgba(255,250,241,.9)', pad: 8, r: 8, a: 'right' });
  // belső és külső erők
  card(40, 772, 620, 270, a); card(700, 772, 620, 270, a);
  al(a); L.pill(lab('belső cím felirat'), 60, 812, { k: 'belső cím felirat', s: 26, w: 700, f: F.B, c: '#ffffff', bg: RED, pad: 12, b: 'middle' });
  al(a); L.pill(lab('külső cím felirat'), 720, 812, { k: 'külső cím felirat', s: 26, w: 700, f: F.B, c: '#ffffff', bg: OKR, pad: 12, b: 'middle' });
  const IN = [['gyűrődés felirat', icFold], ['vetődés felirat', icFault], ['vulkán felirat', icVolc], ['földrengés felirat', icQuake]];
  IN.forEach(([k, f], i) => { const x = 115 + i * 148; f(x, 920, st, ap(8 + i * .5)); al(ap(8 + i * .5)); T(k, x, 1012, { s: 22, w: 600, f: F.B, c: INK, a: 'center' }); });
  const EX = [['víz koptat felirat', icWater], ['szél felirat', icWind], ['fagy felirat', icFrost]];
  EX.forEach(([k, f], i) => { const x = 800 + i * 210; f(x, 920, st, ap(10 + i * .5)); al(ap(10 + i * .5)); T(k, x, 1012, { s: 22, w: 600, f: F.B, c: INK, a: 'center' }); });
}
function icFold(x, y, st, a) { for (let i = 0; i < 3; i++) { al(a); line(samp(-48, 48, 24, (t) => y + 18 - i * 14 - 18 * (1 - Math.cos(t / 48 * Math.PI * 2)) / 2).map(([t, yy]) => [x + t, yy]), i === 1 ? RED : INK, 3); } }
function icFault(x, y, st, a) { al(a); fillPoly([[x - 50, y - 10], [x - 6, y - 10], [x + 6, y + 30], [x - 50, y + 30]], pat('mészkő'), INK, 2.5); al(a); fillPoly([[x - 6, y - 30], [x + 50, y - 30], [x + 50, y + 10], [x + 6, y + 10]], pat('agyag'), INK, 2.5); }
function icVolc(x, y, st, a) { al(a); fillPoly([[x - 50, y + 30], [x - 12, y - 26], [x + 12, y - 26], [x + 50, y + 30]], '#a98f78', INK, 2.5); al(a); c.beginPath(); c.arc(x, y - 34, 9, 0, TAU); c.fillStyle = '#e8763a'; c.fill(); }
function icQuake(x, y, st, a) { for (let k = 0; k < 3; k++) { al(a * (1 - k * .25)); c.beginPath(); c.arc(x, y, 10 + k * 14, 0, TAU); c.strokeStyle = BAD; c.lineWidth = 3; c.stroke(); } }
function icWater(x, y, st, a) { al(a); drop(x, y - 6, 16); for (let i = 0; i < 2; i++) { al(a); line(samp(-40, 40, 16, (t) => y + 26 + i * 10 + Math.sin(t / 10 + st * 2) * 3).map(([t, yy]) => [x + t, yy]), WD, 2.5); } }
function icWind(x, y, st, a) { for (let i = 0; i < 3; i++) { al(a); c.beginPath(); c.moveTo(x - 46, y - 18 + i * 18); c.lineTo(x + 24, y - 18 + i * 18); c.arc(x + 24, y - 26 + i * 18, 8, Math.PI / 2, -Math.PI * .6, true); c.strokeStyle = MUT; c.lineWidth = 3; c.lineCap = 'round'; c.stroke(); c.lineCap = 'butt'; } }
function icFrost(x, y, st, a) { al(a); flake(x, y, 30, ICED, 3.5); }
function drop(x, y, r, fill = 'rgba(70,150,215,.75)', bd = WD) {
  c.beginPath(); c.moveTo(x, y - r * 1.8); c.bezierCurveTo(x + r * .3, y - r, x + r, y - r * .2, x + r, y + r * .25);
  c.arc(x, y + r * .25, r, 0, Math.PI); c.bezierCurveTo(x - r, y - r * .2, x - r * .3, y - r, x, y - r * 1.8); c.closePath();
  c.fillStyle = fill; c.fill(); c.strokeStyle = bd; c.lineWidth = 1.8; c.stroke();
}
function flake(x, y, r, col = ICED, w = 2.5) {
  c.strokeStyle = col; c.lineWidth = w; c.lineCap = 'round'; c.beginPath();
  for (let i = 0; i < 3; i++) { const an = i / 3 * Math.PI + Math.PI / 2; c.moveTo(x - Math.cos(an) * r, y - Math.sin(an) * r); c.lineTo(x + Math.cos(an) * r, y + Math.sin(an) * r); }
  c.stroke(); c.lineCap = 'butt';
}

/* ════════ a lecke ════════ */
const SCENES = [scene1, scene2, scene3, scene4, scene5, scene6, scene7, scene8];
const SETTLE = [6, 8, 3, 5, 8, 3, 3, 5];
const sl = (k, o) => L.slider(Object.assign({ label: lab(k), k }, o));
L = Lesson.create({
  content: window.LESSON_CONTENT, home: false, resetCtx: true,
  steps: [
    { settle: SETTLE[0] },
    { settle: SETTLE[1],
      controls(L) { S2.sld = sl('idő csúszka', { min: 0, max: 100, step: 1, value: 0, format: (v) => lab((v < 42 ? 'tenger' : v < 73 ? 'emelkedés' : v < 99 ? 'lepusztulás' : 'ma') + ' rövid felirat'), onInput: (v) => { S2.log = S2.log.filter((e) => e.t <= L.st); S2.log.push({ t: L.st, u: v / 100, d: .5 }); } }); },
      enter() { reset2(); } },
    { settle: SETTLE[2],

    { settle: SETTLE[3],
      controls(L) { S4.sld = sl('vető csúszka', { min: -30, max: 30, step: 5, value: 0, format: (v) => (v > 0 ? lab('összenyom felirat') + ' ' : v < 0 ? lab('széthúz felirat') + ' ' : '') + fmt(Math.abs(v), 0) + ' %', onInput: (v) => jump4(v / 100) }); },
      enter() { reset4(); if (S4.sld) S4.sld.set(0); } },
    { settle: SETTLE[4],
      controls(L) { S5.sld = sl('idő 5 csúszka', { min: 0, max: 100, step: 1, value: 0, format: (v) => fmt(v, 0) + ' %', onInput: (v) => { S5.log = S5.log.filter((e) => e.t <= L.st); S5.log.push({ t: L.st, u: v / 100, d: .5 }); } }); },
      enter() { reset5(); } },
    { settle: SETTLE[5],
      controls(L) {

        S6.btn = L.button(lab('mind gomb'), () => { if (!P6.guess) return; let i = 0; for (let r = 0; r < ROCKS6.length; r++) for (let j = 2; j <= 6; j++) if (!S6.tests.find((q) => q.r === r && q.j === j)) S6.tests.push({ r, j, t: L.st + (i++) * .06 }); }, 'mind gomb');
        S6.btn.disabled = !P6.guess;
      },
      enter() { reset6(); veilIf(P6); if (S6.btn) S6.btn.disabled = true; } },
    { settle: SETTLE[6], controls(L) { L.button(lab('megoldás gomb'), () => G7.solve(L.st), 'megoldás gomb'); }, enter() { G7.reset(); } },
    { settle: SETTLE[7] },
  ],
  init(Lx) {
    L = Lx; c = L.ctx;
    FSX = FoldSection.create(L, { rect: [0, 0, 1360, 1080], view: { x0: 0, x1: 1360, z0: -1080, z1: 0 } });

    VM8 = TortMap.fit(PROJ, KB8, RM8);

    REL8 = renderRelief(TortProj.view(PROJ, VM8), RM8, 2);

    reset2(); reset3(); reset4(); reset5(); reset6(); G7.reset();
    L.checks = () => {
      const Gf = foldGeo(0, 0, 1000, .3, 5, 30), top = Gf.bnd(5); let len = 0; for (let i = 1; i < top.length; i++) len += Math.hypot(top[i][0] - top[i - 1][0], top[i][1] - top[i - 1][1]);
      const Gb = faultGeo(0, 0, 900, 200, 220, TH4, .2), fl = Gb.left.pts[2][0] + Gb.left.dx, fm = Gb.mid.pts[3][0], ym = Gb.mid.pts[3][1] + Gb.mid.dy;

        { name: 'a mészkőt a rézpénz karcolja, a köröm nem', ok: result6(3, 3) && !result6(3, 2), got: [result6(3, 2), result6(3, 3)].join('/'), want: 'false/true' },
        { name: 'a gránit karcolja az üveget, az acélszög nem karcolja', ok: result6(0, 5) && !result6(0, 4), got: [result6(0, 4), result6(0, 5)].join('/'), want: 'false/true' },

  },
  draw(L) {

    for (let i = 0; i < SCENES.length; i++) {
      const w = clamp(1 - Math.abs(L.sp - i) * 2); if (w <= .001) continue;

/* QA-állapotok (1-alapú lépésszám) */
const guessQA = (P, k, back = 30) => (L2) => { L2.panel.querySelectorAll('.lp-text > p').forEach((p) => { p.style.transition = 'none'; }); P.guess = k; P.gt = L2.st - back; tipHide(P); panelVeil(false); if (P.on) { P.on(k); if (P === P3) S3.log.forEach((e) => { if (e.t > -9) e.t -= back; }); if (P === P6) S6.tests.forEach((q) => { q.t -= back; }); } };
window.__qaStates = {

  3: [{ name: 'tipp-jó', set: guessQA(P3, 'attól függ tipp') }, { name: 'tipp-rossz', set: guessQA(P3, 'meggyűrődnek tipp') },
    { name: 'max-rövidülés', set: (L2) => { guessQA(P3, 'eltörnek tipp')(L2); S3.log = [{ t: -9, s: .4 }]; } }, { name: 'tipp-közben', st: 3, set: guessQA(P3, 'eltörnek tipp', 2) }],
  4: [{ name: 'árok', set: (L2) => { S4.J = [{ t: L2.st - 5, from: 0, to: -.3 }]; } }, { name: 'rög-max', set: (L2) => { S4.J = [{ t: L2.st - 5, from: 0, to: .3 }]; } },
    { name: 'rengés-közben', set: (L2) => { S4.J = [{ t: L2.st - 5, from: 0, to: .1 }, { t: L2.st - .5, from: .1, to: .15 }]; } }],
  5: [{ name: 'kitörés', set: (L2) => { S5.log = [{ t: -9, u: .36 }]; } }, { name: 'kihűlt', set: (L2) => { S5.log = [{ t: -9, u: .6 }]; } }],
  6: [{ name: 'tipp-jó', set: guessQA(P6, 'mészkő tipp') }, { name: 'tipp-rossz', set: guessQA(P6, 'gránit tipp') },
    { name: 'minden-próba', set: (L2) => { guessQA(P6, 'bazalt tipp')(L2); for (let r = 0; r < ROCKS6.length; r++) for (let j = 2; j <= 6; j++) if (!S6.tests.find((q) => q.r === r && q.j === j)) S6.tests.push({ r, j, t: L2.st - 10 }); } },
