/* ── MODUL: Kártyák (TortCards) ────────────────────────────────────────────────────
   G modul (pilot/tortenelem-5-6/terv.md, 5. fejezet): „húzd a helyére” – kártyák rendezése zónákba
   (pl. két oszlop: falu / város), azonnali visszajelzéssel. Referencia: 07-kozepkori-varos.
   Később változtatás nélkül átemelhető: shared/tort/cards.js. Csak a Lesson motorra épül
   (L.ctx, L.tx, L.measure, L.pointer, L.stage, L.st, L.VW).

   const g = TortCards.create(L, {
     zones: [{id, x, y, w, h, title: {s, k}, sub?: {s, k}, head?: 110}], // célterületek; head: a fejléc magassága
     cards: [{id, label: {s, k}, zone}],      // zone: a helyes zóna id-ja (a kódban rögzített megoldás)
     tray: {x, y, w, h, pad?: 24, top?: 56},  // a kártyák kiinduló helye: sorfolytonosan, soronként középre
     font?: {f, s, w},                        // kártyafelirat (alap: Bricolage 24 / 600)
     gap?: 14, ease?: .45,                    // térköz px; a mozgás hossza mp
     decor?: (zone, alpha) => {}              // opcionális: saját rajz a zóna fejlécébe
   });
   g.reset()                  minden kártya a tálcára, animáció nélkül (a lépés enter()-jében hívd)
   g.place(id, zoneId, t0?)   kártya egy zónába (zoneId null → vissza a tálcára); a mozgás t0-tól (L.st) indul
   g.solve(t0?)               minden kártya a helyes zónába, kissé lépcsőzetesen
   g.update()                 minden képkockán, a rajzolás előtt, csak az aktív lépésben: húzás, kurzor
   g.draw({a})                zónák, kártyák (a húzott legfelül), visszajelzés: zöld keret + pipa / piros + kereszt
   g.score() → {ok, placed, total}   ·   g.touched: a felhasználó már húzott   ·   g.cards, g.zones
   Az állapot zárt képletű: a kártya helye = lerp(from, cél, inOut((L.st − t0) / ease)).
   ──────────────────────────────────────────────────────────────────────────────── */
const TortCards = (() => {
  const F = Lesson.FONTS, U = Lesson.U;
  const INK = '#1c2440', MUT = '#565d72', CARD = '#fffaf1', GOOD = '#1d7a45', BAD = '#b3261e', RED = '#c8401c';

  function create(L, cfg) {
    const FT = Object.assign({ f: F.B, s: 24, w: 600 }, cfg.font || {});
    const gap = cfg.gap || 14, ease = cfg.ease || .45, PX = 18, H = FT.s + 30, ICON = 30;
    const zones = cfg.zones.map((z) => Object.assign({ head: 110 }, z));
    const cards = cfg.cards.map((q, i) => ({ id: q.id, label: q.label, zone: q.zone, i, at: null, ord: 0, from: null, tgt: null, t0: -99 }));
    const g = { zones, cards, touched: false, drag: null, _pd: false, _ord: 0, _hov: null };
    const byId = (id) => cards.find((q) => q.id === id);
    const zoneAt = (x, y) => zones.find((z) => x >= z.x && x <= z.x + z.w && y >= z.y && y <= z.y + z.h) || null;
    const cw = (q) => L.measure(q.label.s, FT).w + PX * 2 + ICON;
    const ez = (t) => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

    /* sorfolytonos elhelyezés egy téglalapban; center: a sorok középre igazítva */
    function flow(list, x, y, w, center) {
      const rows = [[]]; let cx = 0;
      for (const q of list) { const ww = cw(q); if (cx > 0 && cx + ww > w) { rows.push([]); cx = 0; } rows[rows.length - 1].push({ q, ww, x: cx }); cx += ww + gap; }
      const out = {};
      rows.forEach((r, ri) => {
        const rw = r.length ? r[r.length - 1].x + r[r.length - 1].ww : 0, off = center ? (w - rw) / 2 : 0;
        r.forEach((e) => { out[e.q.id] = { x: x + off + e.x, y: y + ri * (H + gap), w: e.ww }; });
      });
      return out;
    }
    let traySlots = null;
    const tray = () => { const t = cfg.tray, p = t.pad == null ? 24 : t.pad; return { x: t.x + p, y: t.y + (t.top == null ? 56 : t.top), w: t.w - p * 2 }; };
    function target(q) {
      if (!q.at) { if (!traySlots) { const t = tray(); traySlots = flow(cards, t.x, t.y, t.w, true); } return traySlots[q.id]; }
      const z = zones.find((zz) => zz.id === q.at), list = cards.filter((c2) => c2.at === q.at).sort((a, b) => a.ord - b.ord);
      return flow(list, z.x + 20, z.y + z.head, z.w - 40, false)[q.id];
    }
    function disp(q) {
      const T = target(q);
      if (!q.tgt || Math.abs(T.x - q.tgt.x) > .5 || Math.abs(T.y - q.tgt.y) > .5) {   // új cél (pl. átrendeződés): onnan, ahol most van
        q.from = q.tgt ? cur(q) : null; q.t0 = q.tgt ? L.st : -99; q.tgt = { x: T.x, y: T.y };
      }
      return Object.assign(cur(q), { w: T.w });
    }
    function cur(q) {
      if (!q.from) return { x: q.tgt.x, y: q.tgt.y };
      const k = ez(U.clamp((L.st - q.t0) / ease));
      return { x: U.lerp(q.from.x, q.tgt.x, k), y: U.lerp(q.from.y, q.tgt.y, k) };
    }

    g.reset = () => { cards.forEach((q) => { q.at = null; q.ord = 0; q.from = null; q.tgt = null; q.t0 = -99; }); traySlots = null; g.drag = null; g.touched = false; g._ord = 0; };
    g.place = (id, zid, t0, from) => {
      const q = typeof id === 'string' ? byId(id) : id; if (!q) return;
      const p = from || (q.tgt ? cur(q) : target(q));
      q.at = zid || null; q.ord = ++g._ord;
      const T = target(q); q.from = { x: p.x, y: p.y }; q.tgt = { x: T.x, y: T.y }; q.t0 = t0 == null ? L.st : t0;
    };
    g.solve = (t0) => { const t = t0 == null ? L.st : t0; cards.filter((q) => q.at !== q.zone).forEach((q, i) => g.place(q, q.zone, t + i * .08)); };
    g.score = () => ({ ok: cards.filter((q) => q.at && q.at === q.zone).length, placed: cards.filter((q) => q.at).length, total: cards.length });

    g.update = () => {
      const p = L.pointer, edge = p.down && !g._pd; g._pd = p.down;
      const hit = () => { for (let i = cards.length - 1; i >= 0; i--) { const q = order()[i], d = disp(q); if (p.x >= d.x && p.x <= d.x + d.w && p.y >= d.y && p.y <= d.y + H) return { q, d }; } return null; };
      if (edge && p.x < L.VW && !g.drag) { const h = hit(); if (h) { g.drag = { q: h.q, dx: p.x - h.d.x, dy: p.y - h.d.y }; g.touched = true; } }
      if (g.drag && !p.down) {
        const d = g.drag, x = p.x - d.dx, y = p.y - d.dy, z = zoneAt(p.x, p.y), t = cfg.tray;
        const inTray = p.x >= t.x && p.x <= t.x + t.w && p.y >= t.y && p.y <= t.y + t.h;
        if (z) g.place(d.q, z.id, L.st, { x, y });
        else if (inTray) g.place(d.q, null, L.st, { x, y });
        else { d.q.from = { x, y }; d.q.t0 = L.st; }                  // máshová ejtve: vissza a helyére
        g.drag = null;
      }
      const h = g.drag ? null : (p.inside && p.x < L.VW ? hit() : null);
      g._hov = h ? h.q : null;
      if (L.stage) L.stage.style.cursor = g.drag ? 'grabbing' : h ? 'grab' : '';
    };
    const order = () => cards.slice().sort((a, b) => (a === (g.drag && g.drag.q) ? 1 : 0) - (b === (g.drag && g.drag.q) ? 1 : 0) || (a.at ? 1 : 0) - (b.at ? 1 : 0) || a.ord - b.ord || a.i - b.i);

    function mark(c, ok, x, y) {        // pipa / kereszt (rajz, nem szöveg)
      c.save(); c.lineCap = 'round'; c.lineJoin = 'round'; c.lineWidth = 4; c.strokeStyle = ok ? GOOD : BAD; c.beginPath();
      if (ok) { c.moveTo(x - 9, y); c.lineTo(x - 3, y + 7); c.lineTo(x + 10, y - 8); } else { c.moveTo(x - 7, y - 7); c.lineTo(x + 7, y + 7); c.moveTo(x + 7, y - 7); c.lineTo(x - 7, y + 7); }
      c.stroke(); c.restore();
    }
    function card(c, q, d, lift) {
      const placed = !!q.at, ok = placed && q.at === q.zone, hov = g._hov === q;
      c.save();
      if (lift) { c.shadowColor = 'rgba(70,50,20,.28)'; c.shadowBlur = 22; c.shadowOffsetY = 8; }
      c.beginPath(); c.roundRect(d.x, d.y, d.w, H, 10); c.fillStyle = CARD; c.fill(); c.shadowColor = 'transparent';
      if (placed && !lift) { c.fillStyle = U.rgba(ok ? GOOD : BAD, .08); c.fill(); }
      c.lineWidth = placed && !lift ? 3 : 2; c.strokeStyle = placed && !lift ? (ok ? GOOD : BAD) : hov || lift ? RED : U.rgba(INK, .45); c.stroke();
      L.tx(q.label.s, d.x + PX, d.y + H / 2 + 1, Object.assign({}, FT, { b: 'middle', c: INK, k: q.label.k }));
      const ix = d.x + d.w - PX - 8, iy = d.y + H / 2;
      if (placed && !lift) mark(c, ok, ix, iy);
      else { c.fillStyle = U.rgba(INK, .4); for (let r = -1; r <= 1; r++) for (let s = 0; s < 2; s++) { c.beginPath(); c.arc(ix - 3 + s * 7, iy + r * 7, 2.2, 0, Math.PI * 2); c.fill(); } }
      c.restore();
    }
    g.draw = (o = {}) => {
      const c = L.ctx, A = o.a == null ? 1 : o.a; if (A <= .01) return;
      c.save(); c.globalAlpha *= A;
      for (const z of zones) {
        c.beginPath(); c.roundRect(z.x, z.y, z.w, z.h, 16); c.fillStyle = 'rgba(255,250,241,.82)'; c.fill();
        c.setLineDash([10, 7]); c.lineWidth = 2.5; c.strokeStyle = U.rgba(INK, .5); c.stroke(); c.setLineDash([]);
        L.tx(z.title.s, z.x + 22, z.y + 54, { f: F.D, s: 40, w: 600, c: INK, k: z.title.k });
        if (z.sub) L.tx(z.sub.s, z.x + 22, z.y + 88, { f: F.B, s: 22, w: 500, c: MUT, k: z.sub.k });
        if (cfg.decor) { c.save(); cfg.decor(z, c.globalAlpha); c.restore(); }
      }
      const t = cfg.tray; c.beginPath(); c.roundRect(t.x, t.y, t.w, t.h, 16); c.fillStyle = 'rgba(28,36,64,.05)'; c.fill();
      c.lineWidth = 2; c.strokeStyle = U.rgba(INK, .25); c.stroke();
      const p = L.pointer;
      for (const q of order()) {
        if (g.drag && g.drag.q === q) continue;
        card(c, q, disp(q), q.from && L.st - q.t0 < ease);
      }
      if (g.drag) { const q = g.drag.q, d = disp(q); card(c, q, { x: p.x - g.drag.dx, y: p.y - g.drag.dy, w: d.w }, true); }
      c.restore();
    };
    return g;
  }
  return { create };
})();

/* ── MODUL: Labor + nagyító (KemLab) · forrás: kemia-7-8/01-reszecskemodell, 2026-11-23 · v1.1 (2026-11-24) ── */
/* API
   Laboreszközök a világos témához (tintakörvonal, áttetsző üveg) és a NAGYÍTÓ, amely a makroszintet
   a részecskeszinttel köti össze. Nem hivatkozik a lecke kódjára. Minden függvény a lecke L-jét kapja;
   szöveget csak L.tx / L.pill útján ír (QA, review mód). o.a: átlátszóság 0..1 (ctx.globalAlpha-t állítja).
   Tervezett helye: shared/kemia/kemlab.js.

   KemLab.syringe(L, x, y, w, h, {V, Vmax, step: 1, num: 5, cap: true, fill: 'gaz'|'folyadek'|fn(ctx, x0, y0, x1, y1),

/* ═════════ 5. Mérd meg a reakcióidődet! ═════════ */
const TIP5 = { keys: ['gyors tipp', 'közepes tipp', 'lassú tipp'], ok: 1, pick: null, t0: -99 };
const G5 = { phase: 'idle', times: [], due: 0, sig: 0, last: 0, msg: null, msgT: -99, rng: U.rng(503), demo: false, freeze: null };
let PL5 = null;
function reset5() { tipReset(TIP5); Object.assign(G5, { phase: 'idle', times: [], due: 0, sig: 0, last: 0, msg: null, msgT: -99, rng: U.rng(503), demo: false, freeze: null }); }
const delay5 = () => 1300 + 1900 * G5.rng();
function click5(ev) {
  if (TIP5.pick == null) { G5.msg = 'előbb tippelj felirat'; G5.msgT = L.st; return; }
  const N = num('próbák száma');
  if (G5.phase === 'idle' || G5.phase === 'done') {
    if (G5.phase === 'done') { G5.times = []; G5.demo = false; }
    G5.phase = 'wait'; G5.due = L.now + delay5(); G5.msg = null; G5.last = 0; return;
  }
  if (G5.phase === 'wait') { G5.msg = 'korán felirat'; G5.msgT = L.st; G5.due = L.now + delay5(); return; }
  if (G5.phase === 'go') {
    const rt = (ev.ts - G5.sig) / 1000;
    if (rt < .08) { G5.phase = 'wait'; G5.msg = 'korán felirat'; G5.msgT = L.st; G5.due = L.now + delay5(); return; }
    G5.last = rt; G5.times.push(rt); G5.msg = null;
    if (G5.times.length >= N) G5.phase = 'done'; else { G5.phase = 'wait'; G5.due = L.now + 700 + delay5(); }
  }
}
function demo5() { G5.times = dat('példasor').v.slice(); G5.demo = true; G5.phase = 'done'; G5.last = G5.times[G5.times.length - 1]; G5.msg = null; }
function scene5(t, act) {
  const N = num('próbák száma');
  if (act) {
    for (const ev of L.pointer.events) if (ev.type === 'down' && ev.x < L.VW && ev.y > 240) click5(ev);
    if (G5.phase === 'wait' && L.now >= G5.due) { G5.phase = 'go'; G5.sig = L.now; }
  }
  /* tipp-sor */
  al(); head(lab('tipp kérdés felirat'), 'tipp kérdés felirat', 40, 104, { s: 34 });
  const bx = tipRow(TIP5, 446, 94);
  if (TIP5.pick != null) {
    const b = bx[bx.length - 1], a = clamp((t - TIP5.t0) / .4); al(a);
    L.pill(fill(lab('valóság felirat'), L.val('reakcióidő')), b.x + b.w + 30, 94, { f: F.B, s: 24, w: 700, bg: U.rgba(GOOD, .1), bd: GOOD, c: GOOD, k: 'valóság felirat' });
    tipVerdict(TIP5, 446, 176, { s: 28 });
  }
  /* jelzőlámpa */
  const lx = 230, ly = 400, ph = G5.phase;
  const col = ph === 'wait' ? '#b3261e' : ph === 'go' ? '#2e9d5b' : '#9aa1ad';
  al(); c.beginPath(); c.roundRect(lx - 130, ly - 130, 260, 260, 40); c.fillStyle = '#3a3f4b'; c.fill(); c.strokeStyle = INK; c.lineWidth = 3; c.stroke();
  c.beginPath(); c.arc(lx, ly, 100, 0, TAU); c.fillStyle = col; c.fill(); c.strokeStyle = '#11151d'; c.lineWidth = 4; c.stroke();
  if (ph === 'go') { al(.35); c.beginPath(); c.arc(lx, ly, 118, 0, TAU); c.strokeStyle = '#2e9d5b'; c.lineWidth = 10; c.stroke(); }
  al();
  let mk = TIP5.pick == null ? 'előbb tippelj felirat' : ph === 'wait' ? 'várj felirat' : ph === 'go' ? 'most felirat' : ph === 'done' ? 'reakció kész felirat' : 'start felirat';
  if (G5.msg && L.st - G5.msgT < 1.6 && act) mk = G5.msg;
  L.tx(lab(mk), lx, 572, { f: F.B, s: ph === 'go' ? 34 : 26, w: 800, a: 'center', c: mk === 'korán felirat' || mk === 'előbb tippelj felirat' ? RED : ph === 'go' ? GOOD : INK, k: mk, max: 400 });
  L.tx(fill(lab('kísérlet felirat'), G5.times.length, N), lx, 612, { f: F.M, s: 22, w: 600, a: 'center', c: MUT, k: 'kísérlet felirat' });
  /* stopper */
  const sw = G5.freeze != null ? G5.freeze : ph === 'go' ? Math.max(0, (L.now - G5.sig) / 1000) : ph === 'wait' ? 0 : G5.last;
  al(); TtMuszer.stopwatch(L, lx, 830, 150, { t: sw, dial: 1, d: 2, run: ph === 'go' });
  /* grafikon: a mérések és az átlaguk */
  const ts = G5.times, ymax = Math.max(.8, Math.ceil(Math.max(0, ...ts) * 5 + 1e-9) / 5);
  PL5.set({ ya: { min: 0, max: ymax, ticks: BioPlot.ticks(0, ymax, 4) } });
  al(); PL5.axes({ a: 1 });
  ts.forEach((v, i) => { al(); PL5.point(i + 1, Math.min(v, ymax), { r: 10, col: TEAL, label: { s: fmt(v, 2), k: null }, side: 'above', s: 22 }); });
  if (ts.length) {
    const m = ts.reduce((s, v) => s + v, 0) / ts.length;
    al(); PL5.hline(m, { col: RED, w: 3, dash: [10, 7] });
    const sum = '(' + ts.map((v) => fmt(v, 2)).join(' + ') + ') : ' + ts.length + ' = ' + fmt(m, 3) + ' s';
    L.tx(sum, 560, 880, { f: F.M, s: 24, w: 600, c: INK, max: 760 });
    /* az átlag-felirat a grafikon alatt, szaggatott jellel (a pontfeliratokkal így nem ütközik) */
    c.strokeStyle = RED; c.lineWidth = 3; c.setLineDash([10, 7]); c.beginPath(); c.moveTo(560, 950); c.lineTo(616, 950); c.stroke(); c.setLineDash([]);
    const own = ts.length >= N && !G5.demo, ak = own ? 'te átlagod felirat' : 'átlag felirat';
    L.pill(fill(lab(ak), fmt(m, 2) + ' s'), 630, 950, { f: F.B, s: 28, w: 700, bg: CARD, bd: RED, bw: 3, c: INK, k: ak });
    ck.s5 = { m, n: ts.length, demo: G5.demo };
  }
  al(); if (G5.demo) stamp('kitalalt', 'kitalált bélyeg', 1000, 950); else stamp('otthon', 'otthon bélyeg', 1000, 950);
}

/* ═════════ 6. Egy nap hőmérséklete ═════════ */
let C6 = null;

const HRS = () => dat('óránkénti hőmérséklet').v;
function reset6() { S6.h = dat('mérési órák').v.map(Math.round); S6.drag = null; S6.sel = 2; }
function scene6(t, act) {
  const v = HRS(), xs = v.map((_, i) => i), C = C6;
  if (act) {
    const P = L.pointer;
    if (P.pressed && C.inside(P.px, P.py)) { let bi = -1, bd = 46; S6.h.forEach((h, i) => { const d = Math.abs(C.X(h) - P.px); if (d < bd) { bd = d; bi = i; } }); if (bi >= 0) { S6.drag = bi; S6.sel = bi; } }
    if (S6.drag != null) { S6.h[S6.drag] = clamp(Math.round(C.ix(P.x)), 0, 23); if (!P.down) S6.drag = null; }
    if (L.stage) L.stage.style.cursor = S6.drag != null ? 'grabbing' : '';

  al(); head(lab('nap cím'), 'nap cím', 130, 110);
  al(); C.axes({ xTitle: T('napi idő tengely'), yTitle: T('napi hő tengely') });
  const up = 24 * smooth(clamp((t - .3) / 2));
  al(); C.line(xs, v, { c: RED, w: 4.5, upTo: up });
  const a2 = clamp((t - 2.3) / .6);
  const iMax = v.indexOf(Math.max(...v)), iMin = v.indexOf(Math.min(...v));
  al(a2); C.dot(iMax, v[iMax], { r: 9, c: RED, ring: true }); C.dot(iMin, v[iMin], { r: 9, c: WATER, ring: true });
  L.tx(fill(lab('legmelegebb felirat'), iMax), C.X(iMax), C.y - 18, { f: F.B, s: 24, w: 700, a: 'center', c: RED, k: 'legmelegebb felirat' });
  const ly6 = C.Y(v[iMin] + 5.5); c.strokeStyle = WATER; c.lineWidth = 2; c.beginPath(); c.moveTo(C.X(iMin), ly6 + 14); c.lineTo(C.X(iMin), C.Y(v[iMin]) - 14); c.stroke();
  L.tx(fill(lab('leghidegebb felirat'), iMin), C.X(iMin), ly6, { f: F.B, s: 24, w: 700, a: 'center', c: WATER, k: 'leghidegebb felirat' });
  /* mérési pontok (húzhatók) */
  const a3 = clamp((t - 2.9) / .6);
  const seen = [], placed = [], ord = S6.h.map((h, i) => [h, i]).sort((a, b) => a[0] - b[0]);
  ord.forEach(([h, i]) => {
    const px = C.X(h), py = C.Y(v[h]);
    al(a3 * .7); c.setLineDash([6, 6]); c.strokeStyle = TEAL; c.lineWidth = 2; c.beginPath(); c.moveTo(px, py); c.lineTo(px, C.y + C.h); c.stroke(); c.setLineDash([]);
    al(a3); c.beginPath(); c.arc(px, py, i === S6.sel ? 15 : 12, 0, TAU); c.fillStyle = TEAL; c.fill(); c.strokeStyle = CARD; c.lineWidth = 3; c.stroke();
  });
  ord.forEach(([h]) => {                // feliratok a pontok UTÁN (a pont ne takarja a szomszéd feliratát)
    const px = C.X(h), py = C.Y(v[h]);
    if (seen.includes(h)) return; seen.push(h);
    /* a hőmérséklet-felirat: a tengelyszámoktól távol, a szomszédos felirattól lépcsőzve */
    const lx = clamp(px, C.x + 52, C.x + C.w - 52); let ly = py - 28;
    for (const q of placed) if (Math.abs(q[0] - lx) < 96 && Math.abs(q[1] - ly) < 30) ly = q[1] - 32;

  });
  al(a3); L.tx(lab('húzd felirat'), C.x, C.y + C.h + 66, { f: F.B, s: 22, w: 600, i: true, c: TEAL, k: 'húzd felirat' });

  const f1 = (x) => fmt(r1(x), 1).replace(/,0$/, '');

/* ═════════ 8. Összefoglalás: magyar legek ═════════ */

  al(a2); head(lab('eső rekord cím'), 'eső rekord cím', 840, 190, { s: 26, a: 'center', f: F.B, w: 700 });
  al(); const mm = num('legtöbb napi csapadék'), rg = TtMuszer.rainGauge(L, 840, 900, 640, { mm: mm * smooth(clamp((t - 1.8) / 1.6)), max: 300, step: 10, major: 50, a: a2 });
  al(a2 * clamp((t - 3.2) / .4)); L.tx(L.val('legtöbb napi csapadék'), 790, rg.yOf(mm), { f: F.M, s: 28, w: 700, a: 'right', b: 'middle', c: WATER, k: 'legtöbb napi csapadék' });

  ck.s8 = { pct };
  /* magasság */
  al(a3); head(lab('magasság cím'), 'magasság cím', 1190, 190, { s: 26, a: 'center', f: F.B, w: 700 });
  const hK = num('Kékes magassága'), hG = num('Gyálarét magassága');

  const yK = R8.X(hK), yG = R8.X(hG), xb = 1150;
  al(a3); c.beginPath(); c.moveTo(xb, 900); c.lineTo(xb, yG); c.lineTo(xb + 40, yG); c.bezierCurveTo(xb + 80, yG, xb + 95, yK + 60, xb + 120, yK); c.bezierCurveTo(xb + 140, yK + 40, xb + 160, yK + 160, xb + 180, yK + 260); c.lineTo(xb + 196, 900); c.closePath();
  c.fillStyle = '#cdb98f'; c.fill(); c.strokeStyle = '#6b5a3e'; c.lineWidth = 2.5; c.stroke();
  c.setLineDash([6, 6]); c.strokeStyle = U.rgba(INK, .5); c.lineWidth = 2; c.beginPath(); c.moveTo(1146, yK); c.lineTo(xb + 120, yK); c.stroke(); c.setLineDash([]);
  L.tx(lab('Kékes felirat') + ' ' + L.val('Kékes magassága'), xb + 110, yK - 26, { f: F.B, s: 24, w: 700, a: 'center', c: INK, k: ['Kékes felirat', 'Kékes magassága'], max: 200 });

  L.pill(fill(lab('különbség felirat'), 'kb. ' + fmt(Math.round(hK - hG)) + ' m'), 1200, 994, { f: F.B, s: 24, w: 700, a: 'center', bg: CARD, bd: U.rgba(INK, .35), c: INK, k: 'különbség felirat' });
}

const SCENES = [scene1, scene2, scene3, scene4, scene5, scene6, scene7, scene8];

/* ═════════ ellenőrzések (QA: L.checks) ═════════ */
function checks() {
  const outA = [], ok = (name, got, want, eps = 1e-6) => outA.push({ name, ok: Math.abs(got - want) <= eps, got, want });
  const i = L.step;
  if (i === 0 && ck.s1) ck.s1.forEach((q, j) => ok('1: eltérés ' + j, q.e, (q.g - q.tv) / q.tv * 100));
  if (i === 1 && ck.s2) ok('2: lépéspárok × lépéspár = terem', ck.s2.n * ck.s2.p, ck.s2.Lm);
  if (i === 3 && ck.s4) { if (Math.abs(ck.s4.v) < 1e-9) ok('4: merőlegesen a valódi értéket olvassuk', ck.s4.read, ck.s4.V, 1e-6); else ok('4: felülről többet, alulról kevesebbet', Math.sign(ck.s4.read - ck.s4.V), -Math.sign(ck.s4.v)); }
  if (i === 4 && ck.s5 && ck.s5.demo) ok('5: a példasor átlaga = .md', ck.s5.m, num('példasor átlaga'), 1e-9);
  if (i === 5 && ck.s6) {
    const v = HRS(), h0 = dat('mérési órák').v;
    ok('6: rajzolt max = .md', v[ck.s6.iMax], num('napi legmagasabb')); ok('6: legmelegebb óra', ck.s6.iMax, num('legmelegebb óra'));
    ok('6: hőingás', ck.s6.amp, num('napi hőingás'));
    if (S6.h.every((h, j) => h === h0[j])) ok('6: 4 mérés átlaga = .md', ck.s6.m4, num('napi középhőmérséklet'));
  }
  if (i === 6) { const st = ST7(); ok('7: Budapest évi közép', r1(FoldClimate.stats(st[0]).tAvg), num('Budapest évi középhőmérséklete')); ok('7: Kékes hőingás', r1(FoldClimate.stats(st[1]).amp), num('Kékestető évi hőingása')); }
  if (i === 7 && ck.s8) ok('8: eső aránya', ck.s8.pct, Math.round(num('legtöbb napi csapadék') / num('Budapest évi csapadéka') * 100));
  return outA;
}

    reset1(); reset5(); reset6();

    MatText.check(L, 'Budapest évi csapadéka', S0.pSum, .05);
    L.checks = checks;
  },
