'use strict';

/* ── MODUL: Kártyák (TortCards) ────────────────────────────────────────────────────
   G modul (pilot/tortenelem-5-6/terv.md, 5. fejezet): „húzd a helyére” – kártyák rendezése zónákba
   (pl. két oszlop: falu / város), azonnali visszajelzéssel. Referencia: 07-kozepkori-varos.
   Később változtatás nélkül átemelhető: shared/tort/cards.js. Csak a Lesson motorra épül
   (L.ctx, L.tx, L.measure, L.pointer, L.stage, L.st, L.VW).

   const g = TortCards.create(L, {
     zones: [{id, x, y, w, h, title: {s, k}, sub?: {s, k}, head?: 110}], // célterületek; head: a fejléc magassága
     cards: [{id, label: {s, k}, zone}],      // zone: a helyes zóna id-ja (a kódban rögzített megoldás)
     tray: {x, y, w, h, pad?: 24, top?: 56},  // a kártyák kiinduló helye: sorfolytonosan, soronként középre
     font?: {f, s, w},                        // kártyafelirat (alap: Bricolage 24 / 600)
     gap?: 14, ease?: .45,                    // térköz px; a mozgás hossza mp
     decor?: (zone, alpha) => {}              // opcionális: saját rajz a zóna fejlécébe
   });
   g.reset()                  minden kártya a tálcára, animáció nélkül (a lépés enter()-jében hívd)
   g.place(id, zoneId, t0?)   kártya egy zónába (zoneId null → vissza a tálcára); a mozgás t0-tól (L.st) indul
   g.solve(t0?)               minden kártya a helyes zónába, kissé lépcsőzetesen
   g.update()                 minden képkockán, a rajzolás előtt, csak az aktív lépésben: húzás, kurzor
   g.draw({a})                zónák, kártyák (a húzott legfelül), visszajelzés: zöld keret + pipa / piros + kereszt
   g.score() → {ok, placed, total}   ·   g.touched: a felhasználó már húzott   ·   g.cards, g.zones
   Az állapot zárt képletű: a kártya helye = lerp(from, cél, inOut((L.st − t0) / ease)).
   ──────────────────────────────────────────────────────────────────────────────── */
const TortCards = (() => {
  const F = Lesson.FONTS, U = Lesson.U;
  const INK = '#1c2440', MUT = '#565d72', CARD = '#fffaf1', GOOD = '#1d7a45', BAD = '#b3261e', RED = '#c8401c';

  function create(L, cfg) {
    const FT = Object.assign({ f: F.B, s: 24, w: 600 }, cfg.font || {});
    const gap = cfg.gap || 14, ease = cfg.ease || .45, PX = 18, H = FT.s + 30, ICON = 30;
    const zones = cfg.zones.map((z) => Object.assign({ head: 110 }, z));
    const cards = cfg.cards.map((q, i) => ({ id: q.id, label: q.label, zone: q.zone, i, at: null, ord: 0, from: null, tgt: null, t0: -99 }));
    const g = { zones, cards, touched: false, drag: null, _pd: false, _ord: 0, _hov: null };
    const byId = (id) => cards.find((q) => q.id === id);
    const zoneAt = (x, y) => zones.find((z) => x >= z.x && x <= z.x + z.w && y >= z.y && y <= z.y + z.h) || null;
    const cw = (q) => L.measure(q.label.s, FT).w + PX * 2 + ICON;
    const ez = (t) => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

    /* sorfolytonos elhelyezés egy téglalapban; center: a sorok középre igazítva */
    function flow(list, x, y, w, center) {
      const rows = [[]]; let cx = 0;
      for (const q of list) { const ww = cw(q); if (cx > 0 && cx + ww > w) { rows.push([]); cx = 0; } rows[rows.length - 1].push({ q, ww, x: cx }); cx += ww + gap; }
      const out = {};
      rows.forEach((r, ri) => {
        const rw = r.length ? r[r.length - 1].x + r[r.length - 1].ww : 0, off = center ? (w - rw) / 2 : 0;
        r.forEach((e) => { out[e.q.id] = { x: x + off + e.x, y: y + ri * (H + gap), w: e.ww }; });
      });
      return out;
    }
    let traySlots = null;
    const tray = () => { const t = cfg.tray, p = t.pad == null ? 24 : t.pad; return { x: t.x + p, y: t.y + (t.top == null ? 56 : t.top), w: t.w - p * 2 }; };
    function target(q) {
      if (!q.at) { if (!traySlots) { const t = tray(); traySlots = flow(cards, t.x, t.y, t.w, true); } return traySlots[q.id]; }
      const z = zones.find((zz) => zz.id === q.at), list = cards.filter((c2) => c2.at === q.at).sort((a, b) => a.ord - b.ord);
      return flow(list, z.x + 20, z.y + z.head, z.w - 40, false)[q.id];
    }
    function disp(q) {
      const T = target(q);
      if (!q.tgt || Math.abs(T.x - q.tgt.x) > .5 || Math.abs(T.y - q.tgt.y) > .5) {   // új cél (pl. átrendeződés): onnan, ahol most van
        q.from = q.tgt ? cur(q) : null; q.t0 = q.tgt ? L.st : -99; q.tgt = { x: T.x, y: T.y };
      }
      return Object.assign(cur(q), { w: T.w });
    }
    function cur(q) {
      if (!q.from) return { x: q.tgt.x, y: q.tgt.y };
      const k = ez(U.clamp((L.st - q.t0) / ease));
      return { x: U.lerp(q.from.x, q.tgt.x, k), y: U.lerp(q.from.y, q.tgt.y, k) };
    }

    g.reset = () => { cards.forEach((q) => { q.at = null; q.ord = 0; q.from = null; q.tgt = null; q.t0 = -99; }); traySlots = null; g.drag = null; g.touched = false; g._ord = 0; };
    g.place = (id, zid, t0, from) => {
      const q = typeof id === 'string' ? byId(id) : id; if (!q) return;
      const p = from || (q.tgt ? cur(q) : target(q));
      q.at = zid || null; q.ord = ++g._ord;
      const T = target(q); q.from = { x: p.x, y: p.y }; q.tgt = { x: T.x, y: T.y }; q.t0 = t0 == null ? L.st : t0;
    };
    g.solve = (t0) => { const t = t0 == null ? L.st : t0; cards.filter((q) => q.at !== q.zone).forEach((q, i) => g.place(q, q.zone, t + i * .08)); };
    g.score = () => ({ ok: cards.filter((q) => q.at && q.at === q.zone).length, placed: cards.filter((q) => q.at).length, total: cards.length });

    g.update = () => {
      const p = L.pointer, edge = p.down && !g._pd; g._pd = p.down;
      const hit = () => { for (let i = cards.length - 1; i >= 0; i--) { const q = order()[i], d = disp(q); if (p.x >= d.x && p.x <= d.x + d.w && p.y >= d.y && p.y <= d.y + H) return { q, d }; } return null; };
      if (edge && p.x < L.VW && !g.drag) { const h = hit(); if (h) { g.drag = { q: h.q, dx: p.x - h.d.x, dy: p.y - h.d.y }; g.touched = true; } }
      if (g.drag && !p.down) {
        const d = g.drag, x = p.x - d.dx, y = p.y - d.dy, z = zoneAt(p.x, p.y), t = cfg.tray;
        const inTray = p.x >= t.x && p.x <= t.x + t.w && p.y >= t.y && p.y <= t.y + t.h;
        if (z) g.place(d.q, z.id, L.st, { x, y });
        else if (inTray) g.place(d.q, null, L.st, { x, y });
        else { d.q.from = { x, y }; d.q.t0 = L.st; }                  // máshová ejtve: vissza a helyére
        g.drag = null;
      }
      const h = g.drag ? null : (p.inside && p.x < L.VW ? hit() : null);
      g._hov = h ? h.q : null;
      if (L.stage) L.stage.style.cursor = g.drag ? 'grabbing' : h ? 'grab' : '';
    };
    const order = () => cards.slice().sort((a, b) => (a === (g.drag && g.drag.q) ? 1 : 0) - (b === (g.drag && g.drag.q) ? 1 : 0) || (a.at ? 1 : 0) - (b.at ? 1 : 0) || a.ord - b.ord || a.i - b.i);

    function mark(c, ok, x, y) {        // pipa / kereszt (rajz, nem szöveg)
      c.save(); c.lineCap = 'round'; c.lineJoin = 'round'; c.lineWidth = 4; c.strokeStyle = ok ? GOOD : BAD; c.beginPath();
      if (ok) { c.moveTo(x - 9, y); c.lineTo(x - 3, y + 7); c.lineTo(x + 10, y - 8); } else { c.moveTo(x - 7, y - 7); c.lineTo(x + 7, y + 7); c.moveTo(x + 7, y - 7); c.lineTo(x - 7, y + 7); }
      c.stroke(); c.restore();
    }
    function card(c, q, d, lift) {
      const placed = !!q.at, ok = placed && q.at === q.zone, hov = g._hov === q;
      c.save();
      if (lift) { c.shadowColor = 'rgba(70,50,20,.28)'; c.shadowBlur = 22; c.shadowOffsetY = 8; }
      c.beginPath(); c.roundRect(d.x, d.y, d.w, H, 10); c.fillStyle = CARD; c.fill(); c.shadowColor = 'transparent';
      if (placed && !lift) { c.fillStyle = U.rgba(ok ? GOOD : BAD, .08); c.fill(); }
      c.lineWidth = placed && !lift ? 3 : 2; c.strokeStyle = placed && !lift ? (ok ? GOOD : BAD) : hov || lift ? RED : U.rgba(INK, .45); c.stroke();
      L.tx(q.label.s, d.x + PX, d.y + H / 2 + 1, Object.assign({}, FT, { b: 'middle', c: INK, k: q.label.k }));
      const ix = d.x + d.w - PX - 8, iy = d.y + H / 2;
      if (placed && !lift) mark(c, ok, ix, iy);
      else { c.fillStyle = U.rgba(INK, .4); for (let r = -1; r <= 1; r++) for (let s = 0; s < 2; s++) { c.beginPath(); c.arc(ix - 3 + s * 7, iy + r * 7, 2.2, 0, Math.PI * 2); c.fill(); } }
      c.restore();
    }
    g.draw = (o = {}) => {
      const c = L.ctx, A = o.a == null ? 1 : o.a; if (A <= .01) return;
      c.save(); c.globalAlpha *= A;
      for (const z of zones) {
        c.beginPath(); c.roundRect(z.x, z.y, z.w, z.h, 16); c.fillStyle = 'rgba(255,250,241,.82)'; c.fill();
        c.setLineDash([10, 7]); c.lineWidth = 2.5; c.strokeStyle = U.rgba(INK, .5); c.stroke(); c.setLineDash([]);
        L.tx(z.title.s, z.x + 22, z.y + 54, { f: F.D, s: 40, w: 600, c: INK, k: z.title.k });
        if (z.sub) L.tx(z.sub.s, z.x + 22, z.y + 88, { f: F.B, s: 22, w: 500, c: MUT, k: z.sub.k });

  al(a); PN(k, [fmt(num(dk)) + ' W'], 320, 404, { k: [k, dk, 'lámpa gomb'], s: 26, w: 700, f: F.B, c: INK, bg: CARD, bd: INK, pad: 12, a: 'center' });
  // teljesítmény-sáv
  const Wmax = num('izzó teljesítménye'), bw = 380 * wNow / Wmax;
  al(a); rr(90, 446, 380, 32, 8); c.fillStyle = CARD; c.fill(); c.strokeStyle = LINE; c.lineWidth = 2; c.stroke();
  al(a); rr(90, 446, Math.max(8, bw), 32, 8); c.fillStyle = led ? GOOD : RED; c.fill();
  al(a); L.tx(fmt(Math.round(wNow)) + ' W', 484, 470, { s: 22, w: 700, f: F.M, c: INK, qa: false });
  al(a); PN('évente felirat', [fmt(num('napi világítás')), fmt(Math.round(yearKWh(num(dk)))) + ' kWh'], 320, 522, { k: ['évente felirat', 'napi világítás'], s: 22, w: 600, f: F.B, c: MUT, a: 'center', max: 520 });
  stamp('otthon', 60, 596, a);
  // éves fogyasztás (becslés)
  const vals = [num('hűtő éves fogyasztása'), num('egy mosás áramigénye') * num('mosások száma egy évben'), yearKWh(num('izzó teljesítménye')), yearKWh(num('LED teljesítménye'))];
  al(a); T('grafikon cím felirat', 700, 70, { f: F.D, s: 30, w: 600, c: INK, max: 620 });
  const ch = MatChart.create(L, { x: 740, y: 130, w: 560, h: 330, n: 4, max: 250, step: 50 });
  ch.axes({ a: GA * a, cats: [{ s: lab('hűtő oszlop felirat'), k: 'hűtő oszlop felirat' }, { s: lab('mosógép oszlop felirat'), k: 'mosógép oszlop felirat' }, { s: lab('izzó oszlop felirat'), k: 'izzó oszlop felirat' }, { s: lab('LED oszlop felirat'), k: 'LED oszlop felirat' }], cs: 22 });
  ch.bars(vals, { a: GA * a, t: smooth((st - .2) / 1), cols: ['#0a6f86', '#1b5a94', '#c8401c', '#1d7a45'], values: (v) => fmt(Math.round(v)), vs: 24, hi: led ? 3 : 2, dim: .45 });
  myth('takarékos tévhit felirat', 'takarékos válasz felirat', 700, 578, st, 1.2, a, { s: 24, a: 'left', dy: 54, max: 620 });
  // összegzés
  ['összegzés 1 felirat', 'összegzés 2 felirat', 'összegzés 3 felirat', 'összegzés 4 felirat'].forEach((kk, j) => {
    const qq = smooth((st - 1.8 - j * .5) / .5);
    al(a * qq); L.pill(lab(kk), 40, 730 + j * 82, { k: kk, s: 28, w: 700, f: F.B, c: j === 3 ? '#ffffff' : INK, bg: j === 3 ? GOOD : CARD, bd: j === 3 ? GOOD : INK, bw: 2.5, pad: 14, max: 1240 });
  });
}

/* ════════ a lecke ════════ */
const SCENES = [scene1, scene2, scene3, scene4, scene5, scene6, scene7, scene8];
const SETTLE = [3, 12.5, 3, 10.5, 4, 3, 3, 4];
function slider7(k, min, max, step, k0, fmtv, apply) {
  const s = L.slider({ label: lab(k), k, min, max, step, value: k0, format: fmtv, onInput: (v) => { apply(v); upd7(); } });
  s.k0 = k0; S7.sl.push(s); return s;
}
L = Lesson.create({
  content: window.LESSON_CONTENT, home: false, resetCtx: true,
  steps: [
    { settle: SETTLE[0], controls(L) { tipControls(P1); }, enter() { reset1(); veilIf(P1); } },
    { settle: SETTLE[1] },
    { settle: SETTLE[2], controls(L) { L.button(lab('megoldás gomb'), () => G3.solve(L.st), 'megoldás gomb'); }, enter() { G3.reset(); S3.was = false; S3.doneT = 0; } },
    { settle: SETTLE[3],
      controls(L) { S4.sld = L.slider({ label: lab('idő csúszka'), k: 'idő csúszka', min: 0, max: 60, step: 1, value: 0, format: (v) => fmt(v) + ' év', onInput: (v) => { S4.log = S4.log.filter((e) => e.t <= L.st); const cur = logV(S4.log, L.st, (e) => e.T); S4.log.push({ t: L.st, T: v, d: Math.max(.2, Math.abs(v - cur) / 40) }); } }); },
      enter() { reset4(); } },
    { settle: SETTLE[4], enter() { reset5(); }, leave() { if (L.stage) L.stage.style.cursor = ''; } },
    { settle: SETTLE[5],
      controls(L) {
        tipControls(P6);
        S6.sld = L.slider({ label: lab('szél csúszka'), k: 'szél csúszka', min: 2, max: 12, step: .5, value: 2 * v0(), format: (v) => fmt(v, v % 1 ? 1 : 0) + ' m/s', onInput: (v) => { S6.log = push6(L.st, v, .5); } });
        show6();
      },
      enter() { reset6(); veilIf(P6); if (S6.sld) S6.sld.set(2 * v0()); show6(); } },
    { settle: SETTLE[6],
      controls(L) {
        tipControls(P7); S7.sl = [];
        slider7('napelem csúszka', 0, 400, 20, num('napelemek teljesítménye'), (v) => fmt(v) + ' kW', (v) => { S7.Pn = v; });
        slider7('szélkerék csúszka', 0, 150, 10, num('szélkerekek teljesítménye'), (v) => fmt(v) + ' kW', (v) => { S7.Pw = v; });
        slider7('tároló csúszka', 0, 1200, 50, num('tároló mérete'), (v) => fmt(v) + ' kWh', (v) => { S7.cap = v; });
        show7();
      },
      enter() { reset7(); veilIf(P7); show7(); } },
    { settle: SETTLE[7], controls(L) { L.button(lab('lámpa gomb'), () => { S8.led = !S8.led; S8.t = L.st; }, 'lámpa gomb'); }, enter() { reset8(); } },
  ],
  init(Lx) {
    L = Lx; build3();
    reset1(); G3.reset(); reset4(); reset5(); reset6(); reset7(); reset8();
    L.checks = () => {
      const prod = PROD_KEYS.reduce((s, k) => s + num(k), 0), tot = useTot();
      const Rd = simVillage(num('napelemek teljesítménye'), num('szélkerekek teljesítménye'), 0), Rmax = simVillage(num('napelemek teljesítménye'), num('szélkerekek teljesítménye'), 1200);
      const R = S7.sim;
      return [
        { name: 'a termelési sorok összege = bruttó termelés', ok: Math.abs(prod - num('bruttó termelés összesen')) < 1.5, got: prod, want: num('bruttó termelés összesen') },
        { name: 'nettó import aránya ≈ 18,5 % (MEKH)', ok: Math.abs(netImp() / tot - .185) < .005, got: (netImp() / tot).toFixed(4), want: .185 },
        { name: 'panel: „kb. harmada atomerőműből”', ok: share('atomerőművek termelése') > .29 && share('atomerőművek termelése') < .37, got: share('atomerőművek termelése').toFixed(3), want: '≈ 1/3' },
        { name: 'panel: „ötöde napelemből”', ok: share('naperőművek termelése') > .18 && share('naperőművek termelése') < .24, got: share('naperőművek termelése').toFixed(3), want: '≈ 1/5' },
        { name: 'megjegyzés: „kb. ötödét más országokból”', ok: netImp() / tot > .16 && netImp() / tot < .24, got: (netImp() / tot).toFixed(3), want: '≈ 1/5' },
        { name: 'szél: kétszeres sebesség → 8-szoros teljesítmény', ok: Math.abs(pA(2 * v0()) / pA(v0()) - 8) < 1e-9, got: pA(2 * v0()) / pA(v0()), want: 8 },
        { name: '½ · 1,2 · 5³ = 75 W/m²', ok: Math.abs(pA(5) - 75) < 1e-9, got: pA(5), want: 75 },
        { name: 'LED megtakarítás ≈ adat (kb. 85 %)', ok: Math.abs((1 - num('LED teljesítménye') / num('izzó teljesítménye')) * 100 - num('LED megtakarítás')) < 3, got: ((1 - num('LED teljesítménye') / num('izzó teljesítménye')) * 100).toFixed(1), want: num('LED megtakarítás') },
        { name: 'falu: tároló nélkül éjjel gáz kell', ok: Rd.gasH > 6, got: Rd.gasH, want: '> 6 óra' },
        { name: 'falu: a legnagyobb tárolóval nem kell gáz', ok: Rmax.gasE < .5, got: Rmax.gasE.toFixed(2), want: 0 },
        { name: 'falu: energiamérleg (források = fogyasztás)', ok: Math.abs(R.supE - R.consE) < 1e-6, got: R.supE.toFixed(3), want: R.consE.toFixed(3) },
      ];
    };
  },
  draw(L) {
    c = L.ctx; background();
    if (L.step === 2) track3();
    for (let i = 0; i < SCENES.length; i++) {
      const w = clamp(1 - Math.abs(L.sp - i) * 2); if (w <= .001) continue;
      const st = i === L.step ? L.st : SETTLE[i];
      GA = 1; SCENES[i](st, w); c.globalAlpha = 1; GA = 1;
    }
  },
});
/* QA-állapotok (1-alapú lépésszám) */
const guessQA = (P, k) => (L2) => { P.guess = k; P.gt = L2.st - 30; tipHide(P); panelVeil(false); if (P.on) P.on(k);
  if (P === P6) S6.log = [{ t: -9, v: v0(), A: 0, B: 0 }, { t: P.gt + .5, v: 2 * v0(), A: 0, B: 0, d: 2.2 }];
  if (P === P7) S7.log = [{ t: -9, h: 24 }]; };
const set6 = (v) => (L2) => { guessQA(P6, 'nyolcszor tipp')(L2); S6.sld.set(v); S6.log = [{ t: -9, v, A: 0, B: 0 }]; };
const set7 = (o) => (L2) => { guessQA(P7, 'nem tipp')(L2); for (const [i, v] of o.sl || []) { S7.sl[i].set(v, { fire: true }); } S7.log = [{ t: -9, h: o.h == null ? 24 : o.h }]; };
window.__qaStates = {
  1: [{ name: 'tipp-jó', set: guessQA(P1, 'erőmű tipp') }, { name: 'tipp-rossz', set: guessQA(P1, 'konnektor tipp') }, { name: 'tipp-közben', st: 3, set: (L2) => { guessQA(P1, 'elem tipp')(L2); P1.gt = L2.st - 2.4; } }],
    3: [{ name: 'megoldás', set: (L2) => { G3.solve(L2.st - 5); S3.was = true; S3.doneT = L2.st - 3; } }],
  4: [{ name: 'előtte', set: (L2) => { S4.log = [{ t: -9, T: 0 }]; } }, { name: 'bányászat', set: (L2) => { S4.log = [{ t: -9, T: 25 }]; } }, { name: 'vége-előtt', set: (L2) => { S4.log = [{ t: -9, T: 44 }]; } }],
  5: PLANTS.filter((k) => k !== 'szén').map((k) => ({ name: k, set: (L2) => { S5.sel = k; S5.t = L2.st - 3; } })),
  6: [{ name: 'tipp-jó', set: guessQA(P6, 'nyolcszor tipp') }, { name: 'tipp-rossz', set: guessQA(P6, 'kétszer tipp') }, { name: 'szél-2', set: set6(2) }, { name: 'szél-12', set: set6(12) }],
  7: [{ name: 'tipp-jó', set: guessQA(P7, 'nem tipp') }, { name: 'tipp-rossz', set: guessQA(P7, 'igen tipp') }, { name: 'éjfél-előtt', set: set7({ h: 22 }) },
    { name: 'nagy-tároló', set: set7({ sl: [[2, 1200]] }) }, { name: 'sok-szél', set: set7({ sl: [[1, 150], [0, 0]], h: 4 }) }, { name: 'semmi', set: set7({ sl: [[0, 0], [1, 0]] }) }],
  8: [{ name: 'led', set: (L2) => { S8.led = true; S8.t = L2.st - 3; } }],
};

})();
