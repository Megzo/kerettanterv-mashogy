<script>
(function () {
'use strict';

/* ── MODUL: Grafikon (BioPlot) · forrás: biologia-7-8/07-populacio, 2026-11-23 ──
   Idősor, fázistér, oszlopdiagram, hisztogram, szórásdiagram háttérmezőkkel (Whittaker),
   S-görbe, húzható pont; lineáris vagy logaritmikus tengely, magyar számformátum.
   Csak a Lesson motorra épül (L.ctx, L.tx, L.measure, L.fonts, L.pointer, Lesson.U.fmt); minden
   felirat L.tx-szel megy (QA, review mód), {s, k} párként (szöveg + .md-kulcs). A tengelyszámok
   kódban rögzítettek (kulcs nélkül). Stílus: tengely tinta 2,5 px nyíllal, rács rgba(28,36,64,.08),
   tengelyszám JetBrains Mono 22 px halvány tinta, tengelynév Bricolage 22 px.

   const pl = BioPlot.create(L, {
     x, y, w, h,                    // a rajzterület (a tengelyek ennek a bal és alsó szélén), logikai px
     xa: {min, max, log: false,     // tengely: tartomány, log-lépték (tízes)
          name: {s, k},             // tengelynév (x: a tengely jobb vége alatt; y: a tengely fölött, vízszintesen)
          ticks: [..] | n,          // osztások: tömb vagy közelítő darabszám (alap 6; 1–2–5 lépcső)
          fmt(v) → szöveg,          // osztásfelirat (alap: magyar szám, a lépésköznek megfelelő tizedessel)
          labels: true},            // false → nincs osztásfelirat
     ya: {…ugyanígy},
     bg: [{poly: [[x, y]…], col, name: {s, k}, at: [x, y]}]   // háttérmezők adatkoordinátában (Whittaker)
   })
   pl.X(v) · pl.Y(v) · pl.P(x, y) → [px, py] · pl.inv(px, py) → [x, y] · pl.inside(px, py) · pl.box
   pl.set({x, y, w, h, xa, ya})      – elhelyezés / tengely módosítása (a megadott mezők felülírják a régit)
   pl.axes({a = 1, grid = true, frame = false, names = true, ticks = true, arrow = true, s = 22, col, gridCol})
   pl.bgs({a = 1})                   – a háttérmezők (a nevükkel)
   pl.line(pts, {col, w = 4, a, dash, from, upto (x-értékig, interpolálva), fill (szín a görbe alatt), base,
                 head (nyílhegy a végén), dots (r: kör az adatpontokon), clip = true}) → az utolsó pont [px, py] | null
   pl.bars(vals, {x0 = 0, dx = 1, bw = .8 (oszlopszélesség dx-ben), col | cols: [], a, base = 0,
                  labels: [{s, k}] (az oszlop alatt), values: false (érték fölötte), fmt, s = 22}) → [{x, y, w, h}]
   pl.hist(vals, {min, max, n}, o) → [db…]  – hisztogram (a pl.bars-szal; o.norm: arány darab helyett)
   pl.point(x, y, {r = 8, col, fill, ring = true, a, label: {s, k}, side: 'right' | 'left' | 'above' | 'below',
                   s = 24, w = 700, lc (a felirat színe)}) → [px, py]
   pl.vline(x, {col, w = 2, dash, a, label: {s, k}, at: 'top' | 'bottom', s = 22})
   pl.hline(y, {… at: 'right' | 'left'})
   pl.band(x0, x1, {col, a})          – függőleges sáv (időszak kiemelése)
   pl.text(s, x, y, o)                – L.tx adatkoordinátában (o.k: a .md-kulcs)
   pl.arrow(pts, i, {col, size = 16}) – irány-nyílhegy a görbén az i. pontnál (fázistér)
   pl.legend(items: [{s, k, col, dash, w}], {x, y, dir: 'down' | 'right', s = 22, gap = 28}) → {w, h}
   pl.drag(id, get, set, {r = 30, snap(x, y) → [x, y]})
        húzható pont: ha a gomb a get() → [x, y] pont r px-es körzetében megy le, megfogja; húzás közben
        set(x, y)-t hívja adatkoordinátában (a dobozra vágva). Visszaad: true, amíg húzzák.
   BioPlot.ticks(min, max, n = 6) → 1–2–5 lépcsős osztások · BioPlot.logTicks(min, max) → tízhatványok
   BioPlot.fmt(v, step) → magyar szám a lépésközhöz illő tizedesjeggyel
   ──────────────────────────────────────────────────────────────────────────────────────────── */
const BioPlot = (() => {
  'use strict';
  const COL = { ink: '#1c2440', mut: '#565d72', grid: 'rgba(28,36,64,.08)', red: '#c8401c' };
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const hfmt = (v, d) => (typeof Lesson !== 'undefined' && Lesson.U ? Lesson.U.fmt(v, d) : v.toFixed(d).replace('.', ',').replace('-', '−'));
  function ticks(min, max, n = 6) {
    const span = max - min; if (!(span > 0)) return [min];
    const raw = span / Math.max(1, n), p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
    const st = (f < 1.5 ? 1 : f < 3.5 ? 2 : f < 7.5 ? 5 : 10) * p, out = [];
    for (let v = Math.ceil(min / st - 1e-9) * st; v <= max + st * 1e-9; v += st) out.push(Math.abs(v) < st * 1e-9 ? 0 : v);
    out.step = st; return out;
  }
  function logTicks(min, max) { const out = []; for (let e = Math.ceil(Math.log10(min) - 1e-9); e <= Math.floor(Math.log10(max) + 1e-9); e++) out.push(Math.pow(10, e)); return out; }
  function fmt(v, step) { const d = step >= 1 || !step ? 0 : Math.min(4, Math.ceil(-Math.log10(step) - 1e-9)); return hfmt(v, d); }

  function create(L, o) {
    const pl = { L };
    let B, XA, YA, BG;
    pl.set = (q) => {
      B = { x: q.x != null ? q.x : B.x, y: q.y != null ? q.y : B.y, w: q.w != null ? q.w : B.w, h: q.h != null ? q.h : B.h };
      if (q.xa) XA = Object.assign({}, XA || {}, q.xa); if (q.ya) YA = Object.assign({}, YA || {}, q.ya);
      if (q.bg) BG = q.bg; pl.box = B; pl.xa = XA; pl.ya = YA; return pl;
    };
    B = { x: o.x, y: o.y, w: o.w, h: o.h }; pl.set(o); BG = o.bg || [];
    const sc = (a, v) => a.log ? (Math.log10(Math.max(v, 1e-300)) - Math.log10(a.min)) / (Math.log10(a.max) - Math.log10(a.min)) : (v - a.min) / (a.max - a.min);
    const isc = (a, u) => a.log ? Math.pow(10, Math.log10(a.min) + u * (Math.log10(a.max) - Math.log10(a.min))) : a.min + u * (a.max - a.min);
    pl.X = (v) => B.x + sc(XA, v) * B.w;
    pl.Y = (v) => B.y + B.h - sc(YA, v) * B.h;
    pl.P = (x, y) => [pl.X(x), pl.Y(y)];
    pl.inv = (px, py) => [isc(XA, (px - B.x) / B.w), isc(YA, (B.y + B.h - py) / B.h)];
    pl.inside = (px, py) => px >= B.x && px <= B.x + B.w && py >= B.y && py <= B.y + B.h;
    const tk = (a) => Array.isArray(a.ticks) ? a.ticks : a.log ? logTicks(a.min, a.max) : ticks(a.min, a.max, a.ticks || 6);
    const lab = (a, v, t) => a.fmt ? a.fmt(v) : a.log ? fmt(v, v) : fmt(v, t.step || (t.length > 1 ? Math.abs(t[1] - t[0]) : 1));
    function clip(c) { c.beginPath(); c.rect(B.x - 2, B.y - 2, B.w + 4, B.h + 4); c.clip(); }

    pl.axes = (q = {}) => {
      const c = L.ctx, F = L.fonts, s = q.s || 22, col = q.col || COL.ink, a = q.a == null ? 1 : q.a;
      c.save(); c.globalAlpha *= a; c.lineCap = 'butt'; c.setLineDash([]);
      const tx = tk(XA), ty = tk(YA);
      if (q.grid !== false) {
        c.strokeStyle = q.gridCol || COL.grid; c.lineWidth = 1.5; c.beginPath();
        for (const v of tx) { const X = Math.round(pl.X(v)) + .5; if (X > B.x + 1 && X <= B.x + B.w) { c.moveTo(X, B.y); c.lineTo(X, B.y + B.h); } }
        for (const v of ty) { const Y = Math.round(pl.Y(v)) + .5; if (Y < B.y + B.h - 1 && Y >= B.y) { c.moveTo(B.x, Y); c.lineTo(B.x + B.w, Y); } }
        c.stroke();
      }
      if (q.frame) { c.strokeStyle = 'rgba(28,36,64,.25)'; c.lineWidth = 1.5; c.strokeRect(B.x, B.y, B.w, B.h); }
      c.strokeStyle = col; c.fillStyle = col; c.lineWidth = 2.5; c.beginPath();
      c.moveTo(B.x, B.y + B.h); c.lineTo(B.x + B.w + (q.arrow === false ? 0 : 14), B.y + B.h);
      c.moveTo(B.x, B.y + B.h); c.lineTo(B.x, B.y - (q.arrow === false ? 0 : 14)); c.stroke();
      if (q.arrow !== false) {
        c.beginPath(); c.moveTo(B.x + B.w + 24, B.y + B.h); c.lineTo(B.x + B.w + 10, B.y + B.h - 6.5); c.lineTo(B.x + B.w + 10, B.y + B.h + 6.5); c.closePath(); c.fill();
        c.beginPath(); c.moveTo(B.x, B.y - 24); c.lineTo(B.x - 6.5, B.y - 10); c.lineTo(B.x + 6.5, B.y - 10); c.closePath(); c.fill();
      }
      if (q.ticks !== false) {
        c.lineWidth = 2; c.beginPath();
        for (const v of tx) { const X = pl.X(v); if (X >= B.x - .5 && X <= B.x + B.w + .5) { c.moveTo(X, B.y + B.h); c.lineTo(X, B.y + B.h + 7); } }
        for (const v of ty) { const Y = pl.Y(v); if (Y >= B.y - .5 && Y <= B.y + B.h + .5) { c.moveTo(B.x, Y); c.lineTo(B.x - 7, Y); } }
        c.stroke();
        if (XA.labels !== false) for (const v of tx) { const X = pl.X(v); if (X >= B.x - .5 && X <= B.x + B.w + .5) L.tx(lab(XA, v, tx), X, B.y + B.h + 12, { f: F.M, s, w: 500, a: 'center', b: 'top', c: COL.mut }); }
        if (YA.labels !== false) for (const v of ty) { const Y = pl.Y(v); if (Y >= B.y - .5 && Y <= B.y + B.h + .5) L.tx(lab(YA, v, ty), B.x - 12, Y, { f: F.M, s, w: 500, a: 'right', b: 'middle', c: COL.mut }); }
      }
      if (q.names !== false) {
        if (XA.name) L.tx(XA.name.s, B.x + B.w + 4, B.y + B.h + 14 + s * 1.25, { s, w: 600, a: 'right', b: 'top', c: col, k: XA.name.k, max: XA.name.max });
        if (YA.name) L.tx(YA.name.s, B.x + 14, B.y - 18, { s, w: 600, a: 'left', b: 'alphabetic', c: col, k: YA.name.k, max: YA.name.max });
      }
      c.restore();
    };
    pl.bgs = (q = {}) => {
      const c = L.ctx; c.save(); c.globalAlpha *= q.a == null ? 1 : q.a; clip(c);
      for (const g of BG) { c.beginPath(); g.poly.forEach((p, i) => { const [X, Y] = pl.P(p[0], p[1]); if (i) c.lineTo(X, Y); else c.moveTo(X, Y); }); c.closePath(); c.fillStyle = g.col; c.fill(); }
      c.restore();
      c.save(); c.globalAlpha *= q.a == null ? 1 : q.a;
      for (const g of BG) if (g.name && g.at) { const [X, Y] = pl.P(g.at[0], g.at[1]); L.tx(g.name.s, X, Y, { s: 22, w: 600, a: 'center', b: 'middle', c: g.tc || COL.ink, k: g.name.k }); }
      c.restore();
    };
    pl.line = (pts, q = {}) => {
      const c = L.ctx; if (!pts || !pts.length) return null;
      const P = [];
      const lo = q.from == null ? -Infinity : q.from, hi = q.upto == null ? Infinity : q.upto;
      for (let i = 0; i < pts.length; i++) {
        const p = pts[i], x = p[0];
        if (x < lo) { const n = pts[i + 1]; if (n && n[0] > lo) P.push([lo, p[1] + (n[1] - p[1]) * (lo - x) / (n[0] - x)]); continue; }
        if (x > hi) { const pr = pts[i - 1]; if (pr && pr[0] < hi) P.push([hi, pr[1] + (p[1] - pr[1]) * (hi - pr[0]) / (x - pr[0])]); break; }
        P.push(p);
      }
      if (q.upto != null && hi < pts[0][0]) return null;
      if (!P.length) return null;
      c.save(); c.globalAlpha *= q.a == null ? 1 : q.a; if (q.clip !== false) clip(c);
      c.lineJoin = 'round'; c.lineCap = 'round';
      const S = P.map((p) => pl.P(p[0], p[1]));
      if (q.fill) {

        if (sd === 'right') L.tx(q.label.s, X + r + 10, Y, Object.assign(o, { a: 'left', b: 'middle' }));

/* ── MODUL: Kártyák (TortCards) ────────────────────────────────────────────────────
   G modul (pilot/tortenelem-5-6/terv.md, 5. fejezet): „húzd a helyére” – kártyák rendezése zónákba
   (pl. két oszlop: falu / város), azonnali visszajelzéssel. Referencia: 07-kozepkori-varos.
   Később változtatás nélkül átemelhető: shared/tort/cards.js. Csak a Lesson motorra épül
   (L.ctx, L.tx, L.measure, L.pointer, L.stage, L.st, L.VW).

   const g = TortCards.create(L, {
     zones: [{id, x, y, w, h, title: {s, k}, sub?: {s, k}, head?: 110}], // célterületek; head: a fejléc magassága
     cards: [{id, label: {s, k}, zone}],      // zone: a helyes zóna id-ja (a kódban rögzített megoldás)
     tray: {x, y, w, h, pad?: 24, top?: 56},  // a kártyák kiinduló helye: sorfolytonosan, soronként középre
     font?: {f, s, w},                        // kártyafelirat (alap: Bricolage 24 / 600)
     gap?: 14, ease?: .45,                    // térköz px; a mozgás hossza mp
     decor?: (zone, alpha) => {}              // opcionális: saját rajz a zóna fejlécébe
   });
   g.reset()                  minden kártya a tálcára, animáció nélkül (a lépés enter()-jében hívd)
   g.place(id, zoneId, t0?)   kártya egy zónába (zoneId null → vissza a tálcára); a mozgás t0-tól (L.st) indul
   g.solve(t0?)               minden kártya a helyes zónába, kissé lépcsőzetesen
   g.update()                 minden képkockán, a rajzolás előtt, csak az aktív lépésben: húzás, kurzor
   g.draw({a})                zónák, kártyák (a húzott legfelül), visszajelzés: zöld keret + pipa / piros + kereszt
   g.score() → {ok, placed, total}   ·   g.touched: a felhasználó már húzott   ·   g.cards, g.zones
   Az állapot zárt képletű: a kártya helye = lerp(from, cél, inOut((L.st − t0) / ease)).
   ──────────────────────────────────────────────────────────────────────────────── */
const TortCards = (() => {
  const F = Lesson.FONTS, U = Lesson.U;
  const INK = '#1c2440', MUT = '#565d72', CARD = '#fffaf1', GOOD = '#1d7a45', BAD = '#b3261e', RED = '#c8401c';

  function create(L, cfg) {
    const FT = Object.assign({ f: F.B, s: 24, w: 600 }, cfg.font || {});
    const gap = cfg.gap || 14, ease = cfg.ease || .45, PX = 18, H = FT.s + 30, ICON = 30;
    const zones = cfg.zones.map((z) => Object.assign({ head: 110 }, z));
    const cards = cfg.cards.map((q, i) => ({ id: q.id, label: q.label, zone: q.zone, i, at: null, ord: 0, from: null, tgt: null, t0: -99 }));
    const g = { zones, cards, touched: false, drag: null, _pd: false, _ord: 0, _hov: null };
    const byId = (id) => cards.find((q) => q.id === id);
    const zoneAt = (x, y) => zones.find((z) => x >= z.x && x <= z.x + z.w && y >= z.y && y <= z.y + z.h) || null;
    const cw = (q) => L.measure(q.label.s, FT).w + PX * 2 + ICON;
    const ez = (t) => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

    /* sorfolytonos elhelyezés egy téglalapban; center: a sorok középre igazítva */
    function flow(list, x, y, w, center) {
      const rows = [[]]; let cx = 0;
      for (const q of list) { const ww = cw(q); if (cx > 0 && cx + ww > w) { rows.push([]); cx = 0; } rows[rows.length - 1].push({ q, ww, x: cx }); cx += ww + gap; }
      const out = {};
      rows.forEach((r, ri) => {
        const rw = r.length ? r[r.length - 1].x + r[r.length - 1].ww : 0, off = center ? (w - rw) / 2 : 0;
        r.forEach((e) => { out[e.q.id] = { x: x + off + e.x, y: y + ri * (H + gap), w: e.ww }; });
      });
      return out;
    }
    let traySlots = null;
    const tray = () => { const t = cfg.tray, p = t.pad == null ? 24 : t.pad; return { x: t.x + p, y: t.y + (t.top == null ? 56 : t.top), w: t.w - p * 2 }; };
    function target(q) {
      if (!q.at) { if (!traySlots) { const t = tray(); traySlots = flow(cards, t.x, t.y, t.w, true); } return traySlots[q.id]; }
      const z = zones.find((zz) => zz.id === q.at), list = cards.filter((c2) => c2.at === q.at).sort((a, b) => a.ord - b.ord);
      return flow(list, z.x + 20, z.y + z.head, z.w - 40, false)[q.id];
    }
    function disp(q) {
      const T = target(q);
      if (!q.tgt || Math.abs(T.x - q.tgt.x) > .5 || Math.abs(T.y - q.tgt.y) > .5) {   // új cél (pl. átrendeződés): onnan, ahol most van
        q.from = q.tgt ? cur(q) : null; q.t0 = q.tgt ? L.st : -99; q.tgt = { x: T.x, y: T.y };
      }
      return Object.assign(cur(q), { w: T.w });
    }
    function cur(q) {
      if (!q.from) return { x: q.tgt.x, y: q.tgt.y };
      const k = ez(U.clamp((L.st - q.t0) / ease));
      return { x: U.lerp(q.from.x, q.tgt.x, k), y: U.lerp(q.from.y, q.tgt.y, k) };
    }

    g.reset = () => { cards.forEach((q) => { q.at = null; q.ord = 0; q.from = null; q.tgt = null; q.t0 = -99; }); traySlots = null; g.drag = null; g.touched = false; g._ord = 0; };
    g.place = (id, zid, t0, from) => {
      const q = typeof id === 'string' ? byId(id) : id; if (!q) return;
      const p = from || (q.tgt ? cur(q) : target(q));
      q.at = zid || null; q.ord = ++g._ord;
      const T = target(q); q.from = { x: p.x, y: p.y }; q.tgt = { x: T.x, y: T.y }; q.t0 = t0 == null ? L.st : t0;
    };
    g.solve = (t0) => { const t = t0 == null ? L.st : t0; cards.filter((q) => q.at !== q.zone).forEach((q, i) => g.place(q, q.zone, t + i * .08)); };
    g.score = () => ({ ok: cards.filter((q) => q.at && q.at === q.zone).length, placed: cards.filter((q) => q.at).length, total: cards.length });

    g.update = () => {
      const p = L.pointer, edge = p.down && !g._pd; g._pd = p.down;
      const hit = () => { for (let i = cards.length - 1; i >= 0; i--) { const q = order()[i], d = disp(q); if (p.x >= d.x && p.x <= d.x + d.w && p.y >= d.y && p.y <= d.y + H) return { q, d }; } return null; };
      if (edge && p.x < L.VW && !g.drag) { const h = hit(); if (h) { g.drag = { q: h.q, dx: p.x - h.d.x, dy: p.y - h.d.y }; g.touched = true; } }
      if (g.drag && !p.down) {
        const d = g.drag, x = p.x - d.dx, y = p.y - d.dy, z = zoneAt(p.x, p.y), t = cfg.tray;
        const inTray = p.x >= t.x && p.x <= t.x + t.w && p.y >= t.y && p.y <= t.y + t.h;
        if (z) g.place(d.q, z.id, L.st, { x, y });
        else if (inTray) g.place(d.q, null, L.st, { x, y });
        else { d.q.from = { x, y }; d.q.t0 = L.st; }                  // máshová ejtve: vissza a helyére
        g.drag = null;
      }
      const h = g.drag ? null : (p.inside && p.x < L.VW ? hit() : null);
      g._hov = h ? h.q : null;
      if (L.stage) L.stage.style.cursor = g.drag ? 'grabbing' : h ? 'grab' : '';
    };
    const order = () => cards.slice().sort((a, b) => (a === (g.drag && g.drag.q) ? 1 : 0) - (b === (g.drag && g.drag.q) ? 1 : 0) || (a.at ? 1 : 0) - (b.at ? 1 : 0) || a.ord - b.ord || a.i - b.i);

    function mark(c, ok, x, y) {        // pipa / kereszt (rajz, nem szöveg)
      c.save(); c.lineCap = 'round'; c.lineJoin = 'round'; c.lineWidth = 4; c.strokeStyle = ok ? GOOD : BAD; c.beginPath();
      if (ok) { c.moveTo(x - 9, y); c.lineTo(x - 3, y + 7); c.lineTo(x + 10, y - 8); } else { c.moveTo(x - 7, y - 7); c.lineTo(x + 7, y + 7); c.moveTo(x + 7, y - 7); c.lineTo(x - 7, y + 7); }
      c.stroke(); c.restore();
    }
    function card(c, q, d, lift) {
      const placed = !!q.at, ok = placed && q.at === q.zone, hov = g._hov === q;
      c.save();
      if (lift) { c.shadowColor = 'rgba(70,50,20,.28)'; c.shadowBlur = 22; c.shadowOffsetY = 8; }
      c.beginPath(); c.roundRect(d.x, d.y, d.w, H, 10); c.fillStyle = CARD; c.fill(); c.shadowColor = 'transparent';
      if (placed && !lift) { c.fillStyle = U.rgba(ok ? GOOD : BAD, .08); c.fill(); }
      c.lineWidth = placed && !lift ? 3 : 2; c.strokeStyle = placed && !lift ? (ok ? GOOD : BAD) : hov || lift ? RED : U.rgba(INK, .45); c.stroke();
      L.tx(q.label.s, d.x + PX, d.y + H / 2 + 1, Object.assign({}, FT, { b: 'middle', c: INK, k: q.label.k }));
      const ix = d.x + d.w - PX - 8, iy = d.y + H / 2;
      if (placed && !lift) mark(c, ok, ix, iy);
      else { c.fillStyle = U.rgba(INK, .4); for (let r = -1; r <= 1; r++) for (let s = 0; s < 2; s++) { c.beginPath(); c.arc(ix - 3 + s * 7, iy + r * 7, 2.2, 0, Math.PI * 2); c.fill(); } }
      c.restore();
    }
    g.draw = (o = {}) => {
      const c = L.ctx, A = o.a == null ? 1 : o.a; if (A <= .01) return;
      c.save(); c.globalAlpha *= A;
      for (const z of zones) {
        c.beginPath(); c.roundRect(z.x, z.y, z.w, z.h, 16); c.fillStyle = 'rgba(255,250,241,.82)'; c.fill();
        c.setLineDash([10, 7]); c.lineWidth = 2.5; c.strokeStyle = U.rgba(INK, .5); c.stroke(); c.setLineDash([]);
        L.tx(z.title.s, z.x + 22, z.y + 54, { f: F.D, s: 40, w: 600, c: INK, k: z.title.k });
        if (z.sub) L.tx(z.sub.s, z.x + 22, z.y + 88, { f: F.B, s: 22, w: 500, c: MUT, k: z.sub.k });
        if (cfg.decor) { c.save(); cfg.decor(z, c.globalAlpha); c.restore(); }
      }
      const t = cfg.tray; c.beginPath(); c.roundRect(t.x, t.y, t.w, t.h, 16); c.fillStyle = 'rgba(28,36,64,.05)'; c.fill();
      c.lineWidth = 2; c.strokeStyle = U.rgba(INK, .25); c.stroke();
      const p = L.pointer;
      for (const q of order()) {
        if (g.drag && g.drag.q === q) continue;
        card(c, q, disp(q), q.from && L.st - q.t0 < ease);
      }
      if (g.drag) { const q = g.drag.q, d = disp(q); card(c, q, { x: p.x - g.drag.dx, y: p.y - g.drag.dy, w: d.w }, true); }
      c.restore();
    };
    return g;
  }
  return { create };
})();

/* ── MODUL: Áramlás csőhálózatban (BioFlow) · forrás: biologia-7-8/11-verkor, 2026-11-23 · v1.1 (2026-11-24) ──
   Zárt csőhálózat (vérkör, vagy általában gráf: energia- és anyagáram), benne áramló
   részecskékkel. Minden állapot ZÁRT KÉPLETBŐL jön (a szívverések számából, b), nincs
   képkockánkénti összegzés: a QA és a visszaléptetés determinisztikus.

   const fl = BioFlow.create({
     nodes:  {id: [x, y]},                     // tetszőleges koordinátarendszer (pl. BioBody normalizált)
     edges:  [{id, from, to, path: [[x, y]…],  // köztes pontok; Catmull–Rom simítással (straight: true → nem)
               kind: 'szív' | 'artéria' | 'hajszálér' | 'véna' | 'él',
               group: (időelosztási csoport, alap: kind),
               area: 1,                        // relatív keresztmetszet: időtartam ∝ hossz · area
               ox: [be, ki] (0 oxigénszegény … 1 oxigéndús) VAGY exchange: 'O2+' | 'O2-',
