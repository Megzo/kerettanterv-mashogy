/* ── MODUL: Részecskemotor (Reszecske) · forrás: kemia-7-8/01-reszecskemodell, 2026-11-23 · v1.1 (2026-11-24) ── */
/* API
   Tantárgyfüggetlen 2D részecskeszimuláció (gáz, folyadék, szilárd rács, diffúzió, keverék),
   DETERMINISZTIKUS VISSZAJÁTSZÁSSAL. Nem hivatkozik a lecke kódjára; csak egy 2D vászon kell.
   Változtatás nélkül átemelhető (tervezett helye: shared/reszecske.js).

   const S = Reszecske.create({
     seed: 42,                   // véletlenmag (kezdőhelyek, kezdősebességek) – azonos mag → azonos futás
     dt: 1 / 120,                // fix lépésköz (s)
     box: {x, y, w, h},          // téglalap tartály (logikai px)
     walls: {l, r, t, b},        // opcionális: a fal helyzete fn(t) (zárt képletű dugattyú) – a box-on belül
     species: {                  // részecskefajták
       N2: {r: 12, m: 28, c: '#2f5fb3', draw: 'ketatom'},     // r: ütközési sugár px · m: relatív tömeg · c: szín
       H2O: {r: 12, m: 18, draw: 'viz'} },                   // draw: 'golyo' | 'ketatom' (c2: 2. atom színe) |
                                                              //   'viz' | 'etanol' | fn(ctx, x, y, r, ang, faj)
     T: 293,                     // hőmérséklet (K) – a termosztát célja
     vRef: 150,                  // négyzetes középsebesség px/s-ban m = 28, T = 293 K esetén (szemléltetés: lassított)
     thermo: 0.5,                // termosztát időállandója (s); 0 → nincs termosztát (az energia megmarad)
     collide: true,              // részecske–részecske rugalmas ütközés (false: átrepülnek egymáson)
     gravity: 0,                 // lefelé gyorsulás, px/s²
     attract: null,              // {eps, range}: vonzás, ha a felületek távolsága < range (eps: csúcs, px/s²) → folyadék
     anchorK: 0,                 // rugó a rácshelyhez (1/s²) a horgonyzott részecskékre → szilárd rács
     max: 600,                   // a részecskék felső száma
   });
   S.add('N2', 40, {region: {x, y, w, h}, lattice: 'random' | 'hex', gap: 2, anchor: false, tag: 0,
                    exact: false, fill: false}) → a ténylegesen letett darabszám
                               // csak az első S.at előtt; később esemény ({add}) kell.
                               // Ha a régióba (a gap-pel és a már bent lévőkkel) nem fér el n darab, a
                               // modul kevesebbet tesz le, és console.warn-nal szól (azonos hívásra egyszer);
                               // exact: true → a maradékot átfedéssel is leteszi (az ütközés széttolja),
                               // így pontosan n darab lesz (a max-korlátig); fill: true → n csak felső
                               // korlát („töltsd fel, ameddig elfér”, pl. hex rács), nincs figyelmeztetés
   S.at(t, events)             // az állapotot PONTOSAN a t. másodpercre hozza. events: időrendben,
                               //   [{t, set: {T, collide, gravity, attract, anchorK, thermo}},
                               //    {t, add: ['N2', 10, {region…}]}, {t, remove: 'N2' | fn(S, i) → bool},
                               //    {t, id: 'egyedi', fn: (S) => {…}}]
                               //   Azonos seed + azonos eseménysor → mindig ugyanaz az állapot. Előre csak
                               //   továbbfut; visszafelé (vagy ha egy múltbeli esemény változott) a legközelebbi
                               //   ellenőrzőpontból (0,5 s-onként mentve) számol újra.
   S.reset()                   // vissza a kezdőállapotba, ellenőrzőpontok törlése – enter(L)-ben hívd,
                               //   és mindig, ha a walls-függvény mögötti napló kiürül
   S.t                         // a szimuláció ideje (s)
   S.n, S.x[i], S.y[i], S.vx[i], S.vy[i], S.sp[i] (fajta indexe), S.names[], S.tag[i]   – csak olvasásra
   S.speeds(sp?)  → [px/s, …] · S.count(fn(S, i) → bool) · S.Tkin() → K (a mozgási energiából)
   S.hits(side)   → falba csapódás / s (mozgó átlag, τ = 1 s; side: 'l' | 'r' | 't' | 'b') – a nyomással arányos
   S.draw(ctx, {hl: (i) → bool, hlColor, alpha: (i) → 0..1, trail: s})   // 3D-hatású golyók, sötét körvonallal
   Reszecske.ball(ctx, x, y, r, szín, keret?)          // egy golyó ugyanabban a stílusban
   Reszecske.mol(ctx, draw, x, y, r, ang, faj)        // egy molekula (jelmagyarázathoz)
   Reszecske.zart(n, seed) → Z                        // zárt képletű „díszítő” halmaz (nincs szimuláció):
     Z.frame(t, phase, B, it)  → [{x, y, ang}]        //   phase: 0 rácsban rezeg · 1 folyadék · 2 gáz (közte átmenet)
                                                      //   B: {x, y, w, h, d (részecskeátmérő)}; it: átfedés-feloldás
   Teljesítmény: rácsos szomszédkeresés; ~400 részecske 120 Hz-en is bőven 60 fps.
   v1.1 (2026-11-24): add – figyelmeztetés, ha kevesebb fér el; exact és fill opció; visszaadja a darabszámot.

const Reszecske = (() => {
  const TAU = Math.PI * 2;
  const rgb = (h) => { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
  const mixc = (a, b, t) => { const A = rgb(a), B = rgb(b); return 'rgb(' + A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',') + ')'; };
  const SPR = new Map();
  function sprite(col, bd) {
    const key = col + '|' + (bd || ''); let s = SPR.get(key); if (s) return s;
    s = document.createElement('canvas'); s.width = s.height = 80; const g = s.getContext('2d');
    const gr = g.createRadialGradient(29, 27, 2, 40, 40, 37);
    gr.addColorStop(0, mixc(col, '#ffffff', .62)); gr.addColorStop(.42, col); gr.addColorStop(1, mixc(col, '#000000', .36));
    g.beginPath(); g.arc(40, 40, 36, 0, TAU); g.fillStyle = gr; g.fill();
    const hl = g.createRadialGradient(28, 25, 0, 28, 25, 15); hl.addColorStop(0, 'rgba(255,255,255,.85)'); hl.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = hl; g.fill();
    g.lineWidth = 5; g.strokeStyle = bd || mixc(col, '#1c2440', .62); g.beginPath(); g.arc(40, 40, 35, 0, TAU); g.stroke();

  function ball(ctx, x, y, r, col, bd) { const k = r / 36; ctx.drawImage(sprite(col, bd), x - 40 * k, y - 40 * k, 80 * k, 80 * k); }

  function create(cfg) {
    const h = cfg.dt || 1 / 120, MAX = cfg.max || 600, KC = Math.max(1, Math.round(.5 / h));
    const names = Object.keys(cfg.species);
    const SP = names.map((k) => Object.assign({ r: 8, m: 28, c: '#8a93a6', draw: 'golyo' }, cfg.species[k], { name: k }));
    const idx = {}; names.forEach((k, i) => { idx[k] = i; });
    const vRef = cfg.vRef || 150, kk = vRef * vRef * 28 / (2 * 293);
    const box = cfg.box, WF = cfg.walls || {};
    const FL = ['x', 'y', 'vx', 'vy', 'ax', 'ay', 'a0', 'w'];

    FL.forEach((f) => { S[f] = new Float64Array(MAX); });
    S.sp = new Int16Array(MAX); S.tag = new Int32Array(MAX);
    const rmax = SP.reduce((m, s) => Math.max(m, s.r), 0);
    let P = { T: cfg.T == null ? 293 : cfg.T, thermo: cfg.thermo == null ? .5 : cfg.thermo, collide: cfg.collide !== false,
      gravity: cfg.gravity || 0, attract: cfg.attract || null, anchorK: cfg.anchorK || 0, rng: (cfg.seed >>> 0) || 1,
      hits: [0, 0, 0, 0], wl: box.x, wr: box.x + box.w, wt: box.y, wb: box.y + box.h };
    let k = 0, ep = 0, sigs = [], evT = [], cps = [], base = null;
    const warned = new Set();
    const rnd = () => { let s = P.rng; s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; P.rng = s; return s / 4294967296; };
    const gauss = () => { const u = Math.max(1e-12, rnd()), v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v); };
    const wallAt = (side, t, def) => (typeof WF[side] === 'function' ? WF[side](t) : def);

    function addN(name, n, o = {}) {
      const si = idx[name]; if (si == null) throw new Error('Reszecske: ismeretlen fajta ' + name);
      const s = SP[si], R = o.region || { x: P.wl, y: P.wt, w: P.wr - P.wl, h: P.wb - P.wt }, gap = o.gap == null ? 2 : o.gap;
      const pts = [];

        const d = 2 * s.r + gap, dy = d * Math.sqrt(3) / 2, cols = Math.max(1, Math.floor((R.w - 2 * s.r) / d + 1e-9) + 1);
        const x0 = R.x + (R.w - (cols - 1) * d - d / 2) / 2;
        for (let j = 0; pts.length < n; j++) {
          const y = R.y + R.h - s.r - j * dy; if (y < R.y + s.r - 1e-6) break;
          for (let i = 0; i < cols && pts.length < n; i++) { const x = x0 + (j % 2) * d / 2 + i * d; if (x >= R.x + s.r - 1e-6 && x <= R.x + R.w - s.r + 1e-6) pts.push([x, y]); }
        }

        for (let tries = 0; pts.length < n && tries < n * 400; tries++) {
          const x = R.x + s.r + rnd() * (R.w - 2 * s.r), y = R.y + s.r + rnd() * (R.h - 2 * s.r);
          let ok = true;
          for (let j = 0; j < S.n && ok; j++) { const q = SP[S.sp[j]].r + s.r + gap; if ((S.x[j] - x) ** 2 + (S.y[j] - y) ** 2 < q * q) ok = false; }
          for (const [px, py] of pts) { if (!ok) break; const q = 2 * s.r + gap; if ((px - x) ** 2 + (py - y) ** 2 < q * q) ok = false; }

const SCENES = [scene1, scene2, scene3, scene4, scene5, scene6, scene7, scene8];
const SETTLE = [5, 4, 6, 4, 4, 8.5, 3, 6.5];
L = Lesson.create({
  content: window.LESSON_CONTENT, home: false, resetCtx: true,
  steps: [
    { settle: SETTLE[0],
      controls(L) {
        S1.sld = L.slider({ label: lab('mélység csúszka'), k: 'mélység csúszka', min: 2, max: num('legnagyobb mélység'), step: 1, value: 15, format: (v) => fmt(v, 0) + ' cm', onInput: (v) => { if (S1.tilt <= L.st) return; pushLog(S1, { d: v }); } });
        L.button(lab('billentés gomb'), () => { if (S1.tilt > L.st) S1.tilt = L.st; }, 'billentés gomb');
        L.button(lab('újra pohár gomb'), () => { S1.tilt = 99; S1.log = [{ t: -9, d: lastOf(S1.log, 1e9).d }]; }, 'újra pohár gomb');
      },
      enter() { reset1(); } },
    { settle: SETTLE[1],
      controls(L) {
        tipControls(P2);
        const mk = (k, dk, mn, mx, st) => L.slider({ label: lab(k), k, min: mn, max: mx, step: st, value: num(dk), format: (v) => fmt(v, 1) + ' m', onInput: (v) => pushLog(S2, { [dk === 'terem hossza' ? 'Lx' : dk === 'terem szélessége' ? 'Wy' : 'Hz']: v }) });
        S2.sl = [mk('hossz csúszka', 'terem hossza', 4, 15, .5), mk('szélesség csúszka', 'terem szélessége', 4, 12, .5), mk('magasság csúszka', 'terem magassága', 2.5, 5, .1)];
        show2();
      },
      enter() { reset2(); veilIf(P2); S2.sl.forEach((s, i) => { s.set(num(['terem hossza', 'terem szélessége', 'terem magassága'][i])); }); show2(); } },
    { settle: SETTLE[2],
      controls(L) { S3.sld = L.slider({ label: lab('vízhőmérséklet csúszka'), k: 'vízhőmérséklet csúszka', min: num('kiinduló hőmérséklet'), max: num('legmelegebb víz'), step: 1, value: num('kiinduló hőmérséklet'), format: (v) => DEG(v), onInput: (v) => pushLog(S3, { T: v }) }); },
      enter() { reset3(); if (S3.sld) S3.sld.set(num('kiinduló hőmérséklet')); } },
    { settle: SETTLE[3],
      controls(L) {
        L.button(lab('fűtés ki gomb'), () => pushLog(S4, { on: 0 }), 'fűtés ki gomb');
        L.button(lab('fűtés be gomb'), () => pushLog(S4, { on: 1 }), 'fűtés be gomb');
      },
      enter() { reset4(); } },
    { settle: SETTLE[4], controls(L) { L.button(lab('megoldás tűz gomb'), () => G5.solve(L.st), 'megoldás tűz gomb'); }, enter() { G5.reset(); } },
    { settle: SETTLE[5],
      controls(L) {
        L.button(lab('víz gomb'), () => { S6.tA = L.st; S6.tB = 1e9; }, 'víz gomb');
        L.button(lab('fedő gomb'), () => { S6.tB = L.st; if (S6.tA > L.st) S6.tA = -99; }, 'fedő gomb');
      },
      enter() { reset6(); } },
    { settle: SETTLE[6],
      controls(L) {
        tipControls(P7);
        S7.sld = L.slider({ label: lab('idő csúszka'), k: 'idő csúszka', min: 0, max: 180, step: 5, value: 0, format: (v) => fmt(v, 0) + ' s', onInput: (v) => { S7.touched = true; pushLog(S7, { v, d: .5 }); } });
        L.button(lab('állva gomb'), () => pushLog(S7, { pose: 0 }), 'állva gomb');
        L.button(lab('lehajolva gomb'), () => pushLog(S7, { pose: 1 }), 'lehajolva gomb');
        L.button(lab('ajtó nyitva gomb'), () => pushLog(S7, { door: 1 }), 'ajtó nyitva gomb');
        L.button(lab('ajtó csukva gomb'), () => pushLog(S7, { door: 0 }), 'ajtó csukva gomb');
        S7.row2 = L.controlsEl.lastElementChild; show7();
      },
      enter() { reset7(); veilIf(P7); show7(); } },
    { settle: SETTLE[7] },
  ],
  init(Lx) {
    L = Lx; build3(); build4(); build5();
    reset1(); reset2(); reset3(); reset4(); reset6(); reset7(); G5.reset();
    L.checks = () => {
      const m = mass2(9, 7, 3), r60 = ratio3(60);
      return [
        { name: 'a terem levegője (9 × 7 × 3 m) ≈ 227 kg', ok: Math.abs(mass2(num('terem hossza'), num('terem szélessége'), num('terem magassága')) - 226.8) < 1, got: m.toFixed(1), want: 226.8 },
        { name: 'légnyomás ≈ 1,03 kg/cm²', ok: Math.abs(press2() - 1.033) < .005, got: press2().toFixed(3), want: 1.033 },
        { name: 'a 20 °C → 60 °C térfogatarány ≈ 1,137', ok: Math.abs(r60 - 1.1365) < .001, got: r60.toFixed(4), want: 1.1365 },
        { name: '1 m³ 60 °C-os levegő ≈ 1,06 kg', ok: Math.abs(m3at(60) - 1.056) < .005, got: m3at(60).toFixed(3), want: 1.056 },
        { name: 'az oxigén ≈ a levegő ötöde', ok: Math.abs(num('oxigén aránya') / 100 - .2) < .015, got: num('oxigén aránya'), want: 20 },
        { name: 'az összetétel összege ≈ 100 %', ok: Math.abs(num('nitrogén aránya') + num('oxigén aránya') + num('argon aránya') + num('szén-dioxid aránya') - 100) < .05, got: (num('nitrogén aránya') + num('oxigén aránya') + num('argon aránya') + num('szén-dioxid aránya')).toFixed(4), want: 100 },
        { name: 'a pohárba 20 cm-en ≈ 1,9 mm víz jut', ok: Math.abs(waterIn(.2) * 1000 - 1.88) < .05, got: (waterIn(.2) * 1000).toFixed(3), want: 1.88 },
        { name: 'a víz nehezebb az olajnál', ok: num('víz sűrűsége') / 1000 > num('olaj sűrűsége'), got: num('olaj sűrűsége'), want: '< 1' },
        { name: 'füst a fejnél: állva hamarabb, mint lehajolva', ok: tReach7(num('fej magassága állva')) < tReach7(num('fej magassága lehajolva')), got: tReach7(num('fej magassága állva')).toFixed(1) + ' / ' + tReach7(num('fej magassága lehajolva')).toFixed(1), want: 'állva < lehajolva' },
        { name: 'a gőz térfogataránya ≈ 1700 (1 g víz, 100 °C, 1013 hPa, ideális gáz)', ok: Math.abs(1 / 18.015 * 8.314 * 373.15 / (num('légnyomás') * 100) * 1e6 - num('gőz térfogataránya')) < 60, got: (1 / 18.015 * 8.314 * 373.15 / (num('légnyomás') * 100) * 1e6).toFixed(0), want: num('gőz térfogataránya') },
      ];
    };
  },
  draw(L) {
    c = L.ctx; background();
    for (let i = 0; i < SCENES.length; i++) {
      const w = clamp(1 - Math.abs(L.sp - i) * 2); if (w <= .001) continue;
      const st = i === L.step ? L.st : SETTLE[i];
      GA = 1; SCENES[i](st, w); c.globalAlpha = 1; GA = 1;
    }
  },
});
/* QA-állapotok (1-alapú lépésszám) */
const guessQA = (P, k) => (L2) => { P.guess = k; P.gt = L2.st - 30; tipHide(P); panelVeil(false);
  if (P === P2) show2();
  if (P === P7) { S7.log = [{ t: -9, v: 120, pose: 0, door: 0 }]; show7(); if (S7.sld) S7.sld.set(120); } };
const set7 = (o) => (L2) => { guessQA(P7, 'lent tipp')(L2); S7.touched = true; S7.log = [Object.assign({ t: -9, v: 120, pose: 0, door: 0 }, o)]; S7.sld.set(S7.log[0].v); };
window.__qaStates = {
  1: [{ name: 'mély', set: (L2) => { S1.log = [{ t: -9, d: 20 }]; S1.sld.set(20); } },
    { name: 'billentve', set: (L2) => { S1.tilt = L2.st - 5; } },
    { name: 'billentés-közben', st: 2.6, set: (L2) => { S1.tilt = L2.st - 1.2; } }],
  2: [{ name: 'tipp-jó', set: guessQA(P2, 'kétszáz tipp') }, { name: 'tipp-rossz', set: guessQA(P2, 'kettő tipp') },
    { name: 'nagy-terem', set: (L2) => { guessQA(P2, 'húsz tipp')(L2); S2.log = [{ t: -9, Lx: 15, Wy: 12, Hz: 5 }]; S2.sl[0].set(15); S2.sl[1].set(12); S2.sl[2].set(5); } },
    { name: 'kicsi-terem', set: (L2) => { guessQA(P2, 'kétszáz tipp')(L2); S2.log = [{ t: -9, Lx: 4, Wy: 4, Hz: 2.5 }]; S2.sl[0].set(4); S2.sl[1].set(4); S2.sl[2].set(2.5); } }],
  3: [{ name: '60-fok', set: (L2) => { S3.sld.set(60, { fire: true }); S3.log.forEach((e) => { e.t = Math.min(e.t, L2.st - 4); }); S3.sim.reset(); } },
    { name: '40-fok', set: (L2) => { S3.sld.set(40, { fire: true }); S3.log.forEach((e) => { e.t = Math.min(e.t, L2.st - 4); }); S3.sim.reset(); } }],
  4: [{ name: 'fűtés-ki', set: (L2) => { S4.log = [{ t: -9, on: 1 }, { t: L2.st - 3, on: 0 }]; } }],
  5: [{ name: 'megoldás', set: (L2) => G5.solve(L2.st - 5) }],
  6: [{ name: 'víz-közben', set: (L2) => { S6.tA = L2.st - 2.7; S6.tB = 1e9; } },
    { name: 'csak-víz', set: (L2) => { S6.tA = L2.st - 5; S6.tB = 1e9; } }],
  7: [{ name: 'tipp-jó', set: guessQA(P7, 'lent tipp') }, { name: 'tipp-rossz', set: guessQA(P7, 'fent tipp') },
    { name: 'lehajolva-120', set: set7({ pose: 1 }) },
    { name: 'állva-60-ajtó-nyitva', set: set7({ v: 60, door: 1 }) },
    { name: 'lehajolva-180-ajtó-nyitva', set: set7({ v: 180, pose: 1, door: 1 }) },
    { name: 'kezdet-0', set: set7({ v: 0 }) }],
};

})();
