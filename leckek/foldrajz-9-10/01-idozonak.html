<script>
/* ── MODUL: Földgömb (TortGlobe) · v1.1 (2026-11-24) ──────────────────────────────────────
   Az A modul (TortMap) gömbbővítése (pilot/tortenelem-5-6/terv.md, 5. fejezet: „ortografikus gömb”).
   Referencia: 13-felfedezesek. Lecke-független: változtatás nélkül átemelhető (pl. shared/tort/globe.js).
   Függ: TortProj (shared/tort/proj.js: ortho, gc, dist, unpack), TortMap (a feliratok ütközésmentes
   elhelyezéséhez és a bélyeghez), a lecke-motor L objektuma (L.tx, L.pointer, L.stage, L.VW).
   Adat: shared/tort/map-vilag.js (window.TORT_MAP_VILAG, 1:110m).

   NÉZET  v = {lon, lat, r, x, y}: a (lon, lat) pont néz a néző felé (észak mindig fent), r = a gömb sugara px-ben,
          (x, y) = a korong középpontja a képernyőn.
     TortGlobe.lerp(a, b, u)        nézet a és b között: lon a rövidebb úton, lat és x, y lineárisan, r logaritmikusan
     const cam = TortGlobe.camera() cam.go(v, t, dur) átmenet a jelenlegi állásból · cam.at(t) → nézet (inOut) ·
                                    cam.snap(v) azonnal · cam.last (az utolsó kiadott nézet)
     const orb = TortGlobe.orbit({latMax: 75})   forgatás egérrel / ujjal (húzás a korongon):
                                    orb.update(L, v, on) minden képkockán (on: aktív-e a lépés; kurzort is állít) ·
                                    orb.apply(v) → az eltolt nézet · orb.reset() · orb.dlon, orb.dlat, orb.used
   KÉPKOCKÁNKÉNT (a sorrend: frame → globe → parallel / line / saját rajz → labels)
     const G = TortGlobe.create({data: window.TORT_MAP_VILAG, style?})
     G.frame(v) → V                 beállítja a nézetet (V: TortProj.view az ortho vetülettel; + V.r)
     G.pt(lon, lat) → [x, y, z]     képernyőpont (új tömb); z = koszinusz a nézőirány felé: z < 0 → hátoldal
     G.globe(ctx, o)                tenger-korong (árnyékolva), fokhálózat, szárazföld, tavak, partvonal, perem.
                                    o = {grid: 30 (fok; 0 = nincs), lakes: true, land: 1 (a szárazföld, a tavak és – ha
                                    nincs coast – a partvonal alfája), coast: alfa (alap: = land), sea: true, rim: true,
                                    style: {sea0, sea1, land, coast, coastW, lake, grid, rim}}
                                    sea: false → nincs papír-alap, tengerkorong és perem-árnyék (semmi nem takar): második
                                    rétegnek a saját rajz fölé, pl. partvonal + perem a lemezszínek fölött:
                                    G.globe(ctx, {sea: false, grid: 0, land: 0, coast: .55, lakes: false})
     G.clip(ctx)                    a korongra vág (ctx.save() után hívd; saját rajzhoz a gömb felszínén)
     G.parallel(ctx, lat, o) · G.meridian(ctx, lon, o)   szélességi / hosszúsági kör látható része: o = {color, w, dash}
     G.stroke(ctx, pts, o)          tetszőleges [[lon, lat], …] vonal látható része (a peremen pontosan elvágva)
     G.route(pts, maxDeg = 1.5)     útvonal sűrítése főkörívekkel (TortProj.gc): → R = [[lon, lat], …],
                                    R.cum (km minden pontnál), R.km (összesen), R.wk (km a bemenő töréspontoknál)
     G.at(R, km) → [lon, lat]       a sűrített útvonal pontja az elejétől km távolságra (a végeken levágva)
     G.line(ctx, R, o)              útvonal / animált nyíl a gömbön: o = {k0, k (km-tartomány; alap 0 … R.km), color,
                                    w, dash, head, halo, back (a hátoldali rész alfája, alap 0)} →
                                    {x, y, ang, z} a végpontnál (z < 0: a hátoldalon van, a hívó ne rajzoljon oda)
     G.labels(L, items, o)          TortMap.labels a gömbön: az elem lon/lat-ja képernyőpont lesz; a hátoldali elemek
                                    kimaradnak, a perem felé elhalványulnak (az alfát szorozza). items/o: mint TortMap-nél.
     G.hit(x, y) → bool             a képernyőpont a korongon van-e
   A szárazföld kitöltése pontos: a hátoldali pontok a korongon kívülre kerülnek (folytonos kiterjesztés), a gyűrű
   körüljárásából derül ki, ha a gyűrű a néző ellenpontját is körbezárja (pl. Afro-Eurázsia a Csendes-óceán felől),
   és akkor kifordítja; végül a korongra vág. A partvonal és az útvonalak a peremen interpolálva érnek véget.
   Teljesítmény: a teljes 1:110m világ (kb. 4800 pont) képkockánként kb. 1–2 ms.
   Változások: v1.1 (2026-11-24) – G.globe sea/coast/rim opció (eddig a második hívás átlátszó tengerrel is papír-alapot
   és perem-árnyékot festett a korábbi rétegekre → fehér fátyol). A régi hívások képe változatlan.
   ───────────────────────────────────────────────────────────────────────────────────────── */
const TortGlobe = (() => {
  'use strict';
  const TP = window.TortProj, D = Math.PI / 180, R_KM = 6371;
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const smooth = (t) => { t = clamp(t); return t * t * (3 - 2 * t); };
  const inOut = (t) => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
  const wrap = (d) => ((d % 360) + 540) % 360 - 180;
  const DEF = { sea0: 'rgba(70,150,215,.30)', sea1: 'rgba(70,150,215,.50)', land: '#f5eddd', coast: '#1b5a94', coastW: 1.6,
    lake: '#c6dbe8', grid: 'rgba(27,90,148,.22)', rim: '#1c2440', ink: '#1c2440', halo: 'rgba(250,246,238,.94)' };

  function lerp(a, b, u) {
    if (u <= 0) return a; if (u >= 1) return b;
    return { lon: a.lon + wrap(b.lon - a.lon) * u, lat: a.lat + (b.lat - a.lat) * u, x: a.x + (b.x - a.x) * u, y: a.y + (b.y - a.y) * u,
      r: Math.exp(Math.log(a.r) + (Math.log(b.r) - Math.log(a.r)) * u) };
  }
  function camera() {
    let from = null, to = null, t0 = 0, dur = 1;
    const cam = {
      last: null,
      go(v, t, d) { from = cam.last || v; to = v; t0 = t; dur = Math.max(1e-3, d || 0); },
      snap(v) { from = to = cam.last = v; },
      at(t) { if (!to) return null; cam.last = lerp(from, to, inOut((t - t0) / dur)); return cam.last; },
      get target() { return to; },
    };
    return cam;
  }
  function orbit(o = {}) {
    const latMax = o.latMax == null ? 75 : o.latMax;
    const orb = { dlon: 0, dlat: 0, used: false, drag: null, _pd: false };
    orb.reset = () => { orb.dlon = 0; orb.dlat = 0; orb.used = false; orb.drag = null; };
    orb.apply = (v) => Object.assign({}, v, { lon: wrap(v.lon + orb.dlon), lat: clamp(v.lat + orb.dlat, -latMax, latMax) });
    orb.update = (L, v, on) => {
      const p = L.pointer, press = p.down && !orb._pd; orb._pd = p.down;
      const inDisk = Math.hypot(p.x - v.x, p.y - v.y) <= v.r && p.x < L.VW;
      if (!on) { orb.drag = null; return; }
      if (press && inDisk) orb.drag = { x: p.x, y: p.y, dlon: orb.dlon, dlat: orb.dlat };
      if (orb.drag) {
        if (!p.down) orb.drag = null;
        else {
          orb.dlon = orb.drag.dlon - (p.x - orb.drag.x) / v.r / D;
          orb.dlat = clamp(orb.drag.dlat + (p.y - orb.drag.y) / v.r / D, -latMax - v.lat, latMax - v.lat);
          if (Math.abs(p.x - orb.drag.x) + Math.abs(p.y - orb.drag.y) > 3) orb.used = true;
        }
      }
      if (L.stage) L.stage.style.cursor = orb.drag ? 'grabbing' : (inDisk && p.inside ? 'grab' : '');
    };
    return orb;
  }

  function signedArea(a, n) {           // lapos [x, y, …] tömb, n pont; y felfelé pozitív
    let s = 0;
    for (let i = 0, j = n - 1; i < n; j = i++) s += a[2 * j] * a[2 * i + 1] - a[2 * i] * a[2 * j + 1];
    return s / 2;
  }

  function create(o) {
    const M = TP.unpack(o.data), st = Object.assign({}, DEF, o.style);
    const rings = M.land.map((r) => ({ r, n: r.length / 2, o1: Math.sign(signedArea(r, r.length / 2)) }));
    const lakes = (M.lakes || []).map((l) => l.p);
    let buf = new Float64Array(4096);
    const TM = typeof TortMap !== 'undefined' ? TortMap : window.TortMap;   // a TortMap modul (const a lecke szkriptjében)
    const labeler = TM ? TM.create({ proj: TP.ortho({ lon0: 0, lat0: 0 }), layers: [{ data: o.data }] }) : null;
    const G = { V: null, v: null, M };
    let sl0 = 0, cl0 = 1, sp0 = 0, cp0 = 1, X = 0, Y = 0, RR = 1;

    G.frame = (v) => {
      G.v = v; X = v.x; Y = v.y; RR = v.r;
      sl0 = Math.sin(v.lon * D); cl0 = Math.cos(v.lon * D); sp0 = Math.sin(v.lat * D); cp0 = Math.cos(v.lat * D);
      const V = TP.view(TP.ortho({ lon0: v.lon, lat0: v.lat }), { lon: v.lon, lat: v.lat, s: v.r, x: v.x, y: v.y });
      V.r = v.r; G.V = V; return V;
    };
    // egységgömb: x kelet, y észak, z a néző felé
    function u3(lon, lat, out) {
      const l = lon * D, p = lat * D, cp = Math.cos(p), sp = Math.sin(p);
      const sl = Math.sin(l), cl = Math.cos(l), sdl = sl * cl0 - cl * sl0, cdl = cl * cl0 + sl * sl0;
      out[0] = cp * sdl; out[1] = cp0 * sp - sp0 * cp * cdl; out[2] = sp0 * sp + cp0 * cp * cdl;
      return out;
    }
    const T3 = [0, 0, 0], T4 = [0, 0, 0];
    G.pt = (lon, lat) => { u3(lon, lat, T3); return [X + T3[0] * RR, Y - T3[1] * RR, T3[2]]; };
    G.hit = (x, y) => Math.hypot(x - X, y - Y) <= RR;
    G.clip = (ctx) => { ctx.beginPath(); ctx.arc(X, Y, RR, 0, Math.PI * 2); ctx.clip(); };

    /* kitöltéshez: a hátoldal folytonos kiterjesztése a korongon kívülre (ρ = 1/(1+z)) */
    function ext(p, i) {
      const x = p[0], y = p[1], z = p[2];
      if (z >= 0) { buf[2 * i] = x; buf[2 * i + 1] = y; return; }
      const h = Math.hypot(x, y), rho = Math.min(60, 1 / Math.max(1e-3, 1 + z));
      if (h < 1e-9) { buf[2 * i] = 0; buf[2 * i + 1] = rho; return; }
      buf[2 * i] = x / h * rho; buf[2 * i + 1] = y / h * rho;
    }
    function fillRings(ctx, list) {      // list: [{r, n, o1}] → egy útvonal (evenodd)
      let inv = 0;
      for (const g of list) {
        if (buf.length < g.n * 2) buf = new Float64Array(g.n * 2 + 64);
        let vis = false;
        for (let i = 0; i < g.n; i++) { u3(g.r[2 * i], g.r[2 * i + 1], T3); if (T3[2] > 0) vis = true; ext(T3, i); }
        if (!vis) continue;
        const o2 = Math.sign(signedArea(buf, g.n));
        ctx.moveTo(X + buf[0] * RR, Y - buf[1] * RR);
        for (let i = 1; i < g.n; i++) ctx.lineTo(X + buf[2 * i] * RR, Y - buf[2 * i + 1] * RR);
        ctx.closePath();
        if (g.o1 && o2 && g.o1 !== o2) inv++;   // a gyűrű körbezárja a néző ellenpontját → a külseje a szárazföld
      }
      if (inv % 2) { const B = RR * 70; ctx.rect(X - B, Y - B, 2 * B, 2 * B); }
    }
    /* vonal látható része, a peremen interpolálva; skip(i): az (i−1, i) él kihagyása */
    function strokePath(ctx, n, get, closed, skip) {
      let pen = false, px = 0, py = 0, pz = -1;
      const last = closed ? n : n - 1;
      for (let i = 0; i <= last; i++) {
        const q = get(i % n); u3(q[0], q[1], T3);
        const x = T3[0], y = T3[1], z = T3[2];
        if (i > 0 && skip && skip(i % n)) pen = false;
        else if (i > 0) {
          if (pz >= 0 && z >= 0) { if (!pen) { ctx.moveTo(X + px * RR, Y - py * RR); pen = true; } ctx.lineTo(X + x * RR, Y - y * RR); }
          else if (pz >= 0 || z >= 0) {   // átlépi a peremet: z = 0-nál vágjuk
            const t = pz / (pz - z), ix = px + (x - px) * t, iy = py + (y - py) * t, h = Math.hypot(ix, iy) || 1;
            if (pz >= 0) { if (!pen) ctx.moveTo(X + px * RR, Y - py * RR); ctx.lineTo(X + ix / h * RR, Y - iy / h * RR); pen = false; }
            else { ctx.moveTo(X + ix / h * RR, Y - iy / h * RR); ctx.lineTo(X + x * RR, Y - y * RR); pen = true; }
          } else pen = false;
        }
        px = x; py = y; pz = z;
      }
    }
    G.stroke = (ctx, pts, o2 = {}) => {
      ctx.beginPath(); strokePath(ctx, pts.length, (i) => pts[i], !!o2.closed);
      ctx.setLineDash(o2.dash || []); ctx.strokeStyle = o2.color || st.ink; ctx.lineWidth = o2.w || 2; ctx.stroke(); ctx.setLineDash([]);
    };

function inRings(rings, lon, lat) {
  let n = 0;

    for (let i = 0, j = a.length - 2; i < a.length; j = i, i += 2) {

    }
    if (ins) n++;
  }
  return n % 2 === 1;
}

  return null;
}

    OFF = { cet: L.dat('közép-európai idő').min, cest: L.dat('nyári időszámítás').min, tokyo: L.dat('Tokió zónaideje').min };
    const city = (lab, utcK) => { const d = L.dat(lab + ' helye'); return { lab, pos: lab + ' helye', lon: d.lon, lat: d.lat, utcK, m: utcK ? L.dat(utcK).min : null }; };
    CT = { Budapest: city('Budapest', 'közép-európai idő'), Debrecen: city('Debrecen'), Szombathely: city('Szombathely'), Greenwich: city('Greenwich'),
      'Tokió': city('Tokió', 'Tokió zónaideje'), 'New York': city('New York', 'New York zónaideje'), Sydney: city('Sydney'),
      Peking: city('Peking', 'Peking zónaideje'), 'Újdelhi': city('Újdelhi', 'Újdelhi zónaideje'), Katmandu: city('Katmandu', 'Katmandu zónaideje'),
      Kasgar: city('Kasgar', 'Peking zónaideje'), Kiritimati: city('Kiritimati', 'Kiritimati zónaideje'), Honolulu: city('Honolulu', 'Honolulu zónaideje') };
    DAYN = L.lab('dátumnevek').split(';').map((s) => s.trim());
    buildHU();
    R7 = G.route([[CT.Budapest.lon, CT.Budapest.lat], [CT['Tokió'].lon, CT['Tokió'].lat]]);
    s1.cam = TortGlobe.camera(); s1.orb = TortGlobe.orbit({ latMax: 80 }); s5.orb = TortGlobe.orbit({ latMax: 70 });
    stepDefs[0].enter(); s5.utc = 660;

    L.checks = () => {
      const out = [];
      const deg = N('teljes kör') / N('egy fordulat a Naphoz képest');
      out.push({ name: '360° / 24 óra = 15°/óra, 1° = 4 perc', ok: Math.abs(deg - 15) < 1e-9 && Math.abs(60 / deg - 4) < 1e-9, got: deg, want: 15 });
      out.push({ name: 'a CET zónadélköre 15° K', ok: Math.abs(Z15() - 15) < 1e-9, got: Z15(), want: 15 });
      const nb = noonCET(CT.Budapest.lon);
      out.push({ name: 'Budapest delel CET 11:43:50-kor (±1 s)', ok: Math.abs(nb - (11 * 60 + 43 + 50 / 60)) < 1 / 60, got: nb, want: 703.83 });
      const bad = [];
      for (const [n, p] of Object.entries(CT)) if (p.m != null) { const z = zoneAt(p.lon, p.lat); if (z !== p.m) bad.push(n + ': ' + z + ' ≠ ' + p.m); }
      out.push({ name: 'a .md zónaideje = az adatfájl zónája a város helyén', ok: bad.length === 0, got: bad, want: [] });
      const bad2 = [];
      for (const [n, p] of Object.entries(CT)) if (p.m != null && zoneM(p.lon, p.lat) !== p.m) bad2.push(n + ': ' + zoneM(p.lon, p.lat));
      out.push({ name: 'a raszteres zónatérkép is ezt adja a városoknál', ok: bad2.length === 0, got: bad2, want: [] });
      const vv = { lon: 85, lat: 22, r: 385, x: 470, y: 525 }, rt = [];
      for (const [px, py] of [[300, 400], [600, 700], [470, 525], [700, 300]]) { const ll = inv(vv, px, py); G.frame(vv); const q = G.pt(ll[0], ll[1]); if (Math.hypot(q[0] - px, q[1] - py) > .5) rt.push([px, py, q[0], q[1]]); }
      out.push({ name: 'képpont → lon/lat → képpont (a raszter vetülete = a TortGlobe vetülete)', ok: rt.length === 0, got: rt, want: [] });
      const gm = N('fénysebesség') * 1000 * N('órahiba') * 1e-6;
      out.push({ name: '1 µs · c ≈ az .md „órahiba távolságban” értéke', ok: Math.abs(gm - N('órahiba távolságban')) < 1, got: gm, want: N('órahiba távolságban') });
      const tt = N('GPS-műholdak magassága') / N('fénysebesség');
      out.push({ name: 'GPS: a jel futásideje 0,06–0,08 s', ok: tt > .06 && tt < .08, got: tt, want: .067 });
      const dep = N('kezdő indulás') * 60, arr = dep - OFF.cet + N('repülési idő') * 60 + OFF.tokyo;
      out.push({ name: 'repülés: 14:00 CET + 11:30 → Tokió 9:30 másnap', ok: hm(arr) === '9:30' && dayOf(arr) === 1, got: hm(arr) + ' +' + dayOf(arr), want: '9:30 +1' });
      const dk = dayOf(1080 + CT.Kiritimati.m), dh = dayOf(1080 + CT.Honolulu.m);
      out.push({ name: 'UTC 18:00: Kiritimati másnap 8:00, Honolulu „ma” 8:00', ok: dk === 1 && dh === 0 && hm(1080 + CT.Kiritimati.m) === '8:00' && hm(1080 + CT.Honolulu.m) === '8:00', got: [dk, dh], want: [1, 0] });
      out.push({ name: 'Budapest–Tokió főköre 8900–9200 km', ok: R7.km > 8900 && R7.km < 9200, got: R7.km, want: '≈ 9050' });
      const kN = 720 - CT.Kasgar.lon * 4 + CT.Kasgar.m;
      out.push({ name: 'Kasgar: középdél pekingi időben ≈ 14:56', ok: Math.abs(kN - 896) < 1, got: kN, want: 896 });
      return out;
    };
    window.__qaStates = {
      1: [{ name: 'tokio', set(L) { s1.orb.reset(); s1.city = 'Tokió'; s1.cam.snap(view1('Tokió')); s1.tArc = -5; } },
          { name: 'sydney', set(L) { s1.orb.reset(); s1.city = 'Sydney'; s1.cam.snap(view1('Sydney')); s1.tArc = -5; } },
          { name: 'newyork', set(L) { s1.orb.reset(); s1.city = 'New York'; s1.cam.snap(view1('New York')); s1.tArc = -5; } }],
      2: [{ name: 'utc0', set(L) { L.sliders[0].set(0); s2.from = s2.to = 0; } }, { name: 'utc18', set(L) { L.sliders[0].set(1080); s2.from = s2.to = 1080; } }],
      3: [{ name: 'korai', set(L) { s3.from = s3.to = 680; } }, { name: 'nyari', set(L) { s3.from = s3.to = 725; s3.summer = true; } }],
      4: [{ name: 'zona', set(L) { s4.from = s4.to = 1; } }],
      5: [{ name: 'nepal', set(L) { s5.sel = CT.Katmandu.m; } }, { name: 'kina', set(L) { s5.sel = CT.Peking.m; L.sliders[0].set(0, { fire: true }); } },
          { name: 'hatoldal', set(L) { s5.orb.dlon = 180; s5.sel = OFF.cet; } }, { name: 'amerika', set(L) { s5.orb.dlon = -170; s5.orb.dlat = 15; s5.sel = CT['New York'].m; L.sliders[0].set(1435, { fire: true }); } }],
      6: [{ name: 'utc0', set(L) { L.sliders[0].set(0, { fire: true }); } }, { name: 'utc12', set(L) { L.sliders[0].set(720, { fire: true }); } }, { name: 'utc2355', set(L) { L.sliders[0].set(1435, { fire: true }); } }],
      7: [{ name: 'ejfel-nyar', set(L) { L.sliders[0].set(0, { fire: true }); s7.summer = true; } }, { name: 'este', set(L) { L.sliders[0].set(1410, { fire: true }); } }, { name: 'repul', set(L) { s7.t0 = L.st - FLY * .45; } }],
      8: [{ name: 'minusz', set(L) { L.sliders[0].set(-1, { fire: true }); s8.from = s8.to = -1; } }, { name: 'nulla', set(L) { s8.from = s8.to = 0; } }],
    };
  },
  draw(Lx) {
    L = Lx; c = L.ctx; GA = 1; background();
    if (L.step >= 0) sT[L.step] = L.st;
    for (let i = 0; i < SCENES.length; i++) {
      const w = clamp(1 - Math.abs(L.sp - i) * 2); if (w <= .005) continue;
      GA = w; c.save(); c.globalAlpha = w; SCENES[i](sT[i], L.step === i); c.restore();
    }
    c.globalAlpha = 1;
  },
});
})();
</script>
