<script>
/* ── MODUL: Földgömb (TortGlobe) ──────────────────────────────────────────────────────────
   Az A modul (TortMap) gömbbővítése (pilot/tortenelem-5-6/terv.md, 5. fejezet: „ortografikus gömb”).
   Referencia: 13-felfedezesek. Lecke-független: változtatás nélkül átemelhető (pl. shared/tort/globe.js).
   Függ: TortProj (shared/tort/proj.js: ortho, gc, dist, unpack), TortMap (a feliratok ütközésmentes
   elhelyezéséhez és a bélyeghez), a lecke-motor L objektuma (L.tx, L.pointer, L.stage, L.VW).
   Adat: shared/tort/map-vilag.js (window.TORT_MAP_VILAG, 1:110m).

   NÉZET  v = {lon, lat, r, x, y}: a (lon, lat) pont néz a néző felé (észak mindig fent), r = a gömb sugara px-ben,
          (x, y) = a korong középpontja a képernyőn.
     TortGlobe.lerp(a, b, u)        nézet a és b között: lon a rövidebb úton, lat és x, y lineárisan, r logaritmikusan
     const cam = TortGlobe.camera() cam.go(v, t, dur) átmenet a jelenlegi állásból · cam.at(t) → nézet (inOut) ·
                                    cam.snap(v) azonnal · cam.last (az utolsó kiadott nézet)
     const orb = TortGlobe.orbit({latMax: 75})   forgatás egérrel / ujjal (húzás a korongon):
                                    orb.update(L, v, on) minden képkockán (on: aktív-e a lépés; kurzort is állít) ·
                                    orb.apply(v) → az eltolt nézet · orb.reset() · orb.dlon, orb.dlat, orb.used
   KÉPKOCKÁNKÉNT (a sorrend: frame → globe → parallel / line / saját rajz → labels)
     const G = TortGlobe.create({data: window.TORT_MAP_VILAG, style?})
     G.frame(v) → V                 beállítja a nézetet (V: TortProj.view az ortho vetülettel; + V.r)
     G.pt(lon, lat) → [x, y, z]     képernyőpont (új tömb); z = koszinusz a nézőirány felé: z < 0 → hátoldal
     G.globe(ctx, o)                tenger-korong (árnyékolva), fokhálózat, szárazföld, tavak, partvonal, perem.
                                    o = {grid: 30 (fok; 0 = nincs), lakes: true, land: 1 (alfa), style: {sea0, sea1, land,
                                    coast, coastW, lake, grid, rim}}
     G.clip(ctx)                    a korongra vág (ctx.save() után hívd; saját rajzhoz a gömb felszínén)
     G.parallel(ctx, lat, o) · G.meridian(ctx, lon, o)   szélességi / hosszúsági kör látható része: o = {color, w, dash}
     G.stroke(ctx, pts, o)          tetszőleges [[lon, lat], …] vonal látható része (a peremen pontosan elvágva)
     G.route(pts, maxDeg = 1.5)     útvonal sűrítése főkörívekkel (TortProj.gc): → R = [[lon, lat], …],
                                    R.cum (km minden pontnál), R.km (összesen), R.wk (km a bemenő töréspontoknál)
     G.at(R, km) → [lon, lat]       a sűrített útvonal pontja az elejétől km távolságra (a végeken levágva)
     G.line(ctx, R, o)              útvonal / animált nyíl a gömbön: o = {k0, k (km-tartomány; alap 0 … R.km), color,
                                    w, dash, head, halo, back (a hátoldali rész alfája, alap 0)} →
                                    {x, y, ang, z} a végpontnál (z < 0: a hátoldalon van, a hívó ne rajzoljon oda)
     G.labels(L, items, o)          TortMap.labels a gömbön: az elem lon/lat-ja képernyőpont lesz; a hátoldali elemek
                                    kimaradnak, a perem felé elhalványulnak (az alfát szorozza). items/o: mint TortMap-nél.
     G.hit(x, y) → bool             a képernyőpont a korongon van-e
   A szárazföld kitöltése pontos: a hátoldali pontok a korongon kívülre kerülnek (folytonos kiterjesztés), a gyűrű
   körüljárásából derül ki, ha a gyűrű a néző ellenpontját is körbezárja (pl. Afro-Eurázsia a Csendes-óceán felől),
   és akkor kifordítja; végül a korongra vág. A partvonal és az útvonalak a peremen interpolálva érnek véget.
   Teljesítmény: a teljes 1:110m világ (kb. 4800 pont) képkockánként kb. 1–2 ms.
   ───────────────────────────────────────────────────────────────────────────────────────── */
const TortGlobe = (() => {
  'use strict';
  const TP = window.TortProj, D = Math.PI / 180, R_KM = 6371;
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const smooth = (t) => { t = clamp(t); return t * t * (3 - 2 * t); };
  const inOut = (t) => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
  const wrap = (d) => ((d % 360) + 540) % 360 - 180;
  const DEF = { sea0: 'rgba(70,150,215,.30)', sea1: 'rgba(70,150,215,.50)', land: '#f5eddd', coast: '#1b5a94', coastW: 1.6,
    lake: '#c6dbe8', grid: 'rgba(27,90,148,.22)', rim: '#1c2440', ink: '#1c2440', halo: 'rgba(250,246,238,.94)' };

  function lerp(a, b, u) {
    if (u <= 0) return a; if (u >= 1) return b;
    return { lon: a.lon + wrap(b.lon - a.lon) * u, lat: a.lat + (b.lat - a.lat) * u, x: a.x + (b.x - a.x) * u, y: a.y + (b.y - a.y) * u,
      r: Math.exp(Math.log(a.r) + (Math.log(b.r) - Math.log(a.r)) * u) };
  }
  function camera() {
    let from = null, to = null, t0 = 0, dur = 1;
    const cam = {
      last: null,
      go(v, t, d) { from = cam.last || v; to = v; t0 = t; dur = Math.max(1e-3, d || 0); },
      snap(v) { from = to = cam.last = v; },
      at(t) { if (!to) return null; cam.last = lerp(from, to, inOut((t - t0) / dur)); return cam.last; },
      get target() { return to; },
    };
    return cam;
  }
  function orbit(o = {}) {
    const latMax = o.latMax == null ? 75 : o.latMax;
    const orb = { dlon: 0, dlat: 0, used: false, drag: null, _pd: false };
    orb.reset = () => { orb.dlon = 0; orb.dlat = 0; orb.used = false; orb.drag = null; };
    orb.apply = (v) => Object.assign({}, v, { lon: wrap(v.lon + orb.dlon), lat: clamp(v.lat + orb.dlat, -latMax, latMax) });
    orb.update = (L, v, on) => {
      const p = L.pointer, press = p.down && !orb._pd; orb._pd = p.down;
      const inDisk = Math.hypot(p.x - v.x, p.y - v.y) <= v.r && p.x < L.VW;
      if (!on) { orb.drag = null; return; }
      if (press && inDisk) orb.drag = { x: p.x, y: p.y, dlon: orb.dlon, dlat: orb.dlat };
      if (orb.drag) {
        if (!p.down) orb.drag = null;
        else {
          orb.dlon = orb.drag.dlon - (p.x - orb.drag.x) / v.r / D;
          orb.dlat = clamp(orb.drag.dlat + (p.y - orb.drag.y) / v.r / D, -latMax - v.lat, latMax - v.lat);
          if (Math.abs(p.x - orb.drag.x) + Math.abs(p.y - orb.drag.y) > 3) orb.used = true;
        }
      }
      if (L.stage) L.stage.style.cursor = orb.drag ? 'grabbing' : (inDisk && p.inside ? 'grab' : '');
    };
    return orb;
  }

  function signedArea(a, n) {           // lapos [x, y, …] tömb, n pont; y felfelé pozitív
    let s = 0;
    for (let i = 0, j = n - 1; i < n; j = i++) s += a[2 * j] * a[2 * i + 1] - a[2 * i] * a[2 * j + 1];
    return s / 2;
  }

  function create(o) {
    const M = TP.unpack(o.data), st = Object.assign({}, DEF, o.style);
    const rings = M.land.map((r) => ({ r, n: r.length / 2, o1: Math.sign(signedArea(r, r.length / 2)) }));
    const lakes = (M.lakes || []).map((l) => l.p);
    let buf = new Float64Array(4096);
    const TM = typeof TortMap !== 'undefined' ? TortMap : window.TortMap;   // a TortMap modul (const a lecke szkriptjében)
    const labeler = TM ? TM.create({ proj: TP.ortho({ lon0: 0, lat0: 0 }), layers: [{ data: o.data }] }) : null;
    const G = { V: null, v: null, M };
    let sl0 = 0, cl0 = 1, sp0 = 0, cp0 = 1, X = 0, Y = 0, RR = 1;

    G.frame = (v) => {
      G.v = v; X = v.x; Y = v.y; RR = v.r;
      sl0 = Math.sin(v.lon * D); cl0 = Math.cos(v.lon * D); sp0 = Math.sin(v.lat * D); cp0 = Math.cos(v.lat * D);
      const V = TP.view(TP.ortho({ lon0: v.lon, lat0: v.lat }), { lon: v.lon, lat: v.lat, s: v.r, x: v.x, y: v.y });
      V.r = v.r; G.V = V; return V;
    };
    // egységgömb: x kelet, y észak, z a néző felé
    function u3(lon, lat, out) {
      const l = lon * D, p = lat * D, cp = Math.cos(p), sp = Math.sin(p);
      const sl = Math.sin(l), cl = Math.cos(l), sdl = sl * cl0 - cl * sl0, cdl = cl * cl0 + sl * sl0;
      out[0] = cp * sdl; out[1] = cp0 * sp - sp0 * cp * cdl; out[2] = sp0 * sp + cp0 * cp * cdl;
      return out;
    }
    const T3 = [0, 0, 0], T4 = [0, 0, 0];
    G.pt = (lon, lat) => { u3(lon, lat, T3); return [X + T3[0] * RR, Y - T3[1] * RR, T3[2]]; };
    G.hit = (x, y) => Math.hypot(x - X, y - Y) <= RR;
    G.clip = (ctx) => { ctx.beginPath(); ctx.arc(X, Y, RR, 0, Math.PI * 2); ctx.clip(); };

    /* kitöltéshez: a hátoldal folytonos kiterjesztése a korongon kívülre (ρ = 1/(1+z)) */
    function ext(p, i) {
      const x = p[0], y = p[1], z = p[2];
      if (z >= 0) { buf[2 * i] = x; buf[2 * i + 1] = y; return; }
      const h = Math.hypot(x, y), rho = Math.min(60, 1 / Math.max(1e-3, 1 + z));
      if (h < 1e-9) { buf[2 * i] = 0; buf[2 * i + 1] = rho; return; }
      buf[2 * i] = x / h * rho; buf[2 * i + 1] = y / h * rho;
    }
    function fillRings(ctx, list) {      // list: [{r, n, o1}] → egy útvonal (evenodd)
      let inv = 0;
      for (const g of list) {
        if (buf.length < g.n * 2) buf = new Float64Array(g.n * 2 + 64);
        let vis = false;

  /* hullám (Green-törvény, a hely mélységével) */
  const tReal = Math.max(0, (st - 1.2)) * TW.Tw / 7.5;
  const xw = posAt(TW.west, tReal), xe = posAt(TW.east, tReal);
  const grow = smooth((st - .3) / .9), cs = Math.sqrt(g * TW.depthAt(TW.xs));
  const pxM = 9;
  const eta = (x) => {
    let v = 0;
    for (const xx of (tReal > 0 ? [xw, xe] : [TW.xs])) {
      const h = TW.depthAt(xx), sg = 22 * Math.sqrt(g * h) / cs + 3, H = Hof(h) * (tReal > 0 ? 1 : grow);
      v += H * Math.exp(-(((x - xx) / sg) ** 2));
    }
    return v;
  };
  c.beginPath(); const v = S8.view;
  for (let x = v.x0; x <= v.x1; x += .8) { const s = Math.min(0, -PJ.at(x)); void s; if (PJ.at(x) > 0) continue; c.lineTo(S8.X(x), S8.Y(0) - eta(x) * pxM); }
  c.lineTo(S8.X(X_COAST), S8.Y(0)); c.lineTo(S8.X(v.x1), S8.Y(0));
  c.strokeStyle = WATER; c.lineWidth = 3; c.stroke();
  c.beginPath(); c.moveTo(S8.X(X_COAST), S8.Y(0));
  for (let x = X_COAST; x <= v.x1; x += .8) c.lineTo(S8.X(x), S8.Y(0) - eta(x) * pxM);
  c.lineTo(S8.X(v.x1), S8.Y(0)); c.closePath(); c.fillStyle = 'rgba(70,150,215,.55)'; c.fill();
  /* a teljes vízoszlop mozog */
  if (tReal > 0 && TW.depthAt(xw) > 400) {
    const h = TW.depthAt(xw), H = Hof(h);
    for (const f of [.2, .5, .8]) { const z = -h / 1000 * f, X = S8.X(xw), Y = S8.Y(z); S8.arrow(X + 14, Y, X - 14 - H * 18, Y, { px: true, color: WATER, w: 3, head: 12 }); }
  }
  /* a rengés: emelkedő tengerfenék */
  if (st < 2.2) { const ua = smooth(st / .3) * (1 - smooth((st - 1.6) / .6)); S8.arrow(TW.xs, -TW.depthAt(TW.xs) / 1000 - .9, TW.xs, -TW.depthAt(TW.xs) / 1000 + .2, { color: RED, w: 5, a: ua }); }
  /* csúszka-jelölő */
  const hs = s8.h; let xm = X_COAST;
  for (let x = X_TR; x > X_COAST; x -= .5) if (-PJ.at(x) * 1000 <= hs) { xm = x; break; }
  c.strokeStyle = RED; c.lineWidth = 2.5; c.setLineDash([7, 5]); c.beginPath(); c.moveTo(S8.X(xm), S8.Y(.3)); c.lineTo(S8.X(xm), S8.Y(PJ.at(xm))); c.stroke(); c.setLineDash([]);
  c.beginPath(); c.arc(S8.X(xm), S8.Y(PJ.at(xm)), 7, 0, TAU); c.fillStyle = RED; c.fill();
  c.restore();
  al(a); c.strokeStyle = INK; c.lineWidth = 2.5; c.strokeRect(R[0], R[1], R[2], R[3]);
  S8.axisZ({ step: 2, depth: true, unit: 'm', title: { s: L.lab('mélység km').replace('km', 'm'), k: 'mélység km' }, to: 0 });
  txf('itt', [U.fmt(hs)], S8.X(xm), R[1] - 18, Object.assign({}, B22, { a: xm < X_COAST + 60 ? 'left' : 'center', c: RED, k: ['itt', 'kiinduló mélység'] }));
  tx('part', S8.X(X_COAST) + 6, R[1] + R[3] + 34, Object.assign({}, B22, { c: MUT }));
  pillk(L.lab('Japán-árok'), 'Japán-árok', S8.X(X_TR), S8.Y(PJ.at(X_TR)) - 34, { a: 'center', s: 22 });
  if (tReal > 0 && TW.depthAt(xw) > 400) { const h = TW.depthAt(xw); al(a * smooth(tReal / 200)); const px = S8.X(1420), py = S8.Y(-3.2); pillk(L.lab('vízoszlop'), 'vízoszlop', px, py, { a: 'center', s: 22, c: WATER, bd: WATER }); leader(px, py - 20, S8.X(xw) + 4, S8.Y(-h / 1000 * .5)); }
  al(a);
  if (tReal > 0) txf('eltelt', [U.fmt(Math.min(tReal, TW.Tw) / 60)], R[0] + R[2], 280, Object.assign({}, B26, { a: 'right', c: MUT }));
  S8.vexStamp(R[0] + 4, R[1] + R[3] + 80, TRZ());
  SRC.stamp('hullám nem méretarányos', R[0] + 340, R[1] + R[3] + 80);
  stamp('modell', R[0] + 740, R[1] + R[3] + 80);
  /* kijelzők (a csúszka értékéből) */
  const cv = Math.sqrt(g * hs), kmh = cv * 3.6;
  c.beginPath(); c.roundRect(R[0], 100, 760, 190, 12); c.fillStyle = U.rgba(CARD, .95); c.fill(); c.strokeStyle = U.rgba(INK, .18); c.lineWidth = 2; c.stroke();
  tx('képlet', R[0] + 24, 152, { f: F.D, s: 36, w: 600, i: true });
  txf('sebesség', [U.fmt(cv, cv < 20 ? 1 : 0), U.fmt(kmh)], R[0] + 24, 206, Object.assign({}, M26, { c: RED, k: ['sebesség', 'nehézségi gyorsulás'] }));
  tx(kmh > 500 ? 'repülő' : kmh > 60 ? 'autó' : 'futó', R[0] + 330, 152, Object.assign({}, B24, { c: MUT, max: 410 }));
  txf('hullámmagasság', [U.fmt(Hof(hs), 1)], R[0] + 24, 258, Object.assign({}, M26, { c: WATER, k: ['hullámmagasság', 'kiinduló hullámmagasság', 'kiinduló mélység'] }));
  sourceLine('forrás szelvény', a);
}

/* ── 9. lépés: összefoglalás ── */
function scene9(st) {
  const cards = [1, 2, 3, 4, 5, 6];

  const a3 = smooth((st - 1.6) / .5); al(a3);
  SRC.frame(50, 730, 600, 290, null, { shadow: false });
  tx('teendő cím', 74, 780, { f: F.D, s: 32, w: 600 });
  for (let i = 1; i <= 4; i++) { c.fillStyle = i === 4 ? WATER : RED; c.beginPath(); c.arc(84, 822 + (i - 1) * 46, 7, 0, TAU); c.fill(); tx('teendő ' + i, 104, 830 + (i - 1) * 46, Object.assign({}, B26, { c: i === 4 ? WATER : INK })); }
  SRC.frame(690, 730, 640, 290, null, { shadow: false });
  tx('Magyarország cím', 714, 780, { f: F.D, s: 32, w: 600 });
  const dh = L.dat('Dunaharaszti-rengés');
  L.tx(fill('Magyarország sor', dh.s, U.fmt(N('Dunaharaszti magnitúdója'), 1)), 714, 832, Object.assign({}, B26, { k: ['Magyarország sor', 'Dunaharaszti-rengés', 'Dunaharaszti magnitúdója'], max: 590 }));
  SRC.wrap(fill('Csomád sor', L.val('Csomád utolsó kitörése')), 590, B24).forEach((ln, j) => L.tx(ln, 714, 890 + j * 32, Object.assign({}, B24, { c: MUT, k: ['Csomád sor', 'Csomád utolsó kitörése'] })));
}
function icon(n, x, y) {
  c.save(); c.translate(x, y); c.lineWidth = 2.5; c.strokeStyle = INK;
  if (n === 1) { c.beginPath(); c.arc(50, 10, 44, 0, TAU); c.fillStyle = 'rgba(70,150,215,.35)'; c.fill(); c.stroke(); for (let i = 0; i < 14; i++) { const a = i / 14 * TAU; c.beginPath(); c.arc(50 + Math.cos(a) * 32, 10 + Math.sin(a) * 32, 4, 0, TAU); c.fillStyle = DC[i % 3 ? 0 : 1]; c.fill(); } }
  else if (n === 2) { c.strokeStyle = RED; c.lineWidth = 3.5; c.beginPath(); c.moveTo(0, 40); for (let k = 0; k < 3; k++) { c.lineTo(30 * k + 30, 0); c.lineTo(30 * k + 30, 40); } c.stroke(); }
  else if (n === 3) { cube(0, 50, 60, RED, c.globalAlpha / GA); cube(80, 50, 19, TEAL, c.globalAlpha / GA); }
  else if (n === 4) { c.beginPath(); c.moveTo(0, 50); c.lineTo(45, -10); c.lineTo(55, -10); c.lineTo(100, 50); c.closePath(); c.fillStyle = '#cdc8c1'; c.fill(); c.stroke(); c.beginPath(); c.arc(50, -26, 14, 0, TAU); c.arc(38, -40, 10, 0, TAU); c.fillStyle = '#d3cdc3'; c.fill(); }
  else if (n === 5) { c.strokeStyle = WATER; c.lineWidth = 3.5; c.beginPath(); for (let i = 0; i <= 100; i += 4) c.lineTo(i, 30 - 30 * Math.exp(-(((i - 70) / 14) ** 2))); c.stroke(); }
  else { c.setLineDash([6, 5]); for (const [px, py, r] of [[30, 10, 30], [84, 4, 26], [62, 44, 18]]) { c.beginPath(); c.arc(px, py, r, 0, TAU); c.stroke(); } c.setLineDash([]); star(50, 20, 9, RED); }
  c.restore();
}

/* ══════════ VEZÉRLŐK, LÉPÉSEK ══════════ */
const SCENES = [scene1, scene2, scene3, scene4, scene5, scene6, scene7, scene8, scene9];
const sT = SCENES.map(() => 0);
const SETTLE = [7.4, 6, 10.6, 2.4, 12, 3.2, 4, 9, 2.4];
const stepDefs = [

  { enter() { s2.zoom = false; s2.zT = -10; s2.from = null; },

    controls(L) { L.slider({ label: L.lab('csúszka M'), k: 'csúszka M', min: 4, max: 9.5, step: .1, value: N('kezdő magnitúdó'), format: (v) => U.fmt(v, 1), onInput: (v) => { s4.M = v; } }); } },
  { enter() { s5.ep = 0; s5.t0 = 0; },
    controls(L) { L.button(L.lab('gomb új rengés'), () => { s5.ep = (s5.ep + 1) % EPI.length; s5.t0 = L.st; }, 'gomb új rengés'); } },

      L.slider({ label: L.lab('csúszka mélység'), k: 'csúszka mélység', min: 0, max: 1, step: .005, value: 0, format: (u) => U.fmt(Math.round(Math.exp(lerp(hi, lo, u)))) + ' m', onInput: (u) => { s8.h = Math.round(Math.exp(lerp(hi, lo, u))); } }); } },
  {},
];
const steps = stepDefs.map((d, i) => Object.assign({ settle: SETTLE[i] }, d));

L = Lesson.create({
  content: window.LESSON_CONTENT, home: false, steps,
  init(Lx) {
    L = Lx; c = L.ctx;
    loadData();
    G = TortGlobe.create({ data: window.TORT_MAP_VILAG });
    ORB1 = TortGlobe.orbit({ latMax: 70 }); ORB6 = TortGlobe.orbit({ latMax: 70 });
    SRC = TortSource.create(L, { 'becslés': K('becslés'), 'vázlatos': K('vázlatos'), 'illusztráció': K('illusztráció'), 'modell': K('modell'), 'hullám nem méretarányos': K('hullám nem méretarányos') });
    S2 = FoldSection.create(L, { rect: [130, 250, 1180, 480] });
    VIEW_FULL = S2.trueScale({ x0: 0, x1: PJ.x1, z0: -700, z1: 12 });
    VIEW_ZOOM = { x0: 1000, x1: 1480, z0: -62, z1: 3 };
    S2.set(VIEW_FULL);
    S6 = FoldSection.create(L, { rect: [700, 200, 640, 512], view: { x0: 900, x1: 1400, z0: -190, z1: 10 } });
    S8 = FoldSection.create(L, { rect: [150, 330, 1180, 470], view: { x0: X_COAST - 30, x1: 1560, z0: -8.6, z1: .8 } });
    buildTsunami();
    L.checks = () => {
      const out = [];

      out.push({ name: 'energia-szorzó = 10^kitevő', ok: Math.round(Math.pow(10, N('energia-kitevő'))) === N('energia-szorzó'), got: Math.pow(10, N('energia-kitevő')), want: N('energia-szorzó') });
      const vp = N('P-hullám sebessége'), vs = N('S-hullám sebessége'), kd = 1 / (1 / vs - 1 / vp);
      let err = 0; for (const E of EPI) for (const S of STA) { const d = Math.hypot(S[0] - E[0], S[1] - E[1]) / MAP.k; err = Math.max(err, Math.abs((d / vs - d / vp) * kd - d)); }
      out.push({ name: 'S–P körök a fészekben metszenek', ok: err < 1e-6, got: err, want: 0 });
