<script>
/* ── MODUL: Forráskártya (TortSource) ─────────────────────────────────────────────
   C modul (terv.md, 5. fejezet): a „Honnan tudjuk?” kártya és a három réteg egységes jelölése
   (leckek/SZERZODES.md, 11. pont). Referencia: 01-idoszamitas. Később: shared/tort/source.js.
   Függés: Lesson motor; az évszám-aritmetikához TortTimeline.Y (a B modul) – előbb azt töltsd be.

   const S = TortSource.create(L, T)   T (a .md-ből, mind {s, k}):
       {'forrás', 'rekonstrukció', 'monda', 'becslés', 'vázlatos'?, 'illusztráció'?}
   S.COL                      réteg → keretszín (forrás #0a6f86, rekonstrukció #1c2440, monda #8f5a0c)
   S.frame(x, y, w, h, layer, o)   keret a réteg szerint + a réteg neve a bal felső sarokban:
       'forrás' kékeszöld folytonos 2,5 px · 'rekonstrukció' tinta szaggatott 8/6 · 'monda' okker kartus
       (kitöltés rgba(201,150,60,.16), csigás sarkok) · null: semleges kártya. o = {tag: false, shadow: false}
   S.stamp(kind, x, y)        bélyeg (kind: 'becslés' | 'vázlatos' | 'illusztráció'): L.pill, −3°, (x, y) = bal közép
   S.stampSize(kind)          {w, h}
   S.icon(type, cx, cy, size, col)   forrástípus-ikon: 'írott' | 'krónika' | 'lelet' | 'monda' | 'kép'
   S.wrap(s, maxW, font)      sortörés L.measure-rel → sorok tömbje
   S.gap(ev, wr)              eltelt évek az esemény(tartomány) és a keletkezés között → {lo, hi, s: '528–531'}
   S.card(q) → {x, y, w, h}   „Honnan tudjuk?” kártya, a magassága a tartalomhoz igazodik:
       q = {x, y, w, a, layer, icon, type: {s, k}, title: {s, k},
            rows: [{l: {s, k}, v: {s, k}, c?}],                         // „Ki írta?”, „Mikor?” …
            line: {T,                                                   // mini időszalag (TortTimeline T)
                   ev: {a0, a1, name: {s, k}, sub?: {s, k}, layer, est, dateK},  // az esemény (csillagászati évek)
                   wr: {a, name?: {s, k}, dateK},                       // a forrás keletkezése
                   mark?: {a, name: {s, k}},                           // pl. egy számított kezdőpont
                   gap: {s: '# évvel később', k}}}
   ──────────────────────────────────────────────────────────────────────────────── */
const TortSource = (() => {
  const F = Lesson.FONTS, U = Lesson.U, TAU = Math.PI * 2;
  const INK = '#1c2440', MUT = '#565d72', RED = '#c8401c', TEAL = '#0a6f86', OCHRE = '#8f5a0c', CARD = '#fffaf1', OCHRE_BG = 'rgba(201,150,60,.16)';
  const COL = { 'forrás': TEAL, 'rekonstrukció': INK, 'monda': OCHRE };
  const TAG = { f: F.B, s: 22, w: 700 };
  const STF = { f: F.B, s: 22, w: 600, ls: '1.76px' };

  function create(L, T) {
    const S = { T, COL, STF };
    S.frame = (x, y, w, h, layer, o = {}) => {
      const c = L.ctx, r = layer === 'monda' ? 18 : 10;
      c.save();
      if (o.shadow !== false) { c.shadowColor = 'rgba(70,50,20,.16)'; c.shadowBlur = 14; c.shadowOffsetY = 3; }
      c.beginPath(); c.roundRect(x, y, w, h, r); c.fillStyle = CARD; c.fill();
      c.shadowColor = 'transparent';
      if (layer === 'monda') { c.fillStyle = OCHRE_BG; c.fill(); }
      c.lineWidth = layer ? 2.5 : 2; c.strokeStyle = layer ? COL[layer] : U.rgba(INK, .35);
      if (layer === 'rekonstrukció') c.setLineDash([8, 6]);
      c.stroke(); c.setLineDash([]);
      if (layer === 'monda') {          // csigás sarkok
        c.lineWidth = 2; c.strokeStyle = OCHRE;
        [[x + 9, y + 9, 0], [x + w - 9, y + 9, 1], [x + w - 9, y + h - 9, 2], [x + 9, y + h - 9, 3]].forEach(([cx, cy, q]) => {
          c.beginPath(); c.arc(cx, cy, 4.5, q * Math.PI / 2 + Math.PI, q * Math.PI / 2 + Math.PI * 2.4); c.stroke();
        });
      }
      if (layer && o.tag !== false && T[layer]) {
        const t = T[layer], tw = L.measure(t.s, TAG).w, tx0 = x + (layer === 'monda' ? 22 : 16);
        c.fillStyle = CARD; c.fillRect(tx0 - 7, y - 12, tw + 14, 24);
        if (layer === 'monda') { c.fillStyle = OCHRE_BG; c.fillRect(tx0 - 7, y - 12, tw + 14, 24); }
        L.tx(t.s, tx0, y + 1, Object.assign({}, TAG, { b: 'middle', c: COL[layer], k: t.k }));
      }
      c.restore();
    };
    S.stampSize = (kind) => { const m = L.measure(T[kind].s, STF); return { w: m.w + 18, h: 22 * 1.3 + 9 * .8 }; };
    S.stamp = (kind, x, y) => {
      const c = L.ctx, col = kind === 'becslés' ? OCHRE : MUT;
      c.save(); c.translate(x, y); c.rotate(-3 * Math.PI / 180);
      const b = L.pill(T[kind].s, 0, 0, Object.assign({}, STF, { bg: CARD, bd: col, bw: 2, c: col, pad: 9, r: 6, k: T[kind].k }));
      c.restore(); return b;
    };
    S.icon = (type, cx, cy, s, col) => {
      const c = L.ctx; c.save(); c.translate(cx, cy); c.lineWidth = 2.5; c.strokeStyle = col; c.lineJoin = 'round'; c.lineCap = 'round';
      const w = s * .62, h = s * .8;
      if (type === 'írott') {          // lap behajtott sarokkal, sorokkal
        const f = s * .17;
        c.beginPath(); c.moveTo(-w / 2, -h / 2); c.lineTo(w / 2 - f, -h / 2); c.lineTo(w / 2, -h / 2 + f); c.lineTo(w / 2, h / 2); c.lineTo(-w / 2, h / 2); c.closePath();
        c.fillStyle = '#f4e9d0'; c.fill(); c.stroke();
        c.beginPath(); c.moveTo(w / 2 - f, -h / 2); c.lineTo(w / 2 - f, -h / 2 + f); c.lineTo(w / 2, -h / 2 + f); c.stroke();
        c.lineWidth = 2; for (let i = 0; i < 4; i++) { const yy = -h / 2 + s * .3 + i * s * .12; c.beginPath(); c.moveTo(-w / 2 + s * .1, yy); c.lineTo(w / 2 - s * .1 - (i === 3 ? s * .14 : 0), yy); c.stroke(); }
      } else if (type === 'krónika') { // nyitott könyv
        c.beginPath(); c.moveTo(0, -h * .32); c.quadraticCurveTo(-w * .4, -h * .48, -w * .85, -h * .36); c.lineTo(-w * .85, h * .4); c.quadraticCurveTo(-w * .4, h * .28, 0, h * .44);
        c.quadraticCurveTo(w * .4, h * .28, w * .85, h * .4); c.lineTo(w * .85, -h * .36); c.quadraticCurveTo(w * .4, -h * .48, 0, -h * .32); c.closePath();
        c.fillStyle = '#f4e9d0'; c.fill(); c.stroke(); c.beginPath(); c.moveTo(0, -h * .32); c.lineTo(0, h * .44); c.stroke();
      } else if (type === 'lelet') {   // korsó
        c.beginPath(); c.moveTo(-w * .18, -h / 2); c.lineTo(w * .18, -h / 2); c.quadraticCurveTo(w * .12, -h * .25, w * .45, 0); c.quadraticCurveTo(w * .5, h * .35, w * .15, h / 2);
        c.lineTo(-w * .15, h / 2); c.quadraticCurveTo(-w * .5, h * .35, -w * .45, 0); c.quadraticCurveTo(-w * .12, -h * .25, -w * .18, -h / 2); c.closePath();
        c.fillStyle = '#e8c9a0'; c.fill(); c.stroke();
      } else if (type === 'monda') {   // beszédbuborék
        c.beginPath(); c.roundRect(-w * .7, -h * .42, w * 1.4, h * .66, 12); c.moveTo(-w * .2, h * .24); c.lineTo(-w * .4, h * .5); c.lineTo(w * .05, h * .24);
        c.fillStyle = OCHRE_BG; c.fill(); c.stroke();
        c.fillStyle = col; [-1, 0, 1].forEach((i) => { c.beginPath(); c.arc(i * w * .32, -h * .09, 3.5, 0, TAU); c.fill(); });
      } else {                         // 'kép': keret hegyekkel
        c.beginPath(); c.rect(-w * .7, -h * .42, w * 1.4, h * .84); c.fillStyle = '#f4e9d0'; c.fill(); c.stroke();
        c.beginPath(); c.moveTo(-w * .6, h * .32); c.lineTo(-w * .15, -h * .08); c.lineTo(w * .1, h * .14); c.lineTo(w * .3, -h * .02); c.lineTo(w * .6, h * .32); c.stroke();
      }
      c.restore();
    };
    S.wrap = (s, maxW, f) => {
      const out = []; let line = '';
      for (const word of String(s).split(' ')) {
        const t = line ? line + ' ' + word : word;
        if (line && L.measure(t, f).w > maxW) { out.push(line); line = word; } else line = t;
      }
      if (line) out.push(line);
      return out;
    };
    S.gap = (ev, wr) => {
      const lo = wr.a - Math.max(ev.a0, ev.a1 == null ? ev.a0 : ev.a1), hi = wr.a - Math.min(ev.a0, ev.a1 == null ? ev.a0 : ev.a1);
      return { lo, hi, s: lo === hi ? U.fmt(lo) : U.fmt(lo) + '–' + U.fmt(hi) };
    };
    S.card = (q) => {
      const c = L.ctx, A = q.a == null ? 1 : q.a; if (A <= .01) return null;
      const Yt = TortTimeline.Y, pad = 30, x = q.x, y = q.y, w = q.w, col = COL[q.layer] || INK;
      const LF = { f: F.B, s: 22, w: 700 }, VF = { f: F.B, s: 26, w: 500 };
      const lw = Math.max(...q.rows.map((r) => L.measure(r.l.s, LF).w)) + 26, vw = w - pad * 2 - lw;
      const rows = q.rows.map((r) => ({ r, lines: S.wrap(r.v.s, vw, VF) }));
      const head = 116, lineH = 34, gapR = 18, hLine = q.line ? 226 : 0;
      const h = head + 26 + rows.reduce((s, r) => s + r.lines.length * lineH + gapR, 0) + hLine;
      c.save(); c.globalAlpha *= A;
      S.frame(x, y, w, h, q.layer);
      S.icon(q.icon, x + pad + 30, y + pad + 34, 62, col);
      L.tx(q.type.s, x + pad + 84, y + pad + 22, Object.assign({}, LF, { c: col, k: q.type.k }));
      L.tx(q.title.s, x + pad + 84, y + pad + 64, { f: F.D, s: 36, w: 560, c: INK, k: q.title.k, max: w - pad * 2 - 84 });
      let yy = y + head + 26;
      for (const { r, lines } of rows) {
        L.tx(r.l.s, x + pad, yy, Object.assign({}, LF, { c: MUT, k: r.l.k }));
        lines.forEach((ln, i) => L.tx(ln, x + pad + lw, yy + i * lineH, Object.assign({}, VF, { c: r.c || INK, k: r.v.k })));
        yy += lines.length * lineH + gapR;
      }
      if (q.line) {
        c.strokeStyle = U.rgba(INK, .16); c.lineWidth = 2; c.beginPath(); c.moveTo(x + pad, yy - 10); c.lineTo(x + w - pad, yy - 10); c.stroke();
        drawLine(q.line, x + pad + 10, yy, w - pad * 2 - 20);
      }
      c.restore();
      return { x, y, w, h };
    };
    function drawLine(Ln, lx, ly, lw) {
      const c = L.ctx, Yt = TortTimeline.Y, T2 = Ln.T, ev = Ln.ev, wr = Ln.wr;
      const us = [ev.a0, ev.a1 + 1, wr.a + .5].concat(Ln.mark ? [Ln.mark.a] : []);
      let lo = Math.min(...us), hi = Math.max(...us); const pd = (hi - lo) * .1; lo -= pd; hi += pd;
      const X = (u) => lx + (u - lo) / (hi - lo) * lw, yl = ly + 112;
      const xa = X(ev.a0), xb = Math.max(X(ev.a1 + 1), xa + 16), xm = (xa + xb) / 2, xw = X(wr.a + .5);
      /* eltelt idő: zárójel az esemény és a keletkezés között */

    C7B = FC.create(L, { x: 150, y: 180, w: 1150, h: 680, xs: { min: 0, max: 225, step: 25 }, ys: { min: 40, max: 110, step: 10 } });
    C8 = FC.create(L, { x: 420, y: 200, w: 860, h: 700, xs: { min: 0, max: 200, step: 25 }, ys: { min: 9.6, max: 0, ticks: [] } });

    L.checks = () => {
      const out = [], near = (a, b, tol) => Math.abs(a - b) <= tol;
      const ch = (name, got, want, tol) => out.push({ name, ok: near(got, want, tol), got: +got.toFixed(3), want });
      ch('ország népessége 2012 = a megyék összege', NAT.p0, N('Magyarország népessége 2012'), .5);
      ch('ország népessége ' + Y1 + ' = a megyék összege', NAT.p1, N('Magyarország népessége 2026'), .5);
      ch('ország területe = a megyék összege', NAT.area, N('Magyarország területe'), .5);
      const bad = ORDER.filter((k) => D[k].p1 - D[k].p0 !== D[k].nat + D[k].dom + D[k].intl);
      out.push({ name: 'népmozgalmi mérleg: születés − halálozás + vándorlás = népességváltozás (minden megye)', ok: !bad.length, got: bad.join(', ') || 'mind egyezik', want: '20/20' });
      out.push({ name: 'belföldi vándorlás országos összege 0', ok: NAT.dom === 0, got: NAT.dom, want: 0 });
      out.push({ name: 'népességsor hossza = évek száma', ok: ORDER.every((k) => D[k].pop.length === YRS.length), got: D.Budapest.pop.length, want: YRS.length });
      out.push({ name: 'öregedési évek utolsó eleme = népesség utolsó éve', ok: AGE_Y[2] === Y1, got: AGE_Y[2], want: Y1 });
      ch('átlag fölötti megyék', ORDER.filter((k) => D[k].gdp > 100).length, N('átlag fölötti megyék'), 0);
      ch('országos népsűrűség', NAT.p1 / NAT.area, N('országos népsűrűség'), .6);
      ch('Budapest népsűrűsége', D.Budapest.dens, N('Budapest népsűrűsége'), 2);
      ch('Budapest területaránya %', D.Budapest.area / NAT.area * 100, N('Budapest területaránya'), .05);
      ch('Budapest népességaránya %', D.Budapest.p1 / NAT.p1 * 100, N('Budapest népességaránya'), .05);
      const iG = YRS.indexOf(N('GDP éve')), avg = (d) => (d.pop[iG] + d.pop[iG + 1]) / 2, avgN = (NAT.pop[iG] + NAT.pop[iG + 1]) / 2;
      ch('Budapest GDP-aránya % (GDP/fő × évközepi népesség)', D.Budapest.gdp * avg(D.Budapest) / avgN, N('Budapest GDP-aránya'), .1);
      ch('agglomeráció népességaránya %', N('agglomeráció népessége') / NAT.p1 * 100, N('agglomeráció népességaránya'), .05);
      ch('országos népességváltozás %', (NAT.p1 / NAT.p0 - 1) * 100, N('országos népességváltozás'), .05);
      ch('Pest népességváltozása %', D.Pest.chg, N('Pest népességváltozása'), .05);
      ch('Békés népességváltozása %', D['Békés'].chg, N('Békés népességváltozása'), .05);
      out.push({ name: 'Békés fogyott a legjobban', ok: ORDER.every((k) => D[k].chg >= D['Békés'].chg), got: ORDER.slice().sort((a, b) => D[a].chg - D[b].chg)[0], want: 'Békés' });
      out.push({ name: 'csak Pest és Győr-Moson-Sopron nőtt', ok: ORDER.filter((k) => D[k].chg > 0).join() === 'Pest,Győr-Moson-Sopron', got: ORDER.filter((k) => D[k].chg > 0).join(', '), want: 'Pest, Győr-Moson-Sopron' });
      out.push({ name: 'minden megyében természetes fogyás', ok: ORDER.every((k) => D[k].nat < 0), got: ORDER.filter((k) => D[k].nat >= 0).join(', ') || 'mind < 0', want: 'mind < 0' });
      ch('Pest belföldi vándorlása', D.Pest.dom, N('Pest belföldi vándorlása'), 0);
      out.push({ name: 'Borsod és Szabolcs: belföldi vándorlás < 0', ok: D['Borsod-Abaúj-Zemplén'].dom < 0 && D['Szabolcs-Szatmár-Bereg'].dom < 0, got: [D['Borsod-Abaúj-Zemplén'].dom, D['Szabolcs-Szatmár-Bereg'].dom].join(' / '), want: '< 0' });
      ch('gyerekesebb megyék 2001', ORDER.filter((k) => D[k].age[0] < 100).length, N('gyerekesebb megyék 2001'), 0);
      ch('100 alatti öregedési index ' + Y1, ORDER.filter((k) => D[k].age[2] < 100).length, 0, 0);
      out.push({ name: 'legfiatalabb (' + Y1 + '): Pest, legidősebb: Zala', ok: ORDER.slice().sort((a, b) => D[a].age[2] - D[b].age[2])[0] === 'Pest' && ORDER.slice().sort((a, b) => D[b].age[2] - D[a].age[2])[0] === 'Zala', got: ORDER.slice().sort((a, b) => D[a].age[2] - D[b].age[2])[0], want: 'Pest' });
      /* székhelyek a saját megyéjükben */
      const inPoly = (it, lon, lat) => { let n = 0; for (const r of it.rings) { let ins = false; for (let i = 0, j = r.length - 2; i < r.length; j = i, i += 2) { const xi = r[i], yi = r[i + 1], xj = r[j], yj = r[j + 1]; if ((yi > lat) !== (yj > lat) && lon < (xj - xi) * (lat - yi) / (yj - yi) + xi) ins = !ins; } if (ins) n++; } return n % 2 === 1; };
      const off = ORDER.filter((k) => k !== 'Pest' && !inPoly(G.by[k], D[k].seat.lon, D[k].seat.lat));
      out.push({ name: 'a székhely koordinátája a megye sokszögébe esik', ok: !off.length, got: off.join(', ') || '19/19', want: '19/19' });
      out.push({ name: 'térkép: a 20 megye kulcsa egyezik az adatokkal', ok: ORDER.every((k) => G.by[k]) && G.items.length === 20, got: G.items.length, want: 20 });
      const fV = fit7('V'), fB = fit7('B');
      out.push({ name: 'Bécstől mért távolság: negatív, erősebb összefüggés, mint Budapesttől', ok: fV.b < 0 && Math.abs(fV.r) > Math.abs(fB.r), got: 'r(Bécs) = ' + fV.r.toFixed(2) + ', r(Bp) = ' + fB.r.toFixed(2), want: 'r(Bécs) < 0, |r(Bécs)| > |r(Bp)|' });
      out.push({ name: 'Nógrád: legkisebb GDP/fő', ok: ORDER.every((k) => D[k].gdp >= D['Nógrád'].gdp), got: ORDER.slice().sort((a, b) => D[a].gdp - D[b].gdp)[0], want: 'Nógrád' });
      out.push({ name: 'Észak-Magyarország a legkisebb régió (EU = 100)', ok: REG8.every((k) => N('EU · ' + k) >= N('EU · Észak-Magyarország')), got: N('EU · Észak-Magyarország'), want: 'min' });
      return out;
    };
    window.__qaStates = {
      1: [{ name: 'nograd', set() { s1.sel = 'Nógrád'; } }, { name: 'budapest', set() { s1.sel = 'Budapest'; } }, { name: 'szabolcs', set() { s1.sel = 'Szabolcs-Szatmár-Bereg'; } }],
      2: [{ name: 'terkep', set() { s2.from = s2.to = 0; } }],
      3: [{ name: 'retegek-ki', set() { s3.hw = s3.ag = false; s3.thw = s3.tag = -10; } }],
      4: [{ name: '2012', set() { s4.from = s4.to = Y0; s4.dur = .5; s4.t0 = -10; } }, { name: '2019-pest', set() { s4.from = s4.to = 2019; s4.dur = .5; s4.t0 = -10; s4.sel = 'Pest'; } },
          { name: 'bekes', set() { s4.from = s4.to = Y1; s4.dur = .5; s4.t0 = -10; s4.sel = 'Békés'; } }],
      5: [{ name: 'termeszetes', set() { s5.mode = s5.prev = 'nat'; } }, { name: 'belfoldi-borsod', set() { s5.mode = s5.prev = 'dom'; s5.sel = s5.psel = 'Borsod-Abaúj-Zemplén'; } },
          { name: 'nemzetkozi-budapest', set() { s5.mode = s5.prev = 'intl'; s5.sel = s5.psel = 'Budapest'; } }, { name: 'gyor', set() { s5.sel = s5.psel = 'Győr-Moson-Sopron'; } }],
      6: [{ name: '2001', set() { s6.from = s6.to = 0; } }, { name: '2012-zala', set() { s6.from = s6.to = 1; s6.sel = 'Zala'; } }],
      7: [{ name: 'budapesttol', set() { s7.mode = s7.prev = 'B'; } }],
      8: [{ name: 'fovarosok', set() { s8.mode = s8.prev = 'cap'; } }],
      9: [{ name: 'valtozas-pest', set() { s9.mode = s9.prev = 'chg'; s9.sel = 'Pest'; } }, { name: 'oregedes', set() { s9.mode = s9.prev = 'age'; } }, { name: 'suruseg-bp', set() { s9.mode = s9.prev = 'dens'; s9.sel = 'Budapest'; } }],
    };
  },
  draw(Lx) {
    L = Lx; c = L.ctx; GA = 1; background();
    if (L.step >= 0) sT[L.step] = L.st;
    for (let i = 0; i < SCENES.length; i++) {
      const w = clamp(1 - Math.abs(L.sp - i) * 2); if (w <= .005) continue;
      GA = w; c.save(); c.globalAlpha = w; SCENES[i](sT[i], L.step === i); c.restore();
    }
    c.globalAlpha = 1;
  },
});
})();
</script>
