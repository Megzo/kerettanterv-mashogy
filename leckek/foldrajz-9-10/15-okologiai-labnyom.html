<script>

/* ── MODUL: Földgömb (TortGlobe) · v1.1 (2026-11-24) ──────────────────────────────────────
   Az A modul (TortMap) gömbbővítése (pilot/tortenelem-5-6/terv.md, 5. fejezet: „ortografikus gömb”).
   Referencia: 13-felfedezesek. Lecke-független: változtatás nélkül átemelhető (pl. shared/tort/globe.js).
   Függ: TortProj (shared/tort/proj.js: ortho, gc, dist, unpack), TortMap (a feliratok ütközésmentes
   elhelyezéséhez és a bélyeghez), a lecke-motor L objektuma (L.tx, L.pointer, L.stage, L.VW).
   Adat: shared/tort/map-vilag.js (window.TORT_MAP_VILAG, 1:110m).

   NÉZET  v = {lon, lat, r, x, y}: a (lon, lat) pont néz a néző felé (észak mindig fent), r = a gömb sugara px-ben,
          (x, y) = a korong középpontja a képernyőn.
     TortGlobe.lerp(a, b, u)        nézet a és b között: lon a rövidebb úton, lat és x, y lineárisan, r logaritmikusan
     const cam = TortGlobe.camera() cam.go(v, t, dur) átmenet a jelenlegi állásból · cam.at(t) → nézet (inOut) ·
                                    cam.snap(v) azonnal · cam.last (az utolsó kiadott nézet)
     const orb = TortGlobe.orbit({latMax: 75})   forgatás egérrel / ujjal (húzás a korongon):
                                    orb.update(L, v, on) minden képkockán (on: aktív-e a lépés; kurzort is állít) ·
                                    orb.apply(v) → az eltolt nézet · orb.reset() · orb.dlon, orb.dlat, orb.used
   KÉPKOCKÁNKÉNT (a sorrend: frame → globe → parallel / line / saját rajz → labels)
     const G = TortGlobe.create({data: window.TORT_MAP_VILAG, style?})
     G.frame(v) → V                 beállítja a nézetet (V: TortProj.view az ortho vetülettel; + V.r)
     G.pt(lon, lat) → [x, y, z]     képernyőpont (új tömb); z = koszinusz a nézőirány felé: z < 0 → hátoldal
     G.globe(ctx, o)                tenger-korong (árnyékolva), fokhálózat, szárazföld, tavak, partvonal, perem.
                                    o = {grid: 30 (fok; 0 = nincs), lakes: true, land: 1 (a szárazföld, a tavak és – ha
                                    nincs coast – a partvonal alfája), coast: alfa (alap: = land), sea: true, rim: true,
                                    style: {sea0, sea1, land, coast, coastW, lake, grid, rim}}
                                    sea: false → nincs papír-alap, tengerkorong és perem-árnyék (semmi nem takar): második
                                    rétegnek a saját rajz fölé, pl. partvonal + perem a lemezszínek fölött:
                                    G.globe(ctx, {sea: false, grid: 0, land: 0, coast: .55, lakes: false})
     G.clip(ctx)                    a korongra vág (ctx.save() után hívd; saját rajzhoz a gömb felszínén)
     G.parallel(ctx, lat, o) · G.meridian(ctx, lon, o)   szélességi / hosszúsági kör látható része: o = {color, w, dash}
     G.stroke(ctx, pts, o)          tetszőleges [[lon, lat], …] vonal látható része (a peremen pontosan elvágva)
     G.route(pts, maxDeg = 1.5)     útvonal sűrítése főkörívekkel (TortProj.gc): → R = [[lon, lat], …],
                                    R.cum (km minden pontnál), R.km (összesen), R.wk (km a bemenő töréspontoknál)
     G.at(R, km) → [lon, lat]       a sűrített útvonal pontja az elejétől km távolságra (a végeken levágva)
     G.line(ctx, R, o)              útvonal / animált nyíl a gömbön: o = {k0, k (km-tartomány; alap 0 … R.km), color,
                                    w, dash, head, halo, back (a hátoldali rész alfája, alap 0)} →
                                    {x, y, ang, z} a végpontnál (z < 0: a hátoldalon van, a hívó ne rajzoljon oda)
     G.labels(L, items, o)          TortMap.labels a gömbön: az elem lon/lat-ja képernyőpont lesz; a hátoldali elemek
                                    kimaradnak, a perem felé elhalványulnak (az alfát szorozza). items/o: mint TortMap-nél.
     G.hit(x, y) → bool             a képernyőpont a korongon van-e
   A szárazföld kitöltése pontos: a hátoldali pontok a korongon kívülre kerülnek (folytonos kiterjesztés), a gyűrű
   körüljárásából derül ki, ha a gyűrű a néző ellenpontját is körbezárja (pl. Afro-Eurázsia a Csendes-óceán felől),
   és akkor kifordítja; végül a korongra vág. A partvonal és az útvonalak a peremen interpolálva érnek véget.
   Teljesítmény: a teljes 1:110m világ (kb. 4800 pont) képkockánként kb. 1–2 ms.
   Változások: v1.1 (2026-11-24) – G.globe sea/coast/rim opció (eddig a második hívás átlátszó tengerrel is papír-alapot
   és perem-árnyékot festett a korábbi rétegekre → fehér fátyol). A régi hívások képe változatlan.
   ───────────────────────────────────────────────────────────────────────────────────────── */
const TortGlobe = (() => {
  'use strict';
  const TP = window.TortProj, D = Math.PI / 180, R_KM = 6371;
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const smooth = (t) => { t = clamp(t); return t * t * (3 - 2 * t); };
  const inOut = (t) => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
  const wrap = (d) => ((d % 360) + 540) % 360 - 180;
  const DEF = { sea0: 'rgba(70,150,215,.30)', sea1: 'rgba(70,150,215,.50)', land: '#f5eddd', coast: '#1b5a94', coastW: 1.6,
    lake: '#c6dbe8', grid: 'rgba(27,90,148,.22)', rim: '#1c2440', ink: '#1c2440', halo: 'rgba(250,246,238,.94)' };

  [['nem 1', WATER], ['nem 2', CC.forest], ['nem 3', OCHRE]].forEach(([k, col], i) => {
    const yy = yN + 58 + i * 54;
    al(a3); c.beginPath(); c.arc(80, yy, 14, 0, TAU); c.fillStyle = U.rgba(col, .3); c.fill(); c.strokeStyle = col; c.lineWidth = 2.5; c.stroke();
    c.strokeStyle = RED; c.lineWidth = 3; c.lineCap = 'round'; c.beginPath(); c.moveTo(69, yy - 11); c.lineTo(91, yy + 11); c.stroke();
    tx(k, 108, yy, Object.assign({}, B26, { w: 600, b: 'middle', c: INK }));
  });
  /* vízlábnyom */
  const a4 = A * smooth((st - 2.3) / .6), yW = 720;
  al(a4); tshirt(810, yW, 130, WATER, { fill: 'rgba(70,150,215,.30)', lw: 4 });
  for (let i = 0; i < 4; i++) { const ui = smooth((st - 2.8 - i * .2) / .4); al(a4 * ui); drop(780 + i * 20, yW + 76 + ui * 34 + (i % 2) * 10, 8, WATER); }
  al(a4); tx('vízlábnyom', 920, yW - 46, Object.assign({}, B26, { w: 700, c: WATER }));
  al(a4); tx('póló', 920, yW - 4, Object.assign({}, B24, { w: 600, c: INK }));
  al(a4); txf('póló liter', [L.val('póló vízlábnyoma')], 920, yW + 42, Object.assign({}, M26, { c: WATER, max: 420, k: ['póló liter', 'póló vízlábnyoma'] }));
  source('forrás 7', A);
}

/* ══════════ 8. lépés: mit lehet tenni? ══════════ */
const LEV8 = [
  { lvl: 'szint egyén', k: 'lépés hús', b: 'gomb hús', d: 'hús felezése' },
  { lvl: 'szint egyén', k: 'lépés pazarlás', b: 'gomb pazarlás', d: 'pazarlás felezése' },
  { lvl: 'szint település', k: 'lépés autó', b: 'gomb autó', d: 'autózás felezése' },
  { lvl: 'szint állam', k: 'lépés hatékonyság', b: 'gomb hatékonyság', d: 'hatékonyság', min: true },
  { lvl: 'szint állam', k: 'lépés CO₂', b: 'gomb CO₂', d: 'CO₂ felezése' },
];
const LVLC = { 'szint egyén': CC.crop, 'szint település': TEAL, 'szint állam': RED };
const s8 = { sel: 4, prev: 4, t0: -10 };
let BTN8 = [];
function scene8(st) {
  al(1); tx('cím 8', 60, 78, H1);
  const A = smooth(st / .6), base = dd('túllépés napja 2026');
  const u = inOut((st - s8.t0) / .6), sh = (i) => N(LEV8[i].d);
  const shift = s8.t0 > -5 ? lerp(sh(s8.prev), sh(s8.sel), u) : sh(s8.sel);
  const ua = smooth((st - 1.2) / 1);
  const p = (base.doy + shift * ua) / base.n;
  calendar(60, 172, 1260, 64, p, { yr: base.y, a: A, ghost: base.doy / base.n, ghostLab: KF('kiinduló 8', dayName(base.doy, base.y)),
    lab: { s: dayName(Math.round(base.doy + shift * ua), base.y), k: ['hónapnevek', LEV8[s8.sel].d, 'túllépés napja 2026'] } });
  /* oszlopok szintenként */
  const x0 = 520, x1 = 1220, DMAX = 100, sx = (d) => x0 + d / DMAX * (x1 - x0);
  let y = 420, lastL = '';
  LEV8.forEach((lv, i) => {
    if (lv.lvl !== lastL) {
      if (lastL) y += 24;
      al(A); c.beginPath(); c.arc(68, y - 8, 9, 0, TAU); c.fillStyle = LVLC[lv.lvl]; c.fill();
      tx(lv.lvl, 86, y, Object.assign({}, B24, { w: 700, c: LVLC[lv.lvl] })); lastL = lv.lvl; y += 18;
    }
    const on = i === s8.sel, d = N(lv.d), ub = smooth((st - .4 - i * .15) / .6);
    al(A * (on ? 1 : .7)); tx(lv.k, 86, y + 20, Object.assign({}, B22, { b: 'middle', w: on ? 700 : 500, c: INK, max: x0 - 100 }));
    al(A * (on ? 1 : .55)); c.fillStyle = LVLC[lv.lvl]; c.fillRect(x0, y + 4, sx(d * ub) - x0, 32);
    if (on) { c.save(); c.globalAlpha = GA * A; c.strokeStyle = INK; c.lineWidth = 3; c.strokeRect(x0, y + 4, sx(d * ub) - x0, 32); c.restore(); }
    al(A * (on ? 1 : .7)); L.tx(lv.min ? fill('legalább', f0(d)) : fill('napok', f0(d)), sx(d * ub) + 12, y + 20, Object.assign({}, M22, { b: 'middle', w: on ? 700 : 500, k: lv.min ? ['legalább', lv.d] : ['napok', lv.d] }));
    y += 52;
  });
  al(A); c.strokeStyle = U.rgba(INK, .5); c.lineWidth = 2; c.beginPath(); c.moveTo(x0, 430); c.lineTo(x0, y - 8); c.stroke();
  al(A * smooth((st - 1.5) / .5)); tx('nem összeadható', 86, y + 18, Object.assign({}, B22, { c: MUT, w: 500, max: 1240 }));
  al(A * smooth((st - 1.8) / .5)); txf('évi 6 nap', [L.val('évi elmozdulás'), f0(Math.ceil((base.n - base.doy) / N('évi elmozdulás')))], 86, y + 54, Object.assign({}, B22, { c: TEAL, w: 700, max: 1240, k: ['évi 6 nap', 'évi elmozdulás', 'túllépés napja 2026'] }));
  myth('tévhit 8', 60, 960, A * smooth((st - 2.2) / .5));
  source('forrás 8', A);
}
function setLever(i, st) { const u = inOut((st - s8.t0) / .6); s8.prev = s8.t0 > -5 && u < 1 ? (u < .5 ? s8.prev : s8.sel) : s8.sel; s8.sel = i; s8.t0 = st; BTN8.forEach((b, j) => b.classList.toggle('on', j === i)); }

/* ══════════ 9. lépés: összefoglalás ══════════ */
function scene9(st) {
  al(1); tx('cím 9', 60, 78, H1);
  const A = smooth(st / .5);
  al(A); G.frame({ lon: 15 + st * 5, lat: 20, r: 230, x: 300, y: 560 }); G.globe(c, { grid: 30 });
  const E = N('Föld-szám 2026');
  al(A); txf('Föld', [f2(E)], 300, 870, { f: F.M, s: 44, w: 700, c: RED, a: 'center', k: ['Föld', 'Föld-szám 2026'] });
  const cols = [TEAL, RED, RED, CC.co2, OCHRE, MUT];
  const vals = {
    'ö 1': [L.val('biokapacitás fejenként')], 'ö 3': [U.fmt(E, 1)], 'ö 4': [L.val('CO₂ aránya')],
    'ö 5': [f1(Math.min(...Object.values(ES))), f0(Math.max(...Object.values(ES)))],
  };
  const keys = { 'ö 1': ['biokapacitás fejenként'], 'ö 3': ['Föld-szám 2026'], 'ö 4': ['CO₂ aránya'], 'ö 5': ['Föld-szám BGD', 'Föld-szám QAT'] };
  let y = 190;
  for (let i = 1; i <= 6; i++) {
    const k = 'ö ' + i, s = vals[k] ? fill(k, ...vals[k]) : L.lab(k);
    const lines = FC.wrap(L, s, 640, B26);
    al(A * smooth((st - .3 - i * .15) / .5));
    c.beginPath(); c.arc(682, y - 9, 8, 0, TAU); c.fillStyle = cols[i - 1]; c.fill();
    lines.forEach((ln, j) => L.tx(ln, 704, y + j * 34, Object.assign({}, B26, { w: 600, k: [k].concat(keys[k] || []) })));
    y += lines.length * 34 + 34;
  }
  source('forrás 9', A);
}

/* ══════════ VEZÉRLŐK, LÉPÉSEK ══════════ */
const SCENES = [scene1, scene2, scene3, scene4, scene5, scene6, scene7, scene8, scene9];
const sT = SCENES.map(() => 0);
const SETTLE = [6.4, 6.4, 7.6, 1.5, 2.2, 2.4, 3.8, 3.2, 1.6];
function play3(st) { s3.from = 0; s3.to = YRS3.length - 1; s3.t0 = st + .6; s3.dur = 6; if (SL3) SL3.set(YRS3.length - 1); }
const stepDefs = [
  {},
  {},
  { enter() { play3(0); },
    controls(L) {
      SL3 = L.slider({ label: L.lab('csúszka év'), k: 'csúszka év', min: 0, max: YRS3.length - 1, step: 1, value: YRS3.length - 1, format: (v) => String(YRS3[v].y),
        onInput: (v) => { s3.from = idx3(L.st); s3.to = v; s3.t0 = L.st; s3.dur = .5; } });
      L.button(L.lab('gomb lejátszás'), () => { s3.from = 0; s3.to = YRS3.length - 1; s3.t0 = L.st; s3.dur = 6; SL3.set(YRS3.length - 1); }, 'gomb lejátszás');
    } },
  { enter() { s4.from = [100, 100, 100]; s4.to = [100, 100, 100]; s4.t0 = -10; SL4.forEach((s) => s && s.set(100)); },
    controls(L) {
      const fmt = (v) => v + ' %';
      SL4 = [
        L.slider({ label: L.lab('csúszka CO₂'), k: 'csúszka CO₂', min: 0, max: 150, step: 5, value: 100, format: fmt, onInput: (v) => set4(0, v, L.st) }),
        L.slider({ label: L.lab('csúszka élelem'), k: 'csúszka élelem', min: 50, max: 150, step: 5, value: 100, format: fmt, onInput: (v) => set4(1, v, L.st) }),
        L.slider({ label: L.lab('csúszka fa'), k: 'csúszka fa', min: 50, max: 150, step: 5, value: 100, format: fmt, onInput: (v) => set4(2, v, L.st) }),
      ];
      L.button(L.lab('gomb alaphelyzet'), () => { s4.from = val4(L.st); s4.to = [100, 100, 100]; s4.t0 = L.st; SL4.forEach((s) => s.set(100)); }, 'gomb alaphelyzet');
    } },
  { enter() { s5.sel = 'HUN'; } },
  { enter() { s6.sel = null; } },
  { enter() { s7.which = 1; s7.prev = 0; s7.t0 = 1.2; },
    controls(L) {
      btnGroup(L, [['gomb régi', () => { s7.prev = s7.which; s7.which = 0; s7.t0 = L.st; }], ['gomb új', () => { s7.prev = s7.which; s7.which = 1; s7.t0 = L.st; }, true]]);
    } },
  { enter() { s8.sel = s8.prev = 4; s8.t0 = -10; BTN8.forEach((b, j) => b.classList.toggle('on', j === 4)); },
    controls(L) { BTN8 = LEV8.map((lv, i) => { const b = L.button(L.lab(lv.b), () => setLever(i, L.st), lv.b); if (i === 4) b.classList.add('on'); return b; }); } },
  {},
];
const steps = stepDefs.map((d, i) => Object.assign({ settle: SETTLE[i] }, d));

L = Lesson.create({
  content: window.LESSON_CONTENT, home: false, steps, resetCtx: true,
  init(Lx) {
    L = Lx; c = L.ctx;
    G = TG.create({ data: window.TORT_MAP_VILAG });
    SRC = TortSource.create(L, { 'becslés': K('becslés') });
    /* 1. */
    AREAS1 = [['szántó területe', CC.crop, 'c szántó'], ['legelő területe', CC.graze, 'c legelő'], ['erdő területe', CC.forest, 'c erdő'],
      ['halászóvíz területe', CC.fish, 'c halászóvíz'], ['beépített terület', CC.built, 'c beépített']].map(([d, col, k]) => ({ v: N(d), c: col, k, d }));
    /* 2. */
    const bp = L.dat('biokapacitás részei').v, fp = L.dat('lábnyom részei').v;
    BIO2 = [CC.crop, CC.graze, CC.forest, CC.fish, CC.built].map((col, i) => ({ v: bp[i], c: col }));
    FP2 = [CC.crop, CC.graze, CC.forest, CC.fish, CC.built, CC.co2].map((col, i) => ({ v: fp[i], c: col }));
    C2 = FC.create(L, { x: 140, y: 180, w: 1060, h: 600, xs: { min: 0, max: 3, step: .5, d: 1 }, ys: { min: 0, max: 1 } });
    /* 3. */
    YRS3 = [];
    for (const k of Object.keys(window.LESSON_CONTENT.data)) if (/^túllépés napja \d{4}$/.test(k)) { const q = dd(k); YRS3.push({ y: q.y, doy: q.doy, n: q.n, k }); }
    YRS3.sort((a, b) => a.y - b.y);
    const MT = [182, 213, 244, 274, 305, 335, 366];
    C3 = FC.create(L, { x: 160, y: 330, w: 680, h: 560, xs: { min: 1970, max: 2028, ticks: [1970, 1980, 1990, 2000, 2010, 2020] },
      ys: { min: 182, max: 366, ticks: MT, fmt: (v) => L.lab('hónapok').split(';')[Math.min(11, MT.indexOf(v) + 6)] + (v === 366 ? ' vége' : ' 1.') } });
    s3.from = s3.to = YRS3.length - 1;
    /* 4. */
    M4 = { co2: fp[5], food: fp[0] + fp[1] + fp[3], wood: fp[2] + fp[4], bio: N('biokapacitás fejenként') };
    C4 = FC.create(L, { x: 140, y: 400, w: 740, h: 360, xs: { min: 0, max: 4, step: 1 }, ys: { min: 0, max: 1 } });
    /* 5. */
    for (const iso of ISO5) ES[iso] = N('Föld-szám ' + iso);
    G5 = FCH.load(window.FOLD_ORSZAGOK, { skip: ['ATA'] }); MAP5 = FCH.create(L, G5);
    const pr = P.equalEarth({ lon0: 0 });
    V5 = P.view(pr, P.fit(pr, [-180, -58, 180, 84], [40, 110, 1280, 660]));
    const br = L.dat('osztályközök').v;
    SC5 = FCH.scale(br, [FCH.div(5)[0]].concat(FCH.seq(4)));
    /* 6. */
    const W = window.FOLD_WDI, yi = N('GDP-adat éve') - W.y0;
    W.countries.forEach((co, i) => { if (ES[co.iso] != null) { GDP6[co.iso] = wdiSeries(W, 'gdpPpp', i)[yi]; POP6[co.iso] = wdiSeries(W, 'pop', i)[yi]; } });
    C6 = FC.create(L, { x: 150, y: 150, w: 1120, h: 690, xs: { min: 1000, max: 150000, log: true }, ys: { min: 0, max: 11, step: 2 } });

    L.checks = () => {
      const out = [], ch = (name, got, want, tol) => out.push({ name, ok: Math.abs(got - want) <= tol, got: Math.round(got * 1000) / 1000, want });
      const sumA = AREAS1.reduce((a, s) => a + s.v, 0);
      ch('a termékeny területek összege ≈ termékeny terület (milliárd ha)', sumA / 1e9, N('termékeny terület') / 1e9, .06);
      ch('biokapacitás fejenként ≈ termékeny terület / népesség', N('termékeny terület') / N('világ népessége 2023'), N('biokapacitás fejenként'), .02);
      ch('biokapacitás részeinek összege', bp.reduce((a, b) => a + b, 0), N('biokapacitás fejenként'), .02);
      ch('lábnyom részeinek összege', fp.reduce((a, b) => a + b, 0), N('lábnyom fejenként'), .02);
      ch('CO₂ aránya (%)', fp[5] / N('lábnyom fejenként') * 100, N('CO₂ aránya'), 1);
      ch('focipálya = 105 m × 68 m', 105 * 68 / 1e4, N('focipálya területe'), .001);
      /* a modell alapállása = a 2023-as túllépés napja */
      const b0 = model4([100, 100, 100]), d23 = dd('túllépés napja 2023');
      ch('modell 2023: túllépés napja (nap)', Math.ceil(d23.n * b0.p - 1e-9), d23.doy, 1);
      const h = model4([50, 100, 100]);
      ch('modell: CO₂ felezése (nap)', d23.n * h.p - d23.n * b0.p, N('CO₂ felezése'), 3);
      /* a 2026-os Föld-szám = 365 / a túllépés napja */
      const d26 = dd('túllépés napja 2026');
      ch('Föld-szám 2026 = 365 / nap', d26.n / d26.doy, N('Föld-szám 2026'), .01);
      /* Magyarország: június 24. = 175. nap */
      ch('Magyarország: 365 / 175 (jún. 24.)', 365 / doyOf([2026, 6, 24]), N('Föld-szám HUN'), .05);
      const o = dd('túllépés napja 2025 régi'), nw = dd('túllépés napja 2025');
      ch('a két kiadás különbsége = adatjavítás hatása', nw.doy - o.doy, N('adatjavítás hatása'), 0);
      out.push({ name: 'a 2025-ös nap a 2026-os kiadásban későbbi', ok: nw.doy > o.doy, got: nw.doy, want: '> ' + o.doy });
      const nG = ISO5.filter((k) => GDP6[k] > 0 && POP6[k] > 0).length;
      out.push({ name: 'minden válogatott országnak van WDI-adata', ok: nG === ISO5.length, got: nG, want: ISO5.length });
      const nM = ISO5.filter((k) => G5.by[k]).length;
      out.push({ name: 'minden válogatott ország a térképen', ok: nM === ISO5.length, got: nM, want: ISO5.length });
      return out;
    };
    window.__qaStates = {
      3: [{ name: 'y1972', set() { s3.from = s3.to = 0; SL3.set(0); } }, { name: 'y2020', set() { const i = YRS3.findIndex((q) => q.y === 2020); s3.from = s3.to = i; SL3.set(i); } },
          { name: 'y2026', set() { s3.from = s3.to = YRS3.length - 1; SL3.set(YRS3.length - 1); } }, { name: 'kozben', set() { s3.from = 3; s3.to = 4; s3.t0 = L.st - .25; s3.dur = .5; } }],
      4: [{ name: 'co2-50', set() { s4.from = s4.to = [50, 100, 100]; SL4[0].set(50); } }, { name: 'co2-0', set() { s4.from = s4.to = [0, 100, 100]; SL4[0].set(0); } },
          { name: 'max', set() { s4.from = s4.to = [150, 150, 150]; SL4.forEach((s) => s.set(150)); } }, { name: 'min', set() { s4.from = s4.to = [0, 50, 50]; SL4[0].set(0); SL4[1].set(50); SL4[2].set(50); } }],
      5: ['QAT', 'IND', 'USA', 'AUS', 'BRA'].map((k) => ({ name: k.toLowerCase(), set() { s5.sel = k; } })).concat([{ name: 'nincs', set() { s5.sel = null; } }]),
      6: [{ name: 'qat', set() { s6.sel = 'QAT'; } }, { name: 'ind', set() { s6.sel = 'IND'; } }, { name: 'jpn', set() { s6.sel = 'JPN'; } }],
      7: [{ name: 'regi', set() { s7.which = s7.prev = 0; s7.t0 = -10; } }],
      8: [0, 1, 2, 3].map((i) => ({ name: 'lever' + i, set() { s8.sel = s8.prev = i; s8.t0 = -10; } })),
    };
  },
  draw(Lx) {
    L = Lx; c = L.ctx; GA = 1; background();
    if (L.step >= 0) sT[L.step] = L.st;
    for (let i = 0; i < SCENES.length; i++) {
      const w = clamp(1 - Math.abs(L.sp - i) * 2); if (w <= .005) continue;
      GA = w; c.save(); c.globalAlpha = w; SCENES[i](sT[i], L.step === i); c.restore();
    }
    c.globalAlpha = 1;
  },
});
})();
