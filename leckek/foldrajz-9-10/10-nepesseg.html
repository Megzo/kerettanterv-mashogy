<script>
/* ── MODUL: Forráskártya (TortSource) ─────────────────────────────────────────────
   C modul (terv.md, 5. fejezet): a „Honnan tudjuk?” kártya és a három réteg egységes jelölése
   (leckek/SZERZODES.md, 11. pont). Referencia: 01-idoszamitas. Később: shared/tort/source.js.
   Függés: Lesson motor; az évszám-aritmetikához TortTimeline.Y (a B modul) – előbb azt töltsd be.

   const S = TortSource.create(L, T)   T (a .md-ből, mind {s, k}):
       {'forrás', 'rekonstrukció', 'monda', 'becslés', 'vázlatos'?, 'illusztráció'?}
   S.COL                      réteg → keretszín (forrás #0a6f86, rekonstrukció #1c2440, monda #8f5a0c)
   S.frame(x, y, w, h, layer, o)   keret a réteg szerint + a réteg neve a bal felső sarokban:
       'forrás' kékeszöld folytonos 2,5 px · 'rekonstrukció' tinta szaggatott 8/6 · 'monda' okker kartus
       (kitöltés rgba(201,150,60,.16), csigás sarkok) · null: semleges kártya. o = {tag: false, shadow: false}
   S.stamp(kind, x, y)        bélyeg (kind: 'becslés' | 'vázlatos' | 'illusztráció'): L.pill, −3°, (x, y) = bal közép
   S.stampSize(kind)          {w, h}
   S.icon(type, cx, cy, size, col)   forrástípus-ikon: 'írott' | 'krónika' | 'lelet' | 'monda' | 'kép'
   S.wrap(s, maxW, font)      sortörés L.measure-rel → sorok tömbje
   S.gap(ev, wr)              eltelt évek az esemény(tartomány) és a keletkezés között → {lo, hi, s: '528–531'}
   S.card(q) → {x, y, w, h}   „Honnan tudjuk?” kártya, a magassága a tartalomhoz igazodik:
       q = {x, y, w, a, layer, icon, type: {s, k}, title: {s, k},
            rows: [{l: {s, k}, v: {s, k}, c?}],                         // „Ki írta?”, „Mikor?” …
            line: {T,                                                   // mini időszalag (TortTimeline T)
                   ev: {a0, a1, name: {s, k}, sub?: {s, k}, layer, est, dateK},  // az esemény (csillagászati évek)
                   wr: {a, name?: {s, k}, dateK},                       // a forrás keletkezése
                   mark?: {a, name: {s, k}},                           // pl. egy számított kezdőpont
                   gap: {s: '# évvel később', k}}}
   ──────────────────────────────────────────────────────────────────────────────── */
const TortSource = (() => {
  const F = Lesson.FONTS, U = Lesson.U, TAU = Math.PI * 2;
  const INK = '#1c2440', MUT = '#565d72', RED = '#c8401c', TEAL = '#0a6f86', OCHRE = '#8f5a0c', CARD = '#fffaf1', OCHRE_BG = 'rgba(201,150,60,.16)';
  const COL = { 'forrás': TEAL, 'rekonstrukció': INK, 'monda': OCHRE };
  const TAG = { f: F.B, s: 22, w: 700 };
  const STF = { f: F.B, s: 22, w: 600, ls: '1.76px' };

  function create(L, T) {
    const S = { T, COL, STF };
    S.frame = (x, y, w, h, layer, o = {}) => {
      const c = L.ctx, r = layer === 'monda' ? 18 : 10;
      c.save();
      if (o.shadow !== false) { c.shadowColor = 'rgba(70,50,20,.16)'; c.shadowBlur = 14; c.shadowOffsetY = 3; }
      c.beginPath(); c.roundRect(x, y, w, h, r); c.fillStyle = CARD; c.fill();
      c.shadowColor = 'transparent';
      if (layer === 'monda') { c.fillStyle = OCHRE_BG; c.fill(); }
      c.lineWidth = layer ? 2.5 : 2; c.strokeStyle = layer ? COL[layer] : U.rgba(INK, .35);
      if (layer === 'rekonstrukció') c.setLineDash([8, 6]);
      c.stroke(); c.setLineDash([]);
      if (layer === 'monda') {          // csigás sarkok
        c.lineWidth = 2; c.strokeStyle = OCHRE;
        [[x + 9, y + 9, 0], [x + w - 9, y + 9, 1], [x + w - 9, y + h - 9, 2], [x + 9, y + h - 9, 3]].forEach(([cx, cy, q]) => {
          c.beginPath(); c.arc(cx, cy, 4.5, q * Math.PI / 2 + Math.PI, q * Math.PI / 2 + Math.PI * 2.4); c.stroke();
        });
      }
      if (layer && o.tag !== false && T[layer]) {
        const t = T[layer], tw = L.measure(t.s, TAG).w, tx0 = x + (layer === 'monda' ? 22 : 16);
        c.fillStyle = CARD; c.fillRect(tx0 - 7, y - 12, tw + 14, 24);
        if (layer === 'monda') { c.fillStyle = OCHRE_BG; c.fillRect(tx0 - 7, y - 12, tw + 14, 24); }
        L.tx(t.s, tx0, y + 1, Object.assign({}, TAG, { b: 'middle', c: COL[layer], k: t.k }));
      }
      c.restore();
    };
    S.stampSize = (kind) => { const m = L.measure(T[kind].s, STF); return { w: m.w + 18, h: 22 * 1.3 + 9 * .8 }; };
    S.stamp = (kind, x, y) => {
      const c = L.ctx, col = kind === 'becslés' ? OCHRE : MUT;
      c.save(); c.translate(x, y); c.rotate(-3 * Math.PI / 180);
      const b = L.pill(T[kind].s, 0, 0, Object.assign({}, STF, { bg: CARD, bd: col, bw: 2, c: col, pad: 9, r: 6, k: T[kind].k }));
      c.restore(); return b;
    };
    S.icon = (type, cx, cy, s, col) => {
      const c = L.ctx; c.save(); c.translate(cx, cy); c.lineWidth = 2.5; c.strokeStyle = col; c.lineJoin = 'round'; c.lineCap = 'round';
      const w = s * .62, h = s * .8;
      if (type === 'írott') {          // lap behajtott sarokkal, sorokkal
        const f = s * .17;
        c.beginPath(); c.moveTo(-w / 2, -h / 2); c.lineTo(w / 2 - f, -h / 2); c.lineTo(w / 2, -h / 2 + f); c.lineTo(w / 2, h / 2); c.lineTo(-w / 2, h / 2); c.closePath();
        c.fillStyle = '#f4e9d0'; c.fill(); c.stroke();
        c.beginPath(); c.moveTo(w / 2 - f, -h / 2); c.lineTo(w / 2 - f, -h / 2 + f); c.lineTo(w / 2, -h / 2 + f); c.stroke();
        c.lineWidth = 2; for (let i = 0; i < 4; i++) { const yy = -h / 2 + s * .3 + i * s * .12; c.beginPath(); c.moveTo(-w / 2 + s * .1, yy); c.lineTo(w / 2 - s * .1 - (i === 3 ? s * .14 : 0), yy); c.stroke(); }
      } else if (type === 'krónika') { // nyitott könyv
        c.beginPath(); c.moveTo(0, -h * .32); c.quadraticCurveTo(-w * .4, -h * .48, -w * .85, -h * .36); c.lineTo(-w * .85, h * .4); c.quadraticCurveTo(-w * .4, h * .28, 0, h * .44);
        c.quadraticCurveTo(w * .4, h * .28, w * .85, h * .4); c.lineTo(w * .85, -h * .36); c.quadraticCurveTo(w * .4, -h * .48, 0, -h * .32); c.closePath();
        c.fillStyle = '#f4e9d0'; c.fill(); c.stroke(); c.beginPath(); c.moveTo(0, -h * .32); c.lineTo(0, h * .44); c.stroke();
      } else if (type === 'lelet') {   // korsó
        c.beginPath(); c.moveTo(-w * .18, -h / 2); c.lineTo(w * .18, -h / 2); c.quadraticCurveTo(w * .12, -h * .25, w * .45, 0); c.quadraticCurveTo(w * .5, h * .35, w * .15, h / 2);
        c.lineTo(-w * .15, h / 2); c.quadraticCurveTo(-w * .5, h * .35, -w * .45, 0); c.quadraticCurveTo(-w * .12, -h * .25, -w * .18, -h / 2); c.closePath();
        c.fillStyle = '#e8c9a0'; c.fill(); c.stroke();
      } else if (type === 'monda') {   // beszédbuborék
        c.beginPath(); c.roundRect(-w * .7, -h * .42, w * 1.4, h * .66, 12); c.moveTo(-w * .2, h * .24); c.lineTo(-w * .4, h * .5); c.lineTo(w * .05, h * .24);
        c.fillStyle = OCHRE_BG; c.fill(); c.stroke();
        c.fillStyle = col; [-1, 0, 1].forEach((i) => { c.beginPath(); c.arc(i * w * .32, -h * .09, 3.5, 0, TAU); c.fill(); });
      } else {                         // 'kép': keret hegyekkel
        c.beginPath(); c.rect(-w * .7, -h * .42, w * 1.4, h * .84); c.fillStyle = '#f4e9d0'; c.fill(); c.stroke();
        c.beginPath(); c.moveTo(-w * .6, h * .32); c.lineTo(-w * .15, -h * .08); c.lineTo(w * .1, h * .14); c.lineTo(w * .3, -h * .02); c.lineTo(w * .6, h * .32); c.stroke();
      }
      c.restore();
    };
    S.wrap = (s, maxW, f) => {
      const out = []; let line = '';
      for (const word of String(s).split(' ')) {
        const t = line ? line + ' ' + word : word;
        if (line && L.measure(t, f).w > maxW) { out.push(line); line = word; } else line = t;
      }
      if (line) out.push(line);
      return out;
    };
    S.gap = (ev, wr) => {
      const lo = wr.a - Math.max(ev.a0, ev.a1 == null ? ev.a0 : ev.a1), hi = wr.a - Math.min(ev.a0, ev.a1 == null ? ev.a0 : ev.a1);
      return { lo, hi, s: lo === hi ? U.fmt(lo) : U.fmt(lo) + '–' + U.fmt(hi) };
    };
    S.card = (q) => {
      const c = L.ctx, A = q.a == null ? 1 : q.a; if (A <= .01) return null;
      const Yt = TortTimeline.Y, pad = 30, x = q.x, y = q.y, w = q.w, col = COL[q.layer] || INK;
      const LF = { f: F.B, s: 22, w: 700 }, VF = { f: F.B, s: 26, w: 500 };
      const lw = Math.max(...q.rows.map((r) => L.measure(r.l.s, LF).w)) + 26, vw = w - pad * 2 - lw;
      const rows = q.rows.map((r) => ({ r, lines: S.wrap(r.v.s, vw, VF) }));
      const head = 116, lineH = 34, gapR = 18, hLine = q.line ? 226 : 0;
      const h = head + 26 + rows.reduce((s, r) => s + r.lines.length * lineH + gapR, 0) + hLine;
      c.save(); c.globalAlpha *= A;
      S.frame(x, y, w, h, q.layer);
      S.icon(q.icon, x + pad + 30, y + pad + 34, 62, col);
      L.tx(q.type.s, x + pad + 84, y + pad + 22, Object.assign({}, LF, { c: col, k: q.type.k }));
      L.tx(q.title.s, x + pad + 84, y + pad + 64, { f: F.D, s: 36, w: 560, c: INK, k: q.title.k, max: w - pad * 2 - 84 });
      let yy = y + head + 26;
      for (const { r, lines } of rows) {
        L.tx(r.l.s, x + pad, yy, Object.assign({}, LF, { c: MUT, k: r.l.k }));
        lines.forEach((ln, i) => L.tx(ln, x + pad + lw, yy + i * lineH, Object.assign({}, VF, { c: r.c || INK, k: r.v.k })));
        yy += lines.length * lineH + gapR;
      }
      if (q.line) {
        c.strokeStyle = U.rgba(INK, .16); c.lineWidth = 2; c.beginPath(); c.moveTo(x + pad, yy - 10); c.lineTo(x + w - pad, yy - 10); c.stroke();
        drawLine(q.line, x + pad + 10, yy, w - pad * 2 - 20);
      }
      c.restore();
      return { x, y, w, h };
    };

/* ══════════ ADATOK (ENSZ WPP 2024, shared/foldrajz/korfa-wpp2024.js) ══════════ */
const LOCS = ['NGA', 'IND', 'CHN', 'JPN', 'HUN', 'WLD'];
const LOCK = { NGA: 'Nigéria', IND: 'India', CHN: 'Kína', JPN: 'Japán', HUN: 'Magyarország', WLD: 'Világ' };   // → .md felirat-kulcsok
const Y0 = 1950, Y1 = 2100, YRS = []; for (let y = Y0; y <= Y1; y++) YRS.push(y);
const D = {}; let KFD, PY, EST, NG = 21;
const d1 = (a) => { let v = 0; return a.map((x) => (v += x)); };
function loadData() {
  KFD = window.FOLD_KORFA; PY = KFD.years; EST = KFD.estLast; NG = KFD.ages.length;
  for (const loc of LOCS) {
    const t = KFD.tot[loc], q = { tot: d1(t.med.v), lowY0: t.low.y0, low: d1(t.low.v), high: d1(t.high.v), ind: {}, pyr: [] };
    for (const k in KFD.indMeta) { const a = KFD.ind[loc][k]; q.ind[k] = a ? d1(a).map((v) => v / KFD.indMeta[k][1]) : null; }
    const m = KFD.pyr[loc].m, f = KFD.pyr[loc].f;
    for (let i = 0; i < PY.length; i++) q.pyr.push({ m: m.slice(i * NG, i * NG + NG).map((v) => v / KFD.k), f: f.slice(i * NG, i * NG + NG).map((v) => v / KFD.k) });
    q.pyrPct = q.pyr.map((p) => { const s = p.m.reduce((a, b) => a + b, 0) + p.f.reduce((a, b) => a + b, 0); return { m: p.m.map((v) => v / s * 100), f: p.f.map((v) => v / s * 100) }; });
    D[loc] = q;
  }
}
const totAt = (loc, y) => FC.interp(YRS, D[loc].tot, y);
const indAt = (loc, k, y) => FC.interp(YRS, D[loc].ind[k], y);
const snapI = (y) => PY.indexOf(y);
const ageLab = (g) => KFD.ages[g];
let WA0 = 3, WA1 = 12, OLD0 = 13;          // munkaképes kor: korcsoport-indexek (a .md „munkaképes kor” adatából)
function support(p) { let w = 0, o = 0; for (let g = 0; g < NG; g++) { const s = p.m[g] + p.f[g]; if (g >= WA0 && g <= WA1) w += s; else if (g >= OLD0) o += s; } return w / o; }
const SUP = {};          // évenkénti (interpolált) eltartási arány: 5 évenkénti pillanatképekből
function supAt(loc, y) { return FC.interp(PY, SUP[loc], y); }

/* ══════════ 2. lépés: népesedési átmenet ══════════ */
const s2 = { loc: 'NGA', prev: 'NGA', t0: -10 };
let CM, CR, MOD2;
function buildModel2() {          /* tankönyvi, idealizált átmenet (modell): 4 szakasz, x = 0…100 */

    xs.push(x); br.push(b); dr.push(d); P *= Math.exp((b - d) / 1000 * 2.2); pop.push(P);
  }
  const pm = Math.max(...pop); MOD2 = { xs, br, dr, pop: pop.map((v) => v / pm * 46), B, C: Cc, D: Dd };
}

function lifeTable(e0) {     /* Gompertz–Makeham-halandóság, a B paramétert a várható élettartamhoz illesztjük */

    CC = FC.create(L, { x: 800, y: 690, w: 500, h: 240, xs: { min: 1950, max: 2100, step: 50 }, ys: { min: -.5, max: 2.5, ticks: [0, 1, 2] } });
    const mk = ['1 milliárd', '2 milliárd', '3 milliárd', '4 milliárd', '5 milliárd', '6 milliárd', '7 milliárd', '8 milliárd'];
    MILE = mk.map((k, i) => { const d = L.dat(k); return { k, yr: d.t === 'date' ? d.a : d.v, s: String(d.t === 'date' ? d.ymd[0] : d.v), est: !!d.est, proj: false, n: i + 1 }; });
    const bnS = D.WLD.tot.map((v) => v / 1e6);
    for (const n of [9, 10]) { const y = FC.cross(YRS, bnS, n); MILE.push({ k: 'korfa adatkészlet', yr: y, s: String(Math.round(y)), proj: true, n }); }
    GAPS = []; for (let i = 1; i < MILE.length; i++) GAPS.push({ v: Number(MILE[i].s) - Number(MILE[i - 1].s),   // a kiírt évek különbsége (a tanuló fejben ellenőrizheti)
      yr: MILE[i].yr, proj: MILE[i].proj, k: MILE[i].k === 'korfa adatkészlet' ? 'korfa adatkészlet' : [MILE[i].k, MILE[i - 1].k] });
    GAPS.forEach((g) => { g.v = Math.round(g.v); });
    /* 2. lépés */
    buildModel2();
    CM = FC.create(L, { x: 150, y: 135, w: 1150, h: 215, xs: { min: 0, max: 100, ticks: [] }, ys: { min: 0, max: 50, ticks: [] }, y2: { min: 0, max: 50, ticks: [] } });
    CR = FC.create(L, { x: 150, y: 575, w: 1150, h: 330, xs: { min: Y0, max: Y1, step: 25 }, ys: { min: 0, max: 55, step: 10 } });
    /* 5–8. lépés */
    C5 = FC.create(L, { x: 905, y: 180, w: 400, h: 240, xs: { min: Y0, max: Y1, ticks: [1950, 2000, 2050, 2100] }, ys: { min: 7, max: 11, step: 1 } });
    MOD.lt = lifeTable(N('modell várható élettartama')); MOD.srb = L.dat('fiúk aránya születéskor').v;
    C6 = FC.create(L, { x: 760, y: 190, w: 540, h: 440, xs: { min: 0, max: 100, step: 25 }, ys: { min: .1, max: 100, log: true, minor: true } });
    C7 = FC.create(L, { x: 120, y: 140, w: 960, h: 480, xs: { min: Y0, max: Y1, step: 25 }, ys: { min: .8, max: 30, log: true, ticks: [1, 2, 5, 10, 20] } });
    const us = L.dat('városlakók aránya'); URB = { x: us.x, y: us.y };
    C8 = FC.create(L, { x: 140, y: 150, w: 760, h: 500, xs: { min: 1950, max: 2050, step: 25 }, ys: { min: 0, max: 100, step: 25 } });
    run6();

    /* a 3. lépés: rámutatás egy korcsoportra */
    L.stage.addEventListener('pointermove', (e) => { if (L.step !== 2 || !PYR3) return; const p = L.toStage(e); const g = PYR3.hit(p.x, p.y); s3.hover = g; if (g >= 0) s3.sel = g; });

    L.checks = () => {
      const out = [], W = D.WLD, bn = W.tot.map((v) => v / 1e6);
      for (let n = 3; n <= 8; n++) { const y = FC.cross(YRS, bn, n), m = MILE[n - 1].yr; out.push({ name: `${n} milliárd: a WPP-görbe ±1,5 éven belül a .md évétől`, ok: Math.abs(y - m) <= 1.5, got: y, want: m }); }
      const pkD = L.dat('népességcsúcs'); let pi = 0; bn.forEach((v, i) => { if (v > bn[pi]) pi = i; });
      out.push({ name: 'népességcsúcs: év és érték (WPP)', ok: YRS[pi] === pkD.yr && Math.abs(bn[pi] * 1e9 - pkD.v) < 0.06e9, got: [YRS[pi], bn[pi]], want: [pkD.yr, pkD.v] });
      let gi = 0; W.ind.gr.forEach((v, i) => { if (v > W.ind.gr[gi]) gi = i; });
      out.push({ name: 'leggyorsabb növekedés: év és ütem', ok: YRS[gi] === N('leggyorsabb növekedés éve') && Math.abs(W.ind.gr[gi] - N('legnagyobb növekedési ütem')) < .06, got: [YRS[gi], W.ind.gr[gi]], want: [N('leggyorsabb növekedés éve'), N('legnagyobb növekedési ütem')] });
      const md = L.dat('mai növekedési ütem'); out.push({ name: 'mai növekedési ütem', ok: Math.abs(indAt('WLD', 'gr', md.yr) - md.v) < .006, got: indAt('WLD', 'gr', md.yr), want: md.v });
      const wp = L.dat('világ népessége'); out.push({ name: 'világ népessége', ok: Math.abs(totAt('WLD', wp.yr) * 1e3 - wp.v) < .006e9, got: totAt('WLD', wp.yr) * 1e3, want: wp.v });
      const wt = L.dat('világ termékenysége'); out.push({ name: 'világ termékenysége', ok: Math.abs(indAt('WLD', 'tfr', wt.yr) - wt.v) < .006, got: indAt('WLD', 'tfr', wt.yr), want: wt.v });
      out.push({ name: 'előrejelzés kezdete = estLast + 1', ok: N('előrejelzés kezdete') === EST + 1, got: EST + 1, want: N('előrejelzés kezdete') });
      for (const [k, loc, ind, y] of [['Nigéria halálozási aránya 1950', 'NGA', 'cdr', 1950], ['Nigéria halálozási aránya 1990', 'NGA', 'cdr', 1990], ['Nigéria születési aránya 1950', 'NGA', 'cbr', 1950], ['Nigéria születési aránya 1990', 'NGA', 'cbr', 1990]])
        out.push({ name: k, ok: Math.abs(indAt(loc, ind, y) - N(k)) < .06, got: indAt(loc, ind, y), want: N(k) });
      const rb = N('születések 1954-ben'); out.push({ name: 'Ratkó: születések 1954 (WPP vs .md, ±1,5 ezer)', ok: Math.abs(indAt('HUN', 'births', 1954) * 1e3 - rb) < 1500, got: indAt('HUN', 'births', 1954) * 1e3, want: rb });
      const hp = L.dat('magyar népességcsúcs'); let hi = 0; D.HUN.tot.forEach((v, i) => { if (v > D.HUN.tot[hi]) hi = i; });
      out.push({ name: 'Magyarország: csúcs éve és értéke', ok: YRS[hi] === hp.yr && Math.abs(D.HUN.tot[hi] * 1e3 - hp.v) < .06e6, got: [YRS[hi], D.HUN.tot[hi]], want: [hp.yr, hp.v] });
      const fy = N('természetes fogyás kezdete'); out.push({ name: 'természetes fogyás kezdete (WPP)', ok: indAt('HUN', 'births', fy) < indAt('HUN', 'deaths', fy) && indAt('HUN', 'births', fy - 1) > indAt('HUN', 'deaths', fy - 1), got: fy, want: fy });
      for (const [k, loc] of [['Japán eltartási aránya', 'JPN'], ['Nigéria eltartási aránya', 'NGA']]) { const d = L.dat(k); out.push({ name: k, ok: Math.abs(supAt(loc, d.yr) - d.v) < .051 * Math.max(1, d.v / 2), got: supAt(loc, d.yr), want: d.v }); }
      const sp20 = D.WLD.pyr[snapI(2020)]; const ssum = sp20.m.reduce((a, b) => a + b, 0) + sp20.f.reduce((a, b) => a + b, 0);
      out.push({ name: 'korfa összege = össznépesség (világ 2020)', ok: Math.abs(ssum / totAt('WLD', 2020) - 1) < .002, got: ssum, want: totAt('WLD', 2020) });
      const lt = MOD.lt, nrr = N('pótlási szint') / (1 + MOD.srb) * lt.l[28];
      out.push({ name: 'modell: várható élettartam ≈ .md; pótlási szinten NRR ≈ 1', ok: Math.abs(lt.e0 - N('modell várható élettartama')) < .2 && Math.abs(nrr - 1) < .03, got: [lt.e0, nrr], want: [N('modell várható élettartama'), 1] });
      out.push({ name: 'modell: termékenység-megoszlás összege 1', ok: Math.abs(ASFR.reduce((a, b) => a + b, 0) - 1) < 1e-9, got: ASFR.reduce((a, b) => a + b, 0), want: 1 });
      const u0 = URB.y[0], u1 = URB.y[URB.y.length - 1], cr = FC.cross(URB.x, URB.y, 50);
      out.push({ name: 'városi arány: sor ↔ panelszám (1950, 2050), 50 % ≈ 2007', ok: u0 === N('városlakók aránya 1950') && u1 === N('városlakók aránya 2050') && Math.abs(cr - N('városlakók többsége')) <= 1.5, got: [u0, u1, cr], want: [N('városlakók aránya 1950'), N('városlakók aránya 2050'), N('városlakók többsége')] });
      const ry = N('korfa éve'); out.push({ name: 'korfa éve pillanatkép', ok: snapI(ry) >= 0 && ry <= EST, got: ry, want: 'PY-ban, ≤ ' + EST });
      return out;
    };
    window.__qaStates = {
      1: [{ name: '1950', set() { s1.from = s1.to = 1950; s1.t0 = -10; s1.dur = .5; } }, { name: '2100', set() { s1.from = s1.to = 2100; s1.t0 = -10; s1.dur = .5; } }],
      2: LOCS.slice(1).map((loc) => ({ name: loc, set() { s2.prev = s2.loc = loc; s2.t0 = -10; } })),
      3: [{ name: 'alap', set() { s3.sel = 0; } }, { name: '100', set() { s3.sel = NG - 1; } }],
      4: [{ name: '1950', set() { s4.from = s4.to = 1950; s4.t0 = -10; } }, { name: '2052', set() { s4.from = s4.to = 2052; s4.t0 = -10; } }, { name: '2100', set() { s4.from = s4.to = 2100; s4.t0 = -10; } }],
      5: [{ name: '1950', set() { s5.from = s5.to = 1950; s5.t0 = -10; } }, { name: '1982', set() { s5.from = s5.to = 1982; s5.t0 = -10; } }, { name: '2100', set() { s5.from = s5.to = 2100; s5.t0 = -10; } }],
      6: [{ name: 'tfr1', set() { s6.tfr = 1; run6(); s6.t0 = -100; } }, { name: 'tfr7', set() { s6.tfr = 7; run6(); s6.t0 = -100; } }, { name: 'nga', set() { s6.loc = 'NGA'; s6.tfr = 2.1; run6(); s6.t0 = -100; } }, { name: 'jpn', set() { s6.loc = 'JPN'; s6.tfr = 2.1; run6(); s6.t0 = -100; } }],
      7: [{ name: 'chn2050', set() { s7.loc = 'CHN'; s7.from = s7.to = 2050; } }, { name: 'nga1950', set() { s7.loc = 'NGA'; s7.from = s7.to = 1950; } }, { name: 'jpn2100', set() { s7.loc = 'JPN'; s7.from = s7.to = 2100; } }],
      8: [{ name: '1950', set() { s8.from = s8.to = 1950; } }, { name: '2050', set() { s8.from = s8.to = 2050; } }],
    };
  },
  draw(Lx) {
    L = Lx; c = L.ctx; GA = 1; background();
    if (L.step >= 0) sT[L.step] = L.st;
    for (let i = 0; i < SCENES.length; i++) {
      const w = clamp(1 - Math.abs(L.sp - i) * 2); if (w <= .005) continue;
      GA = w; c.save(); c.globalAlpha = w; SCENES[i](sT[i], L.step === i); c.restore();
    }
    c.globalAlpha = 1;
  },
});
})();

</script>
