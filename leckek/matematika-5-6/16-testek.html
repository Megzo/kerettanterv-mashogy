/* ── MODUL: Testek (Mat3D) · forrás: matematika-5-6/16-testek, 2026-11-24 · v1.1 (2026-11-24) ──────────────────

   vetített pontokhoz (S.P), így minden felirat .md-kulcsos marad. Lecke-specifikus kódra nem hivatkozik.
   Koordináták: x jobbra, y hátra (a nézőtől el), z fel; az egység tetszőleges (pl. 1 = 1 cm). Színek: '#rrggbb'.
   Állapot: zárt képletű – a hajtogatás t (0..1) fázist kap; a nézet yaw/pitch (fok) + a húzás eltolása (dyaw, dpitch).
   Minden rajzoló save/restore-ral visszaállítja a vászonállapotot. o.a: abszolút átlátszóság (a lecke a saját

   ── Nézet ──
   const S = Mat3D.create(L, {cx, cy, scale (px / egység), yaw = −30, pitch = 25 (fok; 0: szemből, 90: felülről),
                              target: [x, y, z] (ez a világpont kerül a (cx, cy) képpontba), dist = 0 (0: ortografikus;

   S.set({…}) – ugyanezek a mezők (képkockánként hívható, pl. Mat3D.lerpView eredményével)
   S.yaw, S.pitch – a tényleges nézet (alap + húzás) · S.dyaw, S.dpitch – a húzás eltolása
   yaw = 0, pitch = 0: elölnézet · yaw = 0, pitch = 90: felülnézet (elöl lent) · yaw = −90, pitch = 0: jobbról

   S.lam(n) → megvilágítás (−1..1)
   S.drag({rect: [x, y, w, h] (alap: a vizuális terület), k = .45 (fok/px), pitch: [min, max] = [−10, 90],
          yaw: [min, max] (a tényleges yaw korlátja fokban; alap: nincs korlát)}) → true húzás
          közben. Minden képkockán hívd az élő jelenetből; a L.pointer (pressed/down) a dyaw/dpitch-et állítja.
   S.key(e, lépés = 10) → true, ha kezelte (A/D: forgatás, W/S: billentés) · S.reset() · S.save() → {dyaw, dpitch} · S.load(o)
   Mat3D.lerpView(a, b, t) → a két nézet ({yaw, pitch, scale, cx, cy, target}) közti nézet; a yaw a rövidebb úton

   ── Testek ── {v: [[x, y, z]…], f: [[i, j, k…]…] (kívülről nézve pozitív körüljárás – a build igazítja), n (lapnormálisok,
                 kifelé), c (lapközéppontok), e: [{i, j, f: [lapok], soft}] (élek), vf (csúcs → lapjai), kind}
   Mat3D.solid(v, f, {soft(e) → bool, kind}) – tetszőleges konvex poliéder; lágy él: csak kontúrként látszik (henger)
   Mat3D.cuboid(a, b, c, {at: [x, y, z] (a bal-elülső-alsó csúcs), center}) – lapok: 0 alsó, 1 felső, 2 elülső, 3 hátsó,
          4 bal, 5 jobb; csúcsok: 0..3 alul (0 bal-elöl, 1 jobb-elöl, 2 jobb-hátul, 3 bal-hátul), 4..7 fölöttük
   Mat3D.cube(a, o) · Mat3D.prism(n, r, h, {rot (fok), at (az alaplap közepe)}) – szabályos n-szög alapú egyenes hasáb,
          r: körülírt sugár; lapok: 0 alsó, 1 felső, 2 + k oldallapok (a 2. lap néz előre); csúcsok 0..n−1 alul, n..2n−1 fölül
   Mat3D.pyramid(n, r, h, o) – 0 alaplap, 1 + k oldallapok; csúcs n: a gúla csúcsa · Mat3D.cylinder(r, h, {n = 48, at})
   Mat3D.diagonals(sol) → {face: [[i, j]…] (lapátlók), space: [[i, j]…] (testátlók: nem egy lapon levő csúcspárok)}
   Mat3D.move(sol, f(p) → p) – új test a transzformált csúcsokkal
   S.draw(sol, {a, fill: '#hex' | (fi) → '#hex' | null (nincs kitöltés), alpha = 1 (kitöltés; < 1: a hátsó lapok is
          látszanak), shade = .22, stroke, lw = 2.5, hidden: 'dash' | 'solid' | 'none', hiddenA = .6,
          pass: 'all' | 'back' | 'front' (tartály: előbb 'back', közben a tartalom, végül 'front'), skip: [fi] (hiányzó
          lapok, pl. nyitott doboz teteje), hi: {faces: {fi: col | {c, a}}, edges: {ei: col | {c, w, a}},
          verts: {vi: col | {c, r, a, ring}}}}) → {v2: vetített csúcsok, vis: [lap felénk néz], edges: [{ei, e, hidden, show}]}
   S.seg(p, q, {c, w = 3, dash, a}) · S.dot(p, {r = 8, c, a, hollow, ring}) · S.poly(pts, {fill, fa, stroke, w, dash, a})

   ── Háló ──
   const N = Mat3D.net(faces)   faces: [{poly: [[x, y]…] (a síkban, z = 0), parent: j | −1 (gyökér), hp: [[x, y], [x, y]]
          (a csuklóél két végpontja; vagy hinge: [k, k + 1] a poly indexeivel), ang (cél-hajtásszög, rad; alap π/2), col, name}]
          Minden lap a szülőjéhez képest felfelé (+z) hajlik; t = 1-nél a test összezárul a gyökérlapon állva.
   Mat3D.net(faces, {flip: true}) – z-tükrözött háló: a lapok LEFELÉ (−z) hajlanak, a test a gyökérlap alá zárul, így a
          sík háló felső (+z) oldala lesz a test KÜLSEJE (amit síkban a lapra rajzolsz, kívül marad). N.flip = true.
   N.faces · N.maxDepth · N.at(t, {stagger = 0}) → [{i, pts: [[x, y, z]…], n (külső normális), c}]
          (stagger > 0: a gyökérhez közelebbi lapok előbb hajlanak, a mélyebbek később)
   N.map(i, [x, y], t, o) → [x, y, z] – az i. lap egy síkbeli pontjának helye t-ben (felirat, rács, számegyenes a lapon)
   N.box(t, o) → {min, max, c} befoglaló doboz (kamera-célponthoz)
   Mat3D.gridNet(cells, {size = 1, root}) – négyzetekből ([[x, y]…], poliominó); szélességi feszítőfa, a gyökér alapból a
          legkisebb mélységet adó cella → N.grid = {size, root, cells}
   Mat3D.cuboidNet(a, b, c) – kereszt alakú háló; lapok: 0 alsó, 1 elülső, 2 hátsó, 3 bal, 4 jobb, 5 felső (a hátsóhoz
          csatlakozik); a síkban x ∈ [−c; a + c], y ∈ [−c; 2b + c]
   Mat3D.prismNet(n, r, h, {bottom = true, top = true, outside: 'down' | 'up', flip}) – oldallapok szalagja (0..n−1; a
          gyökér a középső) + alaplapok; bottom/top: false → csak a palást („felcsavarás”: a szalag a hasábra tekeredik).
          outside: 'up' (= flip: true): a sík szalag felső oldala kerül KÍVÜLRE (a hasáb a gyökérlap alá hajlik) –
          a szalagra rajzolt számegyenes kívül marad; alap ('down'): a felső oldal befelé hajlik (régi viselkedés).
   Mat3D.pyramidNet(n, r, h) – 0 alaplap + n háromszög (a hajtásszög a lapszögből: π − atan(h / apotéma))
   Mat3D.netCheck(N) → {ok, clash: [[i, j]…] (t = 1-nél azonos helyre kerülő lapok), open: [[[x, y, z]…]…] (gridNet-nél:
          a kocka üresen maradt lapjai), gaps (t = 1-nél nem pontosan két laphoz tartozó élek száma; zárt test: 0)}
   S.fold(N, t, {a, fill: (i) → col (alap: N.faces[i].col), stroke, lw, stagger, alpha, inner = .25 (a belső oldal
          világosabb), flash: {i: 0..1} (piros villanás), flashCol, deco(i, q2d, face) (a lap rajza után, festő-sorrendben)})
          → [{f, q, d}] – a lapok mindkét oldala látszik
   Mat3D.cells(rows) – ['.#..', '####', '.#..'] → [[x, y]…] (a felső sor van hátul) · Mat3D.cubeNets → {ok: [11 háló],
          bad: [néhány nem-háló]} (sorlisták) · Mat3D.polyominoes(n) → az n cellás szabad poliominók (n = 6: 35)
   Mat3D.grid2d(L, cells, x0, yb, cella, {fill, stroke, lw = 2, a}) → doboz – cellák síkban (bélyegkép, nézet);
          [u, v] cella: x0 + u · cella, a sor alja yb − v · cella (v felfelé nő)

   ── Egységkockák ──
   S.voxels(cells, {size = 1, at, fill: col | (cell, i) → col, stroke, lw = 2, a, shade,
          show: (i, cell) → false | null | {off: [dx, dy, dz] (repülés közben), alpha}}) → a kirajzolt elemek
          cells: [[x, y, z]…] egész rácspontok; a két rögzített kocka közti lapot elhagyja, mélység szerint rajzol (ortho)
   Mat3D.fillOrder(a, b, c) → [[x, y, z]…] rétegenként alulról, soronként hátulról előre (feltöltés-animációhoz)
   Mat3D.views(cells) → {front: [[x, z]…], top: [[x, y, db]…] (db: a mezőn álló kockák száma), side: [[y, z]…] (jobbról)}

   v1.1 (2026-11-24): net/prismNet flip (outside: 'up'), S.drag yaw-korlát; a régi hívások változatlanok.
   Színek: Mat3D.COL {ink, mut, red, teal, ochre, card, good, bad} · Mat3D.FACES (világos lapszínek) · Mat3D.mix(a, b, t)
   ─────────────────────────────────────────────────────────────── */
const Mat3D = (() => {
  const D2R = Math.PI / 180, TP = Math.PI * 2;
  const COL = { ink: '#1c2440', mut: '#565d72', red: '#c8401c', teal: '#0a6f86', ochre: '#8f5a0c', card: '#fffaf1', good: '#1d7a45', bad: '#b3261e' };
  const FACES = ['#eaa58c', '#8ec8d5', '#e6c486', '#c6b2da', '#a8c6e8', '#b6d7a6'];
  const cl = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  // ── vektorok ──
  const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]], sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const mul = (a, k) => [a[0] * k, a[1] * k, a[2] * k], dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const len = (a) => Math.hypot(a[0], a[1], a[2]), norm = (a) => { const l = len(a) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
  const lerp3 = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  const centroid = (pts) => { let x = 0, y = 0, z = 0; pts.forEach((p) => { x += p[0]; y += p[1]; z += p[2] || 0; }); return [x / pts.length, y / pts.length, z / pts.length]; };
  function newell(pts) {
    let x = 0, y = 0, z = 0;
    for (let i = 0; i < pts.length; i++) {
      const p = pts[i], q = pts[(i + 1) % pts.length], pz = p[2] || 0, qz = q[2] || 0;
      x += (p[1] - q[1]) * (pz + qz); y += (pz - qz) * (p[0] + q[0]); z += (p[0] - q[0]) * (p[1] + q[1]);
    }
    return norm([x, y, z]);
  }
  const area2 = (poly) => { let s = 0; for (let i = 0; i < poly.length; i++) { const p = poly[i], q = poly[(i + 1) % poly.length]; s += p[0] * q[1] - q[0] * p[1]; } return s / 2; };
  // ── színek ──
  const hx = (h) => { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
  const mix = (a, b, t) => { const p = hx(a), q = hx(b); return '#' + p.map((v, i) => Math.round(v + (q[i] - v) * cl(t)).toString(16).padStart(2, '0')).join(''); };
  const shC = new Map();
  function shade(col, lam, sh) {
    const t = Math.round((1 - sh * (1 - cl(lam))) * 48) / 48, k = col + '|' + t;
    let r = shC.get(k); if (!r) { r = mix(COL.ink, col, t); shC.set(k, r); } return r;
  }
  function path(c, q) { c.beginPath(); q.forEach((p, i) => (i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1]))); c.closePath(); }

  // ── testek ──
  function solid(v, f, o = {}) {
    const S = { v: v.map((p) => p.slice()), f: f.map((a) => a.slice()), n: [], c: [], kind: o.kind || 'test' };
    const cen = centroid(S.v);
    S.f.forEach((fa, i) => {
      const pts = fa.map((k) => S.v[k]); let n = newell(pts); const c = centroid(pts);
      if (dot(n, sub(c, cen)) < 0) { fa.reverse(); n = mul(n, -1); }
      S.n[i] = n; S.c[i] = c;
    });
    const m = new Map(); S.e = []; S.vf = S.v.map(() => []);
    S.f.forEach((fa, i) => fa.forEach((a, k) => {
      S.vf[a].push(i);
      const b = fa[(k + 1) % fa.length], i0 = Math.min(a, b), j0 = Math.max(a, b), key = i0 + ',' + j0;
      let e = m.get(key); if (!e) { e = { i: i0, j: j0, f: [] }; m.set(key, e); S.e.push(e); }
      e.f.push(i);
    }));
    S.e.forEach((e) => { e.soft = !!(o.soft && o.soft(e)); });
    return S;
  }
  function cuboid(a, b, c, o = {}) {
    const p = o.at || (o.center ? [-a / 2, -b / 2, -c / 2] : [0, 0, 0]);
    const v = [[0, 0, 0], [a, 0, 0], [a, b, 0], [0, b, 0], [0, 0, c], [a, 0, c], [a, b, c], [0, b, c]].map((q) => add(q, p));
    return solid(v, [[0, 3, 2, 1], [4, 5, 6, 7], [0, 1, 5, 4], [2, 3, 7, 6], [3, 0, 4, 7], [1, 2, 6, 5]], { kind: o.kind || 'téglatest' });
  }
  const ring = (n, r, rot, at, z) => { const v = []; for (let k = 0; k < n; k++) { const a = -Math.PI / 2 - Math.PI / n + TP * k / n + rot; v.push([at[0] + r * Math.cos(a), at[1] + r * Math.sin(a), at[2] + z]); } return v; };
  function prism(n, r, h, o = {}) {
    const at = o.at || [0, 0, 0], rot = (o.rot || 0) * D2R;
    const v = ring(n, r, rot, at, 0).concat(ring(n, r, rot, at, h)), ks = [...Array(n).keys()];
    const f = [ks.slice().reverse(), ks.map((k) => n + k)];
    ks.forEach((k) => f.push([k, (k + 1) % n, n + (k + 1) % n, n + k]));
    return solid(v, f, { kind: o.kind || 'hasáb', soft: o.soft });
  }
  function pyramid(n, r, h, o = {}) {
    const at = o.at || [0, 0, 0], rot = (o.rot || 0) * D2R, ks = [...Array(n).keys()];
