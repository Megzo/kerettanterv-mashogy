<script>
(function () {
'use strict';
const U = Lesson.U, { clamp, lerp, smooth, out, TAU } = U, fmt = U.fmt;
const F = Lesson.FONTS;

/* ── MODUL: Kifejezésfa (MatExpr) · forrás: matematika-5-6/04-muveleti-sorrend, 2026-11-24 ──────────────────────
   Műveleti sorrend, kifejezésfa, lépésenkénti kiértékelés („a részeredmény felszáll, a kifejezés rövidül”),
   zárójel-áthelyezés / felcserélés áttűnéssel, „sorban számoló” számológép. Pontos (racionális) számolás.
   Függ: shared/lesson.js (L.ctx, L.measure, Lesson.U), shared/matek/mtext.js (MatText.draw/measure, MatQ).

   A fa ugyanaz, mint a build `expr` adattípusáé (L.dat(k).tree; tools/build_lesson.py):
     szám | 'x' | [op, a, b] (op: + − · : / imp) | ['neg', a] | ['()', a] | ['pos', a].
   Levélként (egy számként) kezeli: egész és tizedes szám, ['/', n, d] két egésszel (tört: 1/2),
   ['neg', szám vagy tört] (−5), betű (x; nem számolható ki, a fölötte lévő műveletek is maradnak).
   Nem támogatott (Error): ^, √, |…|, relációk (=, < …).

   MatExpr.parse(s, {vars})      szöveg → fa (a build parse_expr_tree tükörképe; hibánál Error, magyar üzenettel)
   MatExpr.tree(src)             src: fa | expr-adat (L.dat(k)) | szöveg → fa
   MatExpr.str(src)              → '8 − 4 : 2' (a fa szövege, zárójelekkel)
   MatExpr.value(src, vars)      → MatQ (pontos; MatQ.evalExpr) – betűnél vars kell
   MatExpr.steps(src)            a kiértékelés sorrendje a megállapodás szerint (belső zárójel; · : balról jobbra;
                                 + − balról jobbra) – a fa bejárása: bal részfa, jobb részfa, a csúcs
                                 → [{id, op, a, b, r (MatQ), rs (r szövege), s: '4 : 2 = 2'}]
   MatExpr.leftToRight(src)      „sorban számoló” (azonnali végrehajtású) számológép: zárójelet nem ismer, a műveleteket
                                 beütési sorrendben végzi → {v: MatQ, keys: [{key, disp: MatQ, step}]}; key: a szám
                                 szövege, a műveleti jel ('+', '−', '·', ':') vagy '='; disp: a kijelző a gomb után
                                 (műveleti gombnál az addigi eredmény); step: az épp elvégzett {a, op, b, r} (vagy null)
   MatExpr.leftToRightTree(src)  a sorban számoló gép fája: balra dőlő lánc, zárójel NÉLKÜL (a szövege ugyanaz – ez a csapda)
   MatExpr.fmtQ(q, dec)          MatQ → szöveg: egész U.fmt-vel ('12 000'), különben '1/3'; dec: véges tizedes tört '0,75'

   const E = MatExpr.create(L, src, o)
       o: x, y   a szöveg középpontja (align 'left': bal széle) és alapvonala      s: betűméret (alap 56; ≥ 46, ha
          tört is lehet a csúcsban: a csúcs felirata 0,6 · s, annak törtje 0,8×)  dy: szintköz (1,5 · s), r: csúcs (0,46 · s)
          k: md-kulcs (QA/review)   col, rc: tinta- és eredményszín   align: 'center' | 'left'
          like: másik E – az egyező számok/jelek azonosítója közös (felcserélésnél a számok a helyükre csúsznak)
          ids: kézi azonosítók a zárójel nélküli jelekhez balról (pl. ['v0', 'v1', …]: azonos szerkezetű változatok)
          fmt(q) → szöveg (alap: MatExpr.fmtQ; ha a kifejezésben tizedes tört van, az eredmény is tizedes)
       E.n, E.steps, E.value (MatQ | null), E.tree
       E.text(k)        a k. állapot (k lépés után) szövege: '8 − 2'
       E.lay(k)         a k. állapot elrendezése: {ts: [{id, s, kind, x, w, asc, desc, top}], tok, nodes: {id: {x, y, l, op,
                        kids}}, edges, w, x0, top (a fa teteje), maxL}
       E.span(k)        a k. lépésben kiszámolt rész x-tartománya a k. állapot szövegében → [x0, x1]
       E.draw({k, t, a, tree, text, hi, qa, col})
                        a k. állapot; t ∈ [0, 1] a k+1. lépés: 0–0,45 a két szám felszáll a csúcsba, 0,45–0,6 az eredmény a
                        csúcsban, 0,6–1 leszáll a szövegbe, a többi a helyére csúszik (a fa is átrendeződik).
                        tree/text: átlátszóság 0–1 (tree: 0 → csak a szöveg); hi: a következő csúcs kiemelése; qa: false
       E.line(k, x, y, {align, a, under, col})  csak a k. állapot szövege (x, y)-ba tolva; under (0–1): aláhúzás a
                        k. lépés része alatt → {x0, x1, sx0, sx1}
       E.result({a, tree, text, qa})  a teljes (0.) fa, minden csúcsban a saját részeredménye („kitöltött fa”)
       E.at(time, {t0, dur, gap}) → {k, t}   automatikus lejátszás (alap: dur 1,4 s, gap 0,3 s);  E.end(o) → a vége
   MatExpr.morph(L, E1, E2, t, {a, tree, text, arc, qa})   E1 0. állapota → E2 0. állapota: az azonos azonosítójú jelek
                        a helyükre csúsznak (arc: ívben, felcserélésnél), a fa átrendeződik, a többi elhalványul/megjelenik
   ──────────────────────────────────────────────────────────────────────────────────────────────────────────── */
const MatExpr = (() => {
  const INK = '#1c2440', MUT = '#565d72', RED = '#c8401c', CARD = '#fffaf1', RESBG = '#fbe6dc';
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v)), lerp = (a, b, t) => a + (b - a) * t;
  const sm = (t) => { t = clamp(t); return t * t * (3 - 2 * t); };
  const FM = () => Lesson.FONTS.M;
  let FRESH = 0;

  /* ── elemzés (a tools/build_lesson.py parse_expr_tree tükörképe) ── */
  const TOK = /\s*(?:(\d+(?:,\d+)?)|(<=>|<=|>=|!=|[=<>≤≥≠])|([+\-−·*×:/^()|√])|([A-Za-z])|(\S))/y;
  function parse(src, o = {}) {
    const vars = o.vars || ['x'], toks = [];
    let pos = 0; src = String(src);
    while (pos < src.length) {
      TOK.lastIndex = pos; const m = TOK.exec(src);
      if (!m || TOK.lastIndex === pos) break;
      pos = TOK.lastIndex;
      const [, num, rel, op, v, bad] = m;
      if (bad) throw new Error('MatExpr: ismeretlen jel „' + bad + '” a kifejezésben');
      if (num) toks.push(['n', num]);
      else if (rel) toks.push(['r', { '<=': '≤', '>=': '≥', '!=': '≠' }[rel] || rel]);
      else if (op) toks.push(['o', { '-': '−', '*': '·', '×': '·' }[op] || op]);
      else { if (!vars.includes(v)) throw new Error('MatExpr: „' + v + '” betű nem szerepel a változók között'); toks.push(['v', v]); }
    }
    if (!toks.length) throw new Error('MatExpr: üres kifejezés');
    let i = 0;
    const peek = () => toks[i] || [null, null], eat = () => toks[i++];
    const err = (m) => { throw new Error('MatExpr: ' + m); };
    const num = (t) => t.includes(',') ? Number(t.replace(',', '.')) : parseInt(t, 10);
    function atom() {
      const [t, v] = peek();
      if (t === 'n') { eat(); return num(v); }
      if (t === 'v') { eat(); return v; }
      if (v === '(') { eat(); const e = summ(); if (peek()[1] !== ')') err('páratlan zárójel: hiányzik egy „)”'); eat(); return ['()', e]; }
      if (v === '|') { eat(); const e = summ(); if (peek()[1] !== '|') err('lezáratlan abszolútérték-jel |'); eat(); return ['abs', e]; }
      if (v === '√') { eat(); return ['√', atom()]; }
      if (t === null) err('a kifejezés hiányosan végződik');
      return err(t === 'o' ? 'két műveleti jel egymás után („' + v + '”)' : 'váratlan „' + v + '”');
    }
    function power() { const a = atom(); if (peek()[1] === '^') { eat(); return ['^', a, unary()]; } return a; }
    function unary() { const [t, v] = peek(); if (t === 'o' && (v === '+' || v === '−')) { eat(); return [v === '−' ? 'neg' : 'pos', unary()]; } return power(); }
    function term() {
      let a = unary();
      for (;;) {
        const [t, v] = peek();
        if (t === 'o' && (v === '·' || v === ':' || v === '/')) { eat(); a = [v, a, unary()]; }
        else if (t === 'v' || v === '(' || v === '√') a = ['imp', a, unary()];
        else if (t === 'n') err('hiányzó műveleti jel két szám között');
        else return a;
      }
    }
    function summ() { let a = term(); while (peek()[0] === 'o' && (peek()[1] === '+' || peek()[1] === '−')) { const v = eat()[1]; a = [v, a, term()]; } return a; }
    let e = summ();
    if (peek()[0] === 'r') { const r = eat()[1]; e = [r, e, summ()]; if (peek()[0] === 'r') err('csak egy reláció állhat a kifejezésben'); }
    if (i < toks.length) err('váratlan „' + toks[i][1] + '”' + (toks[i][1] === ')' ? ' (páratlan zárójel)' : ''));
    return e;
  }
  function tree(src, o) {
    if (src == null) throw new Error('MatExpr: nincs kifejezés');
    if (typeof src === 'string') return parse(src, o);
    if (src.t === 'expr') return src.tree;
    return src;
  }

  /* ── számok ── */
  const fmtNum = (v) => Lesson.U.fmt(v, (String(v).split('.')[1] || '').length);
  const fmtQ = (q, dec) => {
    if (q.d === 1) return Lesson.U.fmt(q.n);
    if (dec) { const d = q.dec(); if (typeof d === 'string') return d; }
    return q.str();
  };
  const isFracLit = (e) => Array.isArray(e) && e[0] === '/' && Number.isInteger(e[1]) && Number.isInteger(e[2]) && e[1] >= 0 && e[2] > 0;
  const isLit = (e) => typeof e === 'number' || isFracLit(e) || Array.isArray(e) && e[0] === 'neg' && (typeof e[1] === 'number' || isFracLit(e[1]));
  const litQ = (e) => typeof e === 'number' ? MatQ.fromNumber(e) : e[0] === '/' ? MatQ(e[1], e[2]) : litQ(e[1]).neg();
  const litS = (e) => typeof e === 'number' ? fmtNum(e) : e[0] === '/' ? e[1] + '/' + e[2] : '−' + litS(e[1]);
  const BIN = new Set(['+', '−', '·', ':', '/', 'imp']);
  const SYM = { imp: '·' };
  function calc(op, a, b) {
    switch (op) {
      case '+': return a.add(b);
      case '−': return b ? a.sub(b) : a.neg();
      case '·': case 'imp': return a.mul(b);
      case ':': case '/': return a.div(b);
    }
    throw new Error('MatExpr: ismeretlen művelet ' + op);
  }

  /* ── belső fa: {t: 'leaf', kind: 'num'|'var'|'res', q, s, id} · {t: 'op', op, id, a, b} · {t: 'neg', op: '−', id, a} · {t: 'par', a} ── */
  function build(fa) {
    let n = 0;
    const go = (e) => {
      if (isLit(e)) return { t: 'leaf', kind: 'num', q: litQ(e), s: litS(e), id: n++ };
      if (typeof e === 'string') return { t: 'leaf', kind: 'var', q: null, s: e, id: n++ };
      if (!Array.isArray(e)) throw new Error('MatExpr: hibás fa');
      const op = e[0];
      if (op === '()') return { t: 'par', a: go(e[1]) };
      if (op === 'pos') return go(e[1]);
      if (op === 'neg') { const id = n++; return { t: 'neg', op: '−', id, a: go(e[1]) }; }
      if (BIN.has(op)) { const a = go(e[1]), id = n++, b = go(e[2]); return { t: 'op', op, id, a, b }; }
      throw new Error('MatExpr: nem támogatott művelet: ' + op + ' (csak + − · : / és zárójel)');
    };
    return go(fa);
  }
  const un = (n) => n.t === 'par' ? un(n.a) : n;
  const isVal = (n) => n.t === 'leaf' && !!n.q;
  function findRed(n) {
    if (n.t === 'leaf') return null;
    if (n.t === 'par') return findRed(n.a);
    const r = findRed(n.a) || (n.b ? findRed(n.b) : null);
    if (r) return r;
    return isVal(un(n.a)) && (!n.b || isVal(un(n.b))) ? n : null;
  }
  function repl(n, id, leaf) {
    if (n.t !== 'leaf' && n.t !== 'par' && n.id === id) return leaf;
    if (n.t === 'leaf') return n;
    if (n.t === 'par') return { t: 'par', a: repl(n.a, id, leaf) };
    return Object.assign({}, n, { a: repl(n.a, id, leaf), b: n.b && repl(n.b, id, leaf) });
  }
  // a kiszámolt levél körüli zárójel elmarad, ha nemnegatív, vagy a gyökérben / bal oldalon áll
  function tidy(n, ctx) {
    if (n.t === 'leaf') return n;
    if (n.t === 'par') {
      const a = tidy(n.a, 'root');
      if (a.t === 'leaf' && a.kind === 'res' && (a.q.n >= 0 || ctx !== 'right')) return a;
      return { t: 'par', a };
    }
    if (n.t === 'neg') return Object.assign({}, n, { a: tidy(n.a, 'right') });
    return Object.assign({}, n, { a: tidy(n.a, 'left'), b: tidy(n.b, 'right') });
  }
  function reduceAll(root, fmt) {
    const states = [root], steps = [];
    const qs = (q) => q.n < 0 ? '(' + fmt(q) + ')' : fmt(q);
    let cur = root;
    for (let guard = 0; guard < 200; guard++) {
      const N = findRed(cur); if (!N) break;
      const A = un(N.a).q, B = N.b ? un(N.b).q : null, r = calc(N.op, A, B), rs = fmt(r);
      cur = tidy(repl(cur, N.id, { t: 'leaf', kind: 'res', q: r, s: rs, id: N.id }), 'root');
      states.push(cur);
      steps.push({ id: N.id, op: N.op, a: A, b: B, r, rs,
        s: B ? fmt(A) + ' ' + (SYM[N.op] || N.op) + ' ' + qs(B) + ' = ' + rs : '−' + qs(A) + ' = ' + rs });
    }
    return { states, steps };
  }
  // tokenek balról jobbra (+ a csúcsok token-tartománya)
  function toks(root) {
    const ts = [], rng = {}, used = new Set();
    const go = (n) => {
      if (n.t === 'leaf') { ts.push({ id: n.id, s: n.s, kind: n.kind }); return; }
      if (n.t === 'par') {
        let pid = String(un(n.a).id); while (used.has(pid)) pid += "'"; used.add(pid);
        ts.push({ id: '(' + pid, s: '(', kind: 'par' }); go(n.a); ts.push({ id: ')' + pid, s: ')', kind: 'par' }); return;
      }
      const i0 = ts.length;
      if (n.t === 'neg') { ts.push({ id: n.id, s: '−', kind: 'neg' }); go(n.a); }
      else { go(n.a); ts.push({ id: n.id, s: n.op === 'imp' ? '' : n.op, kind: 'op' }); go(n.b); }
      rng[n.id] = [i0, ts.length - 1];
    };
    go(root);
    return { ts, rng };
  }
  const textOf = (ts) => ts.map((t) => t.kind === 'op' && t.s ? ' ' + t.s + ' ' : t.s).join('');

  function layout(L, root, o) {
    const { ts, rng } = toks(root), s = o.s, g = s * .32;
    let x = 0;
    for (const t of ts) {
      const isOp = t.kind === 'op';
      if (isOp) x += t.s ? g : s * .05;
      const m = t.s ? MatText.measure(L, t.s, { s, f: FM(), w: 600, math: t.kind === 'var' }) : { w: 0, asc: s * .74, desc: s * .24 };
      t.w = m.w; t.asc = m.asc; t.desc = m.desc; t.x = x + m.w / 2; x += m.w;
      if (isOp) x += t.s ? g : s * .05;
    }
    const W = x, x0 = o.align === 'left' ? o.x : o.x - W / 2, tok = {};
    for (const t of ts) { t.x += x0; t.top = o.y - t.asc - s * .14; tok[t.id] = t; }
    const yLeaf = o.y - s * .88, nodes = {}, edges = [];
    let maxL = 0;
    const go = (n) => {
      if (n.t === 'leaf') return { id: n.id, l: 0 };
      if (n.t === 'par') return go(n.a);
      const A = go(n.a), B = n.b ? go(n.b) : null, l = 1 + Math.max(A.l, B ? B.l : 0);
      nodes[n.id] = { id: n.id, op: SYM[n.op] || n.op, l, kids: B ? [A.id, B.id] : [A.id] };
      edges.push([n.id, A.id]); if (B) edges.push([n.id, B.id]);
      maxL = Math.max(maxL, l);
      return { id: n.id, l };
    };
    go(root);
    const yOf = (l) => yLeaf - o.r - o.dy * .55 - (l - 1) * o.dy;
    for (const id in nodes) { const n = nodes[id]; n.x = tok[id].x; n.y = yOf(n.l); }
    return { ts, tok, rng, nodes, edges, w: W, x0, maxL, top: maxL ? yOf(maxL) - o.r : yLeaf, yLeaf };
  }
