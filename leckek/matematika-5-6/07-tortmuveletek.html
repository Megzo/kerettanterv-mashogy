<script>
(function () {
'use strict';
const U = Lesson.U, { clamp, lerp, smooth, out, inOut, TAU } = U, fmt = U.fmt;
const F = Lesson.FONTS;

/* ── MODUL: Számegyenes (MatLine) · forrás: matematika-5-6/08-tizedes-tortek, 2026-11-23 ──────────────────────
   Terv: pilot/matematika-5-6/terv.md 4. fejezet (API-vázlat) · pilot/matematika-9-10/terv.md 5.1 („MatSzam”).
   Csak a Lesson motorra (L.ctx, L.tx, L.pill, L.measure, L.pointer, L.t, L.stage) és – tört-feliratnál – a
   shared/matek/mtext.js MatText-jére épül. Változtatás nélkül átemelhető (javaslat: shared/matek/line.js).
   Szöveg: {s, k} (szöveg + md-kulcs) vagy sima szöveg (kódban rögzített szám, jel). Minden felirat L.tx / L.pill /
   MatText.draw útján kerül a vászonra (QA, review mód). Az átlátszóság (a) ABSZOLÚT: a hívó szorozza bele a
   jelenet-áttűnést. A modul állapotot nem tart, csak az éppen húzott pontét (zárt képletű rajzhoz jó).

   const nl = MatLine.create(L, o)
     o = {x0, x1, y              a [v0; v1] tartomány két végének x-e és a vonal y-ja (logikai px)
          v0 = 0, v1 = 1         kezdő nézet
          scheme: 'dec'          10-hatvány szintek (1; 0,1; 0,01 …): a sűrűsödő szint fokozatosan tűnik elő
                                 (folytonos zoomhoz); felirat a legfinomabb olyan szinten, ahol elfér
                | '125'          felirat-lépés 1–2–5 · 10^k (ahol elfér), beosztás a következő kisebb 10-hatványon
                | 'fix'          o.step a beosztás, o.major a felirat lépése (alap: step)
          step, major            'fix' lépései;  den: tört-számegyenes (scheme 'fix', step = 1/den, fmt 'frac')
          fmt: 'dec'             tizedes felirat (magyar: 0,25; −3) · 'frac' (n/den, o.reduce: egyszerűsítve; egész
                                 helyén egész) · 'mixed' (vegyes szám) · függvény (v) → szöveg
          pad: false             'dec' + 'fix': minden felirat ugyanannyi tizedesjegyű, mint a major (0,20 … 0,30)
          labelSide: 'down'      'up': a feliratok a vonal fölött (kettős számegyenes felső vonala)
          unit: {s, k}           mértékegység a nyíl után · s: 24 (felirat px) · tick: 22 (fő beosztás px)
          lw: 2.5 · c: tinta · arrow: true · ext: 26 (a vonal túlnyúlása px) · labelDy: 38 · minPx: 7}
     nl.view(v0, v1)             nézet beállítása → nl;  nl.v0, nl.v1, nl.ppu (px / egység)
     nl.lerpView(A, B, t)        nl.view(...MatLine.lerpView(A, B, t))
     nl.x(v) · nl.v(x) · nl.in(v)   érték ↔ x; látszik-e a nézetben
     nl.levelA(step)             egy beosztás-szint láthatósága 0..1 (pl. „most látszanak a századok”)
     nl.ticks()                  → [{v, h, a, la, d, c}] a mostani nézet beosztásai (h magasság, a / la a beosztás /
                                 felirat átlátszósága, d tizedesjegy)
     nl.label(v, d)              egy érték felirata a vonal formátumában
     nl.draw(d)                  d = {a: 1, line: true, ticks: true, labels: true | false | 'ends' | [v…],
                                 hi: [v…] | [{v, c}] (kiemelt beosztás, félkövér színes felirat),
                                 tickA(v), labelA(v) → 0..1 (fokozatos megjelenés), tickC(v) → szín,
                                 labelC(v) → szín, lineT: 0..1 (a vonal kirajzolódása balról)}
     nl.point(v, o) → v          pont; o = {c, r: 11, hollow, a, ring (fényudvar), dy (függőleges eltolás px),
                                 label: {s, k} | szöveg, math (MatText.draw-val, pl. tört), side: 'up' | 'down',
                                 al: 'center' | 'left' | 'right' (a felirat a ponttól balra / jobbra nyúlik),
                                 ldy (a felirat távolsága), pill: true, sz: 26, lc (felirat színe), f (betű),
                                 drag: {id, min, max, snap, track: false, hit: 28, onDrag(v)}}
                                 Húzás: fogantyú r ≥ 11, találati sugár 28 px; track: a vonalra kattintva is odaugrik;
                                 a pont a [min; max]-on marad, snap-re ugrik. Visszaadja a húzás utáni értéket –
                                 a lecke tárolja, és egy L.slider-rel (billentyűvel is) szinkronban tartja.
     nl.jump(v0, v1, t, o)       ugrás-ív v0 → v1 (lépegetés); t 0..1 kirajzolás; o = {c, a, h, down, lw: 3,
                                 arrow: true, gap: 6, label: {s, k} | szöveg, sz: 24}
     nl.span(v0, v1, o)          szakasz / intervallum a vonalon; v0 = −Infinity / v1 = Infinity → félegyenes nyíllal;
                                 o = {c, a, lw: 7, dy: 0, t (kirajzolás 0..1), closed: [true, true] (true teli, false
                                 üres karika, null semmi), alpha: .85}
     nl.mirror(v, t, o) → érték  a v pont tükrözése a 0-ra (ellentett) félköríven; t 0..1; o = {c, a, ghost: true,
                                 r, label}; visszaadja a pont mostani (vetített) értékét
     nl.brace(v0, v1, o)         kapocs a [v0; v1] fölött (o.down: a feliratok alatt); o = {c, a, dy, t,
                                 label: {s, k} | szöveg, math, sz: 26, f}  – távolság, „1 tized”, abszolút érték
     nl.frameBox(v0, v1, o)      → {x0, y0, x1, y1} a szakaszt és két végfeliratát befoglaló doboz
     nl.frame(v0, v1, o)         nagyító keret (o = {c, a, lw: 2.5, fill: .06, h})
   MatLine.lerpView(A, B, t)     két nézet között logaritmikus zoom: a szélesség mértani úton változik, a fixpont
                                 (amely mindkét nézetben ugyanott van) helyben marad → valódi nagyítás.
                                 Egyenlő szélességnél egyenletes eltolás. t-t a hívó simítja (U.inOut).
   MatLine.zoomPair(L, top, bot, v0, v1, t, o)   két szint: keret a felső vonal [v0; v1] szakasza körül, vetítő trapéz
                                 az alsó vonal két végéhez. Az alsót a hívó rajzolja: bot.view(v0, v1); bot.draw(…).
                                 o = {c, a, h, fill}; t 0..1 (0–0,4 a keret, 0,3–1 a trapéz)
   MatLine.double(L, o) → {top, bot, draw(d)}   kettős számegyenes közös x-szel (százalék, mértékegység);
                                 o = {x0, x1, y, gap: 110, top: {create-opciók}, bot: {…}} (a felső felirata fent);
                                 draw({a, links: [v…] (szaggatott összekötő a felső vonal v értékeinél), top: {draw-opciók},
                                 bot: {…}})
   MatLine.parallel(L, o) → {lines, draw(d)}   párhuzamos számegyenesek (törtfal); o = {x0, x1, y0, dy, dens: [2, 3, …],
                                 v1: 1}; draw({a, hi: [[sor, érték]…], c})
   MatLine.decimals(x)           hány tizedesjegy kell x leírásához (0,25 → 2; 3 → 0)
   MatLine.round(v, d = 10)      lebegőpontos zaj nélkül (0,1 + 0,2 → 0,3)
   Nincs benne (még): felcsavarás hasábra (MatLine.wrap – a 03-hoz Mat3D kell), logaritmikus lépték (9–10/04).
   ──────────────────────────────────────────────────────────────────────────────────────────────────────── */
const MatLine = (() => {
  const U = Lesson.U, F = Lesson.FONTS, TAU = Math.PI * 2, clamp = U.clamp, smooth = U.smooth;
  const INK = '#1c2440', MUT = '#565d72', RED = '#c8401c', CARD = '#fffaf1', PAPER = '#f7f1e6';
  const round = (v, d = 10) => (isFinite(v) ? +(+v).toFixed(d) : v);
  const decimals = (x) => {
    x = Math.abs(x);
    for (let d = 0; d < 12; d++) { const m = x * Math.pow(10, d); if (Math.abs(m - Math.round(m)) < 1e-7 * Math.max(1, m)) return d; }
    return 12;
  };
  const TX = (x) => (x == null ? null : typeof x === 'string' || typeof x === 'number' ? { s: String(x) } : x);
  const P10 = (k) => Math.pow(10, k);

  function lerpView(A, B, t) {
    t = clamp(t);
    const wA = A[1] - A[0], wB = B[1] - B[0], cA = (A[0] + A[1]) / 2, cB = (B[0] + B[1]) / 2;
    if (Math.abs(wA - wB) <= 1e-12 * Math.max(Math.abs(wA), Math.abs(wB))) { const m = cA + (cB - cA) * t; return [m - wA / 2, m + wA / 2]; }
    const w = wA * Math.pow(wB / wA, t), m = cA + (cB - cA) * (w - wA) / (wB - wA);
    return [m - w / 2, m + w / 2];
  }

  // ── húzás: képkockánként egyszer frissül (L.t szerint) ──
  const DRAG = { id: null, t: NaN, was: false, pressed: false, hov: '', cur: '' };
  function input(L) {
    if (DRAG.t === L.t) return;
    DRAG.t = L.t;
    const dn = !!L.pointer.down;
    DRAG.pressed = dn && !DRAG.was; DRAG.was = dn;
    if (!dn) DRAG.id = null;
    const want = DRAG.id ? 'grabbing' : DRAG.hov;
    if (want !== DRAG.cur && L.stage) { L.stage.style.cursor = want; DRAG.cur = want; }
    DRAG.hov = '';
  }

  function arrowHead(c, x, y, ang, sz, col) {
    c.save(); c.translate(x, y); c.rotate(ang); c.beginPath();
    c.moveTo(0, 0); c.lineTo(-sz * 1.25, -sz * .62); c.lineTo(-sz * .95, 0); c.lineTo(-sz * 1.25, sz * .62); c.closePath();
    c.fillStyle = col; c.fill(); c.restore();
  }

  function create(L, o = {}) {
    const nl = Object.assign({ x0: 100, x1: 1260, y: 540, v0: 0, v1: 1, scheme: 'dec', fmt: 'dec', s: 24, tick: 22, lw: 2.5,
      c: INK, arrow: true, ext: 26, labelDy: 38, minPx: 7, pad: false, labelSide: 'down', unit: null }, o);
    if (nl.den && !o.step) { nl.scheme = 'fix'; nl.step = 1 / nl.den; if (o.fmt == null) nl.fmt = 'frac'; }
    if (nl.scheme === 'fix' && !nl.major) nl.major = nl.step;
    nl.L = L;
    nl.view = (a, b) => { nl.v0 = a; nl.v1 = b; nl.ppu = (nl.x1 - nl.x0) / (b - a); return nl; };
    nl.lerpView = (A, B, t) => nl.view(...lerpView(A, B, t));
    nl.x = (v) => nl.x0 + (v - nl.v0) * nl.ppu;
    nl.v = (x) => nl.v0 + (x - nl.x0) / nl.ppu;
    nl.in = (v) => { const e = 1e-9 * (nl.v1 - nl.v0); return v >= nl.v0 - e && v <= nl.v1 + e; };
    nl.levelA = (step) => smooth((step * nl.ppu - nl.minPx) / 14);

    nl.label = (v, d) => {
      if (typeof nl.fmt === 'function') return String(nl.fmt(v));
      if (nl.fmt === 'frac' || nl.fmt === 'mixed') {
        const den = nl.den || Math.round(1 / nl.step), n = Math.round(v * den);
        if (n % den === 0 && nl.whole !== false) return U.fmt(n / den);
        let a = n, b = den; if (nl.reduce) { const g = MatQ.gcd(a, b); a /= g; b /= g; }
        if (nl.fmt === 'mixed' && Math.abs(a) > b) return (a < 0 ? '−' : '') + Math.floor(Math.abs(a) / b) + ' ' + (Math.abs(a) % b) + '/' + b;
        return (a < 0 ? '−' : '') + Math.abs(a) + '/' + b;
      }
      return U.fmt(round(v, 12), d == null ? decimals(round(v, 12)) : d);
    };
    const isFrac = () => nl.fmt === 'frac' || nl.fmt === 'mixed';

    // beosztások a mostani nézetben
    nl.ticks = () => {
      const out = [], span = nl.v1 - nl.v0;
      const push = (step, k0, k1, h, a, la, d) => {
        for (let i = k0; i <= k1; i++) out.push({ v: round(i * step, 12), h, a, la, d, i });
      };
      const range = (step) => [Math.ceil(nl.v0 / step - 1e-9), Math.floor(nl.v1 / step + 1e-9)];
      if (nl.scheme === 'fix') {
        const [a0, a1] = range(nl.step), r = Math.round(nl.major / nl.step), dmaj = decimals(nl.major);
        for (let i = a0; i <= a1; i++) {
          const maj = i % r === 0, v = round(i * nl.step, 12);
          out.push({ v, h: maj ? nl.tick : nl.tick * .55, a: 1, la: maj ? 1 : 0, d: nl.pad ? dmaj : decimals(v) });
        }
        return out;
      }
      const kTop = Math.ceil(Math.log10(Math.max(Math.abs(nl.v0), Math.abs(nl.v1), span)) + 1e-9);
      let kMin = kTop; while (kMin > -12 && P10(kMin - 1) * nl.ppu >= nl.minPx) kMin--;
      if (nl.scheme === '125') {
        const lab = [];
        for (let k = kMin; k <= kTop; k++) for (const m of [1, 2, 5]) lab.push(m * P10(k));
        const need = (st) => L.measure(nl.label(nl.v1, decimals(st)), { f: F.M, s: nl.s }).w + 18;
        const ls = lab.find((st) => st * nl.ppu >= need(st)) || lab[lab.length - 1], dl = decimals(ls);
        const [a0, a1] = range(P10(kMin)), r = Math.round(ls / P10(kMin));
        for (let i = a0; i <= a1; i++) { const v = round(i * P10(kMin), 12), maj = i % r === 0; out.push({ v, h: maj ? nl.tick : nl.tick * .55, a: 1, la: maj ? 1 : 0, d: dl }); }
        return out;
      }
      // 'dec': minden 10-hatvány szint, a sűrű szint fokozatosan előtűnik
      const lvl = [];
      for (let k = kMin; k <= kTop; k++) {
        const st = P10(k), px = st * nl.ppu, d = Math.max(0, -k);
        const need = L.measure(nl.label(nl.v1 >= 0 ? nl.v1 : nl.v0, d), { f: F.M, s: nl.s }).w + 14;
        lvl.push({ k, st, px, d, a: smooth((px - nl.minPx) / 14), h: nl.tick * (.35 + .65 * smooth((px - nl.minPx) / 160)),
          la: smooth((px - need) / (need * .25)) });
      }
      const dPad = (lvl.find((l) => l.la > .5) || lvl[lvl.length - 1]).d;
      const [a0, a1] = range(P10(kMin));
      for (let i = a0; i <= a1; i++) {
        let j = 0, n = i; while (j < lvl.length - 1 && n % 10 === 0) { n /= 10; j++; }
        const l = lvl[j];
        out.push({ v: round(i * P10(kMin), 12), h: l.h, a: l.a, la: l.la, d: nl.pad ? dPad : l.d });
      }
      return out;
    };

    function drawLabel(c, v, x, A, txt, col, bold) {
      if (A <= .02) return;
      c.globalAlpha = A;
      const up = nl.labelSide === 'up';
      if (isFrac() && /\//.test(txt)) {
        const m = txt.match(/^(−?)(?:(\d+) )?(\d+)\/(\d+)$/);
        if (m) {
          const y = up ? nl.y - nl.tick / 2 - 8 : nl.y + nl.tick / 2 + 8;
          MatText.frac(L, m[3], m[4], x, y, { s: nl.s * 1.2, a: 'center', b: up ? 'bottom' : 'top', c: col, w: bold ? 700 : 500, whole: m[2], sign: m[1] || undefined });
          return;
        }
      }
      const y = up ? nl.y - nl.tick / 2 - 8 - nl.s * .24 : nl.y + nl.labelDy;
      L.tx(txt, x, y, { f: F.M, s: nl.s, w: bold ? 700 : 500, a: 'center', c: col });
    }

    nl.draw = (d = {}) => {
      input(L);
      const c = L.ctx, A = d.a == null ? 1 : d.a; if (A <= .004) return nl;
      const y = nl.y, lt = d.lineT == null ? 1 : clamp(d.lineT);

      if (fb.d !== D || sb.d !== D) showError('Ellenőrzés: a „… bővítve” alakok nevezője a közös nevező (' + D + ') legyen.');
      MatText.check(L, 'helyes összeg', MatQ(A.n, A.d).add(MatQ(B.n, B.d)));
      const df = MatQ(A.n, A.d).sub(MatQ(B.n, B.d)); MatText.check(L, 'különbség', df.v < 0 ? df.neg() : df); }
    { const f = fracOf('szorzandó tört'), k = num('szorzó'); MatText.check(L, 'szorzat', MatQ(k * f.n, f.d)); MatText.check(L, 'szorzat vegyes alakja', MatQ(k * f.n, f.d)); }
    { const P = fracOf('rész'), Qh = fracOf('hányad'), ts = fracOf('terület szorzat');

      MatText.check(L, 'egyszerűsítve', MatQ(P.n * Qh.n, P.d * Qh.d)); }
    { MatText.check(L, 'első hányados', Qk('első osztandó').div(Qk('első osztó'))); MatText.check(L, 'első osztó reciproka', Qk('első osztó').inv());
      MatText.check(L, 'második hányados', Qk('második osztandó').div(Qk('második osztó')));
      MatText.check(L, 'reciproka', Qk('reciprok példa').inv()); MatText.check(L, 'egész reciproka', Qk('egész reciprok példa').inv());
      if (exDiv(0) < 0 || divIdx(Qk('első osztó')) < 0 || divIdx(Qk('második osztó')) < 0) showError('Ellenőrzés: a két példa osztója legyen a csúszka kínálatában: 1/2, 1/3, 1/4, 1/6, 1/8, 2/3, 3/4, 3/8, 3/2.'); }
    if (E7) { MatText.check(L, 'sorrend eredmény', E7.value); MatText.check(L, 'balról jobbra eredmény', EL7.value); }
    L.checks = checks;
  },
  draw(Lx) {
    L = Lx; c = L.ctx; GA = 1; background();
    const sp = L.sp;
    if (L.step >= 0) sT[L.step] = L.st;
    for (let i = 0; i < SCENES.length; i++) {
      const w = clamp(1 - Math.abs(sp - i) * 2); if (w <= .005) continue;
      GA = w; c.save(); SCENES[i](sT[i], L.step === i); c.restore();
    }
    c.globalAlpha = 1;
  },
});
