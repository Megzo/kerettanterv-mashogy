<script>
(function () {
'use strict';
const U = Lesson.U, { clamp, lerp, smooth, TAU } = U, fmt = U.fmt;
const F = Lesson.FONTS;

/* ── MODUL: Számegyenes (MatLine) · forrás: matematika-5-6/08-tizedes-tortek, 2026-11-23 ──────────────────────
   Terv: pilot/matematika-5-6/terv.md 4. fejezet (API-vázlat) · pilot/matematika-9-10/terv.md 5.1 („MatSzam”).
   Csak a Lesson motorra (L.ctx, L.tx, L.pill, L.measure, L.pointer, L.t, L.stage) és – tört-feliratnál – a
   shared/matek/mtext.js MatText-jére épül. Változtatás nélkül átemelhető (javaslat: shared/matek/line.js).
   Szöveg: {s, k} (szöveg + md-kulcs) vagy sima szöveg (kódban rögzített szám, jel). Minden felirat L.tx / L.pill /
   MatText.draw útján kerül a vászonra (QA, review mód). Az átlátszóság (a) ABSZOLÚT: a hívó szorozza bele a
   jelenet-áttűnést. A modul állapotot nem tart, csak az éppen húzott pontét (zárt képletű rajzhoz jó).

   const nl = MatLine.create(L, o)
     o = {x0, x1, y              a [v0; v1] tartomány két végének x-e és a vonal y-ja (logikai px)
          v0 = 0, v1 = 1         kezdő nézet
          scheme: 'dec'          10-hatvány szintek (1; 0,1; 0,01 …): a sűrűsödő szint fokozatosan tűnik elő
                                 (folytonos zoomhoz); felirat a legfinomabb olyan szinten, ahol elfér
                | '125'          felirat-lépés 1–2–5 · 10^k (ahol elfér), beosztás a következő kisebb 10-hatványon
                | 'fix'          o.step a beosztás, o.major a felirat lépése (alap: step)
          step, major            'fix' lépései;  den: tört-számegyenes (scheme 'fix', step = 1/den, fmt 'frac')
          fmt: 'dec'             tizedes felirat (magyar: 0,25; −3) · 'frac' (n/den, o.reduce: egyszerűsítve; egész
                                 helyén egész) · 'mixed' (vegyes szám) · függvény (v) → szöveg
          pad: false             'dec' + 'fix': minden felirat ugyanannyi tizedesjegyű, mint a major (0,20 … 0,30)
          labelSide: 'down'      'up': a feliratok a vonal fölött (kettős számegyenes felső vonala)
          unit: {s, k}           mértékegység a nyíl után · s: 24 (felirat px) · tick: 22 (fő beosztás px)
          lw: 2.5 · c: tinta · arrow: true · ext: 26 (a vonal túlnyúlása px) · labelDy: 38 · minPx: 7}
     nl.view(v0, v1)             nézet beállítása → nl;  nl.v0, nl.v1, nl.ppu (px / egység)
     nl.lerpView(A, B, t)        nl.view(...MatLine.lerpView(A, B, t))
     nl.x(v) · nl.v(x) · nl.in(v)   érték ↔ x; látszik-e a nézetben
     nl.levelA(step)             egy beosztás-szint láthatósága 0..1 (pl. „most látszanak a századok”)
     nl.ticks()                  → [{v, h, a, la, d, c}] a mostani nézet beosztásai (h magasság, a / la a beosztás /
                                 felirat átlátszósága, d tizedesjegy)
     nl.label(v, d)              egy érték felirata a vonal formátumában
     nl.draw(d)                  d = {a: 1, line: true, ticks: true, labels: true | false | 'ends' | [v…],
                                 hi: [v…] | [{v, c}] (kiemelt beosztás, félkövér színes felirat),
                                 tickA(v), labelA(v) → 0..1 (fokozatos megjelenés), tickC(v) → szín,
                                 labelC(v) → szín, lineT: 0..1 (a vonal kirajzolódása balról)}
     nl.point(v, o) → v          pont; o = {c, r: 11, hollow, a, ring (fényudvar), dy (függőleges eltolás px),
                                 label: {s, k} | szöveg, math (MatText.draw-val, pl. tört), side: 'up' | 'down',
                                 al: 'center' | 'left' | 'right' (a felirat a ponttól balra / jobbra nyúlik),
                                 ldy (a felirat távolsága), pill: true, sz: 26, lc (felirat színe), f (betű),
                                 drag: {id, min, max, snap, track: false, hit: 28, onDrag(v)}}
                                 Húzás: fogantyú r ≥ 11, találati sugár 28 px; track: a vonalra kattintva is odaugrik;
                                 a pont a [min; max]-on marad, snap-re ugrik. Visszaadja a húzás utáni értéket –
                                 a lecke tárolja, és egy L.slider-rel (billentyűvel is) szinkronban tartja.
     nl.jump(v0, v1, t, o)       ugrás-ív v0 → v1 (lépegetés); t 0..1 kirajzolás; o = {c, a, h, down, lw: 3,
                                 arrow: true, gap: 6, label: {s, k} | szöveg, sz: 24}
     nl.span(v0, v1, o)          szakasz / intervallum a vonalon; v0 = −Infinity / v1 = Infinity → félegyenes nyíllal;
                                 o = {c, a, lw: 7, dy: 0, t (kirajzolás 0..1), closed: [true, true] (true teli, false
                                 üres karika, null semmi), alpha: .85}
     nl.mirror(v, t, o) → érték  a v pont tükrözése a 0-ra (ellentett) félköríven; t 0..1; o = {c, a, ghost: true,
                                 r, label}; visszaadja a pont mostani (vetített) értékét
     nl.brace(v0, v1, o)         kapocs a [v0; v1] fölött (o.down: a feliratok alatt); o = {c, a, dy, t,
                                 label: {s, k} | szöveg, math, sz: 26, f}  – távolság, „1 tized”, abszolút érték
     nl.frameBox(v0, v1, o)      → {x0, y0, x1, y1} a szakaszt és két végfeliratát befoglaló doboz
     nl.frame(v0, v1, o)         nagyító keret (o = {c, a, lw: 2.5, fill: .06, h})
   MatLine.lerpView(A, B, t)     két nézet között logaritmikus zoom: a szélesség mértani úton változik, a fixpont
                                 (amely mindkét nézetben ugyanott van) helyben marad → valódi nagyítás.
                                 Egyenlő szélességnél egyenletes eltolás. t-t a hívó simítja (U.inOut).
   MatLine.zoomPair(L, top, bot, v0, v1, t, o)   két szint: keret a felső vonal [v0; v1] szakasza körül, vetítő trapéz
                                 az alsó vonal két végéhez. Az alsót a hívó rajzolja: bot.view(v0, v1); bot.draw(…).
                                 o = {c, a, h, fill}; t 0..1 (0–0,4 a keret, 0,3–1 a trapéz)
   MatLine.double(L, o) → {top, bot, draw(d)}   kettős számegyenes közös x-szel (százalék, mértékegység);
                                 o = {x0, x1, y, gap: 110, top: {create-opciók}, bot: {…}} (a felső felirata fent);
                                 draw({a, links: [v…] (szaggatott összekötő a felső vonal v értékeinél), top: {draw-opciók},
                                 bot: {…}})
   MatLine.parallel(L, o) → {lines, draw(d)}   párhuzamos számegyenesek (törtfal); o = {x0, x1, y0, dy, dens: [2, 3, …],
                                 v1: 1}; draw({a, hi: [[sor, érték]…], c})
   MatLine.decimals(x)           hány tizedesjegy kell x leírásához (0,25 → 2; 3 → 0)
   MatLine.round(v, d = 10)      lebegőpontos zaj nélkül (0,1 + 0,2 → 0,3)
   Nincs benne (még): felcsavarás hasábra (MatLine.wrap – a 03-hoz Mat3D kell), logaritmikus lépték (9–10/04).
   ──────────────────────────────────────────────────────────────────────────────────────────────────────── */
const MatLine = (() => {
  const U = Lesson.U, F = Lesson.FONTS, TAU = Math.PI * 2, clamp = U.clamp, smooth = U.smooth;
  const INK = '#1c2440', MUT = '#565d72', RED = '#c8401c', CARD = '#fffaf1', PAPER = '#f7f1e6';
  const round = (v, d = 10) => (isFinite(v) ? +(+v).toFixed(d) : v);
  const decimals = (x) => {
    x = Math.abs(x);
    for (let d = 0; d < 12; d++) { const m = x * Math.pow(10, d); if (Math.abs(m - Math.round(m)) < 1e-7 * Math.max(1, m)) return d; }
    return 12;
  };
  const TX = (x) => (x == null ? null : typeof x === 'string' || typeof x === 'number' ? { s: String(x) } : x);
  const P10 = (k) => Math.pow(10, k);

  function lerpView(A, B, t) {
    t = clamp(t);
    const wA = A[1] - A[0], wB = B[1] - B[0], cA = (A[0] + A[1]) / 2, cB = (B[0] + B[1]) / 2;
    if (Math.abs(wA - wB) <= 1e-12 * Math.max(Math.abs(wA), Math.abs(wB))) { const m = cA + (cB - cA) * t; return [m - wA / 2, m + wA / 2]; }
    const w = wA * Math.pow(wB / wA, t), m = cA + (cB - cA) * (w - wA) / (wB - wA);
    return [m - w / 2, m + w / 2];
  }

  // ── húzás: képkockánként egyszer frissül (L.t szerint) ──
  const DRAG = { id: null, t: NaN, was: false, pressed: false, hov: '', cur: '' };
  function input(L) {
    if (DRAG.t === L.t) return;
    DRAG.t = L.t;
    const dn = !!L.pointer.down;
    DRAG.pressed = dn && !DRAG.was; DRAG.was = dn;
    if (!dn) DRAG.id = null;
    const want = DRAG.id ? 'grabbing' : DRAG.hov;
    if (want !== DRAG.cur && L.stage) { L.stage.style.cursor = want; DRAG.cur = want; }
    DRAG.hov = '';
  }

  function arrowHead(c, x, y, ang, sz, col) {
    c.save(); c.translate(x, y); c.rotate(ang); c.beginPath();
    c.moveTo(0, 0); c.lineTo(-sz * 1.25, -sz * .62); c.lineTo(-sz * .95, 0); c.lineTo(-sz * 1.25, sz * .62); c.closePath();
    c.fillStyle = col; c.fill(); c.restore();
  }

  function create(L, o = {}) {
    const nl = Object.assign({ x0: 100, x1: 1260, y: 540, v0: 0, v1: 1, scheme: 'dec', fmt: 'dec', s: 24, tick: 22, lw: 2.5,
      c: INK, arrow: true, ext: 26, labelDy: 38, minPx: 7, pad: false, labelSide: 'down', unit: null }, o);
    if (nl.den && !o.step) { nl.scheme = 'fix'; nl.step = 1 / nl.den; if (o.fmt == null) nl.fmt = 'frac'; }
    if (nl.scheme === 'fix' && !nl.major) nl.major = nl.step;
    nl.L = L;
    nl.view = (a, b) => { nl.v0 = a; nl.v1 = b; nl.ppu = (nl.x1 - nl.x0) / (b - a); return nl; };
    nl.lerpView = (A, B, t) => nl.view(...lerpView(A, B, t));
    nl.x = (v) => nl.x0 + (v - nl.v0) * nl.ppu;
    nl.v = (x) => nl.v0 + (x - nl.x0) / nl.ppu;
    nl.in = (v) => { const e = 1e-9 * (nl.v1 - nl.v0); return v >= nl.v0 - e && v <= nl.v1 + e; };
    nl.levelA = (step) => smooth((step * nl.ppu - nl.minPx) / 14);

    nl.label = (v, d) => {
      if (typeof nl.fmt === 'function') return String(nl.fmt(v));
      if (nl.fmt === 'frac' || nl.fmt === 'mixed') {
        const den = nl.den || Math.round(1 / nl.step), n = Math.round(v * den);
        if (n % den === 0 && nl.whole !== false) return U.fmt(n / den);
        let a = n, b = den; if (nl.reduce) { const g = MatQ.gcd(a, b); a /= g; b /= g; }
        if (nl.fmt === 'mixed' && Math.abs(a) > b) return (a < 0 ? '−' : '') + Math.floor(Math.abs(a) / b) + ' ' + (Math.abs(a) % b) + '/' + b;
        return (a < 0 ? '−' : '') + Math.abs(a) + '/' + b;
      }
      return U.fmt(round(v, 12), d == null ? decimals(round(v, 12)) : d);
    };
    const isFrac = () => nl.fmt === 'frac' || nl.fmt === 'mixed';

    // beosztások a mostani nézetben
    nl.ticks = () => {
      const out = [], span = nl.v1 - nl.v0;
      const push = (step, k0, k1, h, a, la, d) => {
        for (let i = k0; i <= k1; i++) out.push({ v: round(i * step, 12), h, a, la, d, i });
      };
      const range = (step) => [Math.ceil(nl.v0 / step - 1e-9), Math.floor(nl.v1 / step + 1e-9)];
      if (nl.scheme === 'fix') {
        const [a0, a1] = range(nl.step), r = Math.round(nl.major / nl.step), dmaj = decimals(nl.major);
        for (let i = a0; i <= a1; i++) {
          const maj = i % r === 0, v = round(i * nl.step, 12);
          out.push({ v, h: maj ? nl.tick : nl.tick * .55, a: 1, la: maj ? 1 : 0, d: nl.pad ? dmaj : decimals(v) });
        }
        return out;
      }
      const kTop = Math.ceil(Math.log10(Math.max(Math.abs(nl.v0), Math.abs(nl.v1), span)) + 1e-9);
      let kMin = kTop; while (kMin > -12 && P10(kMin - 1) * nl.ppu >= nl.minPx) kMin--;
      if (nl.scheme === '125') {
        const lab = [];
        for (let k = kMin; k <= kTop; k++) for (const m of [1, 2, 5]) lab.push(m * P10(k));
        const need = (st) => L.measure(nl.label(nl.v1, decimals(st)), { f: F.M, s: nl.s }).w + 18;
        const ls = lab.find((st) => st * nl.ppu >= need(st)) || lab[lab.length - 1], dl = decimals(ls);
        const [a0, a1] = range(P10(kMin)), r = Math.round(ls / P10(kMin));
        for (let i = a0; i <= a1; i++) { const v = round(i * P10(kMin), 12), maj = i % r === 0; out.push({ v, h: maj ? nl.tick : nl.tick * .55, a: 1, la: maj ? 1 : 0, d: dl }); }
        return out;
      }
      // 'dec': minden 10-hatvány szint, a sűrű szint fokozatosan előtűnik
      const lvl = [];
      for (let k = kMin; k <= kTop; k++) {
        const st = P10(k), px = st * nl.ppu, d = Math.max(0, -k);
        const need = L.measure(nl.label(nl.v1 >= 0 ? nl.v1 : nl.v0, d), { f: F.M, s: nl.s }).w + 14;
        lvl.push({ k, st, px, d, a: smooth((px - nl.minPx) / 14), h: nl.tick * (.35 + .65 * smooth((px - nl.minPx) / 160)),
          la: smooth((px - need) / (need * .25)) });
      }
      const dPad = (lvl.find((l) => l.la > .5) || lvl[lvl.length - 1]).d;
      const [a0, a1] = range(P10(kMin));
      for (let i = a0; i <= a1; i++) {
        let j = 0, n = i; while (j < lvl.length - 1 && n % 10 === 0) { n /= 10; j++; }
        const l = lvl[j];
        out.push({ v: round(i * P10(kMin), 12), h: l.h, a: l.a, la: l.la, d: nl.pad ? dPad : l.d });
      }
      return out;
    };

    function drawLabel(c, v, x, A, txt, col, bold) {
      if (A <= .02) return;
      c.globalAlpha = A;
      const up = nl.labelSide === 'up';
      if (isFrac() && /\//.test(txt)) {
        const m = txt.match(/^(−?)(?:(\d+) )?(\d+)\/(\d+)$/);
        if (m) {
          const y = up ? nl.y - nl.tick / 2 - 8 : nl.y + nl.tick / 2 + 8;
          MatText.frac(L, m[3], m[4], x, y, { s: nl.s * 1.2, a: 'center', b: up ? 'bottom' : 'top', c: col, w: bold ? 700 : 500, whole: m[2], sign: m[1] || undefined });
          return;
        }
      }
      const y = up ? nl.y - nl.tick / 2 - 8 - nl.s * .24 : nl.y + nl.labelDy;
      L.tx(txt, x, y, { f: F.M, s: nl.s, w: bold ? 700 : 500, a: 'center', c: col });
    }

    nl.draw = (d = {}) => {
      input(L);
      const c = L.ctx, A = d.a == null ? 1 : d.a; if (A <= .004) return nl;
      const y = nl.y, lt = d.lineT == null ? 1 : clamp(d.lineT);
      const xa = nl.x0 - nl.ext, xe = nl.x1 + nl.ext, xb = xa + (xe - xa) * lt;
      c.save(); c.setLineDash([]); c.lineCap = 'round';
      if (d.line !== false) {
        c.globalAlpha = A; c.strokeStyle = nl.c; c.lineWidth = nl.lw;
        c.beginPath(); c.moveTo(xa, y); c.lineTo(xb, y); c.stroke();
        if (nl.arrow && lt > .98) arrowHead(c, xe + 12, y, 0, 11, nl.c);
        if (nl.unit && lt > .98) { const u = TX(nl.unit); L.tx(u.s, xe + 24, y + 8, { k: u.k, s: nl.s, f: F.B, w: 600, c: nl.c }); }
      }
      const his = (d.hi || []).map((h) => (typeof h === 'object' ? h : { v: h, c: RED }));
      const hiOf = (v) => his.find((h) => Math.abs(h.v - v) <= 1e-9 * Math.max(1, Math.abs(v)));
      const list = Array.isArray(d.labels) ? d.labels : null;
      if (d.ticks !== false) {
        for (const t of nl.ticks()) {
          const x = nl.x(t.v); if (x > xb + .5) continue;
          const h = hiOf(t.v), ta = t.a * (d.tickA ? clamp(d.tickA(t.v)) : 1);
          if (ta > .01) {

/* ── háttér: meleg papír + 40 px-es rács (kockás füzet) ── */
function background() {

  c.fillStyle = g; c.fillRect(0, 0, 1920, 1080);
  c.strokeStyle = 'rgba(28,36,64,.05)'; c.lineWidth = 1; c.beginPath();
  for (let x = 0; x <= 1920; x += 40) { c.moveTo(x + .5, 0); c.lineTo(x + .5, 1080); }
  for (let y = 0; y <= 1080; y += 40) { c.moveTo(0, y + .5); c.lineTo(1920, y + .5); }
  c.stroke();
}
/* hibasáv (mint a MatText.check-é) – a .md adatainak ellenőrzéséhez */
function err(msg) {

  if (!e) { e = document.createElement('div'); e.id = 'lesson-error'; (L.stage || document.body).append(e); }
  if (!e.textContent.includes(msg)) e.textContent += (e.textContent ? '\n' : '') + msg;
}
function mark(ok, x, y, s, col, a = 1) {
  if (a <= .005) return;
  al(a); c.save(); c.strokeStyle = col || (ok ? GOOD : BAD); c.lineWidth = Math.max(4, s * .16); c.lineCap = 'round'; c.lineJoin = 'round'; c.beginPath();
  if (ok) { c.moveTo(x - s * .45, y); c.lineTo(x - s * .1, y + s * .35); c.lineTo(x + s * .5, y - s * .4); }
  else { c.moveTo(x - s * .4, y - s * .4); c.lineTo(x + s * .4, y + s * .4); c.moveTo(x + s * .4, y - s * .4); c.lineTo(x - s * .4, y + s * .4); }
  c.stroke(); c.restore();
}
function arrow(x0, y0, x1, y1, col, a, w = 3.5, dash) {
  if (a <= .005 || Math.hypot(x1 - x0, y1 - y0) < 4) return;
  al(a); c.save(); c.strokeStyle = col; c.fillStyle = col; c.lineWidth = w; c.lineCap = 'round';
  if (dash) c.setLineDash(dash);
  const ang = Math.atan2(y1 - y0, x1 - x0), hx = x1 - Math.cos(ang) * 12, hy = y1 - Math.sin(ang) * 12;
  c.beginPath(); c.moveTo(x0, y0); c.lineTo(hx, hy); c.stroke(); c.setLineDash([]);
  c.translate(x1, y1); c.rotate(ang); c.beginPath(); c.moveTo(0, 0); c.lineTo(-18, -9); c.lineTo(-13, 0); c.lineTo(-18, 9); c.closePath(); c.fill();
  c.restore();
}
/* „kitalált adat” bélyeg (szerződés 12.: Bricolage 22, 600, −3°, keret 2 px); (x, y) bal közép */
function stamp(x, y, a) {
  if (a <= .005) return;
  al(a); c.save(); c.translate(x, y); c.rotate(-3 * Math.PI / 180);
  L.pill(lab('kitalált adat'), 0, 0, { k: 'kitalált adat', s: 22, w: 600, f: F.B, ls: '1.76px', a: 'left', c: MUT, bg: CARD, bd: MUT, bw: 2, pad: 10, r: 6 });

}
function tipPill(k, x, y, a) { if (a <= .005) return; al(a); L.pill(lab(k), x, y, { k, s: 26, w: 700, f: F.B, a: 'center', c: '#ffffff', bg: RED, bd: RED, pad: 13 }); }
/* felirat sraffozott szalagrészen: papírszínű folt alatta (a MatFrac.bar saját felirata a sraffozáson nehezen olvasható) */
function hlab(s, x, y, col, a, sz = 28, f = F.B, max) {
  if (a <= .005 || !s) return;
  al(a); L.pill(s, x, y, { s: sz, w: 700, f, a: 'center', c: dark(col), bg: CARD, bd: CARD, bw: 1, pad: 7, r: 8, max });
}
function card(x, y, w, h, a, bd, bw = 2) { if (a <= .005) return; al(a); rr(x, y, w, h, 18); c.fillStyle = CARD; c.fill(); c.strokeStyle = bd || LINE; c.lineWidth = bw; c.stroke(); }
/* függőleges kapocs (a nyílása balra néz): x a kapocs gerince, [y0; y1] a fogott szakasz */
function vbrace(x, y0, y1, col, a) {
  if (a <= .005) return;
  const q = Math.min(12, (y1 - y0) / 4), mid = (y0 + y1) / 2;
  al(a); c.save(); c.strokeStyle = col; c.lineWidth = 2.5; c.lineCap = 'round'; c.lineJoin = 'round'; c.setLineDash([]);
  c.beginPath(); c.moveTo(x - q, y0); c.quadraticCurveTo(x, y0, x, y0 + q); c.lineTo(x, mid - q); c.quadraticCurveTo(x, mid, x + q, mid);
  c.quadraticCurveTo(x, mid, x, mid + q); c.lineTo(x, y1 - q); c.quadraticCurveTo(x, y1, x - q, y1); c.stroke(); c.restore();
}
function vdash(x, y0, y1, col, a, w = 2) {
  if (a <= .005) return;
  al(a); c.save(); c.strokeStyle = col; c.lineWidth = w; c.setLineDash([7, 6]); c.beginPath(); c.moveTo(x, y0); c.lineTo(x, y1); c.stroke(); c.restore();
}
/* egy sor: felirat (Bricolage) + képlet (MatText) + jel, balról jobbra; → a teljes szélesség */
function checkRow(k, txt, formula, ok, x, y, a, o = {}) {
  if (a <= .005) return 0;
  al(a); const w1 = L.tx(txt, x, y, { k, s: o.s || 28, w: 600, f: F.B, c: INK }).w;
  al(a); const r = MT(formula, x + w1 + 22, y, { s: o.fs || 36, c: ok ? GOOD : BAD, w: 700, b: 'alphabetic' });
  if (ok != null) mark(ok, x + w1 + 22 + r.w + 30, y - 11, 30, null, a);

/* ── adatok (init-ben) ── */
let A1 = 3, B1 = 4, R1 = 19, X1 = 5;                  // szorzó, hozzáadott szám, eredmény, gondolt szám
let S3D = { S: 30, d: 6, B: 12, A: 18 };
let S4D = { A: 23, k: 5, B: 18 };
let S5D = { n: 2, d: 5, R: 1200 };
let S8D = { S: 44, D: 28, P: 8, M: 36 };
const linS = (a, b) => (a ? (a === 1 ? '' : a) + 'x' : '') + (b ? (a ? ' + ' : '') + b : (a ? '' : '0'));

/* ════════ 1. Gondoltam egy számot – a gép ════════ */
const S1 = { n: 1, t0: .8, hist: [], sld: null, tt: null };
const G1 = { y: 470, inX: 170, m1X: 445, midX: 715, m2X: 985, outX: 1225, sw: 150, sh: 110, mw: 190, mh: 140 };
const FL1 = { m1: .45, in1: .7, mid: 1.1, m2: 1.5, in2: 1.75, out: 2.15, verdict: 2.3 };   // a szám útja (mp)
function reset1() { S1.n = 1; S1.t0 = .8; S1.hist = []; S1.tt = null; }
function set1(v) { S1.n = v; S1.t0 = L.st; if (S1.tt == null) S1.tt = L.st; }
function slot(x, y, w, h, s, o = {}) {
  const A = o.a == null ? 1 : o.a; if (A <= .005) return;
  al(A); c.save(); c.setLineDash(o.dash ? [8, 6] : []); rr(x - w / 2, y - h / 2, w, h, 16); c.fillStyle = o.bg || CARD; c.fill();
  c.strokeStyle = o.bd || INK; c.lineWidth = o.bw || 3; c.stroke(); c.restore();
  if (s != null && s !== '' && (o.ta == null || o.ta > .005)) {
    al(A * (o.ta == null ? 1 : o.ta)); MT(s, x, y + 2, { s: o.s || 48, a: 'center', b: 'middle', c: o.c || INK, w: 700, k: o.k, max: w - 16 });
  }
}
function machine(x, y, w, h, op, col, a, glow = 0, o = {}) {
  if (a <= .005) return;
  al(a); c.save(); c.setLineDash([]); c.lineJoin = 'round';
  c.fillStyle = U.mix(col, '#fffaf1', .84); c.strokeStyle = dark(col, .15); c.lineWidth = 3;
  const teeth = o.teeth == null ? 4 : o.teeth;
  for (let i = 0; i < teeth; i++) { const tx = x - w / 2 + 26 + i * (w - 52) / Math.max(1, teeth - 1); rr(tx - 9, y - h / 2 - 13, 18, 17, 3); c.fill(); c.stroke(); }
  rr(x - w / 2, y - h / 2, w, h, 20); c.fill(); c.stroke();
  if (glow > .005) { c.globalAlpha = GA * a * glow; c.lineWidth = 9; c.strokeStyle = U.rgba(col, .35); rr(x - w / 2 - 8, y - h / 2 - 8, w + 16, h + 16, 26); c.stroke(); }
  c.restore();
  al(a); L.tx(op, x, y + 3, { s: o.s || 56, f: F.M, a: 'center', b: 'middle', c: dark(col, .2), w: 700 });
}
function token(x, y, s, col, a) {
  if (a <= .005) return;
  al(a); c.save(); c.beginPath(); c.arc(x, y, 31, 0, TAU); c.fillStyle = col; c.fill(); c.strokeStyle = dark(col, .3); c.lineWidth = 2.5; c.stroke(); c.restore();
  al(a); MT(s, x, y + 2, { s: 30, a: 'center', b: 'middle', c: '#ffffff', w: 700, max: 54 });
}
function scene1(st, live) {
  const g = G1, e0 = smooth(st / .5), n = S1.n, mid = A1 * n, out = mid + B1, p = st - S1.t0;
  al(e0); T('cím 1', 680, 100, { f: F.D, i: true, s: 48, w: 500, a: 'center' });
  // a rejtvény: ? · 3 + 4 = 19
  const rq = '? · ' + A1 + ' + ' + B1 + ' = ' + R1, rw = MW(rq, { s: 60 });
  al(e0); MT(rq, 680 - rw / 2, 228, { s: 60, c: INK, w: 700 });
  tipPill('tippelj', 680, 300, e0 * (S1.tt == null ? 1 : 1 - smooth((st - S1.tt) / .4)));
  // a gép
  const yy = g.y;
  slot(g.inX, yy, g.sw, g.sh, String(n), { a: e0, c: RED, bd: RED, k: null });
  al(e0); T('bemenet', g.inX, yy + g.sh / 2 + 36, { s: 24, w: 600, f: F.B, a: 'center', c: MUT });
  arrow(g.inX + g.sw / 2 + 8, yy, g.m1X - g.mw / 2 - 10, yy, INK, e0);
  const in1 = p >= FL1.m1 && p < FL1.in1 + .15, in2 = p >= FL1.m2 && p < FL1.in2 + .15;
  machine(g.m1X, yy, g.mw, g.mh, '· ' + A1, RED, e0, in1 ? 1 : 0);
  arrow(g.m1X + g.mw / 2 + 8, yy, g.midX - g.sw / 2 - 10, yy, INK, e0);
  const midOn = smooth((p - FL1.mid) / .2);
  slot(g.midX, yy, g.sw, g.sh, String(mid), { a: e0, ta: midOn, dash: midOn < .5 });
  al(e0); T('köztes', g.midX, yy + g.sh / 2 + 36, { s: 24, w: 600, f: F.B, a: 'center', c: MUT });
  arrow(g.midX + g.sw / 2 + 8, yy, g.m2X - g.mw / 2 - 10, yy, INK, e0);
  machine(g.m2X, yy, g.mw, g.mh, '+ ' + B1, RED, e0, in2 ? 1 : 0);
  arrow(g.m2X + g.mw / 2 + 8, yy, g.outX - g.sw / 2 - 10, yy, INK, e0);
  const outOn = smooth((p - FL1.out) / .2), cmp = Math.sign(out - R1), cc = cmp === 0 ? GOOD : cmp < 0 ? TEAL : RED;

  al(e0); T('kimenet', g.outX, yy + g.sh / 2 + 36, { s: 24, w: 600, f: F.B, a: 'center', c: MUT });
  // a vándorló szám
  if (p >= 0 && p < FL1.out + .1) {
    let x, s = String(n);
    if (p < FL1.m1) x = lerp(g.inX, g.m1X, U.inOut(p / FL1.m1));
    else if (p < FL1.in1) x = g.m1X;
    else if (p < FL1.mid) { x = lerp(g.m1X, g.midX, U.inOut((p - FL1.in1) / (FL1.mid - FL1.in1))); s = String(mid); }
    else if (p < FL1.m2) { x = lerp(g.midX, g.m2X, U.inOut((p - FL1.mid) / (FL1.m2 - FL1.mid))); s = String(mid); }
    else if (p < FL1.in2) { x = g.m2X; s = String(mid); }
    else { x = lerp(g.m2X, g.outX, U.inOut((p - FL1.in2) / (FL1.out - FL1.in2))); s = String(out); }

    token(x, yy - g.mh / 2 - 58, s, RED, e0 * (inside ? .35 : 1) * smooth(p / .15) * (1 - smooth((p - FL1.out) / .1)));

  const va = e0 * smooth((p - FL1.verdict) / .3);
  if (va > .005) {
    if (cmp === 0) {
      al(va); const b = L.pill(KN('megvan', n), 680 + 22, 680, { k: 'megvan', s: 32, w: 700, f: F.B, a: 'center', c: '#ffffff', bg: GOOD, bd: GOOD, pad: 14 });
      mark(true, b.x - 30, 680, 32, GOOD, va);

      const fs = out + (cmp < 0 ? ' < ' : ' > ') + R1, fw = MW(fs, { s: 48 }), tw = L.measure(lab(cmp < 0 ? 'kevés' : 'sok'), { s: 32, w: 600, f: F.B }).w;
      const x0 = 680 - (fw + 28 + tw) / 2;
      al(va); MT(fs, x0, 696, { s: 48, c: cc, w: 700 });
      al(va); T(cmp < 0 ? 'kevés' : 'sok', x0 + fw + 28, 694, { s: 32, w: 600, f: F.B, c: cc });

      const r = A1 * h.n + B1, cm = Math.sign(r - R1), col = cm === 0 ? GOOD : cm < 0 ? TEAL : RED, ha = e0 * smooth((st - h.t) / .3);

      x += b.w + 16;
    });
  }

}

/* ════════ 2. Visszafelé: fordított sorrendben ════════ */
const S2 = { n: 5, t0: .3, wrong: false, wOn: -9, wOff: -9, view: null, sld: null, btn: null };
const G2 = { yF: 200, yB: 340, xs: [190, 590, 990], ops: [390, 790], sw: 140, sh: 84, ow: 150, oh: 74 };
let NL2 = null;
const wrong2 = (n) => MatQ(A1 * n + B1, A1).sub(B1);               // ugyanabban a sorrendben: (3n + 4) : 3 − 4
function target2() {
  const out = A1 * S2.n + B1, wr = wrong2(S2.n).v;
  const lo = S2.wrong ? Math.min(0, Math.floor(wr) - 1) : 0, hi = Math.max(20, Math.ceil((out + 2) / 5) * 5);
  return [lo, hi];
}
function view2(st) { const v = S2.view; if (!v) return target2(); return MatLine.lerpView(v.from, v.to, U.inOut(clamp((st - v.t) / .7))); }
function retarget2() { const st = L.st, cur = view2(st); S2.view = { from: cur, to: target2(), t: st }; }
function reset2() { S2.n = X1; S2.t0 = .3; S2.wrong = false; S2.wOn = -9; S2.wOff = -9; S2.view = { from: target2(), to: target2(), t: 0 }; }

function toggle2() { S2.wrong = !S2.wrong; if (S2.wrong) S2.wOn = L.st; else S2.wOff = L.st; retarget2(); }
function scene2(st) {
  const g = G2, e0 = smooth(st / .5), n = S2.n, mid = A1 * n, out = mid + B1, p = st - S2.t0;
  al(e0); T('cím 2', 680, 96, { f: F.D, i: true, s: 48, w: 500, a: 'center' });
  // előre: n → · 3 → 3n → + 4 → out
  const vals = [n, mid, out];
  al(e0); T('előre', 1090, g.yF + 9, { s: 28, w: 700, f: F.B, c: RED });
  vals.forEach((v, i) => slot(g.xs[i], g.yF, g.sw, g.sh, String(v), { a: e0, s: 42, c: i === 0 ? RED : INK, bd: i === 0 ? RED : INK }));
  [['· ' + A1, 0], ['+ ' + B1, 1]].forEach(([op, i]) => {
    arrow(g.xs[i] + g.sw / 2 + 6, g.yF, g.ops[i] - g.ow / 2 - 6, g.yF, RED, e0, 3);
    machine(g.ops[i], g.yF, g.ow, g.oh, op, RED, e0, 0, { s: 40, teeth: 0 });
    arrow(g.ops[i] + g.ow / 2 + 6, g.yF, g.xs[i + 1] - g.sw / 2 - 6, g.yF, RED, e0, 3);
  });

  const b1 = smooth((p - 1.0) / .4), b1v = smooth((p - 1.6) / .25), b2 = smooth((p - 1.8) / .4), b2v = smooth((p - 2.4) / .25);
  al(e0); T('visszafelé', 1090, g.yB + 9, { s: 28, w: 700, f: F.B, c: TEAL });
  slot(g.xs[2], g.yB, g.sw, g.sh, String(out), { a: e0 * smooth((p - .6) / .4), s: 42 });
  arrow(g.xs[2] - g.sw / 2 - 6, g.yB, g.ops[1] + g.ow / 2 + 6, g.yB, TEAL, e0 * b1, 3);
  machine(g.ops[1], g.yB, g.ow, g.oh, '− ' + B1, TEAL, e0 * b1, 0, { s: 40, teeth: 0 });
  arrow(g.ops[1] - g.ow / 2 - 6, g.yB, g.xs[1] + g.sw / 2 + 6, g.yB, TEAL, e0 * b1, 3);
  slot(g.xs[1], g.yB, g.sw, g.sh, String(mid), { a: e0 * b1, ta: b1v, s: 42, dash: b1v < .5 });
  arrow(g.xs[1] - g.sw / 2 - 6, g.yB, g.ops[0] + g.ow / 2 + 6, g.yB, TEAL, e0 * b2, 3);
  machine(g.ops[0], g.yB, g.ow, g.oh, ': ' + A1, TEAL, e0 * b2, 0, { s: 40, teeth: 0 });
  arrow(g.ops[0] - g.ow / 2 - 6, g.yB, g.xs[0] + g.sw / 2 + 6, g.yB, TEAL, e0 * b2, 3);
  slot(g.xs[0], g.yB, g.sw, g.sh, String(n), { a: e0 * b2, ta: b2v, s: 42, dash: b2v < .5, c: GOOD, bd: b2v > .5 ? GOOD : INK });
  mark(true, g.xs[0] - g.sw / 2 - 30, g.yB, 30, GOOD, e0 * b2v);
  // a számegyenes: előre fölötte, visszafelé alatta
  const nl = NL2.view(...view2(st)), lA = e0 * smooth((st - .2) / .5);
  const wa = S2.wrong ? 1 : 1 - smooth((st - S2.wOff) / .35), pw = st - S2.wOn, wA = e0 * wa;
  const backA = 1 - .88 * wa * smooth(pw / .4);
  nl.draw({ a: lA });
  const hh = (v0, v1, k) => clamp(Math.abs(nl.x(v1) - nl.x(v0)) * k, 30, 150);
  nl.jump(n, mid, clamp((p - .2) / .5), { c: RED, a: lA, h: hh(n, mid, .3), label: '· ' + A1, sz: 26 });
  nl.jump(mid, out, clamp((p - .6) / .5), { c: RED, a: lA, h: hh(mid, out, .3) + 10, label: '+ ' + B1, sz: 26 });
  nl.jump(out, mid, clamp((p - 1.0) / .6), { c: TEAL, a: lA * backA, h: hh(out, mid, .3), down: true, label: backA > .5 ? '− ' + B1 : null, sz: 26 });
  nl.jump(mid, n, clamp((p - 1.8) / .6), { c: TEAL, a: lA * backA, h: hh(mid, n, .3) + 10, down: true, label: backA > .5 ? ': ' + A1 : null, sz: 26 });
  nl.point(out, { c: INK, r: 8, a: lA });
  nl.point(mid, { c: INK, r: 8, a: lA * smooth((p - .2) / .5) });
  nl.point(n, { c: RED, r: 12, a: lA, ring: b2v > .5 });
  // ugyanabban a sorrendben (rossz): out → : 3 → − 4
