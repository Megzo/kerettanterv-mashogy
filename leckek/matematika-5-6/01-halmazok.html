<script>
(function () {
'use strict';
const U = Lesson.U, { clamp, lerp, smooth, TAU } = U;
const F = Lesson.FONTS;

/* ── MODUL: Számegyenes (MatLine) · forrás: matematika-5-6/08-tizedes-tortek, 2026-11-23 ──────────────────────
   Terv: pilot/matematika-5-6/terv.md 4. fejezet (API-vázlat) · pilot/matematika-9-10/terv.md 5.1 („MatSzam”).
   Csak a Lesson motorra (L.ctx, L.tx, L.pill, L.measure, L.pointer, L.t, L.stage) és – tört-feliratnál – a
   shared/matek/mtext.js MatText-jére épül. Változtatás nélkül átemelhető (javaslat: shared/matek/line.js).
   Szöveg: {s, k} (szöveg + md-kulcs) vagy sima szöveg (kódban rögzített szám, jel). Minden felirat L.tx / L.pill /
   MatText.draw útján kerül a vászonra (QA, review mód). Az átlátszóság (a) ABSZOLÚT: a hívó szorozza bele a
   jelenet-áttűnést. A modul állapotot nem tart, csak az éppen húzott pontét (zárt képletű rajzhoz jó).

   const nl = MatLine.create(L, o)
     o = {x0, x1, y              a [v0; v1] tartomány két végének x-e és a vonal y-ja (logikai px)
          v0 = 0, v1 = 1         kezdő nézet
          scheme: 'dec'          10-hatvány szintek (1; 0,1; 0,01 …): a sűrűsödő szint fokozatosan tűnik elő
                                 (folytonos zoomhoz); felirat a legfinomabb olyan szinten, ahol elfér
                | '125'          felirat-lépés 1–2–5 · 10^k (ahol elfér), beosztás a következő kisebb 10-hatványon
                | 'fix'          o.step a beosztás, o.major a felirat lépése (alap: step)
          step, major            'fix' lépései;  den: tört-számegyenes (scheme 'fix', step = 1/den, fmt 'frac')
          fmt: 'dec'             tizedes felirat (magyar: 0,25; −3) · 'frac' (n/den, o.reduce: egyszerűsítve; egész
                                 helyén egész) · 'mixed' (vegyes szám) · függvény (v) → szöveg
          pad: false             'dec' + 'fix': minden felirat ugyanannyi tizedesjegyű, mint a major (0,20 … 0,30)
          labelSide: 'down'      'up': a feliratok a vonal fölött (kettős számegyenes felső vonala)
          unit: {s, k}           mértékegység a nyíl után · s: 24 (felirat px) · tick: 22 (fő beosztás px)
          lw: 2.5 · c: tinta · arrow: true · ext: 26 (a vonal túlnyúlása px) · labelDy: 38 · minPx: 7}
     nl.view(v0, v1)             nézet beállítása → nl;  nl.v0, nl.v1, nl.ppu (px / egység)
     nl.lerpView(A, B, t)        nl.view(...MatLine.lerpView(A, B, t))
     nl.x(v) · nl.v(x) · nl.in(v)   érték ↔ x; látszik-e a nézetben
     nl.levelA(step)             egy beosztás-szint láthatósága 0..1 (pl. „most látszanak a századok”)
     nl.ticks()                  → [{v, h, a, la, d, c}] a mostani nézet beosztásai (h magasság, a / la a beosztás /
                                 felirat átlátszósága, d tizedesjegy)
     nl.label(v, d)              egy érték felirata a vonal formátumában
     nl.draw(d)                  d = {a: 1, line: true, ticks: true, labels: true | false | 'ends' | [v…],
                                 hi: [v…] | [{v, c}] (kiemelt beosztás, félkövér színes felirat),
                                 tickA(v), labelA(v) → 0..1 (fokozatos megjelenés), tickC(v) → szín,
                                 labelC(v) → szín, lineT: 0..1 (a vonal kirajzolódása balról)}
     nl.point(v, o) → v          pont; o = {c, r: 11, hollow, a, ring (fényudvar), dy (függőleges eltolás px),
                                 label: {s, k} | szöveg, math (MatText.draw-val, pl. tört), side: 'up' | 'down',
                                 al: 'center' | 'left' | 'right' (a felirat a ponttól balra / jobbra nyúlik),
                                 ldy (a felirat távolsága), pill: true, sz: 26, lc (felirat színe), f (betű),
                                 drag: {id, min, max, snap, track: false, hit: 28, onDrag(v)}}
                                 Húzás: fogantyú r ≥ 11, találati sugár 28 px; track: a vonalra kattintva is odaugrik;
                                 a pont a [min; max]-on marad, snap-re ugrik. Visszaadja a húzás utáni értéket –
                                 a lecke tárolja, és egy L.slider-rel (billentyűvel is) szinkronban tartja.
     nl.jump(v0, v1, t, o)       ugrás-ív v0 → v1 (lépegetés); t 0..1 kirajzolás; o = {c, a, h, down, lw: 3,
                                 arrow: true, gap: 6, label: {s, k} | szöveg, sz: 24}
     nl.span(v0, v1, o)          szakasz / intervallum a vonalon; v0 = −Infinity / v1 = Infinity → félegyenes nyíllal;
                                 o = {c, a, lw: 7, dy: 0, t (kirajzolás 0..1), closed: [true, true] (true teli, false
                                 üres karika, null semmi), alpha: .85}
     nl.mirror(v, t, o) → érték  a v pont tükrözése a 0-ra (ellentett) félköríven; t 0..1; o = {c, a, ghost: true,
                                 r, label}; visszaadja a pont mostani (vetített) értékét
     nl.brace(v0, v1, o)         kapocs a [v0; v1] fölött (o.down: a feliratok alatt); o = {c, a, dy, t,
                                 label: {s, k} | szöveg, math, sz: 26, f}  – távolság, „1 tized”, abszolút érték
     nl.frameBox(v0, v1, o)      → {x0, y0, x1, y1} a szakaszt és két végfeliratát befoglaló doboz
     nl.frame(v0, v1, o)         nagyító keret (o = {c, a, lw: 2.5, fill: .06, h})
   MatLine.lerpView(A, B, t)     két nézet között logaritmikus zoom: a szélesség mértani úton változik, a fixpont
                                 (amely mindkét nézetben ugyanott van) helyben marad → valódi nagyítás.
                                 Egyenlő szélességnél egyenletes eltolás. t-t a hívó simítja (U.inOut).
   MatLine.zoomPair(L, top, bot, v0, v1, t, o)   két szint: keret a felső vonal [v0; v1] szakasza körül, vetítő trapéz
                                 az alsó vonal két végéhez. Az alsót a hívó rajzolja: bot.view(v0, v1); bot.draw(…).
                                 o = {c, a, h, fill}; t 0..1 (0–0,4 a keret, 0,3–1 a trapéz)
   MatLine.double(L, o) → {top, bot, draw(d)}   kettős számegyenes közös x-szel (százalék, mértékegység);
                                 o = {x0, x1, y, gap: 110, top: {create-opciók}, bot: {…}} (a felső felirata fent);
                                 draw({a, links: [v…] (szaggatott összekötő a felső vonal v értékeinél), top: {draw-opciók},
                                 bot: {…}})
   MatLine.parallel(L, o) → {lines, draw(d)}   párhuzamos számegyenesek (törtfal); o = {x0, x1, y0, dy, dens: [2, 3, …],
                                 v1: 1}; draw({a, hi: [[sor, érték]…], c})
   MatLine.decimals(x)           hány tizedesjegy kell x leírásához (0,25 → 2; 3 → 0)
   MatLine.round(v, d = 10)      lebegőpontos zaj nélkül (0,1 + 0,2 → 0,3)
   Nincs benne (még): felcsavarás hasábra (MatLine.wrap – a 03-hoz Mat3D kell), logaritmikus lépték (9–10/04).
   ──────────────────────────────────────────────────────────────────────────────────────────────────────── */
const MatLine = (() => {
  const U = Lesson.U, F = Lesson.FONTS, TAU = Math.PI * 2, clamp = U.clamp, smooth = U.smooth;
  const INK = '#1c2440', MUT = '#565d72', RED = '#c8401c', CARD = '#fffaf1', PAPER = '#f7f1e6';
  const round = (v, d = 10) => (isFinite(v) ? +(+v).toFixed(d) : v);
  const decimals = (x) => {
    x = Math.abs(x);
    for (let d = 0; d < 12; d++) { const m = x * Math.pow(10, d); if (Math.abs(m - Math.round(m)) < 1e-7 * Math.max(1, m)) return d; }
    return 12;
  };
  const TX = (x) => (x == null ? null : typeof x === 'string' || typeof x === 'number' ? { s: String(x) } : x);
  const P10 = (k) => Math.pow(10, k);

  function lerpView(A, B, t) {
    t = clamp(t);
    const wA = A[1] - A[0], wB = B[1] - B[0], cA = (A[0] + A[1]) / 2, cB = (B[0] + B[1]) / 2;
    if (Math.abs(wA - wB) <= 1e-12 * Math.max(Math.abs(wA), Math.abs(wB))) { const m = cA + (cB - cA) * t; return [m - wA / 2, m + wA / 2]; }
    const w = wA * Math.pow(wB / wA, t), m = cA + (cB - cA) * (w - wA) / (wB - wA);
    return [m - w / 2, m + w / 2];
  }

  // ── húzás: képkockánként egyszer frissül (L.t szerint) ──
  const DRAG = { id: null, t: NaN, was: false, pressed: false, hov: '', cur: '' };
  function input(L) {
    if (DRAG.t === L.t) return;
    DRAG.t = L.t;
    const dn = !!L.pointer.down;
    DRAG.pressed = dn && !DRAG.was; DRAG.was = dn;
    if (!dn) DRAG.id = null;
    const want = DRAG.id ? 'grabbing' : DRAG.hov;
    if (want !== DRAG.cur && L.stage) { L.stage.style.cursor = want; DRAG.cur = want; }
    DRAG.hov = '';
  }

  function arrowHead(c, x, y, ang, sz, col) {
    c.save(); c.translate(x, y); c.rotate(ang); c.beginPath();
    c.moveTo(0, 0); c.lineTo(-sz * 1.25, -sz * .62); c.lineTo(-sz * .95, 0); c.lineTo(-sz * 1.25, sz * .62); c.closePath();
    c.fillStyle = col; c.fill(); c.restore();
  }

  function create(L, o = {}) {
    const nl = Object.assign({ x0: 100, x1: 1260, y: 540, v0: 0, v1: 1, scheme: 'dec', fmt: 'dec', s: 24, tick: 22, lw: 2.5,
      c: INK, arrow: true, ext: 26, labelDy: 38, minPx: 7, pad: false, labelSide: 'down', unit: null }, o);
    if (nl.den && !o.step) { nl.scheme = 'fix'; nl.step = 1 / nl.den; if (o.fmt == null) nl.fmt = 'frac'; }
    if (nl.scheme === 'fix' && !nl.major) nl.major = nl.step;
    nl.L = L;
    nl.view = (a, b) => { nl.v0 = a; nl.v1 = b; nl.ppu = (nl.x1 - nl.x0) / (b - a); return nl; };
    nl.lerpView = (A, B, t) => nl.view(...lerpView(A, B, t));
    nl.x = (v) => nl.x0 + (v - nl.v0) * nl.ppu;
    nl.v = (x) => nl.v0 + (x - nl.x0) / nl.ppu;
    nl.in = (v) => { const e = 1e-9 * (nl.v1 - nl.v0); return v >= nl.v0 - e && v <= nl.v1 + e; };
    nl.levelA = (step) => smooth((step * nl.ppu - nl.minPx) / 14);

    nl.label = (v, d) => {
      if (typeof nl.fmt === 'function') return String(nl.fmt(v));
      if (nl.fmt === 'frac' || nl.fmt === 'mixed') {
        const den = nl.den || Math.round(1 / nl.step), n = Math.round(v * den);
        if (n % den === 0 && nl.whole !== false) return U.fmt(n / den);
        let a = n, b = den; if (nl.reduce) { const g = MatQ.gcd(a, b); a /= g; b /= g; }
        if (nl.fmt === 'mixed' && Math.abs(a) > b) return (a < 0 ? '−' : '') + Math.floor(Math.abs(a) / b) + ' ' + (Math.abs(a) % b) + '/' + b;
        return (a < 0 ? '−' : '') + Math.abs(a) + '/' + b;
      }
      return U.fmt(round(v, 12), d == null ? decimals(round(v, 12)) : d);
    };
    const isFrac = () => nl.fmt === 'frac' || nl.fmt === 'mixed';

    // beosztások a mostani nézetben
    nl.ticks = () => {
      const out = [], span = nl.v1 - nl.v0;
      const push = (step, k0, k1, h, a, la, d) => {
        for (let i = k0; i <= k1; i++) out.push({ v: round(i * step, 12), h, a, la, d, i });
      };
      const range = (step) => [Math.ceil(nl.v0 / step - 1e-9), Math.floor(nl.v1 / step + 1e-9)];
      if (nl.scheme === 'fix') {
        const [a0, a1] = range(nl.step), r = Math.round(nl.major / nl.step), dmaj = decimals(nl.major);
        for (let i = a0; i <= a1; i++) {
          const maj = i % r === 0, v = round(i * nl.step, 12);
          out.push({ v, h: maj ? nl.tick : nl.tick * .55, a: 1, la: maj ? 1 : 0, d: nl.pad ? dmaj : decimals(v) });
        }
        return out;
      }
      const kTop = Math.ceil(Math.log10(Math.max(Math.abs(nl.v0), Math.abs(nl.v1), span)) + 1e-9);
      let kMin = kTop; while (kMin > -12 && P10(kMin - 1) * nl.ppu >= nl.minPx) kMin--;
      if (nl.scheme === '125') {
        const lab = [];
        for (let k = kMin; k <= kTop; k++) for (const m of [1, 2, 5]) lab.push(m * P10(k));
        const need = (st) => L.measure(nl.label(nl.v1, decimals(st)), { f: F.M, s: nl.s }).w + 18;
        const ls = lab.find((st) => st * nl.ppu >= need(st)) || lab[lab.length - 1], dl = decimals(ls);
        const [a0, a1] = range(P10(kMin)), r = Math.round(ls / P10(kMin));
        for (let i = a0; i <= a1; i++) { const v = round(i * P10(kMin), 12), maj = i % r === 0; out.push({ v, h: maj ? nl.tick : nl.tick * .55, a: 1, la: maj ? 1 : 0, d: dl }); }
        return out;
      }
      // 'dec': minden 10-hatvány szint, a sűrű szint fokozatosan előtűnik
      const lvl = [];
      for (let k = kMin; k <= kTop; k++) {
        const st = P10(k), px = st * nl.ppu, d = Math.max(0, -k);
        const need = L.measure(nl.label(nl.v1 >= 0 ? nl.v1 : nl.v0, d), { f: F.M, s: nl.s }).w + 14;
        lvl.push({ k, st, px, d, a: smooth((px - nl.minPx) / 14), h: nl.tick * (.35 + .65 * smooth((px - nl.minPx) / 160)),
          la: smooth((px - need) / (need * .25)) });
      }
      const dPad = (lvl.find((l) => l.la > .5) || lvl[lvl.length - 1]).d;
      const [a0, a1] = range(P10(kMin));
      for (let i = a0; i <= a1; i++) {
        let j = 0, n = i; while (j < lvl.length - 1 && n % 10 === 0) { n /= 10; j++; }
        const l = lvl[j];
        out.push({ v: round(i * P10(kMin), 12), h: l.h, a: l.a, la: l.la, d: nl.pad ? dPad : l.d });
      }
      return out;
    };

    function drawLabel(c, v, x, A, txt, col, bold) {
      if (A <= .02) return;
      c.globalAlpha = A;
      const up = nl.labelSide === 'up';
      if (isFrac() && /\//.test(txt)) {
        const m = txt.match(/^(−?)(?:(\d+) )?(\d+)\/(\d+)$/);
        if (m) {
          const y = up ? nl.y - nl.tick / 2 - 8 : nl.y + nl.tick / 2 + 8;
          MatText.frac(L, m[3], m[4], x, y, { s: nl.s * 1.2, a: 'center', b: up ? 'bottom' : 'top', c: col, w: bold ? 700 : 500, whole: m[2], sign: m[1] || undefined });
          return;
        }
      }
      const y = up ? nl.y - nl.tick / 2 - 8 - nl.s * .24 : nl.y + nl.labelDy;
      L.tx(txt, x, y, { f: F.M, s: nl.s, w: bold ? 700 : 500, a: 'center', c: col });
    }

    nl.draw = (d = {}) => {
      input(L);
      const c = L.ctx, A = d.a == null ? 1 : d.a; if (A <= .004) return nl;
      const y = nl.y, lt = d.lineT == null ? 1 : clamp(d.lineT);
      const xa = nl.x0 - nl.ext, xe = nl.x1 + nl.ext, xb = xa + (xe - xa) * lt;
      c.save(); c.setLineDash([]); c.lineCap = 'round';
      if (d.line !== false) {
        c.globalAlpha = A; c.strokeStyle = nl.c; c.lineWidth = nl.lw;
        c.beginPath(); c.moveTo(xa, y); c.lineTo(xb, y); c.stroke();
        if (nl.arrow && lt > .98) arrowHead(c, xe + 12, y, 0, 11, nl.c);
        if (nl.unit && lt > .98) { const u = TX(nl.unit); L.tx(u.s, xe + 24, y + 8, { k: u.k, s: nl.s, f: F.B, w: 600, c: nl.c }); }
      }
      const his = (d.hi || []).map((h) => (typeof h === 'object' ? h : { v: h, c: RED }));
      const hiOf = (v) => his.find((h) => Math.abs(h.v - v) <= 1e-9 * Math.max(1, Math.abs(v)));
      const list = Array.isArray(d.labels) ? d.labels : null;
      if (d.ticks !== false) {
        for (const t of nl.ticks()) {
          const x = nl.x(t.v); if (x > xb + .5) continue;
          const h = hiOf(t.v), ta = t.a * (d.tickA ? clamp(d.tickA(t.v)) : 1);
          if (ta > .01) {
            c.globalAlpha = A * ta; c.strokeStyle = h ? h.c : d.tickC ? d.tickC(t.v) : nl.c; c.lineWidth = h ? 3.5 : t.h > nl.tick * .7 ? 2.5 : 2;
            const hh = h ? Math.max(t.h, nl.tick) * 1.25 : t.h;
            c.beginPath(); c.moveTo(x, y - hh / 2); c.lineTo(x, y + hh / 2); c.stroke();
          }
          if (list || d.labels === false) continue;
          if (d.labels === 'ends' && !(Math.abs(t.v - nl.v0) < 1e-9 || Math.abs(t.v - nl.v1) < 1e-9)) continue;
          const la = (h ? 1 : t.la) * (d.labelA ? clamp(d.labelA(t.v)) : 1) * (d.tickA && !d.labelA ? clamp(d.tickA(t.v)) : 1);
          drawLabel(c, t.v, x, A * la, nl.label(t.v, t.d), h ? h.c : d.labelC ? d.labelC(t.v) : nl.c, !!h);
        }
      }
      if (list) for (const v of list) {

  '10-nél nagyobb': (n) => n > 10, 'prím': isPrime, '5-re végződik': (n) => n % 10 === 5, '4-gyel osztható': (n) => n % 4 === 0,
};
const PK = Object.keys(PROP);
let NUMS = [], VX = 15;
const MA = 'páros', MB = '3-mal osztható';               // a 2–6. lépés két halmaza
const maskOf = (n, pa, pb) => (PROP[pa](n) ? 1 : 0) | (pb && PROP[pb](n) ? 2 : 0);
const setStr = (arr) => (arr.length ? '{' + arr.join('; ') + '}' : '{ }');
const HM = { 'és': [3], 'vagy': [1, 2, 3], 'vv': [1, 2], 'nemA': [0, 2], 'nemB': [0, 1], 'egyik': [0], 'pontosan': [1, 2] };
const inHM = (mode, m) => (mode && HM[mode].includes(m) ? 1 : 0);

/* ── a halmazábra elrendezése (az 1–20 alaphalmaz elemeiből) ── */
const RECT = [60, 170, 1240, 700], CX = 680, CY = 520;
const LENS_AVOID = [560, 742, 240, 50], NOT_AVOID = [860, 808, 432, 50];
const names = (pa, pb) => (pb ? [{ s: 'A: ' + lab(pa), k: pa }, { s: 'B: ' + lab(pb), k: pb }] : [{ s: lab(pa), k: pa }]);
function circlesFor(pa, pb) {
  if (!pb) return MatVenn.layout(RECT, 'one', { r: 270, cx: 560 });
  const ms = NUMS.map((n) => maskOf(n, pa, pb)), rel = MatVenn.relation(ms), cnt = (m) => ms.filter((x) => x === m).length;
  if (rel.kind === 'overlap') return MatVenn.layout(RECT, 'overlap', { r: 250, lens: clamp(130 + 18 * cnt(3), 150, 250) });
  if (rel.kind === 'subset') return MatVenn.layout(RECT, 'subset', { r: 262, inner: rel.inner, ri: clamp(95 + 16 * cnt(3), 118, 190) });
  if (rel.kind === 'disjoint') return MatVenn.layout(RECT, 'disjoint', { r: 240, gap: 70 });
  return MatVenn.layout(RECT, 'equal', { r: 262 });
}
function anchorRight(V) {     // az „egyik sem” elemei jobb oldalt, középmagasságban tömörülnek
  let best = null, bs = -1e9;
  for (let y = RECT[1] + 40; y < RECT[1] + RECT[3] - 40; y += 10) for (let x = 880; x < RECT[0] + RECT[2] - 30; x += 10) {
    if (V.mask(x, y) !== 0) continue; const s = Math.min(V.clearance(x, y), 90) - .08 * Math.abs(y - CY); if (s > bs) { bs = s; best = [x, y]; }
  }
  return best;
}
const LAY = {};
function lay(pa, pb, circles, tag) {
  const key = pa + '|' + (pb || '') + '|' + (tag || '');
  if (LAY[key]) return LAY[key];
  const V = MatVenn.create(L, { rect: RECT, circles: circles || circlesFor(pa, pb), names: names(pa, pb), U: K('alaphalmaz felirat'),
    avoid: pb ? [LENS_AVOID, NOT_AVOID] : [] });
  V.anchors[0] = anchorRight(V);
  const items = NUMS.map((n) => ({ id: n, m: maskOf(n, pa, pb) }));
  const P = V.place(items);
  return (LAY[key] = { V, pos: P.pos, over: P.over, masks: Object.fromEntries(items.map((it) => [it.id, it.m])) });
}
const elems = (pa, pb, mode) => NUMS.filter((n) => inHM(mode, maskOf(n, pa, pb)));

/* ── kártyák és a kattintásra megjelenő „igaz-e?” felirat ── */
const CUR = {};                                   // az élő jelenet kártyáinak helye (kattintáshoz)
const INFO = { n: null, t0: 0, step: -1 };
function drawCards(list) {
  list.sort((p, q) => (p.lift || 0) - (q.lift || 0));
  list.forEach((it) => MatVenn.card(L, it.n, it.x, it.y, { a: GA * (it.a == null ? 1 : it.a), ring: it.ring, scale: it.sc, lift: it.lift, qa: !it.fly }));
}
function handleClick(live, props, ok = () => true) {
  if (!live || !L.pointer.pressed) return;
  const px = L.pointer.px, py = L.pointer.py;
  const hit = NUMS.find((n) => CUR[n] && ok(n) && Math.abs(px - CUR[n][0]) <= 32 && Math.abs(py - CUR[n][1]) <= 28);
  if (hit != null && !(INFO.n === hit && INFO.step === L.step)) { INFO.n = hit; INFO.t0 = L.st; INFO.step = L.step; }
  else { INFO.n = null; INFO.step = -1; }
}
function infoText(n, props) {
  const yn = (p) => lab(p) + '? ' + lab(PROP[p](n) ? 'igen' : 'nem');
  return { s: n + ': ' + props.map(yn).join(' · '), k: ['igen', 'nem'].concat(props) };
}
function drawInfo(n, props, st0, st, a = 1) {
  if (n == null || !CUR[n]) return;
  const p = smooth((st - st0) / .3) * a; if (p <= .005) return;
  const [x, y] = CUR[n], t = infoText(n, props);
  // a vezetővonal más kártyákon futna át → helyette keret a kártya körül
  al(p); c.setLineDash([]); c.beginPath(); c.roundRect(x - 37, y - 33, 74, 66, 14); c.strokeStyle = INK; c.lineWidth = 3.5; c.stroke();
  al(p); L.pill(t.s, 680, 142, { k: t.k, s: 26, w: 700, f: F.B, a: 'center', c: INK, bg: CARD, bd: INK, bw: 2.5, pad: 12, max: 1200 });
}
/* halmaz kiírása: „<előtag>: {…}” középre, két betűtípussal; → a szöveg jobb széle */
function listLine(y, pre, arr, col, a, cnt) {
  const s1 = pre.s + ':', s2 = setStr(arr);
  let sz = 28; const w1 = () => L.measure(s1, { s: sz, w: 700, f: F.B }).w, w2 = () => L.measure(s2, { s: sz, w: 600, f: F.M }).w;
  const cw = cnt ? L.measure(KN('elemszám', arr.length).s, { s: 24, w: 700, f: F.B }).w + 50 : 0;
  while (sz > 22 && w1() + w2() + 16 + cw > 1240) sz -= 1;
  const W = w1() + 16 + w2() + cw, x0 = CX - W / 2;
  al(a); L.tx(s1, x0, y, { k: pre.k, s: sz, w: 700, f: F.B, b: 'middle', c: col });
  al(a); L.tx(s2, x0 + w1() + 16, y, { s: sz, w: 600, f: F.M, b: 'middle', c: INK });
  if (cnt) { al(a); L.pill(arr.length ? KN('elemszám', arr.length).s : lab('üres halmaz'), x0 + w1() + 16 + w2() + 30, y, { k: arr.length ? 'elemszám' : 'üres halmaz', s: 24, w: 700, f: F.B, a: 'left', c: col, bg: CARD, bd: col, pad: 9 }); }
}
const hiFn = (prev, cur, p) => (m) => lerp(inHM(prev, m), inHM(cur, m), p);

/* ════════ 1. Válogassunk! ════════ */
const PROPS1 = ['páros', 'prím', '10-nél nagyobb', '5-re végződik'];
const S1 = { prop: 'páros', from: null, t0: -9, btn: {} };
const GRID = (j) => [CX + ((j % 10) - 4.5) * 84, 470 + Math.floor(j / 10) * 100];
const T1 = (j) => 1.5 + j * .09;
function pos1(st) {
  const P = lay(S1.prop).pos, res = {};
  NUMS.forEach((n, j) => {
    if (S1.from) { const t = (st - S1.t0 - j * .03) / .7; res[n] = { p: MatVenn.fly(S1.from[n], P[n], clamp(t)), fly: t > 0 && t < 1 }; }
    else { const t = (st - T1(j)) / .7; res[n] = { p: t <= 0 ? GRID(j) : MatVenn.fly(GRID(j), P[n], clamp(t)), fly: t > 0 && t < 1 }; }
  });
  return res;
}
function reset1() { S1.prop = 'páros'; S1.from = null; S1.t0 = -9; sync1(); }
function sync1() { Object.keys(S1.btn).forEach((p) => { if (S1.btn[p]) S1.btn[p].classList.toggle('on', p === S1.prop); }); }
function change1(p) {
  if (p === S1.prop) return;
  const cur = pos1(L.st); S1.from = {}; NUMS.forEach((n) => { S1.from[n] = cur[n].p; });
  S1.prop = p; S1.t0 = L.st; sync1();
}
function scene1(st, live) {
  const LY = lay(S1.prop), p0 = smooth(st / .5), done = S1.from ? 1 : smooth((st - T1(NUMS.length - 1) - .8) / .5);
  title('válogatás cím', p0);
  LY.V.draw({ a: GA * p0, t: S1.from ? 1 : clamp((st - .6) / .8) });
  const P = pos1(st), list = [];
  NUMS.forEach((n) => { const q = P[n]; list.push({ n, x: q.p[0], y: q.p[1], a: p0, lift: q.fly ? 1 : 0, fly: q.fly }); if (live) CUR[n] = q.p; });
  drawCards(list);
  const arr = NUMS.filter((n) => PROP[S1.prop](n));
  listLine(955, K(S1.prop), arr, RED, done, true);
  CK.s1 = { prop: S1.prop, arr, inside: NUMS.filter((n) => LY.V.mask(LY.pos[n][0], LY.pos[n][1]) === 1) };
}

/* ════════ 2. Két szempont egyszerre ════════ */
const S2 = { guess: null, gt: -9, row: null };
const TIPS2 = [['tipp csak A', 1], ['tipp közös', 3], ['tipp csak B', 2], ['tipp egyik sem', 0]];
const T2 = (j) => 1.2 + j * .06;
function wait2() {      // a két kör felső metszéspontja – itt vár a vizsgált szám
  const [A, B] = lay(MA, MB).V.circles, d = B.x - A.x;
  return [(A.x + B.x) / 2, A.y - Math.sqrt(Math.max(0, A.r * A.r - d * d / 4))];
}
function reset2() { S2.guess = null; S2.gt = -9; if (S2.row) S2.row.style.display = ''; }
function guess2(k) { if (S2.guess) return; S2.guess = k; S2.gt = L.st; if (S2.row) S2.row.style.display = 'none'; }
function scene2(st, live) {
  const L1 = lay('páros'), L2 = lay(MA, MB), p0 = smooth(st / .5), m = smooth((st - .2) / .8);
  title('hová cím', p0, KN('hová cím', VX).s);
  const V = L2.V.with([MatVenn.lerp(L1.V.circles, L2.V.circles, m)[0], L2.V.circles[1]]);
  V.draw({ a: GA * p0, t: [1, clamp((st - .6) / .8)] });
  const W = wait2(), land = S2.guess ? clamp((st - S2.gt - .2) / .9) : 0, list = [];
  NUMS.forEach((n, j) => {
    const t = (st - T2(j)) / .7, from = L1.pos[n];
    if (n === VX) {
      let p = MatVenn.fly(from, W, clamp(t)), sc = lerp(1, 1.35, smooth(t)), fly = t > 0 && t < 1;
      if (S2.guess) { p = MatVenn.fly(W, L2.pos[n], land); sc = lerp(1.35, 1, smooth(land)); fly = land > 0 && land < 1; }
      const pulse = !S2.guess && t >= 1 ? .5 + .5 * Math.sin(st * 4) : 0;
      list.push({ n, x: p[0], y: p[1], a: p0, sc, lift: fly ? 1 : S2.guess ? 0 : .6, fly, ring: pulse > 0 ? U.mix(RED, '#f7f1e6', .4 * (1 - pulse)) : null });
      if (live) CUR[n] = S2.guess && land >= 1 ? p : null;
    } else {
      const p = MatVenn.fly(from, L2.pos[n], clamp(t)); list.push({ n, x: p[0], y: p[1], a: p0, lift: t > 0 && t < 1 ? 1 : 0, fly: t > 0 && t < 1 });
      if (live) CUR[n] = p;
    }
  });
  drawCards(list);
  const wa = S2.guess ? 1 - smooth((st - S2.gt) / .3) : smooth((st - T2(NUMS.indexOf(VX)) - .7) / .4);
  if (wa > 0) { al(wa); L.pill(lab('tippelj'), W[0], W[1] - 66, { k: 'tippelj', s: 24, w: 700, f: F.B, a: 'center', c: '#ffffff', bg: RED, pad: 12 }); }
  // tipp-sor a leszállás után
  if (S2.guess) {
    const ga = smooth((st - S2.gt - 1.1) / .4), right = TIPS2.find(([, mm]) => mm === maskOf(VX, MA, MB))[0];
    const xs = [215, 525, 835, 1145];
    TIPS2.forEach(([k], j) => {
      const isG = S2.guess === k, ok = k === right, col = ok ? GOOD : isG ? INK : MUT;
      al(ga * (isG || ok ? 1 : .5));
      const b = L.pill(lab(k), xs[j], 950, { k, s: 24, w: 700, f: F.B, a: 'center', c: col, bg: CARD, bd: col, bw: isG ? 3 : 2, pad: 11 });
      if (ok) { al(ga); mark(true, b.x + b.w + 20, 950, 26); }
      if (isG) { al(ga); T('a tipped', xs[j], 1004, { s: 22, w: 600, f: F.B, a: 'center', c: MUT }); }
    });
    if (live && INFO.n == null) drawInfo(VX, [MA, MB], S2.gt + 1.1, st);
  }
  handleClick(live, [MA, MB], (n) => n !== VX || (S2.guess && land >= 1));
  if (INFO.step === 1 && INFO.n != null) drawInfo(INFO.n, [MA, MB], INFO.t0, st);
  CK.s2 = { landed: S2.guess && land >= 1, at: S2.guess ? L2.V.mask(...L2.pos[VX]) : null };
}

/* ── a 3–6. lépés közös alapja: a két halmaz, a kártyák a helyükön ── */
function venn2(st, live, o) {
  const L2 = lay(MA, MB), p0 = smooth(st / .5);
  L2.V.draw(Object.assign({ a: GA * p0 }, o.draw));
  const list = NUMS.map((n) => ({ n, x: L2.pos[n][0], y: L2.pos[n][1], a: p0 * (o.cardA ? o.cardA(n) : 1), ring: o.ring ? o.ring(n) : null }));
  if (live) NUMS.forEach((n) => { CUR[n] = L2.pos[n]; });
  drawCards(list);
  if (o.click !== false) {
    handleClick(live, [MA, MB]);
    if (INFO.step === L.step && INFO.n != null && live) drawInfo(INFO.n, [MA, MB], INFO.t0, st);
  }
  return L2;
}

/* ════════ 3. „És”: a közös rész ════════ */
function scene3(st, live) {
  const h = smooth((st - .5) / .8), arr = elems(MA, MB, 'és');
  title('és cím', smooth(st / .5));
  venn2(st, live, { draw: { hi: [3], hiA: h }, cardA: (n) => lerp(1, inHM('és', maskOf(n, MA, MB)) ? 1 : .3, h) });
  listLine(955, KN('és sablon', lab(MA), lab(MB)), arr, OCHRE, smooth((st - 1.2) / .5), true);
  CK.s3 = { arr };
}

/* ════════ 4. „Vagy”: az egyesítés ════════ */
const S4 = { mode: 'vagy', prev: null, t0: -9, btn: {} };
function reset4() { S4.mode = 'vagy'; S4.prev = null; S4.t0 = -9; sync4(); }
function sync4() { ['vagy', 'vv'].forEach((m) => { if (S4.btn[m]) S4.btn[m].classList.toggle('on', m === S4.mode); }); }
function set4(m) { if (m === S4.mode) return; S4.prev = S4.mode; S4.mode = m; S4.t0 = L.st; sync4(); }
function scene4(st, live) {
  const h = smooth((st - .5) / .8), p = S4.prev ? smooth((st - S4.t0) / .5) : 1, f = hiFn(S4.prev, S4.mode, p);
  const arr = elems(MA, MB, S4.mode);
  title('vagy cím', smooth(st / .5));
  const vv = S4.mode === 'vv' ? p : S4.prev === 'vv' ? 1 - p : 0;
  venn2(st, live, { draw: { hi: [1, 2, 3], hiA: (m) => h * f(m) }, cardA: (n) => lerp(1, lerp(.3, 1, f(maskOf(n, MA, MB))), h),
    ring: (n) => (maskOf(n, MA, MB) === 3 && h > .5 ? (vv > .5 ? BAD : GOOD) : null) });
  // a közös rész felirata
  const la = smooth((st - 1.4) / .4);
  if (la > 0) {
    const x = LENS_AVOID[0] + LENS_AVOID[2] / 2, y = LENS_AVOID[1] + LENS_AVOID[3] / 2;
    if (vv < 1) verdict(lab('mindkettő jó'), 'mindkettő jó', true, x, y, la * (1 - vv));

  }
  listLine(955, S4.mode === 'vagy' ? KN('vagy sablon', lab(MA), lab(MB)) : KN('pontosan sablon', lab(MA), lab(MB)), arr, OCHRE, smooth((st - 1.2) / .5), false);
  CK.s4 = { arr, mode: S4.mode };
}

/* ════════ 5. Hányan vannak? ════════ */
const S5 = { guess: null, gt: -9, row: null };
let TIPS5 = [];
function reset5() { S5.guess = null; S5.gt = -9; if (S5.row) S5.row.style.display = ''; }

  const nA = elems(MA, MB, 'nemB').length + 0, A = NUMS.filter((n) => PROP[MA](n)), B = NUMS.filter((n) => PROP[MB](n));
  const g0 = S5.gt + .3, TA = g0 + A.length * .22 + .2, g1 = TA + .3, TB = g1 + B.length * .22 + .2, g2 = TB + .4, g3 = g2 + 1.6;
  return { A, B, g0, TA, g1, TB, g2, g3, nA };
}
function badge(x, y, n, col, a) {

  al(a); L.tx(String(n), x, y + 1, { f: F.M, s: 22, w: 700, a: 'center', b: 'middle', c: '#ffffff' });
}
function scene5(st, live) {

  const G = S5.guess != null, tl = G ? tl5() : null;

    ring: (n) => (dbl > .5 && maskOf(n, MA, MB) === 3 && uh < .5 ? OCHRE : null) });
  if (!G) { tipPill(p0); CK.s5 = null; return; }
  // számlálás: kis jelvények a kártyák sarkán
  tl.A.forEach((n, j) => { const [x, y] = L2.pos[n]; badge(x - 18, y - 30, j + 1, RED, smooth((st - tl.g0 - j * .22) / .2)); });
  tl.B.forEach((n, j) => { const [x, y] = L2.pos[n]; badge(x + 18, y - 30, j + 1, TEAL, smooth((st - tl.g1 - j * .22) / .2)); });

  if (aB > 0) { al(aB); L.pill(lab(MB) + ': ' + nB, 330, 935, { k: MB, s: 26, w: 700, f: F.B, c: TEAL, bg: CARD, bd: TEAL, bw: 2.5, pad: 10 }); }
  if (dbl > 0) {

    const x = LENS_AVOID[0] + LENS_AVOID[2] / 2, y = LENS_AVOID[1] + LENS_AVOID[3] / 2;
    al(dbl * (1 - uh)); L.pill(lab('kétszer'), x, y, { k: 'kétszer', s: 24, w: 700, f: F.B, a: 'center', c: OCHRE, bg: CARD, bd: OCHRE, bw: 2.5, pad: 10 });
  }
  if (uh > 0) {
    al(uh); MT((nA + nB) + ' − ' + nAB + ' = ' + nU, 760, 1014, { s: 34, a: 'left', c: RED });
    al(uh); L.pill(KN('egyesítésben', nU).s, 90, 1004, { k: 'egyesítésben', s: 26, w: 700, f: F.B, c: RED, bg: CARD, bd: RED, bw: 2.5, pad: 10 });
    TIPS5.forEach((v, j) => {
      const isG = S5.guess === v, ok = v === nU, col = ok ? GOOD : isG ? INK : MUT, x = 680 + (j - (TIPS5.length - 1) / 2) * 230;
      al(uh * (isG || ok ? 1 : .5));
      const b = L.pill(KN('tipp szám', v).s, x, 142, { k: 'tipp szám', s: 24, w: 700, f: F.B, a: 'center', c: col, bg: CARD, bd: col, bw: isG ? 3 : 2, pad: 10 });
      if (ok) { al(uh); mark(true, b.x + b.w + 18, 142, 24); }
    });
  } else tipPill(p0 * (1 - smooth((st - S5.gt) / .3)));
  CK.s5 = { nA, nB, nAB, nU, done: uh >= 1 };
}

/* ════════ 6. „Nem”: a kiegészítő halmaz ════════ */
const S6 = { mode: 'nemA', prev: null, t0: -9, btn: {} };
const MODES6 = [['nemA', 'nem A gomb'], ['nemB', 'nem B gomb'], ['egyik', 'egyik sem gomb']];
function reset6() { S6.mode = 'nemA'; S6.prev = null; S6.t0 = -9; sync6(); }
function sync6() { MODES6.forEach(([m]) => { if (S6.btn[m]) S6.btn[m].classList.toggle('on', m === S6.mode); }); }
function set6(m) { if (m === S6.mode) return; S6.prev = S6.mode; S6.mode = m; S6.t0 = L.st; sync6(); }
function scene6(st, live) {
  const h = smooth((st - .5) / .8), p = S6.prev ? smooth((st - S6.t0) / .5) : 1, f = hiFn(S6.prev, S6.mode, p);

/* ════════ ellenőrzések (QA: L.checks) – a rajzolt hely ↔ a számolt tartomány ════════ */
const CK = {};
function checks() {
  const out = [], ok = (name, got, want) => out.push({ name, ok: got === want, got, want }), i = L.step;
  const placed = (Lr, pa, pb) => NUMS.filter((n) => Lr.V.mask(Lr.pos[n][0], Lr.pos[n][1]) !== maskOf(n, pa, pb)).length;
  if (i === 0 && CK.s1) { const Lr = lay(CK.s1.prop); ok('1: rossz helyre rajzolt kártya', placed(Lr, CK.s1.prop), 0); ok('1: a körben lévők = a halmaz', CK.s1.inside.join(), CK.s1.arr.join()); }
  if (i >= 1 && i <= 5) { const Lr = lay(MA, MB); ok('2–6: rossz tartományba rajzolt kártya', placed(Lr, MA, MB), 0); ok('2–6: nincs átfedés', Lr.over, false); }
  if (i === 1 && CK.s2 && CK.s2.landed) ok('2: a vizsgált szám tartománya', CK.s2.at, maskOf(VX, MA, MB));
  if (i === 2 && CK.s3) ok('3: közös rész elemei', CK.s3.arr.join('; '), L.dat('közös rész elemei').v.join('; '));
  if (i === 4 && CK.s5 && CK.s5.done) { ok('5: elemszám-szita', CK.s5.nA + CK.s5.nB - CK.s5.nAB, CK.s5.nU); ok('5: egyesítés (.md)', CK.s5.nU, num('egyesítés elemszáma')); }
  if (i === 5 && CK.s6 && CK.s6.mode === 'egyik') ok('6: egyik sem (.md)', CK.s6.arr.join('; '), L.dat('egyik sem elemei').v.join('; '));
  if (i === 6 && CK.s7 && CK.s7.done) { const Lr = lay(MA, CK.s7.b); ok('7: rossz tartományba rajzolt kártya', placed(Lr, MA, CK.s7.b), 0); ok('7: részhalmaz ⇔ nincs ellenpélda', CK.s7.cex == null, CK.s7.rel === 'subset' || CK.s7.rel === 'equal'); }
  if (i === 7 && CK.s8 && CK.s8.done && !S8.or && !S8.strict) ok('8: egészek száma', CK.s8.res.length, Math.max(0, S8.b - S8.a + 1));
  if (i === 8 && CK.s9 && CK.s9.done) { const Lr = lay(CK.s9.a, CK.s9.b); ok('9: rossz tartományba rajzolt kártya', placed(Lr, CK.s9.a, CK.s9.b), 0); ok('9: nincs átfedés', CK.s9.over, false); }
  if (i === 8) {   // a kísérletező ábra minden párosítása (gyorsítótárazott, olcsó)
    const badPairs = [];
    PK.forEach((pa) => PK.forEach((pb) => { const Lr = lay(pa, pb); if (Lr.over || placed(Lr, pa, pb)) badPairs.push(pa + '/' + pb); }));

}

    NUMS = []; for (let n = lo; n <= hi; n++) NUMS.push(n);
    VX = clamp(Math.round(num('vizsgált szám')), lo, hi);
    NL = NLY.map((y) => MatLine.create(L, { x0: NLX[0], x1: NLX[1], y, v0: 0, v1: 12, scheme: 'fix', step: 1, major: 1, fmt: 'dec', s: 26 }));
    // a .md eredményei ↔ a lecke számolása
    const nA = NUMS.filter((n) => PROP[MA](n)).length, nB = NUMS.filter((n) => PROP[MB](n)).length, nU = elems(MA, MB, 'vagy').length;
    MatText.check(L, 'páros számok száma', nA);

    const lst = (k, arr) => { const v = L.dat(k).v.map(Math.round).join('; '); if (v !== arr.join('; ')) errBar(`Ellenőrzés: a .md „${k}” adata ${v}, a lecke számolása szerint ${arr.join('; ') || '(üres)'}. Javítsd a .md-t (vagy jelezd a hibát).`); };
    lst('közös rész elemei', elems(MA, MB, 'és'));
    lst('egyik sem elemei', elems(MA, MB, 'egyik'));
    TIPS5 = Array.from(new Set([nA + nB, nU, Math.max(nA, nB)])).sort((p, q) => q - p);
    // az elrendezések előre (ugrópróba: a köztes jelenetek az enter() nélkül is rajzolódnak)
    lay('páros'); lay(MA, MB); reset1(); reset4(); reset6(); reset7(); reset8(); reset9();
    L.checks = checks;
  },
  draw(Lx) {
    L = Lx; c = L.ctx; GA = 1; background();
    const sp = L.sp;
    if (L.step >= 0) sT[L.step] = L.st;
    for (const k in CUR) delete CUR[k];
    for (let i = 0; i < SCENES.length; i++) {
      const w = clamp(1 - Math.abs(sp - i) * 2); if (w <= .005) continue;
      GA = w; c.save(); SCENES[i](sT[i] == null ? 0 : sT[i], L.step === i); c.restore();
    }
    c.globalAlpha = 1;
  },
});
