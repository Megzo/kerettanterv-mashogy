   A modulblokkokat a lecke nem módosítja és nem bővíti (az NO, NO₂ molekulát és az egyatomos
   C, S, Ar „molekulát” a lecke KemMol.make-kel építi).
   ════════════════════════════════════════════════════════════════════════════ */

/* ── MODUL: Részecskemotor (Reszecske) · forrás: kemia-7-8/01-reszecskemodell, 2026-11-23 · v1.1 (2026-11-24) ── */
/* API
   Tantárgyfüggetlen 2D részecskeszimuláció (gáz, folyadék, szilárd rács, diffúzió, keverék),
   DETERMINISZTIKUS VISSZAJÁTSZÁSSAL. Nem hivatkozik a lecke kódjára; csak egy 2D vászon kell.
   Változtatás nélkül átemelhető (tervezett helye: shared/reszecske.js).

   const S = Reszecske.create({
     seed: 42,                   // véletlenmag (kezdőhelyek, kezdősebességek) – azonos mag → azonos futás
     dt: 1 / 120,                // fix lépésköz (s)
     box: {x, y, w, h},          // téglalap tartály (logikai px)
     walls: {l, r, t, b},        // opcionális: a fal helyzete fn(t) (zárt képletű dugattyú) – a box-on belül
     species: {                  // részecskefajták
       N2: {r: 12, m: 28, c: '#2f5fb3', draw: 'ketatom'},     // r: ütközési sugár px · m: relatív tömeg · c: szín
       H2O: {r: 12, m: 18, draw: 'viz'} },                   // draw: 'golyo' | 'ketatom' (c2: 2. atom színe) |
                                                              //   'viz' | 'etanol' | fn(ctx, x, y, r, ang, faj)
     T: 293,                     // hőmérséklet (K) – a termosztát célja
     vRef: 150,                  // négyzetes középsebesség px/s-ban m = 28, T = 293 K esetén (szemléltetés: lassított)
     thermo: 0.5,                // termosztát időállandója (s); 0 → nincs termosztát (az energia megmarad)
     collide: true,              // részecske–részecske rugalmas ütközés (false: átrepülnek egymáson)
     gravity: 0,                 // lefelé gyorsulás, px/s²
     attract: null,              // {eps, range}: vonzás, ha a felületek távolsága < range (eps: csúcs, px/s²) → folyadék
     anchorK: 0,                 // rugó a rácshelyhez (1/s²) a horgonyzott részecskékre → szilárd rács
     max: 600,                   // a részecskék felső száma
   });
   S.add('N2', 40, {region: {x, y, w, h}, lattice: 'random' | 'hex', gap: 2, anchor: false, tag: 0,
                    exact: false, fill: false}) → a ténylegesen letett darabszám
                               // csak az első S.at előtt; később esemény ({add}) kell.
                               // Ha a régióba (a gap-pel és a már bent lévőkkel) nem fér el n darab, a
                               // modul kevesebbet tesz le, és console.warn-nal szól (azonos hívásra egyszer);
                               // exact: true → a maradékot átfedéssel is leteszi (az ütközés széttolja),
                               // így pontosan n darab lesz (a max-korlátig); fill: true → n csak felső
                               // korlát („töltsd fel, ameddig elfér”, pl. hex rács), nincs figyelmeztetés
   S.at(t, events)             // az állapotot PONTOSAN a t. másodpercre hozza. events: időrendben,
                               //   [{t, set: {T, collide, gravity, attract, anchorK, thermo}},
                               //    {t, add: ['N2', 10, {region…}]}, {t, remove: 'N2' | fn(S, i) → bool},
                               //    {t, id: 'egyedi', fn: (S) => {…}}]
                               //   Azonos seed + azonos eseménysor → mindig ugyanaz az állapot. Előre csak
                               //   továbbfut; visszafelé (vagy ha egy múltbeli esemény változott) a legközelebbi
                               //   ellenőrzőpontból (0,5 s-onként mentve) számol újra.
   S.reset()                   // vissza a kezdőállapotba, ellenőrzőpontok törlése – enter(L)-ben hívd,
                               //   és mindig, ha a walls-függvény mögötti napló kiürül
   S.t                         // a szimuláció ideje (s)
   S.n, S.x[i], S.y[i], S.vx[i], S.vy[i], S.sp[i] (fajta indexe), S.names[], S.tag[i]   – csak olvasásra
   S.speeds(sp?)  → [px/s, …] · S.count(fn(S, i) → bool) · S.Tkin() → K (a mozgási energiából)
   S.hits(side)   → falba csapódás / s (mozgó átlag, τ = 1 s; side: 'l' | 'r' | 't' | 'b') – a nyomással arányos
   S.draw(ctx, {hl: (i) → bool, hlColor, alpha: (i) → 0..1, trail: s})   // 3D-hatású golyók, sötét körvonallal
   Reszecske.ball(ctx, x, y, r, szín, keret?)          // egy golyó ugyanabban a stílusban
   Reszecske.mol(ctx, draw, x, y, r, ang, faj)        // egy molekula (jelmagyarázathoz)
   Reszecske.zart(n, seed) → Z                        // zárt képletű „díszítő” halmaz (nincs szimuláció):
     Z.frame(t, phase, B, it)  → [{x, y, ang}]        //   phase: 0 rácsban rezeg · 1 folyadék · 2 gáz (közte átmenet)
                                                      //   B: {x, y, w, h, d (részecskeátmérő)}; it: átfedés-feloldás
   Teljesítmény: rácsos szomszédkeresés; ~400 részecske 120 Hz-en is bőven 60 fps.
   v1.1 (2026-11-24): add – figyelmeztetés, ha kevesebb fér el; exact és fill opció; visszaadja a darabszámot.
       A régi hívások ugyanazt a helyzetet adják (a véletlensorozat nem változik).
   ──────────────────────────────────────────────────────────────────────────────── */
const Reszecske = (() => {
  const TAU = Math.PI * 2;
  const rgb = (h) => { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
  const mixc = (a, b, t) => { const A = rgb(a), B = rgb(b); return 'rgb(' + A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',') + ')'; };
  const SPR = new Map();
  function sprite(col, bd) {
    const key = col + '|' + (bd || ''); let s = SPR.get(key); if (s) return s;
    s = document.createElement('canvas'); s.width = s.height = 80; const g = s.getContext('2d');
    const gr = g.createRadialGradient(29, 27, 2, 40, 40, 37);
    gr.addColorStop(0, mixc(col, '#ffffff', .62)); gr.addColorStop(.42, col); gr.addColorStop(1, mixc(col, '#000000', .36));
    g.beginPath(); g.arc(40, 40, 36, 0, TAU); g.fillStyle = gr; g.fill();
    const hl = g.createRadialGradient(28, 25, 0, 28, 25, 15); hl.addColorStop(0, 'rgba(255,255,255,.85)'); hl.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = hl; g.fill();
    g.lineWidth = 5; g.strokeStyle = bd || mixc(col, '#1c2440', .62); g.beginPath(); g.arc(40, 40, 35, 0, TAU); g.stroke();
    SPR.set(key, s); return s;
  }
  function ball(ctx, x, y, r, col, bd) { const k = r / 36; ctx.drawImage(sprite(col, bd), x - 40 * k, y - 40 * k, 80 * k, 80 * k); }
  const ELH = ['#f2ede2', '#565d72'], ELO = '#d6452c', ELC = '#3b4050';
  function mol(ctx, kind, x, y, r, ang, s) {
    if (typeof kind === 'function') return kind(ctx, x, y, r, ang, s);
    const ca = Math.cos(ang), sa = Math.sin(ang);
    if (kind === 'ketatom') {
      const d = r * .4, q = r * .62;
      ball(ctx, x - ca * d, y - sa * d, q, s.c, s.bd); ball(ctx, x + ca * d, y + sa * d, q, s.c2 || s.c, s.bd);
    } else if (kind === 'viz') {
      const ox = x - ca * r * .14, oy = y - sa * r * .14;
      for (const da of [-.912, .912]) ball(ctx, ox + Math.cos(ang + da) * r * .6, oy + Math.sin(ang + da) * r * .6, r * .4, ELH[0], ELH[1]);
      ball(ctx, ox, oy, r * .66, ELO);
    } else if (kind === 'etanol') {
      const px = -sa, py = ca, pts = [[-.56, .14, ELC, .46], [0, -.14, ELC, .46], [.56, .14, ELO, .42]];
      for (const [u, v, col, q] of pts) ball(ctx, x + ca * u * r + px * v * r, y + sa * u * r + py * v * r, q * r, col);
    } else ball(ctx, x, y, r, s.c, s.bd);
  }

  function create(cfg) {
    const h = cfg.dt || 1 / 120, MAX = cfg.max || 600, KC = Math.max(1, Math.round(.5 / h));
    const names = Object.keys(cfg.species);
    const SP = names.map((k) => Object.assign({ r: 8, m: 28, c: '#8a93a6', draw: 'golyo' }, cfg.species[k], { name: k }));
    const idx = {}; names.forEach((k, i) => { idx[k] = i; });
    const vRef = cfg.vRef || 150, kk = vRef * vRef * 28 / (2 * 293);
    const box = cfg.box, WF = cfg.walls || {};
    const FL = ['x', 'y', 'vx', 'vy', 'ax', 'ay', 'a0', 'w'];
    const S = { n: 0, names, species: SP, h, box };
    FL.forEach((f) => { S[f] = new Float64Array(MAX); });
    S.sp = new Int16Array(MAX); S.tag = new Int32Array(MAX);
    const rmax = SP.reduce((m, s) => Math.max(m, s.r), 0);
    let P = { T: cfg.T == null ? 293 : cfg.T, thermo: cfg.thermo == null ? .5 : cfg.thermo, collide: cfg.collide !== false,
      gravity: cfg.gravity || 0, attract: cfg.attract || null, anchorK: cfg.anchorK || 0, rng: (cfg.seed >>> 0) || 1,
      hits: [0, 0, 0, 0], wl: box.x, wr: box.x + box.w, wt: box.y, wb: box.y + box.h };
    let k = 0, ep = 0, sigs = [], evT = [], cps = [], base = null;
    const warned = new Set();
    const rnd = () => { let s = P.rng; s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; P.rng = s; return s / 4294967296; };
    const gauss = () => { const u = Math.max(1e-12, rnd()), v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v); };
    const wallAt = (side, t, def) => (typeof WF[side] === 'function' ? WF[side](t) : def);

    function addN(name, n, o = {}) {
      const si = idx[name]; if (si == null) throw new Error('Reszecske: ismeretlen fajta ' + name);
      const s = SP[si], R = o.region || { x: P.wl, y: P.wt, w: P.wr - P.wl, h: P.wb - P.wt }, gap = o.gap == null ? 2 : o.gap;
      const pts = [];
      if (o.lattice === 'hex') {
        const d = 2 * s.r + gap, dy = d * Math.sqrt(3) / 2, cols = Math.max(1, Math.floor((R.w - 2 * s.r) / d + 1e-9) + 1);
        const x0 = R.x + (R.w - (cols - 1) * d - d / 2) / 2;
        for (let j = 0; pts.length < n; j++) {
          const y = R.y + R.h - s.r - j * dy; if (y < R.y + s.r - 1e-6) break;
          for (let i = 0; i < cols && pts.length < n; i++) { const x = x0 + (j % 2) * d / 2 + i * d; if (x >= R.x + s.r - 1e-6 && x <= R.x + R.w - s.r + 1e-6) pts.push([x, y]); }
        }
      } else {
        for (let tries = 0; pts.length < n && tries < n * 400; tries++) {

       {a: 'X', surface: 'fem', to: ['Y'], Ea: 1},          // b nélkül: a szabad a a felületbe ütközve alakul át

     surfaces: [{id: 'kat', side: 'b', x0, x1, stick: ['H2O2'], on: false}],   // side: 'b' | 't' | 'l' | 'r' (a box fala);

const KemRx = (function () {
  const TAU = Math.PI * 2, U = Lesson.U, INK = '#1c2440', MUT = '#565d72', RED = '#c8401c', TEAL = '#0a6f86';
  const FL = ['x', 'y', 'vx', 'vy', 'ax', 'ay', 'a0', 'w'];   // a Reszecske részecsketömbjei (S.sp, S.tag mellett)
  const rng = (a, b) => { let s = (Math.imul(a + 1, 2654435761) ^ Math.imul(b + 7, 2246822519) ^ 0x5bd1e995) >>> 0 || 1;
    return () => { s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; };

  const elOf = (s) => KemMol.EL[s] || { c: '#9aa0ad', r: 1.6 };

    if (A && A[name]) return A[name];

    return null;
  }
  const addA = (acc, at, k = 1) => { for (const e in at) acc[e] = (acc[e] || 0) + at[e] * k; return acc; };
  const same = (a, b) => { for (const k of new Set([...Object.keys(a), ...Object.keys(b)])) if ((a[k] || 0) !== (b[k] || 0)) return false; return true; };
  function check(rules, A) {
    const err = [];
    rules.forEach((r, i) => {
      const lhs = {}, rhs = {}; let bad = false;
      for (const s of [r.a, r.b].filter(Boolean)) { const at = atomsOf(s, A); if (!at) { err.push('KemRx: ismeretlen összetétel: ' + s); bad = true; } else addA(lhs, at); }
      for (const s of r.to || []) { const at = atomsOf(s, A); if (!at) { err.push('KemRx: ismeretlen összetétel: ' + s); bad = true; } else addA(rhs, at); }
      if (!bad && !same(lhs, rhs)) err.push(`KemRx: a(z) ${i}. szabály nem atommegmaradó: ${JSON.stringify(lhs)} → ${JSON.stringify(rhs)}`);
    });

  }

  function create(S, cfg = {}) {
    const h = S.h, box = S.box, SP = S.species, idx = {};
    S.names.forEach((n, i) => { idx[n] = i; });
    const T0 = cfg.T0 || 293, kT0 = S.vrms(T0, 28) ** 2 * 28 / 2, A = cfg.atoms || {}, logC = cfg.log !== false, seed = cfg.seed || 7;
    const rules = (cfg.rules || []).map((r, i) => Object.assign({ Ea: 0, dE: 0, p: 1 }, r, { i }));
    const errs = check(rules, A);
    rules.forEach((r) => {
      const all = [r.a, r.b].concat(r.to || []).filter(Boolean);
      if (all.some((s) => idx[s] == null)) { errs.push('KemRx: a(z) ' + r.i + '. szabály fajtája nincs a motorban: ' + all.filter((s) => idx[s] == null).join(', ')); return; }
      const mIn = (r.a ? SP[idx[r.a]].m : 0) + (r.b ? SP[idx[r.b]].m : 0), mOut = (r.to || []).reduce((t, s) => t + SP[idx[s]].m, 0);
      if (Math.abs(mIn - mOut) > 1e-6) errs.push(`KemRx: a(z) ${r.i}. szabályban a tömeg nem marad meg (${mIn} → ${mOut})`);
    });
    errs.forEach((e) => console.error(e));
    const ok = (r) => [r.a, r.b].concat(r.to || []).filter(Boolean).every((s) => idx[s] != null);
    // szabad–szabad szabályok: PR[si][sj] → [szabály…] (Ea szerint növekvő)
    const PR = [];
    rules.filter((r) => r.b && !r.surface && ok(r)).sort((p, q) => p.Ea - q.Ea).forEach((r) => {
      for (const [x, y] of [[idx[r.a], idx[r.b]], [idx[r.b], idx[r.a]]]) { PR[x] = PR[x] || []; (PR[x][y] = PR[x][y] || []).includes(r) || PR[x][y].push(r); }
    });
    const SR = rules.filter((r) => r.surface && ok(r));

      const q = Object.assign({ side: 'b', on: false, stick: [] }, s), vert = q.side === 'l' || q.side === 'r';

    // fal-geometria: rés (gap), a faltól elfelé mutató sebesség, fal menti koordináta, befelé mutató normális
    const wall = (side, i) => {
      const r = SP[S.sp[i]].r, x = S.x[i], y = S.y[i];
      if (side === 'b') return { gap: box.y + box.h - (y + r), va: -S.vy[i], u: x, nx: 0, ny: -1 };
      if (side === 't') return { gap: y - r - box.y, va: S.vy[i], u: x, nx: 0, ny: 1 };
      if (side === 'l') return { gap: x - r - box.x, va: S.vx[i], u: y, nx: 1, ny: 0 };
      return { gap: box.x + box.w - (x + r), va: -S.vx[i], u: y, nx: -1, ny: 0 };
    };
    const onWall = (s, u, r) => {

    let LOG = [], COLL = [], ADS = [], SURF = [], VLOG = [];
    const pop = (arr, tc) => { while (arr.length && arr[arr.length - 1].t >= tc - 1e-9) arr.pop(); };

    // termékek: tömegközépponti sebesség + véletlen irányú relatív sebességek a megadott energiával

      const list = ru.to.map((s) => idx[s]), M = list.reduce((t, si) => t + SP[si].m, 0);

      else if (list.length > 1) {

        u.forEach((q) => { q[0] -= mx / M; q[1] -= my / M; });
      }

      const sc = Ku > 1e-12 ? Math.sqrt(Er / Ku) : 0;
      list.forEach((si, k) => {
        const rr = SP[si].r, l = Math.hypot(u[k][0], u[k][1]) || 1, d = list.length > 1 ? rr * 1.2 : 0;
        const p = { x: cx + u[k][0] / l * d, y: cy + u[k][1] / l * d }; clampIn(p, rr);

      for (const b of born) {

      }

      const dead = new Uint8Array(n), born = [];

          }
        }
      }
      // 2) felületek
      for (const s of surfs) {

        for (const ad of ADS) {

/* ── MODUL: pH és indikátor (KemPH) · forrás: kemia-7-8/10-sav-bazis, 2026-11-24 ──
   pH → indikátorszín (színpontok + interpoláció), 0–14-es pH-skála a vásznon jelölésekkel, erős sav –
   erős lúg közömbösítési (titrálási) görbe, H⁺/OH⁻-arányok. Csak a Lesson motorra épül (Lesson.U,

   feliratot a hívó adja {s, k} párként (szöveg + .md-kulcs); a skálaszámok kódban rögzítettek.
   Tervezett helye: shared/kemia/kemph.js.

   INDIKÁTOROK (KemPH.IND, kulcs → leírás; a színek tájékoztató jellegűek, a töménységtől függenek):
     'voroskaposzta'  antocián (vöröskáposzta-lé): sokszínű, pH 1–14 színpontokkal
     'lakmusz'        két szín (piros → kék), átmenet a range tartományban (alap 4,5–8,3), közepén lila

   KemPH.bracket(L, S, lo, hi, y, o)       kapocs a sáv fölött [lo, hi] között (pl. átcsapási tartomány);
       o: s, k (felirat fölötte), c (szín, alap tinta), a, lw

   KemPH.curve({Va, pHa, pHb, Vmax, n}) → [[V, pH], …]   titrálási görbe, a pont körül sűrűn mintavételezve

   KemPH.big(v, d = 2) → magyar szöveg nagy számra, d értékes jegyre: '550', '5500', '55 000', '550 ezer',

const KemPH = (() => {

     vöröskáposzta: pH 1–2 piros · 4 rózsaszín-lila · 6–7 ibolya · 8 kék · 10 kékeszöld · 12 zöld · 13–14 sárga
       (pl. Royal Society of Chemistry, „Red cabbage indicator” tanulókísérlet; a színek a kivonat
       töménységétől és a káposztától függenek);
     univerzális indikátor: 1 piros · 3 narancs · 5 sárga · 7 zöld · 9 kékeszöld · 11 kék · 13–14 ibolya
       (a pH-papírok színskálái gyártónként kissé eltérnek);

  const IND = {
    voroskaposzta: { pts: [[1, '#c81d3a'], [2, '#cf2a55'], [3, '#c4427c'], [4, '#ad549b'], [5, '#8c56a8'], [6, '#6c4ea8'], [7, '#5c4fb0'],
      [8, '#3a5fbf'], [9, '#2c7bb6'], [10, '#20938f'], [11, '#2c9e63'], [12, '#3da43a'], [13, '#a5b52a'], [14, '#d6b31e']] },
    lakmusz: { two: ['#cc2f3a', '#2e4fa3'], mid: '#83408f', range: [4.5, 8.3] },
    fenolftalein: { two: [null, '#c8137c'], range: [8.2, 10] },
    univerzalis: { pts: [[0, '#a8202e'], [1, '#d22b2b'], [2, '#e5522a'], [3, '#ee7c22'], [4, '#f4a422'], [5, '#efc61f'], [6, '#c7cc2a'], [7, '#7db83a'],
      [8, '#3f9d4a'], [9, '#1f8c78'], [10, '#2a6cb0'], [11, '#344f9e'], [12, '#4a3d8e'], [13, '#5a2f7f'], [14, '#4a2467']] },
  };

  function rgba(ind, pH, o = {}) {
    const I = IND[ind]; if (!I) throw new Error('KemPH: ismeretlen indikátor ' + ind);
    if (I.rgb) {
      const P = I.rgb; if (pH <= P[0][0]) return P[0][1].concat(1);
      for (let i = 1; i < P.length; i++) if (pH <= P[i][0]) return lerp3(P[i - 1][1], P[i][1], (pH - P[i - 1][0]) / (P[i][0] - P[i - 1][0])).concat(1);
      return P[P.length - 1][1].concat(1);

    const c = L.ctx, from = o.from == null ? 0 : o.from, to = o.to == null ? 14 : o.to, ind = o.ind || 'univerzalis', a = o.a == null ? 1 : o.a, s = o.s || 22;
    const X = (p) => x + (p - from) / (to - from) * w, inv = (px) => from + (px - x) / w * (to - from);
    c.save(); c.globalAlpha = a; c.lineJoin = 'miter'; c.lineCap = 'butt'; c.setLineDash([]);
    const g = c.createLinearGradient(x, 0, x + w, 0);
    for (let p = from; p <= to + 1e-9; p += .25) g.addColorStop(U.clamp((p - from) / (to - from)), color(ind, p, { range: o.range, none: '#f6f2ea' }));
    c.beginPath(); c.roundRect(x, y, w, h, 8); c.fillStyle = g; c.fill();
    c.strokeStyle = INK; c.lineWidth = 2.5; c.stroke();
    const nums = o.nums === undefined ? 'below' : o.nums, numY = nums === 'above' ? y - 12 : y + h + s + 8;
    for (let p = Math.ceil(from); p <= to; p++) {
      const xx = X(p);
      c.beginPath(); if (nums === 'above') { c.moveTo(xx, y - 6); c.lineTo(xx, y); } else { c.moveTo(xx, y + h); c.lineTo(xx, y + h + 7); }
      c.strokeStyle = INK; c.lineWidth = 2; c.stroke();
      if (nums) L.tx(String(p), xx, numY, { f: L.fonts.M, s, w: 600, a: 'center', c: p === 7 ? INK : MUT });
    }
    c.restore();
    const top = nums === 'above' ? numY - s * .8 : y, bottom = nums === 'below' ? numY + s * .25 : y + h;
    return { x, y, w, h, X, inv, numY, top, bottom, from, to };
  }

    const c = L.ctx, s = o.s || 22, gap = o.gap || 32, y0 = o.y0 == null ? S.bottom + s + 14 : o.y0, a = o.a == null ? 1 : o.a;
    const items = list.slice().sort((p, q) => p.pH - q.pH), boxes = [], leads = [];   // boxes: [x0, x1, tier]; leads: [x, utolsó szint]
    let bottom = S.y + S.h;

    items.forEach((m, mi) => {
      const wd = L.measure(m.s, { s, w: m.w || 600, f: L.fonts.B }).w, xp = S.X(m.pH);
      const later = items.slice(mi + 1).map((q) => S.X(q.pH)).filter((x) => Math.abs(x - xp) > 2);   // azonos helyű pont: az ő felirata a másik oldalra kerül
      // elhelyezés: középre a pont alá, vagy a vezetővonal mellé (balra / jobbra) – az első szabad szint;
      // a felirat nem takarhatja el a később jövő (nagyobb pH-jú) pontok vezetővonalát → lépcsőzetes elrendezés
      const nx = later.filter((x) => x > xp).reduce((m, x) => Math.min(m, x), Infinity);

      let best = null;
      for (let pass = 0; pass < 2 && !best; pass++) for (let t = 0; t < 14 && !best; t++) {
        for (const [side, cx] of opts) {

          if (b0 < S.x - 4 || b1 > S.x + S.w + 4) continue;
          if (side === 'center' && (xp < cx - wd / 2 - 2 || xp > cx + wd / 2 + 2)) continue;             // a vonal a felirat fölé fusson
          if (!pass && later.some((x) => x > b0 - 4 && x < b1 + 4)) continue;
          if (boxes.some((q) => q[2] === t && b0 < q[1] && b1 > q[0])) continue;                    // a szinten foglalt
          if (boxes.some((q) => q[2] < t && xp > q[0] - 3 && xp < q[1] + 3)) continue;              // a vezetővonal feliraton futna át
          if (leads.some((q) => q[1] >= t && q[0] > b0 && q[0] < b1)) continue;                     // egy korábbi vezetővonal a feliraton futna át
          best = { t, side, cx, b0, b1 }; break;
        }
      }
      if (!best) best = { t: 14, side: 'center', cx: xp, b0: xp - wd / 2, b1: xp + wd / 2 };
      boxes.push([best.b0, best.b1, best.t]); leads.push([xp, best.t]);

      if (best.side !== 'center') { c.beginPath(); c.arc(xp, ye, 3, 0, Math.PI * 2); c.fillStyle = 'rgba(28,36,64,.7)'; c.fill(); }
      if (o.dot !== false) { c.beginPath(); c.arc(xp, S.y + S.h, 5, 0, Math.PI * 2); c.fillStyle = m.c || INK; c.fill(); c.strokeStyle = '#fffaf1'; c.lineWidth = 1.5; c.stroke(); }
      L.tx(m.s, best.cx, ly, { s, w: m.w || 600, f: L.fonts.B, a: 'center', c: m.c || INK, k: m.k });

    const c = L.ctx, x0 = S.X(lo), x1 = S.X(hi), col = o.c || INK;
    c.save(); c.globalAlpha = o.a == null ? 1 : o.a; c.lineJoin = 'round'; c.lineCap = 'round'; c.setLineDash([]);
    c.beginPath(); c.moveTo(x0, y + 12); c.lineTo(x0, y); c.lineTo(x1, y); c.lineTo(x1, y + 12); c.strokeStyle = col; c.lineWidth = o.lw || 3; c.stroke();
    if (o.s) L.tx(o.s, (x0 + x1) / 2, y - 12, { s: o.fs || 22, w: 700, f: L.fonts.B, a: 'center', c: col, k: o.k });
    c.restore();
  }
  function pointer(L, S, pH, o = {}) {
    const c = L.ctx, x = S.X(U.clamp(pH, S.from, S.to)), col = o.c || INK;
    c.save(); c.globalAlpha = o.a == null ? 1 : o.a; c.lineJoin = 'miter'; c.setLineDash([]);
    c.beginPath(); c.moveTo(x, S.y - 4); c.lineTo(x, S.y + S.h + 4); c.strokeStyle = '#fffaf1'; c.lineWidth = 7; c.stroke(); c.strokeStyle = col; c.lineWidth = 3; c.stroke();
    const yt = o.up === false ? S.y + S.h + 6 : S.y - 6, d = o.up === false ? 1 : -1;
    c.beginPath(); c.moveTo(x, yt); c.lineTo(x - 13, yt + d * 20); c.lineTo(x + 13, yt + d * 20); c.closePath(); c.fillStyle = col; c.fill();
    c.restore();

  }

  const KW = 1e-14, WATER = 55.3;
  function titrate(q) {
    const nH = q.Va * Math.pow(10, -q.pHa), nOH = (q.Vb || 0) * Math.pow(10, q.pHb - 14), V = q.Va + (q.Vb || 0);
    const d = (nH - nOH) / V, h = d >= 0 ? (d + Math.sqrt(d * d + 4 * KW)) / 2 : 2 * KW / (-d + Math.sqrt(d * d + 4 * KW));
    return -Math.log10(h);
  }
  const veq = (q) => q.Va * Math.pow(10, -q.pHa) / Math.pow(10, q.pHb - 14);

    const ve = veq(q), Vmax = q.Vmax || 2 * ve, n = q.n || 300, xs = new Set();
    for (let i = 0; i <= n; i++) xs.add(+(Vmax * i / n).toFixed(6));
    for (let dv = -2; dv <= 2 + 1e-9; dv += .01) { const v = ve + dv; if (v >= 0 && v <= Vmax) xs.add(+v.toFixed(6)); }
    return [...xs].sort((a, b) => a - b).map((v) => [v, titrate(Object.assign({}, q, { Vb: v }))]);
  }

    const n0 = o.n0 == null ? 3 : o.n0, k = o.k == null ? 5 : o.k, mx = o.max || 40, d = Math.abs(7 - pH);
    const maj = Math.round(Math.min(mx, n0 + k * d)), min = Math.round(n0 * Math.max(0, 1 - d / 3));

    if (!(v > 0)) return U.fmt(v);

    const W = [[1e15, 'billiárd'], [1e12, 'billió'], [1e9, 'milliárd'], [1e6, 'millió']];
    for (const [m, w] of W) if (x >= m) { const y = x / m; return U.fmt(y, y < 10 && Math.abs(y - Math.round(y)) > 1e-9 ? 1 : 0) + ' ' + w; }
    if (x >= 1e5) return U.fmt(x / 1e3) + ' ezer';
    return U.fmt(x, x < 10 && Math.abs(x - Math.round(x)) > 1e-9 ? 1 : 0);
  }
  return { IND, rgba, color, liquid, bar, marks, bracket, pointer, titrate, veq, curve, kind, ions, ratio, perWater, dots, big, KW, WATER };
})();
/* ── MODUL VÉGE ── */

/* ── MODUL: GHS-piktogramok, bélyegek, flakon (KemGHS) · forrás: kemia-7-8/10-sav-bazis, 2026-11-24 ──
   A CLP/GHS veszélyességi piktogramjai valósághűen (piros keretes, csúcsára állított négyzet, fehér
   alap, fekete jel), a sorozat bélyegei („NE PRÓBÁLD KI”, „tanári bemutató”, „szemléltetés”) és egy
   háztartási flakon címkefelülettel. Csak a Lesson motorra épül (L.ctx, L.pill, L.fonts); a lecke
   kódjára nem hivatkozik. Szöveget csak L.tx / L.pill útján ír, a szöveget a hívó adja (.md-kulccsal).
   A piktogramok jelentését (pl. „maró”) a lecke .md-je adja – itt csak a rajz van.
   Tervezett helye: shared/kemia/kemghs.js.

   KemGHS.IDS = ['GHS01', …, 'GHS09']
   KemGHS.ALIAS: robbano GHS01 · tuzveszelyes GHS02 · oxidalo GHS03 · gaz GHS04 (nyomás alatti gáz) ·
       maro GHS05 · mergezo GHS06 (akut toxicitás, koponya) · felkialtojel GHS07 (irritáló, ártalmas) ·
       egeszseg GHS08 (egészségkárosító) · kornyezet GHS09

       ismeretlen jelnél console.error – a QA elkapja); üres szöveg vagy „–” → []

       o.a (átlátszóság) · o.hl (0..1: cinóber fényudvar körülötte – kiemelés, nem kitöltés) ·
       o.shadow (alap true: halvány árnyék a papíron). Az arányok a hivatalos rajzot követik: a piros
       keret a rombusz élhosszának kb. tizede, kívül vékony fehér szegély.
   KemGHS.row(L, ids, x, y, d, o) → [{id, cx, cy}]   piktogramok sorban (x: a sor bal széle, y: közép;
       o.gap: a rombuszok közti hézag, alap 0,08·d; o.hl: (id) → 0..1; o.a)
   KemGHS.hit(cx, cy, d, px, py) → bool     a pont a rombuszon belül van-e (kattintáshoz)
   KemGHS.stamp(L, s, x, y, o)   bélyeg (szerződés 13.): Bricolage 22 px, 600, −3°-kal elforgatva,
       papír alapon, 2 px keret. o.kind: 'tilos' (NE PRÓBÁLD KI – keret és szöveg #b3261e, 3 px) |
       'tanari' | 'szemleltetes' (halvány tinta) · o.k (md-kulcs) · o.a · o.al ('left' | 'center' |
       'right': x a bélyeg melyik széle) · o.rot (fok, alap −3) · o.s (alap 22). A QA-nak qa: false
       (forgatott pill). Visszaad: {x, y, w, h} (forgatás előtti doboz, a forgatási ponthoz képest).
   KemGHS.bottle(L, x, y, w, h, o) → {x, y, w, h}   háztartási flakon (x, y: bal felső sarok a kupakkal
       együtt; w, h: teljes méret); a visszaadott téglalap a címke helye (oda rajzolhatod a piktogramokat).
       o.body (a műanyag színe, alap '#f3f0e8'), o.cap (kupak, alap '#2f5fb3'), o.shape: 'flakon'
       (fogós, széles, lefolyótisztító/hypo) | 'palack' (keskeny nyakú) | 'uveg' (üveg, áttetsző: o.liquid
       a tartalom színe, o.level 0..1), o.label (a címke alapszíne, alap '#fffaf1'), o.a
   ───────────────────────────────────────────────────────────────────────────── */
const KemGHS = (() => {
  const TAU = Math.PI * 2, INK = '#1c2440', MUT = '#565d72', RED = '#c8401c', GHSRED = '#e2001a', BLK = '#141414';
  const IDS = ['GHS01', 'GHS02', 'GHS03', 'GHS04', 'GHS05', 'GHS06', 'GHS07', 'GHS08', 'GHS09'];
  const ALIAS = { robbano: 'GHS01', tuzveszelyes: 'GHS02', oxidalo: 'GHS03', gaz: 'GHS04', maro: 'GHS05', mergezo: 'GHS06', felkialtojel: 'GHS07', egeszseg: 'GHS08', kornyezet: 'GHS09' };
  function norm(id) {
    const s = String(id).trim(); if (IDS.includes(s.toUpperCase())) return s.toUpperCase();
    if (ALIAS[s.toLowerCase()]) return ALIAS[s.toLowerCase()];
    console.error('KemGHS: ismeretlen piktogram: ' + id); return null;
  }
  const parse = (s) => (!s || /^\s*[–-]\s*$/.test(s) ? [] : String(s).split(/[\s,;]+/).filter(Boolean).map(norm).filter(Boolean));

  /* ── a jelek egy 100 × 100-as rombuszban (csúcsok: (50,0) (100,50) (50,100) (0,50)); a fekete jel
     az |x − 50| + |y − 50| ≤ 37 tartományban marad (a keret belső éle kb. 41) ── */
  function flamePath(c, x0, y0, k) {      // láng: alja (x0, y0), magassága k·40
    const P = (x, y) => [x0 + (x - 50) * k, y0 + (y - 66) * k];
    c.beginPath(); c.moveTo(...P(37, 66));
    c.bezierCurveTo(...P(30, 58), ...P(32, 47), ...P(39, 40));
    c.bezierCurveTo(...P(38.5, 46), ...P(40.5, 50.5), ...P(44, 52));
    c.bezierCurveTo(...P(41.5, 43), ...P(45.5, 33), ...P(53, 26));
    c.bezierCurveTo(...P(51.5, 34), ...P(55.5, 40.5), ...P(58.5, 45));
    c.bezierCurveTo(...P(60, 41.5), ...P(60, 38.5), ...P(59.5, 35.5));
    c.bezierCurveTo(...P(66.5, 43), ...P(70, 55), ...P(63, 66));
    c.closePath();
  }
  function flameHole(c, x0, y0, k) {      // a láng belső, fehér nyelve
    const P = (x, y) => [x0 + (x - 50) * k, y0 + (y - 66) * k];
    c.beginPath(); c.moveTo(...P(44.5, 66)); c.bezierCurveTo(...P(42.5, 60), ...P(45.5, 55), ...P(49.5, 51.5));
    c.bezierCurveTo(...P(49, 56), ...P(52.5, 58), ...P(54.5, 55.5)); c.bezierCurveTo(...P(57.5, 59.5), ...P(57, 63.5), ...P(55.5, 66)); c.closePath();
  }
  const SYM = {
    GHS01(c) {        // robbanó bomba: széthasadó golyó, repeszek, robbanási csillag
      c.beginPath(); const n = 11;
      for (let i = 0; i <= 2 * n; i++) { const an = -Math.PI / 2 + i * Math.PI / n, r = i % 2 ? 7.5 : (i % 4 ? 15 : 18); const x = 50 + Math.cos(an) * r * 1.05, y = 45 + Math.sin(an) * r; i ? c.lineTo(x, y) : c.moveTo(x, y); }
      c.closePath(); c.fill();
      c.beginPath(); c.arc(50, 61, 9.5, Math.PI * 1.08, Math.PI * 1.92, true); c.closePath(); c.fill();
      for (const [x, y, a, s] of [[32, 33, .6, 4], [68, 31, -.5, 4.5], [29, 51, .2, 3.5], [71, 50, -.3, 3.5], [38, 24, .9, 3], [62, 22, -.8, 3]]) {
        c.save(); c.translate(x, y); c.rotate(a); c.beginPath(); c.moveTo(-s, -s * .5); c.lineTo(s * .9, -s * .7); c.lineTo(s, s * .6); c.lineTo(-s * .7, s * .7); c.closePath(); c.fill(); c.restore();
      }
    },
    GHS02(c) {        // láng
      flamePath(c, 50, 65, 1); c.fill();
      c.save(); c.fillStyle = '#ffffff'; flameHole(c, 50, 65, 1); c.fill(); c.restore();
      c.fillRect(33, 67.5, 34, 5);
    },
    GHS03(c) {        // láng a kör fölött (oxidáló)
      c.beginPath(); c.arc(50, 59, 9.5, 0, TAU); c.lineWidth = 5; c.stroke();
      c.save(); c.beginPath(); c.rect(0, 0, 100, 52); c.clip(); flamePath(c, 50, 54, .78); c.fill(); c.restore();
      c.save(); c.fillStyle = '#ffffff'; c.beginPath(); c.arc(50, 59, 7, 0, TAU); c.fill(); c.restore();
      c.fillRect(35, 70.5, 30, 4.5);
    },
    GHS04(c) {        // gázpalack
      c.save(); c.translate(50, 54); c.rotate(-.42);
      c.beginPath(); c.roundRect(-24, -7.5, 40, 15, [7.5, 2, 2, 7.5]); c.fill();
      c.beginPath(); c.moveTo(16, -5); c.lineTo(21, -3); c.lineTo(21, 3); c.lineTo(16, 5); c.closePath(); c.fill();
      c.fillRect(21, -2.2, 4, 4.4); c.fillRect(24.5, -5, 3.5, 10);
      c.save(); c.fillStyle = '#ffffff'; c.globalAlpha *= .9; c.fillRect(-16, -4.6, 26, 1.6); c.restore();
      c.restore();
    },
    GHS05(c) {        // maró: két kémcső, cseppek egy fémlapra és egy kézre, amelyek „kimaródnak”
      const tube = (x1, y1, x2, y2) => {   // (x1, y1): zárt vég, (x2, y2): a nyílás
        const an = Math.atan2(y2 - y1, x2 - x1), len = Math.hypot(x2 - x1, y2 - y1), wd = 6.4;
        c.save(); c.translate(x1, y1); c.rotate(an);
        c.beginPath(); c.moveTo(len, -wd / 2); c.lineTo(wd / 2, -wd / 2); c.arc(wd / 2, 0, wd / 2, -Math.PI / 2, Math.PI / 2, true); c.lineTo(len, wd / 2);
        c.lineWidth = 2.1; c.lineJoin = 'round'; c.stroke();
        c.beginPath(); c.moveTo(len - 1, -wd / 2 + 1); c.lineTo(len * .42, -wd / 2 + 1); c.lineTo(len * .42, wd / 2 - 1); c.lineTo(len - 1, wd / 2 - 1); c.closePath(); c.fill();
        c.beginPath(); c.moveTo(len, -wd / 2 - 1.4); c.lineTo(len, wd / 2 + 1.4); c.lineWidth = 1.8; c.stroke();
        c.restore();
      };

      tube(35.5, 26.5, 46, 39); tube(64.5, 26.5, 54, 39);
      drop(45.4, 44.2, 1.45); drop(44.9, 49.2, 1.15); drop(54.6, 44.2, 1.45); drop(55.1, 49.2, 1.15);
      // fémlap (bal): a cseppek helyén kimarva
      c.beginPath(); c.moveTo(21.5, 54.5); c.lineTo(40.5, 54.5); c.lineTo(41.6, 57.2); c.lineTo(43.1, 55.3); c.lineTo(44.6, 58.3); c.lineTo(46.2, 56.2); c.lineTo(47.2, 61.5); c.lineTo(21.5, 61.5); c.closePath(); c.fill();
      // kéz (jobb, oldalnézet, tenyérrel lefelé): csukló jobbra, három ujj balra; a középső ujjhegy kimarva
      c.beginPath(); c.moveTo(78, 51.6); c.lineTo(68, 51.6); c.quadraticCurveTo(64.5, 50.6, 62, 52.2);
      c.lineTo(55.2, 52.4); c.quadraticCurveTo(53.4, 52.6, 53.6, 54.2); c.quadraticCurveTo(53.8, 55.4, 55, 55.4);
      c.lineTo(54.8, 55.6); c.lineTo(53.2, 56.2); c.lineTo(54.5, 57); c.lineTo(52.8, 57.6); c.lineTo(54.6, 58.2);   // kimart ujjhegy
      c.lineTo(56, 58.3); c.quadraticCurveTo(54.4, 58.8, 54.8, 60); c.quadraticCurveTo(55.2, 61.2, 57, 61.1);
      c.lineTo(63, 61); c.quadraticCurveTo(66, 61.8, 68, 61.6); c.lineTo(78, 61.6); c.closePath(); c.fill();
      c.save(); c.strokeStyle = '#ffffff'; c.lineWidth = .75; c.lineCap = 'round';
      c.beginPath(); c.moveTo(56, 55.4); c.lineTo(62.5, 55.2); c.moveTo(56.5, 58.3); c.lineTo(62.5, 58.2); c.moveTo(68.5, 52.6); c.lineTo(68.5, 60.6); c.stroke(); c.restore();
      // talaj
      c.fillRect(27, 64.5, 46, 4.2);
    },
    GHS06(c) {        // koponya és keresztcsontok
      const bone = (x1, y1, x2, y2) => {
        const an = Math.atan2(y2 - y1, x2 - x1), nx = -Math.sin(an) * 2.3, ny = Math.cos(an) * 2.3;
        c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.lineWidth = 4.2; c.lineCap = 'butt'; c.stroke();
        for (const [x, y] of [[x1, y1], [x2, y2]]) for (const s of [-1, 1]) { c.beginPath(); c.arc(x + nx * s, y + ny * s, 2.7, 0, TAU); c.fill(); }
      };
      bone(33, 55, 67, 71); bone(67, 55, 33, 71);
      c.beginPath(); c.ellipse(50, 40.5, 13, 12.5, 0, 0, TAU); c.fill();
      c.beginPath(); c.roundRect(43, 46, 14, 11, 3); c.fill();
      c.save(); c.fillStyle = '#ffffff';
      c.beginPath(); c.ellipse(45, 41, 3.6, 4.1, -.15, 0, TAU); c.fill(); c.beginPath(); c.ellipse(55, 41, 3.6, 4.1, .15, 0, TAU); c.fill();
      c.beginPath(); c.moveTo(50, 45.2); c.lineTo(48.3, 49); c.lineTo(51.7, 49); c.closePath(); c.fill();
      for (const x of [46.2, 49, 51.8]) c.fillRect(x, 53, 1.3, 4);
      c.restore();
    },
    GHS07(c) {        // felkiáltójel
      c.beginPath(); c.moveTo(44.6, 28); c.quadraticCurveTo(50, 23.5, 55.4, 28); c.lineTo(52.8, 61); c.lineTo(47.2, 61); c.closePath(); c.fill();
      c.beginPath(); c.arc(50, 69.5, 5, 0, TAU); c.fill();
    },
    GHS08(c) {        // egészségkárosító: mellkép, a mellkason fehér csillag
      c.beginPath(); c.arc(50, 29, 6.6, 0, TAU); c.fill();
      c.fillRect(46.8, 34, 6.4, 5);
      c.beginPath(); c.moveTo(44, 38.5); c.lineTo(56, 38.5); c.quadraticCurveTo(66, 39.5, 67.5, 48); c.lineTo(66.5, 69); c.lineTo(33.5, 69); c.lineTo(32.5, 48); c.quadraticCurveTo(34, 39.5, 44, 38.5); c.closePath(); c.fill();
      c.save(); c.fillStyle = '#ffffff'; c.beginPath();
      for (let i = 0; i <= 16; i++) { const an = -Math.PI / 2 + i * Math.PI / 8, r = i % 2 ? 3.6 : 9.6; const x = 50 + Math.cos(an) * r, y = 54.5 + Math.sin(an) * r; i ? c.lineTo(x, y) : c.moveTo(x, y); }
      c.closePath(); c.fill(); c.restore();
    },
    GHS09(c) {        // környezetre veszélyes: kiszáradt fa, döglött hal
      c.lineCap = 'round'; c.lineJoin = 'round';
      c.beginPath(); c.moveTo(36, 65); c.lineTo(36.5, 31); c.lineWidth = 3.8; c.stroke();
      c.lineWidth = 2.2; c.beginPath();
      c.moveTo(36.4, 45); c.lineTo(28, 38); c.moveTo(31.5, 41); c.lineTo(30.5, 35.5);
      c.moveTo(36.4, 39); c.lineTo(44.5, 31.5); c.moveTo(41.2, 34.6); c.lineTo(42.5, 29);
      c.moveTo(36.5, 52); c.lineTo(44, 47); c.moveTo(36.4, 33); c.lineTo(32, 28.5);
      c.stroke();
      c.beginPath(); c.moveTo(29, 65.8); c.quadraticCurveTo(40, 63.6, 50, 65.2); c.quadraticCurveTo(60, 66.8, 71, 65.2); c.lineWidth = 3; c.stroke();
      // hal (hasán fekszik, felfelé fordulva): test + farok
      c.beginPath(); c.ellipse(58, 58.6, 10.2, 4.3, -.05, 0, TAU); c.fill();
      c.beginPath(); c.moveTo(66.5, 58.2); c.lineTo(73.5, 53.6); c.lineTo(72.2, 58.4); c.lineTo(73.8, 63); c.closePath(); c.fill();
      c.save(); c.strokeStyle = '#ffffff'; c.lineWidth = 1; c.lineCap = 'round';
      c.beginPath(); c.moveTo(50.5, 56.5); c.lineTo(53, 59); c.moveTo(53, 56.5); c.lineTo(50.5, 59); c.stroke();
      c.beginPath(); c.moveTo(56, 55.6); c.quadraticCurveTo(57.5, 58.6, 56, 61.6); c.stroke(); c.restore();
    },
  };

  function draw(L, id, cx, cy, d, o = {}) {
    const key = norm(id); if (!key) return;
    const c = L.ctx, s = d / 100, a0 = c.globalAlpha * (o.a == null ? 1 : o.a);
    c.save(); c.translate(cx - 50 * s, cy - 50 * s); c.scale(s, s);
    c.lineJoin = 'miter'; c.lineCap = 'butt'; c.setLineDash([]);
    const dia = (e) => { c.beginPath(); c.moveTo(50, e); c.lineTo(100 - e, 50); c.lineTo(50, 100 - e); c.lineTo(e, 50); c.closePath(); };
    if (o.hl > 0) { c.globalAlpha = a0 * o.hl * .22; dia(-11); c.lineWidth = 10; c.strokeStyle = RED; c.lineJoin = 'round'; c.stroke(); c.globalAlpha = a0 * o.hl; dia(-6); c.lineWidth = 4.5; c.stroke(); c.lineJoin = 'miter'; }
    c.globalAlpha = a0;
    if (o.shadow !== false) { c.save(); c.translate(1.4, 2); dia(0); c.fillStyle = 'rgba(28,36,64,.16)'; c.fill(); c.restore(); }
    dia(0); c.fillStyle = '#ffffff'; c.fill(); c.strokeStyle = 'rgba(28,36,64,.35)'; c.lineWidth = .8; c.stroke();
    dia(7.6); c.strokeStyle = GHSRED; c.lineWidth = 7.4; c.stroke();
    c.fillStyle = BLK; c.strokeStyle = BLK; SYM[key](c);
    c.restore();
  }
  function row(L, ids, x, y, d, o = {}) {
    const gap = o.gap == null ? d * .08 : o.gap, out = [];
    ids.forEach((id, i) => { const cx = x + d / 2 + i * (d + gap); draw(L, id, cx, y, d, { a: o.a, hl: o.hl ? o.hl(id) : 0, shadow: o.shadow }); out.push({ id, cx, cy: y }); });
    return out;
  }
  const hit = (cx, cy, d, px, py) => Math.abs(px - cx) + Math.abs(py - cy) <= d / 2;

  function stamp(L, s, x, y, o = {}) {
    const c = L.ctx, tilos = o.kind === 'tilos', col = tilos ? '#b3261e' : MUT;
    c.save(); if (o.a != null) c.globalAlpha *= o.a;
    c.translate(x, y); c.rotate((o.rot == null ? -3 : o.rot) * Math.PI / 180);
    const b = L.pill(s, 0, 0, { s: o.s || 22, w: tilos ? 700 : 600, ls: '0.08em', bg: '#fffaf1', bd: col, bw: tilos ? 3 : 2, c: col, r: 6, pad: 10, k: o.k, qa: false, a: o.al || 'left' });
    c.restore();

  }

  function bottle(L, x, y, w, h, o = {}) {
    const c = L.ctx, body = o.body || '#f3f0e8', cap = o.cap || '#2f5fb3', shape = o.shape || 'flakon';
    const bd = (col) => { const n = parseInt(col.slice(1), 16), r = n >> 16 & 255, g = n >> 8 & 255, b = n & 255; return `rgb(${Math.round(r * .38 + 28 * .62)},${Math.round(g * .38 + 36 * .62)},${Math.round(b * .38 + 64 * .62)})`; };
    c.save(); if (o.a != null) c.globalAlpha *= o.a; c.lineJoin = 'round'; c.lineCap = 'butt'; c.setLineDash([]);
    let lab;
    if (shape === 'flakon') {
      const ch = h * .1, nw = w * .3, nx = x + w * .2, sh = y + ch + h * .1, by = y + h;
      c.beginPath(); c.roundRect(nx - 4, y, nw + 8, ch, 5); c.fillStyle = cap; c.fill(); c.strokeStyle = INK; c.lineWidth = 2.5; c.stroke();
      for (let i = 1; i < 6; i++) { c.beginPath(); c.moveTo(nx - 4 + (nw + 8) * i / 6, y + 3); c.lineTo(nx - 4 + (nw + 8) * i / 6, y + ch - 3); c.strokeStyle = 'rgba(0,0,0,.22)'; c.lineWidth = 2; c.stroke(); }
      c.beginPath(); c.moveTo(nx, y + ch); c.lineTo(nx, y + ch + h * .04); c.quadraticCurveTo(x, y + ch + h * .06, x, sh + h * .06);
      c.lineTo(x, by - 14); c.quadraticCurveTo(x, by, x + 14, by); c.lineTo(x + w - 14, by); c.quadraticCurveTo(x + w, by, x + w, by - 14);
      c.lineTo(x + w, sh + h * .02); c.quadraticCurveTo(x + w, y + ch + h * .03, x + w * .72, y + ch + h * .03); c.lineTo(nx + nw, y + ch + h * .03); c.lineTo(nx + nw, y + ch); c.closePath();
      c.fillStyle = body; c.fill(); c.strokeStyle = bd(body); c.lineWidth = 3; c.stroke();

      lab = { x: x + w * .1, y: y + h * .34, w: w * .8, h: h * .56 };

      const ch = h * .09, nw = w * .36, nx = x + (w - nw) / 2, sh = y + ch + h * .16, by = y + h;
      c.beginPath(); c.roundRect(nx - 3, y, nw + 6, ch, 5); c.fillStyle = cap; c.fill(); c.strokeStyle = INK; c.lineWidth = 2.5; c.stroke();
      const path = () => { c.beginPath(); c.moveTo(nx, y + ch); c.lineTo(nx, y + ch + h * .05); c.bezierCurveTo(nx, sh - h * .02, x, sh - h * .05, x, sh + h * .04); c.lineTo(x, by - 12); c.quadraticCurveTo(x, by, x + 12, by); c.lineTo(x + w - 12, by); c.quadraticCurveTo(x + w, by, x + w, by - 12); c.lineTo(x + w, sh + h * .04); c.bezierCurveTo(x + w, sh - h * .05, nx + nw, sh - h * .02, nx + nw, y + ch + h * .05); c.lineTo(nx + nw, y + ch); c.closePath(); };
      if (shape === 'uveg') {
        path(); c.fillStyle = 'rgba(255,255,255,.45)'; c.fill();
        if (o.level > 0) { c.save(); path(); c.clip(); const yl = by - (by - sh) * o.level; c.fillStyle = o.liquid || 'rgba(70,150,215,.42)'; c.fillRect(x, yl, w, by - yl); c.restore(); }

        c.save(); c.globalAlpha *= .6; c.beginPath(); c.moveTo(x + 10, sh + h * .08); c.lineTo(x + 10, by - 20); c.strokeStyle = '#ffffff'; c.lineWidth = 5; c.stroke(); c.restore();
      } else { path(); c.fillStyle = body; c.fill(); c.strokeStyle = bd(body); c.lineWidth = 3; c.stroke(); }

    c.restore();

  }
  return { IDS, ALIAS, parse, draw, row, hit, stamp, bottle };
})();

   A LECKE
   ════════════════════════════════════════════════════════════════════════════ */
const U = Lesson.U, { clamp, lerp, smooth, inOut, TAU } = U, fmt = U.fmt;
const F = Lesson.FONTS;

        format: (v) => (+v === 0 ? lab('tiszta') : +v === 100 ? lab('szennyezett') : fmt(+v) + ' %'),
        onInput: (v) => { S4.log = pushLog(S4.log, { t: L.st, v: +v, dur: .5 }); } }); } },
    { settle: 6, enter() { reset5(); },
      controls(Lx) {
        Lx.slider({ label: lab('év csúszka'), k: 'év csúszka', min: 0, max: 100, step: 5, value: 100, format: (v) => labN('év', fmt(+v)),
          onInput: (v) => { S5.yl = pushLog(S5.yl, { t: L.st, v: +v, dur: .6 }); } });
        Lx.slider({ label: lab('ph csúszka'), k: 'ph csúszka', min: 4, max: 5.6, step: .1, value: 4.2, format: (v) => 'pH ' + fmt(+v, 1),
          onInput: (v) => { S5.pl = pushLog(S5.pl, { t: L.st, v: +v }); } });
      } },
    { settle: 5, enter() { reset6(); },
      controls(Lx) { Lx.slider({ label: lab('magasság csúszka'), k: 'magasság csúszka', min: 0, max: 50, step: 1, value: 25, format: (v) => labN('km', fmt(+v)),
        onInput: (v) => { S6.log = pushLog(S6.log, { t: L.st, v: +v, dur: .5 }); } }); } },
    { settle: 4, enter() { reset7(); } },
    { settle: 5, enter() { reset8(); },
      controls(Lx) {
        Lx.button(lab('téli gomb'), () => { S8.mode = pushLog(S8.mode, { t: L.st, id: 'teli' }); }, 'téli gomb');
        Lx.button(lab('nyári gomb'), () => { S8.mode = pushLog(S8.mode, { t: L.st, id: 'nyari' }); }, 'nyári gomb');
        Lx.slider({ label: lab('szél csúszka'), k: 'szél csúszka', min: 0, max: 3, step: 1, value: 0,
          format: (v) => (+v === 0 ? lab('szélcsend') : +v === 3 ? lab('erős szél') : fmt(+v)), onInput: (v) => { S8.wind = pushLog(S8.wind, { t: L.st, v: +v }); } });
      } },
    { settle: 3.5 },
  ],
  init(Lx) {
    L = Lx; c = L.ctx;
    build1(); build3();
    S4.Z = Reszecske.zart(24, 5);
    S7.P = BioPlot.create(L, { x: 790, y: 150, w: 500, h: 240, xa: { min: 1950, max: 2030, ticks: [1960, 1980, 2000, 2020], fmt: (v) => String(v) }, ya: { min: 260, max: 440, ticks: [280, 320, 360, 400, 440] } });
    reset1(); reset2(); reset3(); reset4(); reset5(); reset6(); reset7(); reset8();
    L.checks = () => {
      const out = [], K = counts1();
      out.push({ name: '100-as ablak: 78 + 21 + 1 = 100', ok: K.c100[0] + K.c100[1] + K.c100[2] === 100, got: K.c100.join(' + '), want: 100 });
      out.push({ name: '10 000-es rács összege', ok: K.c10k.reduce((s, v) => s + v, 0) === 10000, got: K.c10k.join(' + '), want: 10000 });
      out.push({ name: 'a 100-as ablak részecskéi', ok: S1.sim.n === 100, got: S1.sim.n, want: 100 });
      out.push({ name: 'CO₂ a rácsban = ppm / 100', ok: S1.co2.length === Math.round(L.num('CO₂ a levegőben') / 100), got: S1.co2.length, want: Math.round(L.num('CO₂ a levegőben') / 100) });
      for (const k of ['metán égése', 'szén égése', 'kén égése', 'nitrogén és oxigén', 'szénsav keletkezése', 'kénessav keletkezése', 'márvány oldódása', 'ózon keletkezése']) {
        const r = KemTx.check(L.val(k)); out.push({ name: 'kiegyenlített: ' + k, ok: r.ok, got: r.diff.join(', ') || 'ok', want: 'ok' });
      }
      for (const id in S3.M) S3.M[id].forEach((M, j) => out.push({ name: 'morf atomjai: ' + id + ' ' + j, ok: !M.err, got: M.err || JSON.stringify(M.count), want: 'ok' }));
      const A = (s) => KEM_ELEMEK.bySym[s].A;
      out.push({ name: '12 g C + 32 g O → 44 g CO₂', ok: Math.round(A('C')) === 12 && Math.round(2 * A('O')) === 32 && Math.round(A('C') + 2 * A('O')) === 44, got: [A('C'), 2 * A('O')].join(' + '), want: '12 + 32 = 44' });
      out.push({ name: 'tiszta eső pH a csúszka 0-jánál', ok: Math.abs(ph4(0) - L.num('tiszta eső pH-ja')) < 1e-9, got: ph4(0), want: L.num('tiszta eső pH-ja') });
      out.push({ name: 'szennyezett eső pH a csúszka 100-ánál', ok: Math.abs(ph4(100) - phLo4()) < 1e-9, got: ph4(100), want: phLo4() });
      out.push({ name: 'savas eső < tiszta eső', ok: L.dat('savas eső pH-ja').hi < L.num('tiszta eső pH-ja'), got: L.dat('savas eső pH-ja').hi, want: '< ' + L.num('tiszta eső pH-ja') });
      out.push({ name: 'gyertya kialszik < levegő O₂', ok: L.num('gyertya kialszik') < L.num('oxigén aránya'), got: L.num('gyertya kialszik'), want: '< ' + L.num('oxigén aránya') });
      out.push({ name: 'vasgyapot: a víz emelkedése → 1/5 (3 nap)', ok: Math.abs(ironF(3) * 100 - L.num('oxigén aránya')) < .1, got: +(ironF(3) * 100).toFixed(2), want: L.num('oxigén aránya') });
      const D = L.dat('CO₂ Mauna Loa');
      out.push({ name: 'Mauna Loa utolsó éve = CO₂ a levegőben', ok: D.y[D.y.length - 1] === L.num('CO₂ a levegőben') && D.x[D.x.length - 1] === L.dat('CO₂ a levegőben').yr, got: D.x[D.x.length - 1] + ': ' + D.y[D.y.length - 1], want: L.dat('CO₂ a levegőben').yr + ': ' + L.num('CO₂ a levegőben') });
      out.push({ name: 'montreal < helyreállás, felfedezés ≤ montreal', ok: L.num('ózonlyuk felfedezése') <= L.num('montreali jegyzőkönyv') && L.num('montreali jegyzőkönyv') < L.num('ózonréteg helyreállása'), got: [L.num('ózonlyuk felfedezése'), L.num('montreali jegyzőkönyv'), L.num('ózonréteg helyreállása')].join(' · '), want: 'növekvő' });
      if (L.step === 4) { const pH = logV(S5.pl.map((e) => ({ t: e.t, v: e.v, dur: .3 })), L.st), m = Math.pow(10, L.num('tiszta eső pH-ja') - pH); out.push({ name: 'kopás szorzó = 10^(5,6 − pH)', ok: Math.abs(rate5(pH) / rate5(L.num('tiszta eső pH-ja')) / m - 1) < 1e-9, got: +m.toFixed(2), want: 'arány' }); }
      return out;
    };
  },
  draw(Lx) {
    L = Lx; c = L.ctx; GA = 1; background();
    if (L.step >= 0) sT[L.step] = L.st;
    for (let i = 0; i < NS; i++) {
      const w = clamp(1 - Math.abs(L.sp - i) * 2); if (w <= .005) continue;
      GA = 1; c.lineJoin = 'miter'; c.lineCap = 'butt'; c.setLineDash([]); SCENES[i](sT[i], w, i === L.step);
    }
    c.globalAlpha = 1; c.lineJoin = 'miter'; c.lineCap = 'butt'; c.setLineDash([]);
  },
});

})();
</script>
