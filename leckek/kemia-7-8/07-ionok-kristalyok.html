/* ── MODUL: Elemadatok (KEM_ELEMEK) · forrás: kemia-7-8/05-atom-hejak, 2026-11-23 ──
   window.KEM_ELEMEK[Z − 1] = { Z, s, nev, A, cs, p, fi, fem, csalad, hal, stab }
     Z      rendszám (1–118)              s    vegyjel ('Na')        nev  magyar név ('nátrium')
     A      relatív atomtömeg (IUPAC rövidített standard, 4 értékes jegyig kerekítve;
            stabil izotóp nélküli elemnél a leghosszabb életű ismert izotóp tömegszáma,
            Z ≥ 104-nél null)
     cs     csoport, IUPAC 1–18 (az f-mező elemeinél null)    p  periódus 1–7
     fi     f-mezőbeli sorszám 0–13 (Ce…Lu, Th…Lr), különben null
            (Döntés: a 3. csoportban a La és az Ac áll, ahogy a hazai iskolai táblázatokban.)
     fem    1 fém · 0,5 félfém · 0 nemfém · null: nem ismert (szupernehéz elemek)
     csalad 'alkalifem' | 'alkalifoldfem' | 'foldfem' | 'halogen' | 'nemesgaz' | 'atmeneti' |
            'lantanoida' | 'aktinoida' | null (H, B, C, N, O, Si, P, S, Ge, As, Se, Sn, Sb, Te, Pb, …)
     hal    halmazállapot 25 °C-on és légköri nyomáson: 'szilárd' | 'folyékony' | 'gáz' | null
     stab   Z ≤ 20: a stabil (a természetben tartósan előforduló, nem radioaktív) izotópok
            neutronszámai, pl. Cl: [18, 20]; Z > 20: null
   KEM_ELEMEK.bySym['Na'] → az elem objektuma.
   Ez közös, egyszer, tanárral átnézett adat (a review módban „kódban rögzített”); ami egy
   leckében állítás (pl. a lángfestés színe), az a lecke .md-jébe kerül.
   ─────────────────────────────────────────────────────────────────────────── */
const KEM_ELEMEK = window.KEM_ELEMEK || (function () {
  const RAW = 'H hidrogén 1.008|He hélium 4.003|Li lítium 6.94|Be berillium 9.012|B bór 10.81|C szén 12.01|N nitrogén 14.01|O oxigén 16.00|F fluor 19.00|Ne neon 20.18|' +
    'Na nátrium 22.99|Mg magnézium 24.31|Al alumínium 26.98|Si szilícium 28.09|P foszfor 30.97|S kén 32.06|Cl klór 35.45|Ar argon 39.95|K kálium 39.10|Ca kalcium 40.08|' +
    'Sc szkandium 44.96|Ti titán 47.87|V vanádium 50.94|Cr króm 52.00|Mn mangán 54.94|Fe vas 55.85|Co kobalt 58.93|Ni nikkel 58.69|Cu réz 63.55|Zn cink 65.38|' +
    'Ga gallium 69.72|Ge germánium 72.63|As arzén 74.92|Se szelén 78.97|Br bróm 79.90|Kr kripton 83.80|Rb rubídium 85.47|Sr stroncium 87.62|Y ittrium 88.91|Zr cirkónium 91.22|' +
    'Nb nióbium 92.91|Mo molibdén 95.95|Tc technécium 98|Ru ruténium 101.1|Rh ródium 102.9|Pd palládium 106.4|Ag ezüst 107.9|Cd kadmium 112.4|In indium 114.8|Sn ón 118.7|' +
    'Sb antimon 121.8|Te tellúr 127.6|I jód 126.9|Xe xenon 131.3|Cs cézium 132.9|Ba bárium 137.3|La lantán 138.9|Ce cérium 140.1|Pr prazeodímium 140.9|Nd neodímium 144.2|' +
    'Pm prométium 145|Sm szamárium 150.4|Eu európium 152.0|Gd gadolínium 157.3|Tb terbium 158.9|Dy diszprózium 162.5|Ho holmium 164.9|Er erbium 167.3|Tm túlium 168.9|Yb itterbium 173.0|' +
    'Lu lutécium 175.0|Hf hafnium 178.5|Ta tantál 180.9|W volfrám 183.8|Re rénium 186.2|Os ozmium 190.2|Ir irídium 192.2|Pt platina 195.1|Au arany 197.0|Hg higany 200.6|' +
    'Tl tallium 204.4|Pb ólom 207.2|Bi bizmut 209.0|Po polónium 209|At asztácium 210|Rn radon 222|Fr francium 223|Ra rádium 226|Ac aktínium 227|Th tórium 232.0|' +
    'Pa protaktínium 231.0|U urán 238.0|Np neptúnium 237|Pu plutónium 244|Am amerícium 243|Cm kűrium 247|Bk berkélium 247|Cf kalifornium 251|Es einsteinium 252|Fm fermium 257|' +
    'Md mendelévium 258|No nobélium 259|Lr laurencium 262|Rf raterfordium -|Db dubnium -|Sg sziborgium -|Bh bohrium -|Hs hasszium -|Mt meitnérium -|Ds darmstadtium -|' +
    'Rg röntgenium -|Cn kopernícium -|Nh nihónium -|Fl fleróvium -|Mc moszkóvium -|Lv livermórium -|Ts tenesszium -|Og oganeszon -';
  const START = [1, 3, 11, 19, 37, 55, 87, 119];
  const NONMET = [1, 2, 6, 7, 8, 9, 10, 15, 16, 17, 18, 34, 35, 36, 53, 54, 86], SEMI = [5, 14, 32, 33, 51, 52, 85];
  const GAS = [1, 2, 7, 8, 9, 10, 17, 18, 36, 54, 86], LIQ = [35, 80];
  const STAB = { 1: [0, 1], 2: [1, 2], 3: [3, 4], 4: [5], 5: [5, 6], 6: [6, 7], 7: [7, 8], 8: [8, 9, 10], 9: [10], 10: [10, 11, 12],
    11: [12], 12: [12, 13, 14], 13: [14], 14: [14, 15, 16], 15: [16], 16: [16, 17, 18, 20], 17: [18, 20], 18: [18, 20, 22],
    19: [20, 22], 20: [20, 22, 23, 24, 26, 28] };
  const out = RAW.split('|').map((r, i) => {
    const [s, nev, a] = r.split(' '), Z = i + 1;
    let p = 1; while (Z >= START[p]) p++;
    const k = Z - START[p - 1];
    let cs = null, fi = null;
    if (p === 1) cs = Z === 1 ? 1 : 18;
    else if (p <= 3) cs = k < 2 ? k + 1 : k + 11;
    else if (p <= 5) cs = k + 1;
    else if (k < 3) cs = k + 1;
    else if (k <= 16) fi = k - 3;
    else cs = k - 13;
    let csalad = null;
    if (fi != null) csalad = p === 6 ? 'lantanoida' : 'aktinoida';
    else if (cs === 1 && Z > 1) csalad = 'alkalifem';
    else if (cs === 2) csalad = 'alkalifoldfem';
    else if (cs === 13 && Z > 5) csalad = 'foldfem';
    else if (cs === 17) csalad = 'halogen';
    else if (cs === 18) csalad = 'nemesgaz';
    else if (cs >= 3 && cs <= 12) csalad = 'atmeneti';
    return {
      Z, s, nev, A: a === '-' ? null : +a, cs, p, fi,
      fem: Z >= 104 ? null : NONMET.includes(Z) ? 0 : SEMI.includes(Z) ? 0.5 : 1,
      csalad, hal: Z > 100 ? null : GAS.includes(Z) ? 'gáz' : LIQ.includes(Z) ? 'folyékony' : 'szilárd',

  window.KEM_ELEMEK = out;
  return out;

/* ── MODUL: Képletírás a vásznon (KemTx) · forrás: kemia-7-8/05-atom-hejak, 2026-11-23 ──
   Képlet, ion és reakcióegyenlet a vásznon valódi alsó/felső indexszel. A szedést a közös
   MatText végzi (shared/matek/mtext.js, {chem: true}) – így a vászon ugyanazt az elemzőt
   használja, mint a build és a panel; a KemTx erre épít: egyenlet tagonként (dobozok a
   kiemeléshez), vektoros nyíl felirattal, képletelemzés és kiegyenlítés-ellenőrzés.
   Függőség: lesson.js, majd shared/matek/mtext.js (MatText) – mindkettő a lecke előtt töltve.
   Minden szöveg L.tx-en át megy (QA, review mód); a kulcsot o.k-ban add át.

   KemTx.tx(L, s, x, y, o) → {x, y, w, h}   képlet / ion / szöveg indexekkel: 'H₂O', 'SO₄²⁻', 'Na⁺'
       (ASCII is: 'H2O', 'Na^+'). o: s (px, alap 34), w (alap 600), f (alap JetBrains Mono), c, a,
       b ('alphabetic' | 'middle' | 'top'), k, qa, max. Az index a méret 0,65-szöröse →
       ≥ 34 px-es alap kell a 22 px-es QA-küszöbhöz. Az indexek egymás után állnak (SO₄²⁻).
   KemTx.measure(L, s, o) → szélesség px-ben
   KemTx.eq(L, s, x, y, o) → {x, w, terms: [{s, coef, side, i, box}], arrow: {x1, x2, y}}
       reakció- vagy szóegyenlet: a tagokat ' + ' választja el, a nyíl '→' (vagy '->').
       Együttható: a tag elején álló szám + szóköz ('2 H₂O'). o: mint a tx-nél, továbbá
       gap (tagköz, alap 0,3·s), aw (nyílhossz, alap 2,2·s), label (szöveg a nyíl fölött, pl. 'hő'),
       labelK (kulcsa), ac (a nyíl színe), term: (i, tag) → {c, alpha} tagonkénti szín/átlátszóság.
       Szóegyenlethez: o.f = Lesson.FONTS.B, o.w = 600 (a szavakban nincs index).
   KemTx.eqMeasure(L, s, o) → szélesség
   KemTx.arrow(L, x1, y, x2, o)   vektoros nyíl (o: s, c, lw, head, label, labelK, lf) – a terv
       vázlatában (ctx, …) állt; a felirat miatt L kell.
   KemTx.norm('SO4^2-') → 'SO₄²⁻'  ASCII → Unicode (szám betű vagy ')' után → alsó index,
       ^2+ / ^- → felső index, '->' → '→'). Csak képletre hívd (a szavakat nem védi).
   KemTx.parse('Ca(OH)₂') → {coef: 1, atoms: {Ca: 1, O: 2, H: 2}, charge: 0} | null (hibás)
       zárójel, együttható ('2 H₂O' → coef 2), töltés ('SO₄²⁻' → −2); a build formula-típusával
       azonos eredmény.
   KemTx.check('2 H₂ + O₂ → 2 H₂O') → {ok, lhs: {atoms, charge}, rhs: {…}, diff: ['O: 2 ≠ 1', …]}
   KemTx.ion('Na', 1) → 'Na⁺' · KemTx.ion('O', −2) → 'O²⁻'   (felső index: szám, majd előjel)
   ─────────────────────────────────────────────────────────────────────────── */
const KemTx = (function () {
  const SUBD = '₀₁₂₃₄₅₆₇₈₉', SUPD = '⁰¹²³⁴⁵⁶⁷⁸⁹';
  const MONO = Lesson.FONTS.M;
  const opt = (o) => Object.assign({ s: 34, w: 600, f: MONO }, o, { chem: true });
  function tx(L, s, x, y, o = {}) { return MatText.draw(L, String(s), x, y, opt(o)); }
  function measure(L, s, o = {}) { return MatText.measure(L, String(s), opt(o)).w; }
  function norm(s) {
    s = String(s).replace(/->/g, '→');
    s = s.replace(/\^(\d*)([+\-−])/g, (m, d, sg) => [...d].map((x) => SUPD[+x]).join('') + (sg === '+' ? '⁺' : '⁻'));
    return s.replace(/([A-Za-z)\]])(\d+)/g, (m, a, d) => a + [...d].map((x) => SUBD[+x]).join(''));
  }
  function ion(sym, q) {

    const el = [], spin = o.eSpin == null ? 0.5 : o.eSpin;
    let idx = 0;
    conf.forEach((m, k) => {
      const r = radii[k], isOut = k === outerK, w = spin / Math.sqrt(k + 1);
      const ph = -Math.PI / 2 + k * 0.6 + t * w;
      const S = isOut && o.pairs ? sites(m, k === 0) : null;
      for (let j = 0; j < m; j++, idx++) {
        let ang = S ? SITE_A[S[j].site] + S[j].slot * 0.2 + (o.pairRot || 0) : ph + TAU * j / m;
        let rr = r, a = 1;
        if (idx === nShow && frac > 0) { const q = U.out(frac); rr = r + (1 - q) * 220; a = q; ang += (1 - q) * 1.2; }
        else if (idx > nShow || (idx === nShow && frac <= 0)) continue;
        if (J && isOut && j === m - 1) rr += jdr * U.clamp(J.p);
        const ex = x + Math.cos(ang) * rr, ey = y + Math.sin(ang) * rr;
        ctx.globalAlpha = A0 * a * (isOut ? 1 : inner) * (1 - cl * 0.8);
        if (isOut && o.outer) { ctx.beginPath(); ctx.arc(ex, ey, er * 1.75, 0, TAU); ctx.strokeStyle = o.hc || RING; ctx.lineWidth = 2.5; ctx.stroke(); }
        sphere(ctx, ex, ey, er, COL.e);
        if (o.signs !== false) sign(ctx, ex, ey, er, false);
        el.push({ x: ex, y: ey, k, j, outer: isOut });
      }
    });
    ctx.restore();
    return { x, y, rN, shells: radii.map((r, k) => ({ r, n: confFull[k] })), el, outerR: radii.length ? radii[outerK] : rN };
  }
  function outer(L, n, x, y, r, o = {}) {
    const ctx = L.ctx, er = o.er || 6, S = sites(n, !!o.firstShell), dots = [];
    S.forEach((q) => {
      const a = SITE_A[q.site] + (o.rot || 0), px = -Math.sin(a), py = Math.cos(a), off = q.slot * er * 1.45;
      dots.push({ x: x + Math.cos(a) * r + px * off, y: y + Math.sin(a) * r + py * off, site: q.site, paired: q.slot !== 0 });
    });
    if (o.sym) KemTx.tx(L, o.sym, x, y, { s: o.s || 34, a: 'center', b: 'middle', k: o.k, c: o.c });
    for (const d of dots) {
      if (o.hl && !d.paired) { ctx.beginPath(); ctx.arc(d.x, d.y, er * 1.8, 0, TAU); ctx.strokeStyle = o.hc || RING; ctx.lineWidth = 2.5; ctx.stroke(); }
      ctx.beginPath(); ctx.arc(d.x, d.y, er, 0, TAU); ctx.fillStyle = o.ec || '#1c2440'; ctx.fill();
    }
    return { dots, unpaired: dots.filter((d) => !d.paired) };
  }
  return { config, outerN, neutrons, draw, outer, sphere, COL };
})();

/* ── MODUL: Periódusos rács (KemPSE) · forrás: kemia-7-8/05-atom-hejak, 2026-11-23 ──
   A periódusos rendszer rácsa a KEM_ELEMEK alapján (1–4. periódus vagy a teljes, f-mezővel
   vagy anélkül), cellaszínezés függvénnyel, kijelölés, sor/oszlop kiemelés, találat-teszt.
   A cellák szövege (rendszám, vegyjel) kódban rögzített elemadat; a fejlécfeliratokat
   (csoportszám, római főcsoportjel, periódus) a lecke adja kulccsal.

   const G = KemPSE.layout({x, y, cell: 64, gap: 4, periods: 4 | 7, fblock: false, maxZ})
       → {x, y, cell, step, w, h, periods, cells: {Z: {x, y, w, h, g, p}}, cell(Z), hit(px, py) → Z | null,
          colX(g), rowY(p)}   (maxZ: csak eddig a rendszámig vannak cellák)
   KemPSE.draw(L, G, o)
       o.fill(Z) → szín ('#…' / rgba) · o.alpha(Z) → 0..1 · o.stroke(Z) → keretszín
       o.show: ['Z', 's'] (mit írjon a cellába; [] → semmit – kis cellánál kötelező, ≥ 22 px szabály)
       o.zs, o.ss  a rendszám és a vegyjel betűmérete (alap: max(22, 0,32·cella), 0,44·cella)
       o.sel       kijelölt rendszám (cinóber gyűrű) · o.selC színe · o.selP 0..1 (kijelölés „pattanása”)
       o.hlRow, o.hlCol  kiemelt periódus / csoport (halvány sáv) · o.hlC a sáv színe
       o.groupLabel(g) → szöveg|null a csoport fölé · o.groupLabel2(g) → második sor (pl. 'I.A')
       o.groupK(g), o.group2K(g) → kulcs · o.periodLabel(p), o.periodK(p) a sor elé
       o.headS  fejléc betűmérete (alap 22)
   KemPSE.hit(G, px, py) → Z | null   (ugyanaz, mint G.hit)
   ─────────────────────────────────────────────────────────────────────────── */
const KemPSE = (function () {
  const MONO = Lesson.FONTS.M, BRIC = Lesson.FONTS.B;
  function layout(o) {
    const cell = o.cell || 64, gap = o.gap == null ? 4 : o.gap, step = cell + gap, P = o.periods || 7, maxZ = o.maxZ || 118;
    const G = { x: o.x, y: o.y, cell, gap, step, periods: P, fblock: !!o.fblock, cells: {} };
    for (const e of KEM_ELEMEK) {
      if (e.p > P || e.Z > maxZ) continue;
      let cx, cy;
      if (e.cs) { cx = o.x + (e.cs - 1) * step; cy = o.y + (e.p - 1) * step; }
      else if (G.fblock) { cx = o.x + (3 + e.fi) * step; cy = o.y + (P + 0.35 + (e.p - 6)) * step; }
      else continue;
      G.cells[e.Z] = { x: cx, y: cy, w: cell, h: cell, g: e.cs, p: e.p };
    }
    G.w = 18 * step - gap; G.h = (P + (G.fblock ? 2.35 : 0)) * step - gap;
    G.cell = (Z) => G.cells[Z] || null;
    G.colX = (g) => o.x + (g - 1) * step + cell / 2;
    G.rowY = (p) => o.y + (p - 1) * step + cell / 2;
    G.hit = (px, py) => { for (const z in G.cells) { const c = G.cells[z]; if (px >= c.x && px <= c.x + c.w && py >= c.y && py <= c.y + c.h) return +z; } return null; };
    G.size = cell;
    return G;
  }
  function draw(L, G, o = {}) {
    const ctx = L.ctx, A0 = ctx.globalAlpha, cs = G.size, show = o.show || ['Z', 's'];
    const zs = o.zs || Math.max(22, cs * 0.32), ss = o.ss || cs * 0.44, hs = o.headS || 22;
    ctx.save();
    // sor/oszlop sáv
    const hlC = o.hlC || 'rgba(10,111,134,.16)';
    if (o.hlRow) { ctx.fillStyle = hlC; ctx.beginPath(); ctx.roundRect(G.x - 8, G.rowY(o.hlRow) - cs / 2 - 6, G.w + 16, cs + 12, 10); ctx.fill(); }
    if (o.hlCol) { const top = Math.min(...Object.values(G.cells).filter((c) => c.g === o.hlCol).map((c) => c.y)); const bot = Math.max(...Object.values(G.cells).filter((c) => c.g === o.hlCol).map((c) => c.y + c.h));
      ctx.fillStyle = hlC; ctx.beginPath(); ctx.roundRect(G.colX(o.hlCol) - cs / 2 - 6, top - 6, cs + 12, bot - top + 12, 10); ctx.fill(); }
    // fejlécek
    if (o.groupLabel || o.groupLabel2) for (let g = 1; g <= 18; g++) {
      const ys = Object.values(G.cells).filter((c) => c.g === g).map((c) => c.y); if (!ys.length) continue;
      const top = Math.min(...ys);
      const s1 = o.groupLabel && o.groupLabel(g), s2 = o.groupLabel2 && o.groupLabel2(g);
      ctx.globalAlpha = A0 * (o.headAlpha ? o.headAlpha(g) : 1);
      if (s2) L.tx(s2, G.colX(g), top - 8, { s: hs, w: 600, f: BRIC, a: 'center', c: '#565d72', k: o.group2K ? o.group2K(g) : null, max: cs + G.gap - 2 });
      if (s1) L.tx(s1, G.colX(g), top - 8 - (s2 ? hs * 1.15 : 0), { s: hs, w: 600, f: MONO, a: 'center', c: '#1c2440', k: o.groupK ? o.groupK(g) : null });
    }
    ctx.globalAlpha = A0;
    if (o.periodLabel) for (let p = 1; p <= G.periods; p++) { const s = o.periodLabel(p); if (s) L.tx(s, G.x - 12, G.rowY(p), { s: hs, w: 600, f: MONO, a: 'right', b: 'middle', c: '#1c2440', k: o.periodK ? o.periodK(p) : null }); }
    // cellák
    for (const z in G.cells) {
      const Z = +z, c = G.cells[z], e = KEM_ELEMEK[Z - 1], a = o.alpha ? o.alpha(Z) : 1;
      if (a <= 0.01) continue;
      ctx.globalAlpha = A0 * a;
      ctx.beginPath(); ctx.roundRect(c.x, c.y, c.w, c.h, Math.max(3, cs * 0.12));
      ctx.fillStyle = (o.fill && o.fill(Z)) || '#fffaf1'; ctx.fill();
      ctx.strokeStyle = (o.stroke && o.stroke(Z)) || 'rgba(28,36,64,.38)'; ctx.lineWidth = cs > 30 ? 1.6 : 1; ctx.stroke();
      if (show.includes('Z')) L.tx(String(Z), c.x + cs * 0.08, c.y + cs * 0.06, { s: zs, w: 500, f: MONO, b: 'top', c: '#3b4256' });
      if (show.includes('s')) L.tx(e.s, c.x + cs / 2, c.y + cs * 0.86, { s: ss, w: 700, f: BRIC, a: 'center', c: '#1c2440' });
    }
    // kijelölés
    if (o.sel && G.cells[o.sel]) {
      const c = G.cells[o.sel], p = o.selP == null ? 1 : o.selP, grow = 4 + 6 * (1 - p);
      ctx.globalAlpha = A0; ctx.beginPath(); ctx.roundRect(c.x - grow, c.y - grow, c.w + grow * 2, c.h + grow * 2, Math.max(4, cs * 0.16));
      ctx.strokeStyle = o.selC || '#c8401c'; ctx.lineWidth = 4; ctx.stroke();
    }
    ctx.restore();
    return G;
  }
  return { layout, draw, hit: (G, x, y) => G.hit(x, y) };
})();
/* ── MODUL VÉGE ── */

/* ── MODUL: Molekula-rajzoló (KemMol) · forrás: kemia-7-8/06-molekulak, 2026-11-23 ──
   Molekulák a vásznon három nézetben – Lewis-kép (vegyjel + elektronpár-pöttyök vagy vonalak),
   pálcikamodell, kalottamodell – folytonos átmenettel, 3D-forgatással és mélységi rendezéssel; a
   kötésképződés animációja (a párosítatlan elektronok a két atom közé vándorolnak, közös pár lesz).
   Függőség (előtte töltve): lesson.js (Lesson.U, Lesson.FONTS), a 05-atom-hejak KemTx (vegyjel) és
   KemAtom blokkja (KemAtom.sphere: 3D-hatású golyó · KemAtom.outer: a szabad atom Lewis-képe).
   Szöveget csak L.tx / KemTx útján ír. Zárt képletű: a rajz csak a megadott opciókból számolódik.

   Molekula:  mol = {name, atoms: [{el, x, y, z, lx, ly, q, rot}], bonds: [[i, j, rend]]}
       x, y, z   3D-koordináták Å-ben (y lefelé, z a néző felé; a sablonok középre igazítva)
       lx, ly    a Lewis-kép („füzetrajz”) helye kötéshossz-egységben (1 = egy Lewis-kötés hossza)
       q         formális töltés (pl. O₃, CO) – a nem kötő elektronpárok száma ebből is függ
       rot       a szabad atom pöttyeinek elforgatása (k · π/2); ha nincs megadva, a modul úgy
                 választja, hogy a párosítatlan elektronok a kötőtárs felé nézzenek
   KemMol.EL[s] = {c, bd?, lc, r, v}   kitöltőszín, körvonal (alap: a szín sötét változata), a vegyjel
       színe a golyón, van der Waals-sugár (Å, Bondi), vegyértékelektronok (főcsoport; fémeknél
       null). Színkód: H fehér, C fekete, N kék, O piros, Cl zöld, S sárga, Na lila – sötét körvonallal.
   KemMol.tpl(név, o?) → mol (új példány)   sablonok: H2 Cl2 O2 N2 HCl CO H2O CH4 CO2 NH3 O3 SO2 H2O2
       o.len: a fő kötéshossz (pm), o.angle: a kötésszög (°) – pl. a .md adataiból:
       KemMol.tpl('H2O', {len: 95.8, angle: 104.5}). Alapértékek: kísérleti gázfázisú geometria.
   KemMol.make(atoms, bonds, name?) → mol   saját molekula; atoms: [{el, lx, ly, x?, y?, z?, q?, rot?}]
       (nincs középre igazítás: a Lewis-hely az, amit megadtál; z nélkül síkbeli)
   KemMol.atoms(mol) → {H: 2, O: 1}   ·   KemMol.formula(mol) → 'H₂O'  (C-tartalmúnál Hill-sorrend:
       C, H, majd betűrend; egyébként elektronegativitás szerint, az N a H elé kerül: NH₃, HCl, H₂O)
   KemMol.lone(mol) → [nem kötő elektronpárok száma atomonként]
   KemMol.unpaired(el) → a szabad atom párosítatlan elektronjai a Lewis-képen (H 1, C 4, N 3, O 2, Cl 1,
       nemesgáz 0) = ennyi kovalens kötést létesít (iskolai modell; a C a szokásos négy pöttyel)
   KemMol.angleDeg(mol, i, j, k) → az i–j–k kötésszög (°) a 3D-geometriából · KemMol.dist(mol, i, j) → pm
   KemMol.draw(L, mol, x, y, o) → geometria {atoms: [{x, y, z, r}], R: [körsugár], n: [elektronszám]}
       o.view    0 Lewis-kép · 1 pálcikamodell · 2 kalottamodell (tört érték: folytonos átmenet)
       o.scale   px / Å a 3D-nézetben (alap 110) · o.rot {yaw, pitch, roll} (rad) · o.persp (alap 0,05 / Å)
       o.alpha · o.hl [atomindexek]: cinóber gyűrű (kiemelés gyűrűvel, nem kitöltéssel) · o.hc színe
       o.labels  0..1: vegyjel a golyókon (≥ 24 px-es golyónál, a pálcikák fölött; ha közelebbi golyó a felirat helyébe lóg, nincs felirat; qa: false)
       Lewis-kép (view < 1):
         o.s       a vegyjel mérete (px, alap 44) · o.lb: kötéshossz px-ben (alap 2,5 · s) · o.er, o.r:
                   az elektronpötty sugara és távolsága a vegyjel közepétől (alap 0,13 · s, 0,8 · s)
         o.form    0..1 vagy fn(kötésindex) → 0..1: a kötés kialakulása (0: szabad atomok, a párosítatlan
                   elektronok a saját atomjuknál; 1: közös elektronpár(ok) a két atom között)
         o.spread  px: szabad állapotban (form 0) ennyivel távolabb állnak az atomok a középponttól
         o.pos     fn(i) → {x, y} | null: egy atom helyének felülírása (húzás, beúszás)
         o.lines   0..1: a párok vonallá alakulnak (kötő pár: kötővonal, nem kötő pár: rövid vonal)
         o.octet   0..1: szaggatott kör minden atom köré (a közös pár mindkét atomhoz tartozik); a kör
                   sugara .R[i], a benne lévő elektronok száma .n[i] (2 vagy 8) – a számot a lecke írja ki
         o.unp     0..1: a még párosítatlan elektronok lüktető cinóber gyűrűje (o.t: idő, mp)
         o.ec      fn(atomindex) → szín: az elektron színe aszerint, melyik atomtól jött (alap: tinta)
         o.symC    fn(i) → a vegyjel színe · o.k: md-kulcs a vegyjelekhez (alap: nincs – kódban rögzített)
   KemMol.atom(L, el, x, y, o) – szabad atom Lewis-képe (KemAtom.outer-rel, ugyanazzal a helykiosztással,
       mint a draw szabad állapota); o.s, o.er, o.r, o.rot, o.ec, o.c, o.k, o.alpha, o.unp + o.t (gyűrű)
       → {dots, unpaired}
   KemMol.angle(L, g, i, j, k, o) – ív a j csúcsnál az i és a k felé (g: a draw visszatérési értéke),
       felirattal: o.text, o.k, o.c, o.r (ívsugár), o.s, o.d (a felirat távolsága), o.side (180°-nál
       az ív oldala: −1 fent, +1 lent) → {x, y} a felirat helye
   Tervezett bővítés (terv, 4. fejezet): morph (átrendeződés, 08), chain (lánc, 13–14), lattice (rácsok, 07).
   ─────────────────────────────────────────────────────────────────────────── */
const KemMol = (function () {
  const TAU = Math.PI * 2, U = Lesson.U, INK = '#1c2440', RING = '#c8401c', TEAL = '#0a6f86', WHITE = '#ffffff';
  const EL = {
    H: { c: '#f2ede2', bd: '#565d72', lc: INK, r: 1.20, v: 1 }, He: { c: '#cfe0ec', bd: '#4f6f86', lc: INK, r: 1.40, v: 2 },
    C: { c: '#3b4050', lc: WHITE, r: 1.70, v: 4 }, N: { c: '#2f5fb3', lc: WHITE, r: 1.55, v: 5 },
    O: { c: '#d6452c', lc: WHITE, r: 1.52, v: 6 }, F: { c: '#9cc35a', lc: INK, r: 1.47, v: 7 },
    Ne: { c: '#a9c6ee', lc: INK, r: 1.54, v: 8 }, Na: { c: '#8a5cc2', lc: WHITE, r: 2.27, v: 1 },
    Mg: { c: '#6f9b3a', lc: WHITE, r: 1.73, v: 2 }, Al: { c: '#a3a9b6', lc: INK, r: 1.84, v: 3 },
    Si: { c: '#c2a477', lc: INK, r: 2.10, v: 4 }, P: { c: '#e07b1f', lc: INK, r: 1.80, v: 5 },
    S: { c: '#e2b62b', lc: INK, r: 1.80, v: 6 }, Cl: { c: '#3e9a4b', lc: WHITE, r: 1.75, v: 7 },
    Ar: { c: '#7fb3c8', lc: INK, r: 1.88, v: 8 }, K: { c: '#7b4fa0', lc: WHITE, r: 2.75, v: 1 },
    Ca: { c: '#8c9a76', lc: INK, r: 2.31, v: 2 }, Br: { c: '#8b2a1e', lc: WHITE, r: 1.85, v: 7 },
    I: { c: '#6b2f8a', lc: WHITE, r: 1.98, v: 7 }, Fe: { c: '#a3643c', lc: WHITE, r: 2.0, v: null },
    Cu: { c: '#c17a44', lc: WHITE, r: 1.40, v: null },
  };
  const EN = { H: 2.20, C: 2.55, N: 3.04, O: 3.44, F: 3.98, P: 2.19, S: 2.58, Cl: 3.16, Br: 2.96, I: 2.66, Si: 1.90, B: 2.04 };
  const SUB = '₀₁₂₃₄₅₆₇₈₉';
  const sub = (n) => [...String(n)].map((d) => SUB[+d]).join('');
  const elOf = (s) => EL[s] || { c: '#9aa0ad', lc: INK, r: 1.6, v: 0 };
  const isFirst = (s) => s === 'H' || s === 'He';

  /* ── Lewis-helyek: ugyanaz a kiosztás, mint a KemAtom.outer-é (fent, jobbra, lent, balra; előbb
        egyesével, aztán párba: fent, balra, lent, jobbra) ── */
  const SITE_A = [-Math.PI / 2, 0, Math.PI / 2, Math.PI];
  function sites(n, first) {
    const out = [];
    if (first) { for (let i = 0; i < n; i++) out.push({ site: 0, slot: n === 2 ? (i ? 1 : -1) : 0 }); return out; }
    const cnt = [0, 0, 0, 0], o1 = [0, 1, 2, 3], o2 = [0, 3, 2, 1], tmp = [];
    for (let i = 0; i < n; i++) { const s = i < 4 ? o1[i] : o2[i - 4]; cnt[s]++; tmp.push({ site: s, k: cnt[s] }); }
    return tmp.map((q) => ({ site: q.site, slot: cnt[q.site] === 2 ? (q.k === 1 ? -1 : 1) : 0 }));
  }
  function valence(a) { const e = elOf(a.el); return Math.max(0, (e.v || 0) - (a.q || 0)); }
  function unpaired(s) { const n = elOf(s).v || 0; return isFirst(s) ? (n === 1 ? 1 : 0) : (n <= 4 ? n : 8 - n); }

  /* ── sablonok ── */
  function mk(name, list, bonds, center) {
    const atoms = list.map(([el, x, y, z, lx, ly, q]) => ({ el, x, y, z, lx, ly, q: q || 0 }));
    if (center) {
      const m = (k) => atoms.reduce((s, a) => s + a[k], 0) / atoms.length;
      const mx = m('x'), my = m('y'), mz = m('z'), mlx = m('lx'), mly = m('ly');
      atoms.forEach((a) => { a.x -= mx; a.y -= my; a.z -= mz; a.lx -= mlx; a.ly -= mly; });
    }
    return { name, atoms, bonds: bonds.map((b) => [b[0], b[1], b[2] || 1]) };
  }
  const lin2 = (name, a, b, pm, ord, qa, qb) => { const h = pm / 200; return mk(name, [[a, -h, 0, 0, -0.5, 0, qa], [b, h, 0, 0, 0.5, 0, qb]], [[0, 1, ord]], true); };
  function bent(name, c, a, b, pm, deg, oa, ob, q, lew) {
    const L0 = pm / 100, h = deg * Math.PI / 360, lw = (lew || 90) * Math.PI / 360;
    q = q || [0, 0, 0];
    return mk(name, [[c, 0, 0, 0, 0, 0, q[0]], [a, -L0 * Math.sin(h), L0 * Math.cos(h), 0, -Math.sin(lw), Math.cos(lw), q[1]],
      [b, L0 * Math.sin(h), L0 * Math.cos(h), 0, Math.sin(lw), Math.cos(lw), q[2]]], [[0, 1, oa], [0, 2, ob]], true);
  }
  /* központi atom + n egyforma ligandum: n = 4 → tetraéder (egy H felfelé), n = 3 → piramis (lefelé) */

    }
  } }));

  T('log skála', X0, ya - 14, { s: 22, w: 600, c: MUT, max: 150 });
  const MK = [['jég olvadáspontja', 'olv jég', 1], ['víz forráspontja', 'forr víz', 0], ['só olvadáspontja', 'olv só', 1], ['réz olvadáspontja', 'olv réz', 0], ['só forráspontja', 'forr só', 1], ['réz forráspontja', 'forr réz', 0], ['grafit szublimál', 'szubl grafit', 1]];

/* ═════════ 8. Összefoglalás ═════════ */
function scene8(st, a) {

}

/* ════════════════════════════════════════════════════════════════ */
const sT = new Array(8).fill(0);
const SCENES = [scene1, scene2, scene3, scene4, scene5, scene6, scene7, scene8];
window.__qaStates = {
  1: [{ name: 'hideg', set() { S1.log = [{ t: 0, v: 20 }]; } }, { name: '300C', set() { S1.log = [{ t: 0, v: 300 }]; } }],
  2: [{ name: 'repul', set() { S2.log = [{ t: 0, v: .2 }]; } }, { name: 'ionok', set() { S2.log = [{ t: 0, v: .6 }]; } }],
  3: [{ name: 'Ca', set() { S3.log = [{ t: 0, s: 'Ca' }]; } }, { name: 'S', set() { S3.log = [{ t: 0, s: 'S' }]; } }, { name: 'F', set() { S3.log = [{ t: 0, s: 'F' }]; } }],
  4: [{ name: 'Al2O3', set() { S4.log = []; auto4('Al2O3', 0, .3); } }, { name: 'Mg2O2', set() { S4.log = []; S4.log.push({ t: 0, op: 'clr' }); for (const [s, tt] of [['Mg', .1], ['O', .2], ['Mg', .3], ['O', .4]]) { const p = tileC4(s); add4(s, tt, p.x, p.y); } } },
    { name: 'ures', set() { S4.log = []; } }, { name: 'elutasit', set() { S4.log = []; auto4('NaCl', 0, .3); const p = tileC4('K'); add4('K', 4.8, p.x, p.y); } },
    { name: 'K2O', set() { S4.log = []; auto4('K2O', 0, .3); } }],
  5: [{ name: 'valodi', set() { S5.log = [{ t: -9, hl: 0, sz: 1 }]; } }, { name: 'forgatva', set() { S5.log = [{ t: -9, hl: 1, sz: 0 }]; S5.yaw = 1.2; S5.pitch = -.6; } }],
  6: [{ name: 'gyemant', set() { S6.log = [{ t: -9, v: 0 }]; } }, { name: 'forgatva', set() { S6.yaw = 1.5; S6.pitch = .5; } }],
  7: [{ name: 'minus100', set() { S7.log = [{ t: 0, v: 0 }]; } }, { name: '50C', set() { S7.log = [{ t: 0, v: T2u(50) }]; } }, { name: '1200C', set() { S7.log = [{ t: 0, v: T2u(1200) }]; } },
    { name: '3000C', set() { S7.log = [{ t: 0, v: T2u(3000) }]; } }, { name: '4000C', set() { S7.log = [{ t: 0, v: 1000 }]; } }, { name: 'aramkor-ki', set() { S7.circ = [{ t: -9, on: 0 }]; } }],
};
L = Lesson.create({
  content: window.LESSON_CONTENT,

  steps: [
    { settle: 6.4, enter() { reset1(); },

        onInput: (v) => { S1.log = S1.log.filter((e) => e.t <= L.st); S1.log.push({ t: L.st, v, dur: .3 }); } }); } },
    { settle: 8, enter() { reset2(); },
      controls(Lx) { S2.slider = Lx.slider({ label: lab('átadás csúszka'), k: 'átadás csúszka', min: 0, max: 100, step: 1, value: 0, format: (v) => fmt(v) + ' %',
        onInput: (v) => { S2.log = S2.log.filter((e) => e.t <= L.st); S2.log.push({ t: L.st, v: v / 100, dur: .25 }); } }); } },
    { settle: 7.8, enter() { reset3(); } },
    { settle: 6, enter() { reset4(); },
      controls(Lx) {
        Lx.button(lab('töröl gomb'), () => { S4.log = S4.log.filter((e) => e.t <= L.st); S4.log.push({ t: L.st, op: 'clr' }); S4.held = null; }, 'töröl gomb');
        for (const [id] of CMP) Lx.button(lab('gomb ' + id), () => auto4(id, L.st), 'gomb ' + id);
      } },
    { settle: 7, enter() { reset5(); },
      controls(Lx) {
        const tog = (f) => () => { const e = last5(L.st), n = { t: L.st, hl: e.hl, sz: e.sz }; f(n); S5.log = S5.log.filter((q) => q.t <= L.st); S5.log.push(n); };
        Lx.button(lab('szomszéd gomb'), tog((n) => { n.hl = n.hl ? 0 : 1; }), 'szomszéd gomb');
        Lx.button(lab('arány gomb'), tog((n) => { n.sz = n.sz ? 0 : 1; }), 'arány gomb');
      } },
    { settle: 7, enter() { reset6(); },

    { settle: 7.6, enter() { reset7(); },
      controls(Lx) {
        S7.slider = Lx.slider({ label: lab('hőmérséklet csúszka'), k: 'hőmérséklet csúszka', min: 0, max: 1000, step: 1, value: 0, format: (v) => DEGC(u2T(v)),
          onInput: (v) => { S7.log = S7.log.filter((e) => e.t <= L.st); S7.log.push({ t: L.st, v, dur: .4 }); } });
        Lx.button(lab('áramkör gomb'), () => { const e = S7.circ.filter((q) => q.t <= L.st).pop(); S7.circ = S7.circ.filter((q) => q.t <= L.st); S7.circ.push({ t: L.st, on: e.on ? 0 : 1 }); }, 'áramkör gomb');
      } },
    { settle: 4 },
  ],
  init(Lx) {

      if (L.step === 2) { const Z = G3.hit(p.x, p.y); const e = Z && KEM_ELEMEK[Z - 1]; if (e && SEL3.includes(e.s)) { S3.log = S3.log.filter((q) => q.t <= L.st).concat([{ t: L.st, s: e.s }]); } }
      if (L.step === 3) {
        const tl = B4.tiles.find((q) => inR(p, q)); if (tl) { S4.held = { s: tl.s, x0: p.x, y0: p.y, tile: tl }; return; }
        const h = hit4(p, L.st); if (h) { S4.log = S4.log.filter((e) => e.t <= L.st); S4.log.push({ t: L.st, op: 'del', side: h.side, idx: h.idx }); }

      if (L.step !== 3 || !S4.held) return;

      const click = inR(p, h.tile) && Math.hypot(p.x - h.x0, p.y - h.y0) < 14;
      if (inR(p, B4.tray) || click) add4(h.s, L.st, click ? tileC4(h.s).x : p.x, click ? tileC4(h.s).y : p.y);
    });
    L.checks = () => {
      const out = [];
      for (const s in IONK) { const e = sym(s); out.push({ name: 'oszlopszabály ' + s, ok: groupQ(e.cs) === ionQ(s), got: groupQ(e.cs), want: ionQ(s) }); }
      for (const [id, k] of CMP) {

      }

      out.push({ name: 'Na–Cl = r(Na⁺) + r(Cl⁻)', ok: Math.abs(num('Na-ion sugara') + num('Cl-ion sugara') - num('Na–Cl távolság') * 1000) <= 2, got: num('Na-ion sugara') + num('Cl-ion sugara'), want: num('Na–Cl távolság') * 1000 });

      return out;

});
