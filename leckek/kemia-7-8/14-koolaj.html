   A modulblokkokat a lecke nem módosítja és nem bővíti. A lepárlótorony rajza és modellje
   a lecke saját kódjában van (A LECKE – Torony).
   ════════════════════════════════════════════════════════════════════════════ */
/* ── MODUL: Részecskemotor (Reszecske) · forrás: kemia-7-8/01-reszecskemodell, 2026-11-23 · v1.1 (2026-11-24) ── */
/* API
   Tantárgyfüggetlen 2D részecskeszimuláció (gáz, folyadék, szilárd rács, diffúzió, keverék),
   DETERMINISZTIKUS VISSZAJÁTSZÁSSAL. Nem hivatkozik a lecke kódjára; csak egy 2D vászon kell.
   Változtatás nélkül átemelhető (tervezett helye: shared/reszecske.js).

   const S = Reszecske.create({
     seed: 42,                   // véletlenmag (kezdőhelyek, kezdősebességek) – azonos mag → azonos futás
     dt: 1 / 120,                // fix lépésköz (s)
     box: {x, y, w, h},          // téglalap tartály (logikai px)
     walls: {l, r, t, b},        // opcionális: a fal helyzete fn(t) (zárt képletű dugattyú) – a box-on belül
     species: {                  // részecskefajták
       N2: {r: 12, m: 28, c: '#2f5fb3', draw: 'ketatom'},     // r: ütközési sugár px · m: relatív tömeg · c: szín
       H2O: {r: 12, m: 18, draw: 'viz'} },                   // draw: 'golyo' | 'ketatom' (c2: 2. atom színe) |
                                                              //   'viz' | 'etanol' | fn(ctx, x, y, r, ang, faj)
     T: 293,                     // hőmérséklet (K) – a termosztát célja
     vRef: 150,                  // négyzetes középsebesség px/s-ban m = 28, T = 293 K esetén (szemléltetés: lassított)
     thermo: 0.5,                // termosztát időállandója (s); 0 → nincs termosztát (az energia megmarad)
     collide: true,              // részecske–részecske rugalmas ütközés (false: átrepülnek egymáson)
     gravity: 0,                 // lefelé gyorsulás, px/s²
     attract: null,              // {eps, range}: vonzás, ha a felületek távolsága < range (eps: csúcs, px/s²) → folyadék
     anchorK: 0,                 // rugó a rácshelyhez (1/s²) a horgonyzott részecskékre → szilárd rács
     max: 600,                   // a részecskék felső száma
   });
   S.add('N2', 40, {region: {x, y, w, h}, lattice: 'random' | 'hex', gap: 2, anchor: false, tag: 0,
                    exact: false, fill: false}) → a ténylegesen letett darabszám
                               // csak az első S.at előtt; később esemény ({add}) kell.
                               // Ha a régióba (a gap-pel és a már bent lévőkkel) nem fér el n darab, a
                               // modul kevesebbet tesz le, és console.warn-nal szól (azonos hívásra egyszer);
                               // exact: true → a maradékot átfedéssel is leteszi (az ütközés széttolja),
                               // így pontosan n darab lesz (a max-korlátig); fill: true → n csak felső
                               // korlát („töltsd fel, ameddig elfér”, pl. hex rács), nincs figyelmeztetés
   S.at(t, events)             // az állapotot PONTOSAN a t. másodpercre hozza. events: időrendben,
                               //   [{t, set: {T, collide, gravity, attract, anchorK, thermo}},
                               //    {t, add: ['N2', 10, {region…}]}, {t, remove: 'N2' | fn(S, i) → bool},
                               //    {t, id: 'egyedi', fn: (S) => {…}}]
                               //   Azonos seed + azonos eseménysor → mindig ugyanaz az állapot. Előre csak
                               //   továbbfut; visszafelé (vagy ha egy múltbeli esemény változott) a legközelebbi
                               //   ellenőrzőpontból (0,5 s-onként mentve) számol újra.
   S.reset()                   // vissza a kezdőállapotba, ellenőrzőpontok törlése – enter(L)-ben hívd,
                               //   és mindig, ha a walls-függvény mögötti napló kiürül
   S.t                         // a szimuláció ideje (s)
   S.n, S.x[i], S.y[i], S.vx[i], S.vy[i], S.sp[i] (fajta indexe), S.names[], S.tag[i]   – csak olvasásra
   S.speeds(sp?)  → [px/s, …] · S.count(fn(S, i) → bool) · S.Tkin() → K (a mozgási energiából)
   S.hits(side)   → falba csapódás / s (mozgó átlag, τ = 1 s; side: 'l' | 'r' | 't' | 'b') – a nyomással arányos
   S.draw(ctx, {hl: (i) → bool, hlColor, alpha: (i) → 0..1, trail: s})   // 3D-hatású golyók, sötét körvonallal
   Reszecske.ball(ctx, x, y, r, szín, keret?)          // egy golyó ugyanabban a stílusban
   Reszecske.mol(ctx, draw, x, y, r, ang, faj)        // egy molekula (jelmagyarázathoz)
   Reszecske.zart(n, seed) → Z                        // zárt képletű „díszítő” halmaz (nincs szimuláció):
     Z.frame(t, phase, B, it)  → [{x, y, ang}]        //   phase: 0 rácsban rezeg · 1 folyadék · 2 gáz (közte átmenet)
                                                      //   B: {x, y, w, h, d (részecskeátmérő)}; it: átfedés-feloldás
   Teljesítmény: rácsos szomszédkeresés; ~400 részecske 120 Hz-en is bőven 60 fps.
   v1.1 (2026-11-24): add – figyelmeztetés, ha kevesebb fér el; exact és fill opció; visszaadja a darabszámot.
       A régi hívások ugyanazt a helyzetet adják (a véletlensorozat nem változik).
   ──────────────────────────────────────────────────────────────────────────────── */
const Reszecske = (() => {
  const TAU = Math.PI * 2;
  const rgb = (h) => { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
  const mixc = (a, b, t) => { const A = rgb(a), B = rgb(b); return 'rgb(' + A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',') + ')'; };
  const SPR = new Map();
  function sprite(col, bd) {
    const key = col + '|' + (bd || ''); let s = SPR.get(key); if (s) return s;
    s = document.createElement('canvas'); s.width = s.height = 80; const g = s.getContext('2d');
    const gr = g.createRadialGradient(29, 27, 2, 40, 40, 37);
    gr.addColorStop(0, mixc(col, '#ffffff', .62)); gr.addColorStop(.42, col); gr.addColorStop(1, mixc(col, '#000000', .36));
    g.beginPath(); g.arc(40, 40, 36, 0, TAU); g.fillStyle = gr; g.fill();
    const hl = g.createRadialGradient(28, 25, 0, 28, 25, 15); hl.addColorStop(0, 'rgba(255,255,255,.85)'); hl.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = hl; g.fill();
    g.lineWidth = 5; g.strokeStyle = bd || mixc(col, '#1c2440', .62); g.beginPath(); g.arc(40, 40, 35, 0, TAU); g.stroke();
    SPR.set(key, s); return s;
  }
  function ball(ctx, x, y, r, col, bd) { const k = r / 36; ctx.drawImage(sprite(col, bd), x - 40 * k, y - 40 * k, 80 * k, 80 * k); }
  const ELH = ['#f2ede2', '#565d72'], ELO = '#d6452c', ELC = '#3b4050';
  function mol(ctx, kind, x, y, r, ang, s) {
    if (typeof kind === 'function') return kind(ctx, x, y, r, ang, s);
    const ca = Math.cos(ang), sa = Math.sin(ang);
    if (kind === 'ketatom') {
      const d = r * .4, q = r * .62;
      ball(ctx, x - ca * d, y - sa * d, q, s.c, s.bd); ball(ctx, x + ca * d, y + sa * d, q, s.c2 || s.c, s.bd);
    } else if (kind === 'viz') {
      const ox = x - ca * r * .14, oy = y - sa * r * .14;
      for (const da of [-.912, .912]) ball(ctx, ox + Math.cos(ang + da) * r * .6, oy + Math.sin(ang + da) * r * .6, r * .4, ELH[0], ELH[1]);
      ball(ctx, ox, oy, r * .66, ELO);
    } else if (kind === 'etanol') {
      const px = -sa, py = ca, pts = [[-.56, .14, ELC, .46], [0, -.14, ELC, .46], [.56, .14, ELO, .42]];
      for (const [u, v, col, q] of pts) ball(ctx, x + ca * u * r + px * v * r, y + sa * u * r + py * v * r, q * r, col);
    } else ball(ctx, x, y, r, s.c, s.bd);
  }

  function create(cfg) {
    const h = cfg.dt || 1 / 120, MAX = cfg.max || 600, KC = Math.max(1, Math.round(.5 / h));
    const names = Object.keys(cfg.species);
    const SP = names.map((k) => Object.assign({ r: 8, m: 28, c: '#8a93a6', draw: 'golyo' }, cfg.species[k], { name: k }));
    const idx = {}; names.forEach((k, i) => { idx[k] = i; });
    const vRef = cfg.vRef || 150, kk = vRef * vRef * 28 / (2 * 293);
    const box = cfg.box, WF = cfg.walls || {};
    const FL = ['x', 'y', 'vx', 'vy', 'ax', 'ay', 'a0', 'w'];
    const S = { n: 0, names, species: SP, h, box };
    FL.forEach((f) => { S[f] = new Float64Array(MAX); });
    S.sp = new Int16Array(MAX); S.tag = new Int32Array(MAX);
    const rmax = SP.reduce((m, s) => Math.max(m, s.r), 0);
    let P = { T: cfg.T == null ? 293 : cfg.T, thermo: cfg.thermo == null ? .5 : cfg.thermo, collide: cfg.collide !== false,
      gravity: cfg.gravity || 0, attract: cfg.attract || null, anchorK: cfg.anchorK || 0, rng: (cfg.seed >>> 0) || 1,
      hits: [0, 0, 0, 0], wl: box.x, wr: box.x + box.w, wt: box.y, wb: box.y + box.h };
    let k = 0, ep = 0, sigs = [], evT = [], cps = [], base = null;
    const warned = new Set();
    const rnd = () => { let s = P.rng; s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; P.rng = s; return s / 4294967296; };
    const gauss = () => { const u = Math.max(1e-12, rnd()), v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v); };
    const wallAt = (side, t, def) => (typeof WF[side] === 'function' ? WF[side](t) : def);

    function addN(name, n, o = {}) {
      const si = idx[name]; if (si == null) throw new Error('Reszecske: ismeretlen fajta ' + name);
      const s = SP[si], R = o.region || { x: P.wl, y: P.wt, w: P.wr - P.wl, h: P.wb - P.wt }, gap = o.gap == null ? 2 : o.gap;
      const pts = [];
      if (o.lattice === 'hex') {
        const d = 2 * s.r + gap, dy = d * Math.sqrt(3) / 2, cols = Math.max(1, Math.floor((R.w - 2 * s.r) / d + 1e-9) + 1);
        const x0 = R.x + (R.w - (cols - 1) * d - d / 2) / 2;
        for (let j = 0; pts.length < n; j++) {
          const y = R.y + R.h - s.r - j * dy; if (y < R.y + s.r - 1e-6) break;
          for (let i = 0; i < cols && pts.length < n; i++) { const x = x0 + (j % 2) * d / 2 + i * d; if (x >= R.x + s.r - 1e-6 && x <= R.x + R.w - s.r + 1e-6) pts.push([x, y]); }
        }
      } else {
        for (let tries = 0; pts.length < n && tries < n * 400; tries++) {
          const x = R.x + s.r + rnd() * (R.w - 2 * s.r), y = R.y + s.r + rnd() * (R.h - 2 * s.r);
          let ok = true;
          for (let j = 0; j < S.n && ok; j++) { const q = SP[S.sp[j]].r + s.r + gap; if ((S.x[j] - x) ** 2 + (S.y[j] - y) ** 2 < q * q) ok = false; }
          for (const [px, py] of pts) { if (!ok) break; const q = 2 * s.r + gap; if ((px - x) ** 2 + (py - y) ** 2 < q * q) ok = false; }
          if (ok) pts.push([x, y]);
        }
      }
      if (pts.length < n && o.exact) while (pts.length < n) pts.push([R.x + s.r + rnd() * Math.max(0, R.w - 2 * s.r), R.y + s.r + rnd() * Math.max(0, R.h - 2 * s.r)]);
      const placed = Math.min(pts.length, MAX - S.n);
      if (placed < n && !o.fill) {
        const key = name + '|' + n + '|' + [R.x, R.y, R.w, R.h].join(',');
        if (!warned.has(key)) { warned.add(key); console.warn(`Reszecske.add: ${name} – ${n} helyett ${placed} fért el (régió ${Math.round(R.w)}×${Math.round(R.h)} px, gap ${gap}${S.n + pts.length > MAX ? ', max elérve' : ''}); nagyobb régió, kisebb gap vagy {exact: true}`); }
      }
      const sig = Math.sqrt(kk * P.T / s.m) * (o.vScale == null ? 1 : o.vScale);
      for (const [x, y] of pts) {
        if (S.n >= MAX) break;
        const i = S.n++;
        S.x[i] = x; S.y[i] = y; S.vx[i] = gauss() * sig; S.vy[i] = gauss() * sig;

/* ── MODUL: Reakció-réteg (KemRx) · forrás: kemia-7-8/08-kemiai-reakcio, 2026-11-23 ──

   const R = KemRx.create(S, {            // S: Reszecske.create(...) – a reakcióban szereplő minden fajtával
     T0: 293, seed: 7,
     atoms: {H2O2: {H: 2, O: 2}},         // opcionális: fajta → atomösszetétel (alap: KemTx.parse(fajtanév))
     rules: [
       {a: 'H2O2', b: 'H2O2', to: ['H2O', 'H2O', 'O2'], Ea: 7, dE: 2},             // két szabad részecske ütközése
       {a: 'H2O2', b: 'H2O2', surface: 'kat', to: ['H2O', 'H2O', 'O2'], Ea: 2.5},  // a: a felületen megkötött, b: szabad
       {a: 'X', surface: 'fem', to: ['Y'], Ea: 1},          // b nélkül: a szabad a a felületbe ütközve alakul át
     ],   // Ea, dE kT₀-ban; dE > 0 exoterm (a termékek ennyivel több mozgási energiát kapnak), dE < 0 endoterm;
          // p (0..1, alap 1): a küszöb fölötti ütközéseknek ekkora hányada reagál (pl. az irány szerepe)
     surfaces: [{id: 'kat', side: 'b', x0, x1, stick: ['H2O2'], on: false}],   // side: 'b' | 't' | 'l' | 'r' (a box fala);
          // x0..x1 a fal menti szakasz (oldalfalnál y-ban); a stick fajták a felületet érve megkötődnek (ha van szabad hely)
     vent: {O2: 't'},                     // ezek a fajták a megadott falat érve távoznak (buborék, elszálló gáz) – számolva

   });
   Betöltéskor ellenőrzi, hogy minden szabály atommegmaradó, és hogy a tömegek (species m) összege

   R.at(t, events)   a szimulációt (S-t is) pontosan t-re hozza. events: a Reszecske eseményei, továbbá

   R.coll(t0, t1)    → [{t, E, r (szabályindex), ok, x, y, s (felület id | null)}] ütközések a [t0, t1) ablakban

   KemRx.check(rules, atoms?) → [hibaüzenetek]  (atommegmaradás szabályonként)
   KemRx.molDraw(L, név, o) → a Reszecske-fajta draw-függvénye KemMol-sablonból: o.scale (px/Å), o.view

       o.hl (0..1: cinóber gyűrű a szabad atomokon) · o.labels (0..1: vegyjel a ≥ 24 px-es golyón, qa: false)
       o.k (md-kulcs) · o.alpha

const KemRx = (function () {
  const TAU = Math.PI * 2, U = Lesson.U, INK = '#1c2440', MUT = '#565d72', RED = '#c8401c', TEAL = '#0a6f86';
  const FL = ['x', 'y', 'vx', 'vy', 'ax', 'ay', 'a0', 'w'];   // a Reszecske részecsketömbjei (S.sp, S.tag mellett)
  const rng = (a, b) => { let s = (Math.imul(a + 1, 2654435761) ^ Math.imul(b + 7, 2246822519) ^ 0x5bd1e995) >>> 0 || 1;
    return () => { s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; };
  const gauss = (r) => { const u = Math.max(1e-12, r()), v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v); };
  const elOf = (s) => KemMol.EL[s] || { c: '#9aa0ad', r: 1.6 };

  function atomsOf(name, A) {
    if (A && A[name]) return A[name];
    if (typeof KemTx !== 'undefined') { const p = KemTx.parse(name); if (p) return p.atoms; }
    return null;
  }
  const addA = (acc, at, k = 1) => { for (const e in at) acc[e] = (acc[e] || 0) + at[e] * k; return acc; };
  const same = (a, b) => { for (const k of new Set([...Object.keys(a), ...Object.keys(b)])) if ((a[k] || 0) !== (b[k] || 0)) return false; return true; };
  function check(rules, A) {
    const err = [];
    rules.forEach((r, i) => {
      const lhs = {}, rhs = {}; let bad = false;
      for (const s of [r.a, r.b].filter(Boolean)) { const at = atomsOf(s, A); if (!at) { err.push('KemRx: ismeretlen összetétel: ' + s); bad = true; } else addA(lhs, at); }
      for (const s of r.to || []) { const at = atomsOf(s, A); if (!at) { err.push('KemRx: ismeretlen összetétel: ' + s); bad = true; } else addA(rhs, at); }
      if (!bad && !same(lhs, rhs)) err.push(`KemRx: a(z) ${i}. szabály nem atommegmaradó: ${JSON.stringify(lhs)} → ${JSON.stringify(rhs)}`);
    });
    return err;
  }

  function create(S, cfg = {}) {
    const h = S.h, box = S.box, SP = S.species, idx = {};
    S.names.forEach((n, i) => { idx[n] = i; });
    const T0 = cfg.T0 || 293, kT0 = S.vrms(T0, 28) ** 2 * 28 / 2, A = cfg.atoms || {}, logC = cfg.log !== false, seed = cfg.seed || 7;
    const rules = (cfg.rules || []).map((r, i) => Object.assign({ Ea: 0, dE: 0, p: 1 }, r, { i }));
    const errs = check(rules, A);
    rules.forEach((r) => {
      const all = [r.a, r.b].concat(r.to || []).filter(Boolean);
      if (all.some((s) => idx[s] == null)) { errs.push('KemRx: a(z) ' + r.i + '. szabály fajtája nincs a motorban: ' + all.filter((s) => idx[s] == null).join(', ')); return; }
      const mIn = (r.a ? SP[idx[r.a]].m : 0) + (r.b ? SP[idx[r.b]].m : 0), mOut = (r.to || []).reduce((t, s) => t + SP[idx[s]].m, 0);
      if (Math.abs(mIn - mOut) > 1e-6) errs.push(`KemRx: a(z) ${r.i}. szabályban a tömeg nem marad meg (${mIn} → ${mOut})`);
    });
    errs.forEach((e) => console.error(e));
    const ok = (r) => [r.a, r.b].concat(r.to || []).filter(Boolean).every((s) => idx[s] != null);
    // szabad–szabad szabályok: PR[si][sj] → [szabály…] (Ea szerint növekvő)
    const PR = [];
    rules.filter((r) => r.b && !r.surface && ok(r)).sort((p, q) => p.Ea - q.Ea).forEach((r) => {
      for (const [x, y] of [[idx[r.a], idx[r.b]], [idx[r.b], idx[r.a]]]) { PR[x] = PR[x] || []; (PR[x][y] = PR[x][y] || []).includes(r) || PR[x][y].push(r); }
    });
    const SR = rules.filter((r) => r.surface && ok(r));
    const surfs = (cfg.surfaces || []).map((s) => {
      const q = Object.assign({ side: 'b', on: false, stick: [] }, s), vert = q.side === 'l' || q.side === 'r';
      q.u0 = q.x0 == null ? (vert ? box.y : box.x) : q.x0; q.u1 = q.x1 == null ? (vert ? box.y + box.h : box.x + box.w) : q.x1;
      q.st = new Set(q.stick.map((n) => idx[n]).filter((v) => v != null)); return q;
    });
    const VENT = {}; for (const k in cfg.vent || {}) if (idx[k] != null) VENT[idx[k]] = cfg.vent[k];
    // fal-geometria: rés (gap), a faltól elfelé mutató sebesség, fal menti koordináta, befelé mutató normális
    const wall = (side, i) => {
      const r = SP[S.sp[i]].r, x = S.x[i], y = S.y[i];
      if (side === 'b') return { gap: box.y + box.h - (y + r), va: -S.vy[i], u: x, nx: 0, ny: -1 };
      if (side === 't') return { gap: y - r - box.y, va: S.vy[i], u: x, nx: 0, ny: 1 };
      if (side === 'l') return { gap: x - r - box.x, va: S.vx[i], u: y, nx: 1, ny: 0 };
      return { gap: box.x + box.w - (x + r), va: -S.vx[i], u: y, nx: -1, ny: 0 };
    };
    const onWall = (s, u, r) => {
      if (s.side === 'b') return { x: u, y: box.y + box.h - r }; if (s.side === 't') return { x: u, y: box.y + r };
      if (s.side === 'l') return { x: box.x + r, y: u }; return { x: box.x + box.w - r, y: u };
    };
    const nrm = (s) => ({ b: [0, -1], t: [0, 1], l: [1, 0], r: [-1, 0] })[s.side];

    // ── napló: minden állapotváltozás időbélyeggel; visszajátszáskor a t-től kezdve újraszámolódik ──
    let LOG = [], COLL = [], ADS = [], SURF = [], VLOG = [];
    const pop = (arr, tc) => { while (arr.length && arr[arr.length - 1].t >= tc - 1e-9) arr.pop(); };
    function trunc(tc) {
      pop(LOG, tc); pop(COLL, tc); pop(SURF, tc); pop(VLOG, tc);
      while (ADS.length && ADS[ADS.length - 1].t0 >= tc - 1e-9) ADS.pop();
      for (const a of ADS) if (a.t1 >= tc - 1e-9) a.t1 = Infinity;
    }
    const onNow = (id) => { for (let i = SURF.length - 1; i >= 0; i--) if (SURF[i].id === id) return SURF[i].on; const s = surfs.find((q) => q.id === id); return !!(s && s.on); };
    const clampIn = (p, r) => { p.x = U.clamp(p.x, box.x + r + .5, box.x + box.w - r - .5); p.y = U.clamp(p.y, box.y + r + .5, box.y + box.h - r - .5); };

    // termékek: tömegközépponti sebesség + véletlen irányú relatív sebességek a megadott energiával
    function products(ru, r, cx, cy, Px, Py, KE, dir, born) {
      const list = ru.to.map((s) => idx[s]), M = list.reduce((t, si) => t + SP[si].m, 0);
      const Vx = dir ? 0 : Px / M, Vy = dir ? 0 : Py / M;
      const Er = Math.max(0.05 * kT0, KE - 0.5 * M * (Vx * Vx + Vy * Vy) + ru.dE * kT0);
      const u = list.map(() => [gauss(r), gauss(r)]);
      if (dir) u.forEach((q) => { const d = q[0] * dir[0] + q[1] * dir[1]; if (d < 0.3) { q[0] += dir[0] * (0.3 - d + 0.5); q[1] += dir[1] * (0.3 - d + 0.5); } });
      else if (list.length > 1) {
        let mx = 0, my = 0; list.forEach((si, k) => { mx += SP[si].m * u[k][0]; my += SP[si].m * u[k][1]; });
        u.forEach((q) => { q[0] -= mx / M; q[1] -= my / M; });
      }
      let Ku = 0; list.forEach((si, k) => { Ku += 0.5 * SP[si].m * (u[k][0] ** 2 + u[k][1] ** 2); });
      const sc = Ku > 1e-12 ? Math.sqrt(Er / Ku) : 0;
      list.forEach((si, k) => {
        const rr = SP[si].r, l = Math.hypot(u[k][0], u[k][1]) || 1, d = list.length > 1 ? rr * 1.2 : 0;
        const p = { x: cx + u[k][0] / l * d, y: cy + u[k][1] / l * d }; clampIn(p, rr);
        born.push({ si, x: p.x, y: p.y, vx: Vx + u[k][0] * sc, vy: Vy + u[k][1] * sc, a0: r() * TAU, w: (r() < .5 ? -1 : 1) * (.6 + 1.6 * r()) });
      });
    }
    function commit(dead, born) {
      let j = 0;
      for (let i = 0; i < S.n; i++) {
        if (dead[i]) continue;
        if (j !== i) { FL.forEach((a) => { S[a][j] = S[a][i]; }); S.sp[j] = S.sp[i]; S.tag[j] = S.tag[i]; }
        j++;
      }
      S.n = j;
      for (const b of born) {
        if (S.n >= S.x.length) break;
        const i = S.n++;
        S.x[i] = b.x; S.y[i] = b.y; S.vx[i] = b.vx; S.vy[i] = b.vy; S.ax[i] = NaN; S.ay[i] = NaN;
        S.a0[i] = b.a0 - b.w * S.t; S.w[i] = b.w; S.sp[i] = b.si; S.tag[i] = 0;   // a rajzszög: a0 + w·t → a születés pillanatában b.a0
      }
    }

    function tick() {
      const t = S.t; trunc(t);
      const r = rng(Math.round(t / h), seed), n = S.n, X = S.x, Y = S.y, VX = S.vx, VY = S.vy, sp = S.sp;
      const dead = new Uint8Array(n), born = [];

      if (PR.length) for (let i = 0; i < n; i++) {
        const pi = PR[sp[i]]; if (!pi) continue; const ri = SP[sp[i]].r;
        for (let j = i + 1; j < n; j++) {
          const list = pi[sp[j]]; if (!list) continue;
          const dx = X[j] - X[i], dy = Y[j] - Y[i], Rr = ri + SP[sp[j]].r, d2 = dx * dx + dy * dy;
          if (d2 > (Rr + 3) * (Rr + 3)) continue;
          const d = Math.sqrt(d2) || 1e-6, nx = dx / d, ny = dy / d, vn = (VX[j] - VX[i]) * nx + (VY[j] - VY[i]) * ny;
          if (vn <= 0 || d - Rr > 0.5 * vn * h + 0.05) continue;

          let hit = null;
          if (!dead[i] && !dead[j]) for (const ru of list) if (E >= ru.Ea && (ru.p >= 1 || r() < ru.p)) { hit = ru; break; }

          if (logC) COLL.push({ t, E, r: list[0].i, ok: !!hit, x: cx, y: cy, s: null });
          if (hit) {
            dead[i] = dead[j] = 1; LOG.push({ t, r: hit.i, x: cx, y: cy, s: null });
            products(hit, r, cx, cy, mi * VX[i] + mj * VX[j], mi * VY[i] + mj * VY[j], 0.5 * mi * (VX[i] ** 2 + VY[i] ** 2) + 0.5 * mj * (VX[j] ** 2 + VY[j] ** 2), null, born);
          }
        }
      }
      // 2) felületek
      for (const s of surfs) {
        if (!onNow(s.id)) continue;
        const dir = nrm(s);
        // a) ütközés megkötött részecskével (minden szabad részecske lepattan róla; a szabálybeli reagálhat)
        for (const ad of ADS) {
          if (ad.t1 !== Infinity || ad.s !== s.id) continue;
          const ra = SP[ad.si].r;
          for (let i = 0; i < n; i++) {
            if (dead[i]) continue;
            const ri = SP[sp[i]].r, dx = X[i] - ad.x, dy = Y[i] - ad.y, Rr = ra + ri, d2 = dx * dx + dy * dy;
            if (d2 >= Rr * Rr) continue;
            const d = Math.sqrt(d2) || 1e-6, nx = dx / d, ny = dy / d, vn = VX[i] * nx + VY[i] * ny;
            const p = { x: ad.x + nx * Rr, y: ad.y + ny * Rr }; clampIn(p, ri); X[i] = p.x; Y[i] = p.y;
            if (vn >= 0) continue;
            const ru = SR.find((q) => q.surface === s.id && q.b && idx[q.a] === ad.si && idx[q.b] === sp[i]);
            const m = SP[sp[i]].m, E = 0.5 * m * vn * vn / kT0, okk = !!ru && E >= ru.Ea && (ru.p >= 1 || r() < ru.p);
            if (ru && logC) COLL.push({ t, E, r: ru.i, ok: okk, x: ad.x + nx * ra, y: ad.y + ny * ra, s: s.id });
            if (okk) {
              ad.t1 = t; dead[i] = 1; LOG.push({ t, r: ru.i, x: ad.x, y: ad.y, s: s.id });
              products(ru, r, ad.x, ad.y, 0, 0, 0.5 * m * (VX[i] ** 2 + VY[i] ** 2) + kT0, dir, born);
              break;
            }
            VX[i] -= 2 * vn * nx; VY[i] -= 2 * vn * ny;
          }
        }
        for (let i = 0; i < n; i++) {

        for (const v of ty) { const Y = pl.Y(v); if (Y >= B.y - .5 && Y <= B.y + B.h + .5) { c.moveTo(B.x, Y); c.lineTo(B.x - 7, Y); } }

/* ── MODUL: GHS-piktogramok, bélyegek, flakon (KemGHS) · forrás: kemia-7-8/10-sav-bazis, 2026-11-24 ──

   alap, fekete jel), a sorozat bélyegei („NE PRÓBÁLD KI”, „tanári bemutató”, „szemléltetés”) és egy

   kódjára nem hivatkozik. Szöveget csak L.tx / L.pill útján ír, a szöveget a hívó adja (.md-kulccsal).
   A piktogramok jelentését (pl. „maró”) a lecke .md-je adja – itt csak a rajz van.
   Tervezett helye: shared/kemia/kemghs.js.

   KemGHS.ALIAS: robbano GHS01 · tuzveszelyes GHS02 · oxidalo GHS03 · gaz GHS04 (nyomás alatti gáz) ·
       maro GHS05 · mergezo GHS06 (akut toxicitás, koponya) · felkialtojel GHS07 (irritáló, ártalmas) ·
       egeszseg GHS08 (egészségkárosító) · kornyezet GHS09

const KemGHS = (() => {

  function flamePath(c, x0, y0, k) {      // láng: alja (x0, y0), magassága k·40

      c.lineTo(54.8, 55.6); c.lineTo(53.2, 56.2); c.lineTo(54.5, 57); c.lineTo(52.8, 57.6); c.lineTo(54.6, 58.2);   // kimart ujjhegy

    },
    GHS08(c) {        // egészségkárosító: mellkép, a mellkason fehér csillag

      c.beginPath(); c.moveTo(44, 38.5); c.lineTo(56, 38.5); c.quadraticCurveTo(66, 39.5, 67.5, 48); c.lineTo(66.5, 69); c.lineTo(33.5, 69); c.lineTo(32.5, 48); c.quadraticCurveTo(34, 39.5, 44, 38.5); c.closePath(); c.fill();

      const fr = []; for (let n = 1; n <= NMAX(); n++) fr.push(fracOf(n));
      let ordered = true; for (let n = 2; n <= NMAX(); n++) if (fr[n - 1] < fr[n - 2]) ordered = false;
      out.push({ name: 'frakciók sorrendben, mind nem üres (gáz–gázolaj)', ok: ordered && [0, 1, 2, 3].every((f) => fr.includes(f)), got: fr.join(''), want: 'növekvő' });
      out.push({ name: 'tálcák hőmérséklete csökken fölfelé', ok: CUT()[0] < CUT()[1] && CUT()[1] < CUT()[2] && CUT()[2] < CUT()[3], got: CUT().join(' < '), want: 'növekvő' });
      if (L.step === 1) { const ma = KemMol.atoms(molN(S2.n)); out.push({ name: 'rajzolt molekula = CₙH₂ₙ₊₂', ok: ma.C === S2.n && ma.H === 2 * S2.n + 2, got: JSON.stringify(ma), want: S2.n + ', ' + (2 * S2.n + 2) }); }
      if (L.step === 3) { const ma = KemMol.atoms(molN(S4.n)); out.push({ name: 'kiválasztott lánc képlete', ok: ma.C === S4.n && ma.H === 2 * S4.n + 2, got: JSON.stringify(ma), want: S4.n }); }
      if (L.step === 7) { const d = dOfT(L.dat('olajablak').lo); out.push({ name: 'olajablak teteje ≈ 1,5 km (15 °C + 30 °C/km)', ok: Math.abs(d - 1.5) < .01, got: +d.toFixed(2), want: 1.5 }); }
      return out;
    };
  },
  draw(Lx) {
    L = Lx; c = L.ctx; GA = 1; background();
    if (L.step >= 0) sT[L.step] = L.st;
    for (let i = 0; i < NS; i++) {
      const w = clamp(1 - Math.abs(L.sp - i) * 2); if (w <= .005) continue;
      GA = 1; c.lineJoin = 'miter'; c.lineCap = 'butt'; c.setLineDash([]); SCENES[i](sT[i], w, i === L.step);
    }
    c.globalAlpha = 1; c.lineJoin = 'miter'; c.lineCap = 'butt'; c.setLineDash([]);
  },
});

})();
