/* ── MODUL: Részecskemotor (Reszecske) · forrás: kemia-7-8/01-reszecskemodell, 2026-11-23 ── */
/* API
   Tantárgyfüggetlen 2D részecskeszimuláció (gáz, folyadék, szilárd rács, diffúzió, keverék),
   DETERMINISZTIKUS VISSZAJÁTSZÁSSAL. Nem hivatkozik a lecke kódjára; csak egy 2D vászon kell.
   Változtatás nélkül átemelhető (tervezett helye: shared/reszecske.js).

   const S = Reszecske.create({
     seed: 42,                   // véletlenmag (kezdőhelyek, kezdősebességek) – azonos mag → azonos futás
     dt: 1 / 120,                // fix lépésköz (s)
     box: {x, y, w, h},          // téglalap tartály (logikai px)
     walls: {l, r, t, b},        // opcionális: a fal helyzete fn(t) (zárt képletű dugattyú) – a box-on belül
     species: {                  // részecskefajták
       N2: {r: 12, m: 28, c: '#2f5fb3', draw: 'ketatom'},     // r: ütközési sugár px · m: relatív tömeg · c: szín
       H2O: {r: 12, m: 18, draw: 'viz'} },                   // draw: 'golyo' | 'ketatom' (c2: 2. atom színe) |
                                                              //   'viz' | 'etanol' | fn(ctx, x, y, r, ang, faj)
     T: 293,                     // hőmérséklet (K) – a termosztát célja
     vRef: 150,                  // négyzetes középsebesség px/s-ban m = 28, T = 293 K esetén (szemléltetés: lassított)
     thermo: 0.5,                // termosztát időállandója (s); 0 → nincs termosztát (az energia megmarad)
     collide: true,              // részecske–részecske rugalmas ütközés (false: átrepülnek egymáson)
     gravity: 0,                 // lefelé gyorsulás, px/s²
     attract: null,              // {eps, range}: vonzás, ha a felületek távolsága < range (eps: csúcs, px/s²) → folyadék
     anchorK: 0,                 // rugó a rácshelyhez (1/s²) a horgonyzott részecskékre → szilárd rács
     max: 600,                   // a részecskék felső száma
   });
   S.add('N2', 40, {region: {x, y, w, h}, lattice: 'random' | 'hex', gap: 2, anchor: false, tag: 0})
                               // csak az első S.at előtt; később esemény ({add}) kell
   S.at(t, events)             // az állapotot PONTOSAN a t. másodpercre hozza. events: időrendben,
                               //   [{t, set: {T, collide, gravity, attract, anchorK, thermo}},
                               //    {t, add: ['N2', 10, {region…}]}, {t, remove: 'N2' | fn(S, i) → bool},
                               //    {t, id: 'egyedi', fn: (S) => {…}}]
                               //   Azonos seed + azonos eseménysor → mindig ugyanaz az állapot. Előre csak
                               //   továbbfut; visszafelé (vagy ha egy múltbeli esemény változott) a legközelebbi
                               //   ellenőrzőpontból (0,5 s-onként mentve) számol újra.
   S.reset()                   // vissza a kezdőállapotba, ellenőrzőpontok törlése – enter(L)-ben hívd,
                               //   és mindig, ha a walls-függvény mögötti napló kiürül
   S.t                         // a szimuláció ideje (s)
   S.n, S.x[i], S.y[i], S.vx[i], S.vy[i], S.sp[i] (fajta indexe), S.names[], S.tag[i]   – csak olvasásra
   S.speeds(sp?)  → [px/s, …] · S.count(fn(S, i) → bool) · S.Tkin() → K (a mozgási energiából)
   S.hits(side)   → falba csapódás / s (mozgó átlag, τ = 1 s; side: 'l' | 'r' | 't' | 'b') – a nyomással arányos
   S.draw(ctx, {hl: (i) → bool, hlColor, alpha: (i) → 0..1, trail: s})   // 3D-hatású golyók, sötét körvonallal
   Reszecske.ball(ctx, x, y, r, szín, keret?)          // egy golyó ugyanabban a stílusban
   Reszecske.mol(ctx, draw, x, y, r, ang, faj)        // egy molekula (jelmagyarázathoz)
   Reszecske.zart(n, seed) → Z                        // zárt képletű „díszítő” halmaz (nincs szimuláció):
     Z.frame(t, phase, B, it)  → [{x, y, ang}]        //   phase: 0 rácsban rezeg · 1 folyadék · 2 gáz (közte átmenet)
                                                      //   B: {x, y, w, h, d (részecskeátmérő)}; it: átfedés-feloldás
   Teljesítmény: rácsos szomszédkeresés; ~400 részecske 120 Hz-en is bőven 60 fps.
   ──────────────────────────────────────────────────────────────────────────────── */
const Reszecske = (() => {
  const TAU = Math.PI * 2;
  const rgb = (h) => { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
  const mixc = (a, b, t) => { const A = rgb(a), B = rgb(b); return 'rgb(' + A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',') + ')'; };
  const SPR = new Map();
  function sprite(col, bd) {
    const key = col + '|' + (bd || ''); let s = SPR.get(key); if (s) return s;
    s = document.createElement('canvas'); s.width = s.height = 80; const g = s.getContext('2d');
    const gr = g.createRadialGradient(29, 27, 2, 40, 40, 37);
    gr.addColorStop(0, mixc(col, '#ffffff', .62)); gr.addColorStop(.42, col); gr.addColorStop(1, mixc(col, '#000000', .36));
    g.beginPath(); g.arc(40, 40, 36, 0, TAU); g.fillStyle = gr; g.fill();
    const hl = g.createRadialGradient(28, 25, 0, 28, 25, 15); hl.addColorStop(0, 'rgba(255,255,255,.85)'); hl.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = hl; g.fill();
    g.lineWidth = 5; g.strokeStyle = bd || mixc(col, '#1c2440', .62); g.beginPath(); g.arc(40, 40, 35, 0, TAU); g.stroke();
    SPR.set(key, s); return s;
  }
  function ball(ctx, x, y, r, col, bd) { const k = r / 36; ctx.drawImage(sprite(col, bd), x - 40 * k, y - 40 * k, 80 * k, 80 * k); }
  const ELH = ['#f2ede2', '#565d72'], ELO = '#d6452c', ELC = '#3b4050';
  function mol(ctx, kind, x, y, r, ang, s) {
    if (typeof kind === 'function') return kind(ctx, x, y, r, ang, s);
    const ca = Math.cos(ang), sa = Math.sin(ang);
    if (kind === 'ketatom') {
      const d = r * .4, q = r * .62;
      ball(ctx, x - ca * d, y - sa * d, q, s.c, s.bd); ball(ctx, x + ca * d, y + sa * d, q, s.c2 || s.c, s.bd);
    } else if (kind === 'viz') {
      const ox = x - ca * r * .14, oy = y - sa * r * .14;
      for (const da of [-.912, .912]) ball(ctx, ox + Math.cos(ang + da) * r * .6, oy + Math.sin(ang + da) * r * .6, r * .4, ELH[0], ELH[1]);
      ball(ctx, ox, oy, r * .66, ELO);
    } else if (kind === 'etanol') {
      const px = -sa, py = ca, pts = [[-.56, .14, ELC, .46], [0, -.14, ELC, .46], [.56, .14, ELO, .42]];
      for (const [u, v, col, q] of pts) ball(ctx, x + ca * u * r + px * v * r, y + sa * u * r + py * v * r, q * r, col);
    } else ball(ctx, x, y, r, s.c, s.bd);
  }

  function create(cfg) {
    const h = cfg.dt || 1 / 120, MAX = cfg.max || 600, KC = Math.max(1, Math.round(.5 / h));
    const names = Object.keys(cfg.species);
    const SP = names.map((k) => Object.assign({ r: 8, m: 28, c: '#8a93a6', draw: 'golyo' }, cfg.species[k], { name: k }));
    const idx = {}; names.forEach((k, i) => { idx[k] = i; });
    const vRef = cfg.vRef || 150, kk = vRef * vRef * 28 / (2 * 293);
    const box = cfg.box, WF = cfg.walls || {};
    const FL = ['x', 'y', 'vx', 'vy', 'ax', 'ay', 'a0', 'w'];
    const S = { n: 0, names, species: SP, h, box };
    FL.forEach((f) => { S[f] = new Float64Array(MAX); });
    S.sp = new Int16Array(MAX); S.tag = new Int32Array(MAX);
    const rmax = SP.reduce((m, s) => Math.max(m, s.r), 0);
    let P = { T: cfg.T == null ? 293 : cfg.T, thermo: cfg.thermo == null ? .5 : cfg.thermo, collide: cfg.collide !== false,
      gravity: cfg.gravity || 0, attract: cfg.attract || null, anchorK: cfg.anchorK || 0, rng: (cfg.seed >>> 0) || 1,
      hits: [0, 0, 0, 0], wl: box.x, wr: box.x + box.w, wt: box.y, wb: box.y + box.h };
    let k = 0, ep = 0, sigs = [], evT = [], cps = [], base = null;
    const rnd = () => { let s = P.rng; s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; P.rng = s; return s / 4294967296; };
    const gauss = () => { const u = Math.max(1e-12, rnd()), v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v); };
    const wallAt = (side, t, def) => (typeof WF[side] === 'function' ? WF[side](t) : def);

    function addN(name, n, o = {}) {
      const si = idx[name]; if (si == null) throw new Error('Reszecske: ismeretlen fajta ' + name);
      const s = SP[si], R = o.region || { x: P.wl, y: P.wt, w: P.wr - P.wl, h: P.wb - P.wt }, gap = o.gap == null ? 2 : o.gap;
      const pts = [];
      if (o.lattice === 'hex') {
        const d = 2 * s.r + gap, dy = d * Math.sqrt(3) / 2, cols = Math.max(1, Math.floor((R.w - 2 * s.r) / d + 1e-9) + 1);
        const x0 = R.x + (R.w - (cols - 1) * d - d / 2) / 2;
        for (let j = 0; pts.length < n; j++) {
          const y = R.y + R.h - s.r - j * dy; if (y < R.y + s.r - 1e-6) break;
          for (let i = 0; i < cols && pts.length < n; i++) { const x = x0 + (j % 2) * d / 2 + i * d; if (x >= R.x + s.r - 1e-6 && x <= R.x + R.w - s.r + 1e-6) pts.push([x, y]); }
        }
      } else {
        for (let tries = 0; pts.length < n && tries < n * 400; tries++) {
          const x = R.x + s.r + rnd() * (R.w - 2 * s.r), y = R.y + s.r + rnd() * (R.h - 2 * s.r);
          let ok = true;
          for (let j = 0; j < S.n && ok; j++) { const q = SP[S.sp[j]].r + s.r + gap; if ((S.x[j] - x) ** 2 + (S.y[j] - y) ** 2 < q * q) ok = false; }
          for (const [px, py] of pts) { if (!ok) break; const q = 2 * s.r + gap; if ((px - x) ** 2 + (py - y) ** 2 < q * q) ok = false; }
          if (ok) pts.push([x, y]);
        }

   A CLP/GHS veszélyességi piktogramjai valósághűen (piros keretes, csúcsára állított négyzet, fehér
   alap, fekete jel), a sorozat bélyegei („NE PRÓBÁLD KI”, „tanári bemutató”, „szemléltetés”) és egy

   kódjára nem hivatkozik. Szöveget csak L.tx / L.pill útján ír, a szöveget a hívó adja (.md-kulccsal).
   A piktogramok jelentését (pl. „maró”) a lecke .md-je adja – itt csak a rajz van.
   Tervezett helye: shared/kemia/kemghs.js.

   KemGHS.IDS = ['GHS01', …, 'GHS09']
   KemGHS.ALIAS: robbano GHS01 · tuzveszelyes GHS02 · oxidalo GHS03 · gaz GHS04 (nyomás alatti gáz) ·
       maro GHS05 · mergezo GHS06 (akut toxicitás, koponya) · felkialtojel GHS07 (irritáló, ártalmas) ·
       egeszseg GHS08 (egészségkárosító) · kornyezet GHS09

       o.shadow (alap true: halvány árnyék a papíron). Az arányok a hivatalos rajzot követik: a piros

       papír alapon, 2 px keret. o.kind: 'tilos' (NE PRÓBÁLD KI – keret és szöveg #b3261e, 3 px) |
       'tanari' | 'szemleltetes' (halvány tinta) · o.k (md-kulcs) · o.a · o.al ('left' | 'center' |

   KemSep.mono(xs, ys) → f(x)             monoton köbös interpoláció (Fritsch–Carlson) mért pontokon át;

   KemSep.stand(L, x, yb, h, {base: [x0, x1], a})          Bunsen-állvány: talp (yb a talp alja) + rúd
   KemSep.ring(L, xr, y, cx, r, {part: 'back'|'front'|'all', a})   szűrőkarika a rúdhoz (xr) fogva
   KemSep.funnel(L, cx, y, w, h, {stem, paper: true, level: 0..1, liquid, inner: (ctx, g) => {}, a})
        tölcsér szűrőpapírral; y: perem, w: peremszélesség, h: a kúp magassága, stem: a szár hossza.
        level: folyadék a papírkúpban (a kúp magasságának arányában); inner: rajz a papírkúpba vágva
        (pl. üledék) → g = {tip: [x, y] (a szár vége), apex: [x, y] (a papírkúp csúcsa), py (a papír
        pereme), half(yy) (a papírkúp félszélessége yy magasságban)}
   KemSep.dish(L, cx, y, w, {level: 0..1, liquid, crust: 0..1, a}) → {yb, yl}
        porcelán bepárlócsésze kiöntőcsőrrel (y: perem); crust: a kivált só (kristálykéreg + szemcsék)
   KemSep.watch(L, cx, y, w, {a}) → {yb, yAt(x)}              óraüveg (y: perem, yAt: a belső felület)
   KemSep.magnet(L, cx, cy, w, h, {bag: true, a}) → {bottom}   rúdmágnes (piros É fent), átlátszó zacskóban
   KemSep.tube(L, pts, {d: 16, fill, a})     üvegcső tört vonal mentén ([[x, y], …]; oldalcső, könyök)
   KemSep.condenser(L, x1, y1, x2, y2, {D: 56, water: 0..1, t, flow: 0..1, a})
        Liebig-hűtő: belső cső x1,y1 → x2,y2 (a gőz útja), köpeny a hossz 10–90 %-án, a hűtővíz alul
        (a hűtő alsó végén) be, felül ki – ellenáram; water: a köpeny telítettsége; flow: kondenzátum a
        belső csőben (0: nincs) → {inN: [x, y], outN: [x, y], n: [nx, ny]} (a csonkok vége, a normális)
   KemSep.drops(L, x, y0, y1, {ph, r: 6, col, a})   csepegés: ph a felhalmozott „cseppfázis” (egy egész
        = egy csepp); a tört rész szerint a csepp nő (y0-nál), majd y1-ig esik. Zárt képletű, ha a hívó
        a fázist a saját visszajátszásából adja.
   KemSep.vapor(L, x, y, w, h, {t, amt: 0..1, col, a})   felszálló gőzpamacsok (y: alap, h: magasság)
   KemSep.strip(L, x, y, w, h, {start, front, spots: [{d, rgb: [r, g, b], len, a}], a})   kromatográfiás papírcsík;
        y: a csík teteje; start, front, d: távolság a csík aljától (px); a front alatt nedves
   KemSep.order(L, cfg) → g     sorba rendezés kártyákkal (KATTINTÁSSAL; a TortCards stílusában):
        cfg = {cards: [{id, label: {s, k}}], slots: n, row: {x, y, w, gap}, tray: {x, y, w},
               font?: {f, s, w}, ease?: .4}
        Kattintás a tálcán lévő kártyára → az első üres helyre; a helyen lévőre → vissza a tálcára.
        g.update()  minden képkockán, csak az aktív lépésben (L.pointer.pressed – a gyors kattintás is)
        g.draw({a}) · g.seq() → [id | null, …] · g.full() · g.set([id…], t0?) · g.reset() · g.t1: az
        utolsó változás L.st-je · g.slot(i) → {x, y, w, h} · g.H: kártyamagasság
   ──────────────────────────────────────────────────────────────────────────────── */
const KemSep = (() => {
  const TAU = Math.PI * 2, INK = '#1c2440', MUT = '#565d72', RED = '#c8401c', CARD = '#fffaf1', GLASS = 'rgba(255,255,255,.5)',
    WATERC = 'rgba(70,150,215,.42)', WATERD = '#1b5a94', METAL = '#8b929e', METALD = '#3a3f4b', PORC = '#f4f1ea';
  const al = (L, o, m = 1) => { const c = L.ctx; c.globalAlpha = (o.a == null ? 1 : o.a) * m; c.lineJoin = 'miter'; c.lineCap = 'butt'; c.setLineDash([]); };
  const rr = (c, x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, w, h, r); };
  const ln = (c, x1, y1, x2, y2, col, w) => { c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.strokeStyle = col; c.lineWidth = w; c.stroke(); };
  const hash = (i, j) => { let h = (i * 374761393 + j * 668265263) >>> 0; h = (h ^ (h >>> 13)) * 1274126177 >>> 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };

  function mono(xs, ys) {
    const n = xs.length, d = [], m = new Array(n);
    for (let i = 0; i < n - 1; i++) d.push((ys[i + 1] - ys[i]) / (xs[i + 1] - xs[i]));
    m[0] = d[0]; m[n - 1] = d[n - 2];
    for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
    for (let i = 0; i < n - 1; i++) {
      if (d[i] === 0) { m[i] = 0; m[i + 1] = 0; continue; }
      const a = m[i] / d[i], b = m[i + 1] / d[i], s = a * a + b * b;
      if (s > 9) { const t = 3 / Math.sqrt(s); m[i] = t * a * d[i]; m[i + 1] = t * b * d[i]; }
    }
    return (x) => {
      if (x <= xs[0]) return ys[0]; if (x >= xs[n - 1]) return ys[n - 1];
      let i = 0; while (x > xs[i + 1]) i++;
      const h = xs[i + 1] - xs[i], t = (x - xs[i]) / h, t2 = t * t, t3 = t2 * t;
      return (2 * t3 - 3 * t2 + 1) * ys[i] + (t3 - 2 * t2 + t) * h * m[i] + (-2 * t3 + 3 * t2) * ys[i + 1] + (t3 - t2) * h * m[i + 1];
    };
  }

  function stand(L, x, yb, h, o = {}) {
    const c = L.ctx, b = o.base || [x - 40, x + 220]; al(L, o);
    rr(c, b[0], yb - 16, b[1] - b[0], 16, 5); c.fillStyle = '#4a4f5b'; c.fill(); c.strokeStyle = INK; c.lineWidth = 2.5; c.stroke();
    rr(c, x - 5, yb - 16 - h, 10, h, 3); c.fillStyle = METAL; c.fill(); c.strokeStyle = INK; c.lineWidth = 2; c.stroke();
  }
  function ring(L, xr, y, cx, r, o = {}) {
    const c = L.ctx, part = o.part || 'all', ry = r * .26; al(L, o);
    if (part !== 'front') {
      ln(c, xr + 5, y, cx - r, y, METALD, 6);
      rr(c, xr - 11, y - 11, 22, 22, 4); c.fillStyle = '#5c6370'; c.fill(); c.strokeStyle = INK; c.lineWidth = 2; c.stroke();
      c.beginPath(); c.ellipse(cx, y, r, ry, 0, Math.PI, TAU); c.strokeStyle = METALD; c.lineWidth = 6; c.stroke();
    }
    if (part !== 'back') { c.beginPath(); c.ellipse(cx, y, r, ry, 0, 0, Math.PI); c.strokeStyle = METALD; c.lineWidth = 6; c.stroke(); }
  }

  function funnel(L, cx, y, w, h, o = {}) {
    const c = L.ctx, sw = 18, stem = o.stem == null ? h * .8 : o.stem, yb = y + h, tip = [cx, yb + stem];
    const pr = w / 2 - 12, py = y + 8, apex = [cx, y + h * .9];
    const half = (yy) => Math.max(0, pr * (apex[1] - yy) / (apex[1] - py));
    const g = { tip, apex, py, half };
    const body = () => { c.beginPath(); c.moveTo(cx - w / 2, y); c.lineTo(cx - sw / 2, yb); c.lineTo(cx - sw / 2, yb + stem - 6); c.lineTo(cx + sw / 2, yb + stem + 6); c.lineTo(cx + sw / 2, yb); c.lineTo(cx + w / 2, y); };
    al(L, o);
    body(); c.fillStyle = GLASS; c.fill();
    if (o.paper !== false) {
      const pp = () => { c.beginPath(); c.moveTo(cx - pr, py); c.lineTo(apex[0], apex[1]); c.lineTo(cx + pr, py); c.closePath(); };
      pp(); c.fillStyle = '#fbf8f1'; c.fill();
      if (o.level > 0) {
        c.save(); pp(); c.clip(); const yl = apex[1] - (apex[1] - py) * o.level;
        c.fillStyle = o.liquid || WATERC; c.fillRect(cx - pr, yl, 2 * pr, apex[1] - yl + 2);
        ln(c, cx - half(yl), yl, cx + half(yl), yl, o.line || WATERD, 2.5); c.restore(); al(L, o);
      }
      if (o.inner) { c.save(); pp(); c.clip(); o.inner(c, g); c.restore(); al(L, o); }
      pp(); c.strokeStyle = '#b7ab92'; c.lineWidth = 2; c.stroke();
      ln(c, cx - pr * .3, py, apex[0], apex[1], '#cfc4ab', 2);
    }
    // a szárban lefolyó folyadék
    if (o.stemFill) { c.fillStyle = o.stemFill; c.fillRect(cx - sw / 2 + 3, yb - 2, sw - 6, stem); }
    body(); c.strokeStyle = INK; c.lineWidth = 3; c.lineJoin = 'round'; c.stroke(); c.lineJoin = 'miter';
    c.globalAlpha *= .6; ln(c, cx - w / 2 + 16, y + 10, cx - sw / 2 - 4, yb - 20, '#ffffff', 4); al(L, o);
    return g;
  }

  function dish(L, cx, y, w, o = {}) {
    const c = L.ctx, d = w * .32, yb = y + d;
    const path = () => { c.beginPath(); c.moveTo(cx - w / 2, y); c.bezierCurveTo(cx - w / 2, y + d * .9, cx - w * .3, yb, cx, yb); c.bezierCurveTo(cx + w * .3, yb, cx + w / 2, y + d * .9, cx + w / 2, y); };
    al(L, o);
    path(); c.closePath(); c.fillStyle = PORC; c.fill();
    const lev = o.level || 0, yl = yb - d * .86 * lev;
    if (lev > .002) { c.save(); path(); c.closePath(); c.clip(); c.fillStyle = o.liquid || WATERC; c.fillRect(cx - w / 2, yl, w, yb - yl + 2); ln(c, cx - w / 2, yl, cx + w / 2, yl, o.line || WATERD, 2.5); c.restore(); al(L, o); }
    const cr = o.crust || 0;
    if (cr > .002) {
      c.save(); path(); c.closePath(); c.clip();
      const n = Math.round(70 * cr);
      for (let i = 0; i < n; i++) {
        const u = hash(i, 7) * 2 - 1, s = 3 + 5 * hash(i, 9);
        const xx = cx + u * w * .44 * Math.sqrt(hash(i, 3)), yy = yb - 4 - (yb - y) * .5 * hash(i, 5) * (Math.abs(u) + .15);
        c.save(); c.translate(xx, yy); c.rotate(hash(i, 11) * 1.6); c.fillStyle = '#ffffff'; c.fillRect(-s / 2, -s / 2, s, s); c.strokeStyle = '#8d93a3'; c.lineWidth = 1.2; c.strokeRect(-s / 2, -s / 2, s, s); c.restore();
      }
      c.restore(); al(L, o);
    }
    path(); c.strokeStyle = INK; c.lineWidth = 3; c.lineJoin = 'round'; c.stroke();
    c.beginPath(); c.moveTo(cx - w / 2 - 14, y - 6); c.quadraticCurveTo(cx - w / 2 - 4, y - 2, cx - w / 2 + 2, y + 6); c.stroke(); c.lineJoin = 'miter';
    return { yb, yl, d };
  }

  function watch(L, cx, y, w, o = {}) {
    const c = L.ctx, sag = w * .1, yAt = (x) => y + sag * (1 - Math.pow((x - cx) / (w / 2), 2));
    al(L, o);
    c.beginPath(); c.moveTo(cx - w / 2, y); c.quadraticCurveTo(cx, y + 2 * sag, cx + w / 2, y);
    c.quadraticCurveTo(cx, y + 2 * sag + 12, cx - w / 2, y); c.closePath();
    c.fillStyle = 'rgba(225,236,242,.75)'; c.fill(); c.strokeStyle = INK; c.lineWidth = 2.5; c.lineJoin = 'round'; c.stroke(); c.lineJoin = 'miter';
    return { yb: y + sag + 6, yAt };
  }

  function magnet(L, cx, cy, w, h, o = {}) {
    const c = L.ctx; al(L, o);
    rr(c, cx - w / 2, cy - h / 2, w, h / 2, [8, 8, 0, 0]); c.fillStyle = '#c8402e'; c.fill();
    rr(c, cx - w / 2, cy, w, h / 2, [0, 0, 8, 8]); c.fillStyle = '#2f5fb3'; c.fill();
    rr(c, cx - w / 2, cy - h / 2, w, h, 8); c.strokeStyle = INK; c.lineWidth = 3; c.stroke();
    c.globalAlpha *= .45; ln(c, cx - w / 2 + 9, cy - h / 2 + 10, cx - w / 2 + 9, cy + h / 2 - 10, '#ffffff', 4); al(L, o);
    if (o.bag !== false) {
      c.beginPath(); c.moveTo(cx - w / 2 - 10, cy - h / 2 - 30); c.lineTo(cx - w / 2 - 8, cy + h / 2 + 2);
      c.quadraticCurveTo(cx - w / 2 - 6, cy + h / 2 + 10, cx, cy + h / 2 + 10); c.quadraticCurveTo(cx + w / 2 + 6, cy + h / 2 + 10, cx + w / 2 + 8, cy + h / 2 + 2);
      c.lineTo(cx + w / 2 + 10, cy - h / 2 - 30);
      c.fillStyle = 'rgba(220,232,240,.28)'; c.fill(); c.strokeStyle = 'rgba(28,36,64,.55)'; c.lineWidth = 2; c.stroke();
    }
    return { bottom: cy + h / 2 + (o.bag !== false ? 10 : 0) };
  }

  function tube(L, pts, o = {}) {
    const c = L.ctx, d = o.d || 16; al(L, o);
    const path = () => { c.beginPath(); pts.forEach((p, i) => (i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1]))); };
    c.lineJoin = 'round'; c.lineCap = 'butt';
    path(); c.strokeStyle = INK; c.lineWidth = d + 6; c.stroke();
    path(); c.strokeStyle = '#eef3f6'; c.lineWidth = d; c.stroke();
    if (o.fill) { path(); c.strokeStyle = o.fill; c.lineWidth = d * .5; c.stroke(); }
    al(L, o);
  }

  function condenser(L, x1, y1, x2, y2, o = {}) {
    const c = L.ctx, D = o.D || 56, d = 16, len = Math.hypot(x2 - x1, y2 - y1), ux = (x2 - x1) / len, uy = (y2 - y1) / len, nx = -uy, ny = ux;
    const P = (s, k) => [x1 + ux * s * len + nx * k, y1 + uy * s * len + ny * k];
    const s0 = .1, s1 = .9, t = o.t || 0;
    const poly = (pts) => { c.beginPath(); pts.forEach((p, i) => (i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1]))); c.closePath(); };
    const jacket = () => poly([P(s0, -D / 2), P(s1, -D / 2), P(s1 + .02, -d / 2 - 3), P(s1 + .02, d / 2 + 3), P(s1, D / 2), P(s0, D / 2), P(s0 - .02, d / 2 + 3), P(s0 - .02, -d / 2 - 3)]);
    const inN = P(.84, D / 2 + 24), outN = P(.16, -D / 2 - 24);
    al(L, o);
    // csonkok
    for (const [s, k] of [[.84, 1], [.16, -1]]) { const a = P(s, k * D / 2 - k * 2), b = P(s, k * (D / 2 + 24)); ln(c, a[0], a[1], b[0], b[1], INK, 17); ln(c, a[0], a[1], b[0], b[1], '#e6eef3', 11); }
    jacket(); c.fillStyle = GLASS; c.fill();
    const wa = o.water == null ? 1 : o.water;
    if (wa > .01) {
      c.save(); jacket(); c.clip(); c.globalAlpha = (o.a == null ? 1 : o.a) * wa;
      c.fillStyle = 'rgba(70,150,215,.36)'; c.fill();
      for (let i = 0; i < 9; i++) { // ellenáram: a víz az alsó végtől (s1) a felső (s0) felé áramlik
        const s = s1 - ((i / 9 + t * .12) % 1) * (s1 - s0);
        for (const k of [-1, 1]) { const a = P(s, k * (d / 2 + 9)), b = P(s - .035, k * (d / 2 + 9)); ln(c, a[0], a[1], b[0], b[1], 'rgba(27,90,148,.55)', 3); }
      }
      c.restore(); al(L, o);
    }
    jacket(); c.strokeStyle = INK; c.lineWidth = 3; c.lineJoin = 'round'; c.stroke(); c.lineJoin = 'miter';
    // belső cső
    const a0 = P(0, 0), a1 = P(1, 0);
    c.lineCap = 'butt'; ln(c, a0[0], a0[1], a1[0], a1[1], INK, d + 6); ln(c, a0[0], a0[1], a1[0], a1[1], '#f3f7f9', d);
    const fl = o.flow || 0;
    if (fl > .01) {
      const n = 7;
      for (let i = 0; i < n; i++) {
        const s = (i / n + t * .22) % 1, q = U01((s - .25) / .3), pp = P(s, d * .18);
        c.globalAlpha = (o.a == null ? 1 : o.a) * fl;
        if (q <= 0) { c.beginPath(); c.arc(pp[0], pp[1], 5, 0, TAU); c.fillStyle = 'rgba(205,222,236,.8)'; c.fill(); }   // gőz
        else { c.beginPath(); c.arc(pp[0], pp[1], 2.5 + 1.5 * q, 0, TAU); c.fillStyle = 'rgba(70,150,215,.85)'; c.fill(); } // lecsapódott csepp
      }
      al(L, o);
    }
    c.globalAlpha *= .55; const h0 = P(s0 + .03, -D / 2 + 8), h1 = P(s1 - .03, -D / 2 + 8); ln(c, h0[0], h0[1], h1[0], h1[1], '#ffffff', 4); al(L, o);
    return { inN, outN, n: [nx, ny] };
  }
  const U01 = (v) => Math.max(0, Math.min(1, v));

  function drops(L, x, y0, y1, o = {}) {
    const c = L.ctx, r = o.r || 6, f = ((o.ph || 0) % 1 + 1) % 1; al(L, o);
    c.fillStyle = o.col || 'rgba(70,150,215,.85)';
    if (f < .7) { const rr0 = r * Math.sqrt(f / .7); if (rr0 > .5) { c.beginPath(); c.arc(x, y0 + rr0, rr0, 0, TAU); c.fill(); } }
    else { const q = (f - .7) / .3, yy = y0 + r + (y1 - y0 - r) * q * q; if (yy < y1) { c.beginPath(); c.arc(x, yy, r * .9, 0, TAU); c.fill(); } }
  }

  function vapor(L, x, y, w, h, o = {}) {
    const c = L.ctx, t = o.t || 0, amt = o.amt == null ? 1 : o.amt; if (amt < .01) return;
    c.lineCap = 'round'; c.lineJoin = 'round'; c.setLineDash([]);
    for (let i = 0; i < 5; i++) {
      const ph = (t * .45 + i * .2) % 1, x0 = x + w * (i + .5) / 5;
      c.globalAlpha = (o.a == null ? 1 : o.a) * amt * Math.sin(ph * Math.PI) * .7;
      c.beginPath();
      for (let k = 0; k <= 12; k++) { const q = k / 12, yy = y - h * (ph * .6 + q * .4), xx = x0 + Math.sin(q * 5 + t * 2 + i) * 10 * (1 + q); if (k) c.lineTo(xx, yy); else c.moveTo(xx, yy); }
      c.strokeStyle = o.col || 'rgba(120,135,160,.9)'; c.lineWidth = 5; c.stroke();
    }
    al(L, o);
  }

  function strip(L, x, y, w, h, o = {}) {
    const c = L.ctx, yb = y + h; al(L, o);
    c.fillStyle = '#fdfbf6'; c.fillRect(x, y, w, h);
    const fr = o.front || 0;
    if (fr > 0) { c.fillStyle = 'rgba(150,185,215,.28)'; c.fillRect(x, yb - fr, w, fr); ln(c, x, yb - fr, x + w, yb - fr, 'rgba(27,90,148,.55)', 2); }
    if (o.start != null) { c.setLineDash([6, 5]); ln(c, x + 4, yb - o.start, x + w - 4, yb - o.start, '#6b6f7a', 2); c.setLineDash([]); }
    for (const s of o.spots || []) {
      const cy = yb - s.d, ry = Math.max(4, s.len / 2), rx = w * .36;
      const g = c.createRadialGradient(x + w / 2, cy, 1, x + w / 2, cy, Math.max(rx, ry));
      g.addColorStop(0, 'rgba(' + s.rgb.join(',') + ',.95)'); g.addColorStop(.55, 'rgba(' + s.rgb.join(',') + ',.7)'); g.addColorStop(1, 'rgba(' + s.rgb.join(',') + ',0)');
      c.globalAlpha = (o.a == null ? 1 : o.a) * (s.a == null ? 1 : s.a);
      c.save(); c.translate(x + w / 2, cy); c.scale(rx / Math.max(rx, ry), ry / Math.max(rx, ry)); c.translate(-(x + w / 2), -cy);
      c.beginPath(); c.arc(x + w / 2, cy, Math.max(rx, ry), 0, TAU); c.fillStyle = g; c.fill(); c.restore();
    }
    al(L, o); c.strokeStyle = 'rgba(28,36,64,.55)'; c.lineWidth = 2; c.strokeRect(x, y, w, h);
  }

  function order(L, cfg) {
    const FT = Object.assign({ f: L.fonts.B, s: 24, w: 600 }, cfg.font || {});
    const n = cfg.slots, H = FT.s + 30, PX = 18, ease = cfg.ease || .4, NUMW = 46;
    const cards = cfg.cards.map((q, i) => ({ id: q.id, label: q.label, i, slot: -1, from: null, tgt: null, t0: -99 }));
    const g = { cards, t1: -99, H, _hov: null };
    const cw = (q) => L.measure(q.label.s, FT).w + PX * 2;
    g.slot = (i) => ({ x: cfg.row.x + i * (cfg.row.w + cfg.row.gap), y: cfg.row.y, w: cfg.row.w, h: H + 16 });
    let tray = null;
    function traySlots() {
      if (tray) return tray;
      const gap = 16, ws = cards.map(cw), tot = ws.reduce((a, b) => a + b, 0) + gap * (cards.length - 1);
      let x = cfg.tray.x + (cfg.tray.w - tot) / 2; tray = {};
      cards.forEach((q, i) => { tray[q.id] = { x, y: cfg.tray.y }; x += ws[i] + gap; });

L = Lesson.create({

    { settle: 10, enter() { reset2(); },

    L.checks = () => {
      const out = [], W = water1();

      out.push({ name: 'pehely: 1 m = 40 perc', ok: Math.abs(60 / vH3('pehely süllyedése') - 40) < 1e-9, got: 60 / vH3('pehely süllyedése'), want: 40 });
      out.push({ name: 'homok: 1 m < 1 perc', ok: 60 / vH3('homokszem süllyedése') < 1, got: +(60 / vH3('homokszem süllyedése')).toFixed(3), want: '< 1' });
      out.push({ name: 'nitrát: szűrő és klór után változatlan', ok: drop5(1, 1).no3 === drop5(0, 1).no3 && drop5(2, 1).no3 === drop5(0, 1).no3, got: drop5(2, 1).no3, want: drop5(0, 1).no3 });
      out.push({ name: 'nitrát: forralás után kétszeres (50 % párolog)', ok: Math.abs(drop5(3, 1).no3 - 2 * drop5(0, 1).no3) < 1e-9, got: drop5(3, 1).no3, want: 2 * drop5(0, 1).no3 });
      out.push({ name: 'nitrát: budapesti csapvíz < határérték, trágyás > határérték', ok: drop5(4, 0).no3 < L.num('nitrát határértéke') && drop5(0, 1).no3 > L.num('nitrát határértéke'), got: [drop5(4, 0).no3, drop5(0, 1).no3].join(' / '), want: '< 50 / > 50' });

      out.push({ name: 'szennyvíz: utóülepítő nélkül pelyhes marad', ok: dirt6(['R', 'H', 'E', 'U', 'B'])[4] > dirt6(SOL6)[4], got: dirt6(['R', 'H', 'E', 'U', 'B'])[4].toFixed(2), want: '> ' + dirt6(SOL6)[4].toFixed(2) });
      const C6 = L.num('befolyó szerves anyag') * Math.exp(-k7(1) * L.num('tartózkodási idő'));
      out.push({ name: 'eleveniszap: teljes levegőztetésnél a tartózkodási idő végén = határérték', ok: Math.abs(C6 - L.num('kifolyó határérték')) < 1e-6, got: +C6.toFixed(4), want: L.num('kifolyó határérték') });
      if (L.step === 6) { const R = conc7(Math.min(L.st, S7.t0 + 12.5)), Rp = S7.PL.inv(...S7.PL.P(R.pts[R.pts.length - 1][0], R.pts[R.pts.length - 1][1])); out.push({ name: 'eleveniszap: a grafikon pontja = számolt koncentráció', ok: Math.abs(Rp[1] - R.C) < 1e-6, got: +Rp[1].toFixed(3), want: +R.C.toFixed(3) }); }
      out.push({ name: 'parti szűrés: a kút előtt < 1 % baktérium marad', ok: keep4(S4.cum[S4.cum.length - 1]) < .01, got: +(100 * keep4(S4.cum[S4.cum.length - 1])).toFixed(4), want: '< 1 %' });
      return out;
    };
  },
  draw(Lx) {
    L = Lx; c = L.ctx; GA = 1; background();
    if (L.step >= 0) sT[L.step] = L.st;
    autoSync(S1, 0, 1); autoSync(S2, 1, 2); autoSync(S4, 3, 1); autoSync(S5, 4, 1);
    for (let i = 0; i < NS; i++) {
      const w = clamp(1 - Math.abs(L.sp - i) * 2); if (w <= .005) continue;
      GA = 1; c.lineJoin = 'miter'; c.lineCap = 'butt'; c.setLineDash([]); c.globalCompositeOperation = 'source-over'; SCENES[i](sT[i], w, i === L.step);
    }
    c.globalAlpha = 1; c.lineJoin = 'miter'; c.lineCap = 'butt'; c.setLineDash([]);
  },
});
