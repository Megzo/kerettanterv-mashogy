/* ════════════════════════════════════════════════════════════════════════════

     KemMol                     ← kemia-7-8/06-molekulak (elemszínek)
     KemGHS                     ← kemia-7-8/10-sav-bazis (bélyegek)
     TortCards                  ← tortenelem-5-6/07-kozepkori-varos (9. lépés)
   Új modul (referencia): KemSep – elválasztási műveletek, a KemLab kiegészítése (lent, a
   TortCards után). A 12-viztisztitas és a 14-koolaj bájtra azonosan átveheti.
   ════════════════════════════════════════════════════════════════════════════ */

/* ── MODUL: Részecskemotor (Reszecske) · forrás: kemia-7-8/01-reszecskemodell, 2026-11-23 ── */
/* API
   Tantárgyfüggetlen 2D részecskeszimuláció (gáz, folyadék, szilárd rács, diffúzió, keverék),
   DETERMINISZTIKUS VISSZAJÁTSZÁSSAL. Nem hivatkozik a lecke kódjára; csak egy 2D vászon kell.
   Változtatás nélkül átemelhető (tervezett helye: shared/reszecske.js).

   const S = Reszecske.create({
     seed: 42,                   // véletlenmag (kezdőhelyek, kezdősebességek) – azonos mag → azonos futás
     dt: 1 / 120,                // fix lépésköz (s)
     box: {x, y, w, h},          // téglalap tartály (logikai px)
     walls: {l, r, t, b},        // opcionális: a fal helyzete fn(t) (zárt képletű dugattyú) – a box-on belül
     species: {                  // részecskefajták
       N2: {r: 12, m: 28, c: '#2f5fb3', draw: 'ketatom'},     // r: ütközési sugár px · m: relatív tömeg · c: szín
       H2O: {r: 12, m: 18, draw: 'viz'} },                   // draw: 'golyo' | 'ketatom' (c2: 2. atom színe) |
                                                              //   'viz' | 'etanol' | fn(ctx, x, y, r, ang, faj)
     T: 293,                     // hőmérséklet (K) – a termosztát célja
     vRef: 150,                  // négyzetes középsebesség px/s-ban m = 28, T = 293 K esetén (szemléltetés: lassított)
     thermo: 0.5,                // termosztát időállandója (s); 0 → nincs termosztát (az energia megmarad)
     collide: true,              // részecske–részecske rugalmas ütközés (false: átrepülnek egymáson)
     gravity: 0,                 // lefelé gyorsulás, px/s²
     attract: null,              // {eps, range}: vonzás, ha a felületek távolsága < range (eps: csúcs, px/s²) → folyadék
     anchorK: 0,                 // rugó a rácshelyhez (1/s²) a horgonyzott részecskékre → szilárd rács
     max: 600,                   // a részecskék felső száma
   });
   S.add('N2', 40, {region: {x, y, w, h}, lattice: 'random' | 'hex', gap: 2, anchor: false, tag: 0})
                               // csak az első S.at előtt; később esemény ({add}) kell
   S.at(t, events)             // az állapotot PONTOSAN a t. másodpercre hozza. events: időrendben,
                               //   [{t, set: {T, collide, gravity, attract, anchorK, thermo}},
                               //    {t, add: ['N2', 10, {region…}]}, {t, remove: 'N2' | fn(S, i) → bool},
                               //    {t, id: 'egyedi', fn: (S) => {…}}]
                               //   Azonos seed + azonos eseménysor → mindig ugyanaz az állapot. Előre csak
                               //   továbbfut; visszafelé (vagy ha egy múltbeli esemény változott) a legközelebbi
                               //   ellenőrzőpontból (0,5 s-onként mentve) számol újra.
   S.reset()                   // vissza a kezdőállapotba, ellenőrzőpontok törlése – enter(L)-ben hívd,
                               //   és mindig, ha a walls-függvény mögötti napló kiürül
   S.t                         // a szimuláció ideje (s)
   S.n, S.x[i], S.y[i], S.vx[i], S.vy[i], S.sp[i] (fajta indexe), S.names[], S.tag[i]   – csak olvasásra
   S.speeds(sp?)  → [px/s, …] · S.count(fn(S, i) → bool) · S.Tkin() → K (a mozgási energiából)
   S.hits(side)   → falba csapódás / s (mozgó átlag, τ = 1 s; side: 'l' | 'r' | 't' | 'b') – a nyomással arányos
   S.draw(ctx, {hl: (i) → bool, hlColor, alpha: (i) → 0..1, trail: s})   // 3D-hatású golyók, sötét körvonallal
   Reszecske.ball(ctx, x, y, r, szín, keret?)          // egy golyó ugyanabban a stílusban
   Reszecske.mol(ctx, draw, x, y, r, ang, faj)        // egy molekula (jelmagyarázathoz)
   Reszecske.zart(n, seed) → Z                        // zárt képletű „díszítő” halmaz (nincs szimuláció):
     Z.frame(t, phase, B, it)  → [{x, y, ang}]        //   phase: 0 rácsban rezeg · 1 folyadék · 2 gáz (közte átmenet)
                                                      //   B: {x, y, w, h, d (részecskeátmérő)}; it: átfedés-feloldás
   Teljesítmény: rácsos szomszédkeresés; ~400 részecske 120 Hz-en is bőven 60 fps.
   ──────────────────────────────────────────────────────────────────────────────── */
const Reszecske = (() => {
  const TAU = Math.PI * 2;
  const rgb = (h) => { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
  const mixc = (a, b, t) => { const A = rgb(a), B = rgb(b); return 'rgb(' + A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',') + ')'; };
  const SPR = new Map();
  function sprite(col, bd) {
    const key = col + '|' + (bd || ''); let s = SPR.get(key); if (s) return s;
    s = document.createElement('canvas'); s.width = s.height = 80; const g = s.getContext('2d');
    const gr = g.createRadialGradient(29, 27, 2, 40, 40, 37);
    gr.addColorStop(0, mixc(col, '#ffffff', .62)); gr.addColorStop(.42, col); gr.addColorStop(1, mixc(col, '#000000', .36));
    g.beginPath(); g.arc(40, 40, 36, 0, TAU); g.fillStyle = gr; g.fill();
    const hl = g.createRadialGradient(28, 25, 0, 28, 25, 15); hl.addColorStop(0, 'rgba(255,255,255,.85)'); hl.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = hl; g.fill();
    g.lineWidth = 5; g.strokeStyle = bd || mixc(col, '#1c2440', .62); g.beginPath(); g.arc(40, 40, 35, 0, TAU); g.stroke();
    SPR.set(key, s); return s;
  }
  function ball(ctx, x, y, r, col, bd) { const k = r / 36; ctx.drawImage(sprite(col, bd), x - 40 * k, y - 40 * k, 80 * k, 80 * k); }
  const ELH = ['#f2ede2', '#565d72'], ELO = '#d6452c', ELC = '#3b4050';
  function mol(ctx, kind, x, y, r, ang, s) {
    if (typeof kind === 'function') return kind(ctx, x, y, r, ang, s);
    const ca = Math.cos(ang), sa = Math.sin(ang);
    if (kind === 'ketatom') {
      const d = r * .4, q = r * .62;
      ball(ctx, x - ca * d, y - sa * d, q, s.c, s.bd); ball(ctx, x + ca * d, y + sa * d, q, s.c2 || s.c, s.bd);
    } else if (kind === 'viz') {
      const ox = x - ca * r * .14, oy = y - sa * r * .14;
      for (const da of [-.912, .912]) ball(ctx, ox + Math.cos(ang + da) * r * .6, oy + Math.sin(ang + da) * r * .6, r * .4, ELH[0], ELH[1]);
      ball(ctx, ox, oy, r * .66, ELO);
    } else if (kind === 'etanol') {
      const px = -sa, py = ca, pts = [[-.56, .14, ELC, .46], [0, -.14, ELC, .46], [.56, .14, ELO, .42]];
      for (const [u, v, col, q] of pts) ball(ctx, x + ca * u * r + px * v * r, y + sa * u * r + py * v * r, q * r, col);
    } else ball(ctx, x, y, r, s.c, s.bd);
  }

  function create(cfg) {
    const h = cfg.dt || 1 / 120, MAX = cfg.max || 600, KC = Math.max(1, Math.round(.5 / h));
    const names = Object.keys(cfg.species);
    const SP = names.map((k) => Object.assign({ r: 8, m: 28, c: '#8a93a6', draw: 'golyo' }, cfg.species[k], { name: k }));
    const idx = {}; names.forEach((k, i) => { idx[k] = i; });
    const vRef = cfg.vRef || 150, kk = vRef * vRef * 28 / (2 * 293);
    const box = cfg.box, WF = cfg.walls || {};
    const FL = ['x', 'y', 'vx', 'vy', 'ax', 'ay', 'a0', 'w'];
    const S = { n: 0, names, species: SP, h, box };
    FL.forEach((f) => { S[f] = new Float64Array(MAX); });
    S.sp = new Int16Array(MAX); S.tag = new Int32Array(MAX);
    const rmax = SP.reduce((m, s) => Math.max(m, s.r), 0);
    let P = { T: cfg.T == null ? 293 : cfg.T, thermo: cfg.thermo == null ? .5 : cfg.thermo, collide: cfg.collide !== false,
      gravity: cfg.gravity || 0, attract: cfg.attract || null, anchorK: cfg.anchorK || 0, rng: (cfg.seed >>> 0) || 1,
      hits: [0, 0, 0, 0], wl: box.x, wr: box.x + box.w, wt: box.y, wb: box.y + box.h };
    let k = 0, ep = 0, sigs = [], evT = [], cps = [], base = null;
    const rnd = () => { let s = P.rng; s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; P.rng = s; return s / 4294967296; };
    const gauss = () => { const u = Math.max(1e-12, rnd()), v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v); };
    const wallAt = (side, t, def) => (typeof WF[side] === 'function' ? WF[side](t) : def);

    function addN(name, n, o = {}) {
      const si = idx[name]; if (si == null) throw new Error('Reszecske: ismeretlen fajta ' + name);
      const s = SP[si], R = o.region || { x: P.wl, y: P.wt, w: P.wr - P.wl, h: P.wb - P.wt }, gap = o.gap == null ? 2 : o.gap;
      const pts = [];
      if (o.lattice === 'hex') {
        const d = 2 * s.r + gap, dy = d * Math.sqrt(3) / 2, cols = Math.max(1, Math.floor((R.w - 2 * s.r) / d + 1e-9) + 1);
        const x0 = R.x + (R.w - (cols - 1) * d - d / 2) / 2;
        for (let j = 0; pts.length < n; j++) {
          const y = R.y + R.h - s.r - j * dy; if (y < R.y + s.r - 1e-6) break;
          for (let i = 0; i < cols && pts.length < n; i++) { const x = x0 + (j % 2) * d / 2 + i * d; if (x >= R.x + s.r - 1e-6 && x <= R.x + R.w - s.r + 1e-6) pts.push([x, y]); }
        }
      } else {
        for (let tries = 0; pts.length < n && tries < n * 400; tries++) {
          const x = R.x + s.r + rnd() * (R.w - 2 * s.r), y = R.y + s.r + rnd() * (R.h - 2 * s.r);
          let ok = true;
          for (let j = 0; j < S.n && ok; j++) { const q = SP[S.sp[j]].r + s.r + gap; if ((S.x[j] - x) ** 2 + (S.y[j] - y) ** 2 < q * q) ok = false; }
          for (const [px, py] of pts) { if (!ok) break; const q = 2 * s.r + gap; if ((px - x) ** 2 + (py - y) ** 2 < q * q) ok = false; }
          if (ok) pts.push([x, y]);
        }
      }
      const sig = Math.sqrt(kk * P.T / s.m) * (o.vScale == null ? 1 : o.vScale);
      for (const [x, y] of pts) {
        if (S.n >= MAX) break;
        const i = S.n++;
        S.x[i] = x; S.y[i] = y; S.vx[i] = gauss() * sig; S.vy[i] = gauss() * sig;
        S.ax[i] = o.anchor ? x : NaN; S.ay[i] = o.anchor ? y : NaN;
        S.a0[i] = rnd() * TAU; S.w[i] = (rnd() < .5 ? -1 : 1) * (.6 + 1.6 * rnd()) * (o.spin == null ? 1 : o.spin);
        S.sp[i] = si; S.tag[i] = o.tag || 0;
      }
    }
    function removeIf(f) {
      let j = 0;
      for (let i = 0; i < S.n; i++) {
        if (f(S, i)) continue;
        if (j !== i) { FL.forEach((a) => { S[a][j] = S[a][i]; }); S.sp[j] = S.sp[i]; S.tag[j] = S.tag[i]; }
        j++;
      }
      S.n = j;
    }
    function apply(e) {
      if (e.set) { for (const key in e.set) P[key] = key === 'attract' && e.set[key] ? Object.assign({}, e.set[key]) : e.set[key]; }
      if (e.remove) removeIf(typeof e.remove === 'function' ? e.remove : ((nm) => (Sx, i) => Sx.sp[i] === idx[nm])(e.remove));
      if (e.add) addN(e.add[0], e.add[1], e.add[2]);
      if (e.fn) e.fn(S);
    }
    const sig = (e) => e.id || JSON.stringify(e);
