/* ════════════════════════════════════════════════════════════════════════════

/* ── MODUL: Elemadatok (KEM_ELEMEK) · forrás: kemia-7-8/05-atom-hejak, 2026-11-23 ──
   window.KEM_ELEMEK[Z − 1] = { Z, s, nev, A, cs, p, fi, fem, csalad, hal, stab }
     Z      rendszám (1–118)              s    vegyjel ('Na')        nev  magyar név ('nátrium')
     A      relatív atomtömeg (IUPAC rövidített standard, 4 értékes jegyig kerekítve;
            stabil izotóp nélküli elemnél a leghosszabb életű ismert izotóp tömegszáma,
            Z ≥ 104-nél null)
     cs     csoport, IUPAC 1–18 (az f-mező elemeinél null)    p  periódus 1–7
     fi     f-mezőbeli sorszám 0–13 (Ce…Lu, Th…Lr), különben null
            (Döntés: a 3. csoportban a La és az Ac áll, ahogy a hazai iskolai táblázatokban.)
     fem    1 fém · 0,5 félfém · 0 nemfém · null: nem ismert (szupernehéz elemek)
     csalad 'alkalifem' | 'alkalifoldfem' | 'foldfem' | 'halogen' | 'nemesgaz' | 'atmeneti' |
            'lantanoida' | 'aktinoida' | null (H, B, C, N, O, Si, P, S, Ge, As, Se, Sn, Sb, Te, Pb, …)
     hal    halmazállapot 25 °C-on és légköri nyomáson: 'szilárd' | 'folyékony' | 'gáz' | null
     stab   Z ≤ 20: a stabil (a természetben tartósan előforduló, nem radioaktív) izotópok
            neutronszámai, pl. Cl: [18, 20]; Z > 20: null
   KEM_ELEMEK.bySym['Na'] → az elem objektuma.
   Ez közös, egyszer, tanárral átnézett adat (a review módban „kódban rögzített”); ami egy
   leckében állítás (pl. a lángfestés színe), az a lecke .md-jébe kerül.
   ─────────────────────────────────────────────────────────────────────────── */
const KEM_ELEMEK = window.KEM_ELEMEK || (function () {
  const RAW = 'H hidrogén 1.008|He hélium 4.003|Li lítium 6.94|Be berillium 9.012|B bór 10.81|C szén 12.01|N nitrogén 14.01|O oxigén 16.00|F fluor 19.00|Ne neon 20.18|' +
    'Na nátrium 22.99|Mg magnézium 24.31|Al alumínium 26.98|Si szilícium 28.09|P foszfor 30.97|S kén 32.06|Cl klór 35.45|Ar argon 39.95|K kálium 39.10|Ca kalcium 40.08|' +
    'Sc szkandium 44.96|Ti titán 47.87|V vanádium 50.94|Cr króm 52.00|Mn mangán 54.94|Fe vas 55.85|Co kobalt 58.93|Ni nikkel 58.69|Cu réz 63.55|Zn cink 65.38|' +
    'Ga gallium 69.72|Ge germánium 72.63|As arzén 74.92|Se szelén 78.97|Br bróm 79.90|Kr kripton 83.80|Rb rubídium 85.47|Sr stroncium 87.62|Y ittrium 88.91|Zr cirkónium 91.22|' +
    'Nb nióbium 92.91|Mo molibdén 95.95|Tc technécium 98|Ru ruténium 101.1|Rh ródium 102.9|Pd palládium 106.4|Ag ezüst 107.9|Cd kadmium 112.4|In indium 114.8|Sn ón 118.7|' +
    'Sb antimon 121.8|Te tellúr 127.6|I jód 126.9|Xe xenon 131.3|Cs cézium 132.9|Ba bárium 137.3|La lantán 138.9|Ce cérium 140.1|Pr prazeodímium 140.9|Nd neodímium 144.2|' +
    'Pm prométium 145|Sm szamárium 150.4|Eu európium 152.0|Gd gadolínium 157.3|Tb terbium 158.9|Dy diszprózium 162.5|Ho holmium 164.9|Er erbium 167.3|Tm túlium 168.9|Yb itterbium 173.0|' +
    'Lu lutécium 175.0|Hf hafnium 178.5|Ta tantál 180.9|W volfrám 183.8|Re rénium 186.2|Os ozmium 190.2|Ir irídium 192.2|Pt platina 195.1|Au arany 197.0|Hg higany 200.6|' +
    'Tl tallium 204.4|Pb ólom 207.2|Bi bizmut 209.0|Po polónium 209|At asztácium 210|Rn radon 222|Fr francium 223|Ra rádium 226|Ac aktínium 227|Th tórium 232.0|' +
    'Pa protaktínium 231.0|U urán 238.0|Np neptúnium 237|Pu plutónium 244|Am amerícium 243|Cm kűrium 247|Bk berkélium 247|Cf kalifornium 251|Es einsteinium 252|Fm fermium 257|' +
    'Md mendelévium 258|No nobélium 259|Lr laurencium 262|Rf raterfordium -|Db dubnium -|Sg sziborgium -|Bh bohrium -|Hs hasszium -|Mt meitnérium -|Ds darmstadtium -|' +
    'Rg röntgenium -|Cn kopernícium -|Nh nihónium -|Fl fleróvium -|Mc moszkóvium -|Lv livermórium -|Ts tenesszium -|Og oganeszon -';
  const START = [1, 3, 11, 19, 37, 55, 87, 119];
  const NONMET = [1, 2, 6, 7, 8, 9, 10, 15, 16, 17, 18, 34, 35, 36, 53, 54, 86], SEMI = [5, 14, 32, 33, 51, 52, 85];
  const GAS = [1, 2, 7, 8, 9, 10, 17, 18, 36, 54, 86], LIQ = [35, 80];
  const STAB = { 1: [0, 1], 2: [1, 2], 3: [3, 4], 4: [5], 5: [5, 6], 6: [6, 7], 7: [7, 8], 8: [8, 9, 10], 9: [10], 10: [10, 11, 12],
    11: [12], 12: [12, 13, 14], 13: [14], 14: [14, 15, 16], 15: [16], 16: [16, 17, 18, 20], 17: [18, 20], 18: [18, 20, 22],
    19: [20, 22], 20: [20, 22, 23, 24, 26, 28] };
  const out = RAW.split('|').map((r, i) => {
    const [s, nev, a] = r.split(' '), Z = i + 1;
    let p = 1; while (Z >= START[p]) p++;
    const k = Z - START[p - 1];
    let cs = null, fi = null;
    if (p === 1) cs = Z === 1 ? 1 : 18;
    else if (p <= 3) cs = k < 2 ? k + 1 : k + 11;
    else if (p <= 5) cs = k + 1;
    else if (k < 3) cs = k + 1;
    else if (k <= 16) fi = k - 3;
    else cs = k - 13;
    let csalad = null;
    if (fi != null) csalad = p === 6 ? 'lantanoida' : 'aktinoida';
    else if (cs === 1 && Z > 1) csalad = 'alkalifem';
    else if (cs === 2) csalad = 'alkalifoldfem';
    else if (cs === 13 && Z > 5) csalad = 'foldfem';
    else if (cs === 17) csalad = 'halogen';
    else if (cs === 18) csalad = 'nemesgaz';
    else if (cs >= 3 && cs <= 12) csalad = 'atmeneti';
    return {
      Z, s, nev, A: a === '-' ? null : +a, cs, p, fi,
      fem: Z >= 104 ? null : NONMET.includes(Z) ? 0 : SEMI.includes(Z) ? 0.5 : 1,
      csalad, hal: Z > 100 ? null : GAS.includes(Z) ? 'gáz' : LIQ.includes(Z) ? 'folyékony' : 'szilárd',
      stab: STAB[Z] || null,
    };
  });
  out.bySym = {}; out.forEach((e) => { out.bySym[e.s] = e; });
  window.KEM_ELEMEK = out;
  return out;
})();
/* ── MODUL VÉGE ── */

/* ── MODUL: Képletírás a vásznon (KemTx) · forrás: kemia-7-8/05-atom-hejak, 2026-11-23 ──
   Képlet, ion és reakcióegyenlet a vásznon valódi alsó/felső indexszel. A szedést a közös
   MatText végzi (shared/matek/mtext.js, {chem: true}) – így a vászon ugyanazt az elemzőt
   használja, mint a build és a panel; a KemTx erre épít: egyenlet tagonként (dobozok a
   kiemeléshez), vektoros nyíl felirattal, képletelemzés és kiegyenlítés-ellenőrzés.
   Függőség: lesson.js, majd shared/matek/mtext.js (MatText) – mindkettő a lecke előtt töltve.
   Minden szöveg L.tx-en át megy (QA, review mód); a kulcsot o.k-ban add át.

   KemTx.tx(L, s, x, y, o) → {x, y, w, h}   képlet / ion / szöveg indexekkel: 'H₂O', 'SO₄²⁻', 'Na⁺'
       (ASCII is: 'H2O', 'Na^+'). o: s (px, alap 34), w (alap 600), f (alap JetBrains Mono), c, a,
       b ('alphabetic' | 'middle' | 'top'), k, qa, max. Az index a méret 0,65-szöröse →
       ≥ 34 px-es alap kell a 22 px-es QA-küszöbhöz. Az indexek egymás után állnak (SO₄²⁻).
   KemTx.measure(L, s, o) → szélesség px-ben
   KemTx.eq(L, s, x, y, o) → {x, w, terms: [{s, coef, side, i, box}], arrow: {x1, x2, y}}
       reakció- vagy szóegyenlet: a tagokat ' + ' választja el, a nyíl '→' (vagy '->').
       Együttható: a tag elején álló szám + szóköz ('2 H₂O'). o: mint a tx-nél, továbbá
       gap (tagköz, alap 0,3·s), aw (nyílhossz, alap 2,2·s), label (szöveg a nyíl fölött, pl. 'hő'),
       labelK (kulcsa), ac (a nyíl színe), term: (i, tag) → {c, alpha} tagonkénti szín/átlátszóság.
       Szóegyenlethez: o.f = Lesson.FONTS.B, o.w = 600 (a szavakban nincs index).
   KemTx.eqMeasure(L, s, o) → szélesség
   KemTx.arrow(L, x1, y, x2, o)   vektoros nyíl (o: s, c, lw, head, label, labelK, lf) – a terv
       vázlatában (ctx, …) állt; a felirat miatt L kell.
   KemTx.norm('SO4^2-') → 'SO₄²⁻'  ASCII → Unicode (szám betű vagy ')' után → alsó index,
       ^2+ / ^- → felső index, '->' → '→'). Csak képletre hívd (a szavakat nem védi).
   KemTx.parse('Ca(OH)₂') → {coef: 1, atoms: {Ca: 1, O: 2, H: 2}, charge: 0} | null (hibás)
       zárójel, együttható ('2 H₂O' → coef 2), töltés ('SO₄²⁻' → −2); a build formula-típusával
       azonos eredmény.
   KemTx.check('2 H₂ + O₂ → 2 H₂O') → {ok, lhs: {atoms, charge}, rhs: {…}, diff: ['O: 2 ≠ 1', …]}
   KemTx.ion('Na', 1) → 'Na⁺' · KemTx.ion('O', −2) → 'O²⁻'   (felső index: szám, majd előjel)
   ─────────────────────────────────────────────────────────────────────────── */
const KemTx = (function () {
  const SUBD = '₀₁₂₃₄₅₆₇₈₉', SUPD = '⁰¹²³⁴⁵⁶⁷⁸⁹';
  const MONO = Lesson.FONTS.M;
  const opt = (o) => Object.assign({ s: 34, w: 600, f: MONO }, o, { chem: true });
  function tx(L, s, x, y, o = {}) { return MatText.draw(L, String(s), x, y, opt(o)); }
  function measure(L, s, o = {}) { return MatText.measure(L, String(s), opt(o)).w; }
  function norm(s) {
    s = String(s).replace(/->/g, '→');
    s = s.replace(/\^(\d*)([+\-−])/g, (m, d, sg) => [...d].map((x) => SUPD[+x]).join('') + (sg === '+' ? '⁺' : '⁻'));
    return s.replace(/([A-Za-z)\]])(\d+)/g, (m, a, d) => a + [...d].map((x) => SUBD[+x]).join(''));
  }
  function ion(sym, q) {
    if (!q) return sym;
    const n = Math.abs(q);
    return sym + (n > 1 ? [...String(n)].map((x) => SUPD[+x]).join('') : '') + (q > 0 ? '⁺' : '⁻');
  }
  function splitEq(s) {
    return String(s).replace(/->/g, '→').split('→').map((p) => p.split(/\s\+\s/).map((z) => z.trim()).filter((z) => z.length));
  }
  function eqItems(L, s, o) {
    const sz = o.s || 34, gap = o.gap == null ? sz * 0.3 : o.gap, aw = o.aw || sz * 2.2, fo = opt(o);
    const items = []; let i = 0;
    splitEq(s).forEach((side, si) => {
      if (si > 0) items.push({ t: 'arrow', w: aw });
      side.forEach((term, j) => {
        if (j > 0) items.push({ t: 'plus', w: L.measure('+', fo).w });
        const m = term.match(/^(\d+)\s+(.+)$/), coef = m ? m[1] : null, f = m ? m[2] : term;
        const cw = coef ? L.measure(coef, fo).w + sz * 0.28 : 0;
        items.push({ t: 'term', s: term, coef, f, cw, w: cw + measure(L, f, o), side: si, i: i++ });
      });
    });
    let W = 0; items.forEach((it, n) => { W += it.w + (n ? gap : 0); });
    return { items, W, gap, sz };
  }
  function eqMeasure(L, s, o = {}) { return eqItems(L, s, o).W; }
  function arrow(L, x1, y, x2, o = {}) {
    const c = L.ctx, sz = o.s || 34, head = o.head || Math.max(10, sz * 0.32), col = o.c || L.ink;
    c.save(); c.strokeStyle = col; c.fillStyle = col; c.lineWidth = o.lw || Math.max(2.5, sz * 0.08); c.lineCap = 'round';
    const dir = x2 >= x1 ? 1 : -1;
    c.beginPath(); c.moveTo(x1, y); c.lineTo(x2 - dir * head * 0.7, y); c.stroke();
    c.beginPath(); c.moveTo(x2, y); c.lineTo(x2 - dir * head, y - head * 0.48); c.lineTo(x2 - dir * head, y + head * 0.48); c.closePath(); c.fill();
    c.restore();
    if (o.label) L.tx(o.label, (x1 + x2) / 2, y - sz * 0.32, { s: Math.max(22, sz * 0.6), w: 500, f: o.lf || Lesson.FONTS.B, a: 'center', c: col, k: o.labelK || o.k });
  }
  function eq(L, s, x, y, o = {}) {
    const E = eqItems(L, s, o), a = o.a || 'left', c = L.ctx, fo = opt(o);
    const by = o.b === 'middle' ? y + 0.25 * E.sz : o.b === 'top' ? y + 0.74 * E.sz : y;
    let cx = a === 'center' ? x - E.W / 2 : a === 'right' ? x - E.W : x;
    const res = { x: cx, w: E.W, terms: [], arrow: null };
    for (const it of E.items) {
      if (it.t === 'term') {
        const st = (o.term && o.term(it.i, it)) || {}, a0 = c.globalAlpha, col = st.c || o.c;
        if (st.alpha != null) c.globalAlpha = a0 * st.alpha;
        if (it.coef) L.tx(it.coef, cx, by, Object.assign({}, fo, { c: col, k: o.k, a: 'left', b: 'alphabetic' }));
        const b = tx(L, it.f, cx + it.cw, by, Object.assign({}, o, { c: col, a: 'left', b: 'alphabetic', max: null }));
        c.globalAlpha = a0;
        res.terms.push({ s: it.s, coef: it.coef, side: it.side, i: it.i, box: { x: cx, y: b.y, w: it.w, h: b.h } });
      } else if (it.t === 'plus') {

   A periódusos rendszer rácsa a KEM_ELEMEK alapján (1–4. periódus vagy a teljes, f-mezővel
   vagy anélkül), cellaszínezés függvénnyel, kijelölés, sor/oszlop kiemelés, találat-teszt.
   A cellák szövege (rendszám, vegyjel) kódban rögzített elemadat; a fejlécfeliratokat

       o.groupK(g), o.group2K(g) → kulcs · o.periodLabel(p), o.periodK(p) a sor elé
       o.headS  fejléc betűmérete (alap 22)

      const w = clamp(1 - Math.abs(L.sp - i) * 2); if (w <= .005) continue;
      GA = w; SCENES[i](sT[i], L.step === i);
    }
    c.globalAlpha = 1;
  },
});
})();
